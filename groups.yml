# PROTOTYPE: integration groups. One tile per technology in the Integrations UI; each schema
# maps to the package a user installs for it. Served by the package registry as /groups.
# Checked by `mage check` (dev/groups): referenced packages exist, a package is in at most one
# group, exactly one default when a group has 2+ schemas, icon names a member package.
groups:
  nginx:
    title: Nginx
    description: Collect logs and metrics from Nginx.
    icon: nginx # member package whose first icon the tile uses
    schemas:
      otel:
        package: nginx_otel
        default: true
      ecs:
        package: nginx
  apache:
    title: Apache HTTP Server
    description: Collect logs and metrics from Apache HTTP Server.
    icon: apache
    schemas:
      otel:
        package: apache_otel
        default: true
      ecs:
        package: apache
