---
name: Backport — detect packages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  detect-packages:
    runs-on: ubuntu-latest
    # Skip PRs created by the sync-changelog workflow — those backport changelog
    # entries back to main and do not need a backport checklist of their own.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'backport:sync-changelog') }}
    # No permissions — this job runs in the restricted pull_request context
    # and must be fork-safe. Write permissions and all code execution live in
    # post-backport-checklist.yml which is triggered via workflow_run and runs
    # in the base repository context using trusted code from main.
    permissions:
      contents: read

    steps:
      - name: Upload trigger artifact
        # No checkout or binary execution: we never run untrusted fork code here.
        # The privileged post-backport-checklist.yml workflow detects packages
        # itself using trusted code from main and SHAs retrieved from the API.
        run: echo '{}' > pr-trigger.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-packages-${{ github.run_id }}
          path: pr-trigger.json
          if-no-files-found: ignore
          retention-days: 1
