---
name: Backport — detect packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  post-checklist:
    runs-on: ubuntu-latest
    concurrency:
      # One run per merge commit — rapid pushes are unusual but serialise safely.
      group: backport-post-checklist|${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so git diff can resolve the PR base SHA, which is a
          # commit on main. The PR head SHA is fetched separately below.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cmd/backport/.go-version

      - name: Build backport tool
        run: mkdir -p "$GITHUB_WORKSPACE/build" && go build -C cmd/backport -o "$GITHUB_WORKSPACE/build/backport" .

      - name: Find merged PR and detect packages
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          PR_DATA=$(gh api "repos/$REPOSITORY/commits/$MERGE_SHA/pulls" \
            --jq 'map(select(.base.ref == "main")) | first // empty')
          if [[ -z "$PR_DATA" ]]; then
            echo "No PR found for commit $MERGE_SHA — skipping"
            exit 0
          fi

          LABELS=$(jq -r '[.labels[].name] | join(",")' <<< "$PR_DATA")
          if [[ "$LABELS" == *"backport:sync-changelog"* ]]; then
            echo "PR carries backport:sync-changelog label — skipping"
            exit 0
          fi

          PR_NUMBER=$(jq -r '.number'   <<< "$PR_DATA")
          BASE_SHA=$(jq -r  '.base.sha' <<< "$PR_DATA")
          HEAD_SHA=$(jq -r  '.head.sha' <<< "$PR_DATA")

          echo "PR #$PR_NUMBER — base: $BASE_SHA, head: $HEAD_SHA"

          # refs/pull/<N>/head is available in the base repository for all PRs
          # (including merged ones) so the PR head SHA is resolvable by git diff.
          git fetch origin "refs/pull/$PR_NUMBER/head"

          PACKAGES_JSON=$("$GITHUB_WORKSPACE/build/backport" detect-packages --json "$BASE_SHA" "$HEAD_SHA")
          echo "Detected packages: $PACKAGES_JSON"
          jq -n --argjson pkgs "$PACKAGES_JSON" '{"packages": $pkgs}' \
            > "$GITHUB_WORKSPACE/detected-packages.json"

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Find checklist comment
        id: find-comment
        if: steps.detect.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.detect.outputs.pr_number }}
        run: |
          MATCHING=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- backport-checklist -->"))' \
            | jq -s '.')

          COUNT=$(jq 'length' <<< "$MATCHING")
          if [[ "$COUNT" -gt 1 ]]; then
            IDS=$(jq -r '.[].id' <<< "$MATCHING" | paste -sd ', ')
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --field body=":warning: **Backport checklist error**: found ${COUNT} duplicate checklist comments (IDs: ${IDS}). Please delete the extras manually so the checklist can be updated automatically."
            echo "Duplicate checklist comments found — posted notice to PR #$PR_NUMBER" >&2
            exit 1
          fi

          echo "comment_id=$(jq -r 'first.id // empty' <<< "$MATCHING")" >> "$GITHUB_OUTPUT"

      - name: Render and post checklist comment
        if: steps.detect.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT: ${{ github.workspace }}/detected-packages.json
          PR_NUMBER: ${{ steps.detect.outputs.pr_number }}
          COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
        run: |
          EXISTING_BODY=""
          if [[ -n "$COMMENT_ID" ]]; then
            EXISTING_BODY=$(gh api "repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              --jq '.body // empty')
          fi

          # Render the new comment body. The existing body is piped into stdin so
          # the backport tool can parse previously-checked branches and preserve
          # their state. Prints nothing when no package has any active branch.
          NEW_BODY=$(printf '%s' "$EXISTING_BODY" | \
            "$GITHUB_WORKSPACE/build/backport" render-checklist "$ARTIFACT")

          if [[ -z "$NEW_BODY" ]]; then
            echo "No active backport branches — nothing to post"
            exit 0
          fi

          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "$NEW_BODY" > "$BODY_FILE"

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method DELETE "repos/$REPOSITORY/issues/comments/$COMMENT_ID"
          fi
          gh api --method POST \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --field body=@"$BODY_FILE"
          echo "Posted checklist comment on PR #$PR_NUMBER"
