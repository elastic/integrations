---
name: Backport — auto create PRs

on:
  push:
    branches:
      - main
  issue_comment:
    types: [edited]

permissions:
  contents: read

jobs:
  auto-backport:
    runs-on: ubuntu-latest
    # Skip bot-authored edits to break the infinite self-trigger loop:
    # patching the checklist comment (✅ / ⚠️ suffix) fires another
    # issue_comment edited event — filtering on actor stops it here.
    # For issue_comment events also require the event to be on a pull request.
    if: >-
      ${{
        github.actor != 'github-actions[bot]' &&
        (github.event_name == 'push' || github.event.issue.pull_request != null)
      }}
    concurrency:
      # Serialise runs per PR:
      # - push to main:          keyed on merge SHA (one run per merge)
      # - issue_comment edited:  keyed on PR number (serialises re-checklist runs)
      group: auto-backport-${{ github.event_name == 'push' && github.sha || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check actor permission
        id: actor-check
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$PERMISSION" == "write" || "$PERMISSION" == "admin" ]]; then
            echo "permitted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Actor $ACTOR lacks write/admin permission ($PERMISSION) — skipping"
          fi

      - uses: actions/checkout@v7
        if: >-
          ${{
            github.event_name == 'push' ||
            steps.actor-check.outputs.permitted == 'true'
          }}
        with:
          fetch-depth: 0

      - name: Set up Go
        if: >-
          ${{
            github.event_name == 'push' ||
            steps.actor-check.outputs.permitted == 'true'
          }}
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Install mage
        if: >-
          ${{
            github.event_name == 'push' ||
            steps.actor-check.outputs.permitted == 'true'
          }}
        run: go install github.com/magefile/mage

      - name: Resolve merge SHA and PR metadata
        id: resolve
        if: >-
          ${{
            github.event_name == 'push' ||
            steps.actor-check.outputs.permitted == 'true'
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            MERGE_SHA="$PUSH_SHA"
            PR_DATA=$(gh api "repos/$REPOSITORY/commits/$MERGE_SHA/pulls" \
              --jq 'map(select(.base.ref == "main")) | first // empty')
            if [[ -z "$PR_DATA" ]]; then
              echo "No PR found for commit $MERGE_SHA — skipping"
              exit 0
            fi
            PR_NUMBER=$(jq -r '.number'          <<< "$PR_DATA")
            LABELS=$(jq -r  '[.labels[].name] | join(",")' <<< "$PR_DATA")
            PR_AUTHOR=$(jq -r '.user.login'      <<< "$PR_DATA")
          else
            PR_NUMBER="$ISSUE_NUMBER"
            PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
              --json state,mergeCommit,labels,author)
            STATE=$(jq -r '.state' <<< "$PR_DATA")
            if [[ "$STATE" != "MERGED" ]]; then
              echo "PR #$PR_NUMBER is not merged (state: $STATE) — skipping"
              exit 0
            fi
            MERGE_SHA=$(jq -r '.mergeCommit.oid'            <<< "$PR_DATA")
            LABELS=$(jq -r   '[.labels[].name] | join(",")' <<< "$PR_DATA")
            PR_AUTHOR=$(jq -r '.author.login'               <<< "$PR_DATA")
          fi

          if [[ "$LABELS" == *"backport:sync-changelog"* ]]; then
            echo "PR carries backport:sync-changelog label — skipping"
            exit 0
          fi

          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_author=$PR_AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Find checklist comment
        id: find-comment
        if: steps.resolve.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          MATCHING=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- backport-checklist -->"))' \
            | jq -s '.')

          COUNT=$(jq 'length' <<< "$MATCHING")
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No checklist comment found on PR #$PR_NUMBER — skipping"
            exit 0
          fi

          BODY_FILE="$RUNNER_TEMP/checklist-body.txt"
          jq -r '.[0].body' <<< "$MATCHING" > "$BODY_FILE"

          echo "comment_id=$(jq -r '.[0].id' <<< "$MATCHING")" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE"                          >> "$GITHUB_OUTPUT"

      - name: Configure git
        if: steps.find-comment.outputs.comment_id != ''
        uses: elastic/oblt-actions/git/setup@v1
        with:
          username: 'github-actions[bot]'
          email: '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Process checked branches
        if: steps.find-comment.outputs.comment_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
          PR_AUTHOR: ${{ steps.resolve.outputs.pr_author }}
          COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
          BODY_FILE: ${{ steps.find-comment.outputs.body_file }}
        run: |
          ITEMS=$(mage -d "$GITHUB_WORKSPACE" parseBackportChecklist "$BODY_FILE")
          SHORT_SHA="${MERGE_SHA:0:8}"

          echo "$ITEMS" | jq -c '.[]' | while IFS= read -r item; do
            PKG=$(jq -r     '.Package'   <<< "$item")
            BRANCH=$(jq -r  '.Branch'    <<< "$item")
            CHECKED=$(jq -r '.Checked'   <<< "$item")
            PROCESSED=$(jq -r '.Processed' <<< "$item")

            if [[ "$CHECKED" != "true" || "$PROCESSED" != "false" ]]; then
              continue
            fi

            # Derive the major.minor version from the branch name (e.g. backport-aws-6.14 → 6.14)
            VERSION=$(echo "$BRANCH" | grep -oP '\d+\.\d+$' || true)

            # Dedup: skip if a working branch for this exact (package, version, sha) already has a PR
            WORKING_BRANCH="auto-backport/${PKG}-${VERSION}-${SHORT_SHA}"
            EXISTING=$(gh pr list --repo "$REPOSITORY" --head "$WORKING_BRANCH" --state all --json number --jq 'length')
            if [[ "${EXISTING:-0}" -gt 0 ]]; then
              echo "PR already exists for $WORKING_BRANCH — skipping"
              continue
            fi

            # Run the backport; --json ensures structured output even on conflict
            RESULT=$(dev/scripts/backport_apply.sh \
              --sha        "$MERGE_SHA" \
              --package    "$PKG" \
              --target     "$BRANCH" \
              --open-pr \
              --json \
              --repository "$REPOSITORY" || true)

            STATUS_VAL=$(jq -r '.status // empty' <<< "$RESULT" 2>/dev/null || true)
            if [[ "$STATUS_VAL" == "success" ]]; then
              PR_URL=$(jq -r '.pr_url' <<< "$RESULT")
              PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
              STATUS="✅ #${PR_NUM}"
            else
              SUGGESTED=$(jq -r '.suggested_command // empty' <<< "$RESULT" 2>/dev/null || true)
              STATUS="⚠️ conflict: @${PR_AUTHOR} please resolve manually${SUGGESTED:+: \`${SUGGESTED}\`}"
            fi

            # Update the in-memory checklist body and patch the GitHub comment
            NEW_BODY=$(mage -d "$GITHUB_WORKSPACE" updateChecklistBranchStatus "$BODY_FILE" "$BRANCH" "$STATUS")
            printf '%s' "$NEW_BODY" > "$BODY_FILE"

            gh api --method PATCH \
              "repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              --field body=@"$BODY_FILE"

            echo "Processed $BRANCH → $STATUS"
          done
