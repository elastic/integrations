name: "ci-comment"
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: none

jobs:
  triage:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:

    - uses: elastic/oblt-actions/github/create-token@37d142a1daa0cac6eaa7bb622a6dfaf1124eea0e # v1.44.0
      id: fetch-token

    - id: is_elastic_member
      uses: elastic/oblt-actions/github/is-member-of@37d142a1daa0cac6eaa7bb622a6dfaf1124eea0e # v1.44.0
      with:
        github-org: "elastic"
        github-user: ${{ github.actor }}
        github-token: ${{ steps.fetch-token.outputs.token }}

    - id: user_type
      uses: elastic/oblt-actions/github/user-type@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-user: ${{ github.actor }}
        github-token: ${{ steps.fetch-token.outputs.token }}

    - name: debug
      env:
        IS_ELASTIC_MEMBER: ${{ steps.is_elastic_member.outputs.result }}
        USER_TYPE: ${{ steps.user_type.outputs.result }}
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        echo "::notice:: is_elastic_member=${IS_ELASTIC_MEMBER}"
        echo "::notice:: user_type=${USER_TYPE}"
        echo "::notice:: github.actor=${ACTOR}"
        echo "::notice:: github.event_name=${EVENT_NAME}"

    - name: Comment (or update)
      if: steps.is_elastic_member.outputs.result == 'false' && steps.user_type.outputs.result == 'user'
      uses: edumserrano/find-create-or-update-comment@82880b65c8a3a6e4c70aa05a204995b6c9696f53 # v3.0.0
      with:
        token: ${{ steps.fetch-token.outputs.token }}
        issue-number: ${{ github.event.pull_request.number }}
        body-includes: "<!-- buildkite-comments -->"
        comment-author: "elastic-vault-github-plugin-prod[bot]"
        edit-mode: replace
        body: |
          <!-- buildkite-comments -->
          ### Reviewers

          Buildkite doesn't run automatically for external contributions. To start one, a
          user who is a member of the `elastic` GitHub organization or who has `write` access
          to this repository needs to add a comment:
          - `/test` : will kick off a build in Buildkite.

          Commenting `/test` as an external contributor without write access will not start a
          build. In that case, please ask a maintainer to review the pull request and start
          the build.

          **NOTE**: https://github.com/elastic/integrations/blob/main/.buildkite/pull-requests.json contains all those details.
