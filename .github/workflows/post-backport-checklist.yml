---
name: Backport — post checklist

on:
  workflow_run:
    workflows: ["Backport — detect packages"]
    types: [completed]

permissions:
  contents: read

jobs:
  post-checklist:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    # Cancel any in-progress run for the same branch when rapid pushes trigger
    # overlapping workflow_run jobs — the newest run wins.
    concurrency:
      group: "${{ github.workflow }}|${{ github.event.workflow_run.head_repository.full_name }}|${{ github.event.workflow_run.head_branch }}"
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # Required by actions/download-artifact when fetching from another workflow run.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history is needed so that git diff can resolve the PR base SHA,
          # which is a commit on main. The PR head SHA is fetched separately below.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Use the backport tool's own Go version (pinned to main's version).
          go-version-file: cmd/backport/.go-version

      - name: Build backport tool
        # The checkout above is always from the base repository's default branch,
        # so the binary is built from trusted code — never from the PR's source.
        run: mkdir -p "$GITHUB_WORKSPACE/build" && go build -C cmd/backport -o "$GITHUB_WORKSPACE/build/backport" .

      - name: Download artifact
        # continue-on-error so a missing artifact (e.g. detect job was skipped due to
        # backport:sync-changelog label) does not fail the job — the next step checks
        # for the file and exits cleanly when it is absent.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pr-packages-${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Find PR, detect packages, and find checklist comment
        id: find-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT: artifacts/pr-trigger.json
          # HEAD_SHA, HEAD_REPO, and HEAD_BRANCH come from the trusted workflow_run
          # event context. The PR number and base SHA are then derived from the
          # GitHub API using these values, so nothing security-sensitive is read
          # from the artifact (which the pull_request workflow produced).
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # The artifact is a boolean signal: its presence means the detect job
          # ran (PR has no backport:sync-changelog label). When the detect job
          # is skipped the artifact is never uploaded, so we exit here.
          if [[ ! -f "$ARTIFACT" ]]; then
            echo "Artifact not found — exiting"
            exit 0
          fi

          # Find the open PR associated with this workflow run via the GitHub API.
          # We filter by head repo + branch and then match on the exact SHA so this
          # works for both same-repo and fork PRs.
          HEAD_OWNER="${HEAD_REPO%%/*}"
          PR_DATA=$(gh api \
            --method GET \
            "repos/$REPOSITORY/pulls" \
            -f state=open \
            -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
            --jq "[.[] | select(.head.sha == env.HEAD_SHA)] | first // empty")

          if [[ -z "$PR_DATA" ]]; then
            echo "No open PR found for head SHA $HEAD_SHA — exiting"
            exit 0
          fi

          PR_NUMBER=$(jq -r '.number' <<< "$PR_DATA")
          BASE_SHA=$(jq -r '.base.sha' <<< "$PR_DATA")

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Fetch the PR head commit. refs/pull/<N>/head is available in the base
          # repository for all open PRs, including those from forks.
          git fetch origin "refs/pull/$PR_NUMBER/head"

          # Detect packages using the trusted binary built above from main's code.
          PACKAGES_JSON=$("$GITHUB_WORKSPACE/build/backport" detect-packages --json "$BASE_SHA" "$HEAD_SHA")
          echo "Detected packages: $PACKAGES_JSON"
          jq -n --argjson pkgs "$PACKAGES_JSON" '{"packages": $pkgs}' \
            > "$GITHUB_WORKSPACE/detected-packages.json"

          # Collect all comments that contain the checklist marker across all pages.
          MATCHING=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- backport-checklist -->"))' \
            | jq -s '.')

          COUNT=$(jq 'length' <<< "$MATCHING")
          if [[ "$COUNT" -gt 1 ]]; then
            IDS=$(jq -r '.[].id' <<< "$MATCHING" | paste -sd ', ')
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --field body=":warning: **Backport checklist error**: found ${COUNT} duplicate checklist comments (IDs: ${IDS}). Please delete the extras manually so the checklist can be updated automatically."
            echo "Duplicate checklist comments found — posted notice to PR #$PR_NUMBER" >&2
            exit 1
          fi

          echo "comment_id=$(jq -r 'first.id // empty' <<< "$MATCHING")" >> "$GITHUB_OUTPUT"

      - name: Render and post checklist comment
        if: steps.find-comment.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT: ${{ github.workspace }}/detected-packages.json
          PR_NUMBER: ${{ steps.find-comment.outputs.pr_number }}
          COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
        run: |
          EXISTING_BODY=""
          if [[ -n "$COMMENT_ID" ]]; then
            EXISTING_BODY=$(gh api "repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              --jq '.body // empty')
          fi

          # Render the new comment body. The existing body is piped into stdin so
          # the backport tool can parse previously-checked branches and preserve
          # their state. Prints nothing when no package has any active branch.
          NEW_BODY=$(printf '%s' "$EXISTING_BODY" | \
            "$GITHUB_WORKSPACE/build/backport" render-checklist "$ARTIFACT")

          if [[ -z "$NEW_BODY" ]]; then
            echo "No active backport branches — nothing to post"
            exit 0
          fi

          # Write to a file to avoid quoting issues when passing to gh api.
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "$NEW_BODY" > "$BODY_FILE"

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method DELETE "repos/$REPOSITORY/issues/comments/$COMMENT_ID"
          fi
          gh api --method POST \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --field body=@"$BODY_FILE"
          echo "Recreated checklist comment on PR #$PR_NUMBER"
