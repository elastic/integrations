- name: okta.uuid
  type: keyword
  description: |
    The unique identifier of the Okta LogEvent.
- name: okta.event_type
  type: keyword
  description: |
    The type of the LogEvent.
- name: okta.version
  type: keyword
  description: |
    The version of the LogEvent.
- name: okta.severity
  type: alias
  path: log.level
  description: |
    Okta's own assessment of how important the event is. One of "DEBUG", "INFO",
    "WARN" or "ERROR". Okta emits it uppercase; it is lowercased when written to
    `log.level`.
    Deprecated. Use the ECS `log.level` field.
- name: okta.display_message
  type: keyword
  description: |
    The human-readable summary of the event shown in the Okta System Log UI.
    Also available as `message`.
- name: okta.actor
  type: group
  fields:
    - name: id
      type: alias
      path: user.id
      description: |
        Identifier of the actor that performed the action. For a human actor this is
        the Okta user ID. Events triggered by Okta itself carry the ID of a system
        principal instead, so read it together with `okta.actor.type` to tell the two
        apart.
        Deprecated. Use the ECS `user.id` field.
    - name: type
      type: keyword
      description: |
        Type of the actor.
    - name: alternate_id
      type: keyword
      description: |
        Alternate identifier of the actor.
    - name: display_name
      type: keyword
      description: |
        Display name of the actor.
      multi_fields:
        - name: text
          type: match_only_text
          default_field: false
- name: okta.client
  type: group
  fields:
    - name: ip
      type: ip
      description: |
        The IP address of the client.
    - name: user_agent
      type: group
      fields:
        - name: raw_user_agent
          type: keyword
          description: |
            The raw informaton of the user agent.
          multi_fields:
            - name: text
              type: match_only_text
              default_field: false
        - name: os
          type: keyword
          description: |
            The OS informaton.
        - name: browser
          type: keyword
          description: |
            The browser informaton of the client.
    - name: zone
      type: keyword
      description: |
        The Okta network zone the client request matched, as configured under
        Security > Networks. Requests that match no configured zone carry the literal
        string "null" rather than omitting the field, so filter on that value rather
        than on the field's absence. Also available as `network.name`, which omits the
        "null" sentinel.
    - name: device
      type: keyword
      description: |
        The information of the client device.
    - name: id
      type: keyword
      description: |
        The identifier of the client.
- name: okta.device
  type: group
  fields:
    - name: device_integrator
      type: flattened
    - name: disk_encryption_type
      type: keyword
      description: |
        The value of the device profile’s disk encryption type. One of "NONE", "FULL", "USER", "ALL_INTERNAL_VOLUMES" or "SYSTEM_VOLUME".
    - name: id
      type: alias
      path: device.id
      description: |
        Identifier assigned by Okta when the device was registered with the org.
        Only present on events that carry device context, so it is absent from most
        events.
        Deprecated. Use the ECS `device.id` field.
    - name: managed
      type: boolean
      description: |
        Whether the device is enrolled in the organization's device management. Only
        present on events that carry device context, so it is absent from most events.
    - name: name
      type: alias
      path: device.model.identifier
      description: |
        The device's self-reported name, which in practice is the hardware model
        identifier rather than a name a user chose.
        Deprecated. Use the ECS `device.model.identifier` field.
    - name: os_platform
      type: keyword
      description: |
        The operating system family of the end user's device, reported by Okta in
        uppercase. Only present on events that carry device context, so it is absent
        from most events.
    - name: os_version
      type: keyword
      description: |
        The operating system version of the end user's device. The format is whatever
        the platform reports and is not normalized by Okta, so it is not reliably
        comparable across platforms.
    - name: registered
      type: boolean
      description: |
        Whether the device is registered.
    - name: screen_lock_type
      type: keyword
      description: |
        The mechanism for locking the device's screen. One of "NONE", "PASSCODE" or "BIOMETRIC".
    - name: secure_hardware_present
      type: boolean
      description: |
        Whether there is secure hardware present on the device. This is a checks for chip presence:
        trusted platform module (TPM) or secure enclave. It does not mark whether there are tokens
        on the secure hardware.
- name: okta.outcome
  type: group
  fields:
    - name: reason
      type: alias
      path: event.reason
      description: |
        Human-readable explanation of why the event ended with the result recorded in
        `okta.outcome.result`. Free text that varies by event type and Okta wording,
        so it is useful for investigation but not a stable value to match rules on.
        Deprecated. Use the ECS `event.reason` field.
    - name: result
      type: keyword
      description: |
        The result of the outcome. Must be one of: SUCCESS, FAILURE, SKIPPED, ALLOW, DENY, CHALLENGE, UNKNOWN.
- name: okta.target
  description: The list of targets.
  type: group
  fields:
    - name: alternate_id
      type: keyword
      description: The alternate ID of the target.
    - name: changeDetails.from.*
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
    - name: changeDetails.to.*
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
    - name: detailEntry.*
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
    - name: display_name
      type: alias
      path: entity.target.display_name
      description: |
        Human-readable name of an object the event acted on. One event can act on
        several objects, so this holds the names of all of them. Targets that do not
        carry a name are skipped and repeated names are collapsed, so positions do
        not line up with `okta.target.id` or `okta.target.type`.
        Deprecated. Use the ECS `entity.target.display_name` field.
    - name: id
      type: alias
      path: entity.target.id
      description: |
        Okta identifier of an object the event acted on, such as a user, group,
        application or policy.
        Deprecated. Use the ECS `entity.target.id` field.
    - name: type
      type: keyword
      description: |
        The kind of object the event acted on, such as "User", "AppInstance",
        "PolicyEntity", "PolicyRule" or "UDDevice". Okta-specific rather than a
        normalized vocabulary, and also available as `entity.target.sub_type`.
- name: okta.transaction
  type: group
  fields:
    - name: id
      type: keyword
      description: |
        Identifier of the transaction.
    - name: type
      type: keyword
      description: |
        The type of transaction. Must be one of "WEB", "JOB".
    - name: detail
      type: group
      fields:
        - name: request_api_token_id
          type: keyword
          description: ID of the API token used in a request.
        - name: root_api_token_id
          type: keyword
          description: ID of the root API token.
- name: okta.debug_context
  type: group
  fields:
    - name: debug_data
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
      subobjects: false
    - name: debug_data.authnRequestId
      type: keyword
      description: |
        The authorization request ID.
    - name: debug_data.client_secret
      type: keyword
    - name: debug_data.device_fingerprint
      type: keyword
      description: |
        The fingerprint of the device.
    - name: debug_data.dt_hash
      type: keyword
      description: |
        The device token hash
    - name: debug_data.factor
      type: keyword
      description: |
        The factor used for authentication.
    - name: debug_data.granted_scopes
      type: keyword
    - name: debug_data.grant_type
      type: keyword
    - name: debug_data.request_id
      type: keyword
      description: |
        The identifier of the request.
    - name: debug_data.request_uri
      type: alias
      path: url.path
      description: |
        Path of the Okta API or admin console request that produced the event. Path
        only; the query string is carried separately in
        `okta.debug_context.debug_data.url`.
        Deprecated. Use the ECS `url.path` field.
    - name: debug_data.threat_suspected
      type: keyword
      description: |
        Threat suspected.
    - name: debug_data.requested_scopes
      type: keyword
    - name: debug_data.risk_behaviors
      type: keyword
      description: |
        The set of behaviors that contribute to a risk assessment.
    - name: debug_data.risk_level
      type: keyword
      description: |
        The risk level assigned to the sign in attempt.
    - name: debug_data.risk_reasons
      type: keyword
      description: |
        The reasons for the risk.
    - name: debug_data.url
      type: keyword
      description: |
        The URL.
      multi_fields:
        - name: text
          type: match_only_text
          default_field: false
    - name: debug_data.flattened
      type: flattened
      description: |
        The complete debug_data object.
    - name: debug_data.behaviors
      type: keyword
    - name: debug_data.behaviors.New_City
      type: keyword
    - name: debug_data.behaviors.New_Country
      type: keyword
    - name: debug_data.behaviors.New_Device
      type: keyword
    - name: debug_data.behaviors.New_Geo_Location
      type: keyword
    - name: debug_data.behaviors.New_IP
      type: keyword
    - name: debug_data.behaviors.New_State
      type: keyword
    - name: debug_data.behaviors.Velocity
      type: keyword
    - name: debug_data.behaviors.Velocity_Behavior
      type: keyword
    - name: debug_data.logOnlySecurityData
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.New_City
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.New_Country
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.New_Device
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.New_Geo_Location
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.New_IP
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.New_State
      type: keyword
    - name: debug_data.logOnlySecurityData.behaviors.Velocity
      type: keyword
    - name: debug_data.logOnlySecurityData.risk
      type: keyword
    - name: debug_data.logOnlySecurityData.risk.level
      type: keyword
    - name: debug_data.logOnlySecurityData.risk.reasons
      type: keyword
    - name: debug_data.originalPrincipal
      type: keyword
    - name: debug_data.originalPrincipal.alternateId
      type: keyword
    - name: debug_data.originalPrincipal.displayName
      type: keyword
    - name: debug_data.originalPrincipal.id
      type: keyword
    - name: debug_data.originalPrincipal.type
      type: keyword
    - name: debug_data.promptingPolicyTypes
      type: keyword
    - name: debug_data.risk
      type: keyword
    - name: debug_data.risk.level
      type: keyword
    - name: debug_data.risk.reasons
      type: keyword
    - name: debug_data.risk_object
      type: keyword
    - name: debug_data.tunnels
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
      subobjects: false
- name: okta.authentication_context
  type: group
  fields:
    - name: authentication_provider
      type: keyword
      description: |
        The information about the authentication provider. Must be one of OKTA_AUTHENTICATION_PROVIDER, ACTIVE_DIRECTORY, LDAP, FEDERATION, SOCIAL, FACTOR_PROVIDER.
    - name: authentication_step
      type: integer
      description: |
        The authentication step.
    - name: credential_provider
      type: keyword
      description: |
        The information about credential provider. Must be one of OKTA_CREDENTIAL_PROVIDER, RSA, SYMANTEC, GOOGLE, DUO, YUBIKEY.
    - name: credential_type
      type: keyword
      description: |
        The information about credential type. Must be one of OTP, SMS, PASSWORD, ASSERTION, IWA, EMAIL, OAUTH2, JWT, CERTIFICATE, PRE_SHARED_SYMMETRIC_KEY, OKTA_CLIENT_SESSION, DEVICE_UDID.
    - name: issuer
      type: group
      description: |
        The information about the issuer.
      fields:
        - name: id
          type: keyword
          description: |
            The identifier of the issuer.
        - name: type
          type: keyword
          description: |
            The type of the issuer.
    - name: external_session_id
      type: keyword
      description: |
        The session identifier of the external session if any.
    - name: interface
      type: keyword
      description: |
        The interface used. e.g., Outlook, Office365, wsTrust
    - name: root_session_id
      type: keyword
      description: The session identifier of the root if any.
- name: okta.security_context
  type: group
  fields:
    - name: as
      type: group
      fields:
        - name: number
          type: alias
          path: client.as.number
          description: |
            Number of the autonomous system that announces the client IP address.
            Resolved by Okta rather than by the Elastic GeoIP processor, so it can
            differ from an ASN derived from `source.ip`.
            Deprecated. Use the ECS `client.as.number` field.
        - name: organization
          type: group
          fields:
            - name: name
              type: alias
              path: client.as.organization.name
              description: |
                Name of the organization that owns the autonomous system announcing
                the client IP. Okta lowercases it and does not normalize it, so
                punctuation and length vary widely between providers and some values
                are a full sentence.
                Deprecated. Use the ECS `client.as.organization.name` field.
    - name: isp
      type: keyword
      description: |
        The Internet Service Provider.
    - name: domain
      type: keyword
      description: |
        The domain name.
    - name: is_proxy
      type: boolean
      description: |
        Whether it is a proxy or not.
- name: okta.request
  type: group
  fields:
    - name: ip_chain
      type: flattened
