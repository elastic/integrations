# newer versions go on top
- version: "0.2.0"
  changes:
    - description: Add tags to ingest pipeline processors and add `preserve_original_event` to pipeline-level `on_failure` handlers.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20573
- version: 0.1.1
  changes:
    - description: Add T-separated ISO 8601 date format support for InGracePeriodUntil, LastContact, and CreatedDate fields in the managed_device pipeline.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20656
- version: 0.1.0
  changes:
    - description: Initial release of package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18408
    - description: Add support for Managed Device Data Stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18314
    - description: Add support for Audit Data Stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/17687
