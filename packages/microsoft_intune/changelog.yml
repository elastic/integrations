# newer versions go on top
- version: "0.4.0"
  changes:
    - description: >-
        The separate Audit and Managed Device Event Hub inputs are replaced by one input that reads
        the Event Hub once and routes events to the audit and managed_device data streams by log
        category. The Event Hub settings move from the inputs to the integration settings, so
        existing integration policies cannot be upgraded automatically and keep running the previous
        version until you edit them. To upgrade a policy, enter the Azure Event Hub, Consumer Group,
        Connection String, Storage Account and Storage Account Key again, and reapply any optional
        settings you changed, such as Preserve original event. Consumer Group resets to $Default, so
        enter your own consumer group again if you used one. If you set a custom Storage Account
        Container, use the same value. With the same consumer group and container, the agent
        continues from its existing checkpoints. Otherwise it reads the Event Hub again from the
        start and can index duplicate events. Custom Tags must also be entered again, and they now
        apply to all log categories. If the Audit and Managed Device inputs read from different
        Event Hubs, send both log categories to one Event Hub, or add a second Microsoft Intune
        integration policy for the second Event Hub.
      type: breaking-change
      link: https://github.com/elastic/integrations/pull/22747
    - description: >-
        The Preserve duplicate custom fields setting is removed. Vendor fields that are copied to
        ECS fields, such as microsoft_intune.audit.identity and
        microsoft_intune.managed_device.properties.device_name, are now always removed from the
        event. Use the ECS fields instead.
      type: breaking-change
      link: https://github.com/elastic/integrations/pull/22747
- version: "0.3.0"
  changes:
    - description: Add WebSocket transport, processor version, and related settings to Event Hub data streams for proxy support.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21811
- version: "0.2.1"
  changes:
    - description: Accept ISO 8601 timestamps with optional and variable fractional seconds in CreatedDate, InGracePeriodUntil, and LastContact.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21072
- version: "0.2.0"
  changes:
    - description: Add tags to ingest pipeline processors.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20573
- version: 0.1.1
  changes:
    - description: Add T-separated ISO 8601 date format support for InGracePeriodUntil, LastContact, and CreatedDate fields in the managed_device pipeline.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20656
- version: 0.1.0
  changes:
    - description: Initial release of package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18408
    - description: Add support for Managed Device Data Stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18314
    - description: Add support for Audit Data Stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/17687
