data_stream:
  vars:
    eventhub: example
    consumer_group: $Default
    connection_string: Endpoint=sb://test.servicebus.windows.net/;SharedAccessKeyName=test;SharedAccessKey=test
    storage_account: default
    storage_account_key: xxxx
    authority_host: https://login.microsoftonline.us
    storage_account_connection_string: DefaultEndpointsProtocol=https;AccountName=myAccountName;AccountKey=myAccountKey;EndpointSuffix=core.usgovcloudapi.net
    storage_account_container: container
    resource_manager_endpoint: https://example.com
    processor_version: v1
    transport: amqp
    processor_start_position: latest
    tags:
      - forwarded
      - microsoft_intune-audit
      - test-policy
    preserve_original_event: true
    preserve_duplicate_custom_fields: true
    processors: |
      - add_fields:
          target: project
          fields:
            name: myproject
            id: '574734885120952459'
      - add_tags:
          tags: [web, production]
          target: "environment"
