title: Events
type: logs
dataset: microsoft_intune.events
streams:
  - input: azure-eventhub
    title: Microsoft Intune logs via Azure Event Hub
    description: |-
      Collect all Microsoft Intune logs from a single Azure Event Hub. Events are routed by their
      category to the matching data stream: `AuditLogs` to `microsoft_intune.audit`, and `Devices`
      and `DeviceComplianceOrg` to `microsoft_intune.managed_device`. Events with any other category stay in
      `microsoft_intune.events`.
    template_path: azure_eventhub.yml.hbs
    vars:
      - name: storage_account_container
        type: text
        title: Storage Account Container
        multi: false
        required: false
        show_user: false
        description: >-
          The storage account container where the integration stores the checkpoint data for the consumer group. It is an advanced option to use with extreme care. You must use a dedicated storage account container for each Azure log type. Do not reuse the same container name for more than one Azure log type. See [Container Names](https://learn.microsoft.com/en-us/rest/api/storageservices/naming-and-referencing-containers--blobs--and-metadata#container-names) for details on naming rules from Microsoft. The integration generates a default container name if not specified.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - microsoft_intune-events
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserve a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
# The events are rerouted to other data streams of this package (see
# routing_rules.yml), so the agent needs permission to write to them. The
# routing rules keep the namespace, so only the dataset is dynamic.
elasticsearch:
  dynamic_dataset: true
