format_version: 3.5.4
name: microsoft_intune
title: Microsoft Intune
version: 0.4.0
description: Collect logs from Microsoft Intune with Elastic Agent.
type: integration
categories:
  - security
  - azure
conditions:
  kibana:
    version: "^8.19.10 || ~9.1.10 || ~9.2.4 || ^9.3.0"
  elastic:
    subscription: basic
screenshots:
  - src: /img/microsoft-intune-managed-device-dashboard.png
    title: Managed Device Dashboard
    size: 600x600
    type: image/png
  - src: /img/microsoft-intune-audit-dashboard.png
    title: Audit Dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/microsoft-intune-logo.svg
    title: Microsoft Intune logo
    size: 32x32
    type: image/svg+xml
vars:
  - name: eventhub
    type: text
    title: Azure Event Hub
    multi: false
    required: true
    show_user: true
    description: >-
      The name of the eventhub users would like to read from. Elastic recommends using one Azure Event Hub for each integration. Visit [Create an Azure Event Hub](https://docs.elastic.co/integrations/azure#create-an-event-hub) to learn more. Use Azure Event Hub names up to 30 characters long to avoid compatibility issues.
  - name: consumer_group
    type: text
    title: Consumer Group
    multi: false
    required: true
    show_user: true
    default: $Default
    description: >-
      The Event Hub consumer group to read from. We recommend using a dedicated consumer group for the Azure Event Hub input. Reusing consumer groups among non-related consumers can cause unexpected behavior and possibly lost events.
  - name: connection_string
    type: password
    title: Connection String
    multi: false
    required: true
    show_user: true
    secret: true
    description: >-
      The connection string required to communicate with Azure Event Hubs. See [Get an Azure Event Hubs connection string](https://docs.microsoft.com/en-us/azure/event-hubs/event-hubs-get-connection-string) to learn more.
  - name: storage_account
    type: text
    title: Storage Account
    multi: false
    required: true
    show_user: true
    description: >-
      The name of the storage account where the consumer group's state/offsets will be stored and updated.
  - name: storage_account_key
    type: password
    title: Storage Account Key
    multi: false
    required: true
    show_user: true
    secret: true
    description: >-
      The storage account key will be used to authorise access to data in your storage account.
  - name: authority_host
    type: text
    title: Authority Host
    multi: false
    required: false
    show_user: false
    default: https://login.microsoftonline.com
    description: >-
      Microsoft Entra ID authority endpoint. Defaults to https://login.microsoftonline.com (Azure Public Cloud). Change for other Azure environments: Azure Government (https://login.microsoftonline.us), Azure China (https://login.chinacloudapi.cn), or Azure Germany (https://login.microsoftonline.de). Used by processor v2 to derive the storage endpoint suffix.
  - name: storage_account_connection_string
    type: password
    title: Storage Account Connection String
    secret: true
    multi: false
    required: false
    show_user: false
    description: >-
      An explicit connection string for the storage account used to store checkpoints. When set, it is used as-is; when unset, a connection string is built from **Storage Account** and **Storage Account Key**. This setting is useful for processor v2 when the built-in connection string construction is not suitable (e.g. sovereign clouds or custom storage endpoints).
  - name: resource_manager_endpoint
    type: text
    title: Resource Manager Endpoint
    multi: false
    required: false
    show_user: false
    description: >-
      (Processor v1 only) By default the azure public environment is used. To use a different azure environment, provide the specific resource manager endpoint. This setting is ignored by processor v2, which derives the environment from the Authority Host setting.
  # Processor v2 and transport settings
  #
  - name: processor_version
    type: select
    title: Processor version
    multi: false
    required: false
    show_user: false
    options:
      - text: v1 (legacy)
        value: v1
      - text: v2
        value: v2
    description: >
      The processor version that the input should use. When unset, the agent's built-in default applies (v1 before 9.3, v2 from 9.3). Overridden to v2 when the transport is AMQP-over-WebSockets.

      Switching from v1 to v2 changes the checkpoint storage path. Existing v1 checkpoints are migrated automatically on first v2 start, but going back to v1 afterwards resumes from stale v1 checkpoints and may cause duplicate events. Users on sovereign clouds (GovCloud, China) must also set **Authority Host** to the correct login endpoint, because v2 derives the storage endpoint suffix from it rather than from **Resource Manager Endpoint**.

  - name: transport
    type: select
    title: Event Hubs transport protocol
    multi: false
    required: false
    show_user: false
    default: amqp
    options:
      - text: AMQP
        value: amqp
      - text: AMQP-over-WebSockets
        value: websocket
    description: >
      The transport protocol used to connect to Event Hubs. AMQP uses port 5671. AMQP-over-WebSockets uses port 443, which enables proxy support via the HTTPS_PROXY environment variable.

      Selecting AMQP-over-WebSockets forces the processor version to v2 regardless of the Processor version setting, because the WebSocket transport is only supported by the v2 processor. Requires Elastic Agent 8.19.10, 9.1.10, 9.2.4, or later.

  - name: processor_start_position
    type: select
    title: Processor start position
    multi: false
    required: false
    show_user: false
    options:
      - text: earliest
        value: earliest
      - text: latest
        value: latest
    description: >-
      The initial position to start reading events from when no checkpoint exists. Defaults to "earliest" in the agent. Only applies to processor v2.
policy_templates:
  - name: microsoft_intune
    title: Microsoft Intune Logs
    description: Collect logs from Microsoft Intune.
    inputs:
      - type: azure-eventhub
        title: Collect Microsoft Intune logs via Azure Event Hub
        description: Collect all Microsoft Intune logs from one Azure Event Hub and route them to a data stream by log category.
owner:
  github: elastic/security-service-integrations
  type: elastic
