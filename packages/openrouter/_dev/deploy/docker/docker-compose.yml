version: '2.3'
services:
  openrouter-usage:
    image: docker.elastic.co/observability/stream:v0.18.0
    hostname: openrouter-usage
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-usage.yml
  openrouter-performance:
    image: docker.elastic.co/observability/stream:v0.18.0
    hostname: openrouter-performance
    ports:
      - 8091
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8091'
    command:
      - http-server
      - --addr=:8091
      - --config=/files/config-performance.yml
