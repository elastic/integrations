dashboards:
  - name: "[OpenRouter] Overview"
    id: "openrouter-usage-and-cost-overview-e4c812d7-a471-4c93-a58a-6e6e9504c97d"
    description: >-
      Cross-provider visibility into OpenRouter API usage, cost, and token consumption.
      Covers request volume, spend by model and API key, token breakdown, and cache
      efficiency. Data sourced from metrics-openrouter.usage-*.
    time_range:
      from: now-7d
      to: now
    panels:
      # Header
      - title: ""
        hide_title: true
        size: {w: 48, h: 3}
        markdown:
          content: |
            ## OpenRouter — Usage & Cost Overview
            Daily request volume, token consumption, and cost broken down by model and API key.
            Data is collected once per day per model/key combination. Use the time picker to adjust the window.

      # KPI row — MAX→SUM deduplicates re-polled documents for the current day
      - title: "Total Requests"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.request_count IS NOT NULL
            | STATS _v = MAX(openrouter.usage.request_count) BY @timestamp, openrouter.usage.model, openrouter.usage.api_key_id
            | STATS `Total Requests` = SUM(_v)
          primary:
            field: "Total Requests"

      - title: "Total Cost (USD)"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.total_usage IS NOT NULL
            | STATS _v = MAX(openrouter.usage.total_usage) BY @timestamp, openrouter.usage.model, openrouter.usage.api_key_id
            | STATS `Total Cost (USD)` = ROUND(SUM(_v), 4)
          primary:
            field: "Total Cost (USD)"

      - title: "Total Tokens"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.tokens_total IS NOT NULL
            | STATS _v = MAX(openrouter.usage.tokens_total) BY @timestamp, openrouter.usage.model, openrouter.usage.api_key_id
            | STATS `Total Tokens` = SUM(_v)
          primary:
            field: "Total Tokens"

      - title: "Cache Efficiency"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.tokens_total IS NOT NULL AND openrouter.usage.cached_tokens IS NOT NULL
            | STATS _tokens = MAX(openrouter.usage.tokens_total), _cached = MAX(openrouter.usage.cached_tokens)
              BY @timestamp, openrouter.usage.model, openrouter.usage.api_key_id
            | STATS total_tokens = SUM(_tokens), cached_tokens = SUM(_cached)
            | EVAL `Cache Hit %` = ROUND(100.0 * cached_tokens / total_tokens, 1)
            | KEEP `Cache Hit %`
          primary:
            field: "Cache Hit %"

      # Daily request volume over time
      - title: "Daily Request Volume by Model"
        size: {w: 48, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.request_count IS NOT NULL AND openrouter.usage.model IS NOT NULL
            | STATS _v = MAX(openrouter.usage.request_count)
              BY time_bucket = BUCKET(@timestamp, 1 day), model = openrouter.usage.model, openrouter.usage.api_key_id
            | STATS requests = SUM(_v) BY time_bucket, model
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "requests"
              label: "Requests"
          breakdown:
            field: "model"
          mode: stacked

      # Cost breakdown
      - title: "Daily Cost by Model"
        size: {w: 24, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.total_usage IS NOT NULL AND openrouter.usage.model IS NOT NULL
            | STATS _v = MAX(openrouter.usage.total_usage)
              BY time_bucket = BUCKET(@timestamp, 1 day), model = openrouter.usage.model, openrouter.usage.api_key_id
            | STATS cost_usd = ROUND(SUM(_v), 4) BY time_bucket, model
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "cost_usd"
              label: "Cost (USD)"
          breakdown:
            field: "model"
          mode: stacked

      - title: "Cost Share by API Key"
        size: {w: 24, h: 12}
        esql:
          type: pie
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.total_usage IS NOT NULL AND openrouter.usage.api_key_id IS NOT NULL
            | STATS _v = MAX(openrouter.usage.total_usage) BY @timestamp, openrouter.usage.model, openrouter.usage.api_key_id
            | STATS cost_usd = ROUND(SUM(_v), 4) BY api_key_id = openrouter.usage.api_key_id
            | SORT cost_usd DESC
            | LIMIT 20
          metrics:
            - field: "cost_usd"
              label: "Cost (USD)"
          breakdown:
            field: "api_key_id"

      # Token breakdown
      - title: "Token Consumption: Prompt vs Completion"
        size: {w: 24, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.tokens_prompt IS NOT NULL AND openrouter.usage.tokens_completion IS NOT NULL
            | STATS _p = MAX(openrouter.usage.tokens_prompt), _c = MAX(openrouter.usage.tokens_completion)
              BY time_bucket = BUCKET(@timestamp, 1 day), openrouter.usage.model, openrouter.usage.api_key_id
            | STATS prompt_tokens = SUM(_p), completion_tokens = SUM(_c) BY time_bucket
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "prompt_tokens"
              label: "Prompt Tokens"
            - field: "completion_tokens"
              label: "Completion Tokens"
          mode: stacked

      - title: "Cached Tokens Over Time"
        size: {w: 24, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.cached_tokens IS NOT NULL
            | STATS _c = MAX(openrouter.usage.cached_tokens), _t = MAX(openrouter.usage.tokens_total)
              BY time_bucket = BUCKET(@timestamp, 1 day), openrouter.usage.model, openrouter.usage.api_key_id
            | STATS cached_tokens = SUM(_c), total_tokens = SUM(_t) BY time_bucket
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "cached_tokens"
              label: "Cached Tokens"
            - field: "total_tokens"
              label: "Total Tokens"
          mode: unstacked

      # Top models table
      - title: "Top Models by Cost"
        size: {w: 48, h: 12}
        esql:
          type: datatable
          query: |
            FROM metrics-openrouter.usage-*
            | WHERE openrouter.usage.model IS NOT NULL
            | STATS _req = MAX(openrouter.usage.request_count),
                    _prompt = MAX(openrouter.usage.tokens_prompt),
                    _completion = MAX(openrouter.usage.tokens_completion),
                    _cost = MAX(openrouter.usage.total_usage)
              BY @timestamp, model = openrouter.usage.model, openrouter.usage.api_key_id
            | STATS requests = SUM(_req),
                    prompt_tokens = SUM(_prompt),
                    completion_tokens = SUM(_completion),
                    cost_usd = ROUND(SUM(_cost), 4)
              BY model
            | SORT cost_usd DESC
            | LIMIT 20
          metrics:
            - field: "requests"
              label: "Requests"
            - field: "prompt_tokens"
              label: "Prompt Tokens"
            - field: "completion_tokens"
              label: "Completion Tokens"
            - field: "cost_usd"
              label: "Cost (USD)"
          breakdown:
            field: "model"
