dashboards:
  - name: "[OpenRouter] Performance"
    id: "openrouter-performance-overview-ebf29bf5-3484-495c-a58e-745b69fc2664"
    description: >-
      Hourly latency percentiles, throughput, cache hit rate, and guardrail activity
      broken down by model and API key. Data sourced from metrics-openrouter.performance-*.
      Note: All metrics are rates/percentiles — use AVG or MAX, never SUM.
    time_range:
      from: now-7d
      to: now
    panels:
      # Header
      - title: ""
        hide_title: true
        size: {w: 48, h: 3}
        markdown:
          content: |
            ## OpenRouter — Performance Dashboard
            Hourly latency percentiles, throughput, and cache efficiency by model and API key.
            **Note:** All metrics are non-additive (percentiles/rates). Use `AVG` or `MAX` — never `SUM`.

      # KPI row
      - title: "Avg P50 Latency (ms)"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.p50_latency IS NOT NULL
            | STATS `Avg P50 Latency (ms)` = ROUND(AVG(openrouter.performance.p50_latency), 0)
          primary:
            field: "Avg P50 Latency (ms)"

      - title: "Max P99 Latency (ms)"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.p99_latency IS NOT NULL
            | STATS `Max P99 Latency (ms)` = ROUND(MAX(openrouter.performance.p99_latency), 0)
          primary:
            field: "Max P99 Latency (ms)"

      - title: "Avg P50 Throughput (tok/s)"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.p50_throughput IS NOT NULL
            | STATS `Avg P50 Throughput (tok/s)` = ROUND(AVG(openrouter.performance.p50_throughput), 1)
          primary:
            field: "Avg P50 Throughput (tok/s)"

      - title: "Avg Cache Hit Rate"
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.cache_hit_rate IS NOT NULL
            | STATS avg_rate = AVG(openrouter.performance.cache_hit_rate)
            | EVAL `Avg Cache Hit Rate` = ROUND(avg_rate * 100, 1)
            | KEEP `Avg Cache Hit Rate`
          primary:
            field: "Avg Cache Hit Rate"

      # P50 latency over time by model
      - title: "P50 Latency Over Time by Model"
        size: {w: 48, h: 12}
        esql:
          type: line
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.p50_latency IS NOT NULL AND openrouter.performance.model IS NOT NULL
            | STATS p50_ms = ROUND(AVG(openrouter.performance.p50_latency), 0)
              BY time_bucket = BUCKET(@timestamp, 1 hour), model = openrouter.performance.model
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "p50_ms"
              label: "P50 Latency (ms)"
          breakdown:
            field: "model"

      # P99 latency over time
      - title: "P99 Latency Over Time by Model"
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.p99_latency IS NOT NULL AND openrouter.performance.model IS NOT NULL
            | STATS p99_ms = ROUND(AVG(openrouter.performance.p99_latency), 0)
              BY time_bucket = BUCKET(@timestamp, 1 hour), model = openrouter.performance.model
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "p99_ms"
              label: "P99 Latency (ms)"
          breakdown:
            field: "model"

      # Throughput
      - title: "P50 Throughput Over Time by Model"
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.p50_throughput IS NOT NULL AND openrouter.performance.model IS NOT NULL
            | STATS throughput = ROUND(AVG(openrouter.performance.p50_throughput), 1)
              BY time_bucket = BUCKET(@timestamp, 1 hour), model = openrouter.performance.model
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "throughput"
              label: "P50 Throughput (tok/s)"
          breakdown:
            field: "model"

      # Cache hit rate over time
      - title: "Cache Hit Rate Over Time by Model"
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.cache_hit_rate IS NOT NULL AND openrouter.performance.model IS NOT NULL
            | STATS cache_rate = ROUND(AVG(openrouter.performance.cache_hit_rate) * 100, 1)
              BY time_bucket = BUCKET(@timestamp, 1 hour), model = openrouter.performance.model
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "cache_rate"
              label: "Cache Hit Rate (%)"
          breakdown:
            field: "model"

      # Guardrail rate
      - title: "Guardrail Invocation Rate Over Time"
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.guardrail_invoked_rate IS NOT NULL
            | STATS guardrail_rate = ROUND(AVG(openrouter.performance.guardrail_invoked_rate) * 100, 2)
              BY time_bucket = BUCKET(@timestamp, 1 hour)
            | SORT time_bucket ASC
          dimension:
            field: "time_bucket"
          metrics:
            - field: "guardrail_rate"
              label: "Guardrail Rate (%)"

      # Per-model latency table
      - title: "Latency & Throughput by Model"
        size: {w: 48, h: 12}
        esql:
          type: datatable
          query: |
            FROM metrics-openrouter.performance-*
            | WHERE openrouter.performance.model IS NOT NULL
            | STATS
                p50_ms = ROUND(AVG(openrouter.performance.p50_latency), 0),
                p90_ms = ROUND(AVG(openrouter.performance.p90_latency), 0),
                p99_ms = ROUND(AVG(openrouter.performance.p99_latency), 0),
                p50_ttfb_ms = ROUND(AVG(openrouter.performance.p50_ttfb), 0),
                p50_tput = ROUND(AVG(openrouter.performance.p50_throughput), 1),
                cache_hit_pct = ROUND(AVG(openrouter.performance.cache_hit_rate) * 100, 1)
              BY model = openrouter.performance.model
            | SORT p99_ms DESC
            | LIMIT 25
          metrics:
            - field: "p50_ms"
              label: "P50 Latency (ms)"
            - field: "p90_ms"
              label: "P90 Latency (ms)"
            - field: "p99_ms"
              label: "P99 Latency (ms)"
            - field: "p50_ttfb_ms"
              label: "P50 TTFB (ms)"
            - field: "p50_tput"
              label: "P50 Throughput (tok/s)"
            - field: "cache_hit_pct"
              label: "Cache Hit Rate (%)"
          breakdown:
            field: "model"
