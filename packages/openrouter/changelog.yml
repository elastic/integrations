- version: "0.1.0"
  changes:
    - description: >-
        Initial release. Collect daily usage metrics (request count, token
        consumption, cost) and hourly performance metrics (latency percentiles,
        throughput, cache hit rate) from the OpenRouter Analytics API.
        Two data streams: usage (granularity: day) and performance (granularity: hour),
        grouped by model and API key by default. Windowed cursor-based collection
        with MAX→SUM dashboard pattern handles re-polled duplicates without dedup.
        Includes alerting rule templates for cost anomalies, cache hit rate drops,
        and provider latency regressions.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21500
