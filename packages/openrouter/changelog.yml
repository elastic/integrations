- version: "0.1.0"
  changes:
    - description: >-
        Initial release. Collect daily usage metrics (requests, tokens, cost split by
        regular key, BYOK and BYOK fees, cache and tool costs) and hourly performance
        metrics (latency, time to first token, generation, inter-token and router
        latency, throughput, cache and guardrail rates, request count) from the
        OpenRouter Analytics API. Two data streams, usage (granularity: day) and
        performance (granularity: hour), grouped by model and API key by default.
        Windowed, cursor-based collection that halves the window when the API reports
        a truncated result. Includes the [Metrics OpenRouter] Usage & Cost Overview and
        Performance Overview dashboards and alerting rule templates for daily cost
        anomalies, cache hit rate drops and model latency regressions; the rules
        compare each model with its own recent baseline instead of fixed thresholds.
        Requires Kibana 9.6 or later.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21841
