title: "performance"
type: metrics
streams:
  - input: cel
    title: OpenRouter API performance metrics
    description: >-
      Collect hourly non-additive performance metrics (latency percentiles, throughput,
      cache hit rate, guardrail rate) from the OpenRouter Analytics API, grouped by
      model and API key.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: duration
        title: Collection interval
        description: How often the Analytics API is polled for new hourly data. Between 10m and 24h.
        min_duration: 10m
        max_duration: 24h
        required: true
        show_user: true
        default: 1h
      - name: initial_interval
        type: duration
        title: Initial lookback interval
        description: >-
          How far back to collect data on the first run (for example 168h = 7 days).
          At least 1h. Longer values mean more requests on
          the first run (one request per 24 hours).
        min_duration: 1h
        required: true
        show_user: true
        default: 168h
      - name: finalization_delay
        type: duration
        title: Finalization delay
        description: >-
          How far behind "now" the collection window end is kept, to allow
          partially-finalized hour buckets to settle before being ingested.
        min_duration: 0s
        required: true
        show_user: false
        default: 30m
      - name: http_client_timeout
        type: duration
        title: HTTP client timeout
        description: Duration to wait before declaring a request timed out (for example 60s). Between 1s and 10m.
        min_duration: 1s
        max_duration: 10m
        required: false
        show_user: false
        default: 60s
      - name: proxy_url
        type: text
        title: Proxy URL
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL configuration
        required: false
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        required: false
        show_user: false
        description: Processors applied to events before ingest pipeline parsing.
elasticsearch:
  index_template:
    mappings:
      subobjects: false
