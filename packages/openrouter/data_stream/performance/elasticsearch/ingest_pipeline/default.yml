---
description: Pipeline for parsing OpenRouter hourly performance metric events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: "9.3.0"
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      tag: remove_agentless_tags
      description: >-
        Removes fields added by Agentless as metadata, which can collide with ECS fields.
        Uses ignore_missing so each field is removed independently if present.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
      description: Renames the original `message` field to `event.original` to store a copy of the original message.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  # The time field name varies by dimension selection:
  #   date__hour       — when dimensions do not include provider (e.g. [model])
  #   created_at__hour — when dimensions include provider (e.g. [model, provider])
  # Try both patterns; whichever exists sets @timestamp.
  - date:
      field: json.date__hour
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss"
        - "yyyy-MM-dd'T'HH:mm:ssXXX"
      timezone: UTC
      tag: date_from_date__hour
      if: ctx.json?.date__hour != null
  - date:
      field: json.created_at__hour
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss"
        - "yyyy-MM-dd'T'HH:mm:ssXXX"
      timezone: UTC
      tag: date_from_created_at__hour
      if: ctx.json?.created_at__hour != null
  # Rename dimension fields.
  - rename:
      field: json.model
      target_field: openrouter.performance.model
      ignore_missing: true
      tag: rename_model
  - rename:
      field: json.provider
      target_field: openrouter.performance.provider
      ignore_missing: true
      tag: rename_provider
  - rename:
      field: json.variant
      target_field: openrouter.performance.variant
      ignore_missing: true
      tag: rename_variant
  - rename:
      field: json.api_key_id
      target_field: openrouter.performance.api_key_id
      ignore_missing: true
      tag: rename_api_key_id
  - rename:
      field: json.workspace
      target_field: openrouter.performance.workspace
      ignore_missing: true
      tag: rename_workspace
  # Performance metrics are returned as floating-point numbers.
  - convert:
      field: json.p50_latency
      target_field: openrouter.performance.p50_latency
      type: double
      ignore_missing: true
      tag: convert_p50_latency
  - convert:
      field: json.p90_latency
      target_field: openrouter.performance.p90_latency
      type: double
      ignore_missing: true
      tag: convert_p90_latency
  - convert:
      field: json.p99_latency
      target_field: openrouter.performance.p99_latency
      type: double
      ignore_missing: true
      tag: convert_p99_latency
  - convert:
      field: json.p50_total_time_to_first_token
      target_field: openrouter.performance.p50_ttfb
      type: double
      ignore_missing: true
      tag: convert_p50_ttfb
  - convert:
      field: json.p99_total_time_to_first_token
      target_field: openrouter.performance.p99_ttfb
      type: double
      ignore_missing: true
      tag: convert_p99_ttfb
  - convert:
      field: json.p50_throughput
      target_field: openrouter.performance.p50_throughput
      type: double
      ignore_missing: true
      tag: convert_p50_throughput
  - convert:
      field: json.p99_throughput
      target_field: openrouter.performance.p99_throughput
      type: double
      ignore_missing: true
      tag: convert_p99_throughput
  - convert:
      field: json.cache_hit_rate
      target_field: openrouter.performance.cache_hit_rate
      type: double
      ignore_missing: true
      tag: convert_cache_hit_rate
  - convert:
      field: json.guardrail_invoked_rate
      target_field: openrouter.performance.guardrail_invoked_rate
      type: double
      ignore_missing: true
      tag: convert_guardrail_invoked_rate
  - convert:
      field: json.response_cached_rate
      target_field: openrouter.performance.response_cached_rate
      type: double
      ignore_missing: true
      tag: convert_response_cached_rate
  - convert:
      field: json.p95_latency
      target_field: openrouter.performance.p95_latency
      type: double
      ignore_missing: true
      tag: convert_p95_latency
  - convert:
      field: json.p50_router_latency
      target_field: openrouter.performance.p50_router_latency
      type: double
      ignore_missing: true
      tag: convert_p50_router_latency
  - convert:
      field: json.p90_router_latency
      target_field: openrouter.performance.p90_router_latency
      type: double
      ignore_missing: true
      tag: convert_p90_router_latency
  - convert:
      field: json.p99_router_latency
      target_field: openrouter.performance.p99_router_latency
      type: double
      ignore_missing: true
      tag: convert_p99_router_latency
  - convert:
      field: json.p90_total_time_to_first_token
      target_field: openrouter.performance.p90_ttfb
      type: double
      ignore_missing: true
      tag: convert_p90_ttfb
  - convert:
      field: json.p95_total_time_to_first_token
      target_field: openrouter.performance.p95_ttfb
      type: double
      ignore_missing: true
      tag: convert_p95_ttfb
  - convert:
      field: json.p50_generation_time
      target_field: openrouter.performance.p50_generation_time
      type: double
      ignore_missing: true
      tag: convert_p50_generation_time
  - convert:
      field: json.p90_generation_time
      target_field: openrouter.performance.p90_generation_time
      type: double
      ignore_missing: true
      tag: convert_p90_generation_time
  - convert:
      field: json.p99_generation_time
      target_field: openrouter.performance.p99_generation_time
      type: double
      ignore_missing: true
      tag: convert_p99_generation_time
  - convert:
      field: json.p50_inter_token_latency
      target_field: openrouter.performance.p50_inter_token_latency
      type: double
      ignore_missing: true
      tag: convert_p50_inter_token_latency
  - convert:
      field: json.p90_inter_token_latency
      target_field: openrouter.performance.p90_inter_token_latency
      type: double
      ignore_missing: true
      tag: convert_p90_inter_token_latency
  - convert:
      field: json.p99_inter_token_latency
      target_field: openrouter.performance.p99_inter_token_latency
      type: double
      ignore_missing: true
      tag: convert_p99_inter_token_latency
  - convert:
      field: json.p90_throughput
      target_field: openrouter.performance.p90_throughput
      type: double
      ignore_missing: true
      tag: convert_p90_throughput
  - convert:
      field: json.p95_throughput
      target_field: openrouter.performance.p95_throughput
      type: double
      ignore_missing: true
      tag: convert_p95_throughput
  - set:
      field: event.kind
      tag: set_event_kind
      value: metric
  - set:
      field: event.module
      tag: set_event_module
      value: openrouter
  - set:
      field: event.dataset
      tag: set_event_dataset
      value: openrouter.performance
  - append:
      field: event.category
      tag: append_event_category_api
      value: api
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event_tag
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
        in pipeline '{{{ _ingest.pipeline }}}'.
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
