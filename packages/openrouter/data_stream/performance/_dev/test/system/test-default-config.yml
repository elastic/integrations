wait_for_data_timeout: 2m
input: cel
service: openrouter-performance
vars:
  url: http://{{Hostname}}:{{Port}}/api/v1
  management_api_key: xxxx
data_stream:
  vars:
    interval: 10m
    initial_interval: 24h
    finalization_delay: 2h
    preserve_original_event: true
assert:
  # The mock first answers with a truncated result whose row has an invalid date. The test fails if that row
  # is indexed (pipeline error). The retry uses a smaller window, so several windows may be collected before
  # the check and the exact number of documents depends on the clock.
  min_count: 2
