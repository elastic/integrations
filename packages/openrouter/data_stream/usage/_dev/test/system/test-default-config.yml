wait_for_data_timeout: 2m
input: cel
service: openrouter-usage
vars:
  url: http://{{Hostname}}:{{Port}}/api/v1
  management_api_key: xxxx
data_stream:
  vars:
    interval: 10s
    initial_interval: 168h
    finalization_delay: 2h
    dimensions:
      - model
      - provider
    preserve_original_event: true
assert:
  # The mock first answers with a truncated result, so the stream retries with a smaller window and may
  # collect several windows before the check; the exact number of documents depends on the clock.
  min_count: 2
