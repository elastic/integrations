---
description: Build ECS fields from a url field
processors:

  - rename:
      tag: rename__ingest__value_to__tmp_url_original_ec2dbcd3
      field: _ingest._value
      target_field: _tmp_url.original

  - uri_parts:
      tag: uri_parts__tmp_url_original_to__tmp_url_d9398e4c
      field: _tmp_url.original
      target_field: _tmp_url
      keep_original: true
      ignore_failure: true

  - remove:
      tag: remove__tmp_url_user_info_51c0d45a
      field: _tmp_url.user_info
      ignore_missing: true

  - registered_domain:
      tag: registered_domain__tmp_url_domain_to__tmp_url_36c78ada
      field: _tmp_url.domain
      target_field: _tmp_url
      ignore_missing: true

  - set:
      tag: set__tmp_url_full_9f0329b3
      field: _tmp_url.full
      copy_from: _tmp_url.original

  # append object
  - script:
      tag: script_33e60f88
      description: Append to the destination
      lang: painless
      source: |
        ctx.threat = ctx.threat ?: [:];
        ctx.threat.indicator = ctx.threat.indicator ?: [:];
        ctx.threat.indicator.url = ctx.threat.indicator.url ?: [];
        ctx.threat.indicator.url.add(ctx._tmp_url);

  - remove:
      tag: remove__tmp_url_591f5f34
      field: _tmp_url
