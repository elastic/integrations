---
description: Build ECS fields from an OpenCTI windows registry value type observable
processors:

  - set:
      tag: set__tmp_registry_value_b413f8ef
      field: _tmp_registry.value
      value: "{{{_ingest._value.name}}}"

  - set:
      tag: set__tmp_registry_data_type_4a9b344c
      field: _tmp_registry.data.type
      value: "{{{_ingest._value.data_type}}}"

  - append:
      tag: append__tmp_registry_data_strings_5a279c25
      field: _tmp_registry.data.strings
      value: "{{{_ingest._value.data}}}"

  # append object
  - script:
      tag: script_append_to_destination_0d277fd6
      description: Append to the destination
      lang: painless
      source: |
        ctx.threat = ctx.threat ?: [:];
        ctx.threat.indicator = ctx.threat.indicator ?: [:];
        ctx.threat.indicator.registry = ctx.threat.indicator.registry ?: [];
        ctx.threat.indicator.registry.add(ctx._tmp_registry);

  - remove:
      tag: remove__tmp_registry_c434c3af
      field: _tmp_registry
