---
description: Build ECS fields from an OpenCTI autonomous system observable
processors:

  - set:
      tag: set__tmp_as_number_929c68a6
      field: _tmp_as.number
      value: "{{{_ingest._value.number}}}"

  - set:
      tag: set__tmp_as_organization_name_2b965f2c
      field: _tmp_as.organization.name
      value: "{{{_ingest._value.name}}}"

  # append object
  - script:
      tag: script_append_to_destination_a845d013
      description: Append to the destination
      lang: painless
      source: |
        ctx.threat = ctx.threat ?: [:];
        ctx.threat.indicator = ctx.threat.indicator ?: [:];
        ctx.threat.indicator.as = ctx.threat.indicator.as ?: [];
        ctx.threat.indicator.as.add(ctx._tmp_as);

  - remove:
      tag: remove__tmp_as_4decf745
      field: _tmp_as
