---
description: Build ECS fields from an OpenCTI artifact observable
processors:

  # The url field is processed elsewhere.

  - foreach:
      tag: foreach__ingest__value_additional_names_ef8f87e3
      field: _ingest._value.additional_names
      ignore_missing: true
      processor:
        append:
          tag: append_tmp_file_name_c8aa2d2f
          field: _tmp_file.name
          value: "{{{_ingest._value}}}"
          allow_duplicates: false
  - script:
      tag: script_c9274ec0
      description: Remove null or empty names, remove name field if no names
      lang: painless
      source: |
        if (ctx._tmp_file?.name != null) {
          def result = [];
          for (name in ctx._tmp_file.name) {
              if (name != null && name != '') {
                  result.add(name);
              }
          }
          if (result.length == 0) {
            ctx._tmp_file.remove("name");
          } else if (result.length == 1) {
            ctx._tmp_file.name = result[0];
          } else {
            ctx._tmp_file.name = result;
          }
        }

  - set:
      tag: set__tmp_file_mime_type_f53c01af
      field: _tmp_file.mime_type
      value: "{{{_ingest._value.mime_type}}}"
      ignore_empty_value: true

  - set:
      tag: set__tmp_file_type_d6bb197c
      field: _tmp_file.type
      value: "file"
      ignore_empty_value: true

  - set:
      tag: set__tmp_file_hash_b2782542
      field: _tmp_file.hash
      copy_from: _ingest._value.hash
      ignore_empty_value: true

  # append object
  - script:
      tag: script_bd11ba93
      description: Append to the destination
      lang: painless
      source: |
        ctx.threat = ctx.threat ?: [:];
        ctx.threat.indicator = ctx.threat.indicator ?: [:];
        ctx.threat.indicator.file = ctx.threat.indicator.file ?: [];
        ctx.threat.indicator.file.add(ctx._tmp_file);

  - remove:
      tag: remove__tmp_file_8fed12c0
      field: _tmp_file
