  - script:
      tag: script_extract_file_hashes_to_related_2bc26de1
      description: Extract file hashes to related.hash, handling both array and single object cases
      lang: painless
      source: |
        if (ctx.threat?.indicator?.file != null) {
          def files = ctx.threat.indicator.file instanceof List ? ctx.threat.indicator.file : [ctx.threat.indicator.file];
          ctx.related = ctx.related ?: [:];
          ctx.related.hash = ctx.related.hash ?: [];
          def hashSet = new HashSet(ctx.related.hash);
          for (def file : files) {
            if (file?.hash != null) {
              if (file.hash.md5 != null) {
                hashSet.add(file.hash.md5);
              }
              if (file.hash.sha1 != null) {
                hashSet.add(file.hash.sha1);
              }
              if (file.hash.sha256 != null) {
                hashSet.add(file.hash.sha256);
              }
            }
          }
          if (hashSet.size() > 0) {
            ctx.related.hash = new ArrayList(hashSet);
          } else {
            ctx.related.remove('hash');
          }
        }
