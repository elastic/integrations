---
description: Pipeline for processing message_event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_b006b7b1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_email_into_event_category_0a688284
      value: email
  - append:
      field: event.type
      tag: append_info_into_event_type_5eab37e6
      value: info
  - set:
      field: observer.vendor
      tag: set_observer_vendor_30e754e3
      value: Sublime Security
  - set:
      field: observer.product
      tag: set_observer_product_1bab5e03
      value: Sublime Security
  - rename:
      field: json.data.message.canonical_id
      tag: rename_data_message_canonicalid_7e767b06
      target_field: sublime_security.message_event.canonical_id
      ignore_missing: true
  - rename:
      field: json.canonical_id
      tag: rename_canonical_id_89fe99fa
      target_field: sublime_security.message_event.canonical_id
      ignore_missing: true
  - date:
      field: json.created_at
      tag: date_created_at_7874ffba
      target_field: sublime_security.message_event.created_at
      formats:
        - ISO8601
      if: ctx.json?.created_at != null && ctx.json.created_at != ''
      on_failure:
        - append:
            tag: append_error_message_52acc6ed
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_message_event_created_at_172e8adb
      copy_from: sublime_security.message_event.created_at
      ignore_empty_value: true
  - foreach:
      tag: foreach_json_data_flagged_rules_3d983f38
      field: json.data.flagged_rules
      if: ctx.json?.data?.flagged_rules instanceof List
      processor:
        append:
          field: rule.id
          tag: append_data_flagged_rules_id_into_rule_id_5a4be194
          value: '{{{_ingest._value.id}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_json_data_flagged_rules_02c4ae92
      field: json.data.flagged_rules
      if: ctx.json?.data?.flagged_rules instanceof List
      processor:
        append:
          field: rule.name
          tag: append_data_flagged_rules_name_into_rule_name_5e2b7b0d
          value: '{{{_ingest._value.name}}}'
          allow_duplicates: false
  - rename:
      field: json.data.flagged_rules
      tag: rename_data_flagged_rules_1be13d3f
      target_field: sublime_security.message_event.data.flagged_rules
      ignore_missing: true
  - foreach:
      field: sublime_security.message_event.data.flagged_rules
      tag: foreach_sublime_security_message_event_data_flagged_rules_to_remove_id_and_name_abd60952
      if: ctx.sublime_security?.message_event?.data?.flagged_rules instanceof List
      processor:
        remove:
          field:
            - _ingest._value.id
            - _ingest._value.name
          tag: remove_duplicate_custom_fields_from_data_flagged_rules_array_676f940a
          ignore_missing: true
          if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - rename:
      field: json.data.triggered_actions
      tag: rename_data_triggered_actions_2c970617
