            tag: append_error_message_496c3fe8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.sender.display_name
      tag: rename_sender_display_name_bc842980
      target_field: sublime_security.message_event.sender.display_name
      ignore_missing: true
  - set:
      field: source.user.name
      tag: set_source_user_name_from_message_event_sender_display_name_3ec93f36
      copy_from: sublime_security.message_event.sender.display_name
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_sublime_security_message_event_sender_display_name_into_related_user_01e4514d
      value: '{{{sublime_security.message_event.sender.display_name}}}'
      allow_duplicates: false
      if: ctx.sublime_security?.message_event?.sender?.display_name != null
  - rename:
      field: json.sender.email
      tag: rename_sender_email_e3b00ca2
      target_field: sublime_security.message_event.sender.email
      ignore_missing: true
  - append:
      field: email.from.address
      tag: append_sublime_security_message_event_sender_email_into_email_from_address_3db432e5
      value: '{{{sublime_security.message_event.sender.email}}}'
      allow_duplicates: false
      if: ctx.sublime_security?.message_event?.sender?.email != null
  - append:
      field: related.user
      tag: append_sublime_security_message_event_sender_email_into_related_user_6d9c744e
      value: '{{{sublime_security.message_event.sender.email}}}'
      allow_duplicates: false
      if: ctx.sublime_security?.message_event?.sender?.email != null
  - rename:
      field: json.subject
      tag: rename_subject_c03358c2
      target_field: sublime_security.message_event.subject
      ignore_missing: true
  - set:
      field: email.subject
      tag: set_email_subject_from_message_event_subject_eecf6b26
      copy_from: sublime_security.message_event.subject
      ignore_empty_value: true
  - rename:
      field: json.type
      tag: rename_type_1f6efcb2
      target_field: sublime_security.message_event.type
      ignore_missing: true
  - foreach:
      tag: foreach_sublime_security_message_event_data_flagged_rules_73e7f63f
      field: sublime_security.message_event.data.flagged_rules
      if: ctx.sublime_security?.message_event?.data?.flagged_rules instanceof List
      processor:
        remove:
          field:
            - _ingest._value.id
            - _ingest._value.name
          tag: remove_custom_duplicate_fields_from_sublime_security_message_event_data_flagged_rules_c32db0b4
          ignore_missing: true
          if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - foreach:
      tag: foreach_sublime_security_message_event_recipients_78356f01
      field: sublime_security.message_event.recipients
      if: ctx.sublime_security?.message_event?.recipients instanceof List
      processor:
        remove:
          field: _ingest._value.email
          tag: remove_custom_duplicate_fields_from_sublime_security_message_event_recipients_296e9378
          ignore_missing: true
          if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - remove:
      field:
        - sublime_security.message_event.created_at
        - sublime_security.message_event.id
        - sublime_security.message_event.sender.display_name
        - sublime_security.message_event.sender.email
        - sublime_security.message_event.subject
      tag: remove_custom_duplicate_fields_af664dba
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      lang: painless
      description: Drops null/empty values recursively.
      tag: painless_remove_null_f6a89620
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
