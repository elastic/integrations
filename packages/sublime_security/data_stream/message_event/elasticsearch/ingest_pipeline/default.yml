      tag: rename_data_message_external_id_f0623515
      target_field: sublime_security.message_event.external_id
      ignore_missing: true
  - rename:
      field: json.external_id
      tag: rename_external_id_2a55ad55
      target_field: sublime_security.message_event.external_id
      ignore_missing: true
  - rename:
      field: json.forward_recipients
      tag: rename_forward_recipients_28c40c7e
      target_field: sublime_security.message_event.forward_recipients
      ignore_missing: true
  - date:
      field: json.forwarded_at
      tag: date_forwarded_at_80e2463a
      target_field: sublime_security.message_event.forwarded_at
      formats:
        - ISO8601
      if: ctx.json?.forwarded_at != null && ctx.json.forwarded_at != ''
      on_failure:
        - append:
            tag: append_error_message_b406bb6d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.data.message.id
      tag: rename_data_message_id_4f987d18
      target_field: sublime_security.message_event.id
      ignore_missing: true
  - rename:
      field: json.id
      tag: rename_id_3a00fd30
      target_field: sublime_security.message_event.id
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_message_event_id_c213a37c
      copy_from: sublime_security.message_event.id
      ignore_empty_value: true
  - convert:
      field: json.landed_in_spam
      tag: convert_landed_in_spam_to_boolean_760acbd9
      target_field: sublime_security.message_event.landed_in_spam
