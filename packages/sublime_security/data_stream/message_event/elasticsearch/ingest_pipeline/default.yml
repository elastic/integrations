      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_92608452
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.mailbox.email
      tag: rename_mailbox_email_ff99434b
      target_field: sublime_security.message_event.mailbox.email
      ignore_missing: true
  - rename:
      field: json.data.message.mailbox.external_id
      tag: rename_data_message_mailbox_external_id_dd6dc478
      target_field: sublime_security.message_event.mailbox.external_id
      ignore_missing: true
  - rename:
      field: json.mailbox.external_id
      tag: rename_mailbox_external_id_697cb8d7
      target_field: sublime_security.message_event.mailbox.external_id
      ignore_missing: true
  - rename:
      field: json.data.message.mailbox.id
      tag: rename_data_message_mailbox_id_0baa7490
      target_field: sublime_security.message_event.mailbox.id
      ignore_missing: true
  - rename:
      field: json.mailbox.id
      tag: rename_mailbox_id_d1929638
      target_field: sublime_security.message_event.mailbox.id
      ignore_missing: true
  - rename:
      field: json.data.message.message_source_id
      tag: rename_data_message_message_source_id_62d6160d
      target_field: sublime_security.message_event.message_source_id
      ignore_missing: true
  - rename:
      field: json.message_source_id
      tag: rename_message_source_id_475a830b
      target_field: sublime_security.message_event.message_source_id
      ignore_missing: true
  - date:
      field: json.read_at
      tag: date_read_at_213aa391
      target_field: sublime_security.message_event.read_at
      formats:
        - ISO8601
      if: ctx.json?.read_at != null && ctx.json.read_at != ''
      on_failure:
        - append:
            tag: append_error_message_5effc47e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_json_recipients_089ecb42
      field: json.recipients
      if: ctx.json?.recipients instanceof List
      processor:
        append:
          field: email.to.address
          tag: append_recipients_email_into_email_to_address_e534aff3
          value: '{{{_ingest._value.email}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_json_recipients_bcf0d5f4
      field: json.recipients
      if: ctx.json?.recipients instanceof List
      processor:
        append:
          field: related.user
          tag: append_recipients_email_into_related.user_181fb3b5
          value: '{{{_ingest._value.email}}}'
          allow_duplicates: false
  - rename:
      field: json.recipients
      tag: rename_recipients_7005c65f
      target_field: sublime_security.message_event.recipients
      ignore_missing: true
  - date:
      field: json.replied_at
      tag: date_replied_at_0cd249ed
      target_field: sublime_security.message_event.replied_at
      formats:
        - ISO8601
      if: ctx.json?.replied_at != null && ctx.json.replied_at != ''
      on_failure:
