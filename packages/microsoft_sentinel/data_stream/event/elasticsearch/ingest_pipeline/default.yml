---
description: Pipeline for processing event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - set:
      field: event.kind
      tag: set_event_kind_alert_ab1166ce
      value: alert
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.TimeGenerated
        - json.ProcessingEndTime
        - json.EndTime
        - json.StartTime
        - json.SystemAlertId
      tag: fingerprint_event_0893363a
      target_field: _id
      ignore_missing: true
  - rename:
      field: json.AlertLink
      tag: rename_AlertLink_bdae8fd8
      target_field: microsoft_sentinel.event.alert.link
      ignore_missing: true
  - set:
      field: event.url
      tag: set_event_url_from_event_alert_link_5cf1e4e8
      copy_from: microsoft_sentinel.event.alert.link
      ignore_empty_value: true
  - rename:
      field: json.AlertName
      tag: rename_AlertName_4a22c622
      target_field: microsoft_sentinel.event.alert.name
      ignore_missing: true
  - rename:
      field: json.AlertSeverity
      tag: rename_AlertSeverity_e465f999
      target_field: microsoft_sentinel.event.alert.severity
      ignore_missing: true
  - rename:
      field: json.AlertType
      tag: rename_AlertType_3c8aeacb
      target_field: microsoft_sentinel.event.alert.type
      ignore_missing: true
  - rename:
      field: json.CompromisedEntity
      tag: rename_CompromisedEntity_41ab097a
      target_field: microsoft_sentinel.event.compromised_entity
      ignore_missing: true
  - rename:
      field: json.ConfidenceLevel
      tag: rename_ConfidenceLevel_dc1d89b1
      target_field: microsoft_sentinel.event.confidence.level
      ignore_missing: true
  - set:
      field: threat.indicator.confidence
      tag: set_threat_indicator_confidence_from_event_confidence_level_791b263e
      copy_from: microsoft_sentinel.event.confidence.level
      ignore_empty_value: true
  - convert:
      field: json.ConfidenceScore
      tag: convert_ConfidenceScore_to_double_560f79c1
      target_field: microsoft_sentinel.event.confidence.score
      type: double
      ignore_missing: true
      if: ctx.json?.ConfidenceScore != null && ctx.json.ConfidenceScore != ''
      on_failure:
        - append:
            tag: append_error_message_439c9e6c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.Description
      tag: rename_Description_dac6f98a
      target_field: microsoft_sentinel.event.description
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_event_description_a7131690
      copy_from: microsoft_sentinel.event.description
      ignore_empty_value: true
  - rename:
      field: json.DisplayName
      tag: rename_DisplayName_a53ff434
      target_field: microsoft_sentinel.event.display_name
      ignore_missing: true
  - date:
      field: json.EndTime
      tag: date_EndTime_dd6d04d0
      target_field: microsoft_sentinel.event.end_time
      formats:
        - ISO8601
      if: ctx.json?.EndTime != null && ctx.json.EndTime != ''
      on_failure:
        - append:
            tag: append_error_message_9d8bb9b3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.end
      tag: set_event_end_from_event_end_time_b708040d
      copy_from: microsoft_sentinel.event.end_time
      ignore_empty_value: true
  - json:
      field: json.Entities
      tag: json_Entities_1d3a32b9
      target_field: microsoft_sentinel.event.entities
      if: ctx.json?.Entities instanceof String && ctx.json.Entities != ''
      on_failure:
        - append:
            tag: append_error_message_d5a8402b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.ExtendedLinks
      tag: rename_ExtendedLinks_9319f443
      target_field: microsoft_sentinel.event.extended.links
      ignore_missing: true
  - set:
      field: event.reference
      tag: set_event_reference_from_event_extended_links_214af334
      copy_from: microsoft_sentinel.event.extended.links
      ignore_empty_value: true
  - json:
      field: json.ExtendedProperties
      tag: json_ExtendedProperties_564e2ba3
      target_field: microsoft_sentinel.event.extended.properties
      if: ctx.json?.ExtendedProperties instanceof String && ctx.json.ExtendedProperties != ''
      on_failure:
        - append:
            tag: append_error_message_d51339b6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json._Internal_WorkspaceResourceId
      tag: rename__Internal_WorkspaceResourceId_479abff1
      target_field: microsoft_sentinel.event.internal_workspace_resource_id
      ignore_missing: true
  - set:
      tag: set_json_IsIncident_02193af4
      field: json.IsIncident
      value: false
      if: ctx.json?.IsIncident != null && ctx.json.IsIncident == 0
  - convert:
      field: json.IsIncident
      tag: convert_IsIncident_to_boolean_1099d42f
      target_field: microsoft_sentinel.event.is_incident
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_6a2208a6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json._ItemId
      tag: rename__ItemId_eeae6b70
      target_field: microsoft_sentinel.event.item_id
      ignore_missing: true
  - date:
      field: json.ProcessingEndTime
      tag: date_ProcessingEndTime_02d28b0e
      target_field: microsoft_sentinel.event.processing_end_time
      formats:
        - ISO8601
      if: ctx.json?.ProcessingEndTime != null && ctx.json.ProcessingEndTime != ''
      on_failure:
        - append:
            tag: append_error_message_41a36adf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.ProductComponentName
      tag: rename_ProductComponentName_1bf42008
      target_field: microsoft_sentinel.event.product.component_name
      ignore_missing: true
  - rename:
      field: json.ProductName
      tag: rename_ProductName_36c742ad
      target_field: microsoft_sentinel.event.product.name
      ignore_missing: true
  - set:
      field: observer.product
      tag: set_observer_product_from_event_product_name_8a248b85
      copy_from: microsoft_sentinel.event.product.name
      ignore_empty_value: true
  - rename:
      field: json.ProviderName
      tag: rename_ProviderName_dc258d2f
      target_field: microsoft_sentinel.event.provider_name
      ignore_missing: true
  - set:
      field: event.provider
      tag: set_event_provider_from_event_provider_name_37ef9702
      copy_from: microsoft_sentinel.event.provider_name
      ignore_empty_value: true
  - rename:
      field: json.RemediationSteps
      tag: rename_RemediationSteps_38568540
      target_field: microsoft_sentinel.event.remediation_steps
      ignore_missing: true
  - rename:
      field: json.ResourceId
      tag: rename_ResourceId_443b8f21
      target_field: microsoft_sentinel.event.resource_id
      ignore_missing: true
  - rename:
      field: json.SourceComputerId
      tag: rename_SourceComputerId_933817e5
      target_field: microsoft_sentinel.event.source.computer_id
      ignore_missing: true
  - set:
      field: host.id
      tag: set_host_id_from_event_source_computer_id_df11f093
      copy_from: microsoft_sentinel.event.source.computer_id
      ignore_empty_value: true
  - append:
      field: related.hosts
      tag: append_host_id_into_related_hosts_bd1f7443
      value: '{{{host.id}}}'
      allow_duplicates: false
      if: ctx.host?.id != null
  - rename:
      field: json.SourceSystem
      tag: rename_SourceSystem_53cb3fc5
      target_field: microsoft_sentinel.event.source.system
      ignore_missing: true
  - set:
      field: observer.type
      tag: set_observer_type_from_event_source_system_b8421307
      copy_from: microsoft_sentinel.event.source.system
      ignore_empty_value: true
  - date:
      field: json.StartTime
      tag: date_StartTime_167d470a
      target_field: microsoft_sentinel.event.start_time
      formats:
        - ISO8601
      if: ctx.json?.StartTime != null && ctx.json.StartTime != ''
      on_failure:
        - append:
            tag: append_error_message_2f59e976
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.start
      tag: set_event_start_from_event_start_time_1e252021
      copy_from: microsoft_sentinel.event.start_time
      ignore_empty_value: true
  - script:
      description: Determine event.duration from event start and end date.
      tag: script_to_set_event_duration_131393fc
      lang: painless
      if: ctx.event?.start != null && ctx.event?.end != null
      source: |
        Instant event_start = ZonedDateTime.parse(ctx.event.start).toInstant();
        Instant event_end = ZonedDateTime.parse(ctx.event.end).toInstant();
        ctx.event['duration'] = ChronoUnit.NANOS.between(event_start, event_end);
      on_failure:
        - append:
            tag: append_error_message_16889e98
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.Status
      tag: rename_Status_5d878c43
      target_field: microsoft_sentinel.event.status
      ignore_missing: true
  - rename:
      field: json.SystemAlertId
      tag: rename_SystemAlertId_f64e987a
      target_field: microsoft_sentinel.event.system_alert_id
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_event_system_alert_id_b382fcc4
      copy_from: microsoft_sentinel.event.system_alert_id
      ignore_empty_value: true
  - rename:
      field: json.Tactics
      tag: rename_Tactics_adbfa017
      target_field: microsoft_sentinel.event.tactics
      ignore_missing: true
  - split:
      field: microsoft_sentinel.event.tactics
      separator: ','
      tag: split_tactics_3036035f
      ignore_missing: true
      if: ctx.microsoft_sentinel?.event?.tactics instanceof String
      on_failure:
        - append:
            tag: append_error_message_5606b29a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_microsoft_sentinel_event_tactics_a5c7eb29
      field: microsoft_sentinel.event.tactics
      if: ctx.microsoft_sentinel?.event?.tactics instanceof List
      processor:
        append:
          field: threat.tactic.name
          tag: append_microsoft_sentinel_event_tactics_into_threat_tactic_name_6d0d9b35
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - rename:
      field: json.Techniques
      tag: rename_Techniques_eac7abda
      target_field: microsoft_sentinel.event.techniques
      ignore_missing: true
  - split:
      field: microsoft_sentinel.event.techniques
      separator: ','
      tag: split_techniques_79d57625
      ignore_missing: true
      if: ctx.microsoft_sentinel?.event?.techniques instanceof String
      on_failure:
        - append:
            tag: append_error_message_21662d06
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_microsoft_sentinel_event_techniques_fd279adb
      field: microsoft_sentinel.event.techniques
      if: ctx.microsoft_sentinel?.event?.techniques instanceof List
      processor:
        append:
          field: threat.technique.name
          tag: append_microsoft_sentinel_event_techniques_into_threat_technique_name_f2a2fe2a
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - rename:
      field: json.TenantId
      tag: rename_TenantId_8f9fc11e
      target_field: microsoft_sentinel.event.tenant_id
      ignore_missing: true
  - set:
      field: cloud.account.id
      tag: set_cloud_account_id_from_event_tenant_id_c400476d
      copy_from: microsoft_sentinel.event.tenant_id
      ignore_empty_value: true
  - date:
      field: json.TimeGenerated
      tag: date_TimeGenerated_e1499806
      target_field: microsoft_sentinel.event.time_generated
      formats:
        - ISO8601
      if: ctx.json?.TimeGenerated != null && ctx.json.TimeGenerated != ''
      on_failure:
        - append:
            tag: append_error_message_4d5ce763
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_event_time_generated_be134e8a
      copy_from: microsoft_sentinel.event.time_generated
      ignore_empty_value: true
  - rename:
      field: json.Type
      tag: rename_Type_ed199b68
      target_field: microsoft_sentinel.event.type
      ignore_missing: true
  - rename:
      field: json.VendorName
      tag: rename_VendorName_f62a63ad
      target_field: microsoft_sentinel.event.vendor.name
      ignore_missing: true
  - set:
      field: observer.vendor
      tag: set_observer_vendor_from_event_vendor_name_6134882c
      copy_from: microsoft_sentinel.event.vendor.name
      ignore_empty_value: true
  - rename:
      field: json.VendorOriginalId
      tag: rename_VendorOriginalId_5652df4a
      target_field: microsoft_sentinel.event.vendor.original_id
      ignore_missing: true
  - rename:
      field: json.WorkspaceResourceGroup
      tag: rename_WorkspaceResourceGroup_da581bb6
      target_field: microsoft_sentinel.event.workspace.resource_group
      ignore_missing: true
  - rename:
      field: json.WorkspaceSubscriptionId
      tag: rename_WorkspaceSubscriptionId_27513ab8
      target_field: microsoft_sentinel.event.workspace.subscription_id
      ignore_missing: true
  - remove:
      field:
        - microsoft_sentinel.event.alert.link
        - microsoft_sentinel.event.confidence.level
        - microsoft_sentinel.event.description
        - microsoft_sentinel.event.end_time
        - microsoft_sentinel.event.extended.links
        - microsoft_sentinel.event.product.name
        - microsoft_sentinel.event.provider_name
        - microsoft_sentinel.event.source.computer_id
        - microsoft_sentinel.event.source.system
        - microsoft_sentinel.event.start_time
        - microsoft_sentinel.event.system_alert_id
        - microsoft_sentinel.event.tactics
        - microsoft_sentinel.event.techniques
        - microsoft_sentinel.event.tenant_id
        - microsoft_sentinel.event.time_generated
        - microsoft_sentinel.event.vendor.name
      tag: remove_custom_duplicate_fields_21d23076
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
