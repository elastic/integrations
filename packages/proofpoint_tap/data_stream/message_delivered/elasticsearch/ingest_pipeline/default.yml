---
description: Pipeline for parsing Proofpoint TAP delivered message logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_cac66847
      field: event.original
      target_field: json
      ignore_failure: true
  - drop:
      tag: drop_af5ef778
      if: ctx.json?.messagesDelivered instanceof List && ctx.json.messagesDelivered.length == 0
  - date:
      tag: date_json_messageTime_a1f037bb
      field: json.messageTime
      if: ctx.json?.messageTime != null && ctx.json.messageTime != ''
      formats:
        - ISO8601
      on_failure:
        - append:
            tag: append_error_message_63547788
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - fingerprint:
      tag: fingerprint_02243b84
      fields:
        - event.original
      target_field: _id
      ignore_missing: true
  - append:
      tag: append_event_category_df23064f
      field: event.category
      value: email
      ignore_failure: true
  - append:
      tag: append_event_type_61ba5509
      field: event.type
      value: info
      ignore_failure: true
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - convert:
      tag: convert_json_senderIP_to_source_ip_0e7c10d3
      field: json.senderIP
      target_field: source.ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_senderIP_d3b08891
            field: json.senderIP
        - append:
            tag: append_error_message_18a6114e
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_86c0561d
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null && ctx.source.ip != ''
      allow_duplicates: false
      ignore_failure: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_5d3ae3d6
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      if: ctx.source?.ip != null && ctx.source.ip != ''
      on_failure:
        - append:
            tag: append_error_message_900765d9
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - geoip:
      tag: geoip_source_ip_to_source_as_82271077
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      if: ctx.source?.ip != null && ctx.source.ip != ''
