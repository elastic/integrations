format_version: 3.5.8
name: ti_tor
title: TOR Node Activity
version: 0.1.0
source:
  license: "Elastic-2.0"
description: Collect TOR relay activity (OR and exit addresses, flags, bandwidth, AS) from the Tor Project Onionoo API as threat intelligence indicators.
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/ti_tor-overview-dashboard.png
    title: TOR Node Activity overview dashboard
    size: 1400x1240
    type: image/png
icons:
  - src: /img/tor-logo.svg
    title: TOR logo
    size: 64x64
    type: image/svg+xml
policy_templates:
  - name: tor
    title: TOR Node Activity
    description: Collect TOR relay activity from the Onionoo details API.
    inputs:
      - type: httpjson
        title: Collect TOR relay activity via the Onionoo API
        description: Periodically fetch TOR relay details from Onionoo.
owner:
  github: elastic/security-service-integrations
  type: community
