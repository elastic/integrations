- name: tor.name
  type: keyword
  description: Relay nickname.
- name: tor.fingerprint
  type: keyword
  description: Relay fingerprint (40 upper-case hex characters).
- name: tor.description
  type: keyword
  description: Relay flags assigned by the directory authorities (Onionoo `flags`).
- name: tor.running
  type: boolean
  description: Whether the relay was listed as running in the last consensus.
- name: tor.hibernating
  type: boolean
  description: Whether the relay reported being hibernating.
- name: tor.measured
  type: boolean
  description: Whether the relay's consensus weight is based on bandwidth measurements.
- name: tor.platform
  type: keyword
  description: Platform string (Tor version and operating system).
- name: tor.version
  type: keyword
  description: Tor software version.
- name: tor.version_status
  type: keyword
  description: Status of the Tor version (recommended, obsolete, experimental...).
- name: tor.recommended_version
  type: boolean
  description: Whether the Tor version is recommended by the directory authorities.
- name: tor.contact.original
  type: match_only_text
  description: Operator contact information.
- name: tor.hostname.verified
  type: keyword
  description: Verified reverse DNS host names.
- name: tor.hostname.unverified
  type: keyword
  description: Unverified reverse DNS host names.
- name: tor.first_seen
  type: date
  description: When the relay was first seen in a consensus.
- name: tor.last_seen
  type: date
  description: When the relay was last seen in a consensus.
- name: tor.last_changed
  type: date
  description: When the relay last changed its OR address or port.
- name: tor.last_restarted
  type: date
  description: When the relay was last (re-)started.
- name: tor.overload
  type: date
  description: When the relay last reported being overloaded.
- name: tor.bandwidth.rate
  type: long
  description: Average bandwidth in bytes per second the relay is willing to sustain.
- name: tor.bandwidth.burst
  type: long
  description: Burst bandwidth in bytes per second.
- name: tor.bandwidth.observed
  type: long
  description: Observed bandwidth in bytes per second.
- name: tor.bandwidth.advertised
  type: long
  description: Advertised bandwidth in bytes per second.
- name: tor.consensus.weight
  type: long
  description: Consensus weight.
- name: tor.consensus.weight_fraction
  type: double
  description: Fraction of the consensus weight.
- name: tor.guard.probability
  type: half_float
  description: Probability of the relay being selected as guard.
- name: tor.middle.probability
  type: half_float
  description: Probability of the relay being selected as middle.
- name: tor.exit.probability
  type: half_float
  description: Probability of the relay being selected as exit.
- name: tor.as.number
  type: long
  description: Relay autonomous system number as reported by Onionoo.
- name: tor.as.organization.name
  type: keyword
  description: Relay autonomous system name as reported by Onionoo.
- name: tor.exit.ip
  type: ip
  description: Exit addresses.
- name: tor.exit.as.number
  type: long
  description: ASN of the exit address.
- name: tor.exit.as.organization.name
  type: keyword
  description: AS organization of the exit address.
- name: tor.exit.as.network
  type: ip_range
  description: AS network of the exit address.
- name: tor.exit_policy
  type: keyword
  description: Exit policy lines.
- name: tor.exit.policy.ipv4.accept
  type: keyword
  description: 'IPv4 exit policy summary: accepted ports.'
- name: tor.exit.policy.ipv4.reject
  type: keyword
  description: 'IPv4 exit policy summary: rejected ports.'
- name: tor.exit.policy.ipv6.accept
  type: keyword
  description: 'IPv6 exit policy summary: accepted ports.'
- name: tor.exit.policy.ipv6.reject
  type: keyword
  description: 'IPv6 exit policy summary: rejected ports.'
- name: tor.family.alleged
  type: keyword
  description: Relays this relay claims as family members.
- name: tor.family.effective
  type: keyword
  description: Relays in a mutual family relationship.
- name: tor.family.indirect
  type: keyword
  description: Relays indirectly in this relay's family.
- name: tor.routing.ipv4.ip
  type: ip
  description: First IPv4 OR address.
- name: tor.routing.ipv4.port
  type: long
  description: First IPv4 OR port.
- name: tor.routing.ipv6.ip
  type: ip
  description: First IPv6 OR address.
- name: tor.routing.ipv6.port
  type: long
  description: First IPv6 OR port.
- name: tor.exit.geo.city_name
  type: keyword
- name: tor.exit.geo.continent_name
  type: keyword
- name: tor.exit.geo.country_iso_code
  type: keyword
- name: tor.exit.geo.country_name
  type: keyword
- name: tor.exit.geo.region_iso_code
  type: keyword
- name: tor.exit.geo.region_name
  type: keyword
- name: tor.exit.geo.location
  type: geo_point
- name: tor.routing.ipv4.geo.city_name
  type: keyword
- name: tor.routing.ipv4.geo.continent_name
  type: keyword
- name: tor.routing.ipv4.geo.country_iso_code
  type: keyword
- name: tor.routing.ipv4.geo.country_name
  type: keyword
- name: tor.routing.ipv4.geo.region_iso_code
  type: keyword
- name: tor.routing.ipv4.geo.region_name
  type: keyword
- name: tor.routing.ipv4.geo.location
  type: geo_point
- name: tor.routing.ipv6.geo.city_name
  type: keyword
- name: tor.routing.ipv6.geo.continent_name
  type: keyword
- name: tor.routing.ipv6.geo.country_iso_code
  type: keyword
- name: tor.routing.ipv6.geo.country_name
  type: keyword
- name: tor.routing.ipv6.geo.region_iso_code
  type: keyword
- name: tor.routing.ipv6.geo.region_name
  type: keyword
- name: tor.routing.ipv6.geo.location
  type: geo_point
- name: tor.detail.Authority
  type: keyword
  description: Description of the Authority flag, present when the relay has it.
- name: tor.detail.BadExit
  type: keyword
  description: Description of the BadExit flag, present when the relay has it.
- name: tor.detail.Exit
  type: keyword
  description: Description of the Exit flag, present when the relay has it.
- name: tor.detail.Fast
  type: keyword
  description: Description of the Fast flag, present when the relay has it.
- name: tor.detail.Guard
  type: keyword
  description: Description of the Guard flag, present when the relay has it.
- name: tor.detail.HSDir
  type: keyword
  description: Description of the HSDir flag, present when the relay has it.
- name: tor.detail.NoEdConsensus
  type: keyword
  description: Description of the NoEdConsensus flag, present when the relay has it.
- name: tor.detail.Running
  type: keyword
  description: Description of the Running flag, present when the relay has it.
- name: tor.detail.Stable
  type: keyword
  description: Description of the Stable flag, present when the relay has it.
- name: tor.detail.Valid
  type: keyword
  description: Description of the Valid flag, present when the relay has it.
- name: tor.detail.Unnamed
  type: keyword
  description: Description of the Unnamed flag, present when the relay has it.
