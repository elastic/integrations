version: "2.3"
services:
  ti_tor:
    image: docker.elastic.co/observability/stream:v0.25.0
    hostname: ti_tor
    ports:
      - 8080
    volumes:
      - ./files:/files:ro
    environment:
      PORT: 8080
    command:
      - http-server
      - --addr=:8080
      - --config=/files/config.yml
