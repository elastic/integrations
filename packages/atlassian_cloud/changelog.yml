- version: "0.2.2"
  changes:
    - description: Fix audit events missed when they become visible in the API after the poll that should have collected them, at the end of every poll or behind later events, by collecting events only after a configurable delay and keeping the cursor at the last collected event.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22530
- version: "0.2.1"
  changes:
    - description: Fix audit documents rejected when keys in the `context`, `container` or `actor.app` attributes contain NUL characters.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22187
- version: "0.2.0"
  changes:
    - description: Changed owners.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22070
- version: "0.1.2"
  changes:
    - description: Remove empty ILM policies section from the README.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20950
- version: "0.1.1"
  changes:
    - description: Set agentless deployment mode `release` field to `beta`.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20478
- version: "0.1.0"
  changes:
    - description: Initial release.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/19718
