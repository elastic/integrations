  # Round 1, page 3 — returns a Confluence API event whose container attribute keys
  # contain NUL characters, then Eve (2 events), with a next cursor.
  # The CEL program sets last_timestamp = Eve's processedAt
  # (2026-05-19T10:10:01.000Z → 1779185401000 ms).
  - path: /admin/v1/orgs/00000000-0000-0000-0000-000000000000/events-stream
    methods: ["GET"]
    query_params:
      cursor: cursor-page-3
      limit: "2"
    request_headers:
      Authorization:
        - "Bearer test-api-key"
      Accept:
        - "application/json"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
          {
            "data": [
              {
                "type": "events",
                "id": "a1000006-0000-4000-8000-000000000006",
                "attributes": {
                  "time": "2026-05-19T10:09:00.000Z",
                  "processedAt": "2026-05-19T10:09:01.000Z",
                  "action": "confluence_accessed_api",
                  "actor": {
                    "id": "712020:aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa",
                    "name": "Alex Rivera",
                    "email": "alex.rivera@example.com",
                    "auth": {
                      "authType": "api-token",
                      "tokenId": "token-00000002"
                    }
                  },
                  "container": [
                    {
                      "id": "11111111-1111-1111-1111-111111111111",
                      "type": "sites",
                      "attributes": {
                        "siteName": "example-corp",
                        "httpMethod": "PUT",
                        "body:value.folders.300001\u0000Parent": "400001",
                        "body:value.folders.300001\u0000Parent\u0000Child": "400002"
                      }
                    }
                  ],
                  "location": {
                    "ip": "203.0.113.40",
                    "countryName": "Example Country",
                    "city": "Example City"
                  }
                },
                "message": {
                  "content": "Made request PUT /wiki/api/v2/pages/100001/properties/200001",
                  "format": "simple"
                }
              },
              {
                "type": "events",
                "id": "a1000005-0000-4000-8000-000000000005",
                "attributes": {
                  "time": "2026-05-19T10:10:00.000Z",
                  "processedAt": "2026-05-19T10:10:01.000Z",
                  "action": "api_token_created",
                  "actor": {
                    "id": "712020:eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee",
                    "name": "Eve Martinez",
                    "email": "eve.martinez@example.com",
                    "auth": {
                      "authType": "session",
                      "tokenId": "token-00000001",
                      "tokenLabel": "Example API Token"
                    }
                  },
                  "location": {
                    "ip": "198.51.100.30",
                    "geo": "EU",
                    "countryName": "Example Country",
                    "city": "Example City"
                  }
                },
                "message": {
