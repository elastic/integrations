            ],
            "links": {
              "next": "https://api.atlassian.com/admin/v1/orgs/00000000-0000-0000-0000-000000000000/events-stream?cursor=cursor-page-4"
            },
            "meta": {
              "next": "cursor-page-4",
              "page_size": 2
            }
          }
          ` }}
  # Round 1, page 4 — terminal page at the head of the stream: no events and no
  # next cursor. want_more = false, ending the pagination loop. The CEL program
  # keeps last_timestamp = Eve's processedAt, with last_ids = [Eve], and
  # publishes a placeholder that the agent drops, so that this cursor, without
  # the page token, is the one stored.
  - path: /admin/v1/orgs/00000000-0000-0000-0000-000000000000/events-stream
    methods: ["GET"]
    query_params:
      cursor: cursor-page-4
      limit: "2"
    request_headers:
      Authorization:
        - "Bearer test-api-key"
      Accept:
        - "application/json"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
          {
            "data": [],
            "links": {},
            "meta": {
              "attributes": null,
              "next": null,
              "prev": null,
              "current": null,
              "page_size": 200,
              "start_index": null,
              "end_index": null,
              "total": 0
            }
          }
          ` }}
  # Round 2, page 1 — fresh time-window request after the polling interval. from
  # is inclusive, so the CEL program sends Eve's processedAt (from=1779185401000)
  # and drops Eve, whose ID is in cursor.last_ids. Grace has the same processedAt
  # as Eve but was not visible to the API until after round 1 ended, so she is
  # collected.
  - path: /admin/v1/orgs/00000000-0000-0000-0000-000000000000/events-stream
    methods: ["GET"]
    query_params:
      from: "1779185401000"
      to: "{to:.*}"
      sortOrder: asc
      limit: "2"
    request_headers:
      Authorization:
        - "Bearer test-api-key"
      Accept:
