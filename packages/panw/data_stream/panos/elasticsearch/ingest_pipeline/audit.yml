---
description: Pipeline for PanOS Audit Logs.
# API Docs: https://docs.paloaltonetworks.com/pan-os/10-2/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/audit-log-fields
processors:
  - csv:
      tag: csv_message_4cf41818
      field: message
      ignore_failure: true
      target_fields:
        - panw.panos.config_version
        - panw.panos.cmd_source
        - user.name
        - panw.panos.cmd
        - panw.panos.result
  - set:
      tag: set_event_outcome_6e30f0a1
      description: >-
        Audit logs report the result as success, failed or none, and ECS restricts
        event.outcome to success, failure and unknown, so the vendor value is kept in
        panw.panos.result and event.outcome is derived from it.
      field: event.outcome
      value: success
      if: ctx.panw?.panos?.result instanceof String && ctx.panw.panos.result.equalsIgnoreCase('success')
  - set:
      tag: set_event_outcome_0b4c9d27
      field: event.outcome
      value: failure
      if: ctx.panw?.panos?.result instanceof String && (ctx.panw.panos.result.equalsIgnoreCase('failed') || ctx.panw.panos.result.equalsIgnoreCase('failure'))
  - set:
      tag: set_event_outcome_f5a8c413
      description: >-
        Any result the two processors above did not recognise, such as the none PAN-OS
        reports for read-only GUI navigation, maps to unknown; the vendor value stays in
        panw.panos.result.
      field: event.outcome
      value: unknown
      if: ctx.panw?.panos?.result != null && ctx.event?.outcome == null
  - uppercase:
      tag: uppercase_panw_panos_type_ec638369
      field: panw.panos.type
      ignore_missing: true
  # Set event.kind & event.category field.
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      tag: append_event_category_c8ab9fa2
      field: event.category
      value:
        - configuration

  # Set custom fields to ECS fields
  - set:
      tag: set_observer_hostname_5bc96c94
      field: observer.hostname
      copy_from: panw.panos.device_name
      ignore_failure: true
  - set:
      tag: set_source_ip_c1b0f423
      field: source.ip
      copy_from: panw.panos.source.ip
      ignore_failure: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
