format_version: "3.6.0"
name: mimecast
title: "Mimecast"
version: "3.8.0"
description: Collect logs from Mimecast with Elastic Agent.
type: integration
categories: ["security", "email_security"]
conditions:
  kibana:
    version: "^8.19.4 || ~9.0.7 || ^9.1.4"
screenshots:
  - src: /img/mimecast.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/mimecast.svg
    title: Sample logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: mimecast
    title: Mimecast
    description: Collect logs from the Mimecast API with Elastic Agent.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: ga
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: cel
        title: Collect Mimecast logs via API 2.0
        description: Collect logs from the Mimecast API 2.0 endpoints.
        vars:
          - name: api_url
            type: text
            title: API URL
            description: API URL.
            multi: false
            required: true
            show_user: false
            default: https://api.services.mimecast.com
          - name: client_id
            type: text
            title: Client ID for API 2.0 Endpoints
            description: Set Client ID.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: client_secret
            type: password
            title: Client Secret for API 2.0 Endpoints
            description: Set Client Secret.
            multi: false
            required: true
            show_user: true
            secret: true
      - type: httpjson
        title: DEPRECATED - Collect Mimecast logs via API 1.0
        description: "Deactivate this option and instead enable `Collect Mimecast logs via API 2.0`. Collecting logs from the Mimecast API 1.0 endpoints is deprecated since version 3.6.0 and will be removed in a future release."
        deprecated:
          since: "3.6.0"
          description: "Collecting Mimecast logs via API 1.0 is deprecated. Use `Collect Mimecast logs via API 2.0` instead."
          replaced_by:
            input: cel
        vars:
          - name: api_url
            type: text
            title: API URL
            description: API URL.
            multi: false
            required: true
            show_user: false
            default: https://eu-api.mimecast.com
          - name: app_key
            type: password
            title: Application Key for API 1.0 Endpoints
            description: Specifies application key for user.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: app_id
            type: password
            title: Application ID for API 1.0 Endpoints
            description: Set the Application Id.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: access_key
            type: password
            title: Access Key for API 1.0 Endpoints
            description: Set Access Key.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: secret_key
            type: password
            title: Secret Key for API 1.0 Endpoints
            description: Set Secret Key.
            multi: false
            required: true
            show_user: true
            secret: true
owner:
  github: elastic/security-service-integrations
  type: elastic
