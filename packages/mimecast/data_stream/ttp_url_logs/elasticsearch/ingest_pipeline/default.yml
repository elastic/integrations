---
description: Pipeline for processing Mimecast ttp_url_logs.
processors:
  # Generic event/ecs fields we always want to populate.
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_mimecast_d72eb09c
      description: Parse 'message' JSON contents into a 'mimecast' object.
      field: event.original
      target_field: mimecast
  - drop:
      tag: drop_6ce7222a
      if: ctx.mimecast?.date == null || (ctx.mimecast?.data != null && ctx.mimecast.data.isEmpty())
  - fingerprint:
      tag: fingerprint_27d21f1f
      fields:
        - mimecast.messageId
        - mimecast.date
      target_field: "_id"
      ignore_missing: true
  - date:
      tag: date_mimecast_date_88412148
      description: Use 'mimecast.date' as the '@timestamp'
      field: mimecast.date
      timezone: UTC
      formats:
        - yyyy-MM-dd'T'HH:mm:ssZ
  - set:
      tag: set_event_category_4861796c
      field: event.category
      value: [email]
  - set:
      tag: set_event_kind_ad202b20
      field: event.kind
      value: alert
      if: ctx.mimecast?.scanResult == 'malicious'

  ###
  - rename:
      tag: rename_mimecast_url_to_url_original_7cf8a0a2
      field: mimecast.url
      target_field: url.original
      ignore_missing: true
  - uri_parts:
      tag: uri_parts_url_original_a660a8ab
      field: url.original
      keep_original: true
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_mimecast_userAwarenessAction_to_event_action_802a8079
      field: mimecast.userAwarenessAction
      target_field: event.action
      ignore_missing: true
  - rename:
      tag: rename_mimecast_route_to_email_direction_552b5749
      field: mimecast.route
      target_field: email.direction
      ignore_missing: true
  - rename:
      tag: rename_mimecast_ttpDefinition_to_rule_name_d854d979
      field: mimecast.ttpDefinition
      target_field: rule.name
      ignore_missing: true
  - rename:
      tag: rename_mimecast_subject_to_email_subject_3c7206f3
      field: mimecast.subject
      target_field: email.subject
      ignore_missing: true
  - rename:
      tag: rename_mimecast_messageId_to_email_message_id_a8ab0b64
      field: mimecast.messageId
      target_field: email.message_id
      ignore_missing: true
  - set:
      tag: set_email_from_address_bda9e358
      field: email.from.address
      value: ["{{{mimecast.fromUserEmailAddress}}}"]
      if: "ctx.mimecast?.fromUserEmailAddress != null"
  - append:
      tag: append_related_user_5753eea6
      field: related.user
      value: "{{{mimecast.fromUserEmailAddress}}}"
      allow_duplicates: false
      if: 'ctx.mimecast?.fromUserEmailAddress != null'
      ignore_failure: true
  - set:
      tag: set_email_to_address_55c4e91f
      field: email.to.address
      value: ["{{{mimecast.userEmailAddress}}}"]
      if: "ctx.mimecast?.userEmailAddress != null"
  - set:
      tag: set_user_email_1e711c32
      field: user.email
      value: ["{{{mimecast.userEmailAddress}}}"]
      if: "ctx?.mimecast?.userEmailAddress != null"
  - append:
      tag: append_related_user_cdbe6caa
      field: related.user
      value: "{{{mimecast.userEmailAddress}}}"
      allow_duplicates: false
      if: 'ctx.mimecast?.userEmailAddress != null'
      ignore_failure: true
  - convert:
      tag: convert_mimecast_sendingIp_to_source_ip_471402f5
      field: mimecast.sendingIp
      target_field: source.ip
      type: ip
      ignore_missing: true
      ignore_failure: true
  - remove:
      tag: remove_mimecast_sendingIp_d48483a4
      field: mimecast.sendingIp
      if: ctx.source?.ip != null
      ignore_missing: true
  - set:
      tag: set_event_created_db76d553
      field: event.created
      value: "{{{mimecast.date}}}"
      if: 'ctx?.mimecast?.date != null'
  - append:
      tag: append_related_ip_242edff8
      field: related.ip
      value: "{{{source.ip}}}"
      allow_duplicates: false
      if: 'ctx?.source?.ip !=null'
  - dissect:
      tag: dissect_email_from_address_969e2d4f
      field: email.from.address
      pattern: "<%{email.from.address}>"
      ignore_missing: true
      ignore_failure: true
  - dissect:
      tag: dissect_email_to_address_3f03f6e9
      field: email.to.address
      pattern: "<%{email.to.address}>"
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_mimecast_tagMap_DangerousFileExt_8d291c4d
      field: mimecast.tagMap.DangerousFileExt
      ignore_missing: true
      ignore_failure: true
      processor:
        gsub:
          field: _ingest._key
          pattern: ':'
          replacement: '_'
          ignore_missing: true
  ### Cleanup
  - remove:
      tag: remove_44c4fea2
      description: Cleanup of repeated/unwanted/temporary fields.
      field:
        - mimecast.date
        - mimecast.fromUserEmailAddress
        - mimecast.userEmailAddress
      ignore_missing: true
  - script:
      description: Drops null/empty values recursively
      tag: script_to_drop_null_values
      lang: painless
      ignore_failure: true
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
# Error handling
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
