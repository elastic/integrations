---
description: Pipeline for processing Mimecast audit_events.
processors:
  # Generic event/ecs fields we always want to populate.
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_mimecast_d72eb09c
      description: Parse 'message' JSON contents into a 'mimecast' object.
      field: event.original
      target_field: mimecast
  - drop:
      tag: drop_dd4ed123
      if: ctx.mimecast?.eventTime == null || (ctx.mimecast?.data != null && ctx.mimecast.data.isEmpty())
  - fingerprint:
      tag: fingerprint_b0c83cf3
      fields:
        - mimecast.id
      target_field: "_id"
      ignore_missing: true
  - set:
      tag: set_event_category_4861796c
      field: event.category
      value: [email]

  - date:
      tag: date_mimecast_eventTime_e007390c
      description: Use 'mimecast.eventTime' as the '@timestamp'
      field: mimecast.eventTime
      timezone: UTC
      formats:
        - "yyyy-MM-dd'T'HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ssZ"
        - "yyyy-MM-dd'T'HH:mm:ss.Sz"
        - "yyyy-MM-dd'T'HH:mm:ss.SZ"
        - "yyyy-MM-dd'T'HH:mm:ss.SSz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSZ"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ"
        - "yyyy-MM-dd'T'HH:mm:ss z"

  ###

  # Convert 'mimecast.auditType' to a bone-cased event action.
  # ie: User Log On -> user-log-on
  - lowercase:
      tag: lowercase_mimecast_auditType_2cd969a3
      field: mimecast.auditType
      ignore_missing: true
  - gsub:
      tag: gsub_mimecast_auditType_ba5dc1e8
      field: mimecast.auditType
      pattern: " "
      replacement: "-"
      ignore_missing: true
  - rename:
      tag: rename_mimecast_auditType_to_event_action_e9c9153e
      field: mimecast.auditType
      target_field: event.action
      ignore_missing: true
  ###

  # User fields
  - rename:
      tag: rename_mimecast_user_to_user_email_a1ca6321
      field: mimecast.user
      target_field: user.email
      ignore_missing: true
  - rename:
      tag: rename_mimecast_id_to_event_id_c7737d91
      field: mimecast.id
      target_field: event.id
      ignore_missing: true

  ###
  # Here we want to add as much categorization information as possible
  # We can do this by parsing mimecast.eventInfo differently based on
  # what event.action is, etc.
  ###
  - grok:
      tag: grok_logon_authentication_failed
      field: mimecast.eventInfo
      if: ctx.event?.action=="logon-authentication-failed"
      patterns:
        - '^%{GREEDYDATA:mimecast.info},\sDate:\s%{DATE:mimecast.date},\sTime:\s%{TIME:mimecast.time} %{TIMEZONE:mimecast.timezone},\sIP:\s%{IP:client.ip},\sApplication:\s%{NOTSPACE:mimecast.application},(?:\sMethod:\s%{DATA:mimecast.method},)?\sReason:\s%{DATA:event.reason}$'
        - '^%{GREEDYDATA:mimecast.info},\sDate:\s%{DATE:mimecast.date},\sTime:\s%{TIME:mimecast.time}%{TIMEZONE:mimecast.timezone},\sIP:\s%{IP:client.ip},\sApplication:\s%{NOTSPACE:mimecast.application},\sRemote IP is %{IP:mimecast.remote_ip}$'
        - '^%{GREEDYDATA:mimecast.info},\s%{WORD} ?: ?%{DATA:mimecast.email.address}\[%{DATA:mimecast.email.metadata}\] remote IP ?: ?%{IP:mimecast.remote_ip} application ?: ?%{NOTSPACE:mimecast.application}$'
        - '^%{GREEDYDATA:mimecast.info},\sRemote IP is %{IP:mimecast.remote_ip}$'
      pattern_definitions:
        DATE: '%{YEAR}-%{MONTHNUM}-%{MONTHDAY}'
        TIMEZONE: '(?:[A-Z]{3,4}|(?:GMT)?[-+][0-9]{2}:?[0-9]{2})'
      ignore_missing: true
  - dissect:
      tag: dissect_mimecast_eventInfo_9234862f
      field: mimecast.eventInfo
      pattern: "%{mimecast.info}>, %{mimecast.rest_of_event_info}"
      if: 'ctx.mimecast?.info == null'
      ignore_missing: true
      ignore_failure: true
  - dissect:
      tag: dissect_mimecast_eventInfo_edaca02e
      field: mimecast.eventInfo
      pattern: "%{mimecast.info}, %{mimecast.rest_of_event_info}"
      if: 'ctx.mimecast?.info == null'
      ignore_missing: true
      ignore_failure: true
  - dissect:
      tag: dissect_mimecast_eventInfo_3c259f1f
      field: mimecast.eventInfo
      pattern: "%{?drop->} - %{mimecast.info}<%{user.email}> %{?key}: %{mimecast.date} %{?key}: %{mimecast.time} %{mimecast.timezone} %{?key}: %{client.ip} %{?key}: %{mimecast.application}"
      if: 'ctx.event?.action=="folder-log-entry" || ctx.event?.action=="custom-report-definition-created" || ctx.event?.action=="mimecast-support-login"'
      ignore_missing: true
      ignore_failure: true
  - kv:
      tag: kv_mimecast_rest_of_event_info_to_mimecast_event_info_parts_24e368e1
      field: mimecast.rest_of_event_info
      field_split: ", "
      value_split: ": "
      target_field: mimecast.event_info_parts
      ignore_failure: true
      ignore_missing: true
  - set:
      tag: set_mimecast_remote_4f408690
      field: mimecast.remote
      value: "{{{mimecast.rest_of_event_info}}}"
      if: 'ctx.event?.action=="user-logged-on" && ctx?.mimecast?.event_info_parts?.IP == null'
  - grok:
      tag: grok_mimecast_remote
      field: mimecast.remote
      patterns:
        - "%{IP:mimecast.remote_ip}"
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_mimecast_event_info_parts_Date_to_mimecast_date_08cb1db2
      field: mimecast.event_info_parts.Date
      target_field: mimecast.date
      ignore_missing: true
  - dissect:
      tag: dissect_mimecast_event_info_parts_Time_8303363c
      field: mimecast.event_info_parts.Time
      pattern: '%{mimecast.event_info_parts.Time} %{mimecast.timezone}'
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_mimecast_event_info_parts_Time_to_mimecast_time_74b26af8
      field: mimecast.event_info_parts.Time
      target_field: mimecast.time
      ignore_missing: true
  - rename:
      tag: rename_mimecast_event_info_parts_IP_to_client_ip_5c0b0ad0
      field: mimecast.event_info_parts.IP
      target_field: client.ip
      ignore_missing: true
  - rename:
      tag: rename_mimecast_event_info_parts_Application_to_mimecast_application_59a0a966
      field: mimecast.event_info_parts.Application
      target_field: mimecast.application
      ignore_missing: true
  - rename:
      tag: rename_mimecast_event_info_parts_Method_to_mimecast_method_689f5da8
      field: mimecast.event_info_parts.Method
      target_field: mimecast.method
      ignore_missing: true
  - rename:
      tag: rename_mimecast_event_info_parts_Reason_to_event_reason_184c4bcf
      field: mimecast.event_info_parts.Reason
      target_field: event.reason
      ignore_missing: true
  - rename:
      tag: rename_mimecast_info_to_mimecast_filename_938ce24b
      field: mimecast.info
      target_field: mimecast.filename
      ignore_missing: true
      if: 'ctx.event?.action == "threat-intel-feed-download"'
  - rename:
      tag: rename_mimecast_event_info_parts_Processed_to_email_origination_timestamp_23e5e7b5
      field: mimecast.event_info_parts.Processed
      target_field: email.origination_timestamp
      ignore_missing: true
  - rename:
      tag: rename_mimecast_event_info_parts_Subject_to_email_subject_dd821675
      field: mimecast.event_info_parts.Subject
      target_field: email.subject
      ignore_missing: true
  - rename:
      tag: rename_mimecast_event_info_parts_2FA_to_mimecast_2FA_8cdc043e
      field: mimecast.event_info_parts.2FA
      target_field: mimecast.2FA
      ignore_missing: true
  - dissect:
       tag: dissect_mimecast_event_info_parts_From_58719332
       field: mimecast.event_info_parts.From
       pattern: "<%{?drop}> %{email.from.address}"
       if: 'ctx.event?.action=="message-action"'
       ignore_missing: true
       ignore_failure: true
  - dissect:
       tag: dissect_mimecast_event_info_parts_To_28455ef4
       field: mimecast.event_info_parts.To
       pattern: "<%{?drop}> %{email.to.address}"
       if: 'ctx.event?.action=="message-action"'
       ignore_missing: true
       ignore_failure: true
  - dissect:
      tag: dissect_mimecast_eventInfo_8e88f4d5
      field: mimecast.eventInfo
      pattern: "[%{?key} : %{mimecast.export_type},%{?key} :%{mimecast.export_name},%{?key} :%{user.email},%{?key} :%{mimecast.weekday} %{mimecast.month} %{mimecast.monthday} %{mimecast.time} %{mimecast.timezone} %{mimecast.year},%{?key} :%{client.ip},%{?key} :%{mimecast.columns_exported},%{?key} : %{file.name},%{?key}: %{file.size},%{?key} : %{file.extension}], %{?key}: %{mimecast.date}, %{?key}: %{mimecast.time}, %{?key}: %{client.ip}, %{?key}: %{mimecast.application}"
      if: 'ctx.event?.action=="page-data-exports"'
      ignore_missing: true
      ignore_failure: true
  - grok:
      tag: grok_rest_of_event_info
      field: mimecast.rest_of_event_info
      patterns:
        - "%{IP:client.ip}"
      ignore_missing: true
      ignore_failure: true
      if: 'ctx?.event?.action=="user-logged-on" && ctx?.mimecast?.event_info_parts?.IP == null'
  - set:
      tag: set_email_from_address_0f71febc
      field: email.from.address
      value: ["{{{email.from.address}}}"]
      if: "ctx?.email?.from?.address != null"
  - set:
      tag: set_email_to_address_f0f0f9f3
      field: email.to.address
      value: ["{{{email.to.address}}}"]
      if: "ctx?.email?.to?.address != null"
  - dissect:
       tag: dissect_email_from_address_969e2d4f
       field: email.from.address
       pattern: "<%{email.from.address}>"
       ignore_missing: true
       ignore_failure: true
  - dissect:
       tag: dissect_email_to_address_3f03f6e9
       field: email.to.address
       pattern: "<%{email.to.address}>"
       ignore_missing: true
       ignore_failure: true
  - convert:
      tag: convert_file_size_02653c50
      field: file.size
      type: long
      ignore_missing: true
  - split:
      tag: split_user_email_to_user_parts_07aa1616
      field: user.email
      separator: "@"
      target_field: user.parts
      if: 'ctx?.user?.email != null'
  - set:
      tag: set_user_name_8dbd753e
      field: user.name
      copy_from: user.parts.0
      if: 'ctx?.user?.parts !=null && ctx?.user?.parts.length > 1'
  - set:
      tag: set_user_domain_11fbe89e
      field: user.domain
      copy_from: user.parts.1
      if: 'ctx?.user?.parts !=null && ctx?.user?.parts.length > 1'
  - rename:
      tag: rename_mimecast_filename_to_file_name_5ee6418c
      field: mimecast.filename
      target_field: file.name
      ignore_missing: true
      if: 'ctx?.mimecast?.filename != null && ctx?.event?.action == "threat-intel-feed-download"'
  - split:
      tag: split_file_name_to_file_parts_b6308be5
      field: file.name
      separator: "\\."
      target_field: file.parts
      if: 'ctx?.file?.name != null && ctx?.event?.action == "threat-intel-feed-download"'
  - script:
      tag: script_9b793198
      lang: painless
      source: |
        ctx.file.extension = ctx.file.parts[ctx.file.parts.length-1];
      if: 'ctx?.file?.parts !=null && ctx?.file?.parts.length > 1'
  - set:
      tag: set_event_created_a06e6881
      field: event.created
      value: "{{{mimecast.date}}} {{{mimecast.time}}}"
      if: 'ctx?.mimecast?.date != null && ctx?.mimecast?.time != null'
  - date:
      tag: date_event_created
      field: event.created
      target_field: event.created
      timezone: UTC
      formats:
        - yyyy-MM-dd HH:mm:ssZ
        - yyyy-MM-dd HH:mm:ss z
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssz
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.Sz
        - yyyy-MM-dd'T'HH:mm:ss.SZ
        - yyyy-MM-dd'T'HH:mm:ss.SSz
        - yyyy-MM-dd'T'HH:mm:ss.SSZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSz
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSz
        - yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ
        - yyyy-MM-dd'T'HH:mm:ss z
      if: ctx.event?.created != null
  - geoip:
      tag: geoip_client_ip_to_client_geo_90831252
      field: client.ip
      target_field: client.geo
      ignore_missing: true
  - geoip:
      tag: geoip_client_ip_to_client_as_f17fb2b3
      database_file: GeoLite2-ASN.mmdb
      field: client.ip
      target_field: client.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_client_as_asn_to_client_as_number_a6e30d01
      field: client.as.asn
      target_field: client.as.number
      ignore_missing: true
  - rename:
      tag: rename_client_as_organization_name_to_client_as_organization_name_817a526f
      field: client.as.organization_name
      target_field: client.as.organization.name
      ignore_missing: true
  - append:
      tag: append_related_ip_1bf248e3
      field: related.ip
      value: "{{{client.ip}}}"
      allow_duplicates: false
      if: ctx.client?.ip !=null
  - append:
      tag: append_related_ip_a328ed6f
      field: related.ip
      value: "{{{mimecast.remote_ip}}}"
      allow_duplicates: false
      if: ctx.mimecast?.remote_ip !=null
  - append:
      tag: append_related_user_570f5bce
      field: related.user
      value: "{{{user.name}}}"
      allow_duplicates: false
      if: 'ctx?.user?.name !=null'
  - append:
      tag: append_related_user_a5a03234
      field: related.user
      value: "{{{user.email}}}"
      allow_duplicates: false
      if: ctx?.user?.email != null
  - lowercase:
      tag: lowercase_email_direction_569c0270
      field: email.direction
      ignore_missing: true
  # Cleanup
  - remove:
      tag: remove_81a9e570
      description: Cleanup of repeated/unwanted/temporary fields.
      field:
        - mimecast.eventTime
        - user.parts
        - mimecast.date
        - mimecast.time
        - file.parts
        - mimecast.info
        - mimecast.type
        - mimecast.search
        - mimecast.description
        - mimecast.product
        - mimecast.provider
        - mimecast.filename
        - mimecast.criteria
        - mimecast.viewed
        - mimecast.byuser
        - mimecast.export_type
        - mimecast.export_name
        - mimecast.weekday
        - mimecast.month
        - mimecast.monthday
        - mimecast.year
        - mimecast.columns_exported
        - mimecast.as.asn
        - mimecast.organization_name
        - mimecast.event_info_parts
        - mimecast.rest_of_event_info
      ignore_missing: true
  - script:
      description: Drops null/empty values recursively
      tag: script_to_drop_null_values
      lang: painless
      ignore_failure: true
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
      

  ###

# Error handling
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
