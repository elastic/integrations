  - set:
      field: result.evaluation
      tag: set_result_evaluation_unknown_469139ba
      value: unknown
      if: ctx.aws_securityhub?.finding?.compliance?.status_id == '0' || ctx.aws_securityhub?.finding?.compliance?.status_id == '2'
  - set:
