  - set:
      field: rule.ruleset
      tag: set_rule_ruleset_from_finding_compliance_requirements_cea80123
      copy_from: aws_securityhub.finding.compliance.requirements
      ignore_empty_value: true
  - script:
      description: Map rule.remediation and rule.reference field.
      tag: script_map_rule_remediation_and_rule_reference_field_e8b2fdb8
      lang: painless
      source: |-
        ctx.rule = ctx.rule ?: [:];

        def remediation = ctx.aws_securityhub?.finding?.remediation;
        if (remediation == null && ctx.aws_securityhub?.finding?.vulnerabilities instanceof List && ctx.aws_securityhub.finding.vulnerabilities.size() > 0) {
          remediation = ctx.aws_securityhub.finding.vulnerabilities[0].remediation;
        }

        def desc = remediation?.desc;
        if (remediation?.references instanceof List) {
          def separator = String.valueOf((char)10);
          for (def ref: remediation.references) {
            desc += separator + ref;
          }
        }

        ctx.rule.remediation = desc;
        ctx.rule.reference = remediation?.references;
      on_failure:
        - append:
            tag: append_error_message_1dbb93e7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

