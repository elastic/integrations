      if: ctx.aws_securityhub?.finding?.osint instanceof List
      source: |-
        ctx.related = ctx.related ?: [:];
        ctx.related.ip = ctx.related.ip ?: [];
        ctx.related.hosts = ctx.related.hosts ?: [];
        ctx.related.hash = ctx.related.hash ?: [];
        for (def o: ctx.aws_securityhub.finding.osint) {
          if (o.type_id == '1') { // IP Address
            ctx.related.ip.add(o.value);
          } else if (o.type_id == '2' || o.type_id == '3') { // Domain, Hostname
            ctx.related.hosts.add(o.value);
          } else if (o.type_id == '4') { // Hash
            ctx.related.hash.add(o.value);
          } else if (o.type_id == '9') { // Email Address
            ctx.related.user.add(o.value);
          }
        }
