---
description: Pipeline for processing Source logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      field: ecs.version
      value: 8.11.0
      tag: set_ecs_version_6b2cef5e
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_a7b1f822
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - json:
      field: event.original
      tag: json_decoding_c3a1053e
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_8075efaa
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - drop:
      if: ctx.json?.sources != null && ctx.json.sources.isEmpty()
      tag: drop_sources_4b05d081
  - rename:
      field: json.description
      target_field: google_scc.source.description
      tag: rename_description_30f488e3
      ignore_missing: true
  - set:
      field: message
      tag: set_message_64e21683
      copy_from: google_scc.source.description
      ignore_empty_value: true
  - rename:
      field: json.canonicalName
      target_field: google_scc.source.canonical_name
      tag: rename_canonicalName_e5a5ed71
      ignore_missing: true
  - rename:
      field: json.displayName
      target_field: google_scc.source.display_name
      tag: rename_displayName_914adc36
      ignore_missing: true
  - rename:
      field: json.name
      target_field: google_scc.source.name
      tag: rename_name_1665d6de
      ignore_missing: true
  - grok:
      description: Extract Source ID and Organization ID.
      field: google_scc.source.name
      tag: grok_to_extract_source_id_and_organization_id_b3fe5b31
      if: ctx.google_scc?.source?.name != null
      patterns:
        - '^organizations/%{DATA:organization.id}/sources/%{DATA:google_scc.source.id}$'
      on_failure:
        - append:
            tag: append_error_message_75163151
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - remove:
      field:
        - google_scc.source.description
      tag: remove_duplicate_custom_fields_aacf6d36
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - script:
      lang: painless
      description: Drops null/empty values recursively.
      tag: painless_remove_null_f6a89620
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_90b2144c
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
