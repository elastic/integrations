title: "Apache HTTP Server Metrics"
type: metrics
dataset: apachereceiver
streams:
  - input: otelcol
    title: Apache HTTP Server status metrics
    description: >-
      Collect Apache HTTP Server status metrics from mod_status using the OTel Collector apachereceiver.
    template_path: stream.yml.hbs
    vars:
      # Connection settings
      - name: endpoint
        type: text
        required: true
        title: Endpoint
        description: The URL of the Apache server-status endpoint.
        default: http://localhost:8080/server-status?auto
        show_user: true
      # Collection settings
      - name: collection_interval
        type: duration
        required: false
        title: Collection Interval
        description: Time between each collection (e.g., 10s, 1m).
        default: 10s
        show_user: false
      - name: initial_delay
        type: duration
        required: false
        title: Initial Delay
        description: Defines how long this receiver waits before starting.
        default: 1s
        show_user: false
      # HTTP client settings
      - name: timeout
        type: duration
        required: false
        title: HTTP Timeout
        description: HTTP request timeout (e.g., 10s, 30s).
        default: 10s
        show_user: false
      # TLS settings
      - name: tls_enabled
        type: bool
        title: Enable TLS Configuration
        required: false
        description: Enable TLS configuration for HTTPS endpoints
        default: false
        show_user: true
      - name: tls_insecure
        type: bool
        required: false
        title: Disable TLS
        description: Whether to disable client transport security for the connection. Set to true to disable TLS.
        default: false
        show_user: false
      - name: tls_insecure_skip_verify
        type: bool
        required: false
        title: Skip TLS Verification
        description: Set to true to skip TLS certificate verification.
        default: false
        show_user: false
      - name: tls_ca_file
        type: text
        required: false
        title: TLS CA File
        description: Path to the CA certificate file for TLS verification.
        show_user: false
      - name: tls_cert_file
        type: text
        required: false
        title: TLS Certificate File
        description: Path to the client TLS certificate file.
        show_user: false
      - name: tls_key_file
        type: text
        required: false
        title: TLS Key File
        description: Path to the client TLS key file.
        show_user: false
      - name: tls_server_name_override
        type: text
        required: false
        title: TLS Server Name Override
        description: Override the server name used for TLS verification.
        show_user: false
