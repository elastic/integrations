---
description: >
  Shape aidmaster lookup documents for LOOKUP JOIN. Rename crowdstrike to crowdstrike.info.host,
  copy ECS host.* into crowdstrike.info.host.* so no data is lost, then keep only host.id and crowdstrike.info.
processors:
  - rename:
      tag: rename_crowdstrike_to_crowdstrike_info_host_82dc237a
      field: crowdstrike
      target_field: crowdstrike.info.host
      ignore_missing: true
  - set:
      tag: set_crowdstrike_info_host_last_seen_ff2ceb37
      field: crowdstrike.info.host._last_seen
      copy_from: "@timestamp"
      ignore_empty_value: true
  # Copy ECS host.* into crowdstrike.info.host.* so we retain them when we drop host.*
  - rename:
      tag: rename_host_hostname_to_crowdstrike_info_host_hostname_cc0ad6a9
      field: host.hostname
      target_field: crowdstrike.info.host.hostname
      ignore_missing: true
  - rename:
      tag: rename_host_name_to_crowdstrike_info_host_name_45c255d1
      field: host.name
      target_field: crowdstrike.info.host.name
      ignore_missing: true
  - rename:
      tag: rename_host_domain_to_crowdstrike_info_host_domain_2b4de92e
      field: host.domain
      target_field: crowdstrike.info.host.domain
      ignore_missing: true
  - rename:
      tag: rename_host_ip_to_crowdstrike_info_host_ip_9cfe064e
      field: host.ip
      target_field: crowdstrike.info.host.ip
      ignore_missing: true
  - rename:
      tag: rename_host_os_type_to_crowdstrike_info_host_os_type_aea82e6d
      field: host.os.type
      target_field: crowdstrike.info.host.os_type
      ignore_missing: true
  - rename:
      tag: rename_host_os_version_to_crowdstrike_info_host_os_version_93932ac1
      field: host.os.version
      target_field: crowdstrike.info.host.os_version
      ignore_missing: true
  - rename:
      tag: rename_host_geo_city_name_to_crowdstrike_info_host_geo_city_name_4917c77b
      field: host.geo.city_name
      target_field: crowdstrike.info.host.geo_city_name
      ignore_missing: true
  - rename:
      tag: rename_host_geo_continent_name_to_crowdstrike_info_host_geo_continent_name_65ddbf89
      field: host.geo.continent_name
      target_field: crowdstrike.info.host.geo_continent_name
      ignore_missing: true
  - rename:
      tag: rename_host_geo_country_name_to_crowdstrike_info_host_geo_country_name_59fddf48
      field: host.geo.country_name
      target_field: crowdstrike.info.host.geo_country_name
      ignore_missing: true
  - rename:
      tag: rename_host_geo_timezone_to_crowdstrike_info_host_geo_timezone_69ba5492
      field: host.geo.timezone
      target_field: crowdstrike.info.host.geo_timezone
      ignore_missing: true
  - remove:
      tag: remove_dbfe1d38
      keep:
        - host.id
        - crowdstrike.info
      ignore_missing: true
