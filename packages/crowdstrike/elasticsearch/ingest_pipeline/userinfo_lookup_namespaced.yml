---
description: >
  Shape user lookup documents for LOOKUP JOIN. Build the synthetic
  composite key, copy @timestamp to a retention field, rename ECS and
  crowdstrike user fields to crowdstrike.info.user.*, then keep only
  host_user_key and crowdstrike.info.
processors:
  - set:
      tag: set_host_user_key_d56252aa
      field: host_user_key
      value: "{{{host.id}}}::{{{user.id}}}"
  - set:
      tag: set_crowdstrike_info_user_last_seen_c6f4ad01
      field: crowdstrike.info.user._last_seen
      copy_from: "@timestamp"
      ignore_empty_value: true
  - rename:
      tag: rename_user_name_to_crowdstrike_info_user_name_74890e9c
      field: user.name
      target_field: crowdstrike.info.user.name
      ignore_missing: true
  - rename:
      tag: rename_user_domain_to_crowdstrike_info_user_domain_3b9d985e
      field: user.domain
      target_field: crowdstrike.info.user.domain
      ignore_missing: true
  - rename:
      tag: rename_user_roles_to_crowdstrike_info_user_roles_9529f43b
      field: user.roles
      target_field: crowdstrike.info.user.roles
      ignore_missing: true
  - rename:
      tag: rename_user_email_to_crowdstrike_info_user_principal_cd01b5fb
      field: user.email
      target_field: crowdstrike.info.user.principal
      ignore_missing: true
  - rename:
