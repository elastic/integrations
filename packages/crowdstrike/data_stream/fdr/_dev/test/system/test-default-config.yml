input: aws-s3
skip_ignored_fields:
  - crowdstrike.ConfigStateData
  - crowdstrike.FeatureVector
  - crowdstrike.OSVersionFileData
  - process.command_line
data_stream:
  vars:
    access_key_id: "{{AWS_ACCESS_KEY_ID}}"
    secret_access_key: "{{AWS_SECRET_ACCESS_KEY}}"
    session_token: "{{AWS_SESSION_TOKEN}}"
    queue_url: "{{TF_OUTPUT_queue_url}}"
    preserve_original_event: true
    enable_deduplication: true
assert:
  # Sample has 138 lines (132 data + 5 aidmaster + 1 userinfo).
  # Two data events are duplicates; with deduplication enabled hit_count is 136.
  hit_count: 136
