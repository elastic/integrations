---
processors:
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      field: event.category
      value:
        - network
        - session
      tag: append_network_category_900f899c
  - append:
      field: event.action
      value: remote_response_session_end_event
      tag: append_remote_action_578b015d
  - append:
      field: event.type
      value: end
      tag: append_end_type_3489e0c1
  - grok:
      tag: grok_crowdstrike_event_UserName_6c9dafb5
      field: crowdstrike.event.UserName
      patterns:
        - '%{USERNAME:user.name}@%{HOSTNAME:user.domain}'
        - '%{GREEDYDATA:user.name}'
      ignore_missing: true
      ignore_failure: true
  - set:
      field: user.email
      copy_from: crowdstrike.event.UserName
      tag: copy_user_email_79093eaf
      if: ctx.crowdstrike?.event?.UserName != null && ctx.crowdstrike.event.UserName.indexOf("@") > 0
  - date:
      field: crowdstrike.event.EndTimestamp
      target_field: event.end
      timezone: UTC
      formats:
        - UNIX_MS
      tag: date_end_timestamp_ms_2647d417
      if: 'ctx.crowdstrike?.event?.EndTimestamp != null && String.valueOf(ctx.crowdstrike.event.EndTimestamp).length() >= 12'
  - date:
      field: crowdstrike.event.EndTimestamp
      target_field: event.end
      timezone: UTC
      formats:
        - UNIX
      tag: date_end_timestamp_1ece99cf
      if: 'ctx.crowdstrike?.event?.EndTimestamp != null && String.valueOf(ctx.crowdstrike.event.EndTimestamp).length() <= 11'
  - set:
      field: message
      value: Remote response session ended.
      tag: set_message_0ab35e9a
  - rename:
      field: crowdstrike.event.HostnameField
      target_field: host.name
      ignore_missing: true
      tag: rename_hostname_field_2ba02124

on_failure:
  - append:
      tag: append_error_message_9c9ce5dc
      field: error.message
      value: |-
        Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
