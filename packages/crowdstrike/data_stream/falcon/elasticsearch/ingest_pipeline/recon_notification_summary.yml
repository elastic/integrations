---
processors:
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      field: event.category
      value: threat
      tag: append_threat_category_4039b90d
  - append:
      field: event.type
      value: indicator
      tag: append_indicator_type_d4da06cc
  - set:
      tag: set_event_action_8e0d2082
      field: event.action
      value: recon-notification
      if: ctx.crowdstrike?.event?.ItemType == null
  - set:
      tag: set_event_action_d066e9f9
      field: event.action
      value: "recon-notification-{{{crowdstrike.event.ItemType}}}"
      if: ctx.crowdstrike?.event?.ItemType != null
  - rename:
      field: crowdstrike.event.ItemId
      target_field: event.id
      ignore_missing: true
      tag: rename_item_id_f837b339
  - rename:
      field: crowdstrike.event.RuleId
      target_field: rule.id
      ignore_missing: true
      tag: rename_rule_id_01ec8a4e
  - rename:
      field: crowdstrike.event.RuleName
      target_field: rule.name
      ignore_missing: true
      tag: rename_rule_name_7d268017
  - set:
      field: rule.ruleset
      copy_from: crowdstrike.event.RuleTopic
      ignore_empty_value: true
      tag: set_rule_ruleset_a4dd83bd
  - rename:
      field: crowdstrike.event.RuleTopic
      target_field: rule.description
      ignore_missing: true
      tag: rename_rule_topic_e83e13db
  - date:
      field: crowdstrike.event.MatchedTimestamp
      target_field: event.created
      timezone: UTC
      formats:
        - UNIX_MS
      tag: date_event_matched_timestamp_ms_6a45e987
      if: "ctx.crowdstrike?.event?.MatchedTimestamp != null && String.valueOf(ctx.crowdstrike.event.MatchedTimestamp).length() >= 12"
  - date:
      field: crowdstrike.event.MatchedTimestamp
      target_field: event.created
      timezone: UTC
      formats:
        - UNIX
      tag: date_event_matched_timestamp_981ef8cc
      if: 'ctx.crowdstrike?.event?.MatchedTimestamp != null && String.valueOf(ctx.crowdstrike.event.MatchedTimestamp).length() <= 11'
  - date:
      field: crowdstrike.event.ItemPostedTimestamp
      target_field: event.created
      timezone: UTC
      formats:
        - UNIX_MS
      tag: date_item_posted_timestamp_ms_6a6ebff1
      if: "ctx.crowdstrike?.event?.ItemPostedTimestamp != null && String.valueOf(ctx.crowdstrike.event.ItemPostedTimestamp).length() >= 12"
  - date:
      field: crowdstrike.event.ItemPostedTimestamp
      target_field: event.created
      timezone: UTC
      formats:
        - UNIX
      tag: date_item_posted_timestamp_51bae4b7
      if: 'ctx.crowdstrike?.event?.ItemPostedTimestamp != null && String.valueOf(ctx.crowdstrike.event.ItemPostedTimestamp).length() <= 11'

on_failure:
  - append:
      tag: append_error_message_9c9ce5dc
      field: error.message
      value: |-
        Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
