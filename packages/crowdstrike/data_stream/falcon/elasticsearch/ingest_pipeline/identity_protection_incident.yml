---
processors:
  - set:
      field: event.kind
      value: event
      tag: set_event_kind_d452ef2c
  - append:
      field: event.category
      value: iam
      tag: append_iam_category_0eb47497
  - append:
      field: event.type
      value: info
      tag: append_info_type_5eab37e6
  - rename:
      field: crowdstrike.event.IncidentType
      target_field: event.action
      ignore_missing: true
      tag: rename_incident_type_8ca44cca
  - rename:
      field: crowdstrike.event.IncidentDescription
      target_field: message
      ignore_missing: true
      tag: rename_incident_description_0dd71452
  - rename:
      field: crowdstrike.event.IdentityProtectionIncidentId
      target_field: event.id
      ignore_missing: true
      tag: rename_identity_protection_incident_id_a9ea0491
  - rename:
      field: crowdstrike.event.FalconHostLink
      target_field: event.reference
      ignore_missing: true
      tag: rename_falcon_host_link_7d3b772f
  - rename:
      field: crowdstrike.event.UserName
      target_field: user.name
      ignore_missing: true
      tag: rename_user_name_ab44b1da
  - dissect:
      if: ctx.user?.name != null && ctx.user.name.contains('\\')
      tag: dissect_user_name_2039f0e5
      field: user.name
      pattern: '%{user.domain}\%{user.name}'
  - rename:
      field: crowdstrike.event.EndpointName
      target_field: host.hostname
      ignore_missing: true
      tag: rename_endpoint_name_58d4d0a6
  - append:
      field: host.ip
      value: '{{{crowdstrike.event.EndpointIp}}}'
      if: ctx.crowdstrike?.event?.EndpointIp != null && ctx.crowdstrike.event.EndpointIp != ''
      tag: append_host_ip_b4e0149f
  - remove:
      field: crowdstrike.event.EndpointIp
      if: ctx.crowdstrike?.event?.EndpointIp != null
      tag: remove_host_ip_aef8a67e
  - convert:
      field: crowdstrike.event.StartTime
      type: string
      tag: convert_start_time_epoch_8473a450
      ignore_missing: true
      if: ctx.crowdstrike?.event?.StartTime != null
  - gsub:
      field: crowdstrike.event.StartTime
      pattern: "\\d{6}$"
      replacement: ""
      tag: gsub_start_time_epoch_fdcdc432
      if: "ctx.crowdstrike?.event?.StartTime != null && ctx.crowdstrike.event.StartTime.length() > 18"
  - date:
      field: crowdstrike.event.StartTime
      target_field: event.start
      timezone: UTC
      formats:
        - UNIX_MS
      tag: date_event_start_time_epoch_ms_24d4db1c
      if: "ctx.crowdstrike?.event?.StartTime != null && ctx.crowdstrike.event.StartTime.length() >= 12"
  - date:
      field: crowdstrike.event.StartTime
      target_field: event.start
      timezone: UTC
      formats:
        - UNIX
      tag: date_event_start_time_epoch_b6a1bedf
      if: 'ctx.crowdstrike?.event?.StartTime != null && ctx.crowdstrike.event.StartTime.length() <= 11'
  - convert:
      field: crowdstrike.event.EndTime
      type: string
      tag: convert_end_time_epoch_3e957e29
      ignore_missing: true
      if: ctx.crowdstrike?.event?.EndTime != null
  - gsub:
      field: crowdstrike.event.EndTime
      pattern: "\\d{6}$"
      replacement: ""
      tag: gsub_end_time_epoch_20a11650
      if: "ctx.crowdstrike?.event?.EndTime != null && ctx.crowdstrike.event.EndTime.length() > 18"
  - date:
      field: crowdstrike.event.EndTime
      target_field: event.end
      timezone: UTC
      formats:
        - UNIX_MS
      tag: date_event_end_time_epoch_ms_f22ca139
      if: "ctx.crowdstrike?.event?.EndTime != null && ctx.crowdstrike.event.EndTime.length() >= 12"
  - date:
      field: crowdstrike.event.EndTime
      target_field: event.end
      timezone: UTC
      formats:
        - UNIX
      tag: date_event_end_time_epoch_54a08e9c
      if: 'ctx.crowdstrike?.event?.EndTime != null && ctx.crowdstrike.event.EndTime.length() <= 11'
  - set:
      field: '@timestamp'
      copy_from: event.start
      tag: copy_timestamp_from_event_start_080b2fb1
      if: ctx.event?.start != null
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_9c9ce5dc
      field: error.message
      value: |-
        Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
