---
description: Pipeline for parsing cloudflare audit logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - drop:
      tag: drop_1f98c811
      if: ctx.json?.result != null && ctx.json.result.isEmpty()
  - set:
      tag: set_cloud_provider_6ba9fce1
      field: cloud.provider
      value: cloudflare
  - set:
      tag: set_cloud_account_id_17f34d1c
      field: cloud.account.id
      copy_from: _config.account_id
      ignore_empty_value: true
  - date:
      tag: date_json_when_to_timestamp_8e632750
      field: json.when
      formats:
        - ISO8601
      timezone: UTC
      target_field: "@timestamp"
  - rename:
      tag: rename_json_action_type_to_event_action_98ec23d8
      field: json.action.type
      target_field: event.action
      ignore_missing: true
  - lowercase:
      tag: lowercase_event_action_9334b869
      field: event.action
      ignore_missing: true
  - set:
      tag: set_event_outcome_c2e2b880
      field: event.outcome
      value: success
      if: ctx.json?.action?.result
  - set:
      tag: set_event_outcome_6415772a
      field: event.outcome
      value: failure
      if: "!ctx.json?.action?.result"
  - rename:
      tag: rename_json_actor_email_to_user_email_21b82796
      field: json.actor.email
      target_field: user.email
      ignore_missing: true
  - rename:
      tag: rename_json_actor_id_to_user_id_c93daafc
      field: json.actor.id
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_json_actor_ip_to_source_address_518a4c23
      field: json.actor.ip
      target_field: source.address
      ignore_missing: true
  - convert:
      tag: convert_source_address_to_source_ip_48c76f83
      field: source.address
      target_field: source.ip
      type: ip
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_json_actor_type_to_cloudflare_audit_actor_type_2378bc50
      field: json.actor.type
      target_field: cloudflare.audit.actor.type
      ignore_missing: true
  - rename:
      tag: rename_json_id_to_event_id_6438e920
      field: json.id
      target_field: event.id
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_to_id_f716d506
      fields:
        - event.id
      target_field: _id
      ignore_missing: true
  - rename:
      tag: rename_json_interface_to_event_provider_8a6b6142
      field: json.interface
      target_field: event.provider
      ignore_missing: true
      if: ctx.json?.interface != ""
  - rename:
      tag: rename_json_metadata_to_cloudflare_audit_metadata_873a7968
      field: json.metadata
      target_field: cloudflare.audit.metadata
      ignore_missing: true
  - rename:
      tag: rename_json_newValueJson_to_cloudflare_audit_new_value_ec00ed15
      field: json.newValueJson
      target_field: cloudflare.audit.new_value
      ignore_missing: true
  - rename:
      tag: rename_json_oldValueJson_to_cloudflare_audit_old_value_78009697
      field: json.oldValueJson
      target_field: cloudflare.audit.old_value
      ignore_missing: true
  - rename:
      tag: rename_json_newValue_to_cloudflare_audit_new_value_value_30d3aff9
      field: json.newValue
      target_field: cloudflare.audit.new_value.value
      ignore_missing: true
      if: ctx.json?.newValue != "null"
  - rename:
      tag: rename_json_oldValue_to_cloudflare_audit_old_value_value_a209cb1c
      field: json.oldValue
      target_field: cloudflare.audit.old_value.value
      ignore_missing: true
      if: ctx.json?.oldValue != "null"
  - rename:
      tag: rename_json_owner_id_to_cloudflare_audit_owner_id_9f5cdbae
      field: json.owner.id
      target_field: cloudflare.audit.owner.id
      ignore_missing: true
  - rename:
      tag: rename_json_resource_to_cloudflare_audit_resource_86511a86
      field: json.resource
      target_field: cloudflare.audit.resource
      ignore_missing: true
  - append:
      tag: append_related_user_7f407fef
      field: related.user
      value: "{{{user.id}}}"
      allow_duplicates: false
      if: ctx.user?.id != null
  - append:
      tag: append_related_user_32ef93b4
      field: related.user
      value: "{{{cloudflare.audit.resource.id}}}"
      allow_duplicates: false
      if: ctx.cloudflare?.audit?.resource?.id != null && ctx.cloudflare?.audit?.resource?.type == "user"
  - append:
      tag: append_related_ip_86933b04
      field: related.ip
      value: "{{{source.ip}}}"
      if: ctx.source?.ip != null
  - script:
      lang: painless
      tag: add_ecs_categorization_76d9b8ff
      params:
        login:
          category:
            - authentication
          type:
            - info
          outcome: success
        token_create:
          category:
            - iam
          type:
            - creation
        token_revoke:
          category:
            - iam
          type:
            - deletion
        token_roll:
          category:
            - iam
          type:
            - change
        api_key_view:
          category:
            - iam
          type:
            - info
        rotate_api_key:
          category:
            - iam
          type:
            - change
        api_key_created:
          category:
            - iam
          type:
            - creation
        purge:
          category:
            - configuration
          type:
            - deletion
        tls_settings_deployed:
          category:
            - configuration
          type:
            - info
        add:
          category:
            - configuration
          type:
            - creation
        delete:
          category:
            - configuration
          type:
            - deletion
        rec_add:
          category:
            - configuration
          type:
            - creation
        rec_del:
          category:
            - configuration
          type:
            - deletion
        pending:
          category:
            - configuration
          type:
            - info
        change_setting:
          category:
            - configuration
          type:
            - change
        add_enforce_twofactor:
          category:
            - iam
            - configuration
          type:
            - admin
            - info
      source: >-
        ctx.event.kind = 'event';
        ctx.event.type = 'info';
        if (ctx?.event?.action == null) {
            return;
        }
        if (params.get(ctx.event.action) == null) {
            return;
        }
        def hm = new HashMap(params.get(ctx.event.action));
        hm.forEach((k, v) -> ctx.event[k] = v);
  - remove:
      tag: remove_55601eab
      field:
        - json
        - _config
      ignore_missing: true
  - script:
      tag: script_processor_iterates_over_whole_document_4d6993cb
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        void handleMap(Map map) {
          for (def x : map.values()) {
            if (x instanceof Map) {
                handleMap(x);
            } else if (x instanceof List) {
                handleList(x);
            }
          }
          map.values().removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        void handleList(List list) {
          for (def x : list) {
              if (x instanceof Map) {
                  handleMap(x);
              } else if (x instanceof List) {
                  handleList(x);
              }
          }
          list.removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        handleMap(ctx);
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
