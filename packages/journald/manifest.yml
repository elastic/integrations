format_version: 3.3.0
name: journald
title: "Custom Journald logs"
version: 1.3.0
description: Collect logs from journald with Elastic Agent.
type: input
categories:
  - observability
  - custom
conditions:
  kibana:
    version: "^8.8.0 || ^9.0.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/systemd-logo.svg
    title: systemd logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: logs
    type: logs
    title: Journald logs
    description: Collect journald logs
    input: journald
    template_path: journald.yml.hbs
    vars:
      - name: include_matches
        type: text
        title: Include Matches
        multi: true
        show_user: true
        description: >
          A list of filter expressions used to select the logs to read (for example `_SYSTEMD_UNIT=vault.service`). Defaults to all logs. See [include_matches](https://www.elastic.co/guide/en/beats/filebeat/7.x/filebeat-input-journald.html#filebeat-input-journald-include-matches) for details.

      - name: seek
        type: text
        title: Seek
        multi: false
        required: false
        show_user: true
        description: >
          Position to start reading the journal from. Valid values are `head` (beginning), `tail` (end), or `since`
          (the position defined by the `since` option). Defaults to cursor-based resumption or `tail` on first run.

      - name: since
        type: text
        title: Since
        multi: false
        required: false
        show_user: false
        description: >
          A time offset from the current time to start reading when `seek` is set to `since` (for example `-24h`, `-1h30m`).

      - name: units
        type: text
        title: Units
        multi: true
        required: false
        show_user: true
        description: >
          A list of systemd unit names to collect logs from (for example `nginx.service`, `sshd.service`).
          Equivalent to using `include_matches` with `_SYSTEMD_UNIT=` expressions.

      - name: syslog_identifiers
        type: text
        title: Syslog Identifiers
        multi: true
        required: false
        show_user: false
        description: >
          A list of syslog identifiers to filter by (for example `sudo`, `su`).

      - name: transports
        type: text
        title: Transports
        multi: true
        required: false
        show_user: false
        description: >
          A list of transports to collect logs from. Valid values are `audit`, `driver`, `syslog`, `journal`,
          `stdout`, and `kernel`. Defaults to all transports.

      - name: facilities
        type: text
        title: Facilities
        multi: true
        required: false
        show_user: false
        description: >
          A list of numeric syslog facility codes to filter by (for example `0` for kern, `3` for daemon, `6` for lpr).

      - name: merge
        type: bool
        title: Merge
        multi: false
        required: false
        show_user: false
        default: false
        description: >
          When enabled, log entries are ingested interleaved from all available journals when `paths` points to a directory.

      - name: paths
        type: text
        title: Journal paths
        multi: true
        show_user: false
        description: >
          List of journals to read from. Defaults to the system journal.

      - name: chroot
        type: text
        title: Chroot
        multi: false
        required: false
        show_user: false
        description: >
          The directory to use as the root when calling journalctl. Requires the `SYS_CHROOT` capability.

      - name: journalctl_path
        type: text
        title: Journalctl Path
        multi: false
        required: false
        show_user: false
        description: >
          Path to the journalctl binary. Defaults to searching `PATH`. Required when `chroot` is set (defaults to `/usr/bin/journalctl`).

      - name: tags
        type: text
        title: Tags
        description: >
          Tags to include in the published event.

        multi: true
        required: true
        show_user: false
        default:
          - journald-log
      - name: parsers
        type: yaml
        title: Parsers
        multi: false
        required: false
        show_user: false
        description: >
          A list of parsers to apply to each log line. Supported parsers include `multiline`, `ndjson`, `container`, and `syslog`.
          See [Parsers](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-journald.html#_parsers) for details.

      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata.  This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
      - name: condition
        title: Condition
        description: Condition to filter when to run this input. See [Dynamic Input Configuration](https://www.elastic.co/guide/en/fleet/current/dynamic-input-configuration.html) for details.
        type: text
        multi: false
        required: false
        show_user: true

owner:
  github: elastic/elastic-agent-data-plane
  type: elastic
