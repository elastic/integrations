---
description: Pipeline for Palo Alto XDR API.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_a6172163
      description: Use 'event.original' if present (e.g. when reprocessing), otherwise 'message'.
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - set:
      tag: set_event_kind_39295792
      field: event.kind
      value: alert
  - append:
      tag: append_event_category_557b9332
      field: event.category
      value: malware
      allow_duplicates: false
  - append:
      tag: append_event_type_3f43a39d
      field: event.type
      value: info
      allow_duplicates: false
  - json:
      tag: json_event_original_to_panw_cortex_xdr_8d2b549c
      field: event.original
      target_field: panw_cortex.xdr
  - drop:
      tag: drop_c1f77990
      if: ctx.panw_cortex?.xdr?.reply?.result_count == 0
  - script:
      tag: script_drops_null_empty_values_recursively_7e38081f
      description: Drops null/empty values recursively
      lang: painless
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
  - pipeline:
      name: '{{ IngestPipeline "v1_pipeline" }}'
      if: ctx._conf?.api == null || ctx._conf?.api == 'v1'
      tag: v1_pipeline_f8ae250c
  - pipeline:
      name: '{{ IngestPipeline "v2_pipeline" }}'
      if: ctx._conf?.api == 'v2'
      tag: v2_pipeline_4077303d
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
