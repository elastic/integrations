- name: panw_cortex
  type: group
  fields:
    - name: xdr
      type: group
      fields:
        - name: event
          type: group
          fields:
            - name: id
              type: keyword
            - name: action
              type: group
              fields:
                - name: boot_time
                  type: date
                - name: file
                  type: group
                  fields:
                    - name: access_time
                      type: date
                    - name: attributes
                      type: keyword
                    - name: create_time
                      type: date
                    - name: device_type
                      type: keyword
                    - name: group
                      type: keyword
                    - name: group_name
                      type: keyword
                    - name: is_anonymous
                      type: boolean
                    - name: last_writer_actor
                      type: keyword
                    - name: md5
                      type: keyword
                    - name: mod_time
                      type: date
                    - name: mode
                      type: flattened
                      description: UNIX file permissions mask record.
                    - name: name
                      type: keyword
                    - name: operation_flags
                      type: keyword
                    - name: owner
                      type: keyword
                    - name: owner_name
                      type: keyword
                    - name: path
                      type: keyword
                    - name: pe_info
                      type: flattened
                      description: PE information record, usually present on some write-file events.
                    - name: prev_type
                      type: keyword
                    - name: previous_file_name
                      type: keyword
                    - name: previous_file_path
                      type: keyword
                    - name: sha256
                      type: keyword
                    - name: signature_is_embedded
                      type: boolean
                    - name: signature_product
                      type: keyword
                    - name: signature_status
                      type: keyword
                    - name: signature_vendor
                      type: keyword
                    - name: size
                      type: long
                    - name: type
                      type: keyword
                - name: local_ip
                  type: ip
                - name: local_port
                  type: long
                - name: module
                  type: group
                  fields:
                    - name: base_address
                      type: keyword
                    - name: boot_code_integrity
                      type: keyword
                    - name: code_integrity
                      type: keyword
                    - name: file_info
                      type: keyword
                    - name: image_size
                      type: long
                      description: Loaded image size in bytes.
                    - name: last_writer_actor
                      type: keyword
                    - name: md5
                      type: keyword
                    - name: other_load_location
                      type: keyword
                    - name: page_protection
                      type: keyword
                    - name: path
                      type: keyword
                    - name: sha256
                      type: keyword
                    - name: signature_is_embedded
                      type: boolean
                    - name: signature_product
                      type: keyword
                    - name: signature_status
                      type: keyword
                    - name: signature_vendor
                      type: keyword
                    - name: system_properties
                      type: keyword
                - name: network
                  type: group
                  fields:
                    - name: connection_id
                      type: keyword
                    - name: creation_time
                      type: date
                    - name: is_server
                      type: boolean
                    - name: protocol
                      type: keyword
                    - name: stats_is_last
                      type: boolean
                - name: powered_off
                  type: boolean
                  description: Whether the host was powered off.
                - name: process
                  type: group
                  fields:
                    - name: fds
                      type: flattened
                      description: Unix file-descriptor information for stdin, stdout, and stderr.
                    - name: image_command_line
                      type: keyword
                    - name: image_extension
                      type: keyword
                    - name: image_md5
                      type: keyword
                    - name: image_name
                      type: keyword
                    - name: image_path
                      type: keyword
                    - name: image_sha256
                      type: keyword
                    - name: in_txn
                      type: boolean
                    - name: instance_execution_time
                      type: date
                    - name: instance_id
                      type: keyword
                    - name: integrity_level
                      type: keyword
                    - name: last_writer_actor
                      type: keyword
                    - name: os_pid
                      type: long
                    - name: pe_load_info
                      type: flattened
                      description: Windows information about the loaded PE image.
                    - name: peb
                      type: keyword
                    - name: peb32
                      type: keyword
                    - name: privileges
                      type: keyword
                    - name: scheduled_task_name
                      type: keyword
                    - name: signature_is_embedded
                      type: boolean
                    - name: signature_product
                      type: keyword
                    - name: signature_status
                      type: keyword
                    - name: signature_vendor
                      type: keyword
                    - name: termination_code
                      type: long
                    - name: termination_date
                      type: date
                    - name: token
                      type: flattened
                      description: Security context of the process.
                    - name: user_sid
                      type: keyword
                    - name: username
                      type: keyword
                - name: registry
                  type: group
                  fields:
                    - name: data
                      type: keyword
                    - name: file_path
                      type: keyword
                    - name: key_name
                      type: keyword
                    - name: old_key_name
                      type: keyword
                    - name: return_val
                      type: keyword
                    - name: value_name
                      type: keyword
                    - name: value_type
                      type: keyword
                - name: remote_ip
                  type: ip
                - name: remote_port
                  type: long
                - name: remote_process
                  type: group
                  fields:
                    - name: image_command_line
                      type: keyword
                    - name: image_md5
                      type: keyword
                    - name: image_name
                      type: keyword
                    - name: image_path
                      type: keyword
                    - name: image_sha256
                      type: keyword
                    - name: instance_id
                      type: keyword
                    - name: integrity_level
                      type: keyword
                    - name: os_pid
                      type: long
                    - name: signature_is_embedded
                      type: boolean
                    - name: signature_product
                      type: keyword
                    - name: signature_status
                      type: keyword
                    - name: signature_vendor
                      type: keyword
                    - name: thread_id
                      type: long
                      description: Thread identifier.
                    - name: thread_start_address
                      type: keyword
                    - name: user_sid
                      type: keyword
                    - name: username
                      type: keyword
                - name: socket_type
                  type: keyword
                - name: total_download
                  type: long
                - name: total_upload
                  type: long
                - name: user_is_local_session
                  type: boolean
                - name: user_session_id
                  type: keyword
                  description: Windows session identifier.
                - name: user_status
                  type: keyword
                - name: user_status_sid
                  type: keyword
                - name: username
                  type: keyword
            - name: address_mapping
              type: group
              dynamic: true
              description: Memory address mapping records from Cortex XDR injection and syscall events.
              fields:
                - name: address_range_type
                  type: keyword
                  description: Address range type code. Observed in Cortex XDR events and not documented in the XQL schema.
                - name: image_path
                  type: keyword
                  description: Path of the image containing the function or the image injected into.
                - name: index
                  type: long
                  description: Mapping index. Defaults to 1. In syscall events, the function parameter number.
                - name: section_characteristics
                  type: keyword
                  description: PE section characteristics flags. Observed in Cortex XDR events and not documented in the XQL schema.
                - name: section_name
                  type: keyword
                  description: PE section name. Observed in Cortex XDR events and not documented in the XQL schema.
                - name: symbol_name
                  type: keyword
                  description: Name of the suspicious function.
            - name: agent
              type: group
              fields:
                - name: content_version
                  type: keyword
                - name: hostname
                  type: keyword
                - name: id
                  type: keyword
                - name: interface_map
                  type: group
                  description: Network interface records reported by the agent.
                  fields:
                    - name: ipv4
                      type: ip
                    - name: ipv4_subnet_mask
                      type: keyword
                    - name: ipv6
                      type: ip
                    - name: ipv6_subnet_mask
                      type: keyword
                    - name: mac
                      type: keyword
                - name: ip_addresses
                  type: ip
                - name: ip_addresses_v6
                  type: ip
                - name: os_sub_type
                  type: keyword
                - name: os_type
                  type: keyword
                - name: version
                  type: keyword
            - name: event_id
              type: keyword
            - name: event_rpc_func_opnum
              type: keyword
            - name: event_rpc_interface_uuid
              type: keyword
            - name: event_sub_type
              type: keyword
            - name: event_timestamp
              type: date
            - name: event_type
              type: keyword
            - name: event_version
              type: keyword
            - name: host_metadata
              type: group
              fields:
                - name: domain
                  type: keyword
                - name: hostname
                  type: keyword
                - name: interface_map
                  type: group
                  description: Network interface records from host metadata.
                  fields:
                    - name: ipv4
                      type: ip
                    - name: ipv4_subnet_mask
                      type: keyword
                    - name: ipv6
                      type: ip
                    - name: ipv6_subnet_mask
                      type: keyword
                    - name: mac
                      type: keyword
            - name: os_actor
              type: group
              fields:
                - name: local_ip
                  type: ip
                - name: local_port
                  type: long
                - name: primary_user_sid
                  type: keyword
                - name: primary_username
                  type: keyword
                - name: process_command_line
                  type: keyword
                - name: process_image_md5
                  type: keyword
                - name: process_image_name
                  type: keyword
                - name: process_image_path
                  type: keyword
                - name: process_image_sha256
                  type: keyword
                - name: process_instance_id
                  type: keyword
                - name: process_logon_id
                  type: keyword
                - name: process_os_pid
                  type: long
                  description: Operating system process identifier.
                - name: process_signature_status
                  type: keyword
                - name: remote_ip
                  type: ip
                - name: thread_thread_id
                  type: long
                  description: Operating system thread identifier.
            - name: uuid
              type: keyword
