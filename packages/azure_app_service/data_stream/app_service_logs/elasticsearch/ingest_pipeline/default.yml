---
description: Pipeline for processing Azure App Service logs.
processors:
  - set:
      tag: set_ecs_version_d91b8e0e
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_azure_16a9f07b
      field: azure
      target_field: azure-eventhub
      ignore_missing: true
  - script:
      tag: script_4138e1f3
      source: ctx.message = ctx.message.replace(params.empty_field_name, '')
      params:
        empty_field_name: '"":"",'
      ignore_failure: true
  - rename:
      tag: rename_message_c2dc212a
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_message_681b4955
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_91382ad1
      field: event.original
      target_field: azure.app_service
      ignore_failure: true
# Save the original raw value of the `azure.app_service.properties` field in a temporary field (`azure.app_service.properties_raw`) before parsing it as JSON. This temporary field will be used to set the value of `azure.app_service.log` in the `appservice-platformlogs-inner-pipeline.yml` pipeline.
  - set:
      tag: set_azure_app_service_properties_raw_4fd0514b
      field: azure.app_service.properties_raw
      value: "{{{azure.app_service.properties}}}"
  - json:
      tag: json_azure_app_service_properties_acf9442c
      field: azure.app_service.properties
      target_field: azure.app_service.properties
      if: 'ctx?.azure?.app_service?.properties instanceof String && ctx?.azure?.app_service?.properties?.startsWith("{")'
      ignore_failure: true
  - date:
      tag: date_azure_app_service_time_f3c531a8
      field: azure.app_service.time
      target_field: '@timestamp'
      ignore_failure: true
      formats:
        - ISO8601
  - remove:
      tag: remove_azure_app_service_time_2fb733e5
      field: azure.app_service.time
      ignore_missing: true
  - pipeline:
      tag: pipeline_9fa82566
      if: "ctx?.azure?.app_service?.Category == 'AppServiceAuditLogs'"
      name: '{{ IngestPipeline "appservice-auditlogs-inner-pipeline" }}'
  - pipeline:
      tag: pipeline_bdbe0d81
      if: "ctx?.azure?.app_service?.category == 'AppServiceHTTPLogs'"
      name: '{{ IngestPipeline "appservice-httplogs-inner-pipeline" }}'
  - pipeline:
      tag: pipeline_f9349c6a
      if: "ctx?.azure?.app_service?.Category == 'AppServiceIPSecAuditLogs'"
      name: '{{ IngestPipeline "appservice-ipsecauditlogs-inner-pipeline" }}'
  - pipeline:
      tag: pipeline_9282649b
      if: "ctx?.azure?.app_service?.category == 'AppServiceConsoleLogs'"
      name: '{{ IngestPipeline "appservice-consolelogs-inner-pipeline" }}'
  - pipeline:
      tag: pipeline_9f7992de
      if: "ctx?.azure?.app_service?.category == 'AppServicePlatformLogs'"
      name: '{{ IngestPipeline "appservice-platformlogs-inner-pipeline" }}'
  - pipeline:
      tag: pipeline_ee8d59a6
      if: "ctx?.azure?.app_service?.category == 'AppServiceAppLogs'"
      name: '{{ IngestPipeline "appservice-applogs-inner-pipeline" }}'
  - pipeline:
      tag: pipeline_243093d8
      name: '{{ IngestPipeline "azure-shared-pipeline" }}'
  - remove:
      tag: remove_azure_app_service_properties_raw_6055aa80
      field: azure.app_service.properties_raw
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_c5157286
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_fd2c4d0c
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
