format_version: "3.0.2"
name: azure_app_service
title: "Azure App Service"
version: "1.2.0"
source:
  license: "Elastic-2.0"
description: "Collect logs from Azure App Service with Elastic Agent."
type: integration
categories:
  - azure
  - cloud
  - observability
  # Added security category as it collects audit logs and security-relevant HTTP logs
  - security
conditions:
  kibana:
    version: "^8.19.10 || ~9.1.10 || ~9.2.4 || ^9.3.0"
  elastic:
    subscription: "basic"
vars:
  - name: eventhub
    type: text
    title: Event Hub
    multi: false
    required: true
    show_user: true
    description: >-
      Elastic recommends using one event hub for each integration. Visit [Create an event hub](https://docs.elastic.co/integrations/azure#create-an-event-hub) to learn more. Use event hub names up to 30 characters long to avoid compatibility issues.
  - name: consumer_group
    type: text
    title: Consumer Group
    multi: false
    required: true
    show_user: true
    default: $Default
  - name: auth_type
    type: select
    title: Authentication Type
    multi: false
    required: true
    show_user: true
    default: connection_string
    options:
      - text: Connection String
        value: connection_string
      - text: Client Secret
        value: client_secret
    description: >-
      Authentication method to use for Event Hub and Storage Account.
      When set to **Connection String** or left blank: **Connection String** and **Storage Account Key** are required.
      When set to **Client Secret**: Microsoft Entra ID client secret authentication is used, requiring **Tenant ID**, **Client ID**, **Client Secret**, and **Event Hub Namespace**.
      Note: The same authentication type applies to both Event Hub and Storage Account for security consistency.
  - name: connection_string
    type: password
    secret: true
    title: Connection String
    multi: false
    required: false
    show_user: true
    description: >-
      (Required when **Authentication Type** is **Connection String** or left blank) The connection string required to communicate with Event Hubs.
      See [Get an Event Hubs connection string](https://docs.microsoft.com/en-us/azure/event-hubs/event-hubs-get-connection-string) to learn more.
  - name: storage_account_key
    type: password
    secret: true
    title: Storage Account Key
    multi: false
    required: false
    show_user: true
    description: >-
      (Required when **Authentication Type** is **Connection String** or left blank) The storage account key used to authorize access to data in your storage account.
      Not used when **Authentication Type** is **Client Secret**; client secret authentication is used for storage instead.
  - name: storage_account
    type: text
    title: Storage Account
    multi: false
    required: true
    show_user: true
    description: >-
      The name of the storage account where the consumer group's state/offsets will be stored and updated.
  - name: eventhub_namespace
    type: text
    title: Event Hub Namespace
    multi: false
    required: false
    show_user: true
    description: >-
      (Required when **Authentication Type** is **Client Secret**) Fully qualified Event Hub namespace (e.g., namespace.servicebus.windows.net).
      Do not use the short namespace name; use the complete FQDN.
  - name: tenant_id
    type: text
    title: Tenant ID
    multi: false
    required: false
    show_user: true
    description: >-
      (Required when **Authentication Type** is **Client Secret**) Microsoft Entra ID tenant ID.
      This is the directory/tenant where your Microsoft Entra ID application is registered.
  - name: client_id
    type: text
    title: Client ID
    multi: false
    required: false
    show_user: true
    description: >-
      (Required when **Authentication Type** is **Client Secret**) Microsoft Entra ID application (client) ID.
      The service principal must have 'Azure Event Hubs Data Receiver' role on the Event Hub and 'Storage Blob Data Contributor' role on the Storage Account.
  - name: client_secret
    type: password
    secret: true
    title: Client Secret
    multi: false
    required: false
    show_user: true
    description: >-
      (Required when **Authentication Type** is **Client Secret**) Microsoft Entra ID application client secret.
      Generate this secret in your Microsoft Entra ID app registration.
  - name: authority_host
    type: text
    title: Authority Host
    multi: false
    required: false
    show_user: false
    default: https://login.microsoftonline.com
    description: >-
      (Optional when **Authentication Type** is **Client Secret**) Microsoft Entra ID authority endpoint. Defaults to https://login.microsoftonline.com (Azure Public Cloud).
      Change for other Azure environments: Azure Government (https://login.microsoftonline.us), Azure China (https://login.chinacloudapi.cn), or Azure Germany (https://login.microsoftonline.de).
  - name: resource_manager_endpoint
    type: text
    title: Resource Manager Endpoint
    multi: false
    required: false
    show_user: false
  - name: processor_version
    type: select
    title: Processor version
    multi: false
    required: false
    show_user: false
    default: v2
    options:
      - text: v1 (legacy)
        value: v1
      - text: v2
        value: v2
    description: >
      The processor version that the integration should use. Possible values are v1 (legacy) and v2 (recommended).
      The v2 event hub processor is recommended for typical use cases. Defaults to v2.
  - name: processor_update_interval
    type: text
    title: Processor update interval
    multi: false
    required: false
    show_user: false
    default: 10s
    description: >-
      (Processor v2 only) How often the processor should attempt to claim partitions.

      Default is `10` seconds.
  - name: processor_start_position
    type: select
    title: Processor start position
    multi: false
    required: false
    show_user: false
    default: earliest
    options:
      - text: earliest
        value: earliest
      - text: latest
        value: latest
    description: >-
      (Processor v2 only) Controls from what position in the event hub the processor should start processing messages for all partitions.

      Possible values are `earliest` and `latest`.

      `earliest` starts processing messages from the last checkpoint, or the beginning of the event hub if no checkpoint is available.

      `latest` starts processing messages from the latest event in the event hub and continues to process new events as they arrive.

      Default is `earliest`.
  - name: partition_receive_timeout
    type: text
    title: Partition receive timeout
    multi: false
    required: false
    show_user: false
    default: 5s
    description: >-
      (Processor v2 only) Maximum time to wait before processing the messages received from the event hub.

      The partition consumer waits up to a "receive count" or a "receive timeout," whichever comes first.

      Default is `5` seconds.
  - name: partition_receive_count
    type: text
    title: Partition receive count
    multi: false
    required: false
    show_user: false
    default: 100
    description: >-
      (Processor v2 only) Maximum number of messages from the event hub to wait for before processing them.

      The partition consumer waits up to a "receive count" or a "receive timeout," whichever comes first.

      Default is `100` messages.
  - name: transport
    type: select
    title: Event Hubs transport protocol
    multi: false
    required: true
    show_user: false
    default: amqp
    options:
      - text: AMQP
        value: amqp
      - text: AMQP-over-WebSockets
        value: websocket
    description: >
      (Processor v2 only) The transport protocol used to connect to Event Hubs.
      Supported values are AMQP and AMQP-over-WebSockets. Defaults to AMQP.
  - name: migrate_checkpoint
    type: bool
    title: Migrate checkpoint information
    multi: false
    required: false
    show_user: false
    default: true
    description: >-
      (Processor v2 only) Flag to control if the processor should perform the checkpoint information migration from processor v1 to v2 at startup.

      The checkpoint migration converts the checkpoint information from the v1 format to the v2 format, so the processor resumes from where v1 left off instead of reprocessing the event hub retention window.

      Default is `true`.
icons:
  - src: /img/app-service-logo.svg
    title: App Service Logo
    size: 32x32
    type: image/svg+xml
screenshots:
  - src: /img/azure_app_service-overview-dashboard-screenshot.png
    title: Overview dashboard screenshot
    size: 2994x7034
    type: image/png
policy_templates:
  - name: app_service_logs
    title: Azure App Service logs
    description: Azure App Service logs integration
    fips_compatible: false
    data_streams:
      - app_service_logs
    inputs:
      - type: "azure-eventhub"
        title: "Collect Azure App Service logs from Event Hub"
        description: "Collecting App Service logs from Azure (input: azure-eventhub)"
        input_group: logs
owner:
  github: elastic/obs-infraobs-integrations
  type: elastic
