---
description: Pipeline for processing user logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_50075a0b
      value: asset
  - set:
      field: event.category
      tag: set_event_category_5b3c8dc9
      value: ['iam']
  - set:
      field: event.type
      tag: set_event_type_8957b990
      value: ['user', 'info']
  - set:
      field: asset.category
      tag: set_asset_category_3ebede69
      value: entity
  - set:
      field: asset.type
      tag: set_asset_type_3b1716d3
      value: activedirectory_user

  - pipeline:
      name: '{{ IngestPipeline "common" }}'
      tag: pipeline_entity_e2cc926a
      ignore_missing_pipeline: true

  - script:
      lang: painless
      ignore_failure: false
      tag: set_user_account_control_f61c551e
      description: script_set_user_account_control
      # USER_ACCOUNT Codes
      # https://learn.microsoft.com/en-us/windows/win32/adschema/a-useraccountcontrol
      # https://learn.microsoft.com/en-us/windows/win32/api/iads/ne-iads-ads_user_flag_enum
      params:
        "0x00000001": SCRIPT
        "0x00000002": ACCOUNTDISABLE
        "0x00000008": HOMEDIR_REQUIRED
        "0x00000010": LOCKOUT
        "0x00000020": PASSWD_NOTREQD
        "0x00000040": PASSWD_CANT_CHANGE
        "0x00000080": ENCRYPTED_TEXT_PWD_ALLOWED
        "0x00000100": TEMP_DUPLICATE_ACCOUNT
        "0x00000200": NORMAL_ACCOUNT
        "0x00000800": INTERDOMAIN_TRUST_ACCOUNT
        "0x00001000": WORKSTATION_TRUST_ACCOUNT
        "0x00002000": SERVER_TRUST_ACCOUNT
        "0x00010000": DONT_EXPIRE_PASSWORD
        "0x00020000": MNS_LOGON_ACCOUNT
        "0x00040000": SMARTCARD_REQUIRED
        "0x00080000": TRUSTED_FOR_DELEGATION
        "0x00100000": NOT_DELEGATED
        "0x00200000": USE_DES_KEY_ONLY
        "0x00400000": DONT_REQUIRE_PREAUTH
        "0x00800000": PASSWORD_EXPIRED
        "0x01000000": TRUSTED_TO_AUTHENTICATE_FOR_DELEGATION
        "0x04000000": PARTIAL_SECRETS_ACCOUNT
      source: |-
        Long newUacValue = Long.decode(ctx.activedirectory.user.user_account_control);
        ArrayList uacResult = new ArrayList();
        for (entry in params.entrySet()) {
          Long flag = Long.decode(entry.getKey());
          if ((newUacValue.longValue() & flag.longValue()) != 0) {
            uacResult.add(entry.getValue());
          }
        }
        if (uacResult.length != 0) {
          ctx.activedirectory.user.uac_list = uacResult;
        }
      if: ctx.activedirectory?.user?.user_account_control != null && ctx.activedirectory.user.user_account_control != 0

  - date:
      field: activedirectory.user.when_created
      target_field: asset.create_date
      tag: date_user_created_c587b185
      formats:
        - ISO8601
      if: ctx.activedirectory?.user?.when_created != null && ctx.activedirectory.user.when_created != ''
      on_failure:
        - remove:
            tag: on_failure_remove_date_user_created_91abdbab
            field: activedirectory.user.when_created
        - append:
            tag: on_failure_append_date_user_created_254b90cd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: activedirectory.user.when_changed
      target_field: asset.last_updated
      tag: date_user_changed_8df3d4c3
      formats:
        - ISO8601
      if: ctx.activedirectory?.user?.when_changed != null && ctx.activedirectory.user.when_changed != ''
      on_failure:
        - remove:
            tag: on_failure_remove_date_user_changed_fe8b9331
            field: activedirectory.user.when_changed
        - append:
            tag: on_failure_append_date_user_changed_1db4063b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: activedirectory.user.pwd_last_set
      target_field: user.account.password_change_date
      tag: date_user_password_changed_251f10d9
      formats:
        - ISO8601
      if: ctx.activedirectory?.user?.pwd_last_set != null && ctx.activedirectory.user.pwd_last_set != ''
      on_failure:
        - remove:
            tag: on_failure_remove_date_user_pwd_last_set_5e6673ea
            field: activedirectory.user.pwd_last_set
        - append:
            tag: on_failure_append_date_user_pwd_last_set_dd1197c2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: activedirectory.user.last_logon_timestamp
      target_field: user.entity.lifecycle.last_activity
      tag: date_user_last_logon_timestamp_30fdbd36
      formats:
        - ISO8601
      if: ctx.activedirectory?.user?.last_logon_timestamp != null && ctx.activedirectory.user.last_logon_timestamp != ''
      on_failure:
        - remove:
            tag: on_failure_remove_date_user_last_logon_timestamp_0b0bd040
            field: activedirectory.user.last_logon_timestamp
        - append:
            tag: on_failure_append_date_user_last_logon_timestamp_24893ed2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  - set:
      tag: set_user_asset_name_e2db4a32
      field: asset.name
      copy_from: activedirectory.user.sam_account_name
      ignore_empty_value: true
  - set:
      tag: set_user_name_2c2910f6
      field: user.name
      copy_from: activedirectory.user.sam_account_name
      ignore_empty_value: true
  - set:
      field: user.email
      tag: set_user_email_0b6d1b1e
      copy_from: activedirectory.user.mail
      ignore_empty_value: true
  - gsub:
      tag: gsub_user_dn_7b99b97a
      field: activedirectory.user.distinguished_name
      pattern: '^.*?DC='
      replacement: ''
      target_field: user.domain
      if: ctx.activedirectory?.user?.distinguished_name != null
  - gsub:
      tag: gsub_user_domain_d8dffcf0
      field: user.domain
      pattern: ',DC='
      replacement: '.'
      if: ctx.user?.domain != null
  - set:
      tag: set_user_asset_id_010e65d6
      field: asset.id
      copy_from: activedirectory.user.object_sid
  - set:
      tag: set_user_id_636b66ee
      field: user.id
      copy_from: activedirectory.user.object_sid

  - set:
      tag: set_user_logon_script_enabled_da1ddd02
      field: activedirectory.user.logon_script_enabled
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('SCRIPT') == true
  - set:
      tag: set_user_enabled_true_916fd9e5
      field: activedirectory.user.enabled
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('ACCOUNTDISABLE') == false
  - set:
      tag: set_user_enabled_false_4c55fbe1
      field: activedirectory.user.enabled
      value: false
      if: ctx.activedirectory?.user?.uac_list?.contains('ACCOUNTDISABLE') == true

  - set:
      tag: set_user_locked_674e8b5c
      field: activedirectory.user.locked
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('LOCKOUT') == true

  - set:
      tag: set_user_password_not_required_e74fa9b7
      field: activedirectory.user.password_not_required
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('PASSWD_NOTREQD') == true

  - set:
      tag: set_user_reversible_encryption_password_ce08a6e9
      field: activedirectory.user.reversible_encryption_password
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('ENCRYPTED_TEXT_PWD_ALLOWED') == true

  - set:
      tag: set_user_unconstrained_delegation_e0a44948
      field: activedirectory.user.unconstrained_delegation
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('TRUSTED_FOR_DELEGATION') == true

  - set:
      tag: set_user_sensitive_object_a30af174
      field: activedirectory.user.sensitive_object
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('NOT_DELEGATED') == true

  - set:
      tag: set_user_use_des_key_only_8940687b
      field: activedirectory.user.use_des_key_only
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('USE_DES_KEY_ONLY') == true

  - set:
      tag: set_user_dont_require_preauth_1f3347e5
      field: activedirectory.user.dont_require_preauth
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('DONT_REQUIRE_PREAUTH') == true

  - set:
      tag: set_user_constrained_delegation_85abf34c
      field: activedirectory.user.constrained_delegation
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('TRUSTED_TO_AUTHENTICATE_FOR_DELEGATION') == true

  - set:
      tag: set_user_mfa_enabled_14781380
      field: user.entity.attributes.mfa_enabled
      value: true
      if: ctx.activedirectory?.user?.uac_list?.contains('SMARTCARD_REQUIRED') == true

  - script:
      lang: painless
      ignore_failure: true
      tag: handle_user_group_details_5a7fee8c
      description: Collect user's group details and set privileged_group_member flag based on group membership.
      if: ctx.activedirectory?.groups instanceof List
      # Well-known SIDs - Name to SID mapping
      # https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers#well-known-sids
      params:
        '512': true
        '516': true
        '518': true
        '519': true
        '520': true
        '525': true
        '526': true
        '527': true
        '544': true
        '548': true
        '549': true
        '551': true
      source: |-
        ctx.user = ctx.user ?: [:];
        ctx.user.group = ctx.user.group ?: [:];

        for (def group : ctx.activedirectory.groups) {
          if (group.name != null) {
            ctx.user.group.name = ctx.user.group.name ?: new HashSet();
            ctx.user.group.name.add(group.name);
          }

          if (group?.object_sid == null) {
            continue;
          }

          group.id = group.object_sid;
          ctx.user.group.id = ctx.user.group.id ?: new HashSet();
          ctx.user.group.id.add(group.id);

          int idx = group.object_sid.lastIndexOf('-');
          if (idx < 0) {
            continue;
          }
          def priv = params.get(group.object_sid.substring(idx+1));
          if (priv != null && ctx.activedirectory.user.privileged_group_member == null) {
            ctx.activedirectory.user.privileged_group_member = priv;
          }
        }
        if (ctx.activedirectory.user.privileged_group_member == null) {
          ctx.activedirectory.user.privileged_group_member = false;
        }

  - script:
      lang: painless
      ignore_failure: true
      tag: set_user_relationships_fd498f61
      description: Build user.entity.relationships from managedObjects (administers) and directReports (supervises).
      if: ctx.activedirectory?.user?.managed_objects != null || ctx.activedirectory?.user?.direct_reports != null
      source: |-
        def parseDn(def dn) {
          def result = ['id': dn];
          int start = 0;
          def dcParts = new ArrayList();
          boolean cnFound = false;
          while (start < dn.length()) {
            int end = start;
            while (true) {
              end = dn.indexOf(',', end);
              if (end == -1) { end = dn.length(); break; }
              if (end > 0 && dn.charAt(end - 1) == (char)'\\') { end++; continue; }
              break;
            }
            def part = dn.substring(start, end).replace('\\,', ',').trim();
            if (!cnFound && part.length() > 3 && part.substring(0, 3).equalsIgnoreCase('CN=')) {
              result['name'] = part.substring(3);
              cnFound = true;
            } else if (part.length() > 3 && part.substring(0, 3).equalsIgnoreCase('DC=')) {
              dcParts.add(part.substring(3));
            }
            start = end + 1;
          }
          if (!dcParts.isEmpty()) {
            def domain = dcParts[0];
            for (int i = 1; i < dcParts.size(); i++) {
              domain += '.' + dcParts[i];
            }
            result['domain'] = domain;
          }
          return result;
        }
        def buildHostRel(def dns) {
          def rel = ['host': [:]];
          def dnList = (dns instanceof List) ? dns : [dns];
          for (def dn : dnList) {
            if (!(dn instanceof String) || dn.isEmpty()) continue;
            def p = parseDn(dn);
            if (!rel['host'].containsKey('id')) rel['host']['id'] = new ArrayList();
            rel['host']['id'].add(p['id']);
            if (p.containsKey('name')) {
              if (!rel['host'].containsKey('name')) rel['host']['name'] = new ArrayList();
              def fqdn = p.containsKey('domain') ? p['name'].toLowerCase() + '.' + p['domain'] : p['name'];
              rel['host']['name'].add(fqdn);
            }
            if (p.containsKey('domain')) {
              if (!rel.containsKey('user')) rel['user'] = [:];
              if (!rel['user'].containsKey('domain')) rel['user']['domain'] = new ArrayList();
              rel['user']['domain'].add(p['domain']);
            }
          }
          return rel;
        }
        def buildUserRel(def dns) {
          def rel = ['user': [:]];
          def dnList = (dns instanceof List) ? dns : [dns];
          for (def dn : dnList) {
            if (!(dn instanceof String) || dn.isEmpty()) continue;
            def p = parseDn(dn);
            if (!rel['user'].containsKey('id')) rel['user']['id'] = new ArrayList();
            rel['user']['id'].add(p['id']);
            if (p.containsKey('name')) {
              if (!rel['user'].containsKey('name')) rel['user']['name'] = new ArrayList();
              rel['user']['name'].add(p['name']);
            }
            if (p.containsKey('domain')) {
              if (!rel['user'].containsKey('domain')) rel['user']['domain'] = new ArrayList();
              rel['user']['domain'].add(p['domain']);
            }
          }
          return rel;
        }
        ctx.user = ctx.user ?: [:];
        ctx.user.entity = ctx.user.entity ?: [:];
        ctx.user.entity.relationships = ctx.user.entity.relationships ?: [:];
        if (ctx.activedirectory?.user?.managed_objects != null) {
          ctx.user.entity.relationships.administers = buildHostRel(ctx.activedirectory.user.managed_objects);
        }
        if (ctx.activedirectory?.user?.direct_reports != null) {
          ctx.user.entity.relationships.supervises = buildUserRel(ctx.activedirectory.user.direct_reports);
        }

  - set:
      tag: set_user_account_never_expires_bce7dc86
      field: activedirectory.user.account_never_expires
      value: true
      if: ctx.activedirectory?.user?.account_expires == "0" || ctx.activedirectory?.user?.account_expires == "9223372036854775807"

