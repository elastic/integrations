      tag: append_object_guid_into_related_user_45eabcbd
      allow_duplicates: false
      if: ctx.activedirectory?.user?.object_guid != null
  - append:
      field: related.user
      value: "{{{activedirectory.user.mail}}}"
      tag: append_mail_into_related_user_7db2aba7
      allow_duplicates: false
      if: ctx.activedirectory?.user?.mail != null
  - append:
      field: related.user
      value: "{{{activedirectory.user.user_principal_name}}}"
      tag: append_upn_into_related_user_2a41c091
      allow_duplicates: false
      if: ctx.activedirectory?.user?.user_principal_name != null

  - rename:
      tag: rename_activedirectory_id_to_user_object_dn_f4ac08e1
      field: activedirectory.id
      target_field: activedirectory.user.object_dn

  - rename:
      tag: rename_activedirectory_to_entityanalytics_ad_3c2c8fd4
      field: activedirectory
