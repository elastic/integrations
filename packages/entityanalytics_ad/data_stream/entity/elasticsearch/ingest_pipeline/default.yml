---
description: Pipeline for processing entity logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0

  - remove:
      tag: remove_event_action_e899ad7c
      field: event.action
      if: ctx.event?.action != "started" && ctx.event?.action != "completed"
      ignore_missing: true

  - pipeline:
      name: '{{ IngestPipeline "user" }}'
      if: ctx.activedirectory != null && ctx.user?.id != null
      tag: pipeline_user_d1500815
      ignore_missing_pipeline: true
  - pipeline:
      name: '{{ IngestPipeline "device" }}'
      if: ctx.activedirectory != null && ctx.device?.id != null
      tag: pipeline_device_52a7c13a
      ignore_missing_pipeline: true
  - pipeline:
      name: '{{ IngestPipeline "group" }}'
      if: ctx.activedirectory != null && ctx.group?.id != null
      tag: pipeline_group_4ec516f6
      ignore_missing_pipeline: true
  - pipeline:
      name: '{{ IngestPipeline "entity" }}'
      if: ctx.activedirectory != null && ctx.user?.id == null && ctx.device?.id == null && ctx.group?.id == null
      tag: pipeline_entity_306abfb0
      ignore_missing_pipeline: true
  - pipeline:
      name: '{{ IngestPipeline "marker" }}'
      if: ctx.activedirectory == null && ctx.entityanalytics_ad == null
      tag: pipeline_marker_537155e8
      ignore_missing_pipeline: true

  - script:
      lang: painless
      description: Drops null/empty values recursively.
      tag: painless_remove_null_f6a89620
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: pipeline_error_0841b325
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: pipeline_error_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: pipeline_error_preserve_original_event_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
