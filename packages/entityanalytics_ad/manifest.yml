format_version: "3.3.2"
name: entityanalytics_ad
title: Active Directory Entity Analytics
version: "0.22.0"
description: "Collect User Identities from Active Directory Entity with Elastic Agent."
type: integration
categories:
  - security
  - advanced_analytics_ueba
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: "basic"
screenshots: []
icons:
  - src: /img/logo.svg
    title: Active Directory Logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: entity
    title: Identities
    description: Collect identities.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: entity-analytics
        title: Collect identities
        description: Collecting identities from Active Directory.
owner:
  github: elastic/security-service-integrations
  type: elastic
