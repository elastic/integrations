---
description: Pipeline for processing asset logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - rename:
      field: interval_id
      tag: rename_interval_id_cdd42385
      target_field: qualys_gav.asset.interval_id
      ignore_missing: true
  - date:
      field: interval_start
      tag: date_interval_start_718f7fe5
      target_field: qualys_gav.asset.interval_start
      formats:
        - ISO8601
      if: ctx.interval_start != null && ctx.interval_start != ''
      on_failure:
        - append:
            tag: append_error_message_62d5b4a0
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      tag: remove_interval_start_080d07be
      field:
        - interval_start
      ignore_missing: true
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  # remove agentless metadata
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  # Set up tag logic for choosing which cloud metadata to include.
  - append:
      tag: append_tags_8889e0bc
      field: tags
      value: ["elastic_cloud_data", "provider_cloud_data"]
      if: ctx.tags?.contains('both') == true
  - script:
      tag: script_50fcbb73
      lang: painless
      if: ctx.tags?.contains('both') == true
      source: ctx.tags.remove(ctx.tags.indexOf('both'));
  - script:
      tag: script_c700db75
      lang: painless
      if: ctx.cloud == null && ctx.tags?.contains('elastic_cloud_data') == true
      source: ctx.tags.remove(ctx.tags.indexOf('elastic_cloud_data'));
  - set:
      tag: set__conf_want_provider_cloud_791fe766
      field: _conf.want_provider_cloud
      value: true
      if: ctx.tags?.contains('provider_cloud_data') == true
  - remove:
      tag: remove_cloud_61d5aaea
      description: Remove elastic agent-provided cloud metadata fields if not requested.
      field: cloud
      if: ctx.tags != null && !ctx.tags.contains('elastic_cloud_data')
      ignore_missing: true
      ignore_failure: true

  # parse the event JSON
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_74d23cc2
      target_field: json

  # rename to snake case
  - script:
      tag: script_convert_camelcase_to_snake_case_e887f140
      lang: painless
      description: Convert camelCase to snake_case
      source: |
        // Helper function to convert camelCase to snake_case
        String camelToSnake(String str) {
            def result = "";
            for (int i = 0; i < str.length(); i++) {
                char c = str.charAt(i);
                if (Character.isUpperCase(c)) {
                    if (i > 0 && Character.isLowerCase(str.charAt(i - 1))) {
                        result += "_";
                    }
                    result += Character.toLowerCase(c);
                } else {
                    result += c;
                }
            }
            return result;
        }
        // Recursive function to handle nested fields
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            // Convert each key in the map
            def newObj = [:];
            for (entry in obj.entrySet()) {
              String newKey = camelToSnake(entry.getKey());
              newObj[newKey] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            // If it's a list, process each item recursively
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        // Apply the conversion
        ctx.qualys_gav = ctx.qualys_gav ?: [:];
        ctx.qualys_gav.asset = ctx.qualys_gav.asset ?: [:];
        if (ctx.json != null) {
          ctx.qualys_gav.asset.putAll(convertToSnakeCase(ctx.json));
        }
        // Remove json field
        ctx.remove('json');

