---
description: Pipeline for processing event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_46e166c0
      target_field: authentik.event
      on_failure:
        - append:
            tag: append_error_message_da97c3ca
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - event.original
      tag: fingerprint_event_5df148ab
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - script:
      description: Set ECS categorization fields
      tag: set_ecs_categorization_fields_62e93a43
      lang: painless
      ignore_failure: true
      params:
        login:
          category:
            - authentication
          type:
            - start
          outcome: success
        login_failed:
          category:
            - authentication
          type:
            - start
          outcome: failure
        logout:
          category:
            - authentication
          type:
            - end
          outcome: success
        user_write:
          category:
            - iam
          type:
            - change
        suspicious_request:
          category:
            - intrusion_detection
          type:
            - info
        password_set:
          category:
            - iam
          type:
            - change
            - user
        secret_view:
          category:
            - iam
          type:
            - info
        secret_rotate:
          category:
            - iam
          type:
            - change
        invitation_used:
          category:
            - iam
          type:
            - info
        authorize_application:
          category:
            - authentication
          type:
            - info
        configuration_error:
          category:
            - configuration
          type:
            - info
        model_created:
          category:
            - configuration
          type:
            - info
            - creation
        model_updated:
          category:
            - configuration
          type:
            - info
            - change
        model_deleted:
          category:
            - configuration
          type:
            - info
            - deletion
        email_sent:
          category:
            - email
          type:
            - info
      source: |-
        if (ctx.authentik?.event?.action == null || params.get(ctx.authentik.event.action) == null) {
          return;
        }
        params.get(ctx.authentik.event.action).forEach((k, v) -> {
          if (v instanceof List) {
            ctx.event[k] = new ArrayList(v);
          } else {
            ctx.event[k] = v;
          }
        });
  - set:
      field: observer.vendor
      tag: set_observer_vendor_dcc0500a
      value: authentik
  - set:
      field: observer.product
      tag: set_observer_product_391095ee
      value: authentik
  - set:
      field: event.action
      tag: set_event_action_from_action_d6a78d09
