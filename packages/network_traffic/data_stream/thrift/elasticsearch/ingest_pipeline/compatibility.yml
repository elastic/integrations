---
description: ECS compatibility layer pipeline.
processors:
  - rename:
      tag: rename_thrift_to_network_traffic_thrift_eddca656
      field: thrift
      target_field: network_traffic.thrift
      ignore_missing: true
  - rename:
      tag: rename_method_to_network_traffic_thrift_method_39b566cd
      field: method
      target_field: network_traffic.thrift.method
      ignore_missing: true
  - rename:
      tag: rename_path_to_network_traffic_thrift_path_bc8bee19
      field: path
      target_field: network_traffic.thrift.path
      ignore_missing: true
  - rename:
      tag: rename_query_to_network_traffic_thrift_query_7b9e3a5b
      field: query
      target_field: network_traffic.thrift.query
      ignore_missing: true
  - rename:
      tag: rename_status_to_network_traffic_status_651b762e
      # Retained for legacy dashboard behaviour.
      field: status
      target_field: network_traffic.status
      ignore_missing: true
  - rename:
      tag: rename_process_ppid_to_process_parent_pid_efedbd92
      field: process.ppid
      target_field: process.parent.pid
      ignore_missing: true
  # Remove packetbeat fields that are handled by agent or fleet.
  - remove:
      tag: remove_type_ca899d72
      field: type
      ignore_missing: true
  - remove:
      tag: remove_event_dataset_2bc3044a
      field: event.dataset
      ignore_missing: true

on_failure:
  - append:
      field: error.message
      value: |-
          Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
