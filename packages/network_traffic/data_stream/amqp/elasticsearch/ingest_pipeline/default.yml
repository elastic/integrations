---
description: Pipeline for processing amqp traffic
processors:
- set:
    tag: set_ecs_version_f5923549
    field: ecs.version
    value: '8.17.0'

# ECS compatibility pipeline
- pipeline:
    if: ctx._conf?.map_to_ecs != null && ctx._conf.map_to_ecs
    name: '{{ IngestPipeline "compatibility" }}'
    tag: compatibility_pipeline_processor

##
# Set host.mac to dash separated upper case value
# as per ECS recommendation
##
- gsub:
    field: host.mac
    pattern: '[-:.]'
    replacement: ''
    tag: gsubmac
    ignore_missing: true
- gsub:
    field: host.mac
    pattern: '(..)(?!$)'
    replacement: '$1-'
    tag: gsub_host_mac_e536d1d0
    ignore_missing: true
- uppercase:
    tag: uppercase_host_mac_73cd4413
    field: host.mac
    ignore_missing: true
- append:
    tag: append_related_hosts_4cf05a40
    field: related.hosts
    value: "{{{observer.hostname}}}"
    if: ctx.observer?.hostname != null && ctx.observer?.hostname != ''
    allow_duplicates: false
- foreach:
    if: ctx.observer?.ip != null && ctx.observer.ip instanceof List
    field: observer.ip
    tag: foreachip
    processor:
      append:
        field: related.ip
        value: '{{{_ingest._value}}}'
        allow_duplicates: false
- remove:
    tag: remove_host_bd0ad419
    if: ctx.host != null && ctx.tags != null && ctx.tags.contains('forwarded')
    field: host

- pipeline:
    if: ctx._conf?.geoip_enrich != null && ctx._conf.geoip_enrich
    name: '{{ IngestPipeline "geoip" }}'
    tag: pipelineprocessor
- remove:
    tag: remove__conf_8e93c735
    field: _conf
    ignore_missing: true

on_failure:
  - append:
      field: error.message
      value: |-
          Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
