---
description: ECS compatibility layer pipeline.
processors:
  - rename:
      tag: rename_mongodb_to_network_traffic_mongodb_7bea367c
      field: mongodb
      target_field: network_traffic.mongodb
      ignore_missing: true
  - rename:
      tag: rename_method_to_network_traffic_mongodb_method_d9e91a42
      field: method
      target_field: network_traffic.mongodb.method
      ignore_missing: true
  - rename:
      tag: rename_resource_to_network_traffic_mongodb_resource_9b3d00a2
      field: resource
      target_field: network_traffic.mongodb.resource
      ignore_missing: true
  - rename:
      tag: rename_query_to_network_traffic_mongodb_query_b401ceb8
      field: query
      target_field: network_traffic.mongodb.query
      ignore_missing: true
  - rename:
      tag: rename_status_to_network_traffic_status_651b762e
      # Retained for legacy dashboard behaviour.
      field: status
      target_field: network_traffic.status
      ignore_missing: true
  - rename:
      tag: rename_process_ppid_to_process_parent_pid_efedbd92
      field: process.ppid
      target_field: process.parent.pid
      ignore_missing: true
  # Remove packetbeat fields that are handled by agent or fleet.
  - remove:
      tag: remove_type_ca899d72
      field: type
      ignore_missing: true
  - remove:
      tag: remove_event_dataset_2bc3044a
      field: event.dataset
      ignore_missing: true

on_failure:
  - append:
      field: error.message
      value: |-
          Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
