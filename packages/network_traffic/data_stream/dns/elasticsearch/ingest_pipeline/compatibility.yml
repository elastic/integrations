---
description: ECS compatibility layer pipeline.
processors:
  - rename:
      tag: rename_dns_additionals_count_to_network_traffic_dns_additionals_count_6a6e64f2
      field: dns.additionals_count
      target_field: network_traffic.dns.additionals_count
      ignore_missing: true
  - rename:
      tag: rename_dns_answers_count_to_network_traffic_dns_answers_count_a220f0d4
      field: dns.answers_count
      target_field: network_traffic.dns.answers_count
      ignore_missing: true
  - rename:
      tag: rename_dns_authorities_count_to_network_traffic_dns_authorities_count_dcb97adc
      field: dns.authorities_count
      target_field: network_traffic.dns.authorities_count
      ignore_missing: true
  - rename:
      tag: rename_dns_authorities_to_network_traffic_dns_authorities_f21177e8
      field: dns.authorities
      target_field: network_traffic.dns.authorities
      ignore_missing: true
  - rename:
      tag: rename_dns_flags_to_network_traffic_dns_flags_3dba3040
      field: dns.flags
      target_field: network_traffic.dns.flags
      ignore_missing: true
  - rename:
      tag: rename_dns_question_etld_plus_one_to_network_traffic_dns_question_etld_plus_one_a583995a
      field: dns.question.etld_plus_one
      target_field: network_traffic.dns.question.etld_plus_one
      ignore_missing: true
  - rename:
      tag: rename_method_to_network_traffic_dns_method_b7cae69f
      field: method
      target_field: network_traffic.dns.method
      ignore_missing: true
  - rename:
      tag: rename_query_to_network_traffic_dns_query_85d5e47f
      field: query
      target_field: network_traffic.dns.query
      ignore_missing: true
  - rename:
      tag: rename_resource_to_network_traffic_dns_resource_b0d76783
      field: resource
      target_field: network_traffic.dns.resource
      ignore_missing: true
  - rename:
      tag: rename_status_to_network_traffic_status_651b762e
      # Retained for legacy dashboard behaviour.
      field: status
      target_field: network_traffic.status
      ignore_missing: true
  - rename:
      tag: rename_process_ppid_to_process_parent_pid_efedbd92
      field: process.ppid
      target_field: process.parent.pid
      ignore_missing: true
  # Remove packetbeat fields that are handled by agent or fleet.
  - remove:
      tag: remove_type_ca899d72
      field: type
      ignore_missing: true
  - remove:
      tag: remove_event_dataset_2bc3044a
      field: event.dataset
      ignore_missing: true

on_failure:
  - append:
      field: error.message
      value: |-
          Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
