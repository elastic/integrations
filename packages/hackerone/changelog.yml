# newer versions go on top
- version: "0.3.0"
  changes:
    - description: Keep the full report body in `hackerone.report.attributes.vulnerability_information` and truncate `vulnerability.description` to 1024 characters so long bodies are no longer dropped into `_ignored`. Existing documents must be reindexed for this change to apply.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21783
    - description: Include cold and frozen tiers in the latest-report transform source and rename the destination index to `logs-hackerone_latest.dest_report-v3`. The transform is reinstalled on upgrade and rebuilds the latest index from the source data.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21783
- version: "0.2.0"
  changes:
    - description: Configure the latest-report transform destination with lookup index mode so it can be used as the lookup index in ES|QL LOOKUP JOIN.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21247
    - description: Scope the Reports overview dashboard to the `hackerone.report` dataset.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21247
- version: "0.1.1"
  changes:
    - description: Remove empty ILM policies section from the README.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20950
- version: "0.1.0"
  changes:
    - description: Initial release of the HackerOne integration with the `report` data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18951
