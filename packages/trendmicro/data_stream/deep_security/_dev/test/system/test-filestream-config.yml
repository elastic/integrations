vars: ~
service: trendmicro-log-filestream
input: filestream
data_stream:
  vars:
    paths:
      - "{{SERVICE_LOGS_DIR}}/trendmicro.log"
    tz_offset: UTC
    processors: |
      - drop_fields:
          fields: ["trendmicro_test_missing_field"]
          ignore_missing: true
numeric_keyword_fields:
  - log.file.device_id
  - log.file.inode
  - log.file.idxhi
  - log.file.idxlo
  - log.file.vol
assert:
  hit_count: 42
