service: trendmicro-tcp
service_notify_signal: SIGHUP
input: tcp
data_stream:
  vars:
    listen_address: 0.0.0.0
    listen_port: 9514
    preserve_original_event: true
    tz_offset: UTC
    processors: |
      - drop_fields:
          fields: ["trendmicro_test_missing_field"]
          ignore_missing: true
numeric_keyword_fields:
  - log.file.device_id
  - log.file.inode
  - log.file.idxhi
  - log.file.idxlo
  - log.file.vol
assert:
  hit_count: 42
