---
description: Pipeline for Web Reuptation
processors:
  - set:
      field: trendmicro.deep_security.event_category
      tag: set_deep_security_event_category_541ddeb3
      value: web-reputation-event
  - append:
      field: event.category
      tag: append_event_category_2c621924
      value: network
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_a75e9a8a
      value: info
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_1afb7d08
      value: denied
      allow_duplicates: false
      if: ctx.trendmicro?.deep_security?.signature_id != null && ctx.trendmicro.deep_security.signature_id == 5000001
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
