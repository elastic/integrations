---
description: Pipeline for processing System event logs
processors:
  - set:
      field: trendmicro.deep_security.event_category
      tag: set_deep_security_event_category_b078b757
      value: system-event
  - append:
      field: event.category
      tag: append_event_category_68373490
      value: authentication
      allow_duplicates: false
      if: ctx.trendmicro?.deep_security?.signature_id == 397 || ctx.trendmicro?.deep_security?.signature_id == 160
  - append:
      field: event.type
      tag: set_event_type_cebcc696
      value: info
      allow_duplicates: false
      if: ctx.trendmicro?.deep_security?.signature_id == 397 || ctx.trendmicro?.deep_security?.signature_id == 160
  - set:
      field: event.outcome
      tag: set_event_outcome_26a4c255
      value: failure
      if: ctx.trendmicro?.deep_security?.signature_id == 397 || ctx.trendmicro?.deep_security?.signature_id == 160
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
