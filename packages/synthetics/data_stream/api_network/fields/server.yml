- name: server
  type: group
  description: >
    Destination server for an API journey HTTP request. Emitted on
    journey/network_info when Playwright reports a remote address.

  fields:
    - name: ip
      type: ip
      description: Remote IP of the server that handled the request.
    - name: port
      type: long
      description: Remote port of the server that handled the request.
