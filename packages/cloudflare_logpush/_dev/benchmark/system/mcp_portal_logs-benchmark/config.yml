fields:
  - name: timestamp
    period: -24h
  - name: client_country
    enum:
      - US
      - GB
      - DE
      - IN
      - JP
      - BR
  - name: client_ip
    cardinality: 5000
  - name: colo_code
    enum:
      - DFW
      - LHR
      - FRA
      - BOM
      - NRT
      - GRU
  - name: method
    enum:
      - tools/call
      - tools/list
      - prompts/get
      - resources/read
      - initialize
  - name: portal_id
    cardinality: 10
  - name: server_id
    cardinality: 50
  - name: server_host
    enum:
      - mcp-server-1.example.com
      - mcp-server-2.example.com
      - mcp-server-3.example.com
  - name: duration_ms
    range:
      min: 5
      max: 5000
  - name: session_id
    cardinality: 10000
  - name: success
    enum:
      - "true"
      - "true"
      - "true"
      - "false"
  - name: tool_name
    enum:
      - search_documents
      - create_issue
      - list_files
      - run_query
  - name: prompt_name
    enum:
      - summarize_ticket
      - draft_reply
  - name: resource_path
    enum:
      - projects/example/README.md
      - projects/example/CHANGELOG.md
  - name: user_id
    cardinality: 1000
