fields:
  - name: timestamp
    period: -24h
  - name: device_id
    cardinality: 50
  - name: flow_protocol
    enum:
      - NETFLOW_V9
      - IPFIX
      - SFLOW_5
  - name: protocol
    enum:
      - "6"
      - "6"
      - "17"
      - "1"
  - name: source_address
    cardinality: 5000
  - name: destination_address
    cardinality: 5000
  - name: source_port
    range:
      min: 1024
      max: 65535
  - name: destination_port
    enum:
      - "443"
      - "80"
      - "53"
      - "22"
      - "8443"
  - name: source_as
    range:
      min: 64496
      max: 64511
  - name: destination_as
    range:
      min: 64496
      max: 64511
  - name: bits
    range:
      min: 512
      max: 10000000
  - name: packets
    range:
      min: 1
      max: 10000
  - name: tcp_flags
    enum:
      - "2"
      - "16"
      - "18"
      - "24"
  - name: sample_rate
    enum:
      - "1"
      - "100"
      - "1000"
      - "1024"
  - name: sampler_address
    cardinality: 20
