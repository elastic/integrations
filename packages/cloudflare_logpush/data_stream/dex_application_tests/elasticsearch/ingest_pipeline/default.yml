  - convert:
      tag: convert_json_HTTPDomainLookupEndMs
      field: json.HTTPDomainLookupEndMs
      target_field: cloudflare_logpush.dex_application_tests.http.timings.domain_lookup_end_ms
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_HTTPRedirectStartMs
