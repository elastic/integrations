---
description: Pipeline for parsing Cloudflare DEX Application Tests logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_network_into_event_category
      value: network
  - append:
      field: event.type
      tag: append_info_into_event_type
      value: info
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_Timestamp_to_long
      field: json.Timestamp
      type: long
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: script_timestamp_to_milli
      description: Normalises epoch Timestamp and TracerouteTimeEnd values (seconds/micros/nanos) to milliseconds so the date processors can parse them consistently.
      source: |
        def convertToMillis(long timestamp) {
          if (timestamp > (long)(1e18)) {
            return timestamp/(long)(1e6)
          } else if (timestamp < (long)(1e10))  {
            return timestamp*(long)(1e3)
          }
          return timestamp
        }
        if (ctx.json?.Timestamp != null && ctx.json.Timestamp instanceof Number) {
          ctx.json.Timestamp = convertToMillis(((Number)ctx.json.Timestamp).longValue());
        }
        if (ctx.json?.TracerouteTimeEnd != null && ctx.json.TracerouteTimeEnd instanceof Number) {
          ctx.json.TracerouteTimeEnd = convertToMillis(((Number)ctx.json.TracerouteTimeEnd).longValue());
        }
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_Timestamp
      field: json.Timestamp
      target_field: '@timestamp'
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_Timestamp
            field: json.Timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cloudflare_logpush.dex_application_tests.account.*
  - convert:
      tag: convert_json_AccountID_to_account_id
      field: json.AccountID
      target_field: cloudflare_logpush.dex_application_tests.account_id
      type: string
      ignore_missing: true

  # host.*, device.* and user_agent.*
  - rename:
      tag: rename_json_ClientPlatform_to_host_os_name
      field: json.ClientPlatform
      target_field: host.os.name
      ignore_missing: true
  - script:
      tag: script_map_host_os_type
      lang: painless
      description: Dynamically set host.os.type from the client platform. host.os.type only accepts a fixed set of ECS values, so the client platform string is matched against them.
      if: ctx.host?.os?.name != null
      params:
        os_type:
          - linux
          - macos
          - unix
          - windows
          - ios
          - android
      source: |
        String os_name = ctx.host.os.name.toLowerCase();
        for (String os: params.os_type) {
          if (os_name.contains(os) || os.contains(os_name)) {
            ctx.host.os.put('type', os);
            return;
          }
        }
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_ClientVersion_to_version
      field: json.ClientVersion
      target_field: cloudflare_logpush.dex_application_tests.version
      type: string
      ignore_missing: true
  - set:
      tag: set_user_agent_version_from_client_version
      field: user_agent.version
      copy_from: cloudflare_logpush.dex_application_tests.version
      ignore_empty_value: true
  - rename:
      tag: rename_json_ColoCode_to_colo_code
      field: json.ColoCode
      target_field: cloudflare_logpush.dex_application_tests.colo.code
      ignore_missing: true
  - convert:
      tag: convert_json_DeviceID_to_device_id
      field: json.DeviceID
      target_field: device.id
      type: string
      ignore_missing: true
  - set:
      tag: set_host_id_from_device_id
      field: host.id
      copy_from: device.id
      ignore_empty_value: true
  - convert:
      tag: convert_json_DeviceRegistrationID_to_device_registration_id
      field: json.DeviceRegistrationID
      target_field: cloudflare_logpush.dex_application_tests.device.registration_id
      type: string
      ignore_missing: true
  - rename:
      tag: rename_json_ExecutionContext_to_execution_context
      field: json.ExecutionContext
      target_field: cloudflare_logpush.dex_application_tests.execution_context
      ignore_missing: true
  - convert:
      tag: convert_json_TestID_to_test_id
      field: json.TestID
      target_field: cloudflare_logpush.dex_application_tests.test.id
      type: string
      ignore_missing: true
  - rename:
      tag: rename_json_TestType_to_test_type
      field: json.TestType
      target_field: cloudflare_logpush.dex_application_tests.test.type
      ignore_missing: true
  - rename:
      tag: rename_json_TunnelType_to_tunnel_type
      field: json.TunnelType
      target_field: cloudflare_logpush.dex_application_tests.tunnel_type
      ignore_missing: true

  # user.*
  - rename:
      tag: rename_json_UserEmail_to_user_email
      field: json.UserEmail
      target_field: user.email
      ignore_missing: true
  - convert:
      tag: convert_json_UserID_to_user_id
      field: json.UserID
      target_field: user.id
      type: string
      ignore_missing: true

  # HTTP test: client IP -> source.*
  - convert:
      tag: convert_json_HTTPClientIPAddress_to_source_ip
      field: json.HTTPClientIPAddress
      target_field: source.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.HTTPClientIPAddress != null && ctx.json.HTTPClientIPAddress != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_HTTPClientIPASN_to_source_as_number
      field: json.HTTPClientIPASN
      target_field: source.as.number
      type: long
      ignore_missing: true
