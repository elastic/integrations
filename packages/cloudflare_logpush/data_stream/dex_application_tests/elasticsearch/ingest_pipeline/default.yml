  - rename:
      tag: rename_json_TracerouteDestinationIPASO_to_destination_as_organization_name
      field: json.TracerouteDestinationIPASO
      target_field: destination.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_json_TracerouteDestinationIPCity_to_destination_geo_city_name
