  - rename:
      tag: rename_json_HTTPClientIPASO_to_source_as_organization_name
      field: json.HTTPClientIPASO
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_json_HTTPClientIPCity_to_source_geo_city_name
      field: json.HTTPClientIPCity
      target_field: source.geo.city_name
      ignore_missing: true
  - rename:
      tag: rename_json_HTTPClientIPCountryISO_to_source_geo_country_iso_code
      field: json.HTTPClientIPCountryISO
      target_field: source.geo.country_iso_code
      ignore_missing: true
  - rename:
      tag: rename_json_HTTPClientIPStateISO_to_source_geo_region_iso_code
      field: json.HTTPClientIPStateISO
      target_field: source.geo.region_iso_code
      ignore_missing: true
  - rename:
      tag: rename_json_HTTPClientIPZip_to_source_geo_postal_code
      field: json.HTTPClientIPZip
      target_field: source.geo.postal_code
      ignore_missing: true
  - convert:
      tag: convert_json_HTTPClientIPNetmask_to_client_ip_netmask
      field: json.HTTPClientIPNetmask
      target_field: cloudflare_logpush.dex_application_tests.http.client_ip.netmask
      type: string
      ignore_missing: true
  - convert:
      tag: convert_json_HTTPClientIPVersion_to_client_ip_version
      field: json.HTTPClientIPVersion
      target_field: cloudflare_logpush.dex_application_tests.http.client_ip.version
      type: string
      ignore_missing: true

