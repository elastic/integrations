            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_HTTPURL_to_url_full
      field: json.HTTPURL
      target_field: url.full
      ignore_missing: true
  - uri_parts:
      tag: uri_parts_url_full
      field: url.full
      target_field: url
      keep_original: true
      if: ctx.url?.full != null
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_HTTPErrorMessage_to_http_error_message
      field: json.HTTPErrorMessage
      target_field: cloudflare_logpush.dex_application_tests.http.error_message
      ignore_missing: true
  - rename:
      tag: rename_json_HTTPResponseBody_to_http_response_body_content
      field: json.HTTPResponseBody
      target_field: http.response.body.content
      ignore_missing: true
  - convert:
      tag: convert_json_HTTPResponseBodyBytes_to_http_response_body_bytes
      field: json.HTTPResponseBodyBytes
      target_field: http.response.body.bytes
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_HTTPResponseHeaderBytes_to_response_header_bytes
      field: json.HTTPResponseHeaderBytes
      target_field: cloudflare_logpush.dex_application_tests.http.response.header_bytes
