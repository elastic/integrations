- name: cloudflare_logpush.ipsec
  type: group
  fields:
    - name: local
      type: group
      fields:
        - name: ip
          type: ip
          description: The local IP address associated with the log. It can be an IPv4 or an IPv6 address.
        - name: port
          type: long
          description: The local port associated with the log.
    - name: remote
      type: group
      fields:
        - name: ip
          type: ip
          description: The remote IP address associated with the log. It can be an IPv4 or an IPv6 address.
        - name: port
          type: long
          description: The remote port associated with the log.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
