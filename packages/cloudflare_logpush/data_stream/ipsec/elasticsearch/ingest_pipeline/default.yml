---
description: Pipeline for parsing Cloudflare IPsec Logs logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_network_into_event_category
      value: network
  - append:
      field: event.type
      tag: append_info_into_event_type
      value: info
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_Timestamp_to_long
      field: json.Timestamp
      type: long
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: script_timestamp_to_milli
      description: Normalises an epoch Timestamp (seconds/millis/nanos) to milliseconds so the date processor can parse it consistently.
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp instanceof Number
      source: |
        long t = ((Number)ctx.json.Timestamp).longValue();
        if (t > (long)(1e18)) {
          ctx.json.Timestamp = t/(long)(1e6);
        } else if (t < (long)(1e10)) {
          ctx.json.Timestamp = t*(long)(1e3);
        }
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_Timestamp
      field: json.Timestamp
      target_field: '@timestamp'
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_Timestamp
            field: json.Timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # log.level
  # The Level values are not documented by Cloudflare. The value is lowercased
  # to keep log.level consistent regardless of how the source cases it.
  - lowercase:
      tag: lowercase_json_Level_to_log_level
      field: json.Level
      target_field: log.level
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_Level
            field: json.Level
            ignore_missing: true
        - append:
            tag: append_error_message_level
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # message
  - rename:
      tag: rename_json_Message_to_message
      field: json.Message
      target_field: message
      ignore_missing: true

  # cloudflare_logpush.ipsec.local.* and cloudflare_logpush.ipsec.remote.*
  # Cloudflare does not document which side of the tunnel is the source or the
  # destination, so the local/remote naming of the source is kept.
  - convert:
      tag: convert_json_LocalIP_to_local_ip
      field: json.LocalIP
      target_field: cloudflare_logpush.ipsec.local.ip
      type: ip
      if: ctx.json?.LocalIP != null && ctx.json.LocalIP != ''
      on_failure:
        - remove:
            field: json.LocalIP
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_LocalPort_to_local_port
      field: json.LocalPort
      target_field: cloudflare_logpush.ipsec.local.port
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: json.LocalPort
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_RemoteIP_to_remote_ip
      field: json.RemoteIP
      target_field: cloudflare_logpush.ipsec.remote.ip
      type: ip
      if: ctx.json?.RemoteIP != null && ctx.json.RemoteIP != ''
      on_failure:
        - remove:
            field: json.RemoteIP
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_RemotePort_to_remote_port
      field: json.RemotePort
      target_field: cloudflare_logpush.ipsec.remote.port
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: json.RemotePort
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # related.*
  - append:
      tag: append_local_ip_into_related_ip
      field: related.ip
      value: '{{{cloudflare_logpush.ipsec.local.ip}}}'
      if: ctx.cloudflare_logpush?.ipsec?.local?.ip != null
      allow_duplicates: false
  - append:
      tag: append_remote_ip_into_related_ip
      field: related.ip
      value: '{{{cloudflare_logpush.ipsec.remote.ip}}}'
      if: ctx.cloudflare_logpush?.ipsec?.remote?.ip != null
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
