---
description: Pipeline for parsing Cloudflare Browser Isolation User Actions logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_web_into_event_category
      value: web
  - append:
      field: event.category
      tag: append_network_into_event_category
      value: network
  - append:
      field: event.category
      tag: append_file_into_event_category
      value: file
      if: "['download', 'upload'].contains(ctx.json?.Type)"
  - append:
      field: event.type
      tag: append_access_into_event_type
      value: access
  - append:
      field: event.type
      tag: append_allowed_into_event_type
      value: allowed
      if: ctx.json?.Decision == 'allow'
  - append:
      field: event.type
      tag: append_denied_into_event_type
      value: denied
      if: ctx.json?.Decision == 'block'
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_Timestamp_to_long
      field: json.Timestamp
      type: long
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: script_timestamp_to_milli
      description: Normalises an epoch Timestamp (seconds/millis/nanos) to milliseconds so the date processor can parse it consistently.
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp instanceof Number
      source: |
        long t = ((Number)ctx.json.Timestamp).longValue();
        if (t > (long)(1e18)) {
          ctx.json.Timestamp = t/(long)(1e6);
        } else if (t < (long)(1e10)) {
          ctx.json.Timestamp = t*(long)(1e3);
        }
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_Timestamp
      field: json.Timestamp
      target_field: '@timestamp'
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_Timestamp
            field: json.Timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cloudflare_logpush.biso_user_actions.account_id
  - convert:
      tag: convert_json_AccountID_to_account_id
      field: json.AccountID
      target_field: cloudflare_logpush.biso_user_actions.account_id
      type: string
      ignore_missing: true
  # cloudflare_logpush.biso_user_actions.decision and event.action
  - rename:
      tag: rename_json_Decision_to_decision
      field: json.Decision
      target_field: cloudflare_logpush.biso_user_actions.decision
      ignore_missing: true
  - rename:
      tag: rename_json_Type_to_event_action
      field: json.Type
      target_field: event.action
      ignore_missing: true
  # url.*
  - rename:
      tag: rename_json_URL_to_url_full
      field: json.URL
      target_field: url.full
      ignore_missing: true
  - uri_parts:
      tag: uri_parts_url_full
      field: url.full
      target_field: url
      keep_original: true
      if: ctx.url?.full != null
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # DomainName is documented as the domain name in the URL, so the value parsed
  # from URL is kept and DomainName only fills url.domain when URL is absent.
  - rename:
      tag: rename_json_DomainName_to_url_domain
      field: json.DomainName
      target_field: url.domain
      ignore_missing: true
      if: ctx.url?.domain == null

  # user.*
  - rename:
      tag: rename_json_UserEmail_to_user_email
      field: json.UserEmail
      target_field: user.email
      ignore_missing: true
  - convert:
      tag: convert_json_UserID_to_user_id
      field: json.UserID
      target_field: user.id
      type: string
      ignore_missing: true
  # cloudflare_logpush.biso_user_actions.metadata
  # Metadata is a JSON-encoded string whose structure is not documented by
  # Cloudflare, so it is decoded as-is into a flattened field. The flattened
  # type only accepts objects, so only values that look like a JSON object are
  # decoded.
  - rename:
      tag: rename_json_Metadata_object_to_metadata
      field: json.Metadata
      target_field: cloudflare_logpush.biso_user_actions.metadata
      if: ctx.json?.Metadata instanceof Map
  - json:
      tag: json_Metadata_to_metadata
      field: json.Metadata
      target_field: cloudflare_logpush.biso_user_actions.metadata
      if: ctx.json?.Metadata instanceof String && ctx.json.Metadata.trim().startsWith('{')
      on_failure:
        - remove:
            tag: remove_metadata_on_failure
            field: cloudflare_logpush.biso_user_actions.metadata
            ignore_missing: true
        - append:
            tag: append_error_message_metadata
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_error_message_metadata_not_object
      field: error.message
      value: 'Metadata is not a JSON object and was not decoded; the raw value is kept in event.original.'
      if: ctx.json?.Metadata instanceof String && !ctx.json.Metadata.trim().isEmpty() && !ctx.json.Metadata.trim().startsWith('{')

  # related.*
  - append:
      tag: append_url_domain_into_related_hosts
      field: related.hosts
      value: '{{{url.domain}}}'
      if: ctx.url?.domain != null
      allow_duplicates: false
  - append:
      tag: append_user_email_into_related_user
      field: related.user
      value: '{{{user.email}}}'
      if: ctx.user?.email != null
      allow_duplicates: false
  - append:
      tag: append_user_id_into_related_user
      field: related.user
      value: '{{{user.id}}}'
      if: ctx.user?.id != null
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
