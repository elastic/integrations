- name: cloudflare_logpush.biso_user_actions
  type: group
  fields:
    - name: account_id
      type: keyword
      description: The Cloudflare account ID in which the user action was performed.
    - name: decision
      type: keyword
      description: The decision applied to the user action (for example `allow` or `block`).
    - name: metadata
      type: flattened
      description: Additional information specific to the user action, decoded from the JSON-encoded `Metadata` string. Its structure is not documented by Cloudflare.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
