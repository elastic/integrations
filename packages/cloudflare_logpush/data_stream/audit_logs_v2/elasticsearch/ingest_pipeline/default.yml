---
description: Pipeline for parsing Cloudflare Audit Logs v2.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_ActionTimestamp_to_long
      field: json.ActionTimestamp
      type: long
      if: ctx.json?.ActionTimestamp != null && ctx.json.ActionTimestamp != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: script_action_timestamp_to_milli
      if: ctx.json?.ActionTimestamp != null && ctx.json.ActionTimestamp instanceof Number
      source: |
        long t = (long)(ctx.json.ActionTimestamp);
        if (t > (long)(1e18)) {
          ctx.json.ActionTimestamp = t/(long)(1e6)
        } else if (t < (long)(1e10))  {
          ctx.json.ActionTimestamp = t*(long)(1e3)
        }
      on_failure:
        - append:
            tag: append_error_message_action_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_ActionTimestamp
      field: json.ActionTimestamp
      target_field: '@timestamp'
      if: ctx.json?.ActionTimestamp != null && ctx.json.ActionTimestamp != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_ActionTimestamp
            field: json.ActionTimestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # event.*
  - rename:
      tag: rename_json_AuditLogID_to_event_id
      field: json.AuditLogID
      target_field: event.id
      ignore_missing: true
  - rename:
      tag: rename_json_ActionType_to_event_action
      field: json.ActionType
      target_field: event.action
      ignore_missing: true
  ## Cloudflare documents create, update, delete and view as the action types, and gives
  ## SSO_LOGIN as an example action description, so logins are detected from either field.
  - append:
      tag: append_authentication_into_event_category
      field: event.category
      value: authentication
      allow_duplicates: false
      if: >-
        (ctx.event?.action != null && ctx.event.action.toLowerCase().contains('login')) ||
        (ctx.json?.ActionDescription != null && ctx.json.ActionDescription.toLowerCase().contains('login'))
  - append:
      tag: append_start_into_event_type
      field: event.type
      value: start
      allow_duplicates: false
      if: ctx.event?.category instanceof List && ctx.event.category.contains('authentication')
  - append:
      tag: append_configuration_into_event_category
      field: event.category
      value: configuration
      allow_duplicates: false
      if: ctx.event?.category == null
  - append:
      tag: append_creation_into_event_type
      field: event.type
      value: creation
      allow_duplicates: false
      if: ctx.event.category.contains('configuration') && ctx.event.action != null && ctx.event.action.toLowerCase().contains('create')
  - append:
      tag: append_change_into_event_type
      field: event.type
      value: change
      allow_duplicates: false
      if: ctx.event.category.contains('configuration') && ctx.event.action != null && ctx.event.action.toLowerCase().contains('update')
  - append:
      tag: append_deletion_into_event_type
      field: event.type
      value: deletion
      allow_duplicates: false
      if: ctx.event.category.contains('configuration') && ctx.event.action != null && ctx.event.action.toLowerCase().contains('delete')
  - append:
      tag: append_access_into_event_type
      field: event.type
      value: access
      allow_duplicates: false
      if: ctx.event.category.contains('configuration') && ctx.event.action != null && ctx.event.action.toLowerCase().contains('view')
  - append:
      tag: append_info_into_event_type
      field: event.type
      value: info
      allow_duplicates: false
      if: ctx.event?.type == null
  ## Cloudflare does not publish the ActionResult value vocabulary; only "success" has been seen
  ## in real events. The value is always kept in the custom field, and event.outcome is only set
  ## for the values that ECS allows.
  - lowercase:
      tag: lowercase_json_ActionResult
      field: json.ActionResult
      if: ctx.json?.ActionResult instanceof String
  - rename:
      tag: rename_json_ActionResult_to_action_result
      field: json.ActionResult
      target_field: cloudflare_logpush.audit_logs_v2.action.result
      ignore_missing: true
  - set:
      tag: set_event_outcome_from_action_result
      field: event.outcome
      copy_from: cloudflare_logpush.audit_logs_v2.action.result
      if: "['success', 'failure'].contains(ctx.cloudflare_logpush?.audit_logs_v2?.action?.result)"

  # cloudflare_logpush.audit_logs_v2.*
  - rename:
      tag: rename_json_AccountID_to_account_id
      field: json.AccountID
      target_field: cloudflare_logpush.audit_logs_v2.account.id
      ignore_missing: true
  - rename:
      tag: rename_json_AccountName_to_account_name
      field: json.AccountName
      target_field: cloudflare_logpush.audit_logs_v2.account.name
      ignore_missing: true
  - rename:
      tag: rename_json_ActionDescription_to_action_description
      field: json.ActionDescription
      target_field: cloudflare_logpush.audit_logs_v2.action.description
      ignore_missing: true
  - rename:
      tag: rename_json_ActorContext_to_actor_context
      field: json.ActorContext
      target_field: cloudflare_logpush.audit_logs_v2.actor.context
      ignore_missing: true
  - rename:
      tag: rename_json_ActorTokenDetails_to_actor_token_details
      field: json.ActorTokenDetails
      target_field: cloudflare_logpush.audit_logs_v2.actor.token_details
      ignore_missing: true
  - rename:
      tag: rename_json_ActorType_to_actor_type
      field: json.ActorType
      target_field: cloudflare_logpush.audit_logs_v2.actor.type
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceID_to_resource_id
      field: json.ResourceID
      target_field: cloudflare_logpush.audit_logs_v2.resource.id
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceProduct_to_resource_product
      field: json.ResourceProduct
      target_field: cloudflare_logpush.audit_logs_v2.resource.product
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceRequest_to_resource_request
      field: json.ResourceRequest
      target_field: cloudflare_logpush.audit_logs_v2.resource.request
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceResponse_to_resource_response
      field: json.ResourceResponse
      target_field: cloudflare_logpush.audit_logs_v2.resource.response
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceScope_to_resource_scope
      field: json.ResourceScope
      target_field: cloudflare_logpush.audit_logs_v2.resource.scope
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceType_to_resource_type
      field: json.ResourceType
      target_field: cloudflare_logpush.audit_logs_v2.resource.type
      ignore_missing: true
  - rename:
      tag: rename_json_ResourceValue_to_resource_value
      field: json.ResourceValue
      target_field: cloudflare_logpush.audit_logs_v2.resource.value
      ignore_missing: true
  - rename:
      tag: rename_json_ZoneID_to_zone_id
      field: json.ZoneID
      target_field: cloudflare_logpush.audit_logs_v2.zone.id
      ignore_missing: true
  - rename:
      tag: rename_json_ZoneName_to_zone_name
      field: json.ZoneName
      target_field: cloudflare_logpush.audit_logs_v2.zone.name
      ignore_missing: true

  # http.*, url.* and user_agent.*
  ## Cloudflare does not document the keys of `Raw`; method, status_code, uri, cf_ray_id and
  ## user_agent are seen in real events, and `Raw` can be empty. Values are type-checked into
  ## ECS fields, and `Raw` is kept whole.
  - set:
      tag: set_http_request_method_from_json_Raw_method
      field: http.request.method
      copy_from: json.Raw.method
      ignore_empty_value: true
      if: ctx.json?.Raw instanceof Map && ctx.json.Raw.method instanceof String
  - convert:
      tag: convert_json_Raw_status_code_to_long
      field: json.Raw.status_code
      target_field: http.response.status_code
      type: long
      ignore_missing: true
      if: ctx.json?.Raw instanceof Map && ctx.json.Raw.status_code != ''
      on_failure:
        - remove:
            tag: remove_http_response_status_code_on_failure
            field: http.response.status_code
            ignore_missing: true
        - append:
            tag: append_error_message_raw_status_code
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_url_original_from_json_Raw_uri
      field: url.original
      copy_from: json.Raw.uri
      ignore_empty_value: true
      if: ctx.json?.Raw instanceof Map && ctx.json.Raw.uri instanceof String
  - set:
      tag: set_ray_id_from_json_Raw_cf_ray_id
      field: cloudflare_logpush.audit_logs_v2.ray.id
      copy_from: json.Raw.cf_ray_id
      ignore_empty_value: true
      if: ctx.json?.Raw instanceof Map && ctx.json.Raw.cf_ray_id instanceof String
  - user_agent:
      tag: user_agent_json_Raw_user_agent
      field: json.Raw.user_agent
      target_field: user_agent
      ignore_missing: true
      if: ctx.json?.Raw instanceof Map && ctx.json.Raw.user_agent instanceof String && ctx.json.Raw.user_agent != ''
  - rename:
      tag: rename_json_Raw_to_raw
      field: json.Raw
      target_field: cloudflare_logpush.audit_logs_v2.raw
      ignore_missing: true

  # source.*
  - convert:
      tag: convert_json_ActorIPAddress_to_source_ip
      field: json.ActorIPAddress
      target_field: source.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.ActorIPAddress != null && ctx.json.ActorIPAddress != ''
      on_failure:
        - remove:
            tag: remove_json_ActorIPAddress
            field: json.ActorIPAddress
            ignore_missing: true
        - append:
            tag: append_error_message_actor_ip_address
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # user.*
  - rename:
      tag: rename_json_ActorEmail_to_user_email
      field: json.ActorEmail
      target_field: user.email
      ignore_missing: true
  - rename:
      tag: rename_json_ActorID_to_user_id
      field: json.ActorID
      target_field: user.id
      ignore_missing: true

  # related.*
  - append:
      tag: append_source_ip_into_related_ip
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
  - append:
      tag: append_user_id_into_related_user
      field: related.user
      value: '{{{user.id}}}'
      if: ctx.user?.id != null && ctx.user.id != ''
      allow_duplicates: false
  - append:
      tag: append_user_email_into_related_user
      field: related.user
      value: '{{{user.email}}}'
      if: ctx.user?.email != null && ctx.user.email != ''
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
