---
description: Pipeline for parsing Cloudflare WebSocket Analytics logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_network_into_event_category
      value: network
  - append:
      field: event.type
      tag: append_connection_into_event_type
      value: connection
  - append:
      field: event.type
      tag: append_end_into_event_type
      value: end
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  - set:
      tag: set_network_protocol
      field: network.protocol
      value: websocket
  - set:
      tag: set_network_transport
      field: network.transport
      value: tcp
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true

  # Timestamps
  # EdgeStartTimestamp and EdgeEndTimestamp are documented as "int or string":
  # RFC 3339, or an epoch in seconds, milliseconds or nanoseconds depending on
  # the Logpush job's timestamp format. Numeric values (including numeric
  # strings) are normalised to milliseconds so a single date processor handles
  # every form. Empty and zero values are dropped.
  - script:
      lang: painless
      tag: script_normalise_timestamps_to_milli
      description: Normalises epoch timestamps (seconds/millis/nanos) to milliseconds and drops empty or zero values.
      if: ctx.json != null
      source: |
        for (String key : params.fields) {
          def v = ctx.json.get(key);
          if (v == null) {
            continue;
          }
          if (v instanceof String) {
            String s = v.trim();
            if (s.isEmpty()) {
              ctx.json.remove(key);
              continue;
            }
            if (!s.chars().allMatch(Character::isDigit)) {
              continue;
            }
            v = Long.parseLong(s);
          }
          if (v instanceof Number) {
            long t = ((Number)v).longValue();
            if (t == 0) {
              ctx.json.remove(key);
              continue;
            }
            if (t > (long)(1e18)) {
              t = t/(long)(1e6);
            } else if (t < (long)(1e10)) {
              t = t*(long)(1e3);
            }
            ctx.json.put(key, t);
          }
        }
      params:
        fields:
          - EdgeStartTimestamp
          - EdgeEndTimestamp
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_EdgeStartTimestamp
      field: json.EdgeStartTimestamp
      target_field: event.start
      if: ctx.json?.EdgeStartTimestamp != null
      formats:
        - UNIX_MS
        - ISO8601
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_EdgeStartTimestamp
            field: json.EdgeStartTimestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date_edge_start_timestamp
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_EdgeEndTimestamp
      field: json.EdgeEndTimestamp
      target_field: event.end
      if: ctx.json?.EdgeEndTimestamp != null
      formats:
        - UNIX_MS
        - ISO8601
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_EdgeEndTimestamp
            field: json.EdgeEndTimestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date_edge_end_timestamp
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # The record is emitted when the connection closes, so the close time is the
  # event time. The start time is used when the close time is missing.
  - set:
      tag: set_@timestamp_from_event_end
      field: '@timestamp'
      copy_from: event.end
      if: ctx.event?.end != null
  - set:
      tag: set_@timestamp_from_event_start
      field: '@timestamp'
      copy_from: event.start
      if: ctx.event?.end == null && ctx.event?.start != null
  - script:
      lang: painless
      tag: script_set_event_duration
      description: Sets event.duration in nanoseconds from event.start and event.end.
      if: ctx.event?.start != null && ctx.event?.end != null
      source: |
        ZonedDateTime start = ZonedDateTime.parse(ctx.event.start);
        ZonedDateTime end = ZonedDateTime.parse(ctx.event.end);
        long duration = ChronoUnit.NANOS.between(start, end);
        if (duration >= 0) {
          ctx.event.duration = duration;
        }
      on_failure:
        - append:
            tag: append_error_message_event_duration_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cloudflare_logpush.websocket_analytics.*
  - rename:
      tag: rename_json_ColoCode_to_colo_code
      field: json.ColoCode
      target_field: cloudflare_logpush.websocket_analytics.colo.code
      ignore_missing: true
  - convert:
      tag: convert_json_ConnectionID_to_connection_id
      field: json.ConnectionID
      target_field: cloudflare_logpush.websocket_analytics.connection.id
      type: string
      ignore_missing: true
  - rename:
      tag: rename_json_ConnectionCloseReason_to_connection_close_reason
      field: json.ConnectionCloseReason
      target_field: cloudflare_logpush.websocket_analytics.connection.close.reason
      ignore_missing: true
  # ConnectionCloseSource can also hold raw internal values, so it is kept as-is.
  - rename:
      tag: rename_json_ConnectionCloseSource_to_connection_close_source
      field: json.ConnectionCloseSource
      target_field: cloudflare_logpush.websocket_analytics.connection.close.source
      ignore_missing: true
  # A value of 0 is meaningful (no reportable code, or plain TCP), so it is kept.
  - convert:
      tag: convert_json_ConnectionTransportCloseCode_to_long
      field: json.ConnectionTransportCloseCode
      target_field: cloudflare_logpush.websocket_analytics.connection.transport_close_code
      type: long
      ignore_missing: true
      if: ctx.json?.ConnectionTransportCloseCode != ''
      on_failure:
        - remove:
            tag: remove_json_ConnectionTransportCloseCode
            field: json.ConnectionTransportCloseCode
            ignore_missing: true
        - append:
            tag: append_error_message_convert_transport_close_code
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_BytesReceivedOrigin_to_long
      field: json.BytesReceivedOrigin
      target_field: cloudflare_logpush.websocket_analytics.origin.bytes_received
      type: long
      ignore_missing: true
      if: ctx.json?.BytesReceivedOrigin != ''
      on_failure:
        - remove:
            tag: remove_json_BytesReceivedOrigin
            field: json.BytesReceivedOrigin
            ignore_missing: true
        - append:
            tag: append_error_message_convert_bytes_received_origin
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_BytesSentOrigin_to_long
      field: json.BytesSentOrigin
      target_field: cloudflare_logpush.websocket_analytics.origin.bytes_sent
      type: long
      ignore_missing: true
      if: ctx.json?.BytesSentOrigin != ''
      on_failure:
        - remove:
            tag: remove_json_BytesSentOrigin
            field: json.BytesSentOrigin
            ignore_missing: true
        - append:
            tag: append_error_message_convert_bytes_sent_origin
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # event.outcome
  # Inferred from the vendor descriptions of ConnectionCloseReason: `none` (no
  # classified error or timeout) and `peerNoError` are successful closes, the
  # error, timeout, reset and protocol violation reasons are failures. Other
  # values leave event.outcome unset.
  - script:
      lang: painless
      tag: script_set_event_outcome_from_close_reason
      description: Maps the connection close reason to event.outcome.
      if: ctx.cloudflare_logpush?.websocket_analytics?.connection?.close?.reason instanceof String
      params:
        outcome:
          none: success
          peerNoError: success
          unspecifiedError: failure
          timedOut: failure
          peerReset: failure
          upstreamReset: failure
          protocolViolation: failure
      source: |
        def outcome = params.outcome.get(ctx.cloudflare_logpush.websocket_analytics.connection.close.reason);
        if (outcome != null) {
          ctx.event.outcome = outcome;
        }
      on_failure:
        - append:
            tag: append_error_message_event_outcome_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # http.*
  - rename:
      tag: rename_json_RayID_to_http_request_id
      field: json.RayID
      target_field: http.request.id
      ignore_missing: true

  # source.*, destination.* and network.*
  # The client is the source and the proxied host is the destination, so the
  # bytes sent by the client are source.bytes and the bytes sent to the client
  # are destination.bytes.
  - convert:
      tag: convert_json_ClientIP_to_source_ip
      field: json.ClientIP
      target_field: source.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.ClientIP != null && ctx.json.ClientIP != ''
      on_failure:
        - remove:
            tag: remove_json_ClientIP
            field: json.ClientIP
            ignore_missing: true
        - append:
            tag: append_error_message_convert_client_ip
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_ClientASN_to_long
      field: json.ClientASN
      type: long
      ignore_missing: true
      if: ctx.json?.ClientASN != ''
      on_failure:
        - remove:
            tag: remove_json_ClientASN
            field: json.ClientASN
            ignore_missing: true
        - append:
            tag: append_error_message_convert_client_asn
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # An ASN of 0 is not a valid AS number, so it is treated as absent.
  - rename:
      tag: rename_json_ClientASN_to_source_as_number
      field: json.ClientASN
      target_field: source.as.number
      ignore_missing: true
      if: ctx.json?.ClientASN != null && ctx.json.ClientASN != 0
  - convert:
      tag: convert_json_BytesReceivedClient_to_source_bytes
      field: json.BytesReceivedClient
      target_field: source.bytes
      type: long
      ignore_missing: true
      if: ctx.json?.BytesReceivedClient != ''
      on_failure:
        - remove:
            tag: remove_json_BytesReceivedClient
            field: json.BytesReceivedClient
            ignore_missing: true
        - append:
            tag: append_error_message_convert_bytes_received_client
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_BytesSentClient_to_destination_bytes
      field: json.BytesSentClient
      target_field: destination.bytes
      type: long
      ignore_missing: true
      if: ctx.json?.BytesSentClient != ''
      on_failure:
        - remove:
            tag: remove_json_BytesSentClient
            field: json.BytesSentClient
            ignore_missing: true
        - append:
            tag: append_error_message_convert_bytes_sent_client
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      tag: script_set_network_bytes
      description: Sets network.bytes as the sum of source.bytes and destination.bytes.
      if: ctx.source?.bytes instanceof Number && ctx.destination?.bytes instanceof Number
      source: |
        ctx.network.bytes = ctx.source.bytes + ctx.destination.bytes;
      on_failure:
        - append:
            tag: append_error_message_network_bytes_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - geoip:
      tag: geoip_source_ip_to_source_geo
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      if: ctx.source?.ip != null
  # The ASN lookup is written to a temporary field so that it does not replace
  # the ClientASN value from the log. The organization name is only taken when
  # the looked-up ASN matches ClientASN, or when ClientASN is absent.
  - geoip:
      tag: geoip_source_ip_to_source_as
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: _temp.source_as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      if: ctx.source?.ip != null
  - rename:
      tag: rename_temp_source_as_organization_name_to_source_as_organization_name
      field: _temp.source_as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      if: ctx._temp?.source_as != null && (ctx.source?.as?.number == null || ctx.source.as.number == ctx._temp.source_as.asn)
  - rename:
      tag: rename_temp_source_as_asn_to_source_as_number
      field: _temp.source_as.asn
      target_field: source.as.number
      ignore_missing: true
      if: ctx.source?.as?.number == null

  # url.*
  - rename:
      tag: rename_json_ClientRequestHost_to_url_domain
      field: json.ClientRequestHost
      target_field: url.domain
      ignore_missing: true
  - rename:
      tag: rename_json_ClientRequestPath_to_url_path
      field: json.ClientRequestPath
      target_field: url.path
      ignore_missing: true

  # user_agent.*
  - rename:
      tag: rename_json_ClientRequestUserAgent_to_user_agent_original
      field: json.ClientRequestUserAgent
      target_field: user_agent.original
      ignore_missing: true
  - user_agent:
      tag: user_agent_user_agent_original
      field: user_agent.original
      ignore_missing: true
      if: ctx.user_agent?.original instanceof String && ctx.user_agent.original != ''

  # related.*
  - append:
      tag: append_source_ip_into_related_ip
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
  - append:
      tag: append_url_domain_into_related_hosts
      field: related.hosts
      value: '{{{url.domain}}}'
      if: ctx.url?.domain != null && ctx.url.domain != ''
      allow_duplicates: false
  - remove:
      tag: remove_json_conf_temp
      field:
        - json
        - _conf
        - _temp
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
