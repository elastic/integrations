- name: cloudflare_logpush.turnstile_events
  type: group
  fields:
    - name: action
      type: keyword
      description: The Turnstile widget action string configured by the customer.
    - name: sitekey
      type: keyword
      description: The Turnstile sitekey (widget identifier).
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
