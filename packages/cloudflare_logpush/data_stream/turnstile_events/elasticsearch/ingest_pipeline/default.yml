---
description: Pipeline for parsing Cloudflare Turnstile Events logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_web_into_event_category
      value: web
  - append:
      field: event.type
      tag: append_info_into_event_type
      value: info
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_Timestamp_to_long
      field: json.Timestamp
      type: long
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: script_timestamp_to_milli
      description: Normalises an epoch Timestamp (seconds/millis/nanos) to milliseconds so the date processor can parse it consistently.
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp instanceof Number
      source: |
        long t = ((Number)ctx.json.Timestamp).longValue();
        if (t > (long)(1e18)) {
          ctx.json.Timestamp = t/(long)(1e6);
        } else if (t < (long)(1e10)) {
          ctx.json.Timestamp = t*(long)(1e3);
        }
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_Timestamp
      field: json.Timestamp
      target_field: '@timestamp'
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_Timestamp
            field: json.Timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # event.action
  - lowercase:
      tag: lowercase_json_EventType_to_event_action
      field: json.EventType
      target_field: event.action
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_EventType
            field: json.EventType
            ignore_missing: true
        - append:
            tag: append_error_message_json_EventType
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # source.* (the visitor)
  - convert:
      tag: convert_json_ClientIP_to_source_ip
      field: json.ClientIP
      target_field: source.ip
      type: ip
      if: ctx.json?.ClientIP != null && ctx.json.ClientIP != ''
      on_failure:
        - remove:
            tag: remove_json_ClientIP
            field: json.ClientIP
            ignore_missing: true
        - append:
            tag: append_error_message_json_ClientIP
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_ASN_to_source_as_number
      field: json.ASN
      target_field: source.as.number
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_ASN
            field: json.ASN
            ignore_missing: true
        - append:
            tag: append_error_message_json_ASN
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_CountryCode_to_source_geo_country_iso_code
      field: json.CountryCode
      target_field: source.geo.country_iso_code
      ignore_missing: true

  # url.domain (the site where the widget was loaded)
  - rename:
      tag: rename_json_Hostname_to_url_domain
      field: json.Hostname
      target_field: url.domain
      ignore_missing: true

  # user_agent.*
  - rename:
      tag: rename_json_UserAgent_to_user_agent_original
      field: json.UserAgent
      target_field: user_agent.original
      ignore_missing: true
  - rename:
      tag: rename_json_BrowserName_to_user_agent_name
      field: json.BrowserName
      target_field: user_agent.name
      ignore_missing: true
  - convert:
      tag: convert_json_BrowserMajor_to_user_agent_version
      field: json.BrowserMajor
      target_field: user_agent.version
      type: string
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_BrowserMajor
            field: json.BrowserMajor
            ignore_missing: true
        - append:
            tag: append_error_message_json_BrowserMajor
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_OSName_to_user_agent_os_name
      field: json.OSName
      target_field: user_agent.os.name
      ignore_missing: true
  - convert:
      tag: convert_json_OSMajor_to_user_agent_os_version
      field: json.OSMajor
      target_field: user_agent.os.version
      type: string
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_OSMajor
            field: json.OSMajor
            ignore_missing: true
        - append:
            tag: append_error_message_json_OSMajor
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cloudflare_logpush.turnstile_events.*
  - rename:
      tag: rename_json_Action_to_cloudflare_logpush_turnstile_events_action
      field: json.Action
      target_field: cloudflare_logpush.turnstile_events.action
      ignore_missing: true
  - rename:
      tag: rename_json_Sitekey_to_cloudflare_logpush_turnstile_events_sitekey
      field: json.Sitekey
      target_field: cloudflare_logpush.turnstile_events.sitekey
      ignore_missing: true

  # related.*
  - append:
      tag: append_source_ip_into_related_ip
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
