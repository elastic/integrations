- name: cloudflare_logpush.email_security_post_delivery_events
  type: group
  fields:
    - name: alert_id
      type: keyword
      description: Email Security alert ID of the original message.
    - name: destination
      type: keyword
      description: Target folder for a `move` operation (for example `RecoverableItemsPurges`).
    - name: final_disposition
      type: keyword
      description: Threat disposition of the original message (`unset`, `none`, `malicious`, `suspicious`, `spam`, `spoof` or `bulk`).
    - name: folder
      type: keyword
      description: Folder name resolved after a successful `move` operation.
    - name: from_name
      type: keyword
      description: Display name from the `From` header of the original message.
    - name: message_timestamp
      type: date
      description: Timestamp of the original message.
    - name: microsoft_tenant_id
      type: keyword
      description: Microsoft 365 tenant identifier.
    - name: requested_disposition
      type: keyword
      description: Requested disposition for a `submission` operation.
    - name: status
      type: keyword
      description: Status message from the post-delivery provider (for example `OK`).
    - name: success
      type: boolean
      description: Whether the post-delivery action succeeded.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
