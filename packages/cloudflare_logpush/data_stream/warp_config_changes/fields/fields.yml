- name: cloudflare_logpush.warp_config_changes
  type: group
  fields:
    - name: account
      type: group
      fields:
        - name: from
          type: group
          fields:
            - name: id
              type: keyword
              description: The Cloudflare account ID the user switched from.
            - name: name
              type: keyword
              description: The name of the account the user switched from.
        - name: to
          type: group
          fields:
            - name: id
              type: keyword
              description: The Cloudflare account ID the user switched to.
            - name: name
              type: keyword
              description: The name of the account the user switched to.
    - name: config
      type: group
      fields:
        - name: from
          type: group
          fields:
            - name: name
              type: keyword
              description: The name of the config the user switched from.
        - name: to
          type: group
          fields:
            - name: name
              type: keyword
              description: The name of the config the user switched to.
    - name: device
      type: group
      fields:
        - name: registration_id
          type: keyword
          description: Device registration ID.
