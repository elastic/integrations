deployer: docker
service: cloudflare-logpush-warp-config-changes-http-endpoint
service_notify_signal: SIGHUP
input: http_endpoint
wait_for_data_timeout: 1m
vars:
  listen_address: 0.0.0.0
data_stream:
  vars:
    url: /cloudflare_logpush/warp_config_changes
    listen_port: 9560
    preserve_original_event: true
    enable_request_tracer: true
