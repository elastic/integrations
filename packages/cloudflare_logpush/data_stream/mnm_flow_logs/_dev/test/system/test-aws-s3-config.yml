deployer: tf
input: aws-s3
wait_for_data_timeout: 20m
vars:
  access_key_id: "{{AWS_ACCESS_KEY_ID}}"
  secret_access_key: "{{AWS_SECRET_ACCESS_KEY}}"
  session_token: "{{AWS_SESSION_TOKEN}}"
data_stream:
  vars:
    queue_url_mnm_flow_logs: "{{TF_OUTPUT_queue_url}}"
    preserve_original_event: true
    file_selectors: |
      - regex: '^(.+?)\.log'
assert:
  hit_count: 5
numeric_keyword_fields:
  - network.iana_number
  - cloudflare_logpush.mnm_flow_logs.ethertype
  - cloudflare_logpush.mnm_flow_logs.tcp_flags
