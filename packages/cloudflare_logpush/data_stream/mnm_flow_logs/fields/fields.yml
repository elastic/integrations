- name: cloudflare_logpush.mnm_flow_logs
  type: group
  fields:
    - name: aws_vpc_flow
      type: flattened
      description: The AWS VPC flow log record parsed from AWSVPCFlowJSON. Only present when the flow protocol is AWS_VPC.
    - name: aws_vpc_flow_json
      type: keyword
      index: false
      description: The raw AWS VPC flow log record (AWSVPCFlowJSON), kept only when it could not be parsed as JSON.
    - name: device_id
      type: keyword
      description: The ID of the network device that originated the flow.
    - name: egress_bits
      type: long
      description: The number of egress bits in the flow.
    - name: egress_packets
      type: long
      description: The number of egress packets in the flow.
    - name: ethertype
      type: keyword
      description: The EtherType of the flow (for example, 2048 for IPv4 and 34525 for IPv6).
    - name: flow_protocol
      type: keyword
      description: The protocol used to export the flow (AWS_VPC, IPFIX, SFLOW_5, or NETFLOW_V9).
    - name: num_flows
      type: long
      description: The number of flows aggregated in the record.
    - name: packet_id
      type: keyword
      description: The ID of the packet.
    - name: sample_rate
      type: long
      description: The sampling rate applied to the flow.
    - name: sample_rate_type
      type: keyword
      description: How the sample rate was determined (flow, default, or propagated).
    - name: tcp_flags
      type: keyword
      description: The TCP flags of the flow, as a bitmask.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
