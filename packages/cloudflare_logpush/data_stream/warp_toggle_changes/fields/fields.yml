- name: cloudflare_logpush.warp_toggle_changes
  type: group
  fields:
    - name: account
      type: group
      fields:
        - name: id
          type: keyword
          description: The Cloudflare account ID when the toggle happened.
        - name: name
          type: keyword
          description: The account name when the toggle happened.
    - name: device
      type: group
      fields:
        - name: registration_id
          type: keyword
          description: Device registration ID.
    - name: toggled
      type: boolean
      description: Indicates whether the device WARP client was toggled or not.
