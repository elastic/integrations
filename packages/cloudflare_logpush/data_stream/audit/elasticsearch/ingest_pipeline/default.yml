---
description: Pipeline for parsing Cloudflare Audit logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  ## This pipeline handles two Cloudflare Logpush dataset schemas with one code path:
  ##   - v1 `audit_logs`:    ID, When, ActorIP, ActionResult (boolean), ...
  ##   - v2 `audit_logs_v2`: AuditLogID, ActionTimestamp, ActorIPAddress, ActionResult (string), ...
  ## The three v2 fields below carry the same data as their v1 counterparts, so they are renamed
  ## to the v1 names here and every downstream v1 processor works unchanged. A v1 record has none
  ## of the v2 names (no-op) and a v2 record has none of the v1 names (rename succeeds).
  - rename:
      tag: rename_json_auditlogid_to_id
      field: json.AuditLogID
      target_field: json.ID
      ignore_missing: true
      description: Normalizes the v2 `AuditLogID` field to its v1 name `ID`.
  - rename:
      tag: rename_json_actiontimestamp_to_when
      field: json.ActionTimestamp
      target_field: json.When
      ignore_missing: true
      description: Normalizes the v2 `ActionTimestamp` field to its v1 name `When`.
  - rename:
      tag: rename_json_actoripaddress_to_actorip
      field: json.ActorIPAddress
      target_field: json.ActorIP
      ignore_missing: true
      description: Normalizes the v2 `ActorIPAddress` field to its v1 name `ActorIP`.
  - set:
      tag: set_event_type
      field: event.type
      value: [info]
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  - set:
      tag: set_event_category
      field: event.category
      value: [authentication]
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_When_fcae7a8e
      field: json.When
      type: long
      if: ctx.json?.When != null && ctx.json.When != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: painless_when_to_milli
      if: ctx.json?.When != null && ctx.json.When instanceof Number
      source: |
        long t = (long)(ctx.json.When);
        if (t > (long)(1e18)) {
          ctx.json.When = t/(long)(1e6)
        } else if (t < (long)(1e10))  {
          ctx.json.When = t*(long)(1e3)
        }
      on_failure:
        - append:
            tag: append_error_message_20151760
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_when
      field: json.When
      if: ctx.json?.When != null && ctx.json.When != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - append:
            tag: append_error_message_864f4d96
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_cloudflare_logpush_audit_timestamp
      field: cloudflare_logpush.audit.timestamp
      copy_from: '@timestamp'
      ignore_empty_value: true
  - rename:
      tag: rename_json_actiontype
      field: json.ActionType
      target_field: cloudflare_logpush.audit.action.type
      ignore_missing: true
  - set:
      tag: set_event_action
      field: event.action
      copy_from: cloudflare_logpush.audit.action.type
      ignore_empty_value: true
  - lowercase:
      tag: lowercase_event_action
      field: event.action
      ignore_missing: true
  - set:
      tag: set_cloudflare_logpush_audit_action_result
      field: cloudflare_logpush.audit.action.result
      value: success
      if: ctx.json?.ActionResult == true
  - set:
      tag: set_cloudflare_logpush_audit_action_result_2
      field: cloudflare_logpush.audit.action.result
      value: failure
      if: ctx.json?.ActionResult == false
  ## v2 `audit_logs_v2` sends ActionResult as a string. Cloudflare does not publish the value
  ## vocabulary; only "success" has been seen in real events.
  - lowercase:
      tag: lowercase_json_actionresult
      field: json.ActionResult
      if: ctx.json?.ActionResult instanceof String
  - set:
      tag: set_cloudflare_logpush_audit_action_result_v2
      field: cloudflare_logpush.audit.action.result
      copy_from: json.ActionResult
      ignore_empty_value: true
      if: ctx.json?.ActionResult instanceof String
  ## ECS only allows success, failure or unknown for event.outcome, so any other v2 text
  ## stays in the custom field only.
  - set:
      tag: set_event_outcome
      field: event.outcome
      copy_from: cloudflare_logpush.audit.action.result
      ignore_empty_value: true
      if: "['success', 'failure'].contains(ctx.cloudflare_logpush?.audit?.action?.result)"
  - rename:
      tag: rename_json_actoremail
      field: json.ActorEmail
      target_field: cloudflare_logpush.audit.actor.email
      ignore_missing: true
  - set:
      tag: set_user_email
      field: user.email
      copy_from: cloudflare_logpush.audit.actor.email
      ignore_empty_value: true
  - rename:
      tag: rename_json_actorid
      field: json.ActorID
      target_field: cloudflare_logpush.audit.actor.id
      ignore_missing: true
  - set:
      tag: set_user_id
      field: user.id
      copy_from: cloudflare_logpush.audit.actor.id
      ignore_empty_value: true
  - convert:
      tag: convert_json_actorip
      field: json.ActorIP
      target_field: cloudflare_logpush.audit.actor.ip
      if: ctx.json?.ActorIP != null && ctx.json.ActorIP != ''
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_dee045ad
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_source_ip
      field: source.ip
      copy_from: cloudflare_logpush.audit.actor.ip
      ignore_empty_value: true
  - rename:
      tag: rename_json_actortype
      field: json.ActorType
      target_field: cloudflare_logpush.audit.actor.type
      ignore_missing: true
  - rename:
      tag: rename_json_id
      field: json.ID
      target_field: cloudflare_logpush.audit.id
      ignore_missing: true
  - set:
      tag: set_event_id
      field: event.id
      copy_from: cloudflare_logpush.audit.id
      ignore_empty_value: true
  - rename:
      tag: rename_json_interface
      field: json.Interface
      target_field: cloudflare_logpush.audit.interface
      ignore_missing: true
      if: ctx.json?.Interface != ''
  - set:
      tag: set_event_provider
      field: event.provider
      copy_from: cloudflare_logpush.audit.interface
      ignore_empty_value: true
  - rename:
      tag: rename_json_metadata
      field: json.Metadata
      target_field: cloudflare_logpush.audit.metadata
      ignore_missing: true
  - rename:
      tag: rename_json_newvalue
      field: json.NewValue
      target_field: cloudflare_logpush.audit.new_value
      if: ctx.json?.NewValue != null
      ignore_missing: true
  - rename:
      tag: rename_json_oldvalue
      field: json.OldValue
      target_field: cloudflare_logpush.audit.old_value
      if: ctx.json?.OldValue != null
      ignore_missing: true
  - rename:
      tag: rename_json_ownerid
      field: json.OwnerID
      target_field: cloudflare_logpush.audit.owner.id
      ignore_missing: true
  - rename:
      tag: rename_json_resourceid
      field: json.ResourceID
      target_field: cloudflare_logpush.audit.resource.id
      ignore_missing: true
  - rename:
      tag: rename_json_resourcetype
      field: json.ResourceType
      target_field: cloudflare_logpush.audit.resource.type
      ignore_missing: true
  ## v2-only (`audit_logs_v2`) fields.
  - rename:
      tag: rename_json_accountid
      field: json.AccountID
      target_field: cloudflare_logpush.audit.account.id
      ignore_missing: true
  - rename:
      tag: rename_json_accountname
      field: json.AccountName
      target_field: cloudflare_logpush.audit.account.name
      ignore_missing: true
  - rename:
      tag: rename_json_zoneid
      field: json.ZoneID
      target_field: cloudflare_logpush.audit.zone.id
      ignore_missing: true
  - rename:
      tag: rename_json_zonename
      field: json.ZoneName
      target_field: cloudflare_logpush.audit.zone.name
      ignore_missing: true
  - rename:
      tag: rename_json_actiondescription
      field: json.ActionDescription
      target_field: cloudflare_logpush.audit.action.description
      ignore_missing: true
  - rename:
      tag: rename_json_actorcontext
      field: json.ActorContext
      target_field: cloudflare_logpush.audit.actor.context
      ignore_missing: true
  - rename:
      tag: rename_json_actortokendetails
      field: json.ActorTokenDetails
      target_field: cloudflare_logpush.audit.actor.token_details
      ignore_missing: true
  - rename:
      tag: rename_json_resourceproduct
      field: json.ResourceProduct
      target_field: cloudflare_logpush.audit.resource.product
      ignore_missing: true
  - rename:
      tag: rename_json_resourcescope
      field: json.ResourceScope
      target_field: cloudflare_logpush.audit.resource.scope
      ignore_missing: true
  - rename:
      tag: rename_json_resourcerequest
      field: json.ResourceRequest
      target_field: cloudflare_logpush.audit.resource.request
      ignore_missing: true
  - rename:
      tag: rename_json_resourceresponse
      field: json.ResourceResponse
      target_field: cloudflare_logpush.audit.resource.response
      ignore_missing: true
  - rename:
      tag: rename_json_resourcevalue
      field: json.ResourceValue
      target_field: cloudflare_logpush.audit.resource.value
      ignore_missing: true
  ## Fields derived from `Raw`. Cloudflare does not document its keys; method, status_code, uri,
  ## cf_ray_id and user_agent are seen in real events, and `Raw` can be empty. Values are
  ## type-checked into ECS fields, and `Raw` is kept whole.
  - set:
      tag: set_http_request_method_from_json_raw_method
      field: http.request.method
      copy_from: json.Raw.method
      ignore_empty_value: true
  - convert:
      tag: convert_json_raw_status_code_to_long
      field: json.Raw.status_code
      target_field: http.response.status_code
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_raw_status_code
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_url_original_from_json_raw_uri
      field: url.original
      copy_from: json.Raw.uri
      ignore_empty_value: true
  - convert:
      tag: convert_json_raw_cf_ray_id_to_string
      field: json.Raw.cf_ray_id
      target_field: cloudflare_logpush.audit.ray.id
      type: string
      ignore_missing: true
  - user_agent:
      tag: user_agent_json_raw_user_agent
      field: json.Raw.user_agent
      target_field: user_agent
      ignore_missing: true
  - rename:
      tag: rename_json_raw
      field: json.Raw
      target_field: cloudflare_logpush.audit.raw
      ignore_missing: true
  - append:
      tag: append_related_user
      field: related.user
      value: '{{{cloudflare_logpush.audit.actor.id}}}'
      if: ctx.cloudflare_logpush?.audit?.actor?.id != null
      allow_duplicates: false
  - append:
      tag: append_user_email_into_related_user
      field: related.user
      value: '{{{cloudflare_logpush.audit.actor.email}}}'
      if: ctx.cloudflare_logpush?.audit?.actor?.email != null
      allow_duplicates: false
  - append:
      tag: append_owner_id_into_related_user
      field: related.user
      value: '{{{cloudflare_logpush.audit.owner.id}}}'
      if: ctx.cloudflare_logpush?.audit?.owner?.id != null
      allow_duplicates: false
  - append:
      tag: append_related_ip
      field: related.ip
      value: '{{{cloudflare_logpush.audit.actor.ip}}}'
      if: ctx.cloudflare_logpush?.audit?.actor?.ip != null
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - remove:
      tag: remove_others
      field:
        - cloudflare_logpush.audit.timestamp
        - cloudflare_logpush.audit.action.result
        - cloudflare_logpush.audit.action.type
        - cloudflare_logpush.audit.id
        - cloudflare_logpush.audit.interface
        - cloudflare_logpush.audit.actor.ip
        - cloudflare_logpush.audit.actor.email
        - cloudflare_logpush.audit.actor.id
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
