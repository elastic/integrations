- name: cloudflare_logpush.zaraz_events
  type: group
  fields:
    - name: body
      type: flattened
      description: Zaraz incoming request body.
    - name: event_details
      type: flattened
      description: Zaraz log event details.
    - name: request
      type: group
      fields:
        - name: headers
          type: flattened
          description: Zaraz incoming request headers, keyed by lowercased header name. The Referer and User-Agent headers are mapped to `http.request.referrer` and `user_agent.original`.
