- name: cloudflare_logpush.zaraz_events
  type: group
  fields:
    - name: body
      type: flattened
      description: Zaraz incoming request body.
    - name: event_details
      type: flattened
      description: Zaraz log event details.
    - name: request
      type: group
      fields:
        - name: headers
          type: group
          description: Zaraz incoming request headers. Headers without an explicit mapping are kept under this group with their lowercased header name.
          fields:
            - name: accept
              type: keyword
              description: Value of the Accept request header.
            - name: accept_language
              type: keyword
              description: Value of the Accept-Language request header.
            - name: content_type
              type: keyword
              description: Value of the Content-Type request header.
