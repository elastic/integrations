---
description: Pipeline for parsing Cloudflare Zaraz events.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_web_into_event_category
      value: web
  - append:
      field: event.type
      tag: append_info_into_event_type
      value: info
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true

  # @timestamp
  # TimestampStart is documented as "int or string": RFC 3339, or an epoch in
  # seconds, milliseconds or nanoseconds depending on the Logpush job's
  # timestamp format. Numeric values (including numeric strings) are normalised
  # to milliseconds so a single date processor handles every form.
  - script:
      lang: painless
      tag: script_normalise_timestamp_start_to_milli
      description: Normalises an epoch TimestampStart (seconds/millis/nanos) to milliseconds and drops empty or zero values.
      if: ctx.json?.TimestampStart != null
      source: |
        def v = ctx.json.TimestampStart;
        if (v instanceof String) {
          String s = v.trim();
          if (s.isEmpty()) {
            ctx.json.remove('TimestampStart');
            return;
          }
          if (!s.chars().allMatch(Character::isDigit)) {
            return;
          }
          v = Long.parseLong(s);
        }
        if (v instanceof Number) {
          long t = ((Number)v).longValue();
          if (t == 0) {
            ctx.json.remove('TimestampStart');
            return;
          }
          if (t > (long)(1e18)) {
            t = t/(long)(1e6);
          } else if (t < (long)(1e10)) {
            t = t*(long)(1e3);
          }
          ctx.json.TimestampStart = t;
        }
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_TimestampStart
      field: json.TimestampStart
      target_field: '@timestamp'
      if: ctx.json?.TimestampStart != null
      formats:
        - UNIX_MS
        - ISO8601
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_TimestampStart
            field: json.TimestampStart
            ignore_missing: true
        - append:
            tag: append_error_message_date_timestamp_start
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # event.action
  - lowercase:
      tag: lowercase_json_EventType_to_event_action
      field: json.EventType
      target_field: event.action
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_EventType
            field: json.EventType
            ignore_missing: true
        - append:
            tag: append_error_message_json_EventType
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_outcome_failure
      field: event.outcome
      value: failure
      if: ctx.event?.action == 'component_error'

  # source.*
  - convert:
      tag: convert_json_IP_to_source_ip
      field: json.IP
      target_field: source.ip
      type: ip
      if: ctx.json?.IP != null && ctx.json.IP != ''
      on_failure:
        - remove:
            tag: remove_json_IP
            field: json.IP
            ignore_missing: true
        - append:
            tag: append_error_message_json_IP
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - geoip:
      tag: geoip_source_ip_to_source_geo
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      if: ctx.source?.ip != null
  - geoip:
      tag: geoip_source_ip_to_source_as
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      if: ctx.source?.ip != null
  - rename:
      tag: rename_source_as_asn_to_source_as_number
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true

  # url.*
  - rename:
      tag: rename_json_URL_to_url_original
      field: json.URL
      target_field: url.original
      ignore_missing: true
  - uri_parts:
      tag: uri_parts_url_original
      field: url.original
      target_field: url
      keep_original: true
      if: ctx.url?.original != null
      on_failure:
        - append:
            tag: append_error_message_uri_parts_url_original
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_url_full_from_url_original
      field: url.full
      copy_from: url.original
      ignore_empty_value: true

  # cloudflare_logpush.zaraz_events.*
  # Body and EventDetails are documented as objects without a fixed schema, so
  # they are kept as flattened fields. A value that arrives as a JSON-encoded
  # string is decoded first.
  - json:
      tag: json_json_Body
      field: json.Body
      if: ctx.json?.Body instanceof String && ctx.json.Body.trim().startsWith('{')
      on_failure:
        - append:
            tag: append_error_message_json_Body
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_Body_to_body
      field: json.Body
      target_field: cloudflare_logpush.zaraz_events.body
      ignore_missing: true
  - json:
      tag: json_json_EventDetails
      field: json.EventDetails
      if: ctx.json?.EventDetails instanceof String && ctx.json.EventDetails.trim().startsWith('{')
      on_failure:
        - append:
            tag: append_error_message_json_EventDetails
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_EventDetails_to_event_details
      field: json.EventDetails
      target_field: cloudflare_logpush.zaraz_events.event_details
      ignore_missing: true
  - json:
      tag: json_json_RequestHeaders
      field: json.RequestHeaders
      if: ctx.json?.RequestHeaders instanceof String && ctx.json.RequestHeaders.trim().startsWith('{')
      on_failure:
        - append:
            tag: append_error_message_json_RequestHeaders
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_lowercase_json_RequestHeaders_keys
      lang: painless
      description: Lowercases the RequestHeaders keys so that header lookups do not depend on the case sent by the client.
      if: ctx.json?.RequestHeaders instanceof Map
      source: |
        Map headers = new HashMap();
        for (def entry : ctx.json.RequestHeaders.entrySet()) {
          headers.put(entry.getKey().toLowerCase(), entry.getValue());
        }
        ctx.json.RequestHeaders = headers;
      on_failure:
        - append:
            tag: append_error_message_script_lowercase_json_RequestHeaders_keys
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_RequestHeaders_to_cloudflare_logpush_zaraz_events_request_headers
      field: json.RequestHeaders
      target_field: cloudflare_logpush.zaraz_events.request.headers
      ignore_missing: true
      if: ctx.json?.RequestHeaders instanceof Map
  - rename:
      tag: rename_cloudflare_logpush_zaraz_events_request_headers_accept-language_to_accept_language
      field: cloudflare_logpush.zaraz_events.request.headers.accept-language
      target_field: cloudflare_logpush.zaraz_events.request.headers.accept_language
      ignore_missing: true
  - rename:
      tag: rename_cloudflare_logpush_zaraz_events_request_headers_content-type_to_content_type
      field: cloudflare_logpush.zaraz_events.request.headers.content-type
      target_field: cloudflare_logpush.zaraz_events.request.headers.content_type
      ignore_missing: true

  # http.*
  - rename:
      tag: rename_cloudflare_logpush_zaraz_events_request_headers_referer_to_http_request_referrer
      field: cloudflare_logpush.zaraz_events.request.headers.referer
      target_field: http.request.referrer
      ignore_missing: true

  # user_agent.*
  - rename:
      tag: rename_cloudflare_logpush_zaraz_events_request_headers_user-agent_to_user_agent_original
      field: cloudflare_logpush.zaraz_events.request.headers.user-agent
      target_field: user_agent.original
      ignore_missing: true
  - user_agent:
      tag: user_agent_user_agent_original
      field: user_agent.original
      ignore_missing: true

  # related.*
  - append:
      tag: append_source_ip_into_related_ip
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
