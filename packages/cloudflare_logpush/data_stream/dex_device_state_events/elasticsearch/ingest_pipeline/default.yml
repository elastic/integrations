---
description: Pipeline for parsing Cloudflare DEX Device State Events logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.3.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json
      field: event.original
      target_field: json
      if: ctx.event?.original != null
  - append:
      field: event.category
      tag: append_host_into_event_category
      value: host
  - append:
      field: event.type
      tag: append_info_into_event_type
      value: info
  - set:
      tag: set_event_kind
      field: event.kind
      value: event
  ## AWS S3 input does _id Based Deduplication and generates "_id" by default.
  ## When "Data Deduplication" is not enabled, this field must be removed.
  ## https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-aws-s3#_document_id_generation
  - remove:
      field: _id
      tag: remove_id_based_deduplication
      description: >
        When data deduplication is disabled, the _id field (used for _id Based Deduplication)
        must be removed.
      if: ctx._conf?.enable_deduplication == false && ctx.input?.type == 'aws-s3'
      ignore_missing: true
  - convert:
      tag: convert_json_Timestamp_to_long
      field: json.Timestamp
      type: long
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      ignore_failure: true
  - script:
      lang: painless
      tag: script_timestamp_to_milli
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp instanceof Number
      source: |
        long t = (long)(ctx.json.Timestamp);
        if (t > (long)(1e18)) {
          ctx.json.Timestamp = t/(long)(1e6)
        } else if (t < (long)(1e10))  {
          ctx.json.Timestamp = t*(long)(1e3)
        }
      on_failure:
        - append:
            tag: append_error_message_timestamp_script
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_Timestamp
      field: json.Timestamp
      target_field: '@timestamp'
      if: ctx.json?.Timestamp != null && ctx.json.Timestamp != ''
      formats:
        - UNIX_MS
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssZ
      timezone: UTC
      on_failure:
        - remove:
            tag: remove_json_Timestamp
            field: json.Timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_date
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cloudflare_logpush.dex_device_state_events.account.*
  - convert:
      tag: convert_json_AccountID_to_account_id
      field: json.AccountID
      target_field: cloudflare_logpush.dex_device_state_events.account_id
      type: string
      ignore_missing: true

  # host.*, device.* and user_agent.*
  - rename:
      tag: rename_json_ClientPlatform_to_host_os_name
      field: json.ClientPlatform
      target_field: host.os.name
      ignore_missing: true
  - script:
      tag: script_map_host_os_type
      lang: painless
      description: Dynamically set host.os.type from the client platform. host.os.type only accepts a fixed set of ECS values, so the client platform string is matched against them.
      if: ctx.host?.os?.name != null
      params:
        os_type:
          - linux
          - macos
          - unix
          - windows
          - ios
          - android
      source: |
        String os_name = ctx.host.os.name.toLowerCase();
        for (String os: params.os_type) {
          if (os_name.contains(os) || os.contains(os_name)) {
            ctx.host.os.put('type', os);
            return;
          }
        }
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_ClientVersion_to_version
      field: json.ClientVersion
      target_field: cloudflare_logpush.dex_device_state_events.version
      type: string
      ignore_missing: true
  - set:
      tag: set_user_agent_version_from_client_version
      field: user_agent.version
      copy_from: cloudflare_logpush.dex_device_state_events.version
      ignore_empty_value: true
  - convert:
      tag: convert_json_DeviceID_to_device_id
      field: json.DeviceID
      target_field: device.id
      type: string
      ignore_missing: true
  - set:
      tag: set_host_id_from_device_id
      field: host.id
      copy_from: device.id
      ignore_empty_value: true
  - convert:
      tag: convert_json_DeviceRegistrationID_to_device_registration_id
      field: json.DeviceRegistrationID
      target_field: cloudflare_logpush.dex_device_state_events.device.registration_id
      type: string
      ignore_missing: true
  - convert:
      tag: convert_json_DeviceRegistrationProfileID_to_device_registration_profile_id
      field: json.DeviceRegistrationProfileID
      target_field: cloudflare_logpush.dex_device_state_events.device.registration_profile_id
      type: string
      ignore_missing: true

  # device IP addresses -> host.ip, netmasks kept in the package namespace
  - convert:
      tag: convert_json_DeviceIPv4Address_to_ip
      field: json.DeviceIPv4Address
      type: ip
      ignore_missing: true
      if: ctx.json?.DeviceIPv4Address != null && ctx.json.DeviceIPv4Address != ''
      on_failure:
        - remove:
            field: json.DeviceIPv4Address
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_device_ipv4_into_host_ip
      field: host.ip
      value: '{{{json.DeviceIPv4Address}}}'
      if: ctx.json?.DeviceIPv4Address != null && ctx.json.DeviceIPv4Address != ''
      allow_duplicates: false
  - convert:
      tag: convert_json_DeviceIPv6Address_to_ip
      field: json.DeviceIPv6Address
      type: ip
      ignore_missing: true
      if: ctx.json?.DeviceIPv6Address != null && ctx.json.DeviceIPv6Address != ''
      on_failure:
        - remove:
            field: json.DeviceIPv6Address
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_device_ipv6_into_host_ip
      field: host.ip
      value: '{{{json.DeviceIPv6Address}}}'
      if: ctx.json?.DeviceIPv6Address != null && ctx.json.DeviceIPv6Address != ''
      allow_duplicates: false
  - convert:
      tag: convert_json_DeviceIPv4Netmask
      field: json.DeviceIPv4Netmask
      target_field: cloudflare_logpush.dex_device_state_events.device.ipv4.netmask
      type: string
      ignore_missing: true
  - convert:
      tag: convert_json_DeviceIPv6Netmask
      field: json.DeviceIPv6Netmask
      target_field: cloudflare_logpush.dex_device_state_events.device.ipv6.netmask
      type: string
      ignore_missing: true

  # gateway.*
  - convert:
      tag: convert_json_GatewayIPv4Address_to_ip
      field: json.GatewayIPv4Address
      target_field: cloudflare_logpush.dex_device_state_events.gateway.ipv4.address
      type: ip
      ignore_missing: true
      if: ctx.json?.GatewayIPv4Address != null && ctx.json.GatewayIPv4Address != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_GatewayIPv4Netmask
      field: json.GatewayIPv4Netmask
      target_field: cloudflare_logpush.dex_device_state_events.gateway.ipv4.netmask
      type: string
      ignore_missing: true
  - convert:
      tag: convert_json_GatewayIPv6Address_to_ip
      field: json.GatewayIPv6Address
      target_field: cloudflare_logpush.dex_device_state_events.gateway.ipv6.address
      type: ip
      ignore_missing: true
      if: ctx.json?.GatewayIPv6Address != null && ctx.json.GatewayIPv6Address != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_GatewayIPv6Netmask
      field: json.GatewayIPv6Netmask
      target_field: cloudflare_logpush.dex_device_state_events.gateway.ipv6.netmask
      type: string
      ignore_missing: true

  # ISP public IPs -> source.ip. The device has both an IPv4 and IPv6 public
  # address assigned by the ISP, so source.ip is populated as an array holding
  # whichever are present. IPv4 geo/ASN enrichment maps to source.*; the IPv6
  # geo/ASN detail is kept in the package namespace because source.geo/source.as
  # can only describe a single address.
  - convert:
      tag: convert_json_ISPIPv4Address_to_ip
      field: json.ISPIPv4Address
      type: ip
      ignore_missing: true
      if: ctx.json?.ISPIPv4Address != null && ctx.json.ISPIPv4Address != ''
      on_failure:
        - remove:
            field: json.ISPIPv4Address
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_isp_ipv4_into_source_ip
      field: source.ip
      value: '{{{json.ISPIPv4Address}}}'
      if: ctx.json?.ISPIPv4Address != null && ctx.json.ISPIPv4Address != ''
      allow_duplicates: false
  - convert:
      tag: convert_json_ISPIPv4ASN_to_source_as_number
      field: json.ISPIPv4ASN
      target_field: source.as.number
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_ISPIPv4ASO_to_source_as_organization_name
      field: json.ISPIPv4ASO
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv4City_to_source_geo_city_name
      field: json.ISPIPv4City
      target_field: source.geo.city_name
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv4CountryISO_to_source_geo_country_iso_code
      field: json.ISPIPv4CountryISO
      target_field: source.geo.country_iso_code
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv4StateISO_to_source_geo_region_iso_code
      field: json.ISPIPv4StateISO
      target_field: source.geo.region_iso_code
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv4Zip_to_source_geo_postal_code
      field: json.ISPIPv4Zip
      target_field: source.geo.postal_code
      ignore_missing: true
  - convert:
      tag: convert_json_ISPIPv4Netmask
      field: json.ISPIPv4Netmask
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv4.netmask
      type: string
      ignore_missing: true

  # ISP IPv6 address -> source.ip (array), remaining IPv6 geo/ASN -> namespace
  - convert:
      tag: convert_json_ISPIPv6Address_to_ip
      field: json.ISPIPv6Address
      type: ip
      ignore_missing: true
      if: ctx.json?.ISPIPv6Address != null && ctx.json.ISPIPv6Address != ''
      on_failure:
        - remove:
            field: json.ISPIPv6Address
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_isp_ipv6_into_source_ip
      field: source.ip
      value: '{{{json.ISPIPv6Address}}}'
      if: ctx.json?.ISPIPv6Address != null && ctx.json.ISPIPv6Address != ''
      allow_duplicates: false
  - convert:
      tag: convert_json_ISPIPv6ASN
      field: json.ISPIPv6ASN
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.asn
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_ISPIPv6ASO
      field: json.ISPIPv6ASO
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.aso
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv6City
      field: json.ISPIPv6City
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.city
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv6CountryISO
      field: json.ISPIPv6CountryISO
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.country_iso
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv6StateISO
      field: json.ISPIPv6StateISO
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.state_iso
      ignore_missing: true
  - rename:
      tag: rename_json_ISPIPv6Zip
      field: json.ISPIPv6Zip
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.zip
      ignore_missing: true
  - convert:
      tag: convert_json_ISPIPv6Netmask
      field: json.ISPIPv6Netmask
      target_field: cloudflare_logpush.dex_device_state_events.isp.ipv6.netmask
      type: string
      ignore_missing: true

  # network.*
  - rename:
      tag: rename_json_ConnectionType_to_connection_type
      field: json.ConnectionType
      target_field: cloudflare_logpush.dex_device_state_events.network.connection_type
      ignore_missing: true
  - rename:
      tag: rename_json_NetworkSSID_to_ssid
      field: json.NetworkSSID
      target_field: cloudflare_logpush.dex_device_state_events.network.ssid
      ignore_missing: true
  - convert:
      tag: convert_json_NetworkReceivedBPS
      field: json.NetworkReceivedBPS
      target_field: cloudflare_logpush.dex_device_state_events.network.received_bps
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_NetworkSentBPS
      field: json.NetworkSentBPS
      target_field: cloudflare_logpush.dex_device_state_events.network.sent_bps
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # tunnel and connection state
  - rename:
      tag: rename_json_TunnelType_to_tunnel_type
      field: json.TunnelType
      target_field: cloudflare_logpush.dex_device_state_events.tunnel_type
      ignore_missing: true
  - rename:
      tag: rename_json_WarpColoCode_to_warp_colo_code
      field: json.WarpColoCode
      target_field: cloudflare_logpush.dex_device_state_events.warp_colo.code
      ignore_missing: true
  - rename:
      tag: rename_json_Status_to_status
      field: json.Status
      target_field: cloudflare_logpush.dex_device_state_events.status
      ignore_missing: true
  - rename:
      tag: rename_json_Mode_to_mode
      field: json.Mode
      target_field: cloudflare_logpush.dex_device_state_events.mode
      ignore_missing: true
  - rename:
      tag: rename_json_DoHSubdomain_to_doh_subdomain
      field: json.DoHSubdomain
      target_field: cloudflare_logpush.dex_device_state_events.doh_subdomain
      ignore_missing: true
  - convert:
      tag: convert_json_HandshakeLatencyMs
      field: json.HandshakeLatencyMs
      target_field: cloudflare_logpush.dex_device_state_events.handshake_latency_ms
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_WiFiStrengthDBM
      field: json.WiFiStrengthDBM
      target_field: cloudflare_logpush.dex_device_state_events.wifi_strength_dbm
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # toggles
  - convert:
      tag: convert_json_AlwaysOn
      field: json.AlwaysOn
      target_field: cloudflare_logpush.dex_device_state_events.always_on
      type: boolean
      ignore_missing: true
      if: ctx.json?.AlwaysOn != null && ctx.json.AlwaysOn != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_AppFirewallEnabled
      field: json.AppFirewallEnabled
      target_field: cloudflare_logpush.dex_device_state_events.app_firewall_enabled
      type: boolean
      ignore_missing: true
      if: ctx.json?.AppFirewallEnabled != null && ctx.json.AppFirewallEnabled != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_FirewallEnabled
      field: json.FirewallEnabled
      target_field: cloudflare_logpush.dex_device_state_events.firewall_enabled
      type: boolean
      ignore_missing: true
      if: ctx.json?.FirewallEnabled != null && ctx.json.FirewallEnabled != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_SwitchLocked
      field: json.SwitchLocked
      target_field: cloudflare_logpush.dex_device_state_events.switch_locked
      type: boolean
      ignore_missing: true
      if: ctx.json?.SwitchLocked != null && ctx.json.SwitchLocked != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # battery.*
  - convert:
      tag: convert_json_BatteryCharging
      field: json.BatteryCharging
      target_field: cloudflare_logpush.dex_device_state_events.battery.charging
      type: boolean
      ignore_missing: true
      if: ctx.json?.BatteryCharging != null && ctx.json.BatteryCharging != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_BatteryCycles
      field: json.BatteryCycles
      target_field: cloudflare_logpush.dex_device_state_events.battery.cycles
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_BatteryPercentage
      field: json.BatteryPercentage
      target_field: cloudflare_logpush.dex_device_state_events.battery.percentage
      type: float
      ignore_missing: true
      if: ctx.json?.BatteryPercentage != null && ctx.json.BatteryPercentage != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cpu.*
  - convert:
      tag: convert_json_CPUPercentage
      field: json.CPUPercentage
      target_field: cloudflare_logpush.dex_device_state_events.cpu.percentage
      type: float
      ignore_missing: true
      if: ctx.json?.CPUPercentage != null && ctx.json.CPUPercentage != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # Cloudflare reports CPUPercentage as a fraction from 0 to 1, which matches the
  # ECS host.cpu.usage scale (0 to 1), so it is copied without normalisation.
  - set:
      tag: set_host_cpu_usage_from_cpu_percentage
      field: host.cpu.usage
      copy_from: cloudflare_logpush.dex_device_state_events.cpu.percentage
      ignore_empty_value: true
  - rename:
      tag: rename_json_CPUPercentageByApp
      field: json.CPUPercentageByApp
      target_field: cloudflare_logpush.dex_device_state_events.cpu.percentage_by_app
      ignore_missing: true

  # disk.*
  - convert:
      tag: convert_json_DiskReadBPS
      field: json.DiskReadBPS
      target_field: cloudflare_logpush.dex_device_state_events.disk.read_bps
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_DiskWriteBPS
      field: json.DiskWriteBPS
      target_field: cloudflare_logpush.dex_device_state_events.disk.write_bps
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_DiskUsagePercentage
      field: json.DiskUsagePercentage
      target_field: cloudflare_logpush.dex_device_state_events.disk.usage_percentage
      type: float
      ignore_missing: true
      if: ctx.json?.DiskUsagePercentage != null && ctx.json.DiskUsagePercentage != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # ram.*
  - convert:
      tag: convert_json_RAMAvailableKB
      field: json.RAMAvailableKB
      target_field: cloudflare_logpush.dex_device_state_events.ram.available_kb
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_RAMUsedPercentage
      field: json.RAMUsedPercentage
      target_field: cloudflare_logpush.dex_device_state_events.ram.used_percentage
      type: float
      ignore_missing: true
      if: ctx.json?.RAMUsedPercentage != null && ctx.json.RAMUsedPercentage != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_RAMUsedPercentageByApp
      field: json.RAMUsedPercentageByApp
      target_field: cloudflare_logpush.dex_device_state_events.ram.used_percentage_by_app
      ignore_missing: true

  # tunnel stats and experimental payloads
  - rename:
      tag: rename_json_TunnelStatsDownstream
      field: json.TunnelStatsDownstream
      target_field: cloudflare_logpush.dex_device_state_events.tunnel_stats.downstream
      ignore_missing: true
  - rename:
      tag: rename_json_TunnelStatsUpstream
      field: json.TunnelStatsUpstream
      target_field: cloudflare_logpush.dex_device_state_events.tunnel_stats.upstream
      ignore_missing: true
  - rename:
      tag: rename_json_ExperimentalExtra
      field: json.ExperimentalExtra
      target_field: cloudflare_logpush.dex_device_state_events.experimental_extra
      ignore_missing: true

  # related.*
  - append:
      tag: append_host_id_into_related_hosts
      field: related.hosts
      value: '{{{host.id}}}'
      if: ctx.host?.id != null
      allow_duplicates: false
  # Derive related.ip from the IPs that actually landed in source.ip and host.ip
  # (the ISP public IPs and the device private IPs) rather than re-reading the
  # json.* fields, which can still hold a malformed value if the ip convert failed.
  - foreach:
      tag: foreach_source_ip_into_related_ip
      field: source.ip
      ignore_missing: true
      processor:
        append:
          field: related.ip
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_host_ip_into_related_ip
      field: host.ip
      ignore_missing: true
      processor:
        append:
          field: related.ip
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - append:
      tag: append_gateway_ipv4_into_related_ip
      field: related.ip
      value: '{{{cloudflare_logpush.dex_device_state_events.gateway.ipv4.address}}}'
      if: ctx.cloudflare_logpush?.dex_device_state_events?.gateway?.ipv4?.address != null
      allow_duplicates: false
  - append:
      tag: append_gateway_ipv6_into_related_ip
      field: related.ip
      value: '{{{cloudflare_logpush.dex_device_state_events.gateway.ipv6.address}}}'
      if: ctx.cloudflare_logpush?.dex_device_state_events?.gateway?.ipv6?.address != null
      allow_duplicates: false
  - remove:
      tag: remove_json_conf
      field:
        - json
        - _conf
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_tag
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
