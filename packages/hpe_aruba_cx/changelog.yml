# newer versions go on top
- version: "0.4.4"
  changes:
    - description: Allow an optional colon after the process ID bracket in the syslog header grok pattern so log lines without it are parsed correctly.
      type: bugfix
      link: https://github.com/elastic/integrations/issues/18867
