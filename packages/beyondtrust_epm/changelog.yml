      type: enhancement
      link: https://github.com/elastic/integrations/pull/20572
- version: "0.1.1"
  changes:
    - description: Set agentless deployment mode `release` field to `ga`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20463
- version: 0.1.0
  changes:
