---
description: Pipeline for processing event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_8efb762c
      value: 9.3.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      tag: remove_agentless_tags_0bec60b2
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      ignore_missing: true
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_f9dd6b88
      if: ctx.event?.original == null
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message.
  - remove:
      field: message
      tag: remove_message_e7d2c492
      if: ctx.event?.original != null
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      field: event.original
      tag: json_event_original_c1ae4d4c
      target_field: beyondtrust_epm.event
  - set:
      field: observer.vendor
      tag: set_observer_vendor_333a3a1b
      value: BeyondTrust
  - set:
      field: observer.product
      tag: set_observer_product_4ca43b73
      value: Endpoint Privilege Management
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - append:
      field: event.type
      tag: append_event_type_info_700bb417
      value: info
      allow_duplicates: false
      description: BeyondTrust EPM events are informational; set the ECS event.type companion required alongside event.category.
