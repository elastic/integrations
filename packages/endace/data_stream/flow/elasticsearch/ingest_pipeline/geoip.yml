---
description: GeoIP enrichment.
processors:
  - geoip:
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      tag: source_geo
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: source_geo_as
  - rename:
      tag: rename_source_as_number
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true

  - geoip:
      field: destination.ip
      target_field: destination.geo
      ignore_missing: true
      tag: destination_geo
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: destination_geo_as
  - rename:
      tag: rename_destination_as_number
      field: destination.as.asn
      target_field: destination.as.number
      ignore_missing: true
  - rename:
      tag: rename_destination_as_organization_name
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      ignore_missing: true

  - geoip:
      field: server.ip
      target_field: server.geo
      ignore_missing: true
      tag: server_geo
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: server.ip
      target_field: server.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: server_geo_as
  - rename:
      tag: rename_server_as_number
      field: server.as.asn
      target_field: server.as.number
      ignore_missing: true
  - rename:
      tag: rename_server_as_organization_name
      field: server.as.organization_name
      target_field: server.as.organization.name
      ignore_missing: true

  - geoip:
      field: client.ip
      target_field: client.geo
      ignore_missing: true
      tag: client_geo
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: client.ip
      target_field: client.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: client_geo_as
  - rename:
      tag: rename_client_as_number
      field: client.as.asn
      target_field: client.as.number
      ignore_missing: true
  - rename:
      tag: rename_client_as_organization_name
      field: client.as.organization_name
      target_field: client.as.organization.name
      ignore_missing: true

on_failure:
  - append:
      tag: append_error_message_1fd9793d
      field: error.message
      value: |-
        Processor "{{ _ingest.on_failure_processor_type }}" with tag "{{ _ingest.on_failure_processor_tag }}" in pipeline "{{ _ingest.on_failure_pipeline }}" failed with message "{{ _ingest.on_failure_message }}"
  - set:
      tag: set_event_kind_f51b77ad
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
