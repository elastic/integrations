---
description: ECS compatibility layer pipeline.
processors:
  - rename:
      tag: rename_flow
      field: flow
      target_field: network_traffic.flow
      ignore_missing: true
  - rename:
      # Retained for legacy dashboard behaviour.
      tag: rename_status
      field: status
      target_field: network_traffic.status
      ignore_missing: true
  - rename:
      tag: rename_process_ppid_to_process_parent_pid_efedbd92
      field: process.ppid
      target_field: process.parent.pid
      ignore_missing: true
  # Remove packetbeat fields that are handled by agent or fleet.
  - remove:
      tag: remove_type
      field: type
      ignore_missing: true
  - remove:
      tag: remove_event_dataset
      field: event.dataset
      ignore_missing: true

on_failure:
  - append:
      tag: append_error_message_9319ae1f
      field: error.message
      value: |-
          Processor "{{{ _ingest.on_failure_processor_type }}}" with tag "{{{ _ingest.on_failure_processor_tag }}}" in pipeline "{{{ _ingest.on_failure_pipeline }}}" failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      tag: set_event_kind_f51b77ad
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
