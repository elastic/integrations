---
description: Initial pipeline for parsing ETI TAXII2 feed
processors:
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_event_kind_3410a97a
      field: event.kind
      value: enrichment
  - append:
      tag: append_event_category_8e392818
      field: event.category
      value: threat
      allow_duplicates: false
  - append:
      tag: append_event_type_d9f6d523
      field: event.type
      value: indicator
      allow_duplicates: false
  - set:
      tag: set_threat_indicator_provider_279cc367
      field: threat.indicator.provider
      value: eset
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_eti_4a2d37eb
      field: event.original
      target_field: eti
  - drop:
      tag: drop_4393c941
      if: ctx.eti?.type != 'indicator'
  - set:
      tag: set_threat_feed_name_ac600b0f
      field: threat.feed.name
      value: "ESET APT stix 2.1"
  - date:
      tag: date_eti_created_to_timestamp_568d758e
      field: eti.created
      target_field: "@timestamp"
      formats:
        - "ISO8601"
      if: "ctx.eti?.created != null"
  - date:
      tag: date_eti_modified_to_threat_indicator_last_seen_1d05799e
      field: eti.modified
      target_field: threat.indicator.last_seen
      formats:
        - "ISO8601"
      if: "ctx.eti?.modified != null"
  - set:
      tag: set_threat_indicator_modified_at_84bbc9df
      field: threat.indicator.modified_at
      copy_from: threat.indicator.last_seen
      if: "ctx.threat?.indicator?.last_seen != null"
  - script:
      tag: script_de34c356
      lang: painless
      source: >-
        if (ctx.eset == null) {
          ctx.eset = new HashMap();
        }
        
        ctx.eset.valid_until =  ZonedDateTime.parse(ctx['@timestamp']).plusDays(365);
      if: "ctx['@timestamp'] != null"

  - rename:
      tag: rename_eti_id_to_eset_id_c4d94906
      field: eti.id
      target_field: eset.id
      ignore_missing: true

  - foreach:
      tag: foreach_eti_labels_dc3f3717
      field: eti.labels
      if: ctx.eti?.labels != null
      processor:
        grok:
            tag: grok_ingest_value_1183faee
            field: _ingest._value
            patterns:
                - "^misp:name=\"%{DATA:eset.name}\""
                - "^misp:type=\"%{DATA:eset.type}\""
                - "^misp:category=\"%{DATA:eset.category}\""
                - "^misp:meta-category=\"%{DATA:eset.meta_category}\""
            ignore_failure: true

  - set:
      tag: set_threat_indicator_type_f2454286
      field: threat.indicator.type
      value: x509-certificate
      if: "ctx.eset?.name == 'x509'"
  - set:
      tag: set_threat_indicator_type_35b7dff0
      field: threat.indicator.type
      value: domain-name
      if: ctx.eset?.name != null && ctx.eset?.name.startsWith('domain')
  - set:
      tag: set_threat_indicator_type_cbc8f849
      field: threat.indicator.type
      value: file
      if: |
        ctx.eset?.name == 'file' ||
        ctx.eset?.meta_category == 'file'
  - set:
      tag: set_threat_indicator_type_4a7254d0
      field: threat.indicator.type
      value: url
      if: ctx.eset?.name == 'url'
  - set:
      tag: set_threat_indicator_type_fd84ecd4
      field: threat.indicator.type
      value: email-addr
      if: |
        ctx.eset?.name == 'email' ||
        (ctx.eset?.type != null && ctx.eset?.type?.startsWith('email'))

  - split:
      tag: split_eti_pattern_to_eti__patterns_b7757bc8
      field: eti.pattern
      target_field: eti._patterns
      separator: ' AND '
      if: ctx.eti?.pattern != null

  - pipeline:
      tag: pipeline_278166c0
      name: '{{ IngestPipeline "pipeline-file" }}'
      if: ctx.threat?.indicator?.type == 'file'
  - pipeline:
      tag: pipeline_4994219f
      name: '{{ IngestPipeline "pipeline-email" }}'
      if: ctx.threat?.indicator?.type == 'email-addr'
  - pipeline:
      tag: pipeline_2b790053
      name: '{{ IngestPipeline "pipeline-url" }}'
      if: ctx.threat?.indicator?.type == 'url'
  - pipeline:
      tag: pipeline_41287a49
      name: '{{ IngestPipeline "pipeline-domain-ip" }}'
      if: ctx.threat?.indicator?.type == 'domain-name'
  - pipeline:
      tag: pipeline_e1da1005
      name: '{{ IngestPipeline "pipeline-cert" }}'
      if: ctx.threat?.indicator?.type == 'x509-certificate'
  - set:
      tag: set_threat_indicator_confidence_ad47df68
      field: threat.indicator.confidence
      value: High
  - remove:
      tag: remove_886d6f4f
      field:
        - eti
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_50c8d6aa
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object o) {
          if (o == null || o == '') {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
  - append:
      tag: append_event_kind_acc297e3
      field: event.kind
      value: pipeline_error
      allow_duplicates: false
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
