_meta:
  fleet_transform_version: 0.1.0
  managed: true
description: Latest ESET Android threats IoC data
dest:
  index: logs-ti_eset_latest.dest_androidthreats-1
  aliases:
    - alias: logs-ti_eset_latest.androidthreats
      move_on_creation: true
frequency: 30s
latest:
  sort: '@timestamp'
  unique_key:
    - event.dataset
    - eset.id
retention_policy:
  time:
    field: eset.valid_until
    max_age: 1m
source:
  index:
    - logs-ti_eset.androidthreats-*
  query:
    bool:
      must_not:
        - exists:
            field: error.message
sync:
  time:
    delay: 120s
    field: event.ingested
settings:
  num_failure_retries: -1
