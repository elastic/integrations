_meta:
  fleet_transform_version: 0.1.0
  managed: true
description: Latest ESET PUA dual applications IoC data
dest:
  index: logs-ti_eset_latest.dest_puadualapps-1
  aliases:
    - alias: logs-ti_eset_latest.puadualapps
      move_on_creation: true
frequency: 30s
latest:
  sort: '@timestamp'
  unique_key:
    - event.dataset
    - eset.id
retention_policy:
  time:
    field: eset.valid_until
    max_age: 1m
source:
  index:
    - logs-ti_eset.puadualapps-*
  query:
    bool:
      must_not:
        - exists:
            field: error.message
sync:
  time:
    delay: 120s
    field: event.ingested
settings:
  num_failure_retries: -1
