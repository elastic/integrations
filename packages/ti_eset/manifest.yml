format_version: 3.4.0
name: ti_eset
title: "ESET Threat Intelligence"
version: "1.10.0"
description: "Ingest threat intelligence indicators from ESET Threat Intelligence with Elastic Agent."
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/overview.png
    title: threat intelligence overview
    size: 600x600
    type: image/png
  - src: /img/files.png
    title: threat intelligence files
    size: 600x600
    type: image/png
  - src: /img/url-ip.png
    title: threat intelligence domains, URLs and IPs
    size: 600x600
    type: image/png
icons:
  - src: /img/eset-lozenge-color-rgb.svg
    title: Sample logo
    size: 96x96
    type: image/svg+xml
vars:
  - name: username
    type: text
    title: ETI Username
    required: true
    show_user: true
  - name: password
    type: password
    title: ETI Password
    multi: false
    required: true
    secret: true
    show_user: true
policy_templates:
  - name: eset
    title: ETI feeds (TAXII version 2.1)
    description: Collect data from ETI feeds (TAXII version 2.1)
    inputs:
      - type: httpjson
        title: ETI Legacy Feeds (TAXII 2.1)
        description: Collection of ETI legacy feeds
      - type: cel
        title: ETI New-Generation Feeds (TAXII 2.1)
        description: Collection of ETI new-generation feeds
owner:
  github: elastic/security-service-integrations
  type: partner
