wait_for_data_timeout: 1m
service: mqtt-broker
input: mqtt
policy_template: mqtt_logs
vars:
  hosts:
    - "tcp://{{Hostname}}:{{Port}}"
  topics:
    - sensors/#
  # MQTT caps client identifiers at 23 characters.
  client_id: ep-mqtt-logs
  qos: "1"
  data_stream.dataset: mqtt.generic
  preserve_original_event: true
assert:
  hit_count: 5
