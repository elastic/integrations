wait_for_data_timeout: 1m
service: mqtt-broker
input: mqtt
policy_template: mqtt_traces
# Same situation as the metrics config: ingestion works — a run against a 9.4.3
# stack produced traces-mqtt.generic-<ns> holding all five sample messages — but
# the runner simulates an index template by name (traces-mqtt.generic) and Fleet
# creates none for the traces type of an input package.
skip:
  link: https://github.com/elastic/elastic-package/issues
  reason: "elastic-package cannot validate mappings for a traces input package: Fleet creates no traces-<dataset> index template. Ingestion is verified manually."
vars:
  hosts:
    - "tcp://{{Hostname}}:{{Port}}"
  topics:
    - sensors/#
  # MQTT caps client identifiers at 23 characters.
  client_id: ep-mqtt-traces
  qos: "1"
  data_stream.dataset: mqtt.generic
  preserve_original_event: true
assert:
  hit_count: 5
