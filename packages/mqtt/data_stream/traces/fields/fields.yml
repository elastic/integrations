- name: mqtt
  type: group
  description: >
    Message metadata reported by the MQTT input for every received message.

  fields:
    - name: topic
      type: keyword
      description: >
        Topic the message was published to. With a wildcard subscription this is the concrete topic, not the filter that matched it.

    - name: qos
      type: long
      description: >
        Quality of service level the message was delivered with: 0 at most once, 1 at least once, 2 exactly once.

    - name: retained
      type: boolean
      description: >
        Whether the broker had this message stored as the retained message for its topic and replayed it on subscribe, rather than it arriving live.

    - name: duplicate
      type: boolean
      description: >
        Whether the broker flagged the message as a redelivery. Only meaningful at QoS 1 and 2.

    - name: message_id
      type: long
      description: >
        Broker-assigned packet identifier used to correlate delivery and acknowledgement. Unique only while the message is in flight.

