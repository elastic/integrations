wait_for_data_timeout: 1m
service: mqtt-broker
input: mqtt
vars:
  hosts:
    - "tcp://{{Hostname}}:{{Port}}"
data_stream:
  vars:
    topics:
      - sensors/#
    # MQTT caps client identifiers at 23 characters.
    client_id: ep-mqtt-traces
    qos: "1"
    data_stream.dataset: mqtt.traces
    preserve_original_event: true
assert:
  hit_count: 5
