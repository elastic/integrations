---
description: Pipeline for Tines Audit Logs
processors:
  - json:
      tag: json_message_to_json_beeea2b2
      field: message
      target_field: json
  - fail:
      tag: fail_d1247e5f
      if: ctx.json == null || !(ctx.json instanceof Map)
      message: missing json object in input document
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - rename:
      tag: rename_json_to_tines_audit_log_c84e81cf
      field: json
      target_field: tines.audit_log
      ignore_missing: true
  - rename:
      tag: rename__tmp_tenant_url_to_tines_tenant_url_9a3ea2f7
      field: _tmp.tenant_url
      target_field: tines.tenant_url
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_571e4366
      description: "Generate a unique document ID using the unique Tines audit log ID and created/updated timestamps"
      fields:
        - tines.audit_log.id
        - tines.audit_log.created_at
        - tines.audit_log.updated_at
      target_field: _id
      method: MurmurHash3
      ignore_missing: true
  - date:
      tag: date_tines_audit_log_created_at_c8edf121
      description: Use date/time from created_at field first
      field: tines.audit_log.created_at
      formats:
        - ISO8601
      if: ctx.tines?.audit_log?.created_at != null && ctx.tines?.event?.created_at != ""
  - date:
      tag: date_tines_audit_log_updated_at_62eaafc6
      description: Override date/time using updated_at if it exists
      field: tines.audit_log.updated_at
      formats:
        - ISO8601
      if: ctx.tines?.audit_log?.updated_at != null && ctx.tines?.event?.updated_at != ""
  - convert:
      tag: convert_tines_audit_log_id_to_event_id_7a4c9ae1
      field: tines.audit_log.id
      type: string
      target_field: event.id
      ignore_missing: true
  - append:
      tag: append_event_category_a43665d3
      field: event.category
      value:
        - configuration
      allow_duplicates: false
  - append:
      tag: append_event_type_6adea021
      field: event.type
      value:
        - info
      allow_duplicates: false
  - set:
      tag: set_event_action_1ee801e9
      copy_from: tines.audit_log.operation_name
      field: event.action
      ignore_empty_value: true
  - convert:
      tag: convert_tines_audit_log_user_id_to_user_id_b2eda3b6
      field: tines.audit_log.user_id
      type: string
      target_field: user.id
      ignore_missing: true
  - set:
      tag: set_user_email_49152867
      copy_from: tines.audit_log.user_email
      field: user.email
      ignore_empty_value: true
  - set:
      tag: set_user_name_d12aa275
      copy_from: tines.audit_log.user_name
      field: user.name
      ignore_empty_value: true
  - append:
      tag: append_related_user_837e080f
      field: related.user
      value: "{{{user.name}}}"
      if: ctx.user?.name != null
      allow_duplicates: false
  - convert:
      tag: convert_tines_audit_log_request_ip_to_source_ip_34fdb5f0
      field: tines.audit_log.request_ip
      type: ip
      target_field: source.ip
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - append:
      tag: append_related_ip_ad877ddf
      field: related.ip
      value:
        - "{{{source.ip}}}"
      if: ctx.source?.ip != null
      allow_duplicates: false
  - user_agent:
      tag: user_agent_tines_audit_log_request_user_agent_859ca0e8
      field: tines.audit_log.request_user_agent
      ignore_missing: true
      ignore_failure: true
  ### extraneous type assertions
  - convert:
      tag: convert_field_id_long
      field: tines.audit_log.inputs.fieldId
      type: long
      if: ctx.tines?.audit_log?.inputs?.fieldId != null
      on_failure:
        - append:
            tag: append_error_message_9f6aacdb
            field: error.message
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
              {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
        - remove:
            tag: remove_tines_audit_log_inputs_fieldId_8db08b8a
            field: tines.audit_log.inputs.fieldId
            ignore_failure: true
  - convert:
      tag: convert_tines_audit_log_inputs_inputs_multiSelect_6848a57a
      field: tines.audit_log.inputs.inputs.multiSelect
      type: boolean
      if: ctx.tines?.audit_log?.inputs?.inputs?.multiSelect != null
      on_failure:
        - append:
            tag: append_error_message_74368b63
            field: error.message
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
              {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
        - remove:
            tag: remove_tines_audit_log_inputs_inputs_multiSelect_3cd1e50d
            field: tines.audit_log.inputs.inputs.multiSelect
            ignore_failure: true
  - convert:
      tag: convert_tines_audit_log_inputs_inputs_required_1c139056
      field: tines.audit_log.inputs.inputs.required
      type: boolean
      if: ctx.tines?.audit_log?.inputs?.inputs?.required != null
      on_failure:
        - append:
            tag: append_error_message_f5dd491d
            field: error.message
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
              {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
        - remove:
            tag: remove_tines_audit_log_inputs_inputs_required_4be2547b
            field: tines.audit_log.inputs.inputs.required
            ignore_failure: true
  ### cleanup
  - script:
      tag: script_e2ccbdd7
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - remove:
      tag: remove_dddff29d
      description: "Cleanup temporary and other garbage fields"
      field:
        - _tmp
        - message
        - json
      ignore_missing: true
  - remove:
      tag: remove_341c4440
      description: "Remove ECS mapped field original duplicates unless tags indicate not to"
      field:
        - tines.audit_log.id
        - tines.audit_log.operation_name
        - tines.audit_log.request_ip
        - tines.audit_log.request_user_agent
        - tines.audit_log.user_email
        - tines.audit_log.user_id
        - tines.audit_log.user_name
      if: "ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))"
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
