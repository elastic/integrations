title: Claude Cowork events
type: logs
streams:
  - input: otelcol
    title: Claude Cowork events
    description: Receive Claude Cowork OTLP log events.
    vars:
      - name: http_endpoint
        type: text
        required: true
        show_user: true
        title: HTTP Endpoint
        description: >-
          Address and port to listen on for OTLP HTTP connections. The default
          port 4319 avoids conflict with claude_code (default: 4318) when both
          are deployed on the same Elastic Agent.
        default: 0.0.0.0:4319
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: >-
          Preserves a JSON copy of the raw OTel event in the field event.original. Increases storage but useful for forensic analysis.
        type: bool
        multi: false
        default: false
