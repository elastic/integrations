  - rename:
      field: json.performed_by.id
      tag: rename_performed_by_id_181a883d
      target_field: beyondtrust_pra.access_session.performed_by.id
      ignore_missing: true
  - set:
      field: source.user.id
      tag: set_source_user_id_from_access_session_performed_by_id_993a5ed4
      copy_from: beyondtrust_pra.access_session.performed_by.id
      ignore_empty_value: true
  - set:
      field: beyondtrust_pra.access_session.performed_by.invited
      tag: set_performed_by_invited_true_c0c00fd3
      value: true
      if: ctx.json?.performed_by?.invited == 1
  - set:
      field: beyondtrust_pra.access_session.performed_by.invited
      tag: set_performed_by_invited_false_938e7bf4
      value: false
      if: ctx.json?.performed_by?.invited == 0
  - convert:
      field: beyondtrust_pra.access_session.performed_by.invited
      tag: convert_performed_by_invited_to_boolean_945a6ea8
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_bfc24c27
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.performed_by.os
      tag: rename_performed_by_os_9e56c63e
      target_field: beyondtrust_pra.access_session.performed_by.os
      ignore_missing: true
  - grok:
      field: json.performed_by.private_ip
      tag: grok_performed_by_private_ip_8d8982de
      patterns:
        - ^%{IP:json.performed_by.private_ip}:%{POSINT:json.performed_by.private_port}$
      ignore_failure: true
  - convert:
      field: json.performed_by.private_ip
      tag: convert_performed_by_private_ip_to_ip_6f5bf94e
      target_field: beyondtrust_pra.access_session.performed_by.private_ip
      type: ip
      ignore_missing: true
      if: ctx.json?.performed_by?.private_ip != ''
      on_failure:
        - append:
            tag: append_error_message_249704ff
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.nat.ip
      tag: set_source_nat_ip_from_access_session_performed_by_private_ip_f3d14747
      copy_from: beyondtrust_pra.access_session.performed_by.private_ip
      ignore_empty_value: true
  - convert:
      field: json.performed_by.private_port
      tag: convert_performed_by_private_port_to_long_8ac8db84
      target_field: beyondtrust_pra.access_session.performed_by.private_port
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_da3294f2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.nat.port
      tag: set_source_nat_port_from_performed_by_private_port_ad6cf8c2
      copy_from: beyondtrust_pra.access_session.performed_by.private_port
