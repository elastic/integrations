  - grok:
      field: json.performed_by.public_ip
      tag: grok_performed_by_public_ip_0a253aae
      patterns:
        - ^%{IP:json.performed_by.public_ip}:%{POSINT:json.performed_by.public_port}$
      ignore_failure: true
  - convert:
      field: json.performed_by.public_ip
      tag: convert_performed_by_public_ip_to_ip_7c0ae04b
      target_field: beyondtrust_pra.access_session.performed_by.public_ip
      type: ip
      ignore_missing: true
      if: ctx.json?.performed_by?.public_ip != ''
      on_failure:
        - append:
            tag: append_error_message_004d21cf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip_from_access_session_performed_by_public_ip_7c2ba671
      copy_from: beyondtrust_pra.access_session.performed_by.public_ip
      ignore_empty_value: true
  - convert:
      field: json.performed_by.public_port
      tag: convert_performed_by_public_port_to_long_1888a36e
      target_field: beyondtrust_pra.access_session.performed_by.public_port
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_b38cf330
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.port
      tag: set_source_port_from_performed_by_public_port_5699b5a3
      copy_from: beyondtrust_pra.access_session.performed_by.public_port
      ignore_empty_value: true
