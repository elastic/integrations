---
description: Pipeline for processing access session logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - rename:
      field: json.body
      tag: rename_body_7555714c
      target_field: beyondtrust_pra.access_session.body
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_access_session_body_f0a1abb8
      copy_from: beyondtrust_pra.access_session.body
      ignore_empty_value: true
  - set:
      field: observer.product
      tag: set_observer_product_b4e39bfb
      value: Privileged Remote Access
  - set:
      field: observer.type
      tag: set_observer_type_5f5ce80f
      value: Proxy
  - set:
      field: observer.vendor
      tag: set_observer_vendor_333a3a1b
      value: BeyondTrust
  - rename:
      field: json.destination.display_name
      tag: rename_destination_display_name_06cbde88
      target_field: beyondtrust_pra.access_session.destination.display_name
      ignore_missing: true
  - rename:
      field: json.destination.gsnumber
      tag: rename_destination_gsnumber_247dee46
      target_field: beyondtrust_pra.access_session.destination.gsnumber
      ignore_missing: true
  - rename:
      field: json.destination.hostname
      tag: rename_destination_hostname_7f38d759
      target_field: beyondtrust_pra.access_session.destination.hostname
      ignore_missing: true
  - set:
      field: destination.domain
      tag: set_destination_domain_from_access_session_destination_hostname_0de07a69
      copy_from: beyondtrust_pra.access_session.destination.hostname
      ignore_empty_value: true
  - rename:
      field: json.destination.id
      tag: rename_destination_id_f42b6183
      target_field: beyondtrust_pra.access_session.destination.id
      ignore_missing: true
  - set:
      field: destination.user.id
      tag: set_destination_user_id_from_access_session_destination_id_e6948768
      copy_from: beyondtrust_pra.access_session.destination.id
      ignore_empty_value: true
  - set:
      field: beyondtrust_pra.access_session.destination.invited
      tag: set_destination_invited_true_71dd255a
      value: true
      if: ctx.json?.destination?.invited == 1
  - set:
      field: beyondtrust_pra.access_session.destination.invited
      tag: set_destination_invited_false_80e6d75f
      value: false
      if: ctx.json?.destination?.invited == 0
  - convert:
      field: beyondtrust_pra.access_session.destination.invited
      tag: convert_destination_invited_to_boolean_e09967c5
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_aca9662b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.destination.os
      tag: rename_destination_os_f2301791
      target_field: beyondtrust_pra.access_session.destination.os
      ignore_missing: true
  - grok:
      field: json.destination.private_ip
      tag: grok_destination_private_ip_dab30381
      patterns:
        - ^%{IP:json.destination.private_ip}:%{POSINT:json.destination.private_port}$
      ignore_failure: true
  - convert:
      field: json.destination.private_ip
      tag: convert_destination_private_ip_to_ip_c6819cd3
      target_field: beyondtrust_pra.access_session.destination.private_ip
      type: ip
      ignore_missing: true
      if: ctx.json?.destination?.private_ip != ''
      on_failure:
        - append:
            tag: append_error_message_95f2cce3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.nat.ip
      tag: set_destination_nat_ip_from_access_session_destination_private_ip_0f049bd1
      copy_from: beyondtrust_pra.access_session.destination.private_ip
      ignore_empty_value: true
  - convert:
      field: json.destination.private_port
      tag: convert_destination_private_port_to_long_694c9161
      target_field: beyondtrust_pra.access_session.destination.private_port
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_703899d8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.nat.port
      tag: set_destination_nat_port_from_destination_private_port_f97f8ea8
      copy_from: beyondtrust_pra.access_session.destination.private_port
      ignore_empty_value: true
  - grok:
      field: json.destination.public_ip
      tag: grok_destination_public_ip_999eb23f
      patterns:
        - ^%{IP:json.destination.public_ip}:%{POSINT:json.destination.public_port}$
      ignore_failure: true
  - convert:
      field: json.destination.public_ip
      tag: convert_destination_public_ip_to_ip_4a928659
      target_field: beyondtrust_pra.access_session.destination.public_ip
      type: ip
      ignore_missing: true
      if: ctx.json?.destination?.public_ip != ''
      on_failure:
        - append:
            tag: append_error_message_6b261a7f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.ip
      tag: set_destination_ip_from_access_session_destination_public_ip_4d75c23e
      copy_from: beyondtrust_pra.access_session.destination.public_ip
      ignore_empty_value: true
  - geoip:
      field: destination.ip
      tag: geoip_destination_ip_71881fab
      target_field: destination.geo
      ignore_missing: true
  - convert:
      field: json.destination.public_port
      tag: convert_destination_public_port_to_long_ab13194e
      target_field: beyondtrust_pra.access_session.destination.public_port
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_1da7a49a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.port
      tag: set_destination_port_from_destination_public_port_a630a758
      copy_from: beyondtrust_pra.access_session.destination.public_port
      ignore_empty_value: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      tag: geoip_destination_as_4e3ec16d
      target_field: destination.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      field: destination.as.asn
      tag: rename_destination_as_asn_4968f9c8
      target_field: destination.as.number
      ignore_missing: true
  - rename:
      field: destination.as.organization_name
      tag: rename_destination_as_organization_name_fb88b41e
      target_field: destination.as.organization.name
      ignore_missing: true
  - convert:
      field: json.destination.seconds_involved
      tag: convert_destination_seconds_involved_to_long_df57f748
      target_field: beyondtrust_pra.access_session.destination.seconds_involved
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_a93501ba
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: beyondtrust_pra.access_session.destination.session_owner
      tag: set_destination_session_owner_true_c407b17c
      value: true
      if: ctx.json?.destination?.session_owner == 1
  - set:
      field: beyondtrust_pra.access_session.destination.session_owner
      tag: set_destination_session_owner_false_86d301a0
      value: false
      if: ctx.json?.destination?.session_owner == 0
  - rename:
      field: json.destination.type
      tag: rename_destination_type_1bf19f94
      target_field: beyondtrust_pra.access_session.destination.type
      ignore_missing: true
  - rename:
      field: json.destination.username
      tag: rename_destination_username_9ee2ae55
      target_field: beyondtrust_pra.access_session.destination.username
      ignore_missing: true
  - set:
      field: destination.user.name
      tag: set_destination_user_name_from_access_session_destination_username_c1a59221
      copy_from: beyondtrust_pra.access_session.destination.username
      ignore_empty_value: true
  - rename:
      field: json.encoded_body
      tag: rename_encoded_body_b9c40328
      target_field: beyondtrust_pra.access_session.encoded_body
      ignore_missing: true
  - rename:
      field: json.event_type
      tag: rename_event_type_e5d12a5c
      target_field: beyondtrust_pra.access_session.event_type
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_from_access_session_event_type_cf21b5af
      copy_from: beyondtrust_pra.access_session.event_type
      ignore_empty_value: true
  - lowercase:
      field: event.action
      tag: lowercase_event_action_945f0fcf
      ignore_missing: true
  - split:
      field: event.action
      tag: split_event_action_ee0a3f8a
      separator: \s+
      ignore_missing: true
      if: ctx.event?.action != ''
      on_failure:
        - append:
            tag: append_error_message_ce1e3af4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - join:
      field: event.action
      tag: join_event_action_45ca9d3c
      separator: '-'
      if: ctx.event?.action instanceof List
      on_failure:
        - append:
            tag: append_error_message_b7327b72
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: map_event_category_and_event_type_from_event_action_a383af7b
      lang: painless
      description: Map event.category and event.type from event.action
      if: ctx.event?.action != null
      params:
        'command-shell-session-started':
          category:
            - intrusion_detection
          type:
            - info
        'conference-member-added':
          category:
            - iam
          type:
            - user
        'conference-member-departed':
          category:
            - iam
          type:
            - user
        'conference-member-state-changed':
          category:
            - iam
          type:
            - user
            - change
        'conference-owner-changed':
          category:
            - iam
          type:
            - admin
            - change
        'credential-injection-attempt':
            category:
              - authentication
              - intrusion_detection
            type:
              - info
        'credential-injection-attempt-failed':
            category:
              - authentication
              - intrusion_detection
            type:
              - info
              - denied
        'directory-created':
          category:
            - file
          type:
            - creation
        'file-deleted':
          category:
            - file
          type:
            - deletion
        'file-download':
          category:
            - file
          type:
            - access
        'file-download-failed':
          category:
            - file
          type:
            - access
        'file-moved':
          category:
            - file
          type:
            - change
        'file-upload':
          category:
            - file
          type:
            - access
        'file-upload-failed':
          category:
            - file
          type:
            - access
        'registry-exported':
          category:
            - registry
          type:
            - access
        'registry-imported':
          category:
            - registry
          type:
            - access
        'registry-key-added':
          category:
            - registry
          type:
            - creation
        'registry-key-deleted':
          category:
            - registry
          type:
            - deletion
        'registry-key-renamed':
          category:
            - registry
          type:
            - change
        'registry-value-added':
          category:
            - registry
          type:
            - creation
        'registry-value-deleted':
          category:
            - registry
          type:
            - deletion
        'registry-value-modified':
          category:
            - registry
          type:
            - change
        'registry-value-renamed':
          category:
            - registry
          type:
            - change
        'service-access-allowed':
          category:
            - configuration
            - iam
          type:
            - access
        'session-end':
          type:
            - end
        'session-start':
          type:
            - start
        'system-information-retrieved':
          category:
            - intrusion_detection
            - configuration
          type:
            - info
            - access
      source: >-
        if (params.get(ctx.event.action) == null) {
          ctx.event.category = ["session"]; // As each event belongs to a session
          ctx.event.type = ["info"]; // Remaining are of type info
          return;
        }
         // As each event belongs to a session
        def event_category = new ArrayList(["session"]);
        params.get(ctx.event.action).forEach((k, v) -> {
            if (k.equals("category")) {
              event_category.addAll(v);
            }else{
                ctx.event[k] = v;
            }  
        });
        ctx.event.category = event_category
      on_failure:
        - append:
            tag: append_error_message_0a19d334
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.filename
      tag: rename_filename_48d60ea2
      target_field: beyondtrust_pra.access_session.filename
      ignore_missing: true
  - set:
      field: file.name
      tag: set_file_name_from_access_session_filename_3689cd25
      copy_from: beyondtrust_pra.access_session.filename
      ignore_empty_value: true
  - convert:
      field: json.filesize
      tag: convert_filesize_to_long_475c4c81
      target_field: beyondtrust_pra.access_session.filesize
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_41a41c21
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: file.size
      tag: set_file_size_from_access_session_filesize_80502cfd
      copy_from: beyondtrust_pra.access_session.filesize
      ignore_empty_value: true
  - foreach:
      field: json.files.file
      if: ctx.json?.files?.file instanceof List
      tag: foreach_files_filesize_to_long_39ec17b4
      processor:
        convert:
          field: _ingest._value.filesize
          tag: convert_files_file_filesize_to_long_2401a49a
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_filesize_47544d50
                field: _ingest._value.filesize
                ignore_missing: true
            - append:
                tag: append_error_message_cf35f408
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.files.file
      tag: rename_files_file_893fead4
      target_field: beyondtrust_pra.access_session.files.file
      ignore_missing: true
  - rename:
      field: json.performed_by.display_name
      tag: rename_performed_by_display_name_fcab6c1e
      target_field: beyondtrust_pra.access_session.performed_by.display_name
      ignore_missing: true
  - rename:
      field: json.performed_by.gsnumber
      tag: rename_performed_by_gsnumber_6e33da61
      target_field: beyondtrust_pra.access_session.performed_by.gsnumber
      ignore_missing: true
  - rename:
      field: json.performed_by.hostname
      tag: rename_performed_by_hostname_3400e25e
      target_field: beyondtrust_pra.access_session.performed_by.hostname
      ignore_missing: true
  - set:
      field: source.domain
      tag: set_source_domain_from_access_session_performed_by_hostname_5a4ecef4
      copy_from: beyondtrust_pra.access_session.performed_by.hostname
