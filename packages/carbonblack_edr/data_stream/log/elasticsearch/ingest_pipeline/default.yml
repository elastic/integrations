      - ISO8601
    if: 'ctx._tmp?.timestamp != null'
    on_failure:
      - append:
          tag: append_error_message_ae3525f7
          field: error.message
          value: 'failed to parse timestamp (value: {{{ _tmp.timestamp }}}): {{{_ingest.on_failure_message}}}'

