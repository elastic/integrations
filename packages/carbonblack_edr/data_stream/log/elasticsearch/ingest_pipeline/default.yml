#
# This flag is used to signal that it can write to host.* fields.
#
- set:
    tag: set__tmp_forwarded_d17bb385
    field: _tmp.forwarded
    value: true
    if: 'ctx.host?.name == null'

- script:
    tag: script_removes_empty_string_fields_e4134e8a
    description: 'Removes empty string fields'
    lang: painless
    source: |-
      void removeEmptyStr(Map m) {
        if (m != null) m.entrySet().removeIf( e -> e.value == "");
      }
      removeEmptyStr(ctx.json);
      removeEmptyStr(ctx.json.doc);

- rename:
    tag: rename_json_type_to_event_action_8a9f8811
    description: 'Renames type field to ECS event action'
    field: json.type
    target_field: event.action
    on_failure:
      # This happens in cb_edr.log only.
      # is this real or just an artifact in our samples?
      #
      #- append:
      #    field: error.message
      #    value: 'type field not present in document'
      - set:
          tag: set_event_action_7e2f1a2c
          field: event.action
          value: unknown

- script:
    tag: script_sets_ecs_categorisation_fields_9a32e22c
    description: 'Sets ECS categorisation fields from EDR Event ID.'
    lang: painless
    params:
      "alert.watchlist.hit.ingress.host":
        kind: alert
        category: [host]
        type: [info]

      "alert.watchlist.hit.ingress.binary":
        kind: alert
        category: [file]
        type: [info]

      "alert.watchlist.hit.ingress.process":
        kind: alert
        category: [process]
        type: [info]

      "alert.watchlist.hit.query.binary":
        kind: alert
        category: [file]
        type: [info]

      "alert.watchlist.hit.query.process":
        kind: alert
        category: [process]
        type: [info]

      "binaryinfo.host.observed":
        kind: event
        category: [host]
        type: [info]

      "binaryinfo.group.observed":
        kind: event
        category: [file]
        type: [info]

      "binaryinfo.observed":
        kind: event
        category: [file]
        type: [info]

      "binarystore.file.added":
        kind: event
        category: [file]
        type: [creation]

      "feed.ingress.hit.host":
        kind: event
        category: [host]
        type: [info]

      "feed.ingress.hit.binary":
        kind: event
        category: [file]
        type: [info]

      "feed.ingress.hit.process":
        kind: event
        category: [process]
        type: [info]

      "feed.query.hit.binary":
        kind: event
        category: [file]
        type: [info]

      "feed.query.hit.process":
        kind: event
        category: [process]
        type: [info]

      "feed.storage.hit.binary":
        kind: event
        category: [file]
        type: [info]

      "feed.storage.hit.process":
        kind: event
        category: [process]
        type: [info]

      "watchlist.hit.process":
        kind: event
        category: [process]
        type: [info]

      "watchlist.hit.binary":
        kind: event
        category: [file]
        type: [info]

      "watchlist.storage.hit.binary":
        kind: event
        category: [file]
        type: [info]

      "watchlist.storage.hit.process":
        kind: event
        category: [process]
        type: [info]

      "ingress.event.regmod":
        kind: event
        category: [registry]
        type: [change]

      "ingress.event.filemod":
        kind: event
        category: [file]
        type: [change]

      "ingress.event.netconn":
        kind: event
        category: [network]
        type: [connection, start]

      "ingress.event.module":
        kind: event
        category: [process]
        type: [start, info]

      "ingress.event.childproc":
        kind: event
        category: [process]
        type: [start, info]

      "ingress.event.process":
        kind: event
        category: [process]
        type: [info]

      "ingress.event.crossprocopen":
        kind: event
        category: [process]
        type: [info]

      "ingress.event.remotethread":
        kind: event
        category: [process]
        type: [info]

      "ingress.event.emetmitigation":
        kind: event
        category: [process]
        type: [info, end]

      "ingress.event.processblock":
        kind: event
        category: [process]
        type: [info, end]

      "ingress.event.tamper":
        kind: event
        category: [process, driver]
        type: [info]

      "unknown":
        kind: event
    source: |-
      def clone(def ref) {
        if (ref == null) return ref;
        if (ref instanceof Map) {
          ref = ref.entrySet().stream().collect(
                  Collectors.toMap(
                    e -> e.getKey(),
                    e -> clone(e.getValue())
                  )
                );
        } else if (ref instanceof List) {
          ref = ref.stream().map(e -> clone(e)).collect(
                  Collectors.toList()
                );
        }
        return ref;
      }
      def event = ctx.event;
      if (event == null) {
        event = new HashMap();
        ctx["event"] = event;
      }
      def type = ctx.event.action;
      def fields = params[type] != null? params[type] : params["unknown"];
      fields.forEach( (k, v) -> {
        event[k] = clone(v);
      });

