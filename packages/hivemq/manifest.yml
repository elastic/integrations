format_version: "3.6.5"
name: hivemq
title: HiveMQ Community Edition
version: "0.1.0"
source:
  license: "Elastic-2.0"
description: Collect broker and client event logs from HiveMQ Community Edition MQTT brokers with Elastic Agent.
type: integration
categories:
  - message_queue
  - observability
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/hivemq-logo.svg
    title: HiveMQ logo
    size: 24x24
    type: image/svg+xml
policy_templates:
  - name: hivemq
    title: HiveMQ Community Edition logs
    description: Collect broker and client event logs from HiveMQ Community Edition
    inputs:
      - type: filestream
        title: Collect HiveMQ logs from files
        description: Collecting HiveMQ broker and client event logs using the filestream input
owner:
  github: elastic/integrations-triaging
  type: community
