# agent.id and service.address (the scrape URL) identify the time series:
# the collector sends one document per broker endpoint and scrape.
- name: agent.id
  external: ecs
  dimension: true
- name: service.address
  external: ecs
  dimension: true
- name: ecs.version
  external: ecs
- name: error.message
  external: ecs
- name: event.duration
  external: ecs
- name: event.kind
  external: ecs
- name: service.type
  external: ecs
- name: tags
  external: ecs
