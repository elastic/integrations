# Notes on the fixtures:
# - Every document is shaped like the output of the prometheus/metrics
#   collector (one document per scrape, the extension exports no labels, so the
#   collector only adds `instance` and `job`), with the metric values taken from
#   /metrics output captured from HiveMQ CE 2026.5 with Prometheus Extension
#   4.1.1. Host names and IDs are placeholders.
# - test-hivemq-metrics-traffic-sample.json: default file persistence, while
#   clients publish and subscribe (16 metrics).
# - test-hivemq-metrics-in-memory-sample.json: in-memory persistence, idle and
#   under traffic (all 20 metrics, including the persistence sizes).
# - test-hivemq-metrics-unknown-metric-sample.json: synthetic; a metric the
#   pipeline does not map is dropped with the collector labels.
fields:
  tags:
    - preserve_original_event
