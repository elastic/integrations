  - rename:
      tag: rename_json_DiscardsTxInterface_to_zscaler_zpa_app_connector_status_interface_transmitted_discards_765c33aa
      field: json.DiscardsTxInterface
      target_field: zscaler_zpa.app_connector_status.interface.transmitted.discards
      ignore_missing: true
  - script:
      tag: script_853d4e94
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - remove:
      tag: remove_fcf812a2
      field:
        - json.LogTimestamp
        - json.DefRouteGW
        - json.TotalBytesTx
        - json.TotalBytesRx
        - json.PublicIP
        - json.PrivateIP
        - json.TimestampAuthentication
