  - rename:
      tag: rename_json_ErrorsTxInterface_to_zscaler_zpa_app_connector_status_interface_transmitted_errors_61146625
      field: json.ErrorsTxInterface
      target_field: zscaler_zpa.app_connector_status.interface.transmitted.errors
