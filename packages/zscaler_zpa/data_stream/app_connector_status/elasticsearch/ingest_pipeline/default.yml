---
description: Pipeline for Zscaler app connector status logs.
processors:
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
