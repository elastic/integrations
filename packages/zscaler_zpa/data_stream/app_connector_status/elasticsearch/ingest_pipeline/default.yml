        - remove:
            tag: remove_json_DefRouteGW_a155e03c
            field: json.DefRouteGW
        - append:
            tag: append_error_message_30c0f9aa
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_fe7a129e
      field: related.ip
      value: '{{{client.nat.ip}}}'
      if: ctx.client?.nat?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_CPUUtilization_to_host_cpu_usage_0af34c3a
      field: json.CPUUtilization
