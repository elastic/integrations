- name: zscaler_zpa.private_service_edge_status
  type: group
  fields:
    - name: bytes_rx_interface
      type: long
      description: |
        The bytes received on the interface.
    - name: bytes_tx_interface
      type: long
      description: |
        The bytes transmitted on the interface.
    - name: def_route_gw
      type: ip
      description: |
        The IP address of the gateway to default route.
    - name: discards_rx_interface
      type: long
      description: |
        The discards received on the interface.
    - name: discards_tx_interface
      type: long
      description: |
        The discards transmitted on the interface.
    - name: errors_rx_interface
      type: long
      description: |
        The errors received on the interface.
    - name: errors_tx_interface
      type: long
      description: |
        The errors transmitted on the interface.
    - name: host_up_time
      type: date
      description: |
        The time at which the host was started.
    - name: interface_def_route
      type: keyword
      description: |
        The name of the interface to default route.
    - name: mem_utilization
      type: long
      description: |
        The memory utilization in %.
    - name: micro_tenant_id
      type: keyword
      description: |
        The Microtenant ID of the Private Service Edge.
    - name: num_of_interfaces
      type: long
      description: |
        The number of interfaces on the Private Service Edge host.
    - name: package_version
      type: keyword
      description: |
        The Private Service Edge package version.
    - name: packets_rx_interface
      type: long
      description: |
        The packets received on the interface.
    - name: packets_tx_interface
      type: long
      description: |
        The packets transmitted on the interface.
    - name: primary_dns_resolver
      type: ip
      description: |
        The IP address of the primary DNS resolver.
    - name: private_ip
      type: ip
      description: |
        The private IP address of the Private Service Edge.
    - name: public_ip
      type: ip
      description: |
        The public IP address of the Private Service Edge.
    - name: service_edge_group
      type: keyword
      description: |
        The Service Edge group name.
    - name: service_edge_start_time
      type: date
      description: |
        The time at which the Private Service Edge was started.
    - name: session_id
      type: keyword
      description: |
        The TLS session ID.
    - name: session_status
      type: keyword
      description: |
        The status of the session: `ZPN_STATUS_AUTHENTICATED` (the Private Service Edge successfully authenticated), `ZPN_STATUS_AUTH_FAILED` (the Private Service Edge failed to authenticate) or `ZPN_STATUS_DISCONNECTED` (the Private Service Edge disconnected from a Service Edge).
    - name: session_type
      type: keyword
      description: |
        The type of session, such as `ZPN_TUNNEL_CONTROL` for the session from the Private Service Edge towards the closest Public Service Edge.
    - name: timestamp_authentication
      type: date
      description: |
        The timestamp when the Private Service Edge was authenticated.
    - name: timestamp_un_authentication
      type: date
      description: |
        The timestamp when the Private Service Edge was unauthenticated.
    - name: total_bytes_rx
      type: long
      description: |
        The total bytes received.
    - name: total_bytes_tx
      type: long
      description: |
        The total bytes transmitted.
    - name: zen
      type: keyword
      description: |
        The Public Service Edge that was selected for the connection.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
