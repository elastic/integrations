- name: zscaler_zpa.microsegmentation_flow
  type: group
  fields:
    - name: agent_id
      type: keyword
      description: |
        The Microsegmentation agent ID.
    - name: agent_name
      type: keyword
      description: |
        The Microsegmentation agent name.
    - name: app_zone_id
      type: keyword
      description: |
        The AppZone identifier the agent generating the flow log belongs to.
    - name: app_zone_name
      type: keyword
      description: |
        The AppZone name the agent generating the flow log belongs to or is a member of.
    - name: direction
      type: keyword
      description: |
        The connection direction.
    - name: enforcement_action
      type: keyword
      description: |
        The policy enforcement action configured on the connection (`ALLOW`, `BLOCK` or `SIMBLOCK`).
    - name: enforcement_disposition
      type: keyword
      description: |
        The policy enforcement decision on the connection (`UNKNOWN`, `CONNECTED`, `REJECTED` or `DROPPED`).
    - name: source_ports
      type: long
      description: |
        The source port used in the connection. In the case of multiple connections between the same endpoints (same source, destination address, protocol and destination port), this becomes an aggregated source port list.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
