- name: zscaler_zpa.microsegmentation_flow
  type: group
  fields:
    - name: agent_id
      type: keyword
      description: |
        The Microsegmentation agent ID. This is the Zscaler host agent, not the Elastic Agent.
    - name: agent_name
      type: keyword
      description: |
        The Microsegmentation agent name.
    - name: app_zone_id
      type: keyword
      description: |
        The ID of the AppZone the agent belongs to.
    - name: app_zone_name
      type: keyword
      description: |
        The name of the AppZone the agent belongs to.
    - name: direction
      type: keyword
      description: |
        The connection direction, kept only when it is not one of the values mapped to `network.direction` (`INBOUND`, `OUTBOUND` or `UNKNOWN`).
    - name: enforcement_action
      type: keyword
      description: |
        The policy enforcement action configured on the connection (`ALLOW`, `BLOCK` or `SIMBLOCK`, a simulated block).
    - name: enforcement_disposition
      type: keyword
      description: |
        The policy enforcement decision on the connection (`UNKNOWN`, `CONNECTED`, `REJECTED` or `DROPPED`).
    - name: source_ports
      type: long
      description: |
        The source ports of the aggregated connections between the same source, destination, protocol and destination port.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
