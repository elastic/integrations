---
description: Pipeline for Zscaler user status logs.
processors:
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - json:
      tag: json_event_original_to_json_93ceb325
      field: event.original
      target_field: json
      ignore_failure: true
  - date:
      tag: date_json_LogTimestamp_aee532a5
      field: json.LogTimestamp
      formats:
        - E MMM dd HH:mm:ss yyyy
        - E MMM  d HH:mm:ss yyyy
        - E MMM d HH:mm:ss yyyy
      if: ctx.json?.LogTimestamp != null && ctx.json.LogTimestamp != ''
      on_failure:
        - remove:
            tag: remove_json_LogTimestamp_db9e7f53
            field: json.LogTimestamp
        - append:
            tag: append_error_message_00ca8640
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_event_category_0eb47497
      field: event.category
      value: iam
  - set:
      tag: set_event_kind_c3139286
      field: event.kind
      value: state
  - append:
      tag: append_event_type_5eab37e6
      field: event.type
      value: info
  - append:
      tag: append_event_type_652dad8f
      field: event.type
      value: user
  - rename:
      tag: rename_json_CountryCode_to_client_geo_country_iso_code_6d7c65c9
      field: json.CountryCode
      target_field: client.geo.country_iso_code
      ignore_missing: true
  - rename:
      tag: rename_json_Latitude_to_client_geo_location_lat_3383b042
      field: json.Latitude
      target_field: client.geo.location.lat
      ignore_missing: true
  - rename:
      tag: rename_json_Longitude_to_client_geo_location_lon_6d6c12e5
      field: json.Longitude
      target_field: client.geo.location.lon
      ignore_missing: true
  - convert:
      tag: convert_json_PublicIP_to_client_ip_28b61d83
      field: json.PublicIP
      target_field: client.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.PublicIP != ''
      on_failure:
        - remove:
            tag: remove_json_PublicIP_d13c087e
            field: json.PublicIP
        - append:
            tag: append_error_message_051fb1f7
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_0c249d7d
      field: related.ip
      value: '{{{client.ip}}}'
      if: ctx.client?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_Hostname_to_host_hostname_79217830
      field: json.Hostname
      target_field: host.hostname
      ignore_missing: true
  - rename:
      tag: rename_json_Platform_to_host_os_platform_3a4bb829
      field: json.Platform
      target_field: host.os.platform
      ignore_missing: true
  - rename:
      tag: rename_json_Customer_to_organization_name_fb2b3458
      field: json.Customer
      target_field: organization.name
      ignore_missing: true
  - append:
      tag: append_related_hosts_a1c68aed
      field: related.hosts
      value: '{{{server.domain}}}'
      if: ctx.server?.domain != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_ZENCountryCode_to_server_geo_country_iso_code_2ad345b5
      field: json.ZENCountryCode
      target_field: server.geo.country_iso_code
      ignore_missing: true
  - rename:
      tag: rename_json_ZENLatitude_to_server_geo_location_lat_919ce774
      field: json.ZENLatitude
      target_field: server.geo.location.lat
      ignore_missing: true
  - rename:
      tag: rename_json_ZENLongitude_to_server_geo_location_lon_0518cb6e
      field: json.ZENLongitude
      target_field: server.geo.location.lon
      ignore_missing: true
  - rename:
      tag: rename_json_Username_to_user_name_7a43abf0
      field: json.Username
      target_field: user.name
      ignore_missing: true
  - rename:
      field: user.name
      target_field: user.email
      tag: rename_user_email_455f691a
      if: ctx.user?.name != null && ctx.user.name.indexOf("@") > 0
  - dissect:
      field: user.email
      pattern: '%{user.name}@%{user.domain}'
      tag: dissect_user_email_d5fb5c7e
      ignore_missing: true
      ignore_failure: true
      if: ctx.user?.name == null
  - append:
      tag: append_related_user_736bc21b
      field: related.user
      value: '{{{user.name}}}'
      if: ctx.user?.name != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_user_5d0d8db5
      field: related.user
      value: '{{{user.email}}}'
      if: ctx.user?.email != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_x509_issuer_common_name_f22e540a
      field: x509.issuer.common_name
      value: '{{{json.CertificateCN}}}'
      if: ctx.json?.CertificateCN != null
  - remove:
      tag: remove_json_CertificateCN_57818052
      field: json.CertificateCN
      ignore_missing: true
  - rename:
      tag: rename_json_SessionID_to_zscaler_zpa_user_status_session_id_095a8216
      field: json.SessionID
      target_field: zscaler_zpa.user_status.session.id
      ignore_missing: true
  - rename:
      tag: rename_json_SessionStatus_to_zscaler_zpa_user_status_session_status_7ac285be
      field: json.SessionStatus
      target_field: zscaler_zpa.user_status.session.status
      ignore_missing: true
  - rename:
      tag: rename_json_Version_to_zscaler_zpa_user_status_version_6d183a05
      field: json.Version
      target_field: zscaler_zpa.user_status.version
      ignore_missing: true
  - rename:
      tag: rename_json_ZEN_to_zscaler_zpa_user_status_zen_domain_2e081e0f
      field: json.ZEN
      target_field: zscaler_zpa.user_status.zen.domain
      ignore_missing: true
  - convert:
      tag: convert_json_PrivateIP_to_zscaler_zpa_user_status_private_ip_59054219
      field: json.PrivateIP
      target_field: zscaler_zpa.user_status.private_ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_PrivateIP_fe78b0dc
            field: json.PrivateIP
        - append:
            tag: append_error_message_e9d9548b
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_d11efe6b
      field: related.ip
      value: '{{{zscaler_zpa.user_status.private_ip}}}'
      if: ctx.zscaler_zpa?.user_status?.private_ip != null
      allow_duplicates: false
      ignore_failure: true
  - date:
      tag: date_json_TimestampAuthentication_to_zscaler_zpa_user_status_timestamp_authentication_93de9c2a
      field: json.TimestampAuthentication
      target_field: zscaler_zpa.user_status.timestamp.authentication
      formats:
        - ISO8601
      if: ctx.json?.TimestampAuthentication != null && ctx.json.TimestampAuthentication != ''
      on_failure:
        - remove:
            tag: remove_json_TimestampAuthentication_e1ce45f4
            field: json.TimestampAuthentication
        - append:
            tag: append_error_message_4ce8ec61
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_TimestampUnAuthentication_to_zscaler_zpa_user_status_timestamp_unauthentication_ac6ed5f7
      field: json.TimestampUnAuthentication
      target_field: zscaler_zpa.user_status.timestamp.unauthentication
      formats:
        - ISO8601
      if: ctx.json?.TimestampAuthentication != null && ctx.json.TimestampUnAuthentication != ''
      on_failure:
        - remove:
            tag: remove_json_TimestampUnAuthentication_18ee5adf
            field: json.TimestampUnAuthentication
        - append:
            tag: append_error_message_765eb657
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_TotalBytesRx_to_zscaler_zpa_user_status_total_bytes_rx_47825780
      field: json.TotalBytesRx
      target_field: zscaler_zpa.user_status.total.bytes_rx
      ignore_missing: true
  - rename:
      tag: rename_json_TotalBytesTx_to_zscaler_zpa_user_status_total_bytes_tx_d7dbda74
      field: json.TotalBytesTx
      target_field: zscaler_zpa.user_status.total.bytes_tx
      ignore_missing: true
  - rename:
      tag: rename_json_Idp_to_zscaler_zpa_user_status_idp_0b083c08
      field: json.Idp
      target_field: zscaler_zpa.user_status.idp
      ignore_missing: true
  - rename:
      tag: rename_json_ClientType_to_zscaler_zpa_user_status_client_type_41f605f6
      field: json.ClientType
      target_field: zscaler_zpa.user_status.client.type
      ignore_missing: true
  - rename:
      tag: rename_json_TrustedNetworks_to_zscaler_zpa_user_status_trusted_networks_8fd57a57
      field: json.TrustedNetworks
      target_field: zscaler_zpa.user_status.trusted_networks
      ignore_missing: true
  - rename:
      tag: rename_json_TrustedNetworksNames_to_zscaler_zpa_user_status_trusted_networks_names_aaf6af0d
      field: json.TrustedNetworksNames
      target_field: zscaler_zpa.user_status.trusted_networks_names
      ignore_missing: true
  - script:
      tag: script_39bb8610
      source: |
        ctx.zscaler_zpa.user_status.fqdn = new HashMap();
        ctx.zscaler_zpa.user_status.fqdn.registered = (ctx.json.FQDNRegistered != '0');
      if: ctx.json.FQDNRegistered != null
      ignore_failure: true
  - rename:
      tag: rename_json_FQDNRegisteredError_to_zscaler_zpa_user_status_fqdn_registered_error_68d7ef02
      field: json.FQDNRegisteredError
      target_field: zscaler_zpa.user_status.fqdn.registered_error
      ignore_missing: true
  - split:
      tag: split_json_SAMLAttributes_to_zscaler_zpa_user_status_saml_attributes_8db5dbb0
      field: json.SAMLAttributes
      target_field: zscaler_zpa.user_status.saml_attributes
      separator: ','
      ignore_failure: true
  - split:
      tag: split_json_PosturesHit_to_zscaler_zpa_user_status_postures_hit_c57fd8ce
      field: json.PosturesHit
      target_field: zscaler_zpa.user_status.postures.hit
      separator: ','
      ignore_failure: true
      if: ctx.json?.PosturesHit instanceof java.lang.String
  - split:
      tag: split_json_PosturesMiss_to_zscaler_zpa_user_status_postures_miss_3e90e713
      field: json.PosturesMiss
      target_field: zscaler_zpa.user_status.postures.miss
      separator: ','
      ignore_failure: true
      if: ctx.json?.PosturesMiss instanceof java.lang.String
  - rename:
      tag: rename_json_PosturesHit_to_zscaler_zpa_user_status_postures_hit_66f25296
      field: json.PosturesHit
      target_field: zscaler_zpa.user_status.postures.hit
      if: ctx.json?.PosturesHit instanceof List
  - rename:
      tag: rename_json_PosturesMiss_to_zscaler_zpa_user_status_postures_miss_3c197344
      field: json.PosturesMiss
      target_field: zscaler_zpa.user_status.postures.miss
      if: ctx.json?.PosturesMiss instanceof List
  - script:
      tag: script_drops_null_empty_values_recursively_853d4e94
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - remove:
      tag: remove_dac0de3e
      field:
        - json.LogTimestamp
        - json.PublicIP
        - json.PrivateIP
        - json.TimestampAuthentication
        - json.TimestampUnAuthentication
        - json.FQDNRegistered
        - json.SAMLAttributes
        - json.PosturesHit
        - json.PosturesMiss
      ignore_missing: true
  - script:
      tag: script_adds_remaining_fields_fields_under_480136dd
      description: Adds all the remaining fields in fields under zscaler_zpa.user_status.
      lang: painless
      if: ctx.json != null
      source: |
        for (Map.Entry m : ctx.json.entrySet()) {
          ctx.zscaler_zpa.user_status[m.getKey()] = m.getValue();
        }
  - remove:
      tag: remove_json_94dc55cd
      field: json
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
