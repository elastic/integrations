- name: zscaler_zpa.app_protection
  type: group
  fields:
    - name: actions
      type: keyword
      description: |
        The action taken for each AppProtection control hit, index-aligned with `rule.id`.
    - name: application
      type: keyword
      description: |
        The ID of the application.
    - name: application_group
      type: keyword
      description: |
        The ID of the application group.
    - name: assistant_id
      type: keyword
      description: |
        Documented by Zscaler as the App Connector ID, but the values seen are App Connector names.
    - name: certificate_id
      type: keyword
      description: |
        The certificate ID. 0 means no certificate.
    - name: client_port
      type: long
      description: |
        The port of the client, as reported. Observed values suggest it may be the server port.
    - name: connection_id
      type: keyword
      description: |
        The application connection ID. Joins with `zscaler_zpa.user_activity.connection.id`.
    - name: content_encoding
      type: keyword
      description: |
        The value of the content encoding within the HTTP header.
    - name: content_type
      type: keyword
      description: |
        The content type.
    - name: double_encryption
      type: boolean
      description: |
        Whether double encryption is on.
    - name: exchange_sequence_index
      type: long
      description: |
        The HTTP exchange sequence index within the TCP connection.
    - name: http_error
      type: keyword
      description: |
        The HTTP error.
    - name: inspection_control_types
      type: keyword
      description: |
        The type of each AppProtection control hit, index-aligned with `rule.id`.
    - name: inspection_controls_hit_count
      type: long
      description: |
        The number of AppProtection control hits.
    - name: inspection_policy
      type: keyword
      description: |
        The ID of the AppProtection policy.
    - name: inspection_profile
      type: keyword
      description: |
        The ID of the AppProtection profile.
    - name: inspection_req_body_processing_time
      type: long
      unit: micros
      description: |
        The time in microseconds taken for processing the AppProtection request body.
    - name: inspection_req_headers_processing_time
      type: long
      unit: micros
      description: |
        The time in microseconds taken for processing the AppProtection request headers.
    - name: inspection_resp_body_processing_time
      type: long
      unit: micros
      description: |
        The time in microseconds taken for processing the AppProtection response body.
    - name: inspection_resp_headers_processing_time
      type: long
      unit: micros
      description: |
        The time in microseconds taken for processing the AppProtection response headers.
    - name: inspection_rule_processing_time
      type: long
      unit: micros
      description: |
        The time in microseconds taken for processing the AppProtection rule.
    - name: micro_tenant_id
      type: keyword
      description: |
        The Microtenant ID.
    - name: origin_domain
      type: keyword
      description: |
        The value of the origin header in the cross-origin HTTP header.
    - name: paranoia_level
      type: long
      description: |
        The OWASP predefined paranoia level (1-4).
    - name: protocol
      type: keyword
      description: |
        The protocol, as reported. Copied to `network.protocol` when it is a protocol name, or to `http.version` when it is an HTTP version and `ProtocolVersion` is empty.
    - name: request_hdr_size
      type: long
      unit: byte
      description: |
        The size of the request header.
    - name: response_hdr_size
      type: long
      unit: byte
      description: |
        The size of the response header.
    - name: severities
      type: keyword
      description: |
        The severity of each AppProtection control hit, as reported, index-aligned with `rule.id`.
    - name: ssl_inspection
      type: boolean
      description: |
        Whether the inspected HTTPS traffic was terminated.
    - name: timestamp_request_receive_finish
      type: date_nanos
      description: |
        When the received request was finished.
    - name: timestamp_request_receive_header_finish
      type: date_nanos
      description: |
        When the received request header was finished.
    - name: timestamp_request_receive_start
      type: date_nanos
      description: |
        When the received request was started.
    - name: timestamp_request_transmit_finish
      type: date_nanos
      description: |
        When the transmitted request was finished.
    - name: timestamp_request_transmit_start
      type: date_nanos
      description: |
        When the transmitted request was started.
    - name: timestamp_response_receive_finish
      type: date_nanos
      description: |
        When the received response was finished.
    - name: timestamp_response_receive_start
      type: date_nanos
      description: |
        When the received response was started.
    - name: timestamp_response_transmit_finish
      type: date_nanos
      description: |
        When the transmitted response was finished.
    - name: timestamp_response_transmit_start
      type: date_nanos
      description: |
        When the transmitted response was started.
    - name: total_bytes_processed
      type: long
      unit: byte
      description: |
        The total bytes processed.
    - name: total_time_request_receive
      type: long
      unit: micros
      description: |
        The total time taken in microseconds for the request to be received.
    - name: total_time_request_transmit
      type: long
      unit: micros
      description: |
        The total time taken in microseconds for the request to be transmitted.
    - name: total_time_response_receive
      type: long
      unit: micros
      description: |
        The total time taken in microseconds for the response to be received.
    - name: total_time_response_transmit
      type: long
      unit: micros
      description: |
        The total time taken in microseconds for the response to be transmitted.
    - name: transfer_encoding
      type: keyword
      description: |
        The value of the transfer encoding within the HTTP header.
    - name: upgrade_header_present
      type: boolean
      description: |
        Whether the upgrade header is present.
- name: log.source.address
  type: keyword
  description: Source address from which the log event was read / sent from.
