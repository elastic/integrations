---
description: Pipeline for processing admin action logs.
processors:
  - drop:
      if: ctx.message == 'retry'
      tag: drop_retry_events_1f05010a
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - json:
      field: event.original
      tag: json_event_original_74d23cc2
      target_field: json
  - script:
      tag: script_normalize_siem_snake_case
      lang: painless
      description: Copy snake_case SIEM field names to camelCase keys expected by the legacy pipeline.
      if: ctx.json instanceof Map
      source: |-
        String snakeToCamel(String s) {
          StringBuilder sb = new StringBuilder();
          boolean cap = false;
          for (int i = 0; i < s.length(); i++) {
            String c = s.substring(i, i + 1);
            if ("_".equals(c)) {
              cap = true;
            } else if (cap) {
              sb.append(c.toUpperCase());
              cap = false;
            } else {
              sb.append(c);
            }
          }
          return sb.toString();
        }
        def keys = new ArrayList(ctx.json.keySet());
        for (def key : keys) {
          if (key instanceof String && key.indexOf('_') >= 0) {
            def camel = snakeToCamel(key);
            if (!ctx.json.containsKey(camel)) {
              ctx.json.put(camel, ctx.json.get(key));
            }
          }
        }
        if (ctx.json.action != null && ctx.json.actionType == null) {
          ctx.json.actionType = ctx.json.action;
        }
  - fingerprint:
      fields:
        - event.original
      tag: fingerprint_island_browser_admin_actions_5df148ab
      target_field: _id
      ignore_missing: true
  - rename:
      field: json.actionDomain
      tag: rename_actionDomain_d29d3c1e
      target_field: island_browser.admin_actions.action_domain
      ignore_missing: true
  - rename:
      field: json.actionStatus
      tag: rename_actionStatus_50fe43e3
      target_field: island_browser.admin_actions.action_status
      ignore_missing: true
  - set:
      field: event.outcome
      tag: set_event_outcome_to_success_f6ab48e3
      value: success
      if: >-
        ctx.island_browser?.admin_actions?.action_status != null && (
          ctx.island_browser.admin_actions.action_status == 'Applied' ||
          ctx.island_browser.admin_actions.action_status == 'Done'
        )
  - rename:
      field: json.actionType
      tag: rename_actionType_3ba78693
      target_field: island_browser.admin_actions.action_type
      ignore_missing: true
  - rename:
      field: json.auditType
      tag: rename_auditType
      target_field: island_browser.admin_actions.audit_type
      ignore_missing: true
  - set:
      field: island_browser.admin_actions.source
      tag: set_source
      copy_from: json.source
      ignore_empty_value: true
      if: ctx.island_browser?.admin_actions?.source == null
  - set:
      field: event.action
      tag: set_event_action_from_admin_actions_action_type_4e17c4a2
      copy_from: island_browser.admin_actions.action_type
      ignore_empty_value: true
  - rename:
      field: json.apiKeyName
      tag: rename_apiKeyName_79d2458d
      target_field: island_browser.admin_actions.api_key_name
      ignore_missing: true
  - convert:
      field: json.changesBulkId
      tag: convert_changesBulkId_to_long_caa9cb97
      target_field: island_browser.admin_actions.changes_bulk_id
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_928fbf8f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.createdDate
      tag: date_createdDate_db18231d
      target_field: island_browser.admin_actions.created_date
      formats:
        - ISO8601
      if: ctx.json?.createdDate != null && ctx.json.createdDate != ''
      on_failure:
        - append:
            tag: append_error_message_6b6a3e3d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.created
      tag: set_event_created_from_admin_actions_created_date_ed7ac1dc
      copy_from: island_browser.admin_actions.created_date
      ignore_empty_value: true
  - rename:
      field: json.email
      tag: rename_email_17712abf
      target_field: island_browser.admin_actions.email
      ignore_missing: true
  - set:
      field: user.email
      tag: set_user_email_from_admin_actions_email_bfefc70d
      copy_from: island_browser.admin_actions.email
      ignore_empty_value: true
      if: ctx.island_browser?.admin_actions?.email.contains('@') == true
  - dissect:
      field: user.email
      tag: dissect_user_email_f16cabd5
      pattern: '%{_temp}@%{user.domain}'
      ignore_missing: true
  - append:
      field: related.user
      tag: append_user_email_into_related_user_b9ac313b
      value: '{{{user.email}}}'
      allow_duplicates: false
      if: ctx.user?.email != null
  - rename:
      field: json.entityId
      tag: rename_entityId_18641265
      target_field: island_browser.admin_actions.entity_id
      ignore_missing: true
  - rename:
      field: json.entityName
      tag: rename_entityName_7ae5ca04
      target_field: island_browser.admin_actions.entity_name
      ignore_missing: true
  - rename:
      field: json.entityType
      tag: rename_entityType_2004d0cf
      target_field: island_browser.admin_actions.entity_type
      ignore_missing: true
  - rename:
      field: json.id
      tag: rename_id_74d72650
      target_field: island_browser.admin_actions.id
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_admin_actions_id_a152c629
      copy_from: island_browser.admin_actions.id
      ignore_empty_value: true
  - json:
      field: json.newValue
      tag: json_newValue_82cfcf8e
      target_field: island_browser.admin_actions.new_value
      if: ctx.json?.newValue != null
      on_failure:
        - set:
            field: island_browser.admin_actions.new_value_string
            tag: set_new_value_string_on_failure_656d9f42
            copy_from: json.newValue
            ignore_empty_value: true
  - json:
      field: json.originalValue
      tag: json_originalValue_5f6478ed
      target_field: island_browser.admin_actions.original_value
      if: ctx.json?.originalValue != null
      on_failure:
        - set:
            field: island_browser.admin_actions.original_value_string
            tag: set_original_value_string_on_failure_3317af96
            copy_from: json.originalValue
            ignore_empty_value: true
  - rename:
      field: json.reason
      tag: rename_reason_8b6f8d34
      target_field: island_browser.admin_actions.reason
      ignore_missing: true
  - set:
      field: event.reason
      tag: set_event_reason_from_admin_actions_reason_f8dff3fd
      copy_from: island_browser.admin_actions.reason
      ignore_empty_value: true
  - convert:
      field: json.sourceIp
      tag: convert_sourceIp_to_ip_816b2395
      target_field: island_browser.admin_actions.source_ip
      type: ip
      ignore_missing: true
      if: ctx.json?.sourceIp != ''
      on_failure:
        - append:
            tag: append_error_message_7ba57a17
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip_from_admin_actions_source_ip_7fc28d45
      copy_from: island_browser.admin_actions.source_ip
      ignore_empty_value: true
  - geoip:
      field: source.ip
      tag: geoip_source_ip_9a2d4d31
      target_field: source.geo
      ignore_missing: true
  - append:
      field: related.ip
      tag: append_admin_actions_source_ip_into_related_ip_fa81792f
      value: '{{{island_browser.admin_actions.source_ip}}}'
      allow_duplicates: false
      if: ctx.island_browser?.admin_actions?.source_ip != null
  - rename:
      field: json.tenantId
      tag: rename_tenantId_56c01f03
      target_field: island_browser.admin_actions.tenant_id
      ignore_missing: true
  - set:
      field: organization.id
      tag: set_organization_id_from_admin_actions_tenant_id_97ff6bb2
      copy_from: island_browser.admin_actions.tenant_id
      ignore_empty_value: true
  - rename:
      field: json.terraformProviderVersion
      tag: rename_terraformProviderVersion_8a7222fc
      target_field: island_browser.admin_actions.terraform_provider_version
      ignore_missing: true
  - date:
      field: json.timestamp
      tag: date_timestamp_70240e91
      target_field: island_browser.admin_actions.timestamp
      formats:
        - ISO8601
      if: ctx.json?.timestamp != null && ctx.json.timestamp != ''
      on_failure:
        - append:
            tag: append_error_message_3550c002
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_admin_actions_timestamp_ab59241e
      copy_from: island_browser.admin_actions.timestamp
      ignore_empty_value: true
  - date:
      field: json.updatedDate
      tag: date_updatedDate_13e5ebbc
      target_field: island_browser.admin_actions.updated_date
      formats:
        - ISO8601
      if: ctx.json?.updatedDate != null && ctx.json.updatedDate != ''
      on_failure:
        - append:
            tag: append_error_message_da016b32
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.userId
      tag: rename_userId_65d97df5
      target_field: island_browser.admin_actions.user_id
      ignore_missing: true
  - set:
      field: user.id
      tag: set_user_id_from_admin_actions_user_id_de62bbfc
      copy_from: island_browser.admin_actions.user_id
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_admin_actions_user_id_into_related_user_8e6dbc07
      value: '{{{island_browser.admin_actions.user_id}}}'
      allow_duplicates: false
      if: ctx.island_browser?.admin_actions?.user_id != null
  - remove:
      field:
        - island_browser.admin_actions.action_type
        - island_browser.admin_actions.created_date
        - island_browser.admin_actions.id
        - island_browser.admin_actions.reason
        - island_browser.admin_actions.source_ip
        - island_browser.admin_actions.tenant_id
        - island_browser.admin_actions.timestamp
        - island_browser.admin_actions.user_id
      tag: remove_custom_duplicate_fields_270ba7e9
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field:
        - json
        - _temp
      tag: remove_json_and_temp_c9df19f6
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_7559f019
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_fd4c0055
      field: error.message
      value: >-
        Processor {{{_ingest.on_failure_processor_type}}} 
        with tag {{{_ingest.on_failure_processor_tag}}} 
        in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
