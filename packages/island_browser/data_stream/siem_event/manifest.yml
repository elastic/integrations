title: Collect SIEM events from Island Browser.
type: logs
dataset: island_browser.siem_event
streams:
  - input: cel
    title: Island Browser SIEM Events
    description: Collect Island Browser audit and admin action events via the SIEM API.
    template_path: cel.yml.hbs
    enabled: false
    vars:
      - name: audit_id
        type: text
        title: Audit ID
        description: The SIEM connector audit ID from the Island Enterprise Browser admin console.
        multi: false
        required: true
        show_user: true
      - name: interval
        type: text
        title: Interval
        description: Duration between requests to the Island Browser SIEM API when no events are available. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 5m
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        multi: false
        default: false
        required: false
        show_user: false
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations.
          Enabling this request tracing compromises security and should only be used for debugging. Disabling the request
          tracer will delete any stored traces.
          See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable)
          for details.
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field event.original.
        multi: false
        required: false
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data-stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - island_browser-siem_event
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 30s
      - name: preserve_duplicate_custom_fields
        required: false
        title: Preserve duplicate custom fields
        description: Preserve island_browser.audit and island_browser.admin_actions fields that were copied to Elastic Common Schema (ECS) fields.
        type: bool
        multi: false
        show_user: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
elasticsearch:
  dynamic_dataset: true
  dynamic_namespace: true
