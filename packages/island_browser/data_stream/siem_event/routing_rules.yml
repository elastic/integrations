- source_dataset: island_browser.siem_event
  rules:
    - target_dataset: island_browser.audit
      if: ctx.routing?.source == "BrowserAudit"
      namespace:
        - "{{data_stream.namespace}}"
        - default
    - target_dataset: island_browser.admin_actions
      if: ctx.routing?.source == "AdminAction"
      namespace:
        - "{{data_stream.namespace}}"
        - default
