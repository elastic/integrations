- name: island_browser
  type: group
  fields:
    - name: system_event
      type: group
      fields:
        - name: category
          type: keyword
          description: Category of the system event, such as DeviceManagement, IPA, or UserManagement.
        - name: details
          type: flattened
          description: Additional event details. The keys depend on the event type.
        - name: primary_entity_id
          type: keyword
          description: ID of the primary entity affected by the event.
        - name: primary_entity_name
          type: keyword
          description: Name of the primary entity affected by the event, such as a device, connector, application, or user.
        - name: severity
          type: keyword
          description: Severity of the system event, such as Info, Medium, or Critical.
        - name: source
          type: keyword
          description: Source of the SIEM event. Always SystemEvent.
        - name: sub_category
          type: keyword
          description: Sub-category of the system event, such as RETENTION, CONNECTORS, or HEALTHCHECK.
        - name: tenant_id
          type: keyword
          description: Island tenant ID.
- name: routing.source
  type: keyword
  description: SIEM event source used for routing.
