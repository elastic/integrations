format_version: "3.6.5"
name: aws_otel
title: "AWS (OpenTelemetry)"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: >-
  Collect AWS service metrics from CloudWatch using the OTel Collector
  awscloudwatch receiver. Each service is a separate data stream.
type: integration
categories:
  - aws
  - cloud
  - observability
  - opentelemetry
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: basic
icons:
  - src: /img/aws_otel_logo.svg
    title: AWS OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
requires:
  input:
    - package: aws_cloudwatch_input_otel
      version: "1.0.0"
# Shared by every service data stream. Metric discovery stays on the data stream.
vars:
  - name: region
    type: text
    title: AWS Region
    description: AWS region to query CloudWatch metrics from (for example, `us-east-1`).
    required: true
    show_user: true
  - name: access_key_id
    type: password
    title: AWS Access Key ID
    description: Mapped to `AWS_ACCESS_KEY_ID` on the collector process when an IAM role is not available.
    required: false
    show_user: true
    secret: true
  - name: secret_access_key
    type: password
    title: AWS Secret Access Key
    description: Mapped to `AWS_SECRET_ACCESS_KEY`.
    required: false
    show_user: true
    secret: true
  - name: session_token
    type: password
    title: AWS Session Token
    description: Mapped to `AWS_SESSION_TOKEN` for temporary STS credentials.
    required: false
    show_user: true
    secret: true
  - name: role_arn
    type: text
    title: AWS Role ARN
    description: Mapped to `AWS_ROLE_ARN`.
    required: false
    show_user: false
  - name: external_id
    type: password
    title: AWS External ID
    description: Mapped to `AWS_ROLE_EXTERNAL_ID`.
    required: false
    show_user: false
    secret: true
policy_templates:
  - name: aws
    title: AWS metrics
    description: Collect CloudWatch metrics for AWS services
    data_streams:
      - ec2
      - lambda
      - rds
      - sqs
      - elb
      - elb_classic
      - elb_network
      - elb_gateway
      - ecs
    inputs:
      - package: aws_cloudwatch_input_otel
        title: AWS CloudWatch
        description: >-
          Collect AWS service metrics using the OTel Collector awscloudwatch
          receiver.
owner:
  type: elastic
  github: elastic/obs-signals-integrations-team
