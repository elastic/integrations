title: "AWS SQS Metrics (OpenTelemetry)"
type: metrics
# Pins the dataset so documents land in metrics-aws.sqs.otel-* instead of
# metrics-aws_otel.sqs.otel-*. Matches the content package dataset `aws.sqs.otel`.
dataset: aws.sqs
streams:
  - package: aws_cloudwatch_input_otel
    title: AWS SQS Metrics (OpenTelemetry)
    description: >-
      SQS CloudWatch metrics discovered from the AWS/SQS namespace.
    vars:
      # Definitions come from aws_cloudwatch_input_otel; only the values that
      # differ for this service are overridden here.
      - name: namespace
        default: "AWS/SQS"
        show_user: false
      - name: period
        default: 1m
        show_user: false
      - name: autodiscover_aggregation
        default:
          - Maximum
          - Sum
