title: "AWS Application Load Balancer Metrics"
type: metrics
# Pins the dataset so documents land in metrics-aws.elb.otel-* instead of
# metrics-aws_otel.elb.otel-*. Matches the content package dataset `aws.elb.otel`.
dataset: aws.elb
streams:
  - package: aws_cloudwatch_input_otel
    title: AWS Application Load Balancer Metrics
    description: >-
      Application Load Balancer CloudWatch metrics discovered from the AWS/ApplicationELB namespace.
    template_path: stream.yml.hbs
    vars:
      - name: collection_interval
        type: duration
        title: Collection Interval
        description: How often the receiver polls CloudWatch.
        default: 5m
        required: false
        show_user: false
      - name: period
        type: duration
        title: Period
        description: CloudWatch aggregation window. Must match the metric resolution.
        default: 1m
        required: false
        show_user: true
      - name: delay
        type: duration
        title: Delay
        description: How far back from now each scrape's query window ends. Increase if metrics arrive late from CloudWatch.
        default: 5m
        required: false
        show_user: false
      - name: autodiscover_limit
        type: integer
        title: Autodiscover Limit
        description: >-
          Maximum number of AWS/ApplicationELB metrics to enumerate. Higher values pick
          up more metrics but cost more CloudWatch API calls.
        default: 10000
        required: false
        show_user: false
      - name: autodiscover_aggregation
        type: text
        multi: true
        title: Aggregation Statistics
        description: CloudWatch statistics applied to every discovered metric in AWS/ApplicationELB.
        default:
          - Maximum
          - Average
          - Sum
        required: true
        show_user: false
