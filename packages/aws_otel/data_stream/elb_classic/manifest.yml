title: "AWS Classic Load Balancer Metrics"
type: metrics
# Pins the dataset so documents land in metrics-aws.elb_classic.otel-* instead of
# metrics-aws_otel.elb_classic.otel-*.
dataset: aws.elb_classic
streams:
  - package: aws_cloudwatch_input_otel
    title: AWS Classic Load Balancer Metrics
    description: >-
      Classic Load Balancer CloudWatch metrics discovered from the AWS/ELB namespace.
    template_path: stream.yml.hbs
    vars:
      - name: collection_interval
        type: duration
        title: Collection Interval
        description: How often the receiver polls CloudWatch.
        default: 5m
        required: false
        show_user: false
      - name: period
        type: duration
        title: Period
        description: CloudWatch aggregation window. Must match the metric resolution.
        default: 1m
        required: false
        show_user: false
      - name: delay
        type: duration
        title: Delay
        description: How far back from now each scrape's query window ends. Increase if metrics arrive late from CloudWatch.
        default: 5m
        required: false
        show_user: false
      - name: autodiscover_limit
        type: integer
        title: Autodiscover Limit
        description: >-
          Maximum number of AWS/ELB metrics to enumerate. Higher values pick
          up more metrics but cost more CloudWatch API calls.
        default: 10000
        required: false
        show_user: false
      - name: autodiscover_aggregation
        type: text
        multi: true
        title: Aggregation Statistics
        description: CloudWatch statistics applied to every discovered metric in AWS/ELB.
        default:
          - Maximum
          - Average
          - Sum
        required: true
        show_user: false
