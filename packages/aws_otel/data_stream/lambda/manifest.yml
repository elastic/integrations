title: "AWS Lambda Metrics (OpenTelemetry)"
type: metrics
# Pins the dataset so documents land in metrics-aws.lambda.otel-* instead of
# metrics-aws_otel.lambda.otel-*. Matches the content package dataset `aws.lambda.otel`.
dataset: aws.lambda
streams:
  - package: aws_cloudwatch_input_otel
    title: AWS Lambda Metrics (OpenTelemetry)
    description: >-
      Lambda CloudWatch metrics discovered from the AWS/Lambda namespace.
    vars:
      # Definitions come from aws_cloudwatch_input_otel; only the values that
      # differ for this service are overridden here.
      - name: namespace
        default: "AWS/Lambda"
        show_user: false
      - name: period
        default: 1m
        show_user: false
