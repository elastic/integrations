title: "AWS RDS Metrics (OpenTelemetry)"
type: metrics
# Pins the dataset so documents land in metrics-aws.rds.otel-* instead of
# metrics-aws_otel.rds.otel-*. Matches the content package dataset `aws.rds.otel`.
dataset: aws.rds
streams:
  - package: aws_cloudwatch_input_otel
    title: AWS RDS Metrics (OpenTelemetry)
    description: >-
      RDS CloudWatch metrics discovered from the AWS/RDS namespace.
    vars:
      # Definitions come from aws_cloudwatch_input_otel; only the values that
      # differ for this service are overridden here.
      - name: namespace
        default: "AWS/RDS"
        show_user: false
      - name: period
        default: 1m
        show_user: false
      - name: autodiscover_aggregation
        default:
          - Average
          - Maximum
