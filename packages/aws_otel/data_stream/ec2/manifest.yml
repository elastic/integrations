title: "AWS EC2 Metrics"
type: metrics
# Pins the dataset so documents land in metrics-aws.ec2.otel-* instead of
# metrics-aws_otel.ec2.otel-*. Matches the content package dataset `aws.ec2.otel`.
dataset: aws.ec2
streams:
  - package: aws_cloudwatch_input_otel
    title: AWS EC2 Metrics
    description: >-
      EC2 CloudWatch metrics discovered from the AWS/EC2 namespace: CPU, disk, network, and status checks.
    template_path: stream.yml.hbs
    vars:
      - name: collection_interval
        type: duration
        title: Collection Interval
        description: How often the receiver polls CloudWatch.
        default: 5m
        required: false
        show_user: false
      - name: period
        type: duration
        title: Period
        description: CloudWatch aggregation window. EC2 basic monitoring publishes at 5-minute resolution.
        default: 5m
        required: false
        show_user: false
      - name: delay
        type: duration
        title: Delay
        description: How far back from now each scrape's query window ends. Increase if metrics arrive late from CloudWatch.
        default: 5m
        required: false
        show_user: false
      - name: autodiscover_limit
        type: integer
        title: Autodiscover Limit
        description: >-
          Maximum number of AWS/EC2 metrics to enumerate. Higher values pick
          up more metrics but cost more CloudWatch API calls.
        default: 10000
        required: false
        show_user: false
      - name: autodiscover_aggregation
        type: text
        multi: true
        title: Aggregation Statistics
        description: CloudWatch statistics applied to every discovered metric in AWS/EC2.
        default:
          - Average
          - Sum
          - Maximum
        required: true
        show_user: false
