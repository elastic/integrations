title: Claude Code traces
type: traces
streams:
  - input: otelcol
    title: Claude Code traces
    description: Receive Claude Code OTLP trace spans.
    vars:
      - name: grpc_endpoint
        required: true
        show_user: true
        title: gRPC endpoint
        description: >-
          Address the OTel gRPC receiver listens on. Claude Code sends traces via
          gRPC (OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=grpc).
        type: text
        multi: false
        default: "0.0.0.0:4317"