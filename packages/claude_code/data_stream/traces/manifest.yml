title: Claude Code traces
type: traces
dataset: claude_code
release: beta
streams:
  - input: otelcol
    title: Claude Code traces
    description: Receive Claude Code OTLP trace spans.
    vars:
      - name: http_endpoint
        type: text
        required: true
        show_user: true
        title: HTTP Endpoint
        description: >-
          Address and port to listen on for OTLP HTTP connections. The default port 4320 avoids conflict with the Claude Code events data stream (default: 4318) and claude_cowork (default: 4319) when they are deployed on the same Elastic Agent.
        default: 0.0.0.0:4320
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: >-
          Preserves a JSON copy of the raw OTel span in the field event.original. Increases storage but useful for forensic analysis.
        type: bool
        multi: false
        default: false
