---
description: Pipeline for processing Claude Code OTel trace spans.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: "9.3.0"

  - set:
      tag: set_event_duration
      field: event.duration
      copy_from: duration
      if: ctx.duration != null

  - dot_expander:
      tag: expand_attributes
      field: "*"
      path: attributes
      if: ctx.attributes != null

  - set:
      tag: set_event_action
      field: event.action
      copy_from: name
      if: ctx.name != null

  - script:
      tag: ecs_categorization
      lang: painless
      description: Set ECS event.kind, event.category, and event.type from the span name.
      if: ctx.name != null
      source: >
        def n = ctx.name;
        ctx.event = ctx.event ?: new HashMap();
        ctx.event.kind = 'event';
        if (n == 'claude_code.interaction') {
          ctx.event.category = ['process'];
          ctx.event.type = ['info'];
        } else if (n == 'claude_code.llm_request') {
          ctx.event.category = ['api'];
          ctx.event.type = ['info'];
        } else if (n == 'claude_code.tool') {
          ctx.event.category = ['process'];
          ctx.event.type = ['info'];
        } else if (n == 'claude_code.tool.blocked_on_user') {
          ctx.event.category = ['iam'];
          ctx.event.type = ['info'];
        } else if (n == 'claude_code.tool.execution') {
          ctx.event.category = ['process'];
          ctx.event.type = ['info'];
        } else if (n == 'claude_code.hook') {
          ctx.event.category = ['process'];
          ctx.event.type = ['info'];
        } else {
          ctx.event.category = ['host'];
          ctx.event.type = ['info'];
        }

  # Map to ECS gen_ai.* fields.
  - set:
      tag: set_gen_ai_provider
      field: gen_ai.provider.name
      value: anthropic
      if: ctx.name != null
  - rename:
      tag: rename_gen_ai_response_model
      field: attributes.model
      target_field: gen_ai.response.model
      if: ctx.attributes?.model != null
      ignore_missing: true
  - set:
      tag: set_gen_ai_request_model
      field: gen_ai.request.model
      copy_from: gen_ai.response.model
      if: ctx.gen_ai?.response?.model != null
  - rename:
      tag: rename_gen_ai_response_id
      field: attributes.request_id
      target_field: gen_ai.response.id
      ignore_missing: true
  - rename:
      tag: rename_gen_ai_usage_input_tokens
      field: attributes.input_tokens
      target_field: gen_ai.usage.input_tokens
      ignore_missing: true
  - rename:
      tag: rename_gen_ai_usage_output_tokens
      field: attributes.output_tokens
      target_field: gen_ai.usage.output_tokens
      ignore_missing: true
  - rename:
      tag: rename_gen_ai_usage_cache_read
      field: attributes.cache_read_tokens
      target_field: gen_ai.usage.cache_read.input_tokens
      ignore_missing: true
  - rename:
      tag: rename_gen_ai_usage_cache_creation
      field: attributes.cache_creation_tokens
      target_field: gen_ai.usage.cache_creation.input_tokens
      ignore_missing: true
  - rename:
      tag: rename_gen_ai_tool_name
      field: attributes.tool_name
      target_field: gen_ai.tool.name
      if: ctx.attributes?.tool_name != null
      ignore_missing: true
  - rename:
      tag: rename_gen_ai_tool_call_id
      field: attributes.tool_use_id
      target_field: gen_ai.tool.call.id
      ignore_missing: true

  # Map to ECS core fields.
  - rename:
      tag: rename_organization_id
      field: attributes.organization.id
      target_field: organization.id
      ignore_missing: true
  - rename:
      tag: rename_user_email
      field: attributes.user.email
      target_field: user.email
      ignore_missing: true
  - rename:
      tag: rename_user_id
      field: attributes.user.id
      target_field: user.id
      ignore_missing: true

  # Type-convert numeric string attributes.
  - convert:
      tag: convert_input_tokens
      field: gen_ai.usage.input_tokens
      type: long
      ignore_missing: true
  - convert:
      tag: convert_output_tokens
      field: gen_ai.usage.output_tokens
      type: long
      ignore_missing: true
  - convert:
      tag: convert_cache_read_tokens
      field: gen_ai.usage.cache_read.input_tokens
      type: long
      ignore_missing: true
  - convert:
      tag: convert_cache_creation_tokens
      field: gen_ai.usage.cache_creation.input_tokens
      type: long
      ignore_missing: true
  - convert:
      tag: convert_duration_ms
      field: attributes.duration_ms
      type: long
      ignore_missing: true
  - convert:
      tag: convert_ttft_ms
      field: attributes.ttft_ms
      type: long
      ignore_missing: true
  - convert:
      tag: convert_result_tokens
      field: attributes.result_tokens
      type: long
      ignore_missing: true
  - convert:
      tag: convert_status_code
      field: attributes.status_code
      type: long
      ignore_missing: true
  - convert:
      tag: convert_num_success
      field: attributes.num_success
      type: long
      ignore_missing: true
  - convert:
      tag: convert_num_blocking
      field: attributes.num_blocking
      type: long
      ignore_missing: true
  - convert:
      tag: convert_num_non_blocking_error
      field: attributes.num_non_blocking_error
      type: long
      ignore_missing: true
  - convert:
      tag: convert_num_cancelled
      field: attributes.num_cancelled
      type: long
      ignore_missing: true
  - convert:
      tag: convert_interaction_sequence
      field: attributes.interaction.sequence
      type: long
      ignore_missing: true

  - set:
      tag: set_event_outcome_success
      field: event.outcome
      value: success
      if: ctx.attributes?.success == 'true'
  - set:
      tag: set_event_outcome_failure
      field: event.outcome
      value: failure
      if: ctx.attributes?.success == 'false'
  - set:
      tag: set_event_outcome_decision_accept
      field: event.outcome
      value: success
      if: "ctx.event?.outcome == null && ctx.attributes?.decision == 'accept'"
  - set:
      tag: set_event_outcome_decision_reject
      field: event.outcome
      value: failure
      if: "ctx.event?.outcome == null && ctx.attributes?.decision == 'reject'"
  - set:
      tag: set_event_outcome_unknown
      field: event.outcome
      value: unknown
      if: ctx.event?.outcome == null

  - set:
      tag: set_event_provider
      field: event.provider
      value: claude-code

  - rename:
      tag: namespace_attributes_to_claude_code_traces
      field: attributes
      target_field: claude_code.traces
      ignore_missing: true

  - append:
      tag: append_related_user_email
      field: related.user
      value: "{{{user.email}}}"
      allow_duplicates: false
      if: ctx.user?.email != null
  - append:
      tag: append_related_user_id
      field: related.user
      value: "{{{user.id}}}"
      allow_duplicates: false
      if: ctx.user?.id != null

  - script:
      description: Remove fields with null/empty values.
      tag: remove_nulls
      source: |-
        void handleMap(Map map) {
            map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
            });
        }
        void handleList(List list) {
            list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
            });
        }
        handleMap(ctx);

  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_on_error
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor {{{_ingest.on_failure_processor_type}}}
        with tag {{{_ingest.on_failure_processor_tag}}}
        in pipeline {{{_ingest.pipeline}}}
        failed with message:
        {{{_ingest.on_failure_message}}}
  - set:
      tag: set_pipeline_error_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
