title: Claude Code events
type: logs
streams:
  - input: otelcol
    title: Claude Code events
    description: Receive Claude Code OTLP log events.
    vars:
      - name: http_endpoint
        type: text
        required: true
        show_user: true
        title: HTTP Endpoint
        description: >-
          Address and port to listen on for OTLP HTTP connections. Change this if
          you run multiple OTLP integrations on the same Elastic Agent.
        default: 0.0.0.0:4318
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: >-
          Preserves a JSON copy of the raw OTel event in the field event.original.
          Increases storage but useful for forensic analysis.
        type: bool
        multi: false
        default: false
