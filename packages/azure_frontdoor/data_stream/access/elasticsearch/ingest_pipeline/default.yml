      ignore_missing: true
  - remove:
      tag: remove_azure_frontdoor_access_properties_timeToFirstByte_070d9e59
      field: azure.frontdoor.access.properties.timeToFirstByte
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_pop_to_azure_frontdoor_access_pop_69c29103
      field: azure.frontdoor.access.properties.pop
      target_field: azure.frontdoor.access.pop
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_responseBytes_to_http_response_bytes_3358b6b3
      field: azure.frontdoor.access.properties.responseBytes
      target_field: http.response.bytes
      ignore_missing: true
  - convert:
      field: azure.frontdoor.access.properties.timeTaken
