      type: double
      tag: convert_properties_time_taken_cbed6790
      on_failure:
        - append:
            tag: append_error_message_771fb26b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
      ignore_missing: true
  - remove:
      tag: remove_azure_frontdoor_access_properties_timeTaken_f17815fd
      field: azure.frontdoor.access.properties.timeTaken
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_routingRuleName_to_azure_frontdoor_access_routing_rule_name_6d7d1311
      field: azure.frontdoor.access.properties.routingRuleName
      target_field: azure.frontdoor.access.routing_rule_name
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_httpVersion_to_http_version_91a64ff9
      field: azure.frontdoor.access.properties.httpVersion
      target_field: http.version
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_backendHostname_to_azure_frontdoor_access_backend_hostname_cdb5eba8
      field: azure.frontdoor.access.properties.backendHostname
      target_field: azure.frontdoor.access.backend_hostname
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_isReceivedFromClient_to_azure_frontdoor_access_is_received_from_client_cc0265e2
      field: azure.frontdoor.access.properties.isReceivedFromClient
      target_field: azure.frontdoor.access.is_received_from_client
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_requestProtocol_to_network_protocol_f4c4e15c
      field: azure.frontdoor.access.properties.requestProtocol
      target_field: network.protocol
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_httpStatusCode_to_http_response_status_code_ba57e8a1
      field: azure.frontdoor.access.properties.httpStatusCode
      target_field: http.response.status_code
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_requestUri_to_url_original_da02b502
      field: azure.frontdoor.access.properties.requestUri
      target_field: url.original
      ignore_missing: true
  - uri_parts:
      tag: uri_parts_url_original_3ec04839
      field: url.original
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_ed0fc6c3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_url_full_61fd98e5
      field: url.full
      copy_from: url.original
      ignore_empty_value: true
  # handle identity field
  - rename:
      tag: rename_azure_frontdoor_access_identity_to_azure_frontdoor_access_identity_name_73dfd8d0
      field: azure.frontdoor.access.identity
      if: ctx.azure?.frontdoor?.access?.identity instanceof String
      target_field: azure.frontdoor.access.identity_name
      ignore_missing: true
  - json:
      field: azure.frontdoor.access.identity
      tag: json_identity_3f199193
      if: ctx.azure?.frontdoor?.access?.identity instanceof String
      on_failure:
        - append:
            tag: append_error_message_6cf15af8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_azure_frontdoor_access_identity_authorization_evidence_roleAssignmentScope_to_azure_frontdoor_access_identity_authorization_evidence_role_assignment_scope_67bcb240
      field: azure.frontdoor.access.identity.authorization.evidence.roleAssignmentScope
      target_field: azure.frontdoor.access.identity.authorization.evidence.role_assignment_scope
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_identity_authorization_evidence_roleDefinitionId_to_azure_frontdoor_access_identity_authorization_evidence_role_definition_id_0b1c43fa
      field: azure.frontdoor.access.identity.authorization.evidence.roleDefinitionId
      target_field: azure.frontdoor.access.identity.authorization.evidence.role_definition_id
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_identity_authorization_evidence_roleAssignmentId_to_azure_frontdoor_access_identity_authorization_evidence_role_assignment_id_969a570e
      field: azure.frontdoor.access.identity.authorization.evidence.roleAssignmentId
      target_field: azure.frontdoor.access.identity.authorization.evidence.role_assignment_id
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_identity_authorization_evidence_principalId_to_azure_frontdoor_access_identity_authorization_evidence_principal_id_52d5e6cd
      field: azure.frontdoor.access.identity.authorization.evidence.principalId
      target_field: azure.frontdoor.access.identity.authorization.evidence.principal_id
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_identity_authorization_evidence_principalType_to_azure_frontdoor_access_identity_authorization_evidence_principal_type_a6118a37
      field: azure.frontdoor.access.identity.authorization.evidence.principalType
      target_field: azure.frontdoor.access.identity.authorization.evidence.principal_type
      ignore_missing: true
  - script:
      tag: script_claims_cleanup_0b0dcefd
      lang: painless
      if: ctx.azure?.frontdoor?.access?.identity?.claims != null
      source: |
        Map convertDotsToUnderscore(Map m) {
          def out = new HashMap();
          for (entry in m.entrySet()) {
            def k = entry.getKey().replace('.', '_');
            def v = entry.getValue();
            out.put(k, v);
          }
          return out;
        }
        ctx.azure.frontdoor.access.identity.claims = convertDotsToUnderscore(ctx.azure.frontdoor.access.identity.claims);
      on_failure:
        - append:
            tag: append_error_message_bc996808
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      description: Extract user fields into claims_initiated_by_user object from claims object
      tag: script_claims_user_c03e6352
      if: ctx.azure?.frontdoor?.access?.identity?.claims instanceof Map
      lang: painless
      params:
        surname: "http://schemas_xmlsoap_org/ws/2005/05/identity/claims/surname"
        name: "http://schemas_xmlsoap_org/ws/2005/05/identity/claims/name"
        givenname: "http://schemas_xmlsoap_org/ws/2005/05/identity/claims/givenname"
        objectidentifier: "http://schemas_microsoft_com/identity/claims/objectidentifier"
        tenantid: "http://schemas_microsoft_com/identity/claims/tenantid"
      source: |-
        def claims = ctx.azure.frontdoor.access.identity.claims;
        def claims_initiated_by_user = new HashMap();
        if (claims.name != null) {
            claims_initiated_by_user.fullname = claims.name;
        }
        for (entry in params.entrySet()) {
            if (claims[entry.getValue()] != null) {
                claims_initiated_by_user[entry.getKey()] = claims[entry.getValue()];
            }
        }
        if (claims_initiated_by_user.size() > 0) {
            claims_initiated_by_user.schema = "http://schemas.xmlsoap.org/ws/2005/05/identity/claims";
            ctx.azure.frontdoor.access.identity.claims_initiated_by_user = claims_initiated_by_user;
        }
      on_failure:
        - append:
            tag: append_error_message_ce7bf2ae
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - grok:
      tag: grok_azure_frontdoor_access_identity_claims_initiated_by_user_name_b3e8efd7
      field: azure.frontdoor.access.identity.claims_initiated_by_user.name
      patterns:
        - '%{USERNAME:user.name}@%{HOSTNAME:user.domain}'
      ignore_missing: true
      ignore_failure: true
  # set user.email to the original name if the above grok succeeded.
  - set:
      tag: set_user_email_e4a5b8d3
      field: user.email
      value: '{{{azure.frontdoor.access.identity.claims_initiated_by_user.name}}}'
      ignore_empty_value: true
      if: 'ctx.user?.name != null'
  # set user.name to the original name if the above grok failed (name format is not an email).
  - set:
      tag: set_user_name_d9742b42
      field: user.name
      value: '{{{azure.frontdoor.access.identity.claims_initiated_by_user.name}}}'
      ignore_empty_value: true
      if: 'ctx.user?.name == null'
  - rename:
      tag: rename_azure_frontdoor_access_identity_claims_initiated_by_user_fullname_to_user_full_name_365f4823
      field: azure.frontdoor.access.identity.claims_initiated_by_user.fullname
      target_field: user.full_name
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_identity_claims_initiated_by_user_objectidentifier_to_user_id_b0a0dca5
      field: azure.frontdoor.access.identity.claims_initiated_by_user.objectidentifier
      target_field: user.id
      ignore_missing: true
  - append:
      tag: append_user_roles_a13c0dc2
      field: user.roles
      value: '{{{azure.frontdoor.access.identity.authorization.evidence.role}}}'
      allow_duplicates: false
      if: ctx.azure?.frontdoor?.access?.identity?.authorization?.evidence?.role != null
  - append:
      tag: append_related_user_837e080f
      field: related.user
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: 'ctx.user?.name != null'
  - append:
      tag: append_related_user_7021abb5
      field: related.user
      value: '{{{user.full_name}}}'
      allow_duplicates: false
      if: 'ctx.user?.full_name != null'
  - append:
      tag: append_related_user_7f407fef
      field: related.user
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: 'ctx.user?.id != null'
  - rename:
      tag: rename_azure_frontdoor_access_identity_claims_initiated_by_user_tenantid_to_cloud_account_id_95b313df
      field: azure.frontdoor.access.identity.claims_initiated_by_user.tenantid
      target_field: cloud.account.id
      ignore_missing: true
  - convert:
      tag: convert_client_port_997d639f
      field: client.port
      type: long
      ignore_missing: true
  - convert:
      tag: convert_http_request_bytes_74307b8d
      field: http.request.bytes
      type: long
      ignore_missing: true
  - convert:
      tag: convert_http_response_bytes_4e4d07d3
      field: http.response.bytes
      type: long
      ignore_missing: true
  - convert:
      tag: convert_http_response_status_code_3f4ab290
      field: http.response.status_code
      type: long
      ignore_missing: true
  - date:
      tag: date_azure_frontdoor_access_time_to_timestamp_7865914c
      field: azure.frontdoor.access.time
      target_field: "@timestamp"
      formats:
        - ISO8601
  - dissect:
      tag: dissect_azure_frontdoor_access_properties_securityProtocol_f821ed43
      field: azure.frontdoor.access.properties.securityProtocol
      pattern: "%{tls.version_protocol} %{tls.version}"
      ignore_missing: true
  - remove:
      tag: remove_e8bb3f1e
      field:
        - azure.frontdoor.access.properties.securityProtocol
        - azure.frontdoor.access.properties.httpStatusDetails
        - azure.frontdoor.access.time
        - azure.frontdoor.access.properties
      ignore_missing: true
  - geoip:
      tag: geoip_client_ip_to_source_geo_cb29dbcc
      field: client.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_client_ip_to_source_as_156f0c05
      database_file: GeoLite2-ASN.mmdb
      field: client.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - user_agent:
      tag: user_agent_user_agent_original_b5325863
      field: user_agent.original
      ignore_missing: true

on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
