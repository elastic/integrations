---
description: Pipeline for processing azure frontdoor access logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: "8.11.0"
  - set:
      tag: set_event_category_dbab8a4e
      field: event.category
      value: [network]
  - set:
      tag: set_event_type_8fd37e4e
      field: event.type
      value: [connection]
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
  - set:
      tag: set_cloud_provider_136a398d
      field: cloud.provider
      value: azure
  - drop:
      tag: drop_invalid_json_a8ca7062
      description: Drop if invalid json
      if: 'ctx.event?.original != null && ctx.event.original.contains(''"records"'')'
  - json:
      tag: json_event_original_to_azure_frontdoor_access_a26d917e
      field: event.original
      target_field: azure.frontdoor.access
  - script:
      description: Drops fields with empty or N/A values recursively
      tag: script_to_drop_invalid_values_fe6ebb18
      lang: painless
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - rename:
      tag: rename_azure_frontdoor_access_resourceId_to_azure_frontdoor_resource_id_e20702d3
      field: azure.frontdoor.access.resourceId
      target_field: azure.frontdoor.resource_id
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_operationName_to_azure_frontdoor_operation_name_1b6649c9
      field: azure.frontdoor.access.operationName
      target_field: azure.frontdoor.operation_name
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_trackingReference_to_azure_frontdoor_tracking_reference_a33262d8
      field: azure.frontdoor.access.properties.trackingReference
      target_field: azure.frontdoor.tracking_reference
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_category_to_azure_frontdoor_category_b9eeefbe
      field: azure.frontdoor.access.category
      target_field: azure.frontdoor.category
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_clientIp_to_client_ip_14d71141
      field: azure.frontdoor.access.properties.clientIp
      target_field: client.ip
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_clientPort_to_client_port_6573e03d
      field: azure.frontdoor.access.properties.clientPort
      target_field: client.port
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_requestBytes_to_http_request_bytes_100f4ea5
      field: azure.frontdoor.access.properties.requestBytes
      target_field: http.request.bytes
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_socketIp_to_client_address_1615f3a4
      field: azure.frontdoor.access.properties.socketIp
      target_field: client.address
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_ErrorInfo_to_azure_frontdoor_access_error_info_7693c54a
      field: azure.frontdoor.access.properties.ErrorInfo
      target_field: azure.frontdoor.access.error_info
      ignore_missing: true
  - rename:
      tag: rename_azure_frontdoor_access_properties_rulesEngineMatchNames_to_azure_frontdoor_access_rules_engine_match_names_cb268302
      field: azure.frontdoor.access.properties.rulesEngineMatchNames
