---
description: Pipeline to decode CSV risklists from Recorded Future threat intel.
processors:
  - csv:
      tag: csv_event_original_18c178cc
      field: event.original
      target_fields:
        - _tmp_.col0
        - _tmp_.col1
        - _tmp_.col2
        - _tmp_.col3
        - _tmp_.col4
  - drop:
      tag: drop_csv_header_line_b56a4f9a
      description: 'Drops the CSV header line.'
      if: 'ctx._tmp_.col0 == "Name"'

  # This supports the default CSV risklists:
  # 4-column for url, domain and IPs.
  # 5-column for hash.
  - script:
      tag: script_maps_csv_entries_to_fields_f3b18a9d
      description: Maps the CSV entries to fields.
      lang: painless
      params:
        default:
          col0: Name
          col1: Risk
          col2: RiskString
          col3: EvidenceDetails
        hash:
          col0: Name
          col1: Algorithm
          col2: Risk
          col3: RiskString
          col4: EvidenceDetails
      source: >
        def cols = params[ ctx._tmp_.col4 == null? "default" : "hash" ];
        def src = ctx._tmp_;
        def dst = new HashMap();
        for (entry in cols.entrySet()) {
          dst[entry.getValue()] = src[entry.getKey()];
        }
        ctx['json'] = dst;
  - remove:
      tag: remove__tmp__0f50c67b
      field: _tmp_
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
