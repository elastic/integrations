  - script:
      tag: handle_acknowledged_status
      lang: painless
      source: |
        ctx.darktrace = ctx.darktrace ?: [:];
        ctx.darktrace.model_breach_alert = ctx.darktrace?.model_breach_alert ?: [:];
        if (ctx.darktrace?.model_breach_alert?.acknowledged == null) {
          ctx.darktrace.model_breach_alert.is_acknowledged = false;
          return;
        }
        if (!(ctx.darktrace.model_breach_alert.acknowledged instanceof Map)) {
          // It appears that some versions of the data from Darktrace
          // have the value at acknowledged as a boolean. Don't handle
          // that here. Rename it to is_acknowledged below.
          return;
        }
        if (ctx.darktrace.model_breach_alert.acknowledged.time == null) {
          // No time, so be non-commital.
          return;
        }
        if (ctx.darktrace.model_breach_alert.time == null) {
          // Assume any time noted in json.acknowledged.time
          // is in the past.
          ctx.darktrace.model_breach_alert.is_acknowledged = true;
          return;
        }
