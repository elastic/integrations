---
description: Pipeline for processing Model Breach Alert logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - grok:
      tag: grok_message_eed680aa
      field: message
      patterns:
        - "^%{FIELD:log.syslog.appname}\\s*%{GREEDYDATA:message}$"
      pattern_definitions:
        FIELD: "[a-zA-Z]*"
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - fingerprint:
      tag: fingerprint_1cec355f
      fields:
        - json.time
        - json.creationTime
        - json.pbid
        - json.model.phid
      target_field: _id
      ignore_missing: true
  - set:
      tag: set_event_kind_e0df4b58
      field: event.kind
      value: alert
      if: (['critical','suspicious'].contains(ctx.json?.model?.category?.toLowerCase()))
  - set:
      tag: set_event_kind_7fba37b2
      field: event.kind
      value: event
      if: (['compliance','informational'].contains(ctx.json?.model?.category?.toLowerCase()))
  - set:
      tag: set_event_category_5ce3ed31
      field: event.category
      value: [threat]
      if: ctx.event?.kind == 'alert'
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: [info]
  - script:
      tag: script_b1769ed3
      description: Dynamically map event.* fields from metric label.
      lang: painless
      if: ctx.json?.triggeredComponents instanceof List
      ignore_failure: true
      source:
        for (component in ctx.json.triggeredComponents) {
          if (component?.metric?.label?.toLowerCase().contains('connection')) {
            ctx.event?.type?.add('connection');
            if (ctx.event.category == null) {
              ctx.event.category = new ArrayList();
            }
            ctx.event.category.add('network');
          }
        }
  - foreach:
      tag: foreach_json_aianalystData_2927adf8
      field: json.aianalystData
      if: ctx.json?.aianalystData instanceof List
      ignore_failure: true
      processor:
        foreach:
          field: _ingest._value.related
          ignore_failure: true
          processor:
            convert:
              field: _ingest._value
              type: long
              on_failure:
                - remove:
                    field: _ingest._value
                - append:
                    field: error.message
                    value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_aianalystData_to_darktrace_model_breach_alert_aianalyst_data_1760670a
