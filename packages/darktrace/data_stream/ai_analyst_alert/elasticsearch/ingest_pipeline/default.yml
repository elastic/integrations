---
description: Pipeline for processing AI Analyst Alert logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - grok:
      tag: grok_message_eed680aa
      field: message
      patterns:
        - "^%{FIELD:log.syslog.appname}\\s*%{GREEDYDATA:message}$"
      pattern_definitions:
        FIELD: "[a-zA-Z]*"
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - fingerprint:
      tag: fingerprint_81343969
      fields:
        - json.id
        - json.createdAt
        - json.activityId
        - json.currentGroup
      target_field: _id
      ignore_missing: true
  - set:
      tag: set_event_kind_1e65fdb2
      field: event.kind
      value: alert
      if: (['critical','suspicious'].contains(ctx.json?.category?.toLowerCase()))
  - set:
      tag: set_event_kind_0d8745d8
      field: event.kind
      value: event
      if: (['compliance','informational'].contains(ctx.json?.category?.toLowerCase()))
  - set:
      tag: set_event_category_5ce3ed31
      field: event.category
      value: [threat]
      if: ctx.event?.kind == 'alert'
  - set:
      tag: set_event_type_10f233fd
      field: event.type
      value: [indicator]
      if: ctx.event?.category instanceof Collection && ctx.event.category.contains('threat')
