title: "Resecurity IOC Lookup"
type: logs
dataset: resecurity_risk.ioc_lookup
streams:
  - input: cel
    template_path: cel.yml.hbs
    title: "Look Up Resecurity IOCs by Hash"
    description: "Look Up Indicators of Compromise by MD5/SHA256 hash against the Resecurity RISK API (watchlist enrichment)."
    enabled: false
    vars:
      - name: hashes
        type: text
        title: "Hashes to Look Up"
        description: "List of MD5 or SHA256 hashes to look up on every poll. Each hash is queried against /ioc/search-by-hash."
        multi: true
        required: true
        show_user: true
      - name: interval
        type: text
        title: "Collection Interval"
        default: "24h"
        required: true
        show_user: true
      - name: enable_request_tracer
        type: bool
        title: "Enable request tracing"
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging
          configurations. Enabling this request tracing compromises security and should only be used for
          debugging. See [documentation](https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-cel#_resource_tracer_enabled)
          for details.
        multi: false
        required: false
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - resecurity_risk-ioc_lookup
      - name: preserve_original_event
        type: bool
        title: "Preserve original event"
        description: "Preserves a raw copy of the original event, added to the field `event.original`."
        multi: false
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event
          with metadata. This executes in the agent before the events are parsed. See
          [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html)
          for details.
