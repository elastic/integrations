---
description: Pipeline for processing Resecurity RISK dark web records.
processors:
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null
      description: error message set and no data to process.
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.4.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      field: event.original
      tag: json_event_original
      target_field: resecurity_risk.dark_web
      description: The whole record is kept under its own namespace so that no vendor field collides with an ECS field.
  - set:
      field: event.kind
      tag: set_event_kind
      value: enrichment
  - set:
      field: event.category
      tag: set_event_category
      value: [threat]
  - set:
      field: event.type
      tag: set_event_type
      value: [indicator]
  - set:
      field: event.dataset
      tag: set_event_dataset
      value: resecurity_risk.dark_web
  - fingerprint:
      fields:
        - resecurity_risk.dark_web.id
      tag: fingerprint_id
      target_field: _id
      if: ctx.resecurity_risk?.dark_web?.id != null
  - date:
      field: resecurity_risk.dark_web.timestamp
      tag: date_timestamp
      target_field: resecurity_risk.dark_web.timestamp
      formats:
        - ISO8601
        - UNIX
      if: ctx.resecurity_risk?.dark_web?.timestamp != null
      on_failure:
        - remove:
            field: resecurity_risk.dark_web.timestamp
            tag: remove_unparsable_timestamp
            ignore_missing: true
        - append:
            field: error.message
            tag: append_error_timestamp
            value: 'failed to parse timestamp: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp
      copy_from: resecurity_risk.dark_web.timestamp
      if: ctx.resecurity_risk?.dark_web?.timestamp != null
  - remove:
      field: event.original
      tag: remove_event_original
      if: ctx.tags == null || !(ctx.tags.contains('preserve_original_event'))
      ignore_missing: true
      description: The `event.original` field is no longer required if the `preserve_original_event` tag is not set.
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{ _ingest.on_failure_processor_type }}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{ _ingest.on_failure_processor_tag }}'{{/_ingest.on_failure_processor_tag}}
        failed with message '{{ _ingest.on_failure_message }}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
