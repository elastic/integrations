format_version: 3.3.2
name: resecurity_risk
title: "Resecurity RISK"
version: 0.1.0
description: "Collect Threat Intelligence Alerts, Indicators of Compromise, Data Breaches, and Dark Web mentions from the Resecurity RISK REST API."
type: integration
categories:
  - threat_intel
conditions:
  kibana:
    version: ">=8.13.0"
icons:
  - src: /img/imagesResec.svg
    title: "Resecurity Logo"
    size: "200x200"
    type: "image/svg+xml"
policy_templates:
  - name: risk
    title: "Resecurity RISK"
    description: "Collect Alerts, IOCs, Breaches, and Dark Web data from the Resecurity RISK API."
    inputs:
      - type: cel
        title: "Collect Resecurity RISK data over HTTP"
        description: "Requires a Resecurity RISK API key."
        vars:
          - name: url
            type: text
            title: "Resecurity API base URL"
            description: "Base URL for the Resecurity RISK API. Depending on the product you have purchased this may also be https://app.resecurity.com/api."
            multi: false
            required: true
            show_user: true
            default: "https://risk.resecurity.com/api"
          - name: api_key
            type: password
            title: "API key"
            description: "Resecurity RISK API key. Sent as the Basic-auth username; the password is left blank."
            multi: false
            required: true
            secret: true
            show_user: true
          - name: http_client_timeout
            type: text
            title: "HTTP client timeout"
            description: "Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h."
            multi: false
            required: false
            show_user: false
            default: 30s
          - name: proxy_url
            type: text
            title: "Proxy URL"
            description: "URL to proxy connections in the form of http\\[s\\]://<user>:<password>@<server name/ip>:<port>."
            multi: false
            required: false
            show_user: false
          - name: ssl
            type: yaml
            title: "SSL configuration"
            description: "SSL configuration options. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html#ssl-common-config) for details."
            multi: false
            required: false
            show_user: false
owner:
  github: elastic/security-service-integrations
  type: community
