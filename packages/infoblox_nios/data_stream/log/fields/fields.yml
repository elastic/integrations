- name: infoblox_nios.log
  type: group
  fields:
    - name: audit
      type: group
      fields:
        - name: apparently_via
          type: keyword
        - name: auth
          type: keyword
        - name: error
          type: text
        - name: group
          type: keyword
        - name: info
          type: text
        - name: ip
          type: ip
        - name: message
          type: text
        - name: object
          type: group
          fields:
            - name: name
              type: keyword
            - name: value
              type: keyword
        - name: to
          type: keyword
        - name: trigger_event
          type: keyword
    - name: dhcp
      type: group
      fields:
        - name: client_hostname
          type: keyword
        - name: decline
          type: group
          fields:
            - name: message
              type: keyword
        - name: duid
          type: keyword
        - name: discover
          type: group
          fields:
            - name: message
              type: keyword
        - name: iaid
          type: keyword
        - name: inform
          type: group
          fields:
            - name: message
              type: keyword
        - name: interface
          type: group
          fields:
            - name: ip
              type: ip
        - name: ip
          type: ip
        - name: forward_name
          type: keyword
        - name: lease
          type: group
          fields:
            - name: duration
              type: long
            - name: message
              type: keyword
        - name: lease_query
          type: group
          fields:
            - name: message
              type: keyword
        - name: link_address
          type: keyword
        - name: message
          type: text
        - name: network
          type: keyword
        - name: offered
          type: group
          fields:
            - name: duration
              type: long
        - name: peer_address
          type: keyword
        - name: relay
          type: group
          fields:
            - name: interface
              type: group
              fields:
                - name: ip
                  type: ip
                - name: name
                  type: keyword
        - name: release
          type: group
          fields:
            - name: info
              type: keyword
        - name: request
          type: group
          fields:
            - name: message
              type: keyword
        - name: router
          type: group
          fields:
            - name: ip
              type: ip
        - name: trans_id
          type: keyword
        - name: uid
          type: keyword
        - name: validation_second
          type: long
    - name: dns
      type: group
      fields:
        - name: action
          type: keyword
          description: Decision BIND logged for the query under the security category, for example `denied` or `approved`.
        - name: after_query
          type: text
        - name: answers_policy
          type: text
        - name: before_query
          type: text
        - name: category
          type: text
        - name: ecs_client_subnet
          type: group
          description: EDNS Client Subnet (ECS) option, as defined in RFC 7871, reported on a query log line. Not related to the Elastic Common Schema.
          fields:
            - name: ip
              type: ip
              description: Client subnet address carried in the EDNS Client Subnet option.
            - name: prefix_length
              type: long
              description: Source prefix length of the EDNS Client Subnet option, in bits.
            - name: scope_prefix_length
              type: long
              description: Scope prefix length of the EDNS Client Subnet option, in bits.
        - name: failed_message
          type: text
        - name: failure_reason
          type: keyword
          description: Reason BIND reported for a failed query, verbatim. Usually a DNS RCODE such as `REFUSED`, but can be an internal result such as `timed out` or `failure`.
        - name: message
          type: text
        - name: query_context
          type: keyword
          description: Source BIND answered the query from when logging a security decision, for example `cache`.
        - name: transfer
          type: group
          description: Details of a zone transfer reported under the xfer-in category.
          fields:
            - name: stage
              type: keyword
              description: Stage of the zone transfer that BIND reported a failure in, for example `failed` in `failed while receiving responses`.
            - name: status
              type: keyword
              description: Status BIND reported for the zone transfer, verbatim, for example `success`, `completed`, `IXFR failed` or `REFUSED`.
        - name: view_name
          type: text
        - name: version
          type: text
        - name: header_flags
          type: keyword
        - name: rpz
          type: group
          fields:
            - name: action
              type: keyword
            - name: domain
              type: keyword
            - name: domain_rewrite
              type: keyword
            - name: query_class
              type: keyword
            - name: query_class_rewrite
              type: keyword
            - name: rule_type
              type: keyword
            - name: type
              type: keyword
    - name: service_name
      type: keyword
    - name: type
      type: keyword
    - name: view
      type: keyword
