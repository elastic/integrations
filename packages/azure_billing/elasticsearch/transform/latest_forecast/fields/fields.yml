- name: azure.billing
  type: group
  description: >
    billing and usage details

  fields:
    - name: currency
      type: keyword
      description: >
        The currency

    - name: usage_start
      type: date
      description: >
        The usage start date

    - name: usage_end
      type: date
      description: >
        The usage end date

    - name: actual_cost
      type: float
      description: >
        The actual cost

    - name: forecast_cost
      type: float
      description: >
        The forecast cost

    - name: usage_date
      type: date
      description: >
        The usage date

    - name: fetch_id
      type: keyword
      description: >
        Identifier of the metricset run that produced the row, when the agent emits one

    - name: scope
      type: keyword
      description: >
        The Azure scope the forecast was queried for: the subscription, department, or billing account

    - name: cost_status
      type: keyword
      description: >
        Whether the row holds an actual or a forecast cost. Derived by the transform from the cost field that is populated, because the Azure forecast API does not return a status field.

