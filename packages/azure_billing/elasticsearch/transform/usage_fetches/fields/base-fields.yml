# Plain keywords, not the ECS constant_keyword: this destination is a regular
# index that can hold documents of every namespace, and a constant_keyword
# accepts only one value per index.
- name: data_stream.type
  type: keyword
  description: Data stream type of the source document.
- name: data_stream.dataset
  type: keyword
  description: Data stream dataset of the source document.
- name: data_stream.namespace
  type: keyword
  description: Data stream namespace of the source document.
- name: '@timestamp'
  external: ecs
