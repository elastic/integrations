- name: azure
  type: group
  fields:
    - name: subscription_id
      type: keyword
      description: >
        The subscription ID

    - name: resource
      type: group
      fields:
        - name: group
          type: keyword
          description: >
            The resource group

        - name: name
          type: keyword
          description: >
            The name of the resource

        - name: type
          type: keyword
          description: >
            The type of the resource

    - name: billing
      type: group
      fields:
        - name: usage_date
          type: date
          description: >
            The usage date

        - name: billing_period_id
          type: keyword
          description: >
            The ID of the usage detail record, shared by all rows of the same day, meter, and resource

        - name: currency
          type: keyword
          description: >
            The currency

        - name: account_name
          type: keyword
          description: >
            The billing account name

        - name: department_name
          type: keyword
          description: >
            The department name

        - name: product
          type: keyword
          description: >
            The product type

        - name: subscription_day
          type: keyword
          description: >
            Usage day and subscription of the row, in the form `YYYY-MM-DD|subscriptions/<id>` (the queried scope for rows without a subscription)

        - name: fetch_key
          type: keyword
          description: >
            Identity of the fetch that produced the rows: the agent's fetch ID, or the agent process and minute for agents that do not emit one

        - name: pretax_cost
          type: double
          description: >
            Cost of this day, meter, and resource in this fetch

        - name: row_count
          type: long
          description: >
            Number of usage detail rows in this fetch that make up `pretax_cost`

- name: cloud.region
  external: ecs
- name: event.ingested
  external: ecs
