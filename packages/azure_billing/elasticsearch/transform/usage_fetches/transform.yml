source:
  index:
    - "metrics-azure.billing-*"
  # Only the usage detail rows. The forecast rows produced by the same metricset
  # have no `pretax_cost` and are handled by the `latest_forecast` transform.
  # Rows need a usage day: `usage_date`, or `usage_start` for agents before 8.4.
  query:
    bool:
      filter:
        - exists:
            field: azure.billing.pretax_cost
        - bool:
            should:
              - exists:
                  field: azure.billing.usage_date
              - exists:
                  field: azure.billing.usage_start
            minimum_should_match: 1
  runtime_mappings:
    # The day of the usage row. Agents before 8.4 send no `usage_date`, and their
    # `usage_start` is the row's own day. From 8.4 on, `usage_start` is the start
    # of the query window, so it is only the fallback.
    azure.billing.usage_day:
      type: date
      script:
        source: |-
          if (doc.containsKey('azure.billing.usage_date') && doc['azure.billing.usage_date'].size() > 0) {
            emit(doc['azure.billing.usage_date'].value.toInstant().toEpochMilli());
          } else if (doc.containsKey('azure.billing.usage_start') && doc['azure.billing.usage_start'].size() > 0) {
            emit(doc['azure.billing.usage_start'].value.toInstant().toEpochMilli());
          }
    # Identity of the fetch a row belongs to. Agents that emit
    # `azure.billing.fetch_id` (Elastic Agent 9.6 and later) identify it exactly:
    # every row of a run carries the same ID and the same `@timestamp`. Rows from
    # older agents have neither and are grouped by the agent process that
    # produced them (`agent.ephemeral_id`, which changes on every restart) and
    # the minute in which they were created. That fallback is best effort: a
    # fetch whose rows cross a minute boundary is split, and two fetches of one
    # process inside the same minute are merged.
    azure.billing.fetch_key:
      type: keyword
      script:
        source: |-
          if (doc.containsKey('azure.billing.fetch_id') && doc['azure.billing.fetch_id'].size() > 0
              && doc['azure.billing.fetch_id'].value != '') {
            emit(doc['azure.billing.fetch_id'].value);
          } else if (doc.containsKey('agent.ephemeral_id') && doc['agent.ephemeral_id'].size() > 0) {
            emit(doc['agent.ephemeral_id'].value + '|' + String.valueOf(doc['@timestamp'].value.toInstant().toEpochMilli() / 60000L));
          }
    # The usage day together with the subscription of the row: the unit the
    # `usage_latest_fetch` transform selects the newest fetch for. A fetch is a
    # complete snapshot of a day for the scope it queried, so it is also complete
    # for every subscription in that scope. Keying on the subscription instead of
    # the scope lets a newer fetch of any scope replace an older one: a
    # department policy and a subscription policy inside it, or an agent upgrade
    # that changes a department policy's scope, never count a subscription's day
    # twice. Rows without a subscription (absent or empty) fall back to the
    # queried scope.
    azure.billing.subscription_day:
      type: keyword
      script:
        source: |-
          String key = null;
          if (doc.containsKey('azure.subscription_id') && doc['azure.subscription_id'].size() > 0
              && doc['azure.subscription_id'].value != '') {
            key = 'subscriptions/' + doc['azure.subscription_id'].value;
          } else if (doc.containsKey('azure.billing.scope') && doc['azure.billing.scope'].size() > 0
              && doc['azure.billing.scope'].value != '') {
            key = doc['azure.billing.scope'].value;
          }
          def day = null;
          if (doc.containsKey('azure.billing.usage_date') && doc['azure.billing.usage_date'].size() > 0) {
            day = doc['azure.billing.usage_date'].value;
          } else if (doc.containsKey('azure.billing.usage_start') && doc['azure.billing.usage_start'].size() > 0) {
            day = doc['azure.billing.usage_start'].value;
          }
          if (key != null && day != null) {
            emit(day.toLocalDate().toString() + '|' + key);
          }
# First of two transforms that deduplicate usage details without
# scripted aggregations, so that they also run on Elasticsearch Serverless.
#
# The Azure Usage Details API does not give every cost row a unique ID. Rows for
# the same day, meter, and resource share one `id` and legitimately appear more
# than once, for example one row per VM instance of a scale set or one row per
# storage billing event. The fields that tell those rows apart (`additionalInfo`)
# are not part of the indexed document, so a per-row unique key does not exist.
#
# What is unique is the collection run: the metricset re-fetches whole days, and
# every fetch is a complete snapshot of a day at that moment. This transform
# therefore sums the rows per day, meter, resource, and fetch, and keeps every
# fetch. The `usage_latest_fetch` transform, which reads this index, records the
# newest fetch per day and subscription, and the dashboard joins this index with
# it to count only the rows of that fetch. Reading every fetch here, rather than
# a per-bucket copy that another transform maintains, means the newest fetch the
# lookup names is always present, even while one checkpoint is behind the other.
pivot:
  group_by:
    # The usage day (see runtime_mappings), written as `azure.billing.usage_date`.
    azure.billing.usage_date:
      date_histogram:
        field: azure.billing.usage_day
        calendar_interval: 1d
    azure.billing.billing_period_id:
      terms:
        field: azure.billing.billing_period_id
        missing_bucket: true
    azure.billing.currency:
      terms:
        field: azure.billing.currency
        missing_bucket: true
    azure.subscription_id:
      terms:
        field: azure.subscription_id
        missing_bucket: true
    azure.billing.account_name:
      terms:
        field: azure.billing.account_name
        missing_bucket: true
    azure.billing.department_name:
      terms:
        field: azure.billing.department_name
        missing_bucket: true
    azure.resource.group:
      terms:
        field: azure.resource.group
        missing_bucket: true
    azure.resource.name:
      terms:
        field: azure.resource.name
        missing_bucket: true
    azure.resource.type:
      terms:
        field: azure.resource.type
        missing_bucket: true
    azure.billing.product:
      terms:
        field: azure.billing.product
        missing_bucket: true
    cloud.region:
      terms:
        field: cloud.region
        missing_bucket: true
    # Fetch identity, see the runtime mappings above.
    azure.billing.subscription_day:
      terms:
        field: azure.billing.subscription_day
        missing_bucket: true
    azure.billing.fetch_key:
      terms:
        field: azure.billing.fetch_key
        missing_bucket: true
  aggregations:
    # Newest row of the fetch. The `usage_latest_fetch` transform sorts on it.
    "@timestamp":
      max:
        field: "@timestamp"
    azure.billing.pretax_cost:
      sum:
        field: azure.billing.pretax_cost
    # Number of usage detail rows that make up `pretax_cost` in this fetch.
    azure.billing.row_count:
      value_count:
        field: azure.billing.pretax_cost
dest:
  # The destination index must not match `metrics-*`, so that a `metrics-*` data
  # view never counts both the raw and the deduplicated documents.
  index: "azure_billing.usage_fetches-v1"
  # Stamps `event.ingested`, the sync field of the `usage_latest_fetch` transform.
  pipeline: '{{ ingestPipelineName "usage_fetches_ingested" }}'
  aliases:
    - alias: "azure_billing.usage_fetches"
      move_on_creation: true
description: >-
  Azure billing usage details summed per day, meter, resource, and fetch. First stage of the deduplication, read by the dashboard together with the usage_latest_fetch lookup index.
# A check without new documents is cheap, and a short interval bounds how long
# the dashboard waits after an install, or shows a fetch that a checkpoint split.
frequency: 5m
settings:
  # This is required to prevent the transform from clobbering the Fleet-managed
  # mappings.
  deduce_mappings: false
  unattended: true
sync:
  time:
    # Ingest time, stamped by Fleet's final pipeline on every raw document. Syncing
    # on it instead of `@timestamp` means rows that arrive late or are backfilled
    # with an older event time are still picked up.
    field: "event.ingested"
    # 120s instead of the default 60s because of the index refresh delay in
    # Serverless.
    delay: 120s
_meta:
  # Bump this version to delete, reinstall, and restart the transform during
  # package installation. Fleet keeps the destination index, and the new
  # transform re-reads the whole source into it: the source has no `@timestamp`
  # range filter on purpose, as it would drop that history. When the output
  # changes shape, also rename the destination index (`-v2`), so that old and
  # new documents do not mix.
  fleet_transform_version: 0.1.0
  # Installed before the `usage_latest_fetch` transform that reads its output.
  order: 0
  run_as_kibana_system: false
