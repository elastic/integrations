- name: azure.billing.day_scope
  type: keyword
  description: >
    Usage day and the scope it was fetched for, in the form `YYYY-MM-DD|<scope>`

- name: latest.azure.billing.fetch_key
  type: keyword
  description: >
    Fetch key of the newest fetch for the day and scope

- name: event.ingested
  external: ecs
