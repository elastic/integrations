- name: azure.billing
  type: group
  fields:
    - name: subscription_day
      type: keyword
      description: >
        Usage day and subscription, in the form `YYYY-MM-DD|subscriptions/<id>` (the queried scope for rows without a subscription)

- name: latest.azure.billing
  type: group
  fields:
    - name: fetch_key
      type: keyword
      description: >
        Fetch key of the newest fetch for the usage day and subscription
