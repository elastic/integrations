source:
  # Output of the `usage_fetches` transform: one document per day, meter,
  # resource, and fetch.
  index:
    - "azure_billing.usage_fetches"
# Second of two transforms that deduplicate usage details. For every day and
# subscription this records which fetch is the newest one. The dashboard joins
# the `usage_fetches` output with this index (ES|QL LOOKUP JOIN) and counts only
# the rows of that fetch, so a bucket that a newer fetch no longer contains, or
# carries under a corrected key, is not added from an older fetch. A lookup index
# is not narrowed by the dashboard's controls and time range, so they cannot
# bring an older fetch back.
pivot:
  group_by:
    azure.billing.subscription_day:
      terms:
        field: azure.billing.subscription_day
  aggregations:
    "@timestamp":
      max:
        field: "@timestamp"
    # Fetch key of the newest fetch for the day and subscription, written as
    # `latest.azure.billing.fetch_key`.
    latest:
      top_metrics:
        metrics:
          - field: azure.billing.fetch_key
        sort:
          "@timestamp": desc
dest:
  # A lookup-mode index (see manifest.yml), as required by ES|QL LOOKUP JOIN.
  index: "azure_billing.usage_latest_fetch-v1"
  aliases:
    - alias: "azure_billing.usage_latest_fetch"
      move_on_creation: true
description: >-
  Newest fetch per usage day and subscription of the Azure billing usage details. Lookup index joined by the dashboard to count only the rows of the newest fetch.
# Same interval as `usage_fetches`, for the same reasons.
frequency: 5m
settings:
  # This is required to prevent the transform from clobbering the Fleet-managed
  # mappings.
  deduce_mappings: false
  unattended: true
sync:
  time:
    # Set by the usage_fetches destination pipeline when a document is written.
    field: "event.ingested"
    delay: 60s
_meta:
  # Bump this version to delete, reinstall, and restart the transform during
  # package installation.
  fleet_transform_version: 0.1.0
  # Installed after the `usage_fetches` transform it reads from.
  order: 1
  run_as_kibana_system: false
