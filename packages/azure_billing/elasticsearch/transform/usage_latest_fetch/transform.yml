source:
  # Output of the `usage_fetches` transform: one document per day, meter,
  # resource, and fetch.
  index:
    - "azure_billing.usage_fetches"
# Third of three chained transforms that deduplicate usage details. For every
# day and scope this records which fetch is the newest one. The dashboard joins
# the `usage` transform output with this index (ES|QL LOOKUP JOIN) and counts
# only the buckets that belong to that fetch, so a bucket that a newer fetch no
# longer contains, or that it carries under a corrected key, is not added to the
# day's cost from an older fetch.
pivot:
  group_by:
    azure.billing.day_scope:
      terms:
        field: azure.billing.day_scope
  aggregations:
    "@timestamp":
      max:
        field: "@timestamp"
    # Fetch key of the newest fetch for the day and scope, written as
    # `latest.azure.billing.fetch_key`.
    latest:
      top_metrics:
        metrics:
          - field: azure.billing.fetch_key
        sort:
          "@timestamp": desc
dest:
  # A lookup-mode index (see manifest.yml), as required by ES|QL LOOKUP JOIN.
  index: "azure_billing.usage_latest_fetch-v1"
  aliases:
    - alias: "azure_billing.usage_latest_fetch"
      move_on_creation: true
description: >-
  Newest fetch per usage day and scope of the Azure billing usage details. Lookup index joined by the dashboard to count only the buckets of the newest fetch.
frequency: 1h
settings:
  # This is required to prevent the transform from clobbering the Fleet-managed
  # mappings.
  deduce_mappings: false
  unattended: true
sync:
  time:
    # Set by the usage_fetches destination pipeline when a document is written.
    field: "event.ingested"
    delay: 60s
_meta:
  # Bump this version to delete, reinstall, and restart the transform during
  # package installation.
  fleet_transform_version: 0.1.0
  # Installed after the `usage_fetches` transform it reads from.
  order: 2
  run_as_kibana_system: false
