---
description: >
  Stamp documents written by the azure_billing usage_fetches transform with the time they were
  indexed. The chained usage transform syncs on this field, as recommended for transforms whose
  source is another transform's destination.
processors:
  - set:
      tag: set_event_ingested
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
