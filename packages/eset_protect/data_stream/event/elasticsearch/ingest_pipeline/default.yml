---
description: Pipeline for processing event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - gsub:
      field: message
      pattern: "^(\\xEF\\xBB\\xBF|\\xFF\\xFE\\x00\\x00|\\x00\\x00\\xFE\\xFF|\\xFF\\xFE|\\xFE\\xFF)"
      replacement: ""
      ignore_failure: true
      tag: bom_removed_e6607478
  - drop:
      tag: drop_heartbeat_events_d0a39112
      if: ctx.message == 'HEARTBEAT' && ctx.tags != null && ctx.tags.contains('drop_heartbeat_message') == true
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - terminate:
      tag: terminate_processing_for_heartbeat_messages_edfb8344
      if: ctx.event?.original == 'HEARTBEAT'
  - json:
      field: event.original
      tag: json_event_original_f22e7698
      target_field: json
      if: "ctx.event?.original.startsWith(\"{\\\"\")"
      on_failure:
        - append:
            tag: append_error_message_d91c6690
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - grok:
      field: event.original
      tag: grok_event_original_3b27766f
      patterns:
      - 'Detection type: %{DATA:json.threat_name} Detection name: %{DATA:json.threat_name} Computer name: %{HOSTNAME:json.hostname} Logged user: %{DATA:user.domain}\\%{DATA:json.user} Time of occurrence: %{ESET_TIMESTAMP:json.occurred_plaintext} Scanner: %{DATA:json.scanner_id} Action performed: %{DATA:json.action_taken}$'
      - '^%{DATA:message}\s+%{HOSTNAME:json.hostname} %{ESET_TIMESTAMP:json.occurred_plaintext} %{DATA:eset_protect.event.threat_type} %{NOTSPACE:threat.indicator.name} %{ESET_THREAT_INDICATOR_TYPE:json.object_type} %{GREEDYDATA:json.object_uri}$'
      pattern_definitions:
        ESET_TIMESTAMP: "%{MONTHNUM}/%{MONTHDAY}/%{YEAR}, %{HOUR}:%{MINUTE}:%{SECOND} (?:AM|PM) UTC\\+%{INT}"
        ESET_THREAT_INDICATOR_TYPE: File
      if: "! ctx.event?.original.startsWith(\"{\\\"\")"
      on_failure:
        - append:
            tag: append_error_message_a32a7c6e
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - append:
      tag: append_tags_deff0e6f
      field: tags
      value: eset_notification
      allow_duplicates: false
      if: "! ctx.event?.original.startsWith(\"{\\\"\") && ctx.json?.hostname != null"
  - set:
      field: event.kind
      tag: set_event_kind_alert_dc3c4dc4
      value: alert
      if: ctx.json?.event_type != "Audit_Event"
  - set:
      field: event.kind
      tag: set_event_kind_event_05927cc0
      value: event
      if: ctx.json?.event_type == "Audit_Event"
  - append:
      field: event.category
      tag: append_intrusion_detection_into_event_category_2c0889a6
      value: intrusion_detection
      if: ctx.json?.event_type != null && ['HipsAggregated_Event','FirewallAggregated_Event'].contains(ctx.json.event_type)
  - append:
      field: event.category
      tag: append_threat_into_event_category_5960a6aa
      value: threat
      if: ctx.json?.event_type != null && ['Threat_Event'].contains(ctx.json.event_type)
  - append:
      field: event.category
      tag: append_web_into_event_category_def5ae23
      value: web
      if: ctx.json?.event_type != null && ['FilteredWebsites_Event'].contains(ctx.json.event_type)
  - append:
      field: event.category
      tag: append_file_into_event_category_2220b275
      value: file
      if: ctx.json?.event_type != null && ['BlockedFiles_Event'].contains(ctx.json.event_type)
  - append:
      field: event.type
      tag: append_info_into_event_type_53f597f5
      value: info
      if: ctx.json?.event_type != null && !['Threat_Event'].contains(ctx.json.event_type)
  - append:
      field: event.type
      tag: append_indicator_into_event_type_8407df59
      value: indicator
      if: ctx.json?.event_type != null && ['Threat_Event'].contains(ctx.json.event_type)
  - rename:
      field: json.group_description
      tag: rename_group_description_85180c17
      target_field: eset_protect.event.group_description
      ignore_missing: true
  - rename:
      field: json.group_name
      tag: rename_group_name_67fb4726
      target_field: eset_protect.event.group_name
      ignore_missing: true
  - set:
      field: group.name
      tag: set_group_name_from_event_group_name_d9180ca4
      copy_from: eset_protect.event.group_name
      ignore_empty_value: true
  - rename:
      field: json.hostname
      tag: rename_hostname_98a6690e
      target_field: eset_protect.event.hostname
      ignore_missing: true
  - set:
      field: host.name
      tag: set_host_name_from_event_hostname_97b111e2
      copy_from: eset_protect.event.hostname
      if: ctx.eset_protect?.event?.hostname?.contains('.') == true
  - grok:
      field: eset_protect.event.hostname
      tag: grok_host_hostname_and_domain_from_event_hostname_c39aade4
      patterns:
        - '(%{DATA:host.hostname}\.%{GREEDYDATA:host.domain}|%{GREEDYDATA:host.hostname})'
      if: ctx.eset_protect?.event?.hostname != null
  - set:
      field: host.name
      tag: set_host_name_from_host_hostname_0630e024
      copy_from: host.hostname
      if: ctx.host?.hostname != null && ctx.host.name == null
  - lowercase:
      field: host.name
      tag: lowercase_host_name_676c5247
      ignore_missing: true
  - append:
      field: related.hosts
      tag: append_host_name_into_related_hosts_82ac1e98
      value: "{{{host.name}}}"
      allow_duplicates: false
      if: ctx.host?.name != null
  - append:
      field: related.hosts
      tag: append_hostname_into_related_hosts_6f8fa3bb
      value: "{{{host.hostname}}}"
      allow_duplicates: false
      if: ctx.host?.hostname != null
  - convert:
      field: json.ipv4
      tag: convert_ipv4_to_ip_2d4a529d
      target_field: eset_protect.event.ipv4
      type: ip
      ignore_missing: true
      if: ctx.json?.ipv4 != null && ctx.json.ipv4 != ''
      on_failure:
        - append:
            tag: append_error_message_5293279b
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - append:
      field: host.ip
      tag: append_eset_protect_event_ipv4_into_host_ip_ec2e2f3f
      value: "{{{eset_protect.event.ipv4}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.ipv4 != null
  - append:
      field: related.ip
      tag: append_ipv4_into_related_ip_63a3a72c
      value: "{{{eset_protect.event.ipv4}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.ipv4 != null
  - convert:
      field: json.ipv6
      tag: convert_ipv6_to_ip_da32e3c3
      target_field: eset_protect.event.ipv6
      type: ip
      ignore_missing: true
      if: ctx.json?.ipv6 != null && ctx.json.ipv6 != ''
      on_failure:
        - append:
            tag: append_error_message_41a9c475
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - append:
      field: host.ip
      tag: append_eset_protect_event_ipv6_into_host_ip_40a45acb
      value: "{{{eset_protect.event.ipv6}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.ipv6 != null
  - append:
      field: related.ip
      tag: append_ipv6_into_related_ip_8d10e8ea
      value: "{{{eset_protect.event.ipv6}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.ipv6 != null
  - rename:
      field: json.occured
      tag: rename_occured_to_occurred_42a00da2
      target_field: json.occurred
      ignore_missing: true
      description: Fallback for legacy events with the misspelled "occured" field. Renamed to correct spelling "occurred".
      if: ctx.json?.occurred == null
  - gsub:
      tag: gsub_json_occurred_plaintext_to_json_occurred_28de6d8e
      field: json.occurred_plaintext
      pattern: UTC([+-])([0-9])$
      replacement: UTC$10$2:00
      target_field: json.occurred
      if: ctx.json?.occurred_plaintext != null && ctx.json.occurred_plaintext != ''
  - date:
      field: json.occurred
      tag: date_occurred_50017d8f
      target_field: eset_protect.event.occurred
      formats:
        - dd-MMM-yyyy HH:mm:ss
        - M/d/yy, h:m:s a z
      if: ctx.json?.occurred != null && ctx.json.occurred != ''
      on_failure:
        - append:
            tag: append_error_message_668ce04e
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - set:
      field: "@timestamp"
      tag: set_@timestamp_from_event_occurred_0b4406c7
      copy_from: eset_protect.event.occurred
      ignore_empty_value: true
  - rename:
      field: json.os_name
      tag: rename_os_name_3d4b407e
      target_field: eset_protect.event.os_name
      ignore_missing: true
  - set:
      field: host.os.name
      tag: set_host_os_name_from_event_os_name_d05580f8
      copy_from: eset_protect.event.os_name
      ignore_empty_value: true
  - rename:
      field: json.severity
      tag: rename_severity_9bd79323
      target_field: eset_protect.event.severity
      ignore_missing: true
  - rename:
      field: json.source_uuid
      tag: rename_source_uuid_fee7ca5f
      target_field: eset_protect.event.source_uuid
      ignore_missing: true
  - set:
      field: host.id
      tag: set_host_id_from_event_source_uuid_d6b2083c
      copy_from: eset_protect.event.source_uuid
      ignore_empty_value: true
  - append:
      field: related.hosts
      tag: append_source_uuid_into_related_hosts_91f741ce
      value: "{{{eset_protect.event.source_uuid}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.source_uuid != null
  - rename:
      field: json.event_type
      tag: rename_event_type_729d4216
      target_field: eset_protect.event.type
      ignore_missing: true
  - set:
      field: threat.indicator.provider
      tag: set_threat_indicator_provider_d4275cb5
      value: ESET PROTECT
      if: ctx.eset_protect?.event?.type != null && ['Threat_Event','HipsAggregated_Event','FirewallAggregated_Event','FilteredWebsites_Event','BlockedFiles_Event'].contains(ctx.eset_protect.event.type)
  - set:
      field: threat.indicator.type
      tag: set_threat_indicator_type_8c18b88e
      value: file
      if: ctx.eset_protect?.event?.type == 'BlockedFiles_Event' || ctx.json?.object_type?.toLowerCase() == 'file'
  - rename:
      field: json.account
      tag: rename_account_69a7c707
      target_field: eset_protect.event.account
      ignore_missing: true
  - append:
      field: related.user
      tag: append_account_into_related_user_6e79b345
      value: "{{{eset_protect.event.account}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.account != null
  - rename:
      field: json.action
      tag: rename_action_9ca447aa
      target_field: eset_protect.event.action
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_from_event_action_9c12702f
      copy_from: eset_protect.event.action
      ignore_empty_value: true
      if: ctx.eset_protect?.event?.action != ''
  - rename:
      field: json.action_taken
      tag: rename_action_taken_cb635f0c
      target_field: eset_protect.event.action_taken
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_from_event_action_taken_ec5ac301
      copy_from: eset_protect.event.action_taken
      ignore_empty_value: true
      if: ctx.event?.action == null
  - lowercase:
      field: event.action
      tag: lowercase_event_action_945f0fcf
      ignore_missing: true
  - split:
      field: event.action
      tag: split_event_action_ee0a3f8a
      separator: \s+
      ignore_missing: true
      if: ctx.event?.action != ''
      on_failure:
        - append:
            tag: append_error_message_ce1e3af4
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - join:
      field: event.action
      tag: join_event_action_45ca9d3c
      separator: "-"
      if: ctx.event?.action instanceof List
      on_failure:
        - append:
            tag: append_error_message_b7327b72
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - rename:
      field: json.action_error
      tag: rename_action_error_c538b159
      target_field: eset_protect.event.action_error
      ignore_missing: true
  - convert:
      field: json.aggregate_count
      tag: convert_aggregate_count_to_long_9329b27b
      target_field: eset_protect.event.aggregate_count
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_d7386810
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - set:
      field: threat.indicator.sightings
      tag: set_threat_indicator_sightings_from_event_aggregate_count_8a9b5055
      copy_from: eset_protect.event.aggregate_count
      ignore_empty_value: true
  - rename:
      field: json.application
      tag: rename_application_5b7c6dba
      target_field: eset_protect.event.application
      ignore_missing: true
  - rename:
      field: json.cause
      tag: rename_cause_e253258e
      target_field: eset_protect.event.cause
      ignore_missing: true
  - set:
      field: event.reason
      tag: set_event_reason_from_event_cause_ebe3d4c4
      copy_from: eset_protect.event.cause
      ignore_empty_value: true
  - rename:
      field: json.circumstances
      tag: rename_circumstances_249f70a9
      target_field: eset_protect.event.circumstances
      ignore_missing: true
  - set:
      field: event.reason
      tag: set_event_reason_from_event_circumstances_fd68b3cf
      copy_from: eset_protect.event.circumstances
      ignore_empty_value: true
  - convert:
      field: json.computer_severity_score
      tag: convert_computer_severity_score_to_long_5a263a21
      target_field: eset_protect.event.computer_severity_score
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_0dafe7d1
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - convert:
      field: json.count
      tag: convert_count_to_long_649c8321
      target_field: eset_protect.event.count
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_aa16f3d0
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - rename:
      field: json.description
      tag: rename_description_f327b5a5
      target_field: eset_protect.event.description
      ignore_missing: true
  - rename:
      field: json.detail
      tag: rename_detail_3500f2a6
      target_field: eset_protect.event.detail
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_event_detail_f92122f0
      copy_from: eset_protect.event.detail
      ignore_empty_value: true
  - rename:
      field: json.domain
      tag: rename_domain_14d32228
      target_field: eset_protect.event.domain
      ignore_missing: true
  - rename:
      field: json.eialarmid
      tag: rename_eialarmid_a9aaaf6b
      target_field: eset_protect.event.eialarmid
      ignore_missing: true
  - rename:
      field: json.eiconsolelink
      tag: rename_eiconsolelink_9e6a7139
      target_field: eset_protect.event.eiconsolelink
      ignore_missing: true
  - set:
      field: event.reference
      tag: set_event_reference_from_event_eiconsolelink_de737f2b
      copy_from: eset_protect.event.eiconsolelink
      ignore_empty_value: true
  - rename:
      field: json.engine_version
      tag: rename_engine_version_7683122b
      target_field: eset_protect.event.engine_version
      ignore_missing: true
  - rename:
      field: json.event
      tag: rename_event_ee0e75bd
      target_field: eset_protect.event.name
      ignore_missing: true
  - rename:
      field: json.trigger_event
      tag: rename_trigger_event_a779e95a
      target_field: eset_protect.event.trigger_event
      ignore_missing: true
  - rename:
      field: json.detection_uuid
      tag: rename_detection_uuid_b58e42a4
      target_field: eset_protect.event.detection_uuid
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_event_name_a5a571dc
      copy_from: eset_protect.event.name
      ignore_empty_value: true
  - date:
      field: json.firstseen
      tag: date_firstseen_33fc10ac
      target_field: eset_protect.event.firstseen
      formats:
        - yyyyMMdd'T'HHmmss
        - dd-MMM-yyyy HH:mm:ss
      if: ctx.json?.firstseen != null && ctx.json.firstseen != ''
      on_failure:
        - append:
            tag: append_error_message_3f59662c
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - set:
      field: threat.indicator.first_seen
      tag: set_threat_indicator_first_seen_from_event_firstseen_f0d1dd76
      copy_from: eset_protect.event.firstseen
      ignore_empty_value: true
  - convert:
      field: json.handled
      tag: convert_handled_to_string_91560117
      target_field: eset_protect.event.handled
      type: string
      ignore_missing: true
  - set:
      field: eset_protect.event.is_handled
      tag: set_is_handled_to_true_d4e315a5
      value: true
      if: ctx.eset_protect?.event?.handled != "1"
  - set:
      field: eset_protect.event.is_handled
      tag: set_is_handled_to_false_10c2d540
      value: false
      if: ctx.eset_protect?.event?.handled != "0"
  - rename:
      field: json.hash
      tag: rename_hash_14171d41
      target_field: eset_protect.event.hash
      ignore_missing: true
  - set:
      field: file.hash.sha1
      tag: set_file_hash_sha1_from_eset_protect_event_hash_3cf5d687
      copy_from: eset_protect.event.hash
      ignore_empty_value: true
      if: ctx.eset_protect?.event?.type == 'BlockedFiles_Event' || 'file'.equalsIgnoreCase(ctx.json?.object_type)
  - lowercase:
      field: file.hash.sha1
      tag: lowercase_file_hash_sha1_60cf757f
      ignore_missing: true
  - set:
      field: threat.indicator.file.hash.sha1
      tag: set_threat_indicator_file_hash_sha1_1bee1243
      copy_from: file.hash.sha1
      ignore_empty_value: true
      if: ctx.eset_protect?.event?.type == 'BlockedFiles_Event' || 'file'.equalsIgnoreCase(ctx.json?.object_type)
  - append:
      field: related.hash
      tag: append_eset_protect_event_hash_into_related_hash_1b7963d7
      value: "{{{eset_protect.event.hash}}}"
      allow_duplicates: false
      if: ctx.eset_protect?.event?.hash != null
  - lowercase:
      field: related.hash
      tag: lowercase_file_hash_sha1_d0aa97ba
      ignore_missing: true
  - convert:
      field: json.inbound
      tag: convert_inbound_to_boolean_a4ee0681
      target_field: eset_protect.event.inbound
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_1f10d3b2
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - set:
      field: network.direction
      tag: set_network_direction_to_inbound_26876c57
      value: inbound
      if: ctx.eset_protect?.event?.inbound == true
  - convert:
      field: json.need_restart
      tag: convert_need_restart_to_boolean_05a30388
      target_field: eset_protect.event.need_restart
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_4794abd3
            field: error.message
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}"
  - rename:
      field: json.object_type
      tag: rename_object_type_f7740f94
      target_field: eset_protect.event.object_type
      ignore_missing: true
  - set:
      field: file.type
      value: file
      tag: set_file_type_file_164a9574
      if: ctx.eset_protect?.event?.object_type?.toLowerCase() == 'file'
  - rename:
      field: json.object_uri
      tag: rename_object_uri_2ab7f97a
      target_field: eset_protect.event.object_uri
      ignore_missing: true
  - script:
      tag: script_parse_mailto_uri_0d6f6176
      lang: painless
      description: Parse mailto URI fields into ECS email fields.
      if: "ctx.eset_protect?.event?.object_uri != null && ctx.eset_protect.event.object_uri instanceof String && ctx.eset_protect.event.object_uri.toLowerCase().startsWith('mailto:')"
      source: |-
        String uri = ctx.eset_protect.event.object_uri;

        // Match query parameters from the mailto: URI
        // Assumption: the from= value contains plain-text addresses in angle brackets.
        // If ESET starts URL-encoding these addresses in the future, decode before applying this matcher.
        java.util.regex.Matcher fromMatch = /(?:\?|&)from=([^&]+)/.matcher(uri);
        java.util.regex.Matcher subjectMatch = /(?:\?|&)subject=([^&]+)/.matcher(uri);
        java.util.regex.Matcher attachmentMatch = /(?:\?|&)attachment=([^&]+)/.matcher(uri);

        // Extract RFC 5321 addresses enclosed in angle brackets from the from= value with best effort.
        List fromAddresses = new ArrayList();
        if (fromMatch.find()) {
            java.util.regex.Matcher addressMatch = /<\s*([A-Za-z0-9.!#$%&'*+\/?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})\s*>/.matcher(fromMatch.group(1));
            while (addressMatch.find()) {
                fromAddresses.add(addressMatch.group(1));
            }
        }

        String subject = subjectMatch.find() ? subjectMatch.group(1) : null;
        String attachment = attachmentMatch.find() ? attachmentMatch.group(1) : null;

        // Nothing actionable found – skip field population
        if (fromAddresses.isEmpty() && subject == null && attachment == null) {
            return;
        }

        // Ensure the top-level email map exists before writing into it
        if (!(ctx.email instanceof Map)) {
            ctx.email = new HashMap();
        }

        // Populate ECS email.* fields
        if (!fromAddresses.isEmpty()) {
            Map from = ctx.email['from'] instanceof Map ? (Map) ctx.email['from'] : new HashMap();
            from['address'] = fromAddresses;
            ctx.email['from'] = from;
        }
        if (subject != null) {
            ctx.email['subject'] = subject;
        }
        if (attachment != null) {
            Map attachments = new HashMap();
            Map file = new HashMap();
            file['name'] = attachment;
            attachments['file'] = file;
            List attachmentList = new ArrayList();
            attachmentList.add(attachments);
            ctx.email['attachments'] = attachmentList;
        }
      on_failure:
        - append:
            tag: append_error_message_eed8612c
            field: error.message
            value: "object_uri for mails could not be parsed: {{{eset_protect.event.object_uri}}}"
        - append:
            tag: append_event_kind_e21d150f
            field: event.kind
            value: pipeline_error
            allow_duplicates: false
  - set:
      tag: set_file_path_7a202c69
      field: file.path
      if: "ctx.eset_protect?.event?.object_uri != null && ctx.eset_protect?.event?.object_type?.toLowerCase() == 'file'"
      copy_from: eset_protect.event.object_uri
  - grok:
      field: file.path
      tag: grok_file_path_0431f6e4
      patterns:
        - '^(file:///)?%{FILEPATH:file.path}$'
        - '.*/(?<file.name>.+\.(?<file.extension>.+))$'
      pattern_definitions:
        FILEPATH: '(?<file.drive_letter>\w):(?<file.directory>/.*/|/)?(?<file.name>.+(\.(?<file.extension>.+))?)?'
      if: ctx.file?.path != null && ctx.file?.path != 'script' && !(ctx.file.path instanceof String && ctx.file.path.toLowerCase().startsWith('mailto:'))
