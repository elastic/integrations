---
description: Pipeline for processing alarm events
processors:
  - remove:
      field:
        - organization
        - division
        - team
      tag: remove_agentless_tags
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      description: >-
        Removes the fields added by Agentless as metadata, as they can collide
        with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Stop processing CEL input collection errors while keeping the error document.
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_to_event_original
      ignore_missing: true
      if: ctx.event?.original == null
      description: Renames the original message to event.original to store a copy of the raw event.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The message field is no longer required once event.original is set.
  - json:
      field: event.original
      target_field: socradar_alert
      tag: json_decode_event_original
  - fingerprint:
      fields:
        - socradar_alert.alarm_id
      target_field: _id
      tag: fingerprint_id
      ignore_missing: true
      description: >-
        Derive a stable document id from the alarm id so a re-fetched alarm
        (for example after a mid-pagination failure re-runs earlier pages) is
        rejected as a duplicate by the data stream's create semantics instead
        of being indexed a second time.
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 9.3.0
  - set:
      field: event.kind
      tag: set_event_kind
      value: alert
  - set:
      field: event.id
      copy_from: socradar_alert.alarm_id
      tag: set_event_id
      ignore_empty_value: true
  - set:
      field: message
      copy_from: socradar_alert.alarm_text
      tag: set_message
      ignore_empty_value: true
  - append:
      field: related.hosts
      value: '{{{socradar_alert.alarm_asset}}}'
      tag: append_related_hosts
      allow_duplicates: false
      if: ctx.socradar_alert?.alarm_asset != null
  - script:
      lang: painless
      tag: script_set_event_severity
      description: Maps the SOCRadar alarm risk level to the numeric ECS event.severity used by the detection rule's risk score mapping.
      if: ctx.socradar_alert?.alarm_risk_level != null
      source: >-
        def m = ['CRITICAL': 99L, 'HIGH': 73L, 'MEDIUM': 47L, 'LOW': 21L];
        def v = m.get(ctx.socradar_alert.alarm_risk_level);
        if (v != null) { ctx.event = ctx.event == null ? [:] : ctx.event; ctx.event.severity = v; }
  - date:
      field: socradar_alert.date
      target_field: '@timestamp'
      tag: date_alarm_date
      formats:
        - "yyyy-MM-dd HH:mm:ss"
      timezone: UTC
      ignore_failure: false
  - rename:
      field: socradar_alert.alarm_type_details.alarm_sub_type
      target_field: socradar_alert.alarm_sub_type
      tag: rename_alarm_sub_type
      ignore_missing: true
  - rename:
      field: socradar_alert.alarm_type_details.alarm_main_type
      target_field: socradar_alert.alarm_main_type
      tag: rename_alarm_main_type
      ignore_missing: true
  - rename:
      field: socradar_alert.alarm_type_details.alarm_generic_title
      target_field: socradar_alert.alarm_generic_title
      tag: rename_alarm_generic_title
      ignore_missing: true
  - rename:
      field: socradar_alert.alarm_type_details.alarm_default_risk_level
      target_field: socradar_alert.alarm_default_risk_level
      tag: rename_alarm_default_risk_level
      ignore_missing: true
  - remove:
      field: socradar_alert.alarm_type_details
      tag: remove_alarm_type_details
      ignore_missing: true
on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: on_failure_set_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_tag
      value: preserve_original_event
      allow_duplicates: false
