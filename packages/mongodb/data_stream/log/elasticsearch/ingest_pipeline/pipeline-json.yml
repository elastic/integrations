---
description: Pipeline for parsing MongoDB logs in JSON format
processors:
- json:
    tag: json_message_f7a49167
    field: message
    target_field: mongodb.log
- date:
    tag: date_mongodb_log_t_date_54a9adf4
    field: mongodb.log.t.$date
    target_field: '@timestamp'
    formats:
    - yyyy-MM-dd'T'HH:mm:ss.SSSZZZZZ
- rename:
    tag: rename_mongodb_log_s_bee55635
    field: mongodb.log.s
    target_field: log.level
- rename:
    tag: rename_mongodb_log_c_36c9bb91
    field: mongodb.log.c
    target_field: mongodb.log.component
- rename:
    tag: rename_mongodb_log_ctx_ecb6fb95
    field: mongodb.log.ctx
    target_field: mongodb.log.context
- rename:
    tag: rename_message_56868033
    field: message
    target_field: event.original
    ignore_missing: true
    if: 'ctx.event?.original == null'
- rename:
    tag: rename_mongodb_log_msg_9cb3a9ab
    field: mongodb.log.msg
    target_field: message
- append:
    tag: append_event_type_415628b7
    field: event.type
    value: access
    if: ctx.mongodb.log.component == 'ACCESS'
- append:
    tag: append_event_type_a2d740b2
    field: event.type
    value: change
    if: ctx.mongodb.log.component == 'WRITE'
- append:
    tag: append_event_type_34ec6ad5
    field: event.type
    value: info
    if: ctx.mongodb.log.component != 'WRITE' && ctx.mongodb.log.component != 'ACCESS'
- append:
    tag: append_event_type_c6a6942f
    field: event.type
    value: error
    if: ctx.log.level == 'F' || ctx.log.level == 'E'
- remove:
    tag: remove_mongodb_log_t_f3ac38e1
    field:
      - mongodb.log.t
      - mongodb.log.tags
      - mongodb.log.truncated
      - mongodb.log.size
    ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_5a7ac4ce
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_14b57fe7
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
