---
description: Pipeline for parsing MongoDB logs in plaintext
processors:
- grok:
    tag: grok_message_dab9576b
    field: message
    patterns:
    - '%{TIMESTAMP_ISO8601:mongodb.log.timestamp}%{SPACE}%{MONGO3_SEVERITY:log.level}%{SPACE}%{MONGO3_COMPONENT:mongodb.log.component}%{SPACE}(?:\[%{DATA:mongodb.log.context}\])?%{SPACE}%{GREEDYDATA:message}'
    ignore_missing: true
- date:
    tag: date_mongodb_log_timestamp_3ab3e6e4
    field: mongodb.log.timestamp
    target_field: '@timestamp'
    formats:
    - yyyy-MM-dd'T'HH:mm:ss.SSSZZ
- remove:
    tag: remove_mongodb_log_timestamp_e9915fb9
    field: mongodb.log.timestamp
- append:
    tag: append_event_type_fc06a337
    field: event.type
    value: access
    if: "ctx?.mongodb?.log?.component == 'ACCESS'"
- append:
    tag: append_event_type_06181bbe
    field: event.type
    value: change
    if: "ctx?.mongodb?.log?.component == 'WRITE'"
- append:
    tag: append_event_type_199843ac
    field: event.type
    value: info
    if: "ctx?.mongodb?.log?.component != 'WRITE' && ctx?.mongodb?.log?.component != 'ACCESS'"
- append:
    tag: append_event_type_16db4aab
    field: event.type
    value: error
    if: "ctx?.log?.level == 'F' || ctx?.log?.level == 'E'"
on_failure:
  - set:
      tag: set_event_kind_8057ae17
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_61a70a3e
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
