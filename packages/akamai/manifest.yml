name: akamai
title: Akamai
version: "4.1.4"
description: Collect logs from Akamai with Elastic Agent.
type: integration
format_version: "3.6.0"
categories: [security, cdn_security, opentelemetry]
conditions:
  kibana:
    version: "^9.5.0"
icons:
  - src: /img/akamai_logo.svg
    title: Akamai
    size: 409×167
    type: image/svg+xml
policy_templates:
  - name: akamai
    title: Akamai logs
    description: Collect SIEM logs from Akamai
    inputs:
      - type: otelcol
        migrate_from: cel
        title: "Collect Akamai SIEM logs via API"
        description: "Collecting SIEM logs from Akamai via API"
      - type: gcs
        title: "Collect Akamai SIEM logs via Google Cloud Storage"
        description: "Collecting SIEM logs from Akamai via Google Cloud Storage"
      - type: aws-s3
        title: "Collect Akamai SIEM logs via AWS S3 or SQS"
        description: "Collect Akamai SIEM JSON events from S3 objects, with optional SQS notifications"
owner:
  github: elastic/security-service-integrations
  type: elastic
