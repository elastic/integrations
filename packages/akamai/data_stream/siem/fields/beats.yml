- name: input.type
  type: keyword
  description: Type of Filebeat input.
- name: log.flags
  type: keyword
  description: Flags for the log file.
- name: log.offset
  type: long
  description: Offset of the entry in the log file.
- name: gcs.storage
  type: group
  fields:
    - name: bucket.name
      type: keyword
      description: The name of the Google Cloud Storage Bucket.
    - name: object.name
      type: keyword
      description: The content type of the Google Cloud Storage object.
    - name: object.content_type
      type: keyword
      description: The content type of the Google Cloud Storage object.
- name: aws.s3
  type: group
  fields:
    - name: bucket
      type: group
      fields:
        - name: name
          type: keyword
          description: The AWS S3 bucket name.
        - name: arn
          type: keyword
          description: The AWS S3 bucket ARN.
    - name: object
      type: group
      fields:
        - name: key
          type: keyword
          description: The AWS S3 object key.
