---
description: Pipeline for parsing Akamai logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - drop:
      tag: drop_8524ccf2
      if: ctx.json.offset != null
  - set:
      tag: set_observer_vendor_90a02218
      field: observer.vendor
      value: akamai
  - set:
      tag: set_observer_type_5da7be42
      field: observer.type
      value: proxy
  - date:
      tag: date_json_httpMessage_start_to_timestamp_67157db0
      field: json.httpMessage.start
      formats:
        - UNIX
      timezone: UTC
      target_field: "@timestamp"
      # 500s do not include a timestamp.
      if: ctx.json.httpMessage?.start != null
  - set:
      tag: set_event_start_c5e4284b
      field: "event.start"
      copy_from: "@timestamp"
      ignore_empty_value: true
  - rename:
      tag: rename_json_httpMessage_status_to_http_response_status_code_4b68002c
      field: json.httpMessage.status
      target_field: http.response.status_code
      ignore_missing: true
  - convert:
      tag: convert_http_response_status_code_3f4ab290
      field: http.response.status_code
      type: long
      ignore_missing: true
  - rename:
      tag: rename_json_httpMessage_bytes_to_http_response_bytes_d2395452
      field: json.httpMessage.bytes
      target_field: http.response.bytes
      ignore_missing: true
  - convert:
      tag: convert_http_response_bytes_4e4d07d3
      field: http.response.bytes
      type: long
      ignore_missing: true
  - rename:
      tag: rename_json_httpMessage_requestId_to_http_request_id_6a1031f3
      field: json.httpMessage.requestId
      target_field: http.request.id
      ignore_missing: true
  - set:
      tag: set_event_id_958971ee
      field: event.id
      copy_from: http.request.id
      ignore_empty_value: true
  - fingerprint:
      tag: fingerprint_to_id_1181e134
      description: >
        Fingerprint the event.original value in attempt to prevent the same
        event from being indexed more than once under connection failures or
        other agent related issues.
      if: ctx.event?.original != null
      fields:
        - event.original
      target_field: _id
  - set:
      tag: set__id_389e5547
      description: >
        Prefix the _id with the start time because identifiers that generally
        increase over time based on sorting order generally result in better
        indexing performance than completely random identifiers.
      if: ctx.json?.httpMessage?.start != null && ctx._id != null
      field: _id
      value: '{{{json.httpMessage.start}}}-{{{_id}}}'
  - rename:
      tag: rename_json_httpMessage_method_to_http_request_method_00fa6162
      field: json.httpMessage.method
      target_field: http.request.method
      ignore_missing: true
  - rename:
      tag: rename_json_httpMessage_host_to_url_domain_8d4704d2
      field: json.httpMessage.host
      target_field: url.domain
      ignore_missing: true
  - urldecode:
      tag: urldecode_httpMessage_path_d3949612
      field: json.httpMessage.path
      target_field: url.path
      ignore_missing: true
      on_failure:
        # We see some illegal character, if we can't decode, at least give the data that exists.
        - set:
            tag: set_url_path_7c6eefc6
            field: url.path
            copy_from: json.httpMessage.path
  - urldecode:
      tag: urldecode_httpMessage_query_1244a7c8
      field: json.httpMessage.query
      target_field: url.query
      ignore_missing: true
      on_failure:
        # Assume a failure is due to the query already being decoded.
        - rename:
            tag: rename_json_httpMessage_query_to_url_query_8a8b037b
            field: json.httpMessage.query
            target_field: url.query
            ignore_failure: true
  - rename:
      tag: rename_json_httpMessage_port_to_url_port_ce428d10
      field: json.httpMessage.port
      target_field: url.port
      ignore_missing: true
  - convert:
      tag: convert_url_port_537f953d
      field: url.port
      type: long
      ignore_missing: true
  - urldecode:
      tag: urldecode_httpMessage_responseHeaders_a8b59110
      field: json.httpMessage.responseHeaders
      ignore_missing: true
  - remove:
      tag: remove_http_message_response_headers_non_kv_a9f7dec0
      field: json.httpMessage.responseHeaders
      if: ctx.json?.httpMessage?.responseHeaders instanceof String && ctx.json.httpMessage.responseHeaders.contains(":") == false
  - gsub:
      tag: gsub_http_message_response_headers_obs_fold_c41ff9eb
      description: >
        Replace RFC 7230 obs-fold (CRLF + space/tab) with a single SP so each line is a valid
        Name: value for KV. The json subtree is removed later in the pipeline.
      field: json.httpMessage.responseHeaders
      pattern: '\r\n[\t ]+'
      replacement: ' '
      ignore_missing: true
  - kv:
      tag: kv_httpMessage_responseHeaders_872f21e2
      field: json.httpMessage.responseHeaders
      target_field: akamai.siem.response.headers
      field_split: '\r\n'
      value_split: ':\s*'
      ignore_missing: true
      if: ctx.json?.httpMessage?.responseHeaders != null && ctx.json.httpMessage.responseHeaders != ""
      trim_key: ' '
      trim_value: ' '
  - urldecode:
      tag: urldecode_httpMessage_requestHeaders_cb8737cc
      field: json.httpMessage.requestHeaders
      ignore_missing: true
  - remove:
      tag: remove_http_message_request_headers_non_kv_afefd93b
      field: json.httpMessage.requestHeaders
      if: ctx.json?.httpMessage?.requestHeaders instanceof String && ctx.json.httpMessage.requestHeaders.contains(":") == false
  - gsub:
      tag: gsub_http_message_request_headers_obs_fold_c3292372
      description: >
        Obs-fold to SP before KV (see gsub_http_message_response_headers_obs_fold).
      field: json.httpMessage.requestHeaders
      pattern: '\r\n[\t ]+'
      replacement: ' '
      ignore_missing: true
  - kv:
      tag: kv_httpMessage_requestHeaders_29b0d51e
      field: json.httpMessage.requestHeaders
      target_field: akamai.siem.request.headers
      field_split: '\r\n'
      value_split: ':\s*'
      ignore_missing: true
      if: ctx.json?.httpMessage?.requestHeaders != null && ctx.json.httpMessage.requestHeaders != ""
      trim_key: ' '
      trim_value: ' '
  - script:
      tag: script_builds_url_full_field_out_65de2be3
      lang: painless
      description: This script builds the `url.full` field out of the available `url.*` parts.
      source: |
        String full = '';
        if (ctx.url?.scheme != null && ctx.url.scheme != "") {
          full += ctx.url.scheme+"://";
        }
        if (ctx.url?.domain != null && ctx.url.domain != "") {
          full += ctx.url.domain;
        }
        if (ctx.json.httpMessage?.path != null && ctx.json.httpMessage.path != "") {
          full += ctx.json.httpMessage.path;
        }
        if (ctx.json.httpMessage?.query != null && ctx.json.httpMessage.query != "") {
          full += "?"+ctx.json.httpMessage.query;
        }
        if (full != "") {
          if (ctx.url == null) {
            ctx.url = [:];
          }
          ctx.url.full = full
        }
  - dissect:
      tag: dissect_json_httpMessage_protocol_02def43f
      field: json.httpMessage.protocol
      pattern: "%{network.protocol}/%{http.version}"
      ignore_failure: true
  - lowercase:
      tag: lowercase_network_protocol_49872259
      field: network.protocol
      ignore_missing: true
  - set:
      tag: set_network_transport_42994165
      field: network.transport
      value: tcp
      if: ctx.network?.protocol != null && ctx.network.protocol == 'http'
  - dissect:
      tag: dissect_json_httpMessage_tls_2d17fab1
      field: json.httpMessage.tls
      pattern: "%{tls.version_protocol}v%{tls.version}"
      ignore_failure: true
      ignore_missing: true
  - lowercase:
      tag: lowercase_tls_version_protocol_b840a1f9
      field: tls.version_protocol
      ignore_missing: true
  - rename:
      tag: rename_json_attackData_clientIP_to_source_address_e0c859c1
      field: json.attackData.clientIP
      target_field: source.address
      ignore_missing: true
  - convert:
      tag: convert_source_address_to_source_ip_f5632a20
      field: source.address
      target_field: source.ip
      type: ip
      ignore_missing: true
      ignore_failure: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - set:
      tag: set_source_geo_region_iso_code_3a81fa3d
      field: source.geo.region_iso_code
      description: >-
        Must run before the `json.geo.country` rename below: that rename removes the
        field whenever GeoIP did not resolve the address, which would leave this
        template rendering a malformed code such as `-NY`. Both parts are required
        because a value of `-` is not empty, so `ignore_empty_value` does not catch it.
      value: '{{{json.geo.country}}}-{{{json.geo.regionCode}}}'
      ignore_empty_value: true
      if: >-
        ctx.source?.geo?.region_iso_code == null && ctx.json.geo?.country != null &&
        ctx.json.geo.country != '' && ctx.json.geo?.regionCode != null &&
        ctx.json.geo.regionCode != ''
  - rename:
      tag: rename_json_geo_country_to_source_geo_country_iso_code_66520e30
      field: json.geo.country
      target_field: source.geo.country_iso_code
      ignore_missing: true
      if: ctx.source?.geo?.country_iso_code == null
  - rename:
      tag: rename_json_geo_city_to_source_geo_city_name_b38d8cc7
      field: json.geo.city
      target_field: source.geo.city_name
      ignore_missing: true
      if: ctx.source?.geo?.city_name == null
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - convert:
      field: json.geo.asn
      target_field: source.as.number
      type: long
      ignore_missing: true
      if: ctx.json.geo?.asn != '' && ctx.source?.as?.number == null
      tag: convert_source_as_number_5cf4b5ba
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  ## Attack Data
  - urldecode:
      tag: urldecode_attackData_ruleActions_33ca8cb4
      field: json.attackData.ruleActions
      target_field: json.attackData.ruleActions
      ignore_missing: true
  - split:
      tag: split_json_attackData_ruleActions_to_json_attackData_ruleActions_583ffb49
      field: json.attackData.ruleActions
      target_field: json.attackData.ruleActions
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - urldecode:
      tag: urldecode_attackData_ruleData_7f6ea1b8
      field: json.attackData.ruleData
      target_field: json.attackData.ruleData
      ignore_missing: true
  - split:
      tag: split_json_attackData_ruleData_to_json_attackData_ruleData_340c053d
      field: json.attackData.ruleData
      target_field: json.attackData.ruleData
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - urldecode:
      tag: urldecode_attackData_ruleMessages_a1483204
      field: json.attackData.ruleMessages
      target_field: json.attackData.ruleMessages
      ignore_missing: true
  - split:
      tag: split_json_attackData_ruleMessages_to_json_attackData_ruleMessages_23761d9d
      field: json.attackData.ruleMessages
      target_field: json.attackData.ruleMessages
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - urldecode:
      tag: urldecode_attackData_ruleSelectors_6dd0f39c
      field: json.attackData.ruleSelectors
      target_field: json.attackData.ruleSelectors
      ignore_missing: true
  - split:
      tag: split_json_attackData_ruleSelectors_to_json_attackData_ruleSelectors_c7cba11d
      field: json.attackData.ruleSelectors
      target_field: json.attackData.ruleSelectors
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - urldecode:
      tag: urldecode_attackData_ruleTags_e083905f
      field: json.attackData.ruleTags
      target_field: json.attackData.ruleTags
      ignore_missing: true
  - split:
      tag: split_json_attackData_ruleTags_to_json_attackData_ruleTags_605a02a7
      field: json.attackData.ruleTags
      target_field: json.attackData.ruleTags
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - urldecode:
      tag: urldecode_attackData_ruleVersions_6819dff1
      field: json.attackData.ruleVersions
      target_field: json.attackData.ruleVersions
      ignore_missing: true
  - split:
      tag: split_json_attackData_ruleVersions_to_json_attackData_ruleVersions_c3dd7757
      field: json.attackData.ruleVersions
      target_field: json.attackData.ruleVersions
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - urldecode:
      tag: urldecode_attackData_rules_c390ada0
      field: json.attackData.rules
      target_field: json.attackData.rules
      ignore_missing: true
  - split:
      tag: split_json_attackData_rules_to_json_attackData_rules_d86b5561
      field: json.attackData.rules
      target_field: json.attackData.rules
      separator: ';'
      preserve_trailing: true
      ignore_missing: true
  - script:
      lang: painless
      description: >-
        Base64 Decode the json.attackData.rule* fields. Akamai only sends the rule*
        arrays that apply to the event, and `akamai.siem` exists at this point only if
        the request or response headers were present, so both the per-key lookup and
        the target parents are created defensively.
      tag: script_base64_decode_attackData_rule_573db939
      params:
        items:
          - rules
          - ruleActions
          - ruleData
          - ruleMessages
          - ruleTags
          - ruleSelectors
          - ruleVersions
      if: ctx.json.attackData?.rules instanceof List
      source: |
        ArrayList rules_array = new ArrayList();
        ArrayList rule_actions = new ArrayList();
        ArrayList rule_tags = new ArrayList();
        for (def i = 0; i < ctx.json.attackData.rules.length; i++) {
          HashMap map = new HashMap();
          for (String key: params.items) {
            def values = ctx.json.attackData[key];
            if (values instanceof List && i < values.length) {
              String data = values[i].replace(" ", "");
              try {
                String value = data.decodeBase64();
                map.put(key, value);
                if (key == "ruleTags") {
                  rule_tags.add(value.toLowerCase());
                } else if (key == "ruleActions") {
                  rule_actions.add(value.toLowerCase());
                }
              }
              catch (Exception e) {
                if (data.length() > 10) {
                  data = data.substring(0,10)+"..."
                }
                String error = e.toString();
                if (error.startsWith("java.lang.IllegalArgumentException: ")) {
                  error = error.substring("java.lang.IllegalArgumentException: ".length());
                }
                String warning = "failed to decode base64 data: " + error + ": " + data;
                map.put(key, warning);
              }
            }
          }
          rules_array.add(map);
        }
        if (ctx.akamai == null) {
          ctx.akamai = new HashMap();
        }
        if (ctx.akamai.siem == null) {
          ctx.akamai.siem = new HashMap();
        }
        ctx.akamai.siem.rules = rules_array;
        ctx._rule_actions = rule_actions;
        ctx._rule_tags = rule_tags;
  - foreach:
      tag: foreach__rule_actions_8dcb88da
      field: _rule_actions
      ignore_missing: true
      processor:
        append:
          tag: append_akamai_siem_rule_actions_d6da61b8
          field: akamai.siem.rule_actions
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - remove:
      tag: remove__rule_actions_37643fd0
      field: _rule_actions
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach__rule_tags_a1fe9442
      field: _rule_tags
      ignore_missing: true
      processor:
        append:
          tag: append_akamai_siem_rule_tags_8ae71508
          field: akamai.siem.rule_tags
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - remove:
      tag: remove__rule_tags_6a724da0
      field: _rule_tags
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_attackData_configId_to_akamai_siem_config_id_d8612bfd
      field: json.attackData.configId
      target_field: akamai.siem.config_id
      ignore_missing: true
  - rename:
      tag: rename_json_attackData_policyId_to_akamai_siem_policy_id_e5d50d55
      field: json.attackData.policyId
      target_field: akamai.siem.policy_id
      ignore_missing: true
  - rename:
      tag: rename_json_attackData_slowPostAction_to_akamai_siem_slow_post_action_da1156fa
      field: json.attackData.slowPostAction
      target_field: akamai.siem.slow_post_action
      ignore_missing: true
  - convert:
      field: json.attackData.slowPostRate
      target_field: akamai.siem.slow_post_rate
      type: long
      ignore_missing: true
      if: ctx.json.attackData?.slowPostRate != ''
      tag: convert_slow_post_rate_2c400691
  - rename:
      tag: rename_json_attackData_clientReputation_to_akamai_siem_client_reputation_252c450d
      field: json.attackData.clientReputation
      target_field: akamai.siem.client_reputation
      ignore_missing: true
  ## Bot Data
  - convert:
      field: json.botData.botScore
      target_field: akamai.siem.bot.score
      type: long
      ignore_missing: true
      if: ctx.json.botData?.botScore != ''
      tag: convert_bot_score_3d7253de
  - convert:
      field: json.botData.responseSegment
      target_field: akamai.siem.bot.response_segment
      type: long
      ignore_missing: true
      if: ctx.json.botData?.responseSegment != ''
      tag: convert_bot_response_segment_9e994ad5
  ## Client Data
  - rename:
      tag: rename_json_clientData_appBundleId_to_akamai_siem_client_data_app_bundle_id_df9d956d
      field: json.clientData.appBundleId
      target_field: akamai.siem.client_data.app_bundle_id
      ignore_missing: true
  - rename:
      tag: rename_json_clientData_appVersion_to_akamai_siem_client_data_app_version_1fc76556
      field: json.clientData.appVersion
      target_field: akamai.siem.client_data.app_version
      ignore_missing: true
  - convert:
      field: json.clientData.telemetryType
      target_field: akamai.siem.client_data.telemetry_type
      type: long
      ignore_missing: true
      if: ctx.json.clientData?.telemetryType != ''
      tag: convert_telemetry_type_0802ba2f
  - rename:
      tag: rename_json_clientData_sdkVersion_to_akamai_siem_client_data_sdk_version_0ff91826
      field: json.clientData.sdkVersion
      target_field: akamai.siem.client_data.sdk_version
      ignore_missing: true
  ## Identity
  - rename:
      field: json.identity.ja4
      tag: rename_identity_ja4_to_identity_ja4_c4ad79bf
      target_field: akamai.siem.identity.ja4
      ignore_missing: true
  - rename:
      field: json.identity.tlsFingerprintV2
      tag: rename_identity_tlsFingerprintV2_to_identity_tls_fingerprint_v2_64720152
      target_field: akamai.siem.identity.tls_fingerprint_v2
      ignore_missing: true
  - rename:
      field: json.identity.tlsFingerprintV3
      tag: rename_identity_tlsFingerprintV3_to_identity_tls_fingerprint_v3_7b72c092
      target_field: akamai.siem.identity.tls_fingerprint_v3
      ignore_missing: true
  ## User Risk Data
  - rename:
      tag: rename_json_userRiskData_uuid_to_akamai_siem_user_risk_uuid_44cec5b1
      field: json.userRiskData.uuid
      target_field: akamai.siem.user_risk.uuid
      ignore_missing: true
  - convert:
      field: json.userRiskData.status
      target_field: akamai.siem.user_risk.status
      type: long
      ignore_missing: true
      if: ctx.json.userRiskData?.status != ''
      tag: convert_user_risk_status_99aca16d
  - convert:
      field: json.userRiskData.score
      target_field: akamai.siem.user_risk.score
      type: long
      ignore_missing: true
      if: ctx.json.userRiskData?.score != ''
      tag: convert_user_risk_score_cd266008
  - convert:
      field: json.userRiskData.allow
      target_field: akamai.siem.user_risk.allow
      type: long
      ignore_missing: true
      if: ctx.json.userRiskData?.allow != ''
      tag: convert_user_risk_allow_69fdc970
  - kv:
      if: ctx.json.userRiskData?.risk != ""
      tag: kv_userRiskData_risk_2d834168
      field: json.userRiskData.risk
      target_field: akamai.siem.user_risk.risk
      field_split: '\|'
      value_split: ':'
      ignore_missing: true
  - kv:
      if: ctx.json.userRiskData?.trust != ""
      tag: kv_userRiskData_trust_839917d8
      field: json.userRiskData.trust
      target_field: akamai.siem.user_risk.trust
      field_split: '\|'
      value_split: ':'
      ignore_missing: true
  - script:
      description: Process key-value pairs, preserving keys without values.
      lang: painless
      tag: script_userRiskData_general_ade061bc
      if: ctx.json.userRiskData?.general instanceof String && ctx.json.userRiskData.general != ""
      source: |
        String text = ctx.json.userRiskData.general.trim();
        if (text != "") {
          def m = new HashMap();
          for (String f: /\|/.split(text)) {
            if (f == "") {
              continue;
            }
            int idx = f.indexOf(':');
            if (idx == -1) {
              m.put(f, "-"); // Include a non-empty string to prevent the field being removed.
              continue;
            }
            String k = f.substring(0, idx);
            String v = f.substring(idx+1);
            m.put(k, v);
          }
          if (m.size() > 0) {
            if (ctx.akamai == null) {
              ctx.akamai = new HashMap();
            }
            if (ctx.akamai.siem == null) {
              ctx.akamai.siem = new HashMap();
            }
            if (ctx.akamai.siem.user_risk == null) {
              ctx.akamai.siem.user_risk = new HashMap();
            }
            ctx.akamai.siem.user_risk.general = m;
          }
        }
  ##
  - append:
      tag: append_related_ip_feeba47d
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - set:
      tag: set_client_10dffeb7
      field: client
      copy_from: source
      description: >-
        Events without an `attackData.clientIP` have no `source` object at all, and
        `copy_from` fails on a missing source path.
      if: ctx.source != null
  - set:
      tag: set_event_category_dbab8a4e
      field: event.category
      value: [network]
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - remove:
      tag: remove_a849b846
      field:
        - json
        - _tmp
      ignore_missing: true
  - script:
      tag: script_processor_iterates_over_whole_document_4d6993cb
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        void handleMap(Map map) {
          for (def x : map.values()) {
            if (x instanceof Map) {
                handleMap(x);
            } else if (x instanceof List) {
                handleList(x);
            }
          }
          map.values().removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        void handleList(List list) {
          for (def x : list) {
              if (x instanceof Map) {
                  handleMap(x);
              } else if (x instanceof List) {
                  handleList(x);
              }
          }
          list.removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        handleMap(ctx);
on_failure:
