# BeyondInsight API - UserAudits Test Mock Configuration
#
# This scenario tests offset-based pagination and session persistence across
# polls, and validates that startdate is updated only after offset-based
# pagination completes. It also verifies correct Cookie header handling
# (attributes stripped, multiple cookies joined into a single header value).
#
# NOTE: According to the API docs, the "records are sorted by CreateDate in
# descending order (latest entries are shown first)."
#
# First periodic execution behavior:
# 1. Authentication: Establishes session via /Auth/SignAppin, receives two Set-Cookie
#    headers with attributes (ASP.NET_SessionId and __RequestVerificationToken)
# 2. First Page (offset=0): Requests 3 records, updates newest_event_time to most
#    recent record (2025-08-22T10:30:00Z); TotalCount=5 > size=3, continues
# 3. Pagination Setup: Sets current_offset=3, in_pagination=true, same time window
# 4. Second Page (offset=3): Returns remaining 2 records; TotalCount=5 equals 3+2 — terminal
# 5. Session cookie is kept in cursor for next poll
#
# Second periodic execution behavior:
# 1. Session is still fresh (< 15m old); reuses cookie from cursor without re-auth
# 2. Single request with offset=0 and startdate = newest_event_time from first
#    execution — retrieves 1 record; terminal

rules:
  # Auth.
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser; pwd=\[password\];']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
            "UserId": 1,
            "SID": null,
            "EmailAddress": "test.user@example.com",
            "UserName": "testuser",
            "Name": "Test User"
          }
          `}}

  # Auth (no password)
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser2;']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
            "UserId": 1,
            "SID": null,
            "EmailAddress": "test.user@example.com",
            "UserName": "testuser",
            "Name": "Test User"
          }
          `}}

  # Start of 2nd periodic execution — specific startdate matches newest_event_time.
  # Must come before the first-execution rule (which matches any startdate).
  - path: "/BeyondTrust/api/public/v3/UserAudits"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    query_params:
      offset: 0
      limit: 3
      startdate: '2025-08-22T10:30:00Z' # Newest time from initial interval.
      enddate: "{enddate:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [
                  {
                      "AuditID": 6,
                      "ActionType": "Login",
                      "Section": "Authentication",
                      "UserID": 111,
                      "UserName": "testuser3@example.com",
                      "IPAddress": "192.0.2.59",
                      "CreateDate": "2025-08-22T11:00:00Z"
                  }
              ],
              "TotalCount": 1
          }
          `}}

  # Second page (offset=3) — first execution continues.
  - path: "/BeyondTrust/api/public/v3/UserAudits"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    query_params:
      offset: 3
      limit: 3
      startdate: "{startdate:.*}"
      enddate: "{enddate:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [
                  {
                      "AuditID": 2,
                      "ActionType": "Logout",
                      "Section": "Authentication",
                      "UserID": 104,
                      "UserName": "testuser2@example.com",
                      "IPAddress": "192.0.2.50",
                      "CreateDate": "2025-08-22T10:15:00Z"
                  },
                  {
                      "AuditID": 1,
                      "ActionType": "AccessDenied",
                      "Section": "Authorization",
                      "UserID": 105,
                      "UserName": "guest.user",
                      "IPAddress": "203.0.113.100",
                      "CreateDate": "2025-08-22T10:10:00Z"
                  }
              ],
              "TotalCount": 5
          }
          `}}

  # First page (offset=0) — first execution; later polls return empty.
  - path: "/BeyondTrust/api/public/v3/UserAudits"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    query_params:
      offset: 0
      limit: 3
      startdate: "{startdate:.*}" # now - initial_interval
      enddate: "{enddate:.*}" # now
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ if eq .req_num 1 }}{{ minify_json `
          {
              "Data": [
                  {
                      "AuditID": 5,
                      "ActionType": "Login",
                      "Section": "Authentication",
                      "UserID": 101,
                      "UserName": "admin@example.com",
                      "IPAddress": "198.51.100.15",
                      "CreateDate": "2025-08-22T10:30:00Z"
                  },
                  {
                      "AuditID": 4,
                      "ActionType": "PasswordAccess",
                      "Section": "ManagedSystems",
                      "UserID": 102,
                      "UserName": "user.smith",
                      "IPAddress": "198.51.100.25",
                      "CreateDate": "2025-08-22T10:25:00Z"
                  },
                  {
                      "AuditID": 3,
                      "ActionType": "SystemConfiguration",
                      "Section": "Settings",
                      "UserID": 103,
                      "UserName": "config.admin",
                      "IPAddress": "203.0.113.10",
                      "CreateDate": "2025-08-22T10:20:00Z"
                  }
              ],
              "TotalCount": 5
          }
          ` }}{{ else }}{"Data":[],"TotalCount":0}{{ end }}
