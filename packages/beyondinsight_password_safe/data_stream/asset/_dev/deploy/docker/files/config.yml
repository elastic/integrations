# BeyondInsight API - Workgroups Assets API Mock Configuration
#
# Test Scenario: Simulates asset retrieval across multiple workgroups with session
# persistence across polls, verifying correct Cookie header handling:
# 1. Authentication: Sets two Set-Cookie headers with attributes
# 2. GET /Workgroups with cookie_value1: returns two workgroups (wg1, wg2)
# 3. GET /Workgroups/1/Assets offset=0 with cookie_value1: returns 1 of 2 assets
# 4. GET /Workgroups/1/Assets offset=1 with cookie_value1: returns second asset;
#    workgroup 2 queued
# 5. GET /Workgroups/2/Assets offset=0 with cookie_value1: returns 0 assets;
#    all workgroups done — session kept in cursor for next poll
#
# Second periodic execution behavior (session still fresh, cookie reused):
# 6. GET /Workgroups with cookie_value1: returns workgroup 3
# 7. GET /Workgroups/3/Assets offset=0 with cookie_value1: returns 1 asset;
#    no more workgroups — session kept in cursor for next poll
#
# The /Workgroups rule uses req_num to return different workgroup lists per execution.

rules:
  # Auth
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser; pwd=\[password\];']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
              "UserId": 1,
              "SID": null,
              "EmailAddress": "test.user@example.com",
              "UserName": "testuser",
              "Name": "Test User"
          }
          `}}

  # Auth (no password)
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser2;']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
              "UserId": 1,
              "SID": null,
              "EmailAddress": "test.user@example.com",
              "UserName": "testuser",
              "Name": "Test User"
          }
          `}}

  # Get Workgroups — req_num distinguishes first (wg1+wg2) from second (wg3) execution.
  - path: "/BeyondTrust/api/public/v3/Workgroups"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ if eq .req_num 1 }}{{ minify_json `
          [
              {
                  "ID": 1,
                  "Name": "Default Workgroup",
                  "Description": "Default workgroup for testing"
              },
              {
                  "ID": 2,
                  "Name": "Test Workgroup",
                  "Description": "Secondary workgroup for testing"
              }
          ]
          ` }}{{ else if eq .req_num 2 }}{{ minify_json `
          [
              {
                  "ID": 3,
                  "Name": "Eng Workgroup",
                  "Description": "Default workgroup for engineering"
              }
          ]
          ` }}{{ else }}[]{{ end }}

  # Get Assets for Workgroup 1 - page 1
  - path: "/BeyondTrust/api/public/v3/Workgroups/1/Assets"
    methods: ["GET"]
    query_params:
      limit: '1'
      offset: '0'
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [
                  {
                      "WorkgroupID": 1,
                      "AssetID": 101,
                      "AssetName": "TestServer01",
                      "DnsName": "testserver01.example.com",
                      "DomainName": "example.com",
                      "IPAddress": "192.0.2.10",
                      "MacAddress": "00:1B:44:11:3A:B7",
                      "AssetType": "Server",
                      "OperatingSystem": "Ubuntu 20.04",
                      "CreateDate": "2023-01-15T10:30:00Z",
                      "LastUpdateDate": "2023-06-20T14:45:00Z"
                  }
              ],
              "TotalCount": 2
          }
          `}}

  # Get Assets for Workgroup 1 - page 2
  - path: "/BeyondTrust/api/public/v3/Workgroups/1/Assets"
    methods: ["GET"]
    query_params:
      limit: '1'
      offset: '1'
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [
                  {
                      "WorkgroupID": 1,
                      "AssetID": 102,
                      "AssetName": "TestServer02",
                      "DnsName": "testserver02.example.com",
                      "DomainName": "example.com",
                      "IPAddress": "192.0.2.20",
                      "MacAddress": "00:1B:44:11:3A:B8",
                      "AssetType": "Server",
                      "OperatingSystem": "Windows Server 2019",
                      "CreateDate": "2023-02-10T09:15:00Z",
                      "LastUpdateDate": "2023-06-25T16:20:00Z"
                  }
              ],
              "TotalCount": 2
          }
          `}}
      - status_code: 418
        headers:
          Content-Type: ['text/plain']
        body: Program should never request this. {{.request.vars}}

  # Get Assets for Workgroup 2 - no assets; workgroup 2 done, all workgroups done.
  - path: "/BeyondTrust/api/public/v3/Workgroups/2/Assets"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    query_params:
      limit: '1'
      offset: '0'
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [],
              "TotalCount": 0
          }
          `}}

  # Get Assets for Workgroup 3 (second periodic execution).
  - path: "/BeyondTrust/api/public/v3/Workgroups/3/Assets"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    query_params:
      limit: '1'
      offset: '0'
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [
                  {
                      "WorkgroupID": 3,
                      "AssetID": 301,
                      "AssetName": "TestServer301",
                      "DnsName": "testserver301.example.com",
                      "DomainName": "example.com",
                      "IPAddress": "192.0.3.1",
                      "MacAddress": "00:03:01:11:3A:B8",
                      "AssetType": "Server",
                      "OperatingSystem": "Windows Server 2019",
                      "CreateDate": "2025-02-10T09:15:00Z",
                      "LastUpdateDate": "2025-08-25T16:20:00Z"
                  }
              ],
              "TotalCount": 1
          }
          `}}
