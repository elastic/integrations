# BeyondInsight Password Safe - Managed Accounts Test Mock Configuration
#
# Test Scenario: Simulates paginated retrieval of managed accounts with session
# persistence across polls, verifying correct Cookie header handling:
# 1. Authentication via SignAppin endpoint (returns 200, sets two cookies
#    with attributes — ASP.NET_SessionId and __RequestVerificationToken)
# 2. First ManagedAccounts request with limit=1&offset=0 (returns 200, first account)
# 3. Second ManagedAccounts request with limit=1&offset=1 (returns 200, second account)
# 4. Final ManagedAccounts request with limit=1&offset=2 (returns 200, empty array —
#    no more data; session cookie is kept in cursor for next poll)
#
# Cookie header format assertion: each Cookie rule asserts the joined single-header form.
# The buggy code replayed raw Set-Cookie values (with attributes) as multiple Cookie
# header lines, causing 401s on real BeyondInsight servers.

rules:
  # Auth
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser; pwd=\[password\];']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
            "UserId": 1,
            "SID": null,
            "EmailAddress": "test.user@example.com",
            "UserName": "testuser",
            "Name": "Test User"
          }
          `}}

  # Auth (no password)
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser2;']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
            "UserId": 1,
            "SID": null,
            "EmailAddress": "test.user@example.com",
            "UserName": "testuser",
            "Name": "Test User"
          }
          `}}

  - path: "/BeyondTrust/api/public/v3/ManagedAccounts"
    methods: ["GET"]
    query_params:
      offset: '0'
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          [
              {
                  "PlatformID": 4,
                  "SystemId": 5,
                  "SystemName": "KittenGrowth",
                  "InstanceName": "Primary",
                  "DomainName": "example.com",
                  "AccountId": 5,
                  "AccountName": "MacdonaldP.Irene",
                  "UserPrincipalName": "irene@example.com",
                  "ApplicationID": 123,
                  "ApplicationDisplayName": "AccountingApp",
                  "MaximumReleaseDuration": 525600,
                  "DefaultReleaseDuration": 120,
                  "LastChangeDate": "2024-12-10T08:57:45.9",
                  "NextChangeDate": "2024-12-12T00:00:00.0",
                  "ChangeState": 2,
                  "IsChanging": false,
                  "IsISAAccess": true,
                  "PreferredNodeID": "2ca45774-d4e0-4b8f-9b52-3f52b78ae2ca",
                  "AccountDescription": "Primary managed account for KittenGrowth system"
              }
          ]
          `}}

  - path: "/BeyondTrust/api/public/v3/ManagedAccounts"
    methods: ["GET"]
    query_params:
      offset: '1'
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          [
              {
                  "PlatformID": 5,
                  "SystemId": 6,
                  "SystemName": "SecondSystem",
                  "InstanceName": "Primary",
                  "DomainName": "example.com",
                  "AccountId": 6,
                  "AccountName": "MacdonaldP.Irene",
                  "UserPrincipalName": "irene@example.com",
                  "ApplicationID": 123,
                  "ApplicationDisplayName": "AccountingApp",
                  "MaximumReleaseDuration": 525600,
                  "DefaultReleaseDuration": 120,
                  "LastChangeDate": "2024-12-10T08:57:45.9",
                  "NextChangeDate": "2024-12-12T00:00:00.0",
                  "ChangeState": 2,
                  "IsChanging": false,
                  "IsISAAccess": true,
                  "PreferredNodeID": "2ca45774-d4e0-4b8f-9b52-3f52b78ae2ca",
                  "AccountDescription": "Secondary managed account for SecondSystem"
              }
          ]
          `}}

  # Empty page — no more data; session cookie is kept in cursor for next poll.
  - path: "/BeyondTrust/api/public/v3/ManagedAccounts"
    methods: ["GET"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: '[]'
