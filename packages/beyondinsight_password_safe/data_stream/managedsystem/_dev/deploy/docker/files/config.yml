# BeyondInsight Password Safe - Managed Systems Test Mock Configuration
#
# Test Scenario: Simulates paginated retrieval of managed systems with session
# persistence across polls, verifying correct Cookie header handling:
# 1. Authentication via SignAppin endpoint (returns 200, sets two cookies
#    with attributes — ASP.NET_SessionId and __RequestVerificationToken)
# 2. First ManagedSystems request with limit=1&offset=0 (returns 200, first system)
# 3. Second ManagedSystems request with limit=1&offset=1 (returns 200, second system)
# 4. Final ManagedSystems request with limit=1&offset=2 (returns 200, empty Data array —
#    no more data; session cookie is kept in cursor for next poll)
#
# Cookie header format assertion: each Cookie rule asserts the joined single-header form.
# The buggy code replayed raw Set-Cookie values (with attributes) as multiple Cookie
# header lines, causing 401s on real BeyondInsight servers.

rules:
  # Auth
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser; pwd=\[password\];']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
            "UserId": 1,
            "SID": null,
            "EmailAddress": "test.user@example.com",
            "UserName": "testuser",
            "Name": "Test User"
          }
          `}}

  # Auth (no password)
  - path: "/BeyondTrust/api/public/v3/Auth/SignAppin"
    methods: ["POST"]
    request_headers:
      Authorization: ['PS-Auth key=test_api_key; runas=testuser2;']
      Content-Type: ['application/json']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
          Set-Cookie:
            - 'ASP.NET_SessionId=cookie_value1; path=/; secure; HttpOnly; SameSite=None'
            - '__RequestVerificationToken=rvt_token; path=/; secure; HttpOnly'
        body: |
          {{ minify_json `
          {
            "UserId": 1,
            "SID": null,
            "EmailAddress": "test.user@example.com",
            "UserName": "testuser",
            "Name": "Test User"
          }
          `}}

  - path: "/BeyondTrust/api/public/v3/ManagedSystems"
    methods: ["GET"]
    query_params:
      offset: '0'
    request_headers:
      Authorization: ['PS-Auth key=test_api_key;.*']
      Content-Type: ['application/json']
      Cookie: ['ASP.NET_SessionId=cookie_value1; __RequestVerificationToken=rvt_token']
    responses:
      - status_code: 200
        headers:
          Content-Type: ['application/json']
        body: |-
          {{ minify_json `
          {
              "Data": [
                  {
                      "ManagedSystemID": 13,
                      "EntityTypeID": 1,
                      "AssetID": 13,
                      "DatabaseID": 5,
                      "DirectoryID": 3,
                      "CloudID": 1,
                      "WorkgroupID": 1,
                      "HostName": "AardvarkAgreement",
                      "DNSName": "AardvarkAgreement.example.com",
                      "IPAddress": "198.51.100.10",
