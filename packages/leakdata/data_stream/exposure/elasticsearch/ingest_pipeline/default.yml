---
description: Normalize the allowlisted LeakData ECS alert document.
processors:
  - rename:
      tag: rename_feed_timestamp
      if: ctx.json != null
      field: json.@timestamp
      target_field: '@timestamp'
      override: true
  - rename:
      field: json.ecs
      tag: rename_feed_ecs
      if: ctx.json != null
      target_field: ecs
      override: true
  - rename:
      field: json.event
      tag: rename_feed_event
      if: ctx.json != null
      target_field: event
      override: true
  - rename:
      field: json.message
      tag: rename_feed_message
      if: ctx.json != null
      target_field: message
      override: true
  - rename:
      field: json.observer
      tag: rename_feed_observer
      if: ctx.json != null
      target_field: observer
      override: true
  - rename:
      field: json.rule
      tag: rename_feed_rule
      if: ctx.json != null
      target_field: rule
      override: true
  - append:
      field: tags
      tag: append_feed_tags
      if: ctx.json != null
      copy_from: json.tags
      allow_duplicates: false
  - rename:
      field: json.leakdata
      tag: rename_feed_exposure
      if: ctx.json != null
      target_field: leakdata
      override: true
  - remove:
      field: json
      tag: remove_feed_wrapper
      ignore_missing: true
  - set:
      field: event.module
      tag: set_event_module
      value: leakdata
  - set:
      field: event.dataset
      tag: set_event_dataset
      value: leakdata.exposure
  - set:
      field: event.ingested
      tag: set_event_ingested
      value: '{{{_ingest.timestamp}}}'
  - set:
      field: event.kind
      tag: classify_feed_error
      if: ctx.error != null
      value: pipeline_error
on_failure:
  - set:
      field: event.kind
      tag: classify_pipeline_error
      value: pipeline_error
  - append:
      field: error.message
      tag: append_pipeline_error
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed: {{{_ingest.on_failure_message}}}'
