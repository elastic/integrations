title: "LeakData verified exposure alerts"
type: logs
streams:
  - input: cel
    title: "LeakData alerts via CEL"
    description: |-
      Polls the dedicated LeakData Elastic Security feed. LeakData emits only
      verified, privacy-minimized alerts for exact email addresses whose
      ownership remains verified at delivery time.
    template_path: cel.yml.hbs
    vars:
      - name: url
        type: url
        title: LeakData URL
        description: Base URL of the LeakData service. Keep the default for production.
        default: "https://leakdata.io"
        required: true
        show_user: true
      - name: token
        type: password
        title: Connector token
        description: One-time token generated in the LeakData dashboard. Store it as a Fleet secret.
        required: true
        show_user: true
        secret: true
      - name: interval
        type: text
        title: Poll interval
        description: How often Elastic Agent polls for newly verified alerts.
        default: 5m
        required: true
        show_user: true
      - name: batch_size
        type: integer
        title: Batch size
        description: Number of alerts requested per page. LeakData allows 1 to 100.
        default: 100
        required: true
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          Writes HTTP requests and responses to local Elastic Agent files for debugging. Traces may contain the Authorization header or response data and compromise security. Keep disabled except during a bounded diagnostic and remove trace files afterwards.
        default: false
        required: false
        show_user: false
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: >-
          Opt in to event.original containing a copy of the already privacy-minimized LeakData feed event. No raw exposure record is sent.
        default: false
        required: false
        show_user: true
      - name: tags
        type: text
        title: Tags
        multi: true
        default:
          - forwarded
          - leakdata
          - verified-exposure
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Optional Elastic Agent processors. They execute after LeakData has applied its verified-email and privacy boundaries.
