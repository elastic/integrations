format_version: "3.5.1"
name: entityanalytics_entra_id
title: "Microsoft Entra ID Entity Analytics"
version: "1.13.0"
description: "Collect identities from Microsoft Entra ID (formerly Azure Active Directory) with Elastic Agent."
type: integration
categories:
  - azure
  - cloud
  - security
  - advanced_analytics_ueba
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: "basic"
  agent:
    version: "^9.5.0"
icons:
  - src: /img/logo-azure.svg
    title: Azure logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: entity
    title: Identities
    description: Collect identities.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: entity-analytics
        title: Collect identities
        description: Collecting identities from Microsoft Entra ID.
owner:
  github: elastic/security-service-integrations
  type: elastic
