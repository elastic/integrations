- name: datadog
  type: group
  fields:
    - name: action
      type: keyword
    - name: action_name
      type: keyword
    - name: api_key
      type: group
      fields:
        - name: id
          type: keyword
    - name: application_key
      type: group
      fields:
        - name: id
          type: keyword
    - name: asset
      type: group
      fields:
        - name: id
          type: keyword
        - name: name
          type: keyword
        - name: type
          type: keyword
        - name: path
          type: keyword
        - name: version_uuid
          type: keyword
        - name: new_value
          type: flattened
          description: Dynamic Datadog asset snapshot after change.
        - name: prev_value
          type: flattened
          description: Dynamic Datadog asset snapshot before change.
    - name: actor
      type: group
      fields:
        - name: type
          type: keyword
    - name: agent
      type: group
      fields:
        - name: version
          type: keyword
        - name: flavor
          type: keyword
        - name: install_method_tool
          type: keyword
        - name: remote_updates_enabled
          type: boolean
    - name: auth_method
      type: keyword
    - name: bundle_id
      type: keyword
    - name: client
      type: group
      fields:
        - name: name
          type: keyword
        - name: version
          type: keyword
    - name: configuration_type
      type: keyword
    - name: connection_id
      type: keyword
    - name: emitted_source
      type: keyword
    - name: event
      type: group
      fields:
        - name: name
          type: keyword
        - name: uuid
          type: keyword
    - name: event_name
      type: keyword
    - name: fqn
      type: keyword
    - name: http
      type: group
      fields:
        - name: level
          type: keyword
    - name: integration_name
      type: keyword
    - name: mcp
      type: group
      fields:
        - name: request_id
          type: keyword
    - name: mcp_call
      type: boolean
    - name: metadata
      type: flattened
      description: Dynamic Datadog metadata blob.
    - name: notable_event
      type: boolean
    - name: oauth_client
      type: group
      fields:
        - name: name
          type: keyword
        - name: id
          type: keyword
    - name: org
      type: group
      fields:
        - name: id
          type: long
    - name: previewable_event
      type: boolean
    - name: request_endpoint
      type: keyword
    - name: request_id
      type: keyword
    - name: route
      type: group
      fields:
        - name: path
          type: keyword
    - name: run_as_user
      type: group
      fields:
        - name: id
          type: keyword
        - name: name
          type: keyword
        - name: is_service_account
          type: boolean
    - name: session_id
      type: keyword
    - name: source
      type: group
      fields:
        - name: as
          type: group
          fields:
            - name: domain
              type: keyword
            - name: route
              type: keyword
            - name: type
              type: keyword
    - name: tags
      type: keyword
    - name: threat_intel
      type: flattened
      description: Flattened threat intel values derived from nested Datadog result objects.
    - name: tool
      type: group
      fields:
        - name: name
          type: keyword
    - name: track
      type: keyword
    - name: usage
      type: group
      fields:
        - name: duration
          type: long
    - name: user
      type: group
      fields:
        - name: created
          type: date
    - name: workflow
      type: group
      fields:
        - name: id
          type: keyword
        - name: name
          type: keyword
        - name: instance_id
          type: keyword
        - name: step_name
          type: keyword
        - name: step_execution_id
          type: keyword
        - name: trigger
          type: keyword
        - name: parent_id
          type: keyword
        - name: parent_instance_id
          type: keyword
        - name: created_at
          type: date
