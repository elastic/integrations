---
description: Pipeline for processing Weblogic Domain logs
processors:
- set:
    tag: set_event_ingested_bee62da7
    field: event.ingested
    value: "{{_ingest.timestamp}}"
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_ecs_version_da2960f1
    field: ecs.version
    value: 8.11.0
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_module_c96117e9
    field: event.module
    value: oracle_weblogic
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_kind_3057935b
    field: event.kind
    value: event
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_type_7707ce65
    field: event.type
    value: ["info"]
    ignore_empty_value: true
    ignore_failure: true
- append:
    tag: append_event_category_534116b1
    field: event.category
    value: ["network"]
    ignore_failure: true
- rename:
    tag: rename_message_10917fec
    field: message
    target_field: event.original
    ignore_missing: true
    if: 'ctx.event?.original == null'
- remove:
    tag: remove_message_08230a26
    field: message
    ignore_missing: true
    if: 'ctx.event?.original != null'
- dissect:
    tag: dissect_event_original_addbbf5a
    field: event.original
    pattern: "####<%{@timestamp}> <%{log.level}> <%{oracle_weblogic.domain.subsystem}> <%{oracle_weblogic.domain.machine_name}>
      <%{oracle_weblogic.domain.server_name}> <%{oracle_weblogic.domain.thread_id}> <%{}> <%{user.id}>
      <%{transaction.id}> <%{oracle_weblogic.domain.diagnostic_context_id}> <%{oracle_weblogic.domain.meta}>
      <%{oracle_weblogic.domain.message_id}> <%{message}>"
    ignore_missing: true
    ignore_failure: true
- date:
    tag: date_timestamp_99866825
    field: "@timestamp"
    formats:
    - dd-MMM-yyyy, h:mm:ss,SSS a zzzz
    - MMM dd, yyyy h:mm:ss,SSS a zzz
    - MMM dd, yyyy hh:mm:ss,SSS a zzz
    - MMM d, yyyy h:mm:ss,SSS a zzz
    ignore_failure: true
- script:
    tag: script_cc798376
    description: Drops null/empty values recursively
    lang: painless
    source: |
        boolean drop(Object o) {
            if (o == null || o == "") {
            return true;
            } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
            } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
            }
            return false;
        }
        drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_cd750b5e
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_cf8df5f6
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
