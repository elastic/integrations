---
description: Pipeline for processing Weblogic Managed Server logs
processors:
- set:
    tag: set_event_ingested_b138431b
    field: event.ingested
    value: "{{_ingest.timestamp}}"
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_ecs_version_5c2c7cc1
    field: ecs.version
    value: 8.11.0
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_module_e35418c9
    field: event.module
    value: oracle_weblogic
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_kind_87a134ec
    field: event.kind
    value: event
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_type_27659073
    field: event.type
    value: ["info"]
    ignore_empty_value: true
    ignore_failure: true
- append:
    tag: append_event_category_f0926cfe
    field: event.category
    value: ["iam"]
    ignore_failure: true
- rename:
    tag: rename_message_ca3f4007
    field: message
    target_field: event.original
    ignore_missing: true
    if: 'ctx.event?.original == null'
- remove:
    tag: remove_message_52cf5d5a
    field: message
    ignore_missing: true
    if: 'ctx.event?.original != null'
- dissect:
    tag: dissect_event_original_ab3fb742
    field: event.original
    pattern: "####<%{@timestamp}> <%{log.level}> <%{oracle_weblogic.managed_server.subsystem}> <%{oracle_weblogic.managed_server.machine_name}>
      <%{oracle_weblogic.managed_server.server_name}> <%{oracle_weblogic.managed_server.thread_id}> <%{}> <%{user.id}>
      <%{transaction.id}> <%{oracle_weblogic.managed_server.diagnostic_context_id}> <%{oracle_weblogic.managed_server.meta}>
      <%{oracle_weblogic.managed_server.message_id}> <%{message}>"
    ignore_missing: true
    ignore_failure: true
- date:
    tag: date_timestamp_75128ad9
    field: "@timestamp"
    formats:
    - dd-MMM-yyyy, h:mm:ss,SSS a zzzz
    - MMM dd, yyyy h:mm:ss,SSS a zzz
    - MMM dd, yyyy hh:mm:ss,SSS a zzz
    - MMM d, yyyy h:mm:ss,SSS a zzz
    ignore_failure: true
- script:
    tag: script_d65417d1
    description: Drops null/empty values recursively
    lang: painless
    source: |
        boolean drop(Object o) {
            if (o == null || o == "") {
            return true;
            } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
            } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
            }
            return false;
        }
        drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_264dd2bd
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_beecfda1
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
