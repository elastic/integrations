---
description: Pipeline for processing Weblogic Admin Server logs
processors:
- set:
    tag: set_event_ingested_b57a1626
    field: event.ingested
    value: "{{_ingest.timestamp}}"
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_ecs_version_75a8d77c
    field: ecs.version
    value: 8.11.0
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_module_48220abd
    field: event.module
    value: oracle_weblogic
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_kind_26971d03
    field: event.kind
    value: event
    ignore_empty_value: true
    ignore_failure: true
- set:
    tag: set_event_type_58b4403c
    field: event.type
    value: ["admin"]
    ignore_empty_value: true
    ignore_failure: true
- append:
    tag: append_event_category_8535cf53
    field: event.category
    value: ["iam"]
    ignore_failure: true
- rename:
    tag: rename_message_fce3cb59
    field: message
    target_field: event.original
    ignore_missing: true
    if: 'ctx.event?.original == null'
- remove:
    tag: remove_message_4937c873
    field: message
    ignore_missing: true
    if: 'ctx.event?.original != null'
- dissect:
    tag: dissect_event_original_86270b03
    field: event.original
    pattern: "####<%{@timestamp}> <%{log.level}> <%{oracle_weblogic.admin_server.subsystem}> <%{oracle_weblogic.admin_server.machine_name}>
      <%{oracle_weblogic.admin_server.server_name}> <%{oracle_weblogic.admin_server.thread_id}> <%{}> <%{user.id}>
      <%{transaction.id}> <%{oracle_weblogic.admin_server.diagnostic_context_id}> <%{oracle_weblogic.admin_server.meta}>
      <%{oracle_weblogic.admin_server.message_id}> <%{message}>"
    ignore_missing: true
    ignore_failure: true
- date:
    tag: date_timestamp_d0e9a31b
    field: "@timestamp"
    formats:
    - dd-MMM-yyyy, h:mm:ss,SSS a zzzz
    - MMM dd, yyyy h:mm:ss,SSS a zzz
    - MMM dd, yyyy hh:mm:ss,SSS a zzz
    - MMM d, yyyy h:mm:ss,SSS a zzz

    ignore_failure: true
- script:
    tag: script_e5d9ff0b
    description: Drops null/empty values recursively
    lang: painless
    source: |
        boolean drop(Object o) {
            if (o == null || o == "") {
            return true;
            } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
            } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
            }
            return false;
        }
        drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_29a91a13
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_828e6966
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
