---
description: Pipeline for Google Cloud audit logs

processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
  - json:
      tag: json_event_original_to_json_da2067de
      field: event.original
      target_field: json
      if: ctx.event?.original != null
      on_failure:
        # Parse cluster notification on failure
        - set:
            tag: set_gcp_audit_notification_232db967
            field: gcp.audit.notification
            copy_from: event.original
            ignore_empty_value: true
  - set:
      tag: set_gcp_audit_type_c033c617
      field: gcp.audit.type
      copy_from: "json.protoPayload.@type"
      ignore_failure: true
  ##
  # https://cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
  # protoPayload @type must be type.googleapis.com/google.cloud.audit.AuditLog
  ##
  - drop:
      tag: drop_10e9b810
      description: Drop the document if it is not of AuditLog type
      if: ctx.gcp?.audit?.type != null && ctx.gcp?.audit?.type != 'type.googleapis.com/google.cloud.audit.AuditLog'
  # .insertId
  - set:
      tag: set_event_id_008e62b2
      field: event.id
      copy_from: json.insertId
      if: ctx.json?.insertId != null
  # .logName
  - rename:
      tag: rename_json_logName_to_log_logger_73f0a6eb
      field: json.logName
      target_field: log.logger
      ignore_missing: true
  # .severity
  - rename:
      tag: rename_json_severity_to_log_level_db5923df
      field: json.severity
      target_field: log.level
      ignore_missing: true
  ##
  # Extract the type of audit logging data from logName to event.provider
  # https://cloud.google.com/pubsub/docs/audit-logging#log_name
  ##
  - dissect:
      tag: dissect_log_logger_c8ea0152
      field: log.logger
      pattern: "%{}%2F%{event.provider}"
      ignore_missing: true
      # NOTE test data fails the spec
      ignore_failure: true

  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - set:
      tag: set_cloud_provider_62c5e42e
      field: cloud.provider
      value: gcp
  - date:
      tag: date_json_timestamp_7a63aef5
      field: json.timestamp
      timezone: UTC
      formats:
        - ISO8601
      if: ctx.json?.timestamp != null && ctx.json.timestamp != ''

  ##
  # MonitoredResource
  # .resource
  # MonitoredResource https://cloud.google.com/logging/docs/reference/v2/rest/v2/MonitoredResource
  ##
  - set:
      tag: set_cloud_project_id_121ba626
      field: cloud.project.id
      copy_from: json.resource.labels.project_id
      if: ctx.json?.resource?.labels?.project_id != null
  - set:
      tag: set_cloud_instance_id_e0be3fd4
      field: cloud.instance.id
      copy_from: json.resource.labels.instance_id
      if: ctx.json?.resource?.labels?.instance_id != null
  - set:
      tag: set_cloud_availability_zone_24b38f5a
      field: cloud.availability_zone
      copy_from: json.resource.labels.location
      ignore_empty_value: true
  ##
  # MonitoredResourceDescriptor type
  # https://cloud.google.com/logging/docs/reference/v2/rest/v2/monitoredResourceDescriptors/list#MonitoredResourceDescriptor
  # resource list values https://cloud.google.com/logging/docs/api/v2/resource-list
  ##
  - set:
      tag: set_orchestrator_type_757229a9
      field: orchestrator.type
      value: kubernetes
      if: ctx.json?.resource?.type != null && (ctx.json?.resource?.type == 'k8s_cluster' || ctx.json?.resource?.type == 'gke_cluster')
  - set:
      tag: set_orchestrator_cluster_name_83531fb4
      field: orchestrator.cluster.name
      copy_from: json.resource.labels.cluster_name
      ignore_empty_value: true
      if: ctx.json?.resource?.type != null && (ctx.json?.resource?.type == 'k8s_cluster' || ctx.json?.resource?.type == 'gke_cluster')
  - set:
      tag: set__temp_type_3c87c5ae
      field: _temp.type
      copy_from: json.protoPayload.resourceName
      ignore_empty_value: true
      if: ctx.json?.resource?.type != null && ctx.json?.resource?.type == 'k8s_cluster'
  - grok:
      tag: grok__temp_type_4273d731
      field: _temp.type
      patterns:
        - '%{DATA}/%{API_VERSION:orchestrator.api_version}/namespaces/%{DATA:orchestrator.namespace}/%{RESOURCE_TYPE:orchestrator.resource.type}(/%{HOSTNAME:orchestrator.resource.name})?'
        - '%{DATA}/%{API_VERSION:orchestrator.api_version}/%{RESOURCE_TYPE:orchestrator.resource.type}'
        - 'apis/%{RESOURCE_TYPE:orchestrator.resource.type}/%{API_VERSION:orchestrator.api_version}'
        - 'api/%{API_VERSION:orchestrator.api_version}'
        - '%{RESOURCE_TYPE:orchestrator.resource.type}'
      pattern_definitions:
        API_VERSION: (v\d+([a-z]+)?(\d+)?)
        RESOURCE_TYPE: ([a-z]+((\.[a-z0-9]+)+)?)
      ignore_missing: true
  - script:
      tag: script_13bc28fc
      description: Appends any relevant entity to `related.entity` for all events
      lang: painless
      on_failure:
        - set:
            tag: set_error_message_679c76c6
            description: Adds error reason to the document
            field: error.message
            value: "{{{ _ingest.on_failure_message }}}"
      source: |
        void addValue(Set entities, def value) {
          if (value != null && value != "") {
            entities.add(value);
          }
        }

        boolean isKubernetes = false;
        if (ctx.json?.resource?.type != null) {
          String typ = ctx.json.resource.type;
          isKubernetes = (typ == "k8s_cluster" || typ == "gke_cluster" || typ == "kubernetes");
        }

        // Using tree set to ensure a sorting is kept (testing purposes)
        TreeSet entities = new TreeSet();

        addValue(entities, ctx.json?.protoPayload?.request?.parent);
        if (!isKubernetes) {
          addValue(entities, ctx.json?.protoPayload?.resourceName);
          addValue(entities, ctx.json?.protoPayload?.response?.user);
        }

        HashMap authInfo = ctx.json?.protoPayload?.authenticationInfo ?: new HashMap();
        if (!isKubernetes) {
          addValue(entities, authInfo.principalEmail);
        }
        addValue(entities, authInfo.principalSubject);
        addValue(entities, authInfo.serviceAccountKeyName);
        if (authInfo.serviceAccountDelegationInfo instanceof List) {
          for (def i: authInfo.serviceAccountDelegationInfo) {
            addValue(entities, i.principalSubject);
            addValue(entities, i.firstPartyPrincipal?.principalEmail);
            addValue(entities, i.thirdPartyPrincipal?.principalEmail);
          }
        }

        String serviceName = ctx.json?.protoPayload?.serviceName ?: '';
        if (serviceName == "compute.googleapis.com") {
          if (ctx.json?.protoPayload?.request?.networkInterfaces instanceof List) {
            for (def e: ctx.json.protoPayload.request.networkInterfaces) {
              addValue(entities, e.network);
            }
          }
          if (ctx.json?.protoPayload?.request?.serviceAccounts instanceof List) {
            for (def e: ctx.json.protoPayload.request.serviceAccounts) {
              addValue(entities, e.email);
            }
          }
          if (ctx.json?.protoPayload?.request?.disks instanceof List) {
            for (def e: ctx.json.protoPayload.request.disks) {
              addValue(entities, e.source);
            }
          }
        } else if (serviceName == "cloudresourcemanager.googleapis.com") {
          if (ctx.json?.protoPayload?.request?.policy?.bindings instanceof List) {
            for (def e: ctx.json.protoPayload.request.policy.bindings) {
              addValue(entities, e.role);
              for (def m: e.members) {
                addValue(entities, m);
              }
            }
          }
          if (ctx.json?.protoPayload?.response?.bindings instanceof List) {
            for (def e: ctx.json.protoPayload.response.bindings) {
              addValue(entities, e.role);
              for (def m: e.members) {
                addValue(entities, m);
              }
            }
          }
        } else if (serviceName == "iamcredentials.googleapis.com") {
          if (ctx.json?.protoPayload?.metadata?.identityDelegationChain instanceof List) {
            for (def e: ctx.json.protoPayload.metadata.identityDelegationChain) {
              addValue(entities, e);
            }
          }
        }

        if (entities.size() > 0) {
          ctx.related = ctx.related ?: [:];
          ctx.related.entity = entities;
        }

  ##
  # Extract origin, target, and related entity IDs
  ##
  - append:
      tag: append_actor_entity_id_8c5df9c1
      field: actor.entity.id
      value: "{{{json.protoPayload.authenticationInfo.principalSubject}}}"
      if: ctx.json?.protoPayload?.authenticationInfo?.principalSubject != null
  - append:
      tag: append_actor_entity_id_5873a061
      field: actor.entity.id
      value: "{{{json.protoPayload.authenticationInfo.principalEmail}}}"
      if: ctx.json?.protoPayload?.authenticationInfo?.principalEmail != null
  - append:
      tag: append_target_entity_id_a8c26482
      field: target.entity.id
      value: "{{{json.protoPayload.resourceName}}}"
      if: ctx.json?.resource?.type != 'k8s_cluster' && ctx.json?.protoPayload?.resourceName != null
  - append:
      tag: append_target_entity_id_e0955b84
      field: target.entity.id
      value: "{{{json.resource.disk_id}}}"
      if: ctx.json?.resouce?.disk_id != null
  ##
  # Classify actor and target entities by type for enhanced graph visualization
  ##
  - script:
      tag: script_0b5ddf1c
      description: Classify actor and target entities into type-specific fields
      lang: painless
      on_failure:
        - set:
            tag: set_error_message_f032c8ea
            description: Adds error reason to the document
            field: error.message
            value: "{{{ _ingest.on_failure_message }}}"
      source: |
        void addNestedValue(def currentCtx, String path, def value) {
          if (value == null || value == "") {
            return;
          }
          String[] parts = path.splitOnToken('.');
          for (int i = 0; i < parts.length - 1; i++) {
            if (currentCtx[parts[i]] == null) {
              currentCtx[parts[i]] = [:];
            }
            currentCtx = currentCtx[parts[i]];
          }
          String lastPart = parts[parts.length - 1];
          if (currentCtx[lastPart] == null) {
            currentCtx[lastPart] = [];
          }
          if (!currentCtx[lastPart].contains(value)) {
            currentCtx[lastPart].add(value);
          }
        }
        
        // Classify actor entities
        if (ctx.actor?.entity?.id instanceof List) {
          for (def actorId : ctx.actor.entity.id) {
            if (actorId == null || actorId == "") {
              continue;
            }
            String actor = actorId.toString();
            
            // Service accounts: serviceAccount:* or *.gserviceaccount.com (includes cloudservices and iam)
            if (actor.startsWith("serviceAccount:") || actor.contains(".gserviceaccount.com")) {
              addNestedValue(ctx, "service.entity.id", actor);
            }
            // Service account paths: projects/*/serviceAccounts/*
            else if (actor.contains("/serviceAccounts")) {
              addNestedValue(ctx, "service.entity.id", actor);
            }
            // User accounts: user:* or email addresses (not service accounts)
            else if (actor.startsWith("user:") || (actor.contains("@") && !actor.contains(".gserviceaccount.com"))) {
              addNestedValue(ctx, "user.entity.id", actor);
            }
            // Compute instances: projects/*/zones/*/instances/*
            else if (actor.contains("/instances")) {
              addNestedValue(ctx, "host.entity.id", actor);
            }
            // GCP service or API names: *.googleapis.com (but not principal:// or workloadIdentityPools)
            else if (actor.contains(".googleapis.com") && !actor.startsWith("principal://") && !actor.contains("/workloadIdentityPools")) {
              addNestedValue(ctx, "service.entity.id", actor);
            }
            // Everything else (repo:, workloadIdentityPools, principal://, etc.)
            else {
              addNestedValue(ctx, "entity.id", actor);
            }
          }
        }
        
        // Classify target entities
        if (ctx.target?.entity?.id instanceof List) {
          for (def targetId : ctx.target.entity.id) {
            if (targetId == null || targetId == "") {
              continue;
            }
            String target = targetId.toString();
            
            // Compute instances
            if (target.contains("/instances")) {
              addNestedValue(ctx, "host.target.entity.id", target);
            }
            // Service accounts: projects/*/serviceAccounts/* or email addresses ending with .gserviceaccount.com
            else if (target.contains("/serviceAccounts") || 
                     (target.contains("@") && target.contains(".gserviceaccount.com"))) {
              addNestedValue(ctx, "service.target.entity.id", target);
            }
            // IAM principals (users, groups)
            else if (target.contains("/users") || 
                     target.contains("/groups") ||
                     (target.contains("@") && target.contains("/members"))) {
              addNestedValue(ctx, "user.target.entity.id", target);
            }
            // GCP service resources
            else if (target.contains("/machineTypes") ||
                     target.contains("/deployments") ||
                     target.contains("/services") ||
                     target.contains("/policies") ||
                     target.contains("/operations") ||
                     target.contains("/subnetworks") ||
                     target.contains("/networkEdgeSecurityServices") ||
                     target.contains("/functions") ||
                     target.contains("/buckets") ||
                     target.contains("/datasets") ||
                     target.contains("/tables") ||
                     target.contains("/disks") ||
                     target.contains("/networks") ||
                     target.contains("/firewalls") ||
                     target.contains("/backendServices") ||
                     target.contains("/forwardingRules") ||
                     target.contains("/healthChecks") ||
                     target.contains("/sslCertificates") ||
                     target.contains("/targetPools") ||
                     target.contains("/urlMaps") ||
                     target.contains(".googleapis.com")) {
              addNestedValue(ctx, "service.target.entity.id", target);
            }
            // Everything else (projects, zones, workloadIdentityPools, etc.)
            else {
              addNestedValue(ctx, "entity.target.id", target);
            }
          }
        }

  ##
  # AuthenticationInfo
  # .protoPayload.authenticationInfo
  # https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog#AuthenticationInfo
  ##
  - rename:
      tag: rename_json_protoPayload_authenticationInfo_authoritySelector_to_gcp_audit_authentication_info_authority_selector_8503f1a1
      field: json.protoPayload.authenticationInfo.authoritySelector
      target_field: gcp.audit.authentication_info.authority_selector
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_authenticationInfo_principalEmail_to_gcp_audit_authentication_info_principal_email_9739641b
      field: json.protoPayload.authenticationInfo.principalEmail
      target_field: gcp.audit.authentication_info.principal_email
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_authenticationInfo_principalSubject_to_gcp_audit_authentication_info_principal_subject_0d76993b
      field: json.protoPayload.authenticationInfo.principalSubject
      target_field: gcp.audit.authentication_info.principal_subject
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_authenticationInfo_serviceAccountKeyName_to_gcp_audit_authentication_info_service_account_key_name_dfd8d4d3
      field: json.protoPayload.authenticationInfo.serviceAccountKeyName
      target_field: gcp.audit.authentication_info.service_account_key_name
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_authenticationInfo_serviceAccountDelegationInfo_to_gcp_audit_authentication_info_service_account_delegation_info_883b4747
      field: json.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      target_field: gcp.audit.authentication_info.service_account_delegation_info
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_authenticationInfo_thirdPartyPrincipal_to_gcp_audit_authentication_info_third_party_principal_19aae662
      field: json.protoPayload.authenticationInfo.thirdPartyPrincipal
      target_field: gcp.audit.authentication_info.third_party_principal
      ignore_failure: true

  # email address of authenticated user (redacted) or service account
  # principal_email -> client.user.email
  - rename:
      tag: rename_gcp_audit_authentication_info_principal_email_to_client_user_email_d32fc7d2
      field: gcp.audit.authentication_info.principal_email
      target_field: client.user.email
      if: ctx.client?.user?.email == null
      ignore_missing: true
  # identity of requesting first or third party
  # principal_subject -> client.user.id
  - rename:
      tag: rename_gcp_audit_authentication_info_principal_subject_to_client_user_id_603af332
      field: gcp.audit.authentication_info.principal_subject
      target_field: client.user.id
      if: ctx.client?.user?.id == null
      ignore_missing: true

  ##
  # AuthorizationInfo
  # .protoPayload.authorizationInfo
  # https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog#authorizationinfo
  ##
  - set:
      tag: set_gcp_audit_authorization_info_54848940
      field: gcp.audit.authorization_info
      copy_from: json.protoPayload.authorizationInfo
      ignore_failure: true
  - foreach:
      tag: foreach_gcp_audit_authorization_info_4f513c47
      field: gcp.audit.authorization_info
      ignore_missing: true
      ignore_failure: true
      processor:
        rename:
          tag: rename_ingest_value_resourceAttributes_to_ingest_value_resource_attributes
          field: _ingest._value.resourceAttributes
          target_field: _ingest._value.resource_attributes
      if: ctx?.gcp?.audit?.authorization_info != null && ctx?.gcp?.audit?.authorization_info instanceof List

  ##
  # Labels
  # .labels
  ##
  - set:
      tag: set_gcp_audit_labels_a7884819
      field: gcp.audit.labels
      copy_from: json.labels
      if: ctx.json?.labels != null
  - json:
      field: labels.payload
      tag: json_labels_payload
      if: ctx.labels?.payload != null
      on_failure:
        - append:
            tag: append_error_message_c858cf42
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: cloud.project.id
      tag: set_cloud_project_id_from_labels_project_id
      copy_from: labels.project_id
      override: false
      ignore_empty_value: true
      if: ctx.cloud?.project?.id == null && ctx.labels?.project_id != null
  - set:
      field: orchestrator.type
      tag: set_orchestrator_type
      value: kubernetes
      override: false
      if: ctx.orchestrator?.type == null && ctx.labels?.cluster_name != null
  - set:
      field: orchestrator.cluster.name
      tag: set_orchestrator_cluster_name_from_labels_cluster_name
      copy_from: labels.cluster_name
      ignore_empty_value: true
      override: false
      if: ctx.orchestrator?.cluster?.name == null && ctx.labels?.cluster_name != null
  - set:
      field: orchestrator.resource.type
      tag: set_orchestrator_resource_type_from_labels_payload_resourceType
      copy_from: labels.payload.resourceType
      ignore_empty_value: true
      override: false
      if: ctx.orchestrator?.resource?.type == null && ctx.labels?.payload?.resourceType != null
  - set:
      field: orchestrator.resource.name
      tag: set_orchestrator_resource_name_from_labels_payload_resource
      copy_from: labels.payload.resource
      ignore_empty_value: true
      override: false
      if: ctx.orchestrator?.resource?.name == null && ctx.labels?.payload?.resource != null

  ##
  # RequestMetadata
  # .protoPayload.requestMetadata
  # https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog#requestmetadata
  ##
  - convert:
      tag: convert_json_protoPayload_requestMetadata_callerIp_to_source_ip_f3f594de
      if: ctx.json?.protoPayload?.requestMetadata?.callerIp != null && ctx.json?.protoPayload?.requestMetadata?.callerIp != "gce-internal-ip"  && ctx.json?.protoPayload?.requestMetadata?.callerIp != "private"
      type: ip
      field: json.protoPayload.requestMetadata.callerIp
      target_field: source.ip
      ignore_missing: true
  - set:
      tag: set_user_agent_original_553976c5
      field: user_agent.original
      copy_from: json.protoPayload.requestMetadata.callerSuppliedUserAgent
      ignore_failure: true

  ##
  # Metadata
  # .protoPayload.metadata
  # https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
  ##
  - set:
      tag: set_gcp_audit_metadata_bd142044
      field: gcp.audit.metadata
      copy_from: json.protoPayload.metadata
      if: ctx.json?.protoPayload?.metadata != null

  ##
  # PolicyViolationInfo
  # .protoPayload.orgPolicyViolationInfo
  # https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog#policyviolationinfo
  ##
  - set:
      tag: set_gcp_audit_policy_violation_info_violations_f6f04e9b
      field: gcp.audit.policy_violation_info.violations
      copy_from: json.protoPayload.policyViolationInfo.orgPolicyViolationInfo.violationInfo
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_policyViolationInfo_orgPolicyViolationInfo_payload_to_gcp_audit_policy_violation_info_payload_5791a15c
      field: json.protoPayload.policyViolationInfo.orgPolicyViolationInfo.payload
      target_field: gcp.audit.policy_violation_info.payload
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_policyViolationInfo_orgPolicyViolationInfo_resourceType_to_gcp_audit_policy_violation_info_resource_type_bec412c9
      field: json.protoPayload.policyViolationInfo.orgPolicyViolationInfo.resourceType
      target_field: gcp.audit.policy_violation_info.resource_type
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_policyViolationInfo_orgPolicyViolationInfo_resourceTags_to_gcp_audit_policy_violation_info_resource_tags_5d197073
      field: json.protoPayload.policyViolationInfo.orgPolicyViolationInfo.resourceTags
      target_field: gcp.audit.policy_violation_info.resource_tags
      ignore_failure: true

  ##
  # LogEntryOperation
  # .operation
  # https://cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry#logentryoperation
  ##
  # set only if it is not the same as insertId
  - set:
      tag: set_gcp_audit_logentry_operation_id_162dd8d0
      field: gcp.audit.logentry_operation.id
      copy_from: json.operation.id
      if: ctx.json?.operation?.id != null && ctx.event?.id != null && ctx.event?.id != ctx.json?.operation?.id
  - script:
      lang: painless
      description: set event.category and type for long running operation
      tag: set-event-type-for-long-operations
      if: ctx.json?.operation != null
      source: |
        def first = (ctx.json.operation.first == null) ? false : ctx.json.operation.first;
        def last = (ctx.json.operation.last == null) ? false : ctx.json.operation.last;
        if (first && last) {
          return;
        }
        if (ctx.event.category == null) {
          ctx.event.category = new ArrayList();
        }
        if (ctx.event.type == null) {
          ctx.event.type = new ArrayList();
        }
        ctx.event.category.add('session');
        if (first == true && last == false) {
          ctx.event.type.add('start');
        }
        if (first == false && last == true) {
          ctx.event.type.add('end');
        }

  ##
  # BindingDelta
  # protPayload.serviceData.policyDelta.bindingDeltas
  # https://docs.cloud.google.com/iam/docs/reference/rpc/google.iam.v1#google.iam.v1.BindingDelta
  ##
  - set:
      tag: set_gcp_audit_service_data_policy_delta_binding_deltas_9a07e6ba
      field: gcp.audit.service_data.policy_delta.binding_deltas
      copy_from: json.protoPayload.serviceData.policyDelta.bindingDeltas
      if: ctx.json?.protoPayload?.serviceData?.policyDelta?.bindingDeltas != null && !ctx.json.protoPayload.serviceData.policyDelta.bindingDeltas.isEmpty()

  # TODO remove duplicate protoPayload.methodName
  - set:
      tag: set_event_action_88429a42
      field: event.action
      copy_from: json.protoPayload.methodName
      ignore_failure: true
  - convert:
