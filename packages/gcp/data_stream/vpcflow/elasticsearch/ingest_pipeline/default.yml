---
description: Pipeline for Google Cloud VPC Flow Logs

processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - community_id:
      tag: community_id_46d7956f
      source_ip: json.jsonPayload.connection.src_ip
      source_port: json.jsonPayload.connection.src_port
      destination_ip: json.jsonPayload.connection.dest_ip
      destination_port: json.jsonPayload.connection.dest_port
      iana_number: json.jsonPayload.connection.protocol
  - date:
      tag: date_json_timestamp_e111e976
      field: json.timestamp
      timezone: UTC
      formats:
        - ISO8601
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      tag: append_event_category_7afdca3c
      field: event.category
      value: network
  - append:
      tag: append_event_type_ab8d9d0e
      field: event.type
      value: connection
  - set:
      tag: set_event_id_efd37a25
      field: event.id
      copy_from: json.insertId
      ignore_empty_value: true
      ignore_failure: true
  - set:
      tag: set_cloud_provider_62c5e42e
      field: cloud.provider
      value: gcp
  - set:
      tag: set_log_logger_01230fab
      field: log.logger
      copy_from: json.logName
      ignore_failure: true
  - set:
      tag: set_destination_address_3f9e1c04
      field: destination.address
      copy_from: json.jsonPayload.connection.dest_ip
      ignore_failure: true
  - set:
      tag: set_destination_port_48df1199
      field: destination.port
      copy_from: json.jsonPayload.connection.dest_port
      ignore_failure: true
  - set:
      tag: set_network_iana_number_1bb4e74b
      field: network.iana_number
      copy_from: json.jsonPayload.connection.protocol
      ignore_failure: true
  - set:
      tag: set_source_address_a1ff7ced
      field: source.address
      copy_from: json.jsonPayload.connection.src_ip
      ignore_failure: true
  - set:
      tag: set_source_port_0090c682
      field: source.port
      copy_from: json.jsonPayload.connection.src_port
      ignore_failure: true
  - set:
      tag: set_source_domain_3b02f5f6
      field: source.domain
      copy_from: json.jsonPayload.src_instance.vm_name
      ignore_failure: true
  - set:
      tag: set_destination_domain_61437cf3
      field: destination.domain
      copy_from: json.jsonPayload.dest_instance.vm_name
      ignore_failure: true
  - set:
      tag: set_source_bytes_569b3638
      field: source.bytes
      copy_from: json.jsonPayload.bytes_sent
      ignore_failure: true
  - set:
      tag: set_source_packets_98215724
      field: source.packets
      copy_from: json.jsonPayload.packets_sent
      ignore_failure: true
  - set:
      tag: set_event_start_28445d8a
      field: event.start
      copy_from: json.jsonPayload.start_time
      ignore_failure: true
  - set:
      tag: set_event_end_dbfb1714
      field: event.end
      copy_from: json.jsonPayload.end_time
      ignore_failure: true
  - set:
      tag: set_destination_as_number_44ad410f
      field: destination.as.number
      copy_from: json.jsonPayload.dest_location.asn
      ignore_failure: true
  - set:
      tag: set_destination_geo_continent_name_ab2484fb
      field: destination.geo.continent_name
      copy_from: json.jsonPayload.dest_location.continent
      ignore_failure: true
  - set:
      tag: set_destination_geo_country_name_7918f5b7
      field: destination.geo.country_name
      copy_from: json.jsonPayload.dest_location.country
      ignore_failure: true
  - set:
      tag: set_destination_geo_region_name_48f7a789
      field: destination.geo.region_name
      copy_from: json.jsonPayload.dest_location.region
      ignore_failure: true
  - set:
      tag: set_destination_geo_city_name_1739d847
      field: destination.geo.city_name
      copy_from: json.jsonPayload.dest_location.city
      ignore_failure: true
  - set:
      tag: set_source_as_number_2d01b872
      field: source.as.number
      copy_from: json.jsonPayload.src_location.asn
      ignore_failure: true
  - set:
      tag: set_source_geo_continent_name_440a3660
      field: source.geo.continent_name
      copy_from: json.jsonPayload.src_location.continent
      ignore_failure: true
  - set:
      tag: set_source_geo_country_name_f15fd6c8
      field: source.geo.country_name
      copy_from: json.jsonPayload.src_location.country
      ignore_failure: true
  - set:
      tag: set_source_geo_region_name_453025f4
      field: source.geo.region_name
      copy_from: json.jsonPayload.src_location.region
      ignore_failure: true
  - set:
      tag: set_source_geo_city_name_653753c4
      field: source.geo.city_name
      copy_from: json.jsonPayload.src_location.city
      ignore_failure: true
  - set:
      tag: set_gcp_destination_instance_73b610f1
      field: gcp.destination.instance
      copy_from: json.jsonPayload.dest_instance
      ignore_failure: true
  - set:
      tag: set_gcp_destination_vpc_665d2e57
      field: gcp.destination.vpc
      copy_from: json.jsonPayload.dest_vpc
      ignore_failure: true
  - set:
      tag: set_gcp_source_instance_77b689be
      field: gcp.source.instance
      copy_from: json.jsonPayload.src_instance
      ignore_failure: true
  - set:
      tag: set_gcp_source_vpc_e907735e
      field: gcp.source.vpc
      copy_from: json.jsonPayload.src_vpc
      ignore_failure: true
  - convert:
      tag: convert_json_jsonPayload_rtt_msec_to_json_jsonPayload_rtt_ms_a104658a
      field: json.jsonPayload.rtt_msec
      target_field: json.jsonPayload.rtt.ms
      type: long
      ignore_missing: true
  - rename:
      tag: rename_json_jsonPayload_to_gcp_vpcflow_f7a42ae5
      field: json.jsonPayload
      target_field: gcp.vpcflow
      ignore_missing: true
  - convert:
      tag: convert_source_bytes_e0c47eeb
      field: source.bytes
      type: long
      ignore_missing: true
  - convert:
      tag: convert_source_packets_fc56b0f9
      field: source.packets
      type: long
      ignore_missing: true
  - convert:
      tag: convert_network_iana_number_b5dcb911
      field: network.iana_number
      type: string
      ignore_missing: true
  - script:
      tag: script_aaef8fa9
      lang: painless
      ignore_failure: true
      if: ctx?.network?.iana_number != null
      source: |
        def iana_number = ctx.network.iana_number;
        if (iana_number == '0') {
            ctx.network.transport = 'hopopt';
        } else if (iana_number == '1') {
            ctx.network.transport = 'icmp';
        } else if (iana_number == '2') {
            ctx.network.transport = 'igmp';
        } else if (iana_number == '6') {
            ctx.network.transport = 'tcp';
        } else if (iana_number == '8') {
            ctx.network.transport = 'egp';
        } else if (iana_number == '17') {
            ctx.network.transport = 'udp';
        } else if (iana_number == '47') {
            ctx.network.transport = 'gre';
        } else if (iana_number == '50') {
            ctx.network.transport = 'esp';
        } else if (iana_number == '58') {
            ctx.network.transport = 'ipv6-icmp';
        } else if (iana_number == '112') {
            ctx.network.transport = 'vrrp';
        } else if (iana_number == '132') {
            ctx.network.transport = 'sctp';
        }
  - set:
      tag: set_source_ip_1bfe096a
      field: source.ip
      copy_from: source.address
      ignore_failure: true
      if: ctx.source?.address != null
  - set:
      tag: set_destination_ip_6e761801
      field: destination.ip
      copy_from: destination.address
      ignore_failure: true
      if: ctx.destination?.address != null
  - convert:
      tag: convert_gcp_source_instance_project_id_to_cloud_project_id_43fdab19
      field: gcp.source.instance.project_id
      target_field: cloud.project.id
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "DEST"
  - convert:
      tag: convert_gcp_source_instance_vm_name_to_cloud_instance_name_4f098fe7
      field: gcp.source.instance.vm_name
      target_field: cloud.instance.name
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "DEST"
  - convert:
      tag: convert_gcp_source_instance_region_to_cloud_region_140a3aea
      field: gcp.source.instance.region
      target_field: cloud.region
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "DEST"
  - convert:
      tag: convert_gcp_source_instance_zone_to_cloud_availability_zone_bc3e960c
      field: gcp.source.instance.zone
      target_field: cloud.availability_zone
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "DEST"
  - convert:
      tag: convert_gcp_source_vpc_subnetwork_name_to_network_name_f0abac9d
      field: gcp.source.vpc.subnetwork_name
      target_field: network.name
      type: string
      ignore_missing: true
      ignore_failure: true
      if: ctx?.gcp?.vpcflow?.reporter == "DEST"
  - convert:
      tag: convert_gcp_destination_instance_project_id_to_cloud_project_id_930d8780
      field: gcp.destination.instance.project_id
      target_field: cloud.project.id
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "SRC"
  - convert:
      tag: convert_gcp_destination_instance_vm_name_to_cloud_instance_name_fb68460a
      field: gcp.destination.instance.vm_name
      target_field: cloud.instance.name
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "SRC"
  - convert:
      tag: convert_gcp_destination_instance_region_to_cloud_region_f4c2df7d
      field: gcp.destination.instance.region
      target_field: cloud.region
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "SRC"
  - convert:
      tag: convert_gcp_destination_instance_zone_to_cloud_availability_zone_613f72c1
      field: gcp.destination.instance.zone
      target_field: cloud.availability_zone
      type: string
      ignore_missing: true
      if: ctx?.gcp?.vpcflow?.reporter == "SRC"
  - convert:
      tag: convert_gcp_destination_vpc_subnetwork_name_to_network_name_ed7bedc6
      field: gcp.destination.vpc.subnetwork_name
      target_field: network.name
      type: string
      ignore_missing: true
      ignore_failure: true
      if: ctx?.gcp?.vpcflow?.reporter == "SRC"
  - convert:
      tag: convert_source_bytes_to_network_bytes_298da900
      field: source.bytes
      type: long
      target_field: network.bytes
      ignore_missing: true
  - convert:
      tag: convert_source_packets_to_network_packets_adc0c3b4
      field: source.packets
      type: long
      target_field: network.packets
      ignore_missing: true
  - set:
      tag: set_network_direction_58050b34
      field: network.direction
      value: internal
      if: ctx?.gcp?.source?.instance != null && ctx?.gcp?.destination?.instance != null
  - set:
      tag: set_network_direction_d46c6d3b
      field: network.direction
      value: outbound
      if: ctx?.gcp?.source?.instance != null && ctx?.gcp?.destination?.instance == null
  - set:
      tag: set_network_direction_08c4e8ee
      field: network.direction
      value: inbound
      if: ctx?.gcp?.source?.instance == null && ctx?.gcp?.destination?.instance != null
  - set:
      tag: set_network_direction_f672f5c9
      field: network.direction
      value: unknown
      if: ctx?.network?.direction == null
  - set:
      tag: set_network_type_409f99d1
      field: network.type
      value: ipv4
      if: ctx?.source?.ip != null && ctx?.source?.ip.contains(".")
  - set:
      tag: set_network_type_3a24ca9a
      field: network.type
      value: ipv6
      if: ctx?.source?.ip != null && !ctx?.source?.ip.contains(".")
  - append:
      tag: append_related_ip_c40a2e39
      field: related.ip
      value: "{{source.ip}}"
      allow_duplicates: false
      if: ctx?.source?.ip != null && ctx?.source?.ip != ""
  - append:
      tag: append_related_ip_b730887a
      field: related.ip
      value: "{{destination.ip}}"
      allow_duplicates: false
      if: ctx?.destination?.ip != null && ctx?.destination?.ip != ""
  # IP Geolocation Lookup
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_destination_ip_to_destination_geo_ab5e2968
      field: destination.ip
      target_field: destination.geo
      ignore_missing: true
  # IP Autonomous System (AS) Lookup
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - geoip:
      tag: geoip_destination_ip_to_destination_as_8a007787
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_destination_as_asn_to_destination_as_number_3b459fcd
      field: destination.as.asn
      target_field: destination.as.number
      ignore_missing: true
  - rename:
      tag: rename_destination_as_organization_name_to_destination_as_organization_name_814bd459
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_json_to_gcp_vpcflow_flattened_8e3f5d9b
      field: json
      target_field: gcp.vpcflow.flattened
      if: ctx.json != null && ctx._conf?.keep_json == true
  - remove:
      tag: remove_19bf017b
      field:
        - gcp.destination.instance.vm_name
        - gcp.source.instance.vm_name
        - gcp.vpcflow.bytes_sent
        - gcp.vpcflow.connection
        - gcp.vpcflow.connection.dest_ip
        - gcp.vpcflow.connection.dest_port
        - gcp.vpcflow.connection.protocol
        - gcp.vpcflow.connection.src_ip
        - gcp.vpcflow.connection.src_port
        - gcp.vpcflow.dest_instance
        - gcp.vpcflow.dest_instance.vm_name
        - gcp.vpcflow.dest_location
        - gcp.vpcflow.dest_location.asn
        - gcp.vpcflow.dest_location.city
        - gcp.vpcflow.dest_location.continent
        - gcp.vpcflow.dest_location.country
        - gcp.vpcflow.dest_location.region
        - gcp.vpcflow.dest_vpc
        - gcp.vpcflow.end_time
        - gcp.vpcflow.packets_sent
        - gcp.vpcflow.rtt_msec
        - gcp.vpcflow.src_instance
        - gcp.vpcflow.src_instance.vm_name
        - gcp.vpcflow.src_location
        - gcp.vpcflow.src_location.asn
        - gcp.vpcflow.src_location.city
        - gcp.vpcflow.src_location.continent
        - gcp.vpcflow.src_location.country
        - gcp.vpcflow.src_location.region
        - gcp.vpcflow.src_vpc
        - gcp.vpcflow.start_time
        - _conf
        - json
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
