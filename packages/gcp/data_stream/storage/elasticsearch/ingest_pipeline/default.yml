      ignore_missing: true
  - rename:
      tag: rename_gcp_metrics_authz_acl_operations_count_to_gcp_storage_authz_acl_operations_count_98239a64
      field: gcp.metrics.authz.acl_operations.count
      target_field: gcp.storage.authz.acl_operations.count
