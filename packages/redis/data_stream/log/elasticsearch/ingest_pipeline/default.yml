---
description: Pipeline for parsing redis logs
processors:
  - set:
      tag: set_event_ingested_6d6fca72
      field: event.ingested
      value: '{{_ingest.timestamp}}'
  - set:
      tag: set_ecs_version_e19c510d
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_18706f69
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
  - remove:
      tag: remove_message_91f88759
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
  - grok:
      tag: grok_event_original_33407982
      field: event.original
      patterns:
      - "(%{POSINT:process.pid:long}:%{CHAR:redis.log.role} )?(%{REDISTIMESTAMP1:redis.log.timestamp}||%{REDISTIMESTAMP2:redis.log.timestamp})
        %{REDISLEVEL:log.level} %{GREEDYDATA:message}"
      - "%{POSINT:process.pid:long}:signal-handler \\(%{POSINT:redis.log.timestamp}\\)
        %{GREEDYDATA:message}"
      pattern_definitions:
        CHAR: "[a-zA-Z]"
        REDISLEVEL: "[.\\-*#]"
        REDISTIMESTAMP1: "%{MONTHDAY} %{MONTH} %{TIME}"
        REDISTIMESTAMP2: "%{MONTHDAY} %{MONTH} %{YEAR} %{TIME}"
  - script:
      tag: script_84d100a3
      lang: painless
      if: ctx.log?.level != null
      source: |-
        if (ctx.log.level == params.dot) {
          ctx.log.level = params.debug;
        } else if (ctx.log.level == params.dash) {
          ctx.log.level = params.verbose;
        } else if (ctx.log.level == params.asterisk) {
          ctx.log.level = params.notice;
        } else if (ctx.log.level == params.hash) {
          ctx.log.level = params.warning;
        }
      params:
        dot: "."
        debug: debug
        dash: "-"
        verbose: verbose
        asterisk: "*"
        notice: notice
        hash: "#"
        warning: warning
  - script:
      tag: script_7b0cee74
      lang: painless
      if: ctx.redis?.log?.role != null
      source: |-
        if (ctx.redis.log.role == params.master_abbrev) {
          ctx.redis.log.role = params.master;
        } else if (ctx.redis.log.role == params.slave_abbrev) {
          ctx.redis.log.role = params.slave;
        } else if (ctx.redis.log.role == params.child_abbrev) {
          ctx.redis.log.role = params.child;
        } else if (ctx.redis.log.role == params.sentinel_abbrev) {
          ctx.redis.log.role = params.sentinel;
        }
      params:
        master_abbrev: M
        master: master
        slave_abbrev: S
        slave: slave
        child_abbrev: C
        child: child
        sentinel_abbrev: X
        sentinel: sentinel
  - rename:
      tag: rename_timestamp_4d5d6573
      field: "@timestamp"
      target_field: event.created
  - date:
      tag: date_redis_log_timestamp_6e2d082f
      field: redis.log.timestamp
      target_field: "@timestamp"
      formats:
      - dd MMM yyyy H:m:s.SSS
      - dd MMM H:m:s.SSS
      - dd MMM H:m:s
      - UNIX
      ignore_failure: false
  - remove:
      tag: remove_redis_log_timestamp_e3ee668d
      field: redis.log.timestamp
      ignore_failure: true
on_failure:
  - set:
      tag: set_event_kind_1f0631c8
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_49cd6958
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
