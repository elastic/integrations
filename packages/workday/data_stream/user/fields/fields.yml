- name: workday
  type: group
  fields:
    - name: user
      type: group
      fields:
        - name: Cost_Center
          type: keyword
          description: The cost center the worker belongs to.
        - name: Job_Title
          type: keyword
          description: The job title held by the worker.
        - name: Last_Account_or_Proxy_Login_Moment
          type: date
          description: The date and time of the worker's last account or proxy login, as reported by Workday.
        - name: Manager_Email
          type: keyword
          description: The work email address of the worker's manager.
        - name: Manager_ID
          type: keyword
          description: The Workday Employee ID of the worker's manager.
        - name: WorkerIsManager
          type: boolean
          description: Whether the worker is a manager.
        - name: Worker_Status
          type: keyword
          description: The current status of the worker (for example, Active, Retired).
        - name: Worker_Type
          type: keyword
          description: The classification of the worker (for example, Employee, Contingent Worker).
        - name: Worker_s_Manager
          type: keyword
          description: The display name of the worker's manager, including their Employee ID.
        - name: location
          type: keyword
          description: The work location of the worker.
        - name: termination_date
          type: date
          description: The date the worker was terminated, when applicable.
