---
description: Pipeline for processing sign-on logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_8c2c9474
      value: 9.4.0
  - remove:
      field:
        - organization
        - division
        - team
      tag: remove_agentless_tags_e6856012
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error_f2e4d3c3
      description: error message set and no data to process.
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
  - rename:
      field: message
      tag: rename_message_to_event_original_1d854002
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message.
      if: ctx.event?.original == null
  - remove:
      field:
        - message
      tag: remove_message_774de86c
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_49fc1b36
      target_field: workday.sign_on
      if: ctx.event?.original != null
  - fingerprint:
      fields:
        - event.original
      tag: fingerprint_sign_on_5df148ab
      target_field: _id
      ignore_missing: true
  - script:
      tag: normalize_hyphenated_field_names_05d45bee
      lang: painless
      description: Rename any sign-on fields whose names contain a hyphen to use an underscore instead.
      if: ctx.workday?.sign_on instanceof Map
      source: |-
        def signon = ctx.workday.sign_on;
        for (def key : new ArrayList(signon.keySet())) {
          if (key.contains('-')) {
            signon.put(key.replace('-', '_'), signon.remove(key));
          }
        }
  - script:
      tag: convert_signon_boolean_flags_0d55e72e
      lang: painless
      description: Convert Workday 0/1 string flags to booleans.
      if: ctx.workday?.sign_on != null
      source: |-
        def flags = [
          'Account_Locked__Disabled_or_Expired',
          'Active_Session',
          'Device_is_Trusted',
          'Failed_Signon',
          'Forgotten_Password_Reset_Request',
          'Invalid_Credentials',
          'Invalid_Password',
          'Is_Device_Managed',
          'Password_Changed',
          'Signon',
          'Successful'
        ];
        def signon = ctx.workday.sign_on;
        for (def flag : flags) {
          if (signon.containsKey(flag) && signon.get(flag) instanceof String) {
            signon.put(flag, signon.get(flag) == '1');
          }
        }
  - set:
      field: workday.sign_on.Authentication_Type
      tag: set_authentication_type_from_signon_variant_f6194a55
      copy_from: workday.sign_on.Authentication_Type_for_Signon
      ignore_empty_value: true
      override: false
      if: ctx.workday?.sign_on?.Authentication_Type == null
  - date:
      field: workday.sign_on.Sign_on_Time
      tag: date_signon_time_7f2cae8e
      target_field: workday.sign_on.Sign_on_Time
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Sign_on_Time != null && ctx.workday.sign_on.Sign_on_Time != ''
      on_failure:
        - append:
            tag: append_error_message_9c019193
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_signon_time_910835cf
      copy_from: workday.sign_on.Sign_on_Time
      ignore_empty_value: true
  - set:
      field: event.start
      tag: set_event_start_from_signon_time_55e1a52a
      copy_from: workday.sign_on.Sign_on_Time
      ignore_empty_value: true
  - date:
      field: workday.sign_on.Session_Start
      tag: date_session_start_43916fb1
      target_field: workday.sign_on.Session_Start
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Session_Start != null && ctx.workday.sign_on.Session_Start != ''
      on_failure:
        - append:
            tag: append_error_message_3f6fb09e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_session_start_af8c5aae
      copy_from: workday.sign_on.Session_Start
      ignore_empty_value: true
      override: false
  - set:
      field: event.start
      tag: set_event_start_from_session_start_115c895d
      copy_from: workday.sign_on.Session_Start
      ignore_empty_value: true
      override: false
  - date:
      field: workday.sign_on.Signon_DateTime
      tag: date_signon_datetime_b80f5433
      target_field: workday.sign_on.Signon_DateTime
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Signon_DateTime != null && ctx.workday.sign_on.Signon_DateTime != ''
      on_failure:
        - append:
            tag: append_error_message_9e15f9ba
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_signon_datetime_12cdef5a
      copy_from: workday.sign_on.Signon_DateTime
      ignore_empty_value: true
      override: false
  - set:
      field: event.start
      tag: set_event_start_from_signon_datetime_47a82911
      copy_from: workday.sign_on.Signon_DateTime
      ignore_empty_value: true
      override: false
  - date:
      field: workday.sign_on.Session_End
      tag: date_session_end_11bca2ac
      target_field: workday.sign_on.Session_End
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Session_End != null && ctx.workday.sign_on.Session_End != ''
      on_failure:
        - append:
            tag: append_error_message_b285abd7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.end
      tag: set_event_end_from_session_end_e4ed25f7
      copy_from: workday.sign_on.Session_End
      ignore_empty_value: true
      override: false
  - date:
      field: workday.sign_on.Signoff_DateTime
      tag: date_signoff_datetime_b3571df8
      target_field: workday.sign_on.Signoff_DateTime
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Signoff_DateTime != null && ctx.workday.sign_on.Signoff_DateTime != ''
      on_failure:
        - append:
            tag: append_error_message_f976af10
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.end
      tag: set_event_end_from_signoff_datetime_f30d297c
      copy_from: workday.sign_on.Signoff_DateTime
      ignore_empty_value: true
      override: false
  - date:
      field: workday.sign_on.Signoff_Time
      tag: date_signoff_time_815399ad
      target_field: workday.sign_on.Signoff_Time
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Signoff_Time != null && ctx.workday.sign_on.Signoff_Time != ''
      on_failure:
        - append:
            tag: append_error_message_34ac18db
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.end
      tag: set_event_end_from_signoff_time_31f76229
      copy_from: workday.sign_on.Signoff_Time
      ignore_empty_value: true
  - date:
      field: workday.sign_on.Created_Moment
      tag: date_created_moment_33d157c1
      target_field: workday.sign_on.Created_Moment
      formats:
        - ISO8601
      if: ctx.workday?.sign_on?.Created_Moment != null && ctx.workday.sign_on.Created_Moment != ''
      on_failure:
        - append:
            tag: append_error_message_c6a4ac94
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.created
      tag: set_event_created_from_created_moment_927d521d
      copy_from: workday.sign_on.Created_Moment
      ignore_empty_value: true
  - set:
      field: user.name
      tag: set_user_name_from_username_99377007
      copy_from: workday.sign_on.userName
      ignore_empty_value: true
  - set:
      field: user.full_name
      tag: set_user_full_name_from_signon_worker_a806f570
      copy_from: workday.sign_on.Signon_Worker
      ignore_empty_value: true
  - set:
      field: user_agent.original
      tag: set_user_agent_original_529ae539
      copy_from: workday.sign_on.User_Agent
      ignore_empty_value: true
  - user_agent:
      field: user_agent.original
      tag: user_agent_parse_10108afd
      ignore_missing: true
  - set:
      field: host.os.name
      tag: set_host_os_name_from_operating_system_261111db
      copy_from: workday.sign_on.Operating_System
      ignore_empty_value: true
  - set:
      field: device.type
      tag: set_device_type_from_device_type_c4b42ca7
      copy_from: workday.sign_on.Device_Type
      ignore_empty_value: true
  - convert:
      field: workday.sign_on.Signon_IP_Address
      tag: convert_signon_ip_address_to_source_ip_f73f7518
      type: ip
      ignore_missing: true
      if: ctx.workday?.sign_on?.Signon_IP_Address != ''
      on_failure:
        - rename:
            field: workday.sign_on.Signon_IP_Address
            tag: rename_signon_ip_address_to_source_ip_efd4beb5
            target_field: workday.sign_on.signon_ip_address_string
            ignore_missing: true
  - set:
      field: source.ip
      tag: set_source_ip_from_signon_ip_address_8e9c59d1
      copy_from: workday.sign_on.Signon_IP_Address
      ignore_empty_value: true
  - convert:
      field: workday.sign_on.Session_IP_Address
      tag: convert_session_ip_address_to_source_ip_346a819a
      type: ip
      ignore_missing: true
      if: ctx.workday?.sign_on?.Session_IP_Address != ''
      on_failure:
        - rename:
            field: workday.sign_on.Session_IP_Address
            tag: rename_session_ip_address_to_source_ip_67145e4f
            target_field: workday.sign_on.session_ip_address_string
            ignore_missing: true
  - set:
      field: source.ip
      tag: set_source_ip_from_session_ip_address_2cc97ec4
      copy_from: workday.sign_on.Session_IP_Address
      ignore_empty_value: true
      override: false
  - geoip:
      field: source.ip
      tag: geoip_source_ip_to_source_geo_9a2d4d31
      target_field: source.geo
      ignore_missing: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      tag: geoip_source_ip_to_source_as_58199963
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      field: source.as.asn
      tag: rename_source_as_asn_168bbbaf
      target_field: source.as.number
      ignore_missing: true
  - rename:
      field: source.as.organization_name
      tag: rename_source_as_organization_name_aa06a00b
      target_field: source.as.organization.name
      ignore_missing: true
  - set:
      field: event.reason
      tag: set_event_reason_from_failure_message_6152359d
      copy_from: workday.sign_on.Authentication_Failure_Message
      ignore_empty_value: true
  - set:
      field: organization.name
      tag: set_organization_name_from_tenant_name_78a8f8d9
      copy_from: workday.sign_on.tenant_name
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_related_user_name_325195a6
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      tag: append_related_user_full_name_40705751
      value: '{{{user.full_name}}}'
      allow_duplicates: false
      if: ctx.user?.full_name != null
  - append:
      field: related.ip
      tag: append_related_ip_723473d3
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - set:
      field: user_agent.name
      tag: set_user_agent_name_from_browser_type_e4f9dee8
      copy_from: workday.sign_on.Browser_Type
      ignore_empty_value: true
      override: false
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_authentication_into_event_category_ba0aafdb
      value: authentication
      allow_duplicates: false
  - append:
      field: event.category
      tag: append_session_into_event_category_f4c8e8cc
      value: session
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_start_into_event_type_791564aa
      value: start
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_end_into_event_type_5cf2383b
      value: end
      allow_duplicates: false
      if: ctx.event?.end != null
  - set:
      field: event.action
      tag: set_event_action_5fa3d6f0
      value: user-signon
  - set:
      field: event.outcome
      tag: set_event_outcome_failure_987e8f5e
      value: failure
      if: ctx.workday?.sign_on?.Failed_Signon == true || ctx.event?.reason != null
  - set:
      field: event.outcome
      tag: set_event_outcome_success_05fc3345
      value: success
      if: ctx.event?.outcome == null
  - set:
      field: host.entity.attributes.managed
      tag: set_host_entity_managed_from_is_device_managed_25a3a6f3
      copy_from: workday.sign_on.Is_Device_Managed
      ignore_empty_value: true
      if: ctx.workday?.sign_on?.Is_Device_Managed instanceof Boolean
  - set:
      field: host.entity.lifecycle.last_activity
      tag: set_host_entity_last_activity_from_event_start_8b216eb7
      copy_from: event.start
      ignore_empty_value: true
  - set:
      field: host.entity.lifecycle.last_activity
      tag: set_host_entity_last_activity_from_event_end_55bccc30
      copy_from: event.end
      ignore_empty_value: true
      override: true
  - remove:
      field:
        - workday.sign_on.Session_Start
        - workday.sign_on.Session_End
        - workday.sign_on.Sign_on_Time
        - workday.sign_on.Created_Moment
        - workday.sign_on.userName
        - workday.sign_on.Signon_Worker
        - workday.sign_on.User_Agent
        - workday.sign_on.Operating_System
        - workday.sign_on.Device_Type
        - workday.sign_on.Signon_IP_Address
        - workday.sign_on.Session_IP_Address
        - workday.sign_on.Authentication_Failure_Message
        - workday.sign_on.tenant_name
        - workday.sign_on.Signon_DateTime
        - workday.sign_on.Signoff_DateTime
        - workday.sign_on.Signoff_Time
      tag: remove_custom_fields_mapped_with_ecs_fields_16ec3c77
      ignore_missing: true
  - script:
      tag: remove_null_values_809aa3ae
      lang: painless
      description: Remove null or empty values from the document.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      field: tags
      tag: append_tags_b6c08950
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_8c2b45ed
      field: error.message
      value: |-
        Processor '{{{_ingest.on_failure_processor_type}}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{_ingest.on_failure_processor_tag}}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      field: tags
      tag: append_tags_279d5a5c
      value: preserve_original_event
      allow_duplicates: false
