# newer versions go on top
- version: '0.5.2'
  changes:
    - description: Add a default ILM policy to the user data stream that rolls over the backing index every 26 hours and deletes data 7 days after rollover, preventing document conflicts from the stable Employee_ID fingerprint.
      type: enhancement
      link: https://github.com/elastic/integrations/issues/16444
- version: '0.5.1'
  changes:
    - description: Fix optional field access syntax in user data stream.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21203
- version: '0.5.0'
  changes:
    - description: Add support for user data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20753
- version: "0.4.0"
  changes:
    - description: Add tags to ingest pipeline processors and add `preserve_original_event` to pipeline-level `on_failure` handlers.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20574
- version: "0.3.2"
  changes:
    - description: Fix Sign-on RaaS collection by injecting From_Moment/To_Moment prompts and advancing a collection cursor.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20749
- version: "0.3.1"
  changes:
    - description: Set agentless deployment mode `release` field to `ga`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20463
- version: '0.3.0'
  changes:
    - description: Add support for sign_on data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20039
- version: '0.2.0'
  changes:
    - description: Fix token refresh after 401 by adding TTL-based expiry tracking.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20072
- version: '0.1.0'
  changes:
    - description: Add support for activity data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/19319
