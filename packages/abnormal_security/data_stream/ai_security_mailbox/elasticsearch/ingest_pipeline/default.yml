---
description: Pipeline for processing ai security mailbox logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.lastReported
        - json.campaignId
        - json.messageId
        - json.judgementStatus
      tag: fingerprint_ai_security_mailbox_7a175976
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - set:
      field: observer.vendor
      tag: set_observer_vendor_260c72c1
      value: Abnormal
  - set:
      field: observer.product
      tag: set_observer_product_c28c3312
      value: Inbound Email Security
  - rename:
      field: json.attackType
      tag: rename_attackType_40279134
      target_field: abnormal_security.ai_security_mailbox.attack.type
      ignore_missing: true
  - append:
      field: threat.tactic.name
      tag: append_abnormal_security_ai_security_mailbox_attack_type_into_threat_tactic_name_391a3abd
      value: '{{{abnormal_security.ai_security_mailbox.attack.type}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.attack?.type != null
  - rename:
      field: json.campaignId
      tag: rename_campaignId_050a706f
      target_field: abnormal_security.ai_security_mailbox.campaign_id
      ignore_missing: true
  - date:
      field: json.firstReported
      tag: date_firstReported_498b9004
      target_field: abnormal_security.ai_security_mailbox.first_reported
      formats:
        - ISO8601
      if: ctx.json?.firstReported != null && ctx.json.firstReported != ''
      on_failure:
        - append:
            tag: append_error_message_bcaaaee8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.fromName
      tag: rename_fromName_b11fc29d
      target_field: abnormal_security.ai_security_mailbox.from.name
      ignore_missing: true
  - grok:
      field: abnormal_security.ai_security_mailbox.from.name
      tag: grok_abnormal_security_ai_security_mailbox_from_name_e344dffc
      patterns:
        - '^%{EMAILADDRESS:user.email}$'
        - '^%{DATA:user.name}$'
      ignore_failure: true
  - append:
      field: related.user
      tag: append_abnormal_security_ai_security_mailbox_from_name_into_related_user_be0621bd
      value: '{{{abnormal_security.ai_security_mailbox.from.name}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.from?.name != null
  - rename:
      field: json.judgementStatus
      tag: rename_judgementStatus_46005e91
      target_field: abnormal_security.ai_security_mailbox.judgement_status
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_enrichment_186bfbbd
      value: enrichment
      if: ctx.abnormal_security?.ai_security_mailbox?.judgement_status != null && ['spam','malicious'].contains(ctx.abnormal_security.ai_security_mailbox.judgement_status.toLowerCase())
  - append:
      field: event.category
      tag: append_event_category_62ae7a21
      value: threat
      if: ctx.abnormal_security?.ai_security_mailbox?.judgement_status != null && ['spam','malicious'].contains(ctx.abnormal_security.ai_security_mailbox.judgement_status.toLowerCase())
  - append:
      field: event.type
      tag: append_event_type_046527ff
      value: indicator
      if: ctx.abnormal_security?.ai_security_mailbox?.judgement_status != null && ['spam','malicious'].contains(ctx.abnormal_security.ai_security_mailbox.judgement_status.toLowerCase())
  - set:
      field: threat.indicator.type
      tag: set_threat_indicator_type_to_email-addr_c56d8af3
      value: email-addr
      if: ctx.abnormal_security?.ai_security_mailbox?.judgement_status != null && ['spam','malicious'].contains(ctx.abnormal_security.ai_security_mailbox.judgement_status.toLowerCase())
  - rename:
      field: json.fromAddress
      tag: rename_fromAddress_10673ac2
      target_field: abnormal_security.ai_security_mailbox.from.address
      ignore_missing: true
  - append:
      field: email.from.address
      tag: append_abnormal_security_ai_security_mailbox_from_address_into_email_from_address_7d2667d8
      value: '{{{abnormal_security.ai_security_mailbox.from.address}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.from?.address != null
  - set:
      field: threat.indicator.email.address
      tag: set_threat_indicator_email_address_to_from_address_7690e775
      copy_from: abnormal_security.ai_security_mailbox.from.address
      if: ctx.abnormal_security?.ai_security_mailbox?.judgement_status != null && ['spam','malicious'].contains(ctx.abnormal_security.ai_security_mailbox.judgement_status.toLowerCase())
  - set:
      field: threat.indicator.name
      tag: set_threat_indicator_name_to_from_address_001daa0b
      copy_from: abnormal_security.ai_security_mailbox.from.address
      if: ctx.abnormal_security?.ai_security_mailbox?.judgement_status != null && ['spam','malicious'].contains(ctx.abnormal_security.ai_security_mailbox.judgement_status.toLowerCase())
  - append:
      field: related.user
      tag: append_abnormal_security_ai_security_mailbox_from_address_into_related_user_ad038b65
      value: '{{{abnormal_security.ai_security_mailbox.from.address}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.from?.address != null
  - date:
      field: json.lastReported
      tag: date_lastReported_3ec32487
      target_field: abnormal_security.ai_security_mailbox.last_reported
      formats:
        - ISO8601
      if: ctx.json?.lastReported != null && ctx.json.lastReported != ''
      on_failure:
        - append:
            tag: append_error_message_058e69a2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_ai_security_mailbox_last_reported_00e8a269
      copy_from: abnormal_security.ai_security_mailbox.last_reported
      ignore_empty_value: true
  - convert:
      field: json.messageId
      tag: convert_messageId_to_string_cab57758
      target_field: abnormal_security.ai_security_mailbox.message_id
      type: string
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_ai_security_mailbox_message_id_884594ea
      copy_from: abnormal_security.ai_security_mailbox.message_id
      ignore_empty_value: true
  - rename:
      field: json.overallStatus
      tag: rename_overallStatus_55edbc09
      target_field: abnormal_security.ai_security_mailbox.overall_status
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_from_ai_security_mailbox_overall_status_47c0e7d7
      copy_from: abnormal_security.ai_security_mailbox.overall_status
      if: ctx.abnormal_security?.ai_security_mailbox?.overall_status?.toLowerCase() != 'no action needed'
      ignore_empty_value: true
  - lowercase:
      field: event.action
      tag: lowercase_event_action_945f0fcf
      ignore_missing: true
  - rename:
      field: json.recipientAddress
      tag: rename_recipientAddress_ae5c4c39
      target_field: abnormal_security.ai_security_mailbox.recipient.address
      ignore_missing: true
  - append:
      field: email.to.address
      tag: append_abnormal_security_ai_security_mailbox_recipient_address_into_email_to_address_847e2cb3
      value: '{{{abnormal_security.ai_security_mailbox.recipient.address}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.recipient?.address != null
  - append:
      field: related.user
      tag: append_abnormal_security_ai_security_mailbox_recipient_address_into_related_user_0ace8b89
      value: '{{{abnormal_security.ai_security_mailbox.recipient.address}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.recipient?.address != null
  - rename:
      field: json.recipientName
      tag: rename_recipientName_2cc8186a
      target_field: abnormal_security.ai_security_mailbox.recipient.name
      ignore_missing: true
  - grok:
      field: abnormal_security.ai_security_mailbox.recipient.name
      tag: grok_abnormal_security_ai_security_mailbox_recipient_name_5a4d7539
      patterns:
        - '^%{EMAILADDRESS:destination.user.email}$'
        - '^%{DATA:destination.user.name}$'
      ignore_failure: true
  - append:
      field: related.user
      tag: append_abnormal_security_ai_security_mailbox_recipient_name_into_related_user_9bdab6f2
      value: '{{{abnormal_security.ai_security_mailbox.recipient.name}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.ai_security_mailbox?.recipient?.name != null
  - rename:
      field: json.subject
      tag: rename_subject_a493337a
      target_field: abnormal_security.ai_security_mailbox.subject
      ignore_missing: true
  - set:
      field: email.subject
      tag: set_email_subject_from_ai_security_mailbox_subject_479c7274
      copy_from: abnormal_security.ai_security_mailbox.subject
      ignore_empty_value: true
  - remove:
      field:
        - abnormal_security.ai_security_mailbox.attack.type
        - abnormal_security.ai_security_mailbox.from.address
        - abnormal_security.ai_security_mailbox.from.name
        - abnormal_security.ai_security_mailbox.last_reported
        - abnormal_security.ai_security_mailbox.message_id
        - abnormal_security.ai_security_mailbox.recipient.address
        - abnormal_security.ai_security_mailbox.recipient.name
        - abnormal_security.ai_security_mailbox.subject
        - abnormal_security.ai_security_mailbox.overall_status
      tag: remove_custom_duplicate_fields_c2df455b
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
