---
description: Pipeline for processing vendor case logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.firstObserved
        - json.lastModifiedTime
        - json.vendorCaseId
      tag: fingerprint_case_9add7f57
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.type
      tag: append_event_type_5eab37e6
      value: info
  - set:
      field: observer.vendor
      tag: set_observer_vendor_260c72c1
      value: Abnormal
  - set:
      field: observer.product
      tag: set_observer_product_c28c3312
      value: Inbound Email Security
  - date:
      field: json.lastModifiedTime
      tag: date_lastModifiedTime_5d5c7cb1
      target_field: abnormal_security.vendor_case.last_modified_time
      formats:
        - ISO8601
      if: ctx.json?.lastModifiedTime != null && ctx.json.lastModifiedTime != ''
      on_failure:
        - append:
            tag: append_error_message_eaeecf13
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.firstObservedTime
      tag: date_firstObservedTime_eb30b977
      target_field: abnormal_security.vendor_case.first_observed_time
      formats:
        - ISO8601
      if: ctx.json?.firstObservedTime != null && ctx.json.firstObservedTime != ''
      on_failure:
        - append:
            tag: append_error_message_b3134cd8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.start
      tag: set_event_start_from_vendor_case_first_observed_time_55f656f2
      copy_from: abnormal_security.vendor_case.first_observed_time
      ignore_empty_value: true
  - convert:
      field: json.vendorCaseId
      tag: convert_vendorCaseId_d6e0a4d0
      target_field: abnormal_security.vendor_case.id
      type: string
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_vendor_case_id_5afe7e0c
      copy_from: abnormal_security.vendor_case.id
      ignore_empty_value: true
  - remove:
      field:
        - abnormal_security.vendor_case.first_observed
        - abnormal_security.vendor_case.id
      tag: remove_custom_duplicate_fields_ea856037
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - rename:
      field: json.vendorDomain
      tag: rename_vendorDomain_to_domain_607ac6dd
      target_field: abnormal_security.vendor_case.domain
      ignore_missing: true
  - script:
      lang: painless
      description: Parse and append insights
      tag: parse_and_append_insights_2bdf9d23
      if: ctx.json != null && ctx.json.insights instanceof List
      params:
        keysToCopy:
          - highlight
          - description
      source: |-
        List keysToCopy = params.keysToCopy;
        List insights = new ArrayList();

        for (insight in ctx.json.insights) {
          Map new_insight = new HashMap();
          for (key in keysToCopy) {
            if (insight.containsKey(key)) {
              new_insight[key] = insight[key];
            }
          }
          insights.add(new_insight);
        }
        ctx.abnormal_security.vendor_case.insights = insights;


  - script:
      lang: painless
      description: Parse and append timeline
      tag: parse_and_append_timeline_c62b80b3
      if: ctx.json != null && ctx.json.timeline instanceof List
      params:
        keysToCopy:
          - eventTimestamp
          - senderAddress
          - recipientAddress
          - subject
          - markedAs
          - threatId
      source: >-
        List keysToCopy = params.keysToCopy;
        List timeline = new ArrayList();
        for (event in ctx.json.timeline) {
          Map new_event = new HashMap();
          for (key in keysToCopy) {
            if (event.containsKey(key)) {
             // Inline snake_case conversion logic
              StringBuilder sb = new StringBuilder();
              for (int i = 0; i < key.length(); i++) {
                char c = key.charAt(i);
                if (Character.isUpperCase(c)) {
                  if (i > 0) {
                    sb.append('_');
                  }
                  sb.append(Character.toLowerCase(c));
                } else {
                  sb.append(c);
                }
              }
              String snake_key = sb.toString();
              new_event[snake_key] = event[key];
            }
          }
          timeline.add(new_event);
        }
        ctx.abnormal_security.vendor_case.timeline = timeline;
  # clean up
  - remove:
      tag: remove_clean_up_e5a80934
      field:
        - json
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
