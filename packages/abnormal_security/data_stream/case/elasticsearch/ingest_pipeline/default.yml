---
description: Pipeline for processing case logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.firstObserved
        - json.customerVisibleTime
        - json.caseId
      tag: fingerprint_case_76835dd4
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.type
      tag: append_event_type_5eab37e6
      value: info
  - set:
      field: observer.vendor
      tag: set_observer_vendor_260c72c1
      value: Abnormal
  - set:
      field: observer.product
      tag: set_observer_product_c28c3312
      value: Inbound Email Security
  - rename:
      field: json.affectedEmployee
      tag: rename_affectedEmployee_08cc9505
      target_field: abnormal_security.case.affected_employee
      ignore_missing: true
  - grok:
      field: abnormal_security.case.affected_employee
      tag: grok_abnormal_security_case_affected_employee_a69b00dd
      patterns:
        - '^%{EMAILADDRESS:user.email}$'
        - '^%{DATA:user.name}$'
      ignore_failure: true
  - append:
      field: related.user
      tag: append_affected_employee_to_users_44f6fba2
      value: '{{{abnormal_security.case.affected_employee}}}'
      allow_duplicates: false
      if: ctx.abnormal_security?.case?.affected_employee != null
  - rename:
      field: json.analysis
      tag: rename_analysis_f0ac6263
      target_field: abnormal_security.case.analysis
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_to_analysis_089b65ea
      copy_from: abnormal_security.case.analysis
      ignore_empty_value: true
  - lowercase:
      field: event.action
      tag: lowercase_event_action_945f0fcf
      ignore_missing: true
  - date:
      field: json.customerVisibleTime
      tag: date_customerVisibleTime_1e5e3a57
      target_field: abnormal_security.case.customer_visible_time
      formats:
        - ISO8601
      if: ctx.json?.customerVisibleTime != null && ctx.json.customerVisibleTime != ''
      on_failure:
        - append:
            tag: append_error_message_48376a13
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.description
      tag: rename_description_225de3be
      target_field: abnormal_security.case.description
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_case_description_4fef2187
      copy_from: abnormal_security.case.description
      ignore_empty_value: true
  - date:
      field: json.firstObserved
      tag: date_firstObserved_a26f6b2a
      target_field: abnormal_security.case.first_observed
      formats:
        - ISO8601
      if: ctx.json?.firstObserved != null && ctx.json.firstObserved != ''
      on_failure:
        - append:
            tag: append_error_message_902bac9b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.start
      tag: set_event_start_from_case_first_observed_74ef7d69
      copy_from: abnormal_security.case.first_observed
      ignore_empty_value: true
  - convert:
      field: json.caseId
      tag: convert_caseId_c9b03973
      target_field: abnormal_security.case.id
      type: string
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_case_id_85e9fc7b
      copy_from: abnormal_security.case.id
      ignore_empty_value: true
  - rename:
      field: json.remediation_status
      tag: rename_remediation_status_77e4be71
      target_field: abnormal_security.case.remediation_status
      ignore_missing: true
  - rename:
      field: json.severity
      tag: rename_severity_92609f25
      target_field: abnormal_security.case.severity
      ignore_missing: true
  - rename:
      field: json.severity_level
      tag: rename_severity_level_f64ac5e6
      target_field: abnormal_security.case.severity_level
      ignore_missing: true
  - script:
      description: Set event severity based on severity level
      if: ctx.abnormal_security?.case?.severity_level != null
      tag: set_event_severity_from_case_severity_level_71852dff
      lang: painless
      params:
        NONE: 0
        LOW: 1
        MEDIUM: 2
        HIGH: 3
      source: |-
        if (ctx.event == null) {
          ctx.event = new HashMap();
        }
        ctx.event.severity = params.get(ctx.abnormal_security.case.severity_level);
      on_failure:
        - append:
            tag: append_error_message_73642d4c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.case_status
      tag: rename_case_status_5270470c
      target_field: abnormal_security.case.status
      ignore_missing: true
  - rename:
      field: json.threatIds
      tag: rename_threatIds_6c773d80
      target_field: abnormal_security.case.threat_ids
      ignore_missing: true
  - remove:
      field:
        - abnormal_security.case.description
        - abnormal_security.case.first_observed
        - abnormal_security.case.id
        - abnormal_security.case.analysis
      tag: remove_custom_duplicate_fields_b060e7b1
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
