type: logs
title: Auditd logs
streams:
  - input: auditd-logfile
    vars:
      - name: paths
        type: text
        title: Paths
        multi: true
        required: true
        show_user: true
        default:
          - /var/log/audit/audit.log*
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - auditd-log
      - name: ignore_older
        type: text
        title: Ignore events older than
        default: 72h
        required: false
        show_user: false
        description: >-
          If this option is specified, events that are older than the specified amount of time are ignored. Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`
        type: bool
        multi: false
        default: false
      - name: parser_mode
        type: select
        title: Parser mode
        description: >
          Controls how the Elastic Agent processes auditd log records. Requires Elastic Agent 9.6.0 or later; on older agents the setting is ignored.
          none: records are passed through as raw text and parsed by the ingest pipeline.
          parse: each record is parsed independently by the agent into auditd.log.* fields, skipping the ingest pipeline raw-parsing stages.
          coalesce: related records are grouped by sequence number into a single document whose field schema aligns with the auditd_manager integration. Note that coalesce mode emits auditd.data.* fields instead of auditd.log.* fields, so saved searches and custom rules targeting auditd.log.* will not match coalesced documents.
        required: true
        show_user: true
        options:
          - value: none
            text: none
          - value: parse
            text: parse
          - value: coalesce
            text: coalesce
        default: none
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.

    template_path: filestream.yml.hbs
    title: Auditd logs
    description: Collect Auditd logs
