---
description: Pipeline for parsing Linux auditd logs
processors:
  - set:
      tag: set_ecs_version_25a76f17
      field: ecs.version
      value: '8.17.0'
  - rename:
      tag: rename_message_to_event_original_2658458a
      field: message
      target_field: event.original
      ignore_failure: true
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_238aa738
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
  - pipeline:
      tag: pipeline_raw_da8a4728
      if: ctx.auditd?.log?.record_type == null
      name: '{{ IngestPipeline "raw" }}'
  - script:
      tag: script_process_fields
      lang: painless
      source: |
        String trimQuotes(def singleQuote, def doubleQuote, def v) {
            if (v.startsWith(singleQuote) || v.startsWith(doubleQuote)) {
                v = v.substring(1, v.length());
            }
            if (v.endsWith(singleQuote) || v.endsWith(doubleQuote)) {
                v = v.substring(0, v.length()-1);
            }
            return v;
        }

        boolean isHexAscii(String v) {
            def len = v.length();

            if (len == 0 || len % 2 != 0) {
                return false;
            }

            for (int i = 0 ; i < len ; i++) {
                if (Character.digit(v.charAt(i), 16) == -1) {
                    return false;
                }
            }
            return true;
        }

        String convertHexToString(String hex) {
            StringBuilder sb = new StringBuilder();
            boolean needed_encoding = false;

            for (int i=0; i < hex.length() - 1; i+=2) {
                int cp = Integer.parseInt(hex.substring(i, (i +2)), 16);
                if (cp < 33 || cp == 34 || cp == 127) {
                    needed_encoding = true;
                }
                if (cp < 32 || cp == 127) {
                    sb.append('^');
                    cp ^= 64;
                }
                sb.append((char)cp);
            }
            if (needed_encoding) {
                return sb.toString();
            }
            return hex;
        }

        Boolean convertStringToBoolean(String value) {
            value = value.toLowerCase();
            return value == "yes" || value == "true" || value == "1";
        }

        // processFieldValue processes the value for the field, and returns
        // the processed value if it is valid, otherwise null.
        def processFieldValue(String k, def v, def possibleHexKeys, def possibleBooleanKeys) {
            // Remove entries whose value is ?
            if (v == "?" || v == "(null)" || v == "") {
                return null;
            }

            // Convert hex values to ASCII.
            if (possibleHexKeys.contains(k) && isHexAscii(v)) {
                v = convertHexToString(v);
            }

            // Convert string values to boolean.
            if (possibleBooleanKeys.contains(k) && v instanceof String) {
                v = convertStringToBoolean(v);
            }

            // Trim quotes.
            if (v instanceof String) {
                v = trimQuotes("'", "\"", v);
            }

            // Convert arch.
            if (k == "arch" && v == "c000003e") {
                v = "x86_64";
            }

            return v;
        }

        def audit = ctx.auditd.get("log");
        Iterator entries = audit.entrySet().iterator();

        while (entries.hasNext()) {
            def e = entries.next();
            def k = e.getKey();
            def v = e.getValue();

            if (v instanceof List) {
                int j = 0;
                for (int i = 0; i < v.length; i++) {
                    v[j] = processFieldValue(k, v[i], params.possibleHexKeys, params.possibleBooleanKeys);
                    if (v[j] != null) {
                        j++;
                    }
                }
                if (j < v.length) {
                    if (j == 0) {
                        entries.remove();
                        continue;
                    }
                    audit.put(k, v.subList(0, j));
                }
                continue;
            }

            v = processFieldValue(k, v, params.possibleHexKeys, params.possibleBooleanKeys);
            if (v == null) {
                entries.remove();
            } else {
                audit.put(k, v);
            }
        }
      params:
        possibleHexKeys:
          - exe
          - cmd
          - data
          - path
          - comm
          - file
          - name
          - watch
          - cwd
          - acct
          - dir
          - vm
