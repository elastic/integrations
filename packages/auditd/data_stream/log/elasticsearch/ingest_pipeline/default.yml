          - operation
          - denied_mask
          - info
          - profile
          - requested_mask
          - old-rng
          - new-rng
          - ocomm
          - grp
          - new_group
          - invalid_context
          - sw
          - root_dir
          - proctitle
        possibleBooleanKeys:
          - success
          - key_enforce
