      tag: remove_gitlab_sidekiq_time_aceaf5fe
      field: gitlab.sidekiq.time
      ignore_missing: true
  - lowercase:
      tag: lowercase_gitlab_sidekiq_severity_67779461
      field: gitlab.sidekiq.severity
      ignore_missing: true
  - set:
      field: event.severity
      value: 0
