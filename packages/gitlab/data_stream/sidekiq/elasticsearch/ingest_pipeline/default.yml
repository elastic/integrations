      field: event.original
      tag: json_decoding_59bad716
      target_field: gitlab.sidekiq
  - append:
      tag: append_event_category_4595ee28
      field: event.category
      value: web
  - append:
      tag: append_event_type_8a66ccaa
      field: event.type
      value: info
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
