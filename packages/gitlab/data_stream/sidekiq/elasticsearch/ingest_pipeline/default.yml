---
description: Pipeline for processing sidekiq logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: 8.11.0
  - rename:
      field: message
      tag: rename_message_to_event_original_7f1de011
      target_field: event.original
      if: ctx.event?.original == null
      ignore_missing: true
  - remove:
      field: message
      ignore_missing: true
      tag: remove_message_319421e7
      if: ctx.event?.original != null
  - drop:
      tag: drop_logline_contains_header_s_a8ea228b
      if: ctx.event?.original?.startsWith('#')
      description: Drop if logline contains header(s), which startswith `#`.
