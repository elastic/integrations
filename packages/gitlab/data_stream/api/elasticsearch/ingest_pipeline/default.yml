---
description: Pipeline to process gitlab api logs
processors:
- set:
    field: ecs.version
    tag: set_ecs_version
    value: 8.11.0
- set:
    tag: set_event_kind_de80643c
    field: event.kind
    value: event
- rename:
    field: message
    target_field: event.original
    tag: rename_message
    ignore_missing: true
    if: ctx.event?.original == null
- remove:
    field: message
    ignore_missing: true
    tag: remove_message
    if: ctx.event?.original != null
- drop:
    tag: drop_3b0973c1
    if: ctx.event.original.startsWith('#')
    description: Drop if logline contains header(s), which startswith `#`.
- json:
    field: event.original
    tag: json_original
    target_field: gitlab.api
- date:
    field: gitlab.api.time
    target_field: '@timestamp'
    tag: date_parse_api_time
    formats:
      - ISO8601
    on_failure:
      - append:
          tag: append_error_message_82935f46
          field: error.message
          value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}'
- rename:
    tag: rename_gitlab_api_severity_to_log_level_0542d7c2
    field: gitlab.api.severity
    target_field: log.level
    ignore_missing: true
- script:
    tag: script_06fa2bd8
    lang: painless
    source: |-
      if (ctx.gitlab?.api?.duration_s != null) {
        ctx.event.duration = ctx.gitlab.api.duration_s * 1000000;
      }
    ignore_failure: true
- convert:
    field: gitlab.api.db
    type: double
    tag: convert_gitlab_api_db_to_double
    ignore_missing: true
    on_failure:
        - remove:
