---
description: Pipeline for processing pages logs
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_a7b1f822
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      ignore_missing: true
      tag: remove_message_319421e7
      if: ctx.event?.original != null
  - drop:
      tag: drop_logline_contains_header_s_a8ea228b
      if: ctx.event?.original?.startsWith('#')
      description: Drop if logline contains header(s), which startswith `#`.
  - append:
      tag: append_event_category_4595ee28
      field: event.category
      value: web
  - append:
      tag: append_event_type_8a66ccaa
      field: event.type
      value: info
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - json:
      field: event.original
      tag: json_decoding_a821cbc6
      target_field: gitlab.pages
  - date:
      field: gitlab.pages.time
      formats:
        - "ISO8601"
      target_field: "@timestamp"
      timezone: "UTC"
      tag: date_event_created_time_epoch_1337cac0
      on_failure:
        - append:
            tag: append_error_message_e1792017
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
      if: ctx.gitlab?.pages?.time != null
  - remove:
      tag: remove_gitlab_pages_time_72f76244
      field: gitlab.pages.time
      ignore_missing: true
  - lowercase:
      tag: lowercase_gitlab_pages_level_3f4d571e
      field: gitlab.pages.level
      ignore_missing: true
  - set:
      field: event.level
      value: 0
      if: ctx.gitlab?.pages?.level == 'emergency'
      tag: set_level_0_657815a8
  - set:
      field: event.level
      value: 1
      if: ctx.gitlab?.pages?.level == 'alert'
      tag: set_level_1_0bdbf45b
  - set:
      field: event.level
      value: 2
      if: ctx.gitlab?.pages?.level == 'critical'
      tag: set_level_2_d2bd182d
  - set:
      field: event.level
      value: 3
      if: ctx.gitlab?.pages?.level == 'error'
      tag: set_level_3_3981d0b9
  - set:
      field: event.level
      value: 4
      if: ctx.gitlab?.pages?.level == 'warn'
      tag: set_level_4_80f87cab
  - set:
      field: event.level
      value: 5
      if: ctx.gitlab?.pages?.level == 'notice'
      tag: set_level_5_bc58ce84
  - set:
      field: event.level
      value: 6
      if: ctx.gitlab?.pages?.level == 'info'
      tag: set_level_6_c883c9ab
  - set:
      field: event.level
      value: 7
      if: ctx.gitlab?.pages?.level == 'debug'
      tag: set_level_7_8b382d60
  - remove:
      tag: remove_gitlab_pages_level_10eff751
      field: gitlab.pages.level
      ignore_missing: true
  - rename:
      tag: rename_gitlab_pages_correlation_id_to_event_id_8a3648bc
      field: gitlab.pages.correlation_id
      target_field: event.id
      ignore_missing: true
  - rename:
      tag: rename_gitlab_pages_gid_to_group_id_f707521b
      field: gitlab.pages.gid
      target_field: group.id
      ignore_missing: true
  - convert:
      tag: convert_group_id_5cd2a948
      field: group.id
      type: string
      ignore_missing: true
  - rename:
      tag: rename_gitlab_pages_in-place_to_gitlab_pages_in_place_0d6e7620
      field: gitlab.pages.in-place
      target_field: gitlab.pages.in_place
      ignore_missing: true
  - rename:
      tag: rename_gitlab_pages_uid_to_user_id_d21ba517
      field: gitlab.pages.uid
      target_field: user.id
      ignore_missing: true
  - convert:
      tag: convert_user_id_c132c028
      field: user.id
      type: string
      ignore_missing: true
  - set:
      field: http.request.mime_type
      tag: set_http_request_mime_type_from_pages_content_type_50654460
      copy_from: gitlab.pages.content_type
      ignore_empty_value: true
  - convert:
      field: gitlab.pages.duration_ms
      tag: convert_duration_ms_to_float_c3718b18
      type: float
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_duration_ms_9d989e3f
            field: gitlab.pages.duration_ms
            ignore_missing: true
        - append:
            tag: append_error_message_1a743fd4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: host.name
      tag: set_host_name_from_pages_host_26d6ca77
      copy_from: gitlab.pages.host
      ignore_empty_value: true
  - rename:
      field: gitlab.pages.in-place
      tag: rename_in_place_3cb0f993
      target_field: gitlab.pages.in_place
      ignore_missing: true
  - convert:
      field: gitlab.pages.in-place
      tag: convert_in-place_to_boolean_5d808984
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_in_place_a42022cd
            field: gitlab.pages.in_place
            ignore_missing: true
        - append:
            tag: append_error_message_045c6b72
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: gitlab.pages.listen_addr.IP
      tag: rename_listen_addr_IP_d444ce9d
      target_field: gitlab.pages.listen_addr.ip
      ignore_missing: true
  - convert:
      field: gitlab.pages.listen_addr.ip
      tag: convert_listen_addr_ip_to_ip_47b6fb35
      type: ip
      ignore_missing: true
      if: ctx.gitlab?.pages?.listen_addr?.ip != ''
      on_failure:
        - remove:
            tag: remove_gitlab_pages_listen_addr_ip_d7643e04
            field: gitlab.pages.listen_addr.ip
            ignore_missing: true
        - append:
            tag: append_error_message_217d3616
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: server.ip
      tag: set_server_ip_from_pages_listen_addr_ip_07fd5796
      copy_from: gitlab.pages.listen_addr.ip
      ignore_empty_value: true
  - rename:
      field: gitlab.pages.listen_addr.Port
      tag: rename_listen_addr_Port_149ae945
      target_field: gitlab.pages.listen_addr.port
      ignore_missing: true
  - convert:
      field: gitlab.pages.listen_addr.port
      tag: convert_listen_addr_port_to_long_a88c1221
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_listen_addr_port_809d0f44
            field: gitlab.pages.listen_addr.port
            ignore_missing: true
        - append:
            tag: append_error_message_0197abe4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: server.port
      tag: set_server_port_from_pages_listen_addr_port_641ca6d1
      copy_from: gitlab.pages.listen_addr.port
      ignore_empty_value: true
  - set:
      field: http.request.method
      tag: set_http_request_method_from_pages_msg_53180516
      copy_from: gitlab.pages.method
      ignore_empty_value: true
  - convert:
      field: gitlab.pages.pages_https
      tag: convert_pages_https_to_boolean_9fdcf2fc
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_pages_https_2d5941ab
            field: gitlab.pages.pages_https
            ignore_missing: true
        - append:
            tag: append_error_message_78547f8d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - dissect:
      field: gitlab.pages.proto
      tag: dissect_pages_proto_315e83fc
      pattern: "%{}/%{http.version}"
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_f32fe504
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: gitlab.pages.read_bytes
      tag: convert_read_bytes_to_long_eb4c6fad
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_read_bytes_5510939d
            field: gitlab.pages.read_bytes
            ignore_missing: true
        - append:
            tag: append_error_message_d610a729
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: server.bytes
      tag: set_server_bytes_from_pages_read_bytes_7d844481
      copy_from: gitlab.pages.read_bytes
      ignore_empty_value: true
  - set:
      field: http.request.referrer
      tag: set_http_request_referrer_from_pages_referrer_ce7d61cd
      copy_from: gitlab.pages.referrer
      ignore_empty_value: true
  - dissect:
      field: remote_addr
      tag: dissect_remote_addr_7794c57c
      pattern: '%{}:%{POSTINT:source.port}'
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_4d109d0a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.address
      tag: set_source_address_from_pages_remote_addr_a4b07cff
      copy_from: gitlab.pages.remote_addr
      ignore_empty_value: true
  - convert:
      field: gitlab.pages.remote_ip
      tag: convert_remote_ip_to_ip_a7cd03ab
      type: ip
      ignore_missing: true
      if: ctx.gitlab?.pages?.remote_ip != ''
      on_failure:
        - remove:
            tag: remove_gitlab_pages_remote_ip_be681658
            field: gitlab.pages.remote_ip
            ignore_missing: true
        - append:
            tag: append_error_message_919ae0b2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip_from_pages_remote_ip_7b6ef91e
      copy_from: gitlab.pages.remote_ip
      ignore_empty_value: true
  - convert:
      field: gitlab.pages.status
      tag: convert_status_to_long_40ace0c0
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_status_3182df65
            field: gitlab.pages.status
            ignore_missing: true
        - append:
            tag: append_error_message_0acdebbb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: http.response.status_code
      tag: set_http_response_status_code_from_pages_status_20621a88
      copy_from: gitlab.pages.status
      ignore_empty_value: true
  - convert:
      field: gitlab.pages.ttfb_ms
      tag: convert_ttfb_ms_to_long_3cc9f14e
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_ttfb_ms_9ab64e43
            field: gitlab.pages.ttfb_ms
            ignore_missing: true
        - append:
            tag: append_error_message_14d99ae8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: gitlab.pages.written_bytes
      tag: convert_written_bytes_to_long_afae28fa
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_gitlab_pages_written_bytes_289535a3
            field: gitlab.pages.written_bytes
            ignore_missing: true
        - append:
            tag: append_error_message_b3661176
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: client.bytes
      tag: set_client_bytes_from_pages_written_bytes_31d1c695
      copy_from: gitlab.pages.written_bytes
      ignore_empty_value: true
  - rename:
      tag: rename_gitlab_pages_msg_to_message_a7ee9c5f
      field: gitlab.pages.msg
      target_field: message
      ignore_missing: true
  - append:
      tag: append_related_user_7f407fef
      field: related.user
      value: '{{{user.id}}}'
      if: ctx.user?.id != null
      allow_duplicates: false
  - script:
      tag: script_to_drop_null_values_50c8d6aa
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object o) {
          if (o == null || o == '') {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
  - append:
      tag: append_event_kind_d2f25e35
      field: event.kind
      value: pipeline_error
      allow_duplicates: false
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_0841b325
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
