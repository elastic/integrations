- script:
    tag: kv_params_43e0fa24
    lang: painless
    description: Move the objects in `params.value` to their own key value pairs
    if: ctx.gitlab?.production?.params != null
    source: |
      Map map = [:];
      for (item in ctx.gitlab.production.params) {
        def key = item.key;
        def value = item.value;
        if (key == "variables" && value instanceof Map) {
          map[key] = Json.dump(value);
        } else {
          map[key] = value;
        }
      }
      ctx.gitlab.production.params = map;
- script:
    tag: convert_graphql_variables_7b5f244c
    lang: painless
    description: Convert graphql variables field if contains an object
    if: >
      ctx.gitlab?.production?.graphql != null
    source: |
      if (ctx.gitlab?.production?.graphql instanceof List) {
        for (int i = 0; i < ctx.gitlab.production.graphql.size(); i++) {
          def item = ctx.gitlab.production.graphql[i];
          if (item.containsKey("variables") && item.variables instanceof Map) {
            item.variables = Json.dump(item.variables);
          }
        }
      } else if (ctx.gitlab.production.graphql instanceof Map) {
        def vars = ctx.gitlab.production.graphql.variables;
        if (vars instanceof Map) {
          ctx.gitlab.production.graphql.variables = Json.dump(vars);
        }
      }
- script:
