schemaVersion: 1
id: .abuseipdb-epr
version: 1.1.0
metadata:
  displayName: AbuseIPDB (EPR PoC)
  description: IP reputation checking with optional verbose reports and abuse reporting
  minimumLicense: gold
  isTechnicalPreview: true
  supportedFeatureIds:
    - workflows
    - agentBuilder
config:
  type: object
  additionalProperties: false
  required:
    - baseUrl
  properties:
    baseUrl:
      type: string
      format: uri
      default: https://api.abuseipdb.com
      description: AbuseIPDB API base URL
      meta:
        label: Base URL
        placeholder: https://api.abuseipdb.com
        helpText: The AbuseIPDB API base URL.
        validate:
          allowedHosts: true
auth:
  types:
    - type: api_key_header
      defaults:
        headerField: Key
      overrides:
        meta:
          Key:
            label: API key
            placeholder: local-poc-key
actions:
  checkIp:
    description: Check the reputation of an IPv4 address.
    isTool: true
    scope: read
    input:
      type: object
      additionalProperties: false
      required:
        - ipAddress
      properties:
        ipAddress:
          type: string
          format: ipv4
          description: IPv4 address to check
        maxAgeInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: Maximum report age in days
        verbose:
          type: boolean
          default: false
          description: Include reports from countries outside the top-level summary
        someOtherParam:
          type: string
          description: Just to demonstrate how it all connects
    request:
      method: GET
      baseUrl: "{{ config.baseUrl }}"
      path: /api/v2/check
      query:
        ipAddress: "{{ input.ipAddress }}"
        maxAgeInDays: "{{ input.maxAgeInDays }}"
        verbose: "{{ input.verbose }}"
        someOtherParam: "{{ input.someOtherParam? }}"
      response:
        dataPath: data
  reportIp:
    description: Report an IPv4 address with one or more abuse categories.
    isTool: true
    scope: write
    input:
      type: object
      additionalProperties: false
      required:
        - ip
        - categories
      properties:
        ip:
          type: string
          format: ipv4
        categories:
          type: array
          items:
            type: integer
        comment:
          type: string
          maxLength: 1024
    request:
      method: POST
      baseUrl: "{{ config.baseUrl }}"
      path: /api/v2/report
      bodyType: form
      body:
        ip: "{{ input.ip }}"
        categories: "{{ input.categories }}"
        comment: "{{ input.comment? }}"
      response:
        dataPath: data
test:
  description: Verify the API key with a bounded IP check.
  request:
    method: GET
    baseUrl: "{{ config.baseUrl }}"
    path: /api/v2/check
    query:
      ipAddress: 8.8.8.8
      maxAgeInDays: 1
      verbose: false
    response:
      dataPath: data
