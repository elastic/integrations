        if (parts != null && parts.length > 0) {
          Map map = new HashMap();
          for (int i = 0; i < parts.length; i++) {
            map.put(parts[i]['id'], parts[i]['value'])
          }
          ctx.tenable_sc.plugin.vpr.context = map;
          ctx.tenable_sc.plugin.vpr.context._original = parts;
