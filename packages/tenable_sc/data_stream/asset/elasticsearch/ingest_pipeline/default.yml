---
description: Pipeline for Tenable.sc asset logs.
processors:
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_facc4822
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_93ceb325
      field: event.original
      target_field: json
      ignore_failure: true
  - date:
      tag: date_json_timestamp_068c02b7
      field: json.timestamp
      if: ctx.json?.timestamp != null
      formats:
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_0293188d
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_type_8bf4a5be
      field: event.type
      value: [info]
  - set:
      tag: set_event_kind_c3139286
      field: event.kind
      value: state
  - set:
      tag: set_event_category_14959316
      field: event.category
      value: [host]
  - script:
      tag: script_fe5c1a68
      if: ctx.json?.uniqueness != null && ctx.json.uniqueness != ''
      lang: painless
      source: >-
        def keys = ctx.json.uniqueness.toString().splitOnToken(',');
        ctx.tenable_sc = new HashMap();
        ctx.tenable_sc.asset = new HashMap();
        String uniqueKey = '';
        if (keys.length > 0) {
          for (int i = 0; i < keys.length; i++) {
            if(keys[i] == 'repositoryID') {
              uniqueKey = uniqueKey + ctx.json.repository.id + (i == keys.length - 1 ? '' : '_');
            } else {
              uniqueKey = uniqueKey + ctx.json[keys[i]] + (i == keys.length - 1 ? '' : '_');
            }
          }
        }
        ctx.tenable_sc.asset.custom_hash = uniqueKey;
  - fingerprint:
      tag: fingerprint_247c8c1b
      fields:
        - tenable_sc.asset.custom_hash
      target_field: tenable_sc.asset.custom_hash
      method: SHA-256
      ignore_missing: true
  - convert:
      tag: convert_json_ip_to_tenable_sc_asset_ip_0a1cb325
      field: json.ip
      target_field: tenable_sc.asset.ip
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_c609a9e7
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_47975e59
      field: related.ip
      value: '{{{tenable_sc.asset.ip}}}'
      if: ctx.tenable_sc?.asset?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_host_ip_ecf513ba
      field: host.ip
      value: '{{{tenable_sc.asset.ip}}}'
      if: ctx.tenable_sc?.asset?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_uuid_to_tenable_sc_asset_uuid_68637297
      field: json.uuid
      target_field: tenable_sc.asset.uuid
      ignore_missing: true
  - convert:
      tag: convert_json_score_to_tenable_sc_asset_score_7cf0df4c
      field: json.score
      target_field: tenable_sc.asset.score
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_c43cb40d
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_total_to_tenable_sc_asset_total_31e1d3bc
      field: json.total
      target_field: tenable_sc.asset.total
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_5faf4da0
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_severityInfo_to_tenable_sc_asset_severity_info_74bb7597
      field: json.severityInfo
      target_field: tenable_sc.asset.severity.info
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_5082da74
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_severityLow_to_tenable_sc_asset_severity_low_9a280b90
      field: json.severityLow
      target_field: tenable_sc.asset.severity.low
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_70c10066
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_severityMedium_to_tenable_sc_asset_severity_medium_5c99c6f1
      field: json.severityMedium
      target_field: tenable_sc.asset.severity.medium
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_83d908be
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_severityHigh_to_tenable_sc_asset_severity_high_7fb908bc
      field: json.severityHigh
      target_field: tenable_sc.asset.severity.high
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_7133cd8c
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_severityCritical_to_tenable_sc_asset_severity_critical_48bf88d8
      field: json.severityCritical
      target_field: tenable_sc.asset.severity.critical
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_fd4ef9a2
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - gsub:
      tag: gsub_json_macAddress_7dd1094b
      field: json.macAddress
      pattern: '[-:.]'
      replacement: '-'
      ignore_missing: true
  - uppercase:
      tag: uppercase_json_macAddress_21796b6a
      field: json.macAddress
      ignore_missing: true
  - append:
      tag: append_host_mac_40386401
      if: ctx.json?.macAddress != null
      field: host.mac
      value: '{{{json.macAddress}}}'
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_macAddress_to_tenable_sc_asset_mac_971d11f1
      field: json.macAddress
      target_field: tenable_sc.asset.mac
      ignore_missing: true
  - rename:
      tag: rename_json_policyName_to_tenable_sc_asset_policy_name_d22ea39b
      field: json.policyName
      target_field: tenable_sc.asset.policy.name
      ignore_missing: true
  - rename:
      tag: rename_json_pluginSet_to_tenable_sc_asset_plugin_set_c2e4389d
      field: json.pluginSet
      target_field: tenable_sc.asset.plugin_set
      ignore_missing: true
  - set:
      tag: set_tenable_sc_asset_netbios_name_23fc73d6
      field: tenable_sc.asset.netbios.name
      copy_from: json.netbiosName
      ignore_failure: true
  - set:
      tag: set_host_hostname_43388377
      field: host.hostname
      copy_from: json.dnsName
      ignore_failure: true
  - set:
      tag: set_tenable_sc_asset_dns_name_92a3b74e
      field: tenable_sc.asset.dns.name
      copy_from: json.dnsName
      ignore_failure: true
  - script:
      tag: script_befb7a8a
      lang: painless
      if: ctx.json?.dnsName != null && ctx.json.dnsName != ''
      source: |
        def domain = '';
        def nameArray = ctx.json.dnsName.toString().splitOnToken('.');
        if (nameArray?.length != null && nameArray.length > 0) {
          for (int i = 1; i < nameArray.length; i++) {
            domain += nameArray[i] + (i < nameArray.length - 1 ? '.' : '');
          }
          ctx.host.name = nameArray[0];
          ctx.host.domain = domain;
        }
  - append:
      tag: append_related_hosts_abea24b8
      field: related.hosts
      value: '{{{host.hostname}}}'
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hosts_1f2f5357
      field: related.hosts
      value: '{{{host.name}}}'
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hosts_e5e67e4f
      field: related.hosts
      value: '{{{json.netbiosName}}}'
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_osCPE_to_tenable_sc_asset_os_cpe_025c5390
      field: json.osCPE
      target_field: tenable_sc.asset.os_cpe
      ignore_missing: true
  - rename:
      tag: rename_json_biosGUID_to_tenable_sc_asset_bios_guid_f384b7bf
      field: json.biosGUID
      target_field: tenable_sc.asset.bios.guid
      ignore_missing: true
  - rename:
      tag: rename_json_tpmID_to_tenable_sc_asset_tpm_id_96cd1f7e
      field: json.tpmID
      target_field: tenable_sc.asset.tpm.id
      ignore_missing: true
  - rename:
      tag: rename_json_mcafeeGUID_to_tenable_sc_asset_mcafee_guid_c32dbf89
      field: json.mcafeeGUID
      target_field: tenable_sc.asset.mcafee.guid
      ignore_missing: true
  - rename:
      tag: rename_json_lastAuthRun_to_tenable_sc_asset_last_auth_run_e131bd88
      field: json.lastAuthRun
      target_field: tenable_sc.asset.last_auth_run
      ignore_missing: true
  - rename:
      tag: rename_json_lastUnauthRun_to_tenable_sc_asset_last_unauth_run_aeaa4889
      field: json.lastUnauthRun
      target_field: tenable_sc.asset.last_unauth_run
      ignore_missing: true
  - rename:
      tag: rename_json_hostUniqueness_to_tenable_sc_asset_host_uniqueness_3462a349
      field: json.hostUniqueness
      target_field: tenable_sc.asset.host_uniqueness
      ignore_missing: true
  - rename:
      tag: rename_json_uniqueness_to_tenable_sc_asset_uniqueness_e0e44144
      field: json.uniqueness
      target_field: tenable_sc.asset.uniqueness
      ignore_missing: true
  - rename:
      tag: rename_json_repository_id_to_tenable_sc_asset_repository_id_582d8a5b
      field: json.repository.id
      target_field: tenable_sc.asset.repository.id
      ignore_missing: true
  - rename:
      tag: rename_json_repository_name_to_tenable_sc_asset_repository_name_6b4d377f
      field: json.repository.name
      target_field: tenable_sc.asset.repository.name
      ignore_missing: true
  - rename:
      tag: rename_json_repository_description_to_tenable_sc_asset_repository_description_7f40f0af
      field: json.repository.description
      target_field: tenable_sc.asset.repository.description
      ignore_missing: true
  - rename:
      tag: rename_json_repository_sciID_to_tenable_sc_asset_repository_sci_id_8cff2096
      field: json.repository.sciID
      target_field: tenable_sc.asset.repository.sci.id
      ignore_missing: true
  - rename:
      tag: rename_json_repository_dataFormat_to_tenable_sc_asset_repository_data_format_51ebadb6
      field: json.repository.dataFormat
      target_field: tenable_sc.asset.repository.data_format
      ignore_missing: true
  - script:
      tag: script_13bd6353
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean drop(Object o) {
          if (o == null || o == '') {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
  - remove:
      tag: remove_json_94dc55cd
      field: json
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
