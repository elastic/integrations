---
description: Map parsed Microsoft Foundry logs to ECS gen_ai fields.
processors:
  - set:
      tag: set_gen_ai_provider_name
      field: gen_ai.provider.name
      value: azure.ai.inference
  - script:
      tag: script_set_event_action
      description: >-
        Keep the Foundry operation name in event.action. Gateway logs store the
        chat operation in properties.operation_id.
      lang: painless
      source: |
        def op = null;
        if (ctx.azure?.ai_foundry?.category == 'GatewayLogs') {
          op = ctx.azure?.ai_foundry?.properties?.operation_id;
        } else if (ctx.azure?.ai_foundry?.category == 'RequestResponse') {
          op = ctx.azure?.ai_foundry?.operation_name;
        }
        if (op instanceof String && op != '') {
          if (!(ctx.event instanceof Map)) { ctx.event = new HashMap(); }
          ctx.event.action = op;
        }
  - script:
      tag: script_set_gen_ai_operation_name
      description: Map the Azure operation to an OTel gen_ai.operation.name value. Unknown operations leave the field unset.
      lang: painless
      if: ctx.event?.action instanceof String
      params:
        operations:
          ChatCompletions_Create: chat
          ChatCompletions: chat
          getChatCompletions: chat
          Completions_Create: text_completion
          Embeddings_Create: embeddings
      source: |
        def op = params.operations.get(ctx.event.action);
        if (op != null) {
          ctx.gen_ai = ctx.gen_ai ?: new HashMap();
          ctx.gen_ai.operation = ['name': op];
        }
  - set:
      tag: set_gen_ai_request_model_from_body
      field: gen_ai.request.model
      copy_from: azure.ai_foundry.properties.backend_request_body.model
      ignore_empty_value: true
      if: ctx.azure?.ai_foundry?.properties?.backend_request_body?.model != null
  - set:
      tag: set_gen_ai_request_model_from_deployment
      field: gen_ai.request.model
      copy_from: azure.ai_foundry.properties.model_deployment_name
      ignore_empty_value: true
      if: ctx.gen_ai?.request?.model == null && ctx.azure?.ai_foundry?.properties?.model_deployment_name != null
  - set:
      tag: set_gen_ai_response_model_from_body
      field: gen_ai.response.model
      copy_from: azure.ai_foundry.properties.backend_response_body.model
      ignore_empty_value: true
      if: ctx.azure?.ai_foundry?.properties?.backend_response_body?.model != null
  - set:
      tag: set_gen_ai_response_model_from_model_name
      field: gen_ai.response.model
      copy_from: azure.ai_foundry.properties.model_name
      ignore_empty_value: true
      if: ctx.gen_ai?.response?.model == null && ctx.azure?.ai_foundry?.properties?.model_name != null
  - set:
      tag: set_gen_ai_response_id
      field: gen_ai.response.id
      copy_from: azure.ai_foundry.properties.backend_response_body.id
      ignore_empty_value: true
      if: ctx.azure?.ai_foundry?.properties?.backend_response_body?.id != null
  - convert:
      tag: convert_gen_ai_usage_input_tokens
      field: azure.ai_foundry.properties.backend_response_body.usage.input_tokens
      target_field: gen_ai.usage.input_tokens
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_azure_ai_foundry_properties_backend_response_body_usage_input_tokens_on_convert_failure
            field: azure.ai_foundry.properties.backend_response_body.usage.input_tokens
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_usage_output_tokens
      field: azure.ai_foundry.properties.backend_response_body.usage.output_tokens
      target_field: gen_ai.usage.output_tokens
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_azure_ai_foundry_properties_backend_response_body_usage_output_tokens_on_convert_failure
            field: azure.ai_foundry.properties.backend_response_body.usage.output_tokens
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_temp_request
      field: _temp.request
      copy_from: azure.ai_foundry.properties.backend_request_body
      ignore_empty_value: true
      if: ctx.azure?.ai_foundry?.properties?.backend_request_body instanceof Map
  - set:
      tag: set_temp_response
      field: _temp.response
      copy_from: azure.ai_foundry.properties.backend_response_body
      ignore_empty_value: true
      if: ctx.azure?.ai_foundry?.properties?.backend_response_body instanceof Map
  - convert:
      tag: convert_gen_ai_request_max_tokens
      field: azure.ai_foundry.properties.backend_request_body.max_completion_tokens
      target_field: gen_ai.request.max_tokens
      type: long
      ignore_missing: true
      if: ctx.azure?.ai_foundry?.properties?.backend_request_body?.max_completion_tokens != null
      on_failure:
        - remove:
            tag: remove_backend_request_body_max_completion_tokens_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.max_completion_tokens
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_max_tokens_legacy
      field: azure.ai_foundry.properties.backend_request_body.max_tokens
      target_field: gen_ai.request.max_tokens
      type: long
      ignore_missing: true
      if: ctx.gen_ai?.request?.max_tokens == null && ctx.azure?.ai_foundry?.properties?.backend_request_body?.max_tokens != null
      on_failure:
        - remove:
            tag: remove_backend_request_body_max_tokens_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.max_tokens
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_temperature
      field: azure.ai_foundry.properties.backend_request_body.temperature
      target_field: gen_ai.request.temperature
      type: double
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_backend_request_body_temperature_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.temperature
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_top_p
      field: azure.ai_foundry.properties.backend_request_body.top_p
      target_field: gen_ai.request.top_p
      type: double
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_backend_request_body_top_p_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.top_p
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_frequency_penalty
      field: azure.ai_foundry.properties.backend_request_body.frequency_penalty
      target_field: gen_ai.request.frequency_penalty
      type: double
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_backend_request_body_frequency_penalty_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.frequency_penalty
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_presence_penalty
      field: azure.ai_foundry.properties.backend_request_body.presence_penalty
      target_field: gen_ai.request.presence_penalty
      type: double
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_backend_request_body_presence_penalty_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.presence_penalty
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_seed
      field: azure.ai_foundry.properties.backend_request_body.seed
      target_field: gen_ai.request.seed
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_backend_request_body_seed_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.seed
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_request_choice_count
      field: azure.ai_foundry.properties.backend_request_body.n
      target_field: gen_ai.request.choice.count
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_backend_request_body_n_on_convert_failure
            field: azure.ai_foundry.properties.backend_request_body.n
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_set_gen_ai_request_stop_sequences
      description: Copy the OpenAI stop value to gen_ai.request.stop_sequences. A string becomes a one-element array.
      lang: painless
      if: ctx._temp?.request?.stop != null
      source: |
        def s = ctx._temp.request.stop;
        List out = s instanceof List ? new ArrayList(s) : [s.toString()];
        if (!out.isEmpty()) {
          ctx.gen_ai = ctx.gen_ai ?: new HashMap();
          ctx.gen_ai.request = ctx.gen_ai.request ?: new HashMap();
          ctx.gen_ai.request.stop_sequences = out;
        }
  - script:
      tag: script_set_gen_ai_request_encoding_formats
      description: Copy an embeddings encoding_format value to gen_ai.request.encoding_formats.
      lang: painless
      if: ctx._temp?.request?.encoding_format != null
      source: |
        def s = ctx._temp.request.encoding_format;
        List out = s instanceof List ? new ArrayList(s) : [s.toString()];
        if (!out.isEmpty()) {
          ctx.gen_ai = ctx.gen_ai ?: new HashMap();
          ctx.gen_ai.request = ctx.gen_ai.request ?: new HashMap();
          ctx.gen_ai.request.encoding_formats = out;
        }
  - script:
      tag: script_normalize_openai_chat_messages
      description: Normalize OpenAI Chat Completions messages and choices into the OTel GenAI message shape.
      lang: painless
      if: ctx._temp?.request?.messages instanceof List || ctx._temp?.response?.choices instanceof List
      source: |
        Object decode(def v) {
          if (v instanceof String) {
            try { return Json.load(v); } catch (Exception e) { return [['type': 'text', 'content': v]]; }
          }
          return v;
        }
        List textParts(def content) {
          List out = new ArrayList();
          if (content instanceof String) {
            if (!content.isEmpty()) { out.add(['type': 'text', 'content': content]); }
          } else if (content instanceof List) {
            for (def c : content) {
              if (!(c instanceof Map)) { continue; }
              if (c.type == 'text' && c.text != null) {
                out.add(['type': 'text', 'content': c.text]);
              } else if (c.type == 'reasoning' && c.content != null) {
                out.add(['type': 'reasoning', 'content': c.content]);
              } else if (c.type != null) {
                out.add(['type': c.type]);
              }
            }
          }
          return out;
        }
        Map toolCall(def tc) {
          Map p = ['type': 'tool_call', 'id': tc.id, 'name': tc.function?.name];
          def a = decode(tc.function?.arguments);
          if (a != null) { p.arguments = a; }
          return p;
        }
        Map g = ctx.gen_ai ?: new HashMap();
        List input = new ArrayList();
        for (def m : ctx._temp?.request?.messages ?: []) {
          if (!(m instanceof Map) || m.role == null) { continue; }
          List parts;
          if (m.role == 'tool') {
            parts = [['type': 'tool_call_response', 'id': m.tool_call_id, 'response': decode(m.content)]];
          } else {
            parts = textParts(m.content);
            for (def tc : m.tool_calls ?: []) { parts.add(toolCall(tc)); }
          }
          input.add(['role': m.role, 'parts': parts]);
        }
        if (!input.isEmpty()) { g.input = ['messages': input]; }
        List defs = new ArrayList();
        for (def t : ctx._temp?.request?.tools ?: []) {
          if (!(t instanceof Map)) { continue; }
          Map fn = t.function instanceof Map ? t.function : t;
          if (fn.name == null) { continue; }
          Map d = ['type': 'function', 'name': fn.name];
          if (fn.description != null) { d.description = fn.description; }
          if (fn.parameters != null) { d.parameters = fn.parameters; }
          defs.add(d);
        }
        if (!defs.isEmpty()) { g.tool = ['definitions': defs]; }
        List output = new ArrayList();
        List reasons = new ArrayList();
        List toolNames = new ArrayList();
        List toolIds = new ArrayList();
        Map normalized = ['tool_calls': 'tool_call', 'function_call': 'tool_call'];
        for (def ch : ctx._temp?.response?.choices ?: []) {
          if (!(ch instanceof Map)) { continue; }
          Map msg = ch.message instanceof Map ? ch.message : new HashMap();
          List parts = textParts(msg.content);
          for (def tc : msg.tool_calls ?: []) {
            parts.add(toolCall(tc));
            if (tc.function?.name != null) { toolNames.add(tc.function.name); }
            if (tc.id != null) { toolIds.add(tc.id); }
          }
          Map om = ['role': msg.role ?: 'assistant', 'parts': parts];
          if (ch.finish_reason != null) {
            om.finish_reason = normalized.getOrDefault(ch.finish_reason, ch.finish_reason);
            reasons.add(ch.finish_reason);
          }
          output.add(om);
        }
        if (!output.isEmpty()) { g.output = ['messages': output]; }
        if (!reasons.isEmpty()) {
          g.response = g.response ?: new HashMap();
          g.response.finish_reasons = reasons;
        }
        if (!toolNames.isEmpty()) {
          g.tool = g.tool instanceof Map ? g.tool : new HashMap();
          g.tool.name = toolNames;
          List toolTypes = new ArrayList();
          for (def n : toolNames) { toolTypes.add('function'); }
          g.tool.type = toolTypes;
          if (toolIds.size() == toolNames.size()) { g.tool.call = ['id': toolIds]; }
        }
        if (!g.isEmpty()) { ctx.gen_ai = g; }
  - script:
      tag: script_set_gen_ai_output_type
      description: Map response_format.type to the OTel gen_ai.output.type value.
      lang: painless
      if: ctx._temp?.request?.response_format?.type instanceof String
      source: |
        def t = ctx._temp.request.response_format.type;
        def mapped = null;
        if (t == 'json_object' || t == 'json_schema') { mapped = 'json'; }
        else if (t == 'text') { mapped = 'text'; }
        if (mapped != null) {
          ctx.gen_ai = ctx.gen_ai ?: new HashMap();
          ctx.gen_ai.output = ctx.gen_ai.output ?: new HashMap();
          ctx.gen_ai.output.type = mapped;
        }
  - remove:
      tag: remove_temp
      field: _temp
      ignore_missing: true
  - script:
      tag: script_drop_empty_values_keep_tool_definitions
      description: >-
        Drop null and empty values recursively. gen_ai.tool.definitions is left
        out, because empty and null values in a tool's parameter schema are
        part of the tool interface.
      lang: painless
      source: |
        boolean drop(Object o) {
          if (o == null || o == '') {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return ((Map) o).size() == 0;
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return ((List) o).size() == 0;
          }
          return false;
        }
        def defs = null;
        if (ctx.gen_ai?.tool instanceof Map && ctx.gen_ai.tool.definitions != null) {
          defs = ctx.gen_ai.tool.remove('definitions');
        }
        drop(ctx);
        if (defs != null) {
          if (!(ctx.gen_ai instanceof Map)) { ctx.gen_ai = new HashMap(); }
          if (!(ctx.gen_ai.tool instanceof Map)) { ctx.gen_ai.tool = new HashMap(); }
          ctx.gen_ai.tool.definitions = defs;
        }
  - script:
      tag: script_cap_flattened_depth
      description: >-
        A flattened field rejects the whole document when an object is nested
        more than 20 levels deep. Store any object below max_depth levels as a
        JSON string. Values within the limit are unchanged.
      lang: painless
      params:
        max_depth: 20
        fields:
          - [gen_ai, input, messages]
          - [gen_ai, output, messages]
          - [gen_ai, tool, definitions]
          - [azure, ai_foundry, properties, backend_request_body, tools]
          - [azure, ai_foundry, properties, backend_request_body, response_format]
      source: |
        int depth(def v) {
          int d = 0;
          if (v instanceof Map) {
            for (def x : v.values()) { d = (int) Math.max(d, depth(x)); }
            return d + 1;
          }
          if (v instanceof List) {
            for (def x : v) { d = (int) Math.max(d, depth(x)); }
          }
          return d;
        }
        def cap(def v, int level, int maxDepth) {
          if (v instanceof Map) {
            if (level > maxDepth) { return Json.dump(v); }
            Map out = new HashMap();
            for (def e : v.entrySet()) { out.put(e.getKey(), cap(e.getValue(), level + 1, maxDepth)); }
            return out;
          }
          if (v instanceof List) {
            List out = new ArrayList();
            for (def x : v) { out.add(cap(x, level, maxDepth)); }
            return out;
          }
          return v;
        }
        for (def path : params.fields) {
          def parent = ctx;
          for (int i = 0; i < path.size() - 1 && parent instanceof Map; i++) {
            parent = parent.get(path.get(i));
          }
          if (!(parent instanceof Map)) { continue; }
          String leaf = path.get(path.size() - 1);
          def v = parent.get(leaf);
          if (v != null && depth(v) > params.max_depth) {
            parent.put(leaf, cap(v, 1, params.max_depth));
          }
        }
on_failure:
  - remove:
      field: _temp
      tag: remove_temp_on_failure
      ignore_missing: true
  - append:
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
