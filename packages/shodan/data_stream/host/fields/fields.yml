- name: threat
  type: group
  fields:
    - name: indicator
      type: group
      fields:
        - name: vulnerability
          type: group
          fields:
            - name: id
              type: keyword
              description: CVE or other vulnerability IDs reported by Shodan for the indicator.
        - name: software
          type: group
          fields:
            - name: name
              type: keyword
              description: Name of the software/product detected on the indicator.
            - name: version
              type: keyword
              description: Version of the software/product detected on the indicator.
        - name: as
          type: group
          fields:
            - name: isp
              type: keyword
              description: ISP name for the indicator's autonomous system, as reported by Shodan.
        - name: tags
          type: keyword
          description: Tags associated with the indicator, as provided by Shodan.
