- name: data_stream.type
  type: constant_keyword
  description: Data stream type.
- name: data_stream.dataset
  type: constant_keyword
  description: Data stream dataset.
- name: data_stream.namespace
  type: keyword
  description: >-
    Data stream namespace. Not constant_keyword: the source pattern spans
    every namespace, and documents from a second namespace would otherwise
    be rejected once the destination index locked onto the first value seen.
- name: event.module
  type: constant_keyword
  description: Event module.
  value: "shodan"
- name: event.dataset
  type: constant_keyword
  description: Event dataset.
  value: "shodan.host"
- name: '@timestamp'
  type: date
  description: Event timestamp.
