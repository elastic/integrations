  - append:
      tag: append_host_ip_from_ip_address_5c76e407
      field: host.ip
      value: '{{{xm_cyber.device.ip_address}}}'
      allow_duplicates: false
      if: ctx.xm_cyber?.device?.ip_address != null && ctx.xm_cyber.device.ip_address != ''
  - append:
      tag: append_related_ip_from_ip_address_ea950a7c
