      if: ctx.vulnerability?.score?.version == null && ctx.xm_cyber?.device?.max_cvss_v3 != null
  - set:
      tag: set_vulnerability_score_base_from_max_cvss_v2_8a056c4d
      field: vulnerability.score.base
      copy_from: xm_cyber.device.max_cvss_v2
      ignore_empty_value: true
      if: ctx.vulnerability?.score?.base == null
  - set:
      tag: set_vulnerability_score_version_from_max_cvss_v2_401be088
      field: vulnerability.score.version
      value: '2.0'
      if: ctx.vulnerability?.score?.version == null && ctx.xm_cyber?.device?.max_cvss_v2 != null
  - set:
      tag: set_vulnerability_classification_cvss_a0de9474
      field: vulnerability.classification
      value: CVSS
      if: ctx.vulnerability?.score?.base != null
  - script:
      tag: script_vulnerability_id_from_active_cves_4d870e51
      lang: painless
      description: Collect unique CVE identifiers from every apps[].active_cves list into vulnerability.id and record the identifier scheme in vulnerability.enumeration.
      if: ctx.xm_cyber?.device?.apps instanceof List
      source: |-
        def cves = new TreeSet();
        for (def app : ctx.xm_cyber.device.apps) {
          if (app instanceof Map && app.active_cves instanceof List) {
            for (def cve : app.active_cves) {
              if (cve != null && cve != '') {
                cves.add(cve);
              }
            }
          }
        }
        if (!cves.isEmpty()) {
          if (ctx.vulnerability == null) {
            ctx.vulnerability = new HashMap();
          }
          ctx.vulnerability.id = new ArrayList(cves);
          ctx.vulnerability.enumeration = 'CVE';
        }

  # ----- ECS host.* / device.* (inventory; device.* is beta per ECS) -----
  - set:
      tag: set_host_name_from_fqdn_7ca3a99d
