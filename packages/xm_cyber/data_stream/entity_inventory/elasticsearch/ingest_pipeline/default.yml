      field: xm_cyber.entity_inventory.first_seen
      target_field: xm_cyber.entity_inventory.first_seen
      formats:
        - ISO8601
      if: ctx.xm_cyber?.entity_inventory?.first_seen != null && ctx.xm_cyber.entity_inventory.first_seen != '' && ctx.xm_cyber.entity_inventory.first_seen != 'Unknown'
      on_failure:
        - remove:
            tag: remove_first_seen_on_failure_c981d28c
