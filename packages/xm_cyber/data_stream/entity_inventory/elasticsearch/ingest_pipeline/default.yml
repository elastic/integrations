      if: ctx.xm_cyber?.entity_inventory?.name != null && ctx.xm_cyber.entity_inventory.name != ''

  - remove:
      description: Remove vendor-specific fields that are duplicated to ECS.
      tag: remove_fields_mapped_to_ecs_8d108254
      ignore_missing: true
      field:
        # ----- host.* sources -----
        - xm_cyber.entity_inventory.arch
