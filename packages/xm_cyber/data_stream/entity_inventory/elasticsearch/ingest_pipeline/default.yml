      if: ctx.xm_cyber?.entity_inventory?.entity_type != null && ctx.xm_cyber.entity_inventory.entity_type.toLowerCase().contains('user')

  # ----- service.* mappings -----
  - set:
      tag: set_service_type_from_engine_68abc65a
