      field: user.full_name
      copy_from: xm_cyber.entity_inventory.distinguished_name
      ignore_empty_value: true

  # ----- entity.* mappings (ECS entity extension) -----
  # Device-shaped entities: last_activity is the device's last connection time.
  - set:
      tag: set_host_entity_lifecycle_last_activity_from_last_connection_time_6fcc393c
      field: host.entity.lifecycle.last_activity
      copy_from: xm_cyber.entity_inventory.last_connection_time
      ignore_empty_value: true
      if: ctx.xm_cyber?.entity_inventory?.last_connection_time != null && ctx.xm_cyber.entity_inventory.last_connection_time != 'Unknown' && ctx.xm_cyber?.entity_inventory?.entity_type != null && ctx.xm_cyber.entity_inventory.entity_type.toLowerCase().contains('agent')
  # User-shaped entities: last_activity is the principal's last activity date.
  - set:
      tag: set_user_entity_lifecycle_last_activity_from_last_activity_date_e49de40d
      field: user.entity.lifecycle.last_activity
      copy_from: xm_cyber.entity_inventory.last_activity_date
