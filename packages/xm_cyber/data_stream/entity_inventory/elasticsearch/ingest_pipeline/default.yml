---
description: Pipeline for processing XM Cyber entity inventory events from CEL `message` JSON.
processors:
  - set:
      tag: set_ecs_version_8c2c9474
      field: ecs.version
      value: 9.4.0
  - terminate:
      description: error message set and no data to process.
      tag: terminate_data_collection_error_f2e4d3c3
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null

  # drop CEL informational refresh-token marker events
  - drop:
      description: Drops the CEL token-refresh retry marker event so it does not become a phantom pipeline_error document.
      tag: drop_cel_refresh_token_retry_a8a7270a
      if: ctx.message instanceof String && ctx.message == 'retry'

  # remove agentless metadata
  - remove:
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
      tag: remove_agentless_tags_457d239b
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      field:
        - organization
        - division
        - team
      ignore_missing: true

  # parse the event JSON
  - rename:
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      tag: rename_message_to_event_original_a4b0426e
      if: ctx.event?.original == null
      field: message
      target_field: event.original
      ignore_missing: true
  - remove:
      description: The `message` field is no longer required if the document has an `event.original` field.
      tag: remove_message_662e8126
      if: ctx.event?.original != null
      field: message
      ignore_missing: true

  - json:
      tag: json_event_original_into_xm_cyber_entity_inventory_2922b9c4
      field: event.original
      target_field: xm_cyber.entity_inventory
      if: ctx.event?.original != null
  # Normalise vendor field names to snake_case recursively under xm_cyber.entity_inventory.*
  # ----- event.kind / event.category / event.type -----
  - set:
      tag: set_event_kind_asset_50075a0b
      field: event.kind
      value: asset
  - fingerprint:
      tag: fingerprint_with_id_3f60b4ee
      fields:
        - xm_cyber.entity_inventory.id
      target_field: _id
      ignore_missing: true

  - script:
      description: >
        Convert field names from camelCase to snake_case recursively.
        NOTE: This processor reassigns the normalized output back to
        ctx.xm_cyber.entity_inventory.
      tag: script_convert_camelcase_to_snake_case_72dcdb9f
      lang: painless
      source: |-
        // Helper function to convert camelCase to snake_case
        String camelToSnake(String str) {
            def result = "";
            for (int i = 0; i < str.length(); i++) {
                char c = str.charAt(i);
                if (Character.isUpperCase(c)) {
                    if (i > 0 && Character.isLowerCase(str.charAt(i - 1))) {
                        result += "_";
                    }
                    result += Character.toLowerCase(c);
                } else {
                    result += c;
                }
            }
            return result;
        }
        // Recursive function to handle nested fields
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              String newKey = camelToSnake(entry.getKey());
              newObj[newKey] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        // Apply the conversion
        if (ctx.xm_cyber?.entity_inventory != null) {
          ctx.xm_cyber.entity_inventory = convertToSnakeCase(ctx.xm_cyber.entity_inventory);
        }

