      if: ctx.xm_cyber?.entity_inventory?.last_activity_date != null && ctx.xm_cyber.entity_inventory.last_activity_date != 'Unknown' && ctx.xm_cyber?.entity_inventory?.entity_type != null && ctx.xm_cyber.entity_inventory.entity_type.toLowerCase().contains('user')
  # MFA flag is a user-only attribute.
  - set:
