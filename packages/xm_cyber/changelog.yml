# newer versions go on top
- version: "0.6.0"
  changes:
    - description: Require Kibana `8.19.23`, `9.4.8` or `9.5.5` so that Fleet has the index privileges needed to apply the ILM policies that include a delete phase.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.5.0"
  changes:
    - description: Migrate the `vulnerability`, `device` and `product` data streams to the XM Cyber `vrmReport` API and add the `vulnerability_instance` data stream and dashboard.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21162
    - description: Remove `xm_cyber.device.is_choke_point`, `xm_cyber.device.apps.*`, `xm_cyber.vulnerability.status`, `xm_cyber.vulnerability.exploit_kit_exist`, `xm_cyber.vulnerability.is_exploited_in_the_wild` and `xm_cyber.vulnerability.technique_id`, and rename `xm_cyber.product.product_operating_systems` to `xm_cyber.product.product_operating_system`, as these are no longer returned by the `vrmReport` API.
      type: breaking-change
      link: https://github.com/elastic/integrations/pull/21162
- version: "0.4.0"
  changes:
    - description: Add tags to ingest pipeline processors and add `preserve_original_event` to pipeline-level `on_failure` handlers.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20574
- version: "0.3.0"
  changes:
    - description: Fix incorrect values in dashboard panels when API errors occur.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20535
    - description: Remove the unused `[Logs XM Cyber] Scenario Details` saved search.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20535
- version: "0.2.0"
  changes:
    - description: Add X-XMCYBER-CONNECTOR-NAME-VERSION client identification header to all API requests.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20618
- version: "0.1.2"
  changes:
    - description: Set agentless deployment mode `release` field to `ga`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20463
- version: 0.1.1
  changes:
    - description: Improve documentation examples.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20147
- version: 0.1.0
  changes:
    - description: Initial release of XM Cyber integration.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20043
    - description: Sync all data streams together.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20032
    - description: Add support for product data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18993
    - description: Add support for device data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18988
    - description: Add support for risk score data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18749
    - description: Add support for entity inventory data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/19550
    - description: Add support for audit trail data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18823
    - description: Add support for vulnerability data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18963
