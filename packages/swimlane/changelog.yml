# newer versions go on top
- version: "0.7.0"
  changes:
    - description: Update Elastic Managed integration documentation to the current wording and docs links.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.6.0"
  changes:
    - description: Add tags to ingest pipeline processors and add `preserve_original_event` to pipeline-level `on_failure` handlers.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20575
    - description: Remove a redundant no-op `rename` processor for `swimlane.audit_log.category` in the `audit_logs` data stream.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20575
- version: "0.5.1"
  changes:
    - description: Set agentless deployment mode `release` field to `ga`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20463
- version: "0.5.0"
  changes:
    - description: Enable Agentless deployment.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/19479
- version: "0.4.2"
  changes:
    - description: Add missing request trace enabled default option.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/17963
- version: "0.4.1"
  changes:
    - description: Fix type conflict with other integration using `log.source` and use ECS definitions where possible.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/14544
- version: "0.4.0"
  changes:
    - description: Added support for log collection through API endpoint
      type: enhancement
      link: https://github.com/elastic/integrations/pull/13972
- version: "0.3.0"
  changes:
    - description: Standardize user fields processing across integrations.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/14137
- version: "0.2.0"
  changes:
    - description: Update Kibana constraint to support 9.0.0.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/14197
- version: "0.1.0"
  changes:
    - description: Initial draft of the package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/13499
