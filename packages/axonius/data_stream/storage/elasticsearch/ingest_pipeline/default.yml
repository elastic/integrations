---
description: Pipeline for processing storage logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_8efb762c
      value: 9.3.0
  - terminate:
      description: error message set and no data to process.
      tag: terminate_data_collection_error_f2e4d3c3
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null

  # remove agentless metadata
  - remove:
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
      tag: remove_agentless_tags_457d239b
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      field:
        - organization
        - division
        - team
      ignore_missing: true

  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_01f43546
      target_field: axonius.storage
  # Fingerprint the full raw payload because the Axonius API does not expose a stable entity ID for storage assets; the transform keys on this value for deduplication.
  - fingerprint:
      fields:
        - event.original
      tag: fingerprint_event_original_737b2d3e
      target_field: axonius.storage.transform_unique_id
      ignore_missing: true
  - set:
      tag: set_event_kind_d452ef2c
      field: event.kind
      value: event

  - append:
      field: event.category
      value: file
      tag: category_file_7a16cb8b
  - append:
      field: event.category
      value: host
      tag: category_host_5098f71a
  - append:
      field: event.type
      value: info
      tag: type_info_5eab37e6

  - convert:
      field: axonius.storage.adapter_list_length
      tag: convert_adapter_list_length_to_long_a3298df1
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: axonius.storage.adapter_list_length
            ignore_missing: true
            tag: remove_adapter_list_length_to_long_e6163b19
        - append:
            tag: append_error_message_a6ef7e49
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_rename_fields_ff27a839
      lang: painless
      description: Renames all axonius.storage.event.data.* fields to root level (removes event.data prefix). Prefixes conflicting keys with 'data_' to avoid overwriting custom data-stream-root-level fields.
      source: |-
        if (ctx.axonius?.storage?.event?.data instanceof Map) {
          Map eventData = ctx.axonius.storage.event.data;
          for (String key : new ArrayList(eventData.keySet())) {
            if (ctx.axonius.storage.containsKey(key)) {
              ctx.axonius.storage['data_' + key] = eventData[key];
            } else {
              ctx.axonius.storage[key] = eventData[key];
            }
          }
          ctx.axonius.storage.event.remove('data');
        }
  - date:
      field: axonius.storage.event.accurate_for_datetime
      tag: date_event_accurate_for_datetime_88fd9bef
      target_field: axonius.storage.event.accurate_for_datetime
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.storage?.event?.accurate_for_datetime != null && ctx.axonius.storage.event.accurate_for_datetime != ''
      on_failure:
        - remove:
            field: axonius.storage.event.accurate_for_datetime
            ignore_missing: true
            tag: remove_event_accurate_for_datetime_362a2c58
        - append:
            tag: append_error_message_db46cd65
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_storage_event_accurate_for_datetime_c145bbd9
      copy_from: axonius.storage.event.accurate_for_datetime
      ignore_empty_value: true
  - date:
      field: axonius.storage.accurate_for_datetime
      tag: date_accurate_for_datetime_6e39cd65
      target_field: axonius.storage.accurate_for_datetime
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.storage?.accurate_for_datetime != null && ctx.axonius.storage.accurate_for_datetime != ''
      on_failure:
        - remove:
            field: axonius.storage.accurate_for_datetime
            ignore_missing: true
            tag: remove_accurate_for_datetime_10104598
        - append:
            tag: append_error_message_63972b06
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: axonius.storage.create_time
      tag: date_create_time_8ad870eb
      target_field: axonius.storage.create_time
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.storage?.create_time != null && ctx.axonius.storage.create_time != ''
      on_failure:
        - remove:
            field: axonius.storage.create_time
            ignore_missing: true
            tag: remove_create_time_32325613
        - append:
            tag: append_error_message_76841378
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.created
      tag: set_event_created_from_storage_create_time_fa762685
      copy_from: axonius.storage.create_time
      if: ctx.axonius?.storage?.asset_type == 'disks'
      ignore_empty_value: true
  - date:
      field: axonius.storage.creation_date
      tag: date_creation_date_a83609bb
      target_field: axonius.storage.creation_date
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.storage?.creation_date != null && ctx.axonius.storage.creation_date != ''
      on_failure:
        - remove:
            field: axonius.storage.creation_date
            ignore_missing: true
            tag: remove_creation_date_48de32e5
        - append:
            tag: append_error_message_1a108d42
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.created
      tag: set_event_created_from_storage_creation_date_2bbe25ec
      copy_from: axonius.storage.creation_date
      if: ctx.axonius?.storage?.asset_type == 'object_storages'
      ignore_empty_value: true
  - date:
      field: axonius.storage.fetch_time
      tag: date_fetch_time_52e2e4b4
      target_field: axonius.storage.fetch_time
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.storage?.fetch_time != null && ctx.axonius.storage.fetch_time != ''
      on_failure:
        - remove:
            field: axonius.storage.fetch_time
            ignore_missing: true
            tag: remove_fetch_time_7da5db9f
        - append:
            tag: append_error_message_5ee94612
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: axonius.storage.first_fetch_time
      tag: date_first_fetch_time_aa0e6611
      target_field: axonius.storage.first_fetch_time
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.storage?.first_fetch_time != null && ctx.axonius.storage.first_fetch_time != ''
      on_failure:
        - remove:
            field: axonius.storage.first_fetch_time
            ignore_missing: true
            tag: remove_first_fetch_time_885989d3
        - append:
            tag: append_error_message_1d876a87
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: axonius.storage.from_last_fetch
      tag: convert_from_last_fetch_to_boolean_524aca11
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            field: axonius.storage.from_last_fetch
            ignore_missing: true
            tag: remove_from_last_fetch_to_boolean_c6f44e30
        - append:
            tag: append_error_message_4d5216db
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: axonius.storage.is_fetched_from_adapter
      tag: convert_is_fetched_from_adapter_to_boolean_5072d0ce
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            field: axonius.storage.is_fetched_from_adapter
            ignore_missing: true
            tag: remove_is_fetched_from_adapter_to_boolean_eb757f5d
        - append:
            tag: append_error_message_b1bc89b7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: axonius.storage.tenant_number
      tag: foreach_storage_tenant_number_7e67b780
      if: ctx.axonius?.storage?.tenant_number instanceof List
      processor:
        convert:
          field: _ingest._value
          tag: convert_storage_tenant_number_to_long_687f6275
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_17096f00
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_de0a824c
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: axonius.storage.not_fetched_count
      tag: convert_not_fetched_count_to_long_a2d1556f
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: axonius.storage.not_fetched_count
            ignore_missing: true
            tag: remove_not_fetched_count_to_long_93ae7208
        - append:
            tag: append_error_message_2ad26f55
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: axonius.storage.size
      tag: convert_size_to_double_849a730c
      type: double
      ignore_missing: true
      on_failure:
        - remove:
            field: axonius.storage.size
            ignore_missing: true
            tag: remove_size_to_double_dc4804a6
        - append:
            tag: append_error_message_f1b71332
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      field:
        - axonius.storage.event.accurate_for_datetime
        - axonius.storage.create_time
        - axonius.storage.creation_date
      tag: remove_storage_fields_mapped_to_ecs_19e72a8a
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_7559f019
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_417e65c9
      field: error.message
      value: |-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
