---
description: Pipeline for processing business applications logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_asset_6cfcd532
      value: asset
  - set:
      field: service.name
      tag: set_service_name_from_application_name_29f4dc13
      copy_from: axonius.application.name
      if: ctx.axonius?.application?.name instanceof String && ctx.axonius.application.name.trim() != ''
  # internal_axon_id is the only identifier shared by every adapter record of an Axonius application asset.
  - set:
      field: service.id
      tag: set_service_id_from_application_internal_axon_id_fb7b94a6
      copy_from: axonius.application.internal_axon_id
      ignore_empty_value: true
  - set:
      field: service.entity.id
      tag: set_service_entity_id_from_application_internal_axon_id_a59867a8
      copy_from: axonius.application.internal_axon_id
      ignore_empty_value: true
  - append:
      field: service.entity.type
      tag: append_service_entity_type_583906dc
      value:
        - service
        - application
      allow_duplicates: false
  - set:
      field: service.state
      tag: set_service_state_from_application_operational_status_44e7155f
      copy_from: axonius.application.operational_status
      ignore_empty_value: true
  - set:
      field: service.type
      tag: set_service_type_from_application_application_type_089d7a48
      copy_from: axonius.application.application_type
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_application_business_owner_into_related_user_f5b21433
      value: '{{{axonius.application.business_owner}}}'
      allow_duplicates: false
      if: ctx.axonius?.application?.business_owner != null
  - convert:
      field: axonius.application.devices_count
      tag: convert_devices_count_to_long_74f8c5ba
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_axonius_application_devices_count_72f68727
            field: axonius.application.devices_count
            ignore_missing: true
        - append:
            tag: append_error_message_c953dc96
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: axonius.application.devices_count_link
      tag: foreach_devices_count_link_bracketWeight_98e5a1e2
      if: ctx.axonius?.application?.devices_count_link instanceof List
      processor:
        convert:
          field: _ingest._value.bracketWeight
          tag: convert_devices_count_link_bracketWeight_to_long_33e79fc1
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_bracketWeight_852f98d2
                field: _ingest._value.bracketWeight
                ignore_missing: true
            - append:
                tag: append_error_message_eb309f8a
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: axonius.application.devices_count_link
      tag: foreach_devices_count_link_compOp_cdd89c5c
      if: ctx.axonius?.application?.devices_count_link instanceof List
      processor:
        rename:
          field: _ingest._value.compOp
          tag: rename_devices_count_link_compOp_8455a745
          target_field: _ingest._value.comp_op
          ignore_missing: true
  - foreach:
      field: axonius.application.devices_count_link
      tag: foreach_devices_count_link_leftBracket_f15da864
      if: ctx.axonius?.application?.devices_count_link instanceof List
      processor:
        convert:
          field: _ingest._value.leftBracket
          tag: convert_devices_count_link_leftBracket_to_long_08bdf6d3
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_leftBracket_92f2172d
                field: _ingest._value.leftBracket
                ignore_missing: true
            - append:
                tag: append_error_message_6dae302b
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: axonius.application.devices_count_link
      tag: foreach_devices_count_link_logicOp_1c40d938
      if: ctx.axonius?.application?.devices_count_link instanceof List
      processor:
        rename:
          field: _ingest._value.logicOp
          tag: rename_devices_count_link_logicOp_ff3c9618
          target_field: _ingest._value.logic_op
          ignore_missing: true
  - foreach:
      field: axonius.application.devices_count_link
      tag: foreach_devices_count_link_not_962bf93c
      if: ctx.axonius?.application?.devices_count_link instanceof List
      processor:
        convert:
          field: _ingest._value.not
          tag: convert_devices_count_link_not_to_boolean_199bfe5f
          type: boolean
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_not_b27ec83c
                field: _ingest._value.not
                ignore_missing: true
            - append:
                tag: append_error_message_713ece23
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: axonius.application.devices_count_link
      tag: foreach_devices_count_link_rightBracket_12aa1040
      if: ctx.axonius?.application?.devices_count_link instanceof List
      processor:
        convert:
          field: _ingest._value.rightBracket
          tag: convert_devices_count_link_rightBracket_to_long_95e9f249
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_rightBracket_1d7d9228
                field: _ingest._value.rightBracket
                ignore_missing: true
            - append:
                tag: append_error_message_682b3412
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: related.user
      tag: append_application_it_application_owner_into_related_user_5a79dcc0
      value: '{{{axonius.application.it_application_owner}}}'
      allow_duplicates: false
      if: ctx.axonius?.application?.it_application_owner != null
  - append:
      field: related.user
      tag: append_application_managed_by_into_related_user_5af39352
      value: '{{{axonius.application.managed_by}}}'
      allow_duplicates: false
      if: ctx.axonius?.application?.managed_by != null
on_failure:
  - append:
      tag: append_error_message_417e65c9
      field: error.message
      value: |-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
