---
description: Pipeline for processing identity logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_8efb762c
      value: 9.3.0
  - terminate:
      description: error message set and no data to process.
      tag: terminate_data_collection_error_f2e4d3c3
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null

  # remove agentless metadata
  - remove:
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
      tag: remove_agentless_tags_457d239b
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      field:
        - organization
        - division
        - team
      ignore_missing: true
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_d49138bb
      target_field: axonius.identity
  # Fingerprint the full raw payload because the Axonius API does not expose a stable entity ID for identity assets; the transform keys on this value for deduplication.
  - fingerprint:
      fields:
        - event.original
      tag: fingerprint_event_original_0a91af1f
      target_field: axonius.identity.transform_unique_id
      ignore_missing: true
  - set:
      tag: set_event_kind_d452ef2c
      field: event.kind
      value: event
  - append:
      field: event.category
      value: iam
      tag: category_iam_0eb47497
  - append:
      field: event.type
      value: info
      tag: type_info_5eab37e6

  - convert:
      field: axonius.identity.adapter_list_length
      tag: convert_adapter_list_length_to_long_bf653dd4
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_axonius_identity_adapter_list_length_79547e3b
            field: axonius.identity.adapter_list_length
            ignore_missing: true
        - append:
            tag: append_error_message_91c1eb5c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_rename_fields_ab2feed7
      lang: painless
      description: Renames all axonius.identity.event.data.* fields to root level (removes event.data prefix). Prefixes conflicting keys with 'data_' to avoid overwriting custom data-stream-root-level fields.
      source: |-
        if (ctx.axonius?.identity?.event?.data instanceof Map) {
          Map eventData = ctx.axonius.identity.event.data;
          for (String key : new ArrayList(eventData.keySet())) {
            if (ctx.axonius.identity.containsKey(key)) {
              ctx.axonius.identity['data_' + key] = eventData[key];
            } else {
              ctx.axonius.identity[key] = eventData[key];
            }
          }
          ctx.axonius.identity.event.remove('data');
        }
  - date:
      field: axonius.identity.event.accurate_for_datetime
      tag: date_event_accurate_for_datetime_fe4b8a9d
      target_field: axonius.identity.event.accurate_for_datetime
      formats:
        - EEE, dd MMM yyyy HH:mm:ss 'GMT'
        - yyyy-MM-dd
        - EEE,dd MMM yyyy HH:mm:ss 'GMT'
      if: ctx.axonius?.identity?.event?.accurate_for_datetime != null && ctx.axonius.identity.event.accurate_for_datetime != ''
      on_failure:
        - remove:
            tag: remove_axonius_identity_event_accurate_for_datetime_979a740e
            field: axonius.identity.event.accurate_for_datetime
            ignore_missing: true
        - append:
            tag: append_error_message_aab7e57a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_identity_event_accurate_for_datetime_12c4d731
