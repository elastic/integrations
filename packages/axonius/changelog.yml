# newer versions go on top
- version: "0.8.0"
  changes:
    - description: >-
        Add support for ECS entity fields to SaaS applications, business applications, admin managed extensions, user initiated extensions and application add-ons in the `application` data stream, which now have `event.kind` set to `asset` and appear as service entities, and link user assets in the `identity` data stream to the services they administer with service entity IDs. Bump the `latest_application` and `latest_identity` transform destination indices to apply the new mappings.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22335
    - description: >-
        Add each email address of the `user_count_link` values, which can be comma-separated lists or arrays, to `related.user` separately in the `application` data stream and for group assets in the `identity` data stream. Set `event.category` to `configuration` instead of `file` and `host` in the `storage` data stream, and to `database` for databases or `configuration` for the other non-device assets instead of `host` in the `compute` data stream.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22335
- version: "0.7.0"
  changes:
    - description: >-
        Add support for ECS entity fields to device assets in the `compute` data stream, which now have `event.kind` set to `asset`, and link user assets in the `identity` data stream to their devices with host entity IDs.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22306
    - description: >-
        Set `host.os.version` from the installed OS version (`os.os_dotted`) instead of the latest available version, and set `host.id` from `internal_axon_id` instead of the adapter `uuid` for device assets in the `compute` data stream, keeping `uuid` and `os.latest_os_version` as raw fields. Set `event.category` to `vulnerability` only for `compute` records that carry vulnerability data.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22306
- version: "0.6.0"
  changes:
    - description: Add support for ECS entity fields to user assets in the `identity` data stream and to the `user` data stream, and update ECS to 9.5.0.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22288
    - description: >-
        Stop setting `user.name` from `display_name` for non-user identity assets, stop adding group names to `related.user`, and stop mapping `aws_iam_identity_type` and `azure_account_id` to `cloud.service.name` and `cloud.account.id` in the `identity` data stream. Bump the `latest_identity` and `latest_user` transform destination indices to apply the new mappings.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22288
- version: "0.5.0"
