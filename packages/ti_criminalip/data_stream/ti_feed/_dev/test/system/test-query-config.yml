deployer: docker
service: api-mock
input: cel
data_stream:
  vars:
    api_key: unit-test-key
    feed_url: "http://{{{Hostname}}}:{{{Port}}}/ti/v1/feed/outbound/query?tenant=a%20b&tenant=second&empty=&format=csv&format=old&key=old&key=stale#ignored"
    interval: 10s
    tags:
      - synthetic
assert:
  fields_present:
    - threat.indicator.ip
    - threat.indicator.provider
wait_for_data_timeout: 90s
