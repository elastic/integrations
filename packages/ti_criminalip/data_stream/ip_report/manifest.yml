title: "IP Report (optional lookups)"
type: logs

streams:
  - input: cel
    enabled: false
    title: "Criminal IP API"
    description: |-
      Optional reputation lookups for explicitly configured IPs. Does not discover IPs in logs or generate firewall match alerts.
    template_path: cel.yml.hbs

    vars:
      - name: api_key
        type: password
        title: "Criminal IP API Key"
        description: "API key used to authenticate with Criminal IP."
        required: true
        show_user: true
        secret: true

      - name: ip
        type: text
        title: "IP Address"
        description: "Primary IP address to query. Accepts IPv4 or IPv6."
        required: true
        show_user: true

      - name: additional_ips
        type: text
        title: "Additional IP Addresses"
        description: "Optional public IPs to query in addition to IP Address. Add one IP per row, not comma-separated values. Each distinct IP consumes API usage every interval."
        multi: true
        required: false
        show_user: true

      - name: url
        type: text
        title: "Criminal IP API URL"
        description: "Criminal IP IP Report API endpoint."
        required: true
        show_user: true
        default: "https://api.criminalip.io/v1/asset/ip/report"

      - name: interval
        type: text
        title: "Interval"
        description: "How often to query Criminal IP."
        required: true
        show_user: true
        default: "5m"

      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >
          The request tracer logs HTTP requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        default: false
        multi: false
        required: false
        show_user: false

      - name: preserve_original_event
        type: bool
        title: "Preserve original event"
        description: >-
          Preserves a raw copy of the original event in `event.original`. This may contain sensitive information, including API responses. Restrict access to the stored data.
        default: false
        show_user: true

      - name: proxy_url
        type: text
        title: Proxy URL
        description: URL of an HTTP proxy used to reach the API.
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: SSL configuration options for the API connection.
        required: false
        show_user: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring the HTTP client connection timed out, for example 30s.
        required: false
        show_user: false
      - name: processors
        type: yaml
        title: Processors
        description: Processors run by the Agent before the event is parsed.
        required: false
        show_user: false

      - name: tags
        type: text
        title: "Tags"
        description: "Tags to include in the published event."
        multi: true
        show_user: true
        default:
          - criminalip
          - threat_intelligence

elasticsearch:
  index_template:
    mappings:
      subobjects: false
