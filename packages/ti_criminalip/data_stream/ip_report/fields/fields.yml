- name: criminalip.score.inbound
  type: keyword
  description: Criminal IP inbound reputation score.

- name: criminalip.query_ip
  type: keyword
  description: Configured lookup value for each report request, including HTTP and application-level failures; may be malformed input rather than a valid IP.

- name: criminalip.score.outbound
  type: keyword
  description: Criminal IP outbound reputation score.

- name: criminalip.issues.is_vpn
  type: boolean
  description: Whether the IP is identified as VPN.

- name: criminalip.issues.is_tor
  type: boolean
  description: Whether the IP is identified as Tor.

- name: criminalip.issues.is_proxy
  type: boolean
  description: Whether the IP is identified as proxy.

- name: criminalip.issues.is_scanner
  type: boolean
  description: Whether the IP is identified as scanner.

- name: criminalip.issues.is_darkweb
  type: boolean
  description: Whether the IP is associated with dark web.

- name: criminalip.issues.is_hosting
  type: boolean
  description: Whether the IP is identified as hosting.

- name: criminalip.issues.is_cloud
  type: boolean
  description: Whether the IP is identified as cloud.

- name: criminalip.status
  type: long
  description: Criminal IP response body status code, distinct from the HTTP status.
