- name: criminalip.fortigate
  type: group
  description: FortiGate fields preserved from key-value syslog messages.
  fields:
    - name: logid
      type: keyword
      description: FortiGate event identifier.
    - name: policyid
      type: keyword
      description: FortiGate policy identifier.
    - name: subtype
      type: keyword
      description: FortiGate event subtype.
    - name: type
      type: keyword
      description: FortiGate event type preserved from the original key-value log.
    - name: date
      type: date
      description: Date recorded in the original FortiGate event.
    - name: time
      type: keyword
      description: Time of day recorded in the original FortiGate event.
    - name: eventtime
      type: keyword
      description: FortiGate event-time epoch value preserved from the original log.
