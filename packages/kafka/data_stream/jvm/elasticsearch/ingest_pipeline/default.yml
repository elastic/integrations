---
description: Pipeline for processing Kafka JVM metrics
processors:
  - set:
      tag: set_ecs_version_f3ace025
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_jolokia_metrics_8f097ed3
      field: jolokia.metrics
      target_field: kafka.jvm
      ignore_missing: true
      ignore_failure: true
  - set:
      tag: set_event_kind_69719da8
      field: event.kind
      value: metric
  - set:
      tag: set_event_type_cd09feab
      field: event.type
      value: [info]
  - set:
      tag: set_service_type_53447018
      field: service.type
      value: kafka

  # Add metric fingerprint list
  - script:
      tag: script_6e9a5f45
      lang: painless
      source: |
        def queue = new ArrayList();
        def fingerprint = new ArrayList();

        if (ctx.containsKey('kafka') && ctx.kafka.containsKey('jvm')) {
            queue.add(['p': 'kafka.jvm', 'v': ctx.kafka.jvm]);

            while (!queue.isEmpty()) {
                def item = queue.remove(0);
                def path = item.p;
                def val = item.v;

                if (val instanceof Map) {
                    for (entry in val.entrySet()) {
                        def key = entry.getKey();
                        def child = entry.getValue();
                        def childPath = path + '.' + key;
                        queue.add(['p': childPath, 'v': child]);
                    }
                } else {
                    fingerprint.add(path);
                }
            }

            ctx.kafka_jvm_metric_fingerprint = fingerprint;
        }

  - fingerprint:
      tag: fingerprint_39bcf67b
      fields: [kafka_jvm_metric_fingerprint]
      target_field: kafka.jvm.metric_fingerprint
      ignore_failure: true

  # Cleanup  
  - remove:
      tag: remove_kafka_jvm_metric_fingerprint_e120eb39
      field: kafka_jvm_metric_fingerprint
      ignore_missing: true

  - remove:
      tag: remove_kafka_jvm_mbean_49bb86d9
      field: kafka.jvm.mbean
      ignore_missing: true

on_failure:
  - set:
      tag: set_event_kind_fc76a062
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_d85c8879
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
