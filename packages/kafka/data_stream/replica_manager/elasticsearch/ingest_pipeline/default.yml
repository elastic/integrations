---
description: Pipeline for parsing Kafka replica manager metrics
processors:
  - set:
      tag: set_event_kind_74d558a7
      field: event.kind
      value: metric
  - rename:
      tag: rename_jolokia_metrics_ce4137fa
      field: jolokia.metrics
      target_field: kafka.replica_manager
      ignore_missing: true
      ignore_failure: true
  - set:
      tag: set_event_kind_b6e5db71
      field: event.kind
      value: metric
  - set:
      tag: set_event_type_d75c3255
      field: event.type
      value: [info]
  - set:
      tag: set_service_type_a1489f53
      field: service.type
      value: kafka

  # Add metric fingerprint list
  - script:
      tag: script_89a2b87c
      lang: painless
      source: |
        def queue = new ArrayList();
        def fingerprint = new ArrayList();

        if (ctx.containsKey('kafka') && ctx.kafka.containsKey('replica_manager')) {
            queue.add(['p': 'kafka.replica_manager', 'v': ctx.kafka.replica_manager]);

            while (!queue.isEmpty()) {
                def item = queue.remove(0);
                def path = item.p;
                def val = item.v;

                if (val instanceof Map) {
                    for (entry in val.entrySet()) {
                        def key = entry.getKey();
                        def child = entry.getValue();
                        def childPath = path + '.' + key;
                        queue.add(['p': childPath, 'v': child]);
                    }
                } else {
                    fingerprint.add(path);
                }
            }

            ctx.kafka_replica_manager_metric_fingerprint = fingerprint;
        }

  - fingerprint:
      tag: fingerprint_4dbcda84
      fields: [kafka_replica_manager_metric_fingerprint]
      target_field: kafka.replica_manager.metric_fingerprint
      ignore_failure: true

  # Cleanup
  - remove:
      tag: remove_kafka_replica_manager_metric_fingerprint_217e0fc5
      field: kafka_replica_manager_metric_fingerprint
      ignore_missing: true

on_failure:
  - set:
      tag: set_event_kind_6aabe14e
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_622b730a
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
