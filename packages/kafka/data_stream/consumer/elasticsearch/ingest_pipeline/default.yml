---
description: Pipeline for processing Kafka consumer metrics
processors:
  - set:
      tag: set_ecs_version_36091ecc
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_jolokia_metrics_eb412b21
      field: jolokia.metrics
      target_field: kafka.consumer
      ignore_missing: true
      ignore_failure: true
  - set:
      tag: set_event_kind_1e6dfa71
      field: event.kind
      value: metric
  - set:
      tag: set_event_type_58c9aeef
      field: event.type
      value: [info]
  - set:
      tag: set_service_type_674a309f
      field: service.type
      value: kafka

  - grok:
      tag: grok_kafka_consumer_mbean_81f8d276
      field: "kafka.consumer.mbean"
      patterns:
        - "client-id=(?<kafka_consumer_client_id>[^,]+)"
      if: "ctx.kafka?.consumer?.mbean != null"
      ignore_failure: true

  - set:
      tag: set_kafka_consumer_client_id_38b16217
      field: "kafka.consumer.client_id"
      copy_from: "kafka_consumer_client_id"
      if: "ctx.kafka_consumer_client_id != null"
      ignore_failure: true

  # Add metric fingerprint list
  - script:
      tag: script_6cb5132a
      lang: painless
      source: |
        def queue = new ArrayList();
        def fingerprint = new ArrayList();

        if (ctx.containsKey('kafka') && ctx.kafka.containsKey('consumer')) {
            queue.add(['p': 'kafka.consumer', 'v': ctx.kafka.consumer]);

            while (!queue.isEmpty()) {
                def item = queue.remove(0);
                def path = item.p;
                def val = item.v;

                if (val instanceof Map) {
                    for (entry in val.entrySet()) {
                        def key = entry.getKey();
                        def child = entry.getValue();
                        def childPath = path + '.' + key;
                        queue.add(['p': childPath, 'v': child]);
                    }
                } else {
                    fingerprint.add(path);
                }
            }

            ctx.kafka_consumer_metric_fingerprint = fingerprint;
        }

  - fingerprint:
      tag: fingerprint_ad712df0
      fields: [kafka_consumer_metric_fingerprint]
      target_field: kafka.consumer.metric_fingerprint
      ignore_failure: true

  # Cleanup
  - remove:
      tag: remove_kafka_consumer_client_id_cd58cada
      field: kafka_consumer_client_id
      ignore_missing: true

  - remove:
      tag: remove_kafka_consumer_kafka_consumer_last_applied_record_timestamp_epoch_f3efc129
      field: kafka.consumer.kafka_consumer.last_applied_record_timestamp_epoch
      ignore_missing: true
  
  - remove:
      tag: remove_kafka_consumer_metric_fingerprint_fc1acf8f
      field: kafka_consumer_metric_fingerprint
      ignore_missing: true

on_failure:
  - set:
      tag: set_event_kind_a156d40b
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_53d8263b
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
