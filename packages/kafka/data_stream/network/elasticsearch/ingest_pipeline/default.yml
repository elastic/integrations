  - set:
      tag: set_ecs_version_8f05288a
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_jolokia_metrics_ce82c16f
      field: jolokia.metrics
      target_field: kafka.network
      ignore_missing: true
      ignore_failure: true
  - set:
      tag: set_event_kind_6542fa86
      field: event.kind
      value: metric
  - set:
      tag: set_event_type_2fa036cf
      field: event.type
      value: [info]
  - set:
      tag: set_service_type_0c92a914
      field: service.type
      value: kafka     
  

  # Add metric fingerprint list
  - script:
      tag: script_e7b2bb78
      lang: painless
      source: |
        def queue = new ArrayList();
        def fingerprint = new ArrayList();

        if (ctx.containsKey('kafka') && ctx.kafka.containsKey('network')) {
            queue.add(['p': 'kafka.network', 'v': ctx.kafka.network]);

            while (!queue.isEmpty()) {
                def item = queue.remove(0);
                def path = item.p;
                def val = item.v;

                if (val instanceof Map) {
                    for (entry in val.entrySet()) {
                        def key = entry.getKey();
                        def child = entry.getValue();
                        def childPath = path + '.' + key;
                        queue.add(['p': childPath, 'v': child]);
                    }
                } else {
                    fingerprint.add(path);
                }
            }

            ctx.kafka_network_metric_fingerprint = fingerprint;
        }

  - fingerprint:
      tag: fingerprint_2ca3c3c9
      fields: [kafka_network_metric_fingerprint]
      target_field: kafka.network.metric_fingerprint
      ignore_failure: true

  # Cleanup  
  - remove:
      tag: remove_kafka_network_metric_fingerprint_d6c6ae55
      field: kafka_network_metric_fingerprint
      ignore_missing: true

  - remove:
      tag: remove_kafka_network_mbean_1bd8228e
      field: kafka.network.mbean
      ignore_missing: true

  # Remove jolokia.metrics fields after they've been renamed
  - remove:
      tag: remove_jolokia_metrics_153850d4
      field: jolokia.metrics
      ignore_missing: true
  - remove:
      tag: remove_kafka_mbean_d88bc489
      field: kafka.mbean 
      ignore_missing: true
      
on_failure:
  - set:
      tag: set_event_kind_b8b56f60
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_27c98138
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
