  - grok:
      tag: grok_jolokia_metrics_mbean_d98c0004
      field: "jolokia.metrics.mbean"
      patterns:
        - "kafka.network:type=Acceptor,name=AcceptorBlockedPercent,listener=%{WORD:listener}"
