---
description: Pipeline for processing tanium.threat_response.match_details.finding.whats[].artifact_activity.relevant_actions[]
processors:

  - rename:
      tag: rename_ingest_value_88419475
      field: _ingest._value
      target_field: _action

  - convert:
      tag: convert_action_verb_b1ac498a
      field: _action.verb
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_fbd81472
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
            allow_duplicates: false
  - date:
      tag: date_action_tanium_recorder_context_event_timestamp_ms_50dd703b
      field: _action.tanium_recorder_context.event.timestamp_ms
      target_field: _action.tanium_recorder_context.event.timestamp_ms
      if: ctx._action.tanium_recorder_context?.event?.timestamp_ms != null
      formats:
        - UNIX_MS
      on_failure:
        - append:
            tag: append_error_message_34b043ef
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
            allow_duplicates: false
  - date:
      tag: date_action_target_file_modification_time_f0e741ee
      field: _action.target.file.modification_time
      target_field: _action.target.file.modification_time
      if: ctx._action.target?.file?.modification_time != null
      formats:
        - ISO8601
      on_failure:
        - append:
            tag: append_error_message_1bed31a8
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
            allow_duplicates: false
  - date:
      tag: date_action_timestamp_61f50d6b
      field: _action.timestamp
      target_field: _action.timestamp
      if: ctx._action.timestamp != null
      formats:
        - ISO8601
      on_failure:
        - append:
            tag: append_error_message_615be07b
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
            allow_duplicates: false
  - append:
      tag: append_related_hash_0100cbdd
      field: related.hash
      value: '{{{_action.target.file.hash.md5}}}'
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hash_2_4d006946
      field: related.hash
      value: '{{{_action.target.file.hash.sha1}}}'
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hash_3_4cb9c7ab
      field: related.hash
      value: '{{{_action.target.file.hash.sha256}}}'
      allow_duplicates: false
      ignore_failure: true
  - convert:
      tag: convert_action_target_file_size_bytes_9e49c00f
      field: _action.target.file.size_bytes
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_1e6eea2d
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
            allow_duplicates: false
            ignore_failure: true

  - set:
      tag: set_back__action_bc1e1345
      field: _ingest._value
      copy_from: _action
  - remove:
      tag: remove__action_8087f73f
      field: _action

on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_8ac65503
      field: error.message
      value: >
        Processor "{{{ _ingest.on_failure_processor_type }}}"
        with tag "{{{ _ingest.on_failure_processor_tag }}}"
        in pipeline "{{{ _ingest.on_failure_pipeline }}}"
        failed with message "{{{ _ingest.on_failure_message }}}"
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
