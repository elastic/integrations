---
description: Pipeline for processing Tenable Vulnerability Management audit logs.
processors:
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_b006b7b1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.received
        - json.id
        - json.action
      tag: fingerprint_audit_a586aaf1
      target_field: _id
      ignore_missing: true
  - rename:
      field: json
      tag: rename_json_f4e79e80
      target_field: tenable_io.audit
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.category
      value: configuration
      tag: append_configuration_to_event_category_e14c0668
      if: |
        ctx.tenable_io?.audit?.action != null && [
          'api-access-control-permissions.create',
          'api-access-control-permissions.delete',
          'api-access-control-permissions.update',
          'api-exports-jobs.create',
          'api-findings-vulnerabilities-cloud_resource-count.create',
          'api-findings-vulnerabilities-cloud_resource.create',
          'api-findings-vulnerabilities-host_audit-count.create',
          'api-findings-vulnerabilities-host_audit.create',
          'api-findings-vulnerabilities-host-count.create',
          'api-findings-vulnerabilities-host.create',
          'api-findings-vulnerabilities-webapp-count.create',
          'api-findings-vulnerabilities-webapp.create',
          'asset.hard.delete',
          'credentials.create',
          'dashboards-activity.create',
          'filters-workbenches-assets.create',
          'filters-workbenches-vulnerabilities.create',
          'networks.create',
          'networks.update',
          'permissions-agent-group.update',
          'permissions-scanner-pool.update',
          'permissions-scanner.update',
          'scanner-groups.create',
          'scanner-groups.update',
          'scanners-agent-groups-agents.update',
          'scanners-agent-groups.create',
          'scanners-agents-directives.create',
          'scanners-agents.delete',
          'scanners.delete',
          'scans-pause.create',
          'scans-remediation.create',
          'scans-resume.create',
          'scans.create',
          'scans.delete',
          'scans.update',
          'settings-scanner-rekey.create',
          'workbenches-assets.create'
        ].contains(ctx.tenable_io.audit.action.toLowerCase())
  - append:
      field: event.category
      value: iam
      tag: append_iam_to_event_category_33d39050
      if: |
        ctx.tenable_io?.audit?.action != null && [
          'groups.create',
          'user.create',
          'user.roles.update',
          'user.update'
        ].contains(ctx.tenable_io.audit.action.toLowerCase())
  - append:
      field: event.category
      value: session
      tag: append_session_to_event_category_0845bb21
      if: |
        ctx.tenable_io?.audit?.action != null && [
          'session.create',
          'session.delete',
          'session.impersonation.end',
          'session.impersonation.start'
        ].contains(ctx.tenable_io.audit.action.toLowerCase())
  - append:
      field: event.category
      value: authentication
      tag: append_authentication_to_event_category_884e130e
      if: |
        ctx.tenable_io?.audit?.action != null && [
          'user.authenticate.api_keys',
          'user.authenticate.mfa',
          'user.authenticate.password',
          'user.impersonation.end',
          'user.impersonation.start',
          'user.logout'
        ].contains(ctx.tenable_io.audit.action.toLowerCase())
  - append:
      field: event.type
      value: creation
      tag: append_creation_to_event_type_ed6fdfb8
      if: |
        ctx.tenable_io?.audit?.action != null && ctx.tenable_io.audit.action.toLowerCase().contains('create') && ctx.event?.category != null && (
          ctx.event.category.contains('configuration') ||
          ctx.event.category.contains('iam')
        )
  - append:
      field: event.type
      value: deletion
      tag: append_deletion_to_event_type_d1c5cab3
      if: |
        ctx.tenable_io?.audit?.action != null && ctx.tenable_io.audit.action.toLowerCase().contains('delete') && ctx.event?.category != null && (
          ctx.event.category.contains('configuration') ||
          ctx.event.category.contains('iam')
        )
  - append:
      field: event.type
      value: change
      tag: append_change_to_event_type_529b20cc
      if: |
        ctx.tenable_io?.audit?.action != null && ctx.tenable_io.audit.action.toLowerCase().contains('update') && ctx.event?.category != null && (
          ctx.event.category.contains('configuration') ||
          ctx.event.category.contains('iam')
        )
  - append:
      field: event.type
      value: user
      tag: append_user_to_event_type_bd559f37
      if: ctx.tenable_io?.audit?.action != null && ctx.tenable_io.audit.action.toLowerCase().contains('user') && ctx.event?.category != null && ctx.event.category.contains('iam')
  - append:
      field: event.type
      value: group
      tag: append_group_to_event_type_b2851897
      if: ctx.tenable_io?.audit?.action != null && ctx.tenable_io.audit.action.toLowerCase().contains('group') && ctx.event?.category != null && ctx.event.category.contains('iam')
  - append:
      field: event.type
      value: start
      tag: append_start_to_event_type_0a05ad95
      if: |
        ctx.tenable_io?.audit?.action != null && [
          'session.create',
          'session.impersonation.start',
          'user.authenticate.password',
          'user.authenticate.api_keys',
          'user.impersonation.start',
          'user.authenticate.mfa'
        ].contains(ctx.tenable_io.audit.action.toLowerCase())
  - append:
      field: event.type
      value: end
      tag: append_end_to_event_type_2200b305
      if: |
        ctx.tenable_io?.audit?.action != null && [
          'session.delete',
          'session.impersonation.end',
          'user.impersonation.end',
          'user.logout'
        ].contains(ctx.tenable_io.audit.action.toLowerCase())
  - append:
      field: event.type
      value: info
      tag: append_info_to_event_type_2aaaf903
      if: ctx.event.type == null
  - set:
      field: event.id
      tag: set_event_id_from_id_0165160a
      copy_from: tenable_io.audit.id
      ignore_empty_value: true
  - set:
      field: event.action
      tag: set_event_action_from_action_7bcebb0a
      copy_from: tenable_io.audit.action
      ignore_empty_value: true
  - gsub:
      field: event.action
      tag: gsub_event_action_513efa3d
      pattern: '\.'
      replacement: '-'
      ignore_missing: true
  - convert:
      field: tenable_io.audit.is_failure
      tag: convert_is_failure_to_boolean_e617ee81
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_tenable_io_audit_is_failure_9c41bcf0
            field: tenable_io.audit.is_failure
            ignore_missing: true
        - append:
            tag: append_error_message_0fa05166
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.outcome
      tag: set_event_outcome_to_success_76d3f11c
      value: success
      if: ctx.tenable_io?.audit?.is_failure != null && ctx.tenable_io.audit.is_failure == false
  - set:
      field: event.outcome
      tag: set_event_outcome_to_failure_d8fca29a
      value: failure
      if: ctx.tenable_io?.audit?.is_failure != null && ctx.tenable_io.audit.is_failure == true
  - date:
      field: tenable_io.audit.received
      tag: date_received_a5785870
      target_field: tenable_io.audit.received
      formats:
        - ISO8601
      if: ctx.tenable_io?.audit?.received != null && ctx.tenable_io.audit.received != ''
      on_failure:
        - remove:
            tag: remove_tenable_io_audit_received_03104a61
            field: tenable_io.audit.received
            ignore_missing: true
        - append:
            tag: append_error_message_f0d0e120
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_received_5431ecbf
      copy_from: tenable_io.audit.received
      ignore_empty_value: true
  - set:
      field: message
      tag: set_message_from_description_21f7bc8f
      copy_from: tenable_io.audit.description
      ignore_empty_value: true
  - convert:
      field: tenable_io.audit.is_anonymous
      tag: convert_is_anonymous_to_boolean_0409c029
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_tenable_io_audit_is_anonymous_015fdd9d
            field: tenable_io.audit.is_anonymous
            ignore_missing: true
        - append:
            tag: append_error_message_6511d95b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: user.id
      tag: set_user_id_from_actor_id_0c91f30a
      copy_from: tenable_io.audit.actor.id
      ignore_empty_value: true
  - set:
      field: user.name
      tag: set_user_name_from_actor_name_2ed929d7
      copy_from: tenable_io.audit.actor.name
      ignore_empty_value: true
  - rename:
      field: user.name
      target_field: user.email
      tag: rename_user_email_455f691a
      if: ctx.user?.name != null && ctx.user.name.indexOf("@") > 0
  - dissect:
      field: user.email
      pattern: '%{user.name}@%{user.domain}'
      tag: dissect_user_email_d5fb5c7e
      ignore_missing: true
      ignore_failure: true
      if: ctx.user?.name == null
  - append:
      field: related.user
      tag: append_actor_id_to_related_user_004c480b
      value: '{{{user.id}}}'
      allow_duplicates: false
  - append:
      field: related.user
      tag: append_actor_name_to_related_user_7d3a7fdb
      value: '{{{user.name}}}'
      allow_duplicates: false
  - append:
      field: related.user
      tag: append_actor_email_to_related_user_600fc0eb
      value: '{{{user.email}}}'
      allow_duplicates: false
  - set:
      field: user.target.id
      tag: set_user_target_id_from_target_id_d28e6812
      copy_from: tenable_io.audit.target.id
      ignore_empty_value: true
      if: ctx.tenable_io?.audit?.target?.type != null && ctx.tenable_io.audit.target.type == 'User'
  - append:
      field: related.user
      tag: append_target_id_to_related_user_54848176
      value: '{{{tenable_io.audit.target.id}}}'
      allow_duplicates: false
      if: ctx.tenable_io?.audit?.target?.type != null && ctx.tenable_io.audit.target.type == 'User'
  - set:
      field: user.target.name
      tag: set_user_target_name_from_target_name_aa947e06
      copy_from: tenable_io.audit.target.name
      ignore_empty_value: true
      if: ctx.tenable_io?.audit?.target?.type != null && ctx.tenable_io.audit.target.type == 'User'
  - rename:
      field: user.target.name
      target_field: user.target.email
      tag: rename_user_target_email_76a1b4e4
      if: ctx.user?.target?.name != null && ctx.user.target.name.indexOf("@") > 0
  - dissect:
      field: user.target.email
      pattern: '%{user.target.name}@%{user.target.domain}'
      tag: dissect_user_target_email_660ba767
      ignore_missing: true
      ignore_failure: true
      if: ctx.user?.target?.name == null
  - append:
      field: related.user
      tag: append_target_name_to_related_user_9e603805
      value: '{{{user.target.name}}}'
      allow_duplicates: false
      if: ctx.user?.target?.name != null
  - append:
      field: related.user
      tag: append_target_email_to_related_user_423dd870
      value: '{{{user.target.email}}}'
      allow_duplicates: false
      if: ctx.user?.target?.email != null
  - script:
      lang: painless
      if: ctx.tenable_io?.audit?.fields instanceof List
      description: Dynamically set fields object.
      tag: script_fields_object_9a428e89
      source: |-
        def fields = new HashMap();
        for (f in ctx.tenable_io.audit.fields) {
          fields.put(f.key.toLowerCase(), f.value);
        }
        ctx.tenable_io.audit.fields = fields;
      on_failure:
        - append:
            tag: append_error_message_94537abc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - split:
      field: tenable_io.audit.fields.x-forwarded-for
      tag: split_x-forwarded-for_131593df
      separator: ','
      target_field: tenable_io.audit.fields.x_forwarded_for
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_6e9ffbf3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - trim:
      field: tenable_io.audit.fields.x_forwarded_for
      tag: trim_x_forwarded_for_18abc176
      ignore_missing: true
  - foreach:
      tag: foreach_tenable_io_audit_fields_x_forwarded_for_1ca9db10
      field: tenable_io.audit.fields.x_forwarded_for
      if: ctx.tenable_io?.audit?.fields?.x_forwarded_for instanceof List
      processor:
        convert:
          field: _ingest._value
          tag: convert_x_forwarded_for_to_ip_94fe7be9
          type: ip
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_0417e3e3
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_d45f62ff
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_source_ip_d0cfbedd
      field: source.ip
      value: "{{{tenable_io.audit.fields.x_forwarded_for.0}}}"
      ignore_failure: true
      ignore_empty_value: true
      if: ctx.tenable_io?.audit?.fields?.x_forwarded_for instanceof List && ctx.tenable_io.audit.fields.x_forwarded_for.size() > 0
  - geoip:
      field: source.ip
      target_field: source.geo
      tag: geoip_source_geo_9a2d4d31
      ignore_missing: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      tag: geoip_source_as_58199963
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      field: source.as.asn
      tag: rename_source_as_asn_168bbbaf
      target_field: source.as.number
      ignore_missing: true
  - rename:
      field: source.as.organization_name
      tag: rename_source_as_organization_name_aa06a00b
      target_field: source.as.organization.name
      ignore_missing: true
  - foreach:
      tag: foreach_tenable_io_audit_fields_x_forwarded_for_011b3201
      field: tenable_io.audit.fields.x_forwarded_for
      if: ctx.tenable_io?.audit?.fields?.x_forwarded_for instanceof List
      processor:
        append:
          field: related.ip
          tag: append_x_forwarded_for_into_related_ip_d5c6558c
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - remove:
      field:
        - tenable_io.audit.fields.x-forwarded-for
      tag: remove_x-forwarded-for_ff493c9a
      ignore_missing: true
  - remove:
      field:
        - tenable_io.audit.id
        - tenable_io.audit.action
        - tenable_io.audit.received
        - tenable_io.audit.description
        - tenable_io.audit.actor.id
        - tenable_io.audit.actor.name
      tag: remove_custom_duplicate_fields_c527f783
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
