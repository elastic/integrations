      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - date:
      tag: date_json_created_at_to_tenable_io_asset_created_at_9ade9b19
      field: json.created_at
      target_field: tenable_io.asset.created_at
      formats:
        - ISO8601
      if: ctx.json?.created_at != null && ctx.json.created_at != ''
      on_failure:
        - append:
            tag: append_error_message_1dc0d2ea
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_id_to_tenable_io_asset_id_e8e1ca00
      field: json.id
      target_field: tenable_io.asset.id
      ignore_missing: true
  - set:
