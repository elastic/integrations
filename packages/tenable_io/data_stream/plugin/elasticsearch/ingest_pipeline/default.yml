---
description: Pipeline for processing Tenable Vulnerability Management plugin logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: [info]
  - set:
      tag: set_event_kind_871e09cf
      field: event.kind
      value: state
  - set:
      tag: set_vulnerability_scanner_vendor_72bd9d6b
      field: vulnerability.scanner.vendor
      value: Tenable
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - drop:
      tag: drop_6ed39cf8
      if: ctx.json?.data?.plugin_details != null && ctx.json.data.plugin_details.isEmpty()
  - fingerprint:
      tag: fingerprint_c72696b6
      fields:
        - json.id
        - json.attributes.plugin_modification_date
      target_field: _id
      ignore_missing: true
  - convert:
      tag: convert_json_id_to_tenable_io_plugin_id_56b55dac
      field: json.id
      target_field: tenable_io.plugin.id
      type: string
      if: ctx.json?.id != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_135a0c95
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_name_to_tenable_io_plugin_name_cd3f9ed1
      field: json.name
      target_field: tenable_io.plugin.name
      ignore_missing: true
  - date:
      tag: date_json_attributes_plugin_modification_date_to_tenable_io_plugin_attributes_plugin_modification_date_6d985e72
      field: json.attributes.plugin_modification_date
      target_field: tenable_io.plugin.attributes.plugin.modification_date
      formats:
        - ISO8601
      if: ctx.json?.attributes?.plugin_modification_date != null && ctx.json.attributes.plugin_modification_date != ''
      on_failure:
        - append:
            tag: append_error_message_8f58bfb5
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
