---
description: Pipeline for processing Tenable Vulnerability Management plugin logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - set:
      tag: set_event_type_8bf4a5be
      field: event.type
      value: [info]
  - set:
      tag: set_event_kind_c3139286
      field: event.kind
      value: state
  - set:
      tag: set_vulnerability_scanner_vendor_3e4bb02a
      field: vulnerability.scanner.vendor
      value: Tenable
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_facc4822
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_74d23cc2
      field: event.original
      target_field: json
  - drop:
      tag: drop_39f9ac0b
      if: ctx.json?.data?.plugin_details != null && ctx.json.data.plugin_details.isEmpty()
  - fingerprint:
      tag: fingerprint_to_id_24dce77b
      fields:
        - json.id
        - json.attributes.plugin_modification_date
      target_field: _id
      ignore_missing: true
  - convert:
      tag: convert_json_id_to_tenable_io_plugin_id_e65832ea
      field: json.id
      target_field: tenable_io.plugin.id
      type: string
      if: ctx.json?.id != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_0996b5a1
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_name_to_tenable_io_plugin_name_4f2b39e5
      field: json.name
      target_field: tenable_io.plugin.name
      ignore_missing: true
  - date:
      tag: date_json_attributes_plugin_modification_date_to_tenable_io_plugin_attributes_plugin_modification_date_f3a60719
