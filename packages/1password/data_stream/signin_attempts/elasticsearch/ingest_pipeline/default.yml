---
description: Pipeline for normalizing 1Password Sign-in Attempts Events
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_onepassword_da036177
      field: event.original
      target_field: onepassword
  - drop:
      tag: drop_02acf80d
      description: Drop if no timestamp (invalid json)
      if: "ctx?.onepassword?.timestamp == null"
  #######################
  ## ECS Event Mapping ##
  #######################
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  # Sets event.created from the @timestamp field generated by filebeat before being overwritten further down
  - set:
      tag: set_event_created_e3f09e3b
      field: event.created
      copy_from: "@timestamp"
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      tag: append_event_category_c182a53a
      field: event.category
      value: [authentication]
  - append:
      tag: append_event_type_8b66b73a
      field: event.type
      value: [info]
  - rename:
      tag: rename_onepassword_category_to_event_action_bd89b2f3
      field: onepassword.category
      target_field: event.action
      ignore_missing: true
  - set:
      tag: set_event_outcome_2fb67af6
      field: event.outcome
      value: success
      if: "['success', 'firewall_reported_success'].contains(ctx.event?.action)"
      ignore_failure: true
  - set:
      tag: set_event_outcome_a4807d20
      field: event.outcome
      value: failure
      if: "!['success', 'firewall_reported_success'].contains(ctx.event?.action)"
      ignore_failure: true
  #########################
  ## ECS Related Mapping ##
  #########################
  - append:
      tag: append_related_user_010b6c39
      field: related.user
      value: "{{{onepassword.target_user.uuid}}}"
      allow_duplicates: false
      if: ctx?.onepassword?.target_user?.uuid != null
  - append:
      tag: append_related_user_f29a422b
      field: related.user
      value: "{{{onepassword.target_user.email}}}"
      allow_duplicates: false
      if: ctx?.onepassword?.target_user?.email != null
  - append:
      tag: append_related_user_ed9d32d1
      field: related.user
      value: "{{{onepassword.target_user.name}}}"
      allow_duplicates: false
      if: ctx?.onepassword?.target_user?.name != null
  - append:
      tag: append_related_ip_9c1d4a47
      field: related.ip
      value: "{{{onepassword.client.ip_address}}}"
      allow_duplicates: false
      if: ctx?.onepassword?.client?.ip_address != null
  ######################
  ## ECS User Mapping ##
  ######################
  - rename:
      tag: rename_onepassword_target_user_uuid_to_user_id_0c0de7d1
      field: onepassword.target_user.uuid
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_onepassword_target_user_name_to_user_full_name_957a177d
      field: onepassword.target_user.name
      target_field: user.full_name
      ignore_missing: true
  - set:
      tag: set_user_name_67fd4e49
      field: user.name
      copy_from: user.full_name
      ignore_empty_value: true
  - rename:
      tag: rename_onepassword_target_user_email_to_user_email_ee7be739
      field: onepassword.target_user.email
      target_field: user.email
      ignore_missing: true
  ####################
  ## ECS OS Mapping ##
  ####################
  - rename:
      tag: rename_onepassword_client_os_name_to_host_os_name_700b63f5
      field: onepassword.client.os_name
      target_field: host.os.name
      ignore_missing: true
  - rename:
      tag: rename_onepassword_client_os_version_to_host_os_version_245989d7
      field: onepassword.client.os_version
      target_field: host.os.version
      ignore_missing: true
  ########################
  ## ECS Source Mapping ##
  ########################
  - rename:
      tag: rename_onepassword_client_ip_address_to_source_ip_40e01f74
      field: onepassword.client.ip_address
      target_field: source.ip
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_0494c6b1
      field: source.ip
      target_field: source.geo
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  ######################
  ## ECS Base Mapping ##
  ######################
  - date:
      tag: date_onepassword_timestamp_bea6075a
      field: onepassword.timestamp
      formats:
        - ISO8601
  #############
  ## Cleanup ##
  #############
  - remove:
      tag: remove_onepassword_details_dcf38ff7
      field: onepassword.details
      if: "ctx?.onepassword?.details == null"
      ignore_missing: true
  - remove:
      tag: remove_55d062c7
      field:
        - onepassword.timestamp
        - onepassword.target_user
        - onepassword.location # Use the included GeoIP processor
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
