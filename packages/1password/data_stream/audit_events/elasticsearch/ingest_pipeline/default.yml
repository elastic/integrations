---
description: Pipeline for normalizing 1Password Audit Events
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_onepassword_da036177
      field: event.original
      target_field: onepassword
  - drop:
      tag: drop_02acf80d
      description: Drop if no timestamp (invalid json)
      if: "ctx?.onepassword?.timestamp == null"
  #######################
  ## ECS Event Mapping ##
  #######################
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: "8.11.0"
  # Sets event.created from the @timestamp field generated by filebeat before being overwritten further down
  - set:
      tag: set_event_created_e3f09e3b
      field: event.created
      copy_from: "@timestamp"
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      tag: append_event_category_c8ab9fa2
      field: event.category
      value: [configuration]
  - append:
      tag: append_event_type_8860cef4
      field: event.type
      value: [access]
  - rename:
      tag: rename_onepassword_action_to_event_action_24171185
      field: onepassword.action
      target_field: event.action
      ignore_missing: true
  #########################
  ## ECS Related Mapping ##
  #########################
  - append:
      tag: append_related_user_572fd854
      field: related.user
      value: "{{{onepassword.actor_details.name}}}"
      allow_duplicates: false
      if: ctx.onepassword?.actor_details?.name != null
  - append:
      tag: append_related_user_6d2a829f
      field: related.user
      value: "{{{onepassword.actor_uuid}}}"
      allow_duplicates: false
      if: ctx.onepassword?.actor_uuid != null
  - append:
      tag: append_related_user_ec2b4068
      field: related.user
      value: "{{{onepassword.object_uuid}}}"
      allow_duplicates: false
      if: ctx.onepassword?.object_type == "user" && ctx?.onepassword?.object_uuid != null
  - append:
      tag: append_related_user_54a15ffd
      field: related.user
      value: "{{{onepassword.aux_uuid}}}"
      allow_duplicates: false
      if: ctx.onepassword?.object_type == "gm" && ctx?.onepassword?.aux_uuid != null
  - append:
      tag: append_related_user_b2338d93
      field: related.user
      value: "{{{onepassword.aux_uuid}}}"
      allow_duplicates: false
      if: ctx.onepassword?.object_type == "device" && ctx?.onepassword?.aux_uuid != null
  - append:
      tag: append_related_user_f39de967
      field: related.user
      value: "{{{onepassword.aux_uuid}}}"
      allow_duplicates: false
      if: ctx.onepassword?.object_type == "uva" && ctx?.onepassword?.aux_uuid != null
  - append:
      tag: append_related_ip_93983512
      field: related.ip
      value: "{{{onepassword.session.ip}}}"
      allow_duplicates: false
      if: ctx.onepassword?.session?.ip != null
  ######################
  ## ECS User Mapping ##
  ######################
  - rename:
      tag: rename_onepassword_actor_uuid_to_user_id_60afb126
      field: onepassword.actor_uuid
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_onepassword_actor_details_name_to_user_full_name_c880bb1c
      field: onepassword.actor_details.name
      target_field: user.full_name
      ignore_missing: true
  - set:
      tag: set_user_name_67fd4e49
      field: user.name
      copy_from: user.full_name
      ignore_empty_value: true
  - rename:
      tag: rename_onepassword_actor_details_email_to_user_email_1e9bf80a
      field: onepassword.actor_details.email
      target_field: user.email
      ignore_missing: true
  ########################
  ## ECS Source Mapping ##
  ########################
  - rename:
      tag: rename_onepassword_session_ip_to_source_ip_23f74ca6
      field: onepassword.session.ip
      target_field: source.ip
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_0494c6b1
      field: source.ip
      target_field: source.geo
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  ######################
  ## ECS Base Mapping ##
  ######################
  - date:
      tag: date_onepassword_timestamp_bea6075a
      field: onepassword.timestamp
      formats:
        - ISO8601
  #############
  ## Cleanup ##
  #############
  - remove:
      tag: remove_49b6d979
      field:
        - onepassword.timestamp
        - onepassword.user
        - onepassword.location # Use the included GeoIP processor
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
