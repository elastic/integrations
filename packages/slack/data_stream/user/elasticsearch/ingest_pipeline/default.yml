---
description: Pipeline for processing Slack Enterprise Grid user records.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  - drop:
      if: ctx.message == 'retry'
      tag: drop_retry_placeholder
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original message field to event.original. The event.original
        field is left unchanged when the document already has one.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The message field is no longer required if the document has an event.original field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: parse_json
      target_field: slack.user
      if: ctx.event?.original != null
  - fingerprint:
      fields:
        - slack.user.id
      target_field: _id
      tag: set_fingerprint_id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind
      value: asset
  - append:
      field: event.category
      tag: append_event_category
      value: iam
  - append:
      field: event.type
      tag: append_event_type
      value:
        - user
        - info
  - set:
      field: user.id
      tag: set_user_id
      copy_from: slack.user.id
      ignore_empty_value: true
  - set:
      field: user.name
      tag: set_user_name
      copy_from: slack.user.username
      ignore_empty_value: true
  - set:
      field: user.full_name
      tag: set_user_full_name
      copy_from: slack.user.full_name
      ignore_empty_value: true
  - set:
      field: user.email
      tag: set_user_email
      copy_from: slack.user.email
      ignore_empty_value: true
  - script:
      tag: set_user_roles
      description: Map Slack admin, owner, guest, and bot flags onto user.roles.
      lang: painless
      source: |-
        def roles = new ArrayList();
        if (ctx.slack?.user?.is_primary_owner == true) {
          roles.add('primary_owner');
        }
        if (ctx.slack?.user?.is_owner == true) {
          roles.add('owner');
        }
        if (ctx.slack?.user?.is_admin == true) {
          roles.add('admin');
        }
        if (ctx.slack?.user?.is_ultra_restricted == true) {
          roles.add('single_channel_guest');
        } else if (ctx.slack?.user?.is_restricted == true) {
          roles.add('guest');
        }
        if (ctx.slack?.user?.is_bot == true) {
          roles.add('bot');
        }
        if (!roles.isEmpty()) {
          if (ctx.user == null) {
            ctx.user = new HashMap();
          }
          ctx.user.roles = roles;
        }
  - set:
      field: user.entity.id
      tag: set_user_entity_id
      copy_from: user.id
      ignore_empty_value: true
  - set:
      field: user.entity.name
      tag: set_user_entity_name
      copy_from: user.name
      ignore_empty_value: true
  - set:
      field: user.entity.display_name
      tag: set_user_entity_display_name
      copy_from: user.full_name
      ignore_empty_value: true
  - set:
      field: user.entity.type
      tag: set_user_entity_type
      value:
        - user
  - set:
      field: user.entity.source
      tag: set_user_entity_source
      value: slack
  - set:
      field: user.entity.last_seen_timestamp
      tag: set_user_entity_last_seen_timestamp
      copy_from: '@timestamp'
      ignore_empty_value: true
  - set:
      field: user.entity.sub_type
      tag: set_user_entity_sub_type_bot
      value:
        - bot
      if: ctx.slack?.user?.is_bot == true
  - set:
      field: user.entity.sub_type
      tag: set_user_entity_sub_type_guest
      value:
        - guest
      if: ctx.slack?.user?.is_bot != true && (ctx.slack?.user?.is_restricted == true || ctx.slack?.user?.is_ultra_restricted == true)
  - set:
      field: user.entity.sub_type
      tag: set_user_entity_sub_type_member
      value:
        - member
      if: ctx.user?.entity?.sub_type == null
  - set:
      field: user.entity.attributes.mfa_enabled
      tag: set_user_entity_mfa_enabled
      copy_from: slack.user.has_2fa
      ignore_empty_value: true

  - date:
      field: slack.user.date_created
      tag: date_created
      target_field: slack.user.date_created
      formats:
        - UNIX
      if: ctx.slack?.user?.date_created != null && ctx.slack.user.date_created != 0
      on_failure:
        - append:
            field: error.message
            tag: date_created_error
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}
  - date:
      field: slack.user.deactivated_ts
      tag: date_deactivated
      target_field: slack.user.deactivated_ts
      formats:
        - UNIX
      if: ctx.slack?.user?.deactivated_ts != null && ctx.slack.user.deactivated_ts != 0
      on_failure:
        - append:
            field: error.message
            tag: date_deactivated_error
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}
  - date:
      field: slack.user.expiration_ts
      tag: date_expiration
      target_field: slack.user.expiration_ts
      formats:
        - UNIX
      if: ctx.slack?.user?.expiration_ts != null && ctx.slack.user.expiration_ts != 0
      on_failure:
        - append:
            field: error.message
            tag: date_expiration_error
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}
  - date:
      field: slack.user.last_active_ts
      tag: date_last_active
      target_field: slack.user.last_active_ts
      formats:
        - UNIX
      if: ctx.slack?.user?.last_active_ts != null && ctx.slack.user.last_active_ts != 0
      on_failure:
        - append:
            field: error.message
            tag: date_last_active_error
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}
  - set:
      field: user.entity.lifecycle.last_activity
      tag: set_user_entity_last_activity
      copy_from: slack.user.last_active_ts
      ignore_empty_value: true

  - foreach:
      field: slack.user.groups
      tag: date_group_create
      ignore_missing: true
      if: ctx.slack?.user?.groups instanceof List
      processor:
        date:
          field: _ingest._value.date_create
          target_field: _ingest._value.date_create
          tag: date_group_create_value
          formats:
            - UNIX
          if: ctx._ingest?._value?.date_create != null && ctx._ingest._value.date_create != 0
          on_failure:
            - append:
                field: error.message
                tag: date_group_create_error
                value: >-
                  Processor {{{_ingest.on_failure_processor_type}}} with tag
                  {{{_ingest.on_failure_processor_tag}}} failed with message:
                  {{{_ingest.on_failure_message}}}
  - foreach:
      field: slack.user.groups
      tag: date_group_update
      ignore_missing: true
      if: ctx.slack?.user?.groups instanceof List
      processor:
        date:
          field: _ingest._value.date_update
          target_field: _ingest._value.date_update
          tag: date_group_update_value
          formats:
            - UNIX
          if: ctx._ingest?._value?.date_update != null && ctx._ingest._value.date_update != 0
          on_failure:
            - append:
                field: error.message
                tag: date_group_update_error
                value: >-
                  Processor {{{_ingest.on_failure_processor_type}}} with tag
                  {{{_ingest.on_failure_processor_tag}}} failed with message:
                  {{{_ingest.on_failure_message}}}
  - foreach:
      field: slack.user.groups
      tag: date_group_delete
      ignore_missing: true
      if: ctx.slack?.user?.groups instanceof List
      processor:
        date:
          field: _ingest._value.date_delete
          target_field: _ingest._value.date_delete
          tag: date_group_delete_value
          formats:
            - UNIX
          if: ctx._ingest?._value?.date_delete != null && ctx._ingest._value.date_delete != 0
          on_failure:
            - append:
                field: error.message
                tag: date_group_delete_error
                value: >-
                  Processor {{{_ingest.on_failure_processor_type}}} with tag
                  {{{_ingest.on_failure_processor_tag}}} failed with message:
                  {{{_ingest.on_failure_message}}}
  - append:
      field: related.user
      tag: append_related_user_name
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      tag: append_related_user_full_name
      value: '{{{user.full_name}}}'
      allow_duplicates: false
      if: ctx.user?.full_name != null
  - append:
      field: related.user
      tag: append_related_user_email
      value: '{{{user.email}}}'
      allow_duplicates: false
      if: ctx.user?.email != null
  - append:
      field: related.user
      tag: append_related_user_id
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
  - remove:
      field:
        - slack.user.id
        - slack.user.username
        - slack.user.full_name
        - slack.user.email
      tag: remove_ecs_mapped_fields
      ignore_missing: true
      description: Drop Slack fields that are always copied to ECS.
  # ----- Drop null/empty leaf values from the document -----
  - script:
      tag: script_to_drop_null_values_547f54ab
      description: Drop null/empty leaf values from the document.
      lang: painless
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);      
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
