  - rename:
      tag: rename_slack_entity_enterprise_to_slack_audit_entity_ac85deab
      field: slack.entity.enterprise
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_user_to_slack_audit_entity_19b00a27
      field: slack.entity.user
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_file_to_slack_audit_entity_7a1b6d60
      field: slack.entity.file
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_channel_to_slack_audit_entity_bddcced7
      field: slack.entity.channel
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_app_to_slack_audit_entity_ef363c2b
      field: slack.entity.app
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_workflow_to_slack_audit_entity_3ec15d51
      field: slack.entity.workflow
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_usergroup_to_slack_audit_entity_91e07a68
      field: slack.entity.usergroup
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_barrier_to_slack_audit_entity_9c6ec0d3
      field: slack.entity.barrier
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_message_to_slack_audit_entity_4024e9a3
      field: slack.entity.message
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_role_to_slack_audit_entity_33cd2d0a
      field: slack.entity.role
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_account_type_role_to_slack_audit_entity_b2044765
      field: slack.entity.account_type_role
      target_field: slack.audit.entity
      ignore_missing: true
      if: ctx.slack?.audit?.entity == null
  - rename:
      tag: rename_slack_entity_type_to_slack_audit_entity_entity_type_5e23d6e5
      field: slack.entity.type
      target_field: slack.audit.entity.entity_type
      ignore_missing: true
  - rename:
      tag: rename_slack_context_ua_to_user_agent_original_d611f2d9
      field: slack.context.ua
      target_field: user_agent.original
      ignore_missing: true
  - user_agent:
      tag: user_agent_user_agent_original_6a886ea1
      field: user_agent.original
      ignore_failure: true
  - remove:
      tag: remove_slack_context_ip_address_5b72ec4a
      field: slack.context.ip_address
      ignore_missing: true
      if: ctx.slack?.context?.ip_address == ""
  - rename:
      tag: rename_slack_context_ip_address_to_source_address_c6d6f524
      field: slack.context.ip_address
      target_field: source.address
      ignore_missing: true
  - rename:
      tag: rename_slack_details_to_slack_audit_details_a5f2c2fd
      field: slack.details
      target_field: slack.audit.details
      ignore_missing: true
  - convert:
      tag: convert_slack_audit_details_previous_ip_address_to_slack_audit_details_previous_ip_address_717a4e39
      type: ip
      field: slack.audit.details.previous_ip_address
      target_field: slack.audit.details.previous_ip_address
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_slack_audit_details_previous_ip_address_dedfbfd3
            field: slack.audit.details.previous_ip_address
            ignore_failure: true
        - set:
            tag: set_event_kind_c0847361
            field: event.kind
            value: pipeline_error
        - append:
            tag: append_error_message_2c221fe6
            field: error.message
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
              {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - rename:
      tag: rename_slack_audit_details_previous_ua_to_slack_audit_details_previous_user_agent_a9c60689
      field: slack.audit.details.previous_ua
      target_field: slack.audit.details.previous_user_agent
      ignore_missing: true
  - rename:
      tag: rename_slack_audit_details_md5_hash_to_slack_audit_details_md5_111a4bc9
      field: slack.audit.details.md5_hash
      target_field: slack.audit.details.md5
      ignore_missing: true
  - append:
      tag: append_related_hash_bc2dce76
      field: related.hash
      value: '{{{slack.audit.details.md5}}}'
      allow_duplicates: false
      if: ctx.slack?.audit?.details?.md5 != null
  - set:
      tag: set_file_hash_md5_5d67419d
      field: file.hash.md5
      copy_from: slack.audit.details.md5
      ignore_empty_value: true
      if: ctx.slack?.audit?.entity?.entity_type == "file"
  - script:
      if: ctx.slack?.audit?.details?.action_timestamp != null && ctx.slack.audit.details.action_timestamp > 1e13
      description: Parse action_timestamp as microseconds since unix epoch.
      tag: action-timestamp-microseconds
      source: |
        def secs = (long)(ctx.slack.audit.details.action_timestamp/1e6);
        def nanos = (long)(ctx.slack.audit.details.action_timestamp % 1e6) * 1000;
        ctx["@timestamp"] = Instant.ofEpochSecond(secs, nanos).atZone(ZoneId.of("UTC"));
        ctx.slack.audit.details.remove("action_timestamp");
  - date:
      tag: date_slack_audit_details_action_timestamp_1ba6a3ee
      if: ctx.slack?.audit?.details?.action_timestamp != null
      field: slack.audit.details.action_timestamp
      formats:
        - UNIX_MS
      on_failure:
        - remove:
            tag: remove_slack_audit_details_action_timestamp_cff2c60d
            field: slack.audit.details.action_timestamp
            ignore_failure: true
        - set:
            tag: set_event_kind_33293fe6
            field: event.kind
            value: pipeline_error
        - append:
            tag: append_error_message_b0efad9f
            field: error.message
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
              {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - remove:
      tag: remove_slack_audit_details_action_timestamp_53982ef6
      field: slack.audit.details.action_timestamp
      ignore_missing: true
  - uri_parts:
      tag: uri_parts_slack_audit_details_url_private_408425d1
      field: slack.audit.details.url_private
      ignore_missing: true
  - convert:
      tag: convert_source_address_to_source_ip_48c76f83
      field: source.address
      target_field: source.ip
      type: ip
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_slack_context_location_to_slack_audit_context_371ca096
      field: slack.context.location
      target_field: slack.audit.context
      ignore_missing: true
  - rename:
      tag: rename_slack_context_session_id_to_slack_audit_context_session_id_254dbadd
      field: slack.context.session_id
      target_field: slack.audit.context.session_id
      ignore_missing: true
  - convert:
      tag: convert_slack_audit_context_session_id_15e7654c
      field: slack.audit.context.session_id
      type: string
      ignore_missing: true
  - append:
      tag: append_related_user_7f407fef
      field: related.user
      value: "{{{user.id}}}"
      allow_duplicates: false
      if: ctx.user?.id != null
  - append:
      tag: append_related_user_34fcf415
      field: related.user
      value: "{{{user.email}}}"
      allow_duplicates: false
      if: ctx.user?.email != null
  - append:
      tag: append_related_ip_86933b04
      field: related.ip
      value: "{{{source.ip}}}"
      if: ctx.source?.ip != null
  - script:
      lang: painless
      tag: Add ECS categorization
      params:
        ## User Actions
        user_login:
          category:
            - authentication
            - session
          type:
            - info
            - start
          outcome: success
        user_login_failed:
          category:
            - authentication
          type:
            - info
          outcome: failure
        user_logout:
          category:
            - authentication
            - session
          type:
            - info
            - end
          outcome: success
        user_session_invalidated:
          category:
            - authentication
            - session
          type:
            - info
            - end
          outcome: success
        user_session_reset_by_admin:
          category:
            - authentication
            - session
          type:
            - info
            - end
          outcome: success
        user_created:
          category:
            - iam
          type:
            - creation
            - user
        user_deactivated:
          category:
            - iam
          type:
            - deletion
            - user
        user_reactivated:
          category:
            - iam
          type:
            - change
            - user
        role_change_to_admin:
          category:
            - iam
          type:
            - change
            - user
            - admin
        role_change_to_guest:
          category:
            - iam
          type:
            - change
            - user
        role_change_to_owner:
          category:
            - iam
          type:
            - change
            - user
            - admin
        role_change_to_user:
          category:
            - iam
          type:
            - change
            - user
        user_email_updated:
          category:
            - iam
          type:
            - change
            - user
        ## User Group Actions
        user_added_to_usergroup:
          category:
            - iam
          type:
            - change
            - group
            - user
        user_removed_from_usergroup:
          category:
            - iam
          type:
            - change
            - group
            - user
        default_channel_added_to_usergroup:
          category:
            - iam
            - configuration
          type:
            - change
            - group
        default_channel_removed_from_usergroup:
          category:
            - iam
            - configuration
          type:
            - change
            - group
        role_added_to_usergroup:
          category:
            - iam
          type:
            - change
            - group
        role_removed_from_usergroup:
          category:
            - iam
          type:
            - change
            - group
        role_modified_on_usergroup:
          category:
            - iam
          type:
            - change
            - group
        ## User Group Actions
        file_downloaded:
          category:
            - file
          type:
            - access
        file_downloaded_blocked:
          category:
            - file
          type:
            - denied
        file_uploaded:
          category:
            - file
          type:
            - creation
        file_public_link_created:
          category:
            - file
          type:
            - info
        file_public_link_revoked:
          category:
            - file
          type:
            - info
        file_shared:
          category:
            - file
          type:
            - info
        file_malicious_content_detected:
          category:
            - file
            - malware
          type:
            - info
      source: |
        ctx.event.kind = 'event';
        ctx.event.type = ['info'];
        if (ctx.event?.action == null) {
            return;
        }
        if (params.get(ctx.event.action) == null) {
            return;
        }
        def hm = new HashMap(params.get(ctx.event.action));
        hm.forEach((k, v) -> ctx.event[k] = v);
  - script:
      tag: script_4d6993cb
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        void handleMap(Map map) {
          for (def x : map.values()) {
            if (x instanceof Map) {
                handleMap(x);
            } else if (x instanceof List) {
                handleList(x);
            }
          }
          map.values().removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        void handleList(List list) {
          for (def x : list) {
              if (x instanceof Map) {
                  handleMap(x);
              } else if (x instanceof List) {
                  handleList(x);
              }
          }
          list.removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        handleMap(ctx);
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
