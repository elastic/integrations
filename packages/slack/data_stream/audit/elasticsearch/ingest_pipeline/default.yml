---
description: Pipeline for parsing Slack Audit logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_slack_107dfc1c
      field: event.original
      target_field: slack
  - date:
      tag: date_slack_date_create_to_timestamp_9b3d37a2
      field: slack.date_create
      formats:
        - UNIX
      target_field: "@timestamp"
  - remove:
      tag: remove_slack_date_create_110adfc5
      field: slack.date_create
      ignore_missing: true
  - rename:
      tag: rename_slack_action_to_event_action_887c8d10
      field: slack.action
      target_field: event.action
      ignore_missing: true
  - rename:
      tag: rename_slack_id_to_event_id_9020d75c
      field: slack.id
      target_field: event.id
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_f716d506
      fields:
        - event.id
      target_field: _id
      ignore_missing: true
  - rename:
      tag: rename_slack_actor_user_id_to_user_id_87e1f78f
      field: slack.actor.user.id
      target_field: user.id
      ignore_missing: true
  - rename:
