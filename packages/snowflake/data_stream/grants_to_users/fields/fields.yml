- name: snowflake.grants_to_users
  type: group
  description: Fields from SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_USERS that have no ECS equivalent.
  fields:
    - name: granted_to
      type: keyword
      description: Object type that received the grant. Always USER for this view.
    - name: granted_by
      type: keyword
      description: Role that performed the grant.
