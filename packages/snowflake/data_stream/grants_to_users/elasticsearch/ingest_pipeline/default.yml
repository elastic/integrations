---
description: Parse Snowflake GRANTS_TO_USERS events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json

  - date:
      field: json.CREATED_ON
      target_field: event.start
      tag: date_created_on
      formats:
        - yyyy-MM-dd HH:mm:ss.SSS Z
        - yyyy-MM-dd HH:mm:ss.SSS XX
        - ISO8601
      if: ctx.json?.CREATED_ON != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_created_on_failure
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              with tag '{{{ _ingest.on_failure_processor_tag }}}'
              failed with message '{{{ _ingest.on_failure_message }}}'
  - date:
      field: json.DELETED_ON
      target_field: event.end
      tag: date_deleted_on
      formats:
        - yyyy-MM-dd HH:mm:ss.SSS Z
        - yyyy-MM-dd HH:mm:ss.SSS XX
        - ISO8601
      if: ctx.json?.DELETED_ON != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_deleted_on_failure
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              with tag '{{{ _ingest.on_failure_processor_tag }}}'
              failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_event_end
      copy_from: event.end
      if: ctx.event?.end != null
      ignore_empty_value: true
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_event_start
      copy_from: event.start
      override: false
      ignore_empty_value: true

  - fingerprint:
      fields:
        - json.ROLE
        - json.GRANTEE_NAME
        - json.CREATED_ON
      target_field: event.id
      ignore_missing: true
      tag: fingerprint_event_id

  - rename:
      field: json.GRANTEE_NAME
      target_field: user.target.name
      ignore_missing: true
      tag: rename_grantee_name
  - append:
      field: user.roles
      tag: append_role_to_user_roles
      value: '{{{json.ROLE}}}'
      allow_duplicates: false
  - rename:
      field: json.GRANTED_BY
      target_field: snowflake.grants_to_users.granted_by
      ignore_missing: true
      tag: rename_granted_by
  - rename:
      field: json.GRANTED_TO
      target_field: snowflake.grants_to_users.granted_to
      ignore_missing: true
      tag: rename_granted_to

  - append:
      field: related.user
      tag: append_grantee_to_related
      value: '{{{user.target.name}}}'
      allow_duplicates: false
      if: ctx.user?.target?.name != null

  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value: iam
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_change
      value: change
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_user
      value: user
      allow_duplicates: false
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Snowflake
  - set:
      field: observer.product
      tag: set_observer_product
      value: Snowflake

  - remove:
      field:
        - json
      ignore_missing: true
      tag: remove_temp_fields

  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);

  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      tag: append_error_message_d1950926
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
