wait_for_data_timeout: 1m
input: cel
service: snowflake
vars:
  url: http://{{Hostname}}:{{Port}}
  role: ELASTIC_SNOWFLAKE_ROLE
  warehouse: SECURITY_WH
  token: test-snowflake-pat
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    lag_time: 15m
    batch_size: 10000
    event_table: SNOWFLAKE.TELEMETRY.EVENTS
    http_client_timeout: 90s
    preserve_original_event: true
assert:
  # Mock returns 5 LOG rows (round 1: 4 handler logs; round 2: 1 follow-up log).
  hit_count: 5
