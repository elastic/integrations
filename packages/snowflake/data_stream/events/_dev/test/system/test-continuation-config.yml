wait_for_data_timeout: 1m
input: cel
service: snowflake
vars:
  url: http://{{Hostname}}:{{Port}}
  role: ELASTIC_SNOWFLAKE_ROLE
  warehouse: SECURITY_WH
  token: test-snowflake-pat
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    lag_time: 15m
    batch_size: 2
    event_table: SNOWFLAKE.TELEMETRY.EVENTS_VIEW
    http_client_timeout: 90s
    preserve_original_event: true
assert:
  # Five LOG rows are indexed across LIMIT 2 pages and the lag-window resume.
  hit_count: 5
