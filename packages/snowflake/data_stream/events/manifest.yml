title: "Events"
type: logs
streams:
  - input: cel
    title: Collect Snowflake event table telemetry
    description: Handler log messages (RECORD_TYPE LOG) from the event table. SPAN, SPAN_EVENT, METRIC, and EVENT rows are dropped.
    template_path: cel.yml.hbs
    vars:
      - name: event_table
        type: text
        title: Event table
        description: "Fully qualified event table or view. Default SNOWFLAKE.TELEMETRY.EVENTS_VIEW is readable by EVENTS_VIEWER. Find a custom table with SHOW PARAMETERS LIKE 'EVENT_TABLE' IN ACCOUNT."
        multi: false
        required: true
        show_user: true
        default: SNOWFLAKE.TELEMETRY.EVENTS_VIEW
      - name: interval
        type: text
        title: Interval
        description: "How often to poll. Event tables are nearer real time than ACCOUNT_USAGE views. Units: h, m, s."
        multi: false
        required: true
        show_user: true
        default: 2h
      - name: initial_interval
        type: text
        title: Initial interval
        description: "How far back to collect on the first poll. Units: h, m, s."
        multi: false
        required: true
        show_user: true
        default: 24h
      - name: lag_time
        type: text
        title: Lag time
        description: "How far before the last event to read again so late rows are included. Event tables have no published latency. Units: h, m, s."
        multi: false
        required: true
        show_user: true
        default: 15m
      - name: batch_size
        type: integer
        title: Batch size
        description: SQL LIMIT applied to each event table statement. Result partitions are still chosen by Snowflake.
        multi: false
        required: true
        show_user: false
        default: 10000
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: >-
          HTTP timeout for submit, poll, and partition requests. Snowflake statement execution limits follow account or warehouse STATEMENT_TIMEOUT_IN_SECONDS.
        multi: false
        required: false
        show_user: false
        default: 90s
      - name: resource_retry_max_attempts
        type: text
        title: Resource Retry Max Attempts
        description: Maximum number of retries for the HTTP client. Default is "5".
        multi: false
        required: false
        show_user: false
      - name: resource_retry_wait_min
        type: text
        title: Resource Retry Wait Min
        description: Minimum time to wait before a retry is attempted. Default is "1s".
        multi: false
        required: false
        show_user: false
      - name: resource_retry_wait_max
        type: text
        title: Resource Retry Wait Max
        description: Maximum time to wait before a retry is attempted. Default is "60s".
        multi: false
        required: false
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - snowflake-events
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          The request tracer logs HTTP requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        multi: false
        required: false
        show_user: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        multi: false
        required: false
        show_user: false
