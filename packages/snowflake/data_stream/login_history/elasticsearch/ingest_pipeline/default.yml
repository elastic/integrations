---
description: Parse Snowflake LOGIN_HISTORY events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json

  - date:
      field: json.EVENT_TIMESTAMP
      target_field: '@timestamp'
      tag: date_event_timestamp
      formats:
        - yyyy-MM-dd HH:mm:ss.SSS Z
        - yyyy-MM-dd HH:mm:ss.SSS XX
        - ISO8601
      if: ctx.json?.EVENT_TIMESTAMP != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_event_timestamp_failure
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              with tag '{{{ _ingest.on_failure_processor_tag }}}'
              failed with message '{{{ _ingest.on_failure_message }}}'
  - rename:
      field: json.EVENT_ID
      target_field: event.id
      ignore_missing: true
      tag: rename_event_id
  - rename:
      field: json.EVENT_TYPE
      target_field: event.action
      ignore_missing: true
      tag: rename_event_type
  - rename:
      field: json.USER_NAME
      target_field: user.name
      ignore_missing: true
      tag: rename_user_name
  - convert:
      field: json.CLIENT_IP
      target_field: source.ip
      type: ip
      ignore_missing: true
      tag: convert_client_ip
      on_failure:
        - rename:
            field: json.CLIENT_IP
            target_field: snowflake.login_history.client_ip
            tag: rename_non_ip_client_ip
  - rename:
      field: json.ERROR_CODE
      target_field: error.code
      ignore_missing: true
      tag: rename_error_code
  - rename:
      field: json.ERROR_MESSAGE
      target_field: event.reason
      ignore_missing: true
      tag: rename_error_message

  - rename:
      field: json.REPORTED_CLIENT_TYPE
      target_field: snowflake.login_history.reported_client_type
      ignore_missing: true
      tag: rename_reported_client_type
  - rename:
      field: json.REPORTED_CLIENT_VERSION
      target_field: snowflake.login_history.reported_client_version
      ignore_missing: true
      tag: rename_reported_client_version
  - rename:
      field: json.FIRST_AUTHENTICATION_FACTOR
      target_field: snowflake.login_history.first_authentication_factor
      ignore_missing: true
      tag: rename_first_authentication_factor
  - rename:
      field: json.SECOND_AUTHENTICATION_FACTOR
      target_field: snowflake.login_history.second_authentication_factor
      ignore_missing: true
      tag: rename_second_authentication_factor
  - rename:
      field: json.FIRST_AUTHENTICATION_FACTOR_ID
      target_field: snowflake.login_history.first_authentication_factor_id
      ignore_missing: true
      tag: rename_first_authentication_factor_id
  - rename:
      field: json.SECOND_AUTHENTICATION_FACTOR_ID
      target_field: snowflake.login_history.second_authentication_factor_id
      ignore_missing: true
      tag: rename_second_authentication_factor_id
  - rename:
      field: json.RELATED_EVENT_ID
      target_field: snowflake.login_history.related_event_id
      ignore_missing: true
      tag: rename_related_event_id
  - rename:
      field: json.CONNECTION
      target_field: snowflake.login_history.connection
      ignore_missing: true
      tag: rename_connection
  - rename:
      field: json.CLIENT_PRIVATE_LINK_ID
      target_field: snowflake.login_history.client_private_link_id
      ignore_missing: true
      tag: rename_client_private_link_id
  - rename:
      field: json.AUTHORIZING_INTEGRATION_NAME
      target_field: snowflake.login_history.authorizing_integration_name
      ignore_missing: true
      tag: rename_authorizing_integration_name

  - json:
      field: json.LOGIN_DETAILS
      target_field: snowflake.login_history.login_details
      tag: parse_login_details_json
      if: ctx.json?.LOGIN_DETAILS instanceof String && ctx.json.LOGIN_DETAILS != ''
  - rename:
      field: json.LOGIN_DETAILS
      target_field: snowflake.login_history.login_details
      ignore_missing: true
      tag: rename_login_details_object
      if: ctx.json?.LOGIN_DETAILS instanceof Map
  - json:
      field: snowflake.login_history.login_details.malicious_ip_protection_info
      tag: parse_malicious_ip_protection_info_json
      if: >-
        ctx.snowflake?.login_history?.login_details?.malicious_ip_protection_info instanceof String
        && ctx.snowflake.login_history.login_details.malicious_ip_protection_info != ''
  - rename:
      field: snowflake.login_history.login_details.malicious_ip_protection_info.riskClassification
      target_field: snowflake.login_history.login_details.malicious_ip_protection_info.risk_classification
      ignore_missing: true
      tag: rename_mip_risk_classification

  - geoip:
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      tag: enrich_source_geo
      if: ctx.source?.ip != null && ctx.source.geo == null
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: enrich_source_asn
      if: ctx.source?.ip != null && ctx.source.as == null
  - rename:
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
      tag: rename_source_asn
  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      tag: rename_source_as_org

  - append:
      field: related.ip
      tag: append_source_ip_to_related
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      field: related.user
      tag: append_user_name_to_related
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null

  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value: authentication
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type
      value: start
      allow_duplicates: false
  - set:
      field: event.outcome
      tag: set_event_outcome_success
      value: success
      if: ctx.json?.IS_SUCCESS == 'YES'
  - set:
      field: event.outcome
      tag: set_event_outcome_failure
      value: failure
      if: ctx.json?.IS_SUCCESS == 'NO'
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Snowflake
  - set:
      field: observer.product
      tag: set_observer_product
      value: Snowflake

  - remove:
      field: json
      ignore_missing: true
      tag: remove_temp_fields

  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);

  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      tag: append_error_message_d1950926
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
