- name: snowflake.stages
  type: group
  description: Fields from SNOWFLAKE.ACCOUNT_USAGE.STAGES that have no ECS equivalent.
  fields:
    - name: stage_id
      type: keyword
      description: Internal, Snowflake-generated identifier for the stage.
    - name: stage_name
      type: keyword
      description: Name of the stage.
    - name: stage_schema_id
      type: keyword
      description: Internal, Snowflake-generated identifier of the schema that the stage belongs to.
    - name: stage_schema
      type: keyword
      description: Schema that the stage belongs to.
    - name: stage_catalog_id
      type: keyword
      description: Internal, Snowflake-generated identifier of the database that the stage belongs to.
    - name: stage_catalog
      type: keyword
      description: Database that the stage belongs to.
    - name: stage_region
      type: keyword
      description: Region where the stage is located.
    - name: stage_type
      type: keyword
      description: Type of the stage, for example Internal Named or External Named. Null for stages owned by Snowflake applications.
    - name: stage_owner
      type: keyword
      description: Name of the role that owns the stage. Null if the stage has been dropped.
    - name: owner_role_type
      type: keyword
      description: Type of the role that owns the stage, for example ROLE or APPLICATION.
    - name: instance_id
      type: keyword
      description: Internal, Snowflake-generated identifier of the application instance that owns the stage, when the owner is an application.
    - name: storage_integration
      type: keyword
      description: Name of the storage integration associated with an external stage.
    - name: created
      type: date
      description: Date and time when the stage was created.
    - name: last_altered
      type: date
      description: Date and time when the stage was last altered by a DDL statement.
    - name: deleted
      type: date
      description: Date and time when the stage was dropped.
