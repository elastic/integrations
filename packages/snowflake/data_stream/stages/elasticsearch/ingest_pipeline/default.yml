---
description: Parse Snowflake STAGES events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json

  # STAGES is an object-history view: CREATED, LAST_ALTERED and DELETED describe the lifecycle of one stage.
  - date:
      field: json.CREATED
      target_field: snowflake.stages.created
      tag: date_created
      formats:
        - yyyy-MM-dd HH:mm:ss.SSS Z
        - yyyy-MM-dd HH:mm:ss.SSS XX
        - ISO8601
      if: ctx.json?.CREATED != null
      on_failure:
        - remove:
            field: json.CREATED
            tag: remove_unparsed_created
        - append:
            field: error.message
            tag: append_date_created_failure
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              with tag '{{{ _ingest.on_failure_processor_tag }}}'
              failed with message '{{{ _ingest.on_failure_message }}}'
  - date:
      field: json.LAST_ALTERED
      target_field: snowflake.stages.last_altered
      tag: date_last_altered
      formats:
        - yyyy-MM-dd HH:mm:ss.SSS Z
        - yyyy-MM-dd HH:mm:ss.SSS XX
        - ISO8601
      if: ctx.json?.LAST_ALTERED != null
      on_failure:
        - remove:
            field: json.LAST_ALTERED
            tag: remove_unparsed_last_altered
        - append:
            field: error.message
            tag: append_date_last_altered_failure
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              with tag '{{{ _ingest.on_failure_processor_tag }}}'
              failed with message '{{{ _ingest.on_failure_message }}}'
  - date:
      field: json.DELETED
      target_field: snowflake.stages.deleted
      tag: date_deleted
      formats:
        - yyyy-MM-dd HH:mm:ss.SSS Z
        - yyyy-MM-dd HH:mm:ss.SSS XX
        - ISO8601
      if: ctx.json?.DELETED != null
      on_failure:
        - remove:
            field: json.DELETED
            tag: remove_unparsed_deleted
        - append:
            field: error.message
            tag: append_date_deleted_failure
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              with tag '{{{ _ingest.on_failure_processor_tag }}}'
              failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.start
      tag: set_event_start
      copy_from: snowflake.stages.created
      ignore_empty_value: true
      if: ctx.snowflake?.stages?.created != null
  - set:
      field: event.end
      tag: set_event_end
      copy_from: snowflake.stages.deleted
      ignore_empty_value: true
      if: ctx.snowflake?.stages?.deleted != null

  # Derive the lifecycle event represented by this row: drop when DELETED is set, alter when
  # LAST_ALTERED is after CREATED (compared at second precision), otherwise create.
  - script:
      tag: script_derive_lifecycle_event
      lang: painless
      description: Set event.action and @timestamp from the stage lifecycle timestamps (DELETED, LAST_ALTERED, CREATED).
      if: ctx.snowflake?.stages?.created instanceof String || ctx.snowflake?.stages?.last_altered instanceof String || ctx.snowflake?.stages?.deleted instanceof String
      source: |-
        def stages = ctx.snowflake.stages;
        ctx.event = ctx.event ?: [:];
        if (stages.deleted instanceof String) {
          ctx.event.action = 'drop';
          ctx['@timestamp'] = stages.deleted;
          return;
        }
        if (stages.last_altered instanceof String && stages.created instanceof String) {
          ZonedDateTime created = ZonedDateTime.parse(stages.created).truncatedTo(ChronoUnit.SECONDS);
          ZonedDateTime altered = ZonedDateTime.parse(stages.last_altered).truncatedTo(ChronoUnit.SECONDS);
          ctx.event.action = altered.isAfter(created) ? 'alter' : 'create';
          ctx['@timestamp'] = stages.last_altered;
          return;
        }
        ctx.event.action = 'create';
        ctx['@timestamp'] = stages.last_altered instanceof String ? stages.last_altered : stages.created;

  - rename:
      field: json.STAGE_URL
      target_field: url.original
      ignore_missing: true
      tag: rename_stage_url
  - uri_parts:
      field: url.original
      target_field: url
      keep_original: true
      ignore_failure: true
      tag: uri_parts_stage_url
      if: ctx.url?.original != null
  - set:
      field: cloud.provider
      tag: set_cloud_provider_aws
      value: aws
      if: ctx.url?.scheme == 's3'
  - set:
      field: cloud.provider
      tag: set_cloud_provider_azure
      value: azure
      if: ctx.url?.scheme == 'azure'
  - set:
      field: cloud.provider
      tag: set_cloud_provider_gcp
      value: gcp
      if: ctx.url?.scheme == 'gcs'

  - rename:
      field: json.STAGE_ID
      target_field: snowflake.stages.stage_id
      ignore_missing: true
      tag: rename_stage_id
  - rename:
      field: json.STAGE_NAME
      target_field: snowflake.stages.stage_name
      ignore_missing: true
      tag: rename_stage_name
  - rename:
      field: json.STAGE_SCHEMA_ID
      target_field: snowflake.stages.stage_schema_id
      ignore_missing: true
      tag: rename_stage_schema_id
  - rename:
      field: json.STAGE_SCHEMA
      target_field: snowflake.stages.stage_schema
      ignore_missing: true
      tag: rename_stage_schema
  - rename:
      field: json.STAGE_CATALOG_ID
      target_field: snowflake.stages.stage_catalog_id
      ignore_missing: true
      tag: rename_stage_catalog_id
  - rename:
      field: json.STAGE_CATALOG
      target_field: snowflake.stages.stage_catalog
      ignore_missing: true
      tag: rename_stage_catalog
  - set:
      field: cloud.region
      tag: set_cloud_region
      copy_from: json.STAGE_REGION
      ignore_empty_value: true
      if: ctx.json?.STAGE_REGION instanceof String
  - rename:
      field: json.STAGE_REGION
      target_field: snowflake.stages.stage_region
      ignore_missing: true
      tag: rename_stage_region
  - rename:
      field: json.STAGE_TYPE
      target_field: snowflake.stages.stage_type
      ignore_missing: true
      tag: rename_stage_type
  - rename:
      field: json.STAGE_OWNER
      target_field: snowflake.stages.stage_owner
      ignore_missing: true
      tag: rename_stage_owner
  - rename:
      field: json.COMMENT
      target_field: message
      ignore_missing: true
      tag: rename_comment_to_message
  - rename:
      field: json.OWNER_ROLE_TYPE
      target_field: snowflake.stages.owner_role_type
      ignore_missing: true
      tag: rename_owner_role_type
  - rename:
      field: json.INSTANCE_ID
      target_field: snowflake.stages.instance_id
      ignore_missing: true
      tag: rename_instance_id
  - rename:
      field: json.STORAGE_INTEGRATION
      target_field: snowflake.stages.storage_integration
      ignore_missing: true
      tag: rename_storage_integration

  # The same row is re-delivered by overlapping polls; a later ALTER or DROP changes LAST_ALTERED/DELETED and yields a new document.
  - fingerprint:
      fields:
        - snowflake.stages.stage_id
        - snowflake.stages.last_altered
        - snowflake.stages.deleted
      target_field: _id
      ignore_missing: true
      tag: fingerprint_id
      if: ctx.snowflake?.stages?.stage_id != null

  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_creation
      value: creation
      allow_duplicates: false
      if: ctx.event?.action == 'create'
  - append:
      field: event.type
      tag: append_event_type_change
      value: change
      allow_duplicates: false
      if: ctx.event?.action == 'alter'
  - append:
      field: event.type
      tag: append_event_type_deletion
      value: deletion
      allow_duplicates: false
      if: ctx.event?.action == 'drop'
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Snowflake
  - set:
      field: observer.product
      tag: set_observer_product
      value: Snowflake

  - remove:
      field:
        - json
      ignore_missing: true
      tag: remove_temp_fields

  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);

  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      tag: append_error_message_d1950926
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
