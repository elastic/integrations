- name: snowflake.external_access_history
  type: group
  description: Fields from SNOWFLAKE.ACCOUNT_USAGE.EXTERNAL_ACCESS_HISTORY (joined to QUERY_HISTORY) that have no ECS equivalent.
  fields:
    - name: status
      type: keyword
      description: Raw access outcome from the view (Success or Deny). The ingest pipeline normalizes this for event.outcome.
    - name: ip
      type: keyword
      description: Remote endpoint address when the value is not a valid IP. Valid addresses are stored in destination.ip.
