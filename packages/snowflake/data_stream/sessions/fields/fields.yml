- name: snowflake.sessions
  type: group
  description: Fields from SNOWFLAKE.ACCOUNT_USAGE.SESSIONS that have no ECS equivalent.
  fields:
    - name: session_id
      type: keyword
      description: Snowflake session identifier from SESSIONS.SESSION_ID.
    - name: authentication_method
      type: keyword
      description: Authentication method used to create the session (for example PASSWORD or OAUTH_ACCESS_TOKEN).
    - name: login_event_id
      type: keyword
      description: LOGIN_HISTORY.EVENT_ID that opened this session.
    - name: client_application_id
      type: keyword
      description: Client application identifier (for example JDBC 3.8.7).
    - name: client_application_version
      type: keyword
      description: Client application version.
    - name: client_environment
      type: flattened
      description: Parsed JSON from SESSIONS.CLIENT_ENVIRONMENT (operating system, OCSP mode, and similar client details).
    - name: client_build_id
      type: keyword
      description: Client build identifier from SESSIONS.CLIENT_BUILD_ID when present.
    - name: client_version
      type: keyword
      description: Client version from SESSIONS.CLIENT_VERSION when present.
    - name: is_open
      type: boolean
      description: Whether the session is still open.
