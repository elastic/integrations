- name: snowflake.data_transfer_history
  type: group
  description: Fields from SNOWFLAKE.ACCOUNT_USAGE.DATA_TRANSFER_HISTORY that have no ECS equivalent.
  fields:
    - name: source_cloud
      type: keyword
      description: Name of the cloud provider the data was transferred from, for example aws, azure, or gcp.
    - name: source_region
      type: keyword
      description: Name of the cloud provider region the data was transferred from.
    - name: target_cloud
      type: keyword
      description: Name of the cloud provider the data was transferred to, for example aws, azure, or gcp.
    - name: target_region
      type: keyword
      description: Name of the cloud provider region the data was transferred to.
    - name: transfer_type
      type: keyword
      description: Type of data transfer as reported by Snowflake, for example COPY, COPY_FILES, DATA_LAKE, EXTERNAL_ACCESS, EXTERNAL_FUNCTION, INTERNAL, POSTGRES, REPLICATION, or SNOWPARK_CONTAINER_SERVICES.
