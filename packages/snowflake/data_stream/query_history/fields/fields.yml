- name: snowflake.query_history
  type: group
  description: Fields from SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY that have no ECS equivalent.
  fields:
    - name: query_text
      type: wildcard
      description: SQL text of the statement (capped by Snowflake at 100,000 characters). The text can contain secrets such as literals or tokens.
    - name: database_name
      type: keyword
      description: Database in which the query ran, when present.
    - name: schema_name
      type: keyword
      description: Schema in which the query ran, when present.
    - name: session_id
      type: keyword
      description: Snowflake session identifier for the statement.
    - name: authn_event_id
      type: keyword
      description: LOGIN_HISTORY event identifier associated with the session that issued the query.
    - name: warehouse_name
      type: keyword
      description: Warehouse that ran the statement, when present.
    - name: execution_status
      type: keyword
      description: Raw Account Usage execution status (for example success, fail, incident, or SUCCESS). The ingest pipeline normalizes this for event.outcome.
    - name: bytes_scanned
      type: long
      description: Number of bytes scanned by the statement.
    - name: rows_unloaded
      type: long
      description: Number of rows unloaded by the statement.
    - name: query_hash
      type: keyword
      description: Snowflake statement fingerprint hash. This is not a file content hash.
    - name: user_type
      type: keyword
      description: Type of user that issued the statement (for example PERSON).
    - name: agent_type
      type: keyword
      description: Agent that issued the statement when present (for example CORTEX_AGENT, EXTERNAL_AGENT).
