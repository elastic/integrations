- name: source.ip
  type: ip
  description: Source IP address of the observed communication.
- name: source.port
  type: long
  description: Source port of the observed communication.
- name: destination.ip
  type: ip
  description: Destination IP address of the observed communication.
- name: destination.port
  type: long
  description: Destination port of the observed communication.
- name: observer.type
  type: keyword
  description: Type of device observing the communication.
- name: message
  type: match_only_text
  description: FortiGate syslog message after framing whitespace is trimmed.
- name: type
  type: keyword
  description: Raw FortiGate log type, such as traffic.
- name: synthetic
  type: keyword
  description: Synthetic test marker supplied in the source event; use tags for filtering.
- name: tags
  type: keyword
  description: Event labels including the synthetic test marker when applicable.
