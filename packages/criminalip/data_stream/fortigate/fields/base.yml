- name: "@timestamp"
  type: date
  description: Event timestamp.

- name: data_stream.type
  type: constant_keyword
  description: Data stream type.
  value: logs

- name: data_stream.dataset
  type: constant_keyword
  description: Data stream dataset.
  value: criminalip.fortigate

- name: data_stream.namespace
  type: constant_keyword
  description: Data stream namespace.

- name: event.action
  type: keyword
  description: FortiGate action such as accept or deny.

- name: event.outcome
  type: keyword
  description: Normalized event outcome.

- name: event.ingested
  type: date
  description: Time the FortiGate event was received by the ingest pipeline.

- name: event.timezone
  type: keyword
  description: Time zone offset supplied by FortiGate.

- name: event.original
  type: keyword
  index: false
  doc_values: false
  description: Original FortiGate syslog message.

- name: network.iana_number
  type: keyword
  description: IANA protocol number from FortiGate proto.

- name: network.transport
  type: keyword
  description: Transport protocol normalized from the IANA protocol number.

- name: observer.vendor
  type: keyword
  description: Firewall vendor.

- name: observer.product
  type: keyword
  description: Firewall product.
