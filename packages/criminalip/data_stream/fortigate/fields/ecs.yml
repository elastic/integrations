- name: ecs.version
  type: keyword
  description: ECS version of the event.

- name: input.type
  type: keyword
  description: Elastic Agent input type used to collect FortiGate syslog.

- name: event.category
  type: keyword
  description: High-level category of the firewall event.

- name: event.kind
  type: keyword
  description: High-level kind of the event.

- name: event.type
  type: keyword
  description: Event type describing the network connection.

- name: event.module
  type: keyword
  description: Module that produced the event.

- name: event.dataset
  type: constant_keyword
  value: criminalip.fortigate
  description: Dataset that produced the event.

- name: log.level
  type: keyword
  description: Severity or log level of the event.

- name: log.source.address
  type: keyword
  description: Network address of the firewall or syslog source.

- name: host.name
  type: keyword
  description: Name of the host sending the firewall event.

- name: agent.id
  type: keyword
  description: Unique identifier of the Elastic Agent.

- name: agent.name
  type: keyword
  description: Name of the Elastic Agent.

- name: agent.type
  type: keyword
  description: Type of the Elastic Agent.

- name: agent.version
  type: keyword
  description: Version of the Elastic Agent.
