---
description: Parse FortiGate key-value syslog messages and normalize common ECS fields.

processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 9.5.0

  - rename:
      tag: rename_message_to_event_original
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'

  - remove:
      tag: remove_message
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'

  - set:
      tag: copy_original_for_parsing
      field: _temp.message
      copy_from: event.original
      ignore_empty_value: true

  - trim:
      tag: trim_fortigate_message_for_parsing
      field: _temp.message
      ignore_missing: true

  - gsub:
      tag: strip_fortigate_syslog_priority
      field: _temp.message
      pattern: '^<[0-9]+>\s*'
      replacement: ''
      ignore_missing: true

  - script:
      tag: parse_fortigate_kv
      lang: painless
      if: 'ctx._temp?.message != null'
      description: Tokenize key-value fields once, respecting double quotes and escaped quotes/backslashes.
      source: |-
        String message = ctx._temp.message;
        Map fields = [:];
        StringBuilder key = new StringBuilder();
        StringBuilder value = new StringBuilder();
        boolean inValue = false;
        boolean quoted = false;
        for (int i = 0; i <= message.length(); i++) {
          boolean end = i == message.length();
          int c = end ? 32 : (int) message.charAt(i);
          boolean space = c == 32 || c == 9 || c == 10 || c == 13;
          if (!inValue) {
            if (c == 61) { inValue = true; }
            else if (space) { key.setLength(0); }
            else if (c != 34) { key.append((char) c); }
            continue;
          }
          if (!end && quoted && c == 92 && i + 1 < message.length()) {
            int next = (int) message.charAt(i + 1);
            if (next == 34 || next == 92) {
              value.append((char) next);
              i++;
              continue;
            }
          }
          if (!end && c == 34) { quoted = !quoted; continue; }
          if (end && quoted) {
            throw new IllegalArgumentException('Unterminated quoted FortiGate field');
          }
          if (end || (!quoted && space)) {
            if (key.length() > 0) {
              String name = key.toString();
              String text = value.toString();
              if (text.length() >= 2) {
                int first = (int) text.charAt(0);
                int last = (int) text.charAt(text.length() - 1);
                if ((first == 40 && last == 41) || (first == 91 && last == 93) || (first == 60 && last == 62)) {
                  text = text.substring(1, text.length() - 1);
                }
              }
              if (!fields.containsKey(name)) { fields[name] = text; }
              else if (fields[name] instanceof List) { fields[name].add(text); }
              else { fields[name] = [fields[name], text]; }
            }
            key.setLength(0);
            value.setLength(0);
            inValue = false;
          } else { value.append((char) c); }
        }
        if (ctx._temp == null) { ctx._temp = [:]; }
        ctx._temp.fortigate_fields = fields;

  - script:
      tag: normalize_fortigate_timezone
      lang: painless
      if: 'ctx._temp?.fortigate_fields?.tz != null'
      description: Select the first valid offset from duplicate timezone fields and normalize UTC/GMT offsets.
      source: |-
        def raw = ctx._temp.fortigate_fields.tz;
        def candidates = raw instanceof List ? raw : [raw];
        String fallback = null;
        for (def candidate : candidates) {
          if (candidate == null) { continue; }
          String zone = candidate.toString().trim();
          if (fallback == null && zone.length() > 0) { fallback = zone; }
          if (zone == 'UTC' || zone == 'GMT' || zone == 'Z') { zone = '+0000'; }
          else if (zone.startsWith('UTC') || zone.startsWith('GMT')) { zone = zone.substring(3).trim(); }
          zone = zone.replace(':', '');
          if (zone.length() == 4) { zone = zone.substring(0, 1) + '0' + zone.substring(1); }
          if (zone.length() != 5 || (zone.charAt(0) != (char) 43 && zone.charAt(0) != (char) 45)) { continue; }
          boolean digits = true;
          for (int i = 1; i < 5; i++) {
            int c = (int) zone.charAt(i);
            if (c < 48 || c > 57) { digits = false; break; }
          }
          if (!digits) { continue; }
          int hours = Integer.parseInt(zone.substring(1, 3));
          int minutes = Integer.parseInt(zone.substring(3, 5));
          if (hours > 18 || minutes > 59 || (hours == 18 && minutes != 0)) { continue; }
          ctx._temp.fortigate_fields.tz = zone;
          return;
        }
        ctx._temp.fortigate_fields.tz = fallback == null ? '' : fallback;

  - set:
      tag: combine_fortigate_date_time_timezone
      field: _temp.fortigate_time
      value: "{{_temp.fortigate_fields.date}} {{_temp.fortigate_fields.time}} {{_temp.fortigate_fields.tz}}"
      if: 'ctx._temp?.fortigate_fields?.date != null && ctx._temp.fortigate_fields.time != null && ctx._temp.fortigate_fields.tz != null && ctx._temp.fortigate_fields.tz != ""'

  - set:
      tag: combine_fortigate_date_time
      field: _temp.fortigate_time
      value: "{{_temp.fortigate_fields.date}} {{_temp.fortigate_fields.time}}"
      if: 'ctx._temp?.fortigate_fields?.date != null && ctx._temp.fortigate_fields.time != null && (ctx._temp.fortigate_fields.tz == null || ctx._temp.fortigate_fields.tz == "")'

  - date:
      tag: parse_fortigate_event_time
      field: _temp.fortigate_time
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss Z"
        - "yyyy-MM-dd HH:mm:ss"
      if: 'ctx._temp?.fortigate_time != null'
      on_failure:
        - set:
            tag: flag_invalid_fortigate_time
            field: _temp.invalid_event_time
            value: true
        - append:
            tag: append_invalid_fortigate_time_error
            field: error.message
            value: "Could not parse FortiGate event time: {{{ _ingest.on_failure_message }}}"
        - append:
            tag: preserve_invalid_fortigate_time
            field: tags
            value: preserve_original_event
            allow_duplicates: false

  - append:
      tag: tag_synthetic_fortigate_events
      field: tags
      value: synthetic
      allow_duplicates: false
      if: '(ctx._temp?.fortigate_fields?.synthetic != null && ctx._temp.fortigate_fields.synthetic.toString().trim() == "true") || (ctx.synthetic != null && ctx.synthetic.toString().trim() == "true")'

  - rename:
      tag: rename_source_ip
      field: _temp.fortigate_fields.srcip
      target_field: source.ip
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_destination_ip
      field: _temp.fortigate_fields.dstip
      target_field: destination.ip
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_source_port
      field: _temp.fortigate_fields.srcport
      target_field: source.port
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_destination_port
      field: _temp.fortigate_fields.dstport
      target_field: destination.port
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_event_action
      field: _temp.fortigate_fields.action
      target_field: event.action
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_network_iana_number
      field: _temp.fortigate_fields.proto
      target_field: network.iana_number
      ignore_missing: true
      ignore_failure: true

  - convert:
      tag: convert_network_iana_number
      field: network.iana_number
      type: string
      ignore_missing: true

  - set:
      tag: set_transport_tcp
      field: network.transport
      value: tcp
      if: 'ctx.network?.iana_number == "6"'

  - set:
      tag: set_transport_udp
      field: network.transport
      value: udp
      if: 'ctx.network?.iana_number == "17"'

  - set:
      tag: set_transport_icmp
      field: network.transport
      value: icmp
      if: 'ctx.network?.iana_number == "1"'

  - set:
      tag: set_transport_ipv6_icmp
      field: network.transport
      value: ipv6-icmp
      if: 'ctx.network?.iana_number == "58"'

  - rename:
      tag: rename_log_level
      field: _temp.fortigate_fields.level
      target_field: log.level
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_log_id
      field: _temp.fortigate_fields.logid
      target_field: fortigate.logid
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_policy_id
      field: _temp.fortigate_fields.policyid
      target_field: fortigate.policyid
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_subtype
      field: _temp.fortigate_fields.subtype
      target_field: fortigate.subtype
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_type
      field: _temp.fortigate_fields.type
      target_field: fortigate.type
      ignore_missing: true
      ignore_failure: true

  - remove:
      tag: remove_synthetic_marker
      field: synthetic
      ignore_missing: true

  - rename:
      tag: rename_fortigate_date
      if: 'ctx._temp?.invalid_event_time != true'
      field: _temp.fortigate_fields.date
      target_field: fortigate.date
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_time
      field: _temp.fortigate_fields.time
      target_field: fortigate.time
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_eventtime
      field: _temp.fortigate_fields.eventtime
      target_field: fortigate.eventtime
      ignore_missing: true
      ignore_failure: true

  - rename:
      tag: rename_fortigate_timezone
      field: _temp.fortigate_fields.tz
      target_field: event.timezone
      ignore_missing: true
      ignore_failure: true

  - append:
      tag: append_event_type_denied
      field: event.type
      value: denied
      allow_duplicates: false
      if: >-
        (ctx.fortigate?.type == "traffic" || ctx.fortigate?.type == "utm") &&
        (ctx.event?.action == "deny" || ctx.event?.action == "block" || ctx.event?.action == "blocked" ||
        ctx._temp?.fortigate_fields?.utmaction == "block" ||
        (ctx._temp?.fortigate_fields?.utmaction instanceof List && ctx._temp.fortigate_fields.utmaction.contains("block")))

  - remove:
      tag: remove_temporary_fortigate_fields
      field: _temp.fortigate_fields
      ignore_missing: true

  - remove:
      tag: remove_temporary_fortigate_time
      field: _temp.fortigate_time
      ignore_missing: true

  - set:
      tag: set_event_kind
      field: event.kind
      value: event

  - append:
      tag: set_event_category_network
      field: event.category
      value:
        - network
      allow_duplicates: false
      if: 'ctx.fortigate?.type == "traffic" || (ctx.fortigate?.type == "utm" && (ctx.source?.ip != null || ctx.destination?.ip != null))'

  - append:
      tag: set_event_category_host_info
      field: event.category
      value:
        - host
      allow_duplicates: false
      if: 'ctx.fortigate?.type == "event" && ctx.fortigate?.subtype == "system" && ctx.event?.action == "perf-stats"'

  - set:
      tag: set_event_module
      field: event.module
      value: criminalip

  - set:
      tag: set_event_dataset
      field: event.dataset
      value: criminalip.fortigate

  - set:
      tag: set_observer_vendor
      field: observer.vendor
      value: Fortinet

  - set:
      tag: set_observer_product
      field: observer.product
      value: FortiGate

  - set:
      tag: set_observer_type
      field: observer.type
      value: firewall

  - append:
      tag: append_event_type_connection
      field: event.type
      value:
        - connection
      allow_duplicates: false
      if: 'ctx.fortigate?.type == "traffic"'

  - append:
      tag: set_event_type_host_info
      field: event.type
      value:
        - info
      allow_duplicates: false
      if: 'ctx.fortigate?.type == "event" && ctx.fortigate?.subtype == "system" && ctx.event?.action == "perf-stats"'

  - set:
      tag: set_event_outcome_failure
      field: event.outcome
      value: failure
      if: 'ctx.event?.action == "deny" || ctx.event?.action == "block"'

  - set:
      tag: set_event_outcome_success
      field: event.outcome
      value: success
      if: 'ctx.event?.action == "accept" || ctx.event?.action == "allow"'

  - convert:
      tag: convert_source_port
      field: source.port
      type: long
      ignore_missing: true
      ignore_failure: true

  - convert:
      tag: convert_destination_port
      field: destination.port
      type: long
      ignore_missing: true
      ignore_failure: true

  - append:
      tag: append_related_source_ip
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: 'ctx.source?.ip != null'

  - append:
      tag: append_related_destination_ip
      field: related.ip
      value: '{{{destination.ip}}}'
      allow_duplicates: false
      if: 'ctx.destination?.ip != null'

  - remove:
      tag: remove_fortigate_temporary_fields
      field: _temp
      ignore_missing: true

on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: "Processor '{{{ _ingest.on_failure_processor_type }}}' with tag '{{{ _ingest.on_failure_processor_tag }}}' in pipeline '{{{ _ingest.pipeline }}}' failed: {{{ _ingest.on_failure_message }}}"
  - set:
      tag: set_pipeline_error_kind
      field: event.kind
      value: pipeline_error

  - append:
      tag: preserve_failed_fortigate_original
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - remove:
      tag: remove_failed_fortigate_temporary_fields
      field: _temp
      ignore_missing: true
