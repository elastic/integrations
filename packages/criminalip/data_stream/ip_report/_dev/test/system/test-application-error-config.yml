deployer: docker
service: api-mock
input: cel
data_stream:
  vars:
    api_key: unit-test-key
    ip: 192.0.2.30
    additional_ips:
      - 192.0.2.40
    url: "http://{{{Hostname}}}:{{{Port}}}/v1/asset/ip/report"
    interval: 10s
    preserve_original_event: true
    tags:
      - synthetic
assert:
  fields_present:
    - criminalip.query_ip
    - criminalip.status
    - event.outcome
    - error.message
wait_for_data_timeout: 90s
