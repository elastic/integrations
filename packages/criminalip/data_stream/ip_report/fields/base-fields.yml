- name: data_stream.type
  type: constant_keyword
  description: Data stream type.

- name: data_stream.dataset
  type: constant_keyword
  description: Data stream dataset.

- name: data_stream.namespace
  type: constant_keyword
  description: Data stream namespace.

- name: '@timestamp'
  type: date
  description: Event timestamp.

- name: threat.indicator.ip
  type: ip
  description: IP address reported by Criminal IP.

- name: threat.indicator.provider
  type: keyword
  description: Threat intelligence provider.

- name: threat.indicator.type
  type: keyword
  description: Type of threat indicator.

- name: criminalip.score.inbound
  type: keyword
  description: Criminal IP inbound reputation score.

- name: criminalip.query_ip
  type: keyword
  description: Configured lookup value for each report request, including HTTP and application-level failures; may be malformed input rather than a valid IP.

- name: criminalip.score.outbound
  type: keyword
  description: Criminal IP outbound reputation score.

- name: criminalip.issues.is_vpn
  type: boolean
  description: Whether the IP is identified as VPN.

- name: criminalip.issues.is_tor
  type: boolean
  description: Whether the IP is identified as Tor.

- name: criminalip.issues.is_proxy
  type: boolean
  description: Whether the IP is identified as proxy.

- name: criminalip.issues.is_scanner
  type: boolean
  description: Whether the IP is identified as scanner.

- name: criminalip.issues.is_darkweb
  type: boolean
  description: Whether the IP is associated with dark web.

- name: criminalip.issues.is_hosting
  type: boolean
  description: Whether the IP is identified as hosting.

- name: criminalip.issues.is_cloud
  type: boolean
  description: Whether the IP is identified as cloud.

- name: event.original
  type: keyword
  index: false
  doc_values: false
  description: Original Criminal IP API response.

- name: event.outcome
  type: keyword
  description: Whether the API returned a usable report.

- name: error.message
  type: match_only_text
  description: Collection or parsing failure details.

- name: http.response.status_code
  type: long
  description: HTTP response status from the Criminal IP API.
