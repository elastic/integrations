title: "IP Report (optional lookups)"
type: logs

streams:
  - input: cel
    enabled: false
    title: "Criminal IP API"
    description: |-
      Optional reputation lookups for explicitly configured IPs. Does not discover IPs in logs or generate firewall match alerts.
    template_path: cel.yml.hbs

    vars:
      - name: api_key
        type: password
        title: "Criminal IP API Key"
        description: "API key used to authenticate with Criminal IP."
        required: true
        show_user: true
        secret: true

      - name: ip
        type: text
        title: "IP Address"
        description: "Primary IP address to query. Accepts IPv4 or IPv6."
        required: true
        show_user: true

      - name: additional_ips
        type: text
        title: "Additional IP Addresses"
        description: "Optional public IPs to query in addition to IP Address. Add one IP per row, not comma-separated values. Each distinct IP consumes API usage every interval."
        multi: true
        required: false
        show_user: true

      - name: url
        type: text
        title: "Criminal IP API URL"
        description: "Criminal IP IP Report API endpoint."
        required: true
        show_user: true
        default: "https://api.criminalip.io/v1/asset/ip/report"

      - name: interval
        type: text
        title: "Interval"
        description: "How often to query Criminal IP."
        required: true
        show_user: true
        default: "5m"

      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          Log HTTP requests and responses for troubleshooting. Trace files can contain
          API keys and response data. Enable only temporarily with test credentials,
          restrict access to Agent logs, and delete the trace files after use.
        default: false
        multi: false
        required: false
        show_user: false

      - name: preserve_original_event
        type: bool
        title: "Preserve original event"
        description: "Preserve the original Criminal IP API response."
        default: false
        show_user: true

      - name: tags
        type: text
        title: "Tags"
        description: "Tags to include in the published event."
        multi: true
        show_user: true
        default:
          - criminalip
          - threat_intelligence

elasticsearch:
  index_template:
    mappings:
      subobjects: false
