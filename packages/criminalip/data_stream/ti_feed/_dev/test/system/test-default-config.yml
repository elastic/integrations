deployer: docker
service: api-mock
input: cel
data_stream:
  vars:
    api_key: unit-test-key
    feed_url: "http://{{{Hostname}}}:{{{Port}}}/ti/v1/feed/outbound"
    interval: 10s
    preserve_original_event: true
    tags:
      - synthetic
assert:
  fields_present:
    - threat.indicator.ip
    - threat.indicator.provider
wait_for_data_timeout: 90s
