---
- name: "@timestamp"
  type: date
  description: Event timestamp.

- name: data_stream.type
  type: constant_keyword
  description: Data stream type.
  value: logs

- name: data_stream.dataset
  type: constant_keyword
  description: Data stream dataset.
  value: criminalip.ti_feed

- name: data_stream.namespace
  type: constant_keyword
  description: Data stream namespace.

- name: event.kind
  type: keyword
  description: Event kind.

- name: event.category
  type: keyword
  description: Event category.

- name: event.type
  type: keyword
  description: Event type.

- name: event.outcome
  type: keyword
  description: Whether the TI Feed request succeeded.

- name: event.module
  type: keyword
  description: Event module.

- name: event.dataset
  type: constant_keyword
  description: Event dataset.
  value: criminalip.ti_feed

- name: event.original
  type: keyword
  index: false
  doc_values: false
  description: Original TI Feed indicator response.

- name: error.message
  type: match_only_text
  description: TI Feed request or response error.

- name: http.response.status_code
  type: long
  description: HTTP response status from the Criminal IP TI Feed API.

- name: threat.indicator.ip
  type: ip
  description: IP address from Criminal IP Threat Intelligence Feed.

- name: threat.indicator.type
  type: keyword
  description: Type of threat indicator.

- name: threat.indicator.provider
  type: keyword
  description: Threat intelligence provider.

- name: threat.indicator.description
  type: keyword
  description: Reason associated with the threat indicator.

- name: threat.indicator.confidence
  type: long
  description: Confidence score provided by Criminal IP.

- name: criminalip.ti_feed.score
  type: keyword
  description: Criminal IP threat score.

- name: criminalip.ti_feed.first_seen
  type: date
  description: First observed timestamp from Criminal IP.

- name: criminalip.ti_feed.last_seen
  type: date
  description: Last observed timestamp from Criminal IP.
