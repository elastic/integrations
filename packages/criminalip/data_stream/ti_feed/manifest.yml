title: "TI Feed"

type: logs

streams:
  - input: cel
    title: "Criminal IP Threat Intelligence Feed"
    description: |-
      Collect threat intelligence IP indicators from Criminal IP TI Feed.
    template_path: cel.yml.hbs

    vars:
      - name: api_key
        type: password
        title: "Criminal IP TI Feed License Key"
        description: "TI License key used to authenticate with Criminal IP TI Feed."
        required: true
        show_user: true
        secret: true

      - name: feed_url
        type: text
        title: "Criminal IP TI Feed URL"
        description: "Criminal IP TI Feed endpoint."
        required: true
        show_user: true
        default: "https://dl.criminalip.io/ti/v1/feed/outbound"

      - name: interval
        type: text
        title: "Interval"
        description: "How often to collect Criminal IP TI Feed data."
        required: true
        show_user: true
        default: "5m"

      - name: preserve_original_event
        type: bool
        title: "Preserve original event"
        description: "Preserve the original Criminal IP TI Feed response."
        default: true
        show_user: true

      - name: tags
        type: text
        title: "Tags"
        description: "Tags to include in the published event."
        multi: true
        show_user: true
        default:
          - criminalip
          - threat_intelligence
          - ti_feed

elasticsearch:
  index_template:
    mappings:
      subobjects: false
