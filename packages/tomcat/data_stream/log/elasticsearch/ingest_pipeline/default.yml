---
description: Pipeline for Apache Tomcat

processors:
  - set:
      tag: set_ecs_version_1b1a55da
      field: ecs.version
      value: '8.11.0'
  # User agent
  - user_agent:
      tag: user_agent_user_agent_original_d070abfb
      field: user_agent.original
      ignore_missing: true
  # IP Geolocation Lookup
  - geoip:
      tag: geoip_source_ip_d111daf4
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_destination_ip_1641c21b
      field: destination.ip
      target_field: destination.geo
      ignore_missing: true

  # IP Autonomous System (AS) Lookup
  - geoip:
      tag: geoip_source_ip_1b6997b7
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
          - asn
          - organization_name
      ignore_missing: true
  - geoip:
      tag: geoip_destination_ip_0f4616aa
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
          - asn
          - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_444dbe20
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_06ec0a60
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_destination_as_asn_b610296a
      field: destination.as.asn
      target_field: destination.as.number
      ignore_missing: true
  - rename:
      tag: rename_destination_as_organization_name_e9371f13
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      ignore_missing: true
  - append:
      tag: append_related_hosts_2a801dc9
      field: related.hosts
      value: '{{host.name}}'
      allow_duplicates: false
      if: ctx.host?.name != null && ctx.host?.name != ''
on_failure:
  - set:
      tag: set_event_kind_136c12a6
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_972732da
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
