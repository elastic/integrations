- name: iru
  type: group
  description: Fields from Iru Endpoint.
  fields:
    - name: device
      type: group
      description: Fields from Iru managed device inventory.
      fields:
        - name: agent
          type: group
          description: Iru agent status on the device.
          fields:
            - name: installed
              type: boolean
              description: Whether the Iru agent is installed on the device.
            - name: version
              type: keyword
              description: Installed Iru agent version.
        - name: asset_tag
          type: keyword
          description: Asset tag assigned to the device.
        - name: blueprint
          type: group
          description: Blueprint assigned to the device.
          fields:
            - name: id
              type: keyword
              description: Unique identifier of the assigned blueprint.
            - name: name
              type: keyword
              description: Name of the assigned blueprint.
        - name: device_id
          type: keyword
          description: Unique identifier of the device in Iru.
        - name: first_enrollment
          type: date
          description: Timestamp of the device's first enrollment.
        - name: is_missing
          type: boolean
          description: Whether the device is missing or not checking in.
        - name: is_removed
          type: boolean
          description: Whether the device has been removed from Iru.
        - name: last_check_in
          type: date
          description: Timestamp of the device's last check-in.
        - name: last_enrollment
          type: date
          description: Timestamp of the device's most recent enrollment.
        - name: lost_mode_status
          type: keyword
          description: Lost Mode status reported by Iru.
        - name: mdm_enabled
          type: boolean
          description: Whether MDM management is enabled for the device.
        - name: model
          type: keyword
          description: Marketing model name of the device.
        - name: platform
          type: keyword
          description: Vendor platform string (for example Mac, iPad, iPhone, Windows, or Android).
        - name: serial_number
          type: keyword
          description: Hardware serial number of the device.
        - name: supplemental_build_version
          type: keyword
          description: Supplemental OS build version supplied by Iru.
        - name: supplemental_os_version_extra
          type: keyword
          description: Additional OS version metadata supplied by Iru.
        - name: tags
          type: keyword
          description: Tag names assigned to the device.
        - name: user
          type: group
          description: Directory user fields that are not mapped to ECS.
          fields:
            - name: active
              type: boolean
              description: Whether the assigned directory user is active.
            - name: is_archived
              type: boolean
              description: Whether the assigned directory user is archived.
