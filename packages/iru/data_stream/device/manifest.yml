title: Device
type: logs
streams:
  - input: cel
    title: Collect Iru device inventory
    description: Collect managed device inventory from the Iru Endpoint Management API.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: How often the full device inventory snapshot is collected. Keep at least 1h to stay within the tenant API rate limit.
        show_user: true
        required: true
        default: 1h
      - name: batch_size
        type: integer
        title: Batch size
        description: Maximum number of devices to request per page. The API maximum is 300.
        show_user: false
        required: true
        default: 300
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h.
        show_user: false
        required: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        show_user: false
        multi: false
        required: false
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags to include on each event.
        show_user: false
        multi: true
        required: true
        default:
          - forwarded
          - iru-device
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        show_user: true
        multi: false
        required: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        show_user: false
        multi: false
        required: false
