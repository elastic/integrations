format_version: "3.4.2"
name: iru
title: "Iru"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: Collect audit events and device inventory from Iru (formerly Kandji) with Elastic Agent.
type: integration
categories:
  - security
conditions:
  kibana:
    version: "^8.19.2 || ^9.1.2"
  elastic:
    subscription: basic
screenshots:
  - src: /img/iru-audit.png
    title: Iru Audit Activity Overview Dashboard
    size: 600x600
    type: image/png
  - src: /img/iru-device.png
    title: Iru Device Inventory Dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/iru-logo.svg
    title: Iru logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: iru
    title: Iru
    description: Collect audit events and device inventory from Iru Endpoint Management.
    inputs:
      - type: cel
        title: Collect logs from Iru API
        description: Collect audit events and device inventory via the Iru Endpoint Management REST API.
        vars:
          - name: url
            type: url
            title: API URL
            description: >-
              Full HTTPS Management API base URL, including scheme and without a trailing path. Copy Your organization's API URL from Account Menu → Access → API tokens and prepend https:// if the console shows only the hostname. Examples: https://example.api.kandji.io, https://example.api.eu.kandji.io, https://example.api.iru.com.
            multi: false
            required: true
            show_user: true
          - name: api_token
            type: password
            title: API token
            secret: true
            description: >-
              Tenant Bearer token from Access → API tokens. Grant Devices: Device Information: Device list and Audit Logs: List Audit Events.
            multi: false
            required: true
            show_user: true
          - name: proxy_url
            type: text
            title: Proxy URL
            description: >-
              URL to proxy connections in the form of http[s]://<user>:<password>@<server name/ip>:<port>. Please ensure your username and password are in URL encoded format.
            multi: false
            required: false
            show_user: false
          - name: ssl
            type: yaml
            title: SSL Configuration
            description: SSL configuration options. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html#ssl-common-config) for details.
            multi: false
            required: false
            show_user: false
