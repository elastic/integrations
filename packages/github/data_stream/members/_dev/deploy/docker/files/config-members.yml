  # Members query — page 1 (no cursor: null)
  # Matches when OrgMembers query with cursor:null in the body
  - path: /graphql
    methods: ['POST']
    request_headers:
      Authorization:
        - 'Bearer test-token'
    request_body: /.*OrgMembers.*"cursor":null.*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {
            "data": {
              "organization": {
                "membersWithRole": {
                  "totalCount": 4,
                  "pageInfo": {
                    "hasNextPage": true,
                    "endCursor": "members-page1-cursor"
                  },
                  "edges": [
                    {
                      "role": "ADMIN",
                      "hasTwoFactorEnabled": true,
                      "node": {
                        "id": "U_kgDOABCDEF",
                        "databaseId": 12345678,
                        "login": "alice-example",
                        "name": "Alice Example",
                        "email": "alice@example.com",
                        "company": "Example Corp",
                        "location": "San Francisco, CA",
                        "bio": "Software engineer",
