        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {
            "data": {
              "organization": {
                "teams": {
                  "totalCount": 2,
                  "pageInfo": {
                    "hasNextPage": false,
                    "endCursor": "teams-page1-cursor"
                  },
                  "edges": [
                    {
