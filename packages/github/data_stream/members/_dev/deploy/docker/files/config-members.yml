  # Members query — end-of-pagination sentinel (cursor = "members-page3-cursor")
  # Returns an empty page so that cycles 3+ emit no events and hit_count stabilises at 6.
  - path: /graphql
    methods: ['POST']
    request_headers:
      Authorization:
        - 'Bearer test-token'
    request_body: /.*OrgMembers.*"cursor":"members-page3-cursor".*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {
            "data": {
              "organization": {
                "membersWithRole": {
                  "totalCount": 6,
                  "pageInfo": {
                    "hasNextPage": false,
                    "endCursor": "members-page3-cursor"
                  },
                  "edges": []
                }
              }
            },
            "rateLimit": {"cost": 1, "remaining": 4995, "resetAt": "2026-08-13T21:00:00Z"}
          }
  # Teams query — single page (no next page)
  - path: /graphql
    methods: ['POST']
    request_headers:
