---
description: Pipeline for processing GitHub organization member events (entity data stream, ECS v9.5.0).
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'

  # CEL-only: remove Agentless metadata fields that collide with ECS
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.

  # CEL-only: stop processing error-placeholder documents from the collector
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.

  # JSE00001: rename message → event.original
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the original
        message. The `event.original` field is not touched if the document already has one; it may
        happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # Parse JSON payload
  - json:
      field: event.original
      tag: parse_json
      target_field: json
      on_failure:
        - append:
            field: error.message
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}

  # ECS categorization — entity snapshot: kind=asset, category=iam, type=[user, info]
  - set:
      field: event.kind
      tag: set_event_kind
      value: asset
  - append:
      field: event.category
      tag: append_event_category_iam
      value: iam
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type
      value:
        - user
        - info
      allow_duplicates: false

  # ECS user identity fields
  - rename:
      field: json.node.id
      tag: rename_node_id_to_user_id
      target_field: user.id
      ignore_missing: true
  - rename:
      field: json.node.login
      tag: rename_node_login_to_user_name
      target_field: user.name
      ignore_missing: true
  - rename:
      field: json.node.name
      tag: rename_node_name_to_user_full_name
      target_field: user.full_name
      if: ctx.json?.node?.name != null
      ignore_missing: true
  - rename:
      field: json.node.email
      tag: rename_node_email_to_user_email
      target_field: user.email
      if: ctx.json?.node?.email != null && ctx.json.node.email != ''
      ignore_missing: true

  # user.roles — keyword array from the org-level role
  - append:
      field: user.roles
      tag: append_user_roles
      value: '{{{json.role}}}'
      allow_duplicates: false
      if: ctx.json?.role != null

  # Entity fields nested under user.entity.* for entity store correlation
  - set:
      field: user.entity.id
      tag: set_user_entity_id
      copy_from: user.id
      ignore_empty_value: true
  - set:
      field: user.entity.name
      tag: set_user_entity_name
      copy_from: user.name
      ignore_empty_value: true
  - set:
      field: user.entity.type
      tag: set_user_entity_type
      value:
        - user
  - set:
      field: user.entity.source
      tag: set_user_entity_source
      value: github
  - set:
      field: user.entity.last_seen_timestamp
      tag: set_user_entity_last_seen_timestamp
      copy_from: '@timestamp'
      ignore_empty_value: true

  # user.entity.attributes.mfa_enabled (only when hasTwoFactorEnabled is non-null)
  - set:
      field: user.entity.attributes.mfa_enabled
      tag: set_mfa_enabled_true
      value: true
      if: ctx.json?.hasTwoFactorEnabled == true
  - set:
      field: user.entity.attributes.mfa_enabled
      tag: set_mfa_enabled_false
      value: false
      if: ctx.json?.hasTwoFactorEnabled == false

  # user.entity.relationships.administers.service.* — teams where user is MAINTAINER,
  # modelled as services (closest available relationship type in the ECS entity schema).
  - script:
      tag: build_administers_service_ids
      description: >-
        Collects GraphQL node IDs and display names of teams where the member is a
        MAINTAINER into user.entity.relationships.administers.service.id and .service.name.
      lang: painless
      if: ctx.json?.teams instanceof List && ctx.json.teams.size() != 0
      source: |-
        def adminIds = new ArrayList();
        def adminNames = new ArrayList();
        for (def team : ctx.json.teams) {
          if (team != null && "MAINTAINER".equals(team.role)) {
            adminIds.add(team.id);
            adminNames.add(team.name);
          }
        }
        if (!adminIds.isEmpty()) {
          if (ctx.user == null) { ctx.user = [:]; }
          if (ctx.user.entity == null) { ctx.user.entity = [:]; }
          if (ctx.user.entity.relationships == null) { ctx.user.entity.relationships = [:]; }
          if (ctx.user.entity.relationships.administers == null) { ctx.user.entity.relationships.administers = [:]; }
          if (ctx.user.entity.relationships.administers.service == null) { ctx.user.entity.relationships.administers.service = [:]; }
          ctx.user.entity.relationships.administers.service.id = adminIds;
          ctx.user.entity.relationships.administers.service.name = adminNames;
        }

  # Custom fields: github.members.role
  - rename:
      field: json.role
      tag: rename_role
      target_field: github.members.role
      ignore_missing: true

  # Custom fields: github.members.has_two_factor_enabled (only when non-null)
  - rename:
      field: json.hasTwoFactorEnabled
      tag: rename_has_two_factor_enabled
      target_field: github.members.has_two_factor_enabled
      if: ctx.json?.hasTwoFactorEnabled != null
      ignore_missing: true

  # Custom fields: github.members.database_id
  - rename:
      field: json.node.databaseId
      tag: rename_database_id
      target_field: github.members.database_id
      ignore_missing: true

  # Custom fields: nullable profile fields (only when non-null)
  - rename:
      field: json.node.company
      tag: rename_company
      target_field: github.members.company
      if: ctx.json?.node?.company != null
      ignore_missing: true
  - rename:
      field: json.node.location
      tag: rename_location
      target_field: github.members.location
      if: ctx.json?.node?.location != null
      ignore_missing: true
  - rename:
      field: json.node.bio
      tag: rename_bio
      target_field: github.members.bio
      if: ctx.json?.node?.bio != null
      ignore_missing: true
  - rename:
      field: json.node.pronouns
      tag: rename_pronouns
      target_field: github.members.pronouns
      if: ctx.json?.node?.pronouns != null
      ignore_missing: true
  - rename:
      field: json.node.websiteUrl
      tag: rename_website_url
      target_field: github.members.website_url
      if: ctx.json?.node?.websiteUrl != null
      ignore_missing: true
  - rename:
      field: json.node.twitterUsername
      tag: rename_twitter_username
      target_field: github.members.twitter_username
      if: ctx.json?.node?.twitterUsername != null
      ignore_missing: true

  # Custom fields: always-present profile fields
  - rename:
      field: json.node.avatarUrl
      tag: rename_avatar_url
      target_field: github.members.avatar_url
      ignore_missing: true
  - rename:
      field: json.node.url
      tag: rename_url
      target_field: github.members.url
      ignore_missing: true

  # Custom date fields: created_at and updated_at
  - date:
      field: json.node.createdAt
      tag: date_created_at
      target_field: github.members.created_at
      formats:
        - ISO8601
        - strict_date_optional_time
      if: ctx.json?.node?.createdAt != null
      on_failure:
        - append:
            field: error.message
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}
  - date:
      field: json.node.updatedAt
      tag: date_updated_at
      target_field: github.members.updated_at
      formats:
        - ISO8601
        - strict_date_optional_time
      if: ctx.json?.node?.updatedAt != null
      on_failure:
        - append:
            field: error.message
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}} with tag
              {{{_ingest.on_failure_processor_tag}}} failed with message:
              {{{_ingest.on_failure_message}}}

  # Custom boolean flags
  - rename:
      field: json.node.isSiteAdmin
      tag: rename_is_site_admin
      target_field: github.members.is_site_admin
      ignore_missing: true
  - rename:
      field: json.node.isEmployee
      tag: rename_is_employee
      target_field: github.members.is_employee
      ignore_missing: true
  - rename:
      field: json.node.isHireable
      tag: rename_is_hireable
      target_field: github.members.is_hireable
      ignore_missing: true
  - rename:
      field: json.node.isDeveloperProgramMember
      tag: rename_is_developer_program_member
      target_field: github.members.is_developer_program_member
      ignore_missing: true
  - rename:
      field: json.node.isGitHubStar
      tag: rename_is_github_star
      target_field: github.members.is_github_star
      ignore_missing: true
  - rename:
      field: json.node.isBountyHunter
      tag: rename_is_bounty_hunter
      target_field: github.members.is_bounty_hunter
      ignore_missing: true
  - rename:
      field: json.node.isCampusExpert
      tag: rename_is_campus_expert
      target_field: github.members.is_campus_expert
      ignore_missing: true

  # Teams: strip redundant login field, then store in github.members.teams
  - foreach:
      field: json.teams
      tag: remove_login_from_teams
      processor:
        remove:
          field: _ingest._value.login
          tag: remove_team_login_field
          ignore_missing: true
      ignore_missing: true
      if: ctx.json?.teams instanceof List && ctx.json.teams.size() != 0
  - rename:
      field: json.teams
      tag: rename_teams
      target_field: github.members.teams
      ignore_missing: true

  # related.user — collect all user-related values for cross-entity search
  - append:
      field: related.user
      tag: append_related_user_name
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      tag: append_related_user_full_name
      value: '{{{user.full_name}}}'
      allow_duplicates: false
      if: ctx.user?.full_name != null

  # Deduplication: stable document ID from the full raw payload; unchanged members
  # produce the same hash across collection cycles and are not re-indexed.
  - fingerprint:
      fields:
        - event.original
      target_field: _id
      tag: set_fingerprint_id
      ignore_missing: false

  # Cleanup: remove json scratch space
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true

  # Preserve original event when there is an upstream collection error
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
