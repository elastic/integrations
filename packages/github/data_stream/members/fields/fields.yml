- name: github.members
  type: group
  fields:
    - name: role
      type: keyword
      description: Organization membership role (ADMIN or MEMBER).
    - name: has_two_factor_enabled
      type: boolean
      description: >-
        Whether two-factor authentication is enabled for this member. Only present when collect_mfa_status is enabled and the token has admin:org scope.
    - name: database_id
      type: long
      description: Database (REST API) integer ID of the GitHub user.
    - name: company
      type: keyword
      description: Company listed on the member's GitHub profile.
    - name: location
      type: keyword
      description: Location listed on the member's GitHub profile.
    - name: bio
      type: keyword
      description: Short biography from the member's GitHub profile.
    - name: pronouns
      type: keyword
      description: Pronouns set on the member's GitHub profile.
    - name: avatar_url
      type: keyword
      description: URL to the member's GitHub avatar image.
    - name: url
      type: keyword
      description: GitHub profile URL of the member.
    - name: website_url
      type: keyword
      description: Personal website URL from the member's GitHub profile.
    - name: twitter_username
      type: keyword
      description: Twitter/X username from the member's GitHub profile.
    - name: created_at
      type: date
      description: Timestamp when the GitHub account was created.
    - name: updated_at
      type: date
      description: Timestamp of the most recent GitHub profile update.
    - name: is_site_admin
      type: boolean
      description: True if the user is a GitHub site administrator.
    - name: is_employee
      type: boolean
      description: True if the user is a GitHub employee.
    - name: is_hireable
      type: boolean
      description: True if the user has indicated they are available for hire.
    - name: is_developer_program_member
      type: boolean
      description: True if the user is a member of the GitHub Developer Program.
    - name: is_github_star
      type: boolean
      description: True if the user is a GitHub Star.
    - name: is_bounty_hunter
      type: boolean
      description: True if the user has participated in the GitHub Bug Bounty program.
    - name: is_campus_expert
      type: boolean
      description: True if the user is a GitHub Campus Expert.
    - name: teams
      type: group
      description: Teams in the organization that the member belongs to.
      fields:
        - name: id
          type: keyword
          description: GraphQL node ID of the team.
        - name: database_id
          type: long
          description: Database integer ID of the team.
        - name: name
          type: keyword
          description: Display name of the team.
        - name: slug
          type: keyword
          description: URL-safe slug of the team name.
        - name: combined_slug
          type: keyword
          description: Combined slug in the form org/team-slug.
        - name: privacy
          type: keyword
          description: "Team visibility: SECRET or VISIBLE."
        - name: role
          type: keyword
          description: "The member's role in this team: MEMBER or MAINTAINER."
        - name: parent_team_id
          type: keyword
          description: GraphQL node ID of the parent team, if any.
        - name: parent_team_slug
          type: keyword
          description: Slug of the parent team, if any.
