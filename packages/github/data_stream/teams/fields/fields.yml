- name: github.teams
  type: group
  description: GitHub organization team from the GraphQL API.
  fields:
    - name: id
      type: keyword
      description: >-
        GitHub GraphQL node ID of the team (for example, `T_kgDOAABBCC`). Stable across renames. The ingest pipeline copies this value to `entity.id`.
    - name: database_id
      type: long
      description: GitHub database ID of the team (`databaseId` in the raw event).
    - name: name
      type: keyword
      description: Display name of the team.
    - name: created_at
      type: date
      description: Timestamp when the GitHub team was created (`createdAt` in the raw event).
    - name: updated_at
      type: date
      description: Timestamp when the GitHub team was last updated (`updatedAt` in the raw event).
    - name: slug
      type: keyword
      description: URL slug of the team.
    - name: combined_slug
      type: keyword
      description: Organization and team slug, `org/team-slug` (`combinedSlug` in the raw event).
    - name: privacy
      type: keyword
      description: Team visibility, `SECRET` or `VISIBLE`.
    - name: description
      type: keyword
      description: Team description. Omitted when the team has no description.
    - name: parent_team_id
      type: keyword
      description: GraphQL node ID of the parent team, when the team is nested.
    - name: parent_team_slug
      type: keyword
      description: Slug of the parent team, when the team is nested.
