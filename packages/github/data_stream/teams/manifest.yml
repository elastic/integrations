title: GitHub Organization Teams
type: logs
streams:
  - input: cel
    title: GitHub Organization Teams
    description: Collect GitHub organization teams via the GraphQL API.
    template_path: cel.yml.hbs
    vars:
      - name: access_token
        type: password
        title: Personal Access Token
        description: >-
          Classic GitHub personal access token (PAT) with the `read:org` scope. Fine-grained PATs are not supported.
        multi: false
        required: true
        show_user: true
        secret: true
      - name: owner
        type: text
        title: Organization
        description: GitHub organization login (for example, `example-org`).
        multi: false
        required: true
        show_user: true
      - name: interval
        type: text
        title: Interval
        description: >-
          Duration between collection cycles. Team rosters change infrequently. Supported units: h, m, s.
        multi: false
        required: true
        show_user: true
        default: 24h
      - name: api_url
        type: text
        title: API URL
        description: >-
          GitHub API base URL. Calls `<API URL>/graphql`. Override for GitHub Enterprise Server (for example, `https://github.example.com/api`).
        multi: false
        required: true
        show_user: false
        default: https://api.github.com
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: >-
          Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h.
        multi: false
        required: false
        show_user: false
        default: 60s
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - github-teams
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/fleet/current/elastic-agent-processor-configuration.html) for details.
      - name: preserve_original_event
        type: bool
        title: Preserve Original Event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: false
        default: false
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracing
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        multi: false
        required: false
        show_user: false
        default: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false
