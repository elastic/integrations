wait_for_data_timeout: 1m
input: cel
deployer: docker
service: github-teams
data_stream:
  vars:
    api_url: http://{{Hostname}}:{{Port}}
    access_token: test-token
    owner: example-org
    interval: 2s
# Two identical snapshots of 3 teams. The ingest fingerprint of event.original
# reuses _id, so the second snapshot overwrites the first and the index holds 3
# documents. Later cycles are an empty page. Retry placeholders are dropped.
assert:
  hit_count: 3
