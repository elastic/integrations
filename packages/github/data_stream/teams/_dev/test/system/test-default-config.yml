wait_for_data_timeout: 1m
input: cel
deployer: docker
service: github-teams
data_stream:
  vars:
    api_url: http://{{Hostname}}:{{Port}}
    access_token: test-token
    owner: example-org
    interval: 2s
# Two identical snapshots of 3 teams. The ingest fingerprint of event.original
# reuses _id. Data streams accept only create, so the second snapshot is
# rejected and the first document is kept. The index holds 3 documents.
# Later cycles are an empty page. Retry placeholders are dropped.
assert:
  hit_count: 3
