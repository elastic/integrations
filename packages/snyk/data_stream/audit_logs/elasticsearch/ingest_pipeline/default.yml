---
description: Pipeline for Snyk Audit logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: 8.11.0
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  # Cleanup equivalent names
  - rename:
      tag: rename_json_groupId_to_json_group_id_59489ded
      field: json.groupId
      target_field: json.group_id
      ignore_missing: true
  - rename:
      tag: rename_json_orgId_to_json_org_id_c6fc0549
      field: json.orgId
      target_field: json.org_id
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_51b8f904
      fields:
        - json.org_id
        - json.group_id
        - json.created
        - json.event
      target_field: _id
      ignore_missing: true
  - rename:
      tag: rename_json_to_snyk_audit_logs_9845c0f8
      field: json
      target_field: snyk.audit_logs
      ignore_missing: true
  - rename:
      tag: rename_snyk_audit_logs_group_id_to_user_group_id_f62a610e
      field: snyk.audit_logs.group_id
      target_field: user.group.id
      ignore_missing: true
  - set:
      tag: set_organization_id_a6da6951
      field: organization.id
      copy_from: snyk.audit_logs.org_id
      ignore_empty_value: true
  - rename:
      tag: rename_snyk_audit_logs_projectId_to_snyk_audit_logs_project_id_92d0f67f
      field: snyk.audit_logs.projectId
      target_field: snyk.audit_logs.project_id
      ignore_missing: true
  - set:
      tag: set_user_id_891c918a
      field: user.id
      copy_from: snyk.audit_logs.user_id
      ignore_empty_value: true
  - rename:
      tag: rename_snyk_audit_logs_event_to_event_action_5aef06e6
      field: snyk.audit_logs.event
      target_field: event.action
      ignore_missing: true
  - append:
      tag: append_event_type_28181883
      field: event.type
      value: user
      if: ctx.event?.action != null && ctx.event.action =~ /\buser\b/
      allow_duplicates: false
  - append:
      tag: append_event_type_3aa33285
      field: event.type
      value: creation
      if: ctx.event?.action != null && ctx.event.action =~ /\b(?:add|create)\b/
      allow_duplicates: false
  - append:
      tag: append_event_type_c3dad305
      field: event.type
      value: change
      if: ctx.event?.action != null && ctx.event.action =~ /\bedit\b/
      allow_duplicates: false
  - append:
      tag: append_event_type_f4bed2ad
      field: event.type
      value: access
      if: ctx.event?.action != null && ctx.event.action =~ /\baccess\b/
      allow_duplicates: false
  - append:
      tag: append_event_type_f4d863b2
      field: event.type
      value: deletion
      if: ctx.event?.action != null && ctx.event.action =~ /\b(?:remove|delete)\b/
      allow_duplicates: false
  - append:
      tag: append_event_category_181b06d6
      field: event.category
      value: configuration
      if: ctx.event?.action != null && ctx.event.action =~ /\bsettings\b/
      allow_duplicates: false
  - append:
      tag: append_event_category_c26e8902
      field: event.category
      value: file
      if: ctx.event?.action != null && ctx.event.action =~ /\bfiles\b/
      allow_duplicates: false
  - append:
      tag: append_event_category_bad8532d
      field: event.category
      value: iam
      if: ctx.event?.action != null && ctx.event.action =~ /\buser\b/
      allow_duplicates: false
  - set:
      tag: set_event_type_e4a41200
      field: event.type
      value: [info]
      if: ctx.event?.type == null
  - date:
      tag: date_snyk_audit_logs_created_to_timestamp_8b8708fa
      field: snyk.audit_logs.created
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
  - append:
      tag: append_related_user_d07fbfcc
      field: related.user
      value: '{{{snyk.audit_logs.user_id}}}'
      if: ctx.snyk?.audit_logs?.user_id != null
      allow_duplicates: false
  - append:
      tag: append_related_user_9897c509
      field: related.user
      value: '{{{snyk.audit_logs.content.email}}}'
      if: ctx.snyk?.audit_logs?.content?.email != null
      allow_duplicates: false
  - append:
      tag: append_related_user_a31a9c69
      field: related.user
      value: '{{{snyk.audit_logs.content.userPublicId}}}'
      if: ctx.snyk?.audit_logs?.content?.userPublicId != null
      allow_duplicates: false
  - uri_parts:
      tag: uri_parts_snyk_audit_logs_content_url_to_url_11f5ffea
      field: snyk.audit_logs.content.url
      target_field: url
      if: ctx.snyk?.audit_logs?.content?.url != null
      on_failure:
      - append:
          tag: append_error_message_8286b5e7
          field: error.message
          value: '{{{ _ingest.on_failure_message }}}'
  - script:
      lang: painless
      tag: rename_blank_notSupported
      if: ctx.snyk?.audit_logs?.content?.notSupported instanceof Map
      source: |-
        def blank = ctx.snyk.audit_logs.content.notSupported[''];
        if (blank == null) {
          return;
        }
        ctx.snyk.audit_logs.content.notSupported.no_extension = ctx.snyk.audit_logs.content.notSupported[''];
        ctx.snyk.audit_logs.content.notSupported.remove('');
  - script:
      tag: script_4d6993cb
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        void handleMap(Map map) {
          for (def x : map.values()) {
            if (x instanceof Map) {
                handleMap(x);
            } else if (x instanceof List) {
                handleList(x);
            }
          }
          map.values().removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        void handleList(List list) {
          for (def x : list) {
              if (x instanceof Map) {
                  handleMap(x);
              } else if (x instanceof List) {
                  handleList(x);
              }
          }
          list.removeIf(v -> v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0));
        }
        handleMap(ctx);
  - remove:
      tag: remove_f82976c5
      field:
        - snyk.audit_logs.created
        - message
        - json
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
