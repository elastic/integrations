- name: hiperai
  type: group
  description: >-
    Fields specific to the HiperAI SecureAI platform.
  fields:
    - name: action
      type: keyword
      description: >-
        The specific action within SecureAI that triggered this event (e.g., chat_completion, login_success, smltp_violation, smltp_policy_applied, entitlement_denied).
    - name: category
      type: keyword
      description: >-
        SecureAI event category. One of: authentication, security, smltp, api, data_access, system, configuration, billing, analytics.
    - name: severity
      type: keyword
      description: >-
        SecureAI severity label. One of: info, low, medium, high, critical.
    - name: session_id
      type: keyword
      description: >-
        The SecureAI session identifier associated with the event.
    - name: activity
      type: flattened
      description: >-
        Detailed activity object from SecureAI containing additional context about the event, including type, description, severity, outcome, reason, resource_id, resource_type, and compliance_category.
    - name: metadata
      type: flattened
      description: >-
        Additional metadata about the event, including tenant information, model parameters, integration context, and any other contextual data provided by SecureAI.
