---
description: Pipeline for processing HiperAI SecureAI security events.
processors:
  ##
  ## 0. ECS version
  ##
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  ##
  ## 1. event.original handling (JSE00001)
  ##
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  ##
  ## 2. Timestamp normalization
  ##
  - date:
      field: json.timestamp
      tag: parse_timestamp
      formats:
        - "ISO8601"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
        - "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
      target_field: "@timestamp"
      if: ctx.json?.timestamp != null
      on_failure:
        - append:
            field: error.message
            tag: append_error_message_parse_timestamp
            value: >-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}' {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'

  ##
  ## 3. Map to ECS event.* fields
  ##
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - set:
      field: event.module
      tag: set_event_module
      value: hiperai
  - set:
      field: event.dataset
      tag: set_event_dataset
      value: hiperai.events
  - rename:
      field: json.event_type
      tag: rename_event_type_to_action
      target_field: event.action
      ignore_missing: true
  - set:
      field: event.provider
      tag: set_event_provider
      value: secureai

  # Map the SecureAI severity label to the numeric ECS event.severity, using the
  # Elastic Security severity/risk-score scale shared with other integrations so
  # the values are comparable across data sources.
  - script:
      lang: painless
      description: Script to set event.severity.
      tag: set_event_severity_from_severity_name
      if: ctx.json?.severity instanceof String
      source: |-
        ctx.event = ctx.event ?: [:];
        String risk_score_value = ctx.json.severity;
        if (risk_score_value.equalsIgnoreCase("low") || risk_score_value.equalsIgnoreCase("info") || risk_score_value.equalsIgnoreCase("informational")) {
          ctx.event.severity = 21;
        } else if (risk_score_value.equalsIgnoreCase("medium")) {
          ctx.event.severity = 47;
        } else if (risk_score_value.equalsIgnoreCase("high")) {
          ctx.event.severity = 73;
        } else if (risk_score_value.equalsIgnoreCase("critical")) {
          ctx.event.severity = 99;
        }
      on_failure:
        - append:
            tag: append_error_message_set_event_severity
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # ECS categorization: map the SecureAI event action (event.action, sourced from
  # json.event_type above) and, as a fallback, the SecureAI event category
  # (json.category) to event.category and event.type. See the events table in
  # docs/README.md for the full list of SecureAI event types.
  - script:
      lang: painless
      tag: set_ecs_categorization
      description: Map SecureAI event action / category to ECS event.category and event.type.
      if: (ctx.event != null && ctx.event.action != null) || (ctx.json != null && ctx.json.category != null)
      params:
        by_action:
          login_success:
            category: [authentication]
            type: [start]
          login_failed:
            category: [authentication]
            type: [start]
          logout:
            category: [session]
            type: [end]
          chat_completion:
            category: [api]
            type: [access]
          api_request:
            category: [api]
            type: [access]
          data_access:
            category: [api]
            type: [access]
          billing_event:
            category: [api]
            type: [info]
          policy_violation:
            category: [intrusion_detection]
            type: [denied]
          security_incident:
            category: [intrusion_detection]
            type: [info]
          smltp_violation:
            category: [intrusion_detection]
            type: [denied]
          smltp_policy_applied:
            category: [intrusion_detection]
            type: [info]
          smltp_entitlement_denied:
            category: [intrusion_detection]
            type: [denied]
          audit_log:
            category: [configuration]
            type: [info]
        # The fallback covers every category declared in fields/fields.yml, so an
        # event with an unrecognised event_type is still categorized.
        by_category:
          authentication:
            category: [authentication]
            type: [info]
          security:
            category: [intrusion_detection]
            type: [info]
          smltp:
            category: [intrusion_detection]
            type: [info]
          api:
            category: [api]
            type: [info]
          data_access:
            category: [api]
            type: [info]
          system:
            category: [host]
            type: [info]
          configuration:
            category: [configuration]
            type: [info]
          billing:
            category: [api]
            type: [info]
          analytics:
            category: [api]
            type: [info]
      source: |-
        def mapping = null;
        if (ctx.event != null && ctx.event.action != null) {
          mapping = params.by_action.get(ctx.event.action);
        }
        if (mapping == null && ctx.json != null && ctx.json.category != null) {
          mapping = params.by_category.get(ctx.json.category);
        }
        if (mapping == null) {
          return;
        }
        ctx.event.category = mapping.category;
        ctx.event.type = mapping.type;

  # Map event outcome
  - set:
      field: event.outcome
      tag: set_outcome_success
      value: success
      if: >-
        ctx.json?.activity?.outcome == 'success' ||
        ctx.event?.action == 'login_success'
  - set:
      field: event.outcome
      tag: set_outcome_failure
      value: failure
      if: >-
        ctx.json?.activity?.outcome == 'failure' ||
        ctx.event?.action == 'login_failed'

  ##
  ## 4. Map to ECS source.* fields
  ##
  - convert:
      field: json.ip
      tag: convert_json_ip_to_source_ip
      target_field: source.ip
      type: ip
      ignore_missing: true
      ignore_failure: true
  - rename:
      field: json.actor.ip_address
      tag: rename_actor_ip_to_source_ip
      target_field: source.ip
      ignore_missing: true
      override: false
      if: ctx.source?.ip == null && ctx.json?.actor?.ip_address != null

  ##
  ## 5. Map to ECS user.* fields
  ##
  - rename:
      field: json.user
      tag: rename_json_user_to_user_name
      target_field: user.name
      ignore_missing: true
  - rename:
      field: json.actor.username
      tag: rename_actor_username_to_user_name
      target_field: user.name
      ignore_missing: true
      override: false
      if: ctx.user?.name == null
  - rename:
      field: json.actor.user_id
      tag: rename_actor_user_id_to_user_id
      target_field: user.id
      ignore_missing: true

  ##
  ## 6. Map to ECS user_agent.* fields
  ##
  - rename:
      field: json.user_agent
      tag: rename_json_user_agent
      target_field: user_agent.original
      ignore_missing: true
  - rename:
      field: json.actor.user_agent
      tag: rename_actor_user_agent
      target_field: user_agent.original
      ignore_missing: true
      override: false
      if: ctx.user_agent?.original == null
  - user_agent:
      field: user_agent.original
      tag: parse_user_agent
      ignore_missing: true
      ignore_failure: true

  ##
  ## 7. Map to ECS observer.* fields (SecureAI is the security observer)
  ##
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: HiperAI
  - set:
      field: observer.product
      tag: set_observer_product
      value: SecureAI
  - set:
      field: observer.type
      tag: set_observer_type
      value: ai_security_gateway

  ##
  ## 8. Map message field
  ##
  - rename:
      field: json.message
      tag: rename_json_message
      target_field: message
      ignore_missing: true
  - rename:
      field: json.activity.description
      tag: rename_activity_description_to_message
      target_field: message
      ignore_missing: true
      override: false
      if: ctx.message == null

  ##
  ## 9. Map SecureAI-specific fields (under hiperai.*)
  ##
  - rename:
      field: json.action
      tag: rename_json_action
      target_field: hiperai.action
      ignore_missing: true
  - rename:
      field: json.category
      tag: rename_json_category
      target_field: hiperai.category
      ignore_missing: true
  - rename:
      field: json.severity
      tag: rename_json_severity
      target_field: hiperai.severity
      ignore_missing: true
  - rename:
      field: json.session_id
      tag: rename_json_session_id
      target_field: hiperai.session_id
      ignore_missing: true
  - rename:
      field: json.activity
      tag: rename_json_activity
      target_field: hiperai.activity
      ignore_missing: true
  - rename:
      field: json.metadata
      tag: rename_json_metadata
      target_field: hiperai.metadata
      ignore_missing: true

  ##
  ## 10. GeoIP enrichment from source IP
  ##
  - geoip:
      field: source.ip
      tag: enrich_source_geo
      target_field: source.geo
      if: ctx.source?.ip != null
      ignore_missing: true
      ignore_failure: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      tag: enrich_source_asn
      target_field: source.as
      if: ctx.source?.ip != null
      properties:
        - asn
        - organization_name
      ignore_missing: true
      ignore_failure: true
  - rename:
      field: source.as.asn
      tag: rename_source_as_asn_to_number
      target_field: source.as.number
      ignore_missing: true
  - rename:
      field: source.as.organization_name
      tag: rename_source_as_organization_name
      target_field: source.as.organization.name
      ignore_missing: true

  ##
  ## 11. Related fields for correlation
  ##
  - append:
      field: related.ip
      tag: append_source_ip_to_related
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      field: related.user
      tag: append_user_name_to_related
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null

  ##
  ## 12. Cleanup temporary fields
  ##
  - remove:
      field:
        - json
      tag: cleanup_temp_fields
      ignore_missing: true

on_failure:
  - append:
      field: error.message
      tag: append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}' {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event_tag_on_failure
      value: preserve_original_event
      allow_duplicates: false
