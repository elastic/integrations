title: "HiperAI SecureAI Events"
type: logs
streams:
  - input: http_endpoint
    title: SecureAI Security Events
    description: >-
      Receive security events pushed from the HiperAI SecureAI platform via HTTP webhook. Events include authentication, AI model usage, SMLTP policy violations, DLP alerts, and audit logs.
    template_path: http_endpoint.yml.hbs
    vars:
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve Original Event
        description: >-
          Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags to include in the published event.
        multi: true
        required: false
        show_user: false
        default:
          - hiperai-secureai
          - forwarded
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Additional processors to apply to the events. See the Elastic Agent documentation for available processors.
        multi: false
        required: false
        show_user: false
