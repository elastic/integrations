input: aws-s3
vars:
  access_key_id: FAKE_AWS_ACCESS_KEY_ID_FOR_TESTS_ONLY
  secret_access_key: FAKE_AWS_SECRET_ACCESS_KEY_FOR_TESTS_ONLY
  default_region: us-east-1
data_stream:
  vars:
    collect_s3_logs: true
    access_point_arn: "arn:aws:s3:us-east-1:123456789012:accesspoint/cloudtrail-ap"
    bucket_list_prefix: "AWSLogs/123456789012/CloudTrail/"
    number_of_workers: 5
    preserve_original_event: true
    actor_target_mapping: true
    retain: all
