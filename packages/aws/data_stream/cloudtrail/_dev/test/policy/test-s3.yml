vars:
  access_key_id: FAKE_AWS_ACCESS_KEY_ID_FOR_TESTS_ONLY
  secret_access_key: FAKE_AWS_SECRET_ACCESS_KEY_FOR_TESTS_ONLY
  default_region: us-east-1
data_stream:
  vars:
    collect_s3_logs: false
    queue_url: https://sqs.us-east-1.amazonaws.com/123456789012/cloudtrail-queue
    number_of_workers: 5
    max_number_of_messages: 5
    preserve_original_event: true
    actor_target_mapping: true
    retain: all
