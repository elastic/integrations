  - script:
      description: >
        Resolve _conf.keep_flattened_duplicates from the retain setting, then set values in
        aws.cloudtrail.request_parameters, aws.cloudtrail.response_elements, and
        aws.cloudtrail.additional_eventdata. If _conf.keep_flattened_duplicates is true, also
        copy into aws.cloudtrail.flattened. Since aws.cloudtrail.flattened is optionally present,
        is MUST NEVER be used as an RHS in any processor.
        Assignments of json.requestParameters, json.responseElements, json.additionalEventData
        and json.serviceEventDetails to the corresponding flattened fields are shallow, so
        sub-fields of these field MUST NEVER be renamed or otherwise mutated, that is, they
        MUST NEVER be an LHS in any processor.
      lang: painless
      tag: script_duplicate_rules_fields
      source: |-
        ctx._conf = ctx._conf ?: [:];
        ctx._conf.keep_flattened_duplicates = ctx._conf.retain == null ||
          ctx._conf.retain.contains('all') ||
          ctx._conf.retain.contains('flattened') ||
          ctx._conf.retain.contains('minimal');
        ctx.aws = ctx.aws ?: [:];
        ctx.aws.cloudtrail = ctx.aws.cloudtrail ?: [:];
        if (ctx._conf.keep_flattened_duplicates) {
          ctx.aws.cloudtrail.flattened = ctx.aws.cloudtrail.flattened ?: [:];
        }
        if (ctx.json?.requestParameters != null) {
          ctx.aws.cloudtrail.request_parameters = ctx.json.requestParameters.toString();
          if (ctx._conf.keep_flattened_duplicates && ctx.aws.cloudtrail.request_parameters.length() < 32766) {
            ctx.aws.cloudtrail.flattened.request_parameters = ctx.json.requestParameters;
          }
        }
        if (ctx.json?.responseElements != null) {
          ctx.aws.cloudtrail.response_elements = ctx.json.responseElements.toString();
          if (ctx._conf.keep_flattened_duplicates && ctx.aws.cloudtrail.response_elements.length() < 32766) {
            ctx.aws.cloudtrail.flattened.response_elements = ctx.json.responseElements;
          }
        }
        if (ctx.json?.additionalEventData != null) {
          ctx.aws.cloudtrail.additional_eventdata = ctx.json.additionalEventData.toString();
          if (ctx._conf.keep_flattened_duplicates && ctx.aws.cloudtrail.additional_eventdata.length() < 32766) {
            ctx.aws.cloudtrail.flattened.additional_eventdata = ctx.json.additionalEventData;
          }
        }
        if (ctx.json?.serviceEventDetails != null) {
          ctx.aws.cloudtrail.service_event_details = ctx.json.serviceEventDetails.toString();
          if (ctx._conf.keep_flattened_duplicates && ctx.aws.cloudtrail.service_event_details.length() < 32766) {
            ctx.aws.cloudtrail.flattened.service_event_details = ctx.json.serviceEventDetails;
          }
        }
