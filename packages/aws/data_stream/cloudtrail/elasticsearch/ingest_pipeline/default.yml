  - script:
      tag: script_deduplicate_json_resources
      description: 'Moves the resources list to aws.cloudtrail.resources, dropping duplicates where the same combination of ARN, accountId and type appears more than once.'
      lang: painless
      if: ctx.json?.resources != null
      on_failure:
        - append:
            tag: append_error_message_deduplicate_json_resources
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
      source: >
        def resources = ctx.json.remove('resources');
        ctx.aws = ctx.aws ?: [:];
        ctx.aws.cloudtrail = ctx.aws.cloudtrail ?: [:];
        if (!(resources instanceof List)) {
          ctx.aws.cloudtrail.resources = resources;
          return;
        }
        Map uniqueResources = [:];
        for (def originalResource : resources) {
          if (originalResource instanceof Map) {
            Map resource = [:];
            resource.putAll(originalResource);
            if (resource.containsKey('ARN')) {
              resource.arn = resource.remove('ARN');
            }
            if (resource.containsKey('accountId')) {
              resource.account_id = resource.remove('accountId');
            }
            String key = (resource.containsKey('arn') ? resource.arn : '') + '_' +
                         (resource.containsKey('account_id') ? resource.account_id : '') + '_' +
                         (resource.containsKey('type') ? resource.type : '');
            uniqueResources[key] = resource;
          }
        }
        ctx.aws.cloudtrail.resources = new ArrayList(uniqueResources.values());
