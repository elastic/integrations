  - script:
      tag: script_append_related_hosts_instance_ids
      lang: painless
      description: >
        Collect EC2 instance identifiers and add them to related.hosts. CloudTrail
        reports them in several shapes depending on the API.
      if: >-
        ctx.json?.requestParameters != null || ctx.json?.responseElements != null ||
        ctx.aws?.cloudtrail?.resources != null
      params:
        scalar_keys:
          - instanceId
          - target
          - resourceId
      on_failure:
        - append:
            tag: append_error_message_related_hosts_instance_ids
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
      source: |
        void add(List out, def value) {
          if (value instanceof String && value.length() >= 10 && value.startsWith('i-') && !out.contains(value)) {
            out.add(value);
          }
        }

        void addContainer(List out, def container, List scalarKeys) {
          if (!(container instanceof Map)) {
            return;
          }
          for (String key : scalarKeys) {
            add(out, container[key]);
          }
          if (container.instanceIds instanceof List) {
            for (def id : container.instanceIds) {
              add(out, id);
            }
          }
          def set = container.instancesSet;
          if (set instanceof Map && set.items instanceof List) {
            for (def item : set.items) {
              if (item instanceof Map) {
                add(out, item.instanceId);
              }
            }
          }
        }

        List found = new ArrayList();

        if (ctx.aws?.cloudtrail?.resources instanceof List) {
          for (def resource : ctx.aws.cloudtrail.resources) {
            if (resource instanceof Map && resource.arn instanceof String && resource.arn.contains(':instance/')) {
              add(found, resource.arn.substring(resource.arn.lastIndexOf('/') + 1));
            }
          }
        }
        addContainer(found, ctx.json?.requestParameters, params.scalar_keys);
        addContainer(found, ctx.json?.responseElements, params.scalar_keys);

        if (found.isEmpty()) {
          return;
        }
        ctx.related = ctx.related ?: [:];
        if (ctx.related.hosts instanceof List) {
          for (def host : found) {
            if (!ctx.related.hosts.contains(host)) {
              ctx.related.hosts.add(host);
            }
          }
        } else {
          ctx.related.hosts = found;
        }

  # Remove the fields that the user does not want.
  # In the case that we did not want the flattened fields our work is already
  # done, since we did not retain them. Otherwise we remove the relevant fields
  # in the following two processors.
  - script:
      if: ctx._conf?.retain == 'minimal' && ctx.aws?.cloudtrail?.flattened != null
      tag: script_retain_minimal_flattened
      params:
        # This list of fields is determined by enumerating all fields containing
        # the string "cloudtrail.flattened" that are in .attributes.required_fields of the
        # rules in security_detection_engine/kibana/security_rule.
        # It must be kept up to date with the rules.
        required_flattened_fields:
          - aws.cloudtrail.flattened.additional_eventdata.SSEApplied
          - aws.cloudtrail.flattened.request_parameters.cidrIp
          - aws.cloudtrail.flattened.request_parameters.dryRun
          - aws.cloudtrail.flattened.request_parameters.fromPort
          - aws.cloudtrail.flattened.request_parameters.includeDeprecated
          - aws.cloudtrail.flattened.request_parameters.policyArn
          - aws.cloudtrail.flattened.request_parameters.serialNumber
          - aws.cloudtrail.flattened.request_parameters.withDecryption
          - aws.cloudtrail.flattened.request_parameters.x-amz-server-side-encryption-customer-algorithm
      source: |-
        def set(Map root, String path, def v) {
          String[] elems = path.splitOnToken('.');
          def dst = root;
          for (int i = 0; i < elems.length-1; i++) {
            dst = dst.computeIfAbsent(elems[i], _ -> [:]);
          }
          dst[elems[elems.length-1]] = v;
        }
        Map flattened = [:];
        int prefix = "aws.cloudtrail.flattened.".length();
        for (String f: params.required_flattened_fields) {
          def v = $(f, null);
          if (v == null) {
            continue;
          }
          set(flattened, f.substring(prefix), v);
        }
        ctx.aws.cloudtrail.flattened = flattened;
