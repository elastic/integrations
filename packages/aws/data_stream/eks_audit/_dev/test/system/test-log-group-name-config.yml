input: aws-cloudwatch
wait_for_data_timeout: 20m
vars:
  access_key_id: '{{AWS_ACCESS_KEY_ID}}'
  secret_access_key: '{{AWS_SECRET_ACCESS_KEY}}'
  session_token: '{{AWS_SESSION_TOKEN}}'
  default_region: '{{TF_OUTPUT_region_name}}'
data_stream:
  vars:
    log_group_name: '{{TF_OUTPUT_eks_audit_log_group_name}}'
    region_name: '{{TF_OUTPUT_region_name}}'
assert:
  hit_count: 18
