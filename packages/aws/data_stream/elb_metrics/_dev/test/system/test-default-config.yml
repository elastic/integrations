wait_for_data_timeout: 25m # AWS CloudWatch may delay metrics delivery for more than 10 minutes.
vars:
  access_key_id: "{{AWS_ACCESS_KEY_ID}}"
  secret_access_key: "{{AWS_SECRET_ACCESS_KEY}}"
  session_token: "{{AWS_SESSION_TOKEN}}"
data_stream:
  vars:
    period: 1m
    latency: 5m
    regions:
      - "{{AWS_REGION}}"
    tags_filter: |-
      - key: Name
        value: "elastic-package-test-{{TEST_RUN_ID}}"
assert:
  min_count: 1
  fields_present:
    - aws.applicationelb.metrics.HTTPCode_Target_2XX_Count.sum
    - aws.applicationelb.metrics.HTTPCode_Target_3XX_Count.sum
    - aws.applicationelb.metrics.HTTPCode_Target_4XX_Count.sum
    - aws.applicationelb.metrics.HTTPCode_Target_5XX_Count.sum
