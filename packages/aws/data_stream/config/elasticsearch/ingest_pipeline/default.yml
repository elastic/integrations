---
description: Pipeline for processing aws config logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: cloud.provider
      tag: set_cloud_provider_fccb2a9a
      value: aws
  - set:
      field: observer.vendor
      tag: set_observer_vendor_94714cd1
      value: AWS Config
  - append:
      field: event.category
      tag: append_to_event_category_5bc3dda0
      value: configuration
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - append:
      field: event.type
      tag: append_to_event_type_5eab37e6
      value: info
  - rename:
      field: json.Annotation
      tag: rename_Annotation_ad978d0c
      target_field: aws.config.annotation
      ignore_missing: true
  - dissect:
      field: json.ConfigRuleInfo.ConfigRuleArn
      tag: dissect_ConfigRuleInfo_ConfigRuleArn_a5d011e4
      pattern: "%{}:%{}:%{}:%{}:%{cloud.account.id}:%{}"
      ignore_failure: true
  - set:
      field: cloud.account.name
      tag: set_cloud_account_name_from_cloud_account_id_9697cd07
      copy_from: cloud.account.id
      ignore_empty_value: true
  - rename:
      field: json.ConfigRuleInfo.ConfigRuleArn
      tag: rename_ConfigRuleInfo_ConfigRuleArn_aed7bb3f
      target_field: aws.config.rule_info.config_rule_arn
      ignore_missing: true
  - set:
      field: rule.reference
      tag: set_rule_reference_from_config_config_rule_info_config_rule_arn_292caa35
      copy_from: aws.config.rule_info.config_rule_arn
      ignore_empty_value: true
  - fingerprint:
      fields:
        - rule.reference
      tag: fingerprint_rule_uuid_c6ceafc5
      target_field: rule.uuid
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.ConfigRuleId
      tag: rename_ConfigRuleInfo_ConfigRuleId_d74b225b
      target_field: aws.config.rule_info.config_rule_id
      ignore_missing: true
  - set:
      field: rule.id
      tag: set_rule_id_from_config_config_rule_info_config_rule_id_d56b1d47
      copy_from: aws.config.rule_info.config_rule_id
      ignore_empty_value: true
  - rename:
      field: json.ConfigRuleInfo.ConfigRuleName
      tag: rename_ConfigRuleInfo_ConfigRuleName_88b56d8e
      target_field: aws.config.rule_info.config_rule_name
      ignore_missing: true
  - set:
      field: rule.name
      tag: set_rule_name_from_config_config_rule_info_config_rule_name_3239a550
      copy_from: aws.config.rule_info.config_rule_name
      ignore_empty_value: true
  - rename:
      field: json.ConfigRuleInfo.ConfigRuleState
      tag: rename_ConfigRuleInfo_ConfigRuleState_782b9d09
      target_field: aws.config.rule_info.config_rule_state
      ignore_missing: true
  - append:
      tag: append_related_user_3621e5fc
      field: related.user
      value: '{{{json.ConfigRuleInfo.CreatedBy}}}'
      allow_duplicates: false
      if: ctx.json?.ConfigRuleInfo?.CreatedBy !=null
  - rename:
      field: json.ConfigRuleInfo.CreatedBy
      tag: rename_ConfigRuleInfo_CreatedBy_68ee9a86
      target_field: aws.config.rule_info.created_by
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Description
      tag: rename_ConfigRuleInfo_Description_87c66d3c
      target_field: aws.config.rule_info.description
      ignore_missing: true
  - set:
      field: rule.description
      tag: set_rule_description_from_aws_config_config_rule_info_description_34d39260
      copy_from: aws.config.rule_info.description
      ignore_empty_value: true
  - set:
      field: message
      tag: set_message_from_aws_config_config_rule_info_description_f5f2eba2
      copy_from: aws.config.rule_info.description
      ignore_empty_value: true
  - foreach:
      tag: foreach_json_ConfigRuleInfo_EvaluationModes_304c981e
      field: json.ConfigRuleInfo.EvaluationModes
      if: ctx.json?.ConfigRuleInfo?.EvaluationModes instanceof List
      processor:
        rename:
          field: _ingest._value.Mode
          tag: rename_ConfigRuleInfo_EvaluationModes_Mode_97599f77
          target_field: _ingest._value.mode
          ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.EvaluationModes
      tag: rename_ConfigRuleInfo_EvaluationModes_0e054905
      target_field: aws.config.rule_info.evaluation_modes
      ignore_missing: true
  - json:
      field: json.ConfigRuleInfo.InputParameters
      if: ctx.json?.ConfigRuleInfo?.InputParameters != null && ctx.json.ConfigRuleInfo.InputParameters != ''
      tag: json_ConfigRuleInfo_InputParameters_6d316004
      target_field: aws.config.rule_info.input_parameters
      on_failure:
        - append:
            tag: append_error_message_baa553ee
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.ConfigRuleInfo.MaximumExecutionFrequency
      tag: rename_ConfigRuleInfo_MaximumExecutionFrequency_d729e292
      target_field: aws.config.rule_info.maximum_execution_frequency
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Scope.ComplianceResourceId
      tag: rename_ConfigRuleInfo_Scope_ComplianceResourceId_8e5523be
      target_field: aws.config.rule_info.scope.compliance_resource_id
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Scope.ComplianceResourceTypes
      tag: rename_ConfigRuleInfo_Scope_ComplianceResourceTypes_722fb1be
      target_field: aws.config.rule_info.scope.compliance_resource_types
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Scope.TagKey
      tag: rename_ConfigRuleInfo_Scope_TagKey_a5e1756d
      target_field: aws.config.rule_info.scope.tag_key
      ignore_missing: true
  - convert:
      field: json.ConfigRuleInfo.Source.CustomPolicyDetails.EnableDebugLogDelivery
      tag: convert_ConfigRuleInfo_Source_CustomPolicyDetails_EnableDebugLogDelivery_to_boolean_101ab74f
      target_field: aws.config.rule_info.source.custom_policy_details.enable_debug_log_delivery
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_9a2af158
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.ConfigRuleInfo.Source.CustomPolicyDetails.PolicyRuntime
      tag: rename_ConfigRuleInfo_Source_CustomPolicyDetails_PolicyRuntime_4616ac71
      target_field: aws.config.rule_info.source.custom_policy_details.policy_runtime
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Source.CustomPolicyDetails.PolicyText
      tag: rename_ConfigRuleInfo_Source_CustomPolicyDetails_PolicyText_5c9f4b70
      target_field: aws.config.rule_info.source.custom_policy_details.policy_text
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Source.Owner
      tag: rename_ConfigRuleInfo_Source_Owner_710f0863
      target_field: aws.config.rule_info.source.owner
      ignore_missing: true
  - foreach:
      tag: foreach_json_ConfigRuleInfo_Source_SourceDetails_d391333b
      field: json.ConfigRuleInfo.Source.SourceDetails
      if: ctx.json?.ConfigRuleInfo?.Source?.SourceDetails instanceof List
      processor:
        rename:
          field: _ingest._value.EventSource
          tag: rename_ConfigRuleInfo_Source_SourceDetails_EventSource_edb2154c
          target_field: _ingest._value.event_source
          ignore_missing: true
  - foreach:
      tag: foreach_json_ConfigRuleInfo_Source_SourceDetails_34d6947d
      field: json.ConfigRuleInfo.Source.SourceDetails
      if: ctx.json?.ConfigRuleInfo?.Source?.SourceDetails instanceof List
      processor:
        rename:
          field: _ingest._value.MaximumExecutionFrequency
          tag: rename_ConfigRuleInfo_Source_SourceDetails_MaximumExecutionFrequency_a31d3f8b
          target_field: _ingest._value.maximum_execution_frequency
          ignore_missing: true
  - foreach:
      tag: foreach_json_ConfigRuleInfo_Source_SourceDetails_d1c5db73
      field: json.ConfigRuleInfo.Source.SourceDetails
      if: ctx.json?.ConfigRuleInfo?.Source?.SourceDetails instanceof List
      processor:
        rename:
          field: _ingest._value.MessageType
          tag: rename_ConfigRuleInfo_Source_SourceDetails_MessageType_c4ff1ae8
          target_field: _ingest._value.message_type
          ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Source.SourceDetails
      tag: rename_ConfigRuleInfo_Source_SourceDetails_053a7190
      target_field: aws.config.rule_info.source.source_details
      ignore_missing: true
  - rename:
      field: json.ConfigRuleInfo.Source.SourceIdentifier
      tag: rename_ConfigRuleInfo_Source_SourceIdentifier_c84e0660
      target_field: aws.config.rule_info.source.source_identifier
      ignore_missing: true
  - date:
      field: json.ConfigRuleInvokedTime
      tag: date_ConfigRuleInvokedTime_200cadd7
      target_field: aws.config.config_rule_invoked_time
      formats:
        - UNIX_MS
        - UNIX
      if: ctx.json?.ConfigRuleInvokedTime != null && ctx.json.ConfigRuleInvokedTime != ''
      on_failure:
        - append:
            tag: append_error_message_bb64b97f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.EvaluationResultIdentifier.EvaluationResultQualifier.ConfigRuleName
      tag: rename_EvaluationResultIdentifier_EvaluationResultQualifier_ConfigRuleName_08232dc5
      target_field: aws.config.evaluation_result_identifier.evaluation_result_qualifier.config_rule_name
      ignore_missing: true
  - rename:
      field: json.EvaluationResultIdentifier.EvaluationResultQualifier.EvaluationMode
      tag: rename_EvaluationResultIdentifier_EvaluationResultQualifier_EvaluationMode_a8dfbe21
      target_field: aws.config.evaluation_result_identifier.evaluation_result_qualifier.evaluation_mode
      ignore_missing: true
  - date:
      field: json.EvaluationResultIdentifier.OrderingTimestamp
      tag: date_EvaluationResultIdentifier_OrderingTimestamp_384791f6
      target_field: aws.config.evaluation_result_identifier.ordering_timestamp
      formats:
        - UNIX_MS
        - UNIX
      if: ctx.json?.EvaluationResultIdentifier?.OrderingTimestamp != null && ctx.json.EvaluationResultIdentifier.OrderingTimestamp != ''
      on_failure:
        - append:
            tag: append_error_message_6f824f1c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.created
      tag: set_event_created_from_config_evaluation_result_identifier_ordering_timestamp_320b3767
      copy_from: aws.config.evaluation_result_identifier.ordering_timestamp
      ignore_empty_value: true
  - rename:
      field: json.EvaluationResultIdentifier.ResourceEvaluationId
      tag: rename_EvaluationResultIdentifier_ResourceEvaluationId_721960e6
      target_field: aws.config.evaluation_result_identifier.resource_evaluation_id
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_config_evaluation_result_identifier_resource_evaluation_id_98c9b346
      copy_from: aws.config.evaluation_result_identifier.resource_evaluation_id
      ignore_empty_value: true
  - date:
      field: json.ResultRecordedTime
      tag: date_ResultRecordedTime_42e5fe02
      target_field: aws.config.result_recorded_time
      formats:
        - UNIX_MS
        - UNIX
      if: ctx.json?.ResultRecordedTime != null && ctx.json.ResultRecordedTime != ''
      on_failure:
        - append:
            tag: append_error_message_8f8c1e7b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.ResultToken
      tag: rename_ResultToken_dd8fd268
      target_field: aws.config.result_token
      ignore_missing: true
  - rename:
      field: json.EvaluationResultIdentifier.EvaluationResultQualifier.ResourceId
      tag: rename_EvaluationResultIdentifier_EvaluationResultQualifier_ResourceId_37948526
      target_field: aws.config.evaluation_result_identifier.evaluation_result_qualifier.resource_id
      ignore_missing: true
  - set:
      field: resource.id
      tag: set_resource_id_from_config_evaluation_result_identifier_evaluation_result_qualifier_resource_id_6a6eb018
      copy_from: aws.config.evaluation_result_identifier.evaluation_result_qualifier.resource_id
      ignore_empty_value: true
  - rename:
      field: json.EvaluationResultIdentifier.EvaluationResultQualifier.ResourceType
      tag: rename_EvaluationResultIdentifier_EvaluationResultQualifier_ResourceType_2e8e93e7
      target_field: aws.config.evaluation_result_identifier.evaluation_result_qualifier.resource_type
      ignore_missing: true
  - set:
      field: resource.type
      tag: set_resource_type_from_config_evaluation_result_identifier_evaluation_result_qualifier_resource_type_8d57cf4f
      copy_from: aws.config.evaluation_result_identifier.evaluation_result_qualifier.resource_type
      ignore_empty_value: true
  - rename:
      field: json.ComplianceType
      tag: rename_ComplianceType_4e8a2519
      target_field: aws.config.compliance_type
      ignore_missing: true
  - script:
      tag: set_event_outcome_and_result_evaluation_from_aws_config_compliance_type_ef75e274
      lang: painless
      description: set event.outcome and result.evaluation from compliance_type
      if: ctx.aws?.config?.compliance_type instanceof String
      source: >-
        if (ctx.aws.config.compliance_type == 'NON_COMPLIANT') {
          ctx.event.outcome = 'failure';
        } else if (ctx.aws.config.compliance_type == 'COMPLIANT') {
          ctx.event.outcome = 'success';
        } else {
          ctx.event.outcome = 'unknown';
        }
  - set:
      field: result.evaluation
      tag: set_result_evaluation_passed_2306a127
      value: passed
      if: ctx.aws?.config?.compliance_type == 'COMPLIANT'
      ignore_empty_value: true
  - set:
      field: result.evaluation
      tag: set_result_evaluation_failed_585be7fe
      value: failed
      if: ctx.aws?.config?.compliance_type == 'NON_COMPLIANT'
      ignore_empty_value: true
  - set:
      field: result.evaluation
      tag: set_result_evaluation_unknown_e79c5a26
      value: unknown
      if: ctx.result?.evaluation == null
      ignore_empty_value: true
  - rename:
      field: json.ConfigRuleInfo.Scope.TagValue
      tag: rename_ConfigRuleInfo_Scope_TagValue_14b291e3
      target_field: aws.config.rule_info.scope.tag_value
      ignore_missing: true
  - set:
      field: rule.tags
      tag: set_rule_tags_from_config_config_rule_info_scope_tag_value_2b0521ae
      copy_from: aws.config.rule_info.scope.tag_value
      ignore_empty_value: true
  - remove:
      field:
        - aws.config.evaluation_result_identifier.ordering_timestamp
        - aws.config.evaluation_result_identifier.resource_evaluation_id
        - aws.config.rule_info.config_rule_arn
        - aws.config.rule_info.config_rule_id
        - aws.config.rule_info.config_rule_name
        - aws.config.rule_info.description
      tag: remove_custom_duplicate_fields_3621bf9d
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      description: This script processor iterates over the whole document to remove fields with null values.
      tag: script_to_drop_null_values_47584e1d
      lang: painless
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_14080786
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}' failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
