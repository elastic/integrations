---
description: "Pipeline for DynamoDB metrics"

processors:
  - dot_expander:
      tag: dot_expander_*_c2762c23
      field: "*"
      ignore_failure: true
  - set:
      tag: set_cloud_account_name_20733914
      field: cloud.account.name
      copy_from: cloud.account.id
      override: false
      ignore_empty_value: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_14080786
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}' failed with message '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
