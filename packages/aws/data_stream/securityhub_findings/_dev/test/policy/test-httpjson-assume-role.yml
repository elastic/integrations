vars:
  access_key_id: FAKE_AWS_ACCESS_KEY_ID_FOR_TESTS_ONLY
  secret_access_key: FAKE_AWS_SECRET_ACCESS_KEY_FOR_TESTS_ONLY
  role_arn: arn:aws:iam::123456789012:role/SecurityHubReader
  external_id: FAKE_EXTERNAL_ID_FOR_TESTS_ONLY
  assume_role_duration: 1h
  assume_role_expiry_window: 5m
  default_region: us-east-1
data_stream:
  vars:
    enable_request_tracer: true
    interval: 1h
    initial_interval: 48h
    max_executions: 5000
    aws_region: us-east-1
    tld: amazonaws.com
    filters: |
      SeverityLabel:
        - Comparison: EQUALS
          Value: CRITICAL
    preserve_original_event: true
    preserve_duplicate_custom_fields: true
    tags:
      - forwarded
      - aws_securityhub_findings
      - test-policy
