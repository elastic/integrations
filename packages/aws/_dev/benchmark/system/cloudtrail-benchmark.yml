---
description: Benchmark 1000 aws.cloudtrail events ingested
input: aws-s3
deployer: tf
policy_template: cloudtrail
wait_for_data_timeout: 20m
warmup_time_period: 2s
data_stream:
  name: cloudtrail
  vars:
    queue_url: "{{TF_OUTPUT_queue_url}}"
    preserve_original_event: true
    actor_target_mapping: true
    # Credentials go through `custom` rather than a top-level `vars:` block.
    # access_key_id / secret_access_key / session_token are PACKAGE-level vars
    # (aws/manifest.yml), but the benchmark runner assigns the scenario's
    # top-level `vars:` to the INPUT level, where they are not declared. Fleet
    # then rejects the policy with:
    #   Variable cloudtrail-aws-s3:access_key_id not found
    # `custom` is a stream-level yaml var injected verbatim into the input config
    # (aws-s3.yml.hbs:110-112), so it bypasses Fleet var validation.
    custom: |
      access_key_id: {{AWS_ACCESS_KEY_ID}}
      secret_access_key: {{AWS_SECRET_ACCESS_KEY}}
      session_token: {{AWS_SESSION_TOKEN}}
      region: us-east-1
corpora:
  # Required to make the runner deploy anything from deploy/tf/ at all. Without this
  # block no service is provisioned, so {{TF_OUTPUT_queue_url}} resolves to "" and
  # the agent polls nothing. The name matches the service key in deploy/tf/env.yml.
  input_service:
    name: terraform
  # NOTE: the generated corpus does NOT reach Elasticsearch for this benchmark.
  # elastic-package cannot inject a generated corpus into a Terraform-managed S3
  # bucket (elastic-package#3452), so the data actually ingested comes from the
  # static file at deploy/tf/files/cloudtrail-corpus.log, uploaded `object_count`
  # times by deploy/tf/main.tf. Real volume = corpus lines x object_count
  # (1000 x 1 = 1000 with the committed defaults).
  #
  # This block is present because `elastic-package check` rejects a `corpora`
  # section without it ("field corpora: generator is required"). total_events is
  # set to match what the static corpus delivers so the reported parameter is not
  # misleading. To change volume, edit the corpus file or var.object_count.
  generator:
    total_events: 1000
    template:
      path: ./cloudtrail-benchmark/template.ndjson
      type: gotext
    config:
      path: ./cloudtrail-benchmark/config.yml
    fields:
      path: ./cloudtrail-benchmark/fields.yml
