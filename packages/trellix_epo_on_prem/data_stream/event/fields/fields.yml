- name: trellix_epo_on_prem
  type: group
  fields:
    - name: event
      type: group
      fields:
        - name: original
          type: keyword
          description: The decoded JSON representation of the raw Trellix ePO syslog event. Only stored when the "Preserve decoded event" toggle is enabled.
        - name: epo_event
          type: group
          fields:
            - name: api_name
              type: keyword
            - name: access_requested
              type: keyword
            - name: action_id
              type: keyword
            - name: agent_guid
              type: keyword
            - name: analyzer
              type: keyword
            - name: analyzer_dat_version
              type: keyword
            - name: analyzer_detection_method
              type: keyword
            - name: analyzer_engine_version
              type: keyword
            - name: analyzer_gti_query
              type: boolean
            - name: analyzer_name
              type: keyword
              description: Name of the product that detected the threat.
            - name: analyzer_version
              type: keyword
              description: Version of the detecting product.
            - name: attack_vector_type
              type: keyword
            - name: bad_link_rating_id
              type: keyword
            - name: blade_name
              type: keyword
            - name: cleanable
              type: boolean
            - name: content_func_group
              type: keyword
            - name: content_name
              type: keyword
            - name: content_risk_group
              type: keyword
            - name: count
              type: long
            - name: dat_version
              type: keyword
            - name: detected_utc
              type: date
              description: Detection time in UTC.
            - name: received_utc
              type: date
              description: Time the event was received by the ePO server.
            - name: detection_method
              type: keyword
            - name: direction
              type: keyword
            - name: download_rating_id
              type: keyword
            - name: duration_before_detection
              type: long
            - name: event_type
              type: keyword
            - name: exploit_rating_id
              type: keyword
            - name: files
              type: keyword
            - name: first_action_status
              type: boolean
            - name: first_attempted_action
              type: keyword
            - name: hostname
              type: keyword
            - name: list_id
              type: keyword
            - name: list_type
              type: keyword
            - name: machine_info
              type: group
              fields:
                - name: agent_guid
                  type: keyword
                - name: time_zone_bias
                  type: long
            - name: observer_mode
              type: keyword
            - name: phishing_rating_id
              type: keyword
            - name: popup_rating_id
              type: keyword
            - name: priority
              type: long
            - name: product_family
              type: keyword
            - name: rating
              type: keyword
            - name: reason_id
              type: keyword
            - name: reason_type
              type: keyword
            - name: registry_value
              type: keyword
            - name: second_action_status
              type: boolean
            - name: second_attempted_action
              type: keyword
            - name: server_id
              type: keyword
            - name: signature_name
              type: keyword
            - name: site_name
              type: keyword
            - name: software_info
              type: group
              fields:
                - name: common_fields
                  type: group
                  fields:
                    - name: analyzer
                      type: keyword
                    - name: analyzer_dat_version
                      type: keyword
                    - name: analyzer_detection_method
                      type: keyword
                    - name: analyzer_engine_version
                      type: keyword
                    - name: analyzer_name
                      type: keyword
                      description: Name of the product that detected the threat.
                    - name: analyzer_version
                      type: keyword
                      description: Version of the detecting product.
                - name: event
                  type: group
                  fields:
                    - name: common_fields
                      type: group
                      fields:
                        - name: detected_utc
                          type: date
                          description: Detection time in UTC.
                        - name: threat_event_id
                          type: keyword
                        - name: threat_handled
                          type: boolean
                        - name: threat_severity
                          type: long
                          description: Severity level of the threat.
                        - name: threat_type
                          type: keyword
                          description: Type of threat (for example, virus, trojan, or PUP).
                    - name: custom_fields
                      type: group
                      fields:
                        - name: analyzer_content_creation_date
                          type: date
                        - name: blade_name
                          type: keyword
                        - name: threat_detected_on_creation
                          type: boolean
                        - name: target
                          type: keyword
                    - name: gmt_time
                      type: date
                    - name: severity
                      type: long
                - name: product_family
                  type: keyword
                - name: product_name
                  type: keyword
                - name: product_version
                  type: keyword
            - name: source_file_size
              type: long
              unit: byte
            - name: source_process_name
              type: keyword
            - name: spam_rating_id
              type: keyword
            - name: success
              type: boolean
            - name: tvd_severity
              type: long
            - name: target_name
              type: keyword
            - name: target_path
              type: keyword
            - name: task_name
              type: keyword
            - name: threat_detected_on_creation
              type: boolean
            - name: threat_handled
              type: boolean
            - name: threat_severity
              type: long
              description: Severity level of the threat.
            - name: threat_type
              type: keyword
              description: Type of threat (for example, virus, trojan, or PUP).
            - name: usb_serial_number
              type: keyword
            - name: vendor
              type: keyword
            - name: version
              type: keyword
            - name: detection_time
              type: date
            - name: jti_object_type
              type: keyword
            - name: jti_reputation
              type: keyword
            - name: local_reputation
              type: keyword
            - name: new_reputations
              type: group
              fields:
                - name: trust_level
                  type: keyword
            - name: old_reputations
              type: group
              fields:
                - name: trust_level
                  type: keyword
            - name: remediation_action
              type: keyword
            - name: siem_last_time
              type: date
            - name: wp_rating
              type: keyword
