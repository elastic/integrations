---
description: Parse Trellix ePO On-Premises event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.4.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
      description: Renames the original `message` field to `event.original`.
  - json:
      field: event.original
      tag: json_event_original
      target_field: trellix_epo_on_prem.event
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required when `event.original` exists.
  - set:
      field: event.kind
      tag: set_event_kind_event
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value:
        - intrusion_detection
        - web
        - file
        - malware
        - host
        - authentication
  - append:
      field: event.type
      tag: append_event_type
      value:
        - info
        - start
  - script:
      lang: painless
      tag: normalize_mac_addresses
      description: Normalize 12-hex MAC strings to hyphen-separated uppercase format.
      if: ctx.trellix_epo_on_prem?.event?.EPOEvent != null
      source: |-
        String normalizeMac(def val) {
          if (val == null) { return null; }
          String mac = val.toString().replace('-', '').replace(':', '').toUpperCase();
          if (mac.length() != 12) { return val.toString(); }
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < 12; i += 2) {
            if (i > 0) { sb.append('-'); }
            sb.append(mac.substring(i, i + 2));
          }
          return sb.toString();
        }
        def epo = ctx.trellix_epo_on_prem.event.EPOEvent;
        for (def f : ['SourceMAC', 'TargetMAC', 'AnalyzerMAC']) {
          if (epo.containsKey(f) && epo[f] != null) {
            epo[f] = normalizeMac(epo[f]);
          }
        }
        if (epo.MachineInfo != null && epo.MachineInfo instanceof Map && epo.MachineInfo.RawMACAddress != null) {
          epo.MachineInfo.RawMACAddress = normalizeMac(epo.MachineInfo.RawMACAddress);
        }
  - convert:
      field: trellix_epo_on_prem.event.EPOEvent.AnalyzerIPv4
      tag: convert_analyzer_ipv4_to_ip
      type: ip
      if: ctx.trellix_epo_on_prem?.event?.EPOEvent?.AnalyzerIPv4 != ''
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.event.EPOEvent.AnalyzerIPv4
            tag: remove_analyzer_ipv4_on_convert_failure
            ignore_missing: true
        - append:
            field: error.message
            tag: append_analyzer_ipv4_convert_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
