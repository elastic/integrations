title: Audit Logs
type: logs
streams:
  - input: cel
    title: Trellix ePO On-Prem Audit Logs
    description: Collect audit logs with CEL input.
    enabled: false
    template_path: cel.yml.hbs
    vars:
      - name: initial_interval
        type: text
        title: Initial Interval
        description: How far back to pull the logs from the audit API. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 24h
        secret: false
      - name: interval
        type: text
        title: Interval
        description: Duration between requests to the Trellix ePO audit log API. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 24h
        secret: false
      - name: tz_offset
        type: text
        title: Timezone Offset
        description: >-
          Use this parameter to adjust the timezone offset when importing logs from a host in a different timezone so that datetimes in cursor used for interval calls are appropriately interpreted.
          Accepts an HH:mm offset such as "+05:30" or "-08:00".
        multi: false
        required: true
        show_user: true
        secret: false
        default: "+5:30"
      - name: max_executions
        type: integer
        title: Maximum Pages Per Interval
        description: Maximum number of pages collected per polling interval. Must be greater than zero.
        default: 1000
        multi: false
        required: false
        show_user: false
      - name: page_size
        type: integer
        title: Page Size
        description: Number of audit records fetched per API request.
        multi: false
        required: true
        show_user: false
        default: 500
        secret: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 60s
        secret: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
        multi: false
        required: false
        show_user: false
        default: false
        secret: false
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
        secret: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - trellix_epo_on_prem-audit
        secret: false
      - name: processors
        type: yaml
        title: Processors
        description: Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        multi: false
        required: false
        show_user: false
        secret: false
