---
description: Parse Trellix ePO on-prem threat event records.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 9.4.0
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original message field to event.original.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The message field is no longer required if the document has an event.original field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  - dot_expander:
      field: '*'
      path: json
      tag: dot_expander_json
      if: ctx.json != null
  - rename:
      field: json.EPOEvents
      target_field: trellix_epo_on_prem.threat_event.EPOEvents
      ignore_missing: true
      tag: rename_epoevents_to_vendor_namespace
      if: ctx.json?.EPOEvents != null
  - rename:
      field: json.EPExtendedEvent
      target_field: trellix_epo_on_prem.threat_event.EPExtendedEvent
      ignore_missing: true
      tag: rename_epextendedevent_to_vendor_namespace
      if: ctx.json?.EPExtendedEvent != null
  - fingerprint:
      fields:
        - trellix_epo_on_prem.threat_event.EPOEvents.AutoGUID
      target_field: _id
      ignore_missing: true
      tag: fingerprint_AutoGUID
  - set:
      field: event.kind
      tag: set_event_kind_alert
      value: alert
  - append:
      field: event.category
      tag: append_event_category
      value: intrusion_detection
  - append:
      field: event.type
      tag: append_event_type
      value: info
  - convert:
      field: trellix_epo_on_prem.threat_event.EPOEvents.ThreatHandled
      type: boolean
      ignore_missing: true
      tag: convert_threat_handled
      if: ctx.trellix_epo_on_prem?.threat_event?.EPOEvents?.ThreatHandled != ''
      on_failure:
        - append:
            field: error.message
            tag: append_local_failure_message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            field: trellix_epo_on_prem.threat_event.EPOEvents.ThreatHandled
            ignore_missing: true
            tag: remove_convert_threat_handled_on_failure
  - convert:
      field: trellix_epo_on_prem.threat_event.EPExtendedEvent.AnalyzerGTIQuery
      type: boolean
      ignore_missing: true
      tag: convert_analyzer_gti_query
      if: ctx.trellix_epo_on_prem?.threat_event?.EPExtendedEvent?.AnalyzerGTIQuery != ''
      on_failure:
        - append:
            field: error.message
            tag: append_local_failure_message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
