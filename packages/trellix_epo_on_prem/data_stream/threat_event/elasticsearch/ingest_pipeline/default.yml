  - script:
      lang: painless
      tag: normalize_signed_ipv4_addresses
      description: Decode signed database IPv4 integers to dotted-decimal strings for vendor and ECS fields.
      source: |
        String formatIpv4(long unsigned) {
          return ((unsigned >> 24) & 0xFF) + '.' + ((unsigned >> 16) & 0xFF) + '.' + ((unsigned >> 8) & 0xFF) + '.' + (unsigned & 0xFF);
        }
        boolean isDottedIpv4(String s) {
          String[] parts = s.splitOnToken('.');
          if (parts.length != 4) {
            return false;
          }
          for (String part : parts) {
            if (part.isEmpty() || part.length() > 3) {
              return false;
            }
            for (int i = 0; i < part.length(); i++) {
              if (!Character.isDigit(part.charAt(i))) {
                return false;
              }
            }
            if (Integer.parseInt(part) > 255) {
              return false;
            }
          }
          return true;
        }
        String normalizeIpv4(def value) {
          if (value == null) {
            return null;
          }
          // ePO stores IPv4 columns as signed 32-bit integers; shift into the
          // unsigned range and render dotted-decimal.
          if (value instanceof Number) {
            long unsigned = (((Number) value).longValue() + 2147483648L) & 0xFFFFFFFFL;
            return formatIpv4(unsigned);
          }
          // Defensive: some deployments/columns may already hand back a dotted
          // literal. Keep it as-is; reject anything else.
          String s = value.toString();
          if (isDottedIpv4(s)) {
            return s;
          }
          return null;
        }
        if (ctx.trellix_epo_on_prem?.threat_event?.epo_events != null) {
          def epo = ctx.trellix_epo_on_prem.threat_event.epo_events;
          def encodedFields = ['analyzer_ipv4', 'source_ipv4', 'target_ipv4'];
          boolean decodeFailed = false;
          for (String name : encodedFields) {
            if (epo.get(name) == null) {
              continue;
            }
            String decoded = normalizeIpv4(epo.get(name));
            if (decoded != null) {
              epo.put(name, decoded);
            } else {
              // Neither a decodable signed integer nor an IPv4 literal. Remove it
              // instead of leaving the raw value in place: these columns feed the
              // strictly typed source.ip / destination.ip / host.ip / related.ip
              // fields, and a non-IP string there fails mapping at index time and
              // rejects the whole document. Flag the drop so it is visible rather
              // than silent.
              epo.remove(name);
              decodeFailed = true;
            }
          }
          if (decodeFailed) {
            if (ctx.tags == null) {
              ctx.tags = [];
            }
            if (!ctx.tags.contains('_ipv4_decode_failure')) {
              ctx.tags.add('_ipv4_decode_failure');
            }
          }
        }
      on_failure:
        - append:
            field: error.message
            tag: append_local_failure_message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: host.ip
      value: '{{{trellix_epo_on_prem.threat_event.epo_events.analyzer_ipv4}}}'
      allow_duplicates: false
      if: ctx.trellix_epo_on_prem?.threat_event?.epo_events?.analyzer_ipv4 != null
      tag: append_host_ip_analyzer_ipv4
  - append:
      field: host.ip
      value: '{{{trellix_epo_on_prem.threat_event.epo_events.analyzer_ipv6}}}'
      allow_duplicates: false
      if: ctx.trellix_epo_on_prem?.threat_event?.epo_events?.analyzer_ipv6 != null
      tag: append_host_ip_analyzer_ipv6
  - append:
      field: observer.ip
      value: '{{{trellix_epo_on_prem.threat_event.epo_events.analyzer_ipv4}}}'
      allow_duplicates: false
      if: ctx.trellix_epo_on_prem?.threat_event?.epo_events?.analyzer_ipv4 != null
      tag: append_observer_ip_analyzer_ipv4
  - append:
