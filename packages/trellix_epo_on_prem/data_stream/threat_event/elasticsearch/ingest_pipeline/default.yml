      copy_from: trellix_epo_on_prem.threat_event.EPOEvents.AnalyzerName
      ignore_empty_value: true
      tag: set_observer_product
  - set:
      field: observer.version
      copy_from: trellix_epo_on_prem.threat_event.EPOEvents.AnalyzerVersion
      ignore_empty_value: true
      tag: set_observer_version
  - set:
      field: observer.hostname
      copy_from: trellix_epo_on_prem.threat_event.EPOEvents.AnalyzerHostName
      ignore_empty_value: true
      tag: set_observer_hostname
  - date:
      field: trellix_epo_on_prem.threat_event.EPOEvents.DetectedUTC
      target_field: trellix_epo_on_prem.threat_event.EPOEvents.DetectedUTC
