  - script:
      lang: painless
      tag: normalize_signed_ipv4_addresses
      description: Decode signed database IPv4 integers to dotted-decimal strings for vendor and ECS fields.
      source: |
        String formatIpv4(long unsigned) {
          return ((unsigned >> 24) & 0xFF) + '.' + ((unsigned >> 16) & 0xFF) + '.' + ((unsigned >> 8) & 0xFF) + '.' + (unsigned & 0xFF);
        }
        String decodeSignedIpv4(def value) {
          if (value == null) return null;
          long encoded = ((Number) value).longValue();
          long unsigned = (encoded + 2147483648L) & 0xFFFFFFFFL;
          return formatIpv4(unsigned);
        }
        if (ctx.trellix_epo_on_prem != null && ctx.trellix_epo_on_prem.threat_event != null && ctx.trellix_epo_on_prem.threat_event.EPOEvents != null) {
          def epo = ctx.trellix_epo_on_prem.threat_event.EPOEvents;
          if (epo.AnalyzerIPV4 != null) {
            epo.AnalyzerIPV4 = decodeSignedIpv4(epo.AnalyzerIPV4);
          }
          if (epo.SourceIPV4 != null) {
            epo.SourceIPV4 = decodeSignedIpv4(epo.SourceIPV4);
          }
          if (epo.TargetIPV4 != null) {
            epo.TargetIPV4 = decodeSignedIpv4(epo.TargetIPV4);
          }
        }
