---
description: Parse Trellix ePO on-prem threat event records.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 9.4.0
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original message field to event.original.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The message field is no longer required if the document has an event.original field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  - dot_expander:
      field: '*'
      path: json
      tag: dot_expander_json
      if: ctx.json != null
  - rename:
      field: json.EPOEvents
      target_field: trellix_epo_on_prem.threat_event.EPOEvents
      ignore_missing: true
      tag: rename_epo_events_to_vendor_namespace
      if: ctx.json?.EPOEvents != null
  - rename:
      field: json.EPExtendedEvent
      target_field: trellix_epo_on_prem.threat_event.EPExtendedEvent
      ignore_missing: true
      tag: rename_epextendedevent_to_vendor_namespace
      if: ctx.json?.EPExtendedEvent != null
  - script:
      description: >
        Convert field names from camelCase to snake_case recursively.
      tag: script_convert_camelcase_to_snake_case
      lang: painless
      source: |-
        String camelToSnake(String str) {
            def result = "";
            for (int i = 0; i < str.length(); i++) {
                char c = str.charAt(i);
                if (Character.isUpperCase(c)) {
                    if (i > 0 && str.charAt(i - 1) != (char) '_'
                        && (!Character.isUpperCase(str.charAt(i - 1))
                        || (i + 1 < str.length() && Character.isLowerCase(str.charAt(i + 1))))) {
                        result += "_";
                    }
                    result += Character.toLowerCase(c);
                } else {
                    result += c;
                }
            }
            return result;
        }
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              String newKey = camelToSnake(entry.getKey());
              newObj[newKey] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        if (ctx.trellix_epo_on_prem?.threat_event != null) {
          ctx.trellix_epo_on_prem.threat_event = convertToSnakeCase(ctx.trellix_epo_on_prem.threat_event);
        }
      on_failure:
        - append:
            tag: append_script_convert_camelcase_to_snake_case_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - trellix_epo_on_prem.threat_event.epo_events.auto_guid
      target_field: _id
      ignore_missing: true
      tag: fingerprint_AutoGUID
  - set:
      field: event.kind
      tag: set_event_kind_alert
      value: alert
  - convert:
      field: trellix_epo_on_prem.threat_event.epo_events.threat_handled
