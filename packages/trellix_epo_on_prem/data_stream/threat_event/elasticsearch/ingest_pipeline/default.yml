      lang: painless
      tag: normalize_mac_addresses
      description: Normalize compact 12-hex-character vendor MAC values to RFC 7042 uppercase hyphen notation.
      source: |
        String normalizeMac(String mac) {
          if (mac == null || mac.length() != 12) return mac;
          StringBuilder hex = new StringBuilder();
          for (int i = 0; i < 12; i++) {
            int ci = (int) mac.charAt(i);
            if (ci >= 48 && ci <= 57) {
              hex.append((char) ci);
            } else if (ci >= 65 && ci <= 70) {
              hex.append((char) ci);
            } else if (ci >= 97 && ci <= 102) {
              hex.append(Character.toUpperCase((char) ci));
            } else {
              return mac;
            }
          }
          String hexStr = hex.toString();
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < 12; i += 2) {
            if (i > 0) sb.append('-');
            sb.append(hexStr.substring(i, i + 2));
          }
          return sb.toString();
        }
        if (ctx.trellix_epo_on_prem == null || ctx.trellix_epo_on_prem.threat_event == null || ctx.trellix_epo_on_prem.threat_event.epo_events == null) return;
        def epo = ctx.trellix_epo_on_prem.threat_event.epo_events;
        // normalizeMac takes a String, so a non-string vendor value would throw
        // ClassCastException and divert the whole document to the pipeline handler.
        if (epo.analyzer_mac instanceof String) {
          epo.analyzer_mac = normalizeMac(epo.analyzer_mac);
        }
        if (epo.source_mac instanceof String) {
          epo.source_mac = normalizeMac(epo.source_mac);
        }
