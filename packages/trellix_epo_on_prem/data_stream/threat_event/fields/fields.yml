- name: trellix_epo_on_prem
  type: group
  fields:
    - name: threat_event
      type: group
      fields:
        - name: epextended_event
          type: group
          fields:
            - name: amcore_content_version
              type: keyword
              description: 'AM Core Content Version value recorded in the extended threat-event details.'
            - name: apiname
              type: keyword
              description: 'API Name value recorded in the extended threat-event details.'
            - name: access_requested
              type: keyword
              description: 'Access Requested value recorded in the extended threat-event details.'
            - name: analyzer_content_creation_date
              type: date
              description: 'Analyzer Content Creation Date value recorded in the extended threat-event details.'
            - name: analyzer_gtiquery
              type: boolean
              description: 'Analyzer GTI Query value recorded in the extended threat-event details.'
            - name: analyzer_reg_info
              type: keyword
              description: 'Analyzer Reg Info value recorded in the extended threat-event details.'
            - name: analyzer_technology_version
              type: keyword
              description: 'Analyzer Technology Version value recorded in the extended threat-event details.'
            - name: attack_vector_type
              type: keyword
              description: 'Attack Vector Type value recorded in the extended threat-event details.'
            - name: blade_name
              type: keyword
              description: 'Blade Name value recorded in the extended threat-event details.'
            - name: cleanable
              type: boolean
              description: 'Cleanable value recorded in the extended threat-event details.'
            - name: direction
              type: keyword
              description: 'Direction value recorded in the extended threat-event details.'
            - name: duration_before_detection
              type: long
              description: 'Duration Before Detection value recorded in the extended threat-event details.'
            - name: event_auto_id
              type: keyword
              description: 'Event Auto ID value recorded in the extended threat-event details.'
            - name: first_action_status
              type: boolean
              description: 'First Action Status value recorded in the extended threat-event details.'
            - name: first_attempted_action
              type: keyword
              description: 'First Attempted Action value recorded in the extended threat-event details.'
            - name: location
              type: keyword
              description: 'Location value recorded in the extended threat-event details.'
            - name: second_action_status
              type: boolean
              description: 'Second Action Status value recorded in the extended threat-event details.'
            - name: second_attempted_action
              type: keyword
              description: 'Second Attempted Action value recorded in the extended threat-event details.'
            - name: source_description
              type: keyword
              description: 'Source Description value recorded in the extended threat-event details.'
            - name: source_device_pid
              type: keyword
              description: 'Source Device PID value recorded in the extended threat-event details.'
            - name: source_device_serial_number
              type: keyword
              description: 'Source Device Serial Number value recorded in the extended threat-event details.'
            - name: source_device_vid
              type: keyword
              description: 'Source Device VID value recorded in the extended threat-event details.'
            - name: source_hash
              type: keyword
              description: 'Source Hash value recorded in the extended threat-event details.'
            - name: source_share_name
              type: keyword
              description: 'Source Share Name value recorded in the extended threat-event details.'
            - name: source_urlrating_code
              type: keyword
              description: 'Source URL Rating Code value recorded in the extended threat-event details.'
            - name: source_urlweb_category
              type: keyword
              description: 'Source URL Web Category value recorded in the extended threat-event details.'
            - name: target_create_time
              type: date
              description: 'Target Create Time value recorded in the extended threat-event details.'
            - name: target_description
              type: keyword
              description: 'Target Description value recorded in the extended threat-event details.'
            - name: target_device_display_name
              type: keyword
              description: 'Target Device Display Name value recorded in the extended threat-event details.'
            - name: target_device_pid
              type: keyword
              description: 'Target Device PID value recorded in the extended threat-event details.'
            - name: target_device_serial_number
              type: keyword
              description: 'Target Device Serial Number value recorded in the extended threat-event details.'
            - name: target_device_vid
              type: keyword
              description: 'Target Device VID value recorded in the extended threat-event details.'
            - name: target_modify_time
              type: date
              description: 'Target Modify Time value recorded in the extended threat-event details.'
            - name: target_parent_process_hash
              type: keyword
              description: 'Target Parent Process Hash value recorded in the extended threat-event details.'
            - name: target_parent_process_name
              type: keyword
              description: 'Target Parent Process Name value recorded in the extended threat-event details.'
            - name: target_parent_process_signed
              type: boolean
              description: 'Target Parent Process Signed value recorded in the extended threat-event details.'
            - name: target_parent_process_signer
              type: keyword
              description: 'Target Parent Process Signer value recorded in the extended threat-event details.'
            - name: target_share_name
              type: keyword
              description: 'Target Share Name value recorded in the extended threat-event details.'
            - name: target_url
              type: keyword
              description: 'Target URL value recorded in the extended threat-event details.'
            - name: task_name
              type: keyword
              description: 'Task Name value recorded in the extended threat-event details.'
            - name: threat_detected_on_creation
              type: boolean
              description: 'Threat Detected On Creation value recorded in the extended threat-event details.'
            - name: threat_impact
              type: keyword
              description: 'Threat Impact value recorded in the extended threat-event details.'
            - name: topic
              type: keyword
              description: 'Topic value recorded in the extended threat-event details.'
        - name: epoevents
          type: group
          fields:
            - name: agent_guid
              type: keyword
              description: 'Agent GUID value recorded in the ePO threat event.'
            - name: analyzer
              type: keyword
              description: 'Analyzer value recorded in the ePO threat event.'
            - name: analyzer_datversion
              type: keyword
              description: 'Analyzer DAT Version value recorded in the ePO threat event.'
            - name: analyzer_engine_version
              type: keyword
              description: 'Analyzer Engine Version value recorded in the ePO threat event.'
            - name: detected_utc
              type: date
              description: 'Detection time recorded in the ePO threat event.'
            - name: event_time_local
              type: date
              description: 'Event Time Local value recorded in the ePO threat event.'
            - name: server_id
              type: keyword
              description: 'Server ID value recorded in the ePO threat event.'
            - name: source_host_name
              type: keyword
              description: 'Source Host Name value recorded in the ePO threat event.'
            - name: source_url
              type: keyword
              description: 'Source URL value recorded in the ePO threat event.'
            - name: target_process_name
              type: keyword
              description: 'Target Process Name value recorded in the ePO threat event.'
            - name: tenant_id
              type: keyword
              description: 'Tenant ID value recorded in the ePO threat event.'
            - name: threat_action_taken
              type: keyword
              description: 'Threat Action Taken value recorded in the ePO threat event.'
            - name: threat_category
              type: keyword
              description: 'Trellix threat-category identifier used to classify the event variant.'
            - name: threat_handled
              type: boolean
              description: 'Threat Handled value recorded in the ePO threat event.'
            - name: threat_type
              type: keyword
              description: 'Trellix threat-type identifier used as the primary event variant discriminator.'
