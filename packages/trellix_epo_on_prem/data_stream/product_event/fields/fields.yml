- name: trellix_epo_on_prem
  type: group
  fields:
    - name: product_event
      type: group
      fields:
        - name: epo_product_events
          type: group
          fields:
            - name: agent_guid
              type: keyword
              description: >-
                GUID of the Trellix Agent installation that reported the event. This identifies the agent instance rather than the endpoint, so it is not mapped to an ECS host or agent identifier.
            - name: extra_dat_names
              type: keyword
              description: Additional DAT names associated with the endpoint product event.
            - name: initiator_id
              type: keyword
              description: Source identifier describing what initiated the product operation.
            - name: initiator_type
              type: keyword
              description: Source classification of the product-operation initiator.
            - name: locale
              type: keyword
              description: Locale identifier associated with the product event.
            - name: node_id
              type: keyword
              description: ePO node identifier associated with the endpoint.
            - name: site_name
              type: keyword
              description: ePO site name associated with the product event.
            - name: sp_hot_fix
              type: keyword
              description: Service-pack hotfix value associated with the product event.
            - name: tenant_id
              type: keyword
              description: Tenant identifier associated with the product event.
            - name: type
              type: keyword
              description: >-
                Trellix ePO operation class for the product event, such as Install, Uninstall, Update, AMCore, Policy Enforcement, or Property Collection. Refines the event-code categorization but is not itself an enumerated set.
