- name: trellix_epo_on_prem
  type: group
  fields:
    - name: product_event
      type: group
      fields:
        - name: epo_product_events
          type: group
          fields:
            - name: extra_dat_names
              type: keyword
              description: Additional DAT names associated with the endpoint product event.
            - name: initiator_id
              type: keyword
              description: Source identifier describing what initiated the product operation.
            - name: initiator_type
              type: keyword
              description: Source classification of the product-operation initiator.
            - name: locale
              type: long
              description: Numeric locale identifier associated with the product event.
            - name: node_id
              type: long
              description: Numeric ePO node identifier associated with the endpoint.
            - name: site_name
              type: keyword
              description: ePO site name associated with the product event.
            - name: sp_hot_fix
              type: keyword
              description: Service-pack hotfix value associated with the product event.
            - name: tenant_id
              type: long
              description: Numeric tenant identifier associated with the product event.
