---
description: Pipeline for processing product event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 9.4.0
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      tag: remove_agentless_tags
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      ignore_missing: true
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original
      if: ctx.event?.original == null
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message.
  - remove:
      field:
        - message
      tag: remove_message
      if: ctx.event?.original != null
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      field: event.original
      tag: json_event_original
      target_field: trellix_epo_on_prem.product_event
      if: ctx.event?.original != null
  - dot_expander:
      field: '*'
      tag: dot_expander_product_event
      path: trellix_epo_on_prem.product_event
      override: true
      if: ctx.trellix_epo_on_prem?.product_event instanceof Map
      description: Expands the dotted source field names into objects.
  - script:
      description: >
        Convert field names from camelCase to snake_case recursively.
      tag: script_convert_camelcase_to_snake_case
      lang: painless
      source: |-
        String camelToSnake(String str) {
            def result = "";
            for (int i = 0; i < str.length(); i++) {
                char c = str.charAt(i);
                if (Character.isUpperCase(c)) {
                    if (i > 0 && str.charAt(i - 1) != (char) '_'
                        && (!Character.isUpperCase(str.charAt(i - 1))
                        || (i + 1 < str.length() && Character.isLowerCase(str.charAt(i + 1))))) {
                        result += "_";
                    }
                    result += Character.toLowerCase(c);
                } else {
                    result += c;
                }
            }
            return result;
        }
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              String newKey = camelToSnake(entry.getKey());
              newObj[newKey] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        if (ctx.trellix_epo_on_prem?.product_event != null) {
          ctx.trellix_epo_on_prem.product_event = convertToSnakeCase(ctx.trellix_epo_on_prem.product_event);
        }
      on_failure:
        - append:
            tag: append_script_convert_camelcase_to_snake_case_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.auto_id
      tag: convert_EPOProductEvents_AutoID_to_string
      type: string
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_with_id
      fields:
        - trellix_epo_on_prem.product_event.epo_product_events.auto_id
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: entity.type
      tag: append_host_into_entity_type
      value: host
  - set:
      field: event.id
      tag: set_event_id_from_product_event_epo_product_events_auto_id
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.auto_id
      ignore_empty_value: true
  - date:
      field: trellix_epo_on_prem.product_event.epo_product_events.detected_utc
      tag: date_EPOProductEvents_DetectedUTC
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.detected_utc != null && ctx.trellix_epo_on_prem.product_event.epo_product_events.detected_utc != ''
      target_field: trellix_epo_on_prem.product_event.epo_product_events.detected_utc
      formats:
        - ISO8601
      on_failure:
        - remove:
            tag: remove_detected_utc_on_date_failure
            field: trellix_epo_on_prem.product_event.epo_product_events.detected_utc
            ignore_missing: true
        - append:
            tag: append_date_detected_utc_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_product_event_epo_product_events_detected_utc
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.detected_utc
      ignore_empty_value: true
  - date:
      field: trellix_epo_on_prem.product_event.epo_product_events.received_utc
      tag: date_EPOProductEvents_ReceivedUTC
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.received_utc != null && ctx.trellix_epo_on_prem.product_event.epo_product_events.received_utc != ''
      target_field: trellix_epo_on_prem.product_event.epo_product_events.received_utc
      formats:
        - ISO8601
      on_failure:
        - remove:
            tag: remove_received_utc_on_date_failure
            field: trellix_epo_on_prem.product_event.epo_product_events.received_utc
            ignore_missing: true
        - append:
            tag: append_date_received_utc_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.created
      tag: set_event_created_from_product_event_epo_product_events_received_utc
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.received_utc
      ignore_empty_value: true
  - set:
      field: event.outcome
      tag: set_event_outcome_success
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.error == 0
      value: success
  - set:
      field: event.outcome
      tag: set_event_outcome_failure
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.error != null && ctx.trellix_epo_on_prem.product_event.epo_product_events.error != 0
      value: failure
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.error
      tag: convert_EPOProductEvents_Error_to_string
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.error != null && ctx.trellix_epo_on_prem.product_event.epo_product_events.error != 0
      type: string
  - set:
      field: error.code
      tag: set_error_code_from_product_event_epo_product_events_error
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.error instanceof String
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.error
      ignore_empty_value: true
  - set:
      field: entity.name
      tag: set_entity_name_from_product_event_epo_product_events_host_name
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.host_name
      ignore_empty_value: true
  - set:
      field: host.name
      tag: set_host_name_from_product_event_epo_product_events_host_name
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.host_name
      ignore_empty_value: true
  - lowercase:
      field: host.name
      tag: lowercase_host_name
      ignore_missing: true
  - set:
      field: host.hostname
      tag: set_host_hostname_from_product_event_epo_product_events_host_name
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.host_name
      ignore_empty_value: true
  - append:
      field: related.hosts
      tag: append_product_event_epo_product_events_host_name_into_related_hosts
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.host_name != null
      value: '{{{trellix_epo_on_prem.product_event.epo_product_events.host_name}}}'
      allow_duplicates: false
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.ipv6
      tag: convert_EPOProductEvents_IPV6_to_ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ipv6_on_convert_failure
            field: trellix_epo_on_prem.product_event.epo_product_events.ipv6
            ignore_missing: true
        - append:
            tag: append_convert_ipv6_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: host.ip
      tag: append_product_event_epo_product_events_ipv6_into_host_ip
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.ipv6 != null
      value: '{{{trellix_epo_on_prem.product_event.epo_product_events.ipv6}}}'
      allow_duplicates: false
  - append:
      field: related.ip
      tag: append_product_event_epo_product_events_ipv6_into_related_ip
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.ipv6 != null
      value: '{{{trellix_epo_on_prem.product_event.epo_product_events.ipv6}}}'
      allow_duplicates: false
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.locale
      tag: convert_EPOProductEvents_Locale_to_string
      type: string
      ignore_missing: true
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.node_id
      tag: convert_EPOProductEvents_NodeID_to_string
      type: string
      ignore_missing: true
  - set:
      field: package.name
      tag: set_package_name_from_product_event_epo_product_events_product_code
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.product_code
      ignore_empty_value: true
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.tvd_event_id
      tag: convert_EPOProductEvents_TVDEventID_to_string
      type: string
      ignore_missing: true
  - set:
      field: event.code
      tag: set_event_code_from_product_event_epo_product_events_tvd_event_id
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.tvd_event_id
      ignore_empty_value: true
  - script:
      lang: painless
      tag: script_set_ecs_categorization
      description: >
        Maps the Trellix Agent event code (TVDEventID) to ECS categorization. Keys are
        '<event.code>:<lowercased EPOProductEvents.Type>' and fall back to '<event.code>:*',
        because neither column is sufficient alone: code 2411 and 2412 are shared by Install
        and Uninstall, while Type alone cannot express success or failure. Keying on the
        documented code set and refining with Type keeps categorization deterministic even
        for Type values that are not enumerated here.
      if: ctx.event?.code != null
      params:
        # 2401 - Common update success
        '2401:*':
          action: update-successful
          outcome: success
          category:
            - package
          type:
            - change
        # 2402 - Common update fail
        '2402:*':
          action: update-failed
          outcome: failure
          category:
            - package
          type:
            - change
        # 2411 - Deployment success
        '2411:uninstall':
          action: deployment-successful
          outcome: success
          category:
            - package
          type:
            - deletion
        '2411:*':
          action: deployment-successful
          outcome: success
          category:
            - package
          type:
            - installation
        # 2412 - Deployment fail
        '2412:uninstall':
          action: deployment-failed
          outcome: failure
          category:
            - package
          type:
            - deletion
        '2412:*':
          action: deployment-failed
          outcome: failure
          category:
            - package
          type:
            - installation
        # 2413 - Trellix Agent uninstall attempt
        '2413:*':
          action: agent-uninstall-attempt
          outcome: unknown
          category:
            - package
          type:
            - deletion
        # 2422 - Policy enforce fail
        '2422:*':
          action: policy-enforce-failed
          outcome: failure
          category:
            - configuration
          type:
            - change
        # 2427 - Props collect fail
        '2427:*':
          action: property-collection-failed
          outcome: failure
          category:
            - host
          type:
            - info
      source: |-
        String operation = '';
        if (ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.type instanceof String) {
          operation = ctx.trellix_epo_on_prem.product_event.epo_product_events.type.toLowerCase();
        }
        def mapping = params.get(ctx.event.code + ':' + operation);
        if (mapping == null) {
          mapping = params.get(ctx.event.code + ':*');
        }
        if (mapping == null) {
          return;
        }
        mapping.forEach((k, v) -> {
          if (v instanceof List) {
            // params are shared across every document in the bulk request, so list
            // values must be copied rather than aliased.
            ctx.event[k] = new ArrayList(v);
          } else {
            ctx.event[k] = v;
          }
        });
      on_failure:
        - append:
            tag: append_script_set_ecs_categorization_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.tvd_severity
      tag: convert_EPOProductEvents_TVDSeverity_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_tvd_severity_on_convert_failure
            field: trellix_epo_on_prem.product_event.epo_product_events.tvd_severity
            ignore_missing: true
        - append:
            tag: append_convert_tvd_severity_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.severity
      tag: set_event_severity_from_product_event_epo_product_events_tvd_severity
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.tvd_severity
      ignore_empty_value: true
  - convert:
      field: trellix_epo_on_prem.product_event.epo_product_events.tenant_id
      tag: convert_EPOProductEvents_TenantId_to_string
      type: string
      ignore_missing: true
  - set:
      field: user.name
      tag: set_user_name_from_product_event_epo_product_events_user_name
      copy_from: trellix_epo_on_prem.product_event.epo_product_events.user_name
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_product_event_epo_product_events_user_name_into_related_user
      if: ctx.trellix_epo_on_prem?.product_event?.epo_product_events?.user_name != null
      value: '{{{trellix_epo_on_prem.product_event.epo_product_events.user_name}}}'
      allow_duplicates: false
  - remove:
      field:
        - trellix_epo_on_prem.product_event.epo_product_events.auto_id
        - trellix_epo_on_prem.product_event.epo_product_events.detected_utc
        - trellix_epo_on_prem.product_event.epo_product_events.error
        - trellix_epo_on_prem.product_event.epo_product_events.host_name
        - trellix_epo_on_prem.product_event.epo_product_events.ipv6
        - trellix_epo_on_prem.product_event.epo_product_events.product_code
        - trellix_epo_on_prem.product_event.epo_product_events.received_utc
        - trellix_epo_on_prem.product_event.epo_product_events.tvd_event_id
        - trellix_epo_on_prem.product_event.epo_product_events.tvd_severity
        - trellix_epo_on_prem.product_event.epo_product_events.user_name
      tag: remove_fields_mapped_to_ecs
      ignore_missing: true
  - script:
      tag: remove_null_values
      lang: painless
      description: Remove null or empty values from the document.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      if: ctx.error?.message != null
      value: pipeline_error
  - append:
      field: tags
      tag: append_tags
      if: ctx.error?.message != null
      value: preserve_original_event
      allow_duplicates: false
on_failure:
  - append:
      field: error.message
      tag: append_pipeline_failure_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
