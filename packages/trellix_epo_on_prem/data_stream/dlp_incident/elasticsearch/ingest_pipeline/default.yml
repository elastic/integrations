---
description: Parse Trellix ePO on-prem DLP incident events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.4.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  - dot_expander:
      field: '*'
      path: json
      tag: dot_expander_json
      if: ctx.json != null
  - rename:
      field: json.UDLP_EPD_Incidents
      target_field: trellix_epo_on_prem.dlp_incident.UDLP_EPD_Incidents
      ignore_missing: true
      tag: rename_json_to_vendor_namespace
      if: ctx.json?.UDLP_EPD_Incidents != null
  - script:
      description: >
        Convert field names from camelCase to snake_case recursively.
      tag: script_convert_camelcase_to_snake_case
      lang: painless
      source: |-
        String camelToSnake(String str) {
            def result = "";
            for (int i = 0; i < str.length(); i++) {
                char c = str.charAt(i);
                if (Character.isUpperCase(c)) {
                    if (i > 0 && Character.isLowerCase(str.charAt(i - 1))) {
                        result += "_";
                    }
                    result += Character.toLowerCase(c);
                } else {
                    result += c;
                }
            }
            return result;
        }
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              String newKey = camelToSnake(entry.getKey());
              newObj[newKey] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        if (ctx.trellix_epo_on_prem?.dlp_incident != null) {
          ctx.trellix_epo_on_prem.dlp_incident = convertToSnakeCase(ctx.trellix_epo_on_prem.dlp_incident);
        }
      on_failure:
        - append:
            tag: append_script_convert_camelcase_to_snake_case_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      field: json
      ignore_missing: true
      tag: remove_json
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_id
      type: string
      ignore_missing: true
      tag: convert_incident_id_to_string
  # These are numeric enum identifiers that ePO emits as JSON numbers but that are
  # mapped as keyword. Convert them so the stored _source is a string and matches
  # the mapping (otherwise real documents fail validation at index/query time).
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.actual_action
      type: string
      ignore_missing: true
      tag: convert_actual_action_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.connectivity_state
      type: string
      ignore_missing: true
      tag: convert_connectivity_state_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.expected_action
      type: string
      ignore_missing: true
      tag: convert_expected_action_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.failure_reason
      type: string
      ignore_missing: true
      tag: convert_failure_reason_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.original_incident_id
      type: string
      ignore_missing: true
      tag: convert_original_incident_id_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.reporting_product
      type: string
      ignore_missing: true
      tag: convert_reporting_product_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.resolution_id
      type: string
      ignore_missing: true
      tag: convert_resolution_id_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.status_id
      type: string
      ignore_missing: true
      tag: convert_status_id_to_string
  - fingerprint:
      fields:
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_id
      target_field: _id
      ignore_missing: true
      tag: fingerprint_incident_id
  - set:
      field: event.kind
      tag: set_alert_into_event_kind
      value: alert
  - append:
      field: event.category
      tag: append_intrusion_detection_into_event_category
      value: intrusion_detection
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_info_into_event_type
      value: info
      allow_duplicates: false
  # FailureReason reports whether the endpoint managed to carry out the action DLP
  # asked for; 0 means nothing failed. ePO returns this family of enum columns as
  # either JSON numbers or strings depending on the column, so compare as text.
  - set:
      field: event.outcome
      tag: set_event_outcome_to_success
      value: success
      if: >-
        ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.failure_reason != null &&
        String.valueOf(ctx.trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.failure_reason) == '0'
  - set:
      field: event.outcome
      tag: set_event_outcome_to_failure
      value: failure
      if: >-
        ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.failure_reason != null &&
        String.valueOf(ctx.trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.failure_reason) != '0'
  - set:
      field: event.id
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_id
      ignore_empty_value: true
      tag: set_event_id_from_incident_id
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_type
      type: string
      ignore_missing: true
      tag: convert_incident_type_to_string
  - convert:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.severity
      type: long
      ignore_missing: true
      if: ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.severity != ''
      tag: convert_severity_to_long
      on_failure:
        - remove:
            field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.severity
            ignore_missing: true
            tag: remove_severity_on_convert_failure
        - append:
            field: error.message
            tag: append_severity_convert_failure_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.severity
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.severity
      ignore_empty_value: true
      tag: set_event_severity_from_severity
  - set:
      field: event.code
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_type
      ignore_empty_value: true
      tag: set_event_code_from_incident_type
  - append:
      field: related.user
      tag: append_reviewer_to_related_user
      value: '{{{trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.reviewer}}}'
      allow_duplicates: false
      if: ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.reviewer != null
  - set:
      field: user.email
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.reviewer
      ignore_empty_value: true
      tag: set_user_email_from_reviewer
  - dissect:
      field: user.email
      pattern: '%{user.name}@%{user.domain}'
      tag: dissect_user_email
      ignore_failure: true
      if: ctx.user?.email != null && ctx.user.email.contains('@')
  - set:
      field: rule.name
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.rules_to_display
      ignore_empty_value: true
      tag: set_rule_name_from_rules_to_display
  - set:
      field: rule.ruleset
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.rule_set_to_display
      ignore_empty_value: true
      tag: set_rule_ruleset_from_rule_set_to_display
  # ViolationUTCTime is the one datetime column whose digits are already UTC, yet
  # ePO still appends the server's own offset on the way out: the same incident
  # comes back as ViolationUTCTime "2026-08-17T11:56:34+05:30" and
  # ViolationLocalTime "2026-08-17T17:26:34+05:30". Honouring the offset here would
  # shift an already-UTC instant back by it, so strip it before parsing. The other
  # columns carry local wall clocks that the appended offset correctly describes,
  # and they are parsed with it intact.
  - gsub:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_utctime
      pattern: '[+-]\d{2}:\d{2}$'
      replacement: 'Z'
      ignore_missing: true
      tag: gsub_violation_utc_time_server_offset
  - date:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_utctime
      target_field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_utctime
      formats:
        - ISO8601
      tag: date_violation_utc_time
      if: ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.violation_utctime != null
      on_failure:
        - remove:
            field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_utctime
            ignore_missing: true
            tag: remove_violation_utc_time_on_date_failure
        - append:
            field: error.message
            tag: append_date_violation_utc_time_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      copy_from: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_utctime
      ignore_empty_value: true
      tag: set_timestamp_from_violation_utc_time
  - date:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_local_time
      target_field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_local_time
      formats:
        - ISO8601
      tag: date_violation_local_time
      if: ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.violation_local_time != null
      on_failure:
        - remove:
            field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_local_time
            ignore_missing: true
            tag: remove_violation_local_time_on_date_failure
        - append:
            field: error.message
            tag: append_date_violation_local_time_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_custom_time
      target_field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_custom_time
      formats:
        - ISO8601
      tag: date_violation_custom_time
      if: ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.violation_custom_time != null
      on_failure:
        - remove:
            field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_custom_time
            ignore_missing: true
            tag: remove_violation_custom_time_on_date_failure
        - append:
            field: error.message
            tag: append_date_violation_custom_time_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # The appended offset is authoritative for this column, so the indexed value is
  # the true instant. That is deliberately not the value the CEL cursor persists:
  # ePO's where clause compares the printed wall clock, so the cursor hands the
  # digits back verbatim. The two differ by the server's offset by design.
  - date:
      field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.last_update_timestamp
      target_field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.last_update_timestamp
      formats:
        - ISO8601
      tag: date_last_update_timestamp
      if: ctx.trellix_epo_on_prem?.dlp_incident?.udlp_epd_incidents?.last_update_timestamp != null
      on_failure:
        - remove:
            field: trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.last_update_timestamp
            ignore_missing: true
            tag: remove_last_update_timestamp_on_date_failure
        - append:
            field: error.message
            tag: append_date_last_update_timestamp_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      field:
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_id
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.incident_type
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.reviewer
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.rules_to_display
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.rule_set_to_display
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.severity
        - trellix_epo_on_prem.dlp_incident.udlp_epd_incidents.violation_utctime
      ignore_missing: true
      tag: remove_custom_mapped_ecs_fields
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      if: ctx.error?.message != null
      value: pipeline_error
  - append:
      field: tags
      tag: append_tags
      if: ctx.error?.message != null
      value: preserve_original_event
      allow_duplicates: false
on_failure:
  - append:
      field: error.message
      tag: append_pipeline_failure_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
