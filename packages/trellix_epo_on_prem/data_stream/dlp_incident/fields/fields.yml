- name: trellix_epo_on_prem
  type: group
  fields:
    - name: dlp_incident
      type: group
      fields:
        - name: UDLP_EPD_Incidents
          type: group
          fields:
            - name: ActualAction
              type: long
              description: Numeric identifier of the action actually taken for the DLP incident.
            - name: ClassificationsToDisplay
              type: keyword
              description: Display label for the data classification associated with the DLP incident.
            - name: ConnectivityState
              type: long
              description: Numeric connectivity-state code associated with the DLP incident.
            - name: DlpAgentVersion
              type: keyword
              description: Version string of the DLP agent associated with the incident.
            - name: EvidenceCount
              type: long
              description: Number of evidence items associated with the DLP incident.
            - name: ExpectedAction
              type: long
              description: Numeric identifier of the action expected for the DLP incident.
            - name: FailureReason
              type: long
              description: Numeric failure-reason code associated with the DLP incident.
            - name: LastUpdateTimestamp
              type: date
              description: Date and time when the DLP incident record was last updated.
            - name: McAfeeAgentGuid
              type: keyword
              description: GUID identifying a McAfee agent associated with the DLP incident.
            - name: OriginalIncidentId
              type: long
              description: Numeric identifier of an original incident related to the current DLP incident.
            - name: ReportingProduct
              type: long
              description: Numeric identifier of the product that reported the DLP incident.
            - name: ResolutionId
              type: long
              description: Numeric identifier of the DLP incident resolution.
            - name: Severity
              type: long
              description: Numeric severity level associated with the DLP incident.
            - name: ShortMatchString
              type: keyword
              description: Short content excerpt associated with a DLP rule match.
            - name: StatusId
              type: long
              description: Numeric identifier of the DLP incident status.
            - name: TotalContentSize
              type: long
              description: Total content size recorded for the DLP incident.
            - name: TotalMatchCount
              type: long
              description: Total number of matches recorded for the DLP incident.
            - name: ViolationCustomTime
              type: date
              description: Custom date and time representation associated with the DLP violation.
            - name: ViolationLocalTime
              type: date
              description: Local date and time when the DLP violation occurred.
