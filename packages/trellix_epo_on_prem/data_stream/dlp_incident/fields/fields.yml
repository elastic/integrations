- name: trellix_epo_on_prem
  type: group
  fields:
    - name: dlp_incident
      type: group
      fields:
        - name: udlp_epd_incidents
          type: group
          fields:
            - name: actual_action
              type: keyword
              description: Code for the action the endpoint actually took for the DLP incident.
            - name: classifications_to_display
              type: keyword
              description: Display label for the data classification associated with the DLP incident.
            - name: connectivity_state
              type: keyword
              description: Connectivity-state code associated with the DLP incident.
            - name: dlp_agent_version
              type: keyword
              description: Version string of the DLP agent associated with the incident.
            - name: evidence_count
              type: long
              description: Number of evidence items associated with the DLP incident.
            - name: expected_action
              type: keyword
              description: Code for the action DLP expected the endpoint to take for the incident.
            - name: failure_reason
              type: keyword
              description: Failure-reason code for the DLP incident; 0 indicates that nothing failed.
            - name: last_update_timestamp
              type: date
              description: Date and time when the DLP incident record was last updated.
            - name: mc_afee_agent_guid
              type: keyword
              description: GUID identifying a McAfee agent associated with the DLP incident.
            - name: original_incident_id
              type: keyword
              description: Identifier of an original incident related to the current DLP incident.
            - name: reporting_product
              type: keyword
              description: Identifier of the product that reported the DLP incident.
            - name: resolution_id
              type: keyword
              description: Identifier of the DLP incident resolution.
            - name: short_match_string
              type: keyword
              description: Short content excerpt associated with a DLP rule match.
            - name: status_id
              type: keyword
              description: Identifier of the DLP incident status.
            - name: total_content_size
              type: long
              description: Total content size recorded for the DLP incident.
            - name: total_match_count
              type: long
              description: Total number of matches recorded for the DLP incident.
            - name: violation_custom_time
              type: date
              description: Custom date and time representation associated with the DLP violation.
            - name: violation_local_time
              type: date
              description: Local date and time when the DLP violation occurred.
            - name: violation_timezone
              type: keyword
              description: Windows time zone display name of the endpoint where the DLP violation occurred, for example `India Standard Time`.
