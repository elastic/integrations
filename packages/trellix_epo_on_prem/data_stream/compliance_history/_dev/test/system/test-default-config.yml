deployer: docker
wait_for_data_timeout: 1m
input: cel
service: trellix_epo_on_prem_compliance_history
vars:
  url: http://{{Hostname}}:{{Port}}
  username: xxxx
  password: xxxx
data_stream:
  vars:
    initial_interval: 720h
    interval: 2s
    page_size: 2
    preserve_original_event: true
assert:
  hit_count: 1
