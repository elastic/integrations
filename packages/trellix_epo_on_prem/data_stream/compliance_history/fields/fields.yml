- name: trellix_epo_on_prem
  type: group
  fields:
    - name: compliance_history
      type: group
      fields:
        - name: epo_compliance_history
          type: group
          fields:
            - name: chart_name
              type: keyword
              description: Name of the chart that generated the compliance history record.
            - name: count_compliant
              type: long
              description: Number of computers recorded as compliant.
            - name: count_computers
              type: long
              description: Total number of computers evaluated by the compliance query.
            - name: count_non_compliant
              type: long
              description: Number of computers recorded as noncompliant.
            - name: percent_compliant
              type: double
              description: Percentage of evaluated computers recorded as compliant.
            - name: percent_non_compliant
              type: double
              description: Percentage of evaluated computers recorded as noncompliant.
            - name: task_name
              type: keyword
              description: Name of the server task that generated the compliance history record.
            - name: tenant_id
              type: keyword
              description: Tenant identifier associated with the compliance history record.
