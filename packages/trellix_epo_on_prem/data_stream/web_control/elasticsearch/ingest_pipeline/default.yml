---
description: Pipeline for processing web_control logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 9.4.0
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      tag: remove_agentless_tags
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      ignore_missing: true
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original
      if: ctx.event?.original == null
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message.
  - remove:
      field:
        - message
      tag: remove_message
      if: ctx.event?.original != null
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      field: event.original
      tag: json_event_original
      target_field: trellix_epo_on_prem.web_control
      if: ctx.event?.original != null
  - dot_expander:
      field: '*'
      tag: dot_expander_web_control
      path: trellix_epo_on_prem.web_control
      if: ctx.trellix_epo_on_prem?.web_control != null
      description: Expands the dotted JSON keys (for example `WP_EventInfo.EventAutoID`) into nested objects.
  - script:
      description: >
        Convert field names from camelCase to snake_case recursively.
      tag: script_convert_camelcase_to_snake_case
      lang: painless
      source: |-
        String camelToSnake(String str) {
            def result = "";
            for (int i = 0; i < str.length(); i++) {
                char c = str.charAt(i);
                if (Character.isUpperCase(c)) {
                    if (i > 0 && Character.isLowerCase(str.charAt(i - 1))) {
                        result += "_";
                    }
                    result += Character.toLowerCase(c);
                } else {
                    result += c;
                }
            }
            return result;
        }
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              String newKey = camelToSnake(entry.getKey());
              newObj[newKey] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        if (ctx.trellix_epo_on_prem?.web_control != null) {
          ctx.trellix_epo_on_prem.web_control = convertToSnakeCase(ctx.trellix_epo_on_prem.web_control);
        }
      on_failure:
        - append:
            tag: append_script_convert_camelcase_to_snake_case_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.event_auto_id
      tag: convert_WP_EventInfo_EventAutoID_to_string
      type: string
      ignore_missing: true
  - fingerprint:
      fields:
        - trellix_epo_on_prem.web_control.wp_event_info.event_auto_id
      tag: fingerprint_with_id
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_web_into_event_category
      value: web
  - append:
      field: event.type
      tag: append_access_into_event_type
      value: access
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.action_id
      tag: convert_WP_EventInfo_ActionID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.action_id
            tag: remove_wp_event_info_action_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_action_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.bad_link_rating_id
      tag: convert_WP_EventInfo_BadLinkRatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.bad_link_rating_id
            tag: remove_wp_event_info_bad_link_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_bad_link_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.content_id
      tag: convert_WP_EventInfo_ContentID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.content_id
            tag: remove_wp_event_info_content_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_content_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.count
      tag: convert_WP_EventInfo_Count_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.count
            tag: remove_wp_event_info_count
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_count_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: url.domain
      tag: set_url_domain_from_web_control_wp_event_info_domain_name
      copy_from: trellix_epo_on_prem.web_control.wp_event_info.domain_name
      ignore_empty_value: true
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.download_rating_id
      tag: convert_WP_EventInfo_DownloadRatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.download_rating_id
            tag: remove_wp_event_info_download_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_download_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.id
      tag: set_event_id_from_web_control_wp_event_info_event_auto_id
      copy_from: trellix_epo_on_prem.web_control.wp_event_info.event_auto_id
      ignore_empty_value: true
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.exploit_rating_id
      tag: convert_WP_EventInfo_ExploitRatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.exploit_rating_id
            tag: remove_wp_event_info_exploit_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_exploit_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.list_id
      tag: convert_WP_EventInfo_ListID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.list_id
            tag: remove_wp_event_info_list_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_list_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.observer_mode
      tag: convert_WP_EventInfo_ObserverMode_to_boolean
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.observer_mode
            tag: remove_wp_event_info_observer_mode
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_observer_mode_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.phishing_rating_id
      tag: convert_WP_EventInfo_PhishingRatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.phishing_rating_id
            tag: remove_wp_event_info_phishing_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_phishing_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.popup_rating_id
      tag: convert_WP_EventInfo_PopupRatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.popup_rating_id
            tag: remove_wp_event_info_popup_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_popup_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.rating_id
      tag: convert_WP_EventInfo_RatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.rating_id
            tag: remove_wp_event_info_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.reason_id
      tag: convert_WP_EventInfo_ReasonID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.reason_id
            tag: remove_wp_event_info_reason_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_reason_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: trellix_epo_on_prem.web_control.wp_event_info.spam_rating_id
      tag: convert_WP_EventInfo_SpamRatingID_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: trellix_epo_on_prem.web_control.wp_event_info.spam_rating_id
            tag: remove_wp_event_info_spam_rating_id
            ignore_missing: true
        - append:
            field: error.message
            tag: append_convert_wp_event_info_spam_rating_id_error
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: url.original
      tag: set_url_original_from_web_control_wp_event_info_url
      copy_from: trellix_epo_on_prem.web_control.wp_event_info.url
      ignore_empty_value: true
  - set:
      field: user.name
      tag: set_user_name_from_web_control_wp_event_info_user_name
      copy_from: trellix_epo_on_prem.web_control.wp_event_info.user_name
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_web_control_wp_event_info_user_name_into_related_user
      if: ctx.trellix_epo_on_prem?.web_control?.wp_event_info?.user_name != null
      value: '{{{trellix_epo_on_prem.web_control.wp_event_info.user_name}}}'
      allow_duplicates: false
  - remove:
      field:
        - trellix_epo_on_prem.web_control.wp_event_info.domain_name
        - trellix_epo_on_prem.web_control.wp_event_info.event_auto_id
        - trellix_epo_on_prem.web_control.wp_event_info.url
        - trellix_epo_on_prem.web_control.wp_event_info.user_name
      tag: remove_fields_mapped_to_ecs
      ignore_missing: true
  - script:
      tag: remove_null_values
      lang: painless
      description: Remove null or empty values from the document.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      if: ctx.error?.message != null
      value: pipeline_error
  - append:
      field: tags
      tag: append_tags
      if: ctx.error?.message != null
      value: preserve_original_event
      allow_duplicates: false
on_failure:
  - append:
      field: error.message
      tag: append_pipeline_failure_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
