- name: trellix_epo_on_prem
  type: group
  fields:
    - name: web_control
      type: group
      fields:
        - name: wp_event_info
          type: group
          fields:
            - name: action_id
              type: long
              description: Numeric action identifier associated with the web-control event.
            - name: bad_link_rating_id
              type: long
              description: Numeric identifier for the bad-link rating associated with the event.
            - name: content_id
              type: long
              description: Numeric content identifier associated with the web-control event.
            - name: count
              type: long
              description: Count recorded for the web-control event.
            - name: download_rating_id
              type: long
              description: Numeric identifier for the download rating associated with the event.
            - name: exploit_rating_id
              type: long
              description: Numeric identifier for the exploit rating associated with the event.
            - name: list_id
              type: long
              description: Numeric identifier of a list associated with the web-control event.
            - name: observer_mode
              type: boolean
              description: Boolean indicating whether observer mode was active for the web-control event.
            - name: phishing_rating_id
              type: long
              description: Numeric identifier for the phishing rating associated with the event.
            - name: popup_rating_id
              type: long
              description: Numeric identifier for the pop-up rating associated with the event.
            - name: rating_id
              type: long
              description: Numeric identifier for the overall web-control rating associated with the event.
            - name: reason_id
              type: long
              description: Numeric identifier for the reason associated with the web-control event.
            - name: spam_rating_id
              type: long
              description: Numeric identifier for the spam rating associated with the event.
