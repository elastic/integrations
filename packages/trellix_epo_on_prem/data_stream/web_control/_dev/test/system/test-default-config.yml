deployer: docker
wait_for_data_timeout: 1m
input: cel
service: trellix_epo_on_prem
vars:
  url: http://{{Hostname}}:{{Port}}
  username: temp_user
  password: temp_password
data_stream:
  vars:
    page_size: 2
    preserve_original_event: true
assert:
  # 2 rows on the first page + 1 on the second: covers a full page, the
  # want_more continuation, and the short page that ends the cycle.
  hit_count: 3
