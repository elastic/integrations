- name: trellix_epo_on_prem
  type: group
  fields:
    - name: system
      type: group
      fields:
        - name: epo_leaf_node
          type: group
          fields:
            - name: agent_guid
              type: keyword
              description: Globally unique identifier of the Trellix agent installation on the managed system.
            - name: agent_version
              type: keyword
              description: Version string of the managed Trellix agent installed on the system.
            - name: excluded_tags
              type: keyword
              description: Comma-separated tags excluded from the managed system node.
            - name: last_comm_secure
              type: keyword
              description: Code indicating whether the last communication from the system was secure.
            - name: managed_state
              type: long
              description: Numeric managed-state code associated with the system node.
            - name: node_path
              type: keyword
              description: Hierarchical path of the managed system node.
            - name: parent_id
              type: keyword
              description: Identifier of the parent object in the ePO system hierarchy.
            - name: sequence_error_count
              type: long
              description: Number of sequence errors recorded for the managed system node.
            - name: sequence_error_count_last_update
              type: date
              description: Date and time when the sequence-error count was last updated.
            - name: server_key_hash
              type: keyword
              description: Base64-encoded cryptographic hash associated with the ePO server key.
            - name: tenant_id
              type: keyword
              description: Tenant identifier associated with the system node.
            - name: transfer_site_lists_id
              type: boolean
              description: Boolean flag associated with transferring site-list identifiers for the system node.
            - name: type
              type: long
              description: Numeric type code assigned to the managed system node.
