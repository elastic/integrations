- name: trellix_epo_on_prem
  type: group
  fields:
    - name: device_event
      type: group
      fields:
        - name: eeff_device_all_events_view
          type: group
          fields:
            - name: agent_guid
              type: keyword
              description: >-
                GUID of the Trellix Agent installation that reported the event. This identifies the agent instance rather than the endpoint, so it is not mapped to an ECS host or agent identifier.
            - name: backup_size
              type: double
              description: Backup size value recorded for the removable-media event.
            - name: backup_state
              type: keyword
              description: Backup state recorded for the removable-media event.
            - name: backup_time
              type: double
              description: Backup time value recorded for the removable-media event.
            - name: credential_type
              type: keyword
              description: Credential-type identifier associated with the event.
            - name: device_size
              type: double
              description: Size value recorded for the removable-media device.
            - name: exempted
              type: keyword
              description: Exemption status recorded for the removable-media event.
            - name: file_system
              type: keyword
              description: File-system name recorded for the removable-media device.
            - name: file_system_version
              type: keyword
              description: Version of the file system recorded for the removable-media device.
            - name: initialization_state
              type: keyword
              description: Initialization state recorded for the removable-media device.
            - name: initialization_time
              type: double
              description: Initialization time value recorded for the removable-media device.
            - name: key
              type: keyword
              description: Key value associated with the removable-media event.
            - name: media_type
              type: keyword
              description: Media-type identifier associated with the removable-media device.
            - name: protected
              type: keyword
              description: Protection status recorded for the removable-media device.
            - name: protected_size
              type: double
              description: Protected-size value recorded for the removable-media device.
