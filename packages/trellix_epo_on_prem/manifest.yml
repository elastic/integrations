format_version: '3.4.2'
name: trellix_epo_on_prem
title: Trellix ePO On-Prem
version: '0.1.0'
source:
  license: 'Elastic-2.0'
description: Collect event logs from Trellix ePolicy Orchestrator on-premises with Elastic Agent.
type: integration
categories:
  - security
  - edr_xdr
conditions:
  kibana:
    version: '^8.19.0 || ^9.1.0'
  elastic:
    subscription: 'basic'
screenshots:
  - src: /img/syslog-event-dashboard.png
    title: Syslog Event Dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/trellix-logo.svg
    title: Trellix logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: trellix_epo_on_prem
    title: Trellix ePO On-Prem event logs
    description: Collect Trellix ePO On-Prem event logs over syslog.
    inputs:
      - type: tcp
        title: Collect Trellix ePO event logs over TCP
        description: Collect Trellix ePO event logs sent over TCP.
      - type: udp
        title: Collect Trellix ePO event logs over UDP
        description: Collect Trellix ePO event logs sent over UDP.
owner:
  github: elastic/security-service-integrations
  type: elastic
