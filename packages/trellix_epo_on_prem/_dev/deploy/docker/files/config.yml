              "WP_EventInfo.RatingID": 6,
              "WP_EventInfo.ReasonID": 7,
              "WP_EventInfo.SpamRatingID": 4,
              "WP_EventInfo.URL": "reports.blockedSiteDSSError",
              "WP_EventInfo.UserName": null
            }
          ]

  # web_control catchall: any cursor beyond the seeded rows is exhausted, so a
  # later poll re-collects nothing and hit_count stays deterministic.
  - path: /remote/core.executeQuery
    methods: ['GET']
    query_params:
      target: 'WP_EventInfo'
      select: "{select:.*}"
      where: "{where:.*}"
      order: "{order:.*}"
      ':output': 'json'
    request_headers:
      Authorization:
        - "Basic dGVtcF91c2VyOnRlbXBfcGFzc3dvcmQ="
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'text/plain'
        body: 'OK: []'

