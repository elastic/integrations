format_version: 3.6.6
name: whoisfreaks
title: "WhoisFreaks"
version: 0.2.0
source:
  license: "Elastic-2.0"
description: "Collects historical and live WHOIS database records as compressed CSV files via secure HTTPS from WhoisFreaks and indexes them into Elastic search indices."
type: integration
categories:
  - security
conditions:
  kibana:
    version: "^8.13.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/sample-screenshot.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/sample-logo.svg
    title: Sample logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: whois
    title: WhoisFreaks
    description: Collect domain intelligence records via CEL API input.
    data_streams:
      - whois
    inputs:
      - type: cel
        title: WhoisFreaks CEL Input
        description: Collect domain and threat intelligence data using CEL input.
owner:
  github: qayyum-jfreaks
  type: elastic