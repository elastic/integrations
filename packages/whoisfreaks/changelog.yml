# newer versions go on top
- version: "0.2.0"
  changes:
    - description: >-
        Fixed authentication (WhoisFreaks requires apiKey as a query
        parameter, not an X-API-KEY header), wired the api_key package
        secret into the CEL program via secret_state (it was previously
        unset), nested WHOIS fields under whoisfreaks.* to match the
        ingest pipeline and field mappings, added HTTP status handling,
        added an optional file-date variable, added derived
        days_until_expiry / is_newly_registered fields, and added
        content-based deduplication so re-polling the same daily file
        does not create duplicate documents.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.0.1"
  changes:
    - description: Initial draft of the package
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
