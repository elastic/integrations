# newer versions go on top
- version: "1.0.0"
  changes:
    - description: >
        Send the WhoisFreaks API key as an X-API-KEY request header instead of an apiKey query parameter.

      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: >
        Pre-submission fixes: corrected owner.type from elastic to community, fixed a stale days_until_expiry value in sample_event.json that didn't match the pipeline's own computation, corrected the screenshot size declared in the manifest, renamed the default scaffold image filenames to be vendor-specific, and removed a stray empty file from the package root.

      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: >
        Production-ready release. Added Overview dashboard, Security detection rules (newly registered domains, domains expiring within 30 days, pipeline/API errors), Kibana tag, and publication polish.

      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: >
        Fixed authentication (apiKey as query parameter), CEL secret_state, whoisfreaks.* field nesting, HTTP status handling, optional file date, days_until_expiry / is_newly_registered, content-based deduplication, pipeline tests with expected results, and ECS field definitions.

      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.0"
  changes:
    - description: >
        Fixed authentication, nested WHOIS fields, derived fields, and deduplication.

      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.0.1"
  changes:
    - description: Initial draft of the package
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
