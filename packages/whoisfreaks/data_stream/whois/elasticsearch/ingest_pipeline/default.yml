---
description: Pipeline for processing WhoisFreaks domain intelligence records
processors:
  # --- Surface upstream request/decoding errors instead of silently indexing partial docs ---
  - set:
      tag: set_event_kind_error
      field: event.kind
      value: pipeline_error
      if: "ctx.error != null"
  - set:
      tag: set_event_kind_default
      field: event.kind
      value: enrichment
      if: "ctx.error == null"

  - set:
      tag: set_event_category
      field: event.category
      value:
        - network
      if: "ctx.error == null"
  - set:
      tag: set_event_type
      field: event.type
      value:
        - info
      if: "ctx.error == null"
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: whoisfreaks.whois

  # --- Timestamps (only meaningful on successful records) ---
  - date:
      tag: parse_query_time
      field: whoisfreaks.query_time
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss"
        - "ISO8601"
      if: "ctx.whoisfreaks?.query_time != null && ctx.whoisfreaks.query_time != ''"
      ignore_failure: true
  - date:
      tag: parse_create_date
      field: whoisfreaks.create_date
      target_field: whoisfreaks.create_date
      formats:
        - "yyyy-MM-dd HH:mm:ss"
        - "yyyy-MM-dd"
        - "ISO8601"
      if: "ctx.whoisfreaks?.create_date != null && ctx.whoisfreaks.create_date != ''"
      ignore_failure: true
  - date:
      tag: parse_update_date
      field: whoisfreaks.update_date
      target_field: whoisfreaks.update_date
      formats:
        - "yyyy-MM-dd HH:mm:ss"
        - "yyyy-MM-dd"
        - "ISO8601"
      if: "ctx.whoisfreaks?.update_date != null && ctx.whoisfreaks.update_date != ''"
      ignore_failure: true
  - date:
      tag: parse_expiry_date
      field: whoisfreaks.expiry_date
      target_field: whoisfreaks.expiry_date
      formats:
        - "yyyy-MM-dd HH:mm:ss"
        - "yyyy-MM-dd"
        - "ISO8601"
      if: "ctx.whoisfreaks?.expiry_date != null && ctx.whoisfreaks.expiry_date != ''"
      ignore_failure: true

  # --- ECS convenience fields, used by the dashboard ---
  - set:
      tag: set_ecs_domain
      field: domain.registered_domain
      copy_from: whoisfreaks.domain_name
      ignore_empty_value: true
  - set:
      tag: set_ecs_registrar
      field: domain.registrar.name
      copy_from: whoisfreaks.domain_registrar_name
      ignore_empty_value: true

  # --- Derived fields used by dashboards & alert rules ---
  - script:
      tag: compute_expiry_and_age_fields
      description: >-
        Computes days_until_expiry (negative once expired) and flags domains
        newly registered the same day they were queried, so alert rules can
        filter on either field directly instead of re-deriving them.
      lang: painless
      ignore_failure: true
      if: "ctx.whoisfreaks != null"
      source: |
        if (ctx.whoisfreaks.expiry_date != null) {
          long nowMillis = ctx.containsKey('@timestamp') && ctx['@timestamp'] != null
            ? Instant.parse(ctx['@timestamp']).toEpochMilli()
            : System.currentTimeMillis();
          long expiryMillis = Instant.parse(ctx.whoisfreaks.expiry_date).toEpochMilli();
          ctx.whoisfreaks.days_until_expiry = (int) Math.floor((expiryMillis - nowMillis) / 86400000.0);
        }
        if (ctx.whoisfreaks.create_date != null && ctx.whoisfreaks.query_time != null) {
          String createDay = ctx.whoisfreaks.create_date.toString().substring(0, 10);
          String queryDay = ctx.whoisfreaks.query_time.toString().substring(0, 10);
          ctx.whoisfreaks.is_newly_registered = createDay.equals(queryDay);
        }

  # --- Deduplication: re-polling the same daily file must not create duplicate docs ---
  - fingerprint:
      tag: fingerprint_for_dedup
      fields:
        - whoisfreaks.domain_name
        - whoisfreaks.query_time
      target_field: _id
      if: "ctx.whoisfreaks?.domain_name != null && ctx.whoisfreaks?.query_time != null"
      ignore_missing: true

on_failure:
  - set:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        with tag '{{{ _ingest.on_failure_processor_tag }}}'
        in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
