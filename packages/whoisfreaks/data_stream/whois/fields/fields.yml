- name: whoisfreaks
  type: group
  description: WhoisFreaks domain intelligence fields.
  fields:
    - name: num
      type: long
      description: Record row number or index.
    - name: domain_name
      type: keyword
      description: The primary domain name associated with the WHOIS record.
    - name: query_time
      type: keyword
      description: >-
        Original query timestamp string from the feed (yyyy-MM-dd HH:mm:ss). Parsed into @timestamp by the ingest pipeline.
    - name: create_date
      type: date
      description: Date when the domain was originally registered.
    - name: update_date
      type: date
      description: Date when the domain record was last updated.
    - name: expiry_date
      type: date
      description: Date when the domain registration expires.
    - name: domain_registrar_id
      type: keyword
      description: Unique identifier of the registrar.
    - name: domain_registrar_name
      type: keyword
      description: Name of the domain registrar.
    - name: domain_registrar_whois
      type: text
      description: Registrar WHOIS server details.
    - name: domain_registrar_url
      type: keyword
      description: Registrar website URL.
    - name: registrant_name
      type: text
      description: Name of the domain registrant.
      multi_fields:
        - name: keyword
          type: keyword
          ignore_above: 1024
    - name: registrant_company
      type: keyword
      description: Company or organization that registered the domain.
    - name: registrant_address
      type: text
      description: Street address of the registrant.
    - name: registrant_city
      type: keyword
      description: City of the registrant.
    - name: registrant_state
      type: keyword
      description: State or province of the registrant.
    - name: registrant_zip
      type: keyword
      description: Postal code or ZIP of the registrant.
    - name: registrant_country_code
      type: keyword
      description: Two-letter country code of the registrant.
    - name: registrant_country
      type: keyword
      description: Country name of the registrant.
    - name: registrant_email
      type: keyword
      description: Contact email address of the registrant.
    - name: registrant_phone
      type: keyword
      description: Contact phone number of the registrant.
    - name: registrant_fax
      type: keyword
      description: Contact fax number of the registrant.
    - name: administrative_name
      type: text
      description: Name of the administrative contact.
      multi_fields:
        - name: keyword
          type: keyword
          ignore_above: 1024
    - name: administrative_company
      type: keyword
      description: Company of the administrative contact.
    - name: administrative_address
      type: text
      description: Street address of the administrative contact.
    - name: administrative_city
      type: keyword
      description: City of the administrative contact.
    - name: administrative_state
      type: keyword
      description: State or province of the administrative contact.
    - name: administrative_zip
      type: keyword
      description: ZIP or postal code of the administrative contact.
    - name: administrative_country_code
      type: keyword
      description: Country code of the administrative contact.
    - name: administrative_country
      type: keyword
      description: Country name of the administrative contact.
    - name: administrative_email
      type: keyword
      description: Email of the administrative contact.
    - name: administrative_phone
      type: keyword
      description: Phone number of the administrative contact.
    - name: administrative_fax
      type: keyword
      description: Fax number of the administrative contact.
    - name: technical_name
      type: text
      description: Name of the technical contact.
      multi_fields:
        - name: keyword
          type: keyword
          ignore_above: 1024
    - name: technical_company
      type: keyword
      description: Company of the technical contact.
    - name: technical_address
      type: text
      description: Street address of the technical contact.
    - name: technical_city
      type: keyword
      description: City of the technical contact.
    - name: technical_state
      type: keyword
      description: State or province of the technical contact.
    - name: technical_zip
      type: keyword
      description: ZIP or postal code of the technical contact.
    - name: technical_country_code
      type: keyword
      description: Country code of the technical contact.
    - name: technical_country
      type: keyword
      description: Country name of the technical contact.
    - name: technical_email
      type: keyword
      description: Email of the technical contact.
    - name: technical_phone
      type: keyword
      description: Phone number of the technical contact.
    - name: technical_fax
      type: keyword
      description: Fax number of the technical contact.
    - name: billing_name
      type: text
      description: Name of the billing contact.
      multi_fields:
        - name: keyword
          type: keyword
          ignore_above: 1024
    - name: billing_company
      type: keyword
      description: Company of the billing contact.
    - name: billing_address
      type: text
      description: Street address of the billing contact.
    - name: billing_city
      type: keyword
      description: City of the billing contact.
    - name: billing_state
      type: keyword
      description: State or province of the billing contact.
    - name: billing_zip
      type: keyword
      description: ZIP or postal code of the billing contact.
    - name: billing_country_code
      type: keyword
      description: Country code of the billing contact.
    - name: billing_country
      type: keyword
      description: Country name of the billing contact.
    - name: billing_email
      type: keyword
      description: Email of the billing contact.
    - name: billing_phone
      type: keyword
      description: Phone number of the billing contact.
    - name: billing_fax
      type: keyword
      description: Fax number of the billing contact.
    - name: name_server_1
      type: keyword
      description: Primary name server.
    - name: name_server_2
      type: keyword
      description: Secondary name server.
    - name: name_server_3
      type: keyword
      description: Third name server.
    - name: name_server_4
      type: keyword
      description: Fourth name server.
    - name: domain_status_1
      type: keyword
      description: Primary domain status flag.
    - name: domain_status_2
      type: keyword
      description: Secondary domain status flag.
    - name: domain_status_3
      type: keyword
      description: Third domain status flag.
    - name: domain_status_4
      type: keyword
      description: Fourth domain status flag.
    - name: reseller_name
      type: keyword
      description: Name of the domain reseller.
    - name: reseller_email
      type: keyword
      description: Email of the domain reseller.
    - name: reseller_phone
      type: keyword
      description: Phone number of the domain reseller.
    - name: days_until_expiry
      type: long
      description: >-
        Days between the record's query_time and its expiry_date. Negative once the domain has already expired. Computed by the ingest pipeline.
    - name: is_newly_registered
      type: boolean
      description: >-
        True when create_date falls on the same day as query_time, i.e. the domain was registered the day it was captured in this feed. Computed by the ingest pipeline.
