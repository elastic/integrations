server {
    listen 8080;

    # Mock of https://files.whoisfreaks.com/v3.1/download/domainer/gtld
    # Query params (apiKey/whois/date) are ignored by this static mock;
    # add access_log inspection if you need to assert on them.
    location /v3.1/download/domainer/gtld {
        default_type application/gzip;
        try_files /v3.1/download/domainer/gtld =404;
    }
}
