---
description: >-
  Validate a single forwarded-for address and collect it. Forwarded headers are set by the client,
  so a value that the ip mapping would reject is dropped instead of failing the event or reaching
  an ip field, where it would make Elasticsearch refuse the whole document. Called per array
  element from a foreach processor.
processors:
  - remove:
      field: _tmp.valid_ip
      tag: remove_stale_tmp_valid_ip
      ignore_missing: true
  - convert:
      field: _ingest._value
      tag: convert_forwarded_value_to_ip
      target_field: _tmp.valid_ip
      type: ip
      ignore_failure: true
  - append:
      field: _tmp.valid_ips
      tag: append_tmp_valid_ips
      value: '{{{_tmp.valid_ip}}}'
      allow_duplicates: false
      if: ctx._tmp?.valid_ip != null
  - append:
      field: related.ip
      tag: append_forwarded_ip_into_related_ip
      value: '{{{_tmp.valid_ip}}}'
      allow_duplicates: false
      if: ctx._tmp?.valid_ip != null
