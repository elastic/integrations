---
description: Pipeline for F5 BIG-IP Application Security Manager logs.
processors:
  - append:
      field: event.category
      tag: append_event_category
      value: network
  - append:
      field: event.type
      tag: append_event_type
      value: info
  - set:
      field: event.kind
      tag: set_event_kind
      value: alert
      if: ctx.json?.severity != null && ['emergency', 'critical', 'alert', 'warning', 'error'].contains(ctx.json.severity.toLowerCase())
  - set:
      field: observer.product
      tag: set_observer_product
      value: Application Security Module
  - date:
      field: json.date_time
      tag: date_time_conversion
      target_field: f5_bigip.log.date_time
      if: ctx.json?.date_time != null && ctx.json.date_time != ''
      formats:
        - yyyy-MM-dd HH:mm:ss
        - ISO8601
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp
      copy_from: f5_bigip.log.date_time
      ignore_empty_value: true
  - convert:
      field: json.ip_client
      tag: convert_client_ip_to_ip
      target_field: f5_bigip.log.client.ip
      if: ctx.json?.ip_client != ''
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: client.ip
      tag: set_client_ip
      copy_from: f5_bigip.log.client.ip
      ignore_empty_value: true
  - set:
      field: source.ip
      tag: set_source_ip
      copy_from: client.ip
      ignore_empty_value: true
# Geo enrichment (source IP)
  - geoip:
      field: source.ip
      target_field: source.geo
      tag: geo_source_ip
      ignore_missing: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      tag: geo_source_as
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
      tag: rename_source_as_number
  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      tag: rename_source_as_org
  - set:
      field: client.geo
      tag: set_client_geo
      copy_from: source.geo
      ignore_empty_value: true
  - set:
      field: client.as
      tag: set_client_as
      copy_from: source.as
      ignore_empty_value: true
  - append:
      field: related.ip
      tag: append_related_ip
      value: '{{{client.ip}}}'
      allow_duplicates: false
      ignore_failure: true
  - convert:
      field: json.dest_ip
      tag: convert_dest_ip_to_ip
      target_field: f5_bigip.log.dest.ip
      if: ctx.json?.dest_ip != ''
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.ip
      tag: set_destination_ip
      copy_from: f5_bigip.log.dest.ip
      ignore_empty_value: true
  - set:
      field: server.ip
      tag: set_server_ip
      copy_from: destination.ip
      ignore_empty_value: true
# Geo enrichment (destination IP)
  - geoip:
      field: destination.ip
      target_field: destination.geo
      tag: geo_destination_ip
      ignore_missing: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      tag: geo_destination_as
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      field: destination.as.asn
      target_field: destination.as.number
      ignore_missing: true
      tag: rename_destination_as_number
  - rename:
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      ignore_missing: true
      tag: rename_destination_as_org
  - set:
      field: server.geo
      tag: set_server_geo
      copy_from: destination.geo
      ignore_empty_value: true
  - set:
      field: server.as
      tag: set_server_as
      copy_from: destination.as
      ignore_empty_value: true
  - append:
      field: related.ip
      tag: append_related_ip
      value: '{{{destination.ip}}}'
      allow_duplicates: false
      ignore_failure: true
  - convert:
      field: json.dest_port
      tag: convert_dest_port_to_long
      target_field: f5_bigip.log.dest.port
      if: ctx.json?.dest_port != ''
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.port
      tag: set_destination_port
      copy_from: f5_bigip.log.dest.port
      ignore_empty_value: true
  - set:
      field: server.port
      tag: set_server_port
      copy_from: destination.port
      ignore_empty_value: true
  - rename:
      field: json.geo_location
      tag: rename_geo_location
      target_field: f5_bigip.log.geo.location
      ignore_missing: true
  - set:
      field: host.geo.country_iso_code
      tag: set_host_geo_country_iso_code
      copy_from: f5_bigip.log.geo.location
      ignore_empty_value: true
  - rename:
      field: json.device_id
      tag: rename_device_id
      target_field: f5_bigip.log.device.id
      ignore_missing: true
  - set:
      field: host.id
      tag: set_host_id
      copy_from: f5_bigip.log.device.id
      ignore_empty_value: true
  - append:
      field: related.hosts
      tag: append_related_hosts
      value: '{{{host.id}}}'
      allow_duplicates: false
      ignore_failure: true
  - rename:
      field: json.method
      tag: rename_method
      target_field: f5_bigip.log.method
      ignore_missing: true
  - set:
      field: http.request.method
      tag: set_http_request_method
      copy_from: f5_bigip.log.method
      ignore_empty_value: true
  - rename:
      field: json.severity
      tag: rename_severity
      target_field: f5_bigip.log.severity.name
      ignore_missing: true
  - set:
      field: log.level
      tag: set_log_level
      copy_from: f5_bigip.log.severity.name
      ignore_failure: true
  - lowercase:
      field: log.level
      tag: lowercase_log_level
      ignore_missing: true
  - rename:
      field: json.protocol
      tag: rename_protocol
      target_field: f5_bigip.log.protocol
      ignore_missing: true
  - set:
      field: network.protocol
      tag: set_network_protocol
      copy_from: f5_bigip.log.protocol
      ignore_empty_value: true
  - convert:
      field: json.src_port
      tag: convert_src_port_to_long
      target_field: f5_bigip.log.src.port
      if: ctx.json?.src_port != ''
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.port
      tag: set_source_port
      copy_from: f5_bigip.log.src.port
      ignore_empty_value: true
  - set:
      field: client.port
      tag: set_client_port
      copy_from: source.port
      ignore_empty_value: true
  - rename:
      field: json.username
      tag: rename_username
      target_field: f5_bigip.log.username
      ignore_missing: true
  - set:
      field: user.name
      tag: set_user_name
      copy_from: f5_bigip.log.username
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_related_user
      value: '{{{user.name}}}'
      allow_duplicates: false
      ignore_failure: true
  - rename:
      field: json.attack_type
      tag: rename_attack_type
      target_field: f5_bigip.log.attack.type
      ignore_missing: true
  - rename:
      field: json.blocking_exception_reason
      tag: rename_blocking_exception_reason
      target_field: f5_bigip.log.blocking_exception_reason
      ignore_missing: true
  - rename:
      field: json.captcha_result
      tag: rename_captcha_result
      target_field: f5_bigip.log.captcha_result
      ignore_missing: true
  - rename:
      field: json.fragment
      tag: rename_fragment
      target_field: f5_bigip.log.fragment
      ignore_missing: true
  - rename:
      field: json.http_class_name
      tag: rename_http_class_name
      target_field: f5_bigip.log.http.class_name
      ignore_missing: true
  - rename:
      field: json.ip_address_intelligence
      tag: rename_ip_address_intelligence
      target_field: f5_bigip.log.ip_address_intelligence
      ignore_missing: true
  - convert:
      field: json.management_ip_address
      tag: convert_management_ip_address_to_ip
      target_field: f5_bigip.log.management.ip_address
      if: ctx.json?.management_ip_address != ''
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: related.ip
      tag: append_related_ip
      value: '{{{f5_bigip.log.management.ip_address}}}'
      allow_duplicates: false
      ignore_failure: true
  - convert:
      field: json.management_ip_address_2
      tag: convert_management_ip_address_2_to_ip
      target_field: f5_bigip.log.management.ip_address_2
      if: ctx.json?.management_ip_address_2 != ''
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: related.ip
      tag: append_related_ip
      value: '{{{f5_bigip.log.management.ip_address_2}}}'
      allow_duplicates: false
      ignore_failure: true
  - date:
      field: json.policy_apply_date
      tag: date_policy_apply_date
      target_field: f5_bigip.log.policy.apply_date
      if: ctx.json?.policy_apply_date != null && ctx.json.policy_apply_date != ''
      formats:
        - yyyy-MM-dd HH:mm:ss
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.policy_name
      tag: rename_policy_name
      target_field: f5_bigip.log.policy.name
      ignore_missing: true
  - script:
      lang: "painless"
      description: "Extract sAMAccountName, userPrincipleName, userName from log"
      tag: script_extract_sAMAccountName_userPrincipleName_userName
      source: >
        def log;
        if (ctx.event?.original != null) {
          log = ctx.event.original;
        } else if (ctx.json?.originalRawData != null) {
          log = ctx.json.originalRawData;
        }
        if (log != null) {
          def sAMAccountNameMatch = /sAMAccountName=([^\\)]+)/.matcher(log);
          if (sAMAccountNameMatch.find()) {
            ctx.f5_bigip.log.sam_account_name = sAMAccountNameMatch.group(1);
          }

          def userPrincipleNameMatch = /UserPrincipleName=([^\\)]+)/.matcher(log);
          if (userPrincipleNameMatch.find()) {
            ctx.f5_bigip.log.user_principle_name = userPrincipleNameMatch.group(1);
          }

          def userNameMatch = /User_Name=([^\\)]+)/.matcher(log);
          if (userNameMatch.find()) {
            ctx.f5_bigip.log.user_name = userNameMatch.group(1);
          }
        }
  - rename:
      field: json.query_string
      tag: rename_query_string
      target_field: f5_bigip.log.query.string
      ignore_missing: true
  - rename:
        field: f5_bigip.log.sam_account_name
        target_field: f5_bigip.log.query.sam_account_name
        ignore_missing: true
  - append:
      field: related.user
      tag: append_related_user
      value: '{{{f5_bigip.log.query.sam_account_name}}}'
      allow_duplicates: false
      if: ctx.f5_bigip?.log?.query?.sam_account_name != null
  - rename:
        field: f5_bigip.log.user_principle_name
        target_field: f5_bigip.log.query.user_principle_name
        ignore_missing: true
  - rename:
        field: f5_bigip.log.user_name
        target_field: f5_bigip.log.query.user_name
        ignore_missing: true
  - rename:
      field: json.request
      tag: rename_request
      target_field: f5_bigip.log.request.detail
      ignore_missing: true
  - script:
      lang: painless
      tag: script_to_parse_request_detail
      description: >-
        Split the raw HTTP request into its request line and headers, then look up each header by
        name. Clients send headers in any order and with any header set, so a positional pattern
        over the whole request cannot be used. BIG-IP writes the line separators either as real
        CRLF characters or as the two-character escape sequence, so the split accepts both.
      if: ctx.f5_bigip?.log?.request?.detail instanceof String
      source: |
        def lines = /\\r\\n|\r\n|\r|\n/.split(ctx.f5_bigip.log.request.detail);
        def request = ctx.f5_bigip.log.request;

        String requestLine = lines[0];
        int methodEnd = requestLine.indexOf(' ');
        int protocolStart = requestLine.lastIndexOf(' ');
        if (methodEnd > 0 && protocolStart > methodEnd) {
          request.method = requestLine.substring(0, methodEnd);
          request.path = requestLine.substring(methodEnd + 1, protocolStart);
          request.protocol = requestLine.substring(protocolStart + 1);
        }

        // Host and User-Agent may only appear once. A request that repeats them is malformed, and
        // joining the values would produce a host that is not usable, so the first one wins. The
        // remaining headers are list valued, where RFC 9110 makes repeated lines equivalent to a
        // single comma separated line.
        List singletonHeaders = ['host', 'user-agent'];
        Map headers = new HashMap();
        for (int i = 1; i < lines.length; i++) {
          if (lines[i].isEmpty()) {
            break;
          }
          int nameEnd = lines[i].indexOf(':');
          if (nameEnd < 1) {
            continue;
          }
          String name = lines[i].substring(0, nameEnd).trim().toLowerCase();
          String value = lines[i].substring(nameEnd + 1).trim();
          if (value.isEmpty()) {
            continue;
          }
          if (!headers.containsKey(name)) {
            headers[name] = [value];
          } else if (!singletonHeaders.contains(name)) {
            headers[name].add(value);
          }
        }

        Map headerFields = [
          'accept': 'accept',
          'cache-control': 'cache_control',
          'connection': 'connection',
          'host': 'host',
          'user-agent': 'user_agent',
          'x-forwarded-for': 'x_forwarded_for'
        ];
        for (entry in headerFields.entrySet()) {
          def values = headers[entry.getKey()];
          if (values != null) {
            request[entry.getValue()] = String.join(', ', values);
          }
        }
  - append:
      field: related.hosts
      tag: append_f5_bigip_log_request_host_into_related_hosts
      value: '{{{f5_bigip.log.request.host}}}'
      allow_duplicates: false
      ignore_failure: true
  - lowercase:
      field: related.hosts
      tag: lowercase_related_hosts
      ignore_missing: true
  - gsub:
      field: f5_bigip.log.request.user_agent
      pattern: '(\([^)]*)\+(https?://)'
      replacement: '$1%2b$2'
      ignore_missing: true
  - urldecode:
      field: f5_bigip.log.request.user_agent
      ignore_missing: true
      ignore_failure: true
  - user_agent:
      field: f5_bigip.log.request.user_agent
      ignore_missing: true
  - dissect:
      field: f5_bigip.log.request.protocol
      tag: dissect_request_protocol
      description: >-
        Pattern to extract network protocol and http version. The request line always reads HTTP
        even on a TLS virtual server, so it is only a fallback for the protocol BIG-IP reports.
      pattern: "%{_tmp.protocol}/%{http.version}"
      ignore_failure: true
  - set:
      field: network.protocol
      tag: set_network_protocol_from_request_line
      copy_from: _tmp.protocol
      if: ctx.network?.protocol == null
      ignore_empty_value: true
  - remove:
      field: _tmp
      tag: remove_tmp_protocol
      ignore_missing: true
  - lowercase:
      field: network.protocol
      tag: lowercase_network_protocol
      ignore_missing: true
  - script:
      lang: painless
      tag: script_to_set_url_full
      if: ctx.network?.protocol != null && ctx.f5_bigip?.log?.request?.host != null && ctx.f5_bigip?.log?.request?.path != null
      description: >-
        Build url.original from the request line. The Host header is client controlled, so hosts
        that cannot appear in a URL authority are left out rather than producing a URL that
        uri_parts would reject.
      source: |
        String host = ctx.f5_bigip.log.request.host;
        boolean isNameOrIPv4 = /^[\w.-]+(?::\d+)?$/.matcher(host).matches();
        boolean isBracketedIPv6 = /^\[[0-9A-Fa-f:.]+\](?::\d+)?$/.matcher(host).matches();
        if (!isNameOrIPv4 && !isBracketedIPv6) {
          return;
        }
        if (ctx.url == null) {
            ctx.url = new HashMap();
        }
        ctx.url.original = ctx.network.protocol + '://' + host + ctx.f5_bigip.log.request.path
  - uri_parts:
      field: url.original
      tag: uri_parts_url_original
      if: ctx.url?.original != null
      on_failure:
        - remove:
            field: url
            tag: remove_invalid_url
            ignore_missing: true
  - split:
      field: f5_bigip.log.request.x_forwarded_for
      tag: split_request_x_forwarded_for
      separator: ',\s*'
      ignore_missing: true
  # The header is whatever the client sent. Keep the raw values on this keyword field as evidence,
  # but only let addresses that parse reach related.ip, which is mapped as ip. The sibling field
  # below runs the same check from its own pipeline: Fleet rewrites only the first reference to a
  # given pipeline name in a file, so a single shared pipeline cannot be called from both places.
  - foreach:
      field: f5_bigip.log.request.x_forwarded_for
      tag: foreach_request_x_forwarded_for
      if: ctx.f5_bigip?.log?.request?.x_forwarded_for instanceof List
      processor:
        pipeline:
          name: '{{ IngestPipeline "pipeline_forwarded_ip_request" }}'
          tag: pipeline_forwarded_ip_for_request
  - remove:
      field: _tmp
      tag: remove_tmp_request_forwarded_ip
      ignore_missing: true
  - rename:
      field: json.request_status
      tag: rename_request_status
      target_field: f5_bigip.log.request.status
      ignore_missing: true
  - convert:
      field: json.response_code
      tag: convert_response_code_to_long
      target_field: f5_bigip.log.response.code
      if: ctx.json?.response_code != ''
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.route_domain
      tag: rename_route_domain
      target_field: f5_bigip.log.route_domain
      ignore_missing: true
  - rename:
      field: json.session_id
      tag: rename_session_id
      target_field: f5_bigip.log.session.id
      ignore_missing: true
  - rename:
      field: json.sig_ids
      tag: rename_sig_ids
      target_field: f5_bigip.log.sig.ids
      ignore_missing: true
  - rename:
      field: json.sig_names
      tag: rename_sig_names
      target_field: f5_bigip.log.sig.names
      ignore_missing: true
  - rename:
      field: json.staged_sig_ids
      tag: rename_staged_sig_ids
      target_field: f5_bigip.log.staged.sig.ids
      ignore_missing: true
  - rename:
      field: json.staged_sig_names
      tag: rename_staged_sig_names
      target_field: f5_bigip.log.staged.sig.names
      ignore_missing: true
  - rename:
      field: json.staged_threat_campaign_names
      tag: rename_staged_threat_campaign_names
      target_field: f5_bigip.log.staged.threat_campaign_names
      ignore_missing: true
  - rename:
      field: json.sub_violations
      tag: rename_sub_violations
      target_field: f5_bigip.log.sub_violations
      ignore_missing: true
  - rename:
      field: json.support_id
      tag: rename_support_id
      target_field: f5_bigip.log.support.id
      ignore_missing: true
  - rename:
      field: json.telemetryEventCategory
      tag: rename_telemetry_event_category
      target_field: f5_bigip.log.telemetry.event.category
      ignore_missing: true
  - rename:
      field: json.tenant
      tag: rename_tenant
      target_field: f5_bigip.log.tenant
      ignore_missing: true
  - rename:
      field: json.threat_campaign_names
      tag: rename_threat_campaign_names
      target_field: f5_bigip.log.threat_campaign_names
      ignore_missing: true
  - rename:
      field: json.uri
      tag: rename_uri
      target_field: f5_bigip.log.uri
      ignore_missing: true
  - convert:
      field: json.violation_rating
      tag: convert_violation_rating_to_long
      target_field: f5_bigip.log.violation.rating
      if: ctx.json?.violation_rating != ''
      type: long
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.violations
      tag: rename_violations
      target_field: f5_bigip.log.violations
      ignore_missing: true
  - rename:
      field: json.virus_name
      tag: rename_virus_name
      target_field: f5_bigip.log.virus_name
      ignore_missing: true
  - rename:
      field: json.web_application_name
      tag: rename_web_application_name
      target_field: f5_bigip.log.web_application_name
      ignore_missing: true
  - rename:
      field: json.websocket_direction
      tag: rename_websocket_direction
      target_field: f5_bigip.log.websocket.direction
      ignore_missing: true
  - rename:
      field: json.websocket_message_type
      tag: rename_websocket_message_type
      target_field: f5_bigip.log.websocket.message_type
      ignore_missing: true
  - split:
      field: json.x_forwarded_for_header_value
      separator: ',\s*'
      ignore_missing: true
  # Validate each X-Forwarded-For address BIG-IP reports independently. Keep parseable entries and
  # drop invalid ones so one bad value cannot fail the event or discard the rest of the chain.
  - foreach:
      field: json.x_forwarded_for_header_value
