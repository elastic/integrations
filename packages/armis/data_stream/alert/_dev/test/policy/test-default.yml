input: cel
vars:
  url: https://armis.example.com
  secret_key: test-secret-key
data_stream:
  vars:
    initial_interval: 24h
    interval: 5m
    page_size: 2000
    http_client_timeout: 30s
    enable_request_tracer: false
    tags:
      - forwarded
      - armis-alert
    preserve_original_event: false
