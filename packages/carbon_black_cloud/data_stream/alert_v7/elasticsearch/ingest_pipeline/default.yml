---
description: Pipeline for parsing Carbon Black Cloud alerts.
processors:
  # ecs fields
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_cac66847
      field: event.original
      target_field: json
      ignore_failure: true
  - fingerprint:
      tag: fingerprint_to_id_9c75a4ea
      fields:
        - json.id
        - json.detection_timestamp
        - json.backend_timestamp
        - json.backend_update_timestamp
      target_field: _id
      ignore_missing: true
  - set:
      tag: set_event_kind_39295792
      field: event.kind
      value: alert
  - rename:
      tag: rename_json_id_to_event_id_6438e920
      field: json.id
      target_field: event.id
      ignore_missing: true
  - date:
      tag: date_json_detection_timestamp_facccca1
      field: json.detection_timestamp
      if: ctx.json?.detection_timestamp != null && ctx.json.detection_timestamp != ''
      formats:
        - ISO8601
      on_failure:
        - remove:
            tag: remove_json_detection_timestamp_d0a72cc9
            field: json.detection_timestamp
        - append:
            tag: append_error_message_5901490e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_first_event_timestamp_to_event_start_6050eb25
      field: json.first_event_timestamp
      target_field: event.start
      if: ctx.json?.first_event_timestamp != null && ctx.json.first_event_timestamp != ''
      formats:
        - ISO8601
      on_failure:
        - remove:
            tag: remove_json_first_event_timestamp_bb49000b
            field: json.first_event_timestamp
        - append:
            tag: append_error_message_6f725a08
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_last_event_timestamp_to_event_end_b87d2ba6
      field: json.last_event_timestamp
      target_field: event.end
      if: ctx.json?.last_event_timestamp != null && ctx.json.last_event_timestamp != ''
      formats:
        - ISO8601
      on_failure:
        - remove:
            tag: remove_json_last_event_timestamp_e6bba1e8
            field: json.last_event_timestamp
        - append:
            tag: append_error_message_8035bc87
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_severity_to_event_severity_4f27090f
      field: json.severity
      target_field: event.severity
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_severity_e6961f0c
            field: json.severity
        - append:
            tag: append_error_message_218a012c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_reason_to_event_reason_44486c4c
      field: json.reason
      target_field: event.reason
      ignore_missing: true
  - convert:
      tag: convert_json_device_id_to_host_id_0442f346
      field: json.device_id
      target_field: host.id
      type: string
      ignore_missing: true
      ignore_failure: true
  - set:
      tag: set_host_os_type_b1a2b9f6
      field: host.os.type
      value: windows
      if: ctx.json?.device_os == 'WINDOWS'
  - set:
      tag: set_host_os_type_72cb5d5c
      field: host.os.type
      value: linux
      if: ctx.json?.device_os == 'LINUX'
  - set:
      tag: set_host_os_type_d13aee80
      field: host.os.type
      value: macos
      if: ctx.json?.device_os == 'MAC'
  - rename:
      tag: rename_json_device_os_version_to_host_os_version_814cc1b2
      field: json.device_os_version
      target_field: host.os.version
      ignore_missing: true
  - rename:
      tag: rename_json_device_name_to_host_hostname_b3415577
      field: json.device_name
      target_field: host.hostname
      ignore_missing: true
  - grok:
      tag: grok_host_hostname_d32c58c6
      field: host.hostname
      patterns:
        - '^(%{DATA:user.domain})\\(%{GREEDYDATA:host.hostname})$'
      ignore_missing: true
      ignore_failure: true
  - set:
      tag: set_host_name_9e5d6d7d
      field: host.name
      value: '{{{host.hostname}}}'
      ignore_failure: true
  - append:
      tag: append_related_hosts_e6462550
      field: related.hosts
      value: '{{{host.hostname}}}'
      if: ctx.host?.hostname != null
      allow_duplicates: false
      ignore_failure: true
  - grok:
      tag: grok_json_device_username_d83e6eba
      field: json.device_username
      patterns:
        - '^%{DATA:user.domain}\\%{GREEDYDATA:user.name}$'
        - '^%{EMAILADDRESS:user.email}$'
        - '^%{GREEDYDATA:user.name}$'
      ignore_missing: true
      ignore_failure: true
  - dissect:
      field: user.email
      pattern: '%{user.name}@%{user.domain}'
      tag: dissect_user_email_d5fb5c7e
      ignore_missing: true
      ignore_failure: true
      if: ctx.user?.name == null
  - append:
      tag: append_related_user_3b423052
      field: related.user
      value: '{{{user.name}}}'
      if: ctx.user?.name != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_user_36d4b55a
      field: related.user
      value: '{{{user.email}}}'
      if: ctx.user?.email != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hosts_6782fd8a
      field: related.hosts
      value: '{{{user.domain}}}'
      if: ctx.user?.domain != null
      allow_duplicates: false
      ignore_failure: true
  # carbon_black_cloud fields
  - date:
      tag: date_json_backend_timestamp_to_carbon_black_cloud_alert_backend_timestamp_34ad50bd
      field: json.backend_timestamp
      target_field: carbon_black_cloud.alert.backend_timestamp
      if: ctx.json?.backend_timestamp != null && ctx.json.backend_timestamp != ''
