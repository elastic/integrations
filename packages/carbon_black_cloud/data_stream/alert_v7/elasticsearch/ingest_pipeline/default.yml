        - append:
            tag: append_error_message_4d20aacb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_alert_url_to_carbon_black_cloud_alert_url_2a3290f0
      field: json.alert_url
      target_field: carbon_black_cloud.alert.url
      ignore_missing: true
  - rename:
      tag: rename_json_primary_event_id_to_carbon_black_cloud_alert_primary_event_id_1ed89a51
      field: json.primary_event_id
      target_field: carbon_black_cloud.alert.primary_event_id
      ignore_missing: true
  - rename:
      tag: rename_json_org_key_to_carbon_black_cloud_alert_organization_key_c3007686
      field: json.org_key
      target_field: carbon_black_cloud.alert.organization_key
      ignore_missing: true
  - rename:
      tag: rename_json_vendor_name_to_carbon_black_cloud_alert_vendor_name_fc678f6b
      field: json.vendor_name
      target_field: carbon_black_cloud.alert.vendor_name
      ignore_missing: true
  - rename:
      tag: rename_json_product_name_to_carbon_black_cloud_alert_product_name_47a6e685
      field: json.product_name
      target_field: carbon_black_cloud.alert.product_name
      ignore_missing: true
  - rename:
      tag: rename_json_serial_number_to_carbon_black_cloud_alert_serial_number_83a2706b
      field: json.serial_number
      target_field: carbon_black_cloud.alert.serial_number
      ignore_missing: true
  - rename:
      tag: rename_json_threat_id_to_carbon_black_cloud_alert_threat_id_274c15cb
      field: json.threat_id
      target_field: carbon_black_cloud.alert.threat_id
      ignore_missing: true
  - rename:
      tag: rename_json_policy_applied_to_carbon_black_cloud_alert_policy_applied_9de87c63
      field: json.policy_applied
      target_field: carbon_black_cloud.alert.policy_applied
      ignore_missing: true
  # carbon_black_cloud parent process fields & ecs parent process fields
  - rename:
      tag: rename_json_parent_name_to_process_parent_name_9ed2027c
      field: json.parent_name
      target_field: process.parent.name
      ignore_missing: true
  - set:
      tag: set_process_parent_executable_e7ef75a6
      field: process.parent.executable
      copy_from: process.parent.name
      ignore_empty_value: true
  - set:
      tag: set_carbon_black_cloud_alert_parent_name_2c2dfec3
      field: carbon_black_cloud.alert.parent.name
      copy_from: process.parent.name
      ignore_empty_value: true
  - rename:
      tag: rename_json_parent_cmdline_to_process_parent_command_line_0943c774
