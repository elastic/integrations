      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_remote_port_f4464cde
            field: json.remote_port
        - append:
            tag: append_error_message_406bb00d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_remote_ip_5c2fd30b
      field: json.remote_ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_remote_ip_c9171671
            field: json.remote_ip
        - append:
            tag: append_error_message_63034fe4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_local_port_fa86e864
      field: json.local_port
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_local_port_e0b8157b
            field: json.local_port
        - append:
            tag: append_error_message_1f0b2617
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_local_ip_caa4f9c1
      field: json.local_ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_local_ip_2682bf60
            field: json.local_ip
        - append:
            tag: append_error_message_c1abac9e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_c016e17f
      lang: painless
      source: |
        // These allocations may be futile, but will be cleaned up in the postamble.
        if (ctx.client == null) {
          ctx.client = new HashMap();
        }
        if (ctx.source == null) {
          ctx.source = new HashMap();
        }
        if (ctx.destination == null) {
          ctx.destination = new HashMap();
        }
        // Nulls inserted into the document will be cleaned up in the postamble.
        ctx.client.ip = ctx.json.local_ip;
        ctx.client.port = ctx.json.local_port;
        if (ctx.json?.netconn_inbound == true) {
          ctx.destination.ip = ctx.json?.local_ip;
          ctx.destination.port = ctx.json?.local_port;
          ctx.source.ip = ctx.json?.remote_ip;
          ctx.source.port = ctx.json?.remote_port;
          ctx.source.domain = ctx.json?.netconn_domain;
        } else {
          ctx.source.ip = ctx.json?.local_ip;
          ctx.source.port = ctx.json?.local_port;
          ctx.destination.ip = ctx.json?.remote_ip;
          ctx.destination.port = ctx.json?.remote_port;
          ctx.destination.domain = ctx.json?.netconn_domain;
        }     
  - append:
      tag: append_related_ip_30d15214
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_ip_c5270880
      field: related.ip
      value: '{{{client.ip}}}'
      if: ctx.client?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - convert:
      tag: convert_json_device_id_to_host_id_0442f346
