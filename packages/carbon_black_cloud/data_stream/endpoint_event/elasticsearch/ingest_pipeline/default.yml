---
description: Pipeline for parsing Carbon Black Cloud Endpoint Events.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_cac66847
      field: event.original
      target_field: json
      ignore_failure: true
  - set:
      tag: set__temp__device_timestamp_58cddea7
      field: _temp_.device_timestamp
      copy_from: json.device_timestamp
      on_failure:
        - remove:
            tag: remove_json_device_timestamp_20e3a9d2
            field: json.device_timestamp
        - append:
            tag: append_error_message_bfc22fd0
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_device_timestamp_2ea1217f
      field: json.device_timestamp
      if: ctx.json?.device_timestamp != null && ctx.json.device_timestamp != ''
      formats:
        - ISO8601
        - 'yyyy-MM-dd HH:mm:ss Z z'
        - 'yyyy-MM-dd HH:mm:ss.S Z z'
        - 'yyyy-MM-dd HH:mm:ss.SS Z z'
        - 'yyyy-MM-dd HH:mm:ss.SSS Z z'
        - 'yyyy-MM-dd HH:mm:ss.SSSS Z z'
        - 'yyyy-MM-dd HH:mm:ss.SSSSS Z z'
        - 'yyyy-MM-dd HH:mm:ss.SSSSSS Z z'
        - 'yyyy-MM-dd HH:mm:ss.SSSSSSS Z z'
      on_failure:
        - remove:
            tag: remove_json_device_timestamp_18eb17ac
            field: json.device_timestamp
        - append:
            tag: append_error_message_fe5a299a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_64aa551f
      lang: painless
      params:
        type_mapping:
          'endpoint.event.crossproc':
            category: [process]
            type: [info]
          'endpoint.event.filemod':
            category: [file]
            type: [change]
          'endpoint.event.fileless_scriptload':
            category: [process]
            type: [start]
          'endpoint.event.moduleload':
            category: [process]
            type: [start]
          'endpoint.event.netconn':
            category: [network]
            type: [connection]
          'endpoint.event.netconn_proxy':
            category: [network]
            type: [connection]
          'endpoint.event.procstart':
            category: [process]
            type: [start]
          'endpoint.event.regmod':
            category: [registry]
            type: [change]
          'endpoint.event.scriptload':
            category: [process, file]
            type: [start, access]
      if: ctx.json?.type != null
      source: |-
        def mapping = params.type_mapping[ctx.json.type];
        if (mapping == null) {
          return;
        }
        ctx.event.category = mapping.category;
        ctx.event.type = mapping.type;
      ignore_failure: true
  - rename:
      tag: rename_json_action_to_event_action_6ebb0784
      field: json.action
      target_field: event.action
      ignore_missing: true
  - rename:
      tag: rename_json_event_id_to_event_id_2f7e12eb
      field: json.event_id
      target_field: event.id
      ignore_missing: true
  - rename:
      tag: rename_json_event_description_to_event_reason_d11bf969
      field: json.event_description
      target_field: event.reason
      ignore_missing: true
  - rename:
      tag: rename_json_filemod_name_to_file_path_c219371b
      field: json.filemod_name
      target_field: file.path
      ignore_missing: true
  - rename:
      tag: rename_json_modload_name_to_dll_path_bc0b0c53
      field: json.modload_name
      target_field: dll.path
      ignore_missing: true
  - set:
      tag: set_network_transport_45fbc44f
      field: network.transport
      value: udp
      if: ctx.json?.netconn_protocol == 'PROTO_UDP'
  - set:
      tag: set_network_transport_5a8959fb
      field: network.transport
      value: tcp
      if: ctx.json?.netconn_protocol == 'PROTO_TCP'
  - set:
      tag: set_network_direction_9b3902e0
      field: network.direction
      value: inbound
      if: ctx.json?.netconn_inbound == true
  - set:
      tag: set_network_direction_204fa2ee
      field: network.direction
      value: outbound
      if: ctx.json?.netconn_inbound == false
  - convert:
      tag: convert_json_remote_port_762216d6
      field: json.remote_port
