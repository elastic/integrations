---
description: Pipeline for processing sample logs
processors:
  - drop:
      tag: drop_fc75cf8c
      if: ctx?.error?.statuscode != null

  - json:
      tag: json_message_to_admin_by_request_epm_events_c5ec8a69
      field: message
      target_field: admin_by_request_epm.events
      on_failure:
        - append:
            tag: append_error_message_4550e5af
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  - fingerprint:
      tag: fingerprint_97833378
      fields:
        - admin_by_request_epm.events.id
      target_field: "_id"
      on_failure:
        - append:
            tag: append_error_message_0282c5b6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  ####################
  # Scripts for processing input #
  ####################
  - script:
      tag: script_a3eb5add
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);

  - script:
      description: Convert Additional Info keys to snake case.
      tag: additional-info-keys-to-snake-case
      lang: painless
      source: |
        Map keysToSnakeCase(Map m) {
          def regex = /_?([a-z])([A-Z]+)/;
          def snakeCaseMap = [:];

          for (entry in m.entrySet()) {
            def k = entry.getKey();
            def v = entry.getValue();

            if (v instanceof Map) {
              v = keysToSnakeCase(v);
            } else if (v instanceof List) {
              for (int i = 0; i < v.size(); i++) {
                def item = v.get(i);
                if (item instanceof Map) {
                  v.set(i, keysToSnakeCase(item));
                }
              }
            }

            k = regex.matcher(k).replaceAll('$1_$2').toLowerCase();
            snakeCaseMap.put(k, v);
          }
          return snakeCaseMap;
        }

        if (ctx.admin_by_request_epm.events != null) {
          ctx.admin_by_request_epm.events = keysToSnakeCase(ctx.admin_by_request_epm.events);
        }

  ####################
  # ECS Fields #
  ####################
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'

  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event

  - append:
      tag: append_event_category_1c667e2c
      field: event.category
      value: configuration

  - append:
      tag: append_event_type_8a66ccaa
      field: event.type
      value: info

  - set:
      tag: set_event_dataset_9d46b14d
      field: event.dataset
      value: admin_by_request_epm.events

  - set:
      tag: set_event_module_d7192282
      field: event.module
      value: admin_by_request_epm

  - set:
      tag: set_host_hostname_d1aa4978
      field: host.hostname
      copy_from: admin_by_request_epm.events.computer_name
      ignore_empty_value: true

  - append:
      tag: append_related_hosts_c061f442
      field: related.hosts
      value: '{{{admin_by_request_epm.events.computer_name}}}'
      allow_duplicates: false
      if: ctx.admin_by_request_epm.events.computer_name != null

  - set:
      tag: set_user_name_9c80715d
      field: user.name
      copy_from: admin_by_request_epm.events.user_name
      ignore_empty_value: true

  - set:
      tag: set_url_original_92e5bf2a
      field: url.original
      copy_from: admin_by_request_epm.events.audit_log_url
      ignore_empty_value: true

  - set:
      tag: set_file_name_5aca4c83
      field: file.name
      copy_from: admin_by_request_epm.events.application.file
      ignore_empty_value: true

  - set:
      tag: set_file_path_8fab8a50
      field: file.path
      copy_from: admin_by_request_epm.events.application.path
      ignore_empty_value: true

  - set:
      tag: set_hash_sha256_4346eb5a
      field: hash.sha256
      copy_from: admin_by_request_epm.events.application.sha256
      ignore_empty_value: true

  - append:
      tag: append_related_hash_c47a7a96
      field: related.hash
      value: '{{{admin_by_request_epm.events.application.sha256}}}'
      allow_duplicates: false
      if: ctx.admin_by_request_epm.events.application?.sha256 != null

  - remove:
      tag: remove_291e7fed
      field:
        - message
      ignore_missing: true
