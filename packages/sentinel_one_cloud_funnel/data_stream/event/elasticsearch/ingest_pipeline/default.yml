description: Pipeline for processing Event logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - gsub:
      tag: gsub_message_9e16a0bd
      field: message
      pattern: '\\\\\\\\'
      replacement: '\\\\'
      ignore_missing: true
      if: ctx.message instanceof String && ctx.message.contains('\\\\\\\\')
      on_failure:
        - append:
            tag: append_error_message_b5b074f8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - json:
      field: event.original
      tag: json_event_original_c3a1053e
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_a6e0e953
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      if: ctx.json != null
      tag: script_to_change_name_of_k8sCluster_containerImage_2bc33285
      description: Change the name of k8sCluster containerImage field.
      source: >-
        ctx.json.put("k8sCluster.containerImage.value", ctx.json['k8sCluster.containerImage']);
        ctx.json.remove('k8sCluster.containerImage');
      on_failure:
        - append:
            tag: append_error_message_2f5f3f4d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_expand_and_rename_json_fields
      lang: painless
      if: ctx.json instanceof Map
      description: >-
        Expand the dotted keys in json into objects. Keys listed in params.renames
        are moved to the given field instead. Other keys stay under json for the
        processors below. This is done in Painless as a performance optimization.
      source: |-
        boolean put(Map m, String path, def value) {
          int start = 0;
          for (int dot = path.indexOf('.'); dot != -1; dot = path.indexOf('.', start)) {
            String key = path.substring(start, dot);
            def child = m.get(key);
            if (child == null) {
              child = new HashMap();
              m.put(key, child);
            } else if (!(child instanceof Map)) {
              return false;
            }
            m = (Map) child;
            start = dot + 1;
          }
          String leaf = path.substring(start);
          if (m.get(leaf) instanceof Map) {
            return false;
          }
          m.put(leaf, value);
          return true;
        }
        Map flat = ctx.json;
        ctx.json = new HashMap();
        List conflicts = new ArrayList();
        for (def e : flat.entrySet()) {
          if (!put(ctx, params.renames[e.getKey()] ?: 'json.' + e.getKey(), e.getValue())) {
            conflicts.add(e.getKey());
          }
        }
        if (!conflicts.isEmpty()) {
          throw new IllegalArgumentException('fields not expanded due to conflicts: ' + conflicts);
        }
