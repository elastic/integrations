  - script:
      tag: script_7c2a3c3b
      # This must happen after the pipelines since the process pipeline also touches process.command_line.
      description: Implements Windows-like SplitCommandLine
      lang: painless
      if: |-
        (ctx.process?.command_line != null && ctx.process.command_line != "") || 
        (ctx.process?.parent?.command_line != null && ctx.process.parent.command_line != "")
      source: |-
        // appendBSBytes appends n '\\' bytes to b and returns the resulting slice.
        def appendBSBytes(StringBuilder b, int n) {
            for (; n > 0; n--) {
                b.append('\\');
            }
            return b;
        }

        // readNextArg splits command line string into next
        // argument and command line remainder offset.
        def readNextArg(String line, int offset) {
            def b = new StringBuilder();
            boolean inquote;
            int nslash;
            for (; offset < line.length(); offset++) {
                def c = line.charAt(offset);
                if (c == (char)' ' || c == (char)0x09) {
                    if (!inquote) {
                        return [
                            "arg":  appendBSBytes(b, nslash).toString(),
                            "offset": offset+1
                        ];
                    }
                } else if (c == (char)'"') {
                    b = appendBSBytes(b, nslash/2);
                    if (nslash%2 == 0) {
                        // use "Prior to 2008" rule from
                        // http://daviddeley.com/autohotkey/parameters/parameters.htm
                        // section 5.2 to deal with double double quotes
                        if (inquote && offset+1 < line.length() && line.charAt(offset+1) == (char)'"') {
                            b.append(c);
                            offset++;
                        }
                        inquote = !inquote;
                    } else {
                        b.append(c);
                    }
                    nslash = 0;
                    continue;
                } else if (c == (char)'\\') {
                    nslash++;
                    continue;
                }
                b = appendBSBytes(b, nslash);
                nslash = 0;
                b.append(c);
            }
            return [
                "arg":  appendBSBytes(b, nslash).toString(), 
                "offset": line.length()
            ];
        }

        // commandLineToArgv splits a command line into individual argument
        // strings, following the Windows conventions documented
        // at http://daviddeley.com/autohotkey/parameters/parameters.htm#WINARGV
        // Original implementation found at: https://github.com/golang/go/commit/39c8d2b7faed06b0e91a1ad7906231f53aab45d1
        def commandLineToArgv(String line) {
            def args = new ArrayList();
            for (int i = 0; i < line.length();) {
                if (line.charAt(i) == (char)' ' || line.charAt(i) == (char)0x09) {
                    i++;
                    continue;
                }
                def next = readNextArg(line, i);
                i = next.offset;
                if (next.arg == '') {
                    // Empty strings will be removed later so don't bother adding them.
                    continue;
                }
                args.add(next.arg);
            }
            return args;
        }

        def cmd = ctx.process?.command_line;
        if (cmd != null && cmd != "") {
          ctx.process.args = commandLineToArgv(cmd);
          ctx.process.args_count = ctx.process.args.length;
        }

        def parentCmd = ctx.process?.parent?.command_line;
        if (parentCmd != null && parentCmd != "") {
          ctx.process.parent.args = commandLineToArgv(parentCmd);
          ctx.process.parent.args_count = ctx.process.parent.args.length;
        }
