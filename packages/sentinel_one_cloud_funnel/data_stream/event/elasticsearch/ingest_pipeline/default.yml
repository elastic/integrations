---
description: Pipeline for processing Event logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - gsub:
      tag: gsub_message_9e16a0bd
      field: message
      pattern: '\\\\\\\\'
      replacement: '\\\\'
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_b5b074f8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - json:
      field: event.original
      tag: 'json_event_original'
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_a6e0e953
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      if: ctx.json != null
      tag: 'script_to_change_name_of_k8sCluster_containerImage'
      description: Change the name of k8sCluster containerImage field.
      source: >-
        ctx.json.put("k8sCluster.containerImage.value", ctx.json['k8sCluster.containerImage']);
        ctx.json.remove('k8sCluster.containerImage');
      on_failure:
        - append:
            tag: append_error_message_2f5f3f4d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - dot_expander:
      field: '*'
      tag: 'dot_expander'
      path: json
      on_failure:
        - append:
            tag: append_error_message_8702f43e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      tag: 'script_to_remove_quotes_from_begining_and_end'
      description: Script to remove quotes from begining and end from a field.
      source: |
        String trimQuotes(def doubleQuote, def v) {
          if (v.startsWith(doubleQuote) && v.endsWith(doubleQuote)) {
            v = v.substring(1, v.length() - 1);
          }
          return v;
        }
        def v1 = ctx.json?.src?.process?.parent?.cmdline;
        def v2 = ctx.json?.tgt?.process?.cmdline;
        if (v1 instanceof String && v1 != null) {
          v1 = trimQuotes(params.double_quote, v1);
          ctx.json.src.process.parent.put("cmdline", v1);
        }
        if (v2 instanceof String && v2 != null) {
          v2 = trimQuotes(params.double_quote, v2);
          ctx.json.tgt.process.put("cmdline", v2);
        }
      params:
        double_quote: "\""
      on_failure:
        - append:
            tag: append_error_message_7050d87d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.event.time
      tag: 'date_json_event_time'
      target_field: sentinel_one_cloud_funnel.event.time
      formats:
        - ISO8601
        - epoch_millis
      if: ctx.json?.event?.time != null && ctx.json.event.time != ''
      on_failure:
        - append:
            tag: append_error_message_86f53aaf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.event.time
      tag: 'date_timestamp'
      formats:
        - ISO8601
        - epoch_millis
      if: ctx.json?.event?.time != null && ctx.json.event.time != ''
      on_failure:
        - append:
