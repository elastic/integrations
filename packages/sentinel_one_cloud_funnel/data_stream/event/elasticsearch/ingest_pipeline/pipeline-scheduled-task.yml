---
description: Pipeline for processing Scheduled Task Event logs.
processors:
  - date:
      field: json.tgt.file.creationTime
      tag: 'date_json_tgt_file_creationTime'
      target_field: sentinel_one_cloud_funnel.event.tgt.file.creation_time
      formats:
        - ISO8601
        - epoch_millis
      if: ctx.json?.tgt?.file?.creationTime != null && ctx.json.tgt.file.creationTime != ''
      on_failure:
        - append:
            tag: append_error_message_3a00d0dc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_file_created_d1ec61e1
      field: file.created
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.creation_time
      ignore_empty_value: true
  - rename:
      tag: rename_json_tgt_file_extension_to_sentinel_one_cloud_funnel_event_tgt_file_extension_0c7969fc
      field: json.tgt.file.extension
      target_field: sentinel_one_cloud_funnel.event.tgt.file.extension
      ignore_missing: true
  - set:
      tag: set_file_extension_e5c5c6d4
      field: file.extension
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.extension
      ignore_empty_value: true
  - rename:
      tag: rename_json_tgt_file_md5_to_sentinel_one_cloud_funnel_event_tgt_file_md5_f59548a0
      field: json.tgt.file.md5
      target_field: sentinel_one_cloud_funnel.event.tgt.file.md5
      ignore_missing: true
  - set:
      tag: set_file_hash_md5_b5abcf60
      field: file.hash.md5
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.md5
      ignore_empty_value: true
  - append:
      tag: append_related_hash_6af42da3
      field: related.hash
      value: '{{{file.hash.md5}}}'
      allow_duplicates: false
      if: ctx.file?.hash?.md5 != null
  - rename:
      tag: rename_json_tgt_file_sha1_to_sentinel_one_cloud_funnel_event_tgt_file_sha1_4685387e
      field: json.tgt.file.sha1
      target_field: sentinel_one_cloud_funnel.event.tgt.file.sha1
      ignore_missing: true
  - set:
      tag: set_file_hash_sha1_5c6ba116
      field: file.hash.sha1
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.sha1
      ignore_empty_value: true
  - append:
      tag: append_related_hash_b56c7961
      field: related.hash
      value: '{{{file.hash.sha1}}}'
      allow_duplicates: false
      if: ctx.file?.hash?.sha1 != null
  - rename:
      tag: rename_json_tgt_file_sha256_to_sentinel_one_cloud_funnel_event_tgt_file_sha256_94584cca
      field: json.tgt.file.sha256
      target_field: sentinel_one_cloud_funnel.event.tgt.file.sha256
      ignore_missing: true
  - set:
      tag: set_file_hash_sha256_df14789e
      field: file.hash.sha256
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.sha256
      ignore_empty_value: true
  - append:
      tag: append_related_hash_017aef51
      field: related.hash
      value: '{{{file.hash.sha256}}}'
      allow_duplicates: false
      if: ctx.file?.hash?.sha256 != null
  - date:
      field: json.tgt.file.modificationTime
      tag: 'date_json_tgt_file_modificationTime'
      target_field: sentinel_one_cloud_funnel.event.tgt.file.modification_time
      formats:
        - ISO8601
        - epoch_millis
      if: ctx.json?.tgt?.file?.modificationTime != null && ctx.json.tgt.file.modificationTime != ''
      on_failure:
        - append:
            tag: append_error_message_d1a23c4b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_file_mtime_88ff3fe4
      field: file.mtime
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.modification_time
      ignore_empty_value: true
  - rename:
      tag: rename_json_tgt_file_path_to_sentinel_one_cloud_funnel_event_tgt_file_path_39609c16
      field: json.tgt.file.path
      target_field: sentinel_one_cloud_funnel.event.tgt.file.path
      ignore_missing: true
  - set:
      tag: set_file_path_527bee9a
      field: file.path
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.path
      ignore_empty_value: true
  - convert:
      field: json.tgt.file.size
      tag: 'convert_json_tgt_file_size'
      target_field: sentinel_one_cloud_funnel.event.tgt.file.size
      type: long
      ignore_missing: true
      if: ctx.json?.tgt?.file?.size != ''
      on_failure:
        - append:
            tag: append_error_message_96037225
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_file_size_53ce742a
      field: file.size
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.size
      ignore_empty_value: true
  - rename:
      tag: rename_json_tgt_file_type_to_sentinel_one_cloud_funnel_event_tgt_file_type_d8855d28
      field: json.tgt.file.type
      target_field: sentinel_one_cloud_funnel.event.tgt.file.type
      ignore_missing: true
  - set:
      tag: set_file_type_6b11f406
      field: file.type
      copy_from: sentinel_one_cloud_funnel.event.tgt.file.type
      ignore_empty_value: true
  - rename:
      tag: rename_json_task_name_to_sentinel_one_cloud_funnel_event_task_name_89d63b66
      field: json.task.name
      target_field: sentinel_one_cloud_funnel.event.task.name
      ignore_missing: true
  - rename:
      tag: rename_json_task_path_to_sentinel_one_cloud_funnel_event_task_path_a1b7920a
      field: json.task.path
      target_field: sentinel_one_cloud_funnel.event.task.path
      ignore_missing: true
  - rename:
      tag: rename_json_tgt_file_description_to_sentinel_one_cloud_funnel_event_tgt_file_description_54771acc
      field: json.tgt.file.description
      target_field: sentinel_one_cloud_funnel.event.tgt.file.description
      ignore_missing: true
  - rename:
      tag: rename_json_tgt_file_id_to_sentinel_one_cloud_funnel_event_tgt_file_id_76a97c5e
      field: json.tgt.file.id
      target_field: sentinel_one_cloud_funnel.event.tgt.file.id
      ignore_missing: true
  - rename:
      tag: rename_json_tgt_file_internalName_to_sentinel_one_cloud_funnel_event_tgt_file_internal_name_84e0ac81
      field: json.tgt.file.internalName
      target_field: sentinel_one_cloud_funnel.event.tgt.file.internal_name
      ignore_missing: true
  - convert:
      field: json.tgt.file.isExecutable
      tag: 'convert_json_tgt_file_isExecutable'
      target_field: sentinel_one_cloud_funnel.event.tgt.file.is_executable
      type: boolean
      ignore_missing: true
      if: ctx.json?.tgt?.file?.isExecutable != ''
      on_failure:
        - append:
            tag: append_error_message_7406da9a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_tgt_file_location_to_sentinel_one_cloud_funnel_event_tgt_file_location_90526cb6
      field: json.tgt.file.location
      target_field: sentinel_one_cloud_funnel.event.tgt.file.location
      ignore_missing: true
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
