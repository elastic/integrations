---
description: Pipeline for processing Module Event logs.
processors:
  - rename:
      tag: rename_json_module_md5_to_sentinel_one_cloud_funnel_event_module_md5_a1cc2140
      field: json.module.md5
      target_field: sentinel_one_cloud_funnel.event.module.md5
      ignore_missing: true
  - append:
      tag: append_related_hash_56e48f64
      field: related.hash
      value: '{{{sentinel_one_cloud_funnel.event.module.md5}}}'
      allow_duplicates: false
      if: ctx.sentinel_one_cloud_funnel?.event?.module?.md5 != null
  - rename:
      tag: rename_json_module_path_to_sentinel_one_cloud_funnel_event_module_path_09423480
      field: json.module.path
      target_field: sentinel_one_cloud_funnel.event.module.path
      ignore_missing: true
  - rename:
      tag: rename_json_module_sha1_to_sentinel_one_cloud_funnel_event_module_sha1_bc0e7c88
      field: json.module.sha1
      target_field: sentinel_one_cloud_funnel.event.module.sha1
      ignore_missing: true
  - append:
      tag: append_related_hash_a56fc778
      field: related.hash
      value: '{{{sentinel_one_cloud_funnel.event.module.sha1}}}'
      allow_duplicates: false
      if: ctx.sentinel_one_cloud_funnel?.event?.module?.sha1 != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
