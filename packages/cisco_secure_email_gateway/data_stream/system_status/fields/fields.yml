- name: cisco_secure_email_gateway.system_status
  type: group
  description: Cisco Secure Email Gateway overall system status.
  fields:
    - name: rates
      type: group
      fields:
        - name: messages_received
          type: group
          fields:
            - name: one_min
              type: float
              metric_type: gauge
              description: Messages received per minute (1-minute average).
            - name: five_min
              type: float
              metric_type: gauge
              description: Messages received per minute (5-minute average).
            - name: fifteen_min
              type: float
              metric_type: gauge
              description: Messages received per minute (15-minute average).
        - name: delivered_recipients
          type: group
          fields:
            - name: one_min
              type: float
              metric_type: gauge
              description: Delivered recipients per minute (1-minute average).
            - name: five_min
              type: float
              metric_type: gauge
              description: Delivered recipients per minute (5-minute average).
            - name: fifteen_min
              type: float
              metric_type: gauge
              description: Delivered recipients per minute (15-minute average).
        - name: hard_bounced_recipients
          type: group
          fields:
            - name: one_min
              type: float
              metric_type: gauge
              description: Hard bounced recipients per minute (1-minute average).
            - name: five_min
              type: float
              metric_type: gauge
              description: Hard bounced recipients per minute (5-minute average).
            - name: fifteen_min
              type: float
              metric_type: gauge
              description: Hard bounced recipients per minute (15-minute average).
        - name: soft_bounced_events
          type: group
          fields:
            - name: one_min
              type: float
              metric_type: gauge
              description: Soft bounced events per minute (1-minute average).
            - name: five_min
              type: float
              metric_type: gauge
              description: Soft bounced events per minute (5-minute average).
            - name: fifteen_min
              type: float
              metric_type: gauge
              description: Soft bounced events per minute (15-minute average).
    - name: gauges
      type: group
      fields:
        - name: overall_cpu_load_pct
          type: float
          metric_type: gauge
          unit: percent
          description: Overall CPU load percentage.
        - name: ram_utilization_pct
          type: float
          metric_type: gauge
          unit: percent
          description: RAM utilization percentage.
        - name: disk_io_utilization_pct
          type: float
          metric_type: gauge
          unit: percent
          description: Disk I/O utilization percentage.
        - name: total_queue_utilized_pct
          type: float
          metric_type: gauge
          unit: percent
          description: Total mail queue utilization percentage.
        - name: msgs_in_work_queue
          type: long
          metric_type: gauge
          description: Number of messages in the work queue.
        - name: msgs_in_quarantine
          type: long
          metric_type: gauge
          description: Number of messages in quarantine.
        - name: total_active_recipients
          type: long
          metric_type: gauge
          description: Total active recipients.
        - name: current_incoming_connections
          type: long
          metric_type: gauge
          description: Current number of incoming SMTP connections.
        - name: current_outgoing_connections
          type: long
          metric_type: gauge
          description: Current number of outgoing SMTP connections.
        - name: dest_objects_in_memory
          type: long
          metric_type: gauge
          description: Number of destination objects held in memory.
    - name: counters
      type: group
      fields:
        - name: messages_received_uptime
          type: long
          metric_type: counter
          description: Total messages received since system start.
        - name: delivered_recipients_uptime
          type: long
          metric_type: counter
          description: Total delivered recipients since system start.
        - name: soft_bounced_events_uptime
          type: long
          metric_type: counter
          description: Total soft bounce events since system start.
        - name: rejected_recipients_uptime
          type: long
          metric_type: counter
          description: Total rejected recipients since system start.
        - name: dropped_messages_uptime
          type: long
          metric_type: counter
          description: Total dropped messages since system start.
        - name: total_hard_bounces_uptime
          type: long
          metric_type: counter
          description: Total hard bounces since system start.
    - name: mail_system_status
      type: group
      fields:
        - name: system_status
          type: keyword
          description: Overall mail system status (e.g. Online, Offline).
        - name: up_since
          type: keyword
          description: Human-readable system uptime string.
        - name: oldest_message
          type: keyword
          description: Age of the oldest message in the queue.
    - name: version
      type: group
      fields:
        - name: model
          type: keyword
          description: ESA hardware or virtual model identifier.
        - name: operating_system
          type: keyword
          description: AsyncOS version string.
        - name: serial_number
          type: keyword
          description: ESA serial number.
        - name: raid_status
          type: keyword
          description: RAID status of the appliance.
