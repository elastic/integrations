title: "Cisco Secure Email Gateway System Status"
type: metrics
streams:
  - input: cel
    title: Cisco Secure Email Gateway system status metrics
    description: Collect system status, rates, gauges and counters from the Cisco ESA REST API.
    template_path: cel.yml.hbs
    vars:
      - name: hosts
        type: text
        title: ESA Nodes
        description: "List of Cisco ESA node base URLs to poll (e.g. https://esa1.example.com). Add one entry per node."
        required: true
        show_user: true
        multi: true
        default:
          - https://esa.example.com
      - name: username
        type: text
        title: Username
        description: Username for ESA API basic authentication.
        required: true
        show_user: true
      - name: password
        type: password
        title: Password
        description: Password for ESA API basic authentication.
        required: true
        show_user: true
        secret: true
      - name: interval
        type: text
        title: Collection Interval
        description: How often to poll the ESA API (e.g. 5m, 10m).
        required: true
        show_user: true
        default: 5m
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: |
          SSL/TLS configuration for API requests. To disable certificate verification
          (e.g. for self-signed certs), set: verification_mode: none
        required: false
        show_user: true
        multi: false
        default: ""
      - name: proxy_url
        type: text
        title: Proxy URL
        description: URL of the HTTP proxy to use for API requests.
        required: false
        show_user: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Default is 30s.
        required: false
        show_user: false
        default: 30s
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracer
        description: >-
          The request tracer logs HTTP requests and responses for debugging. Enabling this compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - cisco-secure-email-gateway-system-status
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve Original Event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: Processors to apply to events before indexing.
        required: false
        show_user: false
