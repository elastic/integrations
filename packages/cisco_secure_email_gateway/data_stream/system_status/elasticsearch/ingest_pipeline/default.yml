---
description: Pipeline for Cisco Secure Email Gateway system status metrics.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: "8.17.0"
  - set:
      tag: set_event_kind
      field: event.kind
      value: metric
  - append:
      tag: set_event_category
      field: event.category
      value: host
      allow_duplicates: false
  - append:
      tag: set_event_type
      field: event.type
      value: info
      allow_duplicates: false
  - rename:
      tag: rename_host_name
      field: host.name
      target_field: host.hostname
      ignore_missing: true
  - set:
      tag: set_event_original
      field: event.original
      copy_from: message
      ignore_failure: true
      if: "ctx.tags != null && ctx.tags.contains('preserve_original_event')"
  - json:
      tag: parse_message_json
      field: message
      target_field: _tmp
      if: ctx.message != null && ctx.message != ""
      on_failure:
        - set:
            tag: set_parse_error_message
            field: error.message
            value: "Failed to parse JSON response: {{{_ingest.on_failure_message}}}"
  - rename:
      tag: rename_rates_msg_received_1m
      field: _tmp.data.resultSet.rates.0.messages_received_rate_one
      target_field: cisco_secure_email_gateway.system_status.rates.messages_received.one_min
      ignore_missing: true
  - rename:
      tag: rename_rates_msg_received_5m
      field: _tmp.data.resultSet.rates.0.messages_received_rate_five
      target_field: cisco_secure_email_gateway.system_status.rates.messages_received.five_min
      ignore_missing: true
  - rename:
      tag: rename_rates_msg_received_15m
      field: _tmp.data.resultSet.rates.0.messages_received_rate_fifteen
      target_field: cisco_secure_email_gateway.system_status.rates.messages_received.fifteen_min
      ignore_missing: true
  - rename:
      tag: rename_rates_delivered_1m
      field: _tmp.data.resultSet.rates.0.delivered_recipients_rate_one
      target_field: cisco_secure_email_gateway.system_status.rates.delivered_recipients.one_min
      ignore_missing: true
  - rename:
      tag: rename_rates_delivered_5m
      field: _tmp.data.resultSet.rates.0.delivered_recipients_rate_five
      target_field: cisco_secure_email_gateway.system_status.rates.delivered_recipients.five_min
      ignore_missing: true
  - rename:
      tag: rename_rates_delivered_15m
      field: _tmp.data.resultSet.rates.0.delivered_recipients_rate_fifteen
      target_field: cisco_secure_email_gateway.system_status.rates.delivered_recipients.fifteen_min
      ignore_missing: true
  - rename:
      tag: rename_rates_hard_bounce_1m
      field: _tmp.data.resultSet.rates.0.hard_bounced_recipients_rate_one
      target_field: cisco_secure_email_gateway.system_status.rates.hard_bounced_recipients.one_min
      ignore_missing: true
  - rename:
      tag: rename_rates_hard_bounce_5m
      field: _tmp.data.resultSet.rates.0.hard_bounced_recipients_rate_five
      target_field: cisco_secure_email_gateway.system_status.rates.hard_bounced_recipients.five_min
      ignore_missing: true
  - rename:
      tag: rename_rates_hard_bounce_15m
      field: _tmp.data.resultSet.rates.0.hard_bounced_recipients_rate_fifteen
      target_field: cisco_secure_email_gateway.system_status.rates.hard_bounced_recipients.fifteen_min
      ignore_missing: true
  - rename:
      tag: rename_rates_soft_bounce_1m
      field: _tmp.data.resultSet.rates.0.soft_bounced_events_rate_one
      target_field: cisco_secure_email_gateway.system_status.rates.soft_bounced_events.one_min
      ignore_missing: true
  - rename:
      tag: rename_rates_soft_bounce_5m
      field: _tmp.data.resultSet.rates.0.soft_bounced_events_rate_five
      target_field: cisco_secure_email_gateway.system_status.rates.soft_bounced_events.five_min
      ignore_missing: true
  - rename:
      tag: rename_rates_soft_bounce_15m
      field: _tmp.data.resultSet.rates.0.soft_bounced_events_rate_fifteen
      target_field: cisco_secure_email_gateway.system_status.rates.soft_bounced_events.fifteen_min
      ignore_missing: true
  - rename:
      tag: rename_gauges_work_queue
      field: _tmp.data.resultSet.gauges.0.msgs_in_work_queue
      target_field: cisco_secure_email_gateway.system_status.gauges.msgs_in_work_queue
      ignore_missing: true
  - rename:
      tag: rename_gauges_quarantine
      field: _tmp.data.resultSet.gauges.0.msgs_in_quarantine
      target_field: cisco_secure_email_gateway.system_status.gauges.msgs_in_quarantine
      ignore_missing: true
  - rename:
      tag: rename_gauges_active_recipients
      field: _tmp.data.resultSet.gauges.0.total_active_recipients
      target_field: cisco_secure_email_gateway.system_status.gauges.total_active_recipients
      ignore_missing: true
  - rename:
      tag: rename_gauges_incoming_conn
      field: _tmp.data.resultSet.gauges.0.current_incoming_connections
      target_field: cisco_secure_email_gateway.system_status.gauges.current_incoming_connections
      ignore_missing: true
  - rename:
      tag: rename_gauges_outgoing_conn
      field: _tmp.data.resultSet.gauges.0.current_outgoing_connections
      target_field: cisco_secure_email_gateway.system_status.gauges.current_outgoing_connections
      ignore_missing: true
  - rename:
      tag: rename_gauges_dest_objects
      field: _tmp.data.resultSet.gauges.0.dest_objects_in_memory
      target_field: cisco_secure_email_gateway.system_status.gauges.dest_objects_in_memory
      ignore_missing: true
  - gsub:
      tag: gsub_cpu_load_pct
      field: _tmp.data.resultSet.gauges.0.overall_cpu_load
      pattern: '%'
      replacement: ''
      ignore_missing: true
  - convert:
      tag: convert_cpu_load_pct
      field: _tmp.data.resultSet.gauges.0.overall_cpu_load
      target_field: cisco_secure_email_gateway.system_status.gauges.overall_cpu_load_pct
      type: float
      ignore_missing: true
  - gsub:
      tag: gsub_ram_utilization_pct
      field: _tmp.data.resultSet.gauges.0.ram_utilization
      pattern: '%'
      replacement: ''
      ignore_missing: true
  - convert:
      tag: convert_ram_utilization_pct
      field: _tmp.data.resultSet.gauges.0.ram_utilization
      target_field: cisco_secure_email_gateway.system_status.gauges.ram_utilization_pct
      type: float
      ignore_missing: true
  - gsub:
      tag: gsub_disk_io_pct
      field: _tmp.data.resultSet.gauges.0.disk_io_utilization
      pattern: '%'
      replacement: ''
      ignore_missing: true
  - convert:
      tag: convert_disk_io_pct
      field: _tmp.data.resultSet.gauges.0.disk_io_utilization
      target_field: cisco_secure_email_gateway.system_status.gauges.disk_io_utilization_pct
      type: float
      ignore_missing: true
  - gsub:
      tag: gsub_queue_utilized_pct
      field: _tmp.data.resultSet.gauges.0.total_queue_utilized
      pattern: '%'
      replacement: ''
      ignore_missing: true
  - convert:
      tag: convert_queue_utilized_pct
      field: _tmp.data.resultSet.gauges.0.total_queue_utilized
      target_field: cisco_secure_email_gateway.system_status.gauges.total_queue_utilized_pct
      type: float
      ignore_missing: true
  - rename:
      tag: rename_mail_system_status
      field: _tmp.data.resultSet.mail_system_status.0.system_status
      target_field: cisco_secure_email_gateway.system_status.mail_system_status.system_status
      ignore_missing: true
  - rename:
      tag: rename_mail_up_since
      field: _tmp.data.resultSet.mail_system_status.0.up_since
      target_field: cisco_secure_email_gateway.system_status.mail_system_status.up_since
      ignore_missing: true
  - rename:
      tag: rename_mail_oldest_message
      field: _tmp.data.resultSet.mail_system_status.0.oldest_message
      target_field: cisco_secure_email_gateway.system_status.mail_system_status.oldest_message
      ignore_missing: true
  - rename:
      tag: rename_version_model
      field: _tmp.data.resultSet.version_details.0.model
      target_field: cisco_secure_email_gateway.system_status.version.model
      ignore_missing: true
  - rename:
      tag: rename_version_os
      field: _tmp.data.resultSet.version_details.0.operating_system
      target_field: cisco_secure_email_gateway.system_status.version.operating_system
      ignore_missing: true
  - rename:
      tag: rename_version_serial
      field: _tmp.data.resultSet.version_details.0.serial_number
      target_field: cisco_secure_email_gateway.system_status.version.serial_number
      ignore_missing: true
  - rename:
      tag: rename_version_raid
      field: _tmp.data.resultSet.version_details.0.raid_status
      target_field: cisco_secure_email_gateway.system_status.version.raid_status
      ignore_missing: true
  - rename:
      tag: rename_counter_msg_received
      field: _tmp.data.resultSet.counters.0.messages_received_uptime
      target_field: cisco_secure_email_gateway.system_status.counters.messages_received_uptime
      ignore_missing: true
  - rename:
      tag: rename_counter_delivered
      field: _tmp.data.resultSet.counters.0.delivered_recipients_uptime
      target_field: cisco_secure_email_gateway.system_status.counters.delivered_recipients_uptime
      ignore_missing: true
  - rename:
      tag: rename_counter_soft_bounce
      field: _tmp.data.resultSet.counters.0.soft_bounced_events_uptime
      target_field: cisco_secure_email_gateway.system_status.counters.soft_bounced_events_uptime
      ignore_missing: true
  - rename:
      tag: rename_counter_rejected
      field: _tmp.data.resultSet.counters.0.rejected_recipients_uptime
      target_field: cisco_secure_email_gateway.system_status.counters.rejected_recipients_uptime
      ignore_missing: true
  - rename:
      tag: rename_counter_dropped
      field: _tmp.data.resultSet.counters.0.dropped_messages_uptime
      target_field: cisco_secure_email_gateway.system_status.counters.dropped_messages_uptime
      ignore_missing: true
  - rename:
      tag: rename_counter_hard_bounces
      field: _tmp.data.resultSet.counters.0.total_hard_bounces_uptime
      target_field: cisco_secure_email_gateway.system_status.counters.total_hard_bounces_uptime
      ignore_missing: true
  - remove:
      tag: remove_tmp_message
      field:
        - _tmp
        - message
      ignore_missing: true
  - set:
      tag: set_timestamp
      field: "@timestamp"
      value: "{{{_ingest.timestamp}}}"
      override: false
on_failure:
  - append:
      field: error.message
      value: >-
        Processor "{{{ _ingest.on_failure_processor_type }}}" with tag
        "{{{ _ingest.on_failure_processor_tag }}}" in pipeline
        "{{{ _ingest.pipeline }}}" failed with message
        "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
