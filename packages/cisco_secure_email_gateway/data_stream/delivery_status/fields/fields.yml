- name: cisco_secure_email_gateway.delivery_status
  type: group
  description: Cisco Secure Email Gateway per-domain delivery status metrics.
  fields:
    - name: destination_domain
      type: keyword
      description: Destination domain name.
    - name: latest_host_status
      type: keyword
      description: Latest connectivity status for the destination host.
    - name: active_recipients
      type: long
      metric_type: gauge
      description: Number of active recipients for this domain.
    - name: delivered_recipients
      type: long
      metric_type: counter
      description: Number of successfully delivered recipients for this domain.
    - name: soft_bounces
      type: long
      metric_type: counter
      description: Number of soft bounces for this domain.
    - name: hard_bounces
      type: long
      metric_type: counter
      description: Number of hard bounces for this domain.
    - name: connections_out
      type: long
      metric_type: gauge
      description: Current outbound connections to this domain.
