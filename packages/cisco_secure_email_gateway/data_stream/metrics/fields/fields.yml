- name: cisco_secure_email_gateway.metrics
  type: group
  description: Cisco Secure Email Gateway health metrics from the ESA REST API.
  fields:
    - name: cpu_load_pct
      type: float
      metric_type: gauge
      unit: percent
      description: Percentage of CPU currently in use.
    - name: ram_utilization_pct
      type: float
      metric_type: gauge
      unit: percent
      description: Percentage of RAM currently in use.
    - name: swap_utilization_pct
      type: float
      metric_type: gauge
      unit: percent
      description: Percentage of swap space currently in use.
    - name: queue_utilization_pct
      type: float
      metric_type: gauge
      unit: percent
      description: Percentage of mail queue capacity currently in use.
    - name: disk_io_pct
      type: float
      metric_type: gauge
      unit: percent
      description: Percentage of disk I/O capacity currently in use.
    - name: workqueue_messages
      type: long
      metric_type: gauge
      description: Number of messages currently in the work queue.
    - name: pvo_quarantine_messages
      type: long
      metric_type: gauge
      description: Number of messages currently held in PVO quarantines.
    - name: resource_conservation
      type: long
      metric_type: gauge
      description: Resource conservation mode level (0 = normal operation).
