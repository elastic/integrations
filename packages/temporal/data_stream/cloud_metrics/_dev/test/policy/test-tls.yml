# Inherited TLS options from prometheus_input_otel.
data_stream:
  vars:
    targets:
      - "metrics.example.local:443"
    scrape_interval: "30s"
    scrape_timeout: "10s"
    metrics_path: "/v1/metrics"
    scheme: "https"
    bearer_token: "test-temporal-api-key"
    tls_enabled: true
    tls_skip_verify: true
    tls_ca_file: "/etc/ssl/certs/ca.crt"
