# Verify that query parameters are rendered via the scrape_config `params` block
# and not appended to metrics_path. This is the correct way to filter Temporal
# Cloud metrics by namespace or label.
data_stream:
  vars:
    bearer_token: "test-temporal-api-key"
    params: |
      namespaces:
        - my-namespace.account
      labels:
        - temporal_activity_type
