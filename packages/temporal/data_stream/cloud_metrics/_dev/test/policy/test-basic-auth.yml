# Inherited basic-auth options from prometheus_input_otel.
data_stream:
  vars:
    targets:
      - "prometheus.example.local:9090"
    scrape_interval: "30s"
    scrape_timeout: "10s"
    metrics_path: "/metrics"
    scheme: "http"
    username: "prometheus_user"
    password: "prometheus_password"
    # bearer_token is required by the Temporal stream manifest
    bearer_token: "unused-when-basic-auth-set"
