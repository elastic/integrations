format_version: "3.6.5"
name: temporal
title: "Temporal (OpenTelemetry)"
version: 0.3.0
source:
  license: "Elastic-2.0"
description: >-
  Collect operational metrics from Temporal Cloud and Temporal Worker/SDK
  Prometheus endpoints.
type: integration

categories:
  - observability
  - monitoring
  - cloud
  - opentelemetry
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: basic
icons:
  - src: /img/temporal-logo.svg
    title: Temporal with OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
requires:
  input:
    - package: prometheus_input_otel
      version: "0.2.0"
policy_templates:
  - name: temporal
    title: Temporal Metrics
    description: Collect Temporal Cloud and Worker/SDK metrics
    data_streams:
      - cloud_metrics
      - sdk_metrics
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        is_default: true
        organization: observability
        division: engineering
        team: obs-infraobs-integrations
    inputs:
      - package: prometheus_input_otel
        title: Temporal Metrics
        description: >
          Scrape Temporal Cloud OpenMetrics and optional Worker/SDK Prometheus
          endpoints.
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
