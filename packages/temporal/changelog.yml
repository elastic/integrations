# newer versions go on top
- version: "0.4.0"
  changes:
    - description: >-
        Fix metrics filtering: query parameters appended to Metrics Path were
        percent-encoded into the URL path (`%3F`) and returned no data. Add a
        new **Query Parameters** field that correctly maps to the Prometheus
        scrape `params` block.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21565
    - description: >-
        Add **Query Parameters** field to the Cloud Metrics stream, allowing
        Temporal Cloud query parameters to be set via the Fleet UI without
        editing the Metrics Path.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21565
    - description: >-
        Change default scrape interval from 60s to 30s and scrape timeout from
        30s to 10s, per Temporal's recommendation for their one-minute
        aggregation windows.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21565
- version: "0.3.1"
  changes:
    - description: Rename the integration display name in the README to Temporal OpenTelemetry Integration.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21080
- version: "0.3.0"
  changes:
    - description: Add the `temporal_otel` content package as a dependency and document it in the README.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21023
- version: "0.2.0"
  changes:
    - description: Stop overriding the OTel `attributes` passthrough mapping so all Temporal Cloud metric labels are indexed as time series dimensions.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20958
- version: "0.1.0"
  changes:
    - description: Initial release of the Temporal Cloud OTel integration (cloud_metrics data stream).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20755
