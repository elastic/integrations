---
description: Pipeline for processing Device logs.
processors:
  # hard coded fields
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_a131107f
      field: event.kind
      value: enrichment
  - set:
      tag: set_event_category_cceb7c22
      field: event.category
      value: [threat]
  - set:
      tag: set_event_type_97bb78b9
      field: event.type
      value: [indicator]

  # pre-processing
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      field: event.original
      tag: 'json_decoding'
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_8075efaa
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  - drop:
      tag: drop_05cc44db
      description: Drop if extract type is not mapped.
      if: "!['asn', 'domain', 'email', 'file', 'file-size', 'hash-md5', 'hash-md5', 'hash-sha1', 'hash-sha256', 'hash-sha384', 'hash-sha512', 'hash-ssdeep', 'ipv4', 'ipv4-cidr', 'ipv6', 'ipv6-cidr', 'mac-48', 'mutex', 'port', 'process', 'process-name', 'uri', 'winregistry', 'certificate-serial-number', 'malware', 'rule', 'user-agent', 'organization', 'email-subject', 'host', 'cve'].contains(ctx.json.type)"

  # expand collapsed fields
  - dot_expander:
      tag: dot_expander_source_names_5f364a88
      path: json
      field: source.names
      if: 'ctx.json["source.names"] != null && ctx.json["source.names"] != ""'
  - dot_expander:
      tag: dot_expander_meta_tags_d3eadc1d
      path: json
      field: meta.tags
      if: 'ctx.json["meta.tags"] != null && ctx.json["meta.tags"] != ""'
  - dot_expander:
      tag: dot_expander_meta_estimated_observed_time_07a47e33
      path: json
      field: meta.estimated_observed_time
      if: 'ctx.json["meta.estimated_observed_time"] != null && ctx.json["meta.estimated_observed_time"] != ""'
  - dot_expander:
      tag: dot_expander_meta_estimated_threat_start_time_f2b3bb8c
      path: json
      field: meta.estimated_threat_start_time
      if: 'ctx.json["meta.estimated_threat_start_time"] != null && ctx.json["meta.estimated_threat_start_time"] != ""'
  - dot_expander:
      tag: dot_expander_meta_estimated_threat_end_time_93909a75
      path: json
      field: meta.estimated_threat_end_time
      if: 'ctx.json["meta.estimated_threat_end_time"] != null && ctx.json["meta.estimated_threat_end_time"] != ""'
  - dot_expander:
      tag: dot_expander_meta_ingest_time_4a88355c
      path: json
      field: meta.ingest_time
      if: 'ctx.json["meta.ingest_time"] != null && ctx.json["meta.ingest_time"] != ""'

  # base event fields
  - set:
      tag: set_event_provider_d5928db1
      field: event.provider
      value: '{{{json.source.names}}}'
      if: "ctx.json.source?.names != null && ctx.json.source.names != ''"
  - set:
      tag: set_event_url_6c0dd912
      field: event.url
      value: '{{{json.value_url}}}'
  - date:
      tag: date_json_meta_ingest_time_to_event_created_a80ce187
      field: json.meta.ingest_time
      target_field: event.created
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ssz"
      if: "ctx.json.meta?.ingest_time != null && ctx.json.meta.ingest_time != ''"
  - date:
      tag: date_json_meta_estimated_threat_start_time_to_event_start_ef7fe29f
      field: json.meta.estimated_threat_start_time
      target_field: event.start
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ssz"
      if: "ctx.json.meta?.estimated_threat_start_time != null && ctx.json.meta.estimated_threat_start_time != ''"
  - date:
      tag: date_json_meta_estimated_threat_end_time_to_event_end_a83df3e3
      field: json.meta.estimated_threat_end_time
      target_field: event.end
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ssz"
      if: "ctx.json.meta?.estimated_threat_end_time != null && ctx.json.meta.estimated_threat_end_time != ''"
  - date:
      tag: date_json_timestamp_to_timestamp_2652868d
      field: json.timestamp
      target_field: "@timestamp"
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ssz"
  - split:
      tag: split_json_meta_tags_to_tags_186bf5b4
      field: json.meta.tags
      target_field: tags
      separator: ';'
      preserve_trailing: false
      if: 'ctx.json?.meta?.tags != null && ctx.json.meta.tags != ""'

  # populate threat.indicator fields
  - set:
      tag: set_threat_indicator_name_be50cc57
      field: threat.indicator.name
      value: '{{{json.value}}}'
  - date:
      tag: date_json_meta_estimated_observed_time_to_threat_indicator_first_seen_0624459d
      field: json.meta.estimated_observed_time
      target_field: threat.indicator.first_seen
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ssz"
      if: "ctx.json.meta?.estimated_observed_time != null && ctx.json.meta.estimated_observed_time != ''"

  # map extract classification and confidence to threat.indicator.confidence
  - set:
      tag: set_threat_indicator_confidence_f36964bf
      field: threat.indicator.confidence
      value: Not Specified
      if: 'ctx.json["meta.classification"] == "unknown"'
  - set:
      tag: set_threat_indicator_confidence_469796e1
      field: threat.indicator.confidence
      value: None
      if: 'ctx.json["meta.classification"] == "good"'
  - set:
      tag: set_event_severity_f176275a
      field: event.severity
      value: 1
      if: 'ctx.json["meta.classification"] == "good"'
  - set:
      tag: set_threat_indicator_confidence_598cba94
      field: threat.indicator.confidence
      value: Low
      if: 'ctx.json["meta.confidence"] == "low"'
  - set:
      tag: set_event_severity_64ad8efc
      field: event.severity
      value: 2
      if: 'ctx.json["meta.confidence"] == "low"'
  - set:
      tag: set_threat_indicator_confidence_5ef3b174
      field: threat.indicator.confidence
      value: Medium
      if: 'ctx.json["meta.confidence"] == "medium"'
  - set:
      tag: set_event_severity_4c297a66
      field: event.severity
      value: 3
      if: 'ctx.json["meta.confidence"] == "medium"'
  - set:
      tag: set_threat_indicator_confidence_427e5c52
      field: threat.indicator.confidence
      value: High
      if: 'ctx.json["meta.confidence"] == "high"'
  - set:
      tag: set_event_severity_8f93b366
      field: event.severity
      value: 4
      if: 'ctx.json["meta.confidence"] == "high"'

  # map extract TLP to threat.indicator.marking.tlp
  - set:
      tag: set_threat_indicator_marking_tlp_ea05a9a1
      field: threat.indicator.marking.tlp
      value: WHITE
      if: 'ctx.json["meta.tlp"] == "WHITE"'
  - set:
      tag: set_threat_indicator_marking_tlp_07858fc4
      field: threat.indicator.marking.tlp
      value: CLEAR
      if: 'ctx.json["meta.tlp"] == "NONE"'
  - set:
      tag: set_threat_indicator_marking_tlp_7f033aad
      field: threat.indicator.marking.tlp
      value: GREEN
      if: 'ctx.json["meta.tlp"] == "GREEN"'
  - set:
      tag: set_threat_indicator_marking_tlp_b26bc239
      field: threat.indicator.marking.tlp
      value: AMBER
      if: 'ctx.json["meta.tlp"] == "AMBER"'
  - set:
      tag: set_threat_indicator_marking_tlp_ab1f88bd
      field: threat.indicator.marking.tlp
      value: RED
      if: 'ctx.json["meta.tlp"] == "RED"'

  # map extract type and value to threat.indicator fields
  - set:
      tag: set_threat_indicator_type_2127681b
      field: threat.indicator.type
      value: autonomous-system
      if: 'ctx.json.type == "asn"'
  - set:
      tag: set_threat_indicator_as_number_8dc55e01
      field: threat.indicator.as.number
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "asn"'
  - convert:
      tag: convert_threat_indicator_as_number_07af8420
      field: threat.indicator.as.number
      type: long
      if: 'ctx.json.type == "asn"'
  - set:
      tag: set_threat_indicator_type_b41f64a7
      field: threat.indicator.type
      value: domain-name
      if: 'ctx.json.type == "domain"'
  - set:
      tag: set_threat_indicator_url_domain_d8bcc343
      field: threat.indicator.url.domain
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "domain"'
  - set:
      tag: set_threat_indicator_type_5ba2581d
      field: threat.indicator.type
      value: email-addr
      if: 'ctx.json.type == "email"'
  - set:
      tag: set_threat_indicator_email_address_0c74614a
      field: threat.indicator.email.address
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "email"'
  - set:
      tag: set_threat_indicator_type_b3480c77
      field: threat.indicator.type
      value: file
      if: 'ctx.json.type == "file" || ctx.json.type == "file-size" || ctx.json.type == "hash-md5" || ctx.json.type == "hash-sha1" || ctx.json.type == "hash-sha256" || ctx.json.type == "hash-sha384" || ctx.json.type == "hash-sha512" || ctx.json.type == "hash-ssdeep"'
  - set:
      tag: set_threat_indicator_file_path_007577a3
      field: threat.indicator.file.path
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "file"'
  - set:
      tag: set_threat_indicator_file_size_686a9235
      field: threat.indicator.file.size
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "file-size"'
  - convert:
      tag: convert_threat_indicator_file_size_253e6800
      field: threat.indicator.file.size
      type: long
      if: 'ctx.json.type == "file-size"'
  - set:
      tag: set_threat_indicator_file_hash_md5_2a2242bb
      field: threat.indicator.file.hash.md5
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "hash-md5"'
  - set:
      tag: set_threat_indicator_file_hash_sha1_98b7ae09
      field: threat.indicator.file.hash.sha1
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "hash-sha1"'
  - set:
      tag: set_threat_indicator_file_hash_sha256_8ffae0ed
      field: threat.indicator.file.hash.sha256
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "hash-sha256"'
  - set:
      tag: set_threat_indicator_file_hash_sha384_44618361
      field: threat.indicator.file.hash.sha384
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "hash-sha384"'
  - set:
      tag: set_threat_indicator_file_hash_sha512_0bf3fff5
      field: threat.indicator.file.hash.sha512
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "hash-sha512"'
  - set:
      tag: set_threat_indicator_file_hash_ssdeep_ab100ed1
      field: threat.indicator.file.hash.ssdeep
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "hash-ssdeep"'
  - set:
      tag: set_threat_indicator_type_359a11f8
      field: threat.indicator.type
      value: ipv4-addr
      if: 'ctx.json.type == "ipv4" || ctx.json.type == "ipv4-cidr"'
  - set:
      tag: set_threat_indicator_type_1aa885c2
      field: threat.indicator.type
      value: ipv6-addr
      if: 'ctx.json.type == "ipv6" || ctx.json.type == "ipv6-cidr"'
  - set:
      tag: set_threat_indicator_ip_32df34c8
      field: threat.indicator.ip
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "ipv4" || ctx.json.type == "ipv6"'
  - set:
      tag: set_threat_indicator_type_6d7376f4
      field: threat.indicator.type
      value: mac-addr
      if: 'ctx.json.type == "mac-48"'
  - set:
      tag: set_threat_indicator_type_08ed8077
      field: threat.indicator.type
      value: mutex
      if: 'ctx.json.type == "mutex"'
  - set:
      tag: set_threat_indicator_type_cde15103
      field: threat.indicator.type
      value: port
      if: 'ctx.json.type == "port"'
  - set:
      tag: set_threat_indicator_url_port_ba70a95d
      field: threat.indicator.url.port
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "port"'
  - convert:
      tag: convert_threat_indicator_url_port_65dcf404
      field: threat.indicator.url.port
      type: long
      if: 'ctx.json.type == "port"'
  - set:
      tag: set_threat_indicator_type_7fb00fcf
      field: threat.indicator.type
      value: process
      if: 'ctx.json.type == "process"'
  - set:
      tag: set_threat_indicator_type_d191fc95
      field: threat.indicator.type
      value: process
      if: 'ctx.json.type == "process-name"'
  - set:
      tag: set_threat_indicator_type_c50d264e
      field: threat.indicator.type
      value: url
      if: 'ctx.json.type == "uri"'
  - set:
      tag: set_threat_indicator_url_full_23b8e5c6
      field: threat.indicator.url.full
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "uri"'
  - set:
      tag: set_threat_indicator_type_73b91a1f
      field: threat.indicator.type
      value: windows-registry-key
      if: 'ctx.json.type == "winregistry"'
  - set:
      tag: set_threat_indicator_registry_value_223cdda5
      field: threat.indicator.registry.value
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "winregistry"'
  - set:
      tag: set_threat_indicator_type_fffb5f8f
      field: threat.indicator.type
      value: x509-certificate
      if: 'ctx.json.type == "certificate-serial-number"'
  - set:
      tag: set_threat_indicator_x509_serial_number_53ae50ba
      field: threat.indicator.x509.serial_number
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "certificate-serial-number"'

  # related fields
  - append:
      tag: append_related_hash_72c23d0d
      field: related.hash
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "file" || ctx.json.type == "file-size" || ctx.json.type == "hash-md5" || ctx.json.type == "hash-sha1" || ctx.json.type == "hash-sha256" || ctx.json.type == "hash-sha384" || ctx.json.type == "hash-sha512" || ctx.json.type == "hash-ssdeep"'
      allow_duplicates: false
  - append:
      tag: append_related_hosts_18dd8d7e
      field: related.hosts
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "host"'
      allow_duplicates: false
  - append:
      tag: append_related_ip_4b6c8535
      field: related.ip
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "ipv4" || ctx.json.type == "ipv6"'
      allow_duplicates: false

  # custom fields used for transformation
  - fingerprint:
      tag: fingerprint_1651b336
      target_field: eclecticiq.threat.observable_id
      fields:
        - json.type
        - json.value
  # if observable is deleted from outgoing feed dataset, set deleted_at to anything to exclude it from transform result
  - date:
      tag: date_json_timestamp_to_eclecticiq_threat_deleted_at_2d2aee30
      field: json.timestamp
      target_field: eclecticiq.threat.deleted_at
      formats:
        - "yyyy-MM-dd HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd HH:mm:ssz"
        - "yyyy-MM-dd'T'HH:mm:ss.SSSSSSz"
        - "yyyy-MM-dd'T'HH:mm:ssz"
      if: "ctx.json.diff == 'del'"

  # other
  - set:
      tag: set_threat_software_name_dfb19f22
      field: threat.software.name
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "malware"'
  - set:
      tag: set_threat_software_type_b058e4ed
      field: threat.software.type
      value: Malware
      if: 'ctx.json.type == "malware"'
  - set:
      tag: set_server_mac_2e52d7f7
      field: server.mac
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "mac-48"'
  - gsub:
      tag: gsub_server_mac_24a121df
      field: server.mac
      pattern: ":"
      replacement: "-"
      if: 'ctx.json.type == "mac-48"'
  - uppercase:
      tag: uppercase_server_mac_9e75cb63
      field: server.mac
      if: 'ctx.json.type == "mac-48"'
  - set:
      tag: set_rule_name_d675cec6
      field: rule.name
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "rule"'
  - set:
      tag: set_user_agent_original_c93ddde4
      field: user_agent.original
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "user-agent"'
  - set:
      tag: set_organization_name_1dfdef66
      field: organization.name
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "organization"'
  - set:
      tag: set_process_command_line_20652085
      field: process.command_line
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "process"'
  - set:
      tag: set_process_name_b582dfde
      field: process.name
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "process-name"'
  - set:
      tag: set_email_subject_b52ad09c
      field: email.subject
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "email-subject"'
  - set:
      tag: set_host_hostname_e2afdcf8
      field: host.hostname
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "host"'
  - set:
      tag: set_vulnerability_id_f266ee6c
      field: vulnerability.id
      value: '{{{json.value}}}'
      if: 'ctx.json.type == "cve"'
  - fingerprint:
      tag: fingerprint_f2c3cb1e
      target_field: event.id
      fields:
        - json.type
        - json.value
        - json.timestamp
  - set:
      tag: set__id_38f4000b
      field: _id
      value: "{{{ event.id }}}"
  - remove:
      tag: remove_threat_indicator_4b72c28d
      field: threat.indicator
      if: 'ctx.threat.indicator?.type == null'
  - remove:
      tag: remove_threat_8bcfd2b0
      field: threat
      if: 'ctx.threat.indicator == null && ctx.threat.software == null'
  - remove:
      tag: remove_json_5a3b44a7
      field: json
on_failure:
  - append:
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
