input: aws-cloudwatch
vars:
  role_arn: arn:aws:iam::123456789012:role/ElasticAmazonMQReadOnly
  supports_identity_federation: true
  default_region: us-east-1
data_stream:
  vars:
    log_group_arn: "arn:aws:logs:us-east-1:123456789012:log-group:/aws/amazonmq/broker:*"
    log_group_name: /aws/amazonmq/broker
    log_group_name_prefix: /aws/amazonmq
    region_name: us-east-1
    number_of_workers: 1
