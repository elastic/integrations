---
description: Pipeline for RabbitMQ general logs in AmazonMQ.
processors:
  - rename:
      tag: rename_1
      field: message
      target_field: event.original
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_2
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - set:
      tag: set_3
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_4
      field: cloud.service.name
      value: amazonmq_rabbitmq
  - set:
      tag: set_5
      field: cloud.provider
      value: aws
  - grok:
      tag: grok_6
      field: event.original
      pattern_definitions:
        GREEDYMULTILINE: "(.|\n)*"
        ERL_PID: "\\<%{INT}\\.%{INT}\\.%{INT}\\>"
      patterns:
      - "%{TIMESTAMP_ISO8601:timestamp} \\[%{WORD:log.level}\\] %{ERL_PID:rabbitmq.log.pid}\\s*
        %{GREEDYMULTILINE:message}"
      ignore_missing: true
  - date:
      tag: date_7
      if: "ctx.event.timezone == null"
      field: timestamp
      target_field: "@timestamp"
      formats:
      - yyyy-MM-dd HH:mm:ss.SSSSSSZZZZZ
  - date:
      tag: date_8
      if: "ctx.event.timezone != null"
      field: "timestamp"
      target_field: "@timestamp"
      timezone: "{{ event.timezone }}"
      formats:
      - yyyy-MM-dd HH:mm:ss.SSSSSSZZZZZ
  - remove:
      tag: remove_9
      field:
        - timestamp
  - script:
      tag: script_10
      if: "ctx.log?.level != null"
      lang: painless
      source: >-
        def err_levels = ["FATAL", "ERROR", "WARN"];
        if (err_levels.contains(ctx.log.level)) {
          ctx.event.type = ["error"];
        } else {
          ctx.event.type = ["info"];
        }
  - script:
      tag: script_11
      description: Drops null/empty values recursively
      lang: painless
      ignore_failure: true
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
on_failure:
  - set:
      tag: set_on_failure_1
      field: event.kind
      value: pipeline_error
  - set:
      tag: set_on_failure_2
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}' in pipeline {{{ _ingest.pipeline }}}
