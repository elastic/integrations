wait_for_data_timeout: 1m
input: cel
service: prisma_cloud
vars:
  username: xxxx
  password: xxxx
data_stream:
  vars:
    url: http://{{Hostname}}:{{Port}}
    interval: 2s
    preserve_original_event: true
    preserve_duplicate_custom_fields: true
assert:
  # One host profile from each of the first two polling cycles.
  hit_count: 2
