- name: cyera
  type: group
  fields:
    - name: audit
      type: group
      fields:
        - name: action
          type: keyword
          description: Action recorded in the audit entry.
        - name: created_at
          type: date
          description: Date when the audit entry was created.
        - name: description
          type: keyword
          description: Human-readable description of the audit entry.
        - name: email
          type: keyword
          description: Email address of the user that performed the action.
        - name: environment_name
          type: keyword
          description: Name of the Cyera environment where the action was performed.
        - name: frontegg_id
          type: keyword
          description: Unique identifier of the audit entry.
        - name: ip
          type: ip
          description: IP address the action was performed from.
        - name: severity
          type: keyword
          description: Severity of the audit entry.
        - name: tenant_id
          type: keyword
          description: Unique identifier of the tenant associated with the audit entry.
        - name: updated_at
          type: date
          description: Date when the audit entry was last updated.
        - name: user_agent
          type: keyword
          description: User agent of the client the action was performed from.
        - name: vendor_id
          type: keyword
          description: Unique identifier of the vendor associated with the audit entry.
