      field: event.original
      tag: json_event_original_74d23cc2
      target_field: json
  - fingerprint:
      fields:
        - json.uid
        - json.lastModifiedTime
        - json.createdDate
      tag: fingerprint_datastore_d52d7b6b
      target_field: _id
      ignore_missing: true
