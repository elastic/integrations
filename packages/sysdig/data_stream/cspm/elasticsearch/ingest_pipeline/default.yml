---
description: Pipeline for processing CSPM compliance results logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  # parse the event JSON
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_74d23cc2
      target_field: json

  # rename to snake case
  - script:
      tag: script_convert_camelcase_to_snake_case_865da965
      lang: painless
      description: Convert camelCase to snake_case
      if: ctx.json != null
      source: |
        // Helper function to convert camelCase to snake_case
        String camelToSnake(String str) {
          def result = "";
          def lastCharWasUpperCase = false;
          for (int i = 0; i < str.length(); i++) {
            char c = str.charAt(i);
            if (Character.isUpperCase(c)) {
              if (i > 0 && !lastCharWasUpperCase) {
                result += "_";
              }
              result += Character.toLowerCase(c);
              lastCharWasUpperCase = true;
            } else {
              result += c;
              lastCharWasUpperCase = false;
            }
          }
          return result;
        }
        // Recursive function to handle nested fields
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            // Convert each key in the map
            def newObj = [:];
            for (entry in obj.entrySet()) {
              // Skip fields that contain '@' in their name
              if (!entry.getKey().contains("@")) {
                String newKey = camelToSnake(entry.getKey());
                newObj[newKey] = convertToSnakeCase(entry.getValue());
              }
            }
            return newObj;
          } else if (obj instanceof List) {
            // If it's a list, process each item recursively
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        // Apply the conversion
        ctx.sysdig = ctx.sysdig ?: [:];
        ctx.sysdig.cspm = convertToSnakeCase(ctx.json);

  # convert values
  - convert:
      field: sysdig.cspm.accepted_count
      tag: convert_accepted_count_to_long_b1135a39
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_accepted_count_a8eb05fa
            field: sysdig.cspm.accepted_count
        - append:
            tag: append_error_message_5bd67a02
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.control.accepted_count
      tag: convert_control_accepted_count_to_long_9e185862
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_accepted_count_e8eda2ed
            field: sysdig.cspm.control.accepted_count
        - append:
            tag: append_error_message_824cd82a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.control.id
      tag: convert_control_id_to_string_9e36fa7e
      type: string
      ignore_missing: true
  - convert:
      field: sysdig.cspm.control.is_manual
      tag: convert_control_is_manual_to_boolean_770f824c
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_is_manual_7769fda2
            field: sysdig.cspm.control.is_manual
        - append:
            tag: append_error_message_5b79a060
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: sysdig.cspm.control.last_update
      tag: date_control_last_update_57e386e4
      target_field: sysdig.cspm.control.last_update
      formats:
        - epoch_second
      if: ctx.sysdig?.cspm?.control?.last_update != null && ctx.sysdig.cspm.control.last_update != ''
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_last_update_89d102d9
            field: sysdig.cspm.control.last_update
            ignore_missing: true
        - append:
            tag: append_error_message_539ae0c8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.control.objects_count
      tag: convert_control_objects_count_to_long_2a6f82d8
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_objects_count_1a8636a4
            field: sysdig.cspm.control.objects_count
        - append:
            tag: append_error_message_06c8f7fc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.control.pass
      tag: convert_control_pass_to_boolean_186a886d
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_pass_0accf261
            field: sysdig.cspm.control.pass
        - append:
            tag: append_error_message_5b2d7ac1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.control.passing_count
      tag: convert_control_passing_count_to_long_dfbe4983
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_passing_count_00bbf352
            field: sysdig.cspm.control.passing_count
        - append:
            tag: append_error_message_18e5b44d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.control.remediation_id
      tag: convert_control_remediation_id_to_string_8b138f3f
      type: string
      ignore_missing: true
  - foreach:
      field: sysdig.cspm.control.supported_distributions
      tag: foreach_control_supported_distributions_2fc3a98f
      if: ctx.sysdig?.cspm?.control?.supported_distributions instanceof List
      processor:
        convert:
          field: _ingest._value.max_version
          tag: covert_max_version_to_string_d21cea76
          type: string
          ignore_missing: true
  - foreach:
      field: sysdig.cspm.control.supported_distributions
      tag: foreach_control_supported_distributions_bbe7e533
      if: ctx.sysdig?.cspm?.control?.supported_distributions instanceof List
      processor:
        convert:
          field: _ingest._value.min_version
          tag: covert_min_version_to_string_c2242d36
          type: string
          ignore_missing: true
  - convert:
      field: sysdig.cspm.control.type
      tag: convert_control_type_to_long_08621325
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_control_type_6e0e557b
            field: sysdig.cspm.control.type
        - append:
            tag: append_error_message_21ab45b7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.failed_controls
      tag: convert_failed_controls_to_long_094df060
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_failed_controls_857f155c
            field: sysdig.cspm.failed_controls
        - append:
            tag: append_error_message_8f8782d6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.high_severity_count
      tag: convert_high_severity_count_to_long_3f73a0f8
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_high_severity_count_0c18efbd
            field: sysdig.cspm.high_severity_count
        - append:
            tag: append_error_message_e0ae36db
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.low_severity_count
      tag: convert_low_severity_count_to_long_aaed7a72
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_low_severity_count_6386ae3e
            field: sysdig.cspm.low_severity_count
        - append:
            tag: append_error_message_aa8154c7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.medium_severity_count
      tag: convert_medium_severity_count_to_long_30d2cacc
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_medium_severity_count_55913da8
            field: sysdig.cspm.medium_severity_count
        - append:
            tag: append_error_message_f87f31a8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.pass
      tag: convert_pass_to_boolean_23ccd695
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_pass_8481772e
            field: sysdig.cspm.pass
        - append:
            tag: append_error_message_32046206
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.passing_count
      tag: convert_passing_count_to_long_942cbcd5
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_sysdig_cspm_passing_count_7db4faaf
            field: sysdig.cspm.passing_count
        - append:
            tag: append_error_message_c570cc23
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: sysdig.cspm.policy_id
      tag: convert_policy_id_to_string_00d6b335
      type: string
      ignore_missing: true
  - convert:
      field: sysdig.cspm.requirement_id
      tag: convert_requirement_id_to_string_855572f8
      type: string
      ignore_missing: true
  - convert:
      field: sysdig.cspm.zone.id
      tag: convert_zone_id_to_string_66f0f922
      type: string
      ignore_missing: true

  # populate ECS fields
  - set:
      field: message
      tag: set_message_from_cspm_name_22a0eb2e
      copy_from: sysdig.cspm.name
      ignore_empty_value: true

  # event.*
  - set:
      field: event.kind
      tag: set_event_kind_c3139286
      value: state
  - append:
      field: event.category
      tag: append_configuration_into_event_category_5bc3dda0
      value: configuration
  - append:
      field: event.type
      tag: append_info_into_event_type_5eab37e6
      value: info
  - set:
      field: event.id
      tag: set_event_id_from_control_id_1bf29f7e
      copy_from: sysdig.cspm.control.id
      ignore_empty_value: true
  - script:
      tag: script_set_event_severity_based_control_b0df6331
      description: Set event severity based on control severity.
      if: ctx.sysdig?.cspm?.control?.severity != null
      lang: painless
      params:
        info: 21
        low: 21
        medium: 47
        high: 73
      source: |-
        ctx.event = ctx.event ?: [:];
        ctx.event.severity = params.get(ctx.sysdig.cspm.control.severity.toLowerCase());
      on_failure:
        - append:
            tag: append_error_message_b776c741
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.outcome
      tag: set_event_outcome_to_success_5029f219
      value: success
      if: ctx.sysdig?.cspm?.pass == true
  - set:
      field: event.outcome
      tag: set_event_outcome_to_failure_5ba12b90
      value: failure
      if: ctx.sysdig?.cspm?.pass == false
  - set:
      field: event.outcome
      tag: set_event_outcome_to_unknown_4ab8830e
      value: unknown
      if: ctx.event?.outcome == null

  # observer.*
  - set:
      field: observer.vendor
      tag: set_observer_vendor_0ae6d50a
      value: Sysdig
  - set:
      field: observer.product
      tag: set_observer_product_4b4cc275
      value: Sysdig Secure

  # result.*
  - set:
      field: result.evaluation
      tag: set_result_evaluation_to_passed_06f712d3
      value: passed
      if: ctx.sysdig?.cspm?.pass == true
  - set:
      field: result.evaluation
      tag: set_result_evaluation_to_failed_b7a19f0e
      value: failed
      if: ctx.sysdig?.cspm?.pass == false
  - set:
      field: result.evaluation
      tag: set_result_evaluation_to_unknown_7d739257
      value: unknown
      if: ctx.result?.evaluation == null

  # rule.*
  - set:
      field: rule.benchmark.rule_number
      tag: set_rule_benchmark_rule_number_from_cspm_policy_id_6ad9e454
      copy_from: sysdig.cspm.policy_id
      ignore_empty_value: true
  - set:
      field: rule.benchmark.name
      tag: set_rule_benchmark_name_from_cspm_policy_name_0b4046a0
      copy_from: sysdig.cspm.policy_name
      ignore_empty_value: true
  - set:
      field: rule.id
      tag: set_rule_id_from_cspm_control_id_3b5547b8
      copy_from: sysdig.cspm.control.id
      ignore_empty_value: true
  - set:
      field: rule.name
      tag: set_rule_name_from_cspm_control_name_bb53839b
      copy_from: sysdig.cspm.control.name
      ignore_empty_value: true
  - set:
      field: rule.description
      tag: set_rule_description_from_cspm_control_description_f85913da
      copy_from: sysdig.cspm.control.description
      ignore_empty_value: true
  - fingerprint:
      fields:
        - rule.name
      tag: fingerprint_rule_uuid_f536018d
      target_field: rule.uuid
      ignore_missing: true

  - remove:
      field:
        - sysdig.cspm.policy_id
        - sysdig.cspm.policy_name
        - sysdig.cspm.control.id
        - sysdig.cspm.control.name
        - sysdig.cspm.control.description
      tag: remove_custom_duplicate_fields_a9eec544
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_7559f019
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_417e65c9
      field: error.message
      value: |-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
