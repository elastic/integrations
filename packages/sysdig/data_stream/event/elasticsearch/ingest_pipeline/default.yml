  - script:
      description: Remove empty proc.pid and proc.ppid maps left after timestamp field expansion.
      tag: script_sanitize_proc_timestamp_maps_19670111
      lang: painless
      if: ctx.sysdig?.event?.content?.fields instanceof Map && (ctx.sysdig.event.content.fields['proc.pid.ts'] != null || ctx.sysdig.event.content.fields['proc.ppid.ts'] != null || ctx.sysdig?.event?.content?.fields?.proc?.pid_ts != null || ctx.sysdig?.event?.content?.fields?.proc?.ppid_ts != null)
      source: |
        if (ctx.sysdig.event.content.fields.proc instanceof Map) {
          def proc = ctx.sysdig.event.content.fields.proc;
          if (proc.containsKey('pid') && proc.pid instanceof Map && proc.pid.size() == 0) {
            proc.remove('pid');
          }
          if (proc.containsKey('ppid') && proc.ppid instanceof Map && proc.ppid.size() == 0) {
            proc.remove('ppid');
          }
        }
