- name: log_type
  type: keyword
  description: Log type assigned by the OpenShift Logging collector. Used by the routing rules of this data stream.
- name: log_source
  type: keyword
  description: Log source assigned by the OpenShift Logging collector.
- name: hostname
  type: keyword
  description: Name of the node that produced the record.
- name: level
  type: keyword
  description: Log level detected by the collector.
- name: openshift
  type: group
  fields:
    - name: cluster_id
      type: keyword
      description: ID of the OpenShift cluster that produced the record.
    - name: sequence
      type: long
      description: Sequence number the collector assigns to each record, in nanoseconds since the epoch.
