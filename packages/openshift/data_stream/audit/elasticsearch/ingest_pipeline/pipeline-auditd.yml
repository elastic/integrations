---
description: >-
  Parses raw Linux audit records (log source auditd), including the ENRICHED
  log format. The parsing steps follow the raw pipeline of the auditd
  integration.
processors:
  - grok:
      tag: grok_audit_old_auid
      if: ctx.auditd?.log?.record_type == null && ctx.event?.original != null && ctx.event.original.contains(' old auid=')
      ignore_failure: true
      field: event.original
      pattern_definitions:
        AUDIT_TYPE: 'type=%{NOTSPACE:auditd.log.record_type}'
        AUDIT_NODE: 'node=%{IPORHOST:auditd.log.node} '
        AUDIT_PREFIX: '^(?:%{AUDIT_NODE})?%{AUDIT_TYPE} msg=audit\(%{NUMBER:auditd.log.epoch}:%{NUMBER:auditd.log.sequence}\):'
      patterns:
        - '%{AUDIT_PREFIX}\s*(?<auditd.log.kv>.*?)(?= old auid=) old auid=%{NUMBER:auditd.log.old_auid} new auid=%{NUMBER:auditd.log.new_auid} old ses=%{NUMBER:auditd.log.old_ses} new ses=%{NUMBER:auditd.log.new_ses}$'
  - grok:
      tag: grok_audit_msg
      if: ctx.auditd?.log?.record_type == null && ctx.event?.original != null && (ctx.event.original.contains(" msg='") || ctx.event.original.contains(' msg="'))
      ignore_failure: true
      field: event.original
      pattern_definitions:
        AUDIT_TYPE: 'type=%{NOTSPACE:auditd.log.record_type}'
        AUDIT_NODE: 'node=%{IPORHOST:auditd.log.node} '
        AUDIT_PREFIX: '^(?:%{AUDIT_NODE})?%{AUDIT_TYPE} msg=audit\(%{NUMBER:auditd.log.epoch}:%{NUMBER:auditd.log.sequence}\):'
        AVC_PREFIX: 'avc:%{SPACE}%{WORD:auditd.log.avc.action}%{SPACE}{%{SPACE}%{WORD:auditd.log.avc.request}%{SPACE}}%{SPACE}for%{SPACE}'
        SINGLE_QUOTED_CONTENT: "[^']*"
        DOUBLE_QUOTED_CONTENT: '[^"]*'
        MESSAGE: "(?:'(?:%{AVC_PREFIX}|[^=]*\\s)?%{SINGLE_QUOTED_CONTENT:auditd.log.sub_kv}'|\"([^=]*\\s)?%{DOUBLE_QUOTED_CONTENT:auditd.log.sub_kv}\")"
        GS: '\x1d'
      patterns:
        - '%{AUDIT_PREFIX}\s*(?:user )?(?<auditd.log.kv>.*?)(?= msg=) msg=%{MESSAGE}(?:%{GS}(?<auditd.log.sub_kv_enriched>.*))?$'
  - grok:
      tag: grok_audit_enriched_field
      if: ctx.auditd?.log?.record_type == null && ctx.event?.original != null && ctx.event.original.contains('={ ')
      ignore_failure: true
      field: event.original
      pattern_definitions:
        AUDIT_TYPE: 'type=%{NOTSPACE:auditd.log.record_type}'
        AUDIT_NODE: 'node=%{IPORHOST:auditd.log.node} '
        AUDIT_PREFIX: '^(?:%{AUDIT_NODE})?%{AUDIT_TYPE} msg=audit\(%{NUMBER:auditd.log.epoch}:%{NUMBER:auditd.log.sequence}\):'
      patterns:
        - '%{AUDIT_PREFIX}\s*(?<auditd.log.kv>.*?)(?=\x1d%{WORD}=\{ )\x1d%{WORD:auditd.log.original_field}={ (?<auditd.log.sub_kv>.*) }$'
  # Fast path for record types whose body is always key=value pairs from the first
  # character. Anything else falls through to grok_audit_original. The %{+kv}=%{+kv}
  # capture reproduces the body verbatim and fails on a body with no "=".
  - dissect:
      tag: dissect_audit_kv
      if: |-
        if (ctx.auditd?.log?.record_type != null || ctx.event?.original == null) {
          return false;
        }
        String line = ctx.event.original;
        int typeKey = line.startsWith('node=') ? line.indexOf(' type=') + 1 : 0;
        if (!line.startsWith('type=', typeKey)) return false;
        int typeValueEnd = line.indexOf(' msg=audit(', typeKey);
        if (typeValueEnd < 0) return false;
        String recordType = line.substring(typeKey + 'type='.length(), typeValueEnd);
        return ['SYSCALL', 'PATH', 'CWD', 'PROCTITLE', 'EXECVE', 'SOCKADDR', 'BPRM_FCAPS', 'LOGIN', 'CONFIG_CHANGE', 'NETFILTER_CFG'].contains(recordType);
      field: event.original
      pattern: '%{?prefix}type=%{auditd.log.record_type} msg=audit(%{auditd.log.epoch}:%{auditd.log.sequence}):%{->} %{+auditd.log.kv}=%{+auditd.log.kv}'
      append_separator: '='
      ignore_failure: true
  # Capture the optional node= prefix that the dissect above skipped.
  - dissect:
      tag: dissect_audit_node
      if: ctx.auditd?.log?.record_type != null && ctx.auditd.log.node == null && ctx.event.original.startsWith('node=')
      field: event.original
      pattern: 'node=%{auditd.log.node} %{}'
      ignore_failure: true
  - grok:
      tag: grok_audit_original
      if: ctx.auditd?.log?.record_type == null
      field: event.original
      pattern_definitions:
        AUDIT_TYPE: 'type=%{NOTSPACE:auditd.log.record_type}'
        AUDIT_NODE: 'node=%{IPORHOST:auditd.log.node} '
        AUDIT_PREFIX: '^(?:%{AUDIT_NODE})?%{AUDIT_TYPE} msg=audit\(%{NUMBER:auditd.log.epoch}:%{NUMBER:auditd.log.sequence}\):'
        # The key pattern accepts an optional [N] suffix so that split EXECVE argument
        # chunks (aX[0]=..., aX[1]=...) match on the first attempt. Without it, a
        # continuation record whose only key has a bracket suffix (e.g. a17[1]=<7.5KB hex>)
        # forces the lazy skip to retry the greedy key run at every offset of the value,
        # which is quadratic and can exceed the grok watchdog timeout. The skip is bounded
        # to 128 characters: the longest no-key preamble in pipeline fixtures is 32 chars
        # (DAEMON_END, unmatched AVC preamble), so 128 covers real shapes with headroom
        # while capping O(n²) scan cost on malformed no-key lines below an unbounded
        # (?:.*?).
        AUDIT_KEY_VALUES: '(?:.{0,128}?)(?<auditd.log.kv>[A-Za-z0-9_]+(?:\[[0-9]+\])?=[\s\S]*)'
        AVC_PREFIX: 'avc:%{SPACE}%{WORD:auditd.log.avc.action}%{SPACE}{%{SPACE}%{WORD:auditd.log.avc.request}%{SPACE}}%{SPACE}for%{SPACE}'
      patterns:
        - '%{AUDIT_PREFIX}\s*(?:user )?%{AVC_PREFIX}?%{AUDIT_KEY_VALUES}'
        - '%{AUDIT_PREFIX}\s*.*$'
        - '%{AUDIT_PREFIX}\s*$'
        - '^(?:%{AUDIT_NODE})?%{AUDIT_TYPE} %{AUDIT_KEY_VALUES}'
  - gsub:
      tag: gsub_auditd_log_sub_kv_d17a8a4a
      field: auditd.log.sub_kv
      pattern: '(res=[a-z]+)([A-Z][A-Za-z_]+=)'
      replacement: '$1 $2'
      ignore_missing: true
      ignore_failure: true
  - gsub:
      tag: gsub_auditd_log_kv_d66bfe3f
      field: auditd.log.kv
      pattern: '(res=[a-z]+)([A-Z][A-Za-z_]+=)'
      replacement: '$1 $2'
      ignore_missing: true
      ignore_failure: true
  - kv:
      tag: kv_auditd_log_kv_into_auditd_log_fa7ccfa2
      if: ctx.auditd?.log?.kv != null
      field: auditd.log.kv
      field_split: '(?:\s+|\x1d)(?=[^\s\x1d]+=)'
      value_split: '(?<!\\)='
      target_field: auditd.log
      trim_value: "\"'"
  - kv:
      tag: kv_auditd_log_sub_kv_into_auditd_log_03d79d68
      field: auditd.log.sub_kv
      field_split: '\s+(?=[^\s]+=)'
      value_split: '='
      target_field: auditd.log
      trim_value: "\"'"
      ignore_missing: true
  - kv:
      tag: kv_auditd_log_sub_kv_enriched_into_auditd_log_d80ffcbd
      field: auditd.log.sub_kv_enriched
      field_split: '\s+(?=[^\s]+=)'
      value_split: '='
      target_field: auditd.log
      trim_value: "\"'"
      ignore_missing: true
  - date:
      tag: date_auditd_log_epoch_into_@timestamp_459c0b1a
      field: auditd.log.epoch
      target_field: "@timestamp"
      formats:
        - UNIX
      ignore_failure: true
  - lowercase:
      tag: lowercase_auditd_log_original_field_cf857b97
      field: auditd.log.original_field
      ignore_missing: true
  - rename:
      tag: rename_auditd_log_old-auid_to_auditd_log_old_auid_d30b8a28
      ignore_missing: true
      ignore_failure: true
      field: auditd.log.old-auid
      target_field: auditd.log.old_auid
  - rename:
      tag: rename_auditd_log_old-ses_to_auditd_log_old_ses_128f83d6
      ignore_missing: true
      ignore_failure: true
      field: auditd.log.old-ses
      target_field: auditd.log.old_ses
  # --- ECS mapping of the parsed record ---
  - rename:
      tag: rename_auditd_sequence
      field: auditd.log.sequence
      target_field: event.sequence
      ignore_missing: true
  - convert:
      tag: convert_event_sequence
      field: event.sequence
      type: long
      ignore_missing: true
  - set:
      tag: set_event_action
      field: event.action
      copy_from: auditd.log.record_type
      ignore_empty_value: true
  - lowercase:
      tag: lowercase_event_action
      field: event.action
      ignore_missing: true
  - convert:
      tag: convert_process_pid
      field: auditd.log.pid
      target_field: process.pid
      type: long
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_process_parent_pid
      field: auditd.log.ppid
      target_field: process.parent.pid
      type: long
      ignore_missing: true
      ignore_failure: true
  - remove:
      tag: remove_converted_pids
      field:
        - auditd.log.pid
        - auditd.log.ppid
      ignore_missing: true
      if: ctx.process?.pid != null
  - rename:
      tag: rename_process_name
      field: auditd.log.comm
      target_field: process.name
      ignore_missing: true
  - rename:
      tag: rename_process_executable
      field: auditd.log.exe
      target_field: process.executable
      ignore_missing: true
  - rename:
      tag: rename_user_id
      field: auditd.log.uid
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_user_name_from_acct
      description: For login and authentication records, acct is the account the record is about.
      field: auditd.log.acct
      target_field: user.name
      ignore_missing: true
  - rename:
      tag: rename_user_name_from_enriched_uid
      description: In the ENRICHED log format, UID holds the resolved name of uid.
      field: auditd.log.UID
      target_field: user.name
      ignore_missing: true
      if: ctx.user?.name == null
  - convert:
      tag: convert_source_ip
      field: auditd.log.addr
      target_field: source.ip
      type: ip
      ignore_missing: true
      ignore_failure: true
  - remove:
      tag: remove_converted_addr
      field: auditd.log.addr
      ignore_missing: true
      if: ctx.source?.ip != null
  - set:
      tag: set_outcome_success
      field: event.outcome
      value: success
      if: ctx.auditd?.log?.res == 'success' || ctx.auditd?.log?.success == 'yes'
  - set:
      tag: set_outcome_failure
      field: event.outcome
      value: failure
      if: ctx.auditd?.log?.res == 'failed' || ctx.auditd?.log?.success == 'no'
  - script:
      tag: script_categorize_record_type
      description: Maps the audit record type to event.category and event.type.
      lang: painless
      if: ctx.auditd?.log?.record_type != null
      params:
        USER_AUTH: {category: [authentication], type: [info]}
        USER_ACCT: {category: [authentication], type: [info]}
        USER_LOGIN: {category: [authentication, session], type: [start]}
        USER_LOGOUT: {category: [authentication, session], type: [end]}
        LOGIN: {category: [authentication, session], type: [start]}
        CRED_ACQ: {category: [authentication], type: [info]}
        CRED_DISP: {category: [authentication], type: [info]}
        CRED_REFR: {category: [authentication], type: [info]}
        USER_START: {category: [session], type: [start]}
        USER_END: {category: [session], type: [end]}
        CRYPTO_SESSION: {category: [session], type: [info]}
        CRYPTO_KEY_USER: {category: [session], type: [info]}
        USER_ROLE_CHANGE: {category: [iam], type: [change]}
        USER_CMD: {category: [process], type: [start]}
        SERVICE_START: {category: [process], type: [start]}
        SERVICE_STOP: {category: [process], type: [end]}
        DAEMON_START: {category: [process], type: [start]}
        DAEMON_END: {category: [process], type: [end]}
        SYSCALL: {category: [process], type: [info]}
        EXECVE: {category: [process], type: [start]}
        PROCTITLE: {category: [process], type: [info]}
        BPF: {category: [process], type: [info]}
        AVC: {category: [process], type: [access]}
        CONFIG_CHANGE: {category: [configuration], type: [change]}
        NETFILTER_CFG: {category: [configuration], type: [change]}
        ANOM_PROMISCUOUS: {category: [network], type: [info]}
        SYSTEM_BOOT: {category: [host], type: [start]}
        SYSTEM_SHUTDOWN: {category: [host], type: [end]}
      source: |
        def mapping = params.get(ctx.auditd.log.record_type);
        if (mapping == null) {
          return;
        }
        ctx.event.category = new ArrayList(mapping.category);
        ctx.event.type = new ArrayList(mapping.type);
  - append:
      tag: append_related_user_name
      field: related.user
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      tag: append_related_user_id
      field: related.user
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
  - append:
      tag: append_related_source_ip
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - remove:
      tag: remove_intermediate_fields
      field:
        - auditd.log.kv
        - auditd.log.sub_kv
        - auditd.log.sub_kv_enriched
        - auditd.log.epoch
      ignore_missing: true
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event
      field: tags
      value: preserve_original_event
      allow_duplicates: false
