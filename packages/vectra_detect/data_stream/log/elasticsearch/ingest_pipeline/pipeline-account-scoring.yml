---
description: Pipeline for processing Vectra Detect Account Scoring logs.
processors:
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - rename:
      tag: rename_json_tags_to_vectra_detect_log_tags_f81a851f
      field: json.tags
      target_field: vectra_detect.log.tags
      ignore_missing: true
  - append:
      tag: append_tags_a3d18a05
      field: tags
      value: '{{{vectra_detect.log.tags}}}'
      allow_duplicates: false
      if: ctx.vectra_detect?.log?.tags != null
  - rename:
      tag: rename_json_href_to_vectra_detect_log_href_d5d12613
      field: json.href
      target_field: vectra_detect.log.href
      ignore_missing: true
  - set:
      tag: set_event_reference_d36b06ee
      field: event.reference
      copy_from: vectra_detect.log.href
      ignore_empty_value: true
  - uri_parts:
      field: event.reference
      tag: 'uri_parts_to_split_reference'
      if: ctx.event?.reference != null
      on_failure:
        - append:
            tag: append_error_message_526c25fa
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.account_id
      tag: 'convert_account_id_to_string'
      target_field: vectra_detect.log.account.id
      type: string
      ignore_missing: true
      if: ctx.json?.account_id != ''
      on_failure:
        - append:
            tag: append_error_message_94d8bb57
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_user_target_id_c0233b39
      field: user.target.id
      copy_from: vectra_detect.log.account.id
      ignore_empty_value: true
  - append:
      tag: append_related_user_49283340
      field: related.user
      value: '{{{user.target.id}}}'
      allow_duplicates: false
      if: ctx.user?.target?.id != null
  - rename:
      tag: rename_json_account_uid_to_vectra_detect_log_account_uid_f9e0bdf0
      field: json.account_uid
      target_field: vectra_detect.log.account.uid
      ignore_missing: true
  - dissect:
      field: vectra_detect.log.account.uid
      tag: 'dissect_account_uid'
      pattern: '%{vectra_detect.log.account.user_id}@%{vectra_detect.log.account.domain}'
      on_failure:
        - append:
            tag: append_error_message_efc0e8d3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_user_domain_72eb1e48
      field: user.domain
      copy_from: vectra_detect.log.account.domain
      ignore_empty_value: true
  - registered_domain:
      tag: registered_domain_user_domain_to_vectra_detect_log_user_908b1338
      field: user.domain
      target_field: vectra_detect.log.user
      ignore_missing: true
  - set:
      tag: set_user_id_77de67aa
      field: user.id
      copy_from: vectra_detect.log.account.user_id
      ignore_empty_value: true
  - append:
      tag: append_related_user_45d9c089
      field: related.user
      value: '{{{user.domain}}}'
      allow_duplicates: false
      if: ctx.user?.domain != null
  - append:
      tag: append_related_user_7f407fef
      field: related.user
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
  - set:
      tag: set_user_target_name_9e881b5a
      field: user.target.name
      copy_from: vectra_detect.log.account.uid
      ignore_empty_value: true
  - convert:
      field: json.threat
      tag: 'convert_threat_to_long'
      target_field: vectra_detect.log.threat.score
      type: long
      ignore_missing: true
      if: ctx.json?.threat != ''
      on_failure:
        - append:
            tag: append_error_message_7ebf7392
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_quadrant_to_vectra_detect_log_quadrant_2ed6020b
      field: json.quadrant
      target_field: vectra_detect.log.quadrant
      ignore_missing: true
  - set:
      tag: set_user_risk_static_level_df75f103
      field: user.risk.static_level
      copy_from: vectra_detect.log.quadrant
      ignore_empty_value: true
  - append:
      tag: append_related_user_723e4218
      field: related.user
      value: '{{{user.risk.static_level}}}'
      allow_duplicates: false
      if: ctx.user?.risk?.static_level != null
  - convert:
      field: json.certainty
      tag: 'convert_certainty_to_long'
      target_field: vectra_detect.log.certainty
      type: long
      ignore_missing: true
      if: ctx.json?.certainty != ''
      on_failure:
        - append:
            tag: append_error_message_2972dd30
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.score_decreases
      tag: 'convert_score_decreases_to_boolean'
      target_field: vectra_detect.log.score_decreases
      type: boolean
      ignore_missing: true
      if: ctx.json?.score_decreases != ''
      on_failure:
        - append:
            tag: append_error_message_a0b370c2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.privilege
      tag: 'convert_privilege_to_long'
      target_field: vectra_detect.log.privilege
      type: long
      ignore_missing: true
      if: ctx.json?.privilege != ''
      on_failure:
        - append:
            tag: append_error_message_86bc8a10
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - json:
      field: json.host_access_history
      tag: 'json_to_split_host_access_history'
      if: ctx.json?.host_access_history instanceof String
      on_failure:
        - append:
            tag: append_error_message_7e3af65f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_host_access_history_to_vectra_detect_log_host_access_history_be5e1056
      field: json.host_access_history
      target_field: vectra_detect.log.host.access_history
      ignore_missing: true
  - foreach:
      tag: foreach_vectra_detect_log_host_access_history_e193c7e4
      field: vectra_detect.log.host.access_history
      if: ctx.vectra_detect?.log?.host?.access_history instanceof List
      processor:
        convert:
          field: _ingest._value.id
          tag: 'convert_host_access_history_id_to_string'
          type: string
          ignore_missing: true
          on_failure:
            - append:
                tag: append_error_message
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_vectra_detect_log_host_access_history_c5f964b4
      field: vectra_detect.log.host.access_history
      if: ctx.vectra_detect?.log?.host?.access_history instanceof List
      processor:
        date:
          tag: date_ingest_value_lastSeen_to_ingest_value_last_seen
          field: _ingest._value.lastSeen
          target_field: _ingest._value.last_seen
          formats:
            - ISO8601
          ignore_failure: true
  - foreach:
      tag: foreach_vectra_detect_log_host_access_history_cc363d10
      field: vectra_detect.log.host.access_history
      if: ctx.vectra_detect?.log?.host?.access_history instanceof List
      processor:
        convert:
          field: _ingest._value.privilege
          target_field: _ingest._value.privilege_value
          tag: 'convert_host_access_history_privilege_to_long'
          type: long
          ignore_missing: true
          on_failure:
            - append:
                tag: append_error_message_cc8cbe7c
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_vectra_detect_log_host_access_history_5a7da30c
      field: vectra_detect.log.host.access_history
      if: ctx.vectra_detect?.log?.host?.access_history instanceof List
      processor:
        rename:
          tag: rename_ingest_value_privilegeCategory_to_ingest_value_privilege_category
          field: _ingest._value.privilegeCategory
          target_field: _ingest._value.privilege_category
          ignore_missing: true
  - foreach:
      tag: foreach_vectra_detect_log_host_access_history_bcc86175
      field: vectra_detect.log.host.access_history
      if: ctx.vectra_detect?.log?.host?.access_history instanceof List
      processor:
        remove:
          tag: remove_ingest_value_lastSeen
          field:
            - _ingest._value.lastSeen
            - _ingest._value.privilege
          ignore_missing: true
  - json:
      field: json.service_access_history
      tag: 'json_to_split_service_access_history'
      if: ctx.json?.service_access_history instanceof String
      on_failure:
        - append:
            tag: append_error_message_eda326d2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_service_access_history_to_vectra_detect_log_service_access_history_a77a851a
      field: json.service_access_history
      target_field: vectra_detect.log.service.access_history
      ignore_missing: true
  - foreach:
      tag: foreach_vectra_detect_log_service_access_history_fd75dd5d
      field: vectra_detect.log.service.access_history
      if: ctx.vectra_detect?.log?.service?.access_history instanceof List
      processor:
        convert:
          field: _ingest._value.id
          tag: 'convert_service_access_history_id_to_string'
          type: string
          ignore_missing: true
          on_failure:
            - append:
                tag: append_error_message_97c697f1
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_vectra_detect_log_service_access_history_8798153c
      field: vectra_detect.log.service.access_history
      if: ctx.vectra_detect?.log?.service?.access_history instanceof List
      processor:
        date:
          tag: date_ingest_value_lastSeen_to_ingest_value_last_seen_3a2780b9
          field: _ingest._value.lastSeen
          target_field: _ingest._value.last_seen
          formats:
            - ISO8601
          ignore_failure: true
  - foreach:
      tag: foreach_vectra_detect_log_service_access_history_0e4c2937
      field: vectra_detect.log.service.access_history
      if: ctx.vectra_detect?.log?.service?.access_history instanceof List
      processor:
        convert:
          field: _ingest._value.privilege
          target_field: _ingest._value.privilege_value
          tag: 'convert_service_access_history_privilege_to_long'
          type: long
          ignore_missing: true
          on_failure:
            - append:
                tag: append_error_message_03e50628
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_vectra_detect_log_service_access_history_5eaee764
      field: vectra_detect.log.service.access_history
      if: ctx.vectra_detect?.log?.service?.access_history instanceof List
      processor:
        rename:
          tag: rename_ingest_value_privilegeCategory_to_ingest_value_privilege_category_4ee69f28
          field: _ingest._value.privilegeCategory
          target_field: _ingest._value.privilege_category
          ignore_missing: true
  - foreach:
      tag: foreach_vectra_detect_log_service_access_history_3ffc5ea2
      field: vectra_detect.log.service.access_history
      if: ctx.vectra_detect?.log?.service?.access_history instanceof List
      ignore_missing: true
      processor:
        append:
          tag: append_related_user
          field: related.user
          value: '{{{_ingest._value.uid}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_vectra_detect_log_service_access_history_28a962dd
      field: vectra_detect.log.service.access_history
      if: ctx.vectra_detect?.log?.service?.access_history instanceof List
      processor:
        remove:
          tag: remove_ingest_value_lastSeen_89c9def1
          field:
            - _ingest._value.lastSeen
            - _ingest._value.privilege
          ignore_missing: true
  - rename:
      tag: rename_json_category_to_vectra_detect_log_category_ffa4bf2b
      field: json.category
      target_field: vectra_detect.log.category
      ignore_missing: true
  - rename:
      tag: rename_json_last_detection_type_to_vectra_detect_log_last_detection_type_cff21ed9
      field: json.last_detection_type
      target_field: vectra_detect.log.last_detection_type
      ignore_missing: true
on_failure:
  - append:
      tag: append_error_message_99a49937
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
