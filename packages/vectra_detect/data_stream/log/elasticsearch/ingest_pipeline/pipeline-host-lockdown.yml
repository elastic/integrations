---
description: Pipeline for processing Vectra Detect Host Lockdown logs.
processors:
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - set:
      tag: set_event_category_ba9b1d84
      field: event.category
      value: [host]
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: [info]
  - rename:
      tag: rename_json_action_to_vectra_detect_log_action_a3a155e3
      field: json.action
      target_field: vectra_detect.log.action
      ignore_missing: true
  - set:
      tag: set_event_action_39595d46
      field: event.action
      copy_from: vectra_detect.log.action
      ignore_empty_value: true
  - convert:
      field: json.success
      tag: 'convert_success_to_boolean'
      target_field: vectra_detect.log.success
      type: boolean
      ignore_missing: true
      if: ctx.json?.success != ''
      on_failure:
        - append:
            tag: append_error_message_cbaf1f40
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_outcome_13de38af
      field: event.outcome
      value: success
      if: ctx.vectra_detect?.log?.success == true
  - set:
      tag: set_event_outcome_4c2263a3
      field: event.outcome
      value: failure
      if: ctx.vectra_detect?.log?.success == false
  - rename:
      tag: rename_json_host_name_to_vectra_detect_log_host_name_8bf68b92
      field: json.host_name
      target_field: vectra_detect.log.host.name
      ignore_missing: true
  - set:
      tag: set_host_hostname_bf4a7eaa
      field: host.hostname
      copy_from: vectra_detect.log.host.name
      ignore_empty_value: true
  - rename:
      tag: rename_json_user_to_vectra_detect_log_user_name_c118b136
      field: json.user
      target_field: vectra_detect.log.user.name
      ignore_missing: true
  - set:
      tag: set_user_name_3ba7f22c
      field: user.name
      copy_from: vectra_detect.log.user.name
      ignore_empty_value: true
  - rename:
      tag: rename_json_category_to_vectra_detect_log_category_ffa4bf2b
      field: json.category
      target_field: vectra_detect.log.category
      ignore_missing: true
  - convert:
      field: json.will_retry
      tag: 'convert_will_retry_to_boolean'
      target_field: vectra_detect.log.will_retry
      type: boolean
      ignore_missing: true
      if: ctx.json?.will_retry != ''
      on_failure:
        - append:
            tag: append_error_message_52ee6f9e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_href_to_vectra_detect_log_href_d5d12613
      field: json.href
      target_field: vectra_detect.log.href
      ignore_missing: true
  - set:
      tag: set_event_reference_d36b06ee
      field: event.reference
      copy_from: vectra_detect.log.href
      ignore_empty_value: true
  - uri_parts:
      field: event.reference
      tag: 'uri_parts_to_split_reference'
      if: ctx.event?.reference != null
      on_failure:
        - append:
            tag: append_error_message_526c25fa
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.host_id
      tag: 'convert_host_id_to_string'
      target_field: vectra_detect.log.host.id
      ignore_missing: true
      type: string
      if: ctx.json?.host_id != ''
      on_failure:
        - append:
            tag: append_error_message_4f903c77
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_host_id_04669828
      field: host.id
      copy_from: vectra_detect.log.host.id
      ignore_empty_value: true
  - rename:
      tag: rename_json_edr_type_to_vectra_detect_log_edr_type_86cb5853
      field: json.edr_type
      target_field: vectra_detect.log.edr_type
      ignore_missing: true
  - append:
      tag: append_related_hosts_ca923905
      field: related.hosts
      value: '{{{host.hostname}}}'
      allow_duplicates: false
      if: ctx.host?.hostname != null
on_failure:
  - append:
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
