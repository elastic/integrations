---
description: Pipeline for processing Vectra Detect Campaign logs.
processors:
  - set:
      tag: set_event_kind_d452ef2c
      field: event.kind
      value: event
  - rename:
      tag: rename_json_dest_name_to_vectra_detect_log_dest_name_a6b859ab
      field: json.dest_name
      target_field: vectra_detect.log.dest.name
      ignore_missing: true
  - set:
      tag: set_destination_domain_5f86d307
      field: destination.domain
      copy_from: vectra_detect.log.dest.name
      ignore_empty_value: true
  - convert:
      field: json.dest_ip
      tag: convert_dest_ip_to_ip_74be3566
      target_field: vectra_detect.log.dest.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.dest_ip != ''
      on_failure:
        - append:
            tag: append_error_message_da78584b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_c48c4f6e
      field: related.ip
      value: '{{{vectra_detect.log.dest.ip}}}'
      allow_duplicates: false
      if: ctx.vectra_detect?.log?.dest?.ip != null
  - set:
      tag: set_destination_ip_69f826b4
      field: destination.ip
      copy_from: vectra_detect.log.dest.ip
      ignore_empty_value: true
  - geoip:
      tag: geoip_destination_ip_to_destination_geo_71881fab
      field: destination.ip
      target_field: destination.geo
      ignore_missing: true
  - rename:
      tag: rename_json_action_to_vectra_detect_log_action_de989a31
      field: json.action
      target_field: vectra_detect.log.action
      ignore_missing: true
  - set:
      tag: set_event_action_dd8c3b94
      field: event.action
      copy_from: vectra_detect.log.action
      ignore_empty_value: true
  - convert:
      field: json.campaign_id
      tag: convert_campaign_id_to_string_e189d54d
      target_field: vectra_detect.log.campaign.id
      type: string
      ignore_missing: true
      if: ctx.json?.campaign_id != ''
      on_failure:
        - append:
            tag: append_error_message_2bf9c56c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_id_50560489
      field: event.id
      copy_from: vectra_detect.log.campaign.id
      ignore_empty_value: true
  - rename:
      tag: rename_json_reason_to_vectra_detect_log_reason_b048cc9c
      field: json.reason
      target_field: vectra_detect.log.reason
      ignore_missing: true
  - set:
      tag: set_event_reason_cf7f294a
      field: event.reason
      copy_from: vectra_detect.log.reason
      ignore_empty_value: true
  - rename:
      tag: rename_json_dvchost_to_vectra_detect_log_dvchost_f8ea4df9
      field: json.dvchost
      target_field: vectra_detect.log.dvchost
      ignore_missing: true
  - set:
      tag: set_observer_hostname_501a5b0f
      field: observer.hostname
      copy_from: vectra_detect.log.dvchost
      ignore_empty_value: true
  - convert:
      field: json.src_ip
      tag: convert_src_ip_to_ip_12e29fd4
      target_field: vectra_detect.log.src.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.src_ip != ''
      on_failure:
        - append:
            tag: append_error_message_38b577a8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_2a794596
      field: related.ip
      value: '{{{vectra_detect.log.src.ip}}}'
      allow_duplicates: false
      if: ctx.vectra_detect?.log?.src?.ip != null
  - set:
      tag: set_source_ip_82d97a10
      field: source.ip
      copy_from: vectra_detect.log.src.ip
      ignore_empty_value: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_9a2d4d31
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - convert:
      field: json.det_id
      tag: convert_det_id_to_string_fe7bea0e
      target_field: vectra_detect.log.det_id
      type: string
      ignore_missing: true
      if: ctx.json?.det_id != ''
      on_failure:
        - append:
            tag: append_error_message_99fdaaa1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_src_name_to_vectra_detect_log_src_name_85d71ea2
      field: json.src_name
      target_field: vectra_detect.log.src.name
      ignore_missing: true
  - set:
      tag: set_source_address_5fd81721
      field: source.address
      copy_from: vectra_detect.log.src.name
      ignore_empty_value: true
  - convert:
      field: json.src_hid
      tag: convert_src_hid_to_string_a7d4b0b3
      target_field: vectra_detect.log.src.hid
      type: string
      ignore_missing: true
      if: ctx.json?.src_hid != ''
      on_failure:
        - append:
            tag: append_error_message_a0ea4dba
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_host_id_6813e075
      field: host.id
      copy_from: vectra_detect.log.src.hid
      ignore_empty_value: true
  - convert:
      field: json.dest_id
      tag: convert_dest_id_to_string_76f6a85c
      target_field: vectra_detect.log.dest.id
      type: string
      ignore_missing: true
      if: ctx.json?.dest_id != ''
      on_failure:
        - append:
            tag: append_error_message_75233244
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.timestamp
      tag: date_rename_timestamp_into_custom_09c9efa9
      target_field: vectra_detect.log.timestamp
      formats:
        - UNIX
      if: ctx.json?.timestamp != null && ctx.json.timestamp != ''
      on_failure:
        - append:
            tag: append_error_message_3175c3dc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_campaign_name_to_vectra_detect_log_campaign_name_c0331ee8
      field: json.campaign_name
      target_field: vectra_detect.log.campaign.name
      ignore_missing: true
  - rename:
      tag: rename_json_campaign_link_to_vectra_detect_log_campaign_link_c878fe5f
      field: json.campaign_link
      target_field: vectra_detect.log.campaign.link
      ignore_missing: true
  - set:
      tag: set_event_url_c7e7c3e9
      field: event.url
      copy_from: vectra_detect.log.campaign.link
      ignore_empty_value: true
  - uri_parts:
      field: event.url
      tag: uri_parts_to_split_reference_fc904094
      if: ctx.event?.url != null
      on_failure:
        - append:
            tag: append_error_message_08982829
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_hosts_55a3f259
      field: related.hosts
      value: '{{{observer.hostname}}}'
      allow_duplicates: false
      if: ctx.observer?.hostname != null
on_failure:
  - append:
      tag: append_error_message_9b078312
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
