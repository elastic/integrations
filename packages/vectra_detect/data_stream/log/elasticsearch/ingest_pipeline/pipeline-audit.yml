---
description: Pipeline for processing Vectra Detect Audit logs.
processors:
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - append:
      tag: append_event_category_adea1b04
      field: event.category
      value: session
      allow_duplicates: false
      if: ctx.json?.message?.contains('session') == true
  - append:
      tag: append_event_category_f26c87c7
      field: event.category
      value: authentication
      allow_duplicates: false
      if: ctx.json?.message?.contains('authentication') == true || ctx.json?.message?.contains('log in') == true
  - append:
      tag: append_event_category_104cb540
      field: event.category
      value: configuration
      allow_duplicates: false
      if: ctx.json?.message?.contains('configuration') == true
  - append:
      tag: append_event_type_1678fa17
      field: event.type
      value: end
      allow_duplicates: false
      if: ctx.json?.message?.contains('timeout') == true || ctx.json?.message?.contains('log in') == true
  - rename:
      tag: rename_json_result_to_vectra_detect_log_result_fdb7e62b
      field: json.result
      target_field: vectra_detect.log.result
      ignore_missing: true
  - set:
      tag: set_event_outcome_2531b4af
      field: event.outcome
      value: success
      if: "'success'.equalsIgnoreCase(ctx.vectra_detect?.log?.result) || 'true'.equalsIgnoreCase(ctx.vectra_detect?.log?.result)"
  - set:
      tag: set_event_outcome_ea523cd4
      field: event.outcome
      value: failure
      if: "'failure'.equalsIgnoreCase(ctx.vectra_detect?.log?.result) || 'false'.equalsIgnoreCase(ctx.vectra_detect?.log?.result)"
  - set:
      tag: set_event_outcome_cf4c12d5
      field: event.outcome
      value: unknown
      if: "'pending'.equalsIgnoreCase(ctx.vectra_detect?.log?.result)"
  - rename:
      tag: rename_json_dvchost_to_vectra_detect_log_dvchost_45c085f9
      field: json.dvchost
      target_field: vectra_detect.log.dvchost
      ignore_missing: true
  - set:
      tag: set_observer_hostname_5a621980
      field: observer.hostname
      copy_from: vectra_detect.log.dvchost
      ignore_empty_value: true
  - convert:
      field: json.source_ip
      tag: 'convert_source_ip_to_ip'
      target_field: vectra_detect.log.source.ip
      type: ip
      ignore_missing: true
      if: ctx.json?.source_ip != ''
      on_failure:
        - append:
            tag: append_error_message_3e8a7ceb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_source_ip_0cf2d520
      field: source.ip
      copy_from: vectra_detect.log.source.ip
      ignore_empty_value: true
  - append:
      tag: append_related_ip_b03d78ff
      field: related.ip
      value: '{{{vectra_detect.log.source.ip}}}'
      allow_duplicates: false
      if: ctx.vectra_detect?.log?.source?.ip != null
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - rename:
      tag: rename_json_user_to_vectra_detect_log_user_name_c118b136
      field: json.user
      target_field: vectra_detect.log.user.name
      ignore_missing: true
  - set:
      tag: set_user_name_3ba7f22c
      field: user.name
      copy_from: vectra_detect.log.user.name
      ignore_empty_value: true
  - rename:
      tag: rename_json_role_to_vectra_detect_log_role_11e94a83
      field: json.role
      target_field: vectra_detect.log.role
      ignore_missing: true
  - append:
      tag: append_user_roles_905f46d8
      field: user.roles
      value: '{{{vectra_detect.log.role}}}'
      allow_duplicates: false
      if: ctx.vectra_detect?.log?.role != null
  - rename:
      tag: rename_json_message_to_vectra_detect_log_message_50575791
      field: json.message
      target_field: vectra_detect.log.message
      ignore_missing: true
  - append:
      tag: append_related_hosts_199e34d5
      field: related.hosts
      value: '{{{observer.hostname}}}'
      allow_duplicates: false
      if: ctx.observer?.hostname != null
on_failure:
  - append:
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
