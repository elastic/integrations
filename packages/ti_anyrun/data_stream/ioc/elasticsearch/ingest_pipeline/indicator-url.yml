---
description: Pipeline for processing URL STIX patterns
processors:
  - grok:
      field: _ingest._value
      tag: grok_url_pattern
      patterns:
        - "^\\[?url:value%{SPACE}=%{SPACE}'%{DATA:_tmp.url}'\\]?"
      ignore_failure: true
  - append:
      tag: append_threat_indicator_url_original_725964b1
      field: threat.indicator.url.original
      value: "{{{ _tmp.url }}}"
      if: ctx._tmp?.url != null
  - append:
      tag: append_threat_indicator_name_73fdd83a
      field: threat.indicator.name
      value: "{{{ _tmp.url }}}"
      if: ctx._tmp?.url != null
  - append:
      tag: append_threat_indicator_url_full_2825aba3
      field: threat.indicator.url.full
      value: "{{{ _tmp.url }}}"
      if: ctx._tmp?.url != null
  - remove:
      tag: remove__tmp_cc7d8d90
      field: _tmp
      ignore_missing: true
