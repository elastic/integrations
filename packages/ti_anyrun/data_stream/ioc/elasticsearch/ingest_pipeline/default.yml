---
description: Pipeline for processing ANY.RUN TI Feeds IOCs
processors:
  # Fail if error during the CEL program evaluation
  - terminate:
      tag: data_collection_error_59f7570c
      if: ctx.error?.message != null
      description: error message set and no data to process.
  ####################
  # Event ECS fields #
  ####################
  - set:
      tag: set_event_kind_3410a97a
      field: event.kind
      value: enrichment
  - append:
      tag: append_event_category_4039b90d
      field: event.category
      value: threat
  - append:
      tag: append_event_type_d4da06cc
      field: event.type
      value: indicator
  ######################
  # General ECS fields #
  ######################
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'

  - json:
      field: event.original
      target_field: stix
      tag: stix_event_original_92864458
  - drop:
      if: ctx.stix.type != 'indicator'
      tag: drop_no_indicator_384fa117
  - drop:
      if: ctx.stix.spec_version != '2.1'
      tag: drop_no_stix_2_1_1ce317c8

  - fingerprint:
      tag: fingerprint_to_id_f5eb309b
      fields:
        - stix.id
        - stix.modified
        - stix.pattern
      target_field: "_id"
      ignore_missing: true

  - set:
      tag: set_threat_feed_name_92f40f9d
      field: threat.feed.name
      value: ANY.RUN TI Feeds
  - set:
      tag: set_threat_feed_description_e999dc72
      field: threat.feed.description
      value: Indicator from the ANY.RUN TI Feeds
  - set:
      tag: set_threat_feed_reference_089a1e3f
      field: threat.feed.reference
      value: https://intelligence.any.run/feeds
  - set:
      tag: set_threat_indicator_provider_85b160b4
      field: threat.indicator.provider
      value: ANY.RUN
  ################
  # Dates Fields #
  ################
  - date:
      field: stix.modified
      target_field: "@timestamp"
      formats:
        - "ISO8601"
      if: ctx.stix.modified != null
      tag: date_created_3350f2ad
  #####################
  # Threat ECS Fields #
  #####################
  - append:
      tag: append_threat_indicator_id_851c4a31
      field: threat.indicator.id
      value: '{{{stix.id}}}'
      allow_duplicates: false
  - date:
      field: stix.modified
      target_field: threat.indicator.last_seen
      formats:
        - "ISO8601"
      if: ctx.stix.modified != null
      tag: date_modified_0bc72ddf
  - set:
      field: threat.indicator.modified_at
      copy_from: threat.indicator.last_seen
      if: ctx.threat?.indicator?.last_seen != null
      tag: set_threat_indicator_last_seen_84bbc9df
  - date:
      field: stix.created
      target_field: threat.indicator.first_seen
      formats:
        - "ISO8601"
      if: ctx.stix.created != null
      tag: date_created_7ab09731
  - rename:
      field: stix.name
      target_field: threat.indicator.name
      ignore_missing: true
      tag: rename_name_72ee1849
  - rename:
      field: stix.description
      target_field: threat.indicator.description
      ignore_missing: true
      tag: rename_description_fecb2a33
  - script:
      lang: painless
      if: ctx.stix.confidence != null
      description: Normalize confidence level.
      tag: script_normalize_confidence_f8be41c3
      source: >
        def value = ctx.stix.confidence;
        if (value == 0) {
          ctx.threat.indicator.confidence = "None";
        } else if (value >= 1 && value <= 29) {
          ctx.threat.indicator.confidence = "Low";
        } else if (value >= 30 && value <= 69) {
          ctx.threat.indicator.confidence = "Medium";
        } else if (value >= 70 && value <= 100) {
          ctx.threat.indicator.confidence = "High";
        } else {
          ctx.threat.indicator.confidence = "Not Specified";
        }
  - foreach:
      tag: foreach_stix_labels_c4888632
      field: stix.labels
      if: ctx.stix.labels != null
      processor:
        append:
          field: tags
          value: '{{{ _ingest._value }}}'
          tag: append_tags_05b78755
      ignore_missing: true
      ignore_failure: true
  - remove:
      tag: remove_stix_labels_b8ff2b53
      field: stix.labels
      ignore_missing: true
  - gsub:
      tag: gsub_tags_522e9da0
      field: tags
      pattern: '\\\"'
      replacement: '\"'
      ignore_missing: true
  ##################
  # IOC expiration #
  ##################
  - date:
      field: stix.valid_until
      target_field: stix.ioc_expiration_date
      formats:
        - "ISO8601"
      if: ctx.stix.valid_until != null
      tag: date_ioc_expiration_valid_until_762d1e10
  - set:
      field: stix.ioc_expiration_date
      copy_from: threat.indicator.modified_at
      if: >-
        ctx.stix.ioc_expiration_date == null &&
        ctx.stix.revoked != null &&
        ctx.stix.revoked == true
      tag: set_ioc_expiration_revoked_38c27d2f

  - script:
      lang: painless
      tag: script_conf_ioc_expiration_9c653cf7
      if: >-
        ctx.stix.ioc_expiration_date == null &&
        ctx._conf?.ioc_expiration_duration != null &&
        ctx._conf.ioc_expiration_duration != ''
      source: >
        ZonedDateTime ioc_expiration_date;
        ZonedDateTime updated_at;
        def dur = ctx._conf.ioc_expiration_duration;

        if (ctx.threat.indicator.last_seen != null) {
          updated_at = ZonedDateTime.parse(ctx.threat.indicator.last_seen);
        } else { 
          updated_at = ZonedDateTime.parse(ctx.threat.indicator.first_seen);
        } 
        

        if (dur instanceof String){
          String time_unit = dur.substring(dur.length() -  1, dur.length());
          String time_value = dur.substring(0, dur.length() - 1);
          if (time_unit == 'd') {
            ioc_expiration_date = updated_at.plusDays(Long.parseLong(time_value));
          } else if (time_unit == 'h') {
            ioc_expiration_date = updated_at.plusHours(Long.parseLong(time_value));
          } else if (time_unit == 'm') {
            ioc_expiration_date = updated_at.plusMinutes(Long.parseLong(time_value));
          } else {
            if (ctx.error == null) {
              ctx.error = new HashMap();
            }
            if (ctx.error.message == null) {
              ctx.error.message = new ArrayList();
            }
            ctx.error.message.add('invalid ioc_expiration_duration: using default 90 days');
            ioc_expiration_date = updated_at.plusDays(90L);
          }
        } else {
            ioc_expiration_date = updated_at.plusDays(90L);
        }

        ctx.stix.ioc_expiration_date = ioc_expiration_date;
      on_failure:
        - append:
            tag: append_error_message_3d3c0dbd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  - script:
      lang: painless
      tag: script_set_ioc_expiration_reason_2bdd060c
      if: ctx.stix.ioc_expiration_date != null
      params:
        valid_until: "Expiration set from valid_until field"
        revoked: "Expiration set from revoked field"
        default: "Expiration set by Elastic from the integration's parameter `IOC Expiration Duration`"
      source: >
        if (ctx.stix.valid_until != null) {
          ctx.stix.ioc_expiration_reason = params.valid_until;
        } else if (ctx.stix.revoked != null && ctx.stix.revoked == true) {
          ctx.stix.ioc_expiration_reason = params.revoked;
        } else {
          ctx.stix.ioc_expiration_reason = params.default;
        }

  - date:
      field: stix.ioc_expiration_date
      tag: date_ioc_expiration_date_e239b09b
      target_field: stix.ioc_expiration_date
      formats:
        - "ISO8601"
        - "UNIX"
      on_failure:
        - append:
            tag: append_error_message_816150ca
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

        - fail:
            tag: fail_date_processor_fails_leads_debbf6db
            description: 'If this date processor fails, it leads to transform errors, hence failing the document for investigation.'
            message: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed'
  - rename:
      field: _conf.ioc_expiration_duration
      tag: rename_conf_ioc_expiration_duration_40f4075f
      target_field: stix.ioc_expiration_duration
      ignore_missing: true
  ################
  # IOC patterns #
  ################
  - set:
      tag: set_threat_indicator_type_cf3ac7b3
      field: threat.indicator.type
      value: domain-name
      if: ctx.stix.pattern?.startsWith('[domain-name') == true
  - set:
      tag: set_threat_indicator_type_3742b6f7
      field: threat.indicator.type
      value: ipv4-addr
      if: ctx.stix.pattern?.startsWith('[ipv4-addr') == true
  - set:
      tag: set_threat_indicator_type_e4083707
      field: threat.indicator.type
      value: url
      if: ctx.stix.pattern?.startsWith('[url') == true

  - split:
      field: stix.pattern
      target_field: stix._patterns
      separator: '\s+AND\s+|\s+OR\s+'
      if: ctx.threat?.indicator?.type != null && ctx.stix.pattern != null
      tag: split_pattern_61ae3ad5

  - foreach:
      tag: foreach_stix__patterns_a557c2bb
      field: stix._patterns
      if: ctx.threat?.indicator?.type == 'domain-name'
      ignore_missing: true
      processor:
        pipeline:
          tag: pipeline_ed4c583d
          name: '{{ IngestPipeline "indicator-domain-name" }}'

  - foreach:
      tag: foreach_stix__patterns_2a193093
      field: stix._patterns
      if: ctx.threat?.indicator?.type?.startsWith('ip') == true
      ignore_missing: true
      processor:
        pipeline:
          tag: pipeline_5e41cf40
          name: '{{ IngestPipeline "indicator-ip" }}'

  - foreach:
      tag: foreach_stix__patterns_735eb346
      field: stix._patterns
      if: ctx.threat?.indicator?.type == 'url'
      ignore_missing: true
      processor:
        pipeline:
          tag: pipeline_3617c244
          name: '{{ IngestPipeline "indicator-url" }}'

  - remove:
      tag: remove_5360bf6d
      field:
        - "_conf"
        - "stix._patterns"
      ignore_missing: true

  - script:
      lang: painless
      description: Unscape values recursively.
      tag: script_unscape_values_964e71a6
      source: >
        void unescape(Object obj) {
          if (obj instanceof Map) {
            for (entry in ((Map)obj).entrySet()) {
              Object value = entry.getValue();
              unescape(value);
              if (value instanceof String) {
                entry.setValue(((String)value).replace('\\\\', '\\'));
              }
            }
          } else if (obj instanceof List) {
            for (int i = 0; i < ((List)obj).size(); i++) {
              Object value = ((List)obj).get(i);
              unescape(value);
              if (value instanceof String) {
                ((List)obj).set(i, ((String)value).replace('\\\\', '\\'));
              }
            }
          }
        }
        unescape(ctx);
  - script:
      lang: painless
      description: Drops null/empty values recursively.
      tag: drop_null_empty_values_31b06a30
      source: >
        boolean drop(Object o) {
          if (o == null || o == '') {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_dba3695f
      field: error.message
      value: >
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
