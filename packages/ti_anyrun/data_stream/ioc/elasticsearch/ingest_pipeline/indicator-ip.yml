---
description: Pipeline for processing IPv4 and IPv6 STIX patterns
processors:
  - grok:
      field: _ingest._value
      tag: grok_ip_pattern
      patterns:
        - "^\\[?ipv4-addr:value%{SPACE}=%{SPACE}'%{IP:_tmp.ip}'\\]?"
        - "^\\[?ipv4-addr:value%{SPACE}=%{SPACE}'%{IP:_tmp.ip}/%{NUMBER}'\\]?"
        - "^\\[?ipv6-addr:value%{SPACE}=%{SPACE}'%{IP:_tmp.ip}'\\]?"
      ignore_failure: true
  - append:
      tag: append_threat_indicator_ip_41710de8
      field: threat.indicator.ip
      value: "{{{ _tmp.ip }}}"
      if: ctx._tmp?.ip != null
  - append:
      tag: append_threat_indicator_name_3cb1f6c2
      field: threat.indicator.name
      value: "{{{ _tmp.ip }}}"
      if: ctx._tmp?.ip != null
  - append:
      tag: append_related_ip_fb155127
      field: related.ip
      value: "{{{ _tmp.ip }}}"
      if: ctx._tmp?.ip != null
      allow_duplicates: false
  - remove:
      tag: remove__tmp_cc7d8d90
      field: _tmp
      ignore_missing: true
