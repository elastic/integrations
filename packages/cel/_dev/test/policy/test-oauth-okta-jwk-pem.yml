vars:
  url: http://example.com:9001
  program: |-
    get("https://example.com/").Body.as(body, {"events": [{"message": "x"}]})
  oauth_provider: okta
  oauth_id: client-id
  oauth_token_url: https://example.okta.com/oauth2/v1/token
  oauth_scopes:
    - okta.logs.read
  interval: 5m
  oauth_okta_jwt_pem: |-
    -----BEGIN PRIVATE KEY-----
    MIIEvQIBADANBgkqhkiG9w0BAQEFAASC
    -----END PRIVATE KEY-----
