# newer versions go on top
- version: "0.1.1"
  changes:
    - description: |
        Fix all identified issues for publish readiness:
        - Kibana dashboard: stringify panelsJSON, optionsJSON and searchSourceJSON to match saved-object schema.
        - Date parsing: support variable-length fractional seconds (1–9 digits) in threat-feed pipelines so @timestamp / first_seen / last_seen are populated.
        - System tests: correct malware/spam/phishing test-default-config.yml to use data_stream.vars so they target the mock server.
        - CEL pagination: exclude CSV header rows from size/offset calculation in threat-feed programs.
        - Fields: declare missing ECS fields (event.*, ecs.version, threat.indicator.*) for the three threat-feed data streams.
        - nrd_with_whois: move phase/offset/date tracking under the persistent `cursor` key so agent restarts do not force full re-ingestion.
        - Threat-feed defaults: raise resource_interval default from 2m to 1h and correct the var description (feeds re-fetch fully each poll).
        - Align malware pipeline on_failure tags; fix README CEL auth boilerplate (apiKey query param, not request.headers).
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20754
- version: "0.1.0"
  changes:
    - description: Initial release of the WhoisFreaks threat intelligence integration.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20754
