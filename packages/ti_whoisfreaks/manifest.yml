format_version: 3.6.6
name: ti_whoisfreaks
title: "WhoisFreaks"
version: 0.1.1
source:
  license: "Elastic-2.0"
description: "Collects newly registered gTLD and ccTLD WHOIS records via the WhoisFreaks domainer stream API over HTTPS and indexes them into Elasticsearch indices as threat intelligence."
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^8.13.0"
  elastic:
    subscription: "basic"
    capabilities:
      - security
screenshots:
  - src: /img/whoisfreaks-overview.png
    title: Sample screenshot
    size: 1914x966
    type: image/png
icons:
  - src: /img/whoisfreaks.svg
    title: WhoisFreaks logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: ti_whoisfreaks
    title: WhoisFreaks
    description: Collect domain threat intelligence records via CEL API input.
    data_streams:
      - nrd_with_whois
      - threat_feed_spam
      - threat_feed_malware
      - threat_feed_phishing
    inputs:
      - type: cel
        title: WhoisFreaks CEL Input
        description: Collect domain and threat intelligence data using CEL input.
        vars:
          - name: api_key
            type: text
            secret: true
            title: "API Key"
            description: |-
              Your WhoisFreaks API Key, from the WhoisFreaks billing dashboard. It is
              sent as the `apiKey` query parameter on each stream request.
            required: true
            show_user: true
owner:
  github: WhoisFreaks
  type: partner
