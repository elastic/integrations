format_version: 3.6.6
name: ti_whoisfreaks
title: "WhoisFreaks"
version: 1.0.0
source:
  license: "Elastic-2.0"
description: "Collects historical and live WHOIS database records as compressed CSV files via secure HTTPS from WhoisFreaks and indexes them into Elastic search indices as threat intelligence."
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^8.13.0"
  elastic:
    subscription: "basic"
    capabilities:
      - security
screenshots:
  - src: /img/whoisfreaks-overview.png
    title: Sample screenshot
    size: 1914x966
    type: image/png
icons:
  - src: /img/whoisfreaks.svg
    title: WhoisFreaks logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: whois
    title: WhoisFreaks
    description: Collect domain threat intelligence records via CEL API input.
    data_streams:
      - whois
    inputs:
      - type: cel
        title: WhoisFreaks CEL Input
        description: Collect domain and threat intelligence data using CEL input.
owner:
  github: qayyum-jfreaks
  type: community
