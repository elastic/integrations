wait_for_data_timeout: 1m
input: cel
service: ti_whoisfreaks
vars:
  api_key: test_api_key
data_stream:
  vars:
    url: "http://{{Hostname}}:{{Port}}/v3.3/stream/domainer"
    status_url: "http://{{Hostname}}:{{Port}}/v3.4/status"
    # Not a calendar date: one error event, no request for it, then the latest
    # files (3 gTLD rows and 1 ccTLD row).
    file_date: "2026-13-45"
    page_limit: 2
    interval: 1h
    enable_request_tracer: true
assert:
  hit_count: 5
