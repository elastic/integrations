wait_for_data_timeout: 1m
input: cel
service: ti_whoisfreaks
vars:
  # The mock answers this key with HTTP 400 "Api Access Exception", which is an auth error: one error event, cursor kept.
  api_key: invalid_api_key
data_stream:
  vars:
    url: "http://{{Hostname}}:{{Port}}/v3.3/stream/domainer"
    status_url: "http://{{Hostname}}:{{Port}}/v3.4/status"
    page_limit: 2
    interval: 1h
    enable_request_tracer: true
assert:
  hit_count: 1
