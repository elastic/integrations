wait_for_data_timeout: 1m
input: cel
service: ti_whoisfreaks
vars:
  # The status endpoint returns HTML: one error event and no stream request.
  api_key: test_api_key
data_stream:
  vars:
    url: "http://{{Hostname}}:{{Port}}/v3.3/stream/domainer"
    status_url: "http://{{Hostname}}:{{Port}}/v3.4/status-malformed"
    page_limit: 2
    interval: 1h
    enable_request_tracer: true
assert:
  hit_count: 1
