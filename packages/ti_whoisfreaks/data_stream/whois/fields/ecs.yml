- name: domain
  type: group
  fields:
    - name: registered_domain
      level: extended
      type: keyword
      description: The highest registered domain, stripped of any subdomains.
      example: example.com
    - name: registrar
      type: group
      fields:
        - name: name
          level: extended
          type: keyword
          description: Name of the domain registrar.
- name: event
  type: group
  fields:
    - name: kind
      type: keyword
      description: The kind of the event.
    - name: category
      type: keyword
      description: Event category.
    - name: type
      type: keyword
      description: Event type.
    - name: dataset
      type: keyword
      description: Name of the dataset.
- name: ecs
  type: group
  fields:
    - name: version
      type: keyword
      description: ECS version this event conforms to.
- name: threat
  type: group
  description: Fields to classify events and alerts according to a threat taxonomy.
  fields:
    - name: feed
      type: group
      fields:
        - name: name
          type: keyword
          description: The name of the threat feed.
        - name: dashboard_id
          type: keyword
          description: Dashboard ID used for threat feed visualizations.
    - name: indicator
      type: group
      fields:
        - name: type
          type: keyword
          description: Type of indicator as represented by Cyber Observable in STIX 2.0.
        - name: domain
          type: keyword
          description: Domain name related to a threat indicator.
        - name: provider
          type: keyword
          description: The name of the indicator's provider.
        - name: reference
          type: keyword
          description: Reference URL pointing to the threat indicator information.
