- name: input
  type: group
  description: Information about the Elastic Agent input collected.
  fields:
    - name: type
      type: keyword
      description: Type of input used to ingest the logs (e.g., cel).
- name: threat
  type: group
  description: Threat intelligence metadata populated from WhoisFreaks feeds.
  fields:
    - name: indicator.domain
      type: keyword
      description: Duplicate copy of the indicator domain for SIEM compatibility.
- name: whoisfreaks
  type: group
  description: WhoisFreaks Threat Feed custom tracking parameters.
  fields:
    - name: threat_feed
      type: group
      description: Threat feed metadata from WhoisFreaks.
      fields:
        - name: no_of_threat_matched_pivots
          type: integer
          description: Number of matched pivots for the threat indicator.
        - name: confidence
          type: float
          description: Numeric confidence score from the threat feed.
