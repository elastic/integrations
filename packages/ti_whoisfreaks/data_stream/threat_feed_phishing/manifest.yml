title: "Threat Feed Phishing"
type: logs
ilm_policy: logs-ti_whoisfreaks.threat_feed_phishing-default_policy
streams:
  - input: cel
    title: "Phishing Domain Feed"
    description: |-
      The Phishing Domain Feed delivers a daily CSV file of domains observed hosting credential theft pages or impersonating trusted brands. Each feed begins with verified phishing seed domains, from which the pipeline extracts shared attributes such as registrant email, phone, organization, NS, MX, and CNAME records. These pivots are then matched across the WhoisFreaks domain database to surface related domains, often before they are reported on public blocklists. Security teams load the feed into mail gateways and SIEMs to block or investigate domains built for credential theft
    template_path: cel.yml.hbs
    vars:
      - name: url
        type: text
        title: "URL"
        description: URL of the WhoisFreaks phishing threat feed endpoint.
        required: true
        show_user: false
        default: https://files.whoisfreaks.com/v3.4/stream/threat-feed/phishing
      - name: interval
        type: text
        title: "Interval"
        description: |-
          WhoisFreaks threat feeds are published as daily CSV snapshots. Re-fetching
          them every hour creates unnecessary API load and quota waste. The
          recommended production default is 24h; increase only if your API plan or
          vendor policy requires a slower cadence.
        required: true
        show_user: true
        default: 24h
      - name: page_limit
        type: integer
        title: "Page Size"
        description: |-
          Number of records requested per page (the `limit` query parameter sent to the feed
          endpoint). The feed is paged with a dynamic `offset` until a page comes
          back short, so this only controls memory and request count per poll, not
          how much data is ingested. Larger pages mean fewer requests but more
          memory per request. 5000 is a safe default; lower it on small agents.
        required: true
        show_user: true
        default: 5000
      - name: ioc_expiration_duration
        type: text
        title: IOC Expiration Duration
        description: >-
          Indicator is expired after this duration since its last seen timestamp. Supported units for this parameter are d/h/m. Example `10d`. Default value is `90d` i.e., 90 days.
        multi: false
        required: true
        show_user: true
        default: "90d"
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 5m
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        multi: false
        default: false
        required: false
        show_user: false
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - whoisfreaks-threat-feed-phishing
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
