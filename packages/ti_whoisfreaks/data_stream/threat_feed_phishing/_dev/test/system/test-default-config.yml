input: cel
service: ti_whoisfreaks
vars:
  api_key: test_api_key
data_stream:
  vars:
    url: "http://{{Hostname}}:{{Port}}/v3.4/stream/threat-feed/phishing"
    # The mock serves 3 rows over 2 pages.
    page_limit: 2
    interval: 1h
    ioc_expiration_duration: 5d
    enable_request_tracer: true
    preserve_original_event: true
assert:
  hit_count: 3
