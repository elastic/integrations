# 1. Standard ECS fields being populated by your pipeline
- name: threat.indicator.domain
  type: keyword
  description: Domain name of the threat indicator.
- name: threat.feed.threat_type
  type: keyword
  description: Type of threat (e.g., spam, malware, phishing).
- name: threat.indicator.confidence
  type: float
  description: Confidence score of the threat indicator.
# 2. Custom vendor-specific fields unique to WhoisFreaks
- name: whoisfreaks
  type: group
  description: WhoisFreaks Threat Feed custom tracking parameters.
  fields:
    - name: threat_feed
      type: group
      description: Threat feed metadata from WhoisFreaks.
      fields:
        - name: no_of_threat_matched_pivots
          type: integer
          description: Number of matched pivots for the threat indicator.
