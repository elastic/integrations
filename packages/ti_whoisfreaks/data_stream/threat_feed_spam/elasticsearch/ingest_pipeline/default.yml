---
description: Ingest pipeline for WhoisFreaks Spam Threat Feed
processors:
  - pipeline:
      tag: pipeline_logs_ti_whoisfreaks_threat_feed_spam_custom
      name: logs-ti_whoisfreaks.threat_feed_spam@custom
      ignore_missing_pipeline: true
      ignore_failure: true
  # Preserve upstream API errors without treating them as threat indicators.
  - set:
      tag: set_event_kind_error
      field: event.kind
      value: pipeline_error
      if: "ctx.error != null"
  - set:
      tag: set_event_kind_default
      field: event.kind
      value: enrichment
      if: "ctx.error == null"
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: ti_whoisfreaks.threat_feed_spam
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_event_category
      field: event.category
      value: ["threat"]
      if: "ctx.error == null"
  - set:
      tag: set_event_type
      field: event.type
      value: ["indicator"]
      if: "ctx.error == null"
  - trim:
      tag: trim_message
      field: message
      ignore_missing: true
      if: "ctx.error == null"
  - csv:
      tag: parse_csv
      field: message
      target_fields:
        - threat.indicator.domain
        - _temp.threat_type
        - whoisfreaks.threat_feed.confidence
        - _temp.first_seen
        - _temp.last_seen
        - whoisfreaks.threat_feed.no_of_threat_matched_pivots
      ignore_missing: true
      if: "ctx.error == null"
  - set:
      tag: set_feed_name
      field: threat.feed.name
      value: WhoisFreaks
      if: "ctx.error == null"
  - set:
      tag: set_indicator_type
      field: threat.indicator.type
      value: domain-name
      if: "ctx.error == null"
  - set:
      tag: set_indicator_provider
      field: threat.indicator.provider
      value: WhoisFreaks
      if: "ctx.error == null"
  - set:
      tag: set_indicator_reference
      field: threat.indicator.reference
      value: https://whoisfreaks.com/
      if: "ctx.error == null"
  - convert:
      tag: convert_confidence
      field: whoisfreaks.threat_feed.confidence
      type: float
      ignore_missing: true
      if: "ctx.error == null"
  - convert:
      tag: convert_pivots
      field: whoisfreaks.threat_feed.no_of_threat_matched_pivots
      type: integer
      ignore_missing: true
      if: "ctx.error == null"
  - date:
      tag: set_timestamp
      field: _temp.last_seen
      target_field: '@timestamp'
      formats: ["yyyy-MM-dd HH:mm:ss.SSSSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSXXX", "yyyy-MM-dd HH:mm:ss.SSXXX", "yyyy-MM-dd HH:mm:ss.SXXX", "yyyy-MM-dd HH:mm:ssXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSX", "yyyy-MM-dd HH:mm:ss.SSSX", "yyyy-MM-dd HH:mm:ss.SSX", "yyyy-MM-dd HH:mm:ss.SX", "yyyy-MM-dd HH:mm:ssX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSS", "yyyy-MM-dd HH:mm:ss.SSSS", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss.SS", "yyyy-MM-dd HH:mm:ss.S", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
      ignore_failure: true
      if: "ctx.error == null"
  - date:
      tag: set_first_seen
      field: _temp.first_seen
      target_field: threat.indicator.first_seen
      formats: ["yyyy-MM-dd HH:mm:ss.SSSSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSXXX", "yyyy-MM-dd HH:mm:ss.SSXXX", "yyyy-MM-dd HH:mm:ss.SXXX", "yyyy-MM-dd HH:mm:ssXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSX", "yyyy-MM-dd HH:mm:ss.SSSX", "yyyy-MM-dd HH:mm:ss.SSX", "yyyy-MM-dd HH:mm:ss.SX", "yyyy-MM-dd HH:mm:ssX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSS", "yyyy-MM-dd HH:mm:ss.SSSS", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss.SS", "yyyy-MM-dd HH:mm:ss.S", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
      ignore_failure: true
      if: "ctx.error == null"
  - date:
      tag: set_last_seen
      field: _temp.last_seen
      target_field: threat.indicator.last_seen
      formats: ["yyyy-MM-dd HH:mm:ss.SSSSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSSXXX", "yyyy-MM-dd HH:mm:ss.SSSXXX", "yyyy-MM-dd HH:mm:ss.SSXXX", "yyyy-MM-dd HH:mm:ss.SXXX", "yyyy-MM-dd HH:mm:ssXXX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSSX", "yyyy-MM-dd HH:mm:ss.SSSSX", "yyyy-MM-dd HH:mm:ss.SSSX", "yyyy-MM-dd HH:mm:ss.SSX", "yyyy-MM-dd HH:mm:ss.SX", "yyyy-MM-dd HH:mm:ssX", "yyyy-MM-dd HH:mm:ss.SSSSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss.SSSSS", "yyyy-MM-dd HH:mm:ss.SSSS", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss.SS", "yyyy-MM-dd HH:mm:ss.S", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
      ignore_failure: true
      if: "ctx.error == null"
  - fingerprint:
      tag: fingerprint_for_dedup
      fields:
        - threat.indicator.domain
        - threat.indicator.last_seen
      target_field: _id
      if: "ctx.error == null && ctx.threat?.indicator?.url?.domain != null && ctx.threat?.indicator?.last_seen != null"
      ignore_missing: true
  - remove:
      tag: drop_temporary_fields
      field: _temp
      ignore_missing: true
on_failure:
  - set:
      tag: set_error_message
      field: error.message
      value: >-
        Processor '{{ _ingest.on_failure_processor_type }}' with tag '{{ _ingest.on_failure_processor_tag }}' in pipeline '{{ _ingest.pipeline }}' failed with message '{{ _ingest.on_failure_message }}'
  - set:
      tag: set_pipeline_error
      field: event.kind
      value: pipeline_error
