---
description: Pipeline for processing WhoisFreaks spam threat feed indicators.
processors:
  - terminate:
      tag: terminate_cel_failure
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: '9.5.0'
  - set:
      tag: set_event_kind
      field: event.kind
      value: enrichment
  - append:
      tag: append_event_category_threat
      field: event.category
      value: threat
      allow_duplicates: false
  - append:
      tag: append_event_type_indicator
      field: event.type
      value: indicator
      allow_duplicates: false
  - rename:
      tag: rename_message_to_event_original
      field: message
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      tag: remove_message
      field: message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  # CSV columns: domain, threat_type, confidence, first_seen, last_seen, no_of_threat_matched_pivots.
  - csv:
      tag: csv_event_original
      field: event.original
      target_fields:
        - threat.indicator.url.domain
        - whoisfreaks.threat_feed.threat_type
        - whoisfreaks.threat_feed.confidence
        - _temp.first_seen
        - _temp.last_seen
        - whoisfreaks.threat_feed.no_of_threat_matched_pivots
  - set:
      tag: set_threat_indicator_name
      field: threat.indicator.name
      copy_from: threat.indicator.url.domain
      ignore_empty_value: true
  - set:
      tag: set_threat_indicator_type
      field: threat.indicator.type
      value: domain-name
  - set:
      tag: set_threat_indicator_provider
      field: threat.indicator.provider
      value: WhoisFreaks
  - set:
      tag: set_threat_indicator_reference
      field: threat.indicator.reference
      value: https://whoisfreaks.com/
  - convert:
      tag: convert_whoisfreaks_threat_feed_confidence
      field: whoisfreaks.threat_feed.confidence
      type: float
      ignore_missing: true
  - convert:
      tag: convert_whoisfreaks_threat_feed_no_of_threat_matched_pivots
      field: whoisfreaks.threat_feed.no_of_threat_matched_pivots
      type: long
      ignore_missing: true
  # The feed timestamps look like `2026-06-25 13:45:35.401434+00`; normalise them to ISO 8601.
  - gsub:
      tag: gsub_temp_first_seen_date_separator
      field: _temp.first_seen
      pattern: '^(\d{4}-\d{2}-\d{2}) '
      replacement: '$1T'
      ignore_missing: true
  - gsub:
      tag: gsub_temp_first_seen_offset
      field: _temp.first_seen
      pattern: '([+-]\d{2})$'
      replacement: '$1:00'
      ignore_missing: true
  - gsub:
      tag: gsub_temp_last_seen_date_separator
      field: _temp.last_seen
      pattern: '^(\d{4}-\d{2}-\d{2}) '
      replacement: '$1T'
  - gsub:
      tag: gsub_temp_last_seen_offset
      field: _temp.last_seen
      pattern: '([+-]\d{2})$'
      replacement: '$1:00'
  - date:
      tag: date_temp_first_seen
      field: _temp.first_seen
      target_field: threat.indicator.first_seen
      formats:
        - ISO8601
      if: ctx._temp?.first_seen != null && ctx._temp.first_seen != ''
  - date:
      tag: date_temp_last_seen
      field: _temp.last_seen
      target_field: threat.indicator.last_seen
      formats:
        - ISO8601
  - set:
      tag: set_timestamp_from_last_seen
      field: '@timestamp'
      copy_from: threat.indicator.last_seen
  # Deduplicate so a re-polled daily snapshot does not create duplicate documents.
  - fingerprint:
      tag: fingerprint_for_dedup
      fields:
        - threat.indicator.url.domain
        - threat.indicator.last_seen
      target_field: _id
  ######################
  #   IOC expiration   #
  ######################
  - script:
      tag: script_set_deleted_at
      lang: painless
      description: Indicator expiration is computed as last_seen + ioc_expiration_duration (default 90d). Falls back to 90d when the setting is absent (e.g. during upgrade) or invalid.
      source: |-
        def configured = (ctx._conf?.ioc_expiration_duration instanceof String) ? ctx._conf.ioc_expiration_duration.trim() : '';
        def dur = (configured != '') ? configured : '90d';
        ZonedDateTime lastSeen = ZonedDateTime.parse(ctx.threat.indicator.last_seen);
        ZonedDateTime deletedAt = null;
        String unit = dur.substring(dur.length() - 1).toLowerCase();
        long value = -1L;
        try {
          value = Long.parseLong(dur.substring(0, dur.length() - 1));
        } catch (NumberFormatException e) {}
        if (value >= 0 && unit == 'd') {
          deletedAt = lastSeen.plusDays(value);
        } else if (value >= 0 && unit == 'h') {
          deletedAt = lastSeen.plusHours(value);
        } else if (value >= 0 && unit == 'm') {
          deletedAt = lastSeen.plusMinutes(value);
        } else {
          // Flag the fallback with a tag rather than error.message: the latest transform
          // excludes documents with error.message, so they would never become active IOCs.
          deletedAt = lastSeen.plusDays(90L);
          if (ctx.tags == null) {
            ctx.tags = new ArrayList();
          }
          if (!ctx.tags.contains('invalid_ioc_expiration_duration')) {
            ctx.tags.add('invalid_ioc_expiration_duration');
          }
        }
        if (ctx.whoisfreaks.threat_feed == null) {
          ctx.whoisfreaks.threat_feed = new HashMap();
        }
        ctx.whoisfreaks.threat_feed.deleted_at = deletedAt.toString();
  - date:
      tag: date_whoisfreaks_threat_feed_deleted_at
      field: whoisfreaks.threat_feed.deleted_at
      target_field: whoisfreaks.threat_feed.deleted_at
      formats:
        - ISO8601
  - rename:
      tag: rename_conf_ioc_expiration_duration
      field: _conf.ioc_expiration_duration
      target_field: whoisfreaks.threat_feed.ioc_expiration_duration
      if: ctx._conf?.ioc_expiration_duration instanceof String && ctx._conf.ioc_expiration_duration != ''
  - remove:
      tag: remove_temporary_fields
      field:
        - _temp
        - _conf
      ignore_missing: true
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        with tag '{{{ _ingest.on_failure_processor_tag }}}'
        in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event
      field: tags
      value: preserve_original_event
      allow_duplicates: false
