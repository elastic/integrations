title: "Threat Feed Spam"
type: logs
streams:
  - input: cel
    title: "Spam Domain Feed"
    description: |-
      A daily feed of spam domains caught sending unsolicited bulk email or hosting the landing pages and link networks spam campaigns promote. Covers snowshoe sending infrastructure, spamvertised domains, and mail systems with a history of abuse. Every record is expanded from verified spam seeds through shared MX, NS, and registrant pivots and scored, so secure email gateways and mail filters can reject messages and URLs at scale.
    template_path: cel.yml.hbs
    vars:
      - name: resource_url
        type: text
        title: "Resource URL"
        description: |-
          The base HTTPS URL of the WhoisFreaks spam domain feed endpoint, without
          a TLD segment or query parameters. The input appends `/spam` and builds
          the query string itself (`date`, `limit`, `offset`, and `apiKey`).
        required: true
        show_user: true
        default: https://files.whoisfreaks.com/v3.4/stream/threat-feed/spam
      - name: resource_interval
        type: text
        title: "Resource Interval"
        description: |-
          How often the spam feed endpoint is checked for a new file. When a newer
          date is found the whole day is paged in one burst; otherwise the poll
          does nothing. The feed is paged with a dynamic `offset` until a page comes
          back short, so this only controls request count per poll, not how much
          data is ingested. Larger pages mean fewer requests but more memory per
          request. 5000 is a safe default; lower it on small agents.
        required: true
        show_user: true
        default: 5000s
      - name: file_date
        type: text
        title: "File Date (optional)"
        description: |-
          Specific file date to ingest, format yyyy-MM-dd (e.g. 2026-08-10).
          Leave empty to always page the most recently published file, which is
          the recommended setting for a recurring poll.
        required: false
        show_user: true
        default: ""
      - name: limit
        type: integer
        title: "Page Size"
        description: |-
          Number of records requested per page (the `limit` sent to the feed
          endpoint). The feed is paged with a dynamic `offset` until a page comes
          back short, so this only controls memory and request count per poll, not
          how much data is ingested. Larger pages mean fewer requests but more
          memory per request. 5000 is a safe default; lower it on small agents.
        required: true
        show_user: true
        default: 5000
      - name: resource_timeout
        type: text
        title: "Resource Timeout"
        description: |-
          The maximum time to wait for a response from the spam feed endpoint.
        required: true
        show_user: true
        default: 5m
    # - name: status_url
    #   type: text
    #   title: "Status URL"
    #   description: |-
    #     The public WhoisFreaks database file status endpoint. On each poll the
    #     integration reads `spam.last_update` from this endpoint and pages through
    #     a feed only when its date is newer than the last date already ingested,
    #     so re-polling never re-ingests the same file. This endpoint is public and
    #     does not require the API key.
    #   required: true
    #   show_user: false
    #   default: https://files.whoisfreaks.com/v3.3/status
elasticsearch:
  index_template:
    mappings:
      subobjects: false
