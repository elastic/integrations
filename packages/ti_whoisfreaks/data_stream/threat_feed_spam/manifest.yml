title: "Threat Feed Spam"
type: logs
streams:
  - input: cel
    title: "Spam Domain Feed"
    description: |-
      A daily feed of spam domains caught sending unsolicited bulk email or hosting the landing pages and link networks spam campaigns promote. Covers snowshoe sending infrastructure, spamvertised domains, and mail systems with a history of abuse. Every record is expanded from verified spam seeds through shared MX, NS, and registrant pivots and scored, so secure email gateways and mail filters can reject messages and URLs at scale.
    template_path: cel.yml.hbs
    vars:
      - name: resource_url
        type: text
        title: "Resource URL"
        description: URL of the WhoisFreaks spam threat feed endpoint.
        required: true
        show_user: false
        default: https://files.whoisfreaks.com/v3.4/stream/threat-feed/spam
      - name: resource_interval
        type: text
        title: "Resource Interval"
        description: |-
          How often the threat feed is polled. The entire feed is re-fetched on every
          interval (starting at offset 0). Fingerprinting prevents duplicate documents,
          but short intervals waste API quota and bandwidth. Default of 1h is a
          reasonable balance; increase further if your API plan is limited.

        required: true
        show_user: true
        default: 1h
      - name: limit
        type: integer
        title: "Page Size"
        description: |-
          Number of records requested per page (the `limit` sent to the feed
          endpoint). The feed is paged with a dynamic `offset` until a page comes
          back short, so this only controls memory and request count per poll, not
          how much data is ingested. Larger pages mean fewer requests but more
          memory per request. 5000 is a safe default; lower it on small agents.
        required: true
        show_user: true
        default: 5000
      - name: resource_timeout
        type: text
        title: "Resource Timeout"
        description: |-
          The maximum time to wait for a response from the spam feed endpoint.
        required: true
        show_user: true
        default: 5m
elasticsearch:
  index_template:
    mappings:
      subobjects: false
