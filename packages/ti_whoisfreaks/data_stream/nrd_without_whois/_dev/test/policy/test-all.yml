vars:
  api_key: test_api_key
  proxy_url: http://proxy.example:8080
  ssl: |
    verification_mode: none
data_stream:
  vars:
    url: https://files.whoisfreaks.com/v3.3/stream/domainer
    status_url: https://files.whoisfreaks.com/v3.3/status
    page_limit: 100
    file_date: "2026-08-04"
    interval: 12h
    http_client_timeout: 2m
    enable_request_tracer: true
    preserve_original_event: true
    tags:
      - forwarded
      - custom-tag
    processors: |
      - add_fields:
          target: project
          fields:
            name: whoisfreaks-test
