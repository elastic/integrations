wait_for_data_timeout: 1m
input: cel
service: ti_whoisfreaks
vars:
  # The mock answers this key with 503 on the gTLD stream: the retriable error keeps the cursor, one error event.
  api_key: error_api_key
data_stream:
  vars:
    url: "http://{{Hostname}}:{{Port}}/v3.3/stream/domainer"
    status_url: "http://{{Hostname}}:{{Port}}/v3.4/status"
    page_limit: 2
    interval: 1h
    enable_request_tracer: true
assert:
  hit_count: 1
