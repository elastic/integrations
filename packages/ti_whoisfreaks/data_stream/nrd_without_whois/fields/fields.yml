- name: whoisfreaks
  type: group
  description: WhoisFreaks newly registered domain fields without WHOIS enrichment.
  fields:
    - name: file_date
      type: date
      description: The WhoisFreaks daily file date (yyyy-MM-dd) the record was fetched for, sent as the `date` parameter of the stream request.
    - name: tld_type
      type: keyword
      description: "Which WhoisFreaks feed this record came from: \"gtld\" or \"cctld\"."
    - name: domain_name
      type: keyword
      description: Domain name identified in the newly registered domain stream.
    - name: query_time
      type: keyword
      description: >-
        Synthetic timestamp (the file date at 00:00:00 UTC, yyyy-MM-dd HH:mm:ss) added by the input, because this feed reports no per-domain query time. Parsed into @timestamp by the ingest pipeline.
