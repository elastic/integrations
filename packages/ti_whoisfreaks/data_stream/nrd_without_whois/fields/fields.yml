- name: whoisfreaks
  type: group
  description: WhoisFreaks newly registered domain fields without WHOIS enrichment.
  fields:
    - name: tld_type
      type: keyword
      description: "Which WhoisFreaks feed this record came from: \"gtld\" or \"cctld\"."
    - name: domain_name
      type: keyword
      description: Domain name identified in the newly registered domain stream.
    - name: query_time
      type: keyword
      description: "Original query timestamp string from the feed (yyyy-MM-dd HH:mm:ss). Parsed into @timestamp by the ingest pipeline."
- name: input.type
  type: keyword
  description: Type of input.
