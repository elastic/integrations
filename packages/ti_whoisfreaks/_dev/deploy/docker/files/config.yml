rules:
  # Public file status endpoint used by every stream to pick the file date. Same
  # shape as the real endpoint, including sections the integration ignores and a
  # "Not Available" value.
  - path: /v3.4/status
    methods: ["GET"]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
          {
            "newly": {
              "gtld": {"last_update": "2026-08-04", "available_from": "2026-05-06"},
              "cctld": {"last_update": "2026-08-04", "available_from": "2026-05-05"},
              "cleaned_gtld": {"last_update": "2026-08-04", "available_from": "2026-05-06"},
              "cleaned_cctld": {"last_update": "2026-08-04", "available_from": "2026-05-05"},
              "dns": {"last_update": "Not Available", "available_from": "Not Available"}
            },
            "threat_feed": {
              "phishing": {"last_update": "2026-08-25", "available_from": "2026-05-27"},
              "malware": {"last_update": "2026-08-25", "available_from": "2026-05-27"},
              "spam": {"last_update": "2026-08-25", "available_from": "2026-05-27"}
            }
          }
          ` }}
  # Status endpoint failure variants, selected through the status_url test var.
  - path: /v3.4/status-unavailable
    methods: ["GET"]
    responses:
      - status_code: 503
        headers:
          Content-Type:
            - "text/plain; charset=UTF-8"
        body: "service unavailable"
  - path: /v3.4/status-not-available
    methods: ["GET"]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {"newly":{"gtld":{"last_update":"Not Available","available_from":"Not Available"}},"threat_feed":{"malware":{"last_update":"Not Available","available_from":"Not Available"}}}
  - path: /v3.4/status-malformed
    methods: ["GET"]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "text/html"
        body: "<html><body>maintenance</body></html>"
  # Newly registered gTLD domains with WHOIS: 3 rows split over two pages (limit 2).
  # The second page does not repeat the header, like the threat feed pages; the
  # input reuses the first page's header for it.
