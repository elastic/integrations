    query_params:
      apiKey: ["test_api_key"]
      whois: ["true"]
      date: ["2026-08-04"]
      limit: ["2"]
      offset: ["0"]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "text/plain; charset=UTF-8"
