          malware-host-1.example,malware,1.0,2026-06-25 13:45:35.401434+00,2026-08-25 00:16:20.97521+00,1
          malware-host-2.example,malware,0.85,2026-07-01 08:00:00+00,2026-08-24 22:10:05.5+00,3
