rules:
  # --- event_type:alert, page 1 ---
  # This rule's `responses` list is consumed as a plain round-robin sequence by
  # `elastic/stream` (`response := rule.Responses[count % len(rule.Responses)]`,
  # see `internal/httpserver/httpserver.go`) -- the N-th request to this rule
  # always gets `responses[N-1]`. Switched from the previous single-entry,
  # `.req_num`-templated-body form to this list form so that one of the entries
  # (req_num 5) can return a different `status_code`: Go templating can vary
  # `body`/`headers` on a single response entry but not `status_code`, so a
  # varying status_code across requests requires one list entry per request
  # number -- the same constraint documented on the stamus-phase rule below.
  #
  # req_num 1 (round 1 / window 1): single page, terminal immediately (next: null).
  # req_num 2 (round 2 / cursor-resume window): one additional event, terminal.
  # req_num 3 (round 3 / window 3): terminal empty response -- alert phase succeeds
  # normally with nothing new, immediately before the round-3 persistent-stamus-error
  # scenario below.
  # req_num 4 (round 4 / window 4 -- the window immediately following the window
  # where the stamus phase hit a persistent 403): one additional event. This proves
  # alert collection resumes for the NEXT window after a persistent stamus error,
  # rather than the cursor staying stuck retrying the failed stamus phase forever.
  # req_num 5 (round 5 / window 5): transient 503 -- models a momentary backend
  # hiccup on the PRIMARY ("alert") phase. The fixed cel.yml.hbs returns this error
  # as a list with an explicit, unmodified "cursor": cur (see that file's
  # error-handling comment and the Copilot review this regression test was added
  # for), so the next evaluation must re-request this exact same
  # phase/page/from_date/to_date instead of a fresh `now - initial_interval`
  # window. This mock cannot assert the from_date/to_date values are byte-identical
  # (both are captured with permissive `{..:.*}` regexes so any value matches the
  # same rule) -- that guarantee is proven at the mito level (see builder report,
  # which inspects the actual returned cursor against a forced 503). What this
  # fixture guards is the observable, system-test-visible side effect: the error
  # produces no alert document, req_num 6 below (the retry) produces exactly the
  # one expected recovery document, and overall hit_count stays stable rather than
  # drifting (which it would if the window reset and started re-walking time).
  # req_num 6 (round 5 retry, same window as req_num 5): the transient failure
  # clears and this window's single alert event is collected normally, then the
  # program moves on to the stamus phase for this same window.
  # req_num >=7 (all subsequent windows): terminal empty response -- the mock must
  # stop producing new events once the intended rounds have been served, otherwise
  # the CEL program's advancing from_date/to_date window causes a brand-new unique
  # event on every poll and the data stream's document count never stabilizes
  # (elastic-package's system-test runner requires hit_count to be stable across
  # consecutive polls).
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:alert'
      page_number: '1'
      page_size: '2'
      from_date: "{fd:.*}"
      to_date: "{td:.*}"
    request_headers:
      Authorization:
        - 'Token test-token'
      Content-Type:
        - 'application/json'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T12:00:00.123456+0000", "src_ip": "198.51.100.10", "dest_ip": "203.0.113.20", "flow_id": 2019054435055803, "alert": {"signature": "SN Example Alert Signature One", "severity": 2, "signature_id": 1000001, "category": "Unknown Traffic"}}]}'
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T13:30:00.654321+0000", "src_ip": "198.51.100.11", "dest_ip": "203.0.113.21", "flow_id": 9007199254741337, "alert": {"signature": "SN Example Alert Signature Two", "severity": 2, "signature_id": 1000002, "category": "Unknown Traffic"}}]}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T15:00:00.777777+0000", "src_ip": "198.51.100.13", "dest_ip": "203.0.113.23", "flow_id": 2019054435055805, "alert": {"signature": "SN Example Alert Signature After Stamus Error", "severity": 2, "signature_id": 1000004, "category": "Unknown Traffic"}}]}'
      - status_code: 503
        headers:
          Content-Type:
            - 'application/json'
        body: '{"detail": "Service temporarily unavailable."}'
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T15:30:00.888888+0000", "src_ip": "198.51.100.14", "dest_ip": "203.0.113.24", "flow_id": 2019054435055806, "alert": {"signature": "SN Example Alert Signature After Transient Error", "severity": 2, "signature_id": 1000005, "category": "Unknown Traffic"}}]}'
      # req_num >=7: terminal empty response (padding against round-robin wraparound).
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
