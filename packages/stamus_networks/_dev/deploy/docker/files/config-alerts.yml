rules:
  # --- event_type:alert, page 1 ---
  # req_num 1 (round 1 / window 1): single page, terminal immediately (next: null).
  # req_num 2 (round 2 / cursor-resume window): one additional event, terminal.
  # req_num 3 (round 3 / window 3): terminal empty response -- alert phase succeeds
  # normally with nothing new, immediately before the round-3 persistent-stamus-error
  # scenario below.
  # req_num 4 (round 4 / window 4 -- the window immediately following the window
  # where the stamus phase hit a persistent 403): one additional event. This proves
  # alert collection resumes for the NEXT window after a persistent stamus error,
  # rather than the cursor staying stuck retrying the failed stamus phase forever.
  # req_num >=5 (all subsequent windows): terminal empty response -- the mock must
  # stop producing new events once the intended rounds have been served, otherwise
  # the CEL program's advancing from_date/to_date window causes a brand-new unique
  # event on every poll and the data stream's document count never stabilizes
  # (elastic-package's system-test runner requires hit_count to be stable across
  # consecutive polls).
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:alert'
      page_number: '1'
      page_size: '2'
      from_date: "{fd:.*}"
      to_date: "{td:.*}"
    request_headers:
      Authorization:
        - 'Token test-token'
      Content-Type:
        - 'application/json'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {{ if eq .req_num 1 }}
          {"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T12:00:00.123456+0000", "src_ip": "198.51.100.10", "dest_ip": "203.0.113.20", "flow_id": 2019054435055803, "alert": {"signature": "SN Example Alert Signature One", "severity": 2, "signature_id": 1000001, "category": "Unknown Traffic"}}]}
          {{ else if eq .req_num 2 }}
          {"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T13:30:00.654321+0000", "src_ip": "198.51.100.11", "dest_ip": "203.0.113.21", "flow_id": 9007199254741337, "alert": {"signature": "SN Example Alert Signature Two", "severity": 2, "signature_id": 1000002, "category": "Unknown Traffic"}}]}
          {{ else if eq .req_num 4 }}
          {"count": 1, "next": null, "previous": null, "results": [{"event_type": "alert", "timestamp": "2024-01-15T15:00:00.777777+0000", "src_ip": "198.51.100.13", "dest_ip": "203.0.113.23", "flow_id": 2019054435055805, "alert": {"signature": "SN Example Alert Signature After Stamus Error", "severity": 2, "signature_id": 1000004, "category": "Unknown Traffic"}}]}
          {{ else }}
          {"count": 0, "next": null, "previous": null, "results": []}
          {{ end }}
  # --- event_type:stamus, page 1 ---
  # This rule's `responses` list is consumed as a plain round-robin sequence by
  # `elastic/stream` (`response := rule.Responses[count % len(rule.Responses)]`,
  # see `internal/httpserver/httpserver.go`): the N-th request to this rule always
  # gets `responses[N-1]`, wrapping back to `responses[0]` once the list is
  # exhausted. Go templating on `.req_num` (used on the alert-phase rule above)
  # cannot vary `status_code` -- only `body`/`headers` support templates -- so a
  # varying status_code across requests requires one list entry per request
  # number, as used here. The list is padded well past the number of polls a
  # `wait_for_data_timeout: 1m` / `interval: 2s` system test run can realistically
  # produce, so it never wraps back to the round-1/round-2/error entries during a
  # normal test run.
  #
  # request 1 (round 1 / window 1): returns one event + a non-terminal "next" link (page 2 exists).
  # request 2 (round 2 / cursor-resume window): one event, terminal (next: null) -- no page 2 request expected.
  # request 3 (round 3 / window 3): persistent 403 -- models a Tier 2/Community-tier
  # instance where DoC/DoPV correlation (event_type:stamus) is gated behind a higher
  # Stamus license tier and the endpoint itself (not just the filtered results) returns
  # a non-retryable error for this event_type. This is the fix-1 regression scenario:
  # the alert phase for this same window already succeeded (see req_num 3 on the
  # alert-phase rule above), so the program must advance past this failed stamus
  # phase to the next window's alert phase rather than retrying this phase/window
  # forever -- see req_num 4 on the alert-phase rule above, which verifies alert
  # collection resumes for the next window.
  # requests 4+ (all subsequent windows): terminal empty response (see alert-rule
  # comment above) -- the stamus endpoint "recovers" after the one forced failure
  # so later windows behave normally.
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:stamus'
      page_number: '1'
      page_size: '2'
      from_date: "{fd:.*}"
      to_date: "{td:.*}"
    request_headers:
      Authorization:
        - 'Token test-token'
      Content-Type:
        - 'application/json'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 2, "next": "http://{{ hostname }}:{{ env "PORT" }}/rest/rules/es/events_tail/?qfilter=event_type%3Astamus&from_date={{ .request.vars.fd }}&to_date={{ .request.vars.td }}&page_size=2&page_number=2", "previous": null, "results": [{"event_type": "stamus", "timestamp": "2024-01-15T12:10:00.111111+0000", "src_ip": "198.51.100.90", "dest_ip": "224.0.0.252", "alert": {"signature": "SN Example DoC Signature", "severity": 3, "signature_id": 1003120326, "category": ""}, "stamus": {"pk": 1, "event_id": 1, "family_name": "Example family", "threat_name": "Example threat", "kill_chain": "pre_condition", "asset": "198.51.100.90", "asset_type": "ip"}}]}
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 1, "next": null, "previous": null, "results": [{"event_type": "stamus", "timestamp": "2024-01-15T13:40:00.222222+0000", "src_ip": "198.51.100.92", "dest_ip": "224.0.0.253", "alert": {"signature": "SN Example DoC Signature Resumed", "severity": 3, "signature_id": 1003120327, "category": ""}, "stamus": {"pk": 2, "event_id": 2, "family_name": "Example family", "threat_name": "Example threat", "kill_chain": "pre_condition", "asset": "198.51.100.92", "asset_type": "ip"}}]}
      - status_code: 403
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"detail": "You do not have permission to perform this action."}
      # requests 4-20: terminal empty response (padding against round-robin wraparound; see note above).
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
  # --- event_type:stamus, page 2 (round 1 only; never requested again in round 2) ---
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:stamus'
      page_number: '2'
      page_size: '2'
      from_date: "{fd:.*}"
      to_date: "{td:.*}"
    request_headers:
      Authorization:
        - 'Token test-token'
      Content-Type:
        - 'application/json'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 2, "next": null, "previous": "http://{{ hostname }}:{{ env "PORT" }}/rest/rules/es/events_tail/?qfilter=event_type%3Astamus&from_date={{ .request.vars.fd }}&to_date={{ .request.vars.td }}&page_size=2&page_number=1", "results": [{"event_type": "stamus", "timestamp": "2024-01-15T12:11:00.333333+0000", "src_ip": "198.51.100.91", "dest_ip": "224.0.0.252", "alert": {"signature": "SN Example DoC Signature Two", "severity": 3, "signature_id": 1003120328, "category": ""}, "stamus": {"pk": 3, "event_id": 3, "family_name": "Example family", "threat_name": "Example threat", "kill_chain": "pre_condition", "asset": "198.51.100.91", "asset_type": "ip"}}]}
  # --- Regression guard: catch-all for any other events_tail request (e.g. missing/unmatched
  # query params, or a cursor regression re-sending the initial-interval window instead of the
  # persisted bookmark). Returns an oversized batch so hit_count assertions fail loudly. ---
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 50, "next": null, "previous": null, "results": [
            {"event_type": "alert", "timestamp": "2020-01-01T00:00:00Z", "alert": {"signature": "REGRESSION GUARD - unexpected request shape", "severity": 1, "signature_id": 9999999, "category": "regression"}},
            {"event_type": "alert", "timestamp": "2020-01-01T00:00:01Z", "alert": {"signature": "REGRESSION GUARD - unexpected request shape", "severity": 1, "signature_id": 9999999, "category": "regression"}}
          ]}
