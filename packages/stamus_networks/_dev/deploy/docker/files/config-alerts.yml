  # --- event_type:stamus, page 1 ---
  # This rule's `responses` list is consumed as a plain round-robin sequence by
  # `elastic/stream` (`response := rule.Responses[count % len(rule.Responses)]`,
  # see `internal/httpserver/httpserver.go`): the N-th request to this rule always
  # gets `responses[N-1]`, wrapping back to `responses[0]` once the list is
  # exhausted. Go templating on `.req_num` (used on the alert-phase rule above)
  # cannot vary `status_code` -- only `body`/`headers` support templates -- so a
  # varying status_code across requests requires one list entry per request
  # number, as used here. Both this rule's and the alert-phase rule's response
  # lists are padded to 60 entries -- a real system-test run was empirically
  # observed to make ~30 requests to each rule within `wait_for_data_timeout: 1m`
  # at `interval: 2s` (confirmed via mock container logs; an earlier, shorter
  # padding of 20/23 entries wrapped back to the round-1/error entries mid-run
  # and broke the `assert.hit_count` check), so 60 leaves ample margin.
  #
  # request 1 (round 1 / window 1): returns one event + a non-terminal "next" link (page 2 exists).
  # request 2 (round 2 / cursor-resume window): one event, terminal (next: null) -- no page 2 request expected.
  # request 3 (round 3 / window 3): persistent 403 -- models a Tier 2/Community-tier
  # instance where DoC/DoPV correlation (event_type:stamus) is gated behind a higher
  # Stamus license tier and the endpoint itself (not just the filtered results) returns
  # a non-retryable error for this event_type. This is the fix-1 regression scenario:
  # the alert phase for this same window already succeeded (see req_num 3 on the
  # alert-phase rule above), so the program must advance past this failed stamus
  # phase to the next window's alert phase rather than retrying this phase/window
  # forever -- see req_num 4 on the alert-phase rule above, which verifies alert
  # collection resumes for the next window.
  # requests 4+ (all subsequent windows): terminal empty response (see alert-rule
  # comment above) -- the stamus endpoint "recovers" after the one forced failure
  # so later windows behave normally.
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:stamus'
      page_number: '1'
      page_size: '2'
      from_date: "{fd:.*}"
      to_date: "{td:.*}"
    request_headers:
      Authorization:
        - 'Token test-token'
      Content-Type:
        - 'application/json'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 2, "next": "http://{{ hostname }}:{{ env "PORT" }}/rest/rules/es/events_tail/?qfilter=event_type%3Astamus&from_date={{ .request.vars.fd }}&to_date={{ .request.vars.td }}&page_size=2&page_number=2", "previous": null, "results": [{"event_type": "stamus", "timestamp": "2024-01-15T12:10:00.111111+0000", "src_ip": "198.51.100.90", "dest_ip": "224.0.0.252", "alert": {"signature": "SN Example DoC Signature", "severity": 3, "signature_id": 1003120326, "category": ""}, "stamus": {"pk": 1, "event_id": 1, "family_name": "Example family", "threat_name": "Example threat", "kill_chain": "pre_condition", "asset": "198.51.100.90", "asset_type": "ip"}}]}
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 1, "next": null, "previous": null, "results": [{"event_type": "stamus", "timestamp": "2024-01-15T13:40:00.222222+0000", "src_ip": "198.51.100.92", "dest_ip": "224.0.0.253", "alert": {"signature": "SN Example DoC Signature Resumed", "severity": 3, "signature_id": 1003120327, "category": ""}, "stamus": {"pk": 2, "event_id": 2, "family_name": "Example family", "threat_name": "Example threat", "kill_chain": "pre_condition", "asset": "198.51.100.92", "asset_type": "ip"}}]}
      - status_code: 403
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"detail": "You do not have permission to perform this action."}
      # request 4 (window 4): terminal empty response -- stamus "recovers" after the
      # one forced 403 failure above, so this window behaves normally (no stamus
      # data, which is fine -- this window's alert-phase event is what matters, see
      # req_num 4 on the alert-phase rule above).
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      # request 5 (window 5 -- the alert-phase transient-503 regression window):
      # terminal empty response. This window exercises the transient-error-retains-
      # cursor fix on the ALERT phase (see req_num 5/6 on the alert-phase rule
      # above); the stamus phase for this same window has no data, keeping that
      # scenario isolated to the alert phase.
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      # request 6 (window 6 -- the stamus-phase transient-503 regression window):
      # transient 503, models a momentary backend hiccup on the stamus (DoC/DoPV
      # correlation) phase. This window's alert phase has no data (see req_num 7,
      # the "else" branch, on the alert-phase rule above), so stamus is the first
      # and only request for this window. The fixed cel.yml.hbs returns this error
      # as a list with an explicit, unmodified "cursor": cur (same phase/page/
      # from_date/to_date), so the retry below must land on the SAME window rather
      # than a fresh one -- see the Copilot review this regression test was added
      # for, and the mito-level proof in the builder report.
      - status_code: 503
        headers:
          Content-Type:
            - 'application/json'
        body: '{"detail": "Service temporarily unavailable."}'
      # request 7 (window 6 retry, same window as request 6): the transient
      # failure clears and this window's single stamus event is collected
      # normally, terminal (next: null) -- both phases done, window advances.
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"count": 1, "next": null, "previous": null, "results": [{"event_type": "stamus", "timestamp": "2024-01-15T16:00:00.444444+0000", "src_ip": "198.51.100.93", "dest_ip": "224.0.0.254", "alert": {"signature": "SN Example DoC Signature After Transient Error", "severity": 3, "signature_id": 1003120329, "category": ""}, "stamus": {"pk": 4, "event_id": 4, "family_name": "Example family", "threat_name": "Example threat", "kill_chain": "pre_condition", "asset": "198.51.100.93", "asset_type": "ip"}}]}'
      # requests 8-20: terminal empty response (padding against round-robin wraparound; see note above).
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
      - status_code: 200
        body: '{"count": 0, "next": null, "previous": null, "results": []}'
