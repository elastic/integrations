wait_for_data_timeout: 3m
input: cel
service: stamus_networks-alerts-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  api_token: test-token
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    page_size: 2
# hit_count = 9, derived from the mock's six windows (see
# _dev/deploy/docker/files/config-alerts.yml):
#   window 1 (round 1):            alert=1 + stamus page1=1 + stamus page2=1 = 3
#   window 2 (round 2, cursor resume): alert=1 + stamus=1                    = 2
#   window 3 (persistent stamus 403):  alert=0 + stamus error (indexed)=1    = 1
#   window 4 (alert collection resumes after the stamus error): alert=1 + stamus=0 = 1
#   window 5 (transient 503 on the ALERT phase, same-window retry): alert
#     recovery event=1, stamus=0                                            = 1
#   window 6 (transient 503 on the STAMUS phase, same-window retry): alert=0,
#     stamus recovery event=1                                               = 1
#   total = 9, stable thereafter.
#
# Windows 5 and 6 are the regression test added for the Copilot review finding
# that a single-object "events" error value discards the persisted cursor (see
# cel.yml.hbs's error-handling comment). Confirmed empirically (3 independent
# `elastic-package test system` runs, with direct Elasticsearch inspection) that
# a forced transient 5xx on either phase does NOT produce an indexed error
# document here, unlike the persistent 403 in window 3: the Elastic Agent CEL
# input's own HTTP resource-level retry absorbs the 503 transparently and
# retries the exact same request before the CEL program's script ever runs
# again, so the program's 5xx error branch is never actually reached in
# practice for a single transient failure that resolves on retry -- only the
# eventual 200 (the recovery event) is evaluated and emitted. This does NOT
# mean the CEL-level fix is unexercised or unnecessary: it is still the correct
# defensive-in-depth behavior for a 5xx that persists beyond the agent's retry
# budget (which this mock cannot easily force), and the fix's core property --
# that no cursor reset/window-restart occurs across a transient failure -- was
# independently confirmed by observing strictly-advancing, non-repeating
# from_date/to_date values in the mock's request log across all 6 windows, with
# zero duplicate or replayed documents. If a future change makes a 5xx error
# document start appearing here, treat that as confirmation the agent's retry
# budget was exhausted (or its retry behavior changed) rather than a hit_count
# regression to silently "fix" by raising this number back up.
assert:
  hit_count: 9
