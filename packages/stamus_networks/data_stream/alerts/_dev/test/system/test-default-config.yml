wait_for_data_timeout: 1m
input: cel
service: stamus_networks-alerts-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  api_token: test-token
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    page_size: 2
# hit_count = 7, derived from the mock's four windows (see
# _dev/deploy/docker/files/config-alerts.yml):
#   window 1 (round 1):            alert=1 + stamus page1=1 + stamus page2=1 = 3
#   window 2 (round 2, cursor resume): alert=1 + stamus=1                    = 2
#   window 3 (persistent stamus 403):  alert=0 + stamus error (indexed)=1    = 1
#   window 4 (alert collection resumes after the stamus error): alert=1 + stamus=0 = 1
#   total = 7, stable thereafter.
# This was derived and mito-validated (not run through elastic-package test system,
# which this CEL fix is not permitted to run itself here -- see the dispatching
# task). The system-test subagent must confirm this value empirically against a
# real `elastic-package test system` run before merging, in particular that the
# round-robin-padded mock response sequence for the stamus rule (20 entries) does
# not wrap back to the round-1/error entries during the real test run.
assert:
  hit_count: 7
