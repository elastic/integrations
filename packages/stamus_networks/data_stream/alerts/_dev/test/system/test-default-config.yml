wait_for_data_timeout: 3m
input: cel
service: stamus_networks-alerts-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  api_token: test-token
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    page_size: 2
# hit_count = 9, derived from the mock's six windows (see
# _dev/deploy/docker/files/config-alerts.yml):
#   window 1 (round 1):            alert=1 + stamus page1=1 + stamus page2=1 = 3
#   window 2 (round 2, cursor resume): alert=1 + stamus=1                    = 2
#   window 3 (persistent stamus 403):  alert=0 + stamus error (indexed)=1    = 1
#   window 4 (alert collection resumes after the stamus error): alert=1 + stamus=0 = 1
#   window 5 (sustained 503 on the ALERT phase, same-window retry): alert
#     recovery event=1, stamus=0                                            = 1
#   window 6 (sustained 503 on the STAMUS phase, same-window retry): alert=0,
#     stamus recovery event=1                                               = 1
#   total = 9, stable thereafter.
# Each sustained failure outlasts Elastic Agent's HTTP-level retries, forcing
# the CEL program to return and persist its explicit retry cursor before the
# later recovery response is served. Only the recovery events are indexed.
assert:
  hit_count: 9
