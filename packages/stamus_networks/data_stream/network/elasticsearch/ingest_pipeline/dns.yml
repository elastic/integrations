---
description: Pipeline for Stamus Networks DNS events.

processors:
  - set:
      tag: set_dns_id
      field: dns.id
      value: '{{{json.dns.id}}}'
      ignore_empty_value: true
  - set:
      tag: set_dns_response_code
      field: dns.response_code
      value: '{{{json.dns.rcode}}}'
      ignore_empty_value: true
  - set:
      tag: set_dns_type
      field: dns.type
      value: '{{{json.dns.type}}}'
      ignore_empty_value: true
  - set:
      tag: set_dns_question_name
      if: ctx?.dns?.type == "query" || ctx?.json?.dns?.version == 2
      field: dns.question.name
      value: '{{{json.dns.rrname}}}'
      ignore_empty_value: true
  - set:
      tag: set_dns_question_type
      if: ctx?.dns?.type == "query" || ctx?.json?.dns?.version == 2
      field: dns.question.type
      value: '{{{json.dns.rrtype}}}'
      ignore_empty_value: true
  - pipeline:
      tag: pipeline_dns_answer_v1
      if: ctx?.dns?.type == "answer" && ctx?.json?.dns?.version == null
      name: '{{ IngestPipeline "dns-answer-v1" }}'
  - pipeline:
      tag: pipeline_dns_answer_v2
      if: ctx?.dns?.type == "answer" && ctx?.json?.dns?.version == 2
      name: '{{ IngestPipeline "dns-answer-v2" }}'
  - foreach:
      tag: foreach_dns_resolved_ip
      field: dns.resolved_ip
      ignore_missing: true
      processor:
        append:
          field: related.ip
          value:
            - '{{{_ingest._value}}}'
          allow_duplicates: false
  - script:
      if: ctx?.dns?.question?.registered_domain != null
      tag: dns_question_top_level_domain
      lang: painless
      source: |
        def rd = ctx.dns.question.registered_domain;
        def firstDot = rd.indexOf(".");
        if (firstDot == -1) {
            return;
        }
        ctx.dns.question.top_level_domain = rd.substring(firstDot + 1);
  - append:
      tag: append_dns_header_flag_aa
      if: ctx?.json?.dns?.aa == true
      field: dns.header_flags
      value: AA
  - append:
      tag: append_dns_header_flag_tc
      if: ctx?.json?.dns?.tc == true
      field: dns.header_flags
      value: TC
  - append:
      tag: append_dns_header_flag_rd
      if: ctx?.json?.dns?.rd == true
      field: dns.header_flags
      value: RD
  - append:
      tag: append_dns_header_flag_ra
      if: ctx?.json?.dns?.ra == true
      field: dns.header_flags
      value: RA
  - remove:
      tag: remove_dns_header_fields
      field:
        - json.dns.aa
        - json.dns.tc
        - json.dns.rd
        - json.dns.ra
        - json.dns.qr
        - json.dns.version
        - json.dns.flags
        - json.dns.grouped
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      tag: set_dns_pipeline_error_kind
      value: pipeline_error
  - append:
      field: error.message
      tag: append_dns_pipeline_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - append:
      field: tags
      tag: append_dns_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
