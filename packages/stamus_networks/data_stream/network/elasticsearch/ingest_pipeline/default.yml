---
description: >-
  Pipeline for Stamus Networks Clear NDR protocol and network logs collected from
  events_tail. The raw EVE JSON is parsed into json.*, ECS fields are promoted, and
  json is removed. Protocol objects keep only the fields declared for this data stream.
  postproc_metrix, tunnel.*, ether.*, pkt_src, in_iface, and app_proto_tc are not mapped.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Stamus Networks
  - set:
      field: observer.product
      tag: set_observer_product
      value: Clear NDR

  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: Removes Agentless metadata fields that can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Collector error with no event body.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            tag: append_error_parse_json
            value: '{{{_ingest.on_failure_message}}}'

  - date:
      field: json.timestamp
      target_field: '@timestamp'
      tag: parse_timestamp
      formats:
        - ISO8601
      if: ctx.json?.timestamp != null
      on_failure:
        - append:
            field: error.message
            tag: append_error_parse_timestamp
            value: '{{{_ingest.on_failure_message}}}'

  - lowercase:
      tag: lowercase_event_type
      field: json.event_type
      ignore_missing: true

  - script:
      tag: script_event_type_params
      lang: painless
      ignore_failure: true
      params:

        alert:
          kind: alert
          category:
            - network
            - intrusion_detection
        dns:
          type:
            - protocol
          network_protocol: dns
        flow:
          type:
            - connection
        ftp:
          type:
            - protocol
          network_protocol: ftp
        ftp_data:
          type:
            - protocol
          network_protocol: ftp
        http:
          category:
            - network
            - web
          type:
            - access
            - protocol
          network_protocol: http
        http2:
          category:
            - network
            - web
          type:
            - access
            - protocol
          network_protocol: http
        ikev2:
          type:
            - protocol
          network_protocol: ikev2
        krb5:
          type:
            - protocol
          network_protocol: krb5
        mqtt:
          type:
            - protocol
          network_protocol: mqtt
        smb:
          type:
            - protocol
          network_protocol: smb
        smtp:
          type:
            - protocol
          network_protocol: smtp
        snmp:
          type:
            - protocol
          network_protocol: snmp
        ssh:
          type:
            - protocol
          network_protocol: ssh
        stats:
          kind: metric
        tftp:
          type:
            - protocol
          network_protocol: tftp
        tls:
          type:
            - protocol
          network_protocol: tls
        rdp:
          type:
            - protocol
          network_protocol: rdp
        rfb:
          type:
            - protocol
          network_protocol: rfb
        fileinfo:
          category:
            - network
            - file
          type:
            - info
        anomaly:
          type:
            - info
        dhcp:
          type:
            - protocol
          network_protocol: dhcp
        quic:
          type:
            - protocol
          network_protocol: quic
        dcerpc:
          type:
            - protocol
          network_protocol: dcerpc
        sip:
          type:
            - protocol
          network_protocol: sip
        nfs:
          type:
            - protocol
          network_protocol: nfs
        dnp3:
          type:
            - protocol
          network_protocol: dnp3
        pgsql:
          type:
            - protocol
          network_protocol: pgsql
        modbus:
          type:
            - protocol
          network_protocol: modbus
        bittorrent_dht:
          type:
            - protocol
          network_protocol: bittorrent_dht
        arp:
          type:
            - protocol
          network_protocol: arp
        pop3:
          type:
            - protocol
          network_protocol: pop3
        ike:
          type:
            - protocol
          network_protocol: ike
        smb_insights:
          type:
            - info
          network_protocol: smb
        netflow:
          type:
            - connection

      source: |
        ctx.event.kind = 'event';
        ctx.event.category = ['network'];
        if (ctx.json == null || ctx.json.event_type == null) {
            return;
        }
        def type_params = params.get(ctx.json.event_type);
        if (type_params == null) {
            return;
        }
        for (def entry : type_params.entrySet()) {
            def k = entry.getKey();
            def v = entry.getValue();
            if ('network_protocol' == k) {
                if (ctx.network == null) {
                    ctx.network = new HashMap();
                }
                ctx.network.protocol = v;
            } else if (v instanceof List) {
                ctx.event[k] = new ArrayList(v);
            } else {
                ctx.event[k] = v;
            }
        }

  - set:
      tag: set_network_protocol_ftp_data
      if: ctx.network?.protocol == null && ctx.json?.app_proto == "ftp-data"
      field: network.protocol
      value: ftp
  - set:
      tag: set_network_protocol_from_app_proto
      if: >-
        ctx.network?.protocol == null && ctx.json?.app_proto != null &&
        ctx.json.app_proto != "failed" && ctx.json.app_proto != "template" &&
        ctx.json.app_proto != "template-rust" && ctx.json.app_proto != "ftp-data"
      field: network.protocol
      copy_from: json.app_proto
      ignore_failure: true
  - lowercase:
      tag: lowercase_network_protocol
      field: network.protocol
      ignore_missing: true

