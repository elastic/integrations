      field: json.src_port
      target_field: source.port
      tag: rename_src_port
      ignore_missing: true
      if: ctx.source?.port == null
  - rename:
      field: json.dest_ip
      target_field: destination.ip
      tag: rename_dest_ip
      ignore_missing: true
      if: ctx.destination?.ip == null
  - rename:
      field: json.dest_port
      target_field: destination.port
      tag: rename_dest_port
      ignore_missing: true
      if: ctx.destination?.port == null

  - community_id:
      tag: compute_community_id_fallback
      target_field: network.community_id
      ignore_failure: true
      if: ctx.network?.community_id == null

  - set:
      field: json._flow_orientation_flipped
      value: true
      tag: set_flow_orientation_flipped
      if: ctx.source?.ip != null && ctx.json?.flow?.src_ip != null && ctx.source.ip != ctx.json.flow.src_ip
      description: True when source.ip is not the flow's own src_ip, so byte and packet counters are swapped.
  - rename:
      field: json.flow.bytes_toserver
      target_field: source.bytes
      ignore_missing: true
      tag: rename_flow_bytes_toserver_normal
      if: ctx.json?._flow_orientation_flipped != true
  - rename:
      field: json.flow.bytes_toserver
      target_field: destination.bytes
      ignore_missing: true
      tag: rename_flow_bytes_toserver_flipped
      if: ctx.json?._flow_orientation_flipped == true
  - rename:
      field: json.flow.bytes_toclient
      target_field: destination.bytes
      ignore_missing: true
      tag: rename_flow_bytes_toclient_normal
      if: ctx.json?._flow_orientation_flipped != true
  - rename:
      field: json.flow.bytes_toclient
      target_field: source.bytes
      ignore_missing: true
      tag: rename_flow_bytes_toclient_flipped
      if: ctx.json?._flow_orientation_flipped == true
  - rename:
      field: json.flow.pkts_toserver
      target_field: source.packets
      ignore_missing: true
      tag: rename_flow_pkts_toserver_normal
      if: ctx.json?._flow_orientation_flipped != true
  - rename:
      field: json.flow.pkts_toserver
      target_field: destination.packets
      ignore_missing: true
      tag: rename_flow_pkts_toserver_flipped
      if: ctx.json?._flow_orientation_flipped == true
  - rename:
      field: json.flow.pkts_toclient
      target_field: destination.packets
      ignore_missing: true
      tag: rename_flow_pkts_toclient_normal
      if: ctx.json?._flow_orientation_flipped != true
  - rename:
      field: json.flow.pkts_toclient
      target_field: source.packets
      ignore_missing: true
      tag: rename_flow_pkts_toclient_flipped
      if: ctx.json?._flow_orientation_flipped == true

  - date:
      field: json.flow.start
      target_field: event.start
      tag: parse_flow_start
      formats:
        - ISO8601
      if: ctx.json?.flow?.start != null
      ignore_failure: true
  - date:
      field: json.flow.end
      target_field: event.end
      tag: parse_flow_end
      formats:
        - ISO8601
      if: ctx.json?.flow?.end != null
      ignore_failure: true
  - date:
      field: json.smb_insights.first_seen
      target_field: smb_insights.first_seen
      tag: parse_smb_insights_first_seen
      formats:
        - ISO8601
      if: ctx.json?.smb_insights?.first_seen != null
      ignore_failure: true
  - date:
      field: json.smb_insights.last_seen
      target_field: smb_insights.last_seen
      tag: parse_smb_insights_last_seen
      formats:
        - ISO8601
      if: ctx.json?.smb_insights?.last_seen != null
      ignore_failure: true
  - date:
      field: json.netflow.start
      target_field: netflow.start
      tag: parse_netflow_start
      formats:
        - ISO8601
      if: ctx.json?.netflow?.start != null
      ignore_failure: true
  - date:
      field: json.netflow.end
      target_field: netflow.end
      tag: parse_netflow_end
      formats:
        - ISO8601
      if: ctx.json?.netflow?.end != null
      ignore_failure: true

  - append:
      tag: append_event_type_flow_start
      if: ctx.json?.flow?.state == "new"
      field: event.type
      value: start
      allow_duplicates: false
  - append:
      tag: append_event_type_flow_end
      if: ctx.json?.flow?.state == "closed"
      field: event.type
      value: end
      allow_duplicates: false

  - set:
      tag: set_http_outcome_success
      if: >-
        (ctx.json?.event_type == "http" || ctx.json?.event_type == "http2") &&
        ctx.json?.http?.status != null && ctx.json.http.status < 400
      field: event.outcome
      value: success
  - set:
      tag: set_http_outcome_failure
      if: >-
        (ctx.json?.event_type == "http" || ctx.json?.event_type == "http2") &&
        ctx.json?.http?.status != null && ctx.json.http.status >= 400
      field: event.outcome
      value: failure
  - set:
      tag: set_http_request_method
      if: ctx.json?.event_type == "http" || ctx.json?.event_type == "http2"
      field: http.request.method
      copy_from: json.http.http_method
      ignore_failure: true
  - rename:
      tag: rename_http_status
      if: ctx.json?.event_type == "http" || ctx.json?.event_type == "http2"
      field: json.http.status
      target_field: http.response.status_code
      ignore_missing: true
  - rename:
      tag: rename_http_length
      if: ctx.json?.event_type == "http" || ctx.json?.event_type == "http2"
      field: json.http.length
      target_field: http.response.body.bytes
      ignore_missing: true
  - set:
      tag: set_destination_domain_from_http_hostname
      if: >-
        (ctx.json?.event_type == "http" || ctx.json?.event_type == "http2") &&
        ctx.json?.http?.hostname != null && ctx.destination?.domain == null
      field: destination.domain
      copy_from: json.http.hostname
      ignore_failure: true
  - set:
      tag: set_url_domain
      if: >-
        (ctx.json?.event_type == "http" || ctx.json?.event_type == "http2") &&
        ctx.destination?.domain != null
      field: url.domain
      copy_from: destination.domain
      ignore_failure: true
  - grok:
      tag: grok_http_url
      if: ctx.json?.event_type == "http" || ctx.json?.event_type == "http2"
      field: json.http.url
      patterns:
        - '^%{PATH:url.path}(?:\?%{QUERY:url.query})?(?:#%{ANY:url.fragment})?$'
      ignore_missing: true
      ignore_failure: true
      pattern_definitions:
        PATH: '[^?#]*'
        QUERY: '[^#]*'
        ANY: '.*'
  - rename:
      tag: rename_http_url_original
      if: ctx.json?.event_type == "http" || ctx.json?.event_type == "http2"
      field: json.http.url
      target_field: url.original
      ignore_missing: true

  - append:
      tag: append_email_from_address
      if: ctx.smtp?.mail_from != null
      field: email.from.address
      value: '{{{smtp.mail_from}}}'
      allow_duplicates: false
  - set:
      tag: set_email_to_address
      if: ctx.smtp?.rcpt_to != null
      field: email.to.address
      copy_from: smtp.rcpt_to
      ignore_failure: true

  - registered_domain:
      tag: registered_domain_dns_rrname
      field: json.dns.rrname
      target_field: dns.question
      ignore_missing: true
      if: ctx.json?.dns?.rrname != null
  - pipeline:
      tag: pipeline_dns
      if: ctx.network?.protocol == "dns" && ctx.json?.dns != null
      name: '{{ IngestPipeline "dns" }}'
  - pipeline:
      tag: pipeline_tls
      if: ctx.json?.tls != null
      name: '{{ IngestPipeline "tls" }}'

  - append:
      field: related.hash
      tag: append_related_hash_sha256
      value: '{{file.hash.sha256}}'
      allow_duplicates: false
      if: ctx.file?.hash?.sha256 != null
  - append:
      field: related.ip
      tag: append_related_ip_source
      value: '{{source.ip}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      field: related.ip
      tag: append_related_ip_destination
      value: '{{destination.ip}}'
      allow_duplicates: false
      if: ctx.destination?.ip != null
  - append:
      field: related.ip
      tag: append_related_ip_dhcp_assigned
      value: '{{dhcp.assigned_ip}}'
      allow_duplicates: false
      if: ctx.dhcp?.assigned_ip != null
  - append:
      field: related.ip
      tag: append_related_ip_dhcp_client
      value: '{{dhcp.client_ip}}'
      allow_duplicates: false
      if: ctx.dhcp?.client_ip != null
  - append:
      field: related.ip
      tag: append_related_ip_arp_src
      value: '{{arp.src_ip}}'
      allow_duplicates: false
      if: ctx.arp?.src_ip != null
  - append:
      field: related.ip
      tag: append_related_ip_arp_dest
      value: '{{arp.dest_ip}}'
      allow_duplicates: false
      if: ctx.arp?.dest_ip != null
  - append:
      field: related.hosts
      tag: append_related_hosts_hostname_info
      value: '{{hostname_info.host}}'
      allow_duplicates: false
      if: ctx.hostname_info?.host != null
  - append:
      field: related.hosts
      tag: append_related_hosts_destination_domain
      value: '{{destination.domain}}'
      allow_duplicates: false
      if: ctx.destination?.domain != null
  - append:
      field: related.hosts
      tag: append_related_hosts_dns_question
      value: '{{dns.question.name}}'
      allow_duplicates: false
      if: ctx.dns?.question?.name != null
  - append:
      field: related.hosts
      tag: append_related_hosts_dhcp_hostname
      value: '{{dhcp.hostname}}'
      allow_duplicates: false
      if: ctx.dhcp?.hostname != null

  - geoip:
      field: source.ip
      target_field: source.geo
      tag: geoip_source_ip
      if: ctx.source?.ip != null
      ignore_missing: true
  - geoip:
      field: destination.ip
      target_field: destination.geo
      tag: geoip_destination_ip
      if: ctx.destination?.ip != null
      ignore_missing: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      tag: geoip_asn_source_ip
      if: ctx.source?.ip != null
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      tag: geoip_asn_destination_ip
      if: ctx.destination?.ip != null
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      field: source.as.asn
      target_field: source.as.number
      tag: rename_source_asn
      ignore_missing: true
  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      tag: rename_source_as_org
      ignore_missing: true
  - rename:
      field: destination.as.asn
      target_field: destination.as.number
      tag: rename_destination_asn
      ignore_missing: true
  - rename:
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      tag: rename_destination_as_org
      ignore_missing: true

  - rename:
      field: json.stats
      target_field: stats
      tag: rename_stats
      ignore_missing: true
      if: ctx.json?.event_type == 'stats'
  - remove:
      field: json
      tag: remove_json_temp
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: append_pipeline_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event_on_pipeline_error
      value: preserve_original_event
      allow_duplicates: false
