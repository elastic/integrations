---
description: Pipeline for Stamus Networks DNS answers, Suricata EVE version 2.

processors:
  - rename:
      tag: rename_dns_answers
      field: json.dns.answers
      target_field: dns.answers
      ignore_missing: true
  - script:
      if: ctx.dns != null && ctx.dns.answers != null
      lang: painless
      tag: dns_answers_v2
      source: |
        def resolvedIps = new ArrayList();
        for (def answer : ctx.dns.answers) {
            def name = answer.remove("rrname");
            if (name != null) {
                answer.put("name", name);
            }
            def type = answer.remove("rrtype");
            if (type != null) {
                answer.put("type", type);
            }
            def data = answer.remove("rdata");
            if (data != null) {
                answer.put("data", data);
            }
            if (type == "A" || type == "AAAA") {
                resolvedIps.add(data);
            }
        }
        if (resolvedIps.size() > 0) {
            ctx.dns.resolved_ip = resolvedIps;
        }
on_failure:
  - set:
      field: event.kind
      tag: set_dns_v2_pipeline_error_kind
      value: pipeline_error
  - append:
      field: error.message
      tag: append_dns_v2_pipeline_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
  - append:
      field: tags
      tag: append_dns_v2_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
