            - name: fragments
              type: long
              description: Suricata EVE stats counter.
            - name: reassembled
              type: long
              description: Suricata EVE stats counter.
        - name: ipv6
          type: group
          description: Suricata EVE stats group.
          fields:
            - name: timeouts
              type: long
              description: Suricata EVE stats counter.
            - name: fragments
              type: long
              description: Suricata EVE stats counter.
            - name: reassembled
