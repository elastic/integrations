# later versions go on top
- version: "0.1.0"
  changes:
    - description: Require Kibana 9.5 for inline ES|QL dashboard panels
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22258
    - description: Exclude missing values from dashboard breakdowns instead of showing null buckets
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22258
