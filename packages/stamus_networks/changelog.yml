      type: bugfix
      link: https://github.com/elastic/integrations/pull/22258
    - description: Tolerate a list-valued host_id.client_service without failing the Host Insights page
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22258
    - description: Accept already-parsed EVE documents on the network data stream and keep the probe name on observer.name
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22258
    - description: Add the Protocol Insights and SMB Insights dashboards
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22258
    - description: Add the network data stream for Clear NDR protocol and network logs
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22258
