# later versions go on top
- version: "0.1.0"
  changes:
    - description: Require Kibana 9.5 for inline ES|QL dashboard panels
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
    - description: Refresh unchanged Host Insights profiles so they remain visible in time-filtered dashboards
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Document that the package is tested against a full Stamus Clear NDR server
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
    - description: Send both page and page_number so a full Clear NDR server and Community Clear NDR both paginate
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Accept colon-offset Host Insights timestamps and set observer.name from the probe or the central server
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Tolerate a list-valued host_id.client_service without failing the Host Insights page
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Accept already-parsed Host Insights documents and keep a string probe name off the ECS host object
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Shorten the host insights ingest pipeline description so Kibana can save it
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Add the Host Insights dashboard
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
    - description: Add the host_insights data stream
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
    - description: Shorten the alerts ingest pipeline description so Kibana can save it
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22257
    - description: Accept already-parsed EVE documents on the alerts data stream and keep the probe name on observer.name
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
    - description: Add the IDS and Declarations dashboard
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
    - description: Initial draft of the package with the alerts data stream
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22257
