- name: input.type
  type: keyword
  description: Type of the Elastic Agent input that collected the event.
- name: log.offset
  type: long
  description: Log offset.
- name: log.file.path
  type: keyword
  description: Path to the log file the event was read from.
- name: log.source.address
  type: keyword
  description: Source address of the syslog message, set by the udp and tcp inputs.
