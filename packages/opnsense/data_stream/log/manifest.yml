title: OPNsense logs
type: logs
streams:
  - input: udp
    title: OPNsense logs (UDP)
    description: Receive syslog from OPNsense over UDP, its default remote logging transport.
    template_path: udp.yml.hbs
    vars:
      - name: syslog_host
        type: text
        title: Listen address
        description: The interface that receives syslog from OPNsense.
        multi: false
        required: true
        show_user: true
        default: localhost
      - name: syslog_port
        type: integer
        title: Listen port
        description: The port to listen on. Set the same port as the target in OPNsense.
        multi: false
        required: true
        show_user: true
        default: 9525
      - name: internal_networks
        type: text
        title: Internal networks
        description: >-
          Networks treated as internal when setting `network.direction`. Accepts CIDR ranges and the named ranges of the network direction processor, such as `private`. With no value, `network.direction` is not set.
        multi: true
        required: false
        show_user: true
        default:
          - private
      - name: tz_offset
        type: text
        title: Timezone of BSD syslog timestamps
        description: >-
          Timezone used for RFC 3164 (BSD) timestamps, which carry no offset. `local` uses the timezone of the host running the agent. Otherwise use a canonical ID such as `Europe/Amsterdam` or an offset such as `+02:00`. RFC 5424 timestamps carry their own offset and are not affected.
        multi: false
        required: true
        show_user: true
        default: local
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - opnsense
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Keep the raw syslog message in the `event.original` field.
        multi: false
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
  - input: tcp
    title: OPNsense logs (TCP)
    description: Receive syslog from OPNsense over TCP.
    template_path: tcp.yml.hbs
    enabled: false
    vars:
      - name: syslog_host
        type: text
        title: Listen address
        description: The interface that receives syslog from OPNsense.
        multi: false
        required: true
        show_user: true
        default: localhost
      - name: syslog_port
        type: integer
        title: Listen port
        description: The port to listen on. Set the same port as the target in OPNsense.
        multi: false
        required: true
        show_user: true
        default: 9525
      - name: internal_networks
        type: text
        title: Internal networks
        description: >-
          Networks treated as internal when setting `network.direction`. Accepts CIDR ranges and the named ranges of the network direction processor, such as `private`. With no value, `network.direction` is not set.
        multi: true
        required: false
        show_user: true
        default:
          - private
      - name: tz_offset
        type: text
        title: Timezone of BSD syslog timestamps
        description: >-
          Timezone used for RFC 3164 (BSD) timestamps, which carry no offset. `local` uses the timezone of the host running the agent. Otherwise use a canonical ID such as `Europe/Amsterdam` or an offset such as `+02:00`. RFC 5424 timestamps carry their own offset and are not affected.
        multi: false
        required: true
        show_user: true
        default: local
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - opnsense
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Keep the raw syslog message in the `event.original` field.
        multi: false
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
  - input: logfile
    title: OPNsense logs (file)
    description: Read OPNsense syslog from a file.
    template_path: logfile.yml.hbs
    enabled: false
    vars:
      - name: paths
        type: text
        title: File paths
        description: Paths to files holding OPNsense syslog messages, one per line.
        multi: true
        required: true
        show_user: true
        default:
          - /var/log/opnsense/opnsense.log
      - name: internal_networks
        type: text
        title: Internal networks
        description: >-
          Networks treated as internal when setting `network.direction`. Accepts CIDR ranges and the named ranges of the network direction processor, such as `private`. With no value, `network.direction` is not set.
        multi: true
        required: false
        show_user: true
        default:
          - private
      - name: tz_offset
        type: text
        title: Timezone of BSD syslog timestamps
        description: >-
          Timezone used for RFC 3164 (BSD) timestamps, which carry no offset. `local` uses the timezone of the host running the agent. Otherwise use a canonical ID such as `Europe/Amsterdam` or an offset such as `+02:00`. RFC 5424 timestamps carry their own offset and are not affected.
        multi: false
        required: true
        show_user: true
        default: local
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - opnsense
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Keep the raw syslog message in the `event.original` field.
        multi: false
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
