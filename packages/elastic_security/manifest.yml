format_version: 3.6.1
name: elastic_security
title: Elastic Security
version: 0.7.0
source:
  license: "Elastic-2.0"
description: Collect logs from Elastic Instance with Elastic Agent.
type: integration
categories:
  - security
  - siem
conditions:
  kibana:
    version: "^9.4.0"
  agent:
    version: "^9.4.0"
  elastic:
    subscription: basic
screenshots:
  - src: /img/elastic-security-alert-dashboard.png
    title: Elastic Security Alert Dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/elastic-security-logo.svg
    title: Elastic Security Logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: elastic_security
    title: Elastic Security logs
    description: Collect Elastic Security logs.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: ga
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: cel
        title: Collect Elastic Security events via API
        description: Collect events from Elastic instance via API.
        vars:
          - name: username
            type: text
            title: Username
            description: The username of Elasticsearch Instance to be used with Basic Auth headers.
            multi: false
            show_user: true
          - name: password
            type: password
            title: Password
            description: The password of Elasticsearch Instance to be used with Basic Auth headers.
            multi: false
            secret: true
            show_user: true
          - name: api_key
            type: password
            title: API Key
            description: The API Key of Elasticsearch Instance to be used with API Auth headers.
            multi: false
            secret: true
            show_user: true
          - name: bearer_token
            type: password
            title: Bearer Token
            description: The Bearer Token of Elasticsearch Instance to be used with Bearer Auth headers.
            multi: false
            secret: true
            show_user: true
        var_groups:
          - name: auth_type
            required: true
            title: Authentication
            selector_title: Authentication type
            description: Type of authentication to be used for the Elasticsearch API requests. See [documentation](https://www.elastic.co/docs/api/doc/elasticsearch/authentication) for details.
            options:
              - name: api_auth
                title: API Key
                vars:
                  - api_key
              - name: basic_auth
                title: Basic Auth
                vars:
                  - username
                  - password
              - name: bearer_auth
                title: Bearer Token
                vars:
                  - bearer_token
owner:
  github: elastic/security-service-integrations
  type: elastic
