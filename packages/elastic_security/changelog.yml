# newer versions go on top
- version: "0.6.0"
  changes:
    - description: |
        Migrate alert data stream authentication from required_vars to var_groups for improved UX and cleaner configuration management.
        Bump Kibana and Elastic Agent requirement to ^9.4.0 to support this feature.
        Add Fleet input validation for duration fields and URL scheme restrictions.
        Breaking change: the authentication settings moved from the data stream to the integration policy level.
        After upgrading, edit each existing Elastic Security integration policy and re-enter the credentials
        (API key, username/password, or bearer token) for the selected authentication type.
      type: breaking-change
      link: https://github.com/elastic/integrations/pull/20366
- version: "0.5.0"
  changes:
    - description: Use new `release` field for agentless deployment mode to establish as beta.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18552
- version: "0.4.1"
  changes:
    - description: Change page_size/batch_size variable type from text to integer for Fleet input validation.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/19253
- version: "0.4.0"
  changes:
    - description: Add support for conditional required fields to handle the authentication type.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/15253
- version: "0.3.2"
  changes:
    - description: Generalize install instructions.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/14818
- version: "0.3.1"
  changes:
    - description: Fix typo in README.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/14817
- version: "0.3.0"
  changes:
    - description: |
        Import ECS definitions in process-specific fields using external: ecs.
        Convert `*.supplemental_groups.id` fields to keyword to match ECS data types.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/14638
- version: "0.2.0"
  changes:
    - description: Adding SIEM category.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/14509
- version: "0.1.0"
  changes:
    - description: Initial release.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/14305
