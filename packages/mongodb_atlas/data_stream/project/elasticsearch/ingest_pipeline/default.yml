---
description: Pipeline for processing MongoDB Atlas Project logs
processors:
  - fingerprint:
      tag: fingerprint_e606f30b
      fields: 
        - response.id
      target_field: _id
      ignore_missing: true 
  - set:
      tag: set_ecs_version_9f944f86
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_a3e67f1b
      field: event.kind
      value: event
  - set:
      tag: set_event_module_42505ffc
      field: event.module
      value: mongodb_atlas
  - set:
      tag: set_event_category_b36b2d47
      field: event.category
      value: ["configuration", "database"]
  - set:
      tag: set_event_type_34aecf3a
      field: event.type
      value: ["info"]
  - fail:
      tag: fail_25bf577b
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      message: error message set and no data to process.
  - append:
      tag: append_event_type_002fc0d7
      field: event.type
      value: access
      allow_duplicates: false
      if: ctx.response?.opType != null && ctx.response?.opType.toLowerCase() == 'read'
  - append:
      tag: append_event_type_bd16f1f8
      field: event.type
      value: change
      allow_duplicates: false
      if: ctx.response?.opType != null && ['create', 'update', 'delete', 'insert'].contains(ctx.response?.opType.toLowerCase())
  - set:
      tag: set_event_original_00bbcc8f
      copy_from: response
      field: event.original
      ignore_empty_value: true
      if: ctx.event?.original == null && (ctx.tags != null && (ctx.tags.contains('preserve_original_event')))
  - convert:
      tag: convert_event_original_75bc3236
      type: string
      field: event.original
      ignore_missing: true
  - date:
      tag: date_response_created_5bec9583
      field: response.created
      target_field: '@timestamp'
      formats: [ISO8601]
      on_failure:
        - append:
            tag: append_error_message_0337ba12
            field: error.message
            value: '{{ _ingest.on_failure_message }}'
  - rename:
      tag: rename_response_remoteAddress_6eed8a0b
      field: response.remoteAddress
      target_field: client.ip
      ignore_missing: true
  - rename:
      tag: rename_response_id_be2b36e7
      field: response.id
      target_field: event.id
      ignore_missing: true
  - rename:
      tag: rename_response_groupId_df4ef12f
      field: response.groupId
      target_field: group.id
      ignore_missing: true
  - rename:
      tag: rename_response_orgId_5b04a776
      field: response.orgId
      target_field: organization.id
      ignore_missing: true
  - rename:
      tag: rename_response_userId_88d744c2
      field: response.userId
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_response_username_8ffd393d
      field: response.username
      target_field: user.name
      ignore_missing: true
  - rename:
       field: user.name
       target_field: user.email
       tag: rename_user_email
       if: ctx.user?.name != null && ctx.user.name.indexOf("@") > 0
  - dissect:
      field: user.email
      pattern: '%{user.name}@%{user.domain}'
      tag: dissect_user_email
      ignore_missing: true
      ignore_failure: true
      if: ctx.user?.name == null
  - append:
      tag: append_related_user_63dc7af1
      field: related.user
      value: '{{{user.name}}}'
      if: ctx.user?.name != null
      allow_duplicates: false
  - append:
      tag: append_related_user_ef815a42
      field: related.user
      value: '{{{user.email}}}'
      if: ctx.user?.email != null
      allow_duplicates: false
  - append:
      tag: append_related_ip_cab044a4
