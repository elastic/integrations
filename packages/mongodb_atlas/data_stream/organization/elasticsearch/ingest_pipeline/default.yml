      field: response.whitelistEntry
      target_field: mongodb_atlas.organization.whitelist_entry
      ignore_missing: true
  - script:
      tag: script_5ecb8f58
      lang: painless
      source: |-
        boolean drop(Object o) {
          if (o == null || o == '') {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).size() == 0);
          }
          return false;
        }
        drop(ctx);
      description: Drops null and empty values recursively from the Elasticsearch document context.
  - remove:
      tag: remove_response_1454d42b
      field: response
      ignore_missing: true
      description: Removes temporary fields.
  - set:
      tag: set_event_kind_55da5147
      field: event.kind
      value: pipeline_error
      if: ctx.error?.message != null
on_failure:
  - set:
      tag: set_event_kind_d551f08d
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_6b8ec990
