---
description: Pipeline for processing MongoDB Atlas Organization logs
processors:
  - fingerprint:
      tag: fingerprint_e8bdd575
      fields: 
        - response.id
      target_field: _id
      ignore_missing: true 
  - set:
      tag: set_ecs_version_01cfb159
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_3105e78b
      field: event.kind
      value: event
  - set:
      tag: set_event_module_97ed91c1
      field: event.module
      value: mongodb_atlas
  - set:
      tag: set_event_dataset_3655144f
      field: event.dataset
      value: mongodb_atlas.organization
  - set:
      tag: set_event_category_2bbc683e
      field: event.category
      value: ["configuration", "database"]
  - set:
      tag: set_event_type_3a648f4a
      field: event.type
      value: ["info","access","change"]
  - fail:
      tag: fail_b87bf7bb
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      message: error message set and no data to process.
  - set:
      tag: set_event_original_8b1439c2
      copy_from: response
      field: event.original
      ignore_empty_value: true
      if: ctx.event?.original == null && (ctx.tags != null && (ctx.tags.contains('preserve_original_event')))
  - convert:
      tag: convert_event_original_f9b37be7
      type: string
      field: event.original
      ignore_missing: true
  - date:
      tag: date_response_created_98ca32c9
      field: response.created
      target_field: '@timestamp'
      formats: [ISO8601]
      on_failure:
        - append:
            tag: append_error_message_79315a6a
            field: error.message
            value: '{{ _ingest.on_failure_message }}'
  - rename:
      tag: rename_response_remoteAddress_7b343285
      field: response.remoteAddress
      target_field: client.ip
      ignore_missing: true 
  - rename:
      tag: rename_response_id_35d0bdf7
      field: response.id
      target_field: event.id
      ignore_missing: true
  - rename:
      tag: rename_response_groupId_ae691da9
      field: response.groupId
      target_field: group.id
      ignore_missing: true
  - rename:
      tag: rename_response_orgId_27524378
      field: response.orgId
      target_field: organization.id
      ignore_missing: true
  - append:
      tag: append_related_user_607fb775
      field: related.user
      value: '{{{response.targetUsername}}}'
      if: ctx.response?.targetUsername != null
      allow_duplicates: false
  - append:
      tag: append_related_ip_38bd2e43
      field: related.ip
      value: '{{{client.ip}}}'
      if: ctx.client?.ip != null
      allow_duplicates: false
  - rename:
      tag: rename_response_port_24df8571
      field: response.port
      target_field: server.port
      ignore_missing: true
  - rename:
      tag: rename_response_userId_7ba43d0f
      field: response.userId
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_response_username_45a7df33
      field: response.username
      target_field: user.name
      ignore_missing: true
  - rename:
       field: user.name
       target_field: user.email
       tag: rename_user_email
       if: ctx.user?.name != null && ctx.user.name.indexOf("@") > 0
  - dissect:
      field: user.email
      pattern: '%{user.name}@%{user.domain}'
      tag: dissect_user_email
      ignore_missing: true
      ignore_failure: true
      if: ctx.user?.name == null
  - append:
      tag: append_related_user_7dfb2862
      field: related.user
      value: '{{{user.name}}}'
      if: ctx.user?.name != null
      allow_duplicates: false
  - append:
      tag: append_related_user_b6903d64
      field: related.user
      value: '{{{user.email}}}'
      if: ctx.user?.email != null
      allow_duplicates: false
  - script:
      description: Convert Additional Info keys to snake case.
      tag: additional-info-keys-to-snake-case
      lang: painless
      on_failure:
        - append:
            tag: append_error_message_4e8b9e0a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
      source: |
        Map keysToSnakeCase(Map m) {
          def regex = /_?([a-z])([A-Z]+)/;
          def snakeCaseMap = [:];

          for (entry in m.entrySet()) {
            def k = entry.getKey();
            def v = entry.getValue();

            if (v instanceof Map) {
              v = keysToSnakeCase(v);
            } else if (v instanceof List) {
              for (int i = 0; i < v.size(); i++) {
                def item = v.get(i);
                if (item instanceof Map) {
                  v.set(i, keysToSnakeCase(item));
                }
              }
            }

            k = regex.matcher(k).replaceAll('$1_$2').toLowerCase();
            snakeCaseMap.put(k, v);
          }
          return snakeCaseMap;
        }
        if(ctx.response?.raw != null) {
          ctx.response['raw'] = keysToSnakeCase(ctx.response.raw);
        }
  - rename:
      tag: rename_response_raw_1365cbac
      field: response.raw
      target_field: mongodb_atlas.organization.additional_info
      ignore_missing: true
  - rename:
      tag: rename_response_alertConfigId_ef1702bb
      field: response.alertConfigId
      target_field: mongodb_atlas.organization.alert.config.id
      ignore_missing: true
  - rename:
      tag: rename_response_alertId_6caac6da
      field: response.alertId
      target_field: mongodb_atlas.organization.alert.id
      ignore_missing: true
  - rename:
      tag: rename_response_apiKeyId_737f4bf9
