      target_field: mongodb_atlas.organization.api_key.id
      ignore_missing: true
  - rename:
      tag: rename_response_clusterId_41c81be2
      field: response.clusterId
      target_field: mongodb_atlas.organization.cluster.id
      ignore_missing: true
  - rename:
      tag: rename_response_clusterName_ab0819b6
      field: response.clusterName
      target_field: mongodb_atlas.organization.cluster.name
      ignore_missing: true
  - rename:
      tag: rename_response_collection_8b8e023e
      field: response.collection
      target_field: mongodb_atlas.organization.collection.name
      ignore_missing: true
  - rename:
      tag: rename_response_currentValue_number_67ae89d2
      field: response.currentValue.number
      target_field: mongodb_atlas.organization.metric.value
      ignore_missing: true
  - rename:
      tag: rename_response_currentValue_units_31dbaf09
      field: response.currentValue.units
      target_field: mongodb_atlas.organization.metric.unit
      ignore_missing: true
  - rename:
      tag: rename_response_database_1923828e
      field: response.database
      target_field: mongodb_atlas.organization.database.name
      ignore_missing: true
  - rename:
      tag: rename_response_eventTypeName_15a81b6b
      field: response.eventTypeName
      target_field: mongodb_atlas.organization.event_type.name
      ignore_missing: true
  - rename:
      tag: rename_response_hostId_659c88e7
      field: response.hostId
      target_field: mongodb_atlas.organization.host.id
      ignore_missing: true
  - convert:
      tag: convert_response_hostname_8d7a8ca7
      field: response.hostname
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            tag: append_related_hosts_45fd8eb5
            field: related.hosts
            value: '{{{response.hostname}}}'
            allow_duplicates: false
  - append:
      tag: append_related_ip_05dcda57
      field: related.ip
      value: '{{{response.hostname}}}'
      if: ctx.related?.hosts == null
      allow_duplicates: false
  - rename:
      tag: rename_response_hostname_a77ab346
