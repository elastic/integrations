    # measurement request.  Previously, the error branch returned {events, want_more}
    # without group_id, so the next evaluation crashed with "no such key: group_id".
    # After the fix the error branch preserves group_id, page_num and query.
    groupId: non200-meas-group
input: cel
service: mongodbatlas
