vars:
  url: http://{{Hostname}}:{{Port}}
  public_key: admin
  private_key: MongoDB@123
data_stream:
  vars:
    # empty-processes-group causes the mock server to return an empty /processes
    # results list, which previously triggered a {} state wipe (the 0 >= 0 terminal
    # branch).  After the fix the CEL program returns a proper reset state and
    # the next evaluation starts cleanly without crashing on state.group_id.
    groupId: empty-processes-group
input: cel
service: mongodbatlas
