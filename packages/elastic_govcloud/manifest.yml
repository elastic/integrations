  type: elastic
icons:
  - src: /img/elastic-logo.svg
    title: Elastic GovCloud
    size: 32x32
    type: image/svg+xml
screenshots:
  - src: /img/audit-logs-dashboard.png
    title: Elastic GovCloud Organization Audit Logs
    size: 1920x1336
    type: image/png
