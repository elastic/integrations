- name: elastic_govcloud
  type: group
  fields:
    - name: org_audit
      type: group
      fields:
        - name: api_key
          type: group
          description: API key used to authenticate the Cloud API request, when present.
          fields:
            - name: id
              type: keyword
              description: Identifier of the API key that authenticated the request. Omitted when the request was not API-key authenticated.
            - name: name
              type: keyword
              description: User-chosen label of the API key. Present only for API-key authenticated requests.
        - name: unvalidated_auth_user
          type: keyword
          description: Identity claimed in the request headers (Basic username, JWT or session-cookie subject) before authorization resolves an acting user. Distinct from `user.id`. Omitted when the source value is the sentinel `unknown`.
