service: plc4x
vars:
  hosts:
    - "modbus-tcp://{{Hostname}}:5020"
data_stream:
  vars:
    period: 5s
    plc_tags: |
      - address: "holding-register:1:REAL"
        name: temperature
      - address: "holding-register:11:INT"
        name: offset
      - address: "input-register:1:UINT"
        name: input
