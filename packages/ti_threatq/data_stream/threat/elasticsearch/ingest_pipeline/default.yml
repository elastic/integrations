  ######################
  # Cleanup processors #
  ######################
  # Setting indicator type to unknown if it does not match anything
  - script:
      lang: painless
      if: ctx.threat != null
      tag: set_indicator_type_to_unknown_2429cfdd
      source: |
        void handleMap(Map map) {
          for (def x : map.values()) {
            if (x instanceof Map) {
                handleMap(x);
            } else if (x instanceof List) {
                handleList(x);
            }
          }
        map.values().removeIf(v -> v == null);
        }
        void handleList(List list) {
          for (def x : list) {
              if (x instanceof Map) {
                  handleMap(x);
              } else if (x instanceof List) {
                  handleList(x);
              }
          }
        }
        handleMap(ctx);

