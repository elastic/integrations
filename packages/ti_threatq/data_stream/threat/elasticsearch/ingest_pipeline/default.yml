---
description: Pipeline for parsing ThreatQ Threat Intel logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  ####################
  # Event ECS fields #
  ####################
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - set:
      field: event.kind
      tag: set_event_kind_3410a97a
      value: enrichment
  - set:
      field: event.category
      tag: set_event_category_4675e36d
      value: [threat]
  - set:
      field: event.type
      tag: set_event_type_acbc82af
      value: [indicator]

  ###############
  # Parse dates #
  ###############
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_b006b7b1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json
      tag: rename_json_93007104
      target_field: threatq
      ignore_missing: true
  - append:
      field: related.hash
      tag: append_related_hash_169e5920
      value: '{{{threatq.hash}}}'
      allow_duplicates: false
      if: ctx.threatq?.hash != null
  - date:
      field: threatq.updated_at
      tag: date_updated_at_4f0422a2
      target_field: threatq.updated_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.updated_at != null && ctx.threatq.updated_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_updated_at_f2d784a8
            field: threatq.updated_at
            ignore_missing: true
        - append:
            tag: append_error_message_ecc9c631
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_updated_at_46ba3b46
      copy_from: threatq.updated_at
      ignore_empty_value: true
  - date:
      field: threatq.created_at
      tag: date_created_at_f389ebd2
      target_field: threatq.created_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.created_at != null && ctx.threatq.created_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_created_at_f68e84b9
            field: threatq.created_at
            ignore_missing: true
        - append:
            tag: append_error_message_c59955df
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: threatq.expired_at
      tag: date_expired_at_6cfa164f
      target_field: threatq.expired_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.expired_at != null && ctx.threatq.expired_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_expired_at_7c0e5d57
            field: threatq.expired_at
            ignore_missing: true
        - append:
            tag: append_error_message_34f300b5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: threatq.expires_at
      tag: date_expires_at_3797e906
      target_field: threatq.expires_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.expires_at != null && ctx.threatq.expires_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_expires_at_9c315d78
            field: threatq.expires_at
            ignore_missing: true
        - append:
            tag: append_error_message_85505b8e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: threatq.expires_calculated_at
      tag: date_expires_calculated_at_b65b65e4
      target_field: threatq.expires_calculated_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.expires_calculated_at != null && ctx.threatq.expires_calculated_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_expires_calculated_at_85e9f668
            field: threatq.expires_calculated_at
            ignore_missing: true
        - append:
            tag: append_error_message_a596d854
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: threatq.published_at
      tag: date_published_at_8c2fc44f
      target_field: threatq.published_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.published_at != null && ctx.threatq.published_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_published_at_96ec0060
            field: threatq.published_at
            ignore_missing: true
        - append:
            tag: append_error_message_1fec0e34
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: threatq.touched_at
      tag: date_touched_at_22298e34
      target_field: threatq.touched_at
      formats:
        - 'yyyy-MM-dd HH:mm:ss'
      if: ctx.threatq?.touched_at != null && ctx.threatq.touched_at != ''
      on_failure:
        - remove:
            tag: remove_threatq_touched_at_109f9660
            field: threatq.touched_at
            ignore_missing: true
        - append:
            tag: append_error_message_27872772
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: threatq.id
      tag: convert_id_to_long_d0c568fd
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_threatq_id_0f69ad2e
            field: threatq.id
            ignore_missing: true
        - append:
            tag: append_error_message_89b91f5a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: threatq.indicator_id
      tag: convert_indicator_id_to_long_92094b03
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_threatq_indicator_id_58ffd474
            field: threatq.indicator_id
            ignore_missing: true
        - append:
            tag: append_error_message_79a44596
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: threatq.status.id
      tag: convert_status_id_to_string_9413f328
      type: string
      ignore_missing: true
  - convert:
      field: threatq.status_id
      tag: convert_status_id_to_string_3abd3ce1
      type: string
      ignore_missing: true
  - convert:
      field: threatq.type.id
      tag: convert_type_id_to_string_8dffc130
      type: string
      ignore_missing: true
  - convert:
      field: threatq.type_id
      tag: convert_type_id_to_string_32f7f70a
      type: string
      ignore_missing: true
  #####################
  # Threat ECS Fields #
  #####################
  - convert:
      field: threatq.score
      tag: convert_score_to_long_7ff41cbd
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_threatq_score_67758753
            field: threatq.score
            ignore_missing: true
        - append:
            tag: append_error_message_3a40360f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: threat.indicator.description
      tag: set_threat_indicator_description_from_description_ce2dc70b
      copy_from: threatq.description
      ignore_empty_value: true
  - script:
      lang: painless
      tag: set_threat_indicator_confidence_1039e623
      if: ctx.threatq?.score != null
      description: >
        Normalize confidence level.
      source: >
        def value = ctx.threatq.score;
        if (ctx.containsKey('threat') == false || ctx.threat == null) {
          ctx.threat = new HashMap();
        }

        if (ctx.threat.containsKey('indicator') == false || ctx.threat.indicator == null) {
          ctx.threat.indicator = new HashMap();
        }
        if (value >= 0 && value <= 4) {
          ctx.threat.indicator.confidence = "Low";
          return;
        }
        if (value >= 5 && value <=7) {
          ctx.threat.indicator.confidence = "Medium";
          return;
        }
        if (value >= 8 && value <= 10) {
          ctx.threat.indicator.confidence = "High";
          return;
        }
  - rename:
      field: threatq.value
      tag: rename_value_8dbff162
      target_field: threatq.indicator_value
      ignore_missing: true

  ##################
  # IOC Expiration #
  ##################

  # Set threatq.ioc_expired_at from threatq.expires_at or threatq.expired_at (if present). Either `expires_at` or `expired_at` are available in the data.
  # When the datetime threatq.ioc_expired_at is reached, the indicator is deleted using transform's retention policy in the destination index.
  - set:
      field: threatq.ioc_expired_at
      tag: set_ioc_expired_at_from_expires_at_b042fefe
      copy_from: threatq.expires_at
      if: ctx.threatq?.expires_at != null
  - set:
      field: threatq.ioc_expired_at
      tag: set_ioc_expired_at_from_expired_at_98066d93
      copy_from: threatq.expired_at
      if: ctx.threatq?.expired_at != null
      override: true
  # In case threatq.ioc_expired_at is not set at this point, then based on the `threatq.status`, the indicator is assumed to be Active/Expired.
  # Below script checks if indicator is expired based on the value of `threatq.status`. If `threatq.status` == 'Expired', then indicator is expired.
  # The script:
  # 1. Sets `threatq.ioc_expired_at` to `threatq.updated_at` (@timestamp) to delete the indicator using transform's retention policy in destination index.
  # If the indicator is not expired, set default expiration time to delete indicators after a certain duration. 
  # This is configurable using _conf.ioc_expiration_duration (default: 90d). Default expiration is required to avoid lingering orphaned indicators in the destination indices. 
  # If user-provided value of `ioc_expiration_duration` is not in d, h, or m, default to 90d.
  # 2. Sets `threatq.ioc_expiration_reason` indicating the reason for expiry. Possible values are in the script params.
  - script:
      lang: painless
      tag: script-expired_ioc_058564c5
      if: (ctx._conf?.ioc_expiration_duration != null && ctx._conf.ioc_expiration_duration != '')
      params:
        expires_at: "Expiration set by ThreatQ from expires_at field"
        expired_at: "Expiration set by ThreatQ from expired_at field"
        expired_status: "Expiration set by Elastic when threatq.status is 'Expired'"
        expired_default: "Expiration set by Elastic from the integration's parameter `IOC Expiration Duration`"
      source: |
        if (ctx.threatq.ioc_expired_at == null) {
          ZonedDateTime ioc_expired_at;
          if (ctx.threatq.status == 'Expired') {
            ioc_expired_at = ZonedDateTime.parse(ctx['@timestamp']);
          }
          else {
            def dur = ctx._conf.ioc_expiration_duration;
            ZonedDateTime updated_at = ZonedDateTime.parse(ctx.threatq.updated_at, DateTimeFormatter.ISO_ZONED_DATE_TIME);
            if (dur instanceof String){
              char time_unit;
              String time_value;
              if (dur.length() != 0){
                time_unit = dur.charAt(dur.length() - 1);
                time_value = dur.substring(0, dur.length() - 1);
              }
              if (time_unit == (char)'d') {
                ioc_expired_at = updated_at.plusDays(Long.parseLong(time_value));
              } else if (time_unit == (char)'h') {
                ioc_expired_at = updated_at.plusHours(Long.parseLong(time_value));
              } else if (time_unit == (char)'m') {
                ioc_expired_at = updated_at.plusMinutes(Long.parseLong(time_value));
              } else {
                if (ctx.error == null) {
                  ctx.error = new HashMap();
                }
                if (ctx.error.message == null) {
                  ctx.error.message = new ArrayList();
                }
                ctx.error.message.add('invalid ioc_expiration_duration: using default 90 days');
                ioc_expired_at = updated_at.plusDays(90L);
              }
            }
            else {
              ioc_expired_at = updated_at.plusDays(90L);
            }
          }
          ctx.threatq.ioc_expired_at = ioc_expired_at;
        }

        // Set threatq.ioc_expiration_reason
        if (ctx.threatq.expires_at != null && ctx.threatq.expired_at == null) {
          ctx.threatq.ioc_expiration_reason = params.expires_at;
        } else if (ctx.threatq.expired_at != null) {
          ctx.threatq.ioc_expiration_reason = params.expired_at;
        } else if (ctx.threatq.status == 'Expired') {
          ctx.threatq.ioc_expiration_reason = params.expired_status;
        } else {
          ctx.threatq.ioc_expiration_reason = params.expired_default;
        }
      on_failure:
        - append:
            tag: append_error_message_4916acaf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  #########################################
  # Map indicator types and values to ECS #
  #########################################

  # Indicator type: Email Address
  - set:
      field: threat.indicator.email.address
      tag: set_indicator_email_address_from_indicator_value_6fb50094
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'Email Address'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_email_addr_e1ad55c1
      value: email-addr
      if: ctx.threatq?.type?.name == 'Email Address'

  # Indicator type: FQDN
  - set:
      field: threat.indicator.url.domain
      tag: set_indicator_url_domain_from_indicator_value_2701703a
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'FQDN'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_domain_name_1b0063ca
      value: domain-name
      if: ctx.threatq?.type?.name == 'FQDN'

  # Indicator type: IP Address
  - set:
      field: threat.indicator.ip
      tag: set_indicator_ip_from_indicator_value_00364e41
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'IP Address'
      ignore_empty_value: true

  - set:
      field: threat.indicator.type
      tag: set_indicator_type_ipv4_addr_e4f63896
      value: ipv4-addr
      if: ctx.threatq?.type?.name == 'IP Address'
  - append:
      field: related.ip
      tag: append_related_ip_c55d3a00
      value: '{{{threatq.indicator_value}}}'
      allow_duplicates: false
      if: ctx.threatq?.type?.name == 'IP Address'

  # Indicator type: IPv6 Address
  - set:
      field: threat.indicator.ip
      tag: set_indicator_ip_from_indicator_value_1edf3979
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'IPv6 Address'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_ipv6_addr_068342aa
      value: ipv6-addr
      if: ctx.threatq?.type?.name == 'IPv6 Address'
  - append:
      field: related.ip
      tag: append_related_ipv6_3c0faaaa
      value: '{{{threatq.indicator_value}}}'
      allow_duplicates: false
      if: ctx.threatq?.type?.name == 'IPv6 Address'

  # Indicator type: MD5
  - set:
      field: threat.indicator.file.hash.md5
      tag: set_indicator_file_hash_md5_from_indicator_value_bd24935e
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'MD5'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_file_a5ee89a7
      value: file
      if: ctx.threatq?.type?.name == 'MD5'
  - append:
      field: related.hash
      tag: append_related_hash_md5_1cf1b6e3
      value: '{{{threatq.indicator_value}}}'
      allow_duplicates: false
      if: ctx.threatq?.type?.name == 'MD5'

  # Indicator type: SHA-1
  - set:
      field: threat.indicator.file.hash.sha1
      tag: set_indicator_file_hash_sha1_from_indicator_value_ad9e74ae
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'SHA-1'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_file_73bdf61c
      value: file
      if: ctx.threatq?.type?.name == 'SHA-1'
  - append:
      field: related.hash
      tag: append_related_hash_sha1_77428582
      value: '{{{threatq.indicator_value}}}'
      allow_duplicates: false
      if: ctx.threatq?.type?.name == 'SHA-1'

  # Indicator type: SHA-256
  - set:
      field: threat.indicator.file.hash.sha256
      tag: set_indicator_file_hash_sha256_from_indicator_value_3591a6a4
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'SHA-256'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_file_43c117ed
      value: file
      if: ctx.threatq?.type?.name == 'SHA-256'
  - append:
      field: related.hash
      tag: append_related_hash_sha256_34ef15de
      value: '{{{threatq.indicator_value}}}'
      allow_duplicates: false
      if: ctx.threatq?.type?.name == 'SHA-256'

  # Indicator type: SHA-512
  - set:
      field: threat.indicator.file.hash.sha512
      tag: set_indicator_file_hash_sha512_from_indicator_value_2dff9dcf
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'SHA-512'
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_file_e51163c0
      value: file
      if: ctx.threatq?.type?.name == 'SHA-512'
  - append:
      field: related.hash
      tag: append_related_hash_sha512_bcb21467
      value: '{{{threatq.indicator_value}}}'
      allow_duplicates: false
      if: ctx.threatq?.type?.name == 'SHA-512'

  # Indicator type: Filename
  - set:
      field: threat.indicator.file.name
      tag: set_indicator_file_name_from_indicator_value_d7f0aa31
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'Filename'
      ignore_empty_value: true
  - set:
      field: threat.indicator.file.type
      tag: set_indicator_file_type_file_a4c18274
      value: file
      if: ctx.threatq?.type?.name == 'Filename'
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_file_fc6d3b7f
      value: file
      if: ctx.threatq?.type?.name == 'Filename'

  # Indicator type: URL
  - uri_parts:
      field: threatq.indicator_value
      tag: uri_parts_indicator_value_0e195d48
      target_field: threat.indicator.url
      if: ctx.threatq?.type?.name == 'URL'
      keep_original: true
      remove_if_successful: true
      on_failure:
        - set:
            tag: set_threat_indicator_url_full_fc08d209
            field: threat.indicator.url.full
            value: '{{{threatq.indicator_value}}}'
            ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_indicator_type_url_5a03d125
      value: url
      if: ctx.threatq?.type?.name == 'URL'

  # Indicator type: x509 Serial
  - set:
      field: threat.indicator.x509.serial_number
      tag: set_indicator_x509_serial_from_indicator_value_d1b6ba50
      copy_from: threatq.indicator_value
      if: ctx.threatq?.type?.name == 'x509 Serial'
      ignore_empty_value: true

  ###################################
  # Map indicator providers and TLP #
  ###################################
  - foreach:
      tag: foreach_threatq_sources_c7400dd8
      field: threatq.sources
      if: ctx.threatq?.sources instanceof List
      ignore_missing: true
      processor:
        convert:
          field: _ingest._value.indicator_type_id
          tag: convert_indicator_type_id_to_string_ea68d95a
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_threatq_sources_b20b6716
      field: threatq.sources
      if: ctx.threatq?.sources instanceof List
      ignore_missing: true
      processor:
        convert:
          field: _ingest._value.indicator_status_id
          tag: convert_indicator_status_id_to_string_a20ea54b
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_threatq_sources_dfdca4cb
      field: threatq.sources
      if: ctx.threatq?.sources instanceof List
      ignore_missing: true
      processor:
        convert:
          field: _ingest._value.reference_id
          tag: convert_reference_id_to_string_4656026f
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_threatq_sources_9ff512de
      field: threatq.sources
      if: ctx.threatq?.sources instanceof List
      ignore_missing: true
      processor:
        convert:
          field: _ingest._value.creator_source_id
          tag: convert_creator_source_id_to_string_4c38c417
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_threatq_sources_765c1ff4
      field: threatq.sources
