      ignore_missing: true
      processor:
        remove:
          field:
            - _ingest._value.provider
            - _ingest._value.tlp_name
          tag: remove_custom_duplicate_fields_from_threatq_sources_9d8983ce
          ignore_missing: true
          if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field:
        - threatq.description
        - threatq.score
        - threatq.updated_at
      tag: remove_custom_duplicate_fields_e046d1c8
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
