# newer versions go on top
- version: "0.3.0"
  changes:
    - description: Add a "View in Google Console" row action to the instance tables, open "View metrics in Discover" in the same tab, chart fleet network, disk, swap, firewall and CPU metrics as totals per time bucket instead of per-second values that were inflated when instances started or stopped, count each interruption event once, and sort instances without memory data last in the memory utilization table.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21705
- version: "0.2.0"
  changes:
    - description: Improve overview dashboard header and navigation, align dashboard titles with the [GCP OTel] naming convention, open instance drilldowns in the same tab, fix scheduler wait axis formatting and limit zone charts to the top 10 zones.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21634
- version: "0.1.0"
  changes:
    - description: Initial draft of the GCP Compute Engine OpenTelemetry Assets package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21313
