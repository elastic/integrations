---
description: Pipeline for processing application_risk logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_8efb762c
      value: 9.3.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_74d23cc2
      target_field: json
  - fingerprint:
      tag: fingerprint_application_risk_dedup_3b616196
      fields:
        - json.id
        - json.status
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_c3139286
      value: state
  - append:
      field: event.type
      tag: append_info_into_event_type_5eab37e6
      value: info
  - append:
      field: event.category
      tag: append_vulnerability_into_event_category_30f59663
      value: vulnerability
  - rename:
      field: json.application
      tag: rename_application_5479c3f7
      target_field: sentinel_one.application_risk.application
      ignore_missing: true
  - rename:
      field: json.applicationName
      tag: rename_applicationName_8a8e66e1
      target_field: sentinel_one.application_risk.application_name
      ignore_missing: true
  - set:
      field: package.name
      tag: set_package_name_from_application_risk_application_name_916acd30
      copy_from: sentinel_one.application_risk.application_name
      ignore_empty_value: true
  - rename:
      field: json.applicationVendor
      tag: rename_applicationVendor_1cc57abf
      target_field: sentinel_one.application_risk.application_vendor
      ignore_missing: true
  - rename:
      field: json.applicationVersion
      tag: rename_applicationVersion_2646ed72
      target_field: sentinel_one.application_risk.application_version
      ignore_missing: true
  - set:
      field: package.version
      tag: set_package_version_from_application_risk_application_version_30e7e14b
      copy_from: sentinel_one.application_risk.application_version
      ignore_empty_value: true
  - convert:
      field: json.baseScore
      tag: convert_baseScore_to_double_bce7f9da
      target_field: sentinel_one.application_risk.base_score
      type: double
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_88d9bd93
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: vulnerability.score.base
      tag: set_vulnerability_score_base_from_application_risk_base_score_e032d595
      copy_from: sentinel_one.application_risk.base_score
      ignore_empty_value: true
  - rename:
      field: json.cveId
      tag: rename_cveId_c09e3671
      target_field: sentinel_one.application_risk.cve_id
      ignore_missing: true
  - set:
      field: vulnerability.id
      tag: set_vulnerability_id_from_application_risk_cve_id_5a6add9f
      copy_from: sentinel_one.application_risk.cve_id
      ignore_empty_value: true
  - set:
      field: vulnerability.cve
      tag: set_vulnerability_cve_from_application_risk_cve_id_d002d84c
      copy_from: sentinel_one.application_risk.cve_id
      ignore_empty_value: true
  - rename:
      field: json.cvssVersion
      tag: rename_cvssVersion_9f65e2af
      target_field: sentinel_one.application_risk.cvss_version
      ignore_missing: true
  - set:
      field: vulnerability.score.version
      tag: set_vulnerability_score_version_from_application_risk_cvss_version_8a30bd10
      copy_from: sentinel_one.application_risk.cvss_version
      ignore_empty_value: true
  - convert:
      field: json.daysDetected
      tag: convert_daysDetected_to_long_6d2f165b
      target_field: sentinel_one.application_risk.days_detected
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_5c3f4563
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.detectionDate
      tag: date_detectionDate_7390cee2
      target_field: sentinel_one.application_risk.detection_date
      formats:
        - strict_date_optional_time_nanos
      if: ctx.json?.detectionDate != null && ctx.json.detectionDate != ''
      on_failure:
        - append:
            tag: append_error_message_ea9f7ee9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.endpointId
      tag: convert_endpointId_to_string_25447ef4
      target_field: sentinel_one.application_risk.endpoint_id
      type: string
      ignore_missing: true
  - set:
      field: host.id
      tag: set_host_id_from_application_risk_endpoint_id_35428d5c
      copy_from: sentinel_one.application_risk.endpoint_id
      ignore_empty_value: true
  - set:
      field: resource.id
      tag: set_resource_id_from_application_risk_endpoint_id_d1562f79
      copy_from: sentinel_one.application_risk.endpoint_id
      ignore_empty_value: true
  - rename:
      field: json.endpointName
      tag: rename_endpointName_50d15a3e
      target_field: sentinel_one.application_risk.endpoint_name
      ignore_missing: true
  - set:
      field: resource.name
      tag: set_resource_name_from_application_risk_endpoint_name_a2473bc0
      copy_from: sentinel_one.application_risk.endpoint_name
      ignore_empty_value: true
  - rename:
      field: json.endpointType
      tag: rename_endpointType_55ef7803
      target_field: sentinel_one.application_risk.endpoint_type
      ignore_missing: true
  - set:
      field: host.type
      tag: set_host_type_from_application_risk_endpoint_type_2d86a061
      copy_from: sentinel_one.application_risk.endpoint_type
      ignore_empty_value: true
  - rename:
      field: json.exploitCodeMaturity
      tag: rename_exploitCodeMaturity_aedebc07
      target_field: sentinel_one.application_risk.exploit_code_maturity
      ignore_missing: true
  - convert:
      field: json.id
      tag: convert_id_to_string_8a75bcf5
      target_field: sentinel_one.application_risk.id
      type: string
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_application_risk_id_a1fa3abb
      copy_from: sentinel_one.application_risk.id
      ignore_empty_value: true
  - date:
      field: json.lastScanDate
      tag: date_lastScanDate_3fa56eda
      target_field: sentinel_one.application_risk.last_scan_date
      formats:
        - date_optional_time
      if: ctx.json?.lastScanDate != null && ctx.json.lastScanDate != ''
      on_failure:
        - append:
            tag: append_error_message_b4367070
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_last_scan_date_5d3cbd84
      copy_from: sentinel_one.application_risk.last_scan_date
      ignore_empty_value: true
  - rename:
      field: json.lastScanResult
      tag: rename_lastScanResult_5090945a
      target_field: sentinel_one.application_risk.last_scan_result
      ignore_missing: true
  - set:
      tag: set_event_outcome_3ea2a4a4
      field: event.outcome
      value: success
      if: ctx.sentinel_one?.application_risk?.last_scan_result?.equalsIgnoreCase('Succeeded') == true
  - set:
      tag: set_event_outcome_21c5d555
      field: event.outcome
      value: failure
      if: ctx.sentinel_one?.application_risk?.last_scan_result?.equalsIgnoreCase('Failed') == true
  - set:
      tag: set_event_outcome_2820f2e9
      field: event.outcome
      value: unknown
      override: false
  - rename:
      field: json.markType
      tag: rename_markType_3b411784
      target_field: sentinel_one.application_risk.mark_type
      ignore_missing: true
  - rename:
      field: json.markedBy
      tag: rename_markedBy_f427f0b8
      target_field: sentinel_one.application_risk.marked_by
      ignore_missing: true
  - set:
      field: host.name
      tag: set_host_name_from_application_risk_marked_by_9d70bd69
      copy_from: sentinel_one.application_risk.marked_by
      ignore_empty_value: true
  - date:
      field: json.markedDate
      tag: date_markedDate_2a968cbd
      target_field: sentinel_one.application_risk.marked_date
      formats:
        - date_optional_time
      if: ctx.json?.markedDate != null && ctx.json.markedDate != ''
      on_failure:
        - append:
            tag: append_error_message_43807570
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.mitigationStatus
      tag: rename_mitigationStatus_8476ee0e
      target_field: sentinel_one.application_risk.mitigation_status
      ignore_missing: true
  - date:
      field: json.mitigationStatusChangeTime
      tag: date_mitigationStatusChangeTime_b4b96b2f
      target_field: sentinel_one.application_risk.mitigation_status_change_time
      formats:
        - ISO8601
        - date_optional_time
      if: ctx.json?.mitigationStatusChangeTime != null && ctx.json.mitigationStatusChangeTime != ''
      on_failure:
        - append:
            tag: append_error_message_15a0b2fc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.mitigationStatusChangedBy
      tag: rename_mitigationStatusChangedBy_95dd377e
      target_field: sentinel_one.application_risk.mitigation_status_changed_by
      ignore_missing: true
  - rename:
      field: json.mitigationStatusReason
      tag: rename_mitigationStatusReason_886b441e
      target_field: sentinel_one.application_risk.mitigation_status_reason
      ignore_missing: true
  - convert:
      field: json.nvdBaseScore
      tag: convert_nvdBaseScore_to_float_7343f998
      target_field: sentinel_one.application_risk.nvd_base_score
      type: float
      ignore_missing: true
      if: ctx.json?.nvdBaseScore != ''
      on_failure:
        - append:
            tag: append_error_message_a14f82a0
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.nvdCvssVersion
      tag: rename_nvdCvssVersion_1760500e
      target_field: sentinel_one.application_risk.nvd_cvss_version
      ignore_missing: true
  - rename:
      field: json.osType
      tag: rename_osType_21a7c6dc
      target_field: sentinel_one.application_risk.os_type
      ignore_missing: true
  - set:
      field: host.os.type
      tag: set_host_os_type_from_application_risk_os_type_e64b3278
      copy_from: sentinel_one.application_risk.os_type
      if: >-
        ctx.sentinel_one?.application_risk?.os_type == 'windows'
        || ctx.sentinel_one?.application_risk?.os_type == 'linux'
        || ctx.sentinel_one?.application_risk?.os_type == 'macos'
      ignore_empty_value: true
  - date:
      field: json.publishedDate
      tag: date_publishedDate_8c6ed571
      target_field: sentinel_one.application_risk.published_date
      formats:
        - date_optional_time
      if: ctx.json?.publishedDate != null && ctx.json.publishedDate != ''
      on_failure:
        - append:
            tag: append_error_message_33fe06d6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: vulnerability.package.published_date
      tag: set_vulnerability_package_publisheddate_from_application_published_date_1be84cae
      copy_from: sentinel_one.application_risk.published_date
      ignore_empty_value: true
  - set:
      field: event.created
      tag: set_event_created_ceb98e9d
      copy_from: sentinel_one.application_risk.detection_date
      ignore_empty_value: true
  - rename:
      field: json.reason
      tag: rename_reason_786ef40f
      target_field: sentinel_one.application_risk.reason
      ignore_missing: true
  - set:
      field: event.reason
      tag: set_event_reason_from_application_risk_reason_e233ad5d
      copy_from: sentinel_one.application_risk.reason
      ignore_empty_value: true
  - rename:
      field: json.remediationLevel
      tag: rename_remediationLevel_ee4d2f65
      target_field: sentinel_one.application_risk.remediation_level
      ignore_missing: true
  - rename:
      field: json.reportConfidence
      tag: rename_reportConfidence_be61ee21
      target_field: sentinel_one.application_risk.report_confidence
      ignore_missing: true
  - convert:
      field: json.riskScore
      tag: convert_riskScore_to_double_cefc273f
      target_field: sentinel_one.application_risk.risk_score
      type: double
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_b75d6d29
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.severity
      tag: rename_severity_5e209935
      target_field: sentinel_one.application_risk.severity
      ignore_missing: true
  - script:
      tag: script_e4bd0b3b
      description: Set event severity based on severity.
      if: ctx.sentinel_one?.application_risk?.severity != null
      lang: painless
      params:
        low: 21
        medium: 47
        high: 73
        critical: 99
      source: |-
        ctx.event = ctx.event ?: [:];
        ctx.event.severity = params.get(ctx.sentinel_one.application_risk.severity.toLowerCase());
      on_failure:
        - append:
            tag: append_error_message_7268bec9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.status
      tag: rename_status_9b9b886b
      target_field: sentinel_one.application_risk.status
      ignore_missing: true
  - remove:
      field:
        - sentinel_one.application_risk.application_name
        - sentinel_one.application_risk.application_version
        - sentinel_one.application_risk.base_score
        - sentinel_one.application_risk.cve_id
        - sentinel_one.application_risk.cvss_version
        - sentinel_one.application_risk.endpoint_id
        - sentinel_one.application_risk.endpoint_name
        - sentinel_one.application_risk.endpoint_type
        - sentinel_one.application_risk.id
        - sentinel_one.application_risk.os_type
        - sentinel_one.application_risk.published_date
        - sentinel_one.application_risk.reason
      tag: remove_custom_duplicate_fields_067ddacc
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_7559f019
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_417e65c9
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
