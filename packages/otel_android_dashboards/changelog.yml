# newer versions go on top
- version: "1.1.0"
  changes:
    - description: Redesign the Android application overview and exception details dashboards with collapsible sections, failed span rate and crash rate trend charts, affected installations and occurrences over time on exception details, and installation, session and crash counts on the application and version tables
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21459
    - description: Make every embedded data view copy identical so panels no longer fail with "Field _exception.message was not found" depending on load order
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21459
    - description: Store the "Retrace stack trace" drilldown in the shape Kibana 8.19 reads so it appears on every supported version
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21459
- version: "1.0.0"
  changes:
    - description: Add Android stacktrace retracing and require Kibana versions that provide the client apps plugin
      type: breaking-change
      link: https://github.com/elastic/integrations/pull/20689
- version: "0.1.3"
  changes:
    - description: Fix Top values aggregation on exception.message by adding a keyword runtime field after the field type changed to match_only_text in Elasticsearch OTel mappings
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20368
- version: "0.1.2"
  changes:
    - description: Also match app.crash event name alongside device.crash in crash queries
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20060
- version: "0.1.1"
  changes:
    - description: Update crash event name from app.crash to device.crash
      type: bugfix
      link: https://github.com/elastic/integrations/pull/18183
- version: "0.1.0"
  changes:
    - description: Initial draft of the package
      type: enhancement
      link: https://github.com/elastic/integrations/pull/17541
