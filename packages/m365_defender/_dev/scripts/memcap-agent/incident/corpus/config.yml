# Generation tuning for the incident fields. Fields not listed get default
# per-type randomness. The top-level `fields:` key is what the corpus generator's
# config loader expects (config.LoadConfigFromYaml).
fields:
  - name: id
    cardinality: 100000000
  - name: tenantId
    cardinality: 1                 # single tenant = single page = worst case
  - name: displayName
    cardinality: 1000
  - name: status
    enum: [active, resolved, redirected]
  - name: severity
    enum: [informational, low, medium, high]
  - name: lastUpdateDateTime
    period: -1h
  - name: createdDateTime
    period: -1h
  - name: alert.id
    cardinality: 100000000
  - name: alert.providerAlertId
    cardinality: 100000000
  - name: alert.status
    enum: [new, inProgress, resolved]
  - name: alert.severity
    enum: [informational, low, medium, high]
  - name: alert.category
    enum: [Execution, Persistence, LateralMovement, Exfiltration]
  - name: alert.description
    cardinality: 1000
  - name: alert.recommendedActions
    cardinality: 1000
  - name: alert.evidence.verdict
    enum: [unknown, suspicious, malicious]
  - name: alert.evidence.mdeDeviceId
    cardinality: 10000
  - name: alert.evidence.deviceDnsName
    cardinality: 10000
  - name: alert.evidence.osPlatform
    enum: [Windows10, Windows11, WindowsServer2019, WindowsServer2022]
  - name: alert.evidence.healthStatus
    enum: [active, inactive]
  - name: alert.evidence.riskScore
    enum: [none, low, medium, high]
