# Standalone Elastic Agent config reproducing the agentless m365_defender
# `incident` httpjson input (with include_alerts=true, the shipped default),
# matching what agentless-controller deploys (single container, monitoring on but
# logs/metrics collection off, no GOMEMLIMIT).
#
# This mirrors the RENDERED form of data_stream/incident/agent/stream/httpjson.yml.hbs
# with include_alerts=true. Hand-maintained copy: re-sync if that .hbs changes.
#
# Tuned for a SINGLE-PAGE worst case: batch_size is huge so httpjson does not
# paginate; interval is 24h so it fires once; output is unreachable so decoded
# events are held in memory. The key amplifier is the nested split on body.alerts
# with keep_parent:true - each alert becomes an event that also carries its parent
# incident, so memory grows with incidents x alerts-per-incident.
outputs:
  default:
    type: elasticsearch
    hosts: ["http://127.0.0.1:9200"]
agent:
  monitoring:
    enabled: true
    http:
      enabled: true
      host: 0.0.0.0
      port: 6791
    logs: false
    metrics: false
  logging:
    level: info
    to_stderr: true
inputs:
- type: httpjson
  id: m365d-incident-worstcase
  use_output: default
  data_stream:
    namespace: default
  streams:
  - id: httpjson-m365d-incident-worstcase
    data_stream:
      dataset: m365_defender.incident
      type: logs
    config_version: 2
    interval: 24h
    auth.oauth2.client.id: test-client-id
    auth.oauth2.client.secret: test-client-secret
    auth.oauth2.token_url: http://svc-m365d:8082/tenant_id/oauth2/v2.0/token
    auth.oauth2.scopes: http://svc-m365d:8082/.default
    auth.oauth2.endpoint_params:
      grant_type:
        - client_credentials
    request.url: http://svc-m365d:8082/v1.0/security/incidents
    request.timeout: 300s
    request.transforms:
      - set:
          target: url.params.$top
          value: 100000000
      - set:
          target: url.params.$skip
          value: 0
      - set:
          target: url.params.$filter
          value: 'lastUpdateDateTime ge [[.cursor.last_update_time]]'
          default: 'lastUpdateDateTime ge [[formatDate (now (parseDuration "-24h"))]]'
      - set:
          target: url.params.$orderby
          value: 'lastUpdateDateTime asc'
      - set:
          target: url.params.$expand
          value: 'alerts'
    response.pagination:
      - set:
          target: url.params.$filter
          value: '[[.last_response.url.params.Get "$filter"]]'
          fail_on_template_error: true
          do_not_log_failure: true
      - set:
          target: url.params.$skip
          value: '[[if (eq (len .last_response.body.value) 100000000)]][[add (toInt (.last_response.url.params.Get "$skip")) 100000000]][[end]]'
          fail_on_template_error: true
          do_not_log_failure: true
    response.split:
      target: body.value
      ignore_empty_value: true
      split:
        target: body.alerts
        keep_parent: true
    cursor:
      last_update_time:
        value: >-
          [[- if index .last_event "lastUpdateDateTime" -]]
            [[- .last_event.lastUpdateDateTime -]]
          [[- end -]]
        fail_on_template_error: true
        do_not_log_failure: true
    tags:
      - preserve_original_event
      - forwarded
    publisher_pipeline.disable_host: true
