# Generation tuning for the fields in fields.yml. Fields not listed here get
# default per-type randomness. The top-level `fields:` key is the shape the
# corpus generator's config loader expects (config.LoadConfigFromYaml).
fields:
  - name: id                       # dedup key: keep effectively unique across the page
    cardinality: 100000000
  - name: providerAlertId
    cardinality: 100000000
  - name: incidentId
    cardinality: 100000
  - name: tenantId
    cardinality: 1                 # single tenant = single page = worst case
  - name: lastUpdateDateTime
    period: -1h
  - name: createdDateTime
    period: -1h
  - name: status
    enum: [new, inProgress, resolved]
  - name: severity
    enum: [informational, low, medium, high]
  - name: category
    enum: [Execution, Persistence, LateralMovement, Exfiltration]
  - name: verdict
    enum: [unknown, suspicious, malicious]
  - name: description
    cardinality: 1000
  - name: recommendedActions
    cardinality: 1000
  - name: evidence.mdeDeviceId
    cardinality: 10000
  - name: evidence.deviceDnsName
    cardinality: 10000
  - name: evidence.osPlatform
    enum: [Windows10, Windows11, WindowsServer2019, WindowsServer2022]
  - name: evidence.healthStatus
    enum: [active, inactive]
  - name: evidence.riskScore
    enum: [none, low, medium, high]
