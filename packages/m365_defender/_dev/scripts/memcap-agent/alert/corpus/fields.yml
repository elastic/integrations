# Worst-case m365_defender `alert` record: a Microsoft Graph security `alerts_v2`
# alert with a fat `evidence[]` array (the part of the record that has no server
# cap and dominates size). Shape mirrors data_stream/alert/_dev/test/pipeline/
# test-alert.log. Every field here must be referenced by template.ndjson via
# `generate "<name>"`; every `generate` in the template must have an entry here.
- name: id
  type: keyword
- name: providerAlertId
  type: keyword
- name: incidentId
  type: keyword
- name: tenantId
  type: keyword
- name: detectorId
  type: keyword
- name: status
  type: keyword
- name: severity
  type: keyword
- name: category
  type: keyword
- name: title
  type: keyword
- name: description
  type: keyword
- name: recommendedActions
  type: keyword
- name: createdDateTime
  type: date
- name: lastUpdateDateTime
  type: date
# evidence[] carries most of the weight; each item is a deviceEvidence blob.
- name: evidence.createdDateTime
  type: date
- name: evidence.verdict
  type: keyword
- name: evidence.remediationStatus
  type: keyword
- name: evidence.mdeDeviceId
  type: keyword
- name: evidence.azureAdDeviceId
  type: keyword
- name: evidence.deviceDnsName
  type: keyword
- name: evidence.osPlatform
  type: keyword
- name: evidence.version
  type: keyword
- name: evidence.healthStatus
  type: keyword
- name: evidence.riskScore
  type: keyword
- name: evidence.onboardingStatus
  type: keyword
- name: evidence.defenderAvStatus
  type: keyword
- name: evidence.ipInterface
  type: ip
