# Standalone Elastic Agent config reproducing the agentless m365_defender `alert`
# httpjson input, matching what agentless-controller deploys (single elastic-agent
# container, monitoring enabled but logs/metrics collection off, no GOMEMLIMIT).
#
# This mirrors the RENDERED form of data_stream/alert/agent/stream/httpjson.yml.hbs.
# It is a hand-maintained copy: if that .hbs changes (request.transforms,
# response.split, tags), re-sync this file. See the README "Keep configs in sync".
#
# Tuned for a SINGLE-PAGE worst case: batch_size is set absurdly large so the one
# page the mock returns is smaller than batch_size and httpjson does not paginate;
# interval is 24h so the input fires once. Output points at an unreachable ES on
# purpose: decoded events are held in memory (conservative worst case) and do not
# add page cache to the cgroup. preserve_original_event + forwarded are set because
# production agentless ships them, and preserve_original_event roughly doubles the
# retained per-event size (event.original copy).
outputs:
  default:
    type: elasticsearch
    hosts: ["http://127.0.0.1:9200"]
agent:
  monitoring:
    enabled: true
    http:
      enabled: true
      host: 0.0.0.0
      port: 6791
    logs: false
    metrics: false
  logging:
    level: info
    to_stderr: true
inputs:
- type: httpjson
  id: m365d-alert-worstcase
  use_output: default
  data_stream:
    namespace: default
  streams:
  - id: httpjson-m365d-alert-worstcase
    data_stream:
      dataset: m365_defender.alert
      type: logs
    config_version: 2
    interval: 24h
    auth.oauth2.client.id: test-client-id
    auth.oauth2.client.secret: test-client-secret
    auth.oauth2.token_url: http://svc-m365d:8082/tenant_id/oauth2/v2.0/token
    auth.oauth2.scopes: http://svc-m365d:8082/.default
    auth.oauth2.endpoint_params:
      grant_type:
        - client_credentials
    request.url: http://svc-m365d:8082/v1.0/security/alerts_v2
    request.timeout: 300s
    request.transforms:
      - set:
          target: url.params.$top
          value: 100000000
      - set:
          target: url.params.$skip
          value: 0
      - set:
          target: url.params.$filter
          value: 'lastUpdateDateTime ge [[.cursor.last_update_time]]'
          default: 'lastUpdateDateTime ge [[formatDate (now (parseDuration "-24h"))]]'
      - set:
          target: url.params.$orderby
          value: 'lastUpdateDateTime asc'
    response.pagination:
      - set:
          target: url.params.$filter
          value: '[[.last_response.url.params.Get "$filter"]]'
          fail_on_template_error: true
          do_not_log_failure: true
      - set:
          target: url.params.$skip
          value: '[[if (eq (len .last_response.body.value) 100000000)]][[add (toInt (.last_response.url.params.Get "$skip")) 100000000]][[end]]'
          fail_on_template_error: true
          do_not_log_failure: true
    response.split:
      target: body.value
      ignore_empty_value: true
    cursor:
      last_update_time:
        value: '[[.last_event.lastUpdateDateTime]]'
    tags:
      - preserve_original_event
      - forwarded
    publisher_pipeline.disable_host: true
