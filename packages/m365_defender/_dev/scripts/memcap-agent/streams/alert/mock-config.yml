# elastic/stream mock for the alert (httpjson) memory harness.
#   - token endpoint: client_credentials -> a fixed bearer token
#   - alerts_v2 endpoint: returns ONE page containing the whole generated corpus.
# We do not match on $top/$skip/$filter/$orderby so any pagination params are
# accepted. The page is large but len(value) != batch_size (batch_size in the
# agent config is set huge), so httpjson does not request a second page: the whole
# page is decoded and held in memory (output is unreachable) = worst-case peak.
rules:
  - path: /tenant_id/oauth2/v2.0/token
    methods: [POST]
    query_params:
      grant_type: client_credentials
    request_headers:
      Content-Type:
        - "application/x-www-form-urlencoded"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
          {
            "access_token": "MEMCAPtoken",
            "token_type": "Bearer",
            "expires_in": 3600,
            "ext_expires_in": 3600
          }
          `}}
  - path: /v1.0/security/alerts_v2
    methods: [GET]
    request_headers:
      Authorization:
        - "Bearer MEMCAPtoken"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |
          {"value":[
          {{- $g := glob "/var/log/alert/corpus-*" -}}
          {{- range $g -}}
            {{- file . -}}
          {{- end -}}
          {{/* Final hard-coded record closes the array (no trailing comma). */}}
          {"id":"memcap-tail-1","providerAlertId":"memcap-tail-1","incidentId":"0","status":"new","severity":"informational","serviceSource":"microsoftDefenderForEndpoint","detectionSource":"microsoftDefenderForEndpoint","productName":"Microsoft Defender for Endpoint","title":"tail","description":"tail","category":"Execution","createdDateTime":"2023-10-20T09:53:09.8839373Z","lastUpdateDateTime":"2023-10-20T09:54:07.5033333Z","evidence":[]}
          ]}
