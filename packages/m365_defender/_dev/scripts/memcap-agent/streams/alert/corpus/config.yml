# Generation tuning for the fields in fields.yml. Fields not listed here get
# default per-type randomness. The top-level `fields:` key is the shape the
# corpus generator's config loader expects (config.LoadConfigFromYaml).
#
# `range` on the text fields is what pins the rendered record to the size observed
# on real records; see "Record shapes" in ../../README.md.
fields:
  - name: id                       # dedup key: keep effectively unique across the page
    cardinality: 100000000
  - name: providerAlertId
    cardinality: 100000000
  - name: incidentId
    cardinality: 100000
  - name: tenantId
    cardinality: 1                 # single tenant = single page = worst case
  - name: lastUpdateDateTime
    period: -1h
  - name: createdDateTime
    period: -1h
  - name: status
    enum: [new, inProgress, resolved]
  - name: severity
    enum: [informational, low, medium, high]
  - name: category
    enum: [Execution, Persistence, LateralMovement, Exfiltration]
  - name: investigationState
    enum: [queued, unsupportedAlertType, terminatedByUser, benign]
  - name: description
    cardinality: 1000
  - name: recommendedActions
    cardinality: 1000
  - name: additional.commandLine
    cardinality: 1000
  - name: additional.uri
    cardinality: 10000
  - name: additional.resourceId
    cardinality: 10000
  - name: evidence.verdict
    enum: [unknown, suspicious, malicious]
  - name: evidence.resourceType
    enum: [Virtual Machine, Storage Account, Key Vault, SQL Server]
  - name: evidence.resourceName
    cardinality: 10000
  - name: evidence.resourceId
    cardinality: 10000
  - name: evidence.countryLetterCode
    enum: [US, GB, DE, IN, AU]
  - name: evidence.city
    cardinality: 200
  - name: evidence.state
    cardinality: 50
  - name: evidence.port
    range:
      min: 1024
      max: 65535
  - name: evidence.protocol
    enum: [Tcp, Udp]
  - name: evidence.accountName
    cardinality: 10000
  - name: evidence.domainName
    cardinality: 20
  - name: evidence.userPrincipalName
    cardinality: 10000
