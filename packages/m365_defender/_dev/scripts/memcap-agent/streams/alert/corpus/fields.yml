# Field set for the m365_defender `alert` corpus: a Microsoft Graph security
# `alerts_v2` alert. Every field here must be referenced by template.ndjson via
# `generate "<name>"`; every `generate` in the template must have an entry here.
#
# The shape (which keys exist, how many evidence items, which evidence types, and
# the size of additionalData) is calibrated against a real tenant response - see
# "Record shapes" in ../../README.md for the derived statistics. Only the statistics
# were used; no customer payload is stored here or anywhere in the repo.
- name: id
  type: keyword
- name: providerAlertId
  type: keyword
- name: incidentId
  type: keyword
- name: tenantId
  type: keyword
- name: detectorId
  type: keyword
- name: status
  type: keyword
- name: severity
  type: keyword
- name: category
  type: keyword
- name: investigationState
  type: keyword
- name: title
  type: keyword
- name: description
  type: keyword
- name: recommendedActions
  type: keyword
- name: createdDateTime
  type: date
- name: lastUpdateDateTime
  type: date

# customDetails: a small provider-populated map. Empty on some records, a handful of
# entries on others; it exists here because key count, not just bytes, drives decode cost.
- name: custom.sourceId
  type: keyword
- name: custom.subscriptionId
  type: keyword
- name: custom.resourceGroup
  type: keyword
- name: custom.workspaceId
  type: keyword

# additionalData: a flat string->string map the provider fills in. On real records
# it is the second-largest key after evidence[] (~1 KB, ~18-24 entries), so a template
# without it under-states both bytes and key count.
- name: additional.productName
  type: keyword
- name: additional.providerName
  type: keyword
- name: additional.uri
  type: keyword
- name: additional.host
  type: keyword
- name: additional.processId
  type: keyword
- name: additional.commandLine
  type: keyword
- name: additional.process
  type: keyword
- name: additional.parentProcess
  type: keyword
- name: additional.sessionId
  type: keyword
- name: additional.userName
  type: keyword
- name: additional.resourceId
  type: keyword
- name: additional.alertId
  type: keyword
- name: additional.sourceAddress
  type: ip
- name: additional.principalName
  type: keyword
- name: additional.clientApplication
  type: keyword

# evidence[] carries most of the weight and has no server cap. Real alerts mix ~20
# @odata.type variants; the template cycles the four commonest (azureResource, ip,
# networkConnection, user), which together are ~73% of observed evidence items.
- name: evidence.createdDateTime
  type: date
- name: evidence.verdict
  type: keyword
- name: evidence.resourceType
  type: keyword
- name: evidence.resourceName
  type: keyword
- name: evidence.resourceId
  type: keyword
- name: evidence.ipAddress
  type: ip
- name: evidence.countryLetterCode
  type: keyword
- name: evidence.city
  type: keyword
- name: evidence.state
  type: keyword
- name: evidence.port
  type: long
- name: evidence.protocol
  type: keyword
- name: evidence.userPrincipalName
  type: keyword
- name: evidence.userSid
  type: keyword
- name: evidence.accountName
  type: keyword
- name: evidence.domainName
  type: keyword
- name: evidence.streamName
  type: keyword
