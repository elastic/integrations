---
description: Pipeline for processing Alert logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: '8.11.0'
  - set:
      field: event.kind
      tag: set_event_kind_ab1166ce
      value: alert
  - rename:
      field: message
      tag: rename_message_to_event_original_a7b1f822
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - drop:
      tag: drop_if_event_is_malformed_4de315f5
      description: |
        If an empty 'value' array exists, it means the input did not split correctly because we have
        no more alerts and the event can be ignored.
      if: ctx.json?.value instanceof List && ctx.json.value.length == 0
  - fail:
      tag: fail_if_value_array_has_elements_70fc4de8
      description: |
        If we get here and the 'value' array has elements it means there is an error in the input 
        configuration.
      if: ctx.json?.value instanceof List && ctx.json.value.length > 0
      message: |
        There is an unexpected 'value' array with elements. 
        This indicates a misconfiguration of the input.
  - fingerprint:
      fields:
        - json.id
        - json.lastUpdateDateTime
        - json.incidentId
        - json.providerAlertId
      tag: fingerprint_processor_bcf20331
      target_field: _id
      ignore_missing: true
  - script:
      lang: painless
      description: Drops empty string values recursively.
      tag: painless_remove_empty_from_evidence_999f7462
      if: ctx.json?.evidence != null
      source: |-
        boolean drop(Object object) {
          if (object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx.json.evidence);
  - script:
      description: Dynamically map event.category and event.type field from evidence.
      tag: script_to_set_event_category_and_type_1fb0213c
      lang: painless
      if: ctx.json?.evidence instanceof List
      params:
        '#microsoft.graph.security.analyzedMessageEvidence': email
        '#microsoft.graph.security.mailboxEvidence': email
        '#microsoft.graph.security.mailClusterEvidence': email
        '#microsoft.graph.security.deviceEvidence': host
        '#microsoft.graph.security.fileEvidence': file
        '#microsoft.graph.security.ipEvidence': network
        '#microsoft.graph.security.processEvidence': process
        '#microsoft.graph.security.registryValueEvidence': registry
        '#microsoft.graph.security.registryKeyEvidence': registry
        '#microsoft.graph.security.userEvidence': iam
        '#microsoft.graph.security.securityGroupEvidence': iam
        malware: malware
        malicioususeractivity: malware
        phishing: email
        apt: threat
      source: >
        def eventCategory = new HashSet();
        def eventType = new HashSet();
        for (evidence in ctx.json.evidence) {
          String mapping = params[evidence["@odata.type"]];
          if (mapping != null) {
            eventCategory.add(mapping);
            if(eventCategory.contains('registry')){
              eventType.add('access');
            }
            else if(eventCategory.contains('threat')){
              eventType.add('indicator');
            }
            else{
              eventType.add('info');
            }
          }
        }
        if(ctx.json?.determination != null){
          String mapping = params[ctx.json.determination.toLowerCase()];
          if(mapping != null) {
            eventCategory.add(mapping);
            if(eventCategory.contains('threat')){
              eventType.add('indicator');
            }
            else{
              eventType.add('info');
            }
          }
        }
        if (!eventType.isEmpty()) {
          def type = new ArrayList();
          for(def t:eventType) {
            type.add(t);
          }
          Collections.sort(type);
          ctx.event.type = type;
        }
        if (!eventCategory.isEmpty()) {
          def category = new ArrayList();
          for(def c:eventCategory) {
            category.add(c);
          }
          Collections.sort(category);
          ctx.event.category = category;
        }
