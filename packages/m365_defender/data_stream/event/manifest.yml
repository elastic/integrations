title: Collect Event logs from Microsoft Defender XDR.
type: logs
streams:
  - input: azure-eventhub
    title: Events
    description: Collect events from Microsoft Defender XDR Streaming API.
    enabled: false
    template_path: azure-eventhub.yml.hbs
    vars:
      - name: eventhub
        type: text
        title: Event Hub
        multi: false
        required: true
        show_user: true
        description: >-
          Elastic recommends using one event hub for each integration. Visit [Create an event hub](https://docs.elastic.co/integrations/azure#create-an-event-hub) to learn more. Use event hub names up to 30 characters long to avoid compatibility issues.
      - name: consumer_group
        type: text
        title: Consumer Group
        multi: false
        required: true
        show_user: true
        default: $Default
        description: >-
          We recommend using a dedicated consumer group for the azure input. Reusing consumer groups among non-related consumers can cause unexpected behavior and possibly lost events.
      - name: auth_type
        type: select
        title: Authentication Type
        multi: false
        required: true
        show_user: true
        default: connection_string
        options:
          - text: Connection String
            value: connection_string
          - text: Client Secret
            value: client_secret
        description: >-
          Authentication method to use for Event Hub and Storage Account.
          When set to **Connection String** or left blank: **Connection String** and **Storage Account Key** are required.
          When set to **Client Secret**: Microsoft Entra ID client secret authentication is used, requiring **Tenant ID**, **Client ID**, **Client Secret**, and **Event Hub Namespace**.
          Note: The same authentication type applies to both Event Hub and Storage Account for security consistency.
      - name: connection_string
        type: password
        secret: true
        title: Connection String
        multi: false
        required: false
        show_user: true
        description: >-
          (Required when **Authentication Type** is **Connection String** or left blank) The connection string required to communicate with Event Hubs.
          See [Get an Event Hubs connection string](https://docs.microsoft.com/en-us/azure/event-hubs/event-hubs-get-connection-string) to learn more.
      - name: storage_account_key
        type: password
        secret: true
        title: Storage Account Key
        multi: false
        required: false
        show_user: true
        description: >-
          (Required when **Authentication Type** is **Connection String** or left blank) The storage account key used to authorize access to data in your storage account.
          Not used when **Authentication Type** is **Client Secret**; client secret authentication is used for storage instead.
      - name: storage_account
        type: text
        title: Storage Account
        multi: false
        required: true
        show_user: true
        description: >-
          The name of the storage account where the consumer group's state/offsets will be stored and updated.
      - name: eventhub_namespace
        type: text
        title: Event Hub Namespace
        multi: false
        required: false
        show_user: true
        description: >-
          (Required when **Authentication Type** is **Client Secret**) Fully qualified Event Hub namespace (e.g., namespace.servicebus.windows.net).
          Do not use the short namespace name; use the complete FQDN.
      - name: tenant_id
        type: text
        title: Tenant ID
        multi: false
        required: false
        show_user: true
        description: >-
          (Required when **Authentication Type** is **Client Secret**) Microsoft Entra ID tenant ID.
          This is the directory/tenant where your Microsoft Entra ID application is registered.
      - name: client_id
        type: text
        title: Client ID
        multi: false
        required: false
        show_user: true
        description: >-
          (Required when **Authentication Type** is **Client Secret**) Microsoft Entra ID application (client) ID.
          The service principal must have 'Azure Event Hubs Data Receiver' role on the Event Hub and 'Storage Blob Data Contributor' role on the Storage Account.
      - name: client_secret
        type: password
        secret: true
        title: Client Secret
        multi: false
        required: false
        show_user: true
        description: >-
          (Required when **Authentication Type** is **Client Secret**) Microsoft Entra ID application client secret.
          Generate this secret in your Microsoft Entra ID app registration.
      - name: authority_host
        type: text
        title: Authority Host
        multi: false
        required: false
        show_user: false
        default: https://login.microsoftonline.com
        description: >-
          Microsoft Entra ID authority endpoint. Defaults to https://login.microsoftonline.com (Azure Public Cloud).
          Change for other Azure environments: Azure Government (https://login.microsoftonline.us), Azure China (https://login.chinacloudapi.cn), or Azure Germany (https://login.microsoftonline.de).
          Used by client secret authentication for token requests, and by processor v2 to derive the storage endpoint suffix for all authentication types.
      - name: storage_account_connection_string
        type: password
        title: Storage Account Connection String
        secret: true
        multi: false
        required: false
        show_user: false
        description: >-
          An explicit connection string for the storage account used to store checkpoints. When set, it is
          used as-is; when unset, a connection string is built from **Storage Account** and **Storage Account
          Key**. This setting is useful for processor v2 when the built-in connection string construction is
          not suitable (e.g. sovereign clouds or custom storage endpoints).
      - name: storage_account_container
        type: text
        title: Storage Account Container
        multi: false
        required: false
        show_user: false
        description: >-
          The storage account container where the integration stores the checkpoint data for the consumer group. It is an advanced option to use with extreme care. You MUST use a dedicated storage account container for each Azure log type. DO NOT REUSE the same container name for more than one Azure log type. See [Container Names](https://docs.microsoft.com/en-us/rest/api/storageservices/naming-and-referencing-containers--blobs--and-metadata#container-names) for details on naming rules from Microsoft. The integration generates a default container name if not specified.
      - name: resource_manager_endpoint
        type: text
        title: Resource Manager Endpoint
        multi: false
        required: false
        show_user: false
        description: >-
          (Processor v1 only) By default the azure public environment is used. To use a different azure environment, provide the specific resource manager endpoint. This setting is ignored by processor v2, which derives the environment from the Authority Host setting.
      # Processor v2 and transport settings
      #
      - name: processor_version
        type: select
        title: Processor version
        multi: false
        required: false
        show_user: false
        options:
          - text: v1 (legacy)
            value: v1
          - text: v2
            value: v2
        description: >
          The processor version that the input should use. When unset, the agent's built-in default
          applies (v1 before 9.3, v2 from 9.3). Overridden to v2 when the transport is
          AMQP-over-WebSockets.

          Switching from v1 to v2 changes the checkpoint storage path. Existing v1 checkpoints are
          migrated automatically on first v2 start, but going back to v1 afterwards resumes from
          stale v1 checkpoints and may cause duplicate events. Users on sovereign clouds (GovCloud,
          China) must also set **Authority Host** to the correct login endpoint, because v2 derives
          the storage endpoint suffix from it rather than from **Resource Manager Endpoint**.
      - name: transport
        type: select
        title: Event Hubs transport protocol
        multi: false
        required: false
        show_user: false
        default: amqp
        options:
          - text: AMQP
            value: amqp
          - text: AMQP-over-WebSockets
            value: websocket
        description: >
          The transport protocol used to connect to Event Hubs. AMQP uses port 5671. AMQP-over-WebSockets
          uses port 443, which enables proxy support via the HTTPS_PROXY environment variable.

          Selecting AMQP-over-WebSockets forces the processor version to v2 regardless of the Processor
          version setting, because the WebSocket transport is only supported by the v2 processor. Requires
          Elastic Agent 8.19.10, 9.1.10, 9.2.4, or later.
      - name: processor_start_position
        type: select
        title: Processor start position
        multi: false
        required: false
        show_user: false
        options:
          - text: earliest
            value: earliest
          - text: latest
            value: latest
        description: >-
          The initial position to start reading events from when no checkpoint exists. Defaults
          to "earliest" in the agent. Only applies to processor v2.
      - name: tags
        type: text
        title: Tags
        description: Tags for the data-stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - m365_defender-event
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: preserve_duplicate_custom_fields
        required: true
        show_user: false
        title: Preserve duplicate custom fields
        description: Preserve m365_defender.event fields that were copied to Elastic Common Schema (ECS) fields.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
