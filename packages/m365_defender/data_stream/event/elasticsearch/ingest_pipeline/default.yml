---
description: Pipeline for processing Event logs.
processors:
  - set:
      field: ecs.version
      value: '8.11.0'
      tag: set_ecs_version_6b2cef5e
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_to_event_original_4217da53
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_2071e957
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # Rename processors
  - rename:
      field: json.category
      target_field: m365_defender.event.category
      tag: rename_json_category_754f8521
      ignore_missing: true
  - rename:
      field: json.operationName
      target_field: m365_defender.event.operation_name
      tag: rename_json_operationName_ff2f894c
      ignore_missing: true
  - rename:
      field: json.Tenant
      target_field: m365_defender.event.tenant.name
      tag: rename_json_Tenant_dde3e0c8
      ignore_missing: true
  - rename:
      field: json.tenantId
      target_field: m365_defender.event.tenant.id
      tag: rename_json_tenantId_2be87e29
      ignore_missing: true

  # Date processors
  - date:
      field: json.time
      target_field: m365_defender.event.time
      formats:
        - ISO8601
      tag: date_json_time_963adc31
      if: ctx.json?.time != null
      on_failure:
        - append:
            tag: append_error_message_d5392b80
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.properties.Timestamp
      target_field: m365_defender.event.timestamp
      formats:
        - ISO8601
      tag: date_json_properties_Timestamp_78004879
      if: ctx.json?.properties?.Timestamp != null
      on_failure:
        - append:
            tag: append_error_message_8aaf286d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      copy_from: m365_defender.event.timestamp
      tag: set_timestamp_4a881224
      ignore_empty_value: true

  # Pipeline Processors
  # ctx.m365_defender.event.category is created by Eventhub when retrieving data from M365 Defender.
  # It represents the data table that it accessed, and is a required field for the pipeline to work.
  # Two processors are added to catch if the field is missing, or if it is not a valid value rather than dropping the event.
  - append:
      field: error.message
      value: 'Missing required field: m365_defender.event.category.'
      tag: append_missing_required_field_m365_defender_event_category_779bbd2e
      if: ctx.m365_defender?.event?.category == null || ctx.m365_defender?.event?.category == ""
  - append:
      field: error.message
      value: 'The event category {{{m365_defender.event.category}}} is not supported.'
      tag: append_invalid_m365_defender_event_category_a9397a0c
      if: ctx.m365_defender?.event?.category != null && ![
          'AdvancedHunting-AlertEvidence',
          'AdvancedHunting-AlertInfo',
          'AdvancedHunting-BehaviorEntities',
          'AdvancedHunting-BehaviorInfo',
          'AdvancedHunting-CloudAppEvents',
          'AdvancedHunting-CloudAuditEvents',
          'AdvancedHunting-CloudProcessEvents',
          'AdvancedHunting-CloudStorageAggregatedEvents',
          'AdvancedHunting-DeviceEvents',
          'AdvancedHunting-DeviceFileCertificateInfo',
          'AdvancedHunting-DeviceFileEvents',
          'AdvancedHunting-DeviceImageLoadEvents',
          'AdvancedHunting-DeviceInfo',
          'AdvancedHunting-DeviceLogonEvents',
          'AdvancedHunting-DeviceNetworkEvents',
          'AdvancedHunting-DeviceNetworkInfo',
          'AdvancedHunting-DeviceProcessEvents',
          'AdvancedHunting-DeviceRegistryEvents',
          'AdvancedHunting-EmailAttachmentInfo',
          'AdvancedHunting-EmailEvents',
          'AdvancedHunting-EmailPostDeliveryEvents',
          'AdvancedHunting-EmailUrlInfo',
          'AdvancedHunting-IdentityDirectoryEvents',
          'AdvancedHunting-IdentityInfo',
          'AdvancedHunting-IdentityLogonEvents',
          'AdvancedHunting-IdentityQueryEvents',
          'AdvancedHunting-MessageEvents',
          'AdvancedHunting-MessagePostDeliveryEvents',
          'AdvancedHunting-MessageUrlInfo',
          'AdvancedHunting-UrlClickEvents'
          ].contains(ctx.m365_defender.event.category)
  - pipeline:
      name: '{{ IngestPipeline "pipeline_alert" }}'
      tag: pipeline_alert_dbdd684b
      if: ctx.m365_defender?.event?.category != null && (ctx.m365_defender.event.category.toLowerCase().contains('alert') || ctx.m365_defender.event.category.toLowerCase().contains('behavior'))
  - pipeline:
      name: '{{ IngestPipeline "pipeline_device" }}'
      tag: pipeline_device_cb7df201
      if: ctx.m365_defender?.event?.category != null && ctx.m365_defender.event.category.toLowerCase().contains('device') || ctx.m365_defender.event.category.toLowerCase().contains('processevents')
  - pipeline:
      name: '{{ IngestPipeline "pipeline_email" }}'
      tag: pipeline_email_d4f64ffd
      if: ctx.m365_defender?.event?.category != null && (ctx.m365_defender.event.category.toLowerCase().contains('email') || ctx.m365_defender.event.category.toLowerCase().contains('urlclickevents') || ctx.m365_defender.event.category.toLowerCase().contains('message'))
  - pipeline:
      name: '{{ IngestPipeline "pipeline_app_and_identity" }}'
      tag: pipeline_app_and_identity_e40ca7e7
      if: ctx.m365_defender?.event?.category != null && (ctx.m365_defender.event.category.toLowerCase().contains('identity') || ctx.m365_defender.event.category.toLowerCase().contains('cloudappevents') || ctx.m365_defender.event.category.toLowerCase().contains('cloudauditevents') || ctx.m365_defender.event.category.toLowerCase().contains('cloudstorageaggregatedevents'))
  - set:
      description: Build a joined string for fingerprinting, so it matches other data streams
      field: process.entity_id
      tag: set_process_entity_id_648357dc
      value: '{{{process.pid}}}|{{{process.start}}}|{{{m365_defender.event.device.id}}}'
      if: ctx.process?.pid != null && ctx.process?.start != null && ctx.m365_defender?.event?.device?.id != null
  - fingerprint:
      fields:
        - process.entity_id
      tag: fingerprint_process_entity_id_18086fa3
      target_field: process.entity_id
      ignore_missing: true
  - set:
      description: Build a joined string for fingerprinting, so it matches other data streams
      field: process.parent.entity_id
      tag: set_process_parent_entity_id_5fd5c814
      value: '{{{process.parent.pid}}}|{{{process.parent.start}}}|{{{m365_defender.event.device.id}}}'
      if: ctx.process?.parent?.pid != null && ctx.process?.parent?.start != null && ctx.m365_defender?.event?.device?.id != null
  - fingerprint:
      fields:
        - process.parent.entity_id
      tag: fingerprint_process_parent_entity_id_40ad6e24
      target_field: process.parent.entity_id
      ignore_missing: true
  - set:
      field: process.name
      tag: set_process_name_from_executable_53a3b89d
      copy_from: process.executable
      if: ctx.process?.name == null
      ignore_empty_value: true
  - script:
      lang: painless
      tag: set_process_name_from_command_line_2ee3cae0
      description: Set process.name from process.command_line.
      if: ctx.process?.name == null
      source: |
        ctx.process = ctx.process ?: [:];
        ctx.process.name = ctx.process.name ?: [];
        // Normalize process.name to a list
        def nameList = [];
        if (ctx.process.name != null) {
          if (ctx.process.name instanceof String) {
            nameList.add(ctx.process.name);
          } else if (ctx.process.name instanceof List) {
            nameList.addAll(ctx.process.name);
          }
        }

        // Deduplication using HashSet
        def currentNames = new HashSet();
        currentNames.addAll(nameList);
        // Handle process.command_line (string or list)
        if (ctx.process.command_line != null) {
          // Convert string to list for unified handling
          def cmdList = [];
          if (ctx.process.command_line instanceof String) {
            cmdList.add(ctx.process.command_line);
          } else if (ctx.process.command_line instanceof List) {
            cmdList.addAll(ctx.process.command_line);
          }
          for (cmd in cmdList) {
            if (cmd != null && cmd.length() > 0) {
              // Extract the first token
              def parts = cmd.trim().splitOnToken(" ");
              if (parts.length > 0) {
                def executable = parts[0];
                // If executable is a path, take only the last part
                if (executable.contains("/")) {
                  def slashParts = executable.splitOnToken("/");
                  executable = slashParts[slashParts.length - 1];
                }
                executable = /\"/.matcher(executable).replaceAll("");
                currentNames.add(executable);
              }
            }
          }
        }
        // Update process.name with unique list
        if (currentNames != null && currentNames.size() == 1) {
          ctx.process.name = currentNames.iterator().next();
        } else {
          ctx.process.name = new ArrayList(currentNames);
        }
      on_failure:
        - append:
            tag: append_error_message_2b136ec5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # cloud.instance.id is used for the M365 Defender response action.
  - set:
      field: cloud.instance.id
      copy_from: m365_defender.event.device.id
      tag: set_cloud_instance_id_8ddd6ed6
      override: false
      ignore_empty_value: true
      if: ctx.m365_defender?.event?.device?.id != null
  - set:
      field: device.id
      copy_from: m365_defender.event.device.id
      tag: set_device_id_964d7f93
      ignore_empty_value: true
  - set:
      field: application.name
      copy_from: m365_defender.event.application
      tag: set_application_name_bda11e7f
      ignore_empty_value: true
  # Cleanup
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      description: Drops null/empty values recursively.
      tag: script_drop_empty_fields_53dd9140
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
on_failure:
  - append:
      tag: append_error_message_9c9ce5dc
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
