  - script:
      lang: painless
      tag: set_dns_answers_and_ttls_9e07cb5e
      if: "ctx.m365_defender?.event?.dns?.answers != null && ctx.m365_defender?.event?.dns?.ttls != null"
      source: >-
        def answers = ctx.m365_defender.event.dns.answers;
        def ttls = ctx.m365_defender.event.dns.ttls;
        if (answers.isEmpty() || ttls.isEmpty()) {
          return;
        } else if (answers.length != ttls.length) {
          if (ctx.error == null) {
            ctx.error = new HashMap();
          }
          if (ctx.error.message == null) {
            ctx.error.message = new ArrayList();
          }
          ctx.error.message.add('DNS answers and TTLs have a different length');
        }
        def lst = new ArrayList();
        for (def i = 0; i < answers.length; i++) {
          lst.add([
            "data": answers[i],
            "ttl": (long)ttls[i]
          ])
        }
        if (ctx.dns == null) {
          ctx.dns = new HashMap();
        }
        ctx.dns.answers = lst;
