- name: microsoft_defender_endpoint
  type: group
  fields:
    - name: configuration
      type: group
      fields:
        - name: configuration_category
          type: keyword
          description: Category or grouping to which the configuration belongs, such as Application, OS, Network, Accounts, or Security controls.
        - name: configuration_impact
          type: long
          description: Rated impact of the configuration to the overall configuration score (1-10).
        - name: configuration_subcategory
          type: keyword
          description: Subcategory or subgrouping to which the configuration belongs. In many cases, this describes specific capabilities or features.
        - name: is_applicable
          type: boolean
          description: Indicates whether the configuration or policy is applicable.
        - name: is_compliant
          type: boolean
          description: Indicates whether the configuration or policy is properly configured.
        - name: is_expected_user_impact
          type: boolean
          description: Indicates whether there will be user impact if the configuration will be applied.
        - name: recommendation_reference
          type: keyword
          description: A reference to the recommendation ID related to this software.
        - name: os_platform
          type: keyword
          description: Platform of the operating system running on the device. This indicates specific operating systems, including variations within the same family, such as Windows 10 and Windows 11.
