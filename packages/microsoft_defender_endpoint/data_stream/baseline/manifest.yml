title: Collect Microsoft Defender for Endpoint security baseline assessment logs from API
type: logs
streams:
  - input: cel
    title: Microsoft Defender Endpoint Baseline Assessment
    description: Collect Microsoft Defender for Endpoint security baseline assessment data per device from the baselineComplianceAssessmentByMachine API.
    enabled: false
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: Duration between requests to the Microsoft Defender Endpoint Baseline Assessment API. The API returns a full snapshot of current posture; polling more frequently may return duplicate state. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 12h
      - name: page_size
        type: integer
        title: Page Size
        description: Number of assessment records returned per API page. Maximum is 200000. Each record is approximately 1 KB.
        multi: false
        required: true
        show_user: true
        default: 10000
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        multi: false
        default: false
        required: false
        show_user: false
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field event.original.
        multi: false
        required: false
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data-stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - microsoft_defender_endpoint-baseline
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 30s
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
