---
description: Pipeline for processing baseline assessment logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 8.11.0
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - drop:
      if: ctx.message == 'retry'
      tag: drop_retry_events

  # parse the event JSON
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      tag: fingerprint_baseline_id_and_timestamp
      fields:
        - json.id
        - json.complianceCalculationTimeOffset
      target_field: _id
      ignore_missing: true

  # rename to snake case
  - script:
      tag: script_convert_camelcase_to_snake_case
      lang: painless
      description: Convert camelCase to snake_case
      if: ctx.json != null
      source: |
        // Helper function to convert camelCase to snake_case
        String camelToSnake(String str) {
          def result = "";
          def lastCharWasUpperCase = false;
          for (int i = 0; i < str.length(); i++) {
            char c = str.charAt(i);
            if (Character.isUpperCase(c)) {
              if (i > 0 && !lastCharWasUpperCase) {
                result += "_";
              }
              result += Character.toLowerCase(c);
              lastCharWasUpperCase = true;
            } else {
              result += c;
              lastCharWasUpperCase = false;
            }
          }
          return result;
        }
        // Recursive function to handle nested fields
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            // Convert each key in the map
            def newObj = [:];
            for (entry in obj.entrySet()) {
              // Skip fields that contain '@' in their name
              if (!entry.getKey().contains("@")) {
                String newKey = camelToSnake(entry.getKey());
                newObj[newKey] = convertToSnakeCase(entry.getValue());
              }
            }
            return newObj;
          } else if (obj instanceof List) {
            // If it's a list, process each item recursively
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        // Apply the conversion
        ctx.microsoft_defender_endpoint = ctx.microsoft_defender_endpoint ?: [:];
        ctx.microsoft_defender_endpoint.baseline = convertToSnakeCase(ctx.json);

  # convert values
  - convert:
      field: microsoft_defender_endpoint.baseline.is_applicable
      tag: convert_is_applicable_to_boolean
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_is_applicable_on_failure
            field: microsoft_defender_endpoint.baseline.is_applicable
            ignore_missing: true
        - append:
            tag: append_error_message_c491d30d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: microsoft_defender_endpoint.baseline.is_compliant
      tag: convert_is_compliant_to_boolean
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_is_compliant_on_failure
            field: microsoft_defender_endpoint.baseline.is_compliant
            ignore_missing: true
        - append:
            tag: append_error_message_817e9d6f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: microsoft_defender_endpoint.baseline.rbac_group_id
      tag: convert_rbac_group_id_to_string
      type: string
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_rbac_group_id_on_failure
            field: microsoft_defender_endpoint.baseline.rbac_group_id
            ignore_missing: true
        - append:
            tag: append_error_message_85eae0ad
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # populate ECS fields
  - date:
      field: microsoft_defender_endpoint.baseline.compliance_calculation_time_offset
      tag: date_compliance_calculation_time_offset
      target_field: '@timestamp'
      formats:
        - ISO8601
      if: ctx.microsoft_defender_endpoint?.baseline?.compliance_calculation_time_offset != null && ctx.microsoft_defender_endpoint.baseline.compliance_calculation_time_offset != ''
      on_failure:
        - remove:
            tag: remove_compliance_calculation_time_offset_on_failure
            field: microsoft_defender_endpoint.baseline.compliance_calculation_time_offset
            ignore_missing: true
        - append:
            tag: append_error_message_a400e0df
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # observer.*
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Microsoft
  - set:
      field: observer.product
      tag: set_observer_product
      value: Microsoft Defender for Endpoint

  # event.*
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type
      value: info
      allow_duplicates: false
  - set:
      field: event.id
      tag: set_event_id_from_baseline_id
      copy_from: microsoft_defender_endpoint.baseline.id
      ignore_empty_value: true
  - date:
      field: microsoft_defender_endpoint.baseline.data_collection_time_offset
      tag: date_data_collection_time_offset
      target_field: event.created
      formats:
        - ISO8601
      if: ctx.microsoft_defender_endpoint?.baseline?.data_collection_time_offset != null && ctx.microsoft_defender_endpoint.baseline.data_collection_time_offset != ''
      on_failure:
        - remove:
            tag: remove_data_collection_time_offset_on_failure
            field: microsoft_defender_endpoint.baseline.data_collection_time_offset
            ignore_missing: true
        - append:
            tag: append_error_message_5fd85db5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # rule.*
  - set:
      field: rule.id
      tag: set_rule_id_from_baseline_configuration_id
      copy_from: microsoft_defender_endpoint.baseline.configuration_id
      ignore_empty_value: true

  # host.*
  - set:
      field: host.id
      tag: set_host_id_from_baseline_device_id
      copy_from: microsoft_defender_endpoint.baseline.device_id
      ignore_empty_value: true
  - set:
      field: host.name
      tag: set_host_name_from_baseline_device_name
      copy_from: microsoft_defender_endpoint.baseline.device_name
      ignore_empty_value: true
  - set:
      field: host.os.version
      tag: set_host_os_version_from_baseline_os_version
      copy_from: microsoft_defender_endpoint.baseline.os_version
      ignore_empty_value: true
  - set:
      field: host.os.platform
      tag: set_host_os_platform_from_baseline_os_platform
      copy_from: microsoft_defender_endpoint.baseline.os_platform
      ignore_empty_value: true
  - script:
      description: Dynamically set host.os.type values.
      tag: script_map_host_os_type
      lang: painless
      if: ctx.host?.os?.platform != null
      params:
        os_type:
          - linux
          - macos
          - unix
          - windows
          - ios
          - android
      source: |
        String os_platform = ctx.host.os.platform.toLowerCase();
        for (String os: params.os_type) {
          if (os_platform.contains(os)) {
            if (ctx.host.os == null) {
              ctx.host.os = new HashMap();
            }
            ctx.host.os.put('type', os);
            return;
          }
        }
        if (os_platform.contains('centos') || os_platform.contains('ubuntu')) {
          if (ctx.host.os == null) {
            ctx.host.os = new HashMap();
          }
          ctx.host.os.put('type', 'linux');
        }
  - set:
      field: host.os.name
      tag: set_host_os_name
      value: '{{{host.os.platform}}} {{{host.os.version}}}'
      if: ctx.host?.os?.platform != null && ctx.host?.os?.version != null

  # related.*
  - append:
      field: related.hosts
      tag: append_related_hosts_from_device_id
      value: '{{{host.id}}}'
      allow_duplicates: false
      if: ctx.host?.id != null
  - append:
      field: related.hosts
      tag: append_related_hosts_from_device_name
      value: '{{{host.name}}}'
      allow_duplicates: false
      if: ctx.host?.name != null

  # group.*
  - set:
      field: group.id
      tag: set_group_id_from_baseline_rbac_group_id
      copy_from: microsoft_defender_endpoint.baseline.rbac_group_id
      ignore_empty_value: true
  - set:
      field: group.name
      tag: set_group_name_from_baseline_rbac_group_name
      copy_from: microsoft_defender_endpoint.baseline.rbac_group_name
      ignore_empty_value: true

  - remove:
      field:
        - microsoft_defender_endpoint.baseline.id
        - microsoft_defender_endpoint.baseline.configuration_id
        - microsoft_defender_endpoint.baseline.device_id
        - microsoft_defender_endpoint.baseline.device_name
        - microsoft_defender_endpoint.baseline.os_version
        - microsoft_defender_endpoint.baseline.os_platform
        - microsoft_defender_endpoint.baseline.rbac_group_id
        - microsoft_defender_endpoint.baseline.rbac_group_name
        - microsoft_defender_endpoint.baseline.data_collection_time_offset
        - microsoft_defender_endpoint.baseline.compliance_calculation_time_offset
      tag: remove_fields_mapped_to_ecs
      ignore_missing: true
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true
  - script:
      description: This script processor iterates over the whole document to remove fields with null values.
      tag: script_to_drop_null_values
      lang: painless
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_error_message_e0c9bd63
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
