input: cel
service: microsoft-defender-endpoint-information-gathering-cel
wait_for_data_timeout: 1m
vars:
  url: http://{{Hostname}}:{{Port}}
  login_url: http://{{Hostname}}:{{Port}}
  client_id: test-cel-client-id
  client_secret: test-cel-client-secret
  tenant_id: tenant-id
data_stream:
  vars:
    interval: 10s
    sas_valid_hours: 1
    max_retries: 3
    preserve_original_event: true
    enable_request_tracer: true
assert:
  hit_count: 3
