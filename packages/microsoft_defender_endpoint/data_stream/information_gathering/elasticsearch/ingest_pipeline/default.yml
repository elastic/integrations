---
description: Pipeline for processing information gathering assessment logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 8.11.0
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - drop:
      if: ctx.message == 'retry'
      tag: drop_retry_events

  # parse the event JSON
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      tag: fingerprint_information_gathering_device_id_and_timestamp
      fields:
        - json.DeviceId
        - json.Timestamp
      target_field: _id
      ignore_missing: true
  # rename to snake case
  - json:
      field: json.DeviceGatheredInfo
      tag: parse_device_gathered_info_json
      if: ctx.json?.DeviceGatheredInfo instanceof String && ctx.json.DeviceGatheredInfo != ""
      on_failure:
        - remove:
            tag: remove_device_gathered_info_on_failure
            field: json.DeviceGatheredInfo
            ignore_missing: true
        - append:
            tag: append_error_message_c8ed3607
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_convert_camelcase_to_snake_case
      lang: painless
      description: Convert camelCase to snake_case
      if: ctx.json != null
      source: |
        // Helper function to convert camelCase to snake_case
        String camelToSnake(String str) {
          def result = "";
          def lastCharWasUpperCase = false;
          for (int i = 0; i < str.length(); i++) {
            char c = str.charAt(i);
            if (Character.isUpperCase(c)) {
              if (i > 0 && !lastCharWasUpperCase) {
                result += "_";
              }
              result += Character.toLowerCase(c);
              lastCharWasUpperCase = true;
            } else {
              result += c;
              lastCharWasUpperCase = false;
            }
          }
          return result;
        }
        // Recursive function to handle nested fields
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              if (!entry.getKey().contains("@")) {
                String newKey = camelToSnake(entry.getKey());
                newObj[newKey] = convertToSnakeCase(entry.getValue());
              }
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        ctx.microsoft_defender_endpoint = ctx.microsoft_defender_endpoint ?: [:];
        ctx.microsoft_defender_endpoint.information_gathering = convertToSnakeCase(ctx.json);
  - rename:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.ebpfstatus
      target_field: microsoft_defender_endpoint.information_gathering.device_gathered_info.ebpf_status
      tag: rename_ebpfstatus_to_ebpf_status
      ignore_missing: true

  # convert values
  - convert:
      field: microsoft_defender_endpoint.information_gathering.rbac_group_id
      tag: convert_rbac_group_id_to_string
      type: string
      ignore_missing: true
  - remove:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_engine_up_to_date
      tag: remove_av_is_engine_up_to_date_when_unknown
      ignore_missing: true
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_is_engine_up_to_date != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_engine_up_to_date.toString().equalsIgnoreCase('unknown')
  - convert:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_engine_up_to_date
      tag: convert_av_is_engine_up_to_date_to_boolean
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_av_is_engine_up_to_date_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_engine_up_to_date
            ignore_missing: true
        - append:
            tag: append_error_message_24a60f09
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_platform_up_to_date
      tag: remove_av_is_platform_up_to_date_when_unknown
      ignore_missing: true
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_is_platform_up_to_date != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_platform_up_to_date.toString().equalsIgnoreCase('unknown')
  - convert:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_platform_up_to_date
      tag: convert_av_is_platform_up_to_date_to_boolean
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_av_is_platform_up_to_date_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_platform_up_to_date
            ignore_missing: true
        - append:
            tag: append_error_message_6ee27223
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_signature_up_to_date
      tag: remove_av_is_signature_up_to_date_when_unknown
      ignore_missing: true
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_is_signature_up_to_date != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_signature_up_to_date.toString().equalsIgnoreCase('unknown')
  - convert:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_signature_up_to_date
      tag: convert_av_is_signature_up_to_date_to_boolean
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_av_is_signature_up_to_date_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_is_signature_up_to_date
            ignore_missing: true
        - append:
            tag: append_error_message_bf782ef9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: microsoft_defender_endpoint.information_gathering.last_seen_time
      tag: date_last_seen_time
      target_field: microsoft_defender_endpoint.information_gathering.last_seen
      formats:
        - ISO8601
        - yyyy-MM-dd HH:mm:ss.SSS
        - yyyy-MM-dd HH:mm:ss.S
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd H:mm:ss
      if: ctx.microsoft_defender_endpoint?.information_gathering?.last_seen_time != null && ctx.microsoft_defender_endpoint.information_gathering.last_seen_time != ''
      on_failure:
        - remove:
            tag: remove_last_seen_time_on_failure
            field: microsoft_defender_endpoint.information_gathering.last_seen_time
            ignore_missing: true
        - append:
            tag: append_error_message_cc4fb3e3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_engine_update_time
      tag: date_av_engine_update_time
      target_field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_engine_update_time
      formats:
        - ISO8601
        - yyyy-MM-dd HH:mm:ss.SSS
        - yyyy-MM-dd HH:mm:ss.S
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd H:mm:ss
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_engine_update_time != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_engine_update_time != ''
      on_failure:
        - remove:
            tag: remove_av_engine_update_time_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_engine_update_time
            ignore_missing: true
        - append:
            tag: append_error_message_av_engine_update_time
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_platform_update_time
      tag: date_av_platform_update_time
      target_field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_platform_update_time
      formats:
        - ISO8601
        - yyyy-MM-dd HH:mm:ss.SSS
        - yyyy-MM-dd HH:mm:ss.S
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd H:mm:ss
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_platform_update_time != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_platform_update_time != ''
      on_failure:
        - remove:
            tag: remove_av_platform_update_time_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_platform_update_time
            ignore_missing: true
        - append:
            tag: append_error_message_av_platform_update_time
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_publish_time
      tag: date_av_signature_publish_time
      target_field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_publish_time
      formats:
        - ISO8601
        - yyyy-MM-dd HH:mm:ss.SSS
        - yyyy-MM-dd HH:mm:ss.S
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd H:mm:ss
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_signature_publish_time != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_publish_time != ''
      on_failure:
        - remove:
            tag: remove_av_signature_publish_time_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_publish_time
            ignore_missing: true
        - append:
            tag: append_error_message_av_signature_publish_time
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_update_time
      tag: date_av_signature_update_time
      target_field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_update_time
      formats:
        - ISO8601
        - yyyy-MM-dd HH:mm:ss.SSS
        - yyyy-MM-dd HH:mm:ss.S
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd H:mm:ss
      if: ctx.microsoft_defender_endpoint?.information_gathering?.device_gathered_info?.av_signature_update_time != null && ctx.microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_update_time != ''
      on_failure:
        - remove:
            tag: remove_av_signature_update_time_on_failure
            field: microsoft_defender_endpoint.information_gathering.device_gathered_info.av_signature_update_time
            ignore_missing: true
        - append:
            tag: append_error_message_av_signature_update_time
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # populate ECS fields
  - date:
      field: microsoft_defender_endpoint.information_gathering.timestamp
      tag: date_timestamp
      target_field: '@timestamp'
      formats:
        - ISO8601
        - yyyy-MM-dd HH:mm:ss.SSS
        - yyyy-MM-dd HH:mm:ss.S
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd H:mm:ss
      if: ctx.microsoft_defender_endpoint?.information_gathering?.timestamp != null && ctx.microsoft_defender_endpoint.information_gathering.timestamp != ''
      on_failure:
        - remove:
            tag: remove_timestamp_on_failure
            field: microsoft_defender_endpoint.information_gathering.timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_9dd8a479
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # observer.*
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Microsoft
  - set:
      field: observer.product
      tag: set_observer_product
      value: Microsoft Defender for Endpoint

  # event.*
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category_host
      value: host
      allow_duplicates: false
  - append:
      field: event.category
      tag: append_event_category_configuration
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type
      value: info
      allow_duplicates: false

  # host.*
  - set:
      field: host.id
      tag: set_host_id_from_device_id
      copy_from: microsoft_defender_endpoint.information_gathering.device_id
      ignore_empty_value: true
  - set:
      field: host.name
      tag: set_host_name_from_device_name
      copy_from: microsoft_defender_endpoint.information_gathering.device_name
      ignore_empty_value: true
  - set:
      field: host.os.version
      tag: set_host_os_version_from_os_version
      copy_from: microsoft_defender_endpoint.information_gathering.os_version
      ignore_empty_value: true
  - set:
      field: host.os.platform
      tag: set_host_os_platform_from_os_platform
      copy_from: microsoft_defender_endpoint.information_gathering.os_platform
      ignore_empty_value: true
  - script:
      description: Dynamically set host.os.type values.
      tag: script_map_host_os_type
      lang: painless
      if: ctx.host?.os?.platform != null
      params:
        os_type:
          - linux
          - macos
          - unix
          - windows
          - ios
          - android
      source: |
        String os_platform = ctx.host.os.platform.toLowerCase();
        for (String os: params.os_type) {
          if (os_platform.contains(os)) {
            if (ctx.host.os == null) {
              ctx.host.os = new HashMap();
            }
            ctx.host.os.put('type', os);
            return;
          }
        }
        if (os_platform.contains('centos') || os_platform.contains('ubuntu')) {
          if (ctx.host.os == null) {
            ctx.host.os = new HashMap();
          }
          ctx.host.os.put('type', 'linux');
        }
  - set:
      field: host.os.name
      tag: set_host_os_name
      value: '{{{host.os.platform}}} {{{host.os.version}}}'
      ignore_failure: true
      if: ctx.host?.os?.platform != null && ctx.host?.os?.version != null

  # related.*
  - append:
      field: related.hosts
      tag: append_related_hosts_from_device_id
      value: '{{{host.id}}}'
      allow_duplicates: false
      if: ctx.host?.id != null
  - append:
      field: related.hosts
      tag: append_related_hosts_from_device_name
      value: '{{{host.name}}}'
      allow_duplicates: false
      if: ctx.host?.name != null

  # group.*
  - set:
      field: group.name
      tag: set_group_name_from_rbac_group_name
      copy_from: microsoft_defender_endpoint.information_gathering.rbac_group_name
      ignore_empty_value: true

  - remove:
      field:
        - microsoft_defender_endpoint.information_gathering.device_id
        - microsoft_defender_endpoint.information_gathering.device_name
        - microsoft_defender_endpoint.information_gathering.os_version
        - microsoft_defender_endpoint.information_gathering.rbac_group_name
        - microsoft_defender_endpoint.information_gathering.timestamp
        - microsoft_defender_endpoint.information_gathering.last_seen_time
      tag: remove_custom_duplicate_fields
      ignore_missing: true
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true
  - script:
      description: This script processor iterates over the whole document to remove fields with null values.
      tag: script_to_drop_null_values
      lang: painless
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_error_message_e0c9bd63
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
