title: Collect Microsoft Defender for Endpoint information gathering assessment logs from API
type: logs
streams:
  - input: cel
    title: Microsoft Defender Endpoint Information Gathering Assessment
    description: Collect per-device TVM information gathering posture snapshots via InfoGatheringExport API.
    enabled: false
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: Duration between export polls. The API returns a full snapshot; polling more frequently may return duplicate state. Respects the 20 exports/hour rate limit. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 12h
      - name: sas_valid_hours
        type: integer
        title: SAS Valid Hours
        description: Hours that Azure Blob download URLs remain valid (1-6). Increase for large tenants with many RBAC shards.
        multi: false
        required: true
        show_user: true
        default: 1
      - name: max_retries
        type: integer
        title: Max Retries
        description: Retries per export file URL on empty response or decode failure before skipping.
        multi: false
        required: true
        show_user: false
        default: 3
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        multi: false
        default: false
        required: false
        show_user: false
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field event.original.
        multi: false
        required: false
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data-stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - microsoft_defender_endpoint-information_gathering
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 30s
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
elasticsearch:
  index_template:
    mappings:
      subobjects: false
