- name: microsoft_defender_endpoint
  type: group
  fields:
    - name: information_gathering
      type: group
      fields:
        - name: last_seen
          type: date
          description: Last seen datetime of the device when the information gathering snapshot was collected.
        - name: rbac_group_id
          type: keyword
          description: Device group ID that this machine belongs to.
        - name: os_platform
          type: keyword
          description: Platform of the operating system running on the device.
        - name: device_gathered_info
          type: group
          description: Parsed antivirus and device health attributes from the DeviceGatheredInfo payload.
          fields:
            - name: av_engine_update_time
              type: date
              description: Datetime when the antivirus engine was last updated on the device.
            - name: av_engine_version
              type: keyword
              description: Antivirus engine version.
            - name: av_is_engine_up_to_date
              type: boolean
              description: Up-to-date status of the antivirus engine.
            - name: av_is_platform_up_to_date
              type: boolean
              description: Up-to-date status of the antivirus platform.
            - name: av_is_signature_up_to_date
              type: boolean
              description: Up-to-date status of the antivirus signature.
            - name: av_mode
              type: keyword
              description: Antivirus mode as a string-typed integer value ranging from 0 to 5.
            - name: av_platform_update_time
              type: date
              description: Datetime when the antivirus platform was last updated on the device.
            - name: av_platform_version
              type: keyword
              description: Antivirus platform version.
            - name: av_signature_publish_time
              type: date
              description: Datetime when the antivirus security intelligence build was released.
            - name: av_signature_update_time
              type: date
              description: Datetime when the antivirus security intelligence was last updated on the device.
            - name: av_signature_version
              type: keyword
              description: Antivirus security intelligence version.
            - name: ebpf_status
              type: keyword
              description: Indicates whether the eBPF-based sensor is enabled on Linux endpoints.
            - name: full_scan_result
              type: keyword
              description: Full scan result of the device.
            - name: quick_scan_result
              type: keyword
              description: Quick scan result of the device.
