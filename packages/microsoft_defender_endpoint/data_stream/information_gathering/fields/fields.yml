- name: microsoft_defender_endpoint
  type: group
  fields:
    - name: information_gathering
      type: group
      fields:
        - name: last_seen
          type: date
          description: Last seen datetime of the device when the information gathering snapshot was collected.
        - name: rbac_group_id
          type: keyword
          description: Device group ID that this machine belongs to.
        - name: os_platform
          type: keyword
          description: Platform of the operating system running on the device.
        - name: device_gathered_info
          type: group
          description: Parsed antivirus and device health attributes from the DeviceGatheredInfo payload.
          fields:
            - name: av_engine_publish_time
              type: date
              description: Datetime when the antivirus engine version was published.
            - name: av_engine_ring
              type: keyword
              description: Update ring of the antivirus engine.
            - name: av_engine_update_time
              type: date
              description: Datetime when the antivirus engine was last updated on the device.
            - name: av_engine_version
              type: keyword
              description: Antivirus engine version.
            - name: av_is_engine_up_to_date
              type: boolean
              description: Up-to-date status of the antivirus engine.
            - name: av_is_platform_up_to_date
              type: boolean
              description: Up-to-date status of the antivirus platform.
            - name: av_is_signature_up_to_date
              type: boolean
              description: Up-to-date status of the antivirus signature.
            - name: av_mode
              type: keyword
              description: Antivirus mode as a string-typed integer value ranging from 0 to 5.
            - name: av_mode_data_refresh_time
              type: date
              description: Datetime when the antivirus mode data was last refreshed.
            - name: av_platform_expiration_time
              type: date
              description: Datetime when the antivirus platform version expires.
            - name: av_platform_publish_time
              type: date
              description: Datetime when the antivirus platform version was published.
            - name: av_platform_ring
              type: keyword
              description: Update ring of the antivirus platform.
            - name: av_platform_update_time
              type: date
              description: Datetime when the antivirus platform was last updated on the device.
            - name: av_platform_version
              type: keyword
              description: Antivirus platform version.
            - name: av_scan_results
              type: keyword
              description: Antivirus scan results reported by the device.
            - name: av_signature_data_refresh_time
              type: date
              description: Datetime when the antivirus signature data was last refreshed.
            - name: av_signature_publish_time
              type: date
              description: Datetime when the antivirus security intelligence build was released.
            - name: av_signature_ring
              type: keyword
              description: Update ring of the antivirus signatures.
            - name: av_signature_update_time
              type: date
              description: Datetime when the antivirus security intelligence was last updated on the device.
            - name: av_signature_version
              type: keyword
              description: Antivirus security intelligence version.
            - name: bootiful_mind_status
              type: keyword
              description: Bootiful Mind scan status.
            - name: cloud_protection_state
              type: keyword
              description: Cloud-delivered protection state of the antivirus.
            - name: ebpf_status
              type: keyword
              description: Indicates whether the eBPF-based sensor is enabled on Linux endpoints.
            - name: full_scan_result
              type: keyword
              description: Full scan result of the device.
            - name: is_av_engine_loaded
              type: boolean
              description: Whether the antivirus engine is loaded.
            - name: local_cve_scanner_executed
              type: keyword
              description: Whether the local CVE scanner was executed.
            - name: log4j_cve_2021_44228
              type: keyword
              description: Log4j CVE-2021-44228 exposure status.
            - name: log4j_environment_variable_mitigation
              type: keyword
              description: Whether the Log4j environment variable mitigation is present.
            - name: log4j_local_scan_vulnerable
              type: keyword
              description: Result of the local Log4j vulnerability scan.
            - name: quick_scan_result
              type: keyword
              description: Quick scan result of the device.
            - name: spring4shell_cve_2022_22965
              type: keyword
              description: Spring4Shell CVE-2022-22965 exposure status.
            - name: wdavor_heartbeat_event_type
              type: keyword
              description: Type of the last Defender Antivirus heartbeat event.
