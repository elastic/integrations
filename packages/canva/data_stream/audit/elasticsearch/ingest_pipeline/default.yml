---
description: Pipeline for processing audit logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_552e65e1
      target_field: json
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_04014d20
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: event.category
      tag: append_event_category_5a3d7c1d
      value: iam
      if: ctx.json?.action?.type != null && !( ctx.json.action.type.contains('APP') || ctx.json.action.type.contains('EXPORT') || ctx.json.action.type.contains('DESIGN') )
  - script:
      description: Append action type values to the event type.
      tag: script_to_append_event_type_7360d28a
      lang: painless
      if: ctx.json?.action?.type != null
      source: >-
        def eventType = new ArrayList();
        if (ctx.event.type != null) {
          eventType = ctx.event.type;
        }
        def val = ctx.json.action.type;
        if (val.toLowerCase().contains('remove') || val.toLowerCase().contains('delete')) {
          eventType.add('deletion');
        } else if (val.toLowerCase().contains('update') || val.toLowerCase().contains('change')) {
          eventType.add('change');
        } else if (val.toLowerCase().contains('create') || val.toLowerCase().contains('add')) {
          eventType.add('creation');
        } else if (val.toLowerCase().contains('user')) {
          eventType.add('user');
        } else if (val.toLowerCase().contains('group')) {
          eventType.add('group');
        } else {
          eventType.add('info');
        }
        ctx.event.put('type', eventType);
      on_failure:
        - append:
            tag: append_error_message_7a8062a9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.action.app_id
      tag: rename_action_app_id_12fd88c4
      target_field: canva.audit.action.app.id
      ignore_missing: true
  - rename:
