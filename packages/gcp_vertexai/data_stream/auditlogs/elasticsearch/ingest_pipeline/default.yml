---
description: Pipeline for Google Cloud Vertex AI Audit logs

processors:
  - set:
      tag: set_ecs_version_0ed44c5b
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_event_kind_9abbe1e3
      field: event.kind
      value: event
  - set:
      tag: set_cloud_provider_98dba483
      field: cloud.provider
      value: gcp
  - rename:
      tag: rename_message_525212cf
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_53de6912
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_5215b077
      field: event.original
      target_field: json
  - rename:
      tag: rename_json_protoPayload_type_c15056df
      field: json.protoPayload.@type
      target_field: gcp.vertexai.audit.type
      ignore_missing: true
  - drop:
      tag: drop_53e82786
      description: Drop the document if it is not of AuditLog type
      if: ctx.gcp?.vertexai?.audit?.type != null && ctx.gcp?.vertexai?.audit?.type != 'type.googleapis.com/google.cloud.audit.AuditLog'
  - set:
      tag: set_event_id_3c7ed71d
      field: event.id
      copy_from: json.insertId
      if: ctx.json?.insertId != null
  - rename:
      tag: rename_json_logName_2c7f6aba
      field: json.logName
      target_field: log.logger
      ignore_missing: true
  - rename:
      tag: rename_json_severity_faaaf53c
      field: json.severity
      target_field: log.level
      ignore_missing: true
  - date:
      tag: date_json_timestamp_d33e7b12
      field: json.timestamp
      timezone: UTC
      formats:
        - ISO8601
  - rename:
      tag: rename_json_resource_labels_project_id_14fbf301
      field: json.resource.labels.project_id
      target_field: cloud.project.id
      override: true
      if: ctx.json?.resource?.labels?.project_id != null
  - rename:
      tag: rename_json_resource_labels_instance_id_b2f4797c
      field: json.resource.labels.instance_id
      target_field: cloud.instance.id
      override: true
      if: ctx.json?.resource?.labels?.instance_id != null
  - rename:
      tag: rename_json_resource_type_a4e494cc
      field: json.resource.type
      target_field: gcp.vertexai.audit.resource_type
      if: ctx.json?.resource?.type != null
