  - rename:
      tag: rename_json_protoPayload_methodName_560bdd68
      field: json.protoPayload.methodName
      target_field: event.action
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_protoPayload_resourceName_b6ed34c7
      field: json.protoPayload.resourceName
