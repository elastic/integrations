---
description: Pipeline for processing VNet logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_event_category_2c621924
      value: network
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_a75e9a8a
      value: info
      allow_duplicates: false
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_552e65e1
      target_field: json
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_04014d20
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.time
      tag: date_time_ea8afaf9
      target_field: azure_network_watcher_vnet.log.time
      formats:
        - ISO8601
      if: ctx.json?.time != null && ctx.json.time != ''
      on_failure:
        - append:
            tag: append_error_message_3f5d90ed
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_timestamp_27d40682
      copy_from: azure_network_watcher_vnet.log.time
      ignore_empty_value: true
  - convert:
      field: json.flowLogVersion
      tag: convert_flowLogVersion_to_string_29a6e249
      type: string
      ignore_missing: true
  - rename:
      field: json.flowLogVersion
      tag: rename_flowLogVersion_f466dd68
      target_field: azure_network_watcher_vnet.log.flow_log.version
      ignore_missing: true
  - rename:
      field: json.flowLogGUID
      tag: rename_flowLogGUID_cc8f4b01
      target_field: azure_network_watcher_vnet.log.flow_log.guid
      ignore_missing: true
  - rename:
      field: json.flowLogResourceID
      tag: rename_flowLogResourceID_6bc38f77
      target_field: azure_network_watcher_vnet.log.flow_log.resource_id
      ignore_missing: true
  - rename:
      field: json.category
      tag: rename_category_4d38f3a3
      target_field: azure_network_watcher_vnet.log.category
      ignore_missing: true
  - rename:
      field: json.targetResourceID
      tag: rename_targetResourceID_39493b55
      target_field: azure_network_watcher_vnet.log.target_resource_id
      ignore_missing: true
  - rename:
      field: json.operationName
      tag: rename_operationName_8a215de7
      target_field: azure_network_watcher_vnet.log.operation_name
      ignore_missing: true
  - foreach:
      field: json.flowRecords.flows
      if: ctx.json?.flowRecords?.flows instanceof List
      tag: foreach_flowRecords_flow_to_rename_aclID_90470be5
      processor:
        rename:
          field: _ingest._value.aclID
          tag: rename_aclID_43d72e91
          target_field: _ingest._value.acl_id
          ignore_missing: true
  - uppercase:
      field: json.macAddress
      tag: uppercase_mac_address_da3a589c
      ignore_missing: true
      if: ctx.json?.macAddress != null && ctx.json.macAddress != ''
      target_field: azure_network_watcher_vnet.log.mac_address
  - gsub:
      field: azure_network_watcher_vnet.log.mac_address
      if: ctx.azure_network_watcher_vnet?.log?.mac_address != null && ctx.azure_network_watcher_vnet.log.mac_address!= ''
