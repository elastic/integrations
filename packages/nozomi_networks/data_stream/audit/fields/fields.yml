- name: nozomi_networks
  type: group
  fields:
    - name: audit
      type: group
      fields:
        - name: appliance_host
          type: keyword
          description: The hostname of the appliance where this entity has been observed
        - name: appliance_id
          type: keyword
          description: The id of the appliance where this entity has been observed
        - name: appliance_ip
          type: ip
          description: The ip of the appliance that triggered the event
        - name: replicated
          type: boolean
          description: This is true if the record has been replicated on the replica machine
        - name: synchronized
          type: boolean
          description: True if this entity has been synchronized with the upper CMC or Vantage
        - name: action
          type: keyword
        - name: browser
          type: keyword
        - name: controller
          type: keyword
        - name: details
          type: keyword
        - name: event
          type: keyword
        - name: id
          type: keyword
        - name: ip_address
          type: ip
        - name: name
          type: keyword
        - name: record_created_at
          type: date
        - name: time
          type: date
        - name: username
          type: keyword
