rules:
  # JSON-RPC application error returned with HTTP 200.
  - path: /v1.0/jsonrpc/phasr
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
      X-Api-Key:
        - "test-service-key"
    request_body: /.*"method":"getPhasrRecommendations".*"companyId":"eeeeeeeeeeeeeeeeeeeeeeee".*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"phasr-recommendations","jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization error","data":{"details":"Synthetic application error"}}}'
  # HTTP server error handling.
  - path: /v1.0/jsonrpc/phasr
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
      X-Api-Key:
        - "test-service-key"
    request_body: /.*"method":"getPhasrRecommendations".*"companyId":"dddddddddddddddddddddddd".*/
    responses:
      - status_code: 500
        headers:
          Content-Type:
            - "application/json"
        body: '{"error":"Synthetic server error"}'
  # HTTP 429 handling. Retry-After mirrors the vendor response contract.
  - path: /v1.0/jsonrpc/phasr
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
      X-Api-Key:
        - "test-service-key"
    request_body: /.*"method":"getPhasrRecommendations".*"companyId":"ffffffffffffffffffffffff".*/
    responses:
      - status_code: 429
        headers:
          Content-Type:
            - "application/json"
          Retry-After:
            - "12"
        body: '{"id":"phasr-recommendations","jsonrpc":"2.0","error":{"code":-32003,"message":"Too many requests","data":{"details":"Synthetic rate limit"}}}'
  # Service-key full snapshot: recommendations page 1 of 3.
