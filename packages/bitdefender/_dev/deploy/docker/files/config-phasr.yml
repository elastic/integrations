      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
      X-Api-Key:
        - "test-service-key"
    request_body: /.*"method":"getPhasrRecommendations".*"companyId":"5e4d3c2b1a0987654321fedc".*"page":1.*"perPage":100.*/
