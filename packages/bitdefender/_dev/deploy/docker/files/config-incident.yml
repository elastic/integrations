rules:
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsList".*"companyId":"dddddddddddddddddddddddd".*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"incident-list","jsonrpc":"2.0","result":null}'
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsByIds".*"ids":\["65f04c2e1234567890abc999"\].*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"incident-details","jsonrpc":"2.0","result":{"unexpected":true}}'
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsList".*"companyId":"eeeeeeeeeeeeeeeeeeeeeeee".*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"incident-list","jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization error","data":{"details":"Synthetic application error"}}}'
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsList".*"companyId":"ffffffffffffffffffffffff".*/
    responses:
      - status_code: 429
        headers:
          Content-Type:
            - "application/json"
          Retry-After:
            - "1"
        body: '{"id":"incident-list","jsonrpc":"2.0","error":{"code":-32003,"message":"Too many requests","data":{"details":"Synthetic rate limit"}}}'
  # Mito-only no-cap regression: 101 empty API-reported pages must be
  # exhausted before page 102 is fetched and its pending detail is resolved.
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsByIds".*"ids":\["65f04c2e1234567890abc010"\].*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"incident-details","jsonrpc":"2.0","result":[{"incidentId":"65f04c2e1234567890abc010","incidentNumber":116,"status":"open","lastIncidentChange":"2026-11-02T13:03:00Z","severityScore":50,"priority":"medium","company":{"id":"cccccccccccccccccccccccc","name":"Example Corp"},"incidentType":"incident","details":{"detectionName":"Synthetic no-cap incident","alerts":[],"nodes":[]},"notes":[]}]}'
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsList".*"companyId":"cccccccccccccccccccccccc".*"page":102,.*/
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"incident-list","jsonrpc":"2.0","result":{"total":1,"page":102,"perPage":100,"pagesCount":102,"items":[{"incidentId":"65f04c2e1234567890abc010","lastIncidentChange":"2026-11-02T13:03:00Z"}]}}'
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
    request_headers:
      Accept:
        - "application/json"
      Content-Type:
        - "application/json"
    request_body: /.*"method":"getIncidentsList".*"companyId":"cccccccccccccccccccccccc".*"page":(?:[1-9]|[1-9][0-9]|10[01]),.*/
