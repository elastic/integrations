      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"id":"incident-list","jsonrpc":"2.0","result":{"total":1,"page":1,"perPage":100,"pagesCount":102,"items":[]}}'
  - path: /v1.2/jsonrpc/incidents
    methods: ["POST"]
