---
description: Pipeline for BitDefender push notification stats
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - fail:
      tag: data_collection_error_f182b264
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      message: error message set and no data to process.
  - json:
      tag: json_message_to_json_beeea2b2
      field: message
      target_field: json
  - fail:
      tag: fail_missing_json_object_input_document_d1247e5f
      if: ctx.json == null || !(ctx.json instanceof Map)
      message: missing json object in input document
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - rename:
      tag: rename_json_result_to_bitdefender_push_stats_6c52dda8
      field: json.result
      target_field: bitdefender.push.stats
      ignore_missing: true
  - rename:
      tag: rename_json_id_to_bitdefender_id_41342ea4
      field: json.id
      target_field: bitdefender.id
      ignore_missing: true
  - remove:
      tag: remove_53427922
      field:
        - message
        - json
        - bitdefender.push.stats.lastUpdateTime
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
