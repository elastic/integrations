    target_field: bitdefender.id
    if: ctx._tmp?.bitdefender_id != null && ctx._tmp.bitdefender_id != ""

- rename:
    tag: rename_message_to_event_original_56a77271
    field: message
    target_field: event.original
    ignore_missing: true
    if: ctx.event?.original == null
    
- remove:
    field: message
    tag: remove_message
    ignore_missing: true
    if: ctx.event?.original != null
