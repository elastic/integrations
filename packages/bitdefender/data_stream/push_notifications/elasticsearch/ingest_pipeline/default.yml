---
description: Processes HTTP JSON events from BitDefender
processors:

- set:
    tag: set_ecs_version_0f7334bb
    field: ecs.version
    value: '8.11.0'

- json:
    tag: json_message_to_bitdefender_event_07d69b72
    field: message
    target_field: bitdefender.event
    if: ctx.json == null && ctx.message != null && ctx.message != ""

- rename:
    tag: rename_json_to_bitdefender_event_d282257f
    description: "qradar/plain NDJSON parsed event"
    field: json
    target_field: bitdefender.event
    if: ctx.json != null && ctx.json.event == null

- rename:
    tag: rename_json_event_to_bitdefender_event_eff4d6cc
    description: "jsonRPC or Splunk HEC format parsed event"
    field: json.event
    target_field: bitdefender.event
    if: ctx.json?.event != null

# Extract fields from jsonRPC message root
- rename:
    tag: rename_json_jsonrpc_version_to_bitdefender_event_jsonrpc_version_d591d339
