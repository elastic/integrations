title: BitDefender GravityZone Quarantine
type: logs
streams:
  - input: cel
    template_path: cel.yml.hbs
    title: BitDefender GravityZone Quarantine
    description: Collect computer quarantine items from the GravityZone Public API.
    enabled: false
    vars:
      - name: interval
        type: text
        title: Polling Interval
        description: Duration between polling cycles to the GravityZone Quarantine API. Supported units for this parameter are h/m/s.
        required: true
        show_user: true
        default: 15m
      - name: initial_interval
        type: text
        title: Initial Interval
        description: How far back to collect newly quarantined computer items on the first run. Supported units for this parameter are h/m/s.
        required: true
        show_user: true
        default: 24h
      - name: collection_delay
        type: text
        title: Collection Delay
        description: Safety margin subtracted from the upper bound of each polling window so late-indexed quarantine items are not missed. Supported units for this parameter are h/m/s.
        required: true
        show_user: true
        default: 1m
      - name: page_size
        type: integer
        title: Page Size
        description: Number of quarantine items requested per page. The API supports values from 1 through 100.
        required: true
        show_user: false
        default: 100
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before an HTTP request is declared timed out. Supported units for this parameter are h/m/s.
        required: false
        show_user: false
        default: 60s
      - name: proxy_url
        type: url
        title: Proxy URL
        description: HTTP proxy URL used for outbound API requests.
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: SSL configuration options. See the Elastic Agent SSL configuration documentation for supported settings.
        required: false
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracer
        description: Enabling request tracing can expose sensitive request and response data and compromise security. Enable it only for debugging.
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve Original Event
        description: Preserve a raw copy of the original event in event.original.
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: Processors applied by Elastic Agent before events are sent to Elasticsearch.
        required: false
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false
