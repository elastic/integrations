wait_for_data_timeout: 1m
input: cel
service: bitdefender-account-mock
vars:
  public_api_url: http://{{Hostname}}:{{Port}}
  api_key: solo-personal-key
  auth_type: basic
  company_id: "111111111111111111111111"
data_stream:
  vars:
    interval: 30s
    page_size: 2
    http_client_timeout: 30s
    preserve_original_event: true
assert:
  hit_count: 1
