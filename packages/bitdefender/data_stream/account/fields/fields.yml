- name: bitdefender
  type: group
  description: Fields for BitDefender GravityZone related events.
  fields:
    - name: account
      type: group
      description: Fields returned by the GravityZone Accounts API.
      fields:
        - name: id
          type: keyword
          description: Stable GravityZone Control Center account identifier.
        - name: email
          type: keyword
          description: Email address used to sign in to the Control Center account.
        - name: userName
          type: keyword
          description: Account login name returned by GravityZone On-Premises deployments.
        - name: profile
          type: group
          fields:
            - name: fullName
              type: keyword
              description: Full name associated with the account.
            - name: language
              type: keyword
              description: Control Center interface language.
            - name: timezone
              type: keyword
              description: Account timezone.
            - name: landingPage
              type: keyword
              description: Default Control Center landing page.
        - name: phoneNumber
          type: group
          fields:
            - name: countryCode
              type: keyword
              description: Telephone country calling code.
            - name: subscriberNumber
              type: keyword
              description: Telephone subscriber number.
        - name: role
          type: long
          description: GravityZone account role code.
        - name: rights
          type: group
          description: Account permission flags.
          fields:
            - name: companyManager
              type: boolean
            - name: manageCompanies
              type: boolean
            - name: manageNetworks
              type: boolean
            - name: manageInventory
              type: boolean
            - name: managePoliciesRead
              type: boolean
            - name: managePoliciesWrite
              type: boolean
            - name: manageReports
              type: boolean
            - name: manageUsers
              type: boolean
            - name: manageRemoteShell
              type: boolean
            - name: manageMspTrialFeatures
              type: boolean
            - name: manageServiceAccounts
              type: boolean
        - name: targetIds
          type: keyword
          description: Inventory target identifiers assigned to the account.
        - name: hasOwnCompanyInTargets
          type: boolean
          description: Whether the account can manage its own top-level company.
        - name: passwordLifetime
          type: long
          description: Password expiration policy in days.
        - name: accountLockdown
          type: boolean
          description: Whether the account locks after repeated failed sign-in attempts.
        - name: twoFactorAuthenticationStatus
          type: boolean
          description: Whether two-factor authentication is enabled.
        - name: companyName
          type: keyword
          description: Name of the company to which the account belongs.
        - name: companyId
          type: keyword
          description: Identifier of the company to which the account belongs.
        - name: authenticationMethod
          type: long
          description: GravityZone account authentication method code.
