- name: bitdefender
  type: group
  description: Fields for BitDefender GravityZone related events.
  fields:
    - name: patch
      type: group
      description: Fields returned by the GravityZone Patch Management API.
      fields:
        - name: status
          type: keyword
          description: Collection context identifying the patch as missing or installed.
        - name: releaseDate
          type: date
          description: Date when the patch was released.
        - name: kbNumber
          type: keyword
          description: Vendor knowledge base article identifier.
        - name: vendorNames
          type: keyword
          description: Software vendors associated with the patch.
        - name: operatingSystem
          type: long
          description: Target operating system code. Values are 1 (Windows), 2 (Linux), and 3 (macOS).
        - name: type
          type: long
          description: Patch category code. Values are 0 (security), 1 (non-security), and 2 (manually approved).
