- name: bitdefender
  type: group
  description: Fields for BitDefender GravityZone related events.
  fields:
    - name: phasr
      type: group
      description: Fields returned by the GravityZone PHASR API.
      fields:
        - name: record_type
          type: keyword
          description: Collection context identifying a recommendation or monitored rule.
        - name: objectId
          type: keyword
          description: Stable GravityZone PHASR recommendation identifier.
        - name: ruleId
          type: long
          description: Identifier of the PHASR rule.
        - name: actionTaken
          type: long
          description: Recommendation action status code. Values are 0 (action needed), 1 (applied), and 2 (partially applied).
        - name: behavioralProfiles
          type: long
          description: Number of behavioral profiles to which the recommendation applies.
        - name: attackSurfaceReduction
          type: double
          description: Attack surface reduction score for the recommendation.
        - name: type
          type: long
          description: Recommendation type code. Values are 0 (allow access), 1 (restrict access), and 2 (allow access request).
        - name: createdOn
          type: date
          description: Time when the recommendation was created.
        - name: category
          type: keyword
          description: Behavioral category of the monitored rule.
        - name: name
          type: keyword
          description: Name of the monitored rule.
        - name: description
          type: match_only_text
          description: Description of the monitored rule and its trigger conditions.
        - name: lastTriggered
          type: long
          description: Unix epoch seconds when the monitored rule was last triggered.
        - name: latestUpdate
          type: long
          description: Unix epoch seconds when the monitored rule was last updated.
        - name: last_triggered
          type: date
          description: Time when the monitored rule was last triggered, converted from the vendor Unix timestamp.
        - name: latest_update
          type: date
          description: Time when the monitored rule was last updated, converted from the vendor Unix timestamp.
        - name: recommendations
          type: long
          description: Number of recommendations generated by the monitored rule.
        - name: ruleTriggers
          type: long
          description: Number of times the monitored rule was triggered.
        - name: profilesUsingSuchTools
          type: long
          description: Number of profiles exhibiting the monitored behavior.
        - name: profilesNotUsingSuchTools
          type: long
          description: Number of profiles not exhibiting the monitored behavior.
        - name: restrictedProfilesByAutopilot
          type: long
          description: Number of profiles restricted automatically by Autopilot.
        - name: restrictedProfilesByDirectControl
          type: long
          description: Number of profiles restricted manually by Direct Control.
