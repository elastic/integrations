format_version: "3.3.2"
name: bitdefender
title: "BitDefender"
version: "2.17.0"
source:
  license: "Elastic-2.0"
description: "Ingest BitDefender GravityZone events, incidents, entities, quarantine, and blocklist data"
type: integration
categories:
  - security
  # Added edr_xdr category as BitDefender GravityZone provides endpoint detection and response capabilities
  - edr_xdr
conditions:
  kibana:
    version: "^8.19.2 || ^9.0.5"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/bitdefender-dashboard-push-notifications.png
    title: Push Notifications Dashboard
    size: 600x600
    type: image/png
  - src: /img/bitdefender-dashboard-push-config-and-stats.png
    title: Push Notification Configuration & Statistics Dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/bitdefender_gravityzone.svg
    title: BitDefender GravityZone
    size: 64x64
    type: image/svg+xml
policy_templates:
  - name: bitdefender_gravityzone
    title: BitDefender GravityZone
    description: Collect push notification events and Public API data from BitDefender GravityZone
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: ga
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: http_endpoint
        title: Receive Push Notifications Events
        description: "Receives push notifications as JSON via HTTP POST"
        vars:
          - name: push_notification_configuration_id
            type: text
            title: BitDefender GravityZone Push Notification ID
            description: Used locally to tie together all push notification elements
            show_user: true
            required: true
            default: 1
          - name: tenants
            type: text
            multi: true
            title: Company ID to company name mapping
            required: true
            show_user: true
            default:
              - "623c18fb12fb8700396d6375: test_events"
      - type: cel
        title: Poll Push Notification Information
        description: Collects BitDefender GravityZone Push Notification Configuration State & Statistics
        vars:
          - name: push_notification_configuration_id
            type: text
            title: BitDefender GravityZone Push Notification ID
            description: Used locally to tie together all push notification elements
            show_user: true
            required: true
            default: 1
          - name: url
            type: text
            title: URL of BitDefender GravityZone API push endpoint
            description: i.e. scheme://host:port/path
            show_user: true
            required: true
            default: https://cloud.gravityzone.bitdefender.com/api/v1.0/jsonrpc/push
          - name: public_api_url
            type: text
            title: BitDefender GravityZone Public API Access URL
            description: Exact tenant-specific Control Center API Access URL ending in /api, copied from the account menu under Control Center API.
            show_user: true
            required: true
            default: https://cloud.gravityzone.bitdefender.com/api
          - name: api_key
            type: password
            title: BitDefender GravityZone API Key
            description: Personal API key or Service API key. Push data streams require a Personal API key.
            show_user: true
            required: true
            secret: true
          - name: auth_type
            type: text
            title: Public API Authentication Type
            description: Use x_api_key for a Service API key or basic for a Personal API key.
            show_user: true
            required: true
            default: x_api_key
          - name: company_id
            type: text
            title: Company ID
            description: Optional managed company ID for partner or MSP Public API collection.
            show_user: true
            required: false
owner:
  github: elastic/security-service-integrations
  type: elastic
