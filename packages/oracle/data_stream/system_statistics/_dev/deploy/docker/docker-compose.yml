version: '2.3'
services:
  oracle:
    image: docker.elastic.co/observability-ci/database-enterprise:12.2.0.1
    ports:
      - 127.0.0.1:1521:1521
      - 127.0.0.1:5500:5500
    # `sqlplus -s` exits 0 even when the logon fails, so the previous probe
    # reported the service as healthy as soon as the sqlplus binary existed,
    # long before the database and the listener were up. `-L` (single logon
    # attempt) plus `WHENEVER SQLERROR EXIT FAILURE` make the probe exit
    # non-zero until the database really accepts connections and can run a
    # query. elastic-package waits at most 10 minutes for a service container
    # to become healthy (waitForHealthyTimeout, not configurable), so
    # start_period/retries are sized to that ceiling. If the database needs
    # longer than that to configure itself, the test now fails with "timeout
    # waiting for healthy container" instead of running against a database
    # that is not up yet.
    healthcheck:
      test:
        - CMD
        - bash
        - "-c"
        - >-
          printf 'WHENEVER SQLERROR EXIT FAILURE\nselect 1 from dual;\nexit\n' | ORACLE_HOME=/u01/app/oracle/product/12.2.0/dbhome_1/ /u01/app/oracle/product/12.2.0/dbhome_1/bin/sqlplus -L -s sys/Oradoc_db1@oracle:1521/ORCLCDB.localdomain as sysdba
      interval: 15s
      timeout: 30s
      retries: 40
      start_period: 600s
