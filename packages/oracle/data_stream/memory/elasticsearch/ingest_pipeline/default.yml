---
description: Pipeline for processing Oracle Program Global Area and System Global Area metrics
processors:
    - remove:
        tag: remove_sql_driver_5ea27fd8
        field: sql.driver
        ignore_missing: true
        ignore_failure: true
    - remove:
        tag: remove_sql_query_4e9fb160
        field: sql.query
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_sql_3216a03f
        field: sql
        target_field: oracle
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_metrics_5012b7b1
        field: oracle.metrics
        target_field: oracle.memory
        ignore_missing: true
    - foreach:
        tag: foreach_oracle_memory_412bf185
        field: oracle.memory
        ignore_missing: true
        processor: 
            gsub:
                field: "_ingest._key"
                pattern: " "
                replacement: "_"
    - rename:
        tag: rename_oracle_memory_cache_hit_percentage_eab010ae
        field: oracle.memory.cache_hit_percentage
        target_field: oracle.memory.pga.cache_hit_pct
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_aggregate_pga_auto_target_52abc311
        field: oracle.memory.aggregate_pga_auto_target
        target_field: oracle.memory.pga.aggregate_auto_target
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_aggregate_pga_target_parameter_d53cfa8b
        field: oracle.memory.aggregate_pga_target_parameter
        target_field: oracle.memory.pga.aggregate_target_parameter
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_total_pga_allocated_f1a6b8b7
        field: oracle.memory.total_pga_allocated
        target_field: oracle.memory.pga.total_allocated
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_total_pga_used_for_auto_workareas_5c58ed55
        field: oracle.memory.total_pga_used_for_auto_workareas
        target_field: oracle.memory.pga.total_used_for_auto_workareas
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_global_memory_bound_76c2e41d
        field: oracle.memory.global_memory_bound
        target_field: oracle.memory.pga.global_memory_bound
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_total_pga_inuse_ff9e8dee
        field: oracle.memory.total_pga_inuse
        target_field: oracle.memory.pga.total_inuse
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_total_freeable_pga_memory_b4fbcc17
        field: oracle.memory.total_freeable_pga_memory
        target_field: oracle.memory.pga.total_freeable_memory
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_maximum_pga_allocated_70cf2166
        field: oracle.memory.maximum_pga_allocated
        target_field: oracle.memory.pga.maximum_allocated
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_sga_total_memory_b28643a0
        field: oracle.memory.sga_total_memory
        target_field: oracle.memory.sga.total_memory
        ignore_missing: true
        ignore_failure: true
    - rename:
        tag: rename_oracle_memory_sga_free_memory_c19cb6f0
        field: oracle.memory.sga_free_memory
        target_field: oracle.memory.sga.free_memory
        ignore_missing: true
        ignore_failure: true

on_failure:
  - set:
      tag: set_event_kind_49943747
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_71ec90c2
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
