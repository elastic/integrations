  #
  # Save only interesting fields under extra_fields and ca_properties
  # to prevent mapping explosion. Keep the rest under .other (type flattened).
  #
  - script:
      tag: script_map_interesting_fields_from_ca_properties_and_extra_details_06543b52
      lang: painless
      description: Map interesting fields from ca_properties and extra_details.
      params:
        ca_properties:
          - address
          - cpm_disabled
          - cpm_error_details
          - cpm_status
          - creation_method
          - customer
          - database
          - device_type
          - dual_account_status
          - group_name
          - in_process
          - index
          - last_fail_date
