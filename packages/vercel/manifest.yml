format_version: "3.6.2"
name: vercel
title: "Vercel"
version: 0.1.1
description: >-
  Send Vercel logs, audit logs, Web Analytics, and Speed Insights to Elastic
  with Vercel Drains and the Elastic Cloud managed OpenTelemetry endpoint.
type: integration
categories:
  - observability
  - monitoring
  - cloud
  - web
  - opentelemetry
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: basic
icons:
  - src: /img/vercel-logo.svg
    title: Vercel OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
