- name: backstage
  type: group
  fields:
    - name: log
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
      description: >-
        Backstage application fields without an explicit ECS or backstage mapping. Common fields such as message, service, level, timestamps, tracing, HTTP requests, URLs, and user agents are promoted to their ECS fields.
    - name: is_audit_event
      type: boolean
      description: Indicates that the record was emitted by Backstage's auditor service.
    - name: severity_level
      type: keyword
      description: The severity level of the audit log registered by Backstage.
    - name: action_type
      type: keyword
      description: The Backstage catalog action type for the event (e.g. "get", "ancestry", "create", "execution", "stream").
    - name: meta
      type: text
      description: >-
        Serialized dump of any Backstage plugin metadata that did not match a known, explicitly-mapped field. Intended to be empty for all currently-known event shapes; exists only as a forward-compatible safety net for future Backstage plugin metadata. Well-known keys are promoted to explicit `backstage.*` fields instead of living here.
    - name: entity
      type: group
      fields:
        - name: ref
          type: keyword
          description: The Backstage catalog entity reference the audit event operated on.
        - name: refs
          type: keyword
          description: The Backstage catalog entity references returned by a batch entity lookup.
        - name: root_ref
          type: keyword
          description: The root entity reference for a Backstage catalog ancestry lookup.
    - name: total_items
      type: long
      description: The total number of items available for a paginated Backstage catalog query.
    - name: ancestry
      type: group
      description: >-
        The Backstage catalog ancestry chain, preserving Backstage's native field casing (`entityRef`/`parentEntityRefs`) rather than this package's usual snake_case convention.
      fields:
        - name: entityRef
          type: keyword
          description: The entity reference for one node in a Backstage catalog ancestry chain.
        - name: parentEntityRefs
          type: keyword
          description: The parent entity references for one node in a Backstage catalog ancestry chain.
    - name: task
      type: group
      fields:
        - name: id
          type: keyword
          description: The identifier of the Backstage scaffolder task.
        - name: created_by
          type: keyword
          description: The Backstage identity that created the scaffolder task.
        - name: parameters
          type: text
          description: >-
            The scaffolder task's input parameters, serialized as text. Shape varies per Backstage software template and is not mapped to structured fields.
    - name: template
      type: group
      fields:
        - name: ref
          type: keyword
          description: The Backstage scaffolder template reference associated with the task.
    - name: query
      type: group
      fields:
        - name: fields
          type: keyword
          description: The entity fields requested by the catalog query.
        - name: type
          type: keyword
          description: The type of catalog query that was issued (e.g. "all").
        - name: filter
          type: text
          normalize:
            - array
          description: >-
            The raw catalog query filter condition(s), as Backstage's `key=value` comma-separated filter syntax (e.g. "kind=Resource,spec.type=github-repository"). Stored verbatim rather than parsed into structured sub-fields; there is no confirmed customer need yet for querying/aggregating on individual filter keys. Revisit with structured `backstage.query.filter.*` sub-fields if that need materializes.
