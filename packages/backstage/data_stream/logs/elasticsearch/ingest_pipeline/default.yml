---
description: Pipeline for backstage logs
processors:
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_to_event_original
      ignore_missing: true
      if: ctx.event?.original == null
      description: >-
        Preserves the original log line in event.original.
        The event.original field is not touched if the document already has one.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: Removes the raw message once event.original holds the original log line.
  - json:
      field: event.original
      target_field: json
      tag: parse_event_original_json
      if: ctx.event?.original != null
      description: >-
        Parses the original log line into the json scratch field, used to read
        isAuditEvent for the audit dispatch below.
  - pipeline:
      name: '{{ IngestPipeline "common" }}'
      tag: execute_common_pipeline
      if: ctx.json != null
      description: >-
        Applies ECS mappings shared by Backstage audit and application logs
        before dispatching to their format-specific pipelines.
  - pipeline:
      name: '{{ IngestPipeline "audit" }}'
      if: ctx.json?.isAuditEvent == true
      tag: execute_audit_pipeline
      description: >-
        Triggers the audit ingest pipeline for messages that contain isAuditEvent: true
  - pipeline:
      name: '{{ IngestPipeline "application" }}'
      tag: execute_application_pipeline
      if: ctx.json != null && ctx.json.isAuditEvent != true
      description: >-
        Processes Backstage application logs that are not audit events.
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Pipeline '{{{ _ingest.pipeline }}}' failed at processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
