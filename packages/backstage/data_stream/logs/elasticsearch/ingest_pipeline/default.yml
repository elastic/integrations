---
description: Pipeline for backstage logs
processors:
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_to_event_original
      ignore_missing: true
      if: ctx.event?.original == null
      description: >-
        Preserves the original log line in event.original.
        The event.original field is not touched if the document already has one.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: Removes the raw message once event.original holds the original log line.
  - json:
      field: event.original
      target_field: json
      tag: parse_event_original_json
      if: ctx.event?.original != null
      description: >-
        Parses the original log line into the json scratch field, used to read
        isAuditEvent for the audit dispatch below.
  - pipeline:
      name: '{{ IngestPipeline "audit" }}'
      if: ctx.json?.isAuditEvent == true
      tag: execute_audit_pipeline
      description: >-
        Triggers the audit ingest pipeline for messages that contain isAuditEvent: true
  # The processors below handle Backstage application logs (records without an
  # isAuditEvent key, i.e. non-audit). Audit logs have already been routed to the
  # audit pipeline (which removes json), so these only run for records still
  # carrying the parsed json scratch object.
  - set:
      field: ecs.version
      tag: set_ecs_version_non_audit
      value: "9.4.0"
      if: ctx.json != null && ctx.json.isAuditEvent == null
      description: Sets the ECS version for Backstage application logs.
  - set:
      field: event.kind
      tag: set_event_kind_non_audit
      value: event
      if: ctx.json != null && ctx.json.isAuditEvent == null
      description: Sets event.kind to event for Backstage application logs.
  - rename:
      field: json
      target_field: backstage.log
      tag: rename_non_audit_json_to_backstage_log
      ignore_missing: true
      if: ctx.json != null && ctx.json.isAuditEvent == null
      description: >-
        Moves the parsed Backstage application log fields under the backstage.log
        namespace, retained as keywords without detailed ECS mapping.
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Pipeline '{{{ _ingest.pipeline }}}' failed at processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
