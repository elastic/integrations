---
description: Pipeline for Backstage application logs
processors:
  - rename:
      field: json.httpVersion
      target_field: http.version
      ignore_missing: true
      tag: rename_application_http_version
      description: Maps the application HTTP version to ECS http.version.
  - rename:
      field: json.status
      target_field: http.response.status_code
      ignore_missing: true
      tag: rename_application_http_status
      description: Maps the application HTTP status to ECS http.response.status_code.
  - convert:
      field: http.response.status_code
      type: long
      ignore_missing: true
      tag: convert_application_http_status
      description: Ensures the application HTTP status is numeric.
  - rename:
      field: json.contentLength
      target_field: http.response.body.bytes
      ignore_missing: true
      tag: rename_application_content_length
      description: Maps the application response length to ECS http.response.body.bytes.
  - convert:
      field: http.response.body.bytes
      type: long
      ignore_missing: true
      tag: convert_application_content_length
      description: Ensures the application response length is numeric.
  - append:
      field: event.category
      value: web
      allow_duplicates: false
      tag: append_application_event_category_web
      if: ctx.http?.request?.method != null
      description: Categorizes HTTP application logs as web events.
  - append:
      field: event.type
      value: access
      allow_duplicates: false
      tag: append_application_event_type_access
      if: ctx.http?.request?.method != null
      description: Categorizes HTTP application logs as access events.
  - set:
      field: event.outcome
      value: success
      tag: set_application_event_outcome_success
      if: ctx.http?.response?.status_code != null && ctx.http.response.status_code < 400
      description: Sets a successful outcome for HTTP responses below 400.
  - set:
      field: event.outcome
      value: failure
      tag: set_application_event_outcome_failure
      if: ctx.http?.response?.status_code != null && ctx.http.response.status_code >= 400
      description: Sets a failed outcome for HTTP responses at or above 400.
  - rename:
      field: json
      target_field: backstage.log
      ignore_missing: true
      tag: rename_application_json_to_backstage_log
      if: ctx.json != null && !ctx.json.isEmpty()
      description: Moves unmapped Backstage application fields under backstage.log.
  - remove:
      field: json
      ignore_missing: true
      tag: remove_empty_application_json
      if: ctx.json != null && ctx.json.isEmpty()
      description: Removes the empty parsed JSON container when all fields were promoted to ECS.
on_failure:
  - append:
      field: error.message
      tag: append_application_pipeline_error_message
      value: >-
        Pipeline '{{{ _ingest.pipeline }}}' failed at processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_application_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_application_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
