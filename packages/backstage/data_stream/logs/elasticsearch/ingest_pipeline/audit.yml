---
description: Pipeline for backstage audit logs
processors:
  - append:
      tag: append_event_category_api
      field: event.category
      value: api
      allow_duplicates: false
      description: Sets `event.category` to `api` for Backstage audit events.
  - append:
      tag: append_event_type_access
      field: event.type
      value: access
      allow_duplicates: false
      description: Sets `event.type` to `access` when the audit event includes request details.
      if: ctx.json?.request != null
  - append:
      tag: append_event_type_start
      field: event.type
      value: start
      allow_duplicates: false
      description: Sets `event.type` to `start` for initiated Backstage audit operations.
      if: 'ctx.json?.status == "initiated"'
  - append:
      tag: append_event_type_end
      field: event.type
      value: end
      allow_duplicates: false
      description: Sets `event.type` to `end` for completed Backstage audit operations.
      if: 'ctx.json?.status == "succeeded" || ctx.json?.status == "failed"'
  - set:
      tag: set_event_outcome_unknown
      field: event.outcome
      value: unknown
      description: Sets `event.outcome` to `unknown` while a Backstage audit operation is initiated.
      if: 'ctx.json?.status == "initiated"'
  - set:
      tag: set_event_outcome_success
      field: event.outcome
      value: success
      description: Sets `event.outcome` to `success` for succeeded Backstage audit operations.
      if: 'ctx.json?.status == "succeeded"'
  - set:
      tag: set_event_outcome_failure
      field: event.outcome
      value: failure
      description: Sets `event.outcome` to `failure` for failed Backstage audit operations.
      if: 'ctx.json?.status == "failed"'
  - rename:
      field: json.severityLevel
      target_field: backstage.severity_level
      ignore_missing: true
      tag: rename_audit_severity_level
      description: Sets the custom vendor field `backstage.severity_level` that defines the audit log's severity level.
  - set:
      tag: set_event_severity_0113ff8d
      field: event.severity
      value: 3
      description: Sets `event.severity` to 3 when the audit log's severity level is `low`.
      if: 'ctx.backstage?.severity_level == "low"'
  - set:
      tag: set_event_severity_0716ffd2
      field: event.severity
      value: 5
      description: Sets `event.severity` to 5 when the audit log's severity level is `medium`.
      if: 'ctx.backstage?.severity_level == "medium"'
  - set:
      tag: set_event_severity_f5f4e875
      field: event.severity
      value: 7
      description: Sets `event.severity` to 7 when the audit log's severity level is `high`.
      if: 'ctx.backstage?.severity_level == "high"'
  - set:
      tag: set_event_action
      field: event.action
      value: "{{{json.eventId}}}:{{{json.status}}}"
      description: Builds `event.action` from the stable Backstage event ID and status.
      if: ctx.json?.eventId != null && ctx.json?.status != null
  - rename:
      field: json.plugin
      target_field: event.provider
      ignore_missing: true
      tag: rename_json_plugin_to_event_provider
      description: Maps the Backstage plugin where the event originated from to the ECS `event.provider` field.
  - rename:
      field: json.eventId
      target_field: event.code
      ignore_missing: true
      tag: rename_eventId
      description: >-
        Maps the Backstage `json.eventId` to `event.code`. In Backstage, `eventId` represents a logical
        group of related operations (e.g., `entity-fetch`, `location-mutate`), used here as the event
        identification code per ECS conventions.
  - rename:
      field: json.name
      target_field: error.type
      ignore_missing: true
      tag: rename_error_type
      description: Maps the error class name present on failed Backstage operations (e.g. `NotFoundError`) to the ECS `error.type` field.
  - rename:
      field: json.stack
      target_field: error.stack_trace
      ignore_missing: true
      tag: rename_error_stack_trace
      description: Maps the stack trace present on failed Backstage operations to the ECS `error.stack_trace` field.
  - rename:
      field: json.actor.actorId
      target_field: user.id
      ignore_missing: true
      tag: rename_actor_actorId
      description: Maps the Backstage actor identifier to `user.id`. In Backstage, `actorId` is the unique identity of the principal who triggered the audit event (e.g., a user ref or service account).
  - append:
      field: related.user
      value: "{{{user.id}}}"
      allow_duplicates: false
      tag: append_actor_id_related_user
      description: Appends the Backstage actor identifier to `related.user` to support correlation across all user-related fields.
      if: ctx.user?.id != null
  - append:
      field: related.hosts
      value: "{{{json.actor.hostname}}}"
      allow_duplicates: false
      description: Append the hostname of the actor who initiated the request to backstage to the related hostnames array
      tag: append_request_hostname_ecs_related
      if: ctx.json?.actor?.hostname != null
  - rename:
      field: json.actor.ip
      target_field: source.ip
      ignore_missing: true
      tag: rename_actor_ip_to_source_ip
      description: Maps the IP address of the actor that made the audited API call to the ECS `source.ip` field.
  - geoip:
      field: source.ip
      target_field: source.geo
      tag: geoip_source_ip
      ignore_missing: true
      description: Enriches `source.ip` with geographic location data into `source.geo.*`.
      if: ctx.source?.ip != null
  - geoip:
      field: source.ip
      target_field: source.as
      tag: geoip_source_asn
      database_file: GeoLite2-ASN.mmdb
      properties:
        - asn
        - organization_name
      ignore_missing: true
      description: Enriches `source.ip` with autonomous system data into `source.as.*`.
      if: ctx.source?.ip != null
  - rename:
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
      tag: rename_source_as_asn
      description: Renames the raw ASN field to the ECS-standard `source.as.number`.
  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      tag: rename_source_as_org
      description: Renames the raw organization name to the ECS-standard `source.as.organization.name`.
  - append:
      field: related.ip
      value: "{{{source.ip}}}"
      allow_duplicates: false
      description: Appends the actor's IP address to the `related.ip` array for cross-field correlation.
      tag: append_related_ip_8c67e2b0
      if: ctx.source?.ip != null
  - rename:
      field: json.meta.query.filter
      target_field: backstage.query.filter
      ignore_missing: true
      tag: rename_meta_query_filter
      description: >-
        Maps the Backstage catalog query's raw `key=value` filter condition(s) verbatim to
        `backstage.query.filter`
  - rename:
      field: json.meta.query.fields
      target_field: backstage.query.fields
      ignore_missing: true
      tag: rename_meta_query_fields
      description: Maps the Backstage catalog query field selector to `backstage.query.fields`. This controls which entity fields are returned in the query response.
  - rename:
      field: json.meta.queryType
      target_field: backstage.query.type
      ignore_missing: true
      tag: rename_meta_query_type
      description: Maps the Backstage catalog `json.meta.queryType` to `backstage.query.type`, indicating the type of catalog query performed (e.g., entity lookup, batch fetch).
  - remove:
      field: json.meta.query
      ignore_missing: true
      if: ctx.json?.meta?.query == null || ctx.json.meta.query.isEmpty()
      tag: remove_empty_meta_query
      description: Removes the `json.meta.query` container when it is null or empty after all query sub-fields have been extracted into `backstage.query.*`.
  - rename:
      field: json.meta.actionType
      target_field: backstage.action_type
      ignore_missing: true
      tag: rename_meta_action_type
      description: Maps the Backstage catalog action type (e.g. "get", "ancestry", "create") to `backstage.action_type`.
  - rename:
      field: json.meta.entityRef
      target_field: backstage.entity.ref
      ignore_missing: true
      tag: rename_meta_entity_ref
      description: Maps the Backstage catalog entity reference operated on to `backstage.entity.ref`.
  - rename:
      field: json.meta.entityRefs
      target_field: backstage.entity.refs
      ignore_missing: true
      tag: rename_meta_entity_refs
      description: Maps the Backstage catalog entity references returned by a batch lookup to `backstage.entity.refs`.
  - rename:
      field: json.meta.rootEntityRef
      target_field: backstage.entity.root_ref
      ignore_missing: true
      tag: rename_meta_root_entity_ref
      description: Maps the root entity reference of a Backstage catalog ancestry lookup to `backstage.entity.root_ref`.
  - rename:
      field: json.meta.totalItems
      target_field: backstage.total_items
      ignore_missing: true
      tag: rename_meta_total_items
      description: Maps the total item count of a paginated Backstage catalog query to `backstage.total_items`.
  - convert:
      field: backstage.total_items
      type: long
      ignore_missing: true
      tag: convert_total_items_to_long
      description: Ensures `backstage.total_items` is indexed as a long.
  - rename:
      field: json.meta.ancestry
      target_field: backstage.ancestry
      ignore_missing: true
      tag: rename_meta_ancestry
      description: >-
        Maps the Backstage catalog ancestry chain (array of `{entityRef, parentEntityRefs}`) to
        `backstage.ancestry`, preserving Backstage's native field casing.
  - rename:
      field: json.meta.createdBy
      target_field: backstage.task.created_by
      ignore_missing: true
      tag: rename_meta_created_by
      description: Maps the Backstage identity that created a scaffolder task to `backstage.task.created_by`.
  - append:
      field: related.user
      value: "{{{backstage.task.created_by}}}"
      allow_duplicates: false
      tag: append_created_by_related_user
      description: Appends the scaffolder task creator to `related.user` to support correlation across all user-related fields.
      if: ctx.backstage?.task?.created_by != null
  - rename:
      field: json.meta.taskId
      target_field: backstage.task.id
      ignore_missing: true
      tag: rename_meta_task_id
      description: Maps the Backstage scaffolder task identifier to `backstage.task.id`.
  - rename:
      field: json.meta.templateRef
      target_field: backstage.template.ref
      ignore_missing: true
      tag: rename_meta_template_ref
      description: Maps the Backstage scaffolder template reference to `backstage.template.ref`.
  - script:
      tag: serialize_task_parameters
      lang: painless
      if: ctx.json?.meta?.taskParameters != null
      description: >-
        Serializes the scaffolder task's input parameters to text under `backstage.task.parameters`.
        Shape varies per Backstage software template (user-defined), so it is not mapped to structured
        fields.
      source: |
        ctx.backstage = ctx.backstage == null ? new HashMap() : ctx.backstage;
        ctx.backstage.task = ctx.backstage.task == null ? new HashMap() : ctx.backstage.task;
        ctx.backstage.task.parameters = ctx.json.meta.taskParameters.toString();
  - remove:
      field: json.meta.taskParameters
      ignore_missing: true
      tag: remove_meta_task_parameters_source
      description: Removes the raw `json.meta.taskParameters` now that it has been serialized into `backstage.task.parameters`.
  - remove:
      field: json.meta.pageInfo
      ignore_missing: true
      tag: remove_meta_page_info
      description: Drops the opaque, base64-encoded pagination cursor. High-cardinality and not analytically useful.
  - script:
      tag: serialize_meta_residual
      lang: painless
      if: ctx.json?.meta != null && !ctx.json.meta.isEmpty()
      description: >-
        Serializes any remaining, not-yet-explicitly-mapped `json.meta` keys to text under `backstage.meta`.
        Empty for all currently-known Backstage event shapes; exists only as a forward-compatible safety net
        should Backstage add new plugin metadata keys in the future.
      source: |
        ctx.backstage = ctx.backstage == null ? new HashMap() : ctx.backstage;
        ctx.backstage.meta = ctx.json.meta.toString();
  - remove:
      field: json
      ignore_missing: true
      tag: remove_temporary_fields
      description: >-
        Removes the parsed `json` container now that all audit fields have been extracted.
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Pipeline '{{{ _ingest.pipeline }}}' failed at processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
