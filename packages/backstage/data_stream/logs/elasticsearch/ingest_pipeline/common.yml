---
description: Pipeline for common Backstage log normalization
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_common
      value: "9.4.0"
      description: Sets the ECS version for all parsed Backstage log records.
  - set:
      field: event.kind
      tag: set_event_kind_common
      value: event
      description: Sets event.kind for all parsed Backstage log records.
  - date:
      field: json.timestamp
      target_field: "@timestamp"
      formats:
        - ISO8601
      tag: extract_common_timestamp
      if: ctx.json?.timestamp != null
      description: Parses the timestamp shared by Backstage audit and application logs.
  - date:
      field: json.date
      target_field: "@timestamp"
      formats:
        - ISO8601
      tag: extract_application_date
      if: ctx.json?.timestamp == null && ctx.json?.date != null
      description: Parses the date emitted by Backstage HTTP application logs.
  - rename:
      field: json.message
      target_field: message
      ignore_missing: true
      tag: rename_common_message
      description: Promotes the parsed Backstage message to the ECS message field.
  - rename:
      field: json.service
      target_field: service.name
      ignore_missing: true
      tag: rename_common_service
      description: Maps the Backstage service name to ECS service.name.
  - rename:
      field: json.level
      target_field: log.level
      ignore_missing: true
      tag: rename_common_log_level
      description: Maps the Backstage logger level to ECS log.level.
  - rename:
      field: json.trace_id
      target_field: trace.id
      ignore_missing: true
      tag: rename_common_trace_id
      description: Maps the Backstage trace identifier to ECS trace.id.
  - rename:
      field: json.span_id
      target_field: span.id
      ignore_missing: true
      tag: rename_common_span_id
      description: Maps the Backstage span identifier to ECS span.id.
  - rename:
      field: json.request.url
      target_field: _backstage.common.url
      ignore_missing: true
      tag: normalize_audit_url_source
      if: ctx.json?.isAuditEvent == true && ctx.json?.request?.url != null
      description: Normalizes the audit URL source before shared URL parsing.
  - rename:
      field: json.url
      target_field: _backstage.common.url
      ignore_missing: true
      tag: normalize_application_url_source
      if: ctx.json?.isAuditEvent != true && ctx.json?.url != null
      description: Normalizes the application URL source before shared URL parsing.
  - set:
      field: url.original
      copy_from: _backstage.common.url
      tag: set_common_url_original
      if: ctx._backstage?.common?.url != null
      description: Preserves the unmodified URL before parsing its components.
  - uri_parts:
      field: _backstage.common.url
      target_field: url
      tag: parse_common_url
      ignore_failure: true
      if: ctx._backstage?.common?.url != null
      description: Parses audit and application URLs into ECS URL components.
  - remove:
      field:
        - url.extension
        - url.domain
        - url.scheme
      ignore_missing: true
      tag: remove_common_url_non_path_parts
      description: Removes URL components that are not meaningful for Backstage request paths.
  - remove:
      field: _backstage.common.url
      ignore_missing: true
      tag: remove_common_url_source
      description: Removes the temporary normalized URL source.
  - rename:
      field: json.actor.userAgent
      target_field: _backstage.common.user_agent
      ignore_missing: true
      tag: normalize_audit_user_agent_source
      if: ctx.json?.isAuditEvent == true && ctx.json?.actor?.userAgent != null
      description: Normalizes the audit user-agent source before shared ECS parsing.
  - rename:
      field: json.userAgent
      target_field: _backstage.common.user_agent
      ignore_missing: true
      tag: normalize_application_user_agent_source
      if: ctx.json?.isAuditEvent != true && ctx.json?.userAgent != null
      description: Normalizes the application user-agent source before shared ECS parsing.
  - rename:
      field: _backstage.common.user_agent
      target_field: user_agent.original
      ignore_missing: true
      tag: rename_common_user_agent
      description: Maps the normalized user-agent source to ECS user_agent.original.
  - user_agent:
      field: user_agent.original
      ignore_missing: true
      ignore_failure: true
      tag: parse_common_user_agent
      if: ctx.user_agent?.original != null
      description: Parses the normalized Backstage user agent into ECS fields.
  - rename:
      field: json.request.method
      target_field: _backstage.common.http_method
      ignore_missing: true
      tag: normalize_audit_http_method_source
      if: ctx.json?.isAuditEvent == true && ctx.json?.request?.method != null
      description: Normalizes the audit HTTP method source before shared ECS mapping.
  - rename:
      field: json.method
      target_field: _backstage.common.http_method
      ignore_missing: true
      tag: normalize_application_http_method_source
      if: ctx.json?.isAuditEvent != true && ctx.json?.method != null
      description: Normalizes the application HTTP method source before shared ECS mapping.
  - rename:
      field: _backstage.common.http_method
      target_field: http.request.method
      ignore_missing: true
      tag: rename_common_http_method
      description: Maps the normalized Backstage HTTP method to ECS.
  - remove:
      field:
        - json.timestamp
        - json.date
      ignore_missing: true
      tag: remove_common_timestamp_sources
      description: Removes timestamp source fields after they have been parsed.
  - remove:
      field: _backstage
      ignore_missing: true
      tag: remove_common_temporary_fields
      description: Removes temporary fields used while normalizing format-specific sources.
on_failure:
  - append:
      field: error.message
      tag: append_common_pipeline_error_message
      value: >-
        Pipeline '{{{ _ingest.pipeline }}}' failed at processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_common_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_common_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
