---
description: Pipeline for Security events
processors:
  - convert:
      field: event.code
      type: string
      ignore_missing: true
  - script:
      description: Remove all empty values from event_data.
      lang: painless
      source: ctx.winlog?.event_data?.entrySet().removeIf(entry -> [null, "", "-", "{00000000-0000-0000-0000-000000000000}"].contains(entry.getValue()))
      if: ctx.winlog?.event_data != null
  - pipeline:
      name: '{{ IngestPipeline "security_standard" }}'
      if: 'ctx.winlog?.provider_name != null && ["Microsoft-Windows-Eventlog", "Microsoft-Windows-Security-Auditing"].contains(ctx.winlog.provider_name)'
  - pipeline:
      name: '{{ IngestPipeline "security_scheduled_task" }}'
      if: >-
        ctx.winlog != null &&
        ctx.winlog.provider_name == 'Microsoft-Windows-Security-Auditing' &&
        ctx.event != null &&
        ctx.winlog._tmp?.scheduled_task instanceof Map &&
        (
          (
            ['4698', '4699', '4700', '4701'].contains(ctx.event.code) &&
            ctx.winlog._tmp.scheduled_task.task_content instanceof Map
          ) ||
          (
            ctx.event.code == '4702' &&
            ctx.winlog._tmp.scheduled_task.task_content_new instanceof Map
          )
        )
  - set:
      field: ecs.version
      value: '8.17.0'
  - pipeline:
      name: '{{ IngestPipeline "security_common" }}'
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "{{ _ingest.on_failure_message }}"
