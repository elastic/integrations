---
description: Pipeline for Microsoft-Windows-AppLocker/Packaged app-Deployment events
processors:
  ## ECS and Event fields.

  - set:
      field: ecs.version
      value: '8.17.0'
  - set:
      field: log.level
      copy_from: winlog.level
      ignore_empty_value: true
      ignore_failure: true
      if: ctx.winlog?.level != ""
  - date:
      field: winlog.time_created
      tag: "time_created_date"
      formats:
        - ISO8601
      if: ctx.winlog?.time_created != null
      on_failure:
        - remove:
            field: winlog.time_created
            ignore_failure: true
        - append:
            field: error.message
            value: "fail-{{{ _ingest.on_failure_processor_tag }}}"
        - fail:
            message: "Processor {{{ _ingest.on_failure_processor_type }}} with tag {{{ _ingest.on_failure_processor_tag }}} in pipeline {{{ _ingest.on_failure_pipeline }}} failed with message: {{{ _ingest.on_failure_message }}}"

  - set:
      field: event.kind
      value: event
  - set:
      field: event.code
      value: "{{{winlog.event_id}}}"
  - set:
      field: event.category
      value: ["process"]
  - set:
      field: event.type
      value: ["start"]
  - convert:
      field: winlog.record_id
      type: string
      ignore_failure: true
      ignore_missing: true

  ## User fields.
  - set:
      field: user.id
      copy_from: winlog.user.identifier
      ignore_failure: true
      ignore_empty_value: true
  - split:
      field: winlog.event_data.User
      target_field: "_temp.user_parts"
      separator: '\\'
      if: ctx.winlog?.event_data?.User != null
  - set:
      field: user.domain
      value: "{{{_temp.user_parts.0}}}"
      ignore_failure: true
      ignore_empty_value: true
      if: ctx._temp?.user_parts != null && ctx._temp.user_parts.size() == 2
  - set:
      field: user.name
      value: "{{{_temp.user_parts.1}}}"
      ignore_failure: true
      ignore_empty_value: true
      if: ctx._temp?.user_parts != null && ctx._temp.user_parts.size() == 2
  - rename:
      field: winlog.user.name
      target_field: user.name
      ignore_failure: true
      ignore_missing: true
      if: ctx.user?.name == null

  ## User data fields.
  - convert:
      field: winlog.user_data.FileHashLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.FileHashLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.FilePathLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.FilePathLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.FqbnLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.FqbnLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.FullFilePathLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.FullFilePathLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.PolicyNameLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.PolicyNameLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.RuleNameLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.RuleNameLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.RuleSddlLength
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.RuleSddlLength
            ignore_failure: true
  - convert:
      field: winlog.user_data.TargetProcessId
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.user_data.TargetProcessId
            ignore_failure: true

    ## Fully Qualified Binary Name (FQBN) / File Fields
    ## The FQBN is PUBLISHER\PRODUCT\FILE NAME\VERSION. Split it from the
    ## right, then parse the X.500 attributes of the publisher with kv so
    ## that any subset and order of attributes is handled.
  - grok:
      field: winlog.user_data.Fqbn
      tag: grok_fqbn
      ignore_missing: true
      patterns:
      - '^(?<tmp.fqbn.publisher>.*)\\(?<file.pe.product>[^\\]*)\\(?<file.pe.original_file_name>[^\\]*)\\(?<file.pe.file_version>[^\\]*)$'
      if: ctx.winlog?.user_data?.Fqbn != "-"
      on_failure:
        - append:
            field: error.message
            value: "Processor {{{ _ingest.on_failure_processor_type }}} with tag {{{ _ingest.on_failure_processor_tag }}} in pipeline {{{ _ingest.on_failure_pipeline }}} failed with message: {{{ _ingest.on_failure_message }}}"
    ## Only split on commas that start a new attribute, so that quoted
    ## values such as O="EXAMPLE, INC." stay intact.
  - kv:
      field: tmp.fqbn.publisher
      tag: kv_fqbn_publisher
      target_field: tmp.fqbn.subject
      field_split: ',\s*(?=[A-Z]+=)'
      value_split: '='
      trim_value: ' '
      include_keys:
        - CN
        - O
        - L
        - S
        - C
      ignore_missing: true
      if: ctx.tmp?.fqbn?.publisher instanceof String && ctx.tmp.fqbn.publisher != ''
      on_failure:
        - append:
            field: error.message
            value: "Processor {{{ _ingest.on_failure_processor_type }}} with tag {{{ _ingest.on_failure_processor_tag }}} in pipeline {{{ _ingest.on_failure_pipeline }}} failed with message: {{{ _ingest.on_failure_message }}}"
  - script:
      tag: script_fqbn_subject
      description: Copy the FQBN publisher attributes into the file.x509.subject arrays.
      lang: painless
      if: ctx.tmp?.fqbn?.subject instanceof Map
      params:
        CN: common_name
        O: organization
        L: locality
        S: state_or_province
        C: country
      source: |
        Map subject = ctx.tmp.fqbn.subject;
        for (def entry : params.entrySet()) {
          def value = subject.get(entry.getKey());
          if (value == null) {
            continue;
          }
          List values = value instanceof List ? value : [value];
          for (def v : values) {
            if (!(v instanceof String)) {
              continue;
            }
            String s = v;
            // Quoted values are enclosed in double quotes, with embedded quotes doubled.
            if (s.length() > 1 && s.startsWith('"') && s.endsWith('"')) {
              s = s.substring(1, s.length() - 1).replace('""', '"');
            }
            if (s.isEmpty()) {
              continue;
            }
            if (ctx.file == null) {
              ctx.file = [:];
            }
            if (ctx.file.x509 == null) {
              ctx.file.x509 = [:];
            }
            if (ctx.file.x509.subject == null) {
              ctx.file.x509.subject = [:];
            }
            List target = ctx.file.x509.subject.computeIfAbsent(entry.getValue(), k -> new ArrayList());
            if (!target.contains(s)) {
              target.add(s);
            }
          }
        }
      on_failure:
        - append:
            field: error.message
            value: "Processor {{{ _ingest.on_failure_processor_type }}} with tag {{{ _ingest.on_failure_processor_tag }}} in pipeline {{{ _ingest.on_failure_pipeline }}} failed with message: {{{ _ingest.on_failure_message }}}"

    ## Remove all temporary fields
  - remove:
      field: tmp
      ignore_missing: true

  - grok:
      field: winlog.user_data.FullFilePath
      ignore_missing: true
      patterns:
      - '(?<file.name>([^\\]*$))'
      if: ctx.winlog?.user_data?.FullFilePath != "-"

  - set:
      field: file.hash.sha256
      copy_from: winlog.user_data.FileHash
      ignore_empty_value: true
      if: ctx.winlog?.user_data?.FileHash != "-"

  - convert:
      field: error.code
      type: string
      ignore_missing: true
      
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "{{{ _ingest.on_failure_message }}}"
