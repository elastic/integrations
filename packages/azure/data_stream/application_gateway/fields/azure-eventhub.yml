# This data stream receives Event Hub metadata through two ingestion paths.
# The direct Application Gateway input keeps it under azure.*, while the generic
# azure.events input renames it to azure-eventhub.* before routing the event
# here. Both namespaces therefore need explicit mappings.
- name: azure.eventhub
  type: keyword
  description: Event hub name.
- name: azure.offset
  type: long
  description: Offset.
- name: azure.enqueued_time
  type: date
  description: The enqueued time.
- name: azure.partition_id
  type: keyword
  description: Partition ID.
- name: azure.consumer_group
  type: keyword
  description: Consumer group.
- name: azure.sequence_number
  type: long
  description: Sequence number.
- name: azure.partition_key
  type: keyword
  description: Partition key.
- name: azure-eventhub.eventhub
  type: keyword
  description: Event hub name.
- name: azure-eventhub.offset
  type: long
  description: Offset.
- name: azure-eventhub.enqueued_time
  type: date
  description: The enqueued time.
- name: azure-eventhub.partition_id
  type: keyword
  description: Partition ID.
- name: azure-eventhub.consumer_group
  type: keyword
  description: Consumer group.
- name: azure-eventhub.sequence_number
  type: long
  description: Sequence number.
- name: azure-eventhub.partition_key
  type: keyword
  description: Partition key.
