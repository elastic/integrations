---
description: Pipeline for parsing Azure sign-in logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_azure_to_azure-eventhub_e7f48148
      field: azure
      target_field: azure-eventhub
      ignore_missing: true
  - remove:
      tag: remove_routing_category_681b150d
      field: routing.category
      ignore_missing: true
      description: Remove the routing.category field if it exists.
  - json:
      tag: json_message_to_azure_signinlogs_42a8864a
      field: message
      target_field: azure.signinlogs
  - script:
      description: Convert Azure JSON keys to snake case.
      tag: azure_json_keys_to_snake_case_ffb87af5
      lang: painless
      source: |
        Map keysToSnakeCase(Map m) {
          def regex = /([a-z])([A-Z]+)/;
          def out = [:];

          for (entry in m.entrySet()) {
            def k = entry.getKey();
            def v = entry.getValue();

            if (v instanceof Map) {
              v = keysToSnakeCase(v);
            } else if (v instanceof List) {
              for (int i = 0; i < v.size(); i++) {
                def item = v.get(i);
                if (item instanceof Map) {
                  v.set(i, keysToSnakeCase(item));
                }
              }
            }

            k = regex.matcher(k).replaceAll('$1_$2').toLowerCase();
            out.put(k, v);
          }

          return out;
        }

        ctx.azure['signinlogs'] = keysToSnakeCase(ctx.azure.signinlogs);
  - drop:
      tag: drop_non_signinlogs_8d6904af
      description: Drop non-SignInLogs.
      if: ctx.azure?.signinlogs?.category == null || !ctx.azure.signinlogs.category.endsWith('SignInLogs')
    # Unfortunately, some Azure services generate logs with
    # `created_date_time` field instead of `time` field.
    #
    # We need to rename `created_date_time` as `time` to
    # apply the correct timestamp processing.
    # 
    # Refs;
    # - https://github.com/elastic/integrations/issues/15083  
  - rename:
     tag: rename_azure_signinlogs_created_date_time_to_azure_signinlogs_time_526bdc94
     field: azure.signinlogs.created_date_time
     target_field: azure.signinlogs.time
     ignore_missing: true
     if: ctx.azure?.signinlogs?.time == null
     description: 'Fallback to handle special cases for log category: use `created_date_time` as `time` if `time` is not already set.'
  - date:
      tag: date_azure_signinlogs_time_3d14bfd6
      field: azure.signinlogs.time
      # Order is prioritized by observed frequency for this log
      # category.
      # We expect the first format to be used in 99% of cases.
      # However, we include the other formats seen in other
      # categories as a necessary fallback.
      formats:
        - ISO8601
        - "M/d/yyyy h:mm:ss a XXX"
        - "M/d/yyyy h:mm:ss a"
        - "M/d/yyyy H:mm:ss"
        - yyyy-MM-dd'T'H:mm:ss.SSS'Z'
  - remove:
      tag: remove_azure_signinlogs_time_e7738750
      field: azure.signinlogs.time
  - rename:
      tag: rename_message_to_event_original_c74b1d7e
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - rename:
      tag: rename_azure_signinlogs_resource_id_to_azure_resource_id_f650c92f
      field: azure.signinlogs.resource_id
      target_field: azure.resource_id
      ignore_missing: true

  #
  # Sign-in logs use a few different fields for the source IP so try them all.
  # This assumes that they contain the same value if more than one is populated.
  #
  - set:
      tag: set_source_address_608c5223
      if: ctx?.source?.address == null
      field: source.address
      value: '{{{azure.signinlogs.properties.ipaddress}}}'
      ignore_empty_value: true
  - set:
      tag: set_source_address_3b325d2c
      if: ctx?.source?.address == null
      field: source.address
      value: '{{{azure.signinlogs.properties.ip_address}}}'
      ignore_empty_value: true
  - convert:
      tag: convert_source_address_to_source_ip_f5632a20
      field: source.address
      target_field: source.ip
      type: ip
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_azure_signinlogs_caller_ip_address_22e619fd
      field: azure.signinlogs.caller_ip_address
      type: ip
      ignore_missing: true
      ignore_failure: true
  - remove:
      tag: remove_d7fdbf89
      field:
        - azure.signinlogs.properties.ipaddress
        - azure.signinlogs.properties.ip_address
      ignore_missing: true
  - append:
      tag: append_related_ip_549fa858
      if: ctx?.source?.ip != null
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
  - set:
      tag: set_client_ip_ea9aabfe
      field: client.ip
      value: '{{{source.ip}}}'
      ignore_empty_value: true

  - convert:
      tag: convert_azure_signinlogs_level_to_log_level_7d323908
      field: azure.signinlogs.level
      target_field: log.level
      type: string
      ignore_missing: true
  - remove:
      tag: remove_azure_signinlogs_level_b7cbfd7c
      field: azure.signinlogs.level
      ignore_missing: true
  - convert:
      tag: convert_azure_signinlogs_duration_ms_to_event_duration_189f44b8
      field: azure.signinlogs.duration_ms
      target_field: event.duration
      type: long
      ignore_missing: true
      ignore_failure: true
      if: "ctx.azure?.signinlogs?.duration_ms != null && ctx.azure.signinlogs.duration_ms instanceof String"
      description: 'Convert duration_ms to event.duration as long (if it is a string).'
  - rename:
      tag: rename_azure_signinlogs_duration_ms_to_event_duration_fffef99e
      field: azure.signinlogs.duration_ms
      target_field: event.duration
      ignore_missing: true
      if: "ctx.azure?.signinlogs?.duration_ms != null && !(ctx.azure.signinlogs.duration_ms instanceof String)"
      description: 'Rename duration_ms to event.duration (if it is not a string).'
  - remove:
      tag: remove_azure_signinlogs_duration_ms_448e81cf
      field: azure.signinlogs.duration_ms
      ignore_missing: true
      description: 'Clean up duration_ms field, if it is still there after the conversion.'
  - script:
      tag: script_c745220a
      if: ctx.event?.duration != null
      lang: painless
      source: ctx.event.duration = ctx.event.duration * 1000000
  - rename:
      tag: rename_azure_signinlogs_location_to_geo_country_iso_code_aaf3fe84
      field: azure.signinlogs.location
      target_field: geo.country_iso_code
      ignore_missing: true
  - convert:
      tag: convert_azure_signinlogs_operation_name_to_event_action_5bc8a5ad
      field: azure.signinlogs.operation_name
      target_field: event.action
      type: string
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_tenant_id_to_azure_tenant_id_2ad5c8e7
      field: azure.signinlogs.tenant_id
      target_field: azure.tenant_id
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_correlation_id_to_azure_correlation_id_1e9ea723
      field: azure.signinlogs.correlation_id
      target_field: azure.correlation_id
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_created_date_time_to_azure_signinlogs_properties_created_at_0eee4bd1
      field: azure.signinlogs.properties.created_date_time
      target_field: azure.signinlogs.properties.created_at
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_processing_time_in_milliseconds_to_azure_signinlogs_properties_processing_time_ms_e2aaafbe
      field: azure.signinlogs.properties.processing_time_in_milliseconds
      target_field: azure.signinlogs.properties.processing_time_ms
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_risk_level_during_sign_in_to_azure_signinlogs_properties_risk_level_during_signin_a07c6c93
      field: azure.signinlogs.properties.risk_level_during_sign_in
      target_field: azure.signinlogs.properties.risk_level_during_signin
      ignore_missing: true
  - script:
      tag: script_build_message_field_using_combination_ee25521c
      description: Build message field using a combination of failure reason and additional details
      source: |-
        String reason = ctx?.azure?.signinlogs?.properties?.status?.failure_reason;
        String details = ctx?.azure?.signinlogs?.properties?.status?.additional_details;
        if (reason != null && details != null) {
          ctx['message'] = reason + ' (' + details + ')';
        } else if (reason != null) {
          ctx['message'] = reason;
        } else if (details != null) {
          ctx['message'] = details;
        }

  - remove:
      tag: remove_azure_signinlogs_properties_status_failure_reason_172a2fd8
      field: azure.signinlogs.properties.status.failure_reason
      ignore_missing: true
  - remove:
      tag: remove_azure_signinlogs_properties_status_additional_details_ddf43b9d
      field: azure.signinlogs.properties.status.additional_details
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_location_city_to_geo_city_name_20e46439
      field: azure.signinlogs.properties.location.city
      target_field: geo.city_name
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_location_state_to_geo_region_name_1a1ac8ea
      field: azure.signinlogs.properties.location.state
      target_field: geo.region_name
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_location_geo_coordinates_latitude_to_geo_location_lat_18481f72
      field: azure.signinlogs.properties.location.geo_coordinates.latitude
      target_field: geo.location.lat
      ignore_missing: true
  - rename:
      tag: rename_azure_signinlogs_properties_location_geo_coordinates_longitude_to_geo_location_lon_45bc72c5
      field: azure.signinlogs.properties.location.geo_coordinates.longitude
      target_field: geo.location.lon
      ignore_missing: true
  - remove:
      tag: remove_8cb4f3f8
      field:
        - azure.signinlogs.properties.location
      ignore_missing: true
  - script:
      tag: script_turns_authentication_processing_details_array_d5205082
      description: "Turns the authentication_processing_details array elements into key/value pairs. For example, the array element ``{key: 'key1', value: 'value1'}`` becomes ``{key1: 'value1'}``."
      lang: painless
      source: |
        def tmp = [:];
        for (item in ctx.azure.signinlogs.properties.authentication_processing_details) {
            tmp[item.key] = item.value;
        }
        ctx.azure.signinlogs.properties.authentication_processing_details = tmp;
      if: ctx.azure?.signinlogs?.properties?.authentication_processing_details != null && ctx.azure.signinlogs.properties.authentication_processing_details instanceof List
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - set:
      tag: set_event_category_e43d8992
      field: event.category
      value:
        - authentication
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value:
        - info
  - set:
      tag: set_event_outcome_f6091bec
      field: event.outcome
      value: success
      if: "ctx?.azure?.signinlogs?.properties?.status?.error_code == null || ctx.azure.signinlogs.properties.status.error_code == 0"
  - set:
      tag: set_event_outcome_1a34f2b4
      field: event.outcome
      value: failure
      if: "ctx?.azure?.signinlogs?.properties?.status?.error_code != null && ctx.azure.signinlogs.properties.status.error_code > 0"
  - set:
      tag: set_event_id_5e0cd2ab
      field: event.id
      value: '{{{azure.signinlogs.properties.id}}}'
      ignore_empty_value: true
  - set:
     field: user.name
     copy_from: azure.signinlogs.properties.user_principal_name
     ignore_empty_value: true
     tag: set_user_name_1fc0a1cd
  - set:
      field: user.email
      copy_from: user.name
      tag: set_user_email_d6b77481
      if: ctx.user?.email == null && ctx.user?.name != null && ctx.user.name.indexOf("@") > 0
  # Don't dissect the user email into <user.name>@<user.domain>
  # as the parts are meaningless on their own
  - convert:
      tag: convert_azure_signinlogs_properties_user_display_name_to_user_full_name_e210e833
      field: azure.signinlogs.properties.user_display_name
      target_field: user.full_name
      ignore_missing: true
      type: string
  - remove:
      tag: remove_azure_signinlogs_properties_user_id_4609ccea
      description: Drop user_id field if value is null.
      if: ctx?.azure?.signinlogs?.properties?.user_id == null
      field: azure.signinlogs.properties.user_id
      ignore_missing: true
  - convert:
      tag: convert_azure_signinlogs_properties_user_id_to_user_id_9e87ebb8
      field: azure.signinlogs.properties.user_id
      target_field: user.id
      ignore_missing: true
      type: string
  - append:
      tag: append_related_user_3b2f7fde
      field: related.user
      value: '{{{user.id}}}'
      if: ctx.user?.id != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_user_3b423052
      field: related.user
      value: '{{{user.name}}}'
      if: ctx.user?.name != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_user_a621a20e
      field: related.user
      value: '{{{user.full_name}}}'
      if: ctx.user?.full_name != null
      allow_duplicates: false
      ignore_failure: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true

  #
  # User Agent
  #
  - rename:
      tag: rename_azure_signinlogs_properties_user_agent_to_user_agent_original_da8e12dc
      field: azure.signinlogs.properties.user_agent
      target_field: user_agent.original
      ignore_missing: true
      if: 'ctx.user_agent?.original == null'
      description: 'Renames the original `azure.signinlogs.properties.user_agent` field to `user_agent.original` to match the ECS field name. The `user_agent.original` field is not touched if the document already has one.'
  - remove:
      tag: remove_azure_signinlogs_properties_user_agent_1065731a
      field: azure.signinlogs.properties.user_agent
      ignore_missing: true
      if: 'ctx.user_agent?.original != null'
      description: 'The `azure.signinlogs.properties.user_agent` field is no longer required if the document has a `user_agent.original` field.'
  - user_agent:
      tag: user_agent_user_agent_original_b5325863
      field: user_agent.original
      ignore_missing: true
  - append:
      tag: append_related_entity_31175914
      field: related.entity
      value: '{{{ azure.signinlogs.properties.app_id }}}'
      allow_duplicates: false
      if: ctx.azure?.signinlogs?.properties?.app_id != null && ctx.azure.signinlogs.properties.app_id != ''
  - append:
      tag: append_related_entity_0fc8606d
      field: related.entity
      value: '{{{ azure.signinlogs.properties.resource_id }}}'
      allow_duplicates: false
      if: ctx.azure?.signinlogs?.properties?.resource_id != null && ctx.azure.signinlogs.properties.resource_id != ''
  - set:
      tag: set_service_name_65a6fcb2
      field: service.name
      copy_from: azure.signinlogs.properties.service_principal_name
      ignore_empty_value: true
  - append:
      tag: append_related_entity_daab766d
      field: related.entity
      value: '{{{ azure.signinlogs.properties.service_principal_id }}}'
      allow_duplicates: false
      if: ctx.azure?.signinlogs?.properties?.service_principal_id != null && ctx.azure.signinlogs.properties.service_principal_id != ''
  - append:
      tag: append_related_entity_b43238f3
      field: related.entity
      value: '{{{ azure.signinlogs.properties.service_principal_credential_key_id }}}'
      allow_duplicates: false
      if: ctx.azure?.signinlogs?.properties?.service_principal_credential_key_id != null && ctx.azure.signinlogs.properties.service_principal_credential_key_id != ''
  - append:
      tag: append_related_entity_3a23faa8
      field: related.entity
      value: '{{{ azure.signinlogs.properties.user_id }}}'
      allow_duplicates: false
      if: ctx.azure?.signinlogs?.properties?.user_id != null && ctx.azure.signinlogs.properties.user_id != ''
  - append:
      tag: append_related_entity_36bfb912
      field: related.entity
      value: '{{{ azure.signinlogs.properties.device_detail.device_id }}}'
      allow_duplicates: false
      if: ctx.azure?.signinlogs?.properties?.device_detail?.device_id != null && ctx.azure.signinlogs.properties.device_detail.device_id != ''
  - pipeline:
      tag: pipeline_azure_shared_pipeline_7877e1a4
      name: '{{ IngestPipeline "azure-shared-pipeline" }}'
  - script:
      tag: script_drops_null_empty_values_recursively_a3eb5add
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_fb774d38
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
