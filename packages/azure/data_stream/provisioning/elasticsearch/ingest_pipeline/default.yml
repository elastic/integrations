---
description: Pipeline for parsing Azure Provisioning logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_azure_to_azure-eventhub_e7f48148
      field: azure
      target_field: azure-eventhub
      ignore_missing: true
  - remove:
      tag: remove_routing_category_681b150d
      field: routing.category
      ignore_missing: true
      description: Remove the routing.category field if it exists.
  - script:
      tag: script_b08e84a2
      source: ctx.message = ctx.message.replace(params.empty_field_name, '')
      params:
        empty_field_name: '"":"",'
      ignore_failure: true
  - rename:
      tag: rename_message_to_event_original_c74b1d7e
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_azure_provisioning_3df18f2a
      field: event.original
      target_field: azure.provisioning
  - drop:
      tag: drop_03a2cc82
      description: Drop events that are not Azure Provisioning logs.
      if: ctx?.azure?.provisioning?.category == null || ctx.azure.provisioning.category != 'ProvisioningLogs'
  #
  # Common fields
  #      
  - date:
      tag: date_azure_provisioning_time_to_timestamp_417b9e0f
      field: azure.provisioning.time
      target_field: '@timestamp'
      ignore_failure: true
      # Order is prioritized by observed frequency for this log
      # category.
      # We expect the first format to be used in 99% of cases.
      # However, we include the other formats seen in other
      # categories as a necessary fallback.
      formats: 
        - "M/d/yyyy h:mm:ss a XXX"
        - "M/d/yyyy h:mm:ss a"
        - "M/d/yyyy H:mm:ss"
        - ISO8601
        - yyyy-MM-dd'T'H:mm:ss.SSS'Z'
  - remove:
      tag: remove_azure_provisioning_time_3f544ce7
      field: azure.provisioning.time
      ignore_missing: true
  - rename:
      tag: rename_azure_provisioning_resourceId_to_azure_resource_id_cf4da914
      field: azure.provisioning.resourceId
      target_field: azure.resource_id
      ignore_missing: true
  - convert:
        tag: convert_azure_provisioning_callerIpAddress_to_source_ip_a66089a5
        field: azure.provisioning.callerIpAddress
        target_field: source.ip
        type: ip
        ignore_missing: true
        on_failure:
        - rename: 
            tag: rename_azure_provisioning_callerIpAddress_to_source_address_70d06e02
            field: azure.provisioning.callerIpAddress
            target_field: source.address
            ignore_missing: true 
            ignore_failure: true
  - remove:
      tag: remove_azure_provisioning_callerIpAddress_f0c3a8cc
      field: azure.provisioning.callerIpAddress
      if: 'ctx.source?.ip != null'
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_azure_provisioning_durationMs_to_event_duration_63215b30
      field: azure.provisioning.durationMs
      target_field: event.duration
      ignore_missing: true
  - script:
      tag: script_7f8b9902
      lang: painless
      source: if (ctx.event.duration!= null) {ctx.event.duration = ctx.event.duration
        * params.param_nano;}
      params:
        param_nano: 1000000
      ignore_failure: true
