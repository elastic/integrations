---
description: Pipeline for parsing Azure shared log fields.
processors:
  - set:
      tag: set_cloud_provider_136a398d
      field: cloud.provider
      value: azure
  - grok:
      tag: grok_azure_resource_id_tenant_b8a7c6d5
      field: azure.resource_id
      if: ctx.azure?.resource_id != null && ctx.azure?.tenant?.id == null
      patterns:
        - (?i)/tenants/%{TENANTID:azure.tenant.id}/providers/%{PROVIDERNAME:azure.resource_provider.namespace}
      pattern_definitions:
        TENANTID: (\{){0,1}[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}(\}){0,1}
        PROVIDERNAME: .+
      ignore_failure: true
  - grok:
      tag: grok_azure_resource_id_provider_c9d8e7f6
      field: azure.resource_id
      if: ctx.azure?.resource_id != null && ctx.azure?.resource_provider?.namespace == null
      patterns:
        - (?i)/providers/%{PROVIDER:azure.resource_provider.namespace}
      pattern_definitions:
        PROVIDER: .+
      ignore_failure: true
  - rename:
      tag: rename_azure_resource_id_to_cloud_resource_id_4a05dbed
      field: azure.resource_id
      target_field: cloud.resource_id
      ignore_missing: true
  - set:
      tag: set_legacy_azure_resource_id_underscore_9a1b2c3d
      field: azure.resource_id
      copy_from: cloud.resource_id
      ignore_empty_value: true
  - lowercase:
      tag: lowercase_event_outcome_eb9dfc47
      field: event.outcome
      ignore_missing: true
  # Backward compatibility (non-breaking): the pre-1.41.0 field names stay
  # populated alongside the new semantic-convention names, so existing `_source`
  # consumers, custom pipelines and saved objects keep working. Both sets are
  # concrete fields; neither is an alias.
  - set:
      tag: set_legacy_azure_resource_id_7c1f9a24
      field: azure.resource.id
      copy_from: cloud.resource_id
      ignore_empty_value: true
  - set:
      tag: set_legacy_azure_resource_group_2e8b5d13
      field: azure.resource.group
      copy_from: azure.resource_group.name
      ignore_empty_value: true
  - set:
      tag: set_legacy_azure_resource_provider_9f4a6c07
      field: azure.resource.provider
      copy_from: azure.resource_provider.namespace
      ignore_empty_value: true
  - set:
      tag: set_legacy_azure_tenant_id_5b3d8e91
      field: azure.tenant_id
      copy_from: azure.tenant.id
      ignore_empty_value: true
  - set:
      tag: set_legacy_azure_correlation_id_1a7e4f62
      field: azure.correlation_id
      copy_from: azure.correlation.id
      ignore_empty_value: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_fb774d38
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
