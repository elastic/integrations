---
description: Pipeline for processing Azure firewall logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - set:
      tag: set_event_category_dbab8a4e
      field: event.category
      value: [network]
  - set:
      tag: set_event_type_8fd37e4e
      field: event.type
      value: [connection]
  - remove:
      tag: remove_routing_category_681b150d
      field: routing.category
      ignore_missing: true
      description: Remove the routing.category field if it exists.
  - rename:
      tag: rename_message_to_event_original_c74b1d7e
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_cac66847
      field: event.original
      target_field: json
      ignore_failure: true
  - date:
      tag: date_json_time_to_timestamp_b6f0a15b
      field: json.time
      target_field: '@timestamp'
      ignore_failure: true
      # Order is prioritized by observed frequency for this log
      # category.
      # We expect the first format to be used in 99% of cases.
      # However, we include the other formats seen in other
      # categories as a necessary fallback.
      formats:
        - ISO8601
        - "M/d/yyyy h:mm:ss a XXX"
        - "M/d/yyyy h:mm:ss a"
        - "M/d/yyyy H:mm:ss"
        - yyyy-MM-dd'T'H:mm:ss.SSS'Z'
  - remove:
      tag: remove_json_time_c0eae5a3
      field: json.time
      ignore_missing: true
  - rename:
      tag: rename_json_resourceId_to_azure_resource_id_b341c9bc
      field: json.resourceId
      target_field: azure.resource_id
      ignore_missing: true
  - rename:
      tag: rename_json_properties_DestinationIp_to_destination_ip_e066ae51
      field: json.properties.DestinationIp
      target_field: destination.ip
      ignore_missing: true
  - rename:
      tag: rename_json_properties_DestinationPort_to_destination_port_5dfab601
      field: json.properties.DestinationPort
      target_field: destination.port
      ignore_missing: true
  - rename:
      tag: rename_json_properties_Policy_to_azure_firewall_policy_77111060
      field: json.properties.Policy
      target_field: azure.firewall.policy
      ignore_missing: true
  - rename:
      tag: rename_json_properties_Protocol_to_azure_firewall_protocol_5299d574
      field: json.properties.Protocol
      target_field: azure.firewall.protocol
      ignore_missing: true
  - rename:
      tag: rename_json_properties_Rule_to_rule_name_4abf5d66
      field: json.properties.Rule
      target_field: rule.name
      ignore_missing: true
  - rename:
      tag: rename_json_properties_RuleCollection_to_rule_ruleset_fd554427
      field: json.properties.RuleCollection
      target_field: rule.ruleset
      ignore_missing: true
  - rename:
      tag: rename_json_properties_RuleCollectionGroup_to_azure_firewall_rule_collection_group_06f8b31e
      field: json.properties.RuleCollectionGroup
      target_field: azure.firewall.rule_collection_group
      ignore_missing: true
  - rename:
      tag: rename_json_properties_SourceIp_to_source_ip_e90cf181
      field: json.properties.SourceIp
      target_field: source.ip
      ignore_missing: true
  - rename:
      tag: rename_json_properties_SourcePort_to_source_port_2a6ab025
      field: json.properties.SourcePort
      target_field: source.port
      ignore_missing: true
  - set:
      field: destination.nat.ip
      tag: set_destination_nat_ip_from_properties_translated_ip
      copy_from: json.properties.TranslatedIp
      ignore_empty_value: true
  - set:
      field: destination.nat.port
      tag: set_destination_nat_port_from_properties_translated_port
      copy_from: json.properties.TranslatedPort
      ignore_empty_value: true
  - rename:
      tag: rename_json_properties_Action_to_event_action_7aea9a95
      field: json.properties.Action
      target_field: event.action
      ignore_missing: true
  - rename:
      tag: rename_json_properties_ActionReason_to_event_reason_c99d53b3
      field: json.properties.ActionReason
      target_field: event.reason
      ignore_missing: true
  - rename:
      tag: rename_json_properties_Fqdn_to_destination_domain_2494b954
      field: json.properties.Fqdn
      target_field: destination.domain
      ignore_missing: true
  - rename:
      tag: rename_json_properties_IsExplicitProxyRequest_to_azure_firewall_is_explicit_proxy_request_2290ec2f
      field: json.properties.IsExplicitProxyRequest
      target_field: azure.firewall.is_explicit_proxy_request
      ignore_missing: true
  - rename:
      tag: rename_json_properties_IsTlsInspected_to_azure_firewall_is_tls_inspected_9832d892
      field: json.properties.IsTlsInspected
      target_field: azure.firewall.is_tls_inspected
      ignore_missing: true
  - uri_parts:
      field: json.properties.TargetUrl
      if: ctx.json?.properties?.TargetUrl != null
      tag: uri_parts_targeturl
      keep_original: true
      on_failure:
        - append:
            tag: append_error_message_23fc9d0f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
      target_field: url
  - remove:
      tag: remove_json_properties_TargetUrl_c52e9ca7
      field: json.properties.TargetUrl
      ignore_missing: true
  - rename:
      tag: rename_json_properties_WebCategory_to_azure_firewall_web_category_d37b3503
      field: json.properties.WebCategory
      target_field: azure.firewall.web_category
      ignore_missing: true
  - rename:
      tag: rename_json_properties_DnssecOkBit_to_azure_firewall_dnssec_ok_bit_b68f3f0a
      field: json.properties.DnssecOkBit
      target_field: azure.firewall.dnssec_ok_bit
      ignore_missing: true
  - rename:
      tag: rename_json_properties_EDNS0BufferSize_to_azure_firewall_edns0_buffer_size_7b6d22ea
      field: json.properties.EDNS0BufferSize
      target_field: azure.firewall.edns0_buffer_size
      ignore_missing: true
  - rename:
      tag: rename_json_properties_ErrorMessage_to_error_message_11568389
      field: json.properties.ErrorMessage
      target_field: error.message
      ignore_missing: true
  - convert:
      tag: convert_json_properties_ErrorNumber_to_error_id_84655cef
      field: json.properties.ErrorNumber
      target_field: error.id
      type: string
      ignore_missing: true
      if: ctx.json?.properties?.ErrorNumber != ""
  - rename:
      tag: rename_json_properties_QueryClass_to_dns_question_class_dd2a43f8
      field: json.properties.QueryClass
      target_field: dns.question.class
      ignore_missing: true
  - convert:
      tag: convert_json_properties_QueryId_to_dns_id_29de203e
      field: json.properties.QueryId
      target_field: dns.id
      type: string
      ignore_missing: true
      if: ctx.json?.properties?.QueryId != ""
  - rename:
      tag: rename_json_properties_QueryName_to_dns_question_name_847c07b2
      field: json.properties.QueryName
      target_field: dns.question.name
      ignore_missing: true
  - rename:
      tag: rename_json_properties_QueryType_to_dns_question_type_102708b8
      field: json.properties.QueryType
      target_field: dns.question.type
      ignore_missing: true
  - rename:
      tag: rename_json_properties_RequestDurationSecs_to_azure_firewall_request_duration_secs_19b84b36
      field: json.properties.RequestDurationSecs
      target_field: azure.firewall.request_duration_secs
      ignore_missing: true
  - rename:
      tag: rename_json_properties_RequestSize_to_azure_firewall_request_size_755da81d
      field: json.properties.RequestSize
      target_field: azure.firewall.request_size
      ignore_missing: true
  - rename:
      tag: rename_json_properties_ResponseCode_to_dns_response_code_fe64376f
      field: json.properties.ResponseCode
      target_field: dns.response_code
      ignore_missing: true
  - rename:
      tag: rename_json_properties_ResponseFlags_to_dns_header_flags_cf51f00b
      field: json.properties.ResponseFlags
      target_field: dns.header_flags
      ignore_missing: true
  - rename:
      tag: rename_json_properties_ResponseSize_to_azure_firewall_response_size_48ce93fd
      field: json.properties.ResponseSize
      target_field: azure.firewall.response_size
      ignore_missing: true
  - grok:
      tag: grok_json_properties_msg_864b0a3b
      field: json.properties.msg
      patterns:
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. $"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. Policy: %{DATA:azure.firewall.policy}. Rule Collection Group: %{DATA:azure.firewall.rule_collection_group}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}$"
        - "^%{DATA:azure.firewall.proto} Type=%{DATA:azure.firewall.icmp.request.code} request from %{IPORHOST:source.address} to %{IPORHOST:destination.address}. Action: %{DATA:azure.firewall.action}. $"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long} was DNAT'ed to %{IP:destination.nat.ip}:%{NUMBER:destination.nat.port:long}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long} was DNAT'ed to %{IP:destination.nat.ip}:%{NUMBER:destination.nat.port:long}. Policy: %{DATA:azure.firewall.policy}. Rule Collection Group: %{DATA:azure.firewall.rule_collection_group}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long} was DNAT'ed to %{IP:destination.nat.ip}:%{NUMBER:destination.nat.port:long}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:(%{NUMBER:source.port:long})? to %{IPORHOST:destination.address}:(%{NUMBER:destination.port:long})?. Action: %{DATA:azure.firewall.action}. Signature: %{DATA:rule.id}. IDS: %{DATA:rule.name}. Priority: %{NUMBER:event.risk_score:long}. Classification: %{DATA:rule.category}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Url: %{HOSTNAME:url.original}. Action: %{DATA:azure.firewall.action}. ThreatIntel: %{DATA:rule.name}$"
      if: ctx?.json?.operationName == 'AzureFirewallNetworkRuleLog' || ctx?.json?.operationName == 'AzureFirewallNatRuleLog'

  - grok:
      tag: grok_json_properties_msg_747f2691
      field: json.properties.msg
      patterns:
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. ThreatIntel: %{DATA:rule.name}$"
      if: ctx.json?.operationName == 'AzureFirewallThreatIntelLog'

  - grok:
      tag: grok_json_properties_msg_b2de99b6
      field: json.properties.msg
      patterns:
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. Policy: %{DATA:azure.firewall.policy}. Rule Collection Group: %{DATA:azure.firewall.rule_collection_group}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}. Web Category: %{DATA:rule.category}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Url: %{DATA:url.original}. Action: %{DATA:azure.firewall.action}. Policy: %{DATA:azure.firewall.policy}. Rule Collection Group: %{DATA:azure.firewall.rule_collection_group}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Url: %{DATA:url.original}. Action: %{DATA:azure.firewall.action}. %{DATA:event.reason}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. Rule Collection: %{DATA:rule.ruleset}. Rule: %{DATA:rule.name}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long} to %{IPORHOST:destination.address}:%{NUMBER:destination.port:long}. Action: %{DATA:azure.firewall.action}. %{DATA:event.reason}$"
        - "^%{DATA:azure.firewall.proto} request from %{IPORHOST:source.address}:%{NUMBER:source.port:long}. Action: %{DATA:azure.firewall.action}. Reason: %{DATA:event.reason}$"
      if: ctx?.json?.operationName == 'AzureFirewallApplicationRuleLog'

  - grok:
      tag: grok_json_properties_msg_3eec0f95
      field: json.properties.msg
      patterns:
        - "^DNS Request: %{IPORHOST:source.address}:%{NUMBER:source.port:long} - %{DATA:azure.firewall.event_original_uid} %{DATA:dns.question.type} %{DATA:dns.question.class} %{DATA:dns.question.name}. %{DATA:network.transport} %{NUMBER:source.bytes:long} %{DATA:azure.firewall.dnssec_bool_flag:boolean} %{NUMBER:azure.firewall.dnssec_buffer_size:long} %{DATA:dns.response_code} %{DATA:dns.header_flags} %{NUMBER:destination.bytes:long} %{DATA:azure.firewall.duration}$"
      if: ctx?.json?.operationName == 'AzureFirewallDnsProxyLog'

  - set:
      tag: set_json_event_alert_action_c5d19c34
      field: json.event.alert.action
      value: denied
      if: ctx.azure?.firewall?.action == 'Deny'
  - set:
      tag: set_json_event_alert_action_6762ff96
      field: json.event.alert.action
      value: allowed
      if: ctx.azure?.firewall?.action == 'Allow'
  - append:
      tag: append_event_type_1265169e
      field: event.type
      value: "{{json.event.alert.action}}"
      if: ctx.json?.event?.alert?.action != null
  - append:
      field: event.type
      tag: append_allowed_into_event_type
      value: allowed
      if: ctx.event?.action?.equalsIgnoreCase('Allow') == true
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_denied_into_event_type
      value: denied
      if: ctx.event?.action?.equalsIgnoreCase('Deny') == true
      allow_duplicates: false
  - grok:
      tag: grok_source_address_1b416a4c
      field: source.address
      patterns:
        - "%{IP:source.ip}"
        - "%{HOSTNAME:source.domain}"
      ignore_missing: true
  - set:
      field: source.address
      tag: set_source_address_from_source_ip
      copy_from: source.ip
      if: ctx.source?.address == null
      ignore_empty_value: true
  - grok:
      tag: grok_destination_address_7488f4cf
      field: destination.address
      patterns:
        - "%{IP:destination.ip}"
        - "%{HOSTNAME:destination.domain}"
      ignore_missing: true
  - set:
      field: destination.address
      tag: set_destination_address_from_destination_ip
      copy_from: destination.ip
      if: ctx.destination?.address == null
      ignore_empty_value: true

  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_destination_ip_to_destination_geo_ab5e2968
      field: destination.ip
      target_field: destination.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - geoip:
      tag: geoip_destination_ip_to_destination_as_8a007787
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      tag: rename_destination_as_asn_to_destination_as_number_3b459fcd
      field: destination.as.asn
      target_field: destination.as.number
      ignore_missing: true
  - rename:
      tag: rename_destination_as_organization_name_to_destination_as_organization_name_814bd459
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      ignore_missing: true

  - append:
      tag: append_related_ip_5ea7f39f
      if: ctx?.source?.ip != null
      field: related.ip
      value: "{{source.ip}}"
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_ip_242ec3bb
      if: ctx?.destination?.ip != null
      field: related.ip
      value: "{{destination.ip}}"
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_ip_aa7a97d4
      if: ctx?.destination?.nat?.ip != null
      field: related.ip
      value: "{{destination.nat.ip}}"
      allow_duplicates: false
      ignore_failure: true

  - append:
      tag: append_related_hosts_423cc4c7
      if: ctx?.source?.domain != null
      field: related.hosts
      value: "{{source.domain}}"
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hosts_16953535
      if: ctx?.destination?.domain != null
      field: related.hosts
      value: "{{destination.domain}}"
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_hosts_ae9ba006
      if: ctx?.dns?.question?.name != null
      field: related.hosts
      value: "{{dns.question.name}}"
      allow_duplicates: false
      ignore_failure: true
  - lowercase:
      tag: lowercase_azure_firewall_proto_8255133a
      field: azure.firewall.proto
      ignore_failure: true
  - set:
      tag: set_network_transport_4fd14b60
      field: network.transport
      value: "{{azure.firewall.proto}}"
      if: "ctx?.azure?.firewall?.proto != null && ['udp', 'tcp', 'icmp'].contains(ctx.azure.firewall.proto)"
  - set:
      tag: set_network_protocol_b9da1611
      field: network.protocol
      value: "{{azure.firewall.proto}}"
      if: "ctx?.network?.transport == null"
  - remove:
      tag: remove_70a436a9
      field:
        - azure.firewall.proto
      ignore_missing: true
  - lowercase:
      tag: lowercase_azure_firewall_protocol_abd73bbf
      field: azure.firewall.protocol
      if: ctx.azure?.firewall?.protocol != null
  - set:
      tag: set_network_transport_caf795eb
      field: network.transport
      value: "{{azure.firewall.protocol}}"
      if: "ctx.azure?.firewall?.protocol != null && ['udp', 'tcp', 'icmp'].contains(ctx.azure.firewall.protocol) && ctx.json?.category != null && ['AZFWDnsQuery', 'AZFWApplicationRule', 'AZFWNetworkRule', 'AZFWNatRule'].contains(ctx.json.category)"
  - set:
      tag: set_network_protocol_3c7b7b3c
      field: network.protocol
      value: "{{azure.firewall.protocol}}"
      if: "ctx.network?.transport == null && ctx.json?.category != null && ['AZFWDnsQuery', 'AZFWApplicationRule', 'AZFWNetworkRule', 'AZFWNatRule'].contains(ctx.json.category)"
  - remove:
      tag: remove_bac22d7d
      field:
        - azure.firewall.protocol
      ignore_missing: true
  - script:
      tag: script_f3de8ab8
      lang: painless
      ignore_failure: true
      if: ctx?.network?.transport != null
      source: |
        def transport = ctx.network.transport;
        if (transport == 'udp') {
            ctx.network.iana_number = '17';
        } else if (transport == 'tcp') {
            ctx.network.iana_number = '6';
        }
  - uppercase:
      tag: uppercase_dns_header_flags_4ebd33b4
      field: dns.header_flags
      ignore_missing: true
  - split:
      tag: split_dns_header_flags_ab2a62f7
      field: dns.header_flags
      separator: ","
      ignore_missing: true
  - set:
      tag: set_dns_type_71547767
      field: dns.type
      value: "query"
      if: ctx.json?.category == 'AZFWDnsQuery'
  - rename:
      tag: rename_json_category_to_azure_firewall_category_5038ea13
      field: json.category
      target_field: azure.firewall.category
      ignore_missing: true
  - rename:
      tag: rename_json_operationName_to_azure_firewall_operation_name_a51327f0
      field: json.operationName
      target_field: azure.firewall.operation_name
      ignore_missing: true
  - set:
      tag: set_observer_type_5dddf3ba
      field: observer.type
      value: firewall
  - set:
      tag: set_observer_vendor_683eb6a5
      field: observer.vendor
      value: Azure
  - set:
      tag: set_observer_product_4f4e632d
      field: observer.product
      value: "Network Firewall"

  - remove:
      tag: remove_8bf7bff7
      field:
        - json
        - azure.firewall.proto
      ignore_missing: true
  - pipeline:
      tag: pipeline_7877e1a4
      name: '{{ IngestPipeline "azure-shared-pipeline" }}'
  - set:
      tag: set_observer_name_5e6c4eea
      field: observer.name
      copy_from: azure.resource.name
      ignore_empty_value: true
  - script:
      tag: script_a3eb5add
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - set:
      tag: set_event_kind_92954dfa
      field: event.kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
  - remove:
      field:
        - json
        - _conf
        - message
      ignore_missing: true
