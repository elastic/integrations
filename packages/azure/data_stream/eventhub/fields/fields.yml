- name: azure
  type: group
  fields:
    - name: eventhub
      type: group
      fields:
        - name: category
          type: keyword
          description: |
            Log category from the parsed message envelope (`parse_message` only).
        - name: operationName
          type: keyword
          description: |
            Operation name from the parsed message envelope (`parse_message` only).
        - name: correlationId
          type: keyword
          description: |
            Correlation ID from the parsed message envelope (`parse_message` only). Also copied to `azure.correlation.id`.
        - name: tenantId
          type: keyword
          description: |
            Tenant ID from the parsed message envelope (`parse_message` only). Also copied to `azure.tenant.id`.
        - name: TenantId
          type: keyword
          description: |
            Tenant ID from the parsed message envelope, capitalised variant (`parse_message` only). Also copied to `azure.tenant.id`.
        - name: location
          type: keyword
          description: |
            Location from the parsed message envelope (`parse_message` only). Also copied to `cloud.region` when it is an Azure region.
        - name: Region
          type: keyword
          description: |
            Region from the parsed message envelope (`parse_message` only). Also copied to `cloud.region` when `location` is absent.
        - name: ResourceId
          type: keyword
          description: |
            Resource ID from the parsed message envelope, capitalised variant (`parse_message` only). Also copied to `azure.resource_id` when `resourceId` is absent.
        - name: properties
          type: group
          fields:
            - name: raw
              type: keyword
              description: |
                Raw properties as a string, if the `properties` field is a string.
- name: azure-eventhub
  type: group
  fields:
    - name: eventhub
      type: keyword
      description: |
        Event hub name.
    - name: offset
      type: long
      description: |
        Offset
    - name: enqueued_time
      type: keyword
      description: |
        The enqueued time.
    - name: partition_id
      type: keyword
      description: |
        Partition ID
    - name: consumer_group
      type: keyword
      description: |
        consumer group
    - name: sequence_number
      type: long
      description: |-
        Sequence number
# the following `geo` mappings are not allowed at root level in ECS, and are defined here for backward compatibility.
- name: geo
  type: group
  description: 'Geo fields can carry data about a specific location related to an event.

    This geolocation information can be derived from techniques such as Geo IP, or be user-supplied.'
  fields:
    - name: continent_name
      type: keyword
      description: Name of the continent.
    - name: country_iso_code
      type: keyword
      description: Country ISO code.
    - name: country_name
      type: keyword
      description: Country name.
    - name: location
      type: geo_point
      description: Longitude and latitude.
    - name: city_name
      type: keyword
      description: City name.
