---
description: Pipeline for parsing azure activity logs.
processors:
  - rename:
      tag: rename_message_to_event_original_c74b1d7e
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_azure_eventhub_2d61fe1c
      field: event.original
      target_field: azure.eventhub
  - rename:
      tag: rename_azure_eventhub_properties_to_azure_eventhub_properties_raw_f44723fa
      field: azure.eventhub.properties
      if: "ctx.azure?.eventhub?.properties instanceof String"
      target_field: azure.eventhub.properties.raw
      ignore_missing: true
      description: Rename the field to `properties.raw` to avoid parse errors when `properties` is a string.
  - date:
      tag: date_azure_eventhub_time_to_timestamp_8d35ae85
      field: azure.eventhub.time
      target_field: '@timestamp'
      ignore_failure: true
      # Order is prioritized by observed frequency for this log
      # category.
      # We expect the first format to be used in 99% of cases.
      # However, we include the other formats seen in other
      # categories as a necessary fallback.
      formats:
        - ISO8601
        - "M/d/yyyy h:mm:ss a XXX"
        - "M/d/yyyy h:mm:ss a"
        - "M/d/yyyy H:mm:ss"
        - yyyy-MM-dd'T'H:mm:ss.SSS'Z'
  - remove:
      tag: remove_azure_eventhub_time_3b0bcbd1
      field: azure.eventhub.time
      ignore_missing: true
  - rename:
      tag: rename_azure_eventhub_resourceId_to_azure_resource_id_e0335912
      field: azure.eventhub.resourceId
      target_field: azure.resource_id
      ignore_missing: true
  - rename:
      tag: rename_azure_eventhub_durationMs_to_event_duration_f7de1882
      field: azure.eventhub.durationMs
      target_field: event.duration
      ignore_missing: true
  - script:
      tag: script_7f8b9902
      lang: painless
      source: if (ctx.event.duration!= null) {ctx.event.duration = ctx.event.duration * params.param_nano;}
      params:
        param_nano: 1000000
      ignore_failure: true
  - script:
      tag: script_drops_null_empty_values_recursively_924392cb
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).size() == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - pipeline:
      tag: pipeline_azure_shared_pipeline_8653a0ad
      name: '{{ IngestPipeline "azure-shared-pipeline" }}'
      ignore_failure: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_fb774d38
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
