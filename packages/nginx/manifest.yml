format_version: 3.6.0
name: nginx_group
type: integration
title: Nginx
version: 0.1.0
description: Collect logs and metrics from Nginx.
icons:
  - src: /img/logo_nginx.svg
    title: logo nginx
    size: 32x32
    type: image/svg+xml
requires:
  integration:
    - package: nginx
      version: "^3.0.0"
    - package: nginx_otel_integ
      version: "^0.1.0"
schemas:
  otel:
    integration: nginx_otel_integ
    default: true
  ecs:
    integration: nginx
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
