format_version: 3.6.0
name: nginx_group
type: integration
title: Nginx
version: 0.1.0
description: Collect logs and metrics from Nginx.
icons:
  - src: /img/logo_nginx.svg
    title: logo nginx
    size: 32x32
    type: image/svg+xml
schemas:
  default: otel
  ecs:
    requires:
      integration:
        - package: nginx
          version: "^2.0.0"
  otel:
    requires:
      integration:
        - package: nginx_otel_integ
          version: "^1.0.0"
