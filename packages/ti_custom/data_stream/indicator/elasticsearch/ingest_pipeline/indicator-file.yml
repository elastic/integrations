---
description: Pipeline for processing file STIX patterns
processors:
  - grok:
      field: _ingest._value
      tag: grok_file_pattern
      patterns:
        - "(?i:^\\[?file:hashes\\.'?MD5'?%{SPACE}=%{SPACE}'%{DATA:_tmp.md5}'\\]?)"
        - "(?i:^\\[?file:hashes\\.'?SHA-?1'?%{SPACE}=%{SPACE}'%{DATA:_tmp.sha1}'\\]?)"
        - "(?i:^\\[?file:hashes\\.'?SHA-?256'?%{SPACE}=%{SPACE}'%{DATA:_tmp.sha256}'\\]?)"
        - "^\\[?file:name%{SPACE}=%{SPACE}'%{DATA:_tmp.filename}'\\]?"
      ignore_failure: true

  # In cases of multiple patterns, it is necessary to append all IOCs so that they are not overwritten
  - append:
      tag: append_threat_indicator_file_hash_md5_020e2187
      field: threat.indicator.file.hash.md5
      value: '{{{ _tmp.md5 }}}'
      if: ctx._tmp?.md5 != null
  - append:
      tag: append_threat_indicator_file_hash_sha1_82241ac6
      field: threat.indicator.file.hash.sha1
      value: '{{{ _tmp.sha1 }}}'
      if: ctx._tmp?.sha1 != null
  - append:
      tag: append_threat_indicator_file_hash_sha256_964f97bc
      field: threat.indicator.file.hash.sha256
      value: '{{{ _tmp.sha256 }}}'
      if: ctx._tmp?.sha256 != null
  - append:
      tag: append_threat_indicator_file_name_5697343e
      field: threat.indicator.file.name
      value: '{{{ _tmp.filename }}}'
      if: ctx._tmp?.filename != null

  - append:
      tag: append_related_hash_8b181b02
      field: related.hash
      value: '{{{ _tmp.md5 }}}'
      if: ctx._tmp?.md5 != null
      allow_duplicates: false
  - append:
      tag: append_related_hash_31ba49e4
      field: related.hash
      value: '{{{ _tmp.sha1 }}}'
      if: ctx._tmp?.sha1 != null
      allow_duplicates: false
  - append:
      tag: append_related_hash_e260962c
      field: related.hash
      value: '{{{ _tmp.sha256 }}}'
      if: ctx._tmp?.sha256 != null
      allow_duplicates: false

  - remove:
      tag: remove__tmp_cc7d8d90
      field: _tmp
      ignore_missing: true
