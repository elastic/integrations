      allow_duplicates: false

  - date:
      tag: date__tmp_not_after_to_threat_indicator_x509_not_after_e28bd451
      field: _tmp.not_after
      target_field: threat.indicator.x509.not_after
      formats:
        - "ISO8601"
        - "yyyy-MM-dd HH:mm:ssz"
      if: "ctx._tmp.not_after != null"
  - date:
      tag: date__tmp_not_before_to_threat_indicator_x509_not_before_492866d3
      field: _tmp.not_before
      target_field: threat.indicator.x509.not_before
      formats:
        - "ISO8601"
