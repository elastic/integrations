  - append:
      tag: append_threat_indicator_x509_subject_organization_450a3a8c
      field: threat.indicator.x509.subject.organization
      value: '{{{ _tmp.subject_fields.O }}}'
      if: ctx._tmp?.subject_fields?.O != null
  - append:
      tag: append_threat_indicator_x509_subject_organizational_unit_3e09f04c
      field: threat.indicator.x509.subject.organizational_unit
      value: '{{{ _tmp.subject_fields.OU }}}'
      if: ctx._tmp?.subject_fields?.OU != null
  - append:
      tag: append_threat_indicator_x509_subject_state_or_province_92e7b697
      field: threat.indicator.x509.subject.state_or_province
      value: '{{{ _tmp.subject_fields.S }}}'
      if: ctx._tmp?.subject_fields?.S != null
  - append:
      tag: append_threat_indicator_x509_subject_state_or_province_763c2735
      field: threat.indicator.x509.subject.state_or_province
      value: '{{{ _tmp.subject_fields.ST }}}'
      if: ctx._tmp?.subject_fields?.ST != null
  - append:
      tag: append_threat_indicator_x509_subject_state_or_province_abbdef40
      field: threat.indicator.x509.subject.state_or_province
      value: '{{{ _tmp.subject_fields.P }}}'
      if: ctx._tmp?.subject_fields?.P != null

  - append:
      tag: append_related_hash_843c13f4
      field: related.hash
      value: '{{{ _tmp.md5 }}}'
      if: ctx._tmp?.md5 != null
      allow_duplicates: false
  - append:
      tag: append_related_hash_5899d859
      field: related.hash
      value: '{{{ _tmp.sha1 }}}'
      if: ctx._tmp?.sha1 != null
      allow_duplicates: false
  - append:
      tag: append_related_hash_982ccbc9
      field: related.hash
      value: '{{{ _tmp.sha256 }}}'
