  - append:
      tag: append_threat_indicator_x509_issuer_state_or_province_60837de3
      field: threat.indicator.x509.issuer.state_or_province
      value: '{{{ _tmp.issuer_fields.ST }}}'
      if: ctx._tmp?.issuer_fields?.ST != null
  - append:
      tag: append_threat_indicator_x509_issuer_state_or_province_b68fba08
      field: threat.indicator.x509.issuer.state_or_province
      value: '{{{ _tmp.issuer_fields.P }}}'
      if: ctx._tmp?.issuer_fields?.P != null

  - kv:
      tag: kv__tmp_subject_to__tmp_subject_fields_8350e97f
      field: _tmp.subject
      target_field: _tmp.subject_fields
      field_split: "(?<!\\\\),"
