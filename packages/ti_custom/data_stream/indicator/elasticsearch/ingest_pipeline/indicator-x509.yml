      value: '{{{ _tmp.issuer }}}'
      if: ctx._tmp?.issuer != null
  - append:
      tag: append_threat_indicator_x509_subject_distinguished_name_b6736c07
      field: threat.indicator.x509.subject.distinguished_name
      value: '{{{ _tmp.subject }}}'
      if: ctx._tmp?.subject != null

  - kv:
      tag: kv__tmp_issuer_to__tmp_issuer_fields_a152c67c
      field: _tmp.issuer
      target_field: _tmp.issuer_fields
      field_split: "(?<!\\\\),"
      value_split: "="
      trim_key: " "
      ignore_failure: true
      if: ctx._tmp?.issuer != null

  - append:
      tag: append_threat_indicator_x509_issuer_common_name_26dd3f29
      field: threat.indicator.x509.issuer.common_name
      value: '{{{ _tmp.issuer_fields.CN }}}'
