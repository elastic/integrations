format_version: "3.4.2"
name: max
title: "Max"
version: "0.1.0"
source:
  license: "Elastic-2.0"
description: "Collect logs from Max over MQTT with Elastic Agent."
type: integration
categories:
  - custom
  - observability
conditions:
  kibana:
    version: "^8.19.0 || ^9.1.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/sample-screenshot.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/sample-logo.svg
    title: Sample logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: max
    title: Max logs
    description: Collect Max logs over MQTT.
    inputs:
      - type: mqtt
        title: Collect Max logs via MQTT
        description: Subscribe to one or more topics on an MQTT broker.
owner:
  github: elastic/integrations
  type: elastic
