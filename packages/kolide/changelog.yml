# later versions go on top
- version: "0.3.0"
  changes:
    - description: Add latest_device and latest_people transforms, which maintain a current-state index of every Kolide device and person.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21005
    - description: Add labels.is_transform_source to the device and people data streams, so transform source documents can be distinguished from transform output.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21005
- version: "0.2.1"
  changes:
    - description: Remove empty ILM policies section from the README.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20950
- version: "0.2.0"
  changes:
    - description: Add GCS input support, new deprovisioned_person, osquery_status, osquery_result, people, and request data streams, and webhook routing updates.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20108
    - description: Fix fetching events based on resolved_at, blocked and blocks_device_at fields in the issues pipeline. Update deduplication logic and @timestamp derivation.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20108
- version: "0.1.2"
  changes:
    - description: Standardize HTTP Endpoint capitalization in README file
      type: bugfix
      link: https://github.com/elastic/integrations/pull/19960
- version: "0.1.1"
  changes:
    - description: Fix the cursor handling for the audit, auth and issues data streams.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/19890
- version: "0.1.0"
  changes:
    - description: Initial release of the Kolide integration.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/19806
