# BSD timestamps omit the year. A fixed ingest time keeps @timestamp stable
# across calendar years. test-common-config.yml still supplies tz_offset when
# this file does not override it; tags and tz_offset are repeated so the
# reference clock is applied together with the shared test settings.
fields:
  "@timestamp": "2026-10-01T00:00:00.000Z"
  tags:
    - preserve_original_event
  _conf:
    tz_offset: "+0500"
