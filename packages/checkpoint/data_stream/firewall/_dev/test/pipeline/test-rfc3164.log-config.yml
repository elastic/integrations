# BSD timestamps omit the year. A fixed ingest time keeps @timestamp stable
# across calendar years. The clock is after the October samples so those lines
# stay in 2026. tags and tz_offset are repeated because this file replaces
# test-common-config.yml.
fields:
  "@timestamp": "2026-10-22T00:00:00.000Z"
  tags:
    - preserve_original_event
  _conf:
    tz_offset: "+0500"
