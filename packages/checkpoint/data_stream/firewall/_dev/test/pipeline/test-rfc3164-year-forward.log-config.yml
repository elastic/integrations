# Collector is still in December: 2026-12-31T18:58:00Z is 23:58 at +05:00.
# Jan 1 00:03:00 is five minutes later, inside the one-day skew allowance, so
# the year rolls forward to 2027. tags and tz_offset are repeated because
# this file replaces test-common-config.yml.
fields:
  "@timestamp": "2026-12-31T18:58:00.000Z"
  tags:
    - preserve_original_event
  _conf:
    tz_offset: "+0500"
