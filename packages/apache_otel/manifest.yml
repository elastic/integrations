format_version: 3.6.5
name: apache_otel
title: "Apache HTTP Server (OpenTelemetry)"
version: 1.0.0
source:
  license: "Elastic-2.0"
description: "Collect Apache HTTP Server status metrics using the OTel Collector apachereceiver, with a dashboard, alert rule templates and SLO templates."
type: integration
categories:
  - observability
  - web
  - opentelemetry
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: "basic"
# PROTOTYPE: discovery on an integration package (package-spec prototype, was content packages only).
discovery:
  datasets:
    - name: apachereceiver.otel
screenshots:
  - src: /img/apache-overview.png
    title: Overview dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/logo_apache_otel.svg
    title: Apache Logo
    size: 32x32
    type: image/svg+xml
# PROTOTYPE: receiver config is written inline in the metrics data stream
# (agent/stream/stream.yml.hbs), taken from apache_input_otel. No `requires`.
policy_templates:
  - name: apache
    title: Apache HTTP Server metrics
    description: Collect Apache HTTP Server status metrics using the OpenTelemetry Collector
    data_streams:
      - metrics
    inputs:
      - type: otelcol
        title: Apache HTTP Server Metrics
        description: Scrape Apache HTTP Server mod_status metrics using the OTel Collector apachereceiver
owner:
  github: elastic/obs-signals-integrations-team
  type: elastic
