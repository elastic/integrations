- version: "0.4.0"
  changes:
    - description: Update Elastic Managed integration documentation to the current wording and docs links.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20987
- version: "0.3.0"
  changes:
    - description: Add tags to ingest pipeline processors and add `preserve_original_event` to pipeline-level `on_failure` handlers.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20574
    - description: Stop removing `event.original` in the `indicator` data stream. It was removed before `preserve_original_event` was added to `tags`, so `pipeline_error` documents never retained the original payload.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20574
- version: "0.2.2"
  changes:
    - description: Set agentless deployment mode `release` field to `ga`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20463
- version: "0.2.1"
  changes:
    - description: Fix transform destination to use keyword for data_stream.namespace, allowing multi-namespace deployments.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20002
- version: "0.2.0"
  changes:
    - description: Use new `release` field for agentless deployment mode to establish as beta.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18552
- version: "0.1.0"
  changes:
    - description: Initial release.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18765
