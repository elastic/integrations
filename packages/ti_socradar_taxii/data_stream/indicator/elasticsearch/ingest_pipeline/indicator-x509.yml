      value: "{{{ _tmp.issuer_fields.P }}}"
      if: ctx._tmp?.issuer_fields?.P != null
      allow_duplicates: false

  - kv:
      tag: kv__tmp_subject_to__tmp_subject_fields_7e80cdf7
      field: _tmp.subject
      target_field: _tmp.subject_fields
      field_split: "(?<!\\\\),"
