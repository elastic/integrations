# Workaround for Elasticsearch not mapping ECS nested fields automatically:
# https://github.com/elastic/elasticsearch/issues/150902.
- external: ecs
  name: threat.enrichments
# Keep custom ignore_above so long URLs remain fully indexed (ecs@mappings default is 1024).
- external: ecs
  name: threat.indicator.url.full
  ignore_above: 4096
- external: ecs
  name: threat.indicator.url.original
  ignore_above: 4096
- external: ecs
  name: threat.indicator.url.query
  ignore_above: 4096
