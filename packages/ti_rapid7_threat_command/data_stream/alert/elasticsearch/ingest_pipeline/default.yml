      on_failure:
        - append:
            tag: append_error_message_ae0fed3c
            field: error.message
            value:
              - "{{{_ingest.on_failure_message}}}"
  - foreach:
      tag: foreach_rapid7_tc_alert_assets_0a3c5655
      field: rapid7.tc.alert.assets
      processor:
        rename:
          tag: rename_ingest_value_Type_to_ingest_value_type_a118b03d
          field: _ingest._value.Type
          target_field: _ingest._value.type
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_assets_3c794391
      field: rapid7.tc.alert.assets
      processor:
