      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_848f5c7f
      field: rapid7.tc.alert.details.tags
      processor:
        rename:
          tag: rename_ingest_value_CreatedBy_to_ingest_value_created_by_7f551915
          field: _ingest._value.CreatedBy
          target_field: _ingest._value.created_by
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_62f96013
      field: rapid7.tc.alert.details.tags
      processor:
        rename:
          tag: rename_ingest_value_Name_to_ingest_value_name_36acbae7
          field: _ingest._value.Name
          target_field: _ingest._value.name
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_3a97b238
      field: rapid7.tc.alert.details.tags
      processor:
        rename:
          tag: rename_ingest_value_id_to_ingest_value_id_b7091f22
          field: _ingest._value._id
          target_field: _ingest._value.id
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_68ffc112
      field: rapid7.tc.alert.details.tags
      processor:
        append:
          tag: append_tags_ddc6e4ef
          field: tags
          value: "{{{_ingest._value.name}}}"
          ignore_failure: true
          allow_duplicates: false
      ignore_failure: true
  - set:
      tag: set_event_id_10927ce9
      field: event.id
      copy_from: rapid7.tc.alert.id
      ignore_failure: true
  - set:
      tag: set_event_reference_94220629
      field: event.reference
      value: https://dashboard.ti.insight.rapid7.com/#/threat-command/alerts/?search={{{rapid7.tc.alert.id}}}
      ignore_failure: true
  - fingerprint:
      tag: fingerprint_to_id_223055b7
      fields:
        - rapid7.tc.alert.id
        - rapid7.tc.alert.update_date
      target_field: _id
      ignore_missing: true
  - remove:
      tag: remove_json_94dc55cd
      field: json
      ignore_missing: true
  - script:
      tag: script_processor_iterates_over_whole_document_99ba6cdb
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        } drop(ctx);
      ignore_failure: true
  - append:
      tag: append_event_kind_acc297e3
      field: event.kind
      value: pipeline_error
      allow_duplicates: false
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
