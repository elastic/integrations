---
description: Pipeline for processing Alerts.
processors:
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_ab1166ce
      field: event.kind
      value: alert
  - json:
      tag: json_event_original_to_json_93ceb325
      field: event.original
      target_field: json
      ignore_failure: true
  - date:
      tag: date_json_UpdateDate_to_rapid7_tc_alert_update_date_b6d8e5b2
      field: json.UpdateDate
      formats:
        - ISO8601
      target_field: rapid7.tc.alert.update_date
      if: ctx.json?.UpdateDate != null
      on_failure:
        - append:
            tag: append_error_message_ad40783c
            field: error.message
            value: "{{{_ingest.on_failure_message}}}"
  - set:
      tag: set_timestamp_13d29869
      field: "@timestamp"
      copy_from: rapid7.tc.alert.update_date
      on_failure:
        - set:
            tag: set_timestamp_682fe88c
            field: "@timestamp"
            copy_from: _ingest.timestamp
  - set:
      tag: set_event_module_a8a69217
      field: event.module
      value: ti_rapid7_threat_command
  - rename:
      tag: rename_json__id_to_rapid7_tc_alert_id_cc8f02f9
      field: json._id
      target_field: rapid7.tc.alert.id
      ignore_missing: true
  - rename:
      tag: rename_json_Assets_to_rapid7_tc_alert_assets_d24f413b
      field: json.Assets
      target_field: rapid7.tc.alert.assets
