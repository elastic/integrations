---
description: Pipeline for processing Alerts.
processors:
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_kind_39295792
      field: event.kind
      value: alert
  - json:
      tag: json_event_original_to_json_cac66847
      field: event.original
      target_field: json
      ignore_failure: true
  - date:
      tag: date_json_UpdateDate_to_rapid7_tc_alert_update_date_89809f7c
      field: json.UpdateDate
      formats:
        - ISO8601
      target_field: rapid7.tc.alert.update_date
      if: ctx.json?.UpdateDate != null
      on_failure:
        - append:
            tag: append_error_message_31ea7111
            field: error.message
            value: "{{{_ingest.on_failure_message}}}"
  - set:
      tag: set_timestamp_071af590
      field: "@timestamp"
      copy_from: rapid7.tc.alert.update_date
      on_failure:
        - set:
            tag: set_timestamp_d312dfcb
