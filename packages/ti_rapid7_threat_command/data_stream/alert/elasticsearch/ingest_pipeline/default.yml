      processor:
        rename:
          field: _ingest._value.Type
          target_field: _ingest._value.type
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_assets_7f9768f8
      field: rapid7.tc.alert.assets
      processor:
        rename:
          field: _ingest._value.Value
          target_field: _ingest._value.value
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_ed293e71
      field: rapid7.tc.alert.details.tags
      processor:
        rename:
          field: _ingest._value.CreatedBy
          target_field: _ingest._value.created_by
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_94ced92e
      field: rapid7.tc.alert.details.tags
      processor:
        rename:
          field: _ingest._value.Name
          target_field: _ingest._value.name
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_4b4bfc6b
      field: rapid7.tc.alert.details.tags
      processor:
        rename:
          field: _ingest._value._id
          target_field: _ingest._value.id
          ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_rapid7_tc_alert_details_tags_0d92d345
      field: rapid7.tc.alert.details.tags
      processor:
        append:
          field: tags
          value: "{{{_ingest._value.name}}}"
          ignore_failure: true
          allow_duplicates: false
      ignore_failure: true
  - set:
      tag: set_event_id_012ce72e
      field: event.id
      copy_from: rapid7.tc.alert.id
      ignore_failure: true
  - set:
      tag: set_event_reference_35552931
      field: event.reference
      value: https://dashboard.ti.insight.rapid7.com/#/threat-command/alerts/?search={{{rapid7.tc.alert.id}}}
      ignore_failure: true
  - fingerprint:
      tag: fingerprint_ef6c7d2e
      fields:
        - rapid7.tc.alert.id
        - rapid7.tc.alert.update_date
      target_field: _id
      ignore_missing: true
  - remove:
      tag: remove_json_29cdffdc
      field: json
      ignore_missing: true
  - script:
      tag: script_4f9a1bb0
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        } drop(ctx);
      ignore_failure: true
  - append:
      tag: append_event_kind_d2f25e35
      field: event.kind
      value: pipeline_error
      allow_duplicates: false
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
