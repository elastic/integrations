      source: |-
        boolean member(int cp, List ranges) {
          int low = 0;
          int high = ranges.size() / 2 - 1;
          while (low <= high) {
            int mid = (low + high) >>> 1;
            int start = (int) ranges.get(mid * 2);
            int end = (int) ranges.get(mid * 2 + 1);
            if (cp < start) { high = mid - 1; }
            else if (cp > end) { low = mid + 1; }
            else { return true; }
          }
          return false;
        }

        List clippedPoints(String raw) {
          List points = new ArrayList();
          int limit = raw.length() < 4096 ? raw.length() : 4096;
          for (int i = 0; i < limit; ++i) {
            int cp = (int) raw.charAt(i);
            if (cp >= 55296 && cp <= 56319) {
              if (i + 1 < limit) {
                int low = (int) raw.charAt(i + 1);
                if (low >= 56320 && low <= 57343) {
                  points.add(65536 + ((cp - 55296) << 10) + low - 56320);
                  ++i;
                }
              }
            } else if (cp < 56320 || cp > 57343) {
              points.add(cp);
            }
          }
          return points;
        }

        List loweredPoints(List points, Map unicode) {
          int n = points.size();
          boolean[] before = new boolean[n];
          boolean[] after = new boolean[n];
          boolean cased = false;
          for (int i = 0; i < n; ++i) {
            int cp = (int) points.get(i);
            before[i] = cased;
            if (!member(cp, unicode.get('ignorable'))) {
              cased = member(cp, unicode.get('cased'));
            }
          }
          cased = false;
          for (int i = n - 1; i >= 0; --i) {
            int cp = (int) points.get(i);
            after[i] = cased;
            if (!member(cp, unicode.get('ignorable'))) {
              cased = member(cp, unicode.get('cased'));
            }
          }
          List lowered = new ArrayList();
          for (int i = 0; i < n; ++i) {
            int cp = (int) points.get(i);
            if (cp == 931) {
              lowered.add(before[i] && !after[i] ? 962 : 963);
            } else {
              def mapped = unicode.get('lower').get(Integer.toString(cp));
              if (mapped == null) { lowered.add(cp); }
              else { for (def value : mapped) { lowered.add((int) value); } }
            }
          }
          return lowered;
        }

        Map extractFeatures(String raw, Map config) {
          List points = loweredPoints(clippedPoints(raw), config.get('unicode'));
          List tokens = new ArrayList();
          StringBuilder token = new StringBuilder();
          int length = 0;
          for (int i = 0; i <= points.size(); ++i) {
            int cp = i < points.size() ? (int) points.get(i) : -1;
            if (member(cp, config.get('unicode').get('word'))) {
              token.appendCodePoint(cp);
              ++length;
            } else {
              if (length >= 2) { tokens.add(token.toString()); }
              token = new StringBuilder();
              length = 0;
            }
          }
          Map result = new HashMap();
          for (int width = 1; width <= 3; ++width) {
            for (int start = 0; start + width <= tokens.size(); ++start) {
              StringBuilder gram = new StringBuilder();
              for (int j = 0; j < width; ++j) {
                if (j > 0) { gram.append(' '); }
                gram.append(tokens.get(start + j));
              }
              def feature = config.get('word').get(gram.toString());
              if (feature != null) { result.put(feature, 1.0); }
            }
          }
          return result;
        }

        for (def name : ['_ml_jb_features', '_ml_jb_inference']) {
          List stale = new ArrayList();
          for (def key : ctx.keySet()) {
            if (key == name || key.startsWith(name + '.')) { stale.add(key); }
          }
          for (def key : stale) { ctx.remove(key); }
        }
        ctx.put('_ml_jb_features', extractFeatures((String) ((Map) ctx.get('_ml_jb_candidate')).get('s'), params));
      tag: ml-instruction-override-score-features
      description: Extract the word features the model reads from the text being scored
      if: ctx._ml_jb_skip != true
  - inference:
      if: ctx._ml_jb_skip != true && !ctx['_ml_jb_features'].isEmpty()
      inference_config:
        classification:
          num_top_classes: 2
      model_id: security_ai_instruction_override_classifier_0.1
      target_field: _ml_jb_inference
      tag: ml-instruction-override-score-inference
      description: Score the features with the instruction-override model; text with no vocabulary words has no features and is not scored
  - script:
      tag: ml-instruction-override-score-record
      description: Append the text and its probability to the scores; the full text also decides whether to attribute a snippet
      if: ctx._ml_jb_skip != true && ctx._ml_jb_inference != null
      lang: painless
      params:
        threshold: 0.4120369804020901
      source: |-
        double probability = 0.0;
        for (def item : ctx['_ml_jb_inference']['top_classes']) {
          if (item['class_name'] == '1') {
            probability = ((Number) item['class_probability']).doubleValue();
          }
        }
        Map candidate = (Map) ctx['_ml_jb_candidate'];
        Map score = new HashMap();
        score.put('text', candidate.get('s'));
        score.put('kind', candidate.get('k'));
        score.put('probability', probability);
        if (candidate.get('k') == 'full') {
          double threshold = ((Number) params.threshold).doubleValue();
          ctx['_ml_jb_alert'] = probability >= threshold;
        }
        if (ctx['ml_instruction_override_scores'] == null) { ctx['ml_instruction_override_scores'] = new ArrayList(); }
        ctx['ml_instruction_override_scores'].add(score)
  - remove:
      tag: ml-instruction-override-score-cleanup
      description: Runs for every element, including skipped excerpts
      field:
        - _ml_jb_candidate
        - _ml_jb_skip
        - _ml_jb_features
        - _ml_jb_inference
      ignore_missing: true
on_failure:
  - set:
      tag: ml-instruction-override-score-failure-kind
      field: event.kind
      value: pipeline_error
  - set:
      tag: ml-instruction-override-score-failure-message
      field: error.message
      value: 'Processor {{{ _ingest.on_failure_processor_type }}} ({{{ _ingest.on_failure_processor_tag }}}) in {{{ _ingest.pipeline }}} failed: {{{ _ingest.on_failure_message }}}'
  - remove:
      tag: ml-instruction-override-score-failure-cleanup
      field:
        - _ml_jb_candidate
        - _ml_jb_skip
        - _ml_jb_features
        - _ml_jb_inference
      ignore_missing: true
  - fail:
      tag: ml-instruction-override-score-failed
      message: 'Instruction-override scoring failed closed: {{{ _ingest.on_failure_message }}} [processor_tag: {{{ _ingest.on_failure_processor_tag }}}]'
