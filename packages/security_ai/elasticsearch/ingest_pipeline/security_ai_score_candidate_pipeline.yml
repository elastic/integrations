---
description: Score one encoding candidate and keep detections at or above the threshold.
processors:
  - set:
      tag: ml_prompt_detect_copy_features
      description: Read the current candidate.
      field: _ml_candidate_features
      copy_from: "_ingest._value"

  - script:
      tag: ml_prompt_detect_nest_features
      description: Prepare the candidate features for inference.
      lang: painless
      source: |-
        ctx.f = ctx._ml_candidate_features.f;

  - inference:
      tag: ml_prompt_detect_inference
      field_map: {}
      inference_config:
        classification:
          num_top_classes: 2
      model_id: security_ai_string_encoding_classifier_0.1
      target_field: ml_b64_one_result

  - script:
      tag: ml_prompt_detect_append_score
      description: Retain positive candidates with their source and probability.
      lang: painless
      params:
        threshold: 0.1890
      source: |-
        def result = ctx.ml_b64_one_result;
        double probability = 0.0;
        if (result.top_classes != null) {
          for (def item : result.top_classes) {
            if (item.class_name == "1") {
              probability = (double) item.class_probability;
            }
          }
        }
        if (probability >= (double) params.threshold) {
          def candidate = ctx._ml_candidate_features;
          def scored = new HashMap();
          scored.probability = probability;
          scored.string = (candidate != null && candidate.s instanceof String) ? candidate.s : null;
          scored.type   = (candidate != null && candidate.t instanceof String) ? candidate.t : "encoding";
          scored.src    = (candidate != null && candidate.src instanceof String) ? candidate.src : "input_messages";
          if (ctx.ml_b64_scores == null) { ctx.ml_b64_scores = new ArrayList(); }
          ctx.ml_b64_scores.add(scored);
        }
        ctx.remove('f');
        ctx.remove('_ml_candidate_features');
        ctx.remove('ml_b64_one_result');
on_failure:
  - remove:
      field:
        - _ml_candidate_features
        - ml_b64_one_result
        - f
      ignore_missing: true
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: >-
        {{{ _ingest.on_failure_message }}} [pipeline: {{{ _ingest.pipeline }}},
        processor_type: {{{ _ingest.on_failure_processor_type }}},
        processor_tag: {{{ _ingest.on_failure_processor_tag }}}]
