---
description: Score one refusal fragment and keep the strongest snippet.
processors:
  - set:
      tag: ml_prompt_detect_refusal_sentence_copy
      description: Copy the current sentence from the foreach element.
      field: _ml_sent
      copy_from: "_ingest._value"

  - script:
      tag: ml_prompt_detect_refusal_sentence_features
      description: Expose the sentence features as root fields for inference and record their names.
      lang: painless
      source: |-
        Map sent = (Map) ctx._ml_sent;
        List fired = new ArrayList();
        for (def entry : sent.entrySet()) {
          String k = (String) entry.getKey();
          if (!k.equals('text')) {
            ctx[k] = entry.getValue();
            fired.add(k);
          }
        }
        ctx._ml_sent_fired = fired;

  - inference:
      tag: ml_prompt_detect_refusal_sentence_infer
      description: Run the refusal classifier on the sentence features.
      field_map: {}
      inference_config:
        classification:
          num_top_classes: 2
      model_id: security_ai_refusal_detection_classifier_0.1
      target_field: ml_sentence_result

  - script:
      tag: ml_prompt_detect_refusal_sentence_score
      description: Keep the highest-scoring sentence and remove the temporary fields.
      lang: painless
      source: |-
        double prob = 0.0;
        def result = ctx.ml_sentence_result;
        if (result instanceof Map && ((Map) result).top_classes instanceof List) {
          for (def item : (List) ((Map) result).top_classes) {
            if (((Map) item).class_name == '1') {
              prob = ((Number) ((Map) item).class_probability).doubleValue();
              break;
            }
          }
        }
        def cur = ctx._ml_top_score;
        double topScore = (cur instanceof Number) ? ((Number) cur).doubleValue() : -1.0;
        if (prob > topScore) {
          ctx._ml_top_score = prob;
          ctx._ml_top_text  = (String) ((Map) ctx._ml_sent).text;
          def k = ((Map) ctx._ml_sent).kind;
          ctx._ml_top_kind  = k instanceof String ? (String) k : 'sentence';
        }
        for (def k : (List) ctx._ml_sent_fired) {
          ctx.remove((String) k);
        }
        ctx.remove('_ml_sent_fired');
        ctx.remove('ml_sentence_result');
        ctx.remove('_ml_sent');

on_failure:
  - script:
      tag: ml_prompt_detect_refusal_sentence_failure_fields
      description: Remove the root fields copied from the failed sentence before the tracking list is dropped.
      lang: painless
      if: ctx._ml_sent_fired instanceof List
      source: |-
        for (def k : (List) ctx._ml_sent_fired) {
          ctx.remove((String) k);
        }
  - remove:
      field:
        - _ml_sent
        - _ml_sent_fired
        - ml_sentence_result
        - _ml_top_kind
      ignore_missing: true
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: >-
        {{{ _ingest.on_failure_message }}} [pipeline: {{{ _ingest.pipeline }}},
        processor_type: {{{ _ingest.on_failure_processor_type }}},
        processor_tag: {{{ _ingest.on_failure_processor_tag }}}]
