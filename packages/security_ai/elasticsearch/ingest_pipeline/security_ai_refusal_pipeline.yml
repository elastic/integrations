---
description: Detect whether the assistant response is a refusal.
processors:
  - script:
      tag: ml-prompt-detect-refusal-v-resolve-text
      description: Clip the completion text resolved by the entry pipeline
      lang: painless
      if: ctx._ml_completion_text instanceof String
      source: |-
        String text = (String) ctx['_ml_completion_text'];
        ctx['ml_response_text'] = text.length() > 8000 ? text.substring(0, 8000) : text;
  - script:
      tag: ml-prompt-detect-refusal-v-featurize
      description: Build fixed-vocabulary word n-gram features from response text
      lang: painless
      if: ctx.ml_response_text != null
      params:
        negation_keywords:
          - cannot
          - cant
          - wont
          - unable
          - decline
          - refuse
          - must not
          - am not
          - never
          - prohibited
          - forbidden
          - sorry
          - apologize
          - apologise
          - regret
          - inappropriate
          - harmful
          - illegal
          - will not
          - not able
        multilingual_stop_words:
          - la
          - le
          - les
          - de
          - du
          - des
          - un
          - une
          - se
          - es
          - en
          - el
          - los
          - las
          - da
          - na
          - di
          - il
          - lo
          - gli
          - zu
          - im
          - um
          - ou
          - ll
