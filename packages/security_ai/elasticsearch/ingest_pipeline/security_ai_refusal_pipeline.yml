      source: |-
        String text = ((String) ctx.ml_response_text).toLowerCase();
        StringBuilder _apos = new StringBuilder();
        int _ai = 0;
        while (_ai < text.length()) {
          int _cp = text.codePointAt(_ai);
          _ai += Character.charCount(_cp);
          if (_cp != 39 && _cp != 96 && _cp != 8216 && _cp != 8217 && _cp != 700) {
            _apos.appendCodePoint(_cp);
          }
        }
        text = _apos.toString();
        List azRuns = new ArrayList();
        StringBuilder run = new StringBuilder();
        boolean runIsPureAz = true;
        int ci = 0;
        while (ci < text.length()) {
          int cp = text.codePointAt(ci);
          ci += Character.charCount(cp);
          boolean isWordChar = Character.isLetterOrDigit(cp) || cp == 95;
          if (isWordChar) {
            if (run.length() == 0) {
              runIsPureAz = true;
            }
            if (!(cp >= 97 && cp <= 122)) {
              runIsPureAz = false;
            }
            run.appendCodePoint(cp);
          } else if (run.length() > 0) {
            if (runIsPureAz) {
              azRuns.add(run.toString());
            }
            run = new StringBuilder();
          }
        }
        if (run.length() > 0 && runIsPureAz) {
          azRuns.add(run.toString());
        }
        StringBuilder paddedSb = new StringBuilder(" ");
        for (Object o : azRuns) {
          paddedSb.append((String) o).append(' ');
        }
        String padded = paddedSb.toString();
        boolean hasNeg = false;
        for (def kw : params.negation_keywords) {
          if (padded.contains(" " + (String) kw + " ")) {
            hasNeg = true;
            break;
          }
        }
        List filtered = new ArrayList();
        for (Object o : azRuns) {
          String t = (String) o;
          if ((t.length() > 2 || (t.length() == 2 && t.equals("no"))) && !params.multilingual_stop_words.containsKey(t)) {
            filtered.add(t);
          }
        }
        int nToks = filtered.size();
        if (nToks > 1000) nToks = 1000;
        List fired = new ArrayList();
        Set seen = new HashSet();

        for (int n = 1; n <= 3; n++) {
          for (int i = 0; i <= nToks - n; i++) {
            StringBuilder gram = new StringBuilder();
            for (int j = i; j < i + n; j++) {
              if (j > i) gram.append(' ');
              gram.append((String) filtered.get(j));
            }
            String gramStr = gram.toString();
            if (!seen.contains(gramStr)) {
              seen.add(gramStr);
              Integer idx = (Integer) params.vocab.get(gramStr);
              if (idx != null) {
                String fkey = "f" + Integer.toString(idx);
                ctx[fkey] = 1;
                fired.add(fkey);
              }
            }
          }
        }

        if (hasNeg) {
          ctx.has_negation = 1;
          fired.add("has_negation");
        }

        ctx._ml_refusal_fired = fired;
        ctx._ml_refusal_token_count = nToks;

  - inference:
      tag: ml_prompt_detect_refusal_v_inference
      if: ctx.ml_response_text != null && (ctx._ml_refusal_token_count instanceof Integer) && ctx._ml_refusal_token_count >= 3
      field_map: {}
      inference_config:
        classification:
          num_top_classes: 2
      model_id: security_ai_refusal_detection_classifier_0.1
      target_field: ml_refusal_result
  - script:
      tag: ml_prompt_detect_refusal_v_promote
      description: Write refusal probability and flag; clean up all feature and temp fields.
      lang: painless
      params:
        threshold: 0.8095
      source: |-
        def result = ctx.ml_refusal_result;
        boolean hasResult = result != null && result.top_classes != null;
        double probability = 0.0;
        if (hasResult) {
          for (def item : result.top_classes) {
            if (item.class_name == "1") {
              probability = ((Number) item.class_probability).doubleValue();
            }
          }
        }
        if (hasResult) {
          if (ctx.security_ai == null) {
            ctx.security_ai = new HashMap();
          }
          Map score = new HashMap();
          score.blob_probability = probability;
          score.probability = probability;
          score.is_refusal = probability >= params.threshold;
          Map refusal = new HashMap();
          refusal.output_messages = score;
          refusal.model_version = ctx._ml_model_version instanceof String ? (String) ctx._ml_model_version : '0.0.1';
          ctx.security_ai.refusal = refusal;
        }
        def fired = ctx._ml_refusal_fired;
        if (fired != null) {
          for (def key : fired) {
            ctx.remove((String) key);
          }
        }
        ctx.remove('_ml_refusal_fired');
        ctx.remove('ml_refusal_result');
  - script:
      tag: ml_prompt_detect_refusal_v_safeguards_flag
      description: Detect Anthropic safeguards-flag phrases and extract the containing sentence.
      lang: painless
      if: ctx.ml_response_text instanceof String
      source: |-
        String text = (String) ctx.ml_response_text;
        String lower = text.toLowerCase();
        int matchPos = -1;
        int idx1 = lower.indexOf("safeguards flag");
        int idx2 = lower.indexOf("safeguard flag");
        if (idx1 >= 0 && (idx2 < 0 || idx1 <= idx2)) {
          matchPos = idx1;
        } else if (idx2 >= 0) {
          matchPos = idx2;
        }
        if (matchPos < 0) return;
        int sentStart = matchPos;
        while (sentStart > 0) {
          int cp = text.codePointAt(sentStart - 1);
          if (cp == 46 || cp == 33 || cp == 63 || cp == 10 || cp == 13) break;
          sentStart--;
        }
        int sentEnd = matchPos;
        while (sentEnd < text.length()) {
          int cp = text.codePointAt(sentEnd);
          sentEnd++;
          if (cp == 46 || cp == 33 || cp == 63 || cp == 10 || cp == 13) break;
        }
        String sentence = text.substring(sentStart, sentEnd).trim();
        if (ctx.security_ai == null) ctx.security_ai = new HashMap();
        if (ctx.security_ai.refusal == null) ctx.security_ai.refusal = new HashMap();
        Map refusal = (Map) ctx.security_ai.refusal;
        if (refusal.output_messages == null) refusal.output_messages = new HashMap();
        if (!(refusal.model_version instanceof String)) {
          refusal.model_version = ctx._ml_model_version instanceof String ? (String) ctx._ml_model_version : '0.0.1';
        }
        ((Map) refusal.output_messages).safeguards_flag_sentence = sentence;
  - script:
      tag: ml_prompt_detect_refusal_v_content_filter_flag
      description: Detect Amazon model content-filter block phrases and extract the containing sentence.
      lang: painless
      if: ctx.ml_response_text instanceof String
      source: |-
        String text = (String) ctx.ml_response_text;
        String lower = text.toLowerCase();
        boolean hasBlocked = lower.indexOf("blocked") >= 0;
        int cfIdx = lower.indexOf("content filters");
        if (cfIdx < 0) cfIdx = lower.indexOf("content filter");
        if (!hasBlocked || cfIdx < 0) return;
        int matchPos = cfIdx;
        int sentStart = matchPos;
        while (sentStart > 0) {
          int cp = text.codePointAt(sentStart - 1);
          if (cp == 46 || cp == 33 || cp == 63 || cp == 10 || cp == 13) break;
          sentStart--;
        }
        int sentEnd = matchPos;
        while (sentEnd < text.length()) {
          int cp = text.codePointAt(sentEnd);
          sentEnd++;
          if (cp == 46 || cp == 33 || cp == 63 || cp == 10 || cp == 13) break;
        }
        String sentence = text.substring(sentStart, sentEnd).trim();
        if (ctx.security_ai == null) ctx.security_ai = new HashMap();
        if (ctx.security_ai.refusal == null) ctx.security_ai.refusal = new HashMap();
        Map refusal = (Map) ctx.security_ai.refusal;
        if (refusal.output_messages == null) refusal.output_messages = new HashMap();
        if (!(refusal.model_version instanceof String)) {
          refusal.model_version = ctx._ml_model_version instanceof String ? (String) ctx._ml_model_version : '0.0.1';
        }
        ((Map) refusal.output_messages).safeguards_flag_sentence = sentence;
