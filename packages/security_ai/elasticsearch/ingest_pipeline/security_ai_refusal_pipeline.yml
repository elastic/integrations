          StringBuilder paddedSb2 = new StringBuilder(" ");
          for (Object o : azRuns) {
            paddedSb2.append((String) o).append(' ');
          }
          String padded2 = paddedSb2.toString();
          boolean hasNeg = false;
          for (def kw : negSet) {
            if (padded2.contains(" " + (String) kw + " ")) { hasNeg = true; break; }
          }

          List filtered = new ArrayList();
          for (Object o : azRuns) {
            String t = (String) o;
            if ((t.length() > 2 || (t.length() == 2 && t.equals("no"))) && !stopSet.contains(t)) {
              filtered.add(t);
            }
          }
          int nToks = filtered.size();
          if (nToks > 1000) nToks = 1000;
          Set seen = new HashSet();
          int vocabHits = 0;
          for (int n = 1; n <= 3; n++) {
            for (int i = 0; i <= nToks - n; i++) {
              StringBuilder gram = new StringBuilder();
              for (int j = i; j < i + n; j++) {
                if (j > i) gram.append(' ');
                gram.append((String) filtered.get(j));
              }
              String gramStr = gram.toString();
              if (!seen.contains(gramStr)) {
                seen.add(gramStr);
                Object idxObj = vocabMap.get(gramStr);
                if (idxObj != null) {
                  sentObj.put('f' + Integer.toString(((Number) idxObj).intValue()), 1);
                  vocabHits++;
                }
              }
            }
          }
          if (vocabHits < minTokens) return null;
          if (hasNeg) sentObj.put('has_negation', 1);
          return sentObj;
        }

        Map vocabMap = (Map) ctx['_ml_vocab_map'];
        Set negSet  = new HashSet(params.negation_keywords);
        Set stopSet = new HashSet(params.multilingual_stop_words);

        int minChars    = ((Number) params.min_sentence_chars).intValue();
        int minTokens   = ((Number) params.min_tokens).intValue();
        int maxSents    = ((Number) params.max_sentences).intValue();
        int windowChars = ((Number) params.window_chars).intValue();
        int strideChars = ((Number) params.stride_chars).intValue();
        String fullText = (String) ctx['ml_response_text'];
        List rawSentences = new ArrayList();
        int start = 0;
        for (int i = 0; i < fullText.length(); i++) {
          int cp = fullText.codePointAt(i);
          if (cp == 46 || cp == 33 || cp == 63) {
            boolean atBoundary = (i + 1 >= fullText.length()) || (fullText.codePointAt(i + 1) == 32);
            if (atBoundary) {
              String s = fullText.substring(start, i + 1).trim();
              if (s.length() >= minChars) rawSentences.add(s);
              start = i + 2;
              i++;
            }
          }
        }
        if (start < fullText.length()) {
          String s = fullText.substring(start).trim();
          if (s.length() >= minChars) rawSentences.add(s);
        }

        int nSents = rawSentences.size();
        if (nSents == 0) return;

        List result = new ArrayList();
        int added = 0;
        for (int si = 0; si < nSents && added < maxSents; si++) {
          String sentRaw = (String) rawSentences.get(si);

          if (sentRaw.length() > windowChars) {
            int wStart = 0;
            Set emittedEnds = new HashSet();
            while (added < maxSents) {
              int wEnd = wStart + windowChars;
              if (wEnd > sentRaw.length()) wEnd = sentRaw.length();
              String chunk = sentRaw.substring(wStart, wEnd);
              if (chunk.length() >= minChars && !emittedEnds.contains(wEnd)) {
                Map w = featurizeSentence(chunk, vocabMap, negSet, stopSet, minTokens);
                if (w != null) { w.put('kind', 'window'); result.add(w); added++; }
                emittedEnds.add(wEnd);
              }
              if (wEnd >= sentRaw.length()) break;
              wStart += strideChars;
              if (wStart + windowChars > sentRaw.length()) {
                int tailStart = sentRaw.length() - windowChars;
                wStart = tailStart > 0 ? tailStart : 0;
              }
            }
          } else {
            Map s = featurizeSentence(sentRaw, vocabMap, negSet, stopSet, minTokens);
            if (s != null) { s.put('kind', 'sentence'); result.add(s); added++; }
          }
        }
        if (!result.isEmpty()) ctx['_ml_sentences'] = result;
  - foreach:
      tag: ml-prompt-detect-refusal-v-sentence-infer
      if: "ctx._ml_sentences instanceof List && !ctx._ml_sentences.isEmpty()"
      field: _ml_sentences
      ignore_missing: true
      processor:
        pipeline:
          name: '{{ IngestPipeline "security_ai_refusal_sentence_scorer" }}'
  - script:
      tag: ml-prompt-detect-refusal-v-sentence-top
      description: >-
        Write top_snippet and apply the calibrated long-message window threshold
      if: "ctx._ml_top_text instanceof String && ctx._ml_sentences instanceof List"
      lang: painless
      params:
        window_threshold: 0.9988392509458093
      source: |-
        int count = ((List) ctx['_ml_sentences']).size();
        double topProb = ((Number) ctx['_ml_top_score']).doubleValue();
        Map topSnippet = new HashMap();
        topSnippet.put('text',              (String) ctx['_ml_top_text']);
        topSnippet.put('probability',       topProb);
        topSnippet.put('kind',              ctx['_ml_top_kind'] instanceof String ? (String) ctx['_ml_top_kind'] : 'sentence');
        topSnippet.put('candidates_scored', count);
        if (ctx['security_ai'] == null) {
          ctx['security_ai'] = new HashMap();
        }
        if (((Map) ctx['security_ai']).get('refusal') == null) {
          ((Map) ctx['security_ai']).put('refusal', new HashMap());
        }
        Map refusal = (Map) ((Map) ctx['security_ai']).get('refusal');
        if (refusal.get('output_messages') == null) {
          refusal.put('output_messages', new HashMap());
        }
        if (!(refusal.get('model_version') instanceof String)) {
          refusal.put('model_version', ctx['_ml_model_version'] instanceof String ? (String) ctx['_ml_model_version'] : '0.0.1');
        }
        Map score = (Map) refusal.get('output_messages');
        score.put('top_snippet', topSnippet);

        def blobProbObj = score.get('blob_probability');
        double blobProb = blobProbObj instanceof Number ? ((Number) blobProbObj).doubleValue() : 0.0;
        score.put('probability', blobProb);
        boolean windowRefusal = ctx.ml_response_text.length() > 1024
            && topProb >= params.window_threshold;
        score.put('is_refusal', score.get('is_refusal') == true || windowRefusal);

        ctx.remove('_ml_sentences');
        ctx.remove('_ml_top_score');
        ctx.remove('_ml_top_text');
        ctx.remove('_ml_top_kind');

  - remove:
      tag: ml-prompt-detect-refusal-v-cleanup
      field:
        - ml_response_text
        - _ml_vocab_map
        - _ml_refusal_token_count
        - _ml_sentences
        - _ml_top_score
        - _ml_top_text
        - _ml_top_kind
      ignore_missing: true

on_failure:
  - script:
      tag: ml-prompt-detect-refusal-v-failure-cleanup
      description: Best-effort removal of all feature fields on pipeline failure
      lang: painless
      source: |-
        def fired = ctx['_ml_refusal_fired'];
        if (fired != null) {
          for (def key : fired) {
            ctx.remove((String) key);
          }
        }
        ctx.remove('_ml_refusal_fired');
      ignore_failure: true
  - remove:
      field:
        - ml_response_text
        - ml_refusal_result
        - _ml_vocab_map
        - _ml_sentences
        - _ml_top_score
        - _ml_top_text
        - _ml_top_kind
        - _ml_refusal_token_count
        - _ml_sent
        - _ml_sent_fired
        - ml_sentence_result
      ignore_missing: true
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: >-
        {{{ _ingest.on_failure_message }}} [pipeline: {{{ _ingest.pipeline }}},
        processor_type: {{{ _ingest.on_failure_processor_type }}},
        processor_tag: {{{ _ingest.on_failure_processor_tag }}}]
