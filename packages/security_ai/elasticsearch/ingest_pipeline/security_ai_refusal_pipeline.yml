          int cp = fullText.codePointAt(i);
          if (cp == 46 || cp == 33 || cp == 63) {
            boolean atBoundary = (i + 1 >= fullText.length()) || (fullText.codePointAt(i + 1) == 32);
            if (atBoundary) {
              String s = fullText.substring(start, i + 1).trim();
              if (s.length() >= minChars) rawSentences.add(s);
              start = i + 2;
              i++;
            }
          }
        }
        if (start < fullText.length()) {
          String s = fullText.substring(start).trim();
          if (s.length() >= minChars) rawSentences.add(s);
        }

        int nSents = rawSentences.size();
        if (nSents == 0) return;

        List result = new ArrayList();
        int added = 0;
        for (int si = 0; si < nSents && added < maxSents; si++) {
          String sentRaw = (String) rawSentences.get(si);

          if (sentRaw.length() > windowChars) {
            int wStart = 0;
            Set emittedEnds = new HashSet();
            while (added < maxSents) {
              int wEnd = wStart + windowChars;
              if (wEnd > sentRaw.length()) wEnd = sentRaw.length();
              String chunk = sentRaw.substring(wStart, wEnd);
              if (chunk.length() >= minChars && !emittedEnds.contains(wEnd)) {
                Map w = featurizeSentence(chunk, params.vocab, params.negation_keywords, params.multilingual_stop_words, minTokens);
                if (w != null) { w.kind = 'window'; result.add(w); added++; }
                emittedEnds.add(wEnd);
              }
              if (wEnd >= sentRaw.length()) break;
              wStart += strideChars;
              if (wStart + windowChars > sentRaw.length()) {
                int tailStart = sentRaw.length() - windowChars;
                wStart = tailStart > 0 ? tailStart : 0;
              }
            }
          } else {
            Map s = featurizeSentence(sentRaw, params.vocab, params.negation_keywords, params.multilingual_stop_words, minTokens);
            if (s != null) { s.kind = 'sentence'; result.add(s); added++; }
          }
        }
        if (!result.isEmpty()) ctx._ml_sentences = result;
  - foreach:
      tag: ml_prompt_detect_refusal_v_sentence_infer
      if: "ctx._ml_sentences instanceof List && !ctx._ml_sentences.isEmpty()"
      field: _ml_sentences
      ignore_missing: true
      processor:
        pipeline:
          name: '{{ IngestPipeline "security_ai_refusal_sentence_scorer" }}'
  - script:
      tag: ml_prompt_detect_refusal_v_sentence_top
      description: >-
        Write top_snippet and apply the calibrated long-message window threshold.
      if: "ctx._ml_top_text instanceof String && ctx._ml_sentences instanceof List"
      lang: painless
      params:
        window_threshold: 0.9988392509458093
      source: |-
        int count = ((List) ctx._ml_sentences).size();
        double topProb = ((Number) ctx._ml_top_score).doubleValue();
        Map topSnippet = new HashMap();
        topSnippet.text = (String) ctx._ml_top_text;
        topSnippet.probability = topProb;
        topSnippet.kind = ctx._ml_top_kind instanceof String ? (String) ctx._ml_top_kind : 'sentence';
        topSnippet.candidates_scored = count;
        if (ctx.security_ai == null) {
          ctx.security_ai = new HashMap();
        }
        if (((Map) ctx.security_ai).refusal == null) {
          ((Map) ctx.security_ai).refusal = new HashMap();
        }
        Map refusal = (Map) ((Map) ctx.security_ai).refusal;
        if (refusal.output_messages == null) {
          refusal.output_messages = new HashMap();
        }
        if (!(refusal.model_version instanceof String)) {
          refusal.model_version = ctx._ml_model_version instanceof String ? (String) ctx._ml_model_version : '0.0.1';
        }
        Map score = (Map) refusal.output_messages;
        score.top_snippet = topSnippet;

        def blobProbObj = score.blob_probability;
        double blobProb = blobProbObj instanceof Number ? ((Number) blobProbObj).doubleValue() : 0.0;
        score.probability = blobProb;
        boolean windowRefusal = ctx.ml_response_text.length() > 1024
            && topProb >= params.window_threshold;
        score.is_refusal = score.is_refusal == true || windowRefusal;

        ctx.remove('_ml_sentences');
        ctx.remove('_ml_top_score');
        ctx.remove('_ml_top_text');
        ctx.remove('_ml_top_kind');

  - remove:
      tag: ml_prompt_detect_refusal_v_cleanup
      field:
        - ml_response_text
        - _ml_refusal_token_count
        - _ml_sentences
        - _ml_top_score
        - _ml_top_text
        - _ml_top_kind
      ignore_missing: true

on_failure:
  - script:
      tag: ml_prompt_detect_refusal_v_failure_cleanup
      description: Best-effort removal of all feature fields on pipeline failure.
      lang: painless
      source: |-
        def fired = ctx._ml_refusal_fired;
        if (fired != null) {
          for (def key : fired) {
            ctx.remove((String) key);
          }
        }
        ctx.remove('_ml_refusal_fired');
      ignore_failure: true
  - remove:
      field:
        - ml_response_text
        - ml_refusal_result
        - _ml_sentences
        - _ml_top_score
        - _ml_top_text
        - _ml_top_kind
        - _ml_refusal_token_count
        - _ml_sent
        - _ml_sent_fired
        - ml_sentence_result
      ignore_missing: true
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: >-
        {{{ _ingest.on_failure_message }}} [pipeline: {{{ _ingest.pipeline }}},
        processor_type: {{{ _ingest.on_failure_processor_type }}},
        processor_tag: {{{ _ingest.on_failure_processor_tag }}}]
