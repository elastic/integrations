---
description: Pipeline for processing container object.
processors:
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_networks_gateway_ip
      processor:
        convert:
          field: _ingest._value.gateway_ip
          tag: convert_container_networks_gateway_ip_to_ip
          type: ip
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_gateway_ip
                field: _ingest._value.gateway_ip
                ignore_missing: true
            - append:
                tag: append_error_message
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_network
      processor:
        append:
          field: related.ip
          tag: append_related_ip_from_gateway_ip
          value: '{{{_ingest._value.gateway_ip}}}'
          allow_duplicates: false
          if: ctx.ses?.container?.networks != null
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_networks_ipv4
      processor:
        convert:
          field: _ingest._value.ipv4
          tag: convert_container_networks_ipv4_to_ip
          type: ip
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_ipv4
                field: _ingest._value.ipv4
                ignore_missing: true
            - append:
                tag: append_error_message_0100d868
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_network_c6626c1d
      processor:
        append:
          field: related.ip
          tag: append_related_ip_from_ipv4
          value: '{{{_ingest._value.ipv4}}}'
          allow_duplicates: false
          if: ctx.ses?.container?.networks != null
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_networks_ipv6
      processor:
        convert:
          field: _ingest._value.ipv6
          tag: convert_container_networks_ipv6_to_ip
          type: ip
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_ipv6
                field: _ingest._value.ipv6
                ignore_missing: true
            - append:
                tag: append_error_message_09bf0d76
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_network_9917b15d
      processor:
        append:
          field: related.ip
          tag: append_related_ip_from_ipv6
          value: '{{{_ingest._value.ipv6}}}'
          allow_duplicates: false
          if: ctx.ses?.container?.networks != null
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_networks_is_public
      processor:
        convert:
          field: _ingest._value.is_public
          tag: convert_container_networks_is_public_to_boolean
          type: boolean
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_is_public
                field: _ingest._value.is_public
                ignore_missing: true
            - append:
                tag: append_error_message_20bbe9c7
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_networks_rep_score_id
      processor:
        convert:
          field: _ingest._value.rep_score_id
          tag: convert_container_networks_rep_score_id_to_string
          type: string
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_rep_score_id
                field: _ingest._value.rep_score_id
                ignore_missing: true
            - append:
                tag: append_error_message_2cf1a963
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: ses.container.networks
      if: ctx.ses?.container?.networks instanceof List
      tag: foreach_container_networks_type_id
      processor:
        convert:
          field: _ingest._value.type_id
          tag: convert_container_networks_type_id_to_string
          type: string
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_type_id
                field: _ingest._value.type_id
                ignore_missing: true
            - append:
                tag: append_error_message_6762982c
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
on_failure:
  - append:
      tag: append_error_message_ef8d45df
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
