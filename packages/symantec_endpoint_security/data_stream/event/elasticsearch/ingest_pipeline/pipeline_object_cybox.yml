      if: ctx.ses?.cybox?.files instanceof List

      lang: painless
      source: >-
        for (int i = 0; i < ctx.ses.cybox.files.length; i++) {
          def file = ctx.ses.cybox.files[i];
          if (file.signature_value_ids == null || !file.containsKey('signature_value_ids')) {
            continue;
          }
          def new_ids = [];
          for (int j = 0; j < file.signature_value_ids.length; j++) {
            def value_id = file.signature_value_ids[j];
            if (value_id != null) {
              new_ids.add(value_id.toString());
            }
          }
          if (new_ids.length != 0) {
            file.signature_value_ids = new_ids;
          }
        }
