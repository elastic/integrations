      tag: script_to_add_file_attributes_58dbe524
      if: ctx.ses?.cybox?.files instanceof List
      params:
        '1': archive
        '2': compressed
        '3': directory
        '4': encrypted
        '5': hidden
        '8': readonly
        '11': system
        '16': execute
      lang: painless
      source: >-
        def var = new HashSet();
          if (ctx.file != null && ctx.file.attributes != null) {
              var = ctx.file.attributes;
          } else {
            if (ctx.file == null)
            {
              ctx.file = new HashMap();
            }
          }
        for (def file : ctx.ses.cybox.files) {
          if (file.attribute_ids == null) {
            continue;
          }
          for (def id : file.attribute_ids) {
            def type = params[id.toString()];
            if (type != null) {
              var.add(type);
            }
          }
        }
        ctx.file.put('attributes', var)
