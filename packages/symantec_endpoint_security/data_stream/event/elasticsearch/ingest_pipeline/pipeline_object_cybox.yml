  - script:
      description: Convert attribute ids to strings
      tag: script_to_convert_attribute_ids_46e88be6
      if: ctx.ses?.cybox?.files instanceof List

      lang: painless
      source: >-
          for (int i = 0; i < ctx.ses.cybox.files.length; i++) {
            def file = ctx.ses.cybox.files[i];
            if (file.attribute_ids == null || !file.containsKey('attribute_ids')) {
              continue;
            }
            def new_ids = [];
            for (int j = 0; j < file.attribute_ids.length; j++) {
              if (file.attribute_ids[j] != null) {
                new_ids.add(file.attribute_ids[j].toString());
              }
            }
            if (new_ids.length != 0) {
              file.attribute_ids = new_ids;
            }
          }

      on_failure:
        - append:
            tag: append_error_message_283f91d0
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

