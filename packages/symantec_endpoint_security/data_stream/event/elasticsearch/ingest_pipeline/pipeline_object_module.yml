        '2': Directory
        '3': Hard Link
        '4': Mount
        '5': Node
        '6': Symbolic Link
        '7': Named Pipe
        '8': Socket
        '9': Device
        '10': Email
        '11': Memory File
        '12': File in container
      lang: painless
      source: >-
        def obj = ctx.ses.module.type_id;
        
        if (params.containsKey(obj.toString())) {
          def type = params.get(obj.toString());
          ctx.ses.module.type_value = type
