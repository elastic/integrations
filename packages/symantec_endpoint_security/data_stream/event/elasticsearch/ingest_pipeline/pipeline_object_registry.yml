---
description: Pipeline for processing registry object.
processors:
  - convert:
      field: ses.reg_key.is_system
      tag: convert_reg_key_is_system_to_boolean
      type: boolean
      if: ctx.ses?.reg_key?.is_system != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_84527b53
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_key_is_system_dff872f1
            field: ses.reg_key.is_system
            ignore_missing: true
  - date:
      field: ses.reg_key.last_write
      tag: date_reg_key_last_write
      target_field: ses.reg_key.last_write
      formats:
        - UNIX_MS
        - ISO8601
      if: ctx.ses?.reg_key?.last_write != null && ctx.ses.reg_key.last_write != ''
      on_failure:
        - append:
            tag: append_error_message_69f60134
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_key_last_write_e56d9862
            field: ses.reg_key.last_write
            ignore_missing: true
  - set:
      field: registry.path
      tag: set_registry_path_from_reg_key_path
      copy_from: ses.reg_key.path
      ignore_empty_value: true
  - convert:
      field: ses.reg_key_result.is_system
      tag: convert_reg_key_result_is_system_to_boolean
      type: boolean
      if: ctx.ses?.reg_key_result?.is_system != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_e1478cd3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_key_result_is_system_2617aa35
            field: ses.reg_key_result.is_system
            ignore_missing: true
  - date:
      field: ses.reg_key_result.last_write
      tag: date_reg_key_result_last_write
      target_field: ses.reg_key_result.last_write
      formats:
        - UNIX_MS
        - ISO8601
      if: ctx.ses?.reg_key_result?.last_write != null && ctx.ses.reg_key_result.last_write != ''
      on_failure:
        - append:
            tag: append_error_message_68ede6ce
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_key_result_last_write_83b8c688
            field: ses.reg_key_result.last_write
            ignore_missing: true
  - set:
      field: registry.path
      tag: set_registry_path_from_reg_value_path
      copy_from: ses.reg_value.path
      ignore_empty_value: true
  - set:
      field: registry.value
      tag: set_registry_value_from_reg_value_name
      copy_from: ses.reg_value.name
      ignore_empty_value: true
  - set:
      field: registry.data.bytes
      tag: set_registry_data_bytes_from_reg_value_data
      copy_from: ses.reg_value.data
      ignore_empty_value: true
  - convert:
      field: ses.reg_value.is_default_value
      tag: convert_reg_value_is_default_value_to_boolean
      type: boolean
      if: ctx.ses?.reg_value?.is_default_value != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_0bb5cd9b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_is_default_value_96e65f1f
            field: ses.reg_value.is_default_value
            ignore_missing: true
  - convert:
      field: ses.reg_value.is_system
      tag: convert_reg_value_is_system_to_boolean
      type: boolean
      if: ctx.ses?.reg_value?.is_system != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_1c43970b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_is_system_508dd163
            field: ses.reg_value.is_system
            ignore_missing: true
  - date:
      field: ses.reg_value.last_write
      tag: date_reg_value_last_write
      target_field: ses.reg_value.last_write
      formats:
        - UNIX_MS
        - ISO8601
      if: ctx.ses?.reg_value?.last_write != null && ctx.ses.reg_value.last_write != ''
      on_failure:
        - append:
            tag: append_error_message_13d72a48
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_last_write_a9493b40
            field: ses.reg_value.last_write
            ignore_missing: true
  - convert:
      field: ses.reg_value.type_id
      tag: convert_reg_value_type_id_to_long
      type: string
      if: ctx.ses?.reg_value?.type_id != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_7beda69e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_type_id_bd8d87d2
            field: ses.reg_value.type_id
            ignore_missing: true
  - append:
      field: registry.data.bytes
      tag: append_registry_data_bytes_from_reg_value_result_data
      value: '{{{ses.reg_value_result.data}}}'
      if: ctx.ses?.reg_value_result?.data != null && ctx.ses.reg_value_result.data != ''
      allow_duplicates: false
  - convert:
      field: ses.reg_value_result.is_default_value
      tag: convert_reg_value_result_is_default_value_to_boolean
      type: boolean
      if: ctx.ses?.reg_value_result?.is_default_value != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_12638f3b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_result_is_default_value_7c5569eb
            field: ses.reg_value_result.is_default_value
            ignore_missing: true
  - convert:
      field: ses.reg_value_result.is_system
      tag: convert_reg_value_result_is_system_to_boolean
      type: boolean
      if: ctx.ses?.reg_value_result?.is_system != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_12268b3b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_result_is_system_337c49f7
            field: ses.reg_value_result.is_system
            ignore_missing: true
  - date:
      field: ses.reg_value_result.last_write
      tag: date_reg_value_result_last_write
      target_field: ses.reg_value_result.last_write
      formats:
        - UNIX_MS
        - ISO8601
      if: ctx.ses?.reg_value_result?.last_write != null && ctx.ses.reg_value_result.last_write != ''
      on_failure:
        - append:
            tag: append_error_message_5ec4630a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_result_last_write_82724d06
            field: ses.reg_value_result.last_write
            ignore_missing: true
  - convert:
      field: ses.reg_value_result.type_id
      tag: convert_reg_value_result_type_id_to_long
      type: string
      if: ctx.ses?.reg_value_result?.type_id != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_6b6f8146
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_reg_value_result_type_id_66c4fe26
            field: ses.reg_value_result.type_id
            ignore_missing: true
  - remove:
      field:
        - ses.reg_key.path
        - ses.reg_value.data
      tag: remove_custom_duplicate_fields
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
