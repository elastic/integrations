      on_failure:
        - append:
            tag: append_error_message_23814eff
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_compliance_rule_type_id_9e5ff031
            field: ses.compliance_rule.type_id
            ignore_missing: true
  - date:
      field: ses.created
      tag: date_created
      target_field: ses.created
      formats:
        - ISO8601
        - UNIX_MS
      if: ctx.ses?.created != null && ctx.ses.created != ''
      on_failure:
        - append:
            tag: append_error_message_0278b71e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_created_526bddc0
            field: ses.created
            ignore_missing: true
  - convert:
      field: ses.curr_security_level_id
      tag: convert_curr_security_level_id_to_string
