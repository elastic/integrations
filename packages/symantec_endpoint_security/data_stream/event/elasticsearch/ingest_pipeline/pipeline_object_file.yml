        '2': compressed
        '3': directory
        '4': encrypted
        '5': hidden
        '8': readonly
        '11': system
        '16': execute
      lang: painless
      source: >-
        def var = new HashSet();
          if (ctx.file != null && ctx.file.attributes != null) {
              var = ctx.file.attributes;
          } else {
            if (ctx.file == null)
            {
              ctx.file = new HashMap();
            }
