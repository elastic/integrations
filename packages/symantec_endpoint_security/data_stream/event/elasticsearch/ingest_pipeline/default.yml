      tag: convert_device_os_type_id_to_string_e9b40ea1
      type: string
      if: ctx.ses?.device_os_type_id != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_5109cf1c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_device_os_type_id_bf0e8fba
            field: ses.device_os_type_id
            ignore_missing: true
  - script:
      description: Add value for device os type value based on device_os_type_id.
      tag: script_to_add_device_os_type_value_a80da66f
      if: ctx.ses?.device_os_type_id != null
      params:
        '0': Unknown
        '100': Windows
        '200': Linux
        '300': Solaris
        '301': AIX
        '302': HP-UX
        '400': Macintosh
        '500': iOS
        '501': Android
        '502': Windows Mobile
        '503': iPadOS
        '1001': Other
      lang: painless
      source: >-
        def var = new ArrayList();
        if (params.containsKey((ctx.ses.device_os_type_id).toString())) {
            def type = params.get((ctx.ses.device_os_type_id).toString());
            ctx.ses.device_os_type_value = type;
        }
      on_failure:
        - append:
            tag: append_error_message_c2f41327
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      description: Add value for host os type based on device_os_name.
      tag: script_to_add_host_os_type_4ee0d96b
      if: ctx.ses?.device_os_type_id != null
      params:
        '100': windows
        '200': linux
        '400': macos
        '500': ios
        '501': android
      lang: painless
      source: >-
        def var = new ArrayList();
        if (params.containsKey((ctx.ses.device_os_type_id).toString())) {
            def type = params.get((ctx.ses.device_os_type_id).toString());
            var.add(type);
        }
        if (ctx.host == null) {
            ctx.host = new HashMap();
        }
        if (ctx.host.os == null) {
            ctx.host.os = new HashMap();
        }
        ctx.host.os.put('type', var)
      on_failure:
        - append:
            tag: append_error_message_e3871606
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
