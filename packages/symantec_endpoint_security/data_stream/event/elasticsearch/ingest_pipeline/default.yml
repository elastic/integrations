            tag: append_error_message_8dfa4cee
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_js_canary_enabled_522e8eb1
            field: ses.js_canary_enabled
            ignore_missing: true
  - gsub:
      field: ses.device_mac
      tag: gsub_device_mac_2351338e
      pattern: '[-:.]'
      replacement: '-'
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ses_device_mac_6e4759b5
            field: ses.device_mac
            ignore_missing: true
        - append:
            tag: append_error_message_19cec146
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - uppercase:
      field: ses.device_mac
      tag: uppercase_src_mac_9a673cc4
      ignore_missing: true
      if: ctx.ses?.device_mac != ''
      on_failure:
