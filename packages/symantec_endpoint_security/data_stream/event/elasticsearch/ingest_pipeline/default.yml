        - append:
            tag: append_error_message_8180d09d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_create_mask_id_03857edc
            field: ses.create_mask_id
            ignore_missing: true
  - convert:
      field: ses.data_size
      tag: convert_data_size_to_long_35f40767
      type: long
      if: ctx.ses?.data_size != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_e9424302
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_data_size_d217d727
            field: ses.data_size
            ignore_missing: true
  - set:
      field: client.domain
      tag: set_client_domain_from_device_domain_589a099c
      copy_from: ses.device_domain
      ignore_empty_value: true
  - set:
      field: source.domain
      tag: set_source_domain_from_device_domain_uid_167f2569
      copy_from: ses.device_domain_uid
      ignore_empty_value: true
  - date:
      field: ses.device_end_time
      tag: date_device_end_time_ccb28448
      target_field: ses.device_end_time
      formats:
        - UNIX_MS
        - ISO8601
      if: ctx.ses?.device_end_time != null && ctx.ses.device_end_time != ''
      on_failure:
        - append:
            tag: append_error_message_758a1450
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_device_end_time_e07aaeef
            field: ses.device_end_time
            ignore_missing: true
  - append:
      field: event.end
      tag: append_event_end_from_device_end_time_fab53cbf
      value: '{{{ses.device_end_time}}}'
      allow_duplicates: false
      if: ctx.ses?.device_end_time != null
  - set:
      field: group.name
      tag: set_group_name_from_device_group_650a88d9
      copy_from: ses.device_group
      ignore_empty_value: true
  - convert:
      field: ses.device_gateway
      tag: convert_device_gateway_to_ip_a121c3f7
      type: ip
      ignore_missing: true
      if: ctx.ses?.device_gateway != ''
      on_failure:
        - append:
            tag: append_error_message_435970a5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_device_gateway_1e21c562
