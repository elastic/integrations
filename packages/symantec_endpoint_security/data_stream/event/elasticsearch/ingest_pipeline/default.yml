        - append:
            tag: append_error_message_8315f1fb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_device_is_trusted_c8798b4b
            field: ses.device_is_trusted
            ignore_missing: true
  - convert:
      field: ses.device_is_unmanaged
      tag: convert_device_is_unmanaged_to_boolean_cb1d73cf
      type: boolean
      if: ctx.ses?.device_is_unmanaged != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_1f444fa9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_device_is_unmanaged_dd7f8c26
            field: ses.device_is_unmanaged
            ignore_missing: true
  - rename:
      field: ses.js_canary_cust
      tag: rename_js_canary_cust_to_js_canary_enabled_908e70e8
      target_field: ses.js_canary_enabled
      ignore_missing: true
      description: Renames the original `js_canary_cust` field to `js_canary_enabled` to be more descriptive.
      if: ctx.ses?.js_canary_cust != ''
      on_failure:
        - append:
            tag: append_error_message_5c10a8a2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_js_canary_cust_55e8af76
