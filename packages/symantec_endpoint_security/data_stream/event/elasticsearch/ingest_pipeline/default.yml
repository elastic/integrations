---
description: Pipeline for processing event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: ses_event_original_d132b5b4
      target_field: ses
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_73390025
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.module
      copy_from: ses.feature_name
      tag: set_event_module_def8f1ea
      if: ctx.ses?.feature_name instanceof String && ctx.ses.feature_name != ''
  - convert:
      field: ses.category_id
      tag: convert_category_id_to_string_39fd7991
      type: string
      if: ctx.ses?.category_id != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_91986645
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_category_id_1cc56339
            field: ses.category_id
            ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - convert:
      field: ses.access_mask
      tag: convert_access_mask_to_long_eef7d0d9
      type: long
      if: ctx.ses?.access_mask != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_7cce6019
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_access_mask_467f88f7
            field: ses.access_mask
            ignore_missing: true
  - foreach:
      field: ses.access_mask_ids
      if: ctx.ses?.access_mask_ids instanceof List
      tag: foreach_access_mask_ids_1a783c3d
      processor:
        convert:
          field: _ingest._value
          tag: convert_access_mask_ids_to_long_1d67daab
          type: string
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_d9b479a3
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_f29ae99b
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: ses.actual_permissions
      if: ctx.ses?.actual_permissions instanceof List
      tag: foreach_actual_permissions_51113d8d
      processor:
        convert:
          field: _ingest._value
          tag: convert_actual_permissions_to_long_4f0a612d
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_c7b17707
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_9e6ca31e
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: ses.collector_device_ip
      tag: convert_collector_device_ip_to_ip_a551d659
      type: ip
      ignore_missing: true
      if: ctx.ses?.collector_device_ip != ''
      on_failure:
        - append:
            tag: append_error_message_2c463889
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_collector_device_ip_a53dd9bd
            field: ses.collector_device_ip
            ignore_missing: true
  - append:
        field: related.ip
        tag: append_related_ip_from_collector_device_ip_0db38716
        value: '{{{ses.collector_device_ip}}}'
        allow_duplicates: false
        if: ctx.ses?.collector_device_ip != null
  - set:
      field: destination.ip
      tag: set_destination_ip_from_collector_device_ip_de7b53cb
      copy_from: ses.collector_device_ip
      ignore_empty_value: true
  - convert:
      field: ses.composite
      tag: convert_composite_to_long_ad7615a7
      type: long
      if: ctx.ses?.composite != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_3a9afae2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_composite_b9bc61d9
            field: ses.composite
            ignore_missing: true
  - convert:
      field: ses.count
      tag: convert_count_to_long_0b4b5595
      type: long
      if: ctx.ses?.count != ''
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_3e74df32
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_ses_count_0ab261c4
            field: ses.count
            ignore_missing: true
  - convert:
      field: ses.create_mask_id
