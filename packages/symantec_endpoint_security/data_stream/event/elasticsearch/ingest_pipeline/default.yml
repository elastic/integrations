  - script:
      description: Convert size array to longs
      tag: script_to_convert_file_size_9ca89ada
      if: ctx.file?.size instanceof List && ctx.file.size.length != 0

      lang: painless
      source: >-
        def new_sizes = [];
        for (int i = 0; i < ctx.file.size.length; i++) {
          def sz = ctx.file.size[i];
          if (sz == null) {
            continue
          }
          if (sz instanceof long || sz instanceof int) {
            new_sizes.add((long)sz);
          } else if (sz instanceof String && sz != "") {
            new_sizes.add(Long.parseLong(sz));
          }
        }
        ctx.file.size = new_sizes;
      on_failure:
        - append:
            tag: append_error_message_ead362ff
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  - script:
      tag: script_move_raw_data_to_raw_728311ee
      description: Move raw_data to raw_data.value if the value is not compatible with flattened.
      lang: painless
      if: ctx.ses?.raw_data != null && !(ctx.ses.raw_data instanceof Map)
      source: |-
        if (ctx.ses.raw_data instanceof List) {
          for (def e: ctx.ses.raw_data) {
            if (!(e instanceof Map)) {
              def m = new HashMap();
              m["value"] = ctx.ses.raw_data;
              ctx.ses.raw_data = m;
              break;
            }
          }
          return;
        }
        def m = new HashMap();
        m["value"] = ctx.ses.raw_data;
        ctx.ses.raw_data = m;
