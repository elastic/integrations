        - remove:
            tag: remove_ses_device_is_personal_e2ca7163
            field: ses.device_is_personal
            ignore_missing: true
  - convert:
      field: ses.device_is_trusted
      tag: convert_device_is_trusted_to_boolean_23c4fe4b
      type: boolean
