- name: entity
  type: group
  fields:
  - name: id
    type: keyword

  - name: name
    type: keyword

  - name: type
    type: keyword

  - name: sub_type
    type: keyword

  - name: source
    type: keyword

  - name: raw
    type: flattened

  - name: attributes
    type: flattened
    description: >
      Non-ECS resource-specific attributes (e.g. Engine, EngineVersion, DNSName,
      PubliclyAccessible, CreatedAt). Keys use UpperCamelCase per the non-ECS naming convention.
