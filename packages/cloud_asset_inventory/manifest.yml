format_version: 3.7.0
name: cloud_asset_inventory
title: "Cloud Asset Discovery"
version: "1.8.0"
source:
  license: "Elastic-2.0"
description: "Discover and Create Cloud Assets Discovery"
type: integration
categories:
  - security
  - asset_inventory
  - cloudsecurity_cdr
  # Added cloud category to match policy template categories (asset_inventory template references cloud as a top-level category)
  - cloud
conditions:
  kibana:
    version: ">=9.5.0"
  elastic:
    subscription: basic
    capabilities:
      - security
screenshots: []
icons:
  - src: /img/logo_cloud_security_posture.svg
    title: Cloud Security Posture logo
    size: 32x32
    type: image/svg+xml
vars: []
policy_templates:
  - name: asset_inventory
    title: Cloud Asset Discovery
    description: Discover assets in your Cloud Environment and store within Elastic Search
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        is_default: true
        release: beta
        organization: security
        division: engineering
        team: cloud-services
    multiple: true
    icons:
      - src: /img/logo_cloud_security_posture.svg
        title: CSPM logo
        size: 32x32
        type: image/svg+xml
    data_streams:
      - asset_inventory
    inputs:
      - type: cloudbeat/asset_inventory_aws
        title: AWS Asset Discovery
        description: AWS Asset Discovery
        vars:
          - name: cloud_formation_template
            type: text
            title: CloudFormation Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Quick Create Stack
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-asset-inventory-ACCOUNT_TYPE-9.2.0.yml&stackName=Elastic-Cloud-Asset-Discovery&param_EnrollmentToken=FLEET_ENROLLMENT_TOKEN&param_FleetUrl=FLEET_URL&param_ElasticAgentVersion=KIBANA_VERSION&param_ElasticArtifactServer=https://artifacts.elastic.co/downloads/beats/elastic-agent
          - name: cloud_formation_credentials_template
            type: text
            title: CloudFormation Credentials Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Cloud Credentials Stack
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-asset-inventory-direct-access-key-ACCOUNT_TYPE-9.2.0.yml
          - name: cloud_formation_cloud_connectors_template
            type: text
            title: CloudFormation Cloud Connectors Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Cloud Connectors Stack
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            # RESOURCE_ID is the project id for serverless / kibana component id for ess
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-asset-inventory-cloud-connectors-ACCOUNT_TYPE-9.2.0.yml&param_ElasticResourceId=RESOURCE_ID
        provider_permissions:
          - provider: aws
            description: >
              Read-only access to AWS services required to discover and inventory cloud assets.
              The SecurityAudit managed policy covers enumeration across most services;
              the inline permissions below add Config, Organizations, and newer-service coverage.
            roles:
              - name: SecurityAudit
                id: arn:aws:iam::aws:policy/SecurityAudit
                description: AWS-managed read-only policy for enumerating resources across all AWS services.
            permissions:
              - name: config:ListDiscoveredResources
                description: List all resources tracked by AWS Config for asset inventory.
              - name: config:SelectResourceConfig
                description: Query resource configuration state from AWS Config.
              - name: config:SelectAggregateResourceConfig
                description: Query aggregated resource configuration across the organization.
              - name: config:DescribeConfigurationRecorders
                description: Verify AWS Config recorders are active and capturing resource state.
              - name: config:DescribeAggregationAuthorizations
                description: Read Config aggregation authorization for org-wide inventory.
              - name: config:DescribeConfigurationAggregators
                description: Enumerate Config aggregators covering multiple accounts/regions.
              - name: organizations:DescribeOrganization
                description: Read organization metadata for org-wide asset discovery scope.
              - name: organizations:ListAccounts
                description: Enumerate all member accounts for organization-wide inventory.
              - name: organizations:ListAccountsForParent
                description: Walk the organization tree to discover all accounts under each OU.
              - name: organizations:ListOrganizationalUnitsForParent
                description: Enumerate OUs for hierarchical asset grouping.
              - name: organizations:ListRoots
                description: Read organization root for top-level hierarchy traversal.
              - name: sts:AssumeRole
                description: Assume cross-account roles to collect assets from member accounts.
              - name: sts:GetCallerIdentity
                description: Resolve the AWS account ID and identity for the collection session.
        iac_blueprints:
          - id: aws/federated-identity/account
            format: cloudformation
            patches: iac/aws-federated-identity-account.cloudformation.patches.json
            title: Cloud Asset Discovery federated identity role with SecurityAudit access
      - type: cloudbeat/asset_inventory_azure
        title: Azure Asset Discovery
        description: Azure Asset Discovery
        vars:
          - name: arm_template_url
            type: text
            title: ARM Template URL
            multi: false
            required: true
            show_user: false
            description: A URL to the ARM Template for creating a new deployment
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://portal.azure.com/#create/Microsoft.Template/uri/https%3A%2F%2Fraw.githubusercontent.com%2Felastic%2Fcloudbeat%2F9.2%2Fdeploy%2Fasset-inventory-arm%2FARM-for-ACCOUNT_TYPE.json
          - name: arm_template_cloud_connectors_url
            type: text
            title: ARM Cloud Connectors Template URL
            multi: false
            required: true
            show_user: false
            description: A URL to the ARM Template for creating a Cloud Connectors managed identity
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://portal.azure.com/#create/Microsoft.Template/uri/https%3A%2F%2Fraw.githubusercontent.com%2Felastic%2Fcloudbeat%2F9.2%2Fdeploy%2Fazure%2FARM-for-cloud-connectors-ACCOUNT_TYPE.json
      - type: cloudbeat/asset_inventory_gcp
        title: GCP Asset Discovery
        description: GCP Asset Discovery
        vars:
          - name: cloud_shell_url
            type: text
            title: CloudShell URL
            multi: false
            required: true
            show_user: false
            description: A URL to CloudShell for creating a new deployment
            default: https://shell.cloud.google.com/cloudshell/?ephemeral=true&cloudshell_git_repo=https%3A%2F%2Fgithub.com%2Felastic%2Fcloudbeat&cloudshell_git_branch=main&cloudshell_workspace=deploy%2Finfrastructure-manager%2Fgcp-elastic-agent&show=terminal
          - name: cloud_shell_url_cloud_connectors
            type: text
            title: Cloud Connectors CloudShell URL
            multi: false
            required: true
            show_user: false
            description: A URL to CloudShell for creating a Cloud Connectors Service Account
            default: https://shell.cloud.google.com/cloudshell/?ephemeral=true&cloudshell_git_repo=https%3A%2F%2Fgithub.com%2Felastic%2Fcloudbeat&cloudshell_git_branch=main&cloudshell_workspace=deploy%2Finfrastructure-manager%2Fgcp-cloud-connectors&show=terminal
    categories:
      - security
      - cloud
owner:
  github: elastic/cloud-services
  type: elastic
