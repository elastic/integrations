- name: claude_desktop
  type: group
  dynamic: false
  fields:
  - name: log_file
    type: keyword
  - name: mcp
    type: group
    fields:
    - name: direction
      type: keyword
    - name: id
      type: keyword
    - name: method
      type: keyword
    - name: payload
      type: object
      enabled: false
    - name: result_blocks
      type: integer
    - name: server
      type: keyword
  - name: secrets
    type: group
    fields:
    - name: count
      type: integer
    - name: errors
      type: keyword
    - name: findings
      type: object
      enabled: false
    - name: redacted
      type: boolean
    - name: types
      type: keyword
  - name: truncated
    type: boolean
- name: gen_ai
  type: group
  fields:
  - name: operation
    type: group
    fields:
    - name: name
      type: keyword
  - name: tool
    type: group
    fields:
    - name: call
      type: group
      fields:
      - name: id
        type: keyword
    - name: name
      type: keyword
