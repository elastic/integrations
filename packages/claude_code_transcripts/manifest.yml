format_version: 3.6.0
name: claude_code_transcripts
title: Claude Code Transcripts
version: 0.1.0
description: Collect Claude Desktop app/MCP logs from disk with Elastic Agent, mapped to ECS and gen_ai.*, with secret redaction.
type: integration
categories:
- security
- observability
conditions:
  kibana:
    version: ^9.4.0
  elastic:
    subscription: basic
icons:
- src: /img/icon.svg
  title: Claude Code Transcripts
  size: 64x64
  type: image/svg+xml
policy_templates:
- name: claude_code
  title: Claude Code and Claude Desktop
  description: Claude Desktop app and MCP logs
  inputs:
  - type: filestream
    title: Collect Claude Desktop logs
    description: Tail the Desktop app/MCP log files
owner:
  github: elastic/security-service-integrations
  type: community
source:
  license: Elastic-2.0
