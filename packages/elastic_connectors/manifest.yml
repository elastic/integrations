format_version: 3.3.1
name: elastic_connectors
title: "Elastic Crawlers"
version: 1.1.1
source:
  license: "Elastic-2.0"
description: "Sync data from source to an Elasticsearch index."
type: integration
categories:
  - connector
  # Enterprise Search is a parent category for connector
  - enterprise_search
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "platinum"
screenshots:
  - src: /img/google-drive-connector-screenshot.png
    title: Google Drive Crawler Screenshot
    size: 3824×1808
    type: image/png
icons:
  - src: /img/connectors-logo.svg
    title: Crawlers Logo
    size: 32x32
    type: image/svg+xml
policy_templates_behavior: individual_policies
policy_templates:
  - name: github
    title: GitHub & GitHub Enterprise Server Crawler
    icons:
      - src: /img/service_type/github.svg
        : GitHub logo
        size: 32x32
        type: image/svg+xml
    description: One-way data sync from a GitHub data source.
    deployment_modes: &connector_deployment_modes
      default:
        enabled: false
      agentless:
        enabled: true
        release: ga
        organization: elastic
        division: engineering
        team: search-extract-and-transform
    multiple: false
    inputs:
      - type: connectors-py
        : GitHub & GitHub Enterprise Server Crawler
        description: &input_description >-
          One-way data sync from an original data source to an Elasticsearch
          index.
        vars: &connector_input_vars
          - name: connector_name
            type: text
            title: Crawler Name
            required: false
            show_user: true
            description: The name of the crawler.
          - name: connector_id
            type: text
            title: ID
            required: false
            show_user: false
            description: >-
              The ID of the crawler managed by this integration, generated
              randomly if not specified.
        template_path: github.yml.hbs
  - name: google_drive
    title: Google Drive Crawler
    icons:
      - src: /img/service_type/google_drive.svg
        title: Google Drive logo
        size: 32x32
