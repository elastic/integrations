- name: gen_ai.agent.id
  type: keyword
  description: The unique identifier of the GenAI agent.
- name: gen_ai.operation.name
  type: keyword
  description: The name of the operation being performed.
- name: gen_ai.request.model
  type: keyword
  description: Model used for the generative AI request.
- name: gen_ai.response.id
  type: keyword
  description: Identifier for the generative AI response.
- name: gen_ai.system
  type: keyword
  description: The Generative AI product as identified by the client or server instrumentation.
- name: gen_ai.tool.name
  type: keyword
  description: Name of the tool utilized by the agent.
- name: gen_ai.usage.input_tokens
  type: long
  description: Number of input tokens consumed.
- name: gen_ai.usage.output_tokens
  type: long
  description: Number of output tokens consumed.
- name: lite_llm
  type: group
  fields:
    - name: spend_tracking
      type: group
      fields:
        - name: api_key
          type: keyword
          description: Serialized API-key identifier stored with the spend log; LiteLLM hashes real keys before persistence.
        - name: cache_hit
          type: keyword
          description: String representation of whether the response was served from cache.
        - name: cache_key
          type: keyword
          description: LiteLLM cache key or cache-disabled sentinel for the request.
        - name: completion_start_time
          type: date
          description: Timestamp when completion generation or the first streamed token began.
        - name: messages
          type: keyword
          description: Serialized request messages sent to the model; LiteLLM may also emit list or object forms.
        - name: metadata
          type: group
          fields:
            - name: additional_usage_values
              type: group
              fields:
                - name: prompt_tokens_details
                  type: group
                  fields:
                    - name: text_tokens
                      type: long
                      description: Number of text tokens in the prompt.
                    - name: audio_tokens
                      type: long
                      description: Number of audio tokens in the prompt.
                    - name: image_tokens
                      type: long
                      description: Number of image tokens in the prompt.
                    - name: video_tokens
                      type: long
                      description: Number of video tokens in the prompt.
                    - name: cached_tokens
                      type: long
                      description: Number of prompt tokens served from cache.
                - name: completion_tokens_details
                  type: group
                  fields:
                    - name: text_tokens
                      type: long
                      description: Number of text tokens in the completion.
                    - name: audio_tokens
                      type: long
                      description: Number of audio tokens in the completion.
                    - name: image_tokens
                      type: long
                      description: Number of image tokens in the completion.
                    - name: video_tokens
                      type: long
                      description: Number of video tokens in the completion.
                    - name: reasoning_tokens
                      type: long
                      description: Number of reasoning tokens in the completion.
                    - name: accepted_prediction_tokens
                      type: long
                      description: Number of accepted predicted-output tokens in the completion.
                    - name: rejected_prediction_tokens
                      type: long
                      description: Number of rejected predicted-output tokens in the completion.
            - name: applied_guardrails
              type: keyword
              description: Names of guardrails applied to the request.
            - name: attempted_retries
              type: long
              description: Number of retries attempted for the request.
            - name: batch_models
              type: keyword
              description: Models used for batch cost calculation.
            - name: cold_storage_object_key
              type: keyword
              description: S3 or GCS object key used to retrieve archived request data.
            - name: cost_breakdown
              type: group
              fields:
                - name: input_cost
                  type: double
                  description: Cost of raw (non-cached) input tokens only.
                - name: output_cost
                  type: double
                  description: Cost of output/completion tokens, including reasoning tokens if applicable.
                - name: total_cost
                  type: double
                  description: Total cost of the request, including input, output, and tool usage.
                - name: tool_usage_cost
                  type: double
                  description: Cost of usage of built-in tools.
                - name: original_cost
                  type: double
                  description: Cost of the request before any discount was applied.
                - name: discount_percent
                  type: double
                  description: Discount percentage applied to the request, such as 0.05 for 5%.
                - name: discount_amount
                  type: double
                  description: Discount amount applied to the request in US dollars.
                - name: margin_percent
                  type: double
                  description: Margin percentage applied to the request, such as 0.10 for 10%.
                - name: margin_fixed_amount
                  type: double
                  description: Fixed margin amount added to the request in US dollars.
                - name: margin_total_amount
                  type: double
                  description: Total margin amount added to the request in US dollars.
            - name: error_information
              type: group
              fields:
                - name: error_message
                  type: text
                  description: Human-readable message for the failed request.
                - name: error_rate_limit_category
                  type: keyword
                  description: Source category of a rate-limit failure, such as provider or LiteLLM rate limiting.
                - name: error_rate_limit_type
                  type: keyword
                  description: Rate-limit dimension exceeded, such as requests, tokens, concurrency, budget, or iterations.
                - name: llm_provider
                  type: keyword
                  description: LLM provider associated with the error.
            - name: eval_information
              type: flattened
              description: 'Inferred: Evaluation metadata associated with the request.'
            - name: guardrail_information
              type: group
              fields:
                - name: guardrail_mode
                  type: keyword
                  description: Guardrail execution hook or mode; the observed value is a scalar, while LiteLLM also permits list or object forms.
                - name: guardrail_response
                  type: group
                  fields:
                    - name: detected_entities
                      type: keyword
                      description: 'Inferred: Entity categories detected by the PII guardrail.'
                    - name: flagged
                      type: boolean
                      description: 'Inferred: Whether the guardrail response flagged the request content.'
                - name: guardrail_status
                  type: keyword
                  description: Guardrail execution status; current LiteLLM definitions use success, guardrail_intervened, guardrail_failed_to_respond, or not_run, while this sample also contains blocked.
            - name: litellm_overhead_time_ms
              type: double
              description: LiteLLM processing overhead in milliseconds.
            - name: max_retries
              type: long
              description: Maximum number of retries configured for the request.
            - name: mcp_tool_call_metadata
              type: flattened
              description: 'Inferred: MCP tool-call arguments, result, server identity, and cost metadata; not yet observed populated in sample data.'
            - name: model_map_information
              type: group
              fields:
                - name: model_map_key
                  type: keyword
                  description: LiteLLM model-map key used to resolve model information.
                - name: model_map_value
                  type: group
                  fields:
                    - name: key
                      type: keyword
                      description: 'The litellm.model_cost key this model information was resolved from.'
                    - name: rpm
                      type: long
                      description: 'Requests-per-minute limit configured for the model.'
                    - name: tpm
                      type: long
                      description: 'Tokens-per-minute limit configured for the model.'
                    - name: mode
                      type: keyword
                      description: 'Call mode the model supports, such as chat, completion, or embedding.'
                    - name: max_tokens
                      type: long
                      description: 'Maximum total tokens supported by the model.'
                    - name: tiered_pricing
                      type: flattened
                      description: 'Tiered pricing structure for models with volume-based pricing tiers.'
                    - name: supports_vision
                      type: boolean
                      description: 'Whether the model supports vision/image inputs.'
                    - name: litellm_provider
                      type: keyword
                      description: 'LiteLLM provider identifier for the model.'
                    - name: max_input_tokens
                      type: long
                      description: 'Maximum input tokens supported by the model.'
                    - name: max_output_tokens
                      type: long
                      description: 'Maximum output tokens supported by the model.'
                    - name: ocr_cost_per_page
                      type: double
                      description: 'Cost per page for OCR models.'
                    - name: output_vector_size
                      type: long
                      description: 'Output vector size for embedding models.'
                    - name: supports_pdf_input
                      type: boolean
                      description: 'Whether the model supports PDF input.'
                    - name: supports_reasoning
                      type: boolean
                      description: 'Whether the model supports reasoning.'
                    - name: uses_embed_content
                      type: boolean
                      description: 'Whether the model uses embed-content style requests.'
                    - name: ocr_cost_per_credit
                      type: double
                      description: 'Cost per credit for OCR models priced by credit.'
                    - name: supports_image_size
                      type: boolean
                      description: 'Whether the model supports configurable image size.'
                    - name: supports_web_search
                      type: boolean
                      description: 'Whether the model supports the web search tool.'
                    - name: input_cost_per_image
                      type: double
                      description: 'Input cost per image, for Vertex AI models.'
                    - name: input_cost_per_query
                      type: double
                      description: 'Input cost per query, for rerank models.'
                    - name: input_cost_per_token
                      type: double
                      description: 'Input cost per token.'
                    - name: supports_audio_input
                      type: boolean
                      description: 'Whether the model supports audio input.'
                    - name: supports_tool_choice
                      type: boolean
                      description: 'Whether the model supports the tool_choice parameter.'
                    - name: supports_url_context
                      type: boolean
                      description: 'Whether the model supports URL context.'
                    - name: input_cost_per_second
                      type: double
                      description: 'Input cost per second, for OpenAI Speech models.'
                    - name: output_cost_per_image
                      type: double
                      description: 'Output cost per image.'
                    - name: output_cost_per_token
                      type: double
                      description: 'Output cost per token.'
                    - name: supports_audio_output
                      type: boolean
                      description: 'Whether the model supports audio output.'
                    - name: supports_computer_use
                      type: boolean
                      description: 'Whether the model supports computer-use tooling.'
                    - name: output_cost_per_second
                      type: double
                      description: 'Output cost per second, for OpenAI Speech models.'
                    - name: citation_cost_per_token
                      type: double
                      description: 'Cost per citation token, for Perplexity models.'
                    - name: provider_specific_entry
                      type: flattened
                      description: 'Free-form provider-specific cost entries.'
                    - name: supported_openai_params
                      type: keyword
                      description: 'OpenAI request parameters supported by the model.'
                    - name: supports_prompt_caching
                      type: boolean
                      description: 'Whether the model supports prompt caching.'
                    - name: annotation_cost_per_page
                      type: double
                      description: 'Cost per page for annotation on OCR models.'
                    - name: input_cost_per_character
                      type: double
                      description: 'Input cost per character, for Vertex AI models.'
                    - name: supports_response_schema
                      type: boolean
                      description: 'Whether the model supports response schema enforcement.'
                    - name: supports_system_messages
                      type: boolean
                      description: 'Whether the model supports system messages.'
                    - name: input_cost_per_token_flex
                      type: double
                      description: 'Input cost per token under OpenAI flex service tier pricing.'
                    - name: output_cost_per_character
                      type: double
                      description: 'Output cost per character, for Vertex AI models.'
                    - name: supports_function_calling
                      type: boolean
                      description: 'Whether the model supports function calling.'
                    - name: supports_native_streaming
                      type: boolean
                      description: 'Whether the model supports native streaming.'
                    - name: input_cost_per_audio_token
                      type: double
                      description: 'Input cost per audio token.'
                    - name: input_cost_per_image_token
                      type: double
                      description: 'Input cost per image token, for image-generation models.'
                    - name: output_cost_per_token_flex
                      type: double
                      description: 'Output cost per token under OpenAI flex service tier pricing.'
                    - name: supports_assistant_prefill
                      type: boolean
                      description: 'Whether the model supports assistant message prefill.'
                    - name: cache_read_input_token_cost
                      type: double
                      description: 'Cost per cache-read input token, at the discounted rate.'
                    - name: output_cost_per_audio_token
                      type: double
                      description: 'Output cost per audio token.'
                    - name: output_cost_per_image_token
                      type: double
                      description: 'Output cost per image token.'
                    - name: input_cost_per_token_batches
                      type: double
                      description: 'Input cost per token for batch API requests.'
                    - name: output_cost_per_second_1080p
                      type: double
                      description: 'Output cost per second for 1080p video generation.'
                    - name: input_cost_per_token_priority
                      type: double
                      description: 'Input cost per token under OpenAI priority service tier pricing.'
                    - name: output_cost_per_token_batches
                      type: double
                      description: 'Output cost per token for batch API requests.'
                    - name: search_context_cost_per_query
                      type: group
                      fields:
                        - name: search_context_size_low
                          type: double
                          description: 'Cost per query at low search context size.'
                        - name: search_context_size_medium
                          type: double
                          description: 'Cost per query at medium search context size.'
                        - name: search_context_size_high
                          type: double
                          description: 'Cost per query at high search context size.'
                    - name: supports_low_reasoning_effort
                      type: boolean
                      description: 'Whether the model supports low reasoning effort.'
                    - name: supports_max_reasoning_effort
                      type: boolean
                      description: 'Whether the model supports max reasoning effort.'
                    - name: output_cost_per_token_priority
                      type: double
                      description: 'Output cost per token under OpenAI priority service tier pricing.'
                    - name: supports_embedding_image_input
                      type: boolean
                      description: 'Whether the model supports image input for embeddings.'
                    - name: supports_none_reasoning_effort
                      type: boolean
                      description: 'Whether the model supports disabling reasoning effort.'
                    - name: cache_creation_input_token_cost
                      type: double
                      description: 'Cost per cache-write input token, at the premium rate.'
                    - name: input_cost_per_audio_per_second
                      type: double
                      description: 'Input cost per second of audio, for Vertex AI models.'
                    - name: input_cost_per_video_per_second
                      type: double
                      description: 'Input cost per second of video, for Vertex AI models.'
                    - name: output_cost_per_reasoning_token
                      type: double
                      description: 'Output cost per reasoning token.'
                    - name: supports_xhigh_reasoning_effort
                      type: boolean
                      description: 'Whether the model supports extra-high reasoning effort.'
                    - name: cache_read_input_token_cost_flex
                      type: double
                      description: 'Cache-read input token cost under OpenAI flex service tier pricing.'
                    - name: output_cost_per_video_per_second
                      type: double
                      description: 'Output cost per second of video, for Vertex AI models.'
                    - name: supports_minimal_reasoning_effort
                      type: boolean
                      description: 'Whether the model supports minimal reasoning effort.'
                    - name: supports_native_structured_output
                      type: boolean
                      description: 'Whether the model supports native structured output.'
                    - name: bedrock_output_config_effort_ceiling
                      type: keyword
                      description: 'Maximum reasoning effort ceiling for Bedrock output config, such as low, medium, high, max, or xhigh.'
                    - name: cache_read_input_token_cost_priority
                      type: double
                      description: 'Cache-read input token cost under OpenAI priority service tier pricing.'
                    - name: input_cost_per_token_above_128k_tokens
                      type: double
                      description: 'Input cost per token above a 128k-token context window, for Vertex AI models.'
                    - name: input_cost_per_token_above_200k_tokens
                      type: double
                      description: 'Input cost per token above a 200k-token context window.'
                    - name: input_cost_per_token_above_272k_tokens
                      type: double
                      description: 'Input cost per token above a 272k-token context window.'
                    - name: input_cost_per_token_above_512k_tokens
                      type: double
                      description: 'Input cost per token above a 512k-token context window.'
                    - name: output_cost_per_token_above_128k_tokens
                      type: double
                      description: 'Output cost per token above a 128k-token context window, for Vertex AI models.'
                    - name: output_cost_per_token_above_200k_tokens
                      type: double
                      description: 'Output cost per token above a 200k-token context window.'
                    - name: output_cost_per_token_above_272k_tokens
                      type: double
                      description: 'Output cost per token above a 272k-token context window.'
                    - name: output_cost_per_token_above_512k_tokens
                      type: double
                      description: 'Output cost per token above a 512k-token context window.'
                    - name: regional_processing_uplift_multiplier_eu
                      type: double
                      description: 'Cost multiplier applied for EU data-residency processing.'
                    - name: regional_processing_uplift_multiplier_us
                      type: double
                      description: 'Cost multiplier applied for US data-residency processing.'
                    - name: cache_creation_input_token_cost_above_1hr
                      type: double
                      description: 'Cache-write input token cost for cache entries held above one hour.'
                    - name: output_cost_per_character_above_128k_tokens
                      type: double
                      description: 'Output cost per character above a 128k-token context window, for Vertex AI models.'
                    - name: cache_read_input_token_cost_above_200k_tokens
                      type: double
                      description: 'Cache-read input token cost above a 200k-token context window.'
                    - name: cache_read_input_token_cost_above_272k_tokens
                      type: double
                      description: 'Cache-read input token cost above a 272k-token context window.'
                    - name: cache_read_input_token_cost_above_512k_tokens
                      type: double
                      description: 'Cache-read input token cost above a 512k-token context window.'
                    - name: input_cost_per_token_above_200k_tokens_priority
                      type: double
                      description: 'Input cost per token above a 200k-token context window under OpenAI priority service tier pricing.'
                    - name: input_cost_per_token_above_272k_tokens_priority
                      type: double
                      description: 'Input cost per token above a 272k-token context window under OpenAI priority service tier pricing.'
                    - name: output_cost_per_token_above_200k_tokens_priority
                      type: double
                      description: 'Output cost per token above a 200k-token context window under OpenAI priority service tier pricing.'
                    - name: output_cost_per_token_above_272k_tokens_priority
                      type: double
                      description: 'Output cost per token above a 272k-token context window under OpenAI priority service tier pricing.'
                    - name: cache_creation_input_token_cost_above_200k_tokens
                      type: double
                      description: 'Cache-write input token cost above a 200k-token context window.'
                    - name: cache_read_input_token_cost_above_200k_tokens_priority
                      type: double
                      description: 'Cache-read input token cost above a 200k-token context window under OpenAI priority service tier pricing.'
                    - name: cache_read_input_token_cost_above_272k_tokens_priority
                      type: double
                      description: 'Cache-read input token cost above a 272k-token context window under OpenAI priority service tier pricing.'
            - name: proxy_server_request
              type: keyword
              description: 'Inferred: Serialized proxy request information retained with the spend log.'
            - name: requester_ip_address
              type: ip
              description: Requester IP address copied into LiteLLM metadata.
            - name: spend_logs_metadata
              type: flattened
              description: Custom key-value metadata supplied for spend logging.
            - name: status
              type: keyword
              description: Status copied into LiteLLM spend metadata.
            - name: usage_object
              type: group
              fields:
                - name: total_tokens
                  type: long
                  description: Total number of tokens used by the call, as reported by the LLM provider.
                - name: prompt_tokens
                  type: long
                  description: Number of prompt tokens used by the call, as reported by the LLM provider.
                - name: completion_tokens
                  type: long
                  description: Number of completion tokens used by the call, as reported by the LLM provider.
                - name: prompt_tokens_details
                  type: group
                  fields:
                    - name: text_tokens
                      type: long
                      description: Number of text tokens in the prompt.
                    - name: audio_tokens
                      type: long
                      description: Number of audio tokens in the prompt.
                    - name: image_tokens
                      type: long
                      description: Number of image tokens in the prompt.
                    - name: video_tokens
                      type: long
                      description: Number of video tokens in the prompt.
                    - name: cached_tokens
                      type: long
                      description: Number of prompt tokens served from cache.
                - name: completion_tokens_details
                  type: group
                  fields:
                    - name: text_tokens
                      type: long
                      description: Number of text tokens in the completion.
                    - name: audio_tokens
                      type: long
                      description: Number of audio tokens in the completion.
                    - name: image_tokens
                      type: long
                      description: Number of image tokens in the completion.
                    - name: video_tokens
                      type: long
                      description: Number of video tokens in the completion.
                    - name: reasoning_tokens
                      type: long
                      description: Number of reasoning tokens in the completion.
                    - name: accepted_prediction_tokens
                      type: long
                      description: Number of accepted predicted-output tokens in the completion.
                    - name: rejected_prediction_tokens
                      type: long
                      description: Number of rejected predicted-output tokens in the completion.
            - name: user_api_key
              type: keyword
              description: API-key identifier retained in spend metadata.
            - name: user_api_key_alias
              type: keyword
              description: Human-readable alias of the LiteLLM virtual API key.
            - name: user_api_key_org_id
              type: keyword
              description: Organization identifier associated with the API key.
            - name: user_api_key_project_alias
              type: keyword
              description: Human-readable alias of the project associated with the API key.
            - name: user_api_key_project_id
              type: keyword
              description: Identifier of the project associated with the API key.
            - name: user_api_key_team_id
              type: keyword
              description: Team identifier associated with the API key.
            - name: vector_store_request_metadata
              type: flattened
              description: 'Inferred: Vector-store request metadata associated with the LLM call (vector store ID, provider, query, response, timing); not yet observed populated in sample data.'
        - name: model_group
          type: keyword
          description: LiteLLM routing model group used for the request.
        - name: model_id
          type: keyword
          description: Identifier of the LiteLLM model deployment used for the call.
        - name: request_duration_ms
          type: long
          description: Total request duration stored in milliseconds.
        - name: response
          type: keyword
          description: Model response retained in the spend log; LiteLLM may also emit list or object forms.
        - name: response_cost
          type: double
          description: Calculated response cost in US dollars.
        - name: response_time
          type: double
          description: Total response time in seconds; for streaming calls this may represent time to first token.
        - name: session_id
          type: keyword
          description: Identifier used to group related LiteLLM requests into one session.
        - name: spend
          type: double
          description: Spend charged for the request in US dollars.
        - name: total_tokens
          type: long
          description: Total number of input and output tokens used by the call.
        - name: user_api_key_hash
          type: keyword
          description: Hash of the LiteLLM virtual API key used for the request.
