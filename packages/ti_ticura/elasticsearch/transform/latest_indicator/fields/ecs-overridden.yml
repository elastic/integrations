# Declare threat.feed as a group so it can hold multiple feed entries per indicator.
- name: threat.feed
  type: group
  fields:
    - name: name
      external: ecs
    - name: description
      external: ecs
    - name: reference
      external: ecs
    - name: dashboard_id
      external: ecs
# The dns object is carried through from the source data stream by the
# latest_indicator transform. dns.answers is ECS `nested`; without an explicit
# declaration here the transform destination index falls back to dynamic
# (object) mapping instead of the ecs@mappings nested definition.
- name: dns.answers
  type: group
  external: ecs
- name: dns.answers.class
  external: ecs
- name: dns.answers.data
  external: ecs
- name: dns.answers.name
  external: ecs
- name: dns.answers.ttl
  external: ecs
- name: dns.answers.type
  external: ecs
