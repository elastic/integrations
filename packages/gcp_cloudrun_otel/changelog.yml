# newer versions go on top
- version: "0.3.0"
  changes:
    - description: Add a "View in Google Console" row action to the service and revision tables, open "View metrics in Discover" in the same tab, fix request rate and network throughput charts that were inflated by the display bucket length by charting totals per time bucket, show total requests in the former requests/sec tile, count sent bytes and CPU and memory allocation from documents that lack the filtered metric, show latency percentiles in the service and revision tables, sum instance counts across revisions, and sort services without memory data last in the saturation summary.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21705
- version: "0.2.0"
  changes:
    - description: Fix the service inventory "View metrics" link to open Discover with the `metrics-*` data view, and sort null percentiles last in the top 10 latency, CPU, memory and concurrency panels.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21637
- version: "0.1.0"
  changes:
    - description: Initial draft of the GCP Cloud Run OpenTelemetry Assets package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21593
