source:
  index:
    - "logs-jamf_pro.inventory-*"
  query:
    bool:
      must_not:
        - exists:
            field: error.message
# The version suffix on the dest.index should be incremented if a breaking
# change is made to the index mapping. You must also bump the
# fleet_transform_version for any change to this transform configuration to
# take effect. The old destination index is not automatically removed.
dest:
  index: "logs-jamf_pro_latest.dest_inventory-2"
  aliases:
    - alias: "logs-jamf_pro_latest.inventory"
      move_on_creation: true
latest:
  unique_key:
    - event.dataset
    - host.id
  sort: "@timestamp"
description: >-
  Latest inventory from Jamf Pro. Retains only the most recent document per device.
frequency: 30s
settings:
  deduce_mappings: false
  unattended: true
sync:
  time:
    field: "event.ingested"
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 30d
_meta:
  managed: false
  # Bump this version to delete, reinstall, and restart the transform during
  # package upgrade.
  fleet_transform_version: 0.2.0
  run_as_kibana_system: false
