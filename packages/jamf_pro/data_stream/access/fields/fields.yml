- name: jamf_pro.access.username
  type: keyword
  description: The username that performed the access action.
- name: jamf_pro.access.status
  type: keyword
  description: The result status of the access attempt, such as Successful Login or Failed token creation.
- name: jamf_pro.access.ip_address
  type: ip
  description: The IP address of the client that performed the access action.
- name: jamf_pro.access.entry_point
  type: keyword
  description: The interface through which the access was made, such as Universal API (OAuth), Single Sign On (OIDC), JSS, or Self Service (macOS).
