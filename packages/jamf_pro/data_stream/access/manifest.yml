title: Jamf Pro Access Logs
type: logs
streams:
  - input: aws-s3
    title: Jamf Pro Access Logs via AWS S3 or SQS
    description: Collect Jamf Pro Log Stream access and change management logs via AWS S3 or SQS.
    template_path: aws_s3.yml.hbs
    vars:
      - name: queue_url
        type: text
        title: "[SQS] Queue URL"
        multi: false
        required: false
        show_user: true
        description: |-
          URL of the AWS SQS queue that messages will be received from. This is only required if you want to collect logs via AWS SQS. In order to avoid data loss, do not configure the same SQS queue for more than one data stream.
      - name: bucket_list_prefix
        type: text
        title: "[S3] Bucket Prefix"
        multi: false
        required: false
        show_user: true
        description: Prefix to apply for the list request to the S3 bucket.
      - name: interval
        type: text
        title: "[S3] Interval"
        multi: false
        required: false
        show_user: true
        default: 1m
        description: Time interval for polling listing of the S3 bucket. Supported units for this parameter are h/m/s.
      - name: number_of_workers
        type: integer
        title: "[S3/SQS] Number of Workers"
        multi: false
        required: false
        show_user: true
        default: 5
        description: Number of workers that will process the S3 objects listed.
      - name: start_timestamp
        type: text
        title: "[S3] Start Timestamp"
        multi: false
        required: false
        show_user: false
        description: |-
          If set, only read S3 objects with last modified timestamp newer than the given timestamp. Accepts a timestamp in `YYYY-MM-DDTHH:MM:SSZ` format.
      - name: ignore_older
        type: text
        title: "[S3] Ignore Older Timespan"
        multi: false
        required: false
        show_user: false
        description: |-
          If set, ignore S3 objects whose Last-Modified time is before the ignore older timespan. Accepts a duration like `48h`, `2h30m`.
      - name: visibility_timeout
        type: text
        title: "[SQS] Visibility Timeout"
        multi: false
        required: false
        show_user: true
        default: 300s
        description: The duration that the received messages are hidden from subsequent retrieve requests after being retrieved by a ReceiveMessage request. The maximum is 12 hours.
      - name: api_timeout
        type: text
        title: "[SQS] API Timeout"
        multi: false
        required: false
        show_user: true
        default: 120s
        description: The maximum duration of AWS API can take. The maximum is half of the visibility timeout value.
      - name: max_number_of_messages
        type: integer
        title: "[SQS] Maximum Concurrent SQS Messages"
        required: false
        show_user: true
        default: 5
        description: The maximum number of SQS messages that can be inflight at any time.
      - name: file_selectors
        type: yaml
        title: "[SQS] File Selectors"
        multi: false
        required: false
        show_user: false
        description: |-
          If the SQS queue will have events that correspond to files that this integration shouldn't process, file_selectors can be used to limit the files that are downloaded. This is a list of selectors which are made up of regex and expand_event_list_from_field options. The regex should match the S3 object key in the SQS message.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - jamf_pro-access
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
      - name: custom
        type: yaml
        title: Custom configurations
        description: >-
          Additional settings to be added to the configuration. Be careful using this as it might break the input as those settings are not validated and can override the settings specified above. See [`aws-s3` input settings docs](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-aws-s3.html) for details.
dataset: jamf_pro.access
elasticsearch:
  dynamic_dataset: true
  dynamic_namespace: true
  index_template:
    mappings:
      subobjects: false
