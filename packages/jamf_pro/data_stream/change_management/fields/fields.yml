- name: jamf_pro.change_management.operation
  type: keyword
  description: The change management operation performed (CREATE, READ, UPDATE, DELETE).
- name: jamf_pro.change_management.object_type
  type: keyword
  description: The type of object affected by the change, such as Computer, Policy, or Smart Computer Group.
- name: jamf_pro.change_management.actor.name
  type: keyword
  description: The name or email of the actor who performed the change.
- name: jamf_pro.change_management.actor.id
  type: keyword
  description: The Jamf Pro internal ID of the actor (-1 for system, 0 for API clients, positive integers for human users).
- name: jamf_pro.change_management.log_level
  type: keyword
  description: The log level of the change management entry (typically INFO).
- name: jamf_pro.change_management.thread
  type: keyword
  description: The application thread that generated the log entry.
- name: jamf_pro.change_management.object.id
  type: keyword
  description: The ID of the object affected by the change, extracted from the detail block.
- name: jamf_pro.change_management.object.name
  type: keyword
  description: The name of the object affected by the change, extracted from the detail block.
- name: jamf_pro.change_management.detail
  type: text
  description: The full detail block of the change management entry, containing configuration settings or object properties.
- name: aws.s3
  type: group
  fields:
    - name: bucket
      type: group
      fields:
        - name: name
          type: keyword
          description: Name of the S3 bucket that this log retrieved from.
        - name: arn
          type: keyword
          description: ARN of the S3 bucket that this log retrieved from.
    - name: object.key
      type: keyword
      description: Name of the S3 object that this log retrieved from.
- name: log.offset
  type: long
  description: Log offset.
