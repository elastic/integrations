title: Qdrant metrics
type: metrics
streams:
  - input: prometheus/metrics
    title: Qdrant metrics
    description: Collect REST, collection, cluster and memory metrics from Qdrant.
    vars:
      - name: hosts
        type: text
        title: Hosts
        description: Qdrant nodes to scrape, as host:port of the REST API.
        multi: true
        required: true
        show_user: true
        default:
          - localhost:6333
      - name: metrics_path
        type: text
        title: Metrics Path
        multi: false
        required: true
        show_user: false
        default: /metrics
      - name: period
        type: text
        title: Period
        multi: false
        required: true
        show_user: true
        default: 10s
      - name: metrics_filters.include
        type: text
        title: Metrics Filters Include
        description: Regular expressions of the metric names to collect. Metrics not mapped by this integration are dropped by the ingest pipeline.
        multi: true
        required: false
        show_user: false
        default:
          - ^collections_(total|vector_total)$
          - ^collection_(points|vectors)$
          - ^collection_running_optimizations$
          - ^collection_update_queue_(length|deferred_points)$
          - ^collection_(active_replicas_min|active_replicas_max|dead_replicas)$
          - ^collection_shard_transfer_(incoming|outgoing|failed)$
          - ^snapshot_(creation_running|recovery_running|created_total)$
          - ^rest_responses_total$
          - ^rest_responses_duration_seconds$
          - ^rest_responses_max_duration_seconds$
          - ^memory_(resident|allocated)_bytes$
          - ^cluster_enabled$
          - ^app_status_recovery_mode$
      - name: bearer_token_file
        type: text
        title: Bearer Token File
        description: File with the Qdrant API key, sent as a bearer token in the Authorization header, for nodes that require an API key.
        multi: false
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: SSL options for HTTPS endpoints, in YAML format.
        multi: false
        required: false
        show_user: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the events are shipped. See [Processors](https://www.elastic.co/guide/en/fleet/current/elastic-agent-processor-configuration.html) for details.

elasticsearch:
  index_mode: time_series
