---
description: Pipeline for processing Qdrant metrics.
processors:
  - set:
      tag: set_event_module
      field: event.module
      value: qdrant
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 8.17.0
  - rename:
      tag: rename_collections_total
      field: prometheus.collections_total.value
      target_field: qdrant.collections.total
      ignore_missing: true
  - rename:
      tag: rename_collections_vector_total
      field: prometheus.collections_vector_total.value
      target_field: qdrant.collections.vectors
      ignore_missing: true
  - rename:
      tag: rename_collection_points
      field: prometheus.collection_points.value
      target_field: qdrant.collection.points
      ignore_missing: true
  - rename:
      tag: rename_collection_vectors
      field: prometheus.collection_vectors.value
      target_field: qdrant.collection.vectors
      ignore_missing: true
  - rename:
      tag: rename_collection_running_optimizations
      field: prometheus.collection_running_optimizations.value
      target_field: qdrant.collection.optimizations.running
      ignore_missing: true
  - rename:
      tag: rename_collection_update_queue_length
      field: prometheus.collection_update_queue_length.value
      target_field: qdrant.collection.update_queue.length
      ignore_missing: true
  - rename:
      tag: rename_collection_update_queue_deferred_points
      field: prometheus.collection_update_queue_deferred_points.value
      target_field: qdrant.collection.update_queue.deferred_points
      ignore_missing: true
  - rename:
      tag: rename_collection_active_replicas_min
      field: prometheus.collection_active_replicas_min.value
      target_field: qdrant.replicas.active.min
      ignore_missing: true
  - rename:
      tag: rename_collection_active_replicas_max
      field: prometheus.collection_active_replicas_max.value
      target_field: qdrant.replicas.active.max
      ignore_missing: true
  - rename:
      tag: rename_collection_dead_replicas
      field: prometheus.collection_dead_replicas.value
      target_field: qdrant.replicas.dead
      ignore_missing: true
  - rename:
      tag: rename_collection_shard_transfer_incoming
      field: prometheus.collection_shard_transfer_incoming.value
      target_field: qdrant.shard_transfers.incoming
      ignore_missing: true
  - rename:
      tag: rename_collection_shard_transfer_outgoing
      field: prometheus.collection_shard_transfer_outgoing.value
      target_field: qdrant.shard_transfers.outgoing
      ignore_missing: true
  - rename:
      tag: rename_collection_shard_transfer_failed
      field: prometheus.collection_shard_transfer_failed.value
      target_field: qdrant.shard_transfers.failed
      ignore_missing: true
  - rename:
      tag: rename_snapshot_creation_running
      field: prometheus.snapshot_creation_running.value
      target_field: qdrant.snapshots.creation_running
      ignore_missing: true
  - rename:
      tag: rename_snapshot_recovery_running
      field: prometheus.snapshot_recovery_running.value
      target_field: qdrant.snapshots.recovery_running
      ignore_missing: true
  - rename:
      tag: rename_snapshot_created_total
      field: prometheus.snapshot_created_total.counter
      target_field: qdrant.snapshots.created.count
      ignore_missing: true
  - rename:
      tag: rename_rest_responses_total
      field: prometheus.rest_responses_total.counter
      target_field: qdrant.rest.responses.count
      ignore_missing: true
  - rename:
      tag: rename_rest_responses_duration_seconds
      field: prometheus.rest_responses_duration_seconds.histogram
      target_field: qdrant.rest.duration.histogram
      ignore_missing: true
  - rename:
      tag: rename_rest_responses_max_duration_seconds
      field: prometheus.rest_responses_max_duration_seconds.value
      target_field: qdrant.rest.duration.max.sec
      ignore_missing: true
  - rename:
      tag: rename_memory_resident_bytes
      field: prometheus.memory_resident_bytes.value
      target_field: qdrant.memory.resident.bytes
      ignore_missing: true
  - rename:
      tag: rename_memory_allocated_bytes
      field: prometheus.memory_allocated_bytes.value
      target_field: qdrant.memory.allocated.bytes
      ignore_missing: true
  - rename:
      tag: rename_cluster_enabled
      field: prometheus.cluster_enabled.value
      target_field: qdrant.cluster.enabled
      ignore_missing: true
  - rename:
      tag: rename_app_status_recovery_mode
      field: prometheus.app_status_recovery_mode.value
      target_field: qdrant.recovery_mode
      ignore_missing: true
  - rename:
      tag: rename_labels
      field: prometheus.labels
      target_field: qdrant.labels
      ignore_missing: true
  - remove:
      tag: remove_labels_instance_job
      field:
        - qdrant.labels.instance
        - qdrant.labels.job
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_labels
      fields:
        - qdrant.labels
      target_field: qdrant.labels_fingerprint
      ignore_missing: true
  - remove:
      tag: remove_prometheus
      field: prometheus
      ignore_missing: true
  - drop:
      tag: drop_unmapped_events
      description: Drop events that carry no metric mapped by this integration.
      if: ctx.qdrant == null || ctx.qdrant.keySet().stream().allMatch(k -> k == 'labels' || k == 'labels_fingerprint')
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
