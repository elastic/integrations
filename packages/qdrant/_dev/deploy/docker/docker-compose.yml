version: '2.3'
services:
  qdrant:
    image: docker.elastic.co/observability/stream:v0.18.0
    hostname: qdrant
    ports:
      - 6333
    volumes:
      - ./files:/files:ro
    environment:
      PORT: "6333"
    command:
      - http-server
      - --addr=:6333
      - --config=/files/config.yml
