format_version: 3.4.2
name: qdrant
title: "Qdrant"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: "Collect metrics from Qdrant vector databases: REST traffic and latency, points per collection, optimizations, replicas, shard transfers, snapshots and memory."
type: integration
categories:
  - observability
  - datastore
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/qdrant-logo.svg
    title: Qdrant logo
    size: 200x200
    type: image/svg+xml
policy_templates:
  - name: qdrant
    title: Qdrant metrics
    description: Collect metrics from the Qdrant Prometheus endpoint.
    inputs:
      - type: prometheus/metrics
        title: Collect Qdrant metrics
        description: Collect metrics from the /metrics endpoint of Qdrant nodes.
owner:
  github: elastic/integrations-triaging
  type: community
