    patterns:
    - "^%{IP:microsoft.exchange.clientipaddress_external}%{SPACE}%{IP:microsoft.exchange.clientipaddress_internal}$"
    ignore_failure: true
    ignore_missing: true
- split:
    tag: split_microsoft_exchange_clientipaddress_b002aac7
