    - microsoft.exchange.routingstatus
- set:
    tag: set_microsoft_exchange_logtype_4562c52c
    field: microsoft.exchange.logtype
    value: httpproxy
    ignore_empty_value: true
    ignore_failure: true
- grok:
    tag: grok_microsoft_exchange_authenticateduser_1471679f
    field: microsoft.exchange.authenticateduser
    patterns:
    - "%{DATA}\\\\%{NOTSPACE:user.name}"
    ignore_failure: true
    ignore_missing: true
- grok:
    tag: grok_microsoft_exchange_clientipaddress_b40c60e9
