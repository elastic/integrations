format_version: "3.0.0"
name: aegisbpf
title: "AegisBPF"
version: "0.1.0"
description: "Collect BPF-LSM runtime-security enforcement events (OCSF) from the AegisBPF agent."
type: integration
categories:
  - security
conditions:
  kibana:
    version: "^8.13.0 || ^9.0.0"
icons:
  - src: /img/aegisbpf-logo.svg
    title: AegisBPF
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: aegisbpf
    title: AegisBPF enforcement events
    description: Collect AegisBPF OCSF security events from a log file.
    inputs:
      - type: filestream
        title: Collect AegisBPF events (filestream)
        description: >-
          Collect AegisBPF OCSF events written as newline-delimited JSON (run the
          agent with --event-format ocsf and --log pointed at a file).
owner:
  github: ErenAri
  type: community
