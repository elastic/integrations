title: "AegisBPF events"
type: logs
streams:
  - input: filestream
    title: AegisBPF OCSF events
    description: Collect AegisBPF OCSF events from a newline-delimited JSON log file.
    template_path: filestream.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        multi: true
        required: true
        show_user: true
        default:
          - /var/log/aegisbpf/events.ocsf.json
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        show_user: false
        default:
          - aegisbpf-event
          - forwarded
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata.
          This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        multi: false
        required: false
        show_user: false
