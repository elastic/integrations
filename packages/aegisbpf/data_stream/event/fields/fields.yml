- name: aegisbpf
  type: group
  fields:
    - name: class_uid
      type: long
      description: OCSF class UID (1001 File Activity, 4001 Network Activity).
    - name: class_name
      type: keyword
      description: OCSF class name.
    - name: disposition
      type: keyword
      description: OCSF disposition (e.g. Blocked).
    - name: device
      type: long
      description: Kernel device identifier of the target file.
    - name: cgroup
      type: group
      fields:
        - name: id
          type: long
          description: cgroup ID (kernel-assigned).
        - name: path
          type: keyword
          description: cgroup filesystem path.
