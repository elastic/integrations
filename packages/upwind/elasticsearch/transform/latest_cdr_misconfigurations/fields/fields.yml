- name: upwind.configuration_findings
  type: group
  fields:
    - name: status
      type: keyword
    - name: severity
      type: keyword
    - name: last_seen_time
      type: date
    - name: last_sync_time
      type: date
    - name: check
      type: group
      fields:
        - name: description
          type: keyword
        - name: remediation
          type: keyword
    - name: framework
      type: group
      fields:
        - name: id
          type: keyword
        - name: description
          type: keyword
        - name: version
          type: keyword
        - name: revision
          type: keyword
        - name: status
          type: keyword
        - name: cloud_provider
          type: keyword
    - name: resource
      type: group
      fields:
        - name: arn
          type: keyword
        - name: cloud_account_tags
          type: flattened
        - name: risk_categories
          type: keyword
        - name: upwind_asset_id
          type: keyword
