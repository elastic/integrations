- name: upwind.vulnerability_findings
  type: group
  fields:
    - name: status
      type: keyword
    - name: source
      type: keyword
    - name: last_scan_time
      type: date
    - name: image
      type: group
      fields:
        - name: os_name
          type: keyword
        - name: os_version
          type: keyword
        - name: uri
          type: keyword
    - name: package
      type: group
      fields:
        - name: framework
          type: keyword
        - name: in_use
          type: boolean
        - name: introduced_by_layers
          type: flattened
    - name: remediation
      type: flattened
    - name: resource
      type: group
      fields:
        - name: cloud_account_tags
          type: flattened
        - name: cloud_organization_id
          type: keyword
        - name: cloud_organization_unit_id
          type: keyword
        - name: external_id
          type: keyword
        - name: internet_exposure
          type: flattened
        - name: resource_tags
          type: flattened
        - name: risk_categories
          type: keyword
        - name: upwind_asset_id
          type: keyword
    - name: vulnerability
      type: group
      fields:
        - name: cve_first_seen_time
          type: date
        - name: epss_score
          type: float
        - name: epss_severity
          type: keyword
        - name: exploitable
          type: boolean
        - name: exploitable_functions_in_use
          type: flattened
        - name: known_exploit_sources
          type: keyword
        - name: name
          type: keyword
        - name: nvd_cvss_v2_score
          type: float
        - name: nvd_cvss_v2_severity
          type: keyword
        - name: nvd_cvss_v4_score
          type: float
        - name: nvd_cvss_v4_severity
          type: keyword
        - name: nvd_description
          type: match_only_text
        - name: nvd_publish_time
          type: date
        - name: sbom_artifact_locations
          type: keyword
