---
description: Pipeline for processing Upwind threat detection events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  - fingerprint:
      fields:
        - json.id
        - json.last_seen_time
      target_field: _id
      tag: fingerprint_event
      ignore_missing: true
      description: Sets the document id from the detection id and last_seen_time so identical re-fetches from the 1 minute cursor overlap are deduplicated, while updated detections (newer last_seen_time) index as new documents.
  - date:
      field: json.first_seen_time
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: date_first_seen_time
      if: ctx.json?.first_seen_time != null
      on_failure:
        - append:
            tag: append_error_message_9f5c363e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.first_seen_time
      target_field: event.start
      formats:
        - ISO8601
      tag: date_event_start
      if: ctx.json?.first_seen_time != null
      on_failure:
        - append:
            tag: append_error_message_f2f54777
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.last_seen_time
      target_field: event.end
      formats:
        - ISO8601
      tag: date_event_end
      if: ctx.json?.last_seen_time != null
      on_failure:
        - append:
            tag: append_error_message_6bff159b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.id
      target_field: event.id
      ignore_missing: true
      tag: rename_id
  - rename:
      field: json.title
      target_field: message
      ignore_missing: true
      tag: rename_title
  - rename:
      field: json.description
      target_field: event.reason
      ignore_missing: true
      tag: rename_description
  - rename:
      field: json.upwind_console_link
      target_field: event.url
      ignore_missing: true
      tag: rename_upwind_console_link
  - rename:
      field: json.resource.id
      target_field: resource.id
      ignore_missing: true
      tag: rename_resource_id
  - rename:
      field: json.resource.name
      target_field: resource.name
      ignore_missing: true
      tag: rename_resource_name
  - rename:
      field: json.resource.type
      target_field: resource.type
      ignore_missing: true
      tag: rename_resource_type
  - rename:
      field: json.resource.cloud_provider
      target_field: cloud.provider
      ignore_missing: true
      tag: rename_cloud_provider
  - lowercase:
      field: cloud.provider
      ignore_missing: true
      tag: lowercase_cloud_provider
  - rename:
      field: json.resource.cloud_account_id
      target_field: cloud.account.id
      ignore_missing: true
      tag: rename_cloud_account_id
  - rename:
      field: json.resource.cloud_account_name
      target_field: cloud.account.name
      ignore_missing: true
      tag: rename_cloud_account_name
  - rename:
      field: json.resource.region
      target_field: cloud.region
      ignore_missing: true
      tag: rename_cloud_region
  - rename:
      field: json.resource.namespace
      target_field: orchestrator.namespace
      ignore_missing: true
      tag: rename_orchestrator_namespace
  - rename:
      field: json.resource.cluster_id
      target_field: orchestrator.cluster.id
      ignore_missing: true
      tag: rename_orchestrator_cluster_id
  - script:
      lang: painless
      description: Script to set event.severity.
      tag: set_event_severity
      if: ctx.json?.severity instanceof String
      source: |-
        ctx.event = ctx.event ?: [:];
        String severity_value = ctx.json.severity;
        if (severity_value.equalsIgnoreCase("low")) {
          ctx.event.severity = 21;
        } else if (severity_value.equalsIgnoreCase("medium")) {
          ctx.event.severity = 47;
        } else if (severity_value.equalsIgnoreCase("high")) {
          ctx.event.severity = 73;
        } else if (severity_value.equalsIgnoreCase("critical")) {
          ctx.event.severity = 99;
        }
      on_failure:
        - append:
            tag: append_error_message_d4ca1bc5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - set:
      field: threat.framework
      tag: set_threat_framework
      value: MITRE ATT&CK
      if: ctx.json?.mitre_attacks instanceof List && ctx.json.mitre_attacks.size() != 0
  - foreach:
      field: json.mitre_attacks
      tag: foreach_mitre_tactic_id
      if: ctx.json?.mitre_attacks instanceof List
      processor:
        append:
          field: threat.tactic.id
          tag: append_threat_tactic_id
          value: '{{{_ingest._value.tactic_id}}}'
          allow_duplicates: false
  - foreach:
      field: json.mitre_attacks
      tag: foreach_mitre_tactic_name
      if: ctx.json?.mitre_attacks instanceof List
      processor:
        append:
          field: threat.tactic.name
          tag: append_threat_tactic_name
          value: '{{{_ingest._value.tactic_name}}}'
          allow_duplicates: false
  - foreach:
      field: json.mitre_attacks
      tag: foreach_mitre_technique_id
      if: ctx.json?.mitre_attacks instanceof List
      processor:
        append:
          field: threat.technique.id
          tag: append_threat_technique_id
          value: '{{{_ingest._value.technique_id}}}'
          allow_duplicates: false
  - foreach:
      field: json.mitre_attacks
      tag: foreach_mitre_technique_name
      if: ctx.json?.mitre_attacks instanceof List
      processor:
        append:
          field: threat.technique.name
          tag: append_threat_technique_name
          value: '{{{_ingest._value.technique_name}}}'
          allow_duplicates: false
  - script:
      lang: painless
      tag: extract_trigger_initiators
      description: Extract CloudTrail-style initiator identities from trigger events into `user.name` and `related.user`.
      if: ctx.json?.triggers instanceof List
      source: |-
        Set users = new HashSet();
        for (t in ctx.json.triggers) {
          if (!(t instanceof Map) || !(t.events instanceof List)) {
            continue;
          }
          for (e in t.events) {
            if (e instanceof Map && e.initiator instanceof Map && e.initiator.name != null) {
              users.add(e.initiator.name);
            }
          }
        }
        if (users.isEmpty()) {
          return;
        }
        ctx.user = ctx.user ?: [:];
        ctx.user.name = ctx.user.name ?: users.iterator().next();
        ctx.related = ctx.related ?: [:];
        ctx.related.user = ctx.related.user ?: [];
        for (u in users) {
          if (!ctx.related.user.contains(u)) {
            ctx.related.user.add(u);
          }
        }
  - set:
      field: event.kind
      tag: set_event_kind
      value: alert
  - append:
      field: event.category
      tag: append_event_category
      value: intrusion_detection
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type
      value: info
      allow_duplicates: false
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Upwind
  - append:
      field: related.hosts
      tag: append_resource_name_to_related_hosts
      value: '{{{resource.name}}}'
      allow_duplicates: false
      if: ctx.resource?.name != null
  - rename:
      field: json.type
      target_field: upwind.threat_detections.type
      ignore_missing: true
      tag: rename_type
  - rename:
      field: json.category
      target_field: upwind.threat_detections.category
      ignore_missing: true
      tag: rename_category
  - rename:
      field: json.severity
      target_field: upwind.threat_detections.severity
      ignore_missing: true
      tag: rename_severity
  - rename:
      field: json.status
      target_field: upwind.threat_detections.status
      ignore_missing: true
      tag: rename_status
  - rename:
      field: json.occurrence_count
      target_field: upwind.threat_detections.occurrence_count
      ignore_missing: true
      tag: rename_occurrence_count
  - rename:
      field: json.evidences
      target_field: upwind.threat_detections.evidences
      ignore_missing: true
      tag: rename_evidences
  - rename:
      field: json.links
      target_field: upwind.threat_detections.links
      ignore_missing: true
      tag: rename_links
  - rename:
      field: json.metadata.vendor_name
      target_field: upwind.threat_detections.metadata.vendor_name
      ignore_missing: true
      tag: rename_metadata_vendor_name
  - rename:
      field: json.mitre_attacks
      target_field: upwind.threat_detections.mitre_attacks
      ignore_missing: true
      tag: rename_mitre_attacks
  - rename:
      field: json.triggers
      target_field: upwind.threat_detections.triggers
      ignore_missing: true
      tag: rename_triggers
  - rename:
      field: json.resource.cloud_account_tags
      target_field: upwind.threat_detections.resource.cloud_account_tags
      ignore_missing: true
      tag: rename_resource_cloud_account_tags
  - rename:
      field: json.resource.external_id
      target_field: upwind.threat_detections.resource.external_id
      ignore_missing: true
      tag: rename_resource_external_id
  - rename:
      field: json.resource.risk_categories
      target_field: upwind.threat_detections.resource.risk_categories
      ignore_missing: true
      tag: rename_resource_risk_categories
  - rename:
      field: json.resource.upwind_asset_id
      target_field: upwind.threat_detections.resource.upwind_asset_id
      ignore_missing: true
      tag: rename_resource_upwind_asset_id
  - rename:
      field: json.resource.internet_exposure
      target_field: upwind.threat_detections.resource.internet_exposure
      ignore_missing: true
      tag: rename_resource_internet_exposure
  - remove:
      field: json
      ignore_missing: true
      tag: remove_json
      description: All known fields are mapped; the remaining parsed object is dropped.
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_d1950926
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
