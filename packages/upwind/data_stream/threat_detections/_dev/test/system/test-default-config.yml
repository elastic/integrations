wait_for_data_timeout: 1m
input: cel
service: upwind-threat-detections-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  token_url: http://{{Hostname}}:{{Port}}/oauth/token
  client_id: test-client-id
  client_secret: test-client-secret
  organization_id: org-example-0001
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    batch_size: 2
    http_client_timeout: 60s
    preserve_original_event: true
assert:
  # Initial lookback is two pages (2 + 1). The resume poll, also two pages,
  # indexes one status-only change and one newer detection; the overlap
  # duplicate is dropped. Later polls use the caught-up bookmark and return
  # empty.
  hit_count: 5
