wait_for_data_timeout: 1m
input: cel
service: upwind-configuration-findings-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  token_url: http://{{Hostname}}:{{Port}}/oauth/token
  client_id: test-client-id
  client_secret: test-client-secret
  organization_id: org-example-0002
data_stream:
  vars:
    interval: 2s
    batch_size: 2
    http_client_timeout: 60s
    preserve_original_event: true
assert:
  # Round 1 is the documented envelope: two findings, then one more reached
  # through pagination.nextPageToken, ending when hasMoreData is false.
  # Later rounds return an empty envelope and index nothing.
  hit_count: 3
