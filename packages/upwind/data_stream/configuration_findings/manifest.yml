title: Configuration findings
type: logs
streams:
  - input: cel
    title: Upwind configuration findings
    description: Collect configuration findings from the Upwind Management API.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: Duration between requests to the Upwind Management API. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 1h
      - name: initial_interval
        type: text
        title: Initial Interval
        description: How far back to look for configuration findings on the first run. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: false
        default: 24h
      - name: batch_size
        type: integer
        title: Batch Size
        description: The number of configuration findings to request per page. The maximum supported value is determined by the Upwind API.
        multi: false
        required: true
        show_user: false
        default: 100
      - name: status
        type: text
        title: Finding Status
        description: 'Filter collected findings by evaluation status. Supported values: PASS, FAIL, ALL. The Upwind API defaults to FAIL when unset; the integration collects ALL by default so passing checks are available for compliance reporting.'
        multi: false
        required: true
        show_user: true
        default: ALL
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported units for this parameter are h/m/s.
        multi: false
        required: false
        show_user: false
        default: 30s
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        multi: false
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - upwind-configuration_findings
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        multi: false
        required: false
        show_user: false
