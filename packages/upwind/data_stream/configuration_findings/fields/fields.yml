- name: resource
  type: group
  fields:
    - name: id
      type: keyword
      description: The unique identifier of the resource evaluated by this finding.
    - name: name
      type: keyword
      description: The name of the resource evaluated by this finding.
    - name: type
      type: keyword
      description: The type of the resource evaluated by this finding.
- name: result
  type: group
  fields:
    - name: evaluation
      type: keyword
      description: The evaluation result of the configuration check, either passed or failed.
- name: upwind.configuration_findings
  type: group
  fields:
    - name: status
      type: keyword
      description: The evaluation status of this finding as reported by Upwind, PASS or FAIL.
    - name: severity
      type: keyword
      description: The severity level of this finding.
    - name: last_sync_time
      type: date
      description: The timestamp when this finding was last synchronized.
    - name: check
      type: group
      fields:
        - name: description
          type: keyword
          description: A detailed description of the configuration check.
        - name: remediation
          type: keyword
          description: Remediation guidance for the configuration check.
    - name: framework
      type: group
      fields:
        - name: id
          type: keyword
          description: The unique identifier for the compliance framework.
        - name: description
          type: keyword
          description: A description of the compliance framework.
        - name: version
          type: keyword
          description: The version of the compliance framework.
        - name: revision
          type: keyword
          description: The revision of the compliance framework.
        - name: status
          type: keyword
          description: The status of the compliance framework.
        - name: cloud_provider
          type: keyword
          description: The cloud provider the compliance framework applies to.
    - name: resource
      type: group
      fields:
        - name: arn
          type: keyword
          description: The ARN of this resource.
        - name: cloud_account_tags
          type: flattened
          description: List of tags associated with the cloud account the resource belongs to.
        - name: risk_categories
          type: keyword
          description: Risk categories associated with this resource.
        - name: upwind_asset_id
          type: keyword
          description: The Upwind asset identifier for this resource.
