---
description: Pipeline for processing Upwind configuration finding events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  - date:
      field: json.last_seen_time
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: date_last_seen_time
      if: ctx.json?.last_seen_time != null
      on_failure:
        - append:
            tag: append_error_message_cf0d98a2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.first_seen_time
      target_field: event.start
      formats:
        - ISO8601
      tag: date_event_start
      if: ctx.json?.first_seen_time != null
      on_failure:
        - append:
            tag: append_error_message_f2f54777
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.id
      target_field: event.id
      ignore_missing: true
      tag: rename_id
  - rename:
      field: json.title
      target_field: rule.name
      ignore_missing: true
      tag: rename_title
  - rename:
      field: json.description
      target_field: event.reason
      ignore_missing: true
      tag: rename_description
  - rename:
      field: json.check.id
      target_field: rule.id
      ignore_missing: true
      tag: rename_check_id
  - set:
      field: rule.uuid
      tag: set_rule_uuid
      copy_from: rule.id
      if: ctx.rule?.id != null
      description: Cloud security posture workflows require `rule.uuid`; the check identifier is the stable rule identity.
  - rename:
      field: json.check.title
      target_field: rule.description
      ignore_missing: true
      tag: rename_check_title
  - rename:
      field: json.framework.title
      target_field: rule.ruleset
      ignore_missing: true
      tag: rename_framework_title
  - set:
      field: result.evaluation
      tag: set_result_evaluation_passed
      value: passed
      if: ctx.json?.status == 'PASS'
  - set:
      field: result.evaluation
      tag: set_result_evaluation_failed
      value: failed
      if: ctx.json?.status == 'FAIL'
  - rename:
      field: json.resource.id
      target_field: resource.id
      ignore_missing: true
      tag: rename_resource_id
  - rename:
      field: json.resource.name
      target_field: resource.name
      ignore_missing: true
      tag: rename_resource_name
  - rename:
      field: json.resource.type
      target_field: resource.type
      ignore_missing: true
      tag: rename_resource_type
  - rename:
      field: json.resource.cloud_provider
      target_field: cloud.provider
      ignore_missing: true
      tag: rename_cloud_provider
  - lowercase:
      field: cloud.provider
      ignore_missing: true
      tag: lowercase_cloud_provider
  - rename:
      field: json.resource.cloud_account_id
      target_field: cloud.account.id
      ignore_missing: true
      tag: rename_cloud_account_id
  - rename:
      field: json.resource.cloud_account_name
      target_field: cloud.account.name
      ignore_missing: true
      tag: rename_cloud_account_name
  - rename:
      field: json.resource.region
      target_field: cloud.region
      ignore_missing: true
      tag: rename_cloud_region
  - rename:
      field: json.resource.namespace
      target_field: orchestrator.namespace
      ignore_missing: true
      tag: rename_orchestrator_namespace
  - rename:
      field: json.resource.cluster_id
      target_field: orchestrator.cluster.id
      ignore_missing: true
      tag: rename_orchestrator_cluster_id
  - script:
      lang: painless
      description: Script to set event.severity.
      tag: set_event_severity
      if: ctx.json?.severity instanceof String
      source: |-
        ctx.event = ctx.event ?: [:];
        String severity_value = ctx.json.severity;
        if (severity_value.equalsIgnoreCase("low")) {
          ctx.event.severity = 21;
        } else if (severity_value.equalsIgnoreCase("medium")) {
          ctx.event.severity = 47;
        } else if (severity_value.equalsIgnoreCase("high")) {
          ctx.event.severity = 73;
        } else if (severity_value.equalsIgnoreCase("critical")) {
          ctx.event.severity = 99;
        }
      on_failure:
        - append:
            tag: append_error_message_d4ca1bc5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag ''{{{_ingest.on_failure_processor_tag}}}'' failed: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type
      value: info
      allow_duplicates: false
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: Upwind
  - append:
      field: related.hosts
      tag: append_resource_name_to_related_hosts
      value: '{{{resource.name}}}'
      allow_duplicates: false
      if: ctx.resource?.name != null
  - rename:
      field: json.status
      target_field: upwind.configuration_findings.status
      ignore_missing: true
      tag: rename_status
  - rename:
      field: json.severity
      target_field: upwind.configuration_findings.severity
      ignore_missing: true
      tag: rename_severity
  - rename:
      field: json.last_sync_time
      target_field: upwind.configuration_findings.last_sync_time
      ignore_missing: true
      tag: rename_last_sync_time
  - rename:
      field: json.check.description
      target_field: upwind.configuration_findings.check.description
      ignore_missing: true
      tag: rename_check_description
  - rename:
      field: json.check.remediation
      target_field: upwind.configuration_findings.check.remediation
      ignore_missing: true
      tag: rename_check_remediation
  - rename:
      field: json.framework.id
      target_field: upwind.configuration_findings.framework.id
      ignore_missing: true
      tag: rename_framework_id
  - rename:
      field: json.framework.description
      target_field: upwind.configuration_findings.framework.description
      ignore_missing: true
      tag: rename_framework_description
  - rename:
      field: json.framework.version
      target_field: upwind.configuration_findings.framework.version
      ignore_missing: true
      tag: rename_framework_version
  - rename:
      field: json.framework.revision
      target_field: upwind.configuration_findings.framework.revision
      ignore_missing: true
      tag: rename_framework_revision
  - rename:
      field: json.framework.status
      target_field: upwind.configuration_findings.framework.status
      ignore_missing: true
      tag: rename_framework_status
  - rename:
      field: json.framework.cloud_provider
      target_field: upwind.configuration_findings.framework.cloud_provider
      ignore_missing: true
      tag: rename_framework_cloud_provider
  - rename:
      field: json.resource.arn
      target_field: upwind.configuration_findings.resource.arn
      ignore_missing: true
      tag: rename_resource_arn
  - rename:
      field: json.resource.cloud_account_tags
      target_field: upwind.configuration_findings.resource.cloud_account_tags
      ignore_missing: true
      tag: rename_resource_cloud_account_tags
  - rename:
      field: json.resource.risk_categories
      target_field: upwind.configuration_findings.resource.risk_categories
      ignore_missing: true
      tag: rename_resource_risk_categories
  - rename:
      field: json.resource.upwind_asset_id
      target_field: upwind.configuration_findings.resource.upwind_asset_id
      ignore_missing: true
      tag: rename_resource_upwind_asset_id
  - remove:
      field: json
      ignore_missing: true
      tag: remove_json
      description: All known fields are mapped; the remaining parsed object is dropped.
  - script:
      tag: script_to_drop_null_values
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_d1950926
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      tag: append_tags_d762b9c5
      field: tags
      value: preserve_original_event
      allow_duplicates: false
