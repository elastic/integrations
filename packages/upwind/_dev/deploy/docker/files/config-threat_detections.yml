            {
              "id": "uwd-regress00000003",
              "type": "cursor_regression_guard",
              "category": "CLOUD_LOGS",
              "severity": "LOW",
              "status": "OPEN",
              "title": "Cursor regression guard event 3",
              "first_seen_time": "2026-03-17T11:58:50Z",
