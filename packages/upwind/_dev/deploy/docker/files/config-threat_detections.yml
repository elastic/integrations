          {{ end }}
  # Unfiltered list used by test-api.py when --lookback is omitted.
  - path: /v1/organizations/org-example-0001/threat-detections
    methods: ['GET']
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          [
            {
              "id": "uwd-11111111111111aa",
              "type": "aws_cloudtrail_security_group_allow_traffic_to_all_ports",
              "category": "CLOUD_TRAIL",
              "severity": "MEDIUM",
              "status": "OPEN",
