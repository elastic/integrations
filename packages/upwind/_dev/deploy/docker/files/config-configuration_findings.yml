# Upwind configuration-findings mock (full posture).
#
# The list operation returns an envelope { resourceFindings, pagination } with
# token pagination: per-page and page-token query parameters, the next token in
# pagination.nextPageToken, terminating when pagination.hasMoreData is false.
# Every interval is a full re-list of current PASS and FAIL findings. There is
# no time bookmark.
#
# Rules, first match wins:
#   1. OAuth client-credentials token (audience is the API base URL).
#   2. Page 2 (page-token=cf-page-2-token): first hit → one FAIL finding,
#      later hits → empty terminal page.
#   3. First page (status=ALL, no page-token): first hit → FAIL + PASS and a
#      next-page token (round 1), second hit → one PASS finding (round 2 full
#      re-list), later hits → empty steady state.
rules:
  - path: /oauth/token
    methods: ['POST']
    query_params:
      grant_type: client_credentials
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {"access_token":"test-token","token_type":"Bearer","expires_in":86400}
  # Second page of a pagination round, requested with the opaque page token.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    query_params:
      page-token: cf-page-2-token
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {{ if eq .req_num 1 }}
          {
            "resourceFindings": [
              {
                "id": "ucf-33333333333333cc",
                "title": "CloudTrail is not enabled in all regions",
                "description": "Multi-region CloudTrail logging is disabled for this account.",
                "status": "FAIL",
                "severity": "HIGH",
                "first_seen_time": "2026-02-01T08:00:00Z",
                "last_seen_time": "{{ (now "-3h").Format "2006-01-02T15:04:05Z07:00" }}",
                "last_sync_time": "{{ (now "-3h").Format "2006-01-02T15:04:05Z07:00" }}",
                "check": {
                  "id": "check-cloudtrail-all-regions",
                  "title": "CloudTrail should be enabled in all regions",
                  "description": "Detects accounts without a multi-region trail.",
                  "remediation": "Create a multi-region CloudTrail trail with log file validation enabled."
                },
                "framework": {
                  "id": "cis-aws-v1",
                  "title": "CIS AWS Foundations",
                  "version": "1.5.0",
                  "status": "ENABLED",
                  "cloud_provider": "AWS"
                },
                "resource": {
                  "id": "arn:aws:iam::111111111111:root",
                  "arn": "arn:aws:iam::111111111111:root",
                  "name": "production",
                  "type": "AwsAccount",
                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-account-001",
                  "risk_categories": ["LOGGING"]
                }
              }
            ],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 2,
              "size": 1,
              "totalItems": 3
            }
          }
          {{ else }}
          {
            "resourceFindings": [],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 0,
              "size": 0,
              "totalItems": 0
            }
          }
          {{ end }}
  # First page of a full-posture sweep. status=ALL is required so both PASS
  # and FAIL findings are returned. Later hits model subsequent 24h runs.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    query_params:
      status: ALL
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {{ if eq .req_num 1 }}
          {
            "resourceFindings": [
              {
                "id": "ucf-11111111111111aa",
                "title": "S3 bucket allows public read access",
                "description": "The S3 bucket policy grants public read access to objects.",
                "status": "FAIL",
                "severity": "HIGH",
                "first_seen_time": "2026-01-15T12:00:00Z",
                "last_seen_time": "{{ (now "-1h").Format "2006-01-02T15:04:05Z07:00" }}",
                "last_sync_time": "{{ (now "-1h").Format "2006-01-02T15:04:05Z07:00" }}",
                "check": {
                  "id": "check-s3-public-read",
                  "title": "S3 bucket should not allow public read access",
                  "description": "Detects bucket policies or ACLs that expose objects publicly.",
                  "remediation": "Remove public principals from the bucket policy and enable Block Public Access."
                },
                "framework": {
                  "id": "cis-aws-v1",
                  "title": "CIS AWS Foundations",
                  "version": "1.5.0",
                  "status": "ENABLED",
                  "cloud_provider": "AWS"
                },
                "resource": {
                  "id": "arn:aws:s3:::example-logs-bucket",
                  "arn": "arn:aws:s3:::example-logs-bucket",
                  "name": "example-logs-bucket",
                  "type": "AwsS3Bucket",
                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-s3-001",
                  "risk_categories": ["DATA_EXPOSURE"]
                }
              },
              {
                "id": "ucf-22222222222222bb",
                "title": "Security group allows unrestricted SSH access",
                "description": "The security group allows inbound SSH (22/tcp) from 0.0.0.0/0.",
                "status": "PASS",
                "severity": "MEDIUM",
                "first_seen_time": "2026-02-10T09:30:00Z",
                "last_seen_time": "{{ (now "-2h").Format "2006-01-02T15:04:05Z07:00" }}",
                "last_sync_time": "{{ (now "-2h").Format "2006-01-02T15:04:05Z07:00" }}",
                "check": {
                  "id": "check-sg-open-ssh",
                  "title": "Security groups should not allow unrestricted SSH",
                  "description": "Detects security groups exposing SSH to the internet.",
                  "remediation": "Restrict inbound SSH to known administrative CIDR ranges."
                },
                "framework": {
                  "id": "cis-aws-v1",
                  "title": "CIS AWS Foundations",
                  "version": "1.5.0",
                  "status": "ENABLED",
                  "cloud_provider": "AWS"
                },
                "resource": {
                  "id": "sg-00000000000000001",
                  "arn": "arn:aws:ec2:us-east-1:111111111111:security-group/sg-00000000000000001",
                  "name": "app-servers",
                  "type": "AwsEc2SecurityGroup",
                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-sg-001",
                  "risk_categories": ["NETWORK"]
                }
              }
            ],
            "pagination": {
              "hasMoreData": true,
              "nextPageToken": ["cf-page-2-token"],
              "offset": 0,
              "size": 2,
              "totalItems": 3
            }
          }
          {{ else if eq .req_num 2 }}
          {
            "resourceFindings": [
              {
                "id": "ucf-44444444444444dd",
                "title": "Root account has active access keys",
                "description": "Access keys exist for the AWS account root user.",
                "status": "PASS",
                "severity": "CRITICAL",
                "first_seen_time": "2026-03-20T07:10:00Z",
                "last_seen_time": "{{ (now "-30m").Format "2006-01-02T15:04:05Z07:00" }}",
                "last_sync_time": "{{ (now "-30m").Format "2006-01-02T15:04:05Z07:00" }}",
                "check": {
                  "id": "check-root-access-keys",
                  "title": "Root account access keys should not exist",
                  "description": "Detects active access keys on the root user.",
                  "remediation": "Delete root user access keys and use IAM roles instead."
                },
                "framework": {
                  "id": "cis-aws-v1",
                  "title": "CIS AWS Foundations",
                  "version": "1.5.0",
                  "status": "ENABLED",
                  "cloud_provider": "AWS"
                },
                "resource": {
                  "id": "arn:aws:iam::111111111111:root",
                  "arn": "arn:aws:iam::111111111111:root",
                  "name": "production",
                  "type": "AwsIamUser",
                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-iam-root-001",
                  "risk_categories": ["IAM"]
                }
              }
            ],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 0,
              "size": 1,
              "totalItems": 1
            }
          }
          {{ else }}
          {
            "resourceFindings": [],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 0,
              "size": 0,
              "totalItems": 0
            }
          }
          {{ end }}
