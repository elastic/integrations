# Upwind configuration-findings mock.
#
# The list operation returns an envelope { resourceFindings, pagination } with
# token pagination: per-page and page-token query parameters, the next token in
# pagination.nextPageToken (and a Link rel="next" header), terminating when
# pagination.hasMoreData is false. Incremental collection is a time bookmark:
# min-last-seen-time is the previous max(last_seen_time) minus a 1 minute
# overlap. The bookmark only advances when a pagination round completes.
#
# Rules, first match wins:
#   1. OAuth client-credentials token (audience is the API base URL).
#   2. Page 2 (page-token=cf-page-2-token) → one finding, hasMoreData false.
#   3. Caught-up bookmark 2026-03-20T07:09:00Z → empty page (terminal window).
#   4. Resume bookmark 2026-03-20T06:59:00Z → one newer finding.
#   5. Any other min-last-seen-time:
#        first hit → two findings + next page token (initial lookback window)
#        later hits → three extra findings (cursor regression guard)
#   6. List with no time filter (research test-api.py without --lookback).
rules:
  - path: /oauth/token
    methods: ['POST']
    query_params:
      grant_type: client_credentials
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {"access_token":"test-token","token_type":"Bearer","expires_in":86400}
  # Second page of a pagination round, requested with the opaque page token.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    query_params:
      page-token: cf-page-2-token
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {
            "resourceFindings": [
              {
                "id": "ucf-33333333333333cc",
                "title": "CloudTrail is not enabled in all regions",
                "description": "Multi-region CloudTrail logging is disabled for this account.",
                "status": "FAIL",
                "severity": "HIGH",
                "first_seen_time": "2026-02-01T08:00:00Z",
                "last_seen_time": "2026-03-20T07:00:00Z",
                "last_sync_time": "2026-03-20T07:05:00Z",
                "check": {
                  "id": "check-cloudtrail-all-regions",
                  "title": "CloudTrail should be enabled in all regions",
                  "description": "Detects accounts without a multi-region trail.",
                  "remediation": "Create a multi-region CloudTrail trail with log file validation enabled."
                },
                "framework": {
                  "id": "cis-aws-v1",
                  "title": "CIS AWS Foundations",
                  "version": "1.5.0",
                  "status": "ENABLED",
                  "cloud_provider": "AWS"
                },
                "resource": {
                  "id": "arn:aws:iam::111111111111:root",
                  "arn": "arn:aws:iam::111111111111:root",
                  "name": "production",
                  "type": "AwsAccount",
                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-account-001",
                  "risk_categories": ["LOGGING"]
                }
              }
            ],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 2,
              "size": 1,
              "totalItems": 3
            }
          }
  # Terminal window: cursor has reached the newest fixture timestamp.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    query_params:
      min-last-seen-time: "2026-03-20T07:09:00Z"
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {
            "resourceFindings": [],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 0,
              "size": 0,
              "totalItems": 0
            }
          }
  # Cursor resume: min-last-seen-time is max(last_seen_time) from the first
  # round (2026-03-20T07:00:00Z) minus the 1 minute overlap.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    query_params:
      min-last-seen-time: "2026-03-20T06:59:00Z"
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |
          {
            "resourceFindings": [
              {
                "id": "ucf-44444444444444dd",
                "title": "Root account has active access keys",
                "description": "Access keys exist for the AWS account root user.",
                "status": "FAIL",
                "severity": "CRITICAL",
                "first_seen_time": "2026-03-20T07:10:00Z",
                "last_seen_time": "2026-03-20T07:10:00Z",
                "last_sync_time": "2026-03-20T07:12:00Z",
                "check": {
                  "id": "check-root-access-keys",
                  "title": "Root account access keys should not exist",
                  "description": "Detects active access keys on the root user.",
                  "remediation": "Delete root user access keys and use IAM roles instead."
                },
                "framework": {
                  "id": "cis-aws-v1",
                  "title": "CIS AWS Foundations",
                  "version": "1.5.0",
                  "status": "ENABLED",
                  "cloud_provider": "AWS"
                },
                "resource": {
                  "id": "arn:aws:iam::111111111111:root",
                  "arn": "arn:aws:iam::111111111111:root",
                  "name": "production",
                  "type": "AwsIamUser",
                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-iam-root-001",
                  "risk_categories": ["IAM"]
                }
              }
            ],
            "pagination": {
              "hasMoreData": false,
              "nextPageToken": [],
              "offset": 0,
              "size": 1,
              "totalItems": 1
            }
          }
  # Initial lookback (any other min-last-seen-time) and regression guard.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    query_params:
      min-last-seen-time: "{minLastSeen:.*}"
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
          Link:
            - '<http://{{ hostname }}:{{ env "PORT" }}/v1/organizations/org-example-0001/configuration-findings?page-token=cf-page-2-token>; rel="next"'
        body: |
          {{ if eq .req_num 1 }}
          {
            "resourceFindings": [
              {
                "id": "ucf-11111111111111aa",
                "title": "S3 bucket allows public read access",
