            }
          }
          {{ else }}
          {
            "resourceFindings": [
              {
                "id": "ucf-regress00000001",
                "title": "Cursor regression guard finding 1",
                "description": "Returned only when the time bookmark regressed to the initial window.",
                "status": "FAIL",
                "severity": "LOW",
                "first_seen_time": "2026-03-20T06:00:00Z",
                "last_seen_time": "2026-03-20T06:00:00Z",
                "last_sync_time": "2026-03-20T06:05:00Z",
                "resource": {"id": "arn:aws:s3:::guard-bucket-1", "name": "guard-bucket-1", "type": "AwsS3Bucket", "cloud_provider": "AWS", "cloud_account_id": "111111111111"}
              },
