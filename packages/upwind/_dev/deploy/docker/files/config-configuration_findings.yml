                  "cloud_provider": "AWS",
                  "cloud_account_id": "111111111111",
                  "cloud_account_name": "production",
                  "region": "us-east-1",
                  "upwind_asset_id": "asset-s3-001",
                  "risk_categories": ["DATA_EXPOSURE"]
                }
              },
              {
                "id": "ucf-22222222222222bb",
                "title": "Security group allows unrestricted SSH access",
                "description": "The security group allows inbound SSH (22/tcp) from 0.0.0.0/0.",
                "status": "FAIL",
