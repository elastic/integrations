          {{ end }}
  # Unfiltered list used by test-api.py when --lookback is omitted.
  - path: /v1/organizations/org-example-0001/configuration-findings
    methods: ['GET']
    request_headers:
      Authorization:
        - Bearer test-token
      Accept:
        - application/json
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
          Link:
            - '<http://{{ hostname }}:{{ env "PORT" }}/v1/organizations/org-example-0001/configuration-findings?page-token=cf-page-2-token>; rel="next"'
        body: |
          {
            "resourceFindings": [
