            },
            "timed_out": false,
            "took": 95
          }
  # Round 1 — terminal scroll page (resumes scrollPage2). Empty hits stops pagination.
  - path: /sources/v1/noncommunities/scroll
    methods: ['POST']
    query_params:
      scroll: "2m"
    request_body: '/.*scrollPage2.*/'
    request_headers:
      Authorization:
        - "Bearer xxxx"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {
            "_scroll_id": "scrollPage2",
            "hits": { "max_score": null, "total": 4, "hits": [] },
            "timed_out": false,
            "took": 12
          }
  # Round 2 — terminal scroll page (resumes scrollRound2). Empty hits stops pagination.
  # Also acts as a regression guard: if the cursor were cleared/regressed, round 2 would
  # re-issue the initial search and re-collect round 1 events, inflating hit_count.
  - path: /sources/v1/noncommunities/scroll
    methods: ['POST']
    query_params:
      scroll: "2m"
    request_body: '/.*scrollRound2.*/'
    request_headers:
      Authorization:
        - "Bearer xxxx"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {
            "_scroll_id": "scrollRound2",
            "hits": { "max_score": null, "total": 1, "hits": [] },
            "timed_out": false,
            "took": 8
          }
