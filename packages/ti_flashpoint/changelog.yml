# newer versions go on top
- version: "0.7.0"
  changes:
    - description: Add the `labels.is_ioc_transform_source` field to the source data stream and transform destination index, and deprecate the non-standard `labels.is_transform_source` field, so the built-in Threat Intel detection rules exclude the raw source indices and only match the latest transform destination indices. Backing indices created before the upgrade cannot be relabeled, so their documents stay visible to the built-in rules until they age out of the rules' 30-day window.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22249
- version: "0.6.1"
  changes:
    - description: Statically map `event.ingested` in transform destination indices so detection rules using it as the timestamp override do not report empty destination indices as missing the field.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22123
- version: "0.6.0"
  changes:
    - description: Add `sighting` and `breach` data streams to collect Flashpoint Compromised Credentials Monitoring - Enterprise (CCM-E) credential exposure records and breach metadata.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22075
- version: "0.5.0"
  changes:
    - description: Remove redundant ECS field definitions and the catch-all dynamic template from the transforms, relying on the `ecs@mappings` component template.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21585
- version: "0.4.0"
  changes:
    - description: Add X-FP-IntegrationPlatform, X-FP-IntegrationVersion and X-FP-IntegrationPlatformVersion client identification headers to all API requests.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20566
- version: "0.3.2"
  changes:
    - description: Set agentless deployment mode `release` field to `ga`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20463
- version: "0.3.1"
  changes:
    - description: Fix transform destination to use keyword for data_stream.namespace, allowing multi-namespace deployments.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20002
- version: "0.3.0"
  changes:
    - description: Use new `release` field for agentless deployment mode to establish as beta.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18552
- version: "0.2.0"
  changes:
    - description: Use num_failure_retries instead of unattended mode for transform failure recovery.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18404
- version: 0.1.0
  changes:
    - description: Initial release.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18000
