---
description: Pipeline for processing Compromised Credential Breach logs.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 9.3.0
  - terminate:
      description: error message set and no data to process.
      tag: terminate_data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null

  # Remove Agentless metadata fields as they can collide with ECS fields.
  - remove:
      description: Removes the fields added by Agentless as metadata, as they can collide with ECS fields.
      tag: remove_agentless_tags
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      field:
        - organization
        - division
        - team
      ignore_missing: true

  # Preserve the original event and parse the JSON payload.
  - rename:
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      tag: rename_message_to_event_original
      if: ctx.event?.original == null
      field: message
      target_field: event.original
      ignore_missing: true
  - remove:
      description: The `message` field is no longer required if the document has an `event.original` field.
      tag: remove_message
      if: ctx.event?.original != null
      field: message
      ignore_missing: true
  - json:
      tag: json_event_original_into_json
      field: event.original
      target_field: json

  # Set a deterministic document _id for deduplication (unique per breach).
  - fingerprint:
      tag: fingerprint_breach
      if: ctx.json?.fpid != null && ctx.json.fpid != ''
      fields:
        - json.fpid
        - json.header_.indexed_at
      target_field: _id
      ignore_missing: true

  # Move the payload under the vendor namespace and normalize the few hyphenated field names.
  - rename:
      tag: rename_json_to_ti_flashpoint_breach
      field: json
      target_field: ti_flashpoint.breach
      ignore_missing: true
  - rename:
      tag: rename_created_at_date_time
      field: ti_flashpoint.breach.created_at.date-time
      target_field: ti_flashpoint.breach.created_at.date_time
      ignore_missing: true
  - rename:
      tag: rename_first_observed_at_date_time
      field: ti_flashpoint.breach.first_observed_at.date-time
      target_field: ti_flashpoint.breach.first_observed_at.date_time
      ignore_missing: true

  # The shape of `breach_intersections` is not documented. Keep the object form (or a list
  # of objects) under `breach_intersections` and route scalar values to
  # `breach_intersections_keyword` so the two shapes cannot cause a mapping conflict.
  - rename:
      tag: rename_breach_intersections_to_breach_intersections_keyword
      if: >-
        ctx.ti_flashpoint?.breach?.breach_intersections != null &&
        !(ctx.ti_flashpoint.breach.breach_intersections instanceof Map) &&
        !(ctx.ti_flashpoint.breach.breach_intersections instanceof List)
      field: ti_flashpoint.breach.breach_intersections
      target_field: ti_flashpoint.breach.breach_intersections_keyword
      ignore_missing: true

  # Type-safety conversions.
  - convert:
      tag: convert_total_records_to_long
      field: ti_flashpoint.breach.total_records
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_total_records_on_failure
            field: ti_flashpoint.breach.total_records
            ignore_missing: true
        - append:
            tag: append_error_total_records
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_unique_records_to_long
      field: ti_flashpoint.breach.unique_records
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_unique_records_on_failure
            field: ti_flashpoint.breach.unique_records
            ignore_missing: true
        - append:
            tag: append_error_unique_records
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_new_records_to_long
      field: ti_flashpoint.breach.new_records
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_new_records_on_failure
            field: ti_flashpoint.breach.new_records
            ignore_missing: true
        - append:
            tag: append_error_new_records
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_old_records_to_long
      field: ti_flashpoint.breach.old_records
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_old_records_on_failure
            field: ti_flashpoint.breach.old_records
            ignore_missing: true
        - append:
            tag: append_error_old_records
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # Date parsing. Flashpoint timestamps arrive as ISO8601 strings (`*.date-time`) or
  # UNIX epoch seconds (`*.timestamp`, `header_.indexed_at`); accept both.
  - date:
      tag: date_header_indexed_at_into_timestamp
      if: ctx.ti_flashpoint?.breach?.header_?.indexed_at != null
      field: ti_flashpoint.breach.header_.indexed_at
      target_field: '@timestamp'
      formats:
        - ISO8601
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_indexed_at
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_created_at_timestamp
      if: ctx.ti_flashpoint?.breach?.created_at?.timestamp != null
      field: ti_flashpoint.breach.created_at.timestamp
      target_field: ti_flashpoint.breach.created_at.timestamp
      formats:
        - UNIX
        - ISO8601
      on_failure:
        - remove:
            tag: remove_created_at_timestamp_on_failure
            field: ti_flashpoint.breach.created_at.timestamp
            ignore_missing: true
        - append:
            tag: append_error_created_at_timestamp
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_first_observed_at_timestamp
      if: ctx.ti_flashpoint?.breach?.first_observed_at?.timestamp != null
      field: ti_flashpoint.breach.first_observed_at.timestamp
      target_field: ti_flashpoint.breach.first_observed_at.timestamp
      formats:
        - UNIX
        - ISO8601
      on_failure:
        - remove:
            tag: remove_first_observed_at_timestamp_on_failure
            field: ti_flashpoint.breach.first_observed_at.timestamp
            ignore_missing: true
        - append:
            tag: append_error_first_observed_at_timestamp
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_created_at_date_time
      if: ctx.ti_flashpoint?.breach?.created_at?.date_time != null && ctx.ti_flashpoint.breach.created_at.date_time != ''
      field: ti_flashpoint.breach.created_at.date_time
      target_field: ti_flashpoint.breach.created_at.date_time
      formats:
        - ISO8601
        - UNIX
      on_failure:
        - remove:
            tag: remove_created_at_date_time_on_failure
            field: ti_flashpoint.breach.created_at.date_time
            ignore_missing: true
        - append:
            tag: append_error_created_at_date_time
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_first_observed_at_date_time
      if: ctx.ti_flashpoint?.breach?.first_observed_at?.date_time != null && ctx.ti_flashpoint.breach.first_observed_at.date_time != ''
      field: ti_flashpoint.breach.first_observed_at.date_time
      target_field: ti_flashpoint.breach.first_observed_at.date_time
      formats:
        - ISO8601
        - UNIX
      on_failure:
        - remove:
            tag: remove_first_observed_at_date_time_on_failure
            field: ti_flashpoint.breach.first_observed_at.date_time
            ignore_missing: true
        - append:
            tag: append_error_first_observed_at_date_time
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_first_observed_at_into_event_start
      if: ctx.ti_flashpoint?.breach?.first_observed_at?.date_time != null && ctx.ti_flashpoint.breach.first_observed_at.date_time != ''
      field: ti_flashpoint.breach.first_observed_at.date_time
      target_field: event.start
      formats:
        - ISO8601
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_event_start
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_created_at_into_event_created
      if: ctx.ti_flashpoint?.breach?.created_at?.date_time != null && ctx.ti_flashpoint.breach.created_at.date_time != ''
      field: ti_flashpoint.breach.created_at.date_time
      target_field: event.created
      formats:
        - ISO8601
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_event_created
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # event.*
  - set:
      tag: set_event_kind_to_event
      field: event.kind
      value: event
  - append:
      tag: append_threat_into_event_category
      field: event.category
      value: threat
      allow_duplicates: false
  - append:
      tag: append_indicator_into_event_type
      field: event.type
      value: indicator
      allow_duplicates: false

  # related.*
  - foreach:
      tag: foreach_top_domains_into_related_hosts
      field: ti_flashpoint.breach.top_domains
      ignore_missing: true
      processor:
        append:
          tag: append_top_domain_into_related_hosts
          field: related.hosts
          value: '{{{_ingest._value}}}'
          allow_duplicates: false

  # Cleanup
  - remove:
      tag: remove_ti_flashpoint_breach_header
      field:
        - ti_flashpoint.breach.header_
      ignore_missing: true
  - script:
      description: This script processor iterates over the whole document to remove fields with null values.
      tag: script_to_drop_null_values
      lang: painless
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      tag: set_event_kind_to_pipeline_error
      if: ctx.error?.message != null
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_into_tags
      if: ctx.error?.message != null
      field: tags
      value: preserve_original_event
      allow_duplicates: false
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_to_pipeline_error_on_failure
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_into_tags_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
