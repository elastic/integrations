- name: ti_flashpoint
  type: group
  fields:
    - name: breach
      type: group
      fields:
        - name: fpid
          type: keyword
          description: Flashpoint ID of the breach.
        - name: basetypes
          type: keyword
          description: Array containing underlying base type of breach object, i.e. ["breach"].
        - name: breach_type
          type: keyword
          description: Constant for future use ("credential").
        - name: title
          type: keyword
          description: Title of breach.
        - name: source
          type: keyword
          description: Actual source of where the dump was found (i.e. Analyst Research, or a URL).
        - name: source_type
          type: keyword
          description: Data source of breach (Analyst Research, Credential Stealer, Paste, Flashpoint Extracted, Phishing).
        - name: created_at
          type: group
          description: Time object for when this breach was created at.
          fields:
            - name: date_time
              type: date
              description: Datetime object formatted as YYYY-mm-ddTHH:MM:SSZ.
            - name: timestamp
              type: date
              description: UNIX timestamp.
        - name: first_observed_at
          type: group
          description: Time object for when this breach was first seen at Flashpoint.
          fields:
            - name: date_time
              type: date
              description: Datetime object formatted as YYYY-mm-ddTHH:MM:SSZ.
            - name: timestamp
              type: date
              description: UNIX timestamp.
        - name: total_records
          type: long
          description: Total number of records in this breach.
        - name: unique_records
          type: long
          description: Total number of unique records in this breach.
        - name: new_records
          type: long
          description: Number of credentials first found in this breach.
        - name: old_records
          type: long
          description: Number of previously seen credentials found in this breach.
        - name: top_domains
          type: keyword
          description: 20 most frequently found domains in this breach.
        - name: top_passwords
          type: keyword
          description: 20 most frequently found passwords in this breach.
        - name: breach_intersections_keyword
          type: keyword
          description: 20 other breaches that contained the most credentials in common with this one and the number of common credentials, retained here when delivered as a string.
