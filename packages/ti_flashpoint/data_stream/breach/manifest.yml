title: Breach
type: logs
streams:
  - input: cel
    title: Breach
    description: Collect Compromised Credential Breach logs from Flashpoint.
    template_path: cel.yml.hbs
    enabled: false
    vars:
      - name: initial_interval
        type: text
        title: Initial Interval
        multi: false
        required: true
        show_user: true
        description: How far back to pull Compromised Credential Breaches from the Flashpoint API on the first run. Supported units for this parameter are h/m/s.
        default: 24h
      - name: interval
        type: text
        title: Interval
        description: Duration between requests to the Flashpoint API. Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 5m
      - name: page_size
        type: integer
        title: Page Size
        description: Page size for the response of the Flashpoint API.
        multi: false
        required: true
        show_user: false
        default: 1000
      - name: max_executions
        type: integer
        title: Maximum Pages Per Interval
        description: Maximum Pages Per Interval is the maximum number of pages that can be collected at each interval.
        multi: false
        required: false
        show_user: false
        default: 1000
      - name: resource_rate_limit_limit
        type: text
        title: Resource Rate Limit
        description: In requests per second. This controls polling frequency. If left empty, no client-side rate limit is applied.
        multi: false
        required: false
        show_user: false
      - name: resource_rate_limit_burst
        type: integer
        title: Resource Rate Limit Burst
        description: In requests. The maximum number of requests that can be immediately made following an idle period. If left empty, no client-side burst limit is applied.
        multi: false
        required: false
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        multi: false
        default: false
        required: false
        show_user: false
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field event.original.
        multi: false
        required: false
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data-stream.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - ti_flashpoint-breach
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 30s
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
