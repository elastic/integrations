  - script:
      lang: painless
      tag: script_to_set_SEVERITY_LEVEL_d62ac01f
      description: Script to set SEVERITY_LEVEL for different ranges.
      params:
        vuln_level:
          "0": None
          "1": Minimal
          "2": Medium
          "3": Serious
          "4": Critical
          "5": Urgent
        vuln_types:
          - Potential Vulnerability
          - Vulnerability
          - Vulnerability or Potential Vulnerability
          - Information Gathered
      source: >-
        if (!(ctx.qualys_vmdr?.asset_host_detection?.knowledge_base?.SEVERITY_LEVEL instanceof String)) {
          return;
        }
        def vuln_type = ctx.qualys_vmdr?.asset_host_detection?.knowledge_base?.vuln_type;
        if (!(vuln_type instanceof String)) {
          return;
        }
        String level = ctx.qualys_vmdr.asset_host_detection.knowledge_base.SEVERITY_LEVEL;
        if (params.vuln_types.contains(vuln_type)) {
          ctx.qualys_vmdr.asset_host_detection.knowledge_base.SEVERITY_LEVEL = params.vuln_level.getOrDefault(level, params.vuln_level["0"]);
        }
      on_failure:
        - append:
            tag: append_error_message_7e49dfaa
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
