  - script:
      lang: painless
      tag: script_to_remove_null_values_0f064478
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
      on_failure:
        - append:
            tag: append_error_message_2dc525b4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_to_truncate_long_fields_68a9333e
      lang: painless
      description: Truncate fields that are over length.
      source: |-
        def filterMassive(def src) {
          if (src instanceof Map) {
            for (def entry: src.entrySet()) {
              entry.setValue(filterMassive(entry.getValue()));
            }
            return src;
          } else if (src instanceof List) {
            for (int i = 0; i < src.length; i++) {
              src[i] = filterMassive(src[i]);
            }
            return src;
          } else if (src instanceof String && src.length() > 32766) {
            return src.substring(0, 32700)+' (truncated)';
          }
          return src;
        }
        filterMassive(ctx);
