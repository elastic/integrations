title: "Events"
type: logs
streams:
  - input: cel
    title: Sailpoint Identity Security Cloud Events
    description: "Request settings for Sailpoint Identity Security Cloud."
    enabled: true
    template_path: cel.yml.hbs
    vars:
      - name: token_scopes
        type: text
        title: Token Scopes
        multi: true
        description: Scopes for OAuth2 token.
        required: true
        show_user: false
        secret: false
        default:
          - "sp:search:read"
      - name: interval
        type: text
        title: Interval
        description: "Data for all managed accounts will be re-fetched at this interval."
        show_user: false
        required: true
        default: "60s"
      - name: limit
        type: integer
        title: Limit
        description: "Specifies the number of events to fetch per request."
        show_user: true
        required: true
        default: 250
      - name: initial_interval
        type: text
        title: Initial Interval
        description: "Initial delay before the first data fetch."
        multi: false
        required: true
        show_user: false
        default: "2160h"
      - name: tags
        type: text
        title: Tags
        description: "Tags to be applied to events, such as 'forwarded' or 'Sailpoint Identity Security Cloud Event'."
        multi: true
        show_user: false
        default:
          - forwarded
          - sailpoint_identity_sc.events
      - name: preserve_original_event
        type: bool
        title: Preserve Original Event
        description: "When enabled, keeps a raw copy of the original event in the `event.original` field."
        required: true
        show_user: false
        multi: false
        default: false
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracing
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
        default: false
        multi: false
        required: false
        show_user: false
      - name: processors
        type: yaml
        title: Processors
        description: "Processors can alter the events by reducing the number of fields or adding additional metadata. This is performed in the agent before the logs are parsed."
        multi: false
        required: false
        show_user: false
