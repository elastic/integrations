---
description: Pipeline for processing sailpoint identity security cloud events
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: "8.11.0"
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_sailpoint_identity_sc_events_a30ddfa6
      field: event.original
      target_field: sailpoint_identity_sc.events

  - fingerprint:
      fields:
        - sailpoint_identity_sc.events.id
      tag: fingerprinting
      target_field: "_id"
      on_failure:
        - append:
            tag: append_error_message_e87bbabd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  ##################### Scripts for processing input #####################
  - script:
      tag: script_a3eb5add
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
        

  - script:
      description: Convert Additional Info keys to snake case.
      tag: additional-info-keys-to-snake-case
      lang: painless
      source: |
        Map keysToSnakeCase(Map m) {
          def regex = /_?([a-z])([A-Z]+)/;
          def snakeCaseMap = [:];
          for (entry in m.entrySet()) {
            def k = entry.getKey();
            def v = entry.getValue();
            if (v instanceof Map) {
              v = keysToSnakeCase(v);
            } else if (v instanceof List) {
              for (int i = 0; i < v.size(); i++) {
                def item = v.get(i);
                if (item instanceof Map) {
                  v.set(i, keysToSnakeCase(item));
                }
              }
            }
            k = regex.matcher(k).replaceAll('$1_$2').toLowerCase();
            snakeCaseMap.put(k, v);
          }
          return snakeCaseMap;
        }
        if (ctx.sailpoint_identity_sc.events != null) {
          ctx.sailpoint_identity_sc.events = keysToSnakeCase(ctx.sailpoint_identity_sc.events);
        }
  ##################### ECS Fields #####################
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event

  - append:
      tag: append_event_category_576de059
      field: event.category
      value: iam
  - set:
      tag: set_event_dataset_ae8e1e76
      field: event.dataset
      value: sailpoint_identity_sc.events

  - set:
      tag: set_event_module_0f43d717
      field: event.module
      value: sailpoint_identity_sc

  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: ["info"]

  - set:
      tag: set_event_dataset_ae8e1e76
      field: event.dataset
      value: sailpoint_identity_sc.events

  - set:
      tag: set_event_module_0f43d717
      field: event.module
      value: sailpoint_identity_sc

  - set:
     tag: set_timestamp_173de85f
     field: "@timestamp"
     copy_from: sailpoint_identity_sc.events.created
     ignore_empty_value: true

  - set:
      tag: set_event_id_dcd98e5a
      field: event.id
      copy_from: ctx.sailpoint_identity_sc.events.id
      ignore_empty_value: true

  - append:
      tag: append_related_hosts_fdfad510
      field: related.hosts
      value: "{{{sailpoint_identity_sc.events.ip_address}}}"
      allow_duplicates: false
      if: ctx.sailpoint_identity_sc.events?.ip_address != null && ctx.sailpoint_identity_sc.events.ip_address != ''

  - append:
      tag: append_related_user_cdb190ea
      field: related.user
      value: "{{{sailpoint_identity_sc.events.actor.name}}}"
      allow_duplicates: false
      if: ctx.sailpoint_identity_sc.events?.actor.name != null && ctx.sailpoint_identity_sc.events.actor.name != ''

  - append:
      tag: append_related_hosts_bfe467e9
      field: related.hosts
      value: "{{{sailpoint_identity_sc.events.attributes.host_name}}}"
      allow_duplicates: false
      if: ctx.sailpoint_identity_sc.events?.host_name != null && ctx.sailpoint_identity_sc.events.host_name != ''

  #################### Override host.ip ######################
  - convert:
      tag: convert_sailpoint_identity_sc_events_ip_address_5c4563e7
      field: sailpoint_identity_sc.events.ip_address
      type: ip
      if: ctx.sailpoint_identity_sc.events?.ip_address != null && ctx.sailpoint_identity_sc.events.ip_address != ''
      ignore_missing: true

  - remove:
      tag: remove_sailpoint_identity_sc_events_ip_address_ab417715
      field: sailpoint_identity_sc.events.ip_address
      if: ctx.sailpoint_identity_sc.events?.ip_address == ""
      ignore_missing: true

  - append:
      tag: append_host_ip_4930e50f
      field: host.ip
      value: "{{{sailpoint_identity_sc.events.ip_address}}}"
      allow_duplicates: false
      if: ctx.sailpoint_identity_sc.events?.ip_address != null && ctx.sailpoint_identity_sc.events.ip_address != ''

  - geoip:
      tag: geoip_host_ip_to_host_geo_b6f95445
      field: host.ip
      target_field: host.geo
      ignore_missing: true
      ignore_failure: true
  ################### Entity fields ###################
  - set:
      field: user.entity.id
      tag: set_user_entity_id
      copy_from: sailpoint_identity_sc.events.actor.id
      if: ctx.sailpoint_identity_sc?.events?.actor?.id != null
  - set:
      field: user.entity.name
      tag: set_user_entity_name_from_display_name
      copy_from: sailpoint_identity_sc.events.actor.display_name
      if: ctx.sailpoint_identity_sc?.events?.actor?.display_name != null
  - set:
      field: user.entity.name
      tag: set_user_entity_name_from_name
      copy_from: sailpoint_identity_sc.events.actor.name
      if: ctx.sailpoint_identity_sc?.events?.actor?.display_name == null && ctx.sailpoint_identity_sc?.events?.actor?.name != null
  - set:
      field: user.entity.name
      tag: set_user_entity_name_from_actor_name_no_id
      copy_from: sailpoint_identity_sc.events.actor.name
      if: ctx.sailpoint_identity_sc?.events?.actor?.name != null
  - append:
      field: user.entity.type
      tag: append_user_entity_type
      value: user
      allow_duplicates: false
      if: ctx.sailpoint_identity_sc?.events?.actor?.id != null || ctx.sailpoint_identity_sc?.events?.actor?.name != null
  - set:
      field: user.entity.lifecycle.last_activity
      tag: set_user_entity_lifecycle_last_activity
      copy_from: '@timestamp'
      if: ctx.sailpoint_identity_sc?.events?.actor?.id != null || ctx.sailpoint_identity_sc?.events?.actor?.name != null
  ################### Error Log fields ###################
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
