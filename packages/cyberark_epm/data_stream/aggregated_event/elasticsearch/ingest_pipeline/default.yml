---
description: Pipeline for processing aggregated events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - drop:
      tag: drop_retry_events_4d6261d9
      if: ctx.message != null && ctx.message == 'retry'
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.arrivalTime
        - json.lastEventDate
        - json.lastEventFileName
        - json.lastEventId
        - json.fileQualifier
        - json.eventType
        - json.lastEventDisplayName
        - json.aggregatedBy
      tag: fingerprint_aggregated_event_659b9ff8
      target_field: _id
      ignore_missing: true
  - rename:
      field: json.eventType
      tag: rename_eventType_4e352429
      target_field: cyberark_epm.aggregated_event.type
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_alert_7c7eb8bd
      value: alert
      if: >-
        ctx.cyberark_epm?.aggregated_event?.type != null && (
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('AttackAttempt') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('AttackBlock') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('SuspiciousActivityAttempt') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('SuspiciousActivityBlock')
        )
  - set:
      field: event.kind
      tag: set_event_kind_to_event_bbdb2453
      value: event
      if: ctx.event?.kind == null
  - append:
      field: event.category
      tag: append_intrusion_detection_into_event_category_679343c3
      value: intrusion_detection
      if: >-
        ctx.cyberark_epm?.aggregated_event?.type != null && (
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('AttackAttempt') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('AttackBlock') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('SuspiciousActivityAttempt') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('SuspiciousActivityBlock')
        )
  - append:
      field: event.category
      tag: append_package_into_event_category_58979621
      value: package
      if: >-
        ctx.cyberark_epm?.aggregated_event?.type != null && (
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('Installation')
        )
  - append:
      field: event.category
      tag: append_process_into_event_category_3bd064ca
      value: process
      if: >-
        ctx.cyberark_epm?.aggregated_event?.type != null && (
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('Launch')
        )
  - append:
      field: event.category
      tag: append_malware_into_event_category_107c9552
      value: malware
      if: >-
        ctx.cyberark_epm?.aggregated_event?.type != null && (
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('Ransomware')
        )
  - append:
      field: event.category
      tag: append_iam_into_event_category_690a59c5
      value: iam
      if: >-
        ctx.cyberark_epm?.aggregated_event?.type != null && (
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('ElevationRequest') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('Trust') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('ManualRequest') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('Block') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('RestrictAccess') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('DetectAccess') ||
          ctx.cyberark_epm.aggregated_event.type.equalsIgnoreCase('StartElevated')
        )
  - append:
      field: event.type
      tag: append_event_type_5eab37e6
      value: info
  - set:
      field: observer.vendor
      tag: set_observer_vendor_8efd457a
      value: CyberArk
  - set:
      field: observer.product
      tag: set_observer_product_c009535a
      value: Endpoint Privilege Manager
  - convert:
      field: json.affectedComputers
      tag: convert_affectedComputers_to_long_e43d9e5d
      target_field: cyberark_epm.aggregated_event.affected_computers
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_15d798ab
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.affectedUsers
      tag: convert_affectedUsers_to_long_7edf748e
      target_field: cyberark_epm.aggregated_event.affected_users
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_9e063f85
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.agentId
      tag: rename_agentId_56a816ac
      target_field: cyberark_epm.aggregated_event.agent_id
      ignore_missing: true
  - rename:
      field: json.aggregatedBy
      tag: rename_aggregatedBy_8334535a
      target_field: cyberark_epm.aggregated_event.aggregated_by
      ignore_missing: true
  - rename:
      field: json.appPackageDisplayName
      tag: rename_appPackageDisplayName_6914caac
      target_field: cyberark_epm.aggregated_event.app_package_display_name
      ignore_missing: true
  - rename:
      field: json.applicationType
      tag: rename_applicationType_c84844e6
      target_field: cyberark_epm.aggregated_event.application_type
      ignore_missing: true
  - convert:
      field: json.applicationTypeId
      tag: convert_applicationTypeId_to_long_7c1a7192
      target_field: cyberark_epm.aggregated_event.application_type_id
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_8289ffdf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: json.arrivalTime
      tag: date_arrivalTime_14607e84
      target_field: cyberark_epm.aggregated_event.arrival_time
      formats:
        - ISO8601
      if: ctx.json?.arrivalTime != null && ctx.json.arrivalTime != ''
      on_failure:
        - append:
            tag: append_error_message_881aa436
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_aggregated_event_arrival_time_843f181e
      copy_from: cyberark_epm.aggregated_event.arrival_time
      ignore_empty_value: true
  - rename:
      field: json.authorizationRight
      tag: rename_authorizationRight_594bc27d
      target_field: cyberark_epm.aggregated_event.authorization_right
      ignore_missing: true
  - rename:
      field: json.CLSID
      tag: rename_CLSID_ef5dd81c
      target_field: cyberark_epm.aggregated_event.clsid
      ignore_missing: true
  - convert:
