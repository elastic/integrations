        - append:
            tag: append_error_message_fc53a0bf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      if: ctx.cyberark_epm?.aggregated_event?.defence_action_id != null
      description: Set Defence Action values.
      tag: set_defence_action_58620e77
      params:
        DefenceAction:
          - No action
          - Detect
          - Block
      source: |-
        def value = (int) ctx.cyberark_epm.aggregated_event.defence_action_id;
        if (value >= 0 && value < params.DefenceAction.length) {
          ctx.cyberark_epm.aggregated_event.put('defence_action_value', params['DefenceAction'][value]);
        }
      on_failure:
        - append:
            tag: append_error_message_733c4fd0
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.eventTypeId
      tag: convert_eventTypeId_to_long_aad8dc6d
      target_field: cyberark_epm.aggregated_event.type_id
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_76bc1454
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.exposedUsers
      tag: convert_exposedUsers_to_long_21c2b2ba
      target_field: cyberark_epm.aggregated_event.exposed_users
      type: long
      ignore_missing: true
      on_failure:
