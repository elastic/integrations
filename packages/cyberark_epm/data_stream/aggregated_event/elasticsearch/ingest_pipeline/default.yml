            tag: append_error_message_22c702db
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.fileLocation
      tag: rename_fileLocation_41393128
      target_field: cyberark_epm.aggregated_event.file_location
      ignore_missing: true
  - set:
      field: file.directory
      tag: set_file_directory_from_aggregated_event_file_location_8562b3b2
      copy_from: cyberark_epm.aggregated_event.file_location
      ignore_empty_value: true
  - rename:
      field: json.fileQualifier
      tag: rename_fileQualifier_96ba863f
      target_field: cyberark_epm.aggregated_event.file_qualifier
      ignore_missing: true
  - convert:
      field: json.fileSize
      tag: convert_fileSize_to_long_e3d412e4
      target_field: cyberark_epm.aggregated_event.file_size
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_cfe67b8a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: file.size
      tag: set_file_size_from_aggregated_event_file_size_742670a3
      copy_from: cyberark_epm.aggregated_event.file_size
      ignore_empty_value: true
  - set:
      field: package.size
      tag: set_package_size_from_aggregated_event_file_size_cc1ebac8
      copy_from: cyberark_epm.aggregated_event.file_size
      ignore_empty_value: true
