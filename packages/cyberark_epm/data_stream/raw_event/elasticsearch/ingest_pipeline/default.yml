          - 'Browser lure'
      source: |-
        def value = (int) ctx.cyberark_epm.raw_event.deception_type;
        if (value >= 1 && value <= params.DeceptionType.length) {
          ctx.cyberark_epm.raw_event.put('deception_type_value', params['DeceptionType'][value - 1]);
