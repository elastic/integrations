---
description: Pipeline for processing admin audit events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - drop:
      tag: drop_retry_events_4d6261d9
      if: ctx.message != null && ctx.message == 'retry'
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.EventTime
        - json.LoggedFrom
        - json.LoggedAt
        - json.Description
        - json.Administrator
        - json.InternalSessionId
      tag: fingerprint_admin_audit_a2d708cb
      target_field: _id
      ignore_missing: true
  - rename:
      field: json.Feature
      tag: rename_Feature_f93a1c58
      target_field: cyberark_epm.admin_audit.feature
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_configuration_into_event_category_bc07d48f
      value: configuration
      if: >-
        ctx.cyberark_epm?.admin_audit?.feature != null && (
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Agent Config') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Policies') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('My Computers')
        )
  - append:
      field: event.category
      tag: append_api_into_event_category_39c260ce
      value: api
      if: >-
        ctx.cyberark_epm?.admin_audit?.feature != null && (
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Public API')
        )
  - append:
      field: event.category
      tag: append_iam_into_event_category_85dd0f4a
      value: iam
      if: >-
        ctx.cyberark_epm?.admin_audit?.feature != null && (
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Sets')
        )
  - append:
      field: event.category
      tag: append_web_into_event_category_ba961fd0
      value: web
      if: >-
        ctx.cyberark_epm?.admin_audit?.feature != null && (
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('WebPage') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('End-User UI') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Application Groups') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Reports')
        )
  - append:
      field: event.type
      tag: append_access_into_event_type_a71d3199
      value: access
      if: >-
        ctx.cyberark_epm?.admin_audit?.feature != null && (
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Agent Config') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Public API') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('WebPage') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('End-User UI') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Application Groups') ||
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Policies')
        )
  - append:
      field: event.type
      tag: append_admin_into_event_type_6b3dc2c6
      value: admin
      if: >-
        ctx.cyberark_epm?.admin_audit?.feature != null && (
          ctx.cyberark_epm.admin_audit.feature.equalsIgnoreCase('Sets')
        )
  - append:
      field: event.type
      tag: append_event_type_80bf1595
      value: info
      if: ctx.event?.type == null
  - set:
      field: observer.vendor
      tag: set_observer_vendor_8efd457a
      value: CyberArk
  - set:
      field: observer.product
      tag: set_observer_product_c009535a
      value: Endpoint Privilege Manager
  - date:
      field: json.EventTime
      tag: date_EventTime_d0a82699
      target_field: cyberark_epm.admin_audit.event_time
      formats:
        - ISO8601
      if: ctx.json?.EventTime != null && ctx.json.EventTime != ''
      on_failure:
        - append:
            tag: append_error_message_90aed4a4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_admin_audit_event_time_b114d6c8
      copy_from: cyberark_epm.admin_audit.event_time
      ignore_empty_value: true
  - rename:
      field: json.Description
      tag: rename_Description_bd83c415
      target_field: cyberark_epm.admin_audit.description
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_admin_audit_description_d2c88bda
      copy_from: cyberark_epm.admin_audit.description
      ignore_empty_value: true
  - convert:
      field: json.LoggedFrom
      tag: convert_LoggedFrom_to_ip_819299ea
      target_field: cyberark_epm.admin_audit.logged_from
      type: ip
      ignore_missing: true
      if: ctx.json?.LoggedFrom != ''
      on_failure:
        - append:
            tag: append_error_message_00bf7dd3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip_from_admin_audit_logged_from_41b27bbb
      copy_from: cyberark_epm.admin_audit.logged_from
      ignore_empty_value: true
  - geoip:
      field: source.ip
      target_field: source.geo
      tag: geoip_source_ip_9a2d4d31
      ignore_missing: true
  - append:
      field: related.ip
      tag: append_admin_audit_logged_from_to_related_ip_2422b402
      value: '{{{cyberark_epm.admin_audit.logged_from}}}'
      allow_duplicates: false
  - rename:
      field: json.Administrator
      tag: rename_Administrator_8deb0301
      target_field: cyberark_epm.admin_audit.administrator
      ignore_missing: true
  - grok:
      tag: grok_cyberark_epm_admin_audit_administrator_db47b092
      field: cyberark_epm.admin_audit.administrator
      patterns:
        - '%{USERNAME:user.name}@%{HOSTNAME:user.domain}'
        - '%{GREEDYDATA:user.name}'
      ignore_missing: true
      ignore_failure: true
  - set:
      field: user.email
      tag: set_user_email_from_admin_audit_administrator_0be41380
      copy_from: cyberark_epm.admin_audit.administrator
      ignore_empty_value: true
      if: ctx.cyberark_epm?.admin_audit?.administrator != null && ctx.cyberark_epm.admin_audit.administrator.indexOf("@") > 0
  - append:
      field: related.user
      tag: append_user_name_to_related_user_c32fb91b
      value: '{{{user.name}}}'
      if: ctx.user?.name != null
      allow_duplicates: false
  - append:
      field: related.user
      tag: append_user_email_to_related_user_1f54f5f9
      value: '{{{user.email}}}'
      if: ctx.user?.email != null
      allow_duplicates: false
  - rename:
      field: json.Role
      tag: rename_Role_7efe7f27
      target_field: cyberark_epm.admin_audit.role
      ignore_missing: true
  - append:
      field: user.roles
      tag: append_admin_audit_role_to_user_roles_9cbacfa1
      value: '{{{cyberark_epm.admin_audit.role}}}'
      allow_duplicates: false
  - convert:
      field: json.InternalSessionId
      tag: convert_InternalSessionId_to_string_76c85973
      target_field: cyberark_epm.admin_audit.internal_session_id
      type: string
      ignore_missing: true
  - date:
      field: json.LoggedAt
      tag: date_LoggedAt_e8657eef
      target_field: cyberark_epm.admin_audit.logged_at
      formats:
        - ISO8601
      if: ctx.json?.LoggedAt != null && ctx.json.LoggedAt != ''
      on_failure:
        - append:
            tag: append_error_message_ff2941f6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.PermissionDescription
      tag: rename_PermissionDescription_597f9294
      target_field: cyberark_epm.admin_audit.permission_description
      ignore_missing: true
  - rename:
      field: json.SetName
      tag: rename_SetName_c7c1bf8a
      target_field: cyberark_epm.admin_audit.set_name
      ignore_missing: true
  - remove:
      field:
        - cyberark_epm.admin_audit.event_time
        - cyberark_epm.admin_audit.logged_from
        - cyberark_epm.admin_audit.administrator
        - cyberark_epm.admin_audit.role
      tag: remove_custom_duplicate_fields_d0e7ed4c
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
  - remove:
      field: json
      tag: remove_json_94dc55cd
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
