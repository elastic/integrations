---
description: Pipeline for Elastic Agent logs.
processors:
  - dot_expander:
      tag: dot_expander_log_level
      if: ctx['log.level'] != null
      field: 'log.level'
  - script:
      tag: rename_osquerybeat_string_component
      description: |
        Rename osquerybeat's string component field (introduced in
        9.5) to log.logger to prevent mapping conflicts.
      lang: painless
      if: ctx['service.name'] == 'osquerybeat' && ctx.component instanceof String
      source: |-
        if (ctx.log == null) {
          ctx.log = new HashMap();
        }
        if (ctx.log.logger == null) {
          ctx.log.logger = ctx.component;
        }
        ctx.remove('component');
  - grok:
      description: Parse the log level from Elastic Defend service installation log messages.
      if: ctx.context == "command output" && ctx['log.logger'] instanceof String && ctx['log.logger'].startsWith('component.runtime.endpoint-')
      tag: grok_parse_endpoint_log_level
      field: message
      patterns:
        - '^%{TIMESTAMP_ISO8601}: %{LOGLEVEL:log.level}: '
      ignore_missing: true
      ignore_failure: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
