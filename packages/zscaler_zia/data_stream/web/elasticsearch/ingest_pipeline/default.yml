      field: resp
      tag: remove_resp_dbf90e37
      ignore_missing: true
  - script:
      lang: painless
      tag: script_finish_urlencoding_f00b80b0
      if: ctx.json != null
      params:
        fields:
          - apprulelabel
          - devicename
          - filename
          - host
          - location
          - login
          - mobappname
          - refererhost
          - rulelabel
          - upload_filename
          - urlfilterrulelabel
          - useragent
          - userlocationname
      source: |-
        // Zscaler hex-encoded data is similar to URL encoded data, but it doesn't encode `%`.
        // This pre-processing allows the URL decode processor's strict logic to run successfully.
        def pattern = /(%)(?![0-9A-Fa-f]{2})/;
        for (String k: params.fields) {
            String v = ctx.json[k];
            if (v == null) {
                continue;
            }
            ctx.json[k] = pattern.matcher(v).replaceAll('%25');
        }
