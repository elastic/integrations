---
description: Pipeline for processing Sandbox Report logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_552e65e1
      target_field: json
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_0c872183
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      description: Drops null/empty/na values recursively.
      tag: script_to_remove_na_values_5051990a
      lang: painless
      source: |-
        boolean dropEmptyFields(Object object) {
          if (object == null || object == '' || object == 'NA' || object == 'None') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - append:
      field: event.category
      tag: append_malware_into_event_category_b1cad294
      value: malware
      allow_duplicates: false
      if: ctx.json?.Classification?.Type != null && ctx.json.Classification.Type == 'MALICIOUS'
  - append:
      field: event.category
      tag: append_file_into_event_category_4b674aac
      value: file
      allow_duplicates: false
      if: ctx.json?.Classification?.Type != null && ctx.json.Classification.Type == 'BENIGN'
  - append:
      field: event.category
      tag: append_intrusion_detection_into_event_category_f9c0b094
      value: intrusion_detection
      allow_duplicates: false
      if: ctx.json?.Classification?.Type != null && ctx.json.Classification.Type == 'SUSPICIOUS'
  - append:
      field: event.type
      tag: append_info_into_event_type_a75e9a8a
      value: info
      allow_duplicates: false
  - set:
      field: event.kind
      tag: set_event_to_event_kind_772aa2fd
      value: event
      if: ctx.json?.Classification?.Type != null && ctx.json.Classification.Type == 'BENIGN'
  - set:
      field: event.kind
      tag: set_alert_to_event_kind_216d4780
      value: alert
      if: ctx.json?.Classification?.Type != null && (ctx.json.Classification.Type == 'MALICIOUS' || ctx.json.Classification.Type == 'SUSPICIOUS')
  - rename:
      field: json.Classification.Category
      tag: rename_Classification_Category_0021427c
      target_field: zscaler_zia.sandbox_report.classification.category
      ignore_missing: true
  - rename:
