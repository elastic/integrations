---
description: Pipeline for processing Zscaler ZIA SaaS Security NSS feed logs (Collaboration, CRM, Email, File Sharing, Gen AI, ITSM, Public Cloud Storage, and Repository).
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: '8.11.0'

  # parse the event JSON
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the original message.
        The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - remove:
      field: json
      tag: remove_json_if_input_type_http_endpoint_dc508fc9
      ignore_missing: true
      description: >-
        For the http_endpoint input, Filebeat auto-parses the JSON request body
        into the `json.*` field. Drop it to avoid duplicating fields that the
        pipeline parses again from `event.original` into `zscaler_zia.saas_security`.
      if: ctx.input?.type == 'http_endpoint'
  - json:
      field: event.original
      tag: json_parse_event_original_704577ba
      target_field: zscaler_zia.saas_security

  - script:
      tag: check_template_version_10c73f0f
      lang: painless
      params:
        pkg_version: 3.19.0
        data_stream: saas_security
        expect:
          version: v1
      if: ctx.zscaler_zia?.saas_security != null && ctx._conf?.strict_fields == true
      source: |-
        if (ctx.zscaler_zia.saas_security.version != params.expect.version) {
          ctx.error = ctx.error ?: [:];
          ctx.error.message = ctx.error.message ?: [];
          ctx.error.message.add('template version mismatch: ' + (ctx.zscaler_zia.saas_security.version == null ? 'null' : ctx.zscaler_zia.saas_security.version.toString()) + ' is not expected version (see ' + params.data_stream + ' https://epr.elastic.co/package/zscaler_zia/' + params.pkg_version + '/docs/README.md)');
        }
      on_failure:
        - append:
            tag: append_error_message_3c8584af
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # convert values
  - convert:
      field: zscaler_zia.saas_security.record_id
      tag: convert_record_id_to_string_bdbff21b
      type: string
      ignore_missing: true
  - convert:
      field: zscaler_zia.saas_security.company.id
      tag: convert_company_id_to_string_673e08e7
      type: string
      ignore_missing: true
  - convert:
      field: zscaler_zia.saas_security.bucket.id
      tag: convert_bucket_id_to_string_521b093b
      type: string
      ignore_missing: true
  - convert:
      field: zscaler_zia.saas_security.dlp.identifier
      tag: convert_dlp_identifier_to_string_d0b9fed9
      type: string
      ignore_missing: true
  - convert:
      field: zscaler_zia.saas_security.genai.run_id
      tag: convert_genai_run_id_to_string_17eee885
      type: string
      ignore_missing: true
  - convert:
      field: zscaler_zia.saas_security.genai.scan_id
      tag: convert_genai_scan_id_to_string_843c6ff7
      type: string
      ignore_missing: true
  - convert:
      field: zscaler_zia.saas_security.collab_count
      tag: convert_collab_count_to_long_c3fb8010
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_collab_count_f558ae58
            field: zscaler_zia.saas_security.collab_count
            ignore_missing: true
        - append:
            tag: append_error_message_eaa47db6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.email.external_recipients_count
      tag: convert_email_external_recipients_count_to_long_dfc886f1
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_email_external_recipients_count_92138c18
            field: zscaler_zia.saas_security.email.external_recipients_count
            ignore_missing: true
        - append:
            tag: append_error_message_ef4d370f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.email.internal_recipients_count
      tag: convert_email_internal_recipients_count_to_long_310a3645
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_email_internal_recipients_count_afa511f3
            field: zscaler_zia.saas_security.email.internal_recipients_count
            ignore_missing: true
        - append:
            tag: append_error_message_141feb65
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.email.message_size_bytes
      tag: convert_email_message_size_bytes_to_long_e5e3adec
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_email_message_size_bytes_26ec5bbd
            field: zscaler_zia.saas_security.email.message_size_bytes
            ignore_missing: true
        - append:
            tag: append_error_message_7a2896b6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.external_collab_count
      tag: convert_external_collab_count_to_long_ccf09579
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_external_collab_count_fc56298f
            field: zscaler_zia.saas_security.external_collab_count
            ignore_missing: true
        - append:
            tag: append_error_message_1b4f5ee2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.file.download_time_ms
      tag: convert_file_download_time_ms_to_long_d2fdba34
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_file_download_time_ms_7156df83
            field: zscaler_zia.saas_security.file.download_time_ms
            ignore_missing: true
        - append:
            tag: append_error_message_a037e0af
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.file.scan_time_ms
      tag: convert_file_scan_time_ms_to_long_6e620540
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_file_scan_time_ms_c75d18f1
            field: zscaler_zia.saas_security.file.scan_time_ms
            ignore_missing: true
        - append:
            tag: append_error_message_5efc4377
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.file.size
      tag: convert_file_size_to_long_2e6c2d87
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_file_size_bbb1e919
            field: zscaler_zia.saas_security.file.size
            ignore_missing: true
        - append:
            tag: append_error_message_964224ec
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: zscaler_zia.saas_security.internal_collab_count
      tag: convert_internal_collab_count_to_long_2dc9856f
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_internal_collab_count_7756a4bb
            field: zscaler_zia.saas_security.internal_collab_count
            ignore_missing: true
        - append:
            tag: append_error_message_08dbf4a4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: zscaler_zia.saas_security.copilot_accessible
      tag: set_copilot_accessible_to_true_00870eb1
      value: true
      if: ctx.zscaler_zia?.saas_security?.copilot_accessible instanceof String && ctx.zscaler_zia.saas_security.copilot_accessible.toLowerCase() == 'yes'
  - set:
      field: zscaler_zia.saas_security.copilot_accessible
      tag: set_copilot_accessible_to_false_f6a43303
      value: false
      if: ctx.zscaler_zia?.saas_security?.copilot_accessible instanceof String && ctx.zscaler_zia.saas_security.copilot_accessible.toLowerCase() == 'no'
  - set:
      field: zscaler_zia.saas_security.is_incident
      tag: set_is_incident_to_true_8dbdc215
      value: true
      if: ctx.zscaler_zia?.saas_security?.is_incident instanceof String && ctx.zscaler_zia.saas_security.is_incident.toLowerCase() == 'yes'
  - set:
      field: zscaler_zia.saas_security.is_incident
      tag: set_is_incident_to_false_5a469265
      value: false
      if: ctx.zscaler_zia?.saas_security?.is_incident instanceof String && ctx.zscaler_zia.saas_security.is_incident.toLowerCase() == 'no'
  - set:
      field: zscaler_zia.saas_security.email.is_inbound
      tag: set_email_is_inbound_to_true_108781cf
      value: true
      if: ctx.zscaler_zia?.saas_security?.email?.is_inbound instanceof String && ctx.zscaler_zia.saas_security.email.is_inbound.toLowerCase() == 'yes'
  - set:
      field: zscaler_zia.saas_security.email.is_inbound
      tag: set_email_is_inbound_to_false_66a63a0d
      value: false
      if: ctx.zscaler_zia?.saas_security?.email?.is_inbound instanceof String && ctx.zscaler_zia.saas_security.email.is_inbound.toLowerCase() == 'no'
  - remove:
      field: zscaler_zia.saas_security.dlp.dict_counts
      tag: remove_dlp_dict_counts_if_none_6d6229c2
      ignore_missing: true
      if: ctx.zscaler_zia?.saas_security?.dlp?.dict_counts != null && ctx.zscaler_zia.saas_security.dlp.dict_counts == "None"
  - script:
      lang: painless
      tag: script_split_pipe_delimited_multi_value_fields_af0553e1
      description: Split NSS pipe-delimited strings into arrays for multi-value fields.
      source: |-
        void splitStr(Map m, String key) {
          if (m == null || key == null) return;
          def v = m.get(key);
          if (!(v instanceof String)) return;
          String s = (String) v;
          if (s.length() == 0) return;
          List out = new ArrayList();
          int from = 0;
          int n = s.length();
          for (int i = 0; i < n; i++) {
            if (s.charAt(i) == (char)'|') {
              out.add(s.substring(from, i));
              from = i + 1;
            }
          }
          out.add(s.substring(from, n));
          m.put(key, out);
        }
        def ss = ctx.zscaler_zia?.saas_security;
        if (ss == null) return;
        splitStr(ss, 'accessibility_flags');
        splitStr(ss, 'collab_names');
        splitStr(ss, 'collab_names_obfuscated');
        splitStr(ss, 'external_collab_groups');
        splitStr(ss, 'external_collab_groups_obfuscated');
        splitStr(ss, 'external_collab_names');
        splitStr(ss, 'external_collab_names_obfuscated');
        splitStr(ss, 'internal_collab_groups');
        splitStr(ss, 'internal_collab_groups_obfuscated');
        splitStr(ss, 'internal_collab_names');
        splitStr(ss, 'internal_collab_names_obfuscated');
        if (ss.dlp instanceof Map) {
          splitStr(ss.dlp, 'dict_counts');
          splitStr(ss.dlp, 'dict_names');
          splitStr(ss.dlp, 'dict_names_obfuscated');
          splitStr(ss.dlp, 'engine_names');
          splitStr(ss.dlp, 'engine_names_obfuscated');
        }
        if (ss.collaboration instanceof Map) {
          splitStr(ss.collaboration, 'external_recipients');
          splitStr(ss.collaboration, 'external_recipients_obfuscated');
          splitStr(ss.collaboration, 'internal_recipients');
          splitStr(ss.collaboration, 'internal_recipients_obfuscated');
        }
        if (ss.email instanceof Map) {
          splitStr(ss.email, 'external_recipients');
          splitStr(ss.email, 'external_recipients_obfuscated');
          splitStr(ss.email, 'internal_recipients');
          splitStr(ss.email, 'internal_recipients_obfuscated');
          if (ss.email.attachments instanceof Map) {
            splitStr(ss.email.attachments, 'file_names');
            splitStr(ss.email.attachments, 'file_names_obfuscated');
            splitStr(ss.email.attachments, 'file_sizes');
            splitStr(ss.email.attachments, 'file_types');
            splitStr(ss.email.attachments, 'md5s');
          }
        }
      on_failure:
        - append:
            tag: append_error_message_50f665e5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: zscaler_zia.saas_security.dlp.dict_counts
      tag: foreach_dlp_dict_counts_convert_to_long_a66c4605
      if: ctx.zscaler_zia?.saas_security?.dlp?.dict_counts instanceof List
      processor:
        convert:
          field: _ingest._value
          tag: convert_dlp_dict_count_to_long_9c7df180
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_1f139a54
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_2b84b8af
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      field: zscaler_zia.saas_security.email.attachments.file_sizes
      tag: foreach_email_attachments_file_sizes_convert_to_long_d17993ba
      if: ctx.zscaler_zia?.saas_security?.email?.attachments?.file_sizes instanceof List
      processor:
        convert:
          field: _ingest._value
          tag: convert_email_attachment_file_size_to_long_b5acf698
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_03242ed8
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_c7427c80
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: zscaler_zia.saas_security.time
      tag: date_saas_security_time_91e849f4
      target_field: zscaler_zia.saas_security.time
      formats:
        - UNIX
      timezone: UTC
      if: ctx.zscaler_zia?.saas_security?.time != null && ctx.zscaler_zia.saas_security.time != ''
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_time_0e8809d6
            field: zscaler_zia.saas_security.time
            ignore_missing: true
        - append:
            tag: append_error_message_fed60f0c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: zscaler_zia.saas_security.email.received_time
      tag: date_email_received_time_cc023e56
      target_field: zscaler_zia.saas_security.email.received_time
      formats:
        - UNIX
      timezone: UTC
      if: ctx.zscaler_zia?.saas_security?.email?.received_time != null && ctx.zscaler_zia.saas_security.email.received_time != ''
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_email_received_time_3872a7c3
            field: zscaler_zia.saas_security.email.received_time
            ignore_missing: true
        - append:
            tag: append_error_message_99ba5307
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: zscaler_zia.saas_security.file.last_modified_time
      tag: date_file_last_modified_time_0a233e94
      target_field: zscaler_zia.saas_security.file.last_modified_time
      formats:
        - E MMM dd HH:mm:ss yyyy
        - E MMM  d HH:mm:ss yyyy
        - E MMM d HH:mm:ss yyyy
        - yyyy-mm-dd HH:mm:ss
      timezone: '{{{zscaler_zia.saas_security.tz}}}'
      if: ctx.zscaler_zia?.saas_security?.file?.last_modified_time != null && ctx.zscaler_zia.saas_security.file.last_modified_time != ''
      on_failure:
        - remove:
            tag: remove_zscaler_zia_saas_security_file_last_modified_time_ea81dac7
            field: zscaler_zia.saas_security.file.last_modified_time
            ignore_missing: true
        - append:
            tag: append_error_message_ce0f1563
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
