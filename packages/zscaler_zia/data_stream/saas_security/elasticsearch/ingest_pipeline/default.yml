  # populate ECS fields
  - set:
      field: '@timestamp'
      tag: set_timestamp_from_saas_security_time_4f0c2f94
      copy_from: zscaler_zia.saas_security.time
      ignore_empty_value: true

  # event.*
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - set:
      field: event.id
      tag: set_event_id_from_record_id_dc91165c
      copy_from: zscaler_zia.saas_security.record_id
      ignore_empty_value: true
  - set:
      field: event.timezone
      tag: set_event_timezone_from_tz_a6954a40
      copy_from: zscaler_zia.saas_security.tz
      ignore_empty_value: true
  - set:
      field: event.provider
      tag: set_event_provider_to_zscaler_3289ce8c
      value: Zscaler
  - append:
      field: event.category
      tag: append_email_into_event_category_7f8f6f74
      value: email
      allow_duplicates: false
      if: ctx.zscaler_zia?.saas_security?.sourcesubtype == 'email'
  - append:
      field: event.category
      tag: append_file_into_event_category_87da904e
      value: file
      allow_duplicates: false
      if: ctx.zscaler_zia?.saas_security?.sourcesubtype == 'file' || ctx.zscaler_zia?.saas_security?.sourcesubtype == 'public_cloud_storage' || ctx.zscaler_zia?.saas_security?.sourcesubtype == 'repository'
  - append:
      field: event.category
      tag: append_network_into_event_category_collaboration_1edab3c6
      value: network
      allow_duplicates: false
      if: ctx.zscaler_zia?.saas_security?.sourcesubtype == 'collaboration'
  - append:
      field: event.category
      tag: append_intrusion_detection_into_event_category_when_incident_7ad47950
      value: intrusion_detection
      allow_duplicates: false
      if: ctx.zscaler_zia?.saas_security?.is_incident == true
  - append:
      field: event.type
      tag: append_denied_into_event_type_when_incident_6ea0e52e
      value: denied
      allow_duplicates: false
      if: ctx.zscaler_zia?.saas_security?.is_incident == true
  - append:
      field: event.type
      tag: append_allowed_into_event_type_when_no_incident_collaboration_1db6d8b8
      value: allowed
      allow_duplicates: false
      if: ctx.zscaler_zia?.saas_security?.is_incident == false && ctx.zscaler_zia?.saas_security?.sourcesubtype == 'collaboration'
  - append:
      field: event.type
      tag: append_info_into_event_type_a75e9a8a
      value: info
      allow_duplicates: false
  - script:
      lang: painless
      description: Script to set event.severity.
      tag: set_event_severity_2cf7b3b4
      if: ctx.zscaler_zia?.saas_security?.severity instanceof String
      source: |-
        ctx.event = ctx.event ?: [:];
        String severity = ctx.zscaler_zia.saas_security.severity;
        if (severity.equalsIgnoreCase("information")) {
          ctx.event.severity = 21;
        } else if (severity.equalsIgnoreCase("low")) {
          ctx.event.severity = 21;
        } else if (severity.equalsIgnoreCase("medium")) {
          ctx.event.severity = 47;
