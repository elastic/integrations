- name: stormshield
  type: group
  fields:
    - name: logtype
      description: The specific type of log this is from.
      type: keyword
    - name: ports
      description: The network ports found on the device
      type: keyword
    - name: metadata
      description: Flattened metadata
      type: flattened
    - name: in_bytes
      description: Count of bytes coming into the firewall
      type: long
    - name: out_bytes
      description: Count of bytes leaving the firewall
      type: long
    - name: dstif
      type: keyword
      description: 'Name of the destination interface. String of characters in UTF-8 format. Example: Ethernet 1 Available from: SNS v1.0.0.'
    - name: dstifname
      type: keyword
      description: 'Name of the object representing the traffics destination interface. String of characters in UTF-8 format. Example: dmz1 Available from: SNS v1.0.0.'
    - name: fw
      type: keyword
      description: 'firewall''s ID This is the name entered by the administrator or, by default, its serial number. String of characters in UTF-8 format.  Example: firewall_name or V50XXXXXXXXXXXX Available from: SNS v1.0.0.'
    - name: service
      type: keyword
      description: 'Service (product with a dedicated port) on which the vulnerability was detected.  String of characters in UTF-8 format. Example: OpenSSH_5.4'
    - name: srcif
      type: keyword
      description: 'Internal name of the interface at the source of the traffic. String of characters in UTF-8 format. Example: Ethernet0 Available from: SNS v1.0.0.'
    - name: srcifname
      type: keyword
      description: 'Name of the object representing the interface at the source of the traffic. String of characters in UTF-8 format. Example: out Available from: SNS v1.0.0.'
    - name: startime
      type: keyword
      description: 'Local time at the beginning of the logged event (time configured on the Firewall). String in YYYY-MM-DD HH:MM:SS format. Available from: SNS v1.0.0.'
    - name: system
      type: keyword
      description: Indicator of the Firewalls system status.  This value is used by the fleet management tool (Stormshield Network Unified Manager) to provide information on the system status (available RAM, CPU use, bandwidth, interfaces, fullness of audit logs, and so on). Decimal format representing a percentage.
    - name: time
      type: keyword
      description: 'Local time at which the log was recorded in the log file (time configured on the Firewall). String in YYYY-MM-DD HH:MM:SS format. Available from: SNS v1.0.0.'
    - name: class
      type: keyword
      description: 'Category of the alarm, named Context in the web administration interface. Example: protocol, system, filter. Alarm logs only.'
    - name: classification
      type: long
      description: 'Code number indicating the alarm category. Alarm logs only. Documented through SNS 4.x.'
    - name: repeat
      type: long
      description: 'Number of occurrences of the alarm during the anti-flooding window. Alarm logs only.'
    - name: sensible
      type: long
      description: 'Set to 1 when the packet that raised the alarm involves a host under strong protection. Alarm logs only. Documented through SNS 4.x.'
    - name: target
      type: keyword
      description: 'Side of the connection targeted by the alarm, src or dst. Alarm and filter logs.'
    - name: icmptype
      type: long
      description: 'ICMP message type of the packet. Alarm and filter logs.'
    - name: icmpcode
      type: long
      description: 'ICMP message code of the packet, based on the ICMP type. Alarm and filter logs.'
    - name: pktlen
      type: long
      description: 'Size in bytes of the network packet that raised the alarm. Alarm logs only.'
    - name: pktdumplen
      type: long
      description: 'Size in bytes of the packet capture attached to the alarm, which can differ from pktlen. Alarm logs only.'
    - name: pktdump
      type: keyword
      description: 'Network packet captured on the alarm, encoded in hexadecimal for analysis by a third-party tool. Alarm logs only.'
    - name: srciprep
      type: keyword
      description: 'Public reputation categories of the source IP address, when it is listed in the IP address reputation base. Values: anonymizer, botnet, malware, phishing, tor, scanner, spam.'
    - name: dstiprep
      type: keyword
      description: 'Public reputation categories of the destination IP address, when it is listed in the IP address reputation base. Values: anonymizer, botnet, malware, phishing, tor, scanner, spam.'
    - name: srchostrep
      type: long
      description: 'Reputation score of the source host, when reputation management is enabled for it.'
    - name: dsthostrep
      type: long
      description: 'Reputation score of the destination host, when reputation management is enabled for it.'
    - name: etherproto
      type: keyword
      description: 'Type of Ethernet protocol. Example: profinet-rt. Alarm, connection and plugin logs. Available from: SNS v4.0.0.'
    - name: phase
      type: long
      description: 'IKE negotiation phase, 0, 1 or 2. IPsec VPN logs only.'
    - name: side
      type: keyword
      description: 'Role of the firewall in the IKE negotiation, initiator or responder. IPsec VPN logs only.'
    - name: ikev
      type: long
      description: 'IKE protocol version used for the negotiation. IPsec VPN logs only.'
    - name: spi_in
      type: keyword
      description: 'SPI of the inbound IPsec security association. IPsec VPN logs only.'
    - name: spi_out
      type: keyword
      description: 'SPI of the outbound IPsec security association. IPsec VPN logs only.'
    - name: cookie_i
      type: keyword
      description: 'IKE initiator cookie of the negotiation. IPsec VPN logs only.'
    - name: cookie_r
      type: keyword
      description: 'IKE responder cookie of the negotiation. IPsec VPN logs only.'
    - name: localnet
      type: keyword
      description: 'Local network address protected by the tunnel. IPsec and SSL VPN logs.'
    - name: remotenet
      type: keyword
      description: 'Network address of the peer. IPsec and SSL VPN logs.'
    - name: remoteid
      type: keyword
      description: 'Identifier of the peer used during the negotiation of the IKE security association, an IP address or an e-mail address. IPsec VPN logs only.'
    - name: method
      type: keyword
      description: 'Authentication method used on authentication logs. On SNS 5.x restapi logs, the HTTP method of the REST request.'
    - name: totp
      type: keyword
      description: 'Whether a time-based one-time password was used for the authentication, yes or no. Authentication and SSL VPN logs.'
    - name: confid
      type: keyword
      description: 'Index of the configuration profile that matched the traffic, from 00 to 09.'
    - name: agentid
      type: long
      description: 'SSO agent identifier, from 0 to 5. Authentication logs only. Available from: SNS v3.0.0.'
    - name: sessionid
      type: long
      description: 'Identifier of the administration session. Server logs only.'
    - name: slotlevel
      type: long
      description: 'Level of the filter policy slot that matched the traffic, 1 for global and 2 for local.'
    - name: slotname
      type: keyword
      description: 'Name of the filter policy slot that matched the traffic. Filter logs only. Documented through SNS 4.x.'
    - name: unitid
      type: long
      description: 'Value of the Unit Id in a Modbus message, which specifies a PLC. Plugin logs only. Available from: SNS v2.3.0.'
    - name: cipservicecode
      type: keyword
      description: 'Value of the Service Code field in a CIP message. Plugin logs only. Available from: SNS v3.5.0.'
    - name: cipclassid
      type: keyword
      description: 'Value of the Class ID field in a CIP message. Plugin logs only. Available from: SNS v3.5.0.'
    - name: requestmode
      type: keyword
      description: 'Value of the Mode field of an NTP request. Plugin logs only. Available from: SNS v3.8.0.'
    - name: responsemode
      type: keyword
      description: 'Value of the Mode field of an NTP response. Plugin logs only. Available from: SNS v3.8.0.'
    - name: format
      type: keyword
      description: 'Type of an IEC104 message. Plugin logs only. Available from: SNS v3.1.0.'
    - name: error_class
      type: keyword
      description: 'Number of the error class in an S7 response. Plugin logs only.'
    - name: error_code
      type: keyword
      description: 'Error code within the error class of an S7 response on SNS 4.x plugin logs, or error code of a REST request on SNS 5.x restapi logs.'
    - name: virus
      type: keyword
      description: 'Message indicating whether a virus has been detected, when the antivirus is enabled. Example: clean. FTP, POP3, SMTP and web logs.'
    - name: spamlevel
      type: keyword
      description: 'Result of the antispam processing on the message. Values: 0 for a non-spam message, 1 to 3 for the criticality of a spam message, X for a processing error, ? when the nature of the message could not be determined. Available from: SNS v1.0.0.'
    - name: filename
      type: keyword
      description: 'Name of the file scanned by the sandboxing option. FTP, POP3, sandboxing, SMTP and web logs.'
    - name: filetype
      type: keyword
      description: 'Type of the file scanned by the sandboxing option. Values: document, pdf, executable, archive. FTP, POP3, sandboxing, SMTP and web logs.'
    - name: sandboxing
      type: keyword
      description: 'Classification of the file according to the sandboxing option. Values: clean, suspicious, malicious, unknown, forward, failed. FTP, POP3, sandboxing, SMTP and web logs.'
    - name: sandboxinglevel
      type: long
      description: 'Level of the file infection on a scale of 0 (clean) to 100 (malicious). FTP, POP3, sandboxing and SMTP logs.'
    - name: cat_site
      type: keyword
      description: 'URL filtering category of the website visited, with the curly braces of the vendor format removed. Example: news. SSL and web logs. Available from: SNS v1.0.0.'
    - name: urlruleid
      type: long
      description: 'Number of the URL filter rule applied. Web logs only. Available from: SNS v3.2.0.'
    - name: contentpolicy
      type: keyword
      description: 'Index of the filter profile used, from 00 to 09. POP3, SMTP, SSL and web logs. Available from: SNS v1.0.0.'
    - name: clientappid
      type: keyword
      description: 'Last client application detected on the connection. Example: firefox. Connection and plugin logs. Available from: SNS v3.2.0.'
    - name: serverappid
      type: keyword
      description: 'Last server application detected on the connection. Example: google. Connection and plugin logs. Available from: SNS v3.2.0.'
    - name: groupid
      type: long
      description: 'Identifier that allows tracking child connections. FTP and plugin logs.'
