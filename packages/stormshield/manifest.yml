    size: 3200x1584
    type: image/png
  - src: /img/stormshield-sns-network-traffic.png
    title: SNS Network Traffic dashboard
    size: 3200x1528
    type: image/png
  - src: /img/stormshield-sns-web-activity.png
    title: SNS Web Activity dashboard
    size: 3200x2600
    type: image/png
  - src: /img/stormshield-sns-users-vpn.png
    title: SNS Users and VPN dashboard
    size: 3200x1528
    type: image/png
