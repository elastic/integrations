                "meta_community": "default",
                "hash": {
                  "sha256": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                },
                "scan": {
                  "first_seen": "2024-03-13T06:00:00.000000",
                  "last_seen": "2024-03-14T08:00:00.000000",
                  "latest_scan": {
                    "polyscore": "0.55"
                  },
                  "detections": {
                    "malicious": 5,
                    "total": 20
                  }
                }
              }
            ]
          }
          `}}

  # Page 2: final page, has_more false so the CEL program stops paging and
  # clears its offset cursor.
  - path: /v3/search/metadata/query
    methods: ["GET"]
    request_headers:
      Authorization: ["test-api-key"]
    query_params:
      query: "{query:.*}"
      community: "default"
      limit: "2"
      offset: "eyJwYWdlIjoyfQ"
    responses:
      - status_code: 200
        headers:
          Content-Type: ["application/json"]
        body: |-
          {{ minify_json `
