                  },
                  "detections": {
                    "malicious": 12,
                    "total": 25
                  }
                },
                "polyunite": {
                  "malware_family": "Trojan.GenericKD"
                }
              },
              {
                "artifact": {
                  "id": "80984520749896317",
                  "created": "2024-03-14T09:00:00.000000",
                  "sha256": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
                  "size": 8192
                },
