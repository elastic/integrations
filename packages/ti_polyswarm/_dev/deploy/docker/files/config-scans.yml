# The API error path (HTTP 401 -> event.kind: pipeline_error) is covered by the
# script test in data_stream/scans/_dev/test/scripts/api_error.txt, which embeds
# its own mock. The system test validator rejects any pipeline_error document,
# so that scenario cannot live here.
rules:
  # Page 1: two artifacts, more results available.
  # The query param is captured rather than matched exactly so the rule keeps
  # working if the default metadata query is retuned.
  - path: /v3/search/metadata/query
    methods: ["GET"]
    request_headers:
      Authorization: ["test-api-key"]
    query_params:
      query: "{query:.*}"
      community: "default"
      limit: "2"
      offset: null
    responses:
      - status_code: 200
        headers:
          Content-Type: ["application/json"]
        body: |-
          {{ minify_json `
          {
            "status": "OK",
            "has_more": true,
            "offset": "eyJwYWdlIjoyfQ",
            "result": [
              {
                "artifact": {
                  "id": "80984520749896316",
                  "created": "2024-03-15T14:30:00.000000",
                  "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "sha1": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
                  "md5": "cccccccccccccccccccccccccccccccc",
                  "size": 45056
                },
                "extension": "exe",
                "meta_community": "default",
                "hash": {
                  "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "sha1": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
                  "md5": "cccccccccccccccccccccccccccccccc"
                },
                "scan": {
                  "first_seen": "2024-03-10T08:00:00.000000",
                  "last_seen": "2024-03-15T13:00:00.000000",
                  "latest_scan": {
                    "polyscore": "0.85"
                  },
                  "mimetype": {
