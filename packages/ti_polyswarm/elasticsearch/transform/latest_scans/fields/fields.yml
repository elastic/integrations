- name: polyswarm
  type: group
  fields:
    - name: artifact
      type: group
      fields:
        - name: id
          type: keyword
          description: PolySwarm artifact identifier.
        - name: created
          type: date
          description: Artifact creation time.
        - name: size
          type: long
    - name: extension
      type: keyword
    - name: meta_community
      type: keyword
    - name: modified
      type: date
    - name: found
      type: date
    - name: polyscore
      type: double
      description: PolySwarm malicious-likelihood score (0-1), copied from the latest scan.
    - name: malware_family
      type: keyword
      description: Malware family from polyunite classification.
    - name: hash
      type: flattened
      description: All hash digests reported for the artifact.
    - name: exiftool
      type: flattened
      description: Raw exiftool metadata (variable schema per file type).
    - name: lief
      type: flattened
    - name: pefile
      type: flattened
    - name: scan
      type: flattened
      description: Scan summary including assertions and detections.
    - name: polyunite
      type: flattened
    - name: updated
      type: flattened
