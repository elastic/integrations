format_version: 3.0.4
name: ti_polyswarm
title: PolySwarm Threat Intelligence
version: 0.1.0
description: Ingest malicious artifact indicators from the PolySwarm CTI API as ECS threat intelligence.
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^8.13.0 || ^9.0.0"
  elastic:
    subscription: basic
icons:
  - src: /img/logo.svg
    title: PolySwarm logo
    size: 716x716
    type: image/svg+xml
policy_templates:
  - name: ti_polyswarm
    title: PolySwarm threat intelligence
    description: Collect malicious artifact indicators from PolySwarm.
    inputs:
      - type: cel
        title: PolySwarm CTI polling
        description: Poll the PolySwarm metadata search API with the CEL input.
owner:
  github: elastic/security-service-integrations
  type: partner
