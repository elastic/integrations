- name: polyswarm
  type: group
  fields:
    - name: artifact
      type: group
      fields:
        - name: id
          type: keyword
          description: PolySwarm artifact identifier.
        - name: created
          type: date
          description: Artifact creation time.
        - name: size
          type: long
          description: Artifact size in bytes.
    - name: extension
      type: keyword
      description: File extension reported for the artifact.
    - name: meta_community
      type: keyword
      description: PolySwarm community the artifact metadata belongs to.
    - name: modified
      type: date
      description: Time the artifact record was last modified.
    - name: found
      type: date
      description: Time the artifact was first found by the network.
    - name: polyscore
      type: double
      description: PolySwarm malicious-likelihood score (0-1), copied from the latest scan.
    - name: malware_family
      type: keyword
      description: Malware family from polyunite classification.
    - name: hash
      type: flattened
      description: All hash digests reported for the artifact.
    - name: exiftool
      type: flattened
      description: Raw exiftool metadata (variable schema per file type).
    - name: lief
      type: flattened
      description: Raw LIEF binary-analysis metadata (variable schema per file type).
    - name: pefile
      type: flattened
      description: Raw pefile PE-header metadata (variable schema per file type).
    - name: scan
      type: flattened
      description: Scan summary including assertions and detections.
    - name: polyunite
      type: flattened
      description: Raw polyunite malware-classification metadata.
    - name: updated
      type: flattened
      description: Update metadata reported by PolySwarm (variable schema; kept as-is).
