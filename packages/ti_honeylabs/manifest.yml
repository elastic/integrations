format_version: "3.4.2"
name: ti_honeylabs
title: HoneyLabs
version: "0.1.0"
description: Ingest threat intelligence indicators from HoneyLabs honeypot feeds with Elastic Agent.
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^8.19.0 || ^9.1.0"
  elastic:
    subscription: basic
icons:
  - src: /img/honeylabs.svg
    title: HoneyLabs
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: ti_honeylabs
    title: HoneyLabs indicators
    description: Collect exploiter IP addresses and malware infrastructure URLs observed by HoneyLabs honeypot sensors.
    inputs:
      - type: cel
        title: Collect HoneyLabs indicators
        description: Collect indicators from the HoneyLabs feeds, or from the HoneyLabs TAXII 2.1 server when an API key is set.
        vars:
          - name: url
            type: text
            title: HoneyLabs URL
            description: Base URL of the HoneyLabs service. The feeds are read from `/feed/` and the TAXII 2.1 collections from `/taxii2/api/` under this URL.
            multi: false
            required: true
            show_user: false
            default: https://honeylabs.net
          - name: api_key
            type: password
            title: API Key
            description: >-
              Optional HoneyLabs API key. Without a key the integration reads the anonymous public feeds. With a key it reads the TAXII 2.1 collections instead, which add a confidence score, a description, malware family labels and incremental polling, and which cover 30 days instead of 7 or 14 on a paid HoneyLabs plan. Keys are created at https://honeylabs.net/dashboard.
            multi: false
            required: false
            show_user: true
            secret: true
          - name: proxy_url
            type: text
            title: Proxy URL
            description: URL to proxy connections in the form of http\[s\]://<user>:<password>@<server name/ip>:<port>.
            multi: false
            required: false
            show_user: false
          - name: ssl
            type: yaml
            title: SSL Configuration
            description: SSL configuration options. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html#ssl-common-config) for details.
            multi: false
            required: false
            show_user: false
          - name: http_client_timeout
            type: text
            title: HTTP Client Timeout
            description: Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h.
            multi: false
            required: false
            show_user: false
            default: 60s
          - name: enable_request_tracer
            type: bool
            title: Enable request tracing
            description: The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
            multi: false
            required: false
            show_user: false
            default: false
owner:
  github: elastic/security-service-integrations
  type: community
