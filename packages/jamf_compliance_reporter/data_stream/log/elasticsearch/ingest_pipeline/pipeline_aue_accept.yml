---
description: Pipeline for Jamf Compliance Reporter aue_accept audit logs.
processors:
  - rename:
      tag: rename_json_path_to_jamf_compliance_reporter_log_path_dcaf10e2
      field: json.path
      target_field: jamf_compliance_reporter.log.path
      ignore_missing: true
  - convert:
      tag: convert_json_socket_unix_family_to_json_inet_family_a3c3ec3c
      field: json.socket_unix.family
      target_field: json.inet_family
      type: string
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_socket_unix_path_to_jamf_compliance_reporter_log_socket_unix_path_2702e3a9
      field: json.socket_unix.path
      target_field: jamf_compliance_reporter.log.socket.unix.path
      ignore_missing: true
  - convert:
      tag: convert_json_arguments_fd_to_jamf_compliance_reporter_log_arguments_fd_5367d19d
      field: json.arguments.fd
      target_field: jamf_compliance_reporter.log.arguments.fd
      type: string
      ignore_missing: true
      ignore_failure: true
  - script:
      tag: script_bf7d3e4d
      description: Dynamically map Socket Address Families.
      lang: painless
      if: ctx.json?.inet_family != null
      source: |
        Map map = new HashMap();
        map.put('0', 'AF_UNSPEC');
        map.put('1', 'AF_LOCAL');
        map.put('AF_LOCAL', 'AF_UNIX');
        map.put('2', 'AF_INET');
        map.put('3', 'AF_ImapPLINK');
        map.put('4', 'AF_PUP');
        map.put('5', 'AF_CHAOS');
        map.put('6', 'AF_NS');
        map.put('7', 'AF_ISO');
        map.put('AF_ISO', 'AF_OSI');
        map.put('8', 'AF_ECmapA');
        map.put('9', 'AF_DATAKIT');
        map.put('10', 'AF_CCITT');
        map.put('11', 'AF_SNA');
        map.put('12', 'AF_DECnet');
        map.put('13', 'AF_DLI');
        map.put('14', 'AF_LAT');
        map.put('15', 'AF_HYLINK');
        map.put('16', 'AF_APPLETALK');
        map.put('17', 'AF_ROUTE');
        map.put('18', 'AF_LINK');
        map.put('19', 'pseudo_AF_XTP');
        map.put('20', 'AF_COIP');
        map.put('21', 'AF_CNT');
        map.put('22', 'pseudo_AF_RTIP');
        map.put('23', 'AF_IPX');
        map.put('24', 'AF_SIP');
        map.put('25', 'pseudo_AF_PIP');
        ctx.jamf_compliance_reporter.log.socket.unix.family = map.get(ctx.json.inet_family);
  - pipeline:
      tag: pipeline_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
