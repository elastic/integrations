---
description: Pipeline for Jamf Compliance Reporter aue_auth audit logs.
processors:
  - pipeline:
      tag: pipeline_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
  - rename:
      tag: rename_json_texts_to_jamf_compliance_reporter_log_texts_e75677b2
      field: json.texts
      target_field: jamf_compliance_reporter.log.texts
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
