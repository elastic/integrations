---
description: Pipeline for Jamf Compliance Reporter gatekeeper info event logs.
processors:
  - convert:
      tag: convert_json_event_attributes_assessments_enabled_to_jamf_compliance_reporter_log_event_attributes_assessments_enabled_359ee9f2
      field: json.event_attributes.assessments_enabled
      target_field: jamf_compliance_reporter.log.event_attributes.assessments_enabled
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_99ed890d
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_event_attributes_dev_id_enabled_to_jamf_compliance_reporter_log_event_attributes_dev_id_enabled_e7447490
      field: json.event_attributes.dev_id_enabled
      target_field: jamf_compliance_reporter.log.event_attributes.dev_id_enabled
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_aa03b2df
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_event_attributes_opaque_version_to_jamf_compliance_reporter_log_event_attributes_opaque_version_0e7ca4e6
      field: json.event_attributes.opaque_version
      target_field: jamf_compliance_reporter.log.event_attributes.opaque_version
      ignore_missing: true
  - rename:
      tag: rename_json_event_attributes_version_to_jamf_compliance_reporter_log_event_attributes_version_4c020ad0
      field: json.event_attributes.version
      target_field: jamf_compliance_reporter.log.event_attributes.version
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
