---
description: Pipeline for Jamf Compliance Reporter aue_ptrace audit logs.
processors:
  - convert:
      tag: convert_json_arguments_addr_to_jamf_compliance_reporter_log_arguments_addr_7ab0f7f3
      field: json.arguments.addr
      target_field: jamf_compliance_reporter.log.arguments.addr
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_arguments_data_to_jamf_compliance_reporter_log_arguments_data_4c8f8b05
      field: json.arguments.data
      target_field: jamf_compliance_reporter.log.arguments.data
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_arguments_process_to_jamf_compliance_reporter_log_arguments_process_ee3dbde9
      field: json.arguments.process
      target_field: jamf_compliance_reporter.log.arguments.process
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_arguments_request_to_jamf_compliance_reporter_log_arguments_request_e96cea55
      field: json.arguments.request
      target_field: jamf_compliance_reporter.log.arguments.request
      type: string
      ignore_missing: true
      ignore_failure: true
  - pipeline:
      tag: pipeline_exec_chain_child_object_75de012d
      name: '{{ IngestPipeline "pipeline_exec_chain_child_object" }}'
  - pipeline:
      tag: pipeline_identity_object_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
