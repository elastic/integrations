---
description: Pipeline for Jamf Compliance Reporter aue_ssauthint audit logs.
processors:
  - pipeline:
      tag: pipeline_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
  - rename:
      tag: rename_json_texts_to_jamf_compliance_reporter_log_texts_e75677b2
      field: json.texts
      target_field: jamf_compliance_reporter.log.texts
      ignore_missing: true
  - convert:
      tag: convert_json_arguments_known_UID__to_jamf_compliance_reporter_log_arguments_known_uid_726a3bb6
      field: json.arguments.known_UID_
      target_field: jamf_compliance_reporter.log.arguments.known_uid
      type: string
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_arguments_to_jamf_compliance_reporter_log_arguments_flattened_58f7e5e1
      field: json.arguments
      target_field: jamf_compliance_reporter.log.arguments.flattened
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
