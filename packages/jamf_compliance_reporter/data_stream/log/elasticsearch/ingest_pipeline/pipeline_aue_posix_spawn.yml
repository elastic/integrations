---
description: Pipeline for Jamf Compliance Reporter aue_posix_spawn audit logs.
processors:
  - convert:
      tag: convert_json_arguments_child_PID_to_jamf_compliance_reporter_log_arguments_child_pid_bd346fed
      field: json.arguments.child_PID
      target_field: jamf_compliance_reporter.log.arguments.child.pid
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_be26f75e
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_exec_args_args_to_json_args_c2752467
      field: json.exec_args.args
      target_field: json.args
      ignore_missing: true
  - rename:
      tag: rename_json_exec_args_args_compiled_to_jamf_compliance_reporter_log_exec_args_args_compiled_6e9208ee
      field: json.exec_args.args_compiled
      target_field: jamf_compliance_reporter.log.exec_args.args_compiled
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_XPC_FLAGS_to_jamf_compliance_reporter_log_exec_env_env_xpc_flags_10e3a485
      field: json.exec_env.env.XPC_FLAGS
      target_field: jamf_compliance_reporter.log.exec_env.env.xpc.flags
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_compiled_to_jamf_compliance_reporter_log_exec_env_env_compiled_c264f32b
      field: json.exec_env.env_compiled
      target_field: jamf_compliance_reporter.log.exec_env.env.compiled
      ignore_missing: true
  - rename:
      tag: rename_json_path_to_jamf_compliance_reporter_log_path_dcaf10e2
      field: json.path
      target_field: jamf_compliance_reporter.log.path
      ignore_missing: true
  - rename:
      tag: rename_json_exec_chain_parent_uuid_to_jamf_compliance_reporter_log_exec_chain_parent_uuid_2d473082
      field: json.exec_chain_parent.uuid
      target_field: jamf_compliance_reporter.log.exec_chain_parent.uuid
      ignore_missing: true
  - script:
      tag: script_721d76b6
      description: Convert Object into Array.
      lang: painless
      source: |
        def args_list = new ArrayList();
        ctx.process.args = args_list;
        if (ctx.json?.args != null) {
          for (Map.Entry m : ctx.json.args.entrySet()) {
            ctx.process.args.add(m.getValue());
          }
        }
  - pipeline:
      tag: pipeline_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
