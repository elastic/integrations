---
description: Pipeline for Jamf Compliance Reporter logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - json:
      tag: json_event_original_to_json_cac66847
      field: event.original
      target_field: json
      ignore_failure: true
  - pipeline:
      tag: pipeline_app_metrics_ae75b026
      name: '{{ IngestPipeline "pipeline_app_metrics" }}'
      if: ctx.json?.header?.event_name == 'APP_METRICS'
  - pipeline:
      tag: pipeline_audit_0affc98c
      name: '{{ IngestPipeline "pipeline_audit" }}'
      if: ctx.json?.header?.event_name?.startsWith('AUE_') == true
  - pipeline:
      tag: pipeline_event_e6a6abf5
      name: '{{ IngestPipeline "pipeline_event" }}'
      if: "['AUDIO_VIDEO_DEVICE_EVENT','AUDIT_CLASS_VERIFICATION_EVENT','COMPLIANCE_REPORTER_TAMPER_EVENT','FILE_EVENT','GATEKEEPER_INFO_EVENT','GATEKEEPER_MANUAL_OVERRIDES','GATEKEEPER_QUARANTINE_LOG','HARDWARE_EVENT','LICENSE_INFO_EVENT','PREFERENCE_LIST_EVENT','PRINT_EVENT_INFORMATION','PROHIBITED_APP_BLOCKED','SIGNAL_EVENT','UNIFIED_LOG_EVENT','XPROTECT_DEFINITIONS_VERSION_INFO','XPROTECT_EVENT_LOG'].contains(ctx.json?.header?.event_name)"
  - remove:
      tag: remove_json_29cdffdc
      field: json
      ignore_missing: true
  - script:
      tag: script_drops_null_empty_values_recursively_e2ccbdd7
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
