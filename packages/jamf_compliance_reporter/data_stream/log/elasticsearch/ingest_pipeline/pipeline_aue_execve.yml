---
description: Pipeline for Jamf Compliance Reporter aue_execve audit logs.
processors:
  - convert:
      tag: convert_json_attributes_device_to_jamf_compliance_reporter_log_attributes_device_d89a67d9
      field: json.attributes.device
      target_field: jamf_compliance_reporter.log.attributes.device
      type: string
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_attributes_file_access_mode_to_json_file_access_mode_3515c381
      field: json.attributes.file_access_mode
      target_field: json.file_access_mode
      ignore_failure: true
  - convert:
      tag: convert_json_attributes_file_system_id_to_jamf_compliance_reporter_log_attributes_file_system_id_cc879847
      field: json.attributes.file_system_id
      target_field: jamf_compliance_reporter.log.attributes.file.system.id
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_attributes_node_id_to_jamf_compliance_reporter_log_attributes_node_id_38b0771e
      field: json.attributes.node_id
      target_field: jamf_compliance_reporter.log.attributes.node.id
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_attributes_owner_group_id_to_user_group_id_f8a03798
      field: json.attributes.owner_group_id
      target_field: user.group.id
      type: string
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_attributes_owner_group_name_to_user_group_name_834f090f
      field: json.attributes.owner_group_name
      target_field: user.group.name
      ignore_missing: true
  - convert:
      tag: convert_json_attributes_owner_user_id_58bbc519
      field: json.attributes.owner_user_id
      type: string
      ignore_missing: true
      ignore_failure: true
  - append:
      tag: append_user_id_f10ea64d
      field: user.id
      value: '{{{json.attributes.owner_user_id}}}'
      if: ctx.json?.attributes?.owner_user_id != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_user_name_2ba08467
      field: user.name
      value: '{{{json.attributes.owner_user_name}}}'
      if: ctx.json?.attributes?.owner_user_name != null
      allow_duplicates: false
      ignore_failure: true
  - append:
      tag: append_related_user_0321d5d7
      field: related.user
      value: '{{{json.attributes.owner_user_name}}}'
      if: ctx.json?.attributes?.owner_user_name != null
      allow_duplicates: false
      ignore_failure: true
  - pipeline:
      tag: pipeline_identity_object_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
  - rename:
      tag: rename_json_path_to_jamf_compliance_reporter_log_path_dcaf10e2
      field: json.path
      target_field: jamf_compliance_reporter.log.path
      ignore_missing: true
  - pipeline:
      tag: pipeline_exec_chain_child_object_75de012d
      name: '{{ IngestPipeline "pipeline_exec_chain_child_object" }}'
  - rename:
      tag: rename_json_exec_args_args_to_json_args_c2752467
      field: json.exec_args.args
      target_field: json.args
      ignore_missing: true
  - rename:
      tag: rename_json_exec_args_args_compiled_to_jamf_compliance_reporter_log_exec_args_args_compiled_6e9208ee
      field: json.exec_args.args_compiled
      target_field: jamf_compliance_reporter.log.exec_args.args_compiled
      ignore_missing: true
  - script:
      tag: script_fdd491a2
      lang: painless
      if: ctx.json?.exec_env?.env?.ARCH != null && ctx.json.exec_env.env.ARCH != ''
      params:
        'allowed':
          - linux
          - macos
          - unix
          - windows
          - ios
          - android
        'replacements':
          'macintosh': macos
      source: |
        for (entry in params.replacements.entrySet()) {
          if (ctx.json.exec_env.env.ARCH == entry.getKey()) {
            ctx.json.exec_env.env.put('ARCH', entry.getValue());
          }
        }
        if (!params.allowed.contains(ctx.json.exec_env.env.ARCH)) {
          return;
        }
        if (ctx.host == null) {
          HashMap hm = new HashMap();
          ctx.put('host', hm);
        }
        if (ctx.host.os == null) {
          HashMap hm = new HashMap();
          ctx.host.put('os', hm);
        }
        ctx.host.os.put('type', ctx.json.exec_env.env.ARCH);
        ctx.json.exec_env.env.remove('ARCH');
  - rename:
      tag: rename_json_exec_env_env_CPU_to_host_architecture_a6731bc7
      field: json.exec_env.env.CPU
      target_field: host.architecture
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_MALWAREBYTES_GROUP_to_jamf_compliance_reporter_log_exec_env_env_malwarebytes_group_bc0c67ca
      field: json.exec_env.env.MALWAREBYTES_GROUP
      target_field: jamf_compliance_reporter.log.exec_env.env.malwarebytes_group
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_PATH_to_jamf_compliance_reporter_log_exec_env_env_path_66b7d43e
      field: json.exec_env.env.PATH
      target_field: jamf_compliance_reporter.log.exec_env.env.path
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_XPC_FLAGS_to_jamf_compliance_reporter_log_exec_env_env_xpc_flags_10e3a485
      field: json.exec_env.env.XPC_FLAGS
      target_field: jamf_compliance_reporter.log.exec_env.env.xpc.flags
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_XPC_SERVICE_NAME_to_jamf_compliance_reporter_log_exec_env_env_xpc_service_name_b71ea807
      field: json.exec_env.env.XPC_SERVICE_NAME
      target_field: jamf_compliance_reporter.log.exec_env.env.xpc.service_name
      ignore_missing: true
  - rename:
      tag: rename_json_exec_env_env_compiled_to_jamf_compliance_reporter_log_exec_env_env_compiled_c264f32b
      field: json.exec_env.env_compiled
      target_field: jamf_compliance_reporter.log.exec_env.env.compiled
      ignore_missing: true
  - script:
      tag: script_convert_object_into_array_721d76b6
      description: Convert Object into Array.
      lang: painless
      source: |
        def args_list = new ArrayList();
        ctx.process.args = args_list;
        if (ctx.json?.args != null) {
          for (Map.Entry m : ctx.json.args.entrySet()) {
            ctx.process.args.add(m.getValue());
          }
        }
  - script:
      tag: script_convert_decimal_into_octal_fbc9f1e5
      description: Convert Decimal into Octal.
      lang: painless
      if: ctx.json?.file_access_mode != null
      source: |
        int temp = (int)ctx.json.file_access_mode;
        ctx.jamf_compliance_reporter.log.attributes.file.access_mode = Integer.toOctalString(temp);
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
