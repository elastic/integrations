---
description: Pipeline for Jamf Compliance Reporter aue_bind and aue_connect audit logs.
processors:
  - convert:
      tag: convert_json_socket_inet_addr_to_jamf_compliance_reporter_log_socket_inet_addr_073bdb7c
      field: json.socket_inet.addr
      target_field: jamf_compliance_reporter.log.socket.inet.addr
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_arguments_fd_to_jamf_compliance_reporter_log_arguments_fd_5367d19d
      field: json.arguments.fd
      target_field: jamf_compliance_reporter.log.arguments.fd
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_socket_inet_family_to_json_inet_family_da3c0fb0
      field: json.socket_inet.family
      target_field: json.inet_family
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_socket_inet_id_to_jamf_compliance_reporter_log_socket_inet_id_1d335ca8
      field: json.socket_inet.id
      target_field: jamf_compliance_reporter.log.socket.inet.id
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_socket_inet_ip_address_to_server_ip_b5e6ed72
      field: json.socket_inet.ip_address
      target_field: server.ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_socket_inet_ip_address_f04d008f
            field: json.socket_inet.ip_address
            ignore_missing: true
        - append:
            tag: append_error_message_106415f7
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - append:
      tag: append_related_ip_3ed00a18
      field: related.ip
      value: '{{{server.ip}}}'
      if: ctx.server?.ip != null
      allow_duplicates: false
      ignore_failure: true
  - convert:
      tag: convert_json_socket_inet_port_to_server_port_91beb58f
      field: json.socket_inet.port
      target_field: server.port
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_6c7bb514
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - script:
      tag: script_4643c989
      description: Dynamically map Socket Address Families.
      lang: painless
      if: ctx.json?.inet_family != null
      source: |
        Map map = new HashMap();
        map.put('0', 'AF_UNSPEC');
        map.put('1', 'AF_LOCAL');
        map.put('AF_LOCAL', 'AF_UNIX');
        map.put('2', 'AF_INET');
        map.put('3', 'AF_ImapPLINK');
        map.put('4', 'AF_PUP');
        map.put('5', 'AF_CHAOS');
        map.put('6', 'AF_NS');
        map.put('7', 'AF_ISO');
        map.put('AF_ISO', 'AF_OSI');
        map.put('8', 'AF_ECmapA');
        map.put('9', 'AF_DATAKIT');
        map.put('10', 'AF_CCITT');
        map.put('11', 'AF_SNA');
        map.put('12', 'AF_DECnet');
        map.put('13', 'AF_DLI');
        map.put('14', 'AF_LAT');
        map.put('15', 'AF_HYLINK');
        map.put('16', 'AF_APPLETALK');
        map.put('17', 'AF_ROUTE');
        map.put('18', 'AF_LINK');
        map.put('19', 'pseudo_AF_XTP');
        map.put('20', 'AF_COIP');
        map.put('21', 'AF_CNT');
        map.put('22', 'pseudo_AF_RTIP');
        map.put('23', 'AF_IPX');
        map.put('24', 'AF_SIP');
        map.put('25', 'pseudo_AF_PIP');
        ctx.jamf_compliance_reporter.log.socket.inet.family = map.get(ctx.json.inet_family);
  - pipeline:
      tag: pipeline_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
