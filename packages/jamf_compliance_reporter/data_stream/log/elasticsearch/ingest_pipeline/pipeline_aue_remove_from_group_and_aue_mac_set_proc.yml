---
description: Pipeline for Jamf Compliance Reporter aue_remove_from_group and aue_mac_set_proc audit logs.
processors:
  - rename:
      tag: rename_json_texts_to_jamf_compliance_reporter_log_texts_e75677b2
      field: json.texts
      target_field: jamf_compliance_reporter.log.texts
      ignore_missing: true
  - pipeline:
      tag: pipeline_exec_chain_child_object_75de012d
      name: '{{ IngestPipeline "pipeline_exec_chain_child_object" }}'
  - pipeline:
      tag: pipeline_identity_object_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
