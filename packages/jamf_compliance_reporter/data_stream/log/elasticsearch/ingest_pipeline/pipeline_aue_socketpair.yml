---
description: Pipeline for Jamf Compliance Reporter aue_socketpair audit logs.
processors:
  - pipeline:
      tag: pipeline_identity_object_8cb224f5
      name: '{{ IngestPipeline "pipeline_identity_object" }}'
  - convert:
      tag: convert_json_arguments_domain_to_jamf_compliance_reporter_log_arguments_domain_f9220ed5
      field: json.arguments.domain
      target_field: jamf_compliance_reporter.log.arguments.domain
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_arguments_protocol_to_jamf_compliance_reporter_log_arguments_protocol_142f1611
      field: json.arguments.protocol
      target_field: jamf_compliance_reporter.log.arguments.protocol
      type: string
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_arguments_type_to_jamf_compliance_reporter_log_arguments_type_ecaf0ac5
      field: json.arguments.type
      target_field: jamf_compliance_reporter.log.arguments.type
      type: string
      ignore_missing: true
      ignore_failure: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
