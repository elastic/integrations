---
description: Pipeline for Jamf Compliance Reporter gatekeeper manual overrides event logs.
processors:
  - foreach:
      tag: foreach_json_event_attributes_attributes_f28d3ed4
      field: json.event_attributes.attributes
      if: ctx.json?.event_attributes?.attributes instanceof List
      processor:
        date:
          field: _ingest._value.ctime
          target_field: _ingest._value.ctime
          formats:
            - UNIX
          on_failure:
            - remove:
                field: _ingest._value.ctime
                ignore_missing: true
            - append:
                field: error.message
                value: '{{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_json_event_attributes_attributes_6c662502
      field: json.event_attributes.attributes
      if: ctx.json?.event_attributes?.attributes instanceof List
      processor:
        date:
          field: _ingest._value.mtime
          target_field: _ingest._value.mtime
          formats:
            - UNIX
          on_failure:
            - remove:
                field: _ingest._value.mtime
                ignore_missing: true
            - append:
                field: error.message
                value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_event_attributes_attributes_to_jamf_compliance_reporter_log_event_attributes_attributes_12fda942
      field: json.event_attributes.attributes
      target_field: jamf_compliance_reporter.log.event_attributes.attributes
      ignore_missing: true
  - rename:
      tag: rename_json_event_attributes_path_to_jamf_compliance_reporter_log_event_attributes_path_f06dbbf2
      field: json.event_attributes.path
      target_field: jamf_compliance_reporter.log.event_attributes.path
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
