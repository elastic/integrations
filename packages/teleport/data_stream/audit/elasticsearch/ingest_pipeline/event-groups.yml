---
description: >
  Pipeline to group Teleport audit fields into metadata groups. See https://github.com/gravitational/teleport/blob/master/api/proto/teleport/legacy/types/events/events.proto

processors:
  # SessionMetadata is a common session event metadata
  # See teleport.audit.session group for field definitions.
  - rename:
      tag: rename_teleport_audit_sid_to_teleport_audit_session_id_258f399d
      field: teleport.audit.sid
      target_field: teleport.audit.session.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_with_mfa_to_teleport_audit_mfa_device_uuid_425084df
      field: teleport.audit.with_mfa
      target_field: teleport.audit.mfa_device.uuid
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_private_key_policy_to_teleport_audit_session_private_key_policy_18fd1070
      field: teleport.audit.private_key_policy
      target_field: teleport.audit.session.private_key_policy
      ignore_missing: true
  # UserMetadata is a common user event metadata
  # See teleport.audit.user group for field definitions.
  - remove:
      tag: remove_teleport_audit_user_user_db691a28
      description: 'Fix an issue where "user": {"user": message} is present'
      field: teleport.audit.user.user
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_user_to_user_name_d4b6748e
      field: teleport.audit.user
      target_field: user.name
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_teleport_audit_login_to_process_user_name_9744656c
      field: teleport.audit.login
      target_field: process.user.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_impersonator_to_teleport_audit_user_impersonator_971b8b43
      field: teleport.audit.impersonator
      target_field: teleport.audit.user.impersonator
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_aws_role_arn_to_teleport_audit_user_aws_role_arn_80f11453
      field: teleport.audit.aws_role_arn
      target_field: teleport.audit.user.aws_role_arn
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_access_requests_to_teleport_audit_user_access_requests_f61e9965
      field: teleport.audit.access_requests
      target_field: teleport.audit.user.access_requests
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_azure_identity_to_teleport_audit_user_azure_identity_3c07455b
      field: teleport.audit.azure_identity
      target_field: teleport.audit.user.azure_identity
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_gcp_service_account_to_teleport_audit_user_gcp_service_account_2bd8a417
      field: teleport.audit.gcp_service_account
      target_field: teleport.audit.user.gcp_service_account
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_trusted_device_to_teleport_audit_user_trusted_device_1db06e6b
      field: teleport.audit.trusted_device
      target_field: teleport.audit.user.trusted_device
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_required_private_key_policy_to_teleport_audit_user_required_private_key_policy_03ec86bb
      field: teleport.audit.required_private_key_policy
      target_field: teleport.audit.user.required_private_key_policy
      ignore_missing: true
  - set:
      tag: set_teleport_audit_user_kind_1d142f84
      field: teleport.audit.user.kind
      value: unspecified
      if: ctx.teleport?.audit?.user_kind == 0
  - set:
      tag: set_teleport_audit_user_kind_3475d90b
      field: teleport.audit.user.kind
      value: human
      if: ctx.teleport?.audit?.user_kind == 1
  - set:
      tag: set_teleport_audit_user_kind_fccc1b64
      field: teleport.audit.user.kind
      value: bot
      if: ctx.teleport?.audit?.user_kind == 2
  - remove:
      tag: remove_teleport_audit_user_kind_edbb6b95
      field: teleport.audit.user_kind
      ignore_missing: true
      if: ctx.teleport?.audit?.user?.kind != null
  # Server is a server metadata
  # See teleport.audit.server group for field definitions.
  - rename:
      tag: rename_teleport_audit_namespace_to_group_name_492eb909
      field: teleport.audit.namespace
      target_field: group.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_id_to_host_id_86887772
      field: teleport.audit.server_id
      target_field: host.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_hostname_to_host_hostname_e115590e
      field: teleport.audit.server_hostname
      target_field: host.hostname
      ignore_missing: true
  - grok:
      tag: grok_teleport_audit_server_addr_eda21577
      field: teleport.audit.server_addr
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:server.address}|\[%{IP:server.ip}\])(:%{POSINT:server.port:long})?$'
  - remove:
      tag: remove_teleport_audit_server_addr_4d338d67
      field: teleport.audit.server_addr
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_forwarded_by_to_teleport_audit_server_forwarded_by_1cd5d8ef
      field: teleport.audit.forwarded_by
      target_field: teleport.audit.server.forwarded_by
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_sub_kind_to_teleport_audit_server_sub_kind_70b1a2bd
      field: teleport.audit.server_sub_kind
      target_field: teleport.audit.server.sub_kind
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_version_to_teleport_audit_server_version_2e844b49
      field: teleport.audit.server_version
      target_field: teleport.audit.server.version
      ignore_missing: true
  # Stash scalar addr before dot_expander so addr.local/addr.remote can expand.
  - rename:
      tag: rename_teleport_audit_addr_to__temp_teleport_audit_addr_011f6155
      field: teleport.audit.addr
      target_field: _temp.teleport_audit_addr
      if: "ctx.teleport?.audit?.addr instanceof String"
      ignore_missing: true
  # Extract data from addr.local field.
  - dot_expander:
      tag: dot_expander_addr_local_6c3e8bf9
      path: teleport.audit
      field: addr.local
  # Connection contains connection info.
  # All of these fields are mapped to ECS fields.
  - grok:
      tag: grok_teleport_audit_addr_local_eaf953d6
      field: teleport.audit.addr.local
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:destination.address}|\[%{IP:destination.ip}\])(:%{POSINT:destination.port:long})?$'
      if: ctx.server?.address != null
  - grok:
      tag: grok_teleport_audit_addr_local_057bd861
      field: teleport.audit.addr.local
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:server.address}|\[%{IP:server.ip}\])(:%{POSINT:server.port:long})?$'
      if: ctx.server?.address == null
  - remove:
      tag: remove_teleport_audit_addr_local_4d1cc126
      field: teleport.audit.addr.local
      ignore_missing: true
  # Extract data from addr.remote field.
  - dot_expander:
      tag: dot_expander_addr_remote_54d91f5c
      path: teleport.audit
      field: addr.remote
  - grok:
      tag: grok_teleport_audit_addr_remote_967cc0d9
      field: teleport.audit.addr.remote
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:client.address}|\[%{IP:client.ip}\])(:%{POSINT:client.port:long})?$'
  - remove:
      tag: remove_teleport_audit_addr_remote_4f695fdd
      field: teleport.audit.addr.remote
      ignore_missing: true
  # Restore stashed scalar addr value.
  - remove:
      tag: remove_teleport_audit_addr_c229c090
      field: teleport.audit.addr
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename__temp_teleport_audit_addr_to_teleport_audit_addr_12d9ea35
      field: _temp.teleport_audit_addr
      target_field: teleport.audit.addr
      ignore_missing: true
  # The last field and cleanup.
  - rename:
      tag: rename_teleport_audit_proto_to_network_protocol_e6ab215e
      field: teleport.audit.proto
      target_field: network.protocol
      ignore_missing: true
  - remove:
      tag: remove_teleport_connection_a4779495
      field: teleport.connection
      ignore_missing: true
  # ClientMetadata identifies the originating client for an event.
  # All of these fields are mapped to ECS fields.
  - rename:
      tag: rename_teleport_audit_user_agent_to_user_agent_72c3a36a
      field: teleport.audit.user_agent
      target_field: user_agent
      ignore_missing: true
  - user_agent:
      tag: user_agent_user_agent_0c7e3002
      field: user_agent
      ignore_missing: true
  # KubernetesClusterMetadata contains common metadata for kubernetes-related events.
  # See teleport.audit.kubernetes group for field definitions.
  - set:
      tag: set_orchestrator_type_d805966a
      field: orchestrator.type
      value: kubernetes
      if: ctx.teleport.audit.kubernetes_cluster != null
  - rename:
      tag: rename_teleport_audit_kubernetes_cluster_to_orchestrator_cluster_name_203bbd18
      field: teleport.audit.kubernetes_cluster
      target_field: orchestrator.cluster.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_users_to_teleport_audit_kubernetes_users_5f9b53ab
      field: teleport.audit.kubernetes_users
      target_field: teleport.audit.kubernetes.users
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_groups_to_teleport_audit_kubernetes_groups_37558bed
      field: teleport.audit.kubernetes_groups
      target_field: teleport.audit.kubernetes.groups
      ignore_missing: true
  # KubernetesPodMetadata contains common metadata for kubernetes pod-related events.
  # See teleport.audit.kubernetes.pod group for field definitions.
  - rename:
      tag: rename_teleport_audit_kubernetes_pod_name_to_orchestrator_resource_name_53970267
      field: teleport.audit.kubernetes_pod_name
      target_field: orchestrator.resource.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_pod_namespace_to_orchestrator_namespace_4dd512bd
      field: teleport.audit.kubernetes_pod_namespace
      target_field: orchestrator.namespace
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_container_name_to_teleport_audit_kubernetes_pod_container_name_019016d4
      field: teleport.audit.kubernetes_container_name
      target_field: teleport.audit.kubernetes.pod.container_name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_container_image_to_teleport_audit_kubernetes_pod_container_image_c805a40e
      field: teleport.audit.kubernetes_container_image
      target_field: teleport.audit.kubernetes.pod.container_image
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_node_name_to_teleport_audit_kubernetes_pod_node_name_2eb5de90
      field: teleport.audit.kubernetes_node_name
      target_field: teleport.audit.kubernetes.pod.node_name
      ignore_missing: true
  # SAMLIdPServiceProviderMetadata contains common metadata for SAML IdP service provider events.
  # See teleport.audit.saml-idp-service-provider group for field definitions.
  - rename:
      tag: rename_teleport_audit_service_provider_entity_id_to_teleport_audit_saml_idp_service_provider_entity_id_ed1cfb5f
      field: teleport.audit.service_provider_entity_id
      target_field: teleport.audit.saml_idp_service_provider.entity_id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_service_provider_shortcut_to_teleport_audit_saml_idp_service_provider_shortcut_c7f68d9f
      field: teleport.audit.service_provider_shortcut
      target_field: teleport.audit.saml_idp_service_provider.shortcut
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_attribute_mapping_to_teleport_audit_saml_idp_service_provider_attribute_mapping_0defab9f
      field: teleport.audit.attribute_mapping
      target_field: teleport.audit.saml_idp_service_provider.attribute_mapping
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_session_id_to_teleport_audit_session_id_c94a2c9c
      description: 'Fix an issue where "session_id" is present in this event.'
      field: teleport.audit.session_id
      target_field: teleport.audit.session.id
      ignore_missing: true
      if: ctx.event.action.startsWith('saml.')
  # Okta related events metadata.
  # See teleport.audit.okta group for field definitions.
  - rename:
      tag: rename_teleport_audit_added_to_teleport_audit_okta_resources_added_405cad58
      field: teleport.audit.added
      target_field: teleport.audit.okta.resources.added
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_updated_to_teleport_audit_okta_resources_updated_23548e76
      field: teleport.audit.updated
      target_field: teleport.audit.okta.resources.updated
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_deleted_to_teleport_audit_okta_resources_deleted_e94b152e
      field: teleport.audit.deleted
      target_field: teleport.audit.okta.resources.deleted
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_source_to_teleport_audit_okta_assignment_source_23f1ae1a
      field: teleport.audit.source
      target_field: teleport.audit.okta.assignment.source
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_starting_status_to_teleport_audit_okta_assignment_starting_status_4458641a
      field: teleport.audit.starting_status
      target_field: teleport.audit.okta.assignment.starting_status
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_ending_status_to_teleport_audit_okta_assignment_ending_status_884e4686
      field: teleport.audit.ending_status
      target_field: teleport.audit.okta.assignment.ending_status
      ignore_missing: true
  # Access list member metadata
  - rename:
      tag: rename_teleport_audit_access_list_name_to_teleport_audit_access_list_name_3d731ef5
      field: teleport.audit.access_list_name
      target_field: teleport.audit.access_list.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_members_to_teleport_audit_access_list_members_dc85788b
      field: teleport.audit.members
      target_field: teleport.audit.access_list.members
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_roles_to_teleport_audit_access_list_membership_requirements_changed_roles_fc467137
      field: teleport.audit.roles
      target_field: teleport.audit.access_list.membership_requirements_changed.roles
      ignore_missing: true
      if: ctx.teleport.audit.event?.action == 'access_list.review'
  - rename:
      tag: rename_teleport_audit_traits_to_teleport_audit_access_list_membership_requirements_changed_traits_808fe365
      field: teleport.audit.traits
      target_field: teleport.audit.access_list.membership_requirements_changed.traits
      ignore_missing: true
      if: ctx.teleport.audit.event?.action == 'access_list.review'
  - rename:
      tag: rename_teleport_audit_message_to_teleport_audit_access_list_review_message_7c13f006
      field: teleport.audit.message
      target_field: teleport.audit.access_list.review_message
      ignore_missing: true
      if: ctx.teleport.audit.event?.action == 'access_list.review'
  - rename:
      tag: rename_teleport_audit_review_id_to_teleport_audit_access_list_review_id_b3a68f77
      field: teleport.audit.review_id
      target_field: teleport.audit.access_list.review_id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_review_frequency_changed_to_teleport_audit_access_list_review_frequency_changed_84f32e1f
      field: teleport.audit.review_frequency_changed
      target_field: teleport.audit.access_list.review_frequency_changed
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_review_day_of_month_changed_to_teleport_audit_access_list_review_day_of_month_changed_0e0b6d4b
      field: teleport.audit.review_day_of_month_changed
      target_field: teleport.audit.access_list.review_day_of_month_changed
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_removed_members_to_teleport_audit_access_list_removed_members_a1612367
      field: teleport.audit.removed_members
      target_field: teleport.audit.access_list.removed_members
      ignore_missing: true
  # LockMetadata contains common metadata for lock resource events.
  - rename:
      field: teleport.audit.target
      tag: lock_target_field
      target_field: teleport.audit.lock.target
      ignore_missing: true
      if: "ctx.event.action.startsWith('lock.')"
  # Session related events metadata.
  # See teleport.audit.session group for field definitions.
  - rename:
      tag: rename_teleport_audit_size_to_teleport_audit_session_terminal_size_1c0b6dd7
      field: teleport.audit.size
      target_field: teleport.audit.session.terminal_size
      ignore_missing: true
  - grok:
      tag: grok_teleport_audit_session_terminal_size_ef51498f
      field: teleport.audit.session.terminal_size
      patterns:
        - "%{NUMBER:process.tty.columns:int}:%{NUMBER:process.tty.rows:int}"
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_teleport_audit_initial_command_to_process_command_line_0e26c975
      field: teleport.audit.initial_command
      target_field: process.command_line
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_session_recording_to_teleport_audit_session_session_recording_6a2bef5e
      field: teleport.audit.session_recording
      target_field: teleport.audit.session.session_recording
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_enhanced_recording_to_teleport_audit_session_enhanced_recording_f5be99c8
      field: teleport.audit.enhanced_recording
      target_field: teleport.audit.session.enhanced_recording
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_interactive_to_teleport_audit_session_interactive_2f4aed42
      field: teleport.audit.interactive
      target_field: teleport.audit.session.interactive
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_participants_to_teleport_audit_session_participants_05b6613c
      field: teleport.audit.participants
      target_field: teleport.audit.session.participants
      ignore_missing: true
  - date:
      tag: date_teleport_audit_session_start_to_event_start_49c7f043
      field: teleport.audit.session_start
      target_field: event.start
      formats:
        - ISO8601
      if: ctx.teleport?.audit?.session_start != null
      ignore_failure: true
  - remove:
      tag: remove_teleport_audit_session_start_b48f1505
      field: teleport.audit.session_start
      ignore_missing: true
      if: ctx.event?.start != null
  - date:
      tag: date_teleport_audit_session_stop_to_event_end_b1f6ecd2
      field: teleport.audit.session_stop
      target_field: event.end
      formats:
        - ISO8601
      if: ctx.teleport?.audit?.session_stop != null
      ignore_failure: true
  - remove:
      tag: remove_teleport_audit_session_stop_85229e4e
      field: teleport.audit.session_stop
      ignore_missing: true
      if: ctx.event?.end != null
  # Desktop events metadata
  # See teleport.audit.desktop group for field definitions.
  - rename:
      tag: rename_teleport_audit_length_to_client_bytes_03ee79ea
      field: teleport.audit.length
      target_field: client.bytes
      if: ctx.event.action == 'desktop.clipboard.send'
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_length_to_server_bytes_73761a40
      field: teleport.audit.length
      target_field: server.bytes
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_directory_name_to_file_directory_a04eb896
      field: teleport.audit.directory_name
      target_field: file.directory
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_directory_id_to_teleport_audit_desktop_directory_id_3c90c0b6
      field: teleport.audit.directory_id
      target_field: teleport.audit.desktop.directory_id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_file_path_to_file_path_837d9721
      field: teleport.audit.file_path
      target_field: file.path
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_ms_to_teleport_audit_desktop_delay_ms_6c3a2664
      field: teleport.audit.ms
      target_field: teleport.audit.desktop.delay_ms
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_offset_to_teleport_audit_desktop_offset_d0b37cce
      field: teleport.audit.offset
      target_field: teleport.audit.desktop.offset
      ignore_missing: true
  # FileTransferRequestEvent happens when a FileTransferRequest is created, updated, approved, or denied.
  # See teleport.audit.file-transfer-request group for field definitions.
  - rename:
      tag: rename_teleport_audit_requestID_to_teleport_audit_file_transfer_request_id_dda182a7
      field: teleport.audit.requestID
      target_field: teleport.audit.file_transfer_request.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_approvers_to_teleport_audit_file_transfer_request_approvers_1d402600
      field: teleport.audit.approvers
      target_field: teleport.audit.file_transfer_request.approvers
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_requester_to_teleport_audit_file_transfer_request_requester_011508c0
      field: teleport.audit.requester
      target_field: teleport.audit.file_transfer_request.requester
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_location_to_file_path_e51ae4d0
      field: teleport.audit.location
      target_field: file.path
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_download_to_teleport_audit_file_transfer_request_is_download_4584d93d
      field: teleport.audit.download
      target_field: teleport.audit.file_transfer_request.is_download
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_filename_to_file_name_dcbaf1ee
      field: teleport.audit.filename
      target_field: file.name
      ignore_missing: true
  # Process metadata
  # See teleport.audit.process group for field definitions.
  - rename:
      tag: rename_teleport_audit_pid_to_process_pid_4a4c97ef
      field: teleport.audit.pid
      target_field: process.pid
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_cgroup_id_to_process_cgroup_id_ee0d87a0
      field: teleport.audit.cgroup_id
      target_field: process.cgroup.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_program_to_process_name_22d468ce
      field: teleport.audit.program
      target_field: process.name
      ignore_missing: true
  - append:
      tag: append_event_outcome_71674923
      field: event.outcome
      value:
