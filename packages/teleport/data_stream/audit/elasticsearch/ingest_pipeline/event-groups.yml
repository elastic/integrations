---
description: >
  Pipeline to group Teleport audit fields into metadata groups. See https://github.com/gravitational/teleport/blob/master/api/proto/teleport/legacy/types/events/events.proto

processors:
  # SessionMetadata is a common session event metadata
  # See teleport.audit.session group for field definitions.
  - rename:
      tag: rename_teleport_audit_sid_to_teleport_audit_session_id_743b6d2a
      field: teleport.audit.sid
      target_field: teleport.audit.session.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_with_mfa_to_teleport_audit_mfa_device_uuid_853585ca
      field: teleport.audit.with_mfa
      target_field: teleport.audit.mfa_device.uuid
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_private_key_policy_to_teleport_audit_session_private_key_policy_d9c626c2
      field: teleport.audit.private_key_policy
      target_field: teleport.audit.session.private_key_policy
      ignore_missing: true
  # UserMetadata is a common user event metadata
  # See teleport.audit.user group for field definitions.
  - remove:
      tag: remove_teleport_audit_user_user_346097ac
      description: 'Fix an issue where "user": {"user": message} is present'
      field: teleport.audit.user.user
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_user_to_user_name_f3549d22
      field: teleport.audit.user
      target_field: user.name
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_teleport_audit_login_to_process_user_name_3ba54b17
      field: teleport.audit.login
      target_field: process.user.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_impersonator_to_teleport_audit_user_impersonator_d981be5d
      field: teleport.audit.impersonator
      target_field: teleport.audit.user.impersonator
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_aws_role_arn_to_teleport_audit_user_aws_role_arn_1e0b68a3
      field: teleport.audit.aws_role_arn
      target_field: teleport.audit.user.aws_role_arn
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_access_requests_to_teleport_audit_user_access_requests_a30cb6d0
      field: teleport.audit.access_requests
      target_field: teleport.audit.user.access_requests
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_azure_identity_to_teleport_audit_user_azure_identity_ef96553a
      field: teleport.audit.azure_identity
      target_field: teleport.audit.user.azure_identity
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_gcp_service_account_to_teleport_audit_user_gcp_service_account_85170e3b
      field: teleport.audit.gcp_service_account
      target_field: teleport.audit.user.gcp_service_account
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_trusted_device_to_teleport_audit_user_trusted_device_09c87de9
      field: teleport.audit.trusted_device
      target_field: teleport.audit.user.trusted_device
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_required_private_key_policy_to_teleport_audit_user_required_private_key_policy_d4256d6f
      field: teleport.audit.required_private_key_policy
      target_field: teleport.audit.user.required_private_key_policy
      ignore_missing: true
  - set:
      tag: set_teleport_audit_user_kind_c68c6d70
      field: teleport.audit.user.kind
      value: unspecified
      if: ctx.teleport?.audit?.user_kind == 0
  - set:
      tag: set_teleport_audit_user_kind_32fa857e
      field: teleport.audit.user.kind
      value: human
      if: ctx.teleport?.audit?.user_kind == 1
  - set:
      tag: set_teleport_audit_user_kind_21a69a19
      field: teleport.audit.user.kind
      value: bot
      if: ctx.teleport?.audit?.user_kind == 2
  - remove:
      tag: remove_teleport_audit_user_kind_b9850a96
      field: teleport.audit.user_kind
      ignore_missing: true
      if: ctx.teleport?.audit?.user?.kind != null
  # Server is a server metadata
  # See teleport.audit.server group for field definitions.
  - rename:
      tag: rename_teleport_audit_namespace_to_group_name_5407fd4d
      field: teleport.audit.namespace
      target_field: group.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_id_to_host_id_e8c872f6
      field: teleport.audit.server_id
      target_field: host.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_hostname_to_host_hostname_c40e108d
      field: teleport.audit.server_hostname
      target_field: host.hostname
      ignore_missing: true
  - grok:
      tag: grok_teleport_audit_server_addr_7c66b81d
      field: teleport.audit.server_addr
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:server.address}|\[%{IP:server.ip}\])(:%{POSINT:server.port:long})?$'
  - remove:
      tag: remove_teleport_audit_server_addr_96017459
      field: teleport.audit.server_addr
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_forwarded_by_to_teleport_audit_server_forwarded_by_8c90e45b
      field: teleport.audit.forwarded_by
      target_field: teleport.audit.server.forwarded_by
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_sub_kind_to_teleport_audit_server_sub_kind_750910d2
      field: teleport.audit.server_sub_kind
      target_field: teleport.audit.server.sub_kind
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_server_version_to_teleport_audit_server_version_aef29da2
      field: teleport.audit.server_version
      target_field: teleport.audit.server.version
      ignore_missing: true
  # Stash scalar addr before dot_expander so addr.local/addr.remote can expand.
  - rename:
      tag: rename_teleport_audit_addr_to__temp_teleport_audit_addr_20fa755f
      field: teleport.audit.addr
      target_field: _temp.teleport_audit_addr
      if: "ctx.teleport?.audit?.addr instanceof String"
      ignore_missing: true
  # Extract data from addr.local field.
  - dot_expander:
      tag: dot_expander_addr_local_e33bc9fe
      path: teleport.audit
      field: addr.local
  # Connection contains connection info.
  # All of these fields are mapped to ECS fields.
  - grok:
      tag: grok_teleport_audit_addr_local_14010e90
      field: teleport.audit.addr.local
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:destination.address}|\[%{IP:destination.ip}\])(:%{POSINT:destination.port:long})?$'
      if: ctx.server?.address != null
  - grok:
      tag: grok_teleport_audit_addr_local_4fd3f30b
      field: teleport.audit.addr.local
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:server.address}|\[%{IP:server.ip}\])(:%{POSINT:server.port:long})?$'
      if: ctx.server?.address == null
  - remove:
      tag: remove_teleport_audit_addr_local_6549e544
      field: teleport.audit.addr.local
      ignore_missing: true
  # Extract data from addr.remote field.
  - dot_expander:
      tag: dot_expander_addr_remote_78764977
      path: teleport.audit
      field: addr.remote
  - grok:
      tag: grok_teleport_audit_addr_remote_7ad9f0f3
      field: teleport.audit.addr.remote
      ignore_missing: true
      ignore_failure: true
      patterns:
        - '^(%{IPORHOST:client.address}|\[%{IP:client.ip}\])(:%{POSINT:client.port:long})?$'
  - remove:
      tag: remove_teleport_audit_addr_remote_19caf95a
      field: teleport.audit.addr.remote
      ignore_missing: true
  # Restore stashed scalar addr value.
  - remove:
      tag: remove_teleport_audit_addr_fb1f5e0b
      field: teleport.audit.addr
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename__temp_teleport_audit_addr_to_teleport_audit_addr_505e9d40
      field: _temp.teleport_audit_addr
      target_field: teleport.audit.addr
      ignore_missing: true
  # The last field and cleanup.
  - rename:
      tag: rename_teleport_audit_proto_to_network_protocol_f7228a7a
      field: teleport.audit.proto
      target_field: network.protocol
      ignore_missing: true
  - remove:
      tag: remove_teleport_connection_7430390e
      field: teleport.connection
      ignore_missing: true
  # ClientMetadata identifies the originating client for an event.
  # All of these fields are mapped to ECS fields.
  - rename:
      tag: rename_teleport_audit_user_agent_to_user_agent_a245f9bf
      field: teleport.audit.user_agent
      target_field: user_agent
      ignore_missing: true
  - user_agent:
      tag: user_agent_user_agent_ce6d212f
      field: user_agent
      ignore_missing: true
  # KubernetesClusterMetadata contains common metadata for kubernetes-related events.
  # See teleport.audit.kubernetes group for field definitions.
  - set:
      tag: set_orchestrator_type_5c7ab120
      field: orchestrator.type
      value: kubernetes
      if: ctx.teleport.audit.kubernetes_cluster != null
  - rename:
      tag: rename_teleport_audit_kubernetes_cluster_to_orchestrator_cluster_name_8d294759
      field: teleport.audit.kubernetes_cluster
      target_field: orchestrator.cluster.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_users_to_teleport_audit_kubernetes_users_cc20ae8e
      field: teleport.audit.kubernetes_users
      target_field: teleport.audit.kubernetes.users
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_groups_to_teleport_audit_kubernetes_groups_ffd9a023
      field: teleport.audit.kubernetes_groups
      target_field: teleport.audit.kubernetes.groups
      ignore_missing: true
  # KubernetesPodMetadata contains common metadata for kubernetes pod-related events.
  # See teleport.audit.kubernetes.pod group for field definitions.
  - rename:
      tag: rename_teleport_audit_kubernetes_pod_name_to_orchestrator_resource_name_b593344c
      field: teleport.audit.kubernetes_pod_name
      target_field: orchestrator.resource.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_pod_namespace_to_orchestrator_namespace_2bd58ef7
      field: teleport.audit.kubernetes_pod_namespace
      target_field: orchestrator.namespace
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_container_name_to_teleport_audit_kubernetes_pod_container_name_e51634f9
      field: teleport.audit.kubernetes_container_name
      target_field: teleport.audit.kubernetes.pod.container_name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_container_image_to_teleport_audit_kubernetes_pod_container_image_b3ae2cf6
      field: teleport.audit.kubernetes_container_image
      target_field: teleport.audit.kubernetes.pod.container_image
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_kubernetes_node_name_to_teleport_audit_kubernetes_pod_node_name_79745d34
      field: teleport.audit.kubernetes_node_name
      target_field: teleport.audit.kubernetes.pod.node_name
      ignore_missing: true
  # SAMLIdPServiceProviderMetadata contains common metadata for SAML IdP service provider events.
  # See teleport.audit.saml-idp-service-provider group for field definitions.
  - rename:
      tag: rename_teleport_audit_service_provider_entity_id_to_teleport_audit_saml_idp_service_provider_entity_id_2ba86347
      field: teleport.audit.service_provider_entity_id
      target_field: teleport.audit.saml_idp_service_provider.entity_id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_service_provider_shortcut_to_teleport_audit_saml_idp_service_provider_shortcut_4628d234
      field: teleport.audit.service_provider_shortcut
      target_field: teleport.audit.saml_idp_service_provider.shortcut
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_attribute_mapping_to_teleport_audit_saml_idp_service_provider_attribute_mapping_5f8235d4
      field: teleport.audit.attribute_mapping
      target_field: teleport.audit.saml_idp_service_provider.attribute_mapping
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_session_id_to_teleport_audit_session_id_8c470526
      description: 'Fix an issue where "session_id" is present in this event.'
      field: teleport.audit.session_id
      target_field: teleport.audit.session.id
      ignore_missing: true
      if: ctx.event.action.startsWith('saml.')
  # Okta related events metadata.
  # See teleport.audit.okta group for field definitions.
  - rename:
      tag: rename_teleport_audit_added_to_teleport_audit_okta_resources_added_1c209e82
      field: teleport.audit.added
      target_field: teleport.audit.okta.resources.added
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_updated_to_teleport_audit_okta_resources_updated_959b76be
      field: teleport.audit.updated
      target_field: teleport.audit.okta.resources.updated
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_deleted_to_teleport_audit_okta_resources_deleted_e1e493a2
      field: teleport.audit.deleted
      target_field: teleport.audit.okta.resources.deleted
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_source_to_teleport_audit_okta_assignment_source_2ce38485
      field: teleport.audit.source
      target_field: teleport.audit.okta.assignment.source
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_starting_status_to_teleport_audit_okta_assignment_starting_status_4f718b63
      field: teleport.audit.starting_status
      target_field: teleport.audit.okta.assignment.starting_status
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_ending_status_to_teleport_audit_okta_assignment_ending_status_98eba2c6
      field: teleport.audit.ending_status
      target_field: teleport.audit.okta.assignment.ending_status
      ignore_missing: true
  # Access list member metadata
  - rename:
      tag: rename_teleport_audit_access_list_name_to_teleport_audit_access_list_name_fac23ef2
      field: teleport.audit.access_list_name
      target_field: teleport.audit.access_list.name
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_members_to_teleport_audit_access_list_members_fe8fe8d1
      field: teleport.audit.members
      target_field: teleport.audit.access_list.members
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_roles_to_teleport_audit_access_list_membership_requirements_changed_roles_93dfb9db
      field: teleport.audit.roles
      target_field: teleport.audit.access_list.membership_requirements_changed.roles
      ignore_missing: true
      if: ctx.teleport.audit.event?.action == 'access_list.review'
  - rename:
      tag: rename_teleport_audit_traits_to_teleport_audit_access_list_membership_requirements_changed_traits_423afb04
      field: teleport.audit.traits
      target_field: teleport.audit.access_list.membership_requirements_changed.traits
      ignore_missing: true
      if: ctx.teleport.audit.event?.action == 'access_list.review'
  - rename:
      tag: rename_teleport_audit_message_to_teleport_audit_access_list_review_message_336a3b9a
      field: teleport.audit.message
      target_field: teleport.audit.access_list.review_message
      ignore_missing: true
      if: ctx.teleport.audit.event?.action == 'access_list.review'
  - rename:
      tag: rename_teleport_audit_review_id_to_teleport_audit_access_list_review_id_357dd7bc
      field: teleport.audit.review_id
      target_field: teleport.audit.access_list.review_id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_review_frequency_changed_to_teleport_audit_access_list_review_frequency_changed_18dc481b
      field: teleport.audit.review_frequency_changed
      target_field: teleport.audit.access_list.review_frequency_changed
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_review_day_of_month_changed_to_teleport_audit_access_list_review_day_of_month_changed_9e806108
      field: teleport.audit.review_day_of_month_changed
      target_field: teleport.audit.access_list.review_day_of_month_changed
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_removed_members_to_teleport_audit_access_list_removed_members_d81b3e3d
      field: teleport.audit.removed_members
      target_field: teleport.audit.access_list.removed_members
      ignore_missing: true
  # LockMetadata contains common metadata for lock resource events.
  - rename:
      field: teleport.audit.target
      tag: lock_target_field_cf85b37c
      target_field: teleport.audit.lock.target
      ignore_missing: true
      if: "ctx.event.action.startsWith('lock.')"
  # Session related events metadata.
  # See teleport.audit.session group for field definitions.
  - rename:
      tag: rename_teleport_audit_size_to_teleport_audit_session_terminal_size_5c1bd0c9
      field: teleport.audit.size
      target_field: teleport.audit.session.terminal_size
      ignore_missing: true
  - grok:
      tag: grok_teleport_audit_session_terminal_size_e7326f36
      field: teleport.audit.session.terminal_size
      patterns:
        - "%{NUMBER:process.tty.columns:int}:%{NUMBER:process.tty.rows:int}"
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_teleport_audit_initial_command_to_process_command_line_b1e3bd44
      field: teleport.audit.initial_command
      target_field: process.command_line
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_session_recording_to_teleport_audit_session_session_recording_01a16bd8
      field: teleport.audit.session_recording
      target_field: teleport.audit.session.session_recording
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_enhanced_recording_to_teleport_audit_session_enhanced_recording_5a85751e
      field: teleport.audit.enhanced_recording
      target_field: teleport.audit.session.enhanced_recording
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_interactive_to_teleport_audit_session_interactive_d61c475b
      field: teleport.audit.interactive
      target_field: teleport.audit.session.interactive
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_participants_to_teleport_audit_session_participants_e21ff063
      field: teleport.audit.participants
      target_field: teleport.audit.session.participants
      ignore_missing: true
  - date:
      tag: date_teleport_audit_session_start_to_event_start_41d779de
      field: teleport.audit.session_start
      target_field: event.start
      formats:
        - ISO8601
      if: ctx.teleport?.audit?.session_start != null
      ignore_failure: true
  - remove:
      tag: remove_teleport_audit_session_start_04c96a6d
      field: teleport.audit.session_start
      ignore_missing: true
      if: ctx.event?.start != null
  - date:
      tag: date_teleport_audit_session_stop_to_event_end_24281448
      field: teleport.audit.session_stop
      target_field: event.end
      formats:
        - ISO8601
      if: ctx.teleport?.audit?.session_stop != null
      ignore_failure: true
  - remove:
      tag: remove_teleport_audit_session_stop_d0217c45
      field: teleport.audit.session_stop
      ignore_missing: true
      if: ctx.event?.end != null
  # Desktop events metadata
  # See teleport.audit.desktop group for field definitions.
  - rename:
      tag: rename_teleport_audit_length_to_client_bytes_148c86c4
      field: teleport.audit.length
      target_field: client.bytes
      if: ctx.event.action == 'desktop.clipboard.send'
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_length_to_server_bytes_d33fe6cc
      field: teleport.audit.length
      target_field: server.bytes
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_directory_name_to_file_directory_8bfc9274
      field: teleport.audit.directory_name
      target_field: file.directory
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_directory_id_to_teleport_audit_desktop_directory_id_eca7126e
      field: teleport.audit.directory_id
      target_field: teleport.audit.desktop.directory_id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_file_path_to_file_path_93c6928c
      field: teleport.audit.file_path
      target_field: file.path
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_ms_to_teleport_audit_desktop_delay_ms_8f7c1f5e
      field: teleport.audit.ms
      target_field: teleport.audit.desktop.delay_ms
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_offset_to_teleport_audit_desktop_offset_b2703a02
      field: teleport.audit.offset
      target_field: teleport.audit.desktop.offset
      ignore_missing: true
  # FileTransferRequestEvent happens when a FileTransferRequest is created, updated, approved, or denied.
  # See teleport.audit.file-transfer-request group for field definitions.
  - rename:
      tag: rename_teleport_audit_requestID_to_teleport_audit_file_transfer_request_id_acf64d23
      field: teleport.audit.requestID
      target_field: teleport.audit.file_transfer_request.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_approvers_to_teleport_audit_file_transfer_request_approvers_f6077a12
      field: teleport.audit.approvers
      target_field: teleport.audit.file_transfer_request.approvers
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_requester_to_teleport_audit_file_transfer_request_requester_f263d247
      field: teleport.audit.requester
      target_field: teleport.audit.file_transfer_request.requester
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_location_to_file_path_22813a34
      field: teleport.audit.location
      target_field: file.path
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_download_to_teleport_audit_file_transfer_request_is_download_c477229c
      field: teleport.audit.download
      target_field: teleport.audit.file_transfer_request.is_download
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_filename_to_file_name_9a3dad84
      field: teleport.audit.filename
      target_field: file.name
      ignore_missing: true
  # Process metadata
  # See teleport.audit.process group for field definitions.
  - rename:
      tag: rename_teleport_audit_pid_to_process_pid_46834517
      field: teleport.audit.pid
      target_field: process.pid
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_cgroup_id_to_process_cgroup_id_98fa59d8
      field: teleport.audit.cgroup_id
      target_field: process.cgroup.id
      ignore_missing: true
  - rename:
      tag: rename_teleport_audit_program_to_process_name_d057e485
      field: teleport.audit.program
      target_field: process.name
      ignore_missing: true
  - append:
      tag: append_event_outcome_d362c49a
      field: event.outcome
