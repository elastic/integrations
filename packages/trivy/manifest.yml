format_version: "3.4.2"
name: trivy
title: Trivy
version: "0.1.0"
source:
  license: "Elastic-2.0"
description: Collect vulnerability findings from Trivy scan reports with Elastic Agent.
type: integration
categories:
  - security
  - vulnerability_management
  - vulnerability_workflow
conditions:
  kibana:
    version: "^8.19.0 || ^9.1.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/sample-logo.svg
    title: Trivy logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: trivy
    title: Trivy scan reports
    description: Collect vulnerability findings from Trivy JSON scan reports.
    data_streams:
      - vulnerability
    inputs:
      - type: filestream
        title: Collect Trivy scan reports via filestream
        description: Collect flattened Trivy scan reports from files on disk.
owner:
  github: elastic/security-service-integrations
  type: community
