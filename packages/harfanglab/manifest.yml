format_version: "3.3.0"
name: harfanglab
title: "HarfangLab EDR"
version: "1.0.0"
description: "Collect ECS-formatted security telemetry from the HarfangLab EDR, either pushed over an HTTP endpoint or pulled from the HarfangLab API."
type: integration
categories:
  - security
conditions:
  kibana:
    version: "^9.0.0"
  elastic:
    subscription: "basic"
    capabilities:
      - security
icons:
  - src: /img/harfanglab-logo.svg
    title: HarfangLab logo
    size: 32x32
    type: image/svg+xml
  - src: /img/harfanglab-logo-dark.svg
    title: HarfangLab logo (dark mode)
    size: 32x32
    type: image/svg+xml
    dark_mode: true
policy_templates:
  - name: harfanglab
    title: "HarfangLab EDR logs"
    description: "Collect ECS-formatted logs from the HarfangLab EDR, pushed over an HTTP endpoint or pulled from the HarfangLab API."
    inputs:
      - type: http_endpoint
        title: "Collect HarfangLab EDR logs via HTTP endpoint (push mode)"
        description: "Receive ECS-formatted events sent by the HarfangLab agent over HTTP."
      - type: cel
        title: "Collect HarfangLab EDR logs via API polling (pull mode)"
        description: "Periodically pull ECS-formatted events from the HarfangLab API."
owner:
  github: harfanglab
  type: partner
