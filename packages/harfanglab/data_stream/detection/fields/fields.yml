# Fields emitted by the HarfangLab agent that are not part of ECS. They live in the
# harfanglab vendor namespace rather than extending ECS objects in place.
#
# The agent nests a second process ancestor under process.parent.parent, which ECS
# does not define; the ingest pipeline moves it here.
- name: harfanglab.process.parent.parent.entity_id
  type: keyword
  description: Unique identifier for the grandparent process.
- name: harfanglab.process.parent.parent.command_line
  type: keyword
  description: Full command line that started the grandparent process.
- name: harfanglab.process.parent.parent.executable
  type: keyword
  description: Absolute path to the grandparent process executable.
# HarfangLab detection metadata. Explicitly mapped as keyword so detection
# rules can match exact values (e.g. harfanglab.detection.confidence: "strong").
- name: harfanglab.detection.confidence
  type: keyword
  description: >-
    Confidence level the HarfangLab EDR assigns to a detection (for example
    "strong", "moderate", "weak").
- name: harfanglab.detection.title
  type: keyword
  description: Human-readable title (name) of the HarfangLab detection.
- name: harfanglab.detection.engine.name
  type: keyword
  description: >-
    Name of the HarfangLab detection engine that produced the alert (for example
    "ioc", "yara", "sigma").
- name: harfanglab.detection.level
  type: keyword
  description: >-
    Severity level the HarfangLab EDR assigns to the detection (for example
    "low", "medium", "high", "critical").
