- source_dataset: bloodhound_enterprise.finding
  rules:
    - target_dataset: bloodhound_enterprise.error
      if: ctx.error?.message != null
      namespace:
        - "{{data_stream.namespace}}"
        - default
    - target_dataset: bloodhound_enterprise.finding_sync
      if: ctx.sync_event != null
      namespace:
        - "{{data_stream.namespace}}"
        - default
