- name: bloodhound_enterprise
  type: group
  description: Fields specific to BloodHound Enterprise attack path findings.
  fields:
    - name: change_type
      type: keyword
      description: opened when the instance is new to sync state; updated when BloodHound updated_at changed since the last poll.
    - name: finding_layout
      type: keyword
      description: API shape for this instance — relationship (from/to principals), single_principal (Principal/Props), or legacy_nested.
    - name: instance
      type: flattened
      description: Complete BloodHound Enterprise finding instance from the details API, including fields that vary by finding type.
    - name: combo_graph_relation_id
      type: long
      description: BloodHound combo graph relation identifier when present on relationship findings.
    - name: finding_type
      type: keyword
      description: Type of BloodHound finding (e.g. AttackPath).
    - name: category
      type: keyword
      description: BloodHound finding category (e.g. zone/tag name).
    - name: environment
      type: keyword
      description: BloodHound environment (domain) name on collection_status documents when no finding data was returned for that environment and zone.
    - name: zone
      type: keyword
      description: BloodHound Enterprise zone (asset group tag) name on collection_status documents when no finding data was returned for that environment and zone.
    - name: collection_absent_reason
      type: keyword
      description: Why no finding instances were indexed for this poll (no_open_finding_types or no_open_finding_instances).
    - name: collection_data_source
      type: keyword
      description: BloodHound Enterprise API step that returned no data for the environment and zone.
    - name: collection_message
      type: match_only_text
      description: Human-readable note naming the environment and zone where BloodHound returned no open finding data.
    - name: domain_sid
      type: keyword
      description: Active Directory domain SID for the finding environment. This is an identifier, not the domain name.
    - name: impact_score
      type: float
      description: Risk impact score assigned by BloodHound Enterprise (0.0 to 10.0).
    - name: impact_percentage
      type: float
      description: Percentage of domain impacted by attack path (API ratio 0–1, e.g. 0.98473).
    - name: impact_count
      type: long
      description: Number of domain objects impacted.
    - name: exposure_percentage
      type: float
      description: Percentage of domain exposed to attack path (API ratio 0–1).
    - name: exposure_count
      type: long
      description: Number of exposed domain objects.
    - name: asset_group_tag_id
      type: long
      description: Asset group tag identifier.
    - name: principal_hash
      type: keyword
      description: Internal principal graph hash.
    - name: accepted
      type: boolean
      description: Whether the finding risk has been accepted by an admin.
    - name: is_inherited
      type: boolean
      description: Whether the relationship is inherited.
    - name: remediation
      type: match_only_text
      description: Summary of remediation steps recommended by BloodHound Enterprise.
    - name: title
      type: keyword
      description: BloodHound finding title from the finding-type description.
    - name: short_remediation
      type: match_only_text
      description: Short remediation text for this finding type.
    - name: long_remediation
      type: match_only_text
      description: Long remediation text for this finding type.
    - name: short_description
      type: match_only_text
      description: Short description of this finding type.
    - name: long_description
      type: match_only_text
      description: Long description of this finding type.
    - name: references
      type: match_only_text
      description: References published with this finding type.
    - name: principal
      type: group
      description: Source principal on single-principal and relationship findings.
      fields:
        - name: kind
          type: keyword
          description: BloodHound principal kind (User, Group, Computer, Domain).
        - name: properties
          type: flattened
          description: BloodHound Props object for single-principal findings, or dynamic principal attributes.
    - name: from_principal
      type: group
      description: From principal on relationship findings.
      fields:
        - name: properties
          type: flattened
          description: FromPrincipalProps from the BloodHound details API.
    - name: to_principal
      type: group
      description: To principal on relationship findings.
      fields:
        - name: properties
          type: flattened
          description: ToPrincipalProps from the BloodHound details API.
    - name: relationship
      type: group
      description: Edge metadata on relationship findings.
      fields:
        - name: properties
          type: flattened
          description: RelProps from the BloodHound details API.
    - name: target.kind
      type: keyword
      description: BloodHound principal kind for the destination principal (User, Group, Computer, Domain).
    - name: attack_path
      type: group
      description: Attack path graph attributes.
      fields:
        - name: length
          type: long
          description: Number of hops/edges in the attack path.
        - name: relationships
          type: keyword
          description: List of edge relationship types in the attack path.
