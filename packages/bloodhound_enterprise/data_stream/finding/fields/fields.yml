- name: bloodhound_enterprise
  type: group
  description: Fields specific to BloodHound Enterprise attack path findings.
  fields:
    - name: finding_type
      type: keyword
      description: Type of BloodHound finding (e.g. AttackPath).
    - name: category
      type: keyword
      description: BloodHound finding category (e.g. zone/tag name).
    - name: impact_score
      type: float
      description: Risk impact score assigned by BloodHound Enterprise (0.0 to 10.0).
    - name: impact_percentage
      type: float
      description: Percentage of domain impacted by attack path.
    - name: impact_count
      type: long
      description: Number of domain objects impacted.
    - name: exposure_percentage
      type: float
      description: Percentage of domain exposed to attack path.
    - name: exposure_count
      type: long
      description: Number of exposed domain objects.
    - name: asset_group_tag_id
      type: long
      description: Asset group tag identifier.
    - name: principal_hash
      type: keyword
      description: Internal principal graph hash.
    - name: accepted
      type: boolean
      description: Whether the finding risk has been accepted by an admin.
    - name: is_inherited
      type: boolean
      description: Whether the relationship is inherited.
    - name: remediation
      type: keyword
      description: Summary of remediation steps recommended by BloodHound Enterprise.
    - name: attack_path
      type: group
      description: Attack path graph attributes.
      fields:
        - name: length
          type: long
          description: Number of hops/edges in the attack path.
        - name: relationships
          type: keyword
          description: List of edge relationship types in the attack path.
