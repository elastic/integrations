---
description: Pipeline for BloodHound Enterprise authentication and request failures.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: "9.3.0"
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - set:
      field: event.outcome
      tag: set_event_outcome
      value: failure
  - set:
      field: event.module
      tag: set_event_module
      value: bloodhound_enterprise
  - set:
      field: log.level
      tag: set_log_level
      value: error
  - set:
      field: message
      tag: copy_error_to_message
      copy_from: error.message
      ignore_empty_value: true
  - append:
      field: tags
      tag: append_error_tag
      value: bloodhound_enterprise-error
      allow_duplicates: false
on_failure:
  - append:
      field: error.message
      tag: append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
