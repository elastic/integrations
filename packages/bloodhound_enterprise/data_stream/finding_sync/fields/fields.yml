- name: bloodhound_enterprise
  type: group
  description: BloodHound Enterprise sync and reconciliation metadata.
  fields:
    - name: sync_kind
      type: keyword
      description: checkpoint (type-level sync state) or finding_removed (instance gone from details or entire finding type dropped from available-types).
    - name: reconcile_mode
      type: keyword
      description: On checkpoints only. full is a complete open-id census (emits finding_removed for resolved instances). incremental is changed-rows-only poll between full passes.
    - name: full_reconcile_at
      type: date
      description: When a full open-id reconcile completed for this finding type (same instant as poll_completed_at on full checkpoints).
    - name: type_key
      type: keyword
      description: Stable key domain|zone|finding_type for sync checkpoints.
    - name: finding_type
      type: keyword
      description: BloodHound finding type name.
    - name: category
      type: keyword
      description: BloodHound zone (asset group tag) name.
    - name: domain_name
      type: keyword
      description: BloodHound environment (domain) name.
    - name: max_updated_at
      type: keyword
      description: Latest BloodHound updated_at seen for this finding type in the completed poll.
    - name: open_finding_ids
      type: keyword
      description: BloodHound instance ids still open for this type after the poll.
      ignore_above: 8191
    - name: open_finding_count
      type: long
      description: Count of open finding ids in the checkpoint.
    - name: poll_completed_at
      type: date
      description: When the agent finished reconciling this finding type.
