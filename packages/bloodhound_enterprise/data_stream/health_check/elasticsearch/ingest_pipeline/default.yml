---
description: Parse BloodHound Enterprise sync-step events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: bloodhound_enterprise.health_check
      tag: parse_sync_json
      if: ctx.event?.original != null
  - rename:
      field: bloodhound_enterprise.health_check._step
      target_field: bloodhound_enterprise.health_check.step
      ignore_missing: true
      tag: rename_sync_step
  - rename:
      field: bloodhound_enterprise.health_check._uri
      target_field: bloodhound_enterprise.health_check.uri
      ignore_missing: true
      tag: rename_sync_uri
  - rename:
      field: bloodhound_enterprise.health_check._domain
      target_field: bloodhound_enterprise.health_check.domain
      ignore_missing: true
      tag: rename_sync_domain
  - remove:
      field:
        - bloodhound_enterprise.health_check._raw
        - bloodhound_enterprise.health_check._body
        - bloodhound_enterprise.health_check._status_code
      ignore_missing: true
      tag: remove_raw_response_bodies
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value: iam
      allow_duplicates: false
  - set:
      field: event.outcome
      tag: set_event_outcome_failure
      value: failure
      if: ctx.bloodhound_enterprise?.health_check?.error != null
  - set:
      field: event.outcome
      tag: set_event_outcome_success
      value: success
      if: ctx.bloodhound_enterprise?.health_check?.error == null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
