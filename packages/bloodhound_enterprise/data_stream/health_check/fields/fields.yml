- name: bhe
  type: group
  fields:
    - name: sync.step
      type: keyword
      description: Numeric CEL workflow step (1-9) that produced this event.
    - name: sync.info
      type: keyword
      description: Informational status message for the current sync step.
    - name: sync.error
      type: keyword
      description: Error message from a failed sync step.
    - name: sync.bh_cases_found
      type: long
      description: Number of existing BloodHound Enterprise-tagged Kibana cases found for this tenant.
    - name: sync.stale_count
      type: long
      description: Number of stale cases queued for deletion.
    - name: sync.case_id
      type: keyword
      description: Kibana case ID created or resolved during this step.
    - name: sync.domains_after_filter
      type: long
      description: Number of BloodHound Enterprise domains remaining after environment/zone filters.
