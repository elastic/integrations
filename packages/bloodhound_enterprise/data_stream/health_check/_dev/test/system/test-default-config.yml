input: cel
service: bloodhound_enterprise-health_check
wait_for_data_timeout: 1m
vars:
  base_url: http://{{Hostname}}:{{Port}}
  token_id: test-token-id
  token_key: test-token-key
  selected_environment: EXAMPLE.CORP
  bhe_zones: "Tier Zero"
  kibana_url: http://{{Hostname}}:{{Port}}
  kibana_api_key: test-kibana-key
  elasticsearch_url: http://{{Hostname}}:{{Port}}
  kibana_space: default
data_stream:
  vars:
    interval: 1h
    preserve_original_event: true
assert:
  hit_count: 10
