format_version: 3.5.6
name: bloodhound_enterprise
title: "SpecterOps BloodHound Enterprise"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: "Collect BloodHound Enterprise attack-path findings into Elastic Security Cases and Alerts for investigation and remediation tracking."
type: integration
categories:
  - security
conditions:
  kibana:
    version: "^9.3.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/elastic-dashboard-screenshot.png
    title: BloodHound Enterprise Attack Path Overview
    type: image/png
icons:
  - src: /img/BHE-logo-64.svg
    title: BloodHound Enterprise Logo
    size: 64x64
    type: image/svg+xml
policy_templates:
  - name: BloodHound
    title: Collect BloodHound Enterprise attack paths
    description: >-
      Sync BloodHound Enterprise attack-path findings into Elastic Security Cases and Alerts. Add this integration to an Elastic Agent policy (not Fleet Server), configure credentials, then Save.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: cel
        title: Collect BloodHound Enterprise findings via CEL
        description: >-
          Polls BloodHound Enterprise for attack-path findings, creates or updates matching Security Cases (tagged BloodHound Enterprise plus the tenant slug from Base URL), and attaches related Security Alerts for at-risk principals.
        vars:
          - name: base_url
            type: text
            title: Base URL
            description: BloodHound Enterprise tenant URL, for example https://yourtenant.bloodhoundenterprise.io. Do not include a trailing slash.
            multi: false
            required: true
            show_user: true
          - name: selected_environment
            type: text
            title: Selected environment
            description: Comma-separated environment/domain names to sync (e.g. PHANTOM.CORP,GHOST.CORP). Leave empty or use All/* to fetch all. Unrecognized or gibberish values are treated as all. Spaces/quotes are tolerated.
            default: ""
            multi: false
            required: false
            show_user: true
          - name: bhe_zones
            type: text
            title: BloodHound Enterprise zones
            description: Comma-separated BloodHound Enterprise zone names to sync (e.g. Tier Zero,Tier One). Leave empty or use All/* to fetch all. Unrecognized or gibberish values are treated as all. Spaces/quotes are tolerated.
            default: ""
            multi: false
            required: false
            show_user: true
          - name: token_id
            type: text
            title: Token ID
            description: BloodHound Enterprise API Token ID
            multi: false
            required: true
            show_user: true
            secret: false
          - name: token_key
            type: password
            title: Token Key
            description: This is a secret value. Once saved, you won't be able to see this value again.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: kibana_url
            type: text
            title: Kibana URL
            description: URL the Elastic Agent uses to reach Kibana (for a local elastic-package stack this is https://elastic-package-stack-kibana-1:5601).
            multi: false
            required: true
            show_user: true
          - name: kibana_space
            type: text
            title: Kibana space
            description: Kibana space where Cases and Security Alerts are written. Use default unless this policy should target another space. The packaged Attack Path Overview dashboard reads .alerts-security.alerts-default, so a non-default space needs a matching data view.
            default: default
            multi: false
            required: true
            show_user: true
          - name: kibana_api_key
            type: password
            title: Kibana API Key
            description: This is a secret value. Once saved, you won't be able to see this value again.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: elasticsearch_url
            type: text
            title: Elasticsearch URL
            description: URL the Elastic Agent uses to reach Elasticsearch for alert indexing (for a local elastic-package stack this is https://elasticsearch:9200).
            multi: false
            required: true
            show_user: true
          - name: attach_batch_size
            type: text
            title: Alert attach batch size
            description: Number of alerts attached to a case per request during Case & Alert Sync.
            default: "100"
            multi: false
            required: true
            show_user: false
          - name: max_executions
            type: text
            title: Max CEL executions per interval
            description: CEL evaluation budget for Case & Alert Sync. This stream walks BloodHound, Kibana Cases, and Elasticsearch APIs, so the default 1000 is not enough.
            default: "500000"
            multi: false
            required: true
            show_user: false
          - name: ssl
            type: yaml
            title: SSL configuration
            description: Certificate authorities, supported protocols, and verification_mode for BloodHound Enterprise/Kibana/Elasticsearch HTTPS connections.
            required: false
            show_user: false
            default: |
              #verification_mode: none
owner:
  github: elastic/security-service-integrations
  type: elastic
