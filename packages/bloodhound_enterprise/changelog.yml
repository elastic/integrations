  changes:
    - description: >-
        GA release of SpecterOps BloodHound Enterprise for Elastic — CEL finding collection with HMAC auth; delta sync (change_type opened/updated on finding); finding_sync checkpoints and finding_removed with periodic full open-id reconcile (hardcoded full_removal_period in CEL); reconcile_mode and full_reconcile_at on checkpoints; finding and finding_sync data streams; collector errors on finding with event.type error; collection_status for empty scopes; packaged detection rule and dashboard; default 24h poll. Requires Kibana 9.4.0+.
