# newer versions go on top
- version: "1.0.0"
  changes:
    - description: >-
        GA release of SpecterOps BloodHound Enterprise for Elastic — CEL finding collection with
        HMAC auth; delta sync with change_type opened/updated; finding_sync checkpoints and
        finding_removed (instance and finding-type dropout from available-types); finding, error,
        and finding_sync data streams; dynamic finding instance mapping (finding_layout);
        collection_status when no open types or instances; packaged detection rule and dashboard;
        default 24h poll. Requires Kibana 9.4.0+.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22192
