version: '2.3'
services:
  bloodhound_enterprise-finding:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: bloodhound_enterprise-finding
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-finding.yml
  bloodhound_enterprise-health_check:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: bloodhound_enterprise-health_check
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-health_check.yml
