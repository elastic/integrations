rules:
  - path: /api/v2/available-domains
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"data":[{"id":"domain-1","name":"EXAMPLE.CORP","exposures":[{"asset_group_tag":{"id":"1","name":"Tier Zero"}}]}]}
  - path: /api/cases/_find
    methods: ['GET']
    query_params:
      perPage: "{perPage:.*}"
      page: "{page:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"cases":[],"total":0,"page":1,"perPage":100}
  - path: /api/v2/domains/{id}/available-types
    methods: ['GET']
    query_params:
      asset_group_tag_id: "{tag:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"data":["T0GenericAll"]}
  - path: /api/v2/findings/{type}
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"data":{"title":"GenericAll on Tier Zero","type":"T0GenericAll","short_remediation":"Remove GenericAll rights.","long_remediation":"Remove GenericAll rights from the principal.","short_description":"A principal has GenericAll.","long_description":"GenericAll grants full control.","references":"https://bloodhound.example.com/docs"}}
  - path: /api/v2/domains/{id}/details
    methods: ['GET']
    query_params:
      finding: "{finding:.*}"
      skip: "{skip:.*}"
      limit: "{limit:.*}"
      Accepted: "{accepted:.*}"
      asset_group_tag_id: "{tag:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"count":1,"data":[{"id":"100001","Finding":"T0GenericAll","Severity":"critical","Environment":"EXAMPLE.CORP","FromPrincipal":"S-1-5-21-000000000-000000000-000000000-1100","FromPrincipalName":"alice@example.corp","FromPrincipalKind":"User","ToPrincipal":"S-1-5-21-000000000-000000000-000000000-512","ToPrincipalName":"DOMAIN ADMINS@EXAMPLE.CORP","ToPrincipalKind":"Group","ImpactPercentage":0.85,"DomainSID":"S-1-5-21-000000000-000000000-000000000"}]}
  - path: /api/cases
    methods: ['POST']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"id":"case-0001","title":"BloodHound Enterprise | EXAMPLE.CORP | Tier Zero | T0GenericAll","totalAlerts":0}
  - path: /api/cases/{id}
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"id":"case-0001","title":"BloodHound Enterprise | EXAMPLE.CORP | Tier Zero | T0GenericAll","totalAlerts":0}
  - path: /.alerts-security.alerts-default/_bulk
    methods: ['POST']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"took":1,"errors":false,"items":[{"index":{"_id":"domain-1-T0GenericAll-100001","_index":".internal.alerts-security.alerts-default-000001","status":201}}]}
  - path: /api/cases/{id}/comments
    methods: ['POST']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"id":"comment-0001","totalAlerts":1}
