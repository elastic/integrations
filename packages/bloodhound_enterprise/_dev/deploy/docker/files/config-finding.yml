rules:
  - path: /api/v2/available-domains
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"data":[{"id":"domain-1","name":"EXAMPLE.CORP","exposures":[{"asset_group_tag":{"id":"1","name":"Tier Zero"}}]}]}
  - path: /api/v2/domains/{id}/available-types
    methods: ['GET']
    query_params:
      asset_group_tag_id: "{tag:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"data":["T0GenericAll"]}
  - path: /api/v2/findings/T0GenericAll
    methods: ['GET']
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"data":{"title":"GenericAll against Tier Zero","short_remediation":"Remove excessive rights on Tier Zero objects.","long_remediation":"Remove GenericAll rights from the source principal on the destination Tier Zero object.","short_description":"A principal has GenericAll on a sensitive Tier Zero object.","long_description":"GenericAll grants broad control of the destination object and can enable further attack paths.","references":["https://bloodhound.example.com/docs/findings/T0GenericAll"]}}
  - path: /api/v2/domains/{id}/details
    methods: ['GET']
    query_params:
      finding: "{finding:.*}"
      skip: "0"
      limit: "{limit:.*}"
      Accepted: "{accepted:.*}"
      asset_group_tag_id: "{tag:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"count":3,"data":[{"id":"100001","Finding":"T0GenericAll","Severity":"critical","Environment":"EXAMPLE.CORP","FromPrincipal":"S-1-5-21-000000000-000000000-000000000-1100","FromPrincipalName":"alice@example.corp","FromPrincipalKind":"User","ToPrincipal":"S-1-5-21-000000000-000000000-000000000-512","ToPrincipalName":"DOMAIN ADMINS@EXAMPLE.CORP","ToPrincipalKind":"Group","ImpactPercentage":0.85,"ImpactCount":12,"ExposurePercentage":0.42,"ExposureCount":120,"AssetGroupTagID":1,"PrincipalHash":"dGVzdC1oYXNoLTE=","Accepted":false,"IsInherited":false,"GraphURL":"https://bloodhound.example.com/ui/findings/100001","created_at":"2026-07-24T14:50:02.760Z","remediation":"Remove GenericAll rights from alice@example.corp on DOMAIN ADMINS.","FromPrincipalProps":{"operatingsystem":"Windows Server 2022"},"attack_path_details":{"path_length":2,"relationships":["GenericAll","MemberOf"]}}]}
  - path: /api/v2/domains/{id}/details
    methods: ['GET']
    query_params:
      finding: "{finding:.*}"
      skip: "1"
      limit: "{limit:.*}"
      Accepted: "{accepted:.*}"
      asset_group_tag_id: "{tag:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"count":3,"data":[{"id":"100002","Finding":"T0GenericAll","Severity":"high","Environment":"EXAMPLE.CORP","FromPrincipal":"S-1-5-21-000000000-000000000-000000000-1101","FromPrincipalName":"bob@example.corp","FromPrincipalKind":"User","ToPrincipal":"S-1-5-21-000000000-000000000-000000000-512","ToPrincipalName":"DOMAIN ADMINS@EXAMPLE.CORP","ToPrincipalKind":"Group","ImpactPercentage":0.4,"Accepted":false,"GraphURL":"https://bloodhound.example.com/ui/findings/100002"}]}
  - path: /api/v2/domains/{id}/details
    methods: ['GET']
    query_params:
      finding: "{finding:.*}"
      skip: "2"
      limit: "{limit:.*}"
      Accepted: "{accepted:.*}"
      asset_group_tag_id: "{tag:.*}"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"count":3,"data":[{"id":"100003","Finding":"T0GenericAll","Severity":"low","Environment":"EXAMPLE.CORP","FromPrincipal":"S-1-5-21-000000000-000000000-000000000-1102","FromPrincipalName":"carol@example.corp","FromPrincipalKind":"User","ToPrincipal":"S-1-5-21-000000000-000000000-000000000-512","ToPrincipalName":"DOMAIN ADMINS@EXAMPLE.CORP","ToPrincipalKind":"Group","ImpactPercentage":0.1,"Accepted":false,"GraphURL":"https://bloodhound.example.com/ui/findings/100003"}]}
