input: cel
service: doppel-mock
data_stream:
  vars:
    url: http://{{Hostname}}:{{Port}}
    api_version: v2
    client_id: test-client-id
    client_secret: test-client-secret
    token_url: http://{{Hostname}}:{{Port}}/oauth/token
    page_size: 1
    initial_interval: 720h
    interval: 10s
    enable_request_tracer: true
    preserve_original_event: true
assert:
  hit_count: 2
