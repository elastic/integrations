---
description: Pipeline for processing vLLM metrics.
processors:
  - set:
      tag: set_event_module
      field: event.module
      value: vllm
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 8.17.0
  - rename:
      tag: rename_num_requests_running
      field: prometheus.vllm:num_requests_running.value
      target_field: vllm.requests.running
      ignore_missing: true
  - rename:
      tag: rename_num_requests_waiting
      field: prometheus.vllm:num_requests_waiting.value
      target_field: vllm.requests.waiting
      ignore_missing: true
  - rename:
      tag: rename_kv_cache_usage_perc
      field: prometheus.vllm:kv_cache_usage_perc.value
      target_field: vllm.kv_cache.usage.pct
      ignore_missing: true
  - rename:
      tag: rename_prompt_tokens_total
      field: prometheus.vllm:prompt_tokens_total.counter
      target_field: vllm.tokens.prompt.count
      ignore_missing: true
  - rename:
      tag: rename_generation_tokens_total
      field: prometheus.vllm:generation_tokens_total.counter
      target_field: vllm.tokens.generation.count
      ignore_missing: true
  - rename:
      tag: rename_prefix_cache_queries_total
      field: prometheus.vllm:prefix_cache_queries_total.counter
      target_field: vllm.prefix_cache.queries.count
      ignore_missing: true
  - rename:
      tag: rename_prefix_cache_hits_total
      field: prometheus.vllm:prefix_cache_hits_total.counter
      target_field: vllm.prefix_cache.hits.count
      ignore_missing: true
  - rename:
      tag: rename_num_preemptions_total
      field: prometheus.vllm:num_preemptions_total.counter
      target_field: vllm.preemptions.count
      ignore_missing: true
  - rename:
      tag: rename_request_success_total
      field: prometheus.vllm:request_success_total.counter
      target_field: vllm.requests.finished.count
      ignore_missing: true
  - rename:
      tag: rename_time_to_first_token_seconds
      field: prometheus.vllm:time_to_first_token_seconds.histogram
      target_field: vllm.latency.time_to_first_token.histogram
      ignore_missing: true
  - rename:
      tag: rename_inter_token_latency_seconds
      field: prometheus.vllm:inter_token_latency_seconds.histogram
      target_field: vllm.latency.inter_token.histogram
      ignore_missing: true
  - rename:
      tag: rename_e2e_request_latency_seconds
      field: prometheus.vllm:e2e_request_latency_seconds.histogram
      target_field: vllm.latency.e2e.histogram
      ignore_missing: true
  - rename:
      tag: rename_request_queue_time_seconds
      field: prometheus.vllm:request_queue_time_seconds.histogram
      target_field: vllm.latency.queue.histogram
      ignore_missing: true
  - rename:
      tag: rename_request_inference_time_seconds
      field: prometheus.vllm:request_inference_time_seconds.histogram
      target_field: vllm.latency.inference.histogram
      ignore_missing: true
  - rename:
      tag: rename_request_prefill_time_seconds
      field: prometheus.vllm:request_prefill_time_seconds.histogram
      target_field: vllm.latency.prefill.histogram
      ignore_missing: true
  - rename:
      tag: rename_request_decode_time_seconds
      field: prometheus.vllm:request_decode_time_seconds.histogram
      target_field: vllm.latency.decode.histogram
      ignore_missing: true
  - rename:
      tag: rename_request_prompt_tokens
      field: prometheus.vllm:request_prompt_tokens.histogram
      target_field: vllm.request.prompt_tokens.histogram
      ignore_missing: true
  - rename:
      tag: rename_request_generation_tokens
      field: prometheus.vllm:request_generation_tokens.histogram
      target_field: vllm.request.generation_tokens.histogram
      ignore_missing: true
  - rename:
      tag: rename_labels
      field: prometheus.labels
      target_field: vllm.labels
      ignore_missing: true
  - remove:
      tag: remove_labels_instance_job
      field:
        - vllm.labels.instance
        - vllm.labels.job
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_labels
      fields:
        - vllm.labels
      target_field: vllm.labels_fingerprint
      ignore_missing: true
  - remove:
      tag: remove_prometheus
      field: prometheus
      ignore_missing: true
  - drop:
      tag: drop_unmapped_events
      description: Drop events that carry no metric mapped by this integration.
      if: ctx.vllm == null || ctx.vllm.keySet().stream().allMatch(k -> k == 'labels' || k == 'labels_fingerprint')
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
