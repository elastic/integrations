format_version: 3.4.2
name: vllm
title: "vLLM"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: "Collect inference metrics from vLLM servers: request queue, KV cache, token throughput, and latency (time to first token, inter-token, end to end)."
type: integration
categories:
  - observability
  - custom
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/vllm-logo.png
    title: vLLM logo
    size: 256x256
    type: image/png
policy_templates:
  - name: vllm
    title: vLLM metrics
    description: Collect metrics from the vLLM Prometheus endpoint.
    inputs:
      - type: prometheus/metrics
        title: Collect vLLM metrics
        description: Collect metrics from the /metrics endpoint of vLLM servers.
owner:
  github: elastic/integrations-triaging
  type: community
