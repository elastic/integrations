---
description: Pipeline to process tencent_cloud.scf logs
processors:
  - set:
      tag: set_ecs_version_dbf680ba
      field: ecs.version
      value: 8.17.0
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      tag: json_original_eede31ac
      field: event.original
      target_field: tencent_cloud.scf
  - set:
      field: event.kind
      tag: set_event_kind_c3139286
      value: state
  - rename:
      tag: rename_tencent_cloud_scf_SCF_Duration_to_event_duration_95e00f91
      ignore_missing: true
      field: tencent_cloud.scf.SCF_Duration
      target_field: event.duration
  - rename:
      tag: rename_tencent_cloud_scf_SCF_FunctionName_to_faas_name_8eb87c93
      ignore_missing: true
      field: tencent_cloud.scf.SCF_FunctionName
      target_field: faas.name
  - rename:
      tag: rename_tencent_cloud_scf_SCF_Qualifier_to_faas_version_c9fb2290
      ignore_missing: true
      field: tencent_cloud.scf.SCF_Qualifier
      target_field: faas.version
  - rename:
      tag: rename_tencent_cloud_scf_SCF_Level_to_log_level_1c560ec2
      ignore_missing: true
      field: tencent_cloud.scf.SCF_Level
      target_field: log.level
  - date:
      if: ctx.tencent_cloud?.scf?.SCF_StartTime != null
      tag: date_processor_tencent_cloud.scf.SCF_StartTime_8660cc2d
      field: tencent_cloud.scf.SCF_StartTime
      target_field: '@timestamp'
      formats:
        - UNIX_MS
  - rename:
      tag: rename_tencent_cloud_scf_SCF_Message_to_message_9cdc42c7
      ignore_missing: true
      field: tencent_cloud.scf.SCF_Message
      target_field: message
  - rename:
      tag: rename_tencent_cloud_scf_SCF_RequestId_to_faas_execution_a7f9626e
      ignore_missing: true
      field: tencent_cloud.scf.SCF_RequestId
      target_field: faas.execution
  - date:
      if: ctx.tencent_cloud?.scf?.SCF_StartTime != null
      tag: date_processor_tencent_cloud.scf.SCF_StartTime_ac2149cc
      field: tencent_cloud.scf.SCF_StartTime
      target_field: event.start
      formats:
        - UNIX_MS
  - rename:
      tag: rename_tencent_cloud_scf_SCF_StatusCode_to_http_response_status_code_e75a9850
      ignore_missing: true
      field: tencent_cloud.scf.SCF_StatusCode
      target_field: http.response.status_code
  - convert:
      tag: convert_tencent_cloud_scf___SOURCE___to_source_ip_220799f7
      ignore_failure: true
      ignore_missing: true
      field: tencent_cloud.scf.__SOURCE__
      target_field: source.ip
      type: ip
  - script:
      tag: script_drop_null_empty_values_53dd9140
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - geoip:
      ignore_missing: true
      tag: geoip_source_ip_7280ca8f
      field: source.ip
      target_field: source.geo
  - geoip:
      ignore_missing: true
      tag: geoip_source_asn_6061e8ee
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
  - rename:
      ignore_missing: true
      tag: rename_source_as_asn_89a6ccb5
      field: source.as.asn
      target_field: source.as.number
  - rename:
      ignore_missing: true
      tag: rename_source_as_organization_name_5f3d6ce0
      field: source.as.organization_name
      target_field: source.as.organization.name
  - remove:
      ignore_missing: true
      tag: remove_fields_db9276bd
      field:
        - tencent_cloud.scf.__SOURCE__
  - append:
      tag: append_related_ip_a2ab3b40
      if: ctx.source?.ip != null
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
  - set:
      field: event.kind
      tag: set_pipeline_error_in_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: >-
        Processor {{{_ingest.on_failure_processor_type}}} with tag
        {{{_ingest.on_failure_processor_tag}}} in pipeline
        {{{_ingest.on_failure_pipeline}}} failed with message:
        {{{_ingest.on_failure_message}}}
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
