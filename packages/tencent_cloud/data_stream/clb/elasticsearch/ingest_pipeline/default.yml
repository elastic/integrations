---
description: Pipeline to process tencent_cloud clb logs
processors:
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: 8.11.0
  - set:
      tag: copy_original_message_3e662ec3
      field: originalMessage
      copy_from: message
  - rename:
      ignore_missing: true
      if: ctx.event?.original == null
      tag: rename_message_adccacb8
      field: originalMessage
      target_field: event.original
  - remove:
      ignore_missing: true
      if: ctx.event?.original != null
      tag: remove_copied_message_a7a9fa3a
      field: originalMessage
  - remove:
      ignore_missing: true
      tag: remove_message_b1f49d7c
      field:
        - message
  - json:
      tag: json_original_ab370b33
      field: event.original
      target_field: tencent_cloud.clb
  - rename:
      tag: rename_tencent_cloud_clb_bytes_sent_to_http_response_body_bytes_45ac749b
      ignore_missing: true
      field: tencent_cloud.clb.bytes_sent
      target_field: http.response.body.bytes
  - rename:
      tag: rename_tencent_cloud_clb_http_host_to_url_domain_f8eef3df
      ignore_missing: true
      field: tencent_cloud.clb.http_host
      target_field: url.domain
  - rename:
      tag: rename_tencent_cloud_clb_http_referer_to_http_request_referrer_478758c7
      ignore_missing: true
      field: tencent_cloud.clb.http_referer
      target_field: http.request.referrer
  - rename:
      tag: rename_tencent_cloud_clb_http_user_agent_to_user_agent_original_43c78d41
      ignore_missing: true
      field: tencent_cloud.clb.http_user_agent
      target_field: user_agent.original
  - rename:
      tag: rename_tencent_cloud_clb_http_x_forwarded_for_to_network_forwarded_ip_88edfe7a
      ignore_missing: true
      field: tencent_cloud.clb.http_x_forwarded_for
      target_field: network.forwarded_ip
  - rename:
      tag: rename_tencent_cloud_clb_protocol_type_to_network_protocol_42038958
      ignore_missing: true
      field: tencent_cloud.clb.protocol_type
      target_field: network.protocol
  - rename:
      tag: rename_tencent_cloud_clb_remote_addr_to_source_ip_7fdc4f22
      ignore_missing: true
      field: tencent_cloud.clb.remote_addr
      target_field: source.ip
  - rename:
      tag: rename_tencent_cloud_clb_remote_port_to_source_port_3ef1ee83
      ignore_missing: true
      field: tencent_cloud.clb.remote_port
      target_field: source.port
  - rename:
      tag: rename_tencent_cloud_clb_request_length_to_http_request_body_bytes_5a4edf88
      ignore_missing: true
      field: tencent_cloud.clb.request_length
      target_field: http.request.body.bytes
  - rename:
      tag: rename_tencent_cloud_clb_request_method_to_http_request_method_e8e62264
      ignore_missing: true
      field: tencent_cloud.clb.request_method
      target_field: http.request.method
  - rename:
      tag: rename_tencent_cloud_clb_server_addr_to_destination_ip_32fc03ab
      ignore_missing: true
      field: tencent_cloud.clb.server_addr
      target_field: destination.ip
  - rename:
      tag: rename_tencent_cloud_clb_server_name_to_server_domain_cde74ded
      ignore_missing: true
      field: tencent_cloud.clb.server_name
      target_field: server.domain
  - rename:
      tag: rename_tencent_cloud_clb_server_port_to_destination_port_f0ae56ec
      ignore_missing: true
      field: tencent_cloud.clb.server_port
      target_field: destination.port
  - rename:
      tag: rename_tencent_cloud_clb_server_protocol_to_http_version_b9d40da9
      ignore_missing: true
      field: tencent_cloud.clb.server_protocol
      target_field: http.version
  - rename:
      tag: rename_tencent_cloud_clb_status_to_http_response_status_code_5ce148f2
      ignore_missing: true
      field: tencent_cloud.clb.status
      target_field: http.response.status_code
  - rename:
      tag: rename_tencent_cloud_clb_stgw_request_id_to_event_id_5f42a73d
      ignore_missing: true
      field: tencent_cloud.clb.stgw_request_id
      target_field: event.id
  - date:
      if: ctx.tencent_cloud?.clb?.time_local != null
      tag: date_processor_tencent_cloud.clb.time_local_e34f70a8
      field: tencent_cloud.clb.time_local
      target_field: '@timestamp'
      formats:
        - dd/MMM/yyyy:HH:mm:ss Z
  - rename:
      tag: rename_tencent_cloud_clb_upstream_addr_to_destination_address_8605a4db
      ignore_missing: true
      field: tencent_cloud.clb.upstream_addr
      target_field: destination.address
  - rename:
      tag: rename_tencent_cloud_clb_upstream_connect_time_to_event_duration_c0dbfda4
      ignore_missing: true
      field: tencent_cloud.clb.upstream_connect_time
      target_field: event.duration
  - rename:
      tag: rename_tencent_cloud_clb_uri_to_url_path_6699ff86
      ignore_missing: true
      field: tencent_cloud.clb.uri
      target_field: url.path
  - script:
      tag: script_drop_null_empty_values_53dd9140
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - geoip:
      ignore_missing: true
      tag: geoip_source_ip_7280ca8f
      field: source.ip
      target_field: source.geo
  - geoip:
      ignore_missing: true
      tag: geoip_source_asn_6061e8ee
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
  - rename:
      ignore_missing: true
      tag: rename_source_as_asn_89a6ccb5
      field: source.as.asn
      target_field: source.as.number
  - rename:
      ignore_missing: true
      tag: rename_source_as_organization_name_5f3d6ce0
      field: source.as.organization_name
      target_field: source.as.organization.name
  - geoip:
      ignore_missing: true
      tag: geoip_destination_ip_3de6570b
      field: destination.ip
      target_field: destination.geo
  - geoip:
      ignore_missing: true
      tag: geoip_destination_asn_2aa889e7
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
  - rename:
      ignore_missing: true
      tag: rename_destination_as_asn_84eb2662
      field: destination.as.asn
      target_field: destination.as.number
  - append:
      tag: append_event_category_89437688
      field: event.category
      value:
        - web
      allow_duplicates: false
  - append:
      tag: append_event_type_d69984bd
      field: event.type
      value:
        - access
      allow_duplicates: false
  - append:
      tag: append_event_type_8a627bdf
      if: ctx.http?.response?.status_code == 200
      field: event.type
      value:
        - info
      allow_duplicates: false
  - append:
      tag: append_event_type_61833e80
      if: ctx.http?.response?.status_code == 405
      field: event.type
      value:
        - error
      allow_duplicates: false
  - append:
      tag: append_event_category_4f4099c5
      field: event.category
      value:
        - network
      allow_duplicates: false
  - append:
      tag: append_event_type_bd172629
      field: event.type
      value:
        - connection
      allow_duplicates: false
  - append:
      tag: append_event_category_f9b651ff
      if: >-
        ctx.http?.request?.method == 'GET' || ctx.http?.request?.method ==
        'POST'
      field: event.category
      value:
        - database
      allow_duplicates: false
  - append:
      tag: append_event_type_a7558418
      if: ctx.http?.request?.method == 'GET'
      field: event.type
      value:
        - access
      allow_duplicates: false
  - append:
      tag: append_event_type_4485d7fb
      if: >-
        ctx.http?.request?.method == 'POST' || ctx.http?.request?.method ==
        'PUT' || ctx.http?.request?.method == 'PATCH' ||
        ctx.http?.request?.method == 'DELETE'
      field: event.type
      value:
        - access
      allow_duplicates: false
  - append:
      tag: append_event_type_1cdaa084
      if: ctx.http?.request?.method == 'HEAD'
      field: event.type
      value:
        - info
      allow_duplicates: false
  - append:
      tag: append_related_ip_a2ab3b40
      if: ctx.source?.ip != null
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
  - append:
      tag: append_related_ip_8318177f
      if: ctx.destination?.ip != null
      field: related.ip
      value: '{{{destination.ip}}}'
      allow_duplicates: false
  - append:
      tag: append_related_ip_f7a3617b
      if: ctx.network?.forwarded_ip != null
      field: related.ip
      value: '{{{network.forwarded_ip}}}'
      allow_duplicates: false
  - append:
      tag: append_related_hosts_27c08a52
      if: ctx.url?.domain != null
      field: related.hosts
      value: '{{{url.domain}}}'
      allow_duplicates: false
  - append:
      tag: append_related_hosts_767e12d8
      if: ctx.server?.domain != null
      field: related.hosts
      value: '{{{server.domain}}}'
      allow_duplicates: false
  - rename:
      ignore_missing: true
      tag: rename_destination_as_organization_name_335ea22b
      field: destination.as.organization_name
      target_field: destination.as.organization.name
  - remove:
      ignore_missing: true
      tag: remove_fields_9f43d65d
      field:
        - tencent_cloud.clb.__FILENAME__
        - tencent_cloud.clb.__TIMESTAMP__
  - remove:
      ignore_failure: true
      ignore_missing: true
      if: ctx?.tags == null || !(ctx.tags.contains("preserve_original_event"))
      tag: remove_original_event_27875831
      field: event.original
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: >-
        Processor {{{_ingest.on_failure_processor_type}}} with tag
        {{{_ingest.on_failure_processor_tag}}} in pipeline
        {{{_ingest.on_failure_pipeline}}} failed with message:
        {{{_ingest.on_failure_message}}}
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
