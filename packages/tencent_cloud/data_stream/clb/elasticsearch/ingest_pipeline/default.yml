---
description: Pipeline to process tencent_cloud clb logs
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 8.11.0
  - set:
      tag: copy_original_message
      field: originalMessage
      copy_from: message
  - rename:
      ignore_missing: true
      if: ctx.event?.original == null
      tag: rename_message
      field: originalMessage
      target_field: event.original
  - remove:
      ignore_missing: true
      if: ctx.event?.original != null
      tag: remove_copied_message
      field: originalMessage
  - remove:
      ignore_missing: true
      tag: remove_message
      field:
        - message
  - json:
      tag: json_original
      field: event.original
      target_field: tencent_cloud.clb
  - rename:
      tag: rename_tencent_cloud_clb_bytes_sent_to_http_response_body_bytes_b82b76c6
      ignore_missing: true
      field: tencent_cloud.clb.bytes_sent
      target_field: http.response.body.bytes
  - rename:
      tag: rename_tencent_cloud_clb_http_host_to_url_domain_adaa3dc0
      ignore_missing: true
      field: tencent_cloud.clb.http_host
      target_field: url.domain
  - rename:
      tag: rename_tencent_cloud_clb_http_referer_to_http_request_referrer_74ce7cba
      ignore_missing: true
      field: tencent_cloud.clb.http_referer
      target_field: http.request.referrer
  - rename:
      tag: rename_tencent_cloud_clb_http_user_agent_to_user_agent_original_25b60938
      ignore_missing: true
      field: tencent_cloud.clb.http_user_agent
      target_field: user_agent.original
  - rename:
      tag: rename_tencent_cloud_clb_http_x_forwarded_for_to_network_forwarded_ip_9f0a9324
      ignore_missing: true
      field: tencent_cloud.clb.http_x_forwarded_for
      target_field: network.forwarded_ip
  - rename:
      tag: rename_tencent_cloud_clb_protocol_type_to_network_protocol_513f339d
      ignore_missing: true
      field: tencent_cloud.clb.protocol_type
      target_field: network.protocol
  - rename:
      tag: rename_tencent_cloud_clb_remote_addr_to_source_ip_3ac38a36
      ignore_missing: true
      field: tencent_cloud.clb.remote_addr
      target_field: source.ip
  - rename:
      tag: rename_tencent_cloud_clb_remote_port_to_source_port_7f671930
      ignore_missing: true
      field: tencent_cloud.clb.remote_port
      target_field: source.port
  - rename:
      tag: rename_tencent_cloud_clb_request_length_to_http_request_body_bytes_ddf8d9b0
      ignore_missing: true
      field: tencent_cloud.clb.request_length
      target_field: http.request.body.bytes
  - rename:
      tag: rename_tencent_cloud_clb_request_method_to_http_request_method_3094e301
      ignore_missing: true
      field: tencent_cloud.clb.request_method
      target_field: http.request.method
  - rename:
      tag: rename_tencent_cloud_clb_server_addr_to_destination_ip_2c0e37fe
      ignore_missing: true
      field: tencent_cloud.clb.server_addr
      target_field: destination.ip
  - rename:
      tag: rename_tencent_cloud_clb_server_name_to_server_domain_593d4708
      ignore_missing: true
      field: tencent_cloud.clb.server_name
      target_field: server.domain
  - rename:
      tag: rename_tencent_cloud_clb_server_port_to_destination_port_7118fca0
      ignore_missing: true
      field: tencent_cloud.clb.server_port
      target_field: destination.port
  - rename:
      tag: rename_tencent_cloud_clb_server_protocol_to_http_version_f3f8aae8
      ignore_missing: true
      field: tencent_cloud.clb.server_protocol
      target_field: http.version
  - rename:
      tag: rename_tencent_cloud_clb_status_to_http_response_status_code_53c1f691
      ignore_missing: true
      field: tencent_cloud.clb.status
      target_field: http.response.status_code
  - rename:
      tag: rename_tencent_cloud_clb_stgw_request_id_to_event_id_b73c2c88
      ignore_missing: true
      field: tencent_cloud.clb.stgw_request_id
      target_field: event.id
  - date:
      if: ctx.tencent_cloud?.clb?.time_local != null
      tag: date_processor_tencent_cloud.clb.time_local
      field: tencent_cloud.clb.time_local
      target_field: '@timestamp'
      formats:
        - dd/MMM/yyyy:HH:mm:ss Z
  - rename:
      tag: rename_tencent_cloud_clb_upstream_addr_to_destination_address_5bb2d241
      ignore_missing: true
      field: tencent_cloud.clb.upstream_addr
      target_field: destination.address
  - rename:
      tag: rename_tencent_cloud_clb_upstream_connect_time_to_event_duration_036ae178
      ignore_missing: true
      field: tencent_cloud.clb.upstream_connect_time
      target_field: event.duration
  - rename:
      tag: rename_tencent_cloud_clb_uri_to_url_path_6661db02
      ignore_missing: true
      field: tencent_cloud.clb.uri
      target_field: url.path
  - script:
      tag: script_drop_null_empty_values
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - geoip:
      ignore_missing: true
      tag: geoip_source_ip
      field: source.ip
      target_field: source.geo
  - geoip:
      ignore_missing: true
      tag: geoip_source_asn
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
  - rename:
      ignore_missing: true
      tag: rename_source_as_asn
      field: source.as.asn
      target_field: source.as.number
  - rename:
      ignore_missing: true
      tag: rename_source_as_organization_name
      field: source.as.organization_name
      target_field: source.as.organization.name
  - geoip:
      ignore_missing: true
      tag: geoip_destination_ip
      field: destination.ip
      target_field: destination.geo
  - geoip:
      ignore_missing: true
      tag: geoip_destination_asn
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
  - rename:
      ignore_missing: true
      tag: rename_destination_as_asn
      field: destination.as.asn
      target_field: destination.as.number
  - append:
      tag: append_event_category_e523855f
      field: event.category
      value:
        - web
      allow_duplicates: false
  - append:
      tag: append_event_type_ef273cf7
      field: event.type
      value:
        - access
      allow_duplicates: false
  - append:
      tag: append_event_type_e534b58e
      if: ctx.http?.response?.status_code == 200
      field: event.type
      value:
        - info
      allow_duplicates: false
  - append:
      tag: append_event_type_7aed4739
      if: ctx.http?.response?.status_code == 405
      field: event.type
      value:
        - error
      allow_duplicates: false
  - append:
      tag: append_event_category_2c5cae23
      field: event.category
      value:
        - network
      allow_duplicates: false
  - append:
      tag: append_event_type_51c0ba95
      field: event.type
      value:
        - connection
      allow_duplicates: false
  - append:
      tag: append_event_category_5cc734b9
      if: >-
        ctx.http?.request?.method == 'GET' || ctx.http?.request?.method ==
        'POST'
      field: event.category
      value:
        - database
      allow_duplicates: false
  - append:
      tag: append_event_type_31baa515
      if: ctx.http?.request?.method == 'GET'
      field: event.type
      value:
        - access
      allow_duplicates: false
  - append:
      tag: append_event_type_8eba498e
      if: >-
        ctx.http?.request?.method == 'POST' || ctx.http?.request?.method ==
        'PUT' || ctx.http?.request?.method == 'PATCH' ||
        ctx.http?.request?.method == 'DELETE'
      field: event.type
      value:
        - access
      allow_duplicates: false
  - append:
      tag: append_event_type_e3fb4def
      if: ctx.http?.request?.method == 'HEAD'
      field: event.type
      value:
        - info
      allow_duplicates: false
  - append:
      tag: append_related_ip_8121c591
      if: ctx.source?.ip != null
      field: related.ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
  - append:
      tag: append_related_ip_c1a6356b
      if: ctx.destination?.ip != null
      field: related.ip
      value: '{{{destination.ip}}}'
      allow_duplicates: false
  - append:
      tag: append_related_ip_0d61ac03
      if: ctx.network?.forwarded_ip != null
      field: related.ip
      value: '{{{network.forwarded_ip}}}'
      allow_duplicates: false
  - append:
      tag: append_related_hosts_e5210c4d
      if: ctx.url?.domain != null
      field: related.hosts
      value: '{{{url.domain}}}'
      allow_duplicates: false
  - append:
      tag: append_related_hosts_2ab61e3f
      if: ctx.server?.domain != null
      field: related.hosts
      value: '{{{server.domain}}}'
      allow_duplicates: false
  - rename:
      ignore_missing: true
      tag: rename_destination_as_organization_name
      field: destination.as.organization_name
      target_field: destination.as.organization.name
  - remove:
      ignore_missing: true
      tag: remove_fields
      field:
        - tencent_cloud.clb.__FILENAME__
        - tencent_cloud.clb.__TIMESTAMP__
  - remove:
      ignore_failure: true
      ignore_missing: true
      if: ctx?.tags == null || !(ctx.tags.contains("preserve_original_event"))
      tag: remove_original_event
      field: event.original
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor {{{_ingest.on_failure_processor_type}}} with tag
        {{{_ingest.on_failure_processor_tag}}} in pipeline
        {{{_ingest.on_failure_pipeline}}} failed with message:
        {{{_ingest.on_failure_message}}}
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
