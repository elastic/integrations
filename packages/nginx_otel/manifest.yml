format_version: 3.6.5
name: nginx_otel
title: "Nginx (OpenTelemetry)"
version: 1.0.0
source:
  license: "Elastic-2.0"
description: >-
  Collect metrics and logs from Nginx using the OTel nginxreceiver and filelogreceiver, with dashboards, alert rule templates and SLO templates. Covers stub_status metrics plus access and error logs.
type: integration
categories:
  - observability
  - web
  - opentelemetry
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: "basic"
# PROTOTYPE: discovery on an integration package (package-spec prototype, was content packages only).
discovery:
  datasets:
    - name: nginxreceiver.otel
    - name: nginx.access.otel
    - name: nginx.error.otel
screenshots:
  - src: /img/nginx-request-health.png
    title: NGINX OTel Request Health dashboard
    size: 600x600
    type: image/png
  - src: /img/nginx-server-internals.png
    title: NGINX OTel Server Internals dashboard
    size: 600x600
    type: image/png
  - src: /img/nginx-traffic-capacity.png
    title: NGINX OTel Traffic & Capacity dashboard
    size: 600x600
    type: image/png
icons:
  - src: /img/nginx_otel_logo.svg
    title: NGINX logo
    size: 32x32
    type: image/svg+xml
# PROTOTYPE: receiver config is written inline in each data stream (agent/stream/stream.yml.hbs),
# no `requires`. Input names match the built nginx_otel_integration 0.1.0 package, so Fleet
# renders the same collector config and its policies map 1:1.
policy_templates:
  - name: nginx
    title: Nginx logs and metrics
    description: Collect stub_status metrics and access/error logs from Nginx using OpenTelemetry receivers
    data_streams:
      - metrics
      - access
      - error
    inputs:
      - name: nginx_otel_input
        type: otelcol
        title: Nginx Metrics
        description: Scrape Nginx stub_status metrics using the OTel Collector nginxreceiver
      - name: filelog_otel
        type: otelcol
        title: Nginx Logs
        description: Tail Nginx access and error logs using the OTel Collector filelogreceiver
owner:
  github: elastic/obs-signals-integrations-team
  type: elastic
