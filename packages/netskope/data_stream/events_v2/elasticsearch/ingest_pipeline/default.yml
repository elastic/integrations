---
description: Pipeline for Netskope event v2 logs (REST dataexport and routed log streaming).
processors:
  - rename:
      field: message
      tag: rename_message_to_event_original_events_v2
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_events_v2
      ignore_missing: true
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_events_v2
      target_field: netskope.events_v2
      on_failure:
        - append:
            tag: append_error_message_events_v2_json
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - fingerprint:
      fields:
        - netskope.events_v2._id
      tag: fingerprint_id_67aaaccf
      target_field: _id
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_e591d676
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == '-' || v == 'N/A' || v == 'NotChecked' || v == 'NotAvailable' || v == 'NoSSL'
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == '-' || v == 'N/A' || v == 'NotChecked' || v == 'NotAvailable' || v == 'NoSSL'
          });
        }
        handleMap(ctx);
  - convert:
      field: netskope.events_v2.acked
      if: ctx.netskope?.events_v2?.alert == "yes"
      tag: convert_acked_to_boolean_295143be
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_netskope_alert_v2_acked_bf324f30
            field: netskope.events_v2.acked
        - append:
            tag: append_error_message_90335acc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
