wait_for_data_timeout: 3m
input: cel
service: netskope-api
vars:
  url: http://{{Hostname}}:{{Port}}
  api_token: test-token
  iterator_index: elastic-test
data_stream:
  vars:
    interval: 2s
    initial_interval: 24h
    alert_types:
      - policy
      - dlp
    preserve_original_event: true
    enable_request_tracer: true
assert:
  hit_count: 3
