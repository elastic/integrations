        - name: trust_computer_checked
          type: keyword
          description: Whether user's computer is trusted or not captured using Dialog box input while applying policies.
        - name: tss-mode
          type: keyword
          description: Threat scan mode value used by threat scans service.
        - name: TSS-scan
          type: keyword
          description: Type of threat scan used. TSS is the malware detection engine for Netskope Threat Protection. Field indicates the TSS version name.
        - name: tss_fail_reason
          type: keyword
          description: TSS is the malware detection engine for Netskope Threat Protection. This field indicates the reason why tss scan was failed to run.
        - name: tss_license
          type: keyword
          description: Indicates if malware license is enabled for the tenant or not.
        - name: tss_mode
          type: keyword
          description: Malware scanning mode, specifies whether it's Real-time Protection or API Data Protection.
        - name: tss_scan_failed
          type: keyword
          description: TSS is the malware detection engine for Netskope Threat Protection. This field indicates if tss scan was failed to run.
        - name: tunnel_id
          type: keyword
          description: Shows the Client installation ID. Only available for the Client steering configuration.
        - name: tunnel_type
          type: keyword
          description: GRE Tunnel Type. Used for NPA applications.
        - name: tunnel_up_time
          type: long
          description: GRE Tunnel up time. Used for NPA applications.
        - name: two_factor_auth
          type: keyword
          description: Two factor authentication is enabled or not.
        - name: type
          type: keyword
          description: Shows if it is an application event or a connection event. Application events are recorded to track user events inside a cloud app. Connection events shows the actual HTTP connection.
        - name: uba_ap1
          type: keyword
          description: Denotes the first app that was used to trigger proximity anomaly which detects when a user has accessed an application from far off locations.
        - name: uba_ap2
          type: keyword
          description: Denotes the second app that was used to trigger proximity anomaly which detects when a user has accessed an application from far off locations - It is also used to denote the upload application in the case of data exfiltration anomaly.
        - name: uba_inst1
          type: keyword
          description: Denotes the first instance name corresponding to uba_ap1 that was used to trigger proximity anomaly which detects when a user has accessed an instance from far off locations - It is also used to denote the download instance in the case of data exfiltration anomaly.
        - name: uba_inst2
          type: keyword
          description: Denotes the second instance name corresponding to uba_ap2 that was used to trigger proximity anomaly which detects when a user has accessed an instance from far off locations - It is also used to denote the upload instance in the case of data exfiltration anomaly.
        - name: unc_path
          type: keyword
          description: The Universal Naming Convention path of the network file share, or printer.
        - name: universal_connector
          type: keyword
          description: Universal connector is a common app connector that is built to detect events(upload, download, post, login related) for all the applications that do not have a dedicated connector. This field denotes if a universal connector was used or not
        - name: ur_normalized
          type: keyword
          description: All lower case user email.
        - name: url
          type: wildcard
          description: URL of the application that the user visited as provided by the log or data plane traffic.
        - name: usb_device_id
          type: keyword
          description: USB Device unique ID.
        - name: usb_device_name
          type: keyword
          description: USB device name.
        - name: usb_device_sn
          type: keyword
          description: USB device serial number.
        - name: usb_device_type
          type: keyword
          description: Type of the USB device attached.
        - name: usb_is_encrypted
          type: boolean
          description: Endpoint DLP allows customers to download data in USB. Flag to show if USB data is encrypted or not.
        - name: usb_product_id
          type: keyword
          description: Endpoint DLP allows customers to download data in USB. This field hold the value of unique product id attached to USB.
        - name: usb_vendor_id
          type: keyword
          description: Endpoint DLP allows customers to download data in USB. This field hold the value of USB's vendor information.
        - name: user
          type: keyword
          description: User email.
        - name: user_category
          type: keyword
          description: Type of user in an enterprise - external / internal.
        - name: user_confidence_index
          type: long
          description: "UCI (User Confidence Index) is one of the ways that UEBA describes how risky the user’s behavior is. The lower UCI is, the more risky the user behavior is. The UCI starts from an initial value and is deducted an amount when the user’s behavior is detected to be anomaly by UEBA engine. The user’s UCI is daily-based, i.e. UEBA engine will create the new UCI with an initial score for users when an UTC day starts. Each user is supposed to start from 1000, but his/her previous day performance will rollover to current day and therefore impact the initial UCI."
        - name: user_confidence_level
          type: keyword
          description: "UCI (User Confidence Index) is one of the ways that UEBA describes how risky the user’s behavior is. User confidence level field holds risk level values."
