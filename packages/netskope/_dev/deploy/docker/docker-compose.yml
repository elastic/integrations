version: "2.3"
services:
  netskope-api:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: netskope-api
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: "8090"
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-api.yml
  netskope-alerts-tcp:
    image: docker.elastic.co/observability/stream:v0.18.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    command: log --start-signal=SIGHUP --delay=5s --addr elastic-agent:9020 -p=tcp /sample_logs/alerts.log
  netskope-events-tcp:
    image: docker.elastic.co/observability/stream:v0.18.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    command: log --start-signal=SIGHUP --delay=5s --addr elastic-agent:9021 -p=tcp /sample_logs/events.log
