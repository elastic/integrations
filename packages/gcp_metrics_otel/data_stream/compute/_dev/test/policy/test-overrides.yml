# Overrides the integration defaults and exercises the receiver settings that
# are inherited from googlecloudmonitor_input_otel rather than redeclared here,
# proving they still reach the rendered agent policy.
data_stream:
  vars:
    project_id: "my-gcp-project"
    metrics_list:
      - "compute.googleapis.com/instance/cpu/utilization"
    metric_descriptor_filters:
      - 'metric.type = starts_with("compute.googleapis.com/instance/disk/")'
    collection_interval: "120s"
    initial_delay: "5s"
    timeout: "30s"
    endpoint: "monitoring.example-universe.com:443"
    universe_domain: "example-universe.com"
