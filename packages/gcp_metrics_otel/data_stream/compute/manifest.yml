title: "Google Cloud Compute Engine Metrics"
type: metrics
# Pins the dataset instead of inheriting the input package default. Without
# this, Fleet falls back to <package>.<data_stream> and documents land in
# metrics-gcp_metrics_otel.compute.otel-*.
dataset: gcp.compute
streams:
  - package: googlecloudmonitor_input_otel
    title: Google Cloud Compute Engine Metrics
    description: >
      Compute Engine hypervisor metrics from Cloud Monitoring: CPU, disk
      throughput and latency, network, firewall drops, memory balloon,
      uptime, interruptions, and managed instance group size.
    template_path: stream.yml.hbs
    vars:
      - name: project_id
        type: text
        title: GCP Project ID
        required: true
        description: The GCP project ID to query Compute Engine metrics from.
        show_user: true
      # Additions go through additional_metrics below, not through the
      # inherited metrics_list. Setting metrics_list makes the input package's
      # template emit a non-empty value, which replaces the default set from
      # agent/stream/stream.yml.hbs rather than adding to it, so keep it hidden.
      # The inherited metric_descriptor_filters renders into that same key and
      # has the same effect; it is already hidden by the input package.
      - name: metrics_list
        show_user: false
      - name: additional_metrics
        type: text
        title: Additional Metrics
        required: false
        multi: true
        description: >
          Extra Cloud Monitoring metric type names to collect in addition to the
          Compute Engine metrics collected by default, for example
          `compute.googleapis.com/guest/memory/percent_used`. Each entry must be
          an exact metric type name.
        show_user: true
      - name: collection_interval
        type: duration
        title: Collection Interval
        required: false
        description: >
          How often the receiver polls Cloud Monitoring. The receiver enforces
          a hard minimum of 60s. Compute Engine samples most hypervisor metrics
          every 60s, so lower values increase Cloud Monitoring API cost without
          adding resolution.
        default: 300s
        show_user: true
