      description: Coerce the stringified PE section numeric arrays to the ECS long type.
      source: |-
        def s = ctx.threat.indicator.file.pe.sections;
        for (def key : ['entropy', 'physical_size', 'virtual_size']) {
          if (s.get(key) instanceof List) {
            def lst = s.get(key);
            for (int i = 0; i < lst.size(); i++) {
              def v = lst.get(i);
              if (v != null) {
                try { lst.set(i, (long) Double.parseDouble(v.toString())); }
                catch (Exception e) {}
              }
            }
          }
        }
  - script:
      tag: snake_case_json_keys
      lang: painless
      description: >-
        Recursively convert gti.file_feed keys to snake_case: split acronym/camelCase
        boundaries, collapse and trim '_', and lowercase.
      if: ctx.gti?.file_feed instanceof Map
      source: |-
        String snake(String k) {
          // inflection.underscore, implemented char-by-char (no regex) to avoid painless
          // regex backtracking limits on long all-caps keys (e.g. BULK_SIGNALS).
          StringBuilder sb = new StringBuilder();
          int n = k.length();
          for (int i = 0; i < n; i++) {
            char c = k.charAt(i);
            if (i > 0 && Character.isUpperCase(c)) {
              char prev = k.charAt(i - 1);
              boolean prevLowerOrDigit = Character.isLowerCase(prev) || Character.isDigit(prev);
              boolean nextLower = (i + 1 < n) && Character.isLowerCase(k.charAt(i + 1));
              if (prevLowerOrDigit || (Character.isUpperCase(prev) && nextLower)) {
                sb.append((char) '_');
              }
            }
            sb.append(Character.toLowerCase(c));
          }
          String s = sb.toString();
          while (s.contains('__')) { s = s.replace('__', '_'); }
          while (s.startsWith('_')) { s = s.substring(1); }
          while (s.endsWith('_')) { s = s.substring(0, s.length() - 1); }
          return s;
        }
        void walk(def obj) {
          if (obj instanceof Map) {
            Map m = (Map) obj;
            Map renames = [:];
            for (def e : m.entrySet()) {
              walk(e.getValue());
              if (e.getKey() instanceof String) {
                String nk = snake((String) e.getKey());
                if (nk.length() > 0 && !nk.equals(e.getKey())) { renames[e.getKey()] = nk; }
              }
            }
            for (def r : renames.entrySet()) {
              m.put(r.getValue(), m.remove(r.getKey()));
            }
          } else if (obj instanceof List) {
            for (def item : (List) obj) { walk(item); }
          }
        }
        walk(ctx.gti.file_feed);
  - script:
      tag: remove_null_values
      lang: painless
      description: Remove null or empty values from the document
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
