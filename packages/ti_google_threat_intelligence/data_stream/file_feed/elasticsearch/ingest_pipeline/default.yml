---
description: Pipeline for processing file_feed logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 8.17.0
  - rename:
      field: message
      tag: rename_message_to_event_original
      if: ctx.event?.original == null
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message.
  - remove:
      field:
        - message
      tag: remove_message
      if: ctx.event?.original != null
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      field: event.original
      tag: json_event_original
      target_field: gti.file_feed
  - script:
      tag: sanitize_json_keys
      lang: painless
      description: >-
        Sanitize gti.file_feed keys (strip '#', '~' -> 'tilde', non [A-Za-z0-9_] runs -> '_'),
        recursively, so the generated processors resolve. Case preserved.
      if: ctx.gti?.file_feed instanceof Map
      source: |-
        String norm(String k) {
          String t = /#/.matcher(k).replaceAll('');
          t = /~/.matcher(t).replaceAll('tilde');
          return /[^A-Za-z0-9_]+/.matcher(t).replaceAll('_');
        }
        void walk(def obj) {
          if (obj instanceof Map) {
            Map m = (Map) obj;
            Map renames = [:];
            for (def e : m.entrySet()) {
              walk(e.getValue());
              if (e.getKey() instanceof String) {
                String nk = norm((String) e.getKey());
                if (!nk.equals(e.getKey())) { renames[e.getKey()] = nk; }
              }
            }
            for (def r : renames.entrySet()) {
              m.put(r.getValue(), m.remove(r.getKey()));
            }
          } else if (obj instanceof List) {
            for (def item : (List) obj) { walk(item); }
          }
        }
        walk(ctx.gti.file_feed);
  - script:
      tag: prune_relationship_navigation
      lang: painless
      description: Keep only `data` under each gti.file_feed.relationships.<x>.
      if: ctx.gti?.file_feed?.relationships instanceof Map
      source: |-
        for (def e : ctx.gti.file_feed.relationships.entrySet()) {
          if (e.getValue() instanceof Map) {
            ((Map) e.getValue()).keySet().removeIf(k -> !k.equals('data'));
          }
        }
  - script:
      tag: gti_file_feed_indicator_gating
      lang: painless
      description: >-
        Decide indicator promotion and storage drop from configurable thresholds injected by the
        integration settings (ctx._conf). Defaults follow the GTI team recommendations:
        verdict in indicator_verdicts (default VERDICT_MALICIOUS), or VERDICT_SUSPICIOUS with
        threat_score >= indicator_min_threat_score (default 70), or last_analysis_stats.malicious
        >= indicator_min_malicious_detections (default 5).
      source: |-
        def conf = ctx._conf instanceof Map ? ctx._conf : [:];
        def verdicts = conf.indicator_verdicts instanceof List && conf.indicator_verdicts.size() > 0 ? conf.indicator_verdicts : ['VERDICT_MALICIOUS'];
        def minScore = conf.indicator_min_threat_score != null ? conf.indicator_min_threat_score : 70;
        def minMal = conf.indicator_min_malicious_detections != null ? conf.indicator_min_malicious_detections : 5;
        def dropBelow = conf.drop_below_threshold != null ? conf.drop_below_threshold : true;
        def attrs = ctx.gti?.file_feed?.attributes;
        boolean ind = false;
        if (attrs != null) {
          def v = attrs.gti_assessment != null && attrs.gti_assessment.verdict != null ? attrs.gti_assessment.verdict.value : null;
          def score = attrs.gti_assessment != null && attrs.gti_assessment.threat_score != null ? attrs.gti_assessment.threat_score.value : null;
          def mal = attrs.last_analysis_stats != null ? attrs.last_analysis_stats.malicious : null;
          if (v != null && verdicts.contains(v)) { ind = true; }
          if (!ind && v == 'VERDICT_SUSPICIOUS' && score != null && score >= minScore) { ind = true; }
          if (!ind && mal != null && mal >= minMal) { ind = true; }
        }
        ctx._is_indicator = ind;
        boolean drop = false;
        if (!ind && dropBelow) { drop = true; }
        if (!drop && conf.type_tags_include instanceof List && conf.type_tags_include.size() > 0) {
          def tt = attrs != null ? attrs.type_tag : null;
          if (tt == null || !conf.type_tags_include.contains(tt)) { drop = true; }
        }
        if (!drop && conf.tags_exclude instanceof List && conf.tags_exclude.size() > 0 && attrs != null && attrs.tags instanceof List) {
          for (t in attrs.tags) { if (conf.tags_exclude.contains(t)) { drop = true; break; } }
        }
        ctx._should_drop = drop;
  - drop:
      tag: drop_filtered_file_feed_records
      if: ctx._should_drop == true
  # Event timestamp from last_modification_date (the sheet maps both @timestamp and
  # threat.indicator.modified_at in one cell, which the generator cannot split).
  - date:
      field: gti.file_feed.attributes.last_modification_date
      tag: set_@timestamp_from_last_modification_date
      target_field: '@timestamp'
      formats:
        - UNIX
        - ISO8601
      if: ctx.gti?.file_feed?.attributes?.last_modification_date != null && ctx.gti.file_feed.attributes.last_modification_date != ''
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  # related.hosts + related.ip from the IDS results. crowdsourced_ids_results is an ARRAY of rule
  # hits, and each hit's alert_context is itself an ARRAY of context objects (hostname/src_ip/
  # dest_ip/url). A mustache/dotted path cannot walk a list-of-lists, so collect in painless.
  - script:
      tag: enrich_related_from_crowdsourced_ids_results
      lang: painless
      if: ctx.gti?.file_feed?.attributes?.crowdsourced_ids_results instanceof List
      description: >-
        Collect alert_context hostnames into related.hosts and src/dest IPs into related.ip from the
        nested crowdsourced_ids_results[].alert_context[] arrays (deduplicated).
      source: |-
        def hosts = new ArrayList();
        def ips = new ArrayList();
        for (def hit : ctx.gti.file_feed.attributes.crowdsourced_ids_results) {
          if (!(hit instanceof Map)) { continue; }
          def acs = hit.get('alert_context');
          if (!(acs instanceof List)) { continue; }
          for (def ac : acs) {
            if (!(ac instanceof Map)) { continue; }
            def h = ac.get('hostname');
            if (h != null && !hosts.contains(h)) { hosts.add(h); }
            def dip = ac.get('dest_ip');
            if (dip != null && !ips.contains(dip)) { ips.add(dip); }
            def sip = ac.get('src_ip');
            if (sip != null && !ips.contains(sip)) { ips.add(sip); }
          }
        }
        if (!hosts.isEmpty()) {
          if (!(ctx.related instanceof Map)) { ctx.related = new HashMap(); }
          if (!(ctx.related.hosts instanceof List)) { ctx.related.hosts = new ArrayList(); }
          for (def h : hosts) { if (!ctx.related.hosts.contains(h)) { ctx.related.hosts.add(h); } }
        }
        if (!ips.isEmpty()) {
          if (!(ctx.related instanceof Map)) { ctx.related = new HashMap(); }
          if (!(ctx.related.ip instanceof List)) { ctx.related.ip = new ArrayList(); }
          for (def ip : ips) { if (!ctx.related.ip.contains(ip)) { ctx.related.ip.add(ip); } }
        }
  # Fingerprint uses the raw id BEFORE the generated duplicate-removal strips gti.file_feed.id.
  - fingerprint:
      fields:
        - gti.file_feed.id
        - gti.file_feed.attributes.last_modification_date
      tag: fingerprint_file_feed
      target_field: _id
      ignore_missing: true
  - set:
