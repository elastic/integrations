title: File Feed Events
type: logs
streams:
  - input: filestream
    enabled: false
    title: File Feed Events
    description: Collect Google Threat Intelligence File Feed events from files on disk with filestream.
    template_path: filestream.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        multi: true
        required: true
        show_user: true
        description: A list of glob-based paths that will be crawled and fetched. The File Feed is distributed as bzip2-compressed NDJSON; decompress each package to NDJSON on disk before pointing this input at it, for example `/path/to/file_feed/*.ndjson`.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - google_threat_intelligence-file_feed
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: indicator_verdicts
        type: text
        title: Indicator verdicts
        multi: true
        required: true
        show_user: true
        default:
          - VERDICT_MALICIOUS
        description: >-
          GTI assessment verdicts (`gti_assessment.verdict.value`) that promote a record to `threat.indicator.*` (`event.type: indicator`). Default `VERDICT_MALICIOUS` only, which keeps false-positive alert rates near zero. `VERDICT_SUSPICIOUS` files are additionally promoted on their own whenever their `gti_assessment.threat_score.value` meets the Minimum threat score below, independently of this list; add `VERDICT_SUSPICIOUS` here to promote every suspicious file regardless of threat score. `VERDICT_UNDETECTED`, `VERDICT_BENIGN`, and `VERDICT_KNOWN_GOOD` are never promoted by verdict.
      - name: indicator_min_threat_score
        type: integer
        title: Minimum threat score for suspicious promotion
        multi: false
        required: true
        show_user: false
        default: 70
        description: >-
          A `VERDICT_SUSPICIOUS` record is promoted to `threat.indicator.*` whenever `gti_assessment.threat_score.value` is greater than or equal to this value, independently of the Indicator verdicts list. (If `VERDICT_SUSPICIOUS` is also added to Indicator verdicts, suspicious records are promoted regardless of threat score.)
      - name: indicator_min_malicious_detections
        type: integer
        title: Minimum malicious detections (fallback)
        multi: false
        required: true
        show_user: true
        default: 5
        description: >-
          Fallback promotion when the verdict is absent or undetected: promote to `threat.indicator.*` if `last_analysis_stats.malicious` is greater than or equal to this value.
      - name: drop_below_threshold
        type: bool
        title: Drop records below the indicator threshold
        multi: false
        required: true
        show_user: true
        default: true
        description: >-
          Drop benign/undetected records that are not promoted to `threat.indicator.*`, keeping only actionable indicators. Disable to retain the full local reputation corpus under `gti.file_feed.*` (air-gapped / hunting deployments).
      - name: keep_engine_results
        type: bool
        title: Keep per-engine analysis results
        multi: false
        required: true
        show_user: false
        default: false
        description: >-
          Keep the per-engine `last_analysis_results` map. Disabled by default to cut storage; `last_analysis_stats` and `gti_assessment` are always retained.
      - name: type_tags_include
        type: text
        title: File type allowlist (type_tag)
        multi: true
        required: false
        show_user: false
        description: >-
          Optional allowlist of file types (`type_tag`, e.g. `peexe`, `pedll`, `elf`, `macho`, `apk`, `pdf`). When set, records whose `type_tag` is not in the list are dropped.
      - name: tags_exclude
        type: text
        title: Tags denylist
        multi: true
        required: false
        show_user: false
        description: >-
          Optional denylist of `tags` (e.g. `nsrl`, `trusted`, `known-distributor`). Records carrying any of these tags are dropped.
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
