data_stream:
  vars:
    paths:
      - /tmp/file_feed/*.ndjson
    indicator_verdicts:
      - VERDICT_MALICIOUS
      - VERDICT_SUSPICIOUS
    indicator_min_malicious_detections: 3
    type_tags_include:
      - peexe
    tags_exclude:
      - nsrl
    processors: "- add_fields:\n    target: event\n    fields:\n      policy_test: true"
