version: '2.3'
services:
  ti_google_threat_intelligence:
    image: docker.elastic.co/observability/stream:v0.18.0
    hostname: ti_google_threat_intelligence
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config.yml
  ti_google_threat_intelligence-filestream:
    image: alpine
    volumes:
      - ./sample_logs:/sample_logs:ro
      - ${SERVICE_LOGS_DIR}:/var/log
    command: >
      /bin/sh -c "
        cp /sample_logs/*.log /var/log/ &&
        tail -f /dev/null
      "
