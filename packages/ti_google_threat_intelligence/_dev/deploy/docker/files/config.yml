  # Rules for the ioc_stream test-badrequest-config.yml system test. They are
  # keyed to the `badreq` API token so the default ioc_stream test is not
  # affected. They simulate a window poisoned by an IOC that the upstream API
  # cannot serve (HTTP 400 on any request whose result would include it):
  #   1. Requests carrying a pagination cursor always fail with the 400.
  #   2. Cursor-less requests serve page 1 (with a next-page cursor) three
  #      times — each pagination attempt then fails, so the program's
  #      consecutive-failure counter reaches the skip threshold — followed by
  #      empty pages, which is the healthy terminal state the test asserts.
  #      The empty response is repeated to keep the mock from cycling back to
  #      page 1 within the test window.
  - path: /api/v3/ioc_stream
    methods: ["GET"]
    query_params:
      cursor: "{cursor:.*}"
      limit: 40
      filter: "{filter:.*}"
    request_headers:
      x-apikey: ["badreq"]
    responses:
      - status_code: 400
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {"error": {"code": "BadRequestError", "message": "Key name strings must be non-empty strings up to 500 bytes; received b'http://poisoned-ioc.example/very-long-recursive-path/very-long-recursive-path/very-long-recursive-path/'"}}
