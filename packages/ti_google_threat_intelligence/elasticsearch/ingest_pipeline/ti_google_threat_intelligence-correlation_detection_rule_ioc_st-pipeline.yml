---
description: Pipeline for processing detected IOC events from IOC stream of the user's environment.
processors:
  - script:
      lang: painless
      if: ctx.threat?.enrichments != null;
      tag: store_matched_indicator_from_alert_into_temp_fields_161bd399
      description: Store the first 'matched' and 'indicator' object from the alert, as it comes from Google Threat Intelligence API.
      source: >
        for (def obj : ctx.threat.enrichments) {
          if (obj.containsKey('matched') && obj.containsKey('indicator')) {
            ctx.temp_fields = obj;
            break;
          }
        }
      on_failure:
        - append:
            tag: append_error_message_49405303
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
# Retain event.dataset and event.module from the matched source index in temp_fields,
# as they originate from the source event's module and dataset in the alert
# and are essential for navigating to the corresponding document.
  - rename:
      field: event.dataset
      tag: keep_event_dataset_from_alert_c6c0ad3d
      target_field: temp_fields.dataset
      ignore_missing: true
  - rename:
      field: event.module
      tag: keep_event_module_from_alert_0b3ed9f0
      target_field: temp_fields.module
      ignore_missing: true
  - script:
      lang: painless
      tag: remove_unwanted_fields_cc8a8a78
      source: |-
        // Define the list of fields to retain
        def fieldsToKeep = ["@timestamp"];

        // Get a copy of the current document keys
        def keys = new ArrayList(ctx.keySet());

        // Iterate over the keys
        for (def key : keys) {
          // Keep if the key is in fieldsToKeep, starts with "temp_fields" or starts with "_"
          if (!fieldsToKeep.contains(key) && !key.startsWith("temp_fields") && !key.startsWith("_")) {
            ctx.remove(key);
          }
        }
      on_failure:
        - append:
            tag: append_error_message_d139d48f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
# Define hardcoded values required for processing.
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_event_category_4039b90d
      value: threat
  - append:
      field: event.type
      tag: append_event_type_d4da06cc
      value: indicator
  - set:
      field: observer.vendor
      tag: set_observer_vendor_60acb7ec
      value: Google
  - set:
      field: observer.product
      tag: set_observer_product_1b3fbbe2
      value: Threat Intelligence
  - set:
      field: data_stream.dataset
      tag: set_data_stream_dataset_3a5ada0f
      value: ti_google_threat_intelligence.enriched_ioc_stream
  - set:
      field: event.dataset
      tag: set_event_dataset_42398934
      value: ti_google_threat_intelligence.enriched_ioc_stream
# Extract relevant fields from temp_fields and map them to threat.indicator.
  - rename:
      field: temp_fields.indicator
      tag: rename_temp_fields_to_indicator_b2faae4a
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: temp_fields.matched.atomic
      tag: rename_temp_fields_to_matched_value_0aa2d8f2
      target_field: gti.threat.indicator.matched.value
      ignore_missing: true
  - rename:
      field: temp_fields.matched.field
      tag: rename_temp_fields_to_matched_field_da55f541
      target_field: gti.threat.indicator.matched.field
      ignore_missing: true
  - rename:
      field: temp_fields.dataset
      tag: rename_temp_fields_to_matched_field_13f3441a
      target_field: gti.threat.indicator.matched.dataset
      ignore_missing: true
  - rename:
      field: temp_fields.module
      tag: rename_temp_fields_to_matched_field_ff56a1a5
      target_field: gti.threat.indicator.matched.module
      ignore_missing: true
# Set threat.indicator ECS fields.
  - set:
      field: threat.indicator.url.original
      tag: set_threat_indicator_url_original_from_ransomware_attributes_url_921543be
      copy_from: gti.threat.indicator.attributes.url
      ignore_empty_value: true
  - set:
      field: threat.feed.name
      tag: set_threat_feed_name_bae87248
      copy_from: gti.threat.indicator.feed.name
      ignore_empty_value: true
  - set:
      field: threat.feed.dashboard_id
      tag: set_threat_feed_dashboard_id_6e03be1b
      copy_from: gti.threat.indicator.feed.dashboard_id
      ignore_empty_value: true
  - set:
      field: threat.indicator.url.full
      tag: set_threat_indicator_url_full_from_url_original_deea9c1c
      value: "{{{threat.indicator.url.original}}}"
      ignore_empty_value: true
  - uri_parts:
      field: threat.indicator.url.original
      tag: uri_parts_url_original_be2411f5
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_701601a5
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: threat.indicator.geo.country_iso_code
      tag: set_threat_indicator_geo_country_iso_code_from_threat_indicator_attributes_country_41b8d48b
      copy_from: gti.threat.indicator.attributes.country
      ignore_empty_value: true
  - set:
      field: threat.indicator.geo.continent_code
      tag: set_threat_indicator_geo_continent_code_from_threat_indicator_attributes_continent_2227d64d
      copy_from: gti.threat.indicator.attributes.continent
      ignore_empty_value: true
  - append:
      field: threat.indicator.id
      tag: append_data_id_12cd2e6f
      value: '{{{gti.threat.indicator.id}}}'
      allow_duplicates: false
      if: ctx.gti?.threat?.indicator?.id != null
  - append:
      field: related.hosts
      tag: append_data_id_domain_7caab074
      value: '{{{gti.threat.indicator.id}}}'
      allow_duplicates: false
      if: ctx.gti?.threat?.indicator?.type == 'domain'
  - set:
      field: threat.indicator.name
      tag: set_threat_indicator_name_from_id_72db95af
      copy_from: gti.threat.indicator.id
      ignore_empty_value: true
  - set:
      field: threat.indicator.type
      tag: set_threat_indicator_type_from_threat_indicator_attributes_type_f2bbeddb
      copy_from: gti.threat.indicator.type
      ignore_empty_value: true
  - set:
      field: threat.indicator.file.hash.sha256
      tag: set_threat_indicator_file_hash_sha256_from_threat_indicator_id_73663631
      copy_from: gti.threat.indicator.id
      if: ctx.gti?.threat?.indicator?.type == 'file'
      ignore_empty_value: true
  - set:
      field: threat.indicator.ip
      tag: set_threat_indicator_ip_from_threat_indicator_id_7734bc9a
      copy_from: gti.threat.indicator.id
      if: ctx.gti?.threat?.indicator?.type == 'ip_address'
      ignore_empty_value: true
  - set:
      field: threat.indicator.first_seen
      tag: set_threat_indicator_first_seen_from_first_seen_itw_date_d6b12d67
      copy_from: gti.threat.indicator.attributes.first_seen_itw_date
      if: ctx.gti?.threat?.indicator?.attributes?.first_seen_itw_date != null
      ignore_empty_value: true
  - script:
      description: Set threat indicator type from gti ioc stream type.
      if: ctx.gti?.threat?.indicator?.type != null
      tag: set_threat_indicator_type_from_gti_threat_indicator_type_20e0b1da
      lang: painless
      params:
        domain: domain-name
        file: file
        ip_address: ipv4-addr
        url: url
      source: |-
        ctx.threat = ctx.threat ?: [:];
        ctx.threat.indicator = ctx.threat.indicator ?: [:];
        ctx.threat.indicator.type = params[ctx.gti.threat.indicator.type];
      on_failure:
        - append:
            tag: append_error_message_bc71f01d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
# Create ECS-compliant mappings for threat.indicator fields.
  - append:
      field: related.hash
      tag: append_data_attributes_authentihash_89c0cc32
      value: '{{{gti.threat.indicator.attributes.authentihash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_favicon_dhash_81fd554e
      value: '{{{gti.threat.indicator.attributes.favicon.dhash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_favicon_raw_md5_cd82dc3b
      value: '{{{gti.threat.indicator.attributes.favicon.raw_md5}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_filecondis_dhash_65731034
      value: '{{{gti.threat.indicator.attributes.filecondis.dhash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_filecondis_raw_md5_4c537af3
      value: '{{{gti.threat.indicator.attributes.filecondis.raw_md5}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_last_http_response_content_sha256_3a6e145d
      value: '{{{gti.threat.indicator.attributes.last_http_response_content_sha256}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_last_https_certificate_thumbprint_1e08cda3
      value: '{{{gti.threat.indicator.attributes.last_https_certificate.thumbprint}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_id_cf85e7a9
      value: '{{{gti.threat.indicator.id}}}'
      allow_duplicates: false
      if: ctx.gti?.threat?.indicator?.type == 'url'
  - append:
      field: related.hash
      tag: append_data_attributes_last_https_certificate_thumbprint_sha256_28155f0c
      value: '{{{gti.threat.indicator.attributes.last_https_certificate.thumbprint_sha256}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_main_icon_dhash_8bfef828
      value: '{{{gti.threat.indicator.attributes.main_icon.dhash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_main_icon_raw_md5_b0679d3f
      value: '{{{gti.threat.indicator.attributes.main_icon.raw_md5}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_md5_4da1ff27
      value: '{{{gti.threat.indicator.attributes.md5}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_pe_info_imphash_0e8e2848
      value: '{{{gti.threat.indicator.attributes.pe_info.imphash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_pe_info_rich_pe_header_hash_34bb952b
      value: '{{{gti.threat.indicator.attributes.pe_info.rich_pe_header_hash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_sha1_7bd16720
      value: '{{{gti.threat.indicator.attributes.sha1}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_sha256_3549caaa
      value: '{{{gti.threat.indicator.attributes.sha256}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_ssdeep_ea279997
      value: '{{{gti.threat.indicator.attributes.ssdeep}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_attributes_tlsh_b1eefd72
      value: '{{{gti.threat.indicator.attributes.tlsh}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_data_vhash_9afd1185
      value: '{{{gti.threat.indicator.vhash}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_attributes_jarm_3b31748e
      value: '{{{gti.threat.indicator.attributes.jarm}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_file_hash_md5_into_related_hash_74c87bb6
      value: '{{{gti.threat.indicator.file.hash.md5}}}'
      allow_duplicates: false
  - append:
      field: related.hash
      tag: append_file_hash_sha256_65575294
      value: '{{{threat.indicator.file.hash.sha256}}}'
      allow_duplicates: false
  - append:
      field: related.ip
      tag: append_ip_into_related_ip_d5be7f09
      value: '{{{gti.threat.indicator.ip}}}'
      allow_duplicates: false
  - set:
      field: file.mime_type
      tag: set_file_mime_type_from_threat_indicator_attributes_exiftool_mime_type_85383af9
      copy_from: gti.threat.indicator.attributes.exiftool.mime.type
      ignore_empty_value: true
  - set:
      field: file.mtime
      tag: set_file_mtime_from_threat_indicator_attributes_exiftool_timestamp_7f8bdd32
      copy_from: gti.threat.indicator.attributes.exiftool.timestamp
      ignore_empty_value: true
  - set:
      field: file.hash.md5
      tag: set_file_hash_md5_from_threat_indicator_attributes_md5_8a73f012
      copy_from: gti.threat.indicator.attributes.md5
      ignore_empty_value: true
  - set:
      field: file.name
      tag: set_file_name_from_threat_indicator_attributes_meaningful_name_4908580a
      copy_from: gti.threat.indicator.attributes.meaningful_name
      ignore_empty_value: true
  - foreach:
      tag: foreach_gti_threat_indicator_attributes_names_07252a21
      field: gti.threat.indicator.attributes.names
      if: ctx.gti?.threat?.indicator?.attributes?.names instanceof List
      processor:
        append:
          field: file.attributes
          tag: append_attributes_names_into_file_attributes_f0bfcf36
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - set:
      field: file.hash.sha1
      tag: set_file_hash_sha1_from_threat_indicator_attributes_sha1_175ca00d
      copy_from: gti.threat.indicator.attributes.sha1
      ignore_empty_value: true
  - set:
      field: file.hash.sha256
      tag: set_file_hash_sha256_from_threat_indicator_attributes_sha256_ea836e7d
      copy_from: gti.threat.indicator.attributes.sha256
      ignore_empty_value: true
  - set:
      field: file.type
      tag: set_file_type_from_threat_indicator_attributes_type_description_9502e043
      copy_from: gti.threat.indicator.attributes.type_description
      ignore_empty_value: true
  - set:
      field: file.extension
      tag: set_file_extension_from_threat_indicator_attributes_type_extension_16944f02
      copy_from: gti.threat.indicator.attributes.type_extension
      ignore_empty_value: true
  - set:
      field: event.created
      tag: set_gti_enriched_ioc_event_created_6c825e1b
      copy_from: gti.threat.indicator.created
      ignore_empty_value: true
  - set:
      field: http.response.status_code
      tag: set_http_response_status_code_76d019e1
      copy_from: gti.threat.indicator.http_response_code
      ignore_empty_value: true
  - set:
      field: event.ingested
      tag: set_event_ingested_as_timestamp_6108544a
      copy_from: '@timestamp'
      ignore_empty_value: true
  - remove:
      field: temp_fields
      tag: remove_temp_fields_82ce2669
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
