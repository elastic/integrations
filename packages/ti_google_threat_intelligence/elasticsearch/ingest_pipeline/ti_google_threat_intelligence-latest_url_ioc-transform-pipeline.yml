  - rename:
      field: gti.mobile
      tag: rename_gti_mobile_d224b3ed
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.osx
      tag: rename_gti_osx_1b36d925
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.phishing
      tag: rename_gti_phishing_92af2626
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.ransomware
      tag: rename_gti_ransomware_c2fd1c5d
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.threat_actor
      tag: rename_gti_threat_actor_42b9f0c5
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.trending
