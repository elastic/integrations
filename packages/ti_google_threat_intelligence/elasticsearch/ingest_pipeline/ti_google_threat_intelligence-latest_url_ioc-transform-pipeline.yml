      tag: rename_gti_first_stage_delivery_vectors_1a8fc7bc
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.infostealer
      tag: rename_gti_infostealer_59443ae4
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.iot
      tag: rename_gti_iot_fd8e8d60
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
