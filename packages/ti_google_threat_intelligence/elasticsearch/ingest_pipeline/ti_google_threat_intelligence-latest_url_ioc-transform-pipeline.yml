      tag: rename_gti_linux_c6509583
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.malicious_network_infrastructure
      tag: rename_gti_malicious_network_infrastructure_2d0a35ed
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.malware
      tag: rename_gti_malware_f21d21b8
      target_field: gti.threat.indicator
