---
description: Pipeline for processing File IOC events from Google Threat Intelligence Threat Feed events.
processors:
  # --- File Feed normalization (filestream source, stores reports under gti.file_feed) ---
  # Other feeds store their report under gti.<feed> and are renamed to gti.threat.indicator below.
  # File Feed is shaped differently, so normalize it before the rename:
  #  1. Flatten the gti_assessment verdict/severity/threat_score objects to their `.value` scalars so
  #     they match the keyword/long types the destination maps for gti.threat.indicator.attributes.*
  #     (renaming the objects as-is would cause an object-vs-keyword conflict and reject the document).
  #  2. Drop the unbounded/flattened report subtrees (per-engine results, exiftool, sandbox verdicts,
  #     language-specific analysis) and the relationship graph-navigation subtree so they do not expand
  #     the shared destination's dynamic mapping toward the 3000-field limit and stall updates for every
  #     other feed. The relationships data stays on the raw file_feed source docs; the latest-IOC
  #     enrichment index only needs the indicator fields the detection rules match on.
  - set:
      field: gti.file_feed.attributes.gti_assessment.verdict
      tag: flatten_file_feed_gti_assessment_verdict
      copy_from: gti.file_feed.attributes.gti_assessment.verdict.value
      ignore_empty_value: true
      if: ctx.gti?.file_feed?.attributes?.gti_assessment?.verdict instanceof Map
  - set:
      field: gti.file_feed.attributes.gti_assessment.severity
      tag: flatten_file_feed_gti_assessment_severity
      copy_from: gti.file_feed.attributes.gti_assessment.severity.value
      ignore_empty_value: true
      if: ctx.gti?.file_feed?.attributes?.gti_assessment?.severity instanceof Map
  - set:
      field: gti.file_feed.attributes.gti_assessment.threat_score
      tag: flatten_file_feed_gti_assessment_threat_score
      copy_from: gti.file_feed.attributes.gti_assessment.threat_score.value
      ignore_empty_value: true
      if: ctx.gti?.file_feed?.attributes?.gti_assessment?.threat_score instanceof Map
  - remove:
      field:
        # File-report attributes that are not part of the shared gti.threat.indicator schema the
        # other source feeds contribute. The full report stays on the raw file_feed source docs;
        # the shared latest-IOC enrichment index keeps only the common indicator fields (hashes,
        # gti_assessment, last_analysis_stats, names, size, context_attributes.threat_list_id, ...).
        - gti.file_feed.attributes.androguard
        - gti.file_feed.attributes.authentihash
        - gti.file_feed.attributes.available_tools
        - gti.file_feed.attributes.bundle_info
        - gti.file_feed.attributes.contenthash
        - gti.file_feed.attributes.crowdsourced_ai_results
        - gti.file_feed.attributes.crowdsourced_ids_results
        - gti.file_feed.attributes.crowdsourced_ids_stats
        - gti.file_feed.attributes.crowdsourced_yara_results
        - gti.file_feed.attributes.detectiteasy
        - gti.file_feed.attributes.dot_net_assembly
        - gti.file_feed.attributes.dot_net_guids
        - gti.file_feed.attributes.downloadable
        - gti.file_feed.attributes.exiftool
        - gti.file_feed.attributes.filecondis
        - gti.file_feed.attributes.gti_assessment.contributing_factors.associated_malware_configuration
        - gti.file_feed.attributes.gti_assessment.contributing_factors.gavs_detections
        - gti.file_feed.attributes.gti_assessment.contributing_factors.malicious_sandbox_verdict
        - gti.file_feed.attributes.gti_assessment.contributing_factors.matched_malicious_yara
        - gti.file_feed.attributes.gti_assessment.contributing_factors.normalised_categories
        - gti.file_feed.attributes.gti_assessment.gti_description_cards
        - gti.file_feed.attributes.html_info
        - gti.file_feed.attributes.javascript_info
        - gti.file_feed.attributes.last_analysis_results
        - gti.file_feed.attributes.magic
        - gti.file_feed.attributes.magika
        - gti.file_feed.attributes.main_icon
        - gti.file_feed.attributes.malware_config
        - gti.file_feed.attributes.packers
        - gti.file_feed.attributes.pdf_info
        - gti.file_feed.attributes.pe_info
        - gti.file_feed.attributes.picklescan
        - gti.file_feed.attributes.popular_threat_classification
        - gti.file_feed.attributes.reputation
        - gti.file_feed.attributes.sandbox_verdicts
        - gti.file_feed.attributes.sigma_analysis_results
        - gti.file_feed.attributes.sigma_analysis_stats
        - gti.file_feed.attributes.sigma_analysis_summary
        - gti.file_feed.attributes.signature_info
        - gti.file_feed.attributes.threat_severity
        - gti.file_feed.attributes.total_votes
        - gti.file_feed.attributes.trid
        - gti.file_feed.attributes.type_description
        - gti.file_feed.attributes.type_tag
        - gti.file_feed.attributes.unique_sources
        - gti.file_feed.attributes.vba_info
        - gti.file_feed.context_attributes.download_url
        - gti.file_feed.context_attributes.submitter
        - gti.file_feed.relationships
      tag: remove_file_feed_unbounded_report_objects
      ignore_missing: true
  - rename:
      field: gti.file_feed
      tag: rename_gti_file_feed
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.cryptominer
      tag: rename_gti_cryptominer_6bf86828
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.first_stage_delivery_vectors
      tag: rename_gti_first_stage_delivery_vectors_1a8fc7bc
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.infostealer
      tag: rename_gti_infostealer_59443ae4
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.iot
      tag: rename_gti_iot_fd8e8d60
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.linux
      tag: rename_gti_linux_c6509583
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.malicious_network_infrastructure
      tag: rename_gti_malicious_network_infrastructure_2d0a35ed
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.malware
      tag: rename_gti_malware_f21d21b8
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.mobile
      tag: rename_gti_mobile_d224b3ed
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.osx
      tag: rename_gti_osx_1b36d925
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.phishing
      tag: rename_gti_phishing_92af2626
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.ransomware
      tag: rename_gti_ransomware_c2fd1c5d
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.threat_actor
      tag: rename_gti_threat_actor_42b9f0c5
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.trending
      tag: rename_gti_trending_15988b20
      target_field: gti.threat.indicator
      ignore_missing: true
  - rename:
      field: gti.vulnerability_weaponization
      tag: rename_gti_vulnerability_weaponization_7e1a6399
      target_field: gti.threat.indicator
      ignore_missing: true
  - set:
      field: gti.threat.indicator.feed.name
      tag: set_threat_indicator_type_from_threat_indicator_feed_name_2e78597a
      copy_from: threat.feed.name
      ignore_empty_value: true
  - set:
      field: gti.threat.indicator.feed.dashboard_id
      tag: set_threat_indicator_dashboard_id_from_threat_indicator_dashboard_id_d4fc147a
      copy_from: threat.feed.dashboard_id
      ignore_empty_value: true
  - set:
      field: data_stream.dataset
      tag: set_data_stream_dataset_515af0bd
      value: ti_google_threat_intelligence.file_ioc
  - set:
      field: event.dataset
      tag: set_event_dataset_a0da3bcd
      value: ti_google_threat_intelligence.file_ioc
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
