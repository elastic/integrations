format_version: "3.6.2"
name: supabase_otel
title: "Supabase OpenTelemetry Assets"
version: 0.2.0
description: >-
  Visualizing Supabase metrics and logs collected via OpenTelemetry. Covers infrastructure, PostgreSQL, Supavisor, application service metrics, and service log streams.
type: content
categories:
  - observability
  - monitoring
  - cloud
  - opentelemetry
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: basic
screenshots:
  - src: /img/node_infrastructure_1.png
    title: Node & Infrastructure
    size: 600x600
    type: image/png
  - src: /img/node_infra_2.png
    title: Node & Infrastructure - Disk I/O & Filesystem
    size: 600x600
    type: image/png
  - src: /img/databases_postgresql.png
    title: Databases & PostgreSQL
    size: 600x600
    type: image/png
  - src: /img/databases_postgresql_1.png
    title: Databases & PostgreSQL - PgBouncer & Replication
    size: 600x600
    type: image/png
  - src: /img/services_api.png
    title: Services & API
    size: 600x600
    type: image/png
  - src: /img/logs_overview.png
    title: Service logs overview
    size: 3600x14370
    type: image/png
icons:
  - src: /img/supabase-logo.svg
    title: Supabase logo
    size: 256x256
    type: image/svg+xml
discovery:
  datasets:
    - name: supabase.metrics.otel
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
