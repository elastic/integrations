format_version: "3.6.5"
name: projectdiscovery
title: ProjectDiscovery Cloud Platform
version: "0.1.0"
source:
  license: "Elastic-2.0"
description: Collect vulnerability findings and asset inventory from ProjectDiscovery Cloud Platform with Elastic Agent.
type: integration
categories:
  - security
  - vulnerability_management
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/sample-logo.svg
    title: ProjectDiscovery logo
    size: 32x32
    type: image/svg+xml
screenshots:
  - src: /img/projectdiscovery-vulnerabilities.png
    title: ProjectDiscovery vulnerabilities dashboard
    size: 1800x2960
    type: image/png
  - src: /img/projectdiscovery-assets.png
    title: ProjectDiscovery assets dashboard
    size: 1800x4020
    type: image/png
policy_templates:
  - name: projectdiscovery
    title: ProjectDiscovery Cloud Platform
    description: Collect vulnerability findings and assets from the ProjectDiscovery Cloud Platform API.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: cel
        title: Collect data from the ProjectDiscovery Cloud Platform API
        description: Collect vulnerability findings and assets from the ProjectDiscovery Cloud Platform API.
        vars:
          - name: url
            type: url
            title: API URL
            description: Base URL of the ProjectDiscovery Cloud Platform API.
            multi: false
            required: true
            show_user: true
            default: https://api.projectdiscovery.io
          - name: api_key
            type: password
            title: API Key
            description: ProjectDiscovery Cloud Platform API key, sent in the `X-API-Key` header. Found under **Settings → API Key** in the ProjectDiscovery Cloud Platform UI.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: team_id
            type: text
            title: Team ID
            description: ProjectDiscovery team ID, sent in the `X-Team-Id` header. Found under **Settings → Team**. Without it, the API returns the API key owner's personal workspace instead of the team's data.
            multi: false
            required: false
            show_user: true
          - name: http_client_timeout
            type: text
            title: HTTP Client Timeout
            description: Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h.
            multi: false
            required: true
            show_user: false
            default: 60s
          - name: proxy_url
            type: text
            title: Proxy URL
            description: URL to proxy connections in the form of http[s]://<user>:<password>@<server name/ip>:<port>. Please ensure your username and password are in URL encoded format.
            multi: false
            required: false
            show_user: false
          - name: ssl
            type: yaml
            title: SSL Configuration
            description: SSL configuration options. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html#ssl-common-config) for details.
            multi: false
            required: false
            show_user: false
            default: |
