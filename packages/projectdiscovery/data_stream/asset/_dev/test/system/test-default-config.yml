wait_for_data_timeout: 1m
input: cel
service: projectdiscovery-asset
vars:
  url: http://{{Hostname}}:{{Port}}
  api_key: test-api-key
  team_id: test-team-id
data_stream:
  vars:
    interval: 2s
    initial_interval: 87600h
    batch_size: 2
    preserve_original_event: true
    enable_request_tracer: true
assert:
  hit_count: 8
