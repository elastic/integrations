# Mock of the ProjectDiscovery Cloud Platform asset inventory API (GET /v1/asset/enumerate/contents).
#
# All page rules are matched on X-API-Key/X-Team-Id and on the full query string the CEL
# program sends (limit=2 from the system test batch_size, offset and sort_desc=updated_at).
# The API has no server-side updated_at filter: round 1 and round 2 send identical requests,
# so responses are selected with the per-rule request counter (.req_num).
# The envelope paging metadata is always 0 in the real API and is mirrored here.
#
# Round 1 (initial run, boundary = now - initial_interval):
#   offset=0 -> A (https, TLS, technologies), B (DNS-only, port -1; same updated_at as A)
#   offset=2 -> C (https 404, self-signed certificate), D (http port 80, redirect)
#   offset=4 -> E (port-only service; short page, terminates the pass; cursor = A.updated_at)  => 5 events
# Round 2 (cursor = 2026-04-10T10:00:00.123456Z):
#   offset=0 -> F (new), A (== cursor, inclusive boundary)
#   offset=2 -> B (== cursor), C (< cursor, dropped; terminates the pass)                       => 3 events
# Round 3+ (cursor = 2026-04-11T09:15:30.654321Z):
#   offset=0 -> A (< cursor, dropped; short page)                                                => 0 events
# Regression guard: offset=2 after round 2, offset=4 after round 1 and any request with
# unexpected query parameters return a synthetic asset newer than every cursor, so a lost
# cursor or a malformed request inflates the hit count (expected 8).
#
# Error and robustness rules (selected by X-API-Key) are used for CEL error-path testing only.
rules:
  # Credential check used by the research test-api.py script.
  - path: /v1/user
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^test-api-key$'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"email":"alice.johnson@example.com","name":"Alice Johnson"}
  # 401: invalid API key.
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^unauthorized-key$'
    responses:
      - status_code: 401
        headers:
          Content-Type:
            - application/json
        body: |-
          {"message":"User is not authorized to perform this action"}
  # 400: invalid request.
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^bad-request-key$'
    responses:
      - status_code: 400
        headers:
          Content-Type:
            - application/json
        body: |-
          {"code":"invalid_request","error":"invalid sort column specified","error_id":"2ExampleErrorId0000000000003","kind":"invalid request error","message":"invalid sort column specified","param":"","status":400}
  # 429: rate limit exceeded (body shape unverified).
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^rate-limited-key$'
    responses:
      - status_code: 429
        headers:
          Content-Type:
            - application/json
          Retry-After:
            - "2"
          X-Ratelimit-Limit:
            - "30"
          X-Ratelimit-Remaining:
            - "0"
          X-Ratelimit-Reset:
            - "1775815260"
        body: |-
          {"message":"rate limit exceeded"}
  # 500: internal server error.
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^server-error-key$'
    responses:
      - status_code: 500
        headers:
          Content-Type:
            - application/json
        body: |-
          {"error_id":"2ExampleErrorId0000000000004","message":"An internal server error occurred. Please try again later.","status":500}
  # 200 with a non-JSON body (for example an HTML error page from a proxy).
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^non-json-key$'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - text/html
        body: |-
          <html><head><title>502 Bad Gateway</title></head><body>bad gateway</body></html>
  # 200 with a null data array (treated as an empty page).
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^null-data-key$'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"current_page":0,"data":null,"message":"enumeration retrieved successfully","result_count":0,"total_pages":0,"total_results":0}
  # 200 without a data key (treated as an empty page).
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^missing-data-key$'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"current_page":0,"message":"enumeration retrieved successfully","result_count":0,"total_pages":0,"total_results":0}
  # 200 with an empty data array (end of the population on an exact page boundary).
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
        - '^empty-data-key$'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: |-
          {"current_page":0,"data":[],"message":"enumeration retrieved successfully","result_count":0,"total_pages":0,"total_results":0}
  # 200 with records missing or carrying an unparseable updated_at.
  - path: /v1/asset/enumerate/contents
    methods: [GET]
    request_headers:
      X-API-Key:
