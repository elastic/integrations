# Use of "*" to use all namespaces defined.
source:
  index:
    - "logs-projectdiscovery.vulnerability-*"
  query:
    bool:
      must:
        - range:
            "@timestamp":
              gte: "now-90d"
      must_not:
        - exists:
            field: error.message
        - term:
            event.kind: pipeline_error
        # Resolved or dismissed findings are not kept in the latest index.
        - terms:
            projectdiscovery.vulnerability.vuln_status:
              - fixed
              - false_positive
              - duplicate
              - accepted_risk
        - terms:
            _tier:
              - data_frozen
              - data_cold
# The version suffix on the dest.index should be incremented if a breaking
# change is made to the index mapping or settings (for example index.mode).
# You must also bump the fleet_transform_version for any change to this
# transform configuration to take effect.
dest:
  index: "security_solution-projectdiscovery.vulnerability_latest-v1"
  aliases:
    - alias: "security_solution-projectdiscovery.vulnerability_latest"
      move_on_creation: true
latest:
  unique_key:
    - event.id
    - data_stream.namespace
  sort: "@timestamp"
description: >-
  Latest ProjectDiscovery vulnerability findings. As findings are rescanned or triaged, this transform keeps only the latest state of each finding in a lookup index. Fixed, false positive, duplicate and accepted risk findings are excluded.
frequency: 5m
settings:
  # This is required to prevent the transform from clobbering the Fleet-managed mappings.
  deduce_mappings: false
  unattended: true
sync:
  time:
    field: "event.ingested"
    # Updated to 120s because of refresh delay in Serverless. With default 60s,
    # sometimes transform wouldn't process all documents.
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 90d
_meta:
  managed: true
  # Bump this version to delete, reinstall, and restart the transform during
  # package installation.
  fleet_transform_version: 0.1.0
  run_as_kibana_system: false
