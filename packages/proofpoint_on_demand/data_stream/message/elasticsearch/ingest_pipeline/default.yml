---
description: Pipeline for processing message logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.guid
        - json.ts
        - json.msg.header.message-id
      tag: fingerprint_message_ffa16c5b
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_event_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_email_into_event_category_0a688284
      value: email
  - append:
      field: event.type
      tag: append_info_into_event_type_5eab37e6
      value: info
  - set:
      field: observer.vendor
      tag: set_observer_vendor_cfe16424
      value: Proofpoint
  - set:
      field: observer.product
      tag: set_observer_product_31cc2997
      value: Proofpoint On Demand
  - set:
      field: observer.type
      tag: set_observer_type_414de4ad
      value: mail-gateway
  - rename:
      field: json.action_dkimv
      tag: rename_action_dkimv_46a1ea40
      target_field: proofpoint_on_demand.message.action_dkimv
      ignore_missing: true
  - rename:
      field: json.action_dmarc
      tag: rename_action_dmarc_5f8670f5
      target_field: proofpoint_on_demand.message.action_dmarc
