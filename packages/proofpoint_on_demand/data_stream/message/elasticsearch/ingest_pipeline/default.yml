      source: |-
        boolean drop(Object o) {
          if (o == null || o == '' || o == '**' || o == '0' || (o instanceof String && ((String) o).trim() == '')) {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).entrySet().removeIf(e -> e.getKey().trim() == '' || drop(e.getValue()));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
