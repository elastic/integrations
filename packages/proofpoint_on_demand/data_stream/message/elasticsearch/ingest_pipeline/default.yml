      target_field: json.connection.helo_ip
      type: ip
      if: ctx.json?.connection?.ip != ''
      ignore_failure: true
  - rename:
      field: json.connection.helo
      tag: rename_connection_helo_c47faaec
      target_field: proofpoint_on_demand.message.connection.helo
