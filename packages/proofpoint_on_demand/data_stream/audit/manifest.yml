title: Proofpoint On Demand Audit logs
type: logs
streams:
  - input: websocket
    title: Proofpoint On Demand Audit logs
    description: Collecting Proofpoint On Demand Audit logs via Websocket.
    template_path: websocket.yml.hbs
    vars:
      - name: keep_alive
        type: bool
        title: Keep Alive
        description: If enabled the agent will send a keep alive message to the websocket endpoint depending on the configured "Keep Alive Interval" value.
        multi: false
        required: false
        show_user: false
        default: false
      - name: keep_alive_interval
        type: text
        title: Keep Alive Interval
        description: >-
          Time between websocket keep-alive pings. Must be shorter than three
          times the Write Control Deadline to avoid a client-side read timeout.
          For the default 10s deadline, use an interval below 30s.
        multi: false
        required: false
        show_user: false
        default: 10s
      - name: write_control_deadline
        type: text
        title: Write Control Deadline
        description: >-
          Deadline for websocket control frame writes. The input derives its
          read deadline as three times this value; increase it when using a
          longer Keep Alive Interval. Duration examples are 10s and 1m.
        multi: false
        required: false
        show_user: false
        default: 10s
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: preserve_duplicate_custom_fields
        required: true
        show_user: false
        title: Preserve duplicate custom fields
        description: Preserve proofpoint_on_demand.audit fields that were copied to Elastic Common Schema (ECS) fields.
        type: bool
        multi: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - proofpoint_on_demand-audit
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
