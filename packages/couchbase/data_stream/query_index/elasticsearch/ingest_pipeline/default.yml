    ignore_failure: true
- script:
    tag: script_4e15c80d
    description: Drops null/empty values recursively.
    lang: painless
    source: |
      boolean drop(Object o) {
        if (o == null || o == "") {
          return true;
        } else if (o instanceof Map) {
          ((Map) o).values().removeIf(v -> drop(v));
          return (((Map) o).size() == 0);
        } else if (o instanceof List) {
          ((List) o).removeIf(v -> drop(v));
          return (((List) o).length == 0);
        }
        return false;
      }
      drop(ctx);
- remove:
    tag: remove_http_7626ec9a
    field:
    - http
    ignore_missing: true
    ignore_failure: true
on_failure:
  - set:
      tag: set_event_kind_0420f0e1
      field: event.kind
