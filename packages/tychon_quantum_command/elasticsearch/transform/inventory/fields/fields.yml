- name: omb
  type: group
  fields:
    - name: kex_primary
      type: keyword
    - name: kex_primary_quantum_safe
      type: boolean
    - name: kex_secondary
      type: keyword
    - name: kex_tier
      type: keyword
    - name: protocol_tier
      type: keyword
    - name: sig_tier
      type: keyword
- name: quantum_ready
  type: boolean
- name: quantum_ready_cert
  type: boolean
- name: quantum_ready_cipher
  type: boolean
- name: quantum_ready_kx
  type: boolean
- name: tls
  type: group
  fields:
    - name: duration_ms
      type: long
    - name: insecure_cipher_count
      type: long
    - name: insecure_ciphers
      type: keyword
    - name: preferred_cipher
      type: keyword
    - name: preferred_key_exchange
      type: keyword
    - name: preferred_protocol
      type: keyword
    - name: supported_key_exchange_count
      type: long
    - name: supported_key_exchanges
      type: keyword
    - name: supported_protocol_count
      type: long
    - name: supported_protocols
      type: keyword
    - name: total_probes
      type: long
- name: x509
  type: group
  fields:
    - name: issuer_cn
      type: keyword
    - name: key_bits
      type: long
    - name: key_type
      type: keyword
    - name: key_usage
      type: keyword
    - name: not_after
      type: date
    - name: not_before
      type: date
    - name: serial_number
      type: keyword
    - name: sha256_fingerprint
      type: keyword
    - name: sig_algorithm
      type: keyword
    - name: subject_cn
      type: keyword
