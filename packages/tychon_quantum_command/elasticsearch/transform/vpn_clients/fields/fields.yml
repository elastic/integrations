- name: security
  type: group
  fields:
    - name: pqc_support
      type: boolean
    - name: pqc_vulnerable
      type: boolean
    - name: risk_level
      type: keyword
    - name: score
      type: long
    - name: security_score
      type: long
    - name: vulnerable
      type: boolean
    - name: weak_crypto
      type: boolean
- name: vpn_client
  type: group
  fields:
    - name: active
      type: boolean
    - name: config_path
      type: keyword
    - name: detection_confidence
      type: keyword
    - name: detection_method
      type: keyword
    - name: executable_path
      type: keyword
    - name: first_detected
      type: date
    - name: install_path
      type: keyword
    - name: last_seen
      type: date
    - name: name
      type: keyword
    - name: service_name
      type: keyword
    - name: status
      type: keyword
    - name: vendor
      type: keyword
    - name: version
      type: keyword
- name: vpn_config
  type: group
  fields:
    - name: auto_reconnect
      type: boolean
    - name: config_encrypted
      type: boolean
    - name: dns_leak_protection
      type: boolean
    - name: ipv6_leak_protection
      type: boolean
    - name: kill_switch
      type: boolean
    - name: logging_enabled
      type: boolean
    - name: split_tunneling
      type: boolean
