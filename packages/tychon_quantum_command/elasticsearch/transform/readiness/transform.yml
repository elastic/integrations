source:
  index: logs-tychon_quantum_command.tychon_pqc-*
  query:
    bool:
      filter:
        - term:
            "tychon.index": "system-readiness"
      must_not:
        - exists:
            field: error.message
        - terms:
            _tier:
              - data_frozen
              - data_cold
dest:
  index: tychon-pqc-system-readiness
latest:
  unique_key:
    - observer.id
    - tychon.record.id
  sort: "@timestamp"
sync:
  time:
    field: event.ingested
    delay: "60s"
frequency: "5m"
retention_policy:
  time:
    field: "@timestamp"
    max_age: "365d"
settings:
  unattended: true
  deduce_mappings: false
_meta:
  fleet_transform_version: 1.0.5
  run_as_kibana_system: false
  managed: true
