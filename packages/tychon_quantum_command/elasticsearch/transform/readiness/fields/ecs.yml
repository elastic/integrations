- name: '@timestamp'
  description: Timestamp when the readiness event occurred.
  type: date
- name: data_stream.dataset
  description: Data stream dataset of the source event.
  type: constant_keyword
- name: data_stream.namespace
  description: Data stream namespace of the source event.
  type: constant_keyword
- name: data_stream.type
  description: Data stream type of the source event.
  type: constant_keyword
- name: ecs.version
  description: ECS version of the transformed event.
  type: keyword
- name: event.action
  description: Action captured for the readiness event.
  type: keyword
- name: event.category
  description: Event category for the readiness event.
  type: keyword
- name: event.dataset
  description: Event dataset of the source readiness record.
  type: keyword
- name: event.ingested
  description: Timestamp when the event was ingested into Elasticsearch.
  type: date
- name: event.kind
  description: Event kind for the readiness record.
  type: keyword
- name: error.message
  description: Error message captured during readiness collection or processing.
  type: match_only_text
- name: observer
  type: group
  fields:
    - name: bigfix_client_installed
      description: Indicates whether a BigFix client is installed on the observer host.
      type: boolean
    - name: bios_serial_number
      description: BIOS serial number reported by the observer host.
      type: keyword
    - name: cpu_cores
      description: Number of physical CPU cores reported by the observer host.
      type: long
    - name: cpu_logical_cores
      description: Number of logical CPU cores reported by the observer host.
      type: long
    - name: cpu_model_name
      description: CPU model name reported by the observer host.
      type: keyword
    - name: cpu_vendor_id
      description: CPU vendor identifier reported by the observer host.
      type: keyword
    - name: current_user
      description: Current user context used by the observer when scanning.
      type: keyword
    - name: domain
      description: Domain associated with the observer host.
      type: keyword
    - name: fips_mode_enabled
      description: Indicates whether FIPS mode is enabled on the observer host.
      type: boolean
    - name: hostname
      description: Hostname of the observer host.
      type: keyword
    - name: id
      description: Unique observer identifier.
      type: keyword
    - name: ip_addresses
      description: IP addresses reported by the observer host.
      type: keyword
    - name: is_vdi_environment
      description: Indicates whether the observer is running in a VDI environment.
      type: boolean
    - name: kernel_arch
      description: Kernel architecture reported by the observer host.
      type: keyword
    - name: kernel_version
      description: Kernel version reported by the observer host.
      type: keyword
    - name: machine_serial_number
      description: Machine serial number reported by the observer host.
      type: keyword
    - name: organization
      description: Organization associated with the observer host.
      type: keyword
    - name: platform_version
      description: Platform-specific version string reported by the observer host.
      type: keyword
    - name: ram_used_percent
      description: Percent of RAM in use on the observer host.
      type: float
    - name: software_version
      description: Tychon software version on the observer host.
      type: keyword
    - name: system_uptime_seconds
      description: System uptime in seconds on the observer host.
      type: long
    - name: total_ram_bytes
      description: Total RAM bytes on the observer host.
      type: long
    - name: tychon_client_id
      description: Tychon client identifier reported on Windows endpoints.
      type: keyword
    - name: user_gid
      description: Current user group identifier on the observer host.
      type: keyword
    - name: user_home_dir
      description: Home directory of the current user on the observer host.
      type: keyword
    - name: user_uid
      description: Current user identifier on the observer host.
      type: keyword
    - name: vdi_identity_source
      description: Source used to determine VDI identity.
      type: keyword
    - name: windows_server_role
      description: Windows server role or workstation role of the observer host.
      type: keyword
    - name: os
      type: group
      fields:
        - name: build
          description: Observer operating system build identifier.
          type: keyword
        - name: family
          description: Observer operating system family.
          type: keyword
        - name: kernel
          description: Observer operating system kernel string.
          type: keyword
        - name: name
          description: Observer operating system name.
          type: keyword
        - name: platform
          description: Observer operating system platform.
          type: keyword
        - name: version
          description: Observer operating system version.
          type: keyword
- name: tags
  description: Tags preserved on the transformed readiness document.
  type: keyword
