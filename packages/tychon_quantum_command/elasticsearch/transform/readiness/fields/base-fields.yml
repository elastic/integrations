- name: id
  description: Tychon unique document identifier for the system readiness record.
  type: keyword
- name: tychon
  type: group
  fields:
    - name: index
      description: Tychon dataset discriminator used by the source event.
      type: keyword
    - name: type
      description: Tychon record type.
      type: keyword
- name: kerberos
  type: group
  fields:
    - name: config_source
      description: Source of Kerberos encryption configuration.
      type: keyword
    - name: has_aes128
      description: Indicates whether AES128 Kerberos support is enabled.
      type: boolean
    - name: has_aes256
      description: Indicates whether AES256 Kerberos support is enabled.
      type: boolean
    - name: has_des
      description: Indicates whether DES Kerberos support is enabled.
      type: boolean
    - name: has_rc4
      description: Indicates whether RC4 Kerberos support is enabled.
      type: boolean
    - name: is_explicitly_configured
      description: Indicates whether Kerberos encryption settings are explicitly configured.
      type: boolean
    - name: is_quantum_safe
      description: Indicates whether the Kerberos configuration is considered post-quantum safe.
      type: boolean
    - name: raw_bitmask
      description: Windows Kerberos encryption type bitmask, when available.
      type: long
    - name: supported_types
      description: Supported Kerberos encryption types as reported by the host.
      type: keyword
- name: scan
  type: group
  fields:
    - name: target_input
      description: Original scan target input supplied to TQC.
      type: keyword
    - name: timestamp
      description: Timestamp emitted by the scanner for this record.
      type: date
    - name: type
      description: Scan mode used to collect the readiness record.
      type: keyword
