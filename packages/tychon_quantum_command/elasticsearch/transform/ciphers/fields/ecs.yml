- name: error.message
  type: match_only_text

- name: event.action
  type: keyword

- name: event.category
  type: keyword

- name: event.dataset
  type: keyword

- name: event.ingested
  type: date

- name: hash
  type: group
  fields:
    - name: sha1_certificate
      type: keyword

    - name: sha256_certificate
      type: keyword

- name: observer
  type: group
  fields:
    - name: hostname
      type: keyword

    - name: id
      type: keyword

    - name: tychon_client_id
      type: keyword

    - name: windows_server_role
      type: keyword

    - name: domain
      type: keyword

    - name: software_version
      type: keyword

    - name: os
      type: group
      fields:
        - name: build
          type: keyword

        - name: family
          type: keyword

        - name: kernel
          type: keyword

        - name: name
          type: keyword

        - name: platform
          type: keyword

        - name: version
          type: keyword

- name: port
  type: group
  fields:
    - name: number
      type: long

    - name: protocol_detected
      type: keyword

    - name: status_overall
      type: keyword

- name: process
  type: group
  fields:
    - name: command_line
      type: wildcard

    - name: executable
      type: keyword

    - name: executable_directory
      type: keyword

    - name: name
      type: keyword

    - name: pid
      type: long

    - name: username
      type: keyword

- name: server
  type: group
  fields:
    - name: address
      type: keyword

    - name: ip
      type: ip

    - name: port
      type: long

- name: service
  type: group
  fields:
    - name: name
      type: keyword

    - name: state
      type: keyword

- name: x509
  type: group
  fields:
    - name: issuer
      type: group
      fields:
        - name: common_name
          type: keyword

        - name: distinguished_name
          type: keyword

    - name: public_key_algorithm
      type: keyword

    - name: public_key_size
      type: long

    - name: serial_number
      type: keyword

    - name: signature_algorithm
      type: keyword

    - name: subject
      type: group
      fields:
        - name: common_name
          type: keyword

        - name: distinguished_name
          type: keyword

- name: data_stream
  type: group
  fields:
    - name: type
      type: constant_keyword

    - name: dataset
      type: constant_keyword

    - name: namespace
      type: constant_keyword

- name: ecs
  type: group
  fields:
    - name: version
      type: keyword

- name: input
  type: group
  fields:
    - name: type
      type: keyword

- name: log.file.device_id
  type: keyword

- name: log.file.fingerprint
  type: keyword

- name: log.file.inode
  type: keyword

- name: log.file.path
  type: keyword

- name: log.offset
  type: double

- name: tags
  type: keyword
