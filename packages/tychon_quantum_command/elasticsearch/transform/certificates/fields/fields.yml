- name: certificate
  type: group
  fields:
    - name: is_csr
      type: boolean
    - name: is_private_key
      type: boolean
    - name: is_self_signed
      type: boolean
    - name: issuer
      type: keyword
    - name: issuer_common_name
      type: keyword
    - name: key_usage
      type: keyword
    - name: not_after
      type: date
    - name: not_before
      type: date
    - name: pqc_vulnerable
      type: boolean
    - name: raw_pem_certificate
      type: match_only_text
    - name: serial_number
      type: keyword
    - name: sha1_fingerprint
      type: keyword
    - name: sha256_fingerprint
      type: keyword
    - name: signature_algorithm
      type: keyword
    - name: source_file_path
      type: keyword
    - name: source_id
      type: keyword
    - name: subject
      type: keyword
    - name: subject_common_name
      type: keyword
    - name: universal_id
      type: keyword
    - name: validity
      type: group
      fields:
        - name: duration_days
          type: keyword
    - name: version
      type: long
    - name: basic_constraints
      type: group
      fields:
        - name: is_ca
          type: boolean
        - name: max_path_len
          type: long
        - name: max_path_len_zero
          type: boolean
    - name: file_details
      type: group
      fields:
        - name: attributes
          type: keyword
        - name: extension
          type: keyword
        - name: group
          type: keyword
        - name: md5_hash
          type: keyword
        - name: name
          type: keyword
        - name: owner
          type: keyword
        - name: path
          type: keyword
        - name: sha1_hash
          type: keyword
        - name: sha256_hash
          type: keyword
        - name: size
          type: long
    - name: subject_public_key_info
      type: group
      fields:
        - name: algorithm
          type: keyword
        - name: bit_size
          type: long
        - name: rsa_exponent
          type: long
        - name: rsa_modulus_hex
          type: wildcard
- name: crypto
  type: group
  fields:
    - name: key_algorithm
      type: keyword
    - name: key_size
      type: long
    - name: signature_algorithm
      type: keyword
- name: omb
  type: group
  fields:
    - name: sig_tier
      type: keyword
- name: pqc
  type: group
  fields:
    - name: vulnerable
      type: boolean
