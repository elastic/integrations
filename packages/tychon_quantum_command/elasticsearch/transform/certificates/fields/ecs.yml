- name: '@timestamp'
  type: date
- name: event.action
  type: keyword
- name: event.category
  type: keyword
- name: event.dataset
  type: keyword
- name: event.ingested
  type: date
- name: event.kind
  type: keyword
- name: file
  type: group
  fields:
    - name: extension
      type: keyword
    - name: group
      type: group
      fields:
        - name: name
          type: keyword
    - name: mtime
      type: date
    - name: name
      type: keyword
    - name: owner
      type: group
      fields:
        - name: name
          type: keyword
    - name: path
      type: keyword
    - name: permissions
      type: keyword
    - name: size
      type: long
- name: hash
  type: group
  fields:
    - name: sha256_certificate
      type: keyword
- name: observer
  type: group
  fields:
    - name: hostname
      type: keyword
    - name: id
      type: keyword
    - name: tychon_client_id
      type: keyword
    - name: windows_server_role
      type: keyword
- name: x509
  type: group
  fields:
    - name: is_valid
      type: boolean
    - name: issuer
      type: group
      fields:
        - name: common_name
          type: keyword
        - name: distinguished_name
          type: keyword
    - name: public_key_algorithm
      type: keyword
    - name: public_key_size
      type: long
    - name: serial_number
      type: keyword
    - name: signature_algorithm
      type: keyword
    - name: subject
      type: group
      fields:
        - name: common_name
          type: keyword
        - name: distinguished_name
          type: keyword
    - name: validity
      type: group
      fields:
        - name: not_after
          type: date
        - name: not_before
          type: date
    - name: version_number
      type: long
