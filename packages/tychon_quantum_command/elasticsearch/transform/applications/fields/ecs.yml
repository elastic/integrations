- name: '@timestamp'
  type: date
- name: event.category
  type: keyword
- name: event.dataset
  type: keyword
- name: event.ingested
  type: date
- name: host.hostname
  type: keyword
- name: host.id
  type: keyword
- name: observer
  type: group
  fields:
    - name: hostname
      type: keyword
    - name: id
      type: keyword
    - name: domain
      type: keyword
    - name: software_version
      type: keyword
    - name: tychon_client_id
      type: keyword
    - name: windows_server_role
      type: keyword
    - name: os
      type: group
      fields:
        - name: build
          type: keyword
        - name: family
          type: keyword
        - name: kernel
          type: keyword
        - name: name
          type: keyword
        - name: platform
          type: keyword
        - name: version
          type: keyword
