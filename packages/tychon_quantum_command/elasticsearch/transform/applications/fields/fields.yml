- name: tychon
  type: group
  fields:
    - name: application
      type: group
      fields:
        - name: app_root
          type: keyword
        - name: connected_to_count
          type: long
        - name: crypto_library_count
          type: long
        - name: in_memory_cert_count
          type: long
        - name: keychain_identity_count
          type: long
        - name: keystore_count
          type: long
        - name: name
          type: keyword
        - name: path
          type: keyword
        - name: pid
          type: long
        - name: port_count
          type: long
        - name: private_key_count
          type: long
        - name: service_display_name
          type: keyword
        - name: service_name
          type: keyword
        - name: source
          type: keyword
    - name: library
      type: group
      fields:
        - name: crypt32_pqc_status
          type: keyword
        - name: crypt32_version
          type: keyword
        - name: openssl_pqc_status
          type: keyword
        - name: openssl_version
          type: keyword
        - name: uses_crypt32
          type: boolean
        - name: uses_openssl
          type: boolean
        - name: uses_windows_cng
          type: boolean
        - name: windows_cng_pqc_status
          type: keyword
        - name: windows_cng_version
          type: keyword
