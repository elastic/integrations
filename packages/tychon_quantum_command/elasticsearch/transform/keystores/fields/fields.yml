- name: keystore
  type: group
  fields:
    - name: accessible
      type: boolean
    - name: cert_count
      type: long
    - name: path
      type: keyword
    - name: requires_auth
      type: boolean
    - name: type
      type: keyword
    - name: stats
      type: group
      fields:
        - name: expired_certificates
          type: long
        - name: pqc_vulnerable_certificates
          type: long
        - name: vulnerable_certificates
          type: long
        - name: certificate_types
          type: group
          fields:
            - name: ca
              type: long
        - name: key_algorithms
          type: group
          fields:
            - name: ECDSA
              type: long
            - name: RSA
              type: long
