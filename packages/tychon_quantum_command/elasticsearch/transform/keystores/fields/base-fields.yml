- name: id
  description: Tychon unique document identifier for the keystore record.
  type: keyword
- name: tychon
  type: group
  fields:
    - name: index
      type: keyword
    - name: type
      type: keyword
- name: kerberos
  type: group
  fields:
    - name: config_source
      type: keyword
    - name: has_aes128
      type: boolean
    - name: has_aes256
      type: boolean
    - name: has_des
      type: boolean
    - name: has_rc4
      type: boolean
    - name: is_quantum_safe
      type: boolean
    - name: raw_bitmask
      type: long
    - name: supported_types
      type: keyword
- name: scan
  type: group
  fields:
    - name: target_input
      type: keyword
    - name: timestamp
      type: date
    - name: type
      type: keyword
