- name: ipsec_tunnel
  type: group
  fields:
    - name: active
      type: boolean
    - name: config_path
      type: keyword
    - name: detection_confidence
      type: keyword
    - name: detection_method
      type: keyword
    - name: first_detected
      type: date
    - name: implementation
      type: keyword
    - name: last_seen
      type: date
    - name: name
      type: keyword
    - name: source_id
      type: keyword
    - name: status
      type: keyword
    - name: version
      type: keyword
- name: pqc
  type: group
  fields:
    - name: is_pqc_ready
      type: boolean
    - name: pqc_migration_status
      type: keyword
    - name: quantum_resistance
      type: keyword
- name: security
  type: group
  fields:
    - name: known_vulnerabilities
      type: keyword
    - name: perfect_forward_secrecy
      type: boolean
    - name: pqc_support
      type: boolean
    - name: pqc_vulnerable
      type: boolean
    - name: risk_level
      type: keyword
    - name: score
      type: long
    - name: security_score
      type: long
    - name: vulnerable
      type: boolean
    - name: weak_crypto
      type: boolean
    - name: weak_dh_group
      type: boolean
- name: tunnel_details
  type: group
  fields:
    - name: auth_method
      type: keyword
    - name: dh_group
      type: keyword
    - name: encryption_algorithm
      type: keyword
    - name: integrity_algorithm
      type: keyword
    - name: mode
      type: keyword
    - name: nat_traversal
      type: boolean
    - name: perfect_forward_secrecy
      type: boolean
    - name: protocol
      type: keyword
