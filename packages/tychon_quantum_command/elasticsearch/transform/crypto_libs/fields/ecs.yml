- name: '@timestamp'
  type: date
- name: event.action
  type: keyword
- name: event.category
  type: keyword
- name: event.dataset
  type: keyword
- name: event.ingested
  type: date
- name: event.kind
  type: keyword
- name: observer
  type: group
  fields:
    - name: hostname
      type: keyword
    - name: id
      type: keyword
    - name: tychon_client_id
      type: keyword
    - name: windows_server_role
      type: keyword
- name: process
  type: group
  fields:
    - name: executable
      type: keyword
    - name: executable_directory
      type: keyword
    - name: name
      type: keyword
    - name: pid
      type: long
