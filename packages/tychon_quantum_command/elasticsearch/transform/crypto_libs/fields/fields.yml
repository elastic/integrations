- name: tychon
  type: group
  fields:
    - name: library
      type: group
      fields:
        - name: crypto_type
          type: keyword
        - name: name
          type: keyword
        - name: openssl_version
          type: keyword
        - name: pqc_status
          type: keyword
        - name: uses_openssl
          type: boolean
        - name: uses_windows_cng
          type: boolean
        - name: windows_cng_version
          type: keyword
- name: vulnerability
  type: group
  fields:
    - name: assessed_at
      type: date
    - name: is_vulnerable
      type: boolean
    - name: risk_level
      type: keyword
    - name: risk_reason
      type: keyword
