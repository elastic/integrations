- name: tychon
  type: group
  fields:
    - name: browser_extension
      type: group
      fields:
        - name: browser
          type: keyword

        - name: extension_id
          type: keyword

        - name: permissions
          type: keyword

        - name: profile_path
          type: keyword

        - name: quantum_ready
          type: keyword

    - name: observer
      type: group
      fields:
        - name: bigfix_client_installed
          type: boolean

        - name: bios_serial_number
          type: keyword

        - name: cpu_cores
          type: long

        - name: cpu_logical_cores
          type: long

        - name: cpu_model_name
          type: keyword

        - name: cpu_vendor_id
          type: keyword

        - name: current_user
          type: keyword

        - name: domain
          type: keyword

        - name: fips_mode_enabled
          type: boolean

        - name: hostname
          type: keyword

        - name: id
          type: keyword

        - name: ip_addresses
          type: keyword

        - name: is_vdi_environment
          type: boolean

        - name: kernel_arch
          type: keyword

        - name: kernel_version
          type: keyword

        - name: machine_serial_number
          type: keyword

        - name: organization
          type: keyword

        - name: platform_version
          type: keyword

        - name: ram_used_percent
          type: float

        - name: software_version
          type: keyword

        - name: system_uptime_seconds
          type: long

        - name: total_ram_bytes
          type: long

        - name: tychon_client_id
          type: keyword

        - name: user_gid
          type: keyword

        - name: user_home_dir
          type: keyword

        - name: user_uid
          type: keyword

        - name: vdi_identity_source
          type: keyword

        - name: windows_server_role
          type: keyword

        - name: os
          type: group
          fields:
            - name: build
              type: keyword

            - name: family
              type: keyword

            - name: kernel
              type: keyword

            - name: name
              type: keyword

            - name: platform
              type: keyword

            - name: version
              type: keyword

    - name: pipeline
      type: group
      fields:
        - name: processed
          type: boolean

    - name: scan
      type: group
      fields:
        - name: target_input
          type: keyword

        - name: timestamp
          type: date

        - name: type
          type: keyword

    - name: scan_mode
      type: keyword

    - name: application
      type: group
      fields:
        - name: name
          type: keyword

        - name: path
          type: keyword

        - name: pid
          type: long

    - name: process
      type: group
      fields:
        - name: executable_directory
          type: keyword

        - name: executable_file
          type: group
          fields:
            - name: attributes
              type: keyword

            - name: company_name
              type: keyword

            - name: extension
              type: keyword

            - name: file_version
              type: keyword

            - name: group
              type: keyword

            - name: md5_hash
              type: keyword

            - name: name
              type: keyword

            - name: owner
              type: keyword

            - name: path
              type: keyword

            - name: product_name
              type: keyword

            - name: product_version
              type: keyword

            - name: sha1_hash
              type: keyword

            - name: sha256_hash
              type: keyword

            - name: size
              type: long

        - name: service_info
          type: group
          fields:
            - name: description
              type: keyword

            - name: display_name
              type: keyword

            - name: name
              type: keyword

            - name: state
              type: keyword

        - name: user_name
          type: keyword

        - name: username
          type: keyword

    - name: quantum_ready
      type: group
      fields:
        - name: certificate
          type: boolean

        - name: cipher
          type: boolean

        - name: key_exchange
          type: boolean

        - name: overall
          type: boolean

- name: kerberos
  type: group
  fields:
    - name: config_source
      type: keyword

    - name: has_aes128
      type: boolean

    - name: has_aes256
      type: boolean

    - name: has_des
      type: boolean

    - name: has_rc4
      type: boolean

    - name: is_explicitly_configured
      type: boolean

    - name: is_quantum_safe
      type: boolean

    - name: raw_bitmask
      type: long

    - name: supported_types
      type: keyword
