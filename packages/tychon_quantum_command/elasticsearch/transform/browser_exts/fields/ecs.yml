- name: event.category
  type: keyword

- name: event.dataset
  type: keyword

- name: event.ingested
  type: date

- name: observer
  type: group
  fields:
    - name: hostname
      type: keyword

    - name: id
      type: keyword

    - name: tychon_client_id
      type: keyword

    - name: windows_server_role
      type: keyword

    - name: domain
      type: keyword

    - name: software_version
      type: keyword

    - name: os
      type: group
      fields:
        - name: build
          type: keyword

        - name: family
          type: keyword

        - name: kernel
          type: keyword

        - name: name
          type: keyword

        - name: platform
          type: keyword

        - name: version
          type: keyword

- name: package
  type: group
  fields:
    - name: description
      type: keyword

    - name: name
      type: keyword

    - name: version
      type: keyword

- name: data_stream
  type: group
  fields:
    - name: type
      type: constant_keyword

    - name: dataset
      type: constant_keyword

    - name: namespace
      type: constant_keyword

- name: ecs
  type: group
  fields:
    - name: version
      type: keyword

- name: input
  type: group
  fields:
    - name: type
      type: keyword

- name: log.file.device_id
  type: keyword

- name: log.file.fingerprint
  type: keyword

- name: log.file.inode
  type: keyword

- name: log.file.path
  type: keyword

- name: log.offset
  type: double

- name: tags
  type: keyword
