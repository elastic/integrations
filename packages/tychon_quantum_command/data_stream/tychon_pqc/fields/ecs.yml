- name: data_stream
  type: group
  fields:
    - name: type
      type: constant_keyword
    - name: dataset
      type: constant_keyword
    - name: namespace
      type: constant_keyword

- name: ecs
  type: group
  fields:
    - name: version
      type: keyword

- name: destination
  type: group
  fields:
    - name: address
      type: keyword
    - name: domain
      type: keyword
    - name: ip
      type: ip
    - name: port
      type: long

- name: error
  type: group
  fields:
    - name: message
      type: match_only_text
    - name: pipeline
      type: keyword

- name: event
  type: group
  fields:
    - name: action
      type: keyword
    - name: category
      type: keyword
    - name: dataset
      type: keyword
    - name: ingested
      type: date
    - name: kind
      type: keyword
    - name: original
      type: match_only_text
    - name: type
      type: keyword

- name: file
  type: group
  fields:
    - name: extension
      type: keyword
    - name: mtime
      type: date
    - name: name
      type: keyword
    - name: path
      type: keyword
    - name: permissions
      type: keyword
    - name: size
      type: long
    - name: group
      type: group
      fields:
        - name: name
          type: keyword
    - name: owner
      type: group
      fields:
        - name: name
          type: keyword

- name: hash
  type: group
  fields:
    - name: sha256
      type: keyword

- name: host
  type: group
  fields:
    - name: architecture
      type: keyword
    - name: domain
      type: keyword
    - name: hostname
      type: keyword
    - name: id
      type: keyword
    - name: ip
      type: ip
    - name: ipv4
      type: ip
    - name: ipv6
      type: ip
    - name: cpu
      type: group
      fields:
        - name: cores
          type: long
    - name: memory
      type: group
      fields:
        - name: total
          type: long
    - name: os
      type: group
      fields:
        - name: family
          type: keyword
        - name: kernel
          type: keyword
        - name: name
          type: keyword
        - name: platform
          type: keyword
        - name: version
          type: keyword

- name: network
  type: group
  fields:
    - name: protocol
      type: keyword

- name: observer
  type: group
  fields:
    - name: domain
      type: keyword
    - name: hostname
      type: keyword
    - name: id
      type: keyword
    - name: type
      type: keyword
    - name: vendor
      type: keyword
    - name: version
      type: keyword
    - name: os
      type: group
      fields:
        - name: build
          type: keyword
        - name: family
          type: keyword
        - name: kernel
          type: keyword
        - name: name
          type: keyword
        - name: platform
          type: keyword
        - name: version
          type: keyword

- name: package
  type: group
  fields:
    - name: description
      type: keyword
    - name: name
      type: keyword
    - name: path
      type: keyword
    - name: version
      type: keyword

- name: process
  type: group
  fields:
    - name: command_line
      type: wildcard
    - name: executable
      type: keyword
    - name: name
      type: keyword
    - name: path
      type: keyword
    - name: pid
      type: long
    - name: start
      type: date
    - name: hash
      type: group
      fields:
        - name: sha256
          type: keyword

- name: server
  type: group
  fields:
    - name: address
      type: keyword
    - name: ip
      type: ip
    - name: port
      type: long
    - name: protocol
      type: keyword

- name: service
  type: group
  fields:
    - name: name
      type: keyword
    - name: state
      type: keyword

- name: source
  type: group
  fields:
    - name: domain
      type: keyword
    - name: user
      type: group
      fields:
        - name: id
          type: keyword

- name: input.type
  type: keyword

- name: log.file.device_id
  type: keyword

- name: log.file.fingerprint
  type: keyword

- name: log.file.inode
  type: keyword

- name: log.file.path
  type: keyword

- name: log.offset
  type: long

- name: tags
  type: keyword
