- name: "@timestamp"
  type: date

- name: id
  type: keyword

- name: quantum_ready
  type: boolean

- name: quantum_ready_cert
  type: boolean

- name: quantum_ready_cipher
  type: boolean

- name: quantum_ready_kx
  type: boolean

- name: scan_type
  type: keyword

- name: scan
  type: group
  fields:
    - name: target_input
      type: keyword
    - name: timestamp
      type: date
    - name: type
      type: keyword

- name: package
  type: group
  fields:
    - name: description
      type: keyword
    - name: install_directory
      type: keyword
    - name: name
      type: keyword
    - name: path
      type: keyword
    - name: version
      type: keyword
