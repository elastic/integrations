      value: "{{{tychon.routing.original.host_os_name}}}"
      ignore_empty_value: true
      if: ctx?.tychon?.routing?.original?.host_os_name != null && ctx.tychon.routing.original.host_os_name != ''

  - set:
      tag: set_host_os_platform
      field: host.os.platform
      value: "{{{tychon.routing.original.host_os_platform}}}"
      ignore_empty_value: true
      if: ctx?.tychon?.routing?.original?.host_os_platform != null && ctx.tychon.routing.original.host_os_platform != ''

  - set:
      tag: set_host_os_family
      field: host.os.family
      value: "{{{tychon.routing.original.host_os_family}}}"
      ignore_empty_value: true
      if: ctx?.tychon?.routing?.original?.host_os_family != null && ctx.tychon.routing.original.host_os_family != ''

  - set:
      tag: set_host_os_version
      field: host.os.version
      value: "{{{tychon.routing.original.host_os_version}}}"
      ignore_empty_value: true
      if: ctx?.tychon?.routing?.original?.host_os_version != null && ctx.tychon.routing.original.host_os_version != ''

  - set:
      tag: set_destination_address
      field: destination.address
      value: "{{{tychon.routing.target.address}}}"
      ignore_empty_value: true
      if: ctx?.tychon?.routing?.target?.address != null && ctx.tychon.routing.target.address != ''

  - set:
      tag: set_destination_ip
      field: destination.ip
      copy_from: tychon.routing.target.ip
      ignore_empty_value: true
      if: ctx?.tychon?.routing?.target?.ip != null

  - script:
      tag: script_populate_related_ip
      lang: painless
      description: Populate ECS related.ip from normalized network endpoint addresses.
      if: ctx?.host?.ip != null || ctx?.source?.ip != null || ctx?.destination?.ip != null || ctx?.server?.ip != null
      source: >
        void addValues(List target, def value) {
          if (value instanceof List) {
            for (def item : value) {
              if (item != null && item != '' && !target.contains(item)) { target.add(item); }
            }
          } else if (value != null && value != '' && !target.contains(value)) {
            target.add(value);
          }
        }
        if (ctx.related == null || !(ctx.related instanceof Map)) { ctx.related = [:]; }
        if (ctx.related.ip == null) { ctx.related.ip = []; }
        else if (!(ctx.related.ip instanceof List)) { ctx.related.ip = [ctx.related.ip]; }
        addValues(ctx.related.ip, ctx.source?.ip);
        addValues(ctx.related.ip, ctx.host?.ip);
        addValues(ctx.related.ip, ctx.destination?.ip);
        addValues(ctx.related.ip, ctx.server?.ip);
        if (ctx.related.ip.isEmpty()) { ctx.related.remove('ip'); }

  - set:
      tag: set_network_protocol
      field: network.protocol
      value: "{{{port.protocol_detected}}}"
      ignore_empty_value: true
      if: ctx?.network?.protocol == null && ctx?.port?.protocol_detected != null && ctx.port.protocol_detected != ''

  - set:
      tag: set_network_protocol_2
      field: network.protocol
      value: "{{{tychon.application.protocol_detected}}}"
      ignore_empty_value: true
      if: ctx?.network?.protocol == null && ctx?.tychon?.application?.protocol_detected != null && ctx.tychon.application.protocol_detected != ''

  - convert:
      tag: convert_tychon_application_port
      field: tychon.application.port
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_failed_tychon_application_port
            field: tychon.application.port
            ignore_missing: true
        - append:
            tag: append_error_pipeline_convert_tychon_application_port
            field: error.pipeline
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}"

  - convert:
      tag: convert_tychon_application_port_quantum_grade_score
      field: tychon.application.port_quantum_grade.score
      type: float
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_failed_tychon_application_port_quantum_grade_score
            field: tychon.application.port_quantum_grade.score
            ignore_missing: true
        - append:
            tag: append_error_pipeline_convert_tychon_application_port_quantum_grade_score
            field: error.pipeline
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}"

  - script:
      tag: lift_remaining_tqc_vendor_roots
      lang: painless
      description: Move remaining non-ECS TQC roots into the shared Tychon vendor namespace after normalization.
      source: |-
        if (ctx.tychon == null || !(ctx.tychon instanceof Map)) {
          ctx.tychon = [:];
        }
        for (String root : ['asset_type', 'certificate', 'config', 'crypto', 'error', 'ipsec_tunnel', 'kerberos', 'keystore', 'migration_priority', 'omb', 'pipeline', 'port', 'pqc', 'pqc_readiness', 'quantum_readiness', 'quantum_risk', 'scan_mode', 'scanner_version', 'security', 'ssh', 'target_host', 'tls', 'tunnel_details', 'type', 'vulnerability', 'vpn_client', 'vpn_config']) {
          if (root == 'error' && ctx.error instanceof Map && ctx.error.message != null) {
            continue;
          }
          if (ctx[root] == null) {
            continue;
          }
          if (ctx.tychon[root] == null) {
            ctx.tychon[root] = ctx[root];
          } else if (ctx.tychon[root] instanceof Map && ctx[root] instanceof Map) {
            for (entry in ctx[root].entrySet()) {
              if (ctx.tychon[root][entry.getKey()] == null) {
                ctx.tychon[root][entry.getKey()] = entry.getValue();
              }
            }
          }
          ctx.remove(root);
        }

  - script:
      tag: script_normalize_keystore_algorithm_keys
      lang: painless
      description: Normalize dynamic keystore algorithm keys to lowercase field names.
      if: ctx?.tychon?.keystore?.stats?.key_algorithms instanceof Map
      source: >
        Map normalized = [:];
        for (entry in ctx.tychon.keystore.stats.key_algorithms.entrySet()) {
          normalized[entry.getKey().toString().toLowerCase()] = entry.getValue();
        }
        ctx.tychon.keystore.stats.key_algorithms = normalized;

  - script:
      tag: script_drop_null_empty_values
      lang: painless
      description: Remove null, empty string, empty object, and empty array values from the final event.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0);
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0);
          });
        }
        handleMap(ctx);

  - remove:
      tag: remove_message
      field: message
      ignore_missing: true
      if: (ctx.tychon != null || ctx.containsKey('tychon.index')) && (ctx.event == null || ctx.event.original == null)

  - remove:
      tag: remove_message_2
      field: message
      ignore_missing: true
      if: ctx.event != null && ctx.event.original != null

on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: |-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_preserve_original_event_tag_on_failure
      field: tags
      value: preserve_original_event
      allow_duplicates: false
