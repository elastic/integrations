---
description: Main ingest pipeline for Tychon Quantum Command.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 8.17.0

  - set:
      tag: preserve_original_event
      field: event.original
      copy_from: message
      override: false
      ignore_empty_value: true
      if: ctx.tags instanceof List && ctx.tags.contains('preserve_original_event') && ctx.message != null && ctx.event?.original == null

  - json:
      tag: json_message
      field: message
      add_to_root: true
      if: ctx.tychon == null && ctx.message != null
      on_failure:
        - set:
            tag: preserve_failed_json_message
            field: event.original
            copy_from: message
            override: false
            ignore_empty_value: true
        - append:
            tag: append_error_message_json_message
            field: tychon.error.pipeline
            value: |-
              Processor '{{{ _ingest.on_failure_processor_type }}}'
              {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
              {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
        - set:
            tag: set_pipeline_error_to_event_kind_json_message
            field: event.kind
            value: pipeline_error
        - append:
            tag: append_preserve_original_event_tag_json_message
            field: tags
            value: preserve_original_event
            allow_duplicates: false

  - script:
      tag: script_lift_raw_tqc_ndjson_fields_parsed_under_tychon_raw_be
      lang: painless
      description: Lift raw TQC NDJSON fields parsed under tychon.raw before package event defaults are applied.
      if: ctx?.tychon?.raw instanceof Map
      source: >
        Map raw = ctx.tychon.raw;
        if (ctx.tychon.record == null || !(ctx.tychon.record instanceof Map)) {
          ctx.tychon.record = [:];
        }
        if (raw.event instanceof Map && raw.event.dataset != null && ctx.tychon.record.dataset == null) {
          ctx.tychon.record.dataset = raw.event.dataset;
        } else if (raw.containsKey('event.dataset') && raw['event.dataset'] != null && ctx.tychon.record.dataset == null) {
          ctx.tychon.record.dataset = raw['event.dataset'];
        }
        for (entry in raw.entrySet()) {
          def key = entry.getKey();
          def value = entry.getValue();
          if (key == '@timestamp') {
            ctx['@timestamp'] = value;
          } else if (key == 'timestamp') {
            if (ctx['@timestamp'] == null || !raw.containsKey('@timestamp')) {
              ctx['@timestamp'] = value;
            }
          } else if (key == 'tychon') {
            if (value instanceof Map) {
              for (tychonEntry in value.entrySet()) {
                def tychonKey = tychonEntry.getKey();
                if (tychonKey != 'raw' && tychonKey != 'record' && ctx.tychon[tychonKey] == null) {
                  ctx.tychon[tychonKey] = tychonEntry.getValue();
                }
              }
            }
          } else if (key == 'event') {
            if (ctx.event == null || !(ctx.event instanceof Map)) {
              ctx.event = [:];
            }
            if (value instanceof Map) {
              for (eventEntry in value.entrySet()) {
                def eventKey = eventEntry.getKey();
                if (eventKey != 'dataset' && ctx.event[eventKey] == null) {
                  ctx.event[eventKey] = eventEntry.getValue();
                }
              }
            }
          } else if (ctx[key] == null) {
            ctx[key] = value;
          } else if (ctx[key] instanceof Map && value instanceof Map) {
            Map target = ctx[key];
            for (nestedEntry in value.entrySet()) {
              if (target[nestedEntry.getKey()] == null) {
                target[nestedEntry.getKey()] = nestedEntry.getValue();
              }
            }
          }
        }
        ctx.tychon.remove('raw');

  - rename:
      tag: rename_timestamp
      field: timestamp
      target_field: "@timestamp"
      ignore_missing: true
      if: ctx['@timestamp'] == null

  - remove:
      tag: remove_timestamp
      field: timestamp
      ignore_missing: true

  - date:
      tag: date_timestamp
      field: "@timestamp"
      formats:
        - ISO8601
      ignore_failure: true


  - script:
      tag: script_preserve_flat_event_fields_before_package_event_defau
      lang: painless
      description: Preserve flat event.* fields before package event defaults are applied.
      source: >
        if (ctx.tychon == null || !(ctx.tychon instanceof Map)) {
          ctx.tychon = [:];
        }
        if (ctx.tychon.record == null || !(ctx.tychon.record instanceof Map)) {
          ctx.tychon.record = [:];
        }
        if (ctx.event == null || !(ctx.event instanceof Map)) {
          ctx.event = [:];
        }
        if (ctx.containsKey('event.dataset')) {
          if (ctx.tychon.record.dataset == null) {
            ctx.tychon.record.dataset = ctx['event.dataset'];
          }
          if (ctx.event.dataset == null) {
            ctx.event.dataset = ctx['event.dataset'];
          }
          ctx.remove('event.dataset');
        } else if (ctx.event.dataset != null && ctx.tychon.record.dataset == null && ctx.event.dataset != 'tychon_quantum_command.tychon_pqc') {
          ctx.tychon.record.dataset = ctx.event.dataset;
        }
        if (ctx.event.kind == null && ctx.containsKey('event.kind')) {
          ctx.event.kind = ctx['event.kind'];
          ctx.remove('event.kind');
        }
        if (ctx.event.action == null && ctx.containsKey('event.action')) {
          ctx.event.action = ctx['event.action'];
          ctx.remove('event.action');
        }
        if (ctx.event.type == null && ctx.containsKey('event.type')) {
          def eventType = ctx['event.type'];
          if (eventType instanceof List) {
            ctx.event.type = eventType;
          } else if (eventType instanceof String && eventType.contains(',')) {
            List eventTypes = new ArrayList();
            for (String item : eventType.splitOnToken(',')) {
              String trimmed = item.trim();
              if (trimmed.length() > 0) {
                eventTypes.add(trimmed);
              }
            }
            ctx.event.type = eventTypes;
          } else {
            ctx.event.type = [eventType];
          }
          ctx.remove('event.type');
        }
        if (ctx.event.type instanceof String) {
          ctx.event.type = [ctx.event.type];
        }
        if (ctx.event.category == null && ctx.containsKey('event.category')) {
          def category = ctx['event.category'];
          if (category instanceof List) {
            ctx.event.category = category;
          } else if (category instanceof String && category.contains(',')) {
            List categories = new ArrayList();
            for (String item : category.splitOnToken(',')) {
              String trimmed = item.trim();
              if (trimmed.length() > 0) {
                categories.add(trimmed);
              }
            }
            ctx.event.category = categories;
          } else {
            ctx.event.category = [category];
          }
          ctx.remove('event.category');
        }
        if (ctx.event.category instanceof String) {
          ctx.event.category = [ctx.event.category];
        }
        if (ctx.event.category instanceof List && ctx.event.category.contains('library') && ctx.event.type instanceof List && ctx.event.type.contains('info')) {
          ctx.event.type.removeIf(v -> v == 'info');
          if (!ctx.event.type.contains('start')) {
            ctx.event.type.add('start');
          }
        }
        if (ctx.containsKey('id') && ctx.id != null) {
          ctx.tychon.record.id = ctx.id;
        }
        if (ctx.tychon.index != null) {
          ctx.tychon.record.family = ctx.tychon.index;
        }

  - set:
      tag: set_event_kind
      field: event.kind
      value: event
      if: ctx.event == null || ctx.event.kind == null

  - set:
      tag: set_event_category
      field: event.category
      value:
        - configuration
      if: ctx.event == null || ctx.event.category == null

  - set:
      tag: set_event_dataset
      field: event.dataset
      value: tychon_quantum_command.tychon_pqc
      override: true

  - set:
      tag: set_tychon_pipeline_processed
      field: tychon.pipeline.processed
      value: true

  - dot_expander:
      tag: dot_expander_all_fields
      field: "*"
      ignore_failure: true

  - date:
      tag: date_x509_not_before
      field: x509.not_before
      target_field: x509.not_before
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssXXX
        - yyyy-MM-dd'T'HH:mm:ss.SSSXXX
        - yyyy-MM-dd HH:mm:ss
        - MMM dd HH:mm:ss yyyy 'GMT'
      if: ctx?.x509?.not_before != null
      on_failure:
        - remove:
            tag: remove_failed_x509_not_before
            field: x509.not_before
            ignore_missing: true
        - append:
            tag: append_error_pipeline_date_x509_not_before
            field: error.pipeline
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}"

  - date:
      tag: date_x509_not_after
      field: x509.not_after
      target_field: x509.not_after
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssXXX
        - yyyy-MM-dd'T'HH:mm:ss.SSSXXX
        - yyyy-MM-dd HH:mm:ss
        - MMM dd HH:mm:ss yyyy 'GMT'
      if: ctx?.x509?.not_after != null
      on_failure:
        - remove:
            tag: remove_failed_x509_not_after
            field: x509.not_after
            ignore_missing: true
        - append:
            tag: append_error_pipeline_date_x509_not_after
            field: error.pipeline
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}"

  - date:
      tag: date_x509_validity_not_before
      field: x509.validity.not_before
      target_field: x509.validity.not_before
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssXXX
        - yyyy-MM-dd'T'HH:mm:ss.SSSXXX
        - yyyy-MM-dd HH:mm:ss
        - MMM dd HH:mm:ss yyyy 'GMT'
      if: ctx?.x509?.validity?.not_before != null
      on_failure:
        - remove:
            tag: remove_failed_x509_validity_not_before
            field: x509.validity.not_before
            ignore_missing: true
        - append:
            tag: append_error_pipeline_date_x509_validity_not_before
            field: error.pipeline
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}"

  - date:
      tag: date_x509_validity_not_after
      field: x509.validity.not_after
      target_field: x509.validity.not_after
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ssXXX
        - yyyy-MM-dd'T'HH:mm:ss.SSSXXX
        - yyyy-MM-dd HH:mm:ss
        - MMM dd HH:mm:ss yyyy 'GMT'
      if: ctx?.x509?.validity?.not_after != null
      on_failure:
        - remove:
            tag: remove_failed_x509_validity_not_after
            field: x509.validity.not_after
            ignore_missing: true
        - append:
            tag: append_error_pipeline_date_x509_validity_not_after
            field: error.pipeline
            value: "Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} failed with message: {{{_ingest.on_failure_message}}}"

  - script:
      tag: script_copy_tqc_specific_fields_out_of_ecs_namespaces_for_pa
      lang: painless
      description: Copy TQC-specific fields out of ECS namespaces for package-safe dashboard queries.
      source: >
        if (ctx.tychon == null || !(ctx.tychon instanceof Map)) {
          ctx.tychon = [:];
        }
        if (ctx.tychon.record == null || !(ctx.tychon.record instanceof Map)) {
          ctx.tychon.record = [:];
        }
        if (ctx.id != null && ctx.tychon.record.id == null) {
          ctx.tychon.record.id = ctx.id;
        }
        if (ctx.tychon.index != null && ctx.tychon.record.family == null) {
          ctx.tychon.record.family = ctx.tychon.index;
        }
        if (ctx.host != null && ctx.host instanceof Map) {
          if (ctx.tychon.host == null || !(ctx.tychon.host instanceof Map)) {
            ctx.tychon.host = [:];
          }
          if (ctx.host.ipv4 != null && !(ctx.host.ipv4 instanceof String && ctx.host.ipv4.trim().length() == 0)) {
            ctx.tychon.host.ipv4 = ctx.host.ipv4;
          }
          if (ctx.host.ipv6 != null && !(ctx.host.ipv6 instanceof String && ctx.host.ipv6.trim().length() == 0)) {
            ctx.tychon.host.ipv6 = ctx.host.ipv6;
          }
          if (ctx.host.ipv4 != null || ctx.host.ipv6 != null) {
            if (ctx.host.ip == null) {
              ctx.host.ip = [];
            } else if (!(ctx.host.ip instanceof List)) {
              ctx.host.ip = [ctx.host.ip];
            }
            if (ctx.host.ipv4 instanceof List) {
              for (def ip : ctx.host.ipv4) {
                if (ip != null && ip != '' && !ctx.host.ip.contains(ip)) { ctx.host.ip.add(ip); }
              }
            } else if (ctx.host.ipv4 != null && ctx.host.ipv4 != '' && !ctx.host.ip.contains(ctx.host.ipv4)) {
              ctx.host.ip.add(ctx.host.ipv4);
            }
            if (ctx.host.ipv6 instanceof List) {
              for (def ip : ctx.host.ipv6) {
                if (ip != null && ip != '' && !ctx.host.ip.contains(ip)) { ctx.host.ip.add(ip); }
              }
            } else if (ctx.host.ipv6 != null && ctx.host.ipv6 != '' && !ctx.host.ip.contains(ctx.host.ipv6)) {
              ctx.host.ip.add(ctx.host.ipv6);
            }
          }
          if (ctx.host.os_category != null) { ctx.tychon.host.os_category = ctx.host.os_category; }
          if (ctx.host.os_pqc_tier != null) { ctx.tychon.host.os_pqc_tier = ctx.host.os_pqc_tier; }
          if (ctx.host.cpu != null && ctx.host.cpu instanceof Map && ctx.host.cpu.cores != null) {
            if (ctx.tychon.host.cpu == null || !(ctx.tychon.host.cpu instanceof Map)) { ctx.tychon.host.cpu = [:]; }
            ctx.tychon.host.cpu.cores = ctx.host.cpu.cores;
          }
          if (ctx.host.memory != null && ctx.host.memory instanceof Map && ctx.host.memory.total != null) {
            if (ctx.tychon.host.memory == null || !(ctx.tychon.host.memory instanceof Map)) { ctx.tychon.host.memory = [:]; }
            ctx.tychon.host.memory.total = ctx.host.memory.total;
          }
        }
        if (ctx.macsec != null && ctx.macsec instanceof Map) { ctx.tychon.macsec = ctx.macsec; }
        if (ctx.archive != null && ctx.archive instanceof Map) { ctx.tychon.archive = ctx.archive; }
        if (ctx.file != null && ctx.file instanceof Map) {
          if (ctx.tychon.file == null || !(ctx.tychon.file instanceof Map)) { ctx.tychon.file = [:]; }
          if (ctx.file.permissions != null) { ctx.tychon.file.permissions = ctx.file.permissions; }
          if (ctx.file.group != null && ctx.file.group instanceof Map && ctx.file.group.name != null) {
            if (ctx.tychon.file.group == null || !(ctx.tychon.file.group instanceof Map)) { ctx.tychon.file.group = [:]; }
            ctx.tychon.file.group.name = ctx.file.group.name;
          }
          if (ctx.file.owner != null && ctx.file.owner instanceof Map && ctx.file.owner.name != null) {
            if (ctx.tychon.file.owner == null || !(ctx.tychon.file.owner instanceof Map)) { ctx.tychon.file.owner = [:]; }
            ctx.tychon.file.owner.name = ctx.file.owner.name;
          }
        }
        if (ctx.process != null && ctx.process instanceof Map) {
          if (ctx.tychon.process == null || !(ctx.tychon.process instanceof Map)) {
            ctx.tychon.process = [:];
          }
          if (ctx.process.executable_directory != null) { ctx.tychon.process.executable_directory = ctx.process.executable_directory; }
          if (ctx.process.executable_file != null) { ctx.tychon.process.executable_file = ctx.process.executable_file; }
          if (ctx.process.service_info != null) { ctx.tychon.process.service_info = ctx.process.service_info; }
          if (ctx.process.user_name != null) { ctx.tychon.process.user_name = ctx.process.user_name; }
          if (ctx.process.username != null) { ctx.tychon.process.username = ctx.process.username; }
          if (ctx.process.path != null) { ctx.tychon.process.path = ctx.process.path; }
        }
        if (ctx.server != null && ctx.server instanceof Map && ctx.server.protocol != null) {
          if (ctx.tychon.server == null || !(ctx.tychon.server instanceof Map)) { ctx.tychon.server = [:]; }
          ctx.tychon.server.protocol = ctx.server.protocol;
        }
        if (ctx.observer != null && ctx.observer instanceof Map) {
          if (ctx.tychon.observer == null || !(ctx.tychon.observer instanceof Map)) {
            ctx.tychon.observer = [:];
          }
          for (entry in ctx.observer.entrySet()) {
            ctx.tychon.observer[entry.getKey()] = entry.getValue();
          }
        }
        if (ctx.scan != null) { ctx.tychon.scan = ctx.scan; }
        if (ctx.scan_type != null) {
          if (ctx.tychon.scan == null || !(ctx.tychon.scan instanceof Map)) { ctx.tychon.scan = [:]; }
          ctx.tychon.scan.type_original = ctx.scan_type;
        }
        if (ctx.quantum_ready != null || ctx.quantum_ready_cert != null || ctx.quantum_ready_cipher != null || ctx.quantum_ready_kx != null) {
          if (ctx.tychon.quantum_ready == null || !(ctx.tychon.quantum_ready instanceof Map)) {
            ctx.tychon.quantum_ready = [:];
          }
          if (ctx.quantum_ready != null) { ctx.tychon.quantum_ready.overall = ctx.quantum_ready; }
          if (ctx.quantum_ready_cert != null) { ctx.tychon.quantum_ready.certificate = ctx.quantum_ready_cert; }
          if (ctx.quantum_ready_cipher != null) { ctx.tychon.quantum_ready.cipher = ctx.quantum_ready_cipher; }
          if (ctx.quantum_ready_kx != null) { ctx.tychon.quantum_ready.key_exchange = ctx.quantum_ready_kx; }
          if (ctx.quantum_ready != null) {
            if (ctx.tychon.application == null || !(ctx.tychon.application instanceof Map)) { ctx.tychon.application = [:]; }
            ctx.tychon.application.quantum_ready = ctx.quantum_ready;
          }
        }
        if (ctx.tychon.browser_extension instanceof Map && ctx.tychon.browser_extension.quantum_ready instanceof String && ctx.tychon.browser_extension.quantum_ready.equalsIgnoreCase('n/a')) {
          ctx.tychon.browser_extension.quantum_ready = null;
        }
        if (ctx.hash != null && ctx.hash instanceof Map) {
          if (ctx.hash.sha1_certificate != null) {
            if (ctx.x509 == null || !(ctx.x509 instanceof Map)) { ctx.x509 = [:]; }
            if (ctx.x509.fingerprint_sha1 == null) { ctx.x509.fingerprint_sha1 = ctx.hash.sha1_certificate; }
          }
          if (ctx.hash.sha256_certificate != null) {
            if (ctx.x509 == null || !(ctx.x509 instanceof Map)) { ctx.x509 = [:]; }
            if (ctx.x509.fingerprint_sha256 == null) { ctx.x509.fingerprint_sha256 = ctx.hash.sha256_certificate; }
          }
        }
        if (ctx.x509 != null && ctx.x509 instanceof Map) {
          if (ctx.tychon.x509 == null || !(ctx.tychon.x509 instanceof Map)) { ctx.tychon.x509 = [:]; }
          for (entry in ctx.x509.entrySet()) {
            if (entry.getKey() == 'validity' && entry.getValue() instanceof Map) {
              Map validityCopy = [:];
              for (validityEntry in entry.getValue().entrySet()) {
                validityCopy[validityEntry.getKey()] = validityEntry.getValue();
              }
              ctx.tychon.x509.validity = validityCopy;
            } else {
              ctx.tychon.x509[entry.getKey()] = entry.getValue();
            }
          }
          if (ctx.x509.issuer_cn != null) {
            if (ctx.x509.issuer == null || !(ctx.x509.issuer instanceof Map)) { ctx.x509.issuer = [:]; }
            if (ctx.x509.issuer.common_name == null) { ctx.x509.issuer.common_name = ctx.x509.issuer_cn; }
          }
          if (ctx.x509.issuer_org != null) {
            if (ctx.x509.issuer == null || !(ctx.x509.issuer instanceof Map)) { ctx.x509.issuer = [:]; }
            if (ctx.x509.issuer.organization == null) { ctx.x509.issuer.organization = ctx.x509.issuer_org; }
          }
          if (ctx.x509.subject_cn != null) {
            if (ctx.x509.subject == null || !(ctx.x509.subject instanceof Map)) { ctx.x509.subject = [:]; }
            if (ctx.x509.subject.common_name == null) { ctx.x509.subject.common_name = ctx.x509.subject_cn; }
          }
          if (ctx.x509.subject_org != null) {
            if (ctx.x509.subject == null || !(ctx.x509.subject instanceof Map)) { ctx.x509.subject = [:]; }
            if (ctx.x509.subject.organization == null) { ctx.x509.subject.organization = ctx.x509.subject_org; }
          }
          if (ctx.x509.sig_algorithm != null && ctx.x509.signature_algorithm == null) { ctx.x509.signature_algorithm = ctx.x509.sig_algorithm; }
          if (ctx.x509.key_bits != null && ctx.x509.public_key_size == null) { ctx.x509.public_key_size = ctx.x509.key_bits; }
          if (ctx.x509.key_type != null && ctx.x509.public_key_algorithm == null) { ctx.x509.public_key_algorithm = ctx.x509.key_type; }
          if (ctx.x509.fingerprint_sha256 != null) {
            if (ctx.tychon.hash == null || !(ctx.tychon.hash instanceof Map)) { ctx.tychon.hash = [:]; }
            if (ctx.tychon.hash.sha256 == null) { ctx.tychon.hash.sha256 = ctx.x509.fingerprint_sha256; }
          }
          if (ctx.x509.sha256_fingerprint != null) {
            if (ctx.tychon.hash == null || !(ctx.tychon.hash instanceof Map)) { ctx.tychon.hash = [:]; }
            if (ctx.tychon.hash.sha256 == null) { ctx.tychon.hash.sha256 = ctx.x509.sha256_fingerprint; }
          }
          if (ctx.x509.is_ca != null) { ctx.tychon.x509.is_ca = ctx.x509.is_ca; ctx.x509.remove('is_ca'); }
          if (ctx.x509.is_valid != null) { ctx.tychon.x509.is_valid = ctx.x509.is_valid; ctx.x509.remove('is_valid'); }
          if (ctx.x509.version_number != null) { ctx.tychon.x509.version_number = ctx.x509.version_number; ctx.x509.remove('version_number'); }
          if (ctx.x509.validity != null && ctx.x509.validity instanceof Map) {
            if (ctx.x509.validity.not_after != null) { ctx.tychon.x509.validity.not_after = ctx.x509.validity.not_after; ctx.x509.validity.remove('not_after'); }
            if (ctx.x509.validity.not_before != null) { ctx.tychon.x509.validity.not_before = ctx.x509.validity.not_before; ctx.x509.validity.remove('not_before'); }
          }
          ctx.x509.remove('fingerprint_sha1');
          ctx.x509.remove('fingerprint_sha256');
          ctx.x509.remove('is_self_signed');
          ctx.x509.remove('is_weak_signature');
          ctx.x509.remove('issuer_cn');
          ctx.x509.remove('issuer_org');
          ctx.x509.remove('key_bits');
          ctx.x509.remove('key_type');
          ctx.x509.remove('key_usage');
          ctx.x509.remove('sha256_fingerprint');
          ctx.x509.remove('sig_algorithm');
          ctx.x509.remove('subject_cn');
          ctx.x509.remove('subject_org');
        }
        if (ctx.package != null && ctx.package instanceof Map && ctx.package.install_directory != null) {
          if (ctx.tychon.package == null || !(ctx.tychon.package instanceof Map)) { ctx.tychon.package = [:]; }
          ctx.tychon.package.install_directory = ctx.package.install_directory;
        }
        if (ctx.containsKey('id')) { ctx.remove('id'); }
        if (ctx.containsKey('scan')) { ctx.remove('scan'); }
