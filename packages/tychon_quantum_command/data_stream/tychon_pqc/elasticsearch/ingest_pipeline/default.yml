  - script:
      tag: script_normalize_host_ip_from_literal_dotted_field_or_comma_
      lang: painless
      description: Normalize host.ip from literal dotted field or comma-delimited string.
      source: >
        if (ctx.containsKey('host.ip')) {
          def dottedHostIp = ctx['host.ip'];
          if (dottedHostIp instanceof String && dottedHostIp.contains(',')) {
            List ips = new ArrayList();
            for (String ip : dottedHostIp.splitOnToken(',')) {
              String trimmed = ip.trim();
              if (trimmed.length() > 0) {
                ips.add(trimmed);
              }
            }
            if (ctx.host == null) {
              ctx.host = [:];
            }
            if (ctx.host.ip == null) {
              ctx.host.ip = ips;
            }
          } else if (ctx.host == null) {
            ctx.host = ['ip': dottedHostIp];
          } else if (ctx.host.ip == null) {
            ctx.host.ip = dottedHostIp;
          }
          ctx.remove('host.ip');
        }
        if (ctx?.host?.ip instanceof String && ctx.host.ip.contains(',')) {
          List ips = new ArrayList();
          for (String ip : ctx.host.ip.splitOnToken(',')) {
            String trimmed = ip.trim();
            if (trimmed.length() > 0) {
              ips.add(trimmed);
            }
          }
          ctx.host.ip = ips;
        }

