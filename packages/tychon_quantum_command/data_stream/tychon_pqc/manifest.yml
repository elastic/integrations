title: Tychon Quantum Command
type: logs
streams:
  - input: filestream
    title: Tychon Quantum Command logs
    description: Collect TQC NDJSON output files.
    template_path: stream.yml.hbs
    vars:
      - name: paths
        type: text
        title: Additional paths
        multi: true
        required: false
        show_user: true
        default: []
      - name: windows_paths
        type: text
        title: Windows paths
        multi: true
        required: false
        show_user: true
        default:
          - C:\Program Files\Tychon\*.ndjson
          - C:\ProgramData\Tychon\*.ndjson
      - name: linux_paths
        type: text
        title: Linux paths
        multi: true
        required: false
        show_user: true
        default:
          - /var/log/tychon/*.ndjson
          - /opt/tychon/*.ndjson
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        required: true
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: false
        show_user: true
        default: []
