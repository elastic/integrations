title: Audit Events
type: logs
streams:
  - input: cel
    template_path: cel.yml.hbs
    title: Audit Events
    description: Collect audit events from the CyberArk Identity Security Platform SIEM integration API.
    vars:
      - name: interval
        type: text
        title: Interval
        description: How often to poll the API for new events. Supported units for this parameter are h/m/s. CyberArk asks SIEM clients not to poll more than once a minute.
        default: 5m
        multi: false
        required: true
        show_user: true
      - name: initial_interval
        type: text
        title: Initial Interval
        description: How far back to collect events on the first run, for example `24h`. Supported units for this parameter are h/m/s. The API keeps events for 7 days, so values larger than `168h` are reduced to `168h`.
        default: 24h
        multi: false
        required: true
        show_user: true
      - name: page_size
        type: integer
        title: Page Size
        description: Number of events requested per page (`pageSize`). The maximum is 500. Large pages can fail with a "response size too big" error, so keep the default unless needed.
        default: 100
        multi: false
        required: true
        show_user: false
      - name: resource_rate_limit_limit
        type: text
        title: Resource Rate Limit
        description: Maximum number of API requests per second. CyberArk's partner guide asks for about one stream call a minute between polls, and CyberArk's own SIEM connectors fetch the pages of one poll back to back. The default of one request per second paces pagination without slowing it much. Set it to `0.0167` to make no more than one request a minute.
        default: "1"
        multi: false
        required: true
        show_user: false
      - name: resource_rate_limit_burst
        type: integer
        title: Resource Rate Limit Burst
        description: Maximum number of API requests that can be made immediately after an idle period.
        default: 1
        multi: false
        required: true
        show_user: false
      - name: resource_retry_max_attempts
        type: integer
        title: Resource Retry Max Attempts
        description: Maximum number of retries for an API request that fails with a rate limit (`429`) or server error response. Set it to `1` to turn retries off. Waits between retries grow exponentially from **Resource Retry Wait Min** to **Resource Retry Wait Max**, and follow the `Retry-After` header when CyberArk sends it.
        default: 5
        multi: false
        required: true
        show_user: false
      - name: resource_retry_wait_min
        type: text
        title: Resource Retry Wait Min
        description: Minimum time to wait before a retry. Supported units for this parameter are h/m/s.
        default: 1s
        multi: false
        required: true
        show_user: false
      - name: resource_retry_wait_max
        type: text
        title: Resource Retry Wait Max
        description: Maximum time to wait before a retry. Supported units for this parameter are h/m/s.
        default: 60s
        multi: false
        required: true
        show_user: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported units for this parameter are h/m/s.
        default: 30s
        multi: false
        required: true
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        default: false
        multi: false
        required: false
        show_user: false
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - cyberark_identity_security-audit
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/fleet/current/elastic-agent-processor-configuration.html) for details.
