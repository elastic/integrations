# Mock of the CyberArk Identity Security Platform Audit SIEM integration API.
#
# Served over HTTP for the Audit API (`url`) and over HTTPS (port 443, host
# elastic-audit-test.id.cyberark.cloud) for the CyberArk Identity OAuth2 token endpoint,
# whose URL the integration builds from `identity_id` and `identity_application_id`.
#
# Request flow modelled (system test, interval 2s, page_size 3):
#   round 1: token -> createQuery -> cursor-ref-query
#            results(cursor-ref-query)  -> 3 events, cursor-ref-page-1
#            results(cursor-ref-page-1) -> 3 events, cursor-ref-page-2
#            results(cursor-ref-page-2) -> 0 events, cursor-ref-page-2 (caught up)
#   round 2: results(cursor-ref-page-2) -> 3 new events, cursor-ref-round-2
#            results(cursor-ref-round-2) -> 0 events, cursor-ref-round-2 (caught up)
# Expected hit_count: 9.
#
# Regression guard: a second createQuery returns cursor-ref-regression, whose results
# rule returns an extra event on every call, so the hit count goes above 9 if the
# program drops the stored cursor and creates a new query.
#
# Catch-all guards, not reached in a passing run: any other cursor gives 400 (like the
# real API for a malformed cursor), and requests without valid credentials give 401.
# The cursor-rejection fallback (403 on a stored cursor, new query from
# cursor.last_timestamp) is tested by the script test
# data_stream/audit/_dev/test/scripts/cursor_rejected.txt.
rules:
  # OAuth2 client_credentials token, client credentials in an HTTP Basic header. This is
  # what the CEL input oauth2 client sends. The credentials are percent-encoded before
  # Base64 encoding (RFC 6749 2.3.1); the plain values are
  # 'svc_elastic@cyberark.cloud.1234' and 'p@ss"w/ord\test'.
  - path: /oauth2/token/elastic_audit_app
    methods: ['POST']
    query_params:
      grant_type: client_credentials
      scope: 'isp.audit.events:read'
    request_headers:
      Authorization:
        - '^Basic c3ZjX2VsYXN0aWMlNDBjeWJlcmFyay5jbG91ZC4xMjM0OnAlNDBzcyUyMnclMkZvcmQlNUN0ZXN0$'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {"access_token":"test-access-token","token_type":"Bearer","expires_in":18000,"scope":"isp.audit.events:read"}
  # OAuth2 client_credentials token, client credentials in the form body.
  - path: /oauth2/token/elastic_audit_app
    methods: ['POST']
    query_params:
      grant_type: client_credentials
      scope: 'isp.audit.events:read'
      client_id: 'svc_elastic@cyberark.cloud.1234'
      client_secret: 'p@ss"w/ord\test'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {"access_token":"test-access-token","token_type":"Bearer","expires_in":18000,"scope":"isp.audit.events:read"}
  - path: /oauth2/token/elastic_audit_app
    methods: ['POST']
    responses:
      - status_code: 400
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {"error":"access_denied"}
  # createQuery: open-ended query (dateFrom only) with pageSize 3. The first call starts
  # the stream; any later call is a regression and gets the guard cursor.
  - path: /api/audits/stream/createQuery
    methods: ['POST']
    request_headers:
      Authorization:
        - '^Bearer test-access-token$'
      X-Api-Key:
        - '^test-api-key$'
      Content-Type:
        - '^application/json'
    request_body: '/^\{"query": ?\{("filterModel": ?\{"date": ?\{"dateFrom": ?"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}"\}\}, ?"pageSize": ?3|"pageSize": ?3, ?"filterModel": ?\{"date": ?\{"dateFrom": ?"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}"\}\})\}\}$/'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {"cursorRef":"cursor-ref-query"}
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {"cursorRef":"cursor-ref-regression"}
  # Round 1, page 1.
  - path: /api/audits/stream/results
    methods: ['POST']
    request_headers:
      Authorization:
        - '^Bearer test-access-token$'
      X-Api-Key:
        - '^test-api-key$'
      Content-Type:
        - '^application/json'
    request_body: '/^\{"cursorRef": ?"cursor-ref-query"\}$/'
