---
description: Pipeline for parsing MISP Threat Intel
processors:
  ####################
  # Event ECS fields #
  ####################
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_event_kind_3410a97a
      field: event.kind
      value: enrichment
  - set:
      tag: set_event_category_4675e36d
      field: event.category
      value: [threat]
  - set:
      tag: set_event_type_acbc82af
      field: event.type
      value: [indicator]

  ######################
  # General ECS fields #
  ######################
  - rename:
      tag: rename_message_to_event_original_4217da53
      field: message
      target_field: event.original
      ignore_missing: true
      if: 'ctx.event?.original == null'
      description: 'Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.'
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_74d23cc2
      field: event.original
      target_field: json
  - drop:
      tag: drop_0794aeef
      if: ctx.json?.response != null && ctx.json.response.isEmpty()
  - fingerprint:
      tag: fingerprint_ed4e21d4
      fields:
        - json.Event.timestamp
        - json.Event.Attribute.first_seen
        - json.Event.Attribute.uuid
        - json.Event.Object.Attribute.uuid
      target_field: "_id"
      ignore_missing: true
  - rename:
      tag: rename_json_Event_to_misp_event_0a92f165
      field: json.Event
      target_field: misp.event
      ignore_missing: true
  - set:
      tag: set_threat_indicator_provider_df44d276
      field: threat.indicator.provider
      value: misp
      if: ctx.misp?.event?.Orgc?.local != 'false'
  - set:
      tag: set_threat_indicator_provider_234d29a4
      field: threat.indicator.provider
      value: "{{{misp.event.Orgc.name}}}"
      if: ctx.misp?.event?.Orgc?.local == 'false'
      ignore_empty_value: true

  # Removing fields not needed anymore, either because its copied somewhere else, or is not relevant to this event
  - remove:
      tag: remove_3f0f15ce
      field:
        - misp.event.ShadowAttribute
        - misp.event.RelatedEvent
        - misp.event.Galaxy
        - misp.event.Attribute.Galaxy
        - misp.event.Attribute.ShadowAttribute
        - misp.event.EventReport
        - misp.event.Object.Attribute.Galaxy
        - misp.event.Object.Attribute.ShadowAttribute
        - misp.event.Object.ObjectReference
      ignore_missing: true
  - remove:
      tag: remove_80546d5c
      field:
        - misp.event.Attribute
      ignore_missing: true
      if: 'ctx.misp?.event?.Attribute != null && ctx.misp.event.Attribute.size() == 0'
  - remove:
      tag: remove_cf05e8f1
      field:
        - misp.event.Object
      ignore_missing: true
      if: 'ctx.misp?.event?.Object != null && ctx.misp.event.Object.size() == 0'
  - date:
      field: misp.event.timestamp
      tag: date_event_timestamp_671ebcda
      formats:
        - UNIX
      if: ctx.misp?.event?.timestamp != null
      on_failure:
        - append:
            tag: append_error_message_23f64045
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      tag: date_misp_event_publish_timestamp_to_misp_event_publish_timestamp_5cce1934
      if: ctx.misp?.event?.publish_timestamp != null
      field: misp.event.publish_timestamp
      target_field: misp.event.publish_timestamp
      formats:
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_4a22cde3
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_misp_event_Attribute_to_misp_attribute_c9f735f3
      field: misp.event.Attribute
      target_field: misp.attribute
      ignore_missing: true
  - rename:
      tag: rename_misp_event_Object_to_misp_object_6852cb81
      field: misp.event.Object
      target_field: misp.object
      ignore_missing: true
  - rename:
      tag: rename_misp_object_Attribute_to_misp_object_attribute_ed2c37dc
      field: misp.object.Attribute
      target_field: misp.object.attribute
      ignore_missing: true
  - rename:
      tag: rename_misp_object_meta-category_to_misp_object_meta_category_786ee0bf
      field: misp.object.meta-category
      target_field: misp.object.meta_category
      ignore_missing: true
  - rename:
      tag: rename_misp_event_Orgc_to_misp_orgc_6ca9df56
      field: misp.event.Orgc
      target_field: misp.orgc
      ignore_missing: true
  - rename:
      tag: rename_misp_event_Org_to_misp_org_243bf902
      field: misp.event.Org
      target_field: misp.org
      ignore_missing: true
  - rename:
      tag: rename_misp_event_Tag_to_misp_tag_2269139d
      field: misp.event.Tag
      target_field: misp.tag
      ignore_missing: true

  # # Dance around issue of not being able to split the document into two.
  # # Make the Object.Attribute field primary if it exists, but keep the
  # # outer Attribute as context.
  - rename:
      tag: rename_misp_attribute_to_misp_context_attribute_b1a83dd8
      field: misp.attribute
      target_field: misp.context.attribute
      ignore_missing: true
      if: ctx.misp?.object != null
  - rename:
      tag: rename_misp_object_attribute_to_misp_attribute_a8aeb53b
      field: misp.object.attribute
      target_field: misp.attribute
      ignore_missing: true
      if: ctx.misp?.object != null

  - date:
      field: misp.attribute.timestamp
      target_field: misp.attribute.timestamp
      tag: date_attribute_timestamp_fbfad069
      formats:
        - UNIX
      if: ctx.misp?.attribute?.timestamp != null
      on_failure:
        - remove:
            tag: remove_misp_attribute_timestamp_736ce575
            field: misp.attribute.timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_5217b2e4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: misp.context.attribute.timestamp
      target_field: misp.context.attribute.timestamp
      tag: date_context_attribute_timestamp_3ed53bb9
      formats:
        - UNIX
      if: ctx.misp?.context?.attribute?.timestamp != null
      on_failure:
        - remove:
            tag: remove_misp_context_attribute_timestamp_a604817b
            field: misp.context.attribute.timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_7c7b8565
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: misp.object.timestamp
      target_field: misp.object.timestamp
      tag: date_object_timestamp_6b50d9b6
      formats:
        - UNIX
      if: ctx.misp?.object?.timestamp != null
      on_failure:
        - remove:
            tag: remove_misp_object_timestamp_24bc07a2
            field: misp.object.timestamp
            ignore_missing: true
        - append:
            tag: append_error_message_732a9afb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  #####################
  # Threat ECS Fields #
  #####################
  - set:
      tag: set_threat_feed_name_d3611088
      field: threat.feed.name
      value: "MISP"
  - rename:
      tag: rename_misp_attribute_first_seen_to_threat_indicator_first_seen_b0e7dd0f
      field: misp.attribute.first_seen
      target_field: threat.indicator.first_seen
      ignore_missing: true
  - rename:
      tag: rename_misp_attribute_last_seen_to_threat_indicator_last_seen_5c596f00
      field: misp.attribute.last_seen
      target_field: threat.indicator.last_seen
      ignore_missing: true
  - convert:
      tag: convert_misp_event_analysis_to_threat_indicator_scanner_stats_235fb628
      field: misp.event.analysis
      type: long
      target_field: threat.indicator.scanner_stats
      ignore_missing: true
  - convert:
      tag: convert_misp_event_threat_level_id_dd802192
      field: misp.event.threat_level_id
      type: long
      ignore_missing: true

  ## File/Hash indicator operations
  - set:
      tag: set_threat_indicator_type_9f721f17
      field: threat.indicator.type
      value: file
      if: "ctx.misp?.attribute?.type != null && (['md5', 'impfuzzy', 'imphash', 'pehash', 'sha1', 'sha224', 'sha256', 'sha3-224', 'sha3-256', 'sha3-384', 'sha3-512', 'sha384', 'sha512', 'sha512/224', 'sha512/256', 'ssdeep', 'tlsh', 'vhash'].contains(ctx.misp.attribute.type) || ctx.misp.attribute.type.startsWith('filename'))"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_file_hash_{{{misp_attribute_type}}}_7506cc09
      field: misp.attribute.value
      target_field: "threat.indicator.file.hash.{{{misp.attribute.type}}}"
      ignore_missing: true
      if: "ctx.threat?.indicator?.type == 'file' && ctx.misp?.attribute?.type != null && !ctx.misp.attribute.type.startsWith('filename')"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_file_name_652142ef
      field: misp.attribute.value
      target_field: threat.indicator.file.name
      ignore_missing: true
      if: "ctx.threat?.indicator?.type == 'file' && ctx.misp?.attribute?.type == 'filename'"
  - grok:
      tag: grok_misp_attribute_type_79d2eae4
      field: misp.attribute.type
      patterns:
        - "%{WORD}\\|%{WORD:_tmp.hashtype}"
      ignore_missing: true
      if: ctx.misp?.attribute?.type != null && ctx.misp.attribute.type.startsWith('filename|')
  - grok:
      tag: grok_misp_attribute_value_63cac02f
      field: misp.attribute.value
      patterns:
        - "%{DATA:threat.indicator.file.name}\\|%{GREEDYDATA:_tmp.hashvalue}"
      ignore_missing: true
      if: ctx.misp?.attribute?.type != null && ctx.misp.attribute.type.startsWith('filename|')
  - set:
      tag: set_threat_indicator_file_hash_{{{_tmp_hashtype}}}_4ef75443
      field: threat.indicator.file.hash.{{{_tmp.hashtype}}}
      value: "{{{_tmp.hashvalue}}}"
      if: "ctx.misp?.attribute?.type != null && ctx.misp.attribute.type.startsWith('filename|') && ctx._tmp?.hashvalue != null && ctx._tmp.hashtype != null"

  ## URL/URI indicator operations
  - set:
      tag: set_threat_indicator_type_80d8713c
      field: threat.indicator.type
      value: url
      if: "ctx.misp?.attribute?.type != null && ['url', 'link', 'uri'].contains(ctx.misp.attribute.type)"
  - uri_parts:
      tag: uri_parts_misp_attribute_value_to_threat_indicator_url_509972e5
      field: misp.attribute.value
      target_field: threat.indicator.url
      keep_original: true
      remove_if_successful: true
      if: ctx.threat?.indicator?.type == 'url' && ctx.misp?.attribute?.type != 'uri'
  - set:
      tag: set_threat_indicator_url_full_166095da
      field: threat.indicator.url.full
      value: "{{{threat.indicator.url.original}}}"
      ignore_empty_value: true
      if: "ctx.threat?.indicator?.type == 'url' && ctx.misp?.attribute?.type != 'uri'"

  ## Regkey indicator operations
  - set:
      tag: set_threat_indicator_type_34dcd120
      field: threat.indicator.type
      value: windows-registry-key
      if: "ctx.misp?.attribute?.type != null && ctx.misp.attribute.type.startsWith('regkey')"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_registry_key_655bb339
      field: misp.attribute.value
      target_field: threat.indicator.registry.key
      ignore_missing: true
      if: "ctx.threat?.indicator?.type == 'windows-registry-key' && ctx.misp?.attribute?.type == 'regkey'"
  - grok:
      tag: grok_misp_attribute_value_faee21a7
      field: misp.attribute.value
      patterns:
        - "%{DATA:threat.indicator.registry.key}\\|%{DATA:threat.indicator.registry.value}"
      ignore_missing: true
      if: "ctx.misp?.attribute?.type == 'regkey|value'"

  ## AS indicator operations
  - set:
      tag: set_threat_indicator_type_d6b91b9a
      field: threat.indicator.type
      value: autonomous-system
      if: "ctx.misp?.attribute?.type != null && ctx.misp?.attribute?.type == 'AS'"
  - convert:
      tag: convert_misp_attribute_value_to_threat_indicator_as_number_fd9130ee
      field: misp.attribute.value
      type: long
      target_field: threat.indicator.as.number
      ignore_missing: true
      if: ctx.threat?.indicator?.type == 'autonomous-system'

  ## Domain/IP/Port indicator operations
  - set:
      tag: set_threat_indicator_type_a22246ef
      field: threat.indicator.type
      value: domain-name
      if: "ctx.misp?.attribute?.type != null && (ctx.misp.attribute.type == 'hostname' || ctx.misp.attribute.type.startsWith('domain'))"
  - set:
      tag: set_threat_indicator_type_302ba340
      field: threat.indicator.type
      value: ipv4-addr
      if: "ctx.misp?.attribute?.type != null && ['ip-src', 'ip-src|port', 'ip-dst', 'ip-dst|port'].contains(ctx.misp.attribute.type)"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_url_domain_bb8a8612
      field: misp.attribute.value
      target_field: threat.indicator.url.domain
      ignore_missing: true
      if: "ctx.misp?.attribute?.type != null && ctx.threat?.indicator?.type == 'domain-name' && ctx.misp.attribute.type != 'domain|ip' && ctx.threat?.indicator?.url?.domain == null"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_ip_beab7d2e
      field: misp.attribute.value
      target_field: threat.indicator.ip
      ignore_missing: true
      if: "ctx.misp?.attribute?.type != null && ctx.threat?.indicator?.type == 'ipv4-addr' && !['domain|ip', 'ip-src|port', 'ip-dst|port'].contains(ctx.misp.attribute.type)"
  - grok:
      tag: grok_misp_attribute_value_93161db6
      field: misp.attribute.value
      patterns:
        - "%{DATA:threat.indicator.url.domain}\\|%{IP:threat.indicator.ip}"
      ignore_missing: true
      if: ctx.misp?.attribute?.type == 'domain|ip' && ctx.threat?.indicator?.url?.domain == null
  - grok:
      tag: grok_misp_attribute_value_06611f5a
      field: misp.attribute.value
      patterns:
        - "%{IP:threat.indicator.ip}\\|%{NUMBER:threat.indicator.port}"
      ignore_missing: true
      if: "['ip-src|port', 'ip-dst|port'].contains(ctx.misp?.attribute?.type)"

  ## Email indicator operations
  # Currently this ignores email-message, except setting the type it will leave the rest of the fields under misp.
  - set:
      tag: set_threat_indicator_type_1ee0678a
      field: threat.indicator.type
      value: email-addr
      if: "ctx.misp?.attribute?.type != null && ['email-dst', 'email-src'].contains(ctx.misp.attribute.type)"
  - set:
      tag: set_threat_indicator_type_035835db
      field: threat.indicator.type
      value: email-message
      if: "ctx.misp?.attribute?.type != null && ctx.misp.attribute.type.startsWith('email') && !['email-dst', 'email-src'].contains(ctx.misp.attribute.type)"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_email_address_832fc97e
      field: misp.attribute.value
      target_field: threat.indicator.email.address
      ignore_missing: true
      if: ctx.threat?.indicator?.type == 'email-addr'
  - rename:
      tag: rename_misp_event_event_creator_email_to_user_email_9cfbf9af
      field: misp.event.event_creator_email
      target_field: user.email
      ignore_missing: true
  - append:
      tag: append_user_roles_f6b8b5b3
      field: user.roles
      value: "reporting_user"
      if: ctx.user?.email != null

  ## MAC Address indicator operations
  - set:
      tag: set_threat_indicator_type_bb656e47
      field: threat.indicator.type
      value: mac-addr
      if: "ctx.misp?.attribute?.type != null && ['mac-address', 'mac-eui-64'].contains(ctx.misp.attribute.type)"
  - rename:
      tag: rename_misp_attribute_value_to_threat_indicator_mac_12d58d3b
      field: misp.attribute.value
      target_field: threat.indicator.mac
      ignore_missing: true
      if: ctx.threat?.indicator?.type == 'mac-addr'

  ###################
  # Tags ECS fields #
  ###################
  # Stripping special characters from tags
  - script:
      tag: script_497e7b7f
      lang: painless
      if: ctx.misp?.tag != null
      source: |
        def tags = ctx.misp.tag.stream()
           .map(t -> t.name.replace('\\', '').replace('"', ''))
           .collect(Collectors.toList());
        def tlpTags = tags.stream()
           .filter(t -> t.startsWith('tlp:'))
           .map(t -> t.replace('tlp:', '').toUpperCase())
           .collect(Collectors.toList());

        if (ctx.tags == null) {
          ctx.tags = new ArrayList();
        }
        ctx.tags.addAll(tags);
        ctx.threat.indicator.marking = [ 'tlp': tlpTags ];

  #################
  # Convert types #
  #################
  - convert:
      tag: convert_misp_event_distribution_d39427d4
      field: misp.event.distribution
      type: long
      ignore_missing: true
  - convert:
      tag: convert_misp_object_distribution_aae6e92b
      field: misp.object.distribution
      type: long
      ignore_missing: true
  - convert:
      tag: convert_misp_context_event_distribution_3286ba4a
      field: misp.context.event.distribution
      type: long
      ignore_missing: true
  - convert:
      tag: convert_misp_attribute_distribution_7de75ced
      field: misp.attribute.distribution
      type: long
      ignore_missing: true
  - convert:
      tag: convert_misp_context_attribute_distribution_f8ef5362
      field: misp.context.attribute.distribution
      type: long
      ignore_missing: true
  - convert:
      tag: convert_threat_indicator_port_e0e9ef56
      field: threat.indicator.port
      type: long
      ignore_missing: true
  - convert:
      tag: convert_misp_event_attribute_count_cca6f9ba
      field: misp.event.attribute_count
      type: long
      ignore_missing: true

  ######################
  # Cleanup processors #
  ######################
  - script:
      tag: script_13543eff
      lang: painless
      if: ctx.misp != null
      source: |
        void handleMap(Map map) {
          for (def x : map.values()) {
            if (x instanceof Map) {
                handleMap(x);
            } else if (x instanceof List) {
                handleList(x);
            }
          }
        map.values().removeIf(v -> v == null);
        }
        void handleList(List list) {
          for (def x : list) {
              if (x instanceof Map) {
                  handleMap(x);
              } else if (x instanceof List) {
                  handleList(x);
              }
          }
        }
        handleMap(ctx);
  # Removing fields not needed anymore, either because its copied somewhere else, or is not relevant to this event
  - remove:
      tag: remove_971bd2ce
      field:
        - misp.attribute.value
      ignore_missing: true
      if: ctx.threat?.indicator?.type != null
  - remove:
      tag: remove_1e9118f1
      field:
        - misp.event.Attribute.timestamp
        - misp.event.timestamp
        - misp.tag
        - misp.org
        - misp.event.analysis
        - _tmp
        - json
      ignore_missing: true

on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
