services:
  chargeback:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: chargeback
    ports:
      - 8080
    volumes:
      - ./files:/files:ro
    environment:
      PORT: "8080"
      STREAM_ADDR: ":8080"
    command:
      - http-server
      - --addr=:8080
      - --config=/files/stream-config.yml
