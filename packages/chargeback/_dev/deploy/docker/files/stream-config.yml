rules:
  - path: /api/v1/deployments/_search
    methods: ["POST"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    query_params:
      show_metadata: "true"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
            {
              "match_count": 1,
              "deployments": [
                {
                  "id": "dep-ech-01-wrap",
                  "name": "prod-observability",
                  "metadata": {
                    "tags": [
                      {
                        "key": "chargeback_group",
                        "value": "team-alpha"
                      }
                    ]
                  },
                  "resources": {
                    "elasticsearch": [
                      {
                        "id": "dep-ech-01",
                        "region": "us-east-1",
                        "info": {
                          "metadata": {
                            "service_url": "http://chargeback:8080/ech1"
                          }
                        }
                      }
                    ]
                  }
                }
              ]
            }
          `}}

  - path: /api/v1/serverless/projects/elasticsearch
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    query_params:
      size: "100"
      next_page: "page2"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
            {
              "items": [
                {
                  "id": "proj-sls-02",
                  "name": "serverless-catalog-prod",
                  "region_id": "gcp-us-central1",
                  "endpoints": {
                    "elasticsearch": "http://chargeback:8080/sls2"
                  }
                }
              ],
              "next_page": ""
            }
          `}}

  - path: /api/v1/serverless/projects/elasticsearch
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    query_params:
      size: "100"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
            {
              "items": [
                {
                  "id": "proj-sls-01",
                  "name": "serverless-search-prod",
                  "region_id": "aws-eu-west-1",
                  "endpoints": {
                    "elasticsearch": "http://chargeback:8080/sls1"
                  }
                }
              ],
              "next_page": "page2"
            }
          `}}

  - path: /api/v1/serverless/projects/observability
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    query_params:
      size: "100"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {"items":[],"next_page":""}

  - path: /api/v1/serverless/projects/security
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    query_params:
      size: "100"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {"items":[],"next_page":""}

  - path: /api/v1/billing/organization/1111/line_items
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
            [
              {
                "active": true,
                "type": "prepaid",
                "ecu_balance": 34200,
                "ecu_quantity": 50000,
                "start": "2026-01-01T00:00:00Z",
                "end": "2026-12-31T23:59:59Z"
              }
            ]
          `}}

  - path: /api/v2/billing/organizations/1111/costs/instances
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey cloud-key"
    query_params:
      from: "{from:.+}"
      to: "{to:.+}"
      include_names: "true"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
            {
              "total_ecu": 19.8728,
              "instances": [
                {
                  "id": "dep-ech-01",
                  "name": "prod-observability",
                  "type": "deployment",
                  "total_ecu": 7.3728,
                  "product_line_items": [
                    {
                      "sku": "aws.es.datahot.c6gd_us-east-1_4096_2",
                      "type": "capacity",
                      "kind": "elasticsearch",
                      "total_ecu": 7.3728,
                      "quantity": {
                        "value": 24.0
                      }
                    },
                    {
                      "sku": "aws.data-transfer-in",
                      "type": "data_in",
                      "kind": "",
                      "total_ecu": 0.0,
                      "quantity": {
                        "value": 8.5
                      }
                    }
                  ]
                },
                {
                  "id": "proj-sls-02",
                  "name": "proj-sls-02",
                  "type": "elasticsearch",
                  "total_ecu": 12.5,
                  "product_line_items": [
                    {
                      "sku": "elasticsearch.gcp-search-vcu_gcp-us-central1",
                      "type": "VCU",
                      "kind": "elasticsearch",
                      "total_ecu": 12.5,
                      "quantity": {
                        "value": 50.0
                      }
                    }
                  ]
                }
              ]
            }
          `}}

  - path: /hub/
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey hub-key"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {"cluster_name":"hub-cluster-01"}

  - path: /ech1/{indices}/_stats/{metrics}
    methods: ["GET"]
    request_headers:
      Authorization:
        - "ApiKey ech-key"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
