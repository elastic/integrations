          'ap-northeast-1': ['location': ['lon': 139.6917, 'lat': 35.6895], 'name': 'ap-northeast-1'],
          'aws-ap-northeast-2': ['location': ['lon': 126.9780, 'lat': 37.5665], 'name': 'aws-ap-northeast-2'],
          'aws-ap-east-1': ['location': ['lon': 114.1095, 'lat': 22.3964], 'name': 'aws-ap-east-1'],
          'ap-southeast-1': ['location': ['lon': 103.8198, 'lat': 1.3521], 'name': 'ap-southeast-1'],
          'ap-southeast-2': ['location': ['lon': 151.2093, 'lat': -33.8688], 'name': 'ap-southeast-2'],
          'aws-af-south-1': ['location': ['lon': 18.4241, 'lat': -33.9249], 'name': 'aws-af-south-1'],
          'aws-me-south-1': ['location': ['lon': 55.2708, 'lat': 25.2048], 'name': 'aws-me-south-1'],
          'aws-eu-south-1': ['location': ['lon': 9.1900, 'lat': 45.4642], 'name': 'aws-eu-south-1'],
          'aws-eu-north-1': ['location': ['lon': 18.0686, 'lat': 59.3293], 'name': 'aws-eu-north-1'],
          'aws-eu-central-2': ['location': ['lon': 16.3738, 'lat': 48.2082], 'name': 'aws-eu-central-2'],
          'azure-eastus2': ['location': ['lon': -80.1918, 'lat': 25.7617], 'name': 'azure-eastus2'],
          'azure-eastus': ['location': ['lon': -77.0369, 'lat': 38.9072], 'name': 'azure-eastus'],
          'azure-centralus': ['location': ['lon': -93.2650, 'lat': 44.9778], 'name': 'azure-centralus'],
          'azure-southcentralus': ['location': ['lon': -97.7431, 'lat': 30.2672], 'name': 'azure-southcentralus'],
          'azure-westus2': ['location': ['lon': -122.6765, 'lat': 45.5235], 'name': 'azure-westus2'],
          'azure-northeurope': ['location': ['lon': -6.2603, 'lat': 53.3498], 'name': 'azure-northeurope'],
          'azure-uksouth': ['location': ['lon': -0.1276, 'lat': 51.5074], 'name': 'azure-uksouth'],
          'azure-westeurope': ['location': ['lon': 4.9041, 'lat': 52.3676], 'name': 'azure-westeurope'],
          'azure-francecentral': ['location': ['lon': 2.3522, 'lat': 48.8566], 'name': 'azure-francecentral'],
          'azure-japaneast': ['location': ['lon': 139.6917, 'lat': 35.6895], 'name': 'azure-japaneast'],
          'azure-southeastasia': ['location': ['lon': 103.8198, 'lat': 1.3521], 'name': 'azure-southeastasia'],
          'azure-australiaeast': ['location': ['lon': 151.2093, 'lat': -33.8688], 'name': 'azure-australiaeast'],
          'azure-canadacentral': ['location': ['lon': -75.6972, 'lat': 45.4215], 'name': 'azure-canadacentral'],
          'azure-brazilsouth': ['location': ['lon': -46.6333, 'lat': -23.5505], 'name': 'azure-brazilsouth'],
          'azure-southafricanorth': ['location': ['lon': 28.0473, 'lat': -26.2041], 'name': 'azure-southafricanorth'],
          'azure-centralindia': ['location': ['lon': 77.5946, 'lat': 12.9716], 'name': 'azure-centralindia']
        ];

        def echMatcher = /^(?:Cloud-[A-Za-z]+_)?(aws|gcp|azure|global)\.([^_]+)_([^_]+)_(\d+)_(\d+)$/.matcher(s);
        if (echMatcher.matches()) {
          ctx.cloud.provider = echMatcher.group(1);
          ctx.cloud.machine = ['type': echMatcher.group(2)];
          if (ctx.cloud.region == null || ctx.cloud.region == '') {
            ctx.cloud.region = echMatcher.group(3);
          }
          ctx.ess.billing.ram_per_zone = Long.parseLong(echMatcher.group(4));
          ctx.ess.billing.zone_count = Long.parseLong(echMatcher.group(5));
        } else if (depType == 'onprem' || depType == 'ece' || depType == 'eck' || s == 'onprem_node') {
          ctx.cloud.provider = 'onprem';
        } else if (depType == 'deployment') {
          ctx.cloud.provider = s.startsWith('aws.') ? 'aws' : (s.startsWith('gcp.') ? 'gcp' : (s.startsWith('azure.') ? 'azure' : 'cloud'));
        } else {
          ctx.cloud.provider = 'serverless';
          def slsMatcher = /^[^.]+\.([^_]+)(?:_(.+))?$/.matcher(s);
          if (slsMatcher.matches()) {
            ctx.ess.billing.cloud = ['service': ['type': slsMatcher.group(1)]];
            if ((ctx.cloud.region == null || ctx.cloud.region == '') && slsMatcher.group(2) != null && regionGeo.containsKey(slsMatcher.group(2))) {
              ctx.cloud.region = slsMatcher.group(2);
            }
          }
        }

        String reg = ctx.cloud.region;
        if (reg != null && regionGeo.containsKey(reg)) {
          ctx.cloud.geo = regionGeo[reg];
        } else {
          ctx.cloud.geo = ['name': (reg != null && reg != '') ? reg : 'unknown', 'location': ['lon': 135.0, 'lat': 90.0]];
        }

        for (String tmp : ['quantity_value', 'organization_id', 'deployment_type', 'billing_type', 'billing_kind', 'cloud_region']) {
          ctx.remove(tmp);
        }
  - set:
      field: cost_type
      value: 'data-transfer'
      if: ctx.sku =~ /^(aws|gcp|azure).data-transfer.*/
  - set:
      field: cost_type
      value: 'snapshots'
      if: ctx.sku =~ /^(aws|gcp|azure).snapshot-storage.*/
  - set:
      field: cost_type
      value: 'inference'
      if: ctx.sku == 'global.inference-chat-input'
  - grok:
      field: sku
      ignore_failure: true
      patterns:
        - "%{WORD}.es.%{WORD:cost_type}.%{GREEDYDATA}"
        - "%{WORD}.%{DATA:cost_type}-vcu_%{GREEDYDATA}"
        - "%{WORD}.%{WORD:cost_type}.%{GREEDYDATA}"
        - "%{WORD}.%{DATA:cost_type}.%{GREEDYDATA}"
      description: retrieve a human readable cost type from the sku field
      if: ctx.cost_type == null
  - set:
      field: cost_type
      value: 'datahot/datacontent'
      if: ctx.cost_type == 'datahot' || ctx.cost_type == 'datacontent'
  - set:
      field: cost_type
      value: 'onprem'
      if: ctx.sku == 'onprem_node'
  - script:
      ignore_failure: true
      lang: painless
      description: |
        cost_category: data_tier | platform | transfer | snapshot | support | onprem | other
        is_allocatable: true for ECH data_tier SKUs, Serverless workload/retained SKUs, and onprem_node (matches billing_realized_pool)
      source: |
        if (ctx.sku == 'onprem_node' || ctx.cost_type == 'onprem') {
          ctx.cost_category = 'onprem';
          ctx.is_allocatable = true;
          return;
        }
        if (ctx.cost_type == 'data-transfer') {
          ctx.cost_category = 'transfer';
          ctx.is_allocatable = false;
          return;
        }
        if (ctx.cost_type == 'snapshots') {
          ctx.cost_category = 'snapshot';
          ctx.is_allocatable = false;
          return;
        }
        String sku = ctx.sku != null ? ctx.sku.toString() : '';
        String depType = ctx.ess?.billing?.deployment_type != null ? ctx.ess.billing.deployment_type.toString() : '';
        if (sku != '') {
          if (sku.contains('.es.datahot.') || sku.contains('.es.datawarm.')
              || sku.contains('.es.datacold.') || sku.contains('.es.datafrozen.')
              || sku.contains('.es.datacontent.')) {
            ctx.cost_category = 'data_tier';
            ctx.is_allocatable = true;
            return;
          }
          if (sku.startsWith('serverless.support-') || sku.contains('support')) {
            if (sku.startsWith('serverless.support-')) {
              ctx.cost_type = 'serverless_premium_support';
            }
            ctx.cost_category = 'support';
            ctx.is_allocatable = false;
            return;
          }
          if (sku.contains('data-transfer') || sku.contains('data-out') || sku.contains('data-in') || sku.contains('egress') || sku.contains('ingress')) {
            ctx.cost_category = 'transfer';
            ctx.is_allocatable = false;
            return;
          }
          if (sku.contains('snapshot')) {
            ctx.cost_category = 'snapshot';
            ctx.is_allocatable = false;
            return;
          }
          if (sku.contains('ml-vcu') || sku.contains('.es.ml.') || sku.contains('synthetic')
              || sku.contains('inference') || sku.contains('llm') || sku.contains('agent-builder')
              || sku.contains('.eis') || sku.contains('workflow') || sku.contains('cross-project')) {
            ctx.cost_category = 'platform';
            ctx.is_allocatable = false;
            return;
          }
          // Serverless workload & storage pool across elasticsearch, observability, security, vectordb (matches billing_realized_pool)
          boolean isSlsProject = (depType == 'elasticsearch' || depType == 'observability' || depType == 'security' || depType == 'vectordb');
          boolean isSlsAllocSku = (
            sku.contains('search-vcu') || sku.contains('ingest-vcu')
            || sku.contains('retained') || sku.contains('retention')
            || sku.startsWith('observability.') || sku.contains('.observability.')
            || sku.startsWith('security.') || sku.contains('.security.')
            || sku.startsWith('vectordb.') || sku.contains('.vectordb.')
          );
          if (isSlsProject && isSlsAllocSku) {
            ctx.cost_category = 'data_tier';
            ctx.is_allocatable = true;
            return;
          }
        }
        if (ctx.cost_type != null) {
          if (ctx.cost_type == 'ml' || ctx.cost_type == 'kibana' || ctx.cost_type == 'apm'
              || ctx.cost_type == 'enterprise_search' || ctx.cost_type == 'enterprisesearch'
              || ctx.cost_type == 'integrations_server' || ctx.cost_type == 'integrationsserver') {
            ctx.cost_category = 'platform';
            ctx.is_allocatable = false;
            return;
          }
        }
        ctx.cost_category = 'other';
        ctx.is_allocatable = false;
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      description: '[Fleet] Global pipeline for all data streams'
      ignore_missing_pipeline: true
      name: global@custom
  - pipeline:
      description: '[Fleet] Pipeline for all data streams of type `metrics`'
      ignore_missing_pipeline: true
      name: metrics@custom
  - pipeline:
      description: '[Fleet] Pipeline for all data streams of type `metrics` defined by the `chargeback` integration'
      ignore_missing_pipeline: true
      name: metrics-chargeback.integration@custom
  - pipeline:
      description: '[Fleet] Pipeline for the `chargeback.billing` dataset'
      ignore_missing_pipeline: true
      name: metrics-chargeback.billing@custom
