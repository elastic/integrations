---
description: "Chargeback: Set composite_key from @timestamp and deployment_id, extract cost_type/cost_category, and populate ESS Billing compatibility fields."
processors:
  - script:
      ignore_failure: true
      lang: painless
      tag: ess_billing
      source: |
        Map chosen = ctx;
        if (ctx.native instanceof Map && ctx.native.doc_cnt instanceof Number && ((Number)ctx.native.doc_cnt).longValue() > 0L) {
          chosen = ctx.native;
        } else if (ctx.legacy instanceof Map) {
          chosen = ctx.legacy;
        }
        if (chosen != ctx) {
          for (String k : ['total_chargeable_units', 'quantity_value', 'deployment_group', 'deployment_name', 'organization_id', 'deployment_type', 'billing_type', 'billing_kind', 'cloud_region']) {
            if (chosen.containsKey(k)) {
              ctx[k] = chosen[k];
            }
          }
        }
        ctx.remove('native');
        ctx.remove('legacy');

        // Unwrap optional transform terms-aggregation buckets
        for (String fn : ['deployment_group', 'deployment_name', 'organization_id', 'deployment_type', 'billing_type', 'billing_kind', 'cloud_region']) {
          def v = ctx[fn];
          if (v instanceof Map) {
            def b = v.buckets;
            if (b instanceof List && b.size() > 0) {
              ctx[fn] = b[0].key_as_string != null ? b[0].key_as_string : b[0].key;
            } else {
              def ks = new ArrayList(v.keySet());
              ctx[fn] = ks.size() > 0 ? ks[0] : null;
            }
          }
        }

        if (ctx.deployment_group == null) {
          ctx.deployment_group = '';
        } else {
          ctx.deployment_group = ctx.deployment_group.toString();
        }
        if (ctx.deployment_name == null || ctx.deployment_name.toString() == '') {
          ctx.deployment_name = ctx.deployment_id != null ? ctx.deployment_id.toString() : 'unknown';
        } else {
          ctx.deployment_name = ctx.deployment_name.toString();
        }

        if (ctx['@timestamp'] != null && ctx.deployment_id != null) {
          def rawTs = ctx['@timestamp'];
          String dateStr = (rawTs instanceof Number)
            ? Instant.ofEpochMilli(((Number)rawTs).longValue()).atZone(ZoneOffset.UTC).toLocalDate().toString()
            : ZonedDateTime.parse(rawTs.toString()).toLocalDate().toString();
          ctx.composite_key = dateStr + '_' + ctx.deployment_id;
        }

        // Populate ESS Billing compatibility fields
        ctx.data_stream = ['type': 'metrics', 'dataset': 'ess_billing.billing', 'namespace': 'default'];
        if (ctx.event == null) { ctx.event = [:]; }
        ctx.event.dataset = 'ess_billing.billing';

        String s = ctx.sku != null ? ctx.sku.toString() : '';
        String orgId = (ctx.organization_id != null && ctx.organization_id != '') ? ctx.organization_id.toString() : 'unknown';
        String depName = ctx.deployment_name;
        String depType = (ctx.deployment_type != null && ctx.deployment_type != '')
          ? ctx.deployment_type.toString()
          : (s == 'onprem_node' ? 'onprem' : ((s.startsWith('elasticsearch.') || s.startsWith('observability.') || s.startsWith('security.') || s.startsWith('vectordb.') || s.startsWith('serverless.')) ? 'elasticsearch' : 'deployment'));

        if (ctx.ess == null) { ctx.ess = [:]; }
        if (ctx.ess.billing == null) { ctx.ess.billing = [:]; }
        ctx.ess.billing.organization_id = orgId;
        ctx.ess.billing.deployment_id = ctx.deployment_id;
        ctx.ess.billing.deployment_name = depName;
        ctx.ess.billing.deployment_type = depType;
        ctx.ess.billing.sku = ctx.sku;
        ctx.ess.billing.total_ecu = ctx.total_chargeable_units instanceof Number ? ((Number)ctx.total_chargeable_units).doubleValue() : 0.0;
        ctx.ess.billing.quantity = ['value': ctx.quantity_value instanceof Number ? ((Number)ctx.quantity_value).doubleValue() : 0.0];
        if (ctx.billing_kind != null && ctx.billing_kind != '') {
          ctx.ess.billing.kind = ctx.billing_kind.toString();
        } else if (s.contains('.es.')) {
          ctx.ess.billing.kind = 'elasticsearch';
        }

        String btype = (ctx.billing_type != null && ctx.billing_type != '') ? ctx.billing_type.toString() : '';
        if (btype == '') {
          if (s.contains('data-out') || s.contains('data-transfer-out') || s.contains('egress')) {
            btype = 'data_out';
          } else if (s.contains('data-in') || s.contains('data-transfer-in') || s.contains('ingress')) {
            btype = 'data_in';
          } else if (s.contains('snapshot') || s.contains('retained') || s.contains('storage')) {
            btype = 'storage';
          } else if (s.contains('support')) {
            btype = 'support';
          } else if (s.contains('.es.') || s.contains('.kibana.') || s.contains('.apm.') || s.contains('.integrationsserver.') || s.contains('.enterprisesearch.') || s.contains('vcu') || s.contains('complete')) {
            btype = 'capacity';
          } else {
            btype = 'usage';
          }
        }
        ctx.ess.billing.type = btype;

        ctx.cloud = [
          'account': ['id': orgId],
          'instance': ['id': ctx.deployment_id, 'name': depName]
        ];
        if (ctx.cloud_region != null && ctx.cloud_region != '') {
          ctx.cloud.region = ctx.cloud_region.toString();
        }

        Map regionGeo = [
          'gcp-us-central1': ['location': ['lon': -93.2650, 'lat': 44.9778], 'name': 'gcp-us-central1'],
          'gcp-us-east4': ['location': ['lon': -80.1918, 'lat': 25.7617], 'name': 'gcp-us-east4'],
          'gcp-us-west1': ['location': ['lon': -122.4194, 'lat': 37.7749], 'name': 'gcp-us-west1'],
          'gcp-us-west2': ['location': ['lon': -118.2437, 'lat': 34.0522], 'name': 'gcp-us-west2'],
          'gcp-us-east1': ['location': ['lon': -77.0369, 'lat': 38.9072], 'name': 'gcp-us-east1'],
          'gcp-northamerica-northeast1': ['location': ['lon': -73.6148, 'lat': 45.5059], 'name': 'gcp-northamerica-northeast1'],
          'gcp-southamerica-east1': ['location': ['lon': -46.6333, 'lat': -23.5505], 'name': 'gcp-southamerica-east1'],
          'gcp-europe-west1': ['location': ['lon': -6.2603, 'lat': 53.3498], 'name': 'gcp-europe-west1'],
          'gcp-europe-west2': ['location': ['lon': -0.1276, 'lat': 51.5074], 'name': 'gcp-europe-west2'],
          'gcp-europe-west3': ['location': ['lon': 11.5820, 'lat': 48.1351], 'name': 'gcp-europe-west3'],
          'gcp-europe-west4': ['location': ['lon': 19.0402, 'lat': 47.4979], 'name': 'gcp-europe-west4'],
          'gcp-europe-north1': ['location': ['lon': 24.9458, 'lat': 60.1921], 'name': 'gcp-europe-north1'],
          'gcp-asia-east1': ['location': ['lon': 121.5654, 'lat': 25.0330], 'name': 'gcp-asia-east1'],
          'gcp-asia-northeast1': ['location': ['lon': 139.6917, 'lat': 35.6895], 'name': 'gcp-asia-northeast1'],
          'gcp-asia-south1': ['location': ['lon': 72.8777, 'lat': 19.0760], 'name': 'gcp-asia-south1'],
          'gcp-asia-southeast1': ['location': ['lon': 103.8198, 'lat': 1.3521], 'name': 'gcp-asia-southeast1'],
          'gcp-australia-southeast1': ['location': ['lon': 151.2093, 'lat': -33.8688], 'name': 'gcp-australia-southeast1'],
          'gcp-asia-northeast3': ['location': ['lon': 126.9780, 'lat': 37.5665], 'name': 'gcp-asia-northeast3'],
          'gcp-asia-southeast2': ['location': ['lon': 106.8650, 'lat': -6.2088], 'name': 'gcp-asia-southeast2'],
          'gcp-europe-west9': ['location': ['lon': 4.9041, 'lat': 52.3676], 'name': 'gcp-europe-west9'],
          'gcp-me-west1': ['location': ['lon': 34.8516, 'lat': 31.0461], 'name': 'gcp-me-west1'],
          'aws-us-east-2': ['location': ['lon': -82.9988, 'lat': 39.9612], 'name': 'aws-us-east-2'],
          'aws-us-east-1': ['location': ['lon': -77.0369, 'lat': 38.9072], 'name': 'aws-us-east-1'],
          'us-east-1': ['location': ['lon': -77.0369, 'lat': 38.9072], 'name': 'us-east-1'],
          'aws-eu-west-1': ['location': ['lon': -6.2603, 'lat': 53.3498], 'name': 'aws-eu-west-1'],
          'eu-west-1': ['location': ['lon': -6.2603, 'lat': 53.3498], 'name': 'eu-west-1'],
          'aws-us-west-1': ['location': ['lon': -122.4194, 'lat': 37.7749], 'name': 'aws-us-west-1'],
          'us-west-1': ['location': ['lon': -122.4194, 'lat': 37.7749], 'name': 'us-west-1'],
          'aws-us-west-2': ['location': ['lon': -122.6765, 'lat': 45.5235], 'name': 'aws-us-west-2'],
          'us-west-2': ['location': ['lon': -122.6765, 'lat': 45.5235], 'name': 'us-west-2'],
          'aws-ca-central-1': ['location': ['lon': -75.6972, 'lat': 45.4215], 'name': 'aws-ca-central-1'],
