---
description: 'Chargeback: Set correlation keys, blended calculation labels, and monitoring-indices compatibility fields.'
processors:
  - script:
      ignore_failure: true
      lang: painless
      source: |
        Map chosen = ctx;
        if (ctx.native instanceof Map && ctx.native.doc_cnt instanceof Number && ((Number)ctx.native.doc_cnt).longValue() > 0L) {
          chosen = ctx.native;
        } else if (ctx.legacy instanceof Map) {
          chosen = ctx.legacy;
        }
        if (chosen != ctx) {
          for (def entry : chosen.entrySet()) {
            String k = entry.getKey().toString();
            if (k != 'doc_cnt') {
              ctx[k] = entry.getValue();
            }
          }
        }
        ctx.remove('native');
        ctx.remove('legacy');

        if (ctx.cluster_name != null) {
          ctx.deployment_id = ctx.cluster_name;
        } else if (ctx.elasticsearch?.cluster?.name != null) {
          ctx.deployment_id = ctx.elasticsearch.cluster.name;
        }
        long bucketTsMillis = -1L;
        if (ctx['@timestamp'] != null && ctx.deployment_id != null) {
          def rawTs = ctx['@timestamp'];
          Instant tsInst = (rawTs instanceof Number)
            ? Instant.ofEpochMilli(((Number)rawTs).longValue())
            : ZonedDateTime.parse(rawTs.toString()).toInstant();
          bucketTsMillis = tsInst.toEpochMilli();
          String date = tsInst.atZone(ZoneOffset.UTC).toLocalDate().toString();
          ctx.composite_key = date + '_' + ctx.deployment_id;

          if (ctx.tier != null) {
            ctx.composite_tier_key = ctx.composite_key + '_' + ctx.tier.replace('/', '_');
          }

          if (ctx.datastream != null) {
            ctx.composite_datastream_key = ctx.composite_key + '_' + ctx.datastream;
          }
        }

        // Parse Fleet data stream naming: <type>-<dataset>-<namespace>
        // first segment -> ds_type; last segment -> ds_namespace; else other
        if (ctx.datastream != null && ctx.datastream != '') {
          def parts = ctx.datastream.splitOnToken('-');
          if (parts.length >= 2) {
            ctx.ds_type = parts[0];
            ctx.ds_namespace = parts[parts.length - 1];
          } else {
            ctx.ds_type = 'other';
            ctx.ds_namespace = 'other';
          }
        } else {
          ctx.ds_type = 'other';
          ctx.ds_namespace = 'other';
        }

        // Populate Elasticsearch Consumption (monitoring-indices) compatibility fields on tier_and_datastream rows
        if (ctx.tier_and_datastream_sum_store_size != null && ctx.datastream != null && ctx.datastream != '') {
          String displayCluster = ctx.cluster_name != null ? ctx.cluster_name.toString() : 'unknown';
          if (ctx.cluster_display_name instanceof Map) {
            def cb = ctx.cluster_display_name.buckets;
            if (cb instanceof List && cb.size() > 0 && cb[0].key != null && cb[0].key != '') {
              displayCluster = cb[0].key.toString();
            } else {
              def ks = new ArrayList(ctx.cluster_display_name.keySet());
              if (ks.size() > 0 && ks[0] != null && ks[0] != '') {
                displayCluster = ks[0].toString();
              }
            }
          } else if (ctx.cluster_display_name != null && ctx.cluster_display_name != '') {
            displayCluster = ctx.cluster_display_name.toString();
          }

          long storeBytes = ctx.tier_and_datastream_sum_store_size instanceof Number ? ((Number)ctx.tier_and_datastream_sum_store_size).longValue() : 0L;
          long dsBytes = ctx.tier_and_datastream_sum_data_set_store_size instanceof Number ? ((Number)ctx.tier_and_datastream_sum_data_set_store_size).longValue() : storeBytes;
          long idxTime = ctx.tier_and_datastream_sum_indexing_time instanceof Number ? ((Number)ctx.tier_and_datastream_sum_indexing_time).longValue() : 0L;
          long qryTime = ctx.tier_and_datastream_sum_query_time instanceof Number ? ((Number)ctx.tier_and_datastream_sum_query_time).longValue() : 0L;
          long docsCnt = ctx.tier_and_datastream_sum_docs_count instanceof Number ? ((Number)ctx.tier_and_datastream_sum_docs_count).longValue() : 0L;
          long qryCnt = ctx.tier_and_datastream_sum_query_total instanceof Number ? ((Number)ctx.tier_and_datastream_sum_query_total).longValue() : 0L;
          long deltaCount = ctx.delta_doc_count instanceof Number ? ((Number)ctx.delta_doc_count).longValue() : 0L;

          Map docsMap = ['count': docsCnt];
          Map priStoreMap = ['total_data_set_size_in_bytes': dsBytes];
          Map indexingMap = ['index_time_in_millis': idxTime];
          Map searchMap = [
            'query_time_in_millis': qryTime,
            'query_total': qryCnt
          ];

          if (deltaCount > 0L) {
            if (ctx.sum_docs_delta instanceof Number) {
              docsMap['count_delta'] = ((Number)ctx.sum_docs_delta).longValue();
            }
            if (ctx.sum_dset_delta instanceof Number) {
              priStoreMap['total_data_set_size_in_bytes_delta'] = ((Number)ctx.sum_dset_delta).longValue();
            }
            if (ctx.sum_idx_time_delta instanceof Number) {
              indexingMap['index_time_in_millis_delta'] = ((Number)ctx.sum_idx_time_delta).longValue();
            }
            if (ctx.sum_qry_time_delta instanceof Number) {
              searchMap['query_time_in_millis_delta'] = ((Number)ctx.sum_qry_time_delta).longValue();
            }
            if (ctx.sum_qry_total_delta instanceof Number) {
              searchMap['query_total_delta'] = ((Number)ctx.sum_qry_total_delta).longValue();
            }
          }

          Map indexMap = [
            'name': ctx.datastream,
            'datastream': ctx.datastream,
            'tier': ctx.tier != null ? ctx.tier : 'hot/content',
            'primaries': [
              'docs': docsMap,
              'store': priStoreMap
            ],
            'total': [
              'store': [
                'size_in_bytes': storeBytes
              ],
              'indexing': indexingMap,
              'search': searchMap
            ]
          ];

          def rawMinCdate = ctx.min_creation_date;
          if (rawMinCdate instanceof Map) {
            rawMinCdate = rawMinCdate.value_as_string != null ? rawMinCdate.value_as_string : rawMinCdate.value;
          }
          if (rawMinCdate != null && rawMinCdate.toString() != '') {
            try {
              long createdMillis = (rawMinCdate instanceof Number)
                ? ((Number)rawMinCdate).longValue()
                : ZonedDateTime.parse(rawMinCdate.toString()).toInstant().toEpochMilli();
              indexMap['creation_date'] = Instant.ofEpochMilli(createdMillis).toString();
              if (bucketTsMillis > 0L) {
                long ageDays = (bucketTsMillis - createdMillis) / 86400000L;
                indexMap['age'] = ageDays > 0L ? ageDays : 0L;
              }
            } catch (Exception e) {}
          }

          ctx.elasticsearch = [
            'cluster': [
              'name': displayCluster
            ],
            'index': indexMap
          ];
          for (String tmp : ['cluster_display_name', 'tier_and_datastream_sum_docs_count', 'tier_and_datastream_sum_query_total', 'min_creation_date', 'delta_doc_count', 'sum_docs_delta', 'sum_dset_delta', 'sum_idx_time_delta', 'sum_qry_time_delta', 'sum_qry_total_delta']) {
            ctx.remove(tmp);
          }
        }
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      description: '[Fleet] Global pipeline for all data streams'
      ignore_missing_pipeline: true
      name: global@custom
  - pipeline:
      description: '[Fleet] Pipeline for all data streams of type `metrics`'
      ignore_missing_pipeline: true
      name: metrics@custom
  - pipeline:
      description: '[Fleet] Pipeline for all data streams of type `metrics` defined by the `chargeback` integration'
      ignore_missing_pipeline: true
      name: metrics-chargeback.integration@custom
  - pipeline:
      description: '[Fleet] Pipeline for the `chargeback.usage` dataset'
      ignore_missing_pipeline: true
      name: metrics-chargeback.usage@custom
