---
description: 'Chargeback: Set correlation keys, full-day source selection tags, and blended calculation labels.'
processors:
  - script:
      ignore_failure: true
      lang: painless
      source: |
        // Select "native" vs "legacy" for the day, retaining legacy when both exist on a partial
        // cutover day until native delta-bearing samples cover the legacy day window.
        Map nat = ctx.native instanceof Map ? (Map)ctx.native : null;
        Map leg = ctx.legacy instanceof Map ? (Map)ctx.legacy : null;
        long natCnt = (nat != null && nat.doc_cnt instanceof Number) ? ((Number)nat.doc_cnt).longValue() : 0L;
        long legCnt = (leg != null && leg.doc_cnt instanceof Number) ? ((Number)leg.doc_cnt).longValue() : 0L;

        long natDeltaCnt = 0L;
        long natMinDeltaTs = -1L;
        long natMaxDeltaTs = -1L;
        if (nat != null && nat.has_delta instanceof Map) {
          Map hd = (Map)nat.has_delta;
          if (hd.cnt instanceof Number) {
            natDeltaCnt = ((Number)hd.cnt).longValue();
          }
          for (String tk : ['min_ts', 'max_ts']) {
            def rv = hd.get(tk);
            if (rv instanceof Map) {
              rv = rv.value != null ? rv.value : rv.value_as_string;
            }
            if (rv != null && rv.toString() != '') {
              try {
                long parsedMs = (rv instanceof Number)
                  ? ((Number)rv).longValue()
                  : ZonedDateTime.parse(rv.toString()).toInstant().toEpochMilli();
                if (tk == 'min_ts') { natMinDeltaTs = parsedMs; } else { natMaxDeltaTs = parsedMs; }
              } catch (Exception e) {}
            }
          }
        }

        long legMinTs = -1L;
        long legMaxTs = -1L;
        if (leg != null) {
          for (String tk : ['min_ts', 'max_ts']) {
            def rv = leg.get(tk);
            if (rv instanceof Map) {
              rv = rv.value != null ? rv.value : rv.value_as_string;
            }
            if (rv != null && rv.toString() != '') {
              try {
                long parsedMs = (rv instanceof Number)
                  ? ((Number)rv).longValue()
                  : ZonedDateTime.parse(rv.toString()).toInstant().toEpochMilli();
                if (tk == 'min_ts') { legMinTs = parsedMs; } else { legMaxTs = parsedMs; }
              } catch (Exception e) {}
            }
          }
        }

        for (String pfx : ['tier', 'datastream', 'tier_and_datastream']) {
          if ((nat != null && nat.containsKey(pfx + '_sum_store_size')) || (leg != null && leg.containsKey(pfx + '_sum_store_size'))) {
            ctx.has_native_usage = natCnt > 0L;
            ctx.has_legacy_usage = legCnt > 0L;
            for (String m : ['sum_indexing_time', 'sum_query_time', 'sum_store_size', 'sum_data_set_store_size']) {
              def nv = (nat != null) ? nat.get(pfx + '_' + m) : null;
              def lv = (leg != null) ? leg.get(pfx + '_' + m) : null;
              ctx['native_' + m] = (nv instanceof Number) ? ((Number)nv).longValue() : 0L;
              ctx['legacy_' + m] = (lv instanceof Number) ? ((Number)lv).longValue() : 0L;
            }
          }
        }

        boolean chooseNative = false;
        if (natCnt > 0L && legCnt <= 0L) {
          chooseNative = true;
        } else if (natCnt > 0L && legCnt > 0L) {
          if (natDeltaCnt > 0L && natMinDeltaTs > 0L && legMinTs > 0L
              && natMinDeltaTs <= (legMinTs + 3900000L)
              && (legMaxTs <= 0L || natMaxDeltaTs >= (legMaxTs - 3900000L))) {
            chooseNative = true;
          }
        }

        Map chosen = ctx;
        if (chooseNative && nat != null) {
          chosen = nat;
          ctx.usage_source = 'native';
        } else if (leg != null && legCnt > 0L) {
          chosen = leg;
          ctx.usage_source = 'legacy';
        } else if (nat != null && natCnt > 0L) {
          chosen = nat;
          ctx.usage_source = 'native';
        } else if (ctx.usage_source == null) {
          ctx.usage_source = 'legacy';
        }
        if (chosen != ctx) {
          for (def entry : chosen.entrySet()) {
            String k = entry.getKey().toString();
            if (k != 'doc_cnt' && k != 'has_delta' && k != 'min_ts' && k != 'max_ts') {
              ctx[k] = entry.getValue();
            }
          }
        }
        ctx.remove('native');
        ctx.remove('legacy');

        if (ctx.cluster_name != null) {
          ctx.deployment_id = ctx.cluster_name;
        } else if (ctx.elasticsearch?.cluster?.name != null) {
          ctx.deployment_id = ctx.elasticsearch.cluster.name;
        }
        if (ctx['@timestamp'] != null && ctx.deployment_id != null) {
          def rawTs = ctx['@timestamp'];
          Instant tsInst = (rawTs instanceof Number)
            ? Instant.ofEpochMilli(((Number)rawTs).longValue())
            : ZonedDateTime.parse(rawTs.toString()).toInstant();
          String date = tsInst.atZone(ZoneOffset.UTC).toLocalDate().toString();
          ctx.composite_key = date + '_' + ctx.deployment_id;

          if (ctx.tier != null) {
            ctx.composite_tier_key = ctx.composite_key + '_' + ctx.tier.replace('/', '_');
          }

          if (ctx.datastream != null) {
            ctx.composite_datastream_key = ctx.composite_key + '_' + ctx.datastream;
          }
        }

        // Parse Fleet data stream naming: <type>-<dataset>-<namespace>
        // first segment -> ds_type; last segment -> ds_namespace; else other
        if (ctx.datastream != null && ctx.datastream != '') {
          def parts = ctx.datastream.splitOnToken('-');
          if (parts.length >= 2) {
            ctx.ds_type = parts[0];
            ctx.ds_namespace = parts[parts.length - 1];
          } else {
            ctx.ds_type = 'other';
            ctx.ds_namespace = 'other';
          }
        } else {
          ctx.ds_type = 'other';
          ctx.ds_namespace = 'other';
        }
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      description: '[Fleet] Global pipeline for all data streams'
      ignore_missing_pipeline: true
      name: global@custom
  - pipeline:
      description: '[Fleet] Pipeline for all data streams of type `metrics`'
      ignore_missing_pipeline: true
      name: metrics@custom
  - pipeline:
      description: '[Fleet] Pipeline for all data streams of type `metrics` defined by the `chargeback` integration'
      ignore_missing_pipeline: true
      name: metrics-chargeback.integration@custom
  - pipeline:
      description: '[Fleet] Pipeline for the `chargeback.usage` dataset'
      ignore_missing_pipeline: true
      name: metrics-chargeback.usage@custom
