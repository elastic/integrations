---
description: Post-process chargeback configuration from Fleet configuration snapshot events while preserving manual or historical rows when Fleet sync is inactive
processors:
  - script:
      description: Gate on newest policy-wide sync marker, merge active per-stream settings, and reject invalid configuration writes
      lang: painless
      source: |
        // Pass manual operator documents (without transform 'snapshots' aggregation output) straight through
        // because Fleet configures this pipeline as index.default_pipeline on chargeback_lookup.chargeback_conf.
        if (!ctx.containsKey('snapshots')) {
          String manualKey = ctx.config_join_key != null ? ctx.config_join_key.toString().trim() : '';
          String manualRowId = ctx.conf_row_id != null ? ctx.conf_row_id.toString().trim() : '';
          if ('chargeback_config_onprem'.equalsIgnoreCase(manualKey) || (manualKey == '' && 'config_onprem'.equalsIgnoreCase(manualRowId))) {
            ctx.config_join_key = 'chargeback_config_onprem';
          } else if (manualKey == '' || 'chargeback_config'.equalsIgnoreCase(manualKey)) {
            ctx.config_join_key = 'chargeback_config';
          } else {
            ctx.config_join_key = manualKey;
          }
          ctx.remove('conf_row_id');
          if (ctx.conf_chargeable_unit_rate_unit != null) {
            String uTrim = ctx.conf_chargeable_unit_rate_unit.toString().trim();
            if (uTrim == '') { ctx.remove('conf_chargeable_unit_rate_unit'); }
            else { ctx.conf_chargeable_unit_rate_unit = uTrim.toUpperCase(Locale.ROOT); }
          }
          if (ctx.conf_currency_unit != null) {
            String cuTrim = ctx.conf_currency_unit.toString().trim();
            if (cuTrim == '') { ctx.remove('conf_currency_unit'); }
            else { ctx.conf_currency_unit = cuTrim.toUpperCase(Locale.ROOT); }
          }
          if (ctx.conf_currency_symbol != null) {
            String csTrim = ctx.conf_currency_symbol.toString().trim();
            if (csTrim == '') { ctx.remove('conf_currency_symbol'); }
            else { ctx.conf_currency_symbol = csTrim; }
          }
          return;
        }
        ctx._from_transform = true;
        String joinKey = ctx.config_join_key != null ? ctx.config_join_key.toString().trim() : '';
        if ('chargeback_config_onprem'.equalsIgnoreCase(joinKey)) {
          ctx.config_join_key = 'chargeback_config_onprem';
        } else if (joinKey == '' || 'chargeback_config'.equalsIgnoreCase(joinKey)) {
          ctx.config_join_key = 'chargeback_config';
        } else {
          ctx.config_join_key = joinKey;
        }
        Map snapRoot = null;
        if (ctx.snapshots instanceof Map) {
          snapRoot = (ctx.snapshots.latest instanceof Map) ? (Map)ctx.snapshots.latest : (Map)ctx.snapshots;
        }
        ctx.remove('snapshots');

        // Gate writes on the newest policy-wide sync marker across all streams before merging per-stream settings.
        if (snapRoot == null) {
          ctx._skip_conf_write = true;
          return;
        }
        def hasSnapsObj = snapRoot.get('has_snapshots');
        boolean hasSnaps = (hasSnapsObj != null) && hasSnapsObj.toString().equalsIgnoreCase('true');
        def policySyncObj = snapRoot.get('policy_sync_enabled');
        boolean policySyncEnabled = (policySyncObj != null) && policySyncObj.toString().equalsIgnoreCase('true');
        def conflictObj = snapRoot.get('owner_conflict');
        boolean ownerConflict = (conflictObj != null) && conflictObj.toString().equalsIgnoreCase('true');
        if (!hasSnaps || !policySyncEnabled || ownerConflict) {
          ctx._skip_conf_write = true;
          return;
        }

        def legacyFlagObj = snapRoot.get('from_legacy_conf');
        boolean fromLegacyConf = (legacyFlagObj != null) && legacyFlagObj.toString().equalsIgnoreCase('true');
        if (fromLegacyConf && snapRoot.get('legacy_conf') instanceof Map) {
          Map lc = (Map)snapRoot.get('legacy_conf');
          boolean isLegacyOnpremKey = 'chargeback_config_onprem'.equals(ctx.config_join_key);
          double lRate = isLegacyOnpremKey ? 0.00085 : 0.85;
          def rawLRate = lc.get('conf_chargeable_unit_rate') != null ? lc.get('conf_chargeable_unit_rate') : lc.get('conf_ecu_rate');
          try {
            if (rawLRate instanceof Number) {
              lRate = ((Number)rawLRate).doubleValue();
            } else if (rawLRate != null && rawLRate.toString().trim() != '') {
              lRate = Double.parseDouble(rawLRate.toString().trim());
            }
          } catch (NumberFormatException e) {
            ctx._skip_conf_write = true;
            return;
          }
          if (Double.isNaN(lRate) || Double.isInfinite(lRate) || lRate < 0.0) {
            ctx._skip_conf_write = true;
            return;
          }

          double lOnpremRate = 0.00085;
          try {
            if (lc.get('conf_onprem_chargeable_unit_rate') instanceof Number) {
              lOnpremRate = ((Number)lc.get('conf_onprem_chargeable_unit_rate')).doubleValue();
            } else if (lc.get('conf_onprem_chargeable_unit_rate') != null && lc.get('conf_onprem_chargeable_unit_rate').toString().trim() != '') {
              lOnpremRate = Double.parseDouble(lc.get('conf_onprem_chargeable_unit_rate').toString().trim());
            }
          } catch (NumberFormatException e) {
            ctx._skip_conf_write = true;
            return;
          }
          if (Double.isNaN(lOnpremRate) || Double.isInfinite(lOnpremRate) || lOnpremRate < 0.0) {
            ctx._skip_conf_write = true;
            return;
          }

          int lIdxW = 20;
          int lQryW = 20;
          int lStoW = 40;
          int lMemW = 70;
          int lDiskW = 30;
          double lFloor = 0.10;
          try {
            if (lc.get('conf_indexing_weight') != null && lc.get('conf_indexing_weight').toString().trim() != '') {
              lIdxW = lc.get('conf_indexing_weight') instanceof Number ? ((Number)lc.get('conf_indexing_weight')).intValue() : (int)Double.parseDouble(lc.get('conf_indexing_weight').toString().trim());
            }
            if (lc.get('conf_query_weight') != null && lc.get('conf_query_weight').toString().trim() != '') {
              lQryW = lc.get('conf_query_weight') instanceof Number ? ((Number)lc.get('conf_query_weight')).intValue() : (int)Double.parseDouble(lc.get('conf_query_weight').toString().trim());
            }
            if (lc.get('conf_storage_weight') != null && lc.get('conf_storage_weight').toString().trim() != '') {
              lStoW = lc.get('conf_storage_weight') instanceof Number ? ((Number)lc.get('conf_storage_weight')).intValue() : (int)Double.parseDouble(lc.get('conf_storage_weight').toString().trim());
            }
            if (lc.get('conf_utilization_memory_weight') != null && lc.get('conf_utilization_memory_weight').toString().trim() != '') {
              lMemW = lc.get('conf_utilization_memory_weight') instanceof Number ? ((Number)lc.get('conf_utilization_memory_weight')).intValue() : (int)Double.parseDouble(lc.get('conf_utilization_memory_weight').toString().trim());
            }
            if (lc.get('conf_utilization_storage_weight') != null && lc.get('conf_utilization_storage_weight').toString().trim() != '') {
              lDiskW = lc.get('conf_utilization_storage_weight') instanceof Number ? ((Number)lc.get('conf_utilization_storage_weight')).intValue() : (int)Double.parseDouble(lc.get('conf_utilization_storage_weight').toString().trim());
            }
            if (lc.get('conf_utilization_floor') instanceof Number) {
              lFloor = ((Number)lc.get('conf_utilization_floor')).doubleValue();
            } else if (lc.get('conf_utilization_floor') != null && lc.get('conf_utilization_floor').toString().trim() != '') {
              lFloor = Double.parseDouble(lc.get('conf_utilization_floor').toString().trim());
            }
          } catch (NumberFormatException e) {
            ctx._skip_conf_write = true;
            return;
          }
          if (lIdxW < 0 || lQryW < 0 || lStoW < 0 || (lQryW + lStoW) <= 0 || lMemW < 0 || lDiskW < 0 || (lMemW + lDiskW) <= 0 || Double.isNaN(lFloor) || Double.isInfinite(lFloor) || lFloor < 0.0 || lFloor > 1.0) {
            ctx._skip_conf_write = true;
            return;
          }

          long lStartMillis = 1262304000000L;
          long lEndMillis = 2430518399999L;
          def rawStart = lc.get('conf_start_date');
          if (rawStart instanceof Number) {
            lStartMillis = ((Number)rawStart).longValue();
          } else if (rawStart != null && rawStart.toString().trim() != '') {
            String rs = rawStart.toString().trim();
            try {
              lStartMillis = Long.parseLong(rs);
            } catch (NumberFormatException nfe) {
              try {
                lStartMillis = ZonedDateTime.parse(rs.contains('T') ? rs : (rs + 'T00:00:00Z')).toInstant().toEpochMilli();
              } catch (DateTimeException dte) {
                ctx._skip_conf_write = true;
                return;
              }
            }
          }
          def rawEnd = lc.get('conf_end_date');
          if (rawEnd instanceof Number) {
            lEndMillis = ((Number)rawEnd).longValue();
          } else if (rawEnd != null && rawEnd.toString().trim() != '') {
            String re = rawEnd.toString().trim();
            try {
              lEndMillis = Long.parseLong(re);
            } catch (NumberFormatException nfe) {
              try {
                lEndMillis = ZonedDateTime.parse(re.contains('T') ? re : (re + 'T23:59:59.999Z')).toInstant().toEpochMilli();
              } catch (DateTimeException dte) {
                ctx._skip_conf_write = true;
                return;
              }
            }
          }
          if (lStartMillis < 0L || lStartMillis >= lEndMillis) {
            ctx._skip_conf_write = true;
            return;
          }

          def rawLUnit = lc.get('conf_chargeable_unit_rate_unit') != null ? lc.get('conf_chargeable_unit_rate_unit') : lc.get('conf_ecu_rate_unit');
          String lUnit = (rawLUnit != null && rawLUnit.toString().trim() != '') ? rawLUnit.toString().trim().toUpperCase(Locale.ROOT) : 'EUR';
          String lcJoinKey = lc.get('config_join_key') != null ? lc.get('config_join_key').toString().trim() : '';
          String lcRowId = lc.get('conf_row_id') != null ? lc.get('conf_row_id').toString().trim() : '';
          boolean srcWasOnprem = 'chargeback_config_onprem'.equalsIgnoreCase(lcJoinKey) || (lcJoinKey == '' && 'config_onprem'.equalsIgnoreCase(lcRowId));
          ctx.conf_chargeable_unit_rate = (isLegacyOnpremKey && !srcWasOnprem) ? lOnpremRate : lRate;
          ctx.conf_chargeable_unit_rate_unit = lUnit;
          String lCurrUnit = (lc.get('conf_currency_unit') != null && lc.get('conf_currency_unit').toString().trim() != '')
            ? lc.get('conf_currency_unit').toString().trim().toUpperCase(Locale.ROOT)
            : lUnit;
          String rawLSym = lc.get('conf_currency_symbol') != null ? lc.get('conf_currency_symbol').toString().trim() : '';
          boolean useDefLSym = (rawLSym == '') || ('€'.equals(rawLSym) && ('USD'.equals(lCurrUnit) || 'GBP'.equals(lCurrUnit) || 'ZAR'.equals(lCurrUnit)));
          ctx.conf_currency_unit = lCurrUnit;
          ctx.conf_currency_symbol = !useDefLSym ? rawLSym : (lCurrUnit == 'USD' ? '$' : (lCurrUnit == 'GBP' ? '£' : (lCurrUnit == 'ZAR' ? 'R' : '€')));
          ctx.conf_indexing_weight = lIdxW;
          ctx.conf_query_weight = lQryW;
          ctx.conf_storage_weight = lStoW;
          ctx.conf_utilization_memory_weight = lMemW;
          ctx.conf_utilization_storage_weight = lDiskW;
          ctx.conf_utilization_floor = lFloor;
          ctx.conf_start_date = lStartMillis;
          ctx.conf_end_date = lEndMillis;
          return;
        }

        Map m = [:];
        boolean anyActiveStream = false;
        String expectedOwnerKey = snapRoot.get('owner_key') != null ? snapRoot.get('owner_key').toString().trim() : '';
        if (snapRoot.streams instanceof Map) {
          Map streamsMap = (Map)snapRoot.streams;
          for (String ds : ['chargeback.billing', 'chargeback.usage', 'chargeback.node_stats']) {
            def bucket = streamsMap.get(ds);
            if (bucket instanceof Map) {
              def syncFlag = bucket.get('sync');
              boolean syncEnabled = (syncFlag == null) || syncFlag.toString().equalsIgnoreCase('true');
              if (syncEnabled) {
                String bOwner = bucket.get('conf_owner_key') != null ? bucket.get('conf_owner_key').toString().trim() : '';
                if (bOwner != '') {
                  if (expectedOwnerKey == '') {
                    expectedOwnerKey = bOwner;
                  } else if (!expectedOwnerKey.equals(bOwner)) {
                    ctx._skip_conf_write = true;
                    return;
                  }
                }
                anyActiveStream = true;
                for (def entry : bucket.entrySet()) {
                  String k = entry.getKey().toString();
                  if (entry.getValue() != null && k.startsWith('conf_') && k != 'conf_sync_enabled' && k != 'conf_owner_key' && k != 'conf_owner_id' && k != 'conf_policy_id' && k != 'conf_policy_scope') {
                    m[k] = entry.getValue();
                  }
                }
              }
            }
          }
        }
        if (!anyActiveStream) {
          ctx._skip_conf_write = true;
          return;
        }

        double rate = 0.85;
        boolean hasExplicitCloudRate = false;
        try {
          if (m.conf_chargeable_unit_rate instanceof Number) {
            rate = ((Number)m.conf_chargeable_unit_rate).doubleValue();
            hasExplicitCloudRate = true;
          } else if (m.conf_chargeable_unit_rate != null && m.conf_chargeable_unit_rate.toString().trim() != '') {
            rate = Double.parseDouble(m.conf_chargeable_unit_rate.toString().trim());
            hasExplicitCloudRate = true;
          }
        } catch (NumberFormatException e) {
          ctx._skip_conf_write = true;
          return;
        }
        if (Double.isNaN(rate) || Double.isInfinite(rate) || rate < 0.0) {
          ctx._skip_conf_write = true;
          return;
        }

        double onpremRate = hasExplicitCloudRate ? rate : 0.00085;
        try {
          if (m.conf_onprem_chargeable_unit_rate instanceof Number) {
            onpremRate = ((Number)m.conf_onprem_chargeable_unit_rate).doubleValue();
          } else if (m.conf_onprem_chargeable_unit_rate != null && m.conf_onprem_chargeable_unit_rate.toString().trim() != '') {
            onpremRate = Double.parseDouble(m.conf_onprem_chargeable_unit_rate.toString().trim());
          }
        } catch (NumberFormatException e) {
          ctx._skip_conf_write = true;
          return;
        }
        if (Double.isNaN(onpremRate) || Double.isInfinite(onpremRate) || onpremRate < 0.0) {
          ctx._skip_conf_write = true;
          return;
        }

        int idxW = 20;
        int qryW = 20;
        int stoW = 40;
        int memW = 70;
        int diskW = 30;
        double floorVal = 0.10;
        try {
          if (m.conf_indexing_weight != null && m.conf_indexing_weight.toString().trim() != '') {
            idxW = m.conf_indexing_weight instanceof Number ? ((Number)m.conf_indexing_weight).intValue() : (int)Double.parseDouble(m.conf_indexing_weight.toString().trim());
          }
          if (m.conf_query_weight != null && m.conf_query_weight.toString().trim() != '') {
            qryW = m.conf_query_weight instanceof Number ? ((Number)m.conf_query_weight).intValue() : (int)Double.parseDouble(m.conf_query_weight.toString().trim());
          }
          if (m.conf_storage_weight != null && m.conf_storage_weight.toString().trim() != '') {
            stoW = m.conf_storage_weight instanceof Number ? ((Number)m.conf_storage_weight).intValue() : (int)Double.parseDouble(m.conf_storage_weight.toString().trim());
          }
          if (m.conf_utilization_memory_weight != null && m.conf_utilization_memory_weight.toString().trim() != '') {
            memW = m.conf_utilization_memory_weight instanceof Number ? ((Number)m.conf_utilization_memory_weight).intValue() : (int)Double.parseDouble(m.conf_utilization_memory_weight.toString().trim());
          }
          if (m.conf_utilization_storage_weight != null && m.conf_utilization_storage_weight.toString().trim() != '') {
            diskW = m.conf_utilization_storage_weight instanceof Number ? ((Number)m.conf_utilization_storage_weight).intValue() : (int)Double.parseDouble(m.conf_utilization_storage_weight.toString().trim());
          }
          if (m.conf_utilization_floor instanceof Number) {
            floorVal = ((Number)m.conf_utilization_floor).doubleValue();
          } else if (m.conf_utilization_floor != null && m.conf_utilization_floor.toString().trim() != '') {
            floorVal = Double.parseDouble(m.conf_utilization_floor.toString().trim());
          }
        } catch (NumberFormatException e) {
          ctx._skip_conf_write = true;
          return;
        }
        if (idxW < 0 || qryW < 0 || stoW < 0 || (qryW + stoW) <= 0 || memW < 0 || diskW < 0 || (memW + diskW) <= 0 || Double.isNaN(floorVal) || Double.isInfinite(floorVal) || floorVal < 0.0 || floorVal > 1.0) {
          ctx._skip_conf_write = true;
          return;
        }

        long startMillis = 1262304000000L;
        long endMillis = 2430518399999L;
        String effFrom = m.conf_effective_from != null ? m.conf_effective_from.toString().trim() : '';
        if (effFrom != '') {
          try {
            ZonedDateTime parsedEff = effFrom.contains('T') ? ZonedDateTime.parse(effFrom) : ZonedDateTime.parse(effFrom + 'T00:00:00Z');
            String checkDate = effFrom.contains('T') ? effFrom.substring(0, effFrom.indexOf('T')) : effFrom;
            ZonedDateTime utcEff = parsedEff.withZoneSameInstant(ZoneOffset.UTC);
            if (!utcEff.toLocalDate().toString().equals(checkDate)) {
              ctx._skip_conf_write = true;
              return;
            }
            startMillis = utcEff.toInstant().toEpochMilli();
          } catch (DateTimeException e) {
            ctx._skip_conf_write = true;
            return;
          }
          if (startMillis < 0L || (startMillis % 86400000L) != 0L || startMillis >= endMillis) {
            ctx._skip_conf_write = true;
            return;
          }
        }

        boolean isOnpremKey = 'chargeback_config_onprem'.equals(ctx.config_join_key);
        ctx.conf_chargeable_unit_rate = isOnpremKey ? onpremRate : rate;
        ctx.conf_chargeable_unit_rate_unit = (m.conf_chargeable_unit_rate_unit != null && m.conf_chargeable_unit_rate_unit.toString().trim() != '') ? m.conf_chargeable_unit_rate_unit.toString().trim().toUpperCase(Locale.ROOT) : 'EUR';
        String rawCurrUnit = m.get('conf_currency_unit') != null ? m.get('conf_currency_unit').toString().trim() : '';
        if (rawCurrUnit == '' && m.get('conf_chargeable_unit_rate_unit') != null) {
          rawCurrUnit = m.get('conf_chargeable_unit_rate_unit').toString().trim();
        }
        String resolvedCurrUnit = (rawCurrUnit != '') ? rawCurrUnit.toUpperCase(Locale.ROOT) : 'EUR';
        String rawCurrSym = m.get('conf_currency_symbol') != null ? m.get('conf_currency_symbol').toString().trim() : '';
        boolean useDefSym = (rawCurrSym == '') || ('€'.equals(rawCurrSym) && ('USD'.equals(resolvedCurrUnit) || 'GBP'.equals(resolvedCurrUnit) || 'ZAR'.equals(resolvedCurrUnit)));
        String resolvedCurrSym = !useDefSym ? rawCurrSym : (resolvedCurrUnit == 'USD' ? '$' : (resolvedCurrUnit == 'GBP' ? '£' : (resolvedCurrUnit == 'ZAR' ? 'R' : '€')));
        ctx.conf_currency_unit = resolvedCurrUnit;
        ctx.conf_currency_symbol = resolvedCurrSym;
        ctx.conf_indexing_weight = idxW;
        ctx.conf_query_weight = qryW;
        ctx.conf_storage_weight = stoW;
        ctx.conf_utilization_memory_weight = memW;
        ctx.conf_utilization_storage_weight = diskW;
        ctx.conf_utilization_floor = floorVal;
        ctx.conf_start_date = startMillis;
        ctx.conf_end_date = endMillis;
  - drop:
      if: "ctx._skip_conf_write == true"
      tag: preserve_existing_manual_config
  # LOOKUP JOIN overwrites left-side @timestamp with the right-side field when present.
  # Conf docs must not carry @timestamp (including null), or billing panels bucket into null / wrong dates.
  - remove:
      field: "@timestamp"
      ignore_missing: true
      tag: remove_conf_timestamp
  - set:
      field: _id
      value: config
      if: "ctx._from_transform == true && ctx.config_join_key != 'chargeback_config_onprem'"
      override: true
      tag: set_config_document_id
  - set:
      field: _id
      value: config_onprem
      if: "ctx._from_transform == true && ctx.config_join_key == 'chargeback_config_onprem'"
      override: true
      tag: set_onprem_config_document_id
  - remove:
      field: _from_transform
      ignore_missing: true
      tag: remove_transform_flag
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      name: logs-chargeback.lookup@custom
      ignore_missing_pipeline: true
  - pipeline:
      name: logs-chargeback.lookup-chargeback_conf@custom
      ignore_missing_pipeline: true
on_failure:
  - fail:
      message: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
