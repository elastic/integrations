---
description: Post-process chargeback display currency symbol configuration while preserving manual overrides when Fleet sync is inactive
processors:
  - script:
      description: Gate on newest policy-wide sync marker, merge active streams, and default to EUR for usage-only or node_stats-only policies
      lang: painless
      source: |
        // Pass manual operator documents straight through because Fleet sets this pipeline as index.default_pipeline.
        if (!ctx.containsKey('snapshots')) {
          String manualKey = ctx.config_join_key != null ? ctx.config_join_key.toString().trim() : '';
          ctx.config_join_key = manualKey == '' ? 'chargeback_config' : manualKey;
          if (ctx.conf_currency_unit != null) {
            String uTrim = ctx.conf_currency_unit.toString().trim();
            if (uTrim == '') { ctx.remove('conf_currency_unit'); }
            else { ctx.conf_currency_unit = uTrim.toUpperCase(Locale.ROOT); }
          }
          if (ctx.conf_currency_symbol != null) {
            String sTrim = ctx.conf_currency_symbol.toString().trim();
            if (sTrim == '') { ctx.remove('conf_currency_symbol'); }
            else { ctx.conf_currency_symbol = sTrim; }
          }
          if (ctx.conf_start_date == null) { ctx.conf_start_date = 1262304000000L; }
          if (ctx.conf_end_date == null) { ctx.conf_end_date = 2430518399999L; }
          return;
        }
        ctx._from_transform = true;
        Map snapRoot = null;
        if (ctx.snapshots instanceof Map) {
          snapRoot = (ctx.snapshots.latest instanceof Map) ? (Map)ctx.snapshots.latest : (Map)ctx.snapshots;
        }
        ctx.remove('snapshots');

        if (snapRoot == null) {
          ctx._skip_conf_write = true;
          return;
        }
        def hasSnapsObj = snapRoot.get('has_snapshots');
        boolean hasSnaps = (hasSnapsObj != null) && hasSnapsObj.toString().equalsIgnoreCase('true');
        def policySyncObj = snapRoot.get('policy_sync_enabled');
        boolean policySyncEnabled = (policySyncObj != null) && policySyncObj.toString().equalsIgnoreCase('true');
        def conflictObj = snapRoot.get('owner_conflict');
        boolean ownerConflict = (conflictObj != null) && conflictObj.toString().equalsIgnoreCase('true');
        if (!hasSnaps || !policySyncEnabled || ownerConflict) {
          ctx._skip_conf_write = true;
          return;
        }

        Map m = [:];
        if (snapRoot.streams instanceof Map) {
          boolean anyActiveStream = false;
          String expectedOwnerKey = snapRoot.get('owner_key') != null ? snapRoot.get('owner_key').toString().trim() : '';
          Map streamsMap = (Map)snapRoot.streams;
          for (String ds : ['chargeback.billing', 'chargeback.usage', 'chargeback.node_stats']) {
            def bucket = streamsMap.get(ds);
            if (bucket instanceof Map) {
              def syncFlag = bucket.get('sync');
              boolean syncEnabled = (syncFlag == null) || syncFlag.toString().equalsIgnoreCase('true');
              if (syncEnabled) {
                String bOwner = bucket.get('conf_owner_key') != null ? bucket.get('conf_owner_key').toString().trim() : '';
                if (bOwner != '') {
                  if (expectedOwnerKey == '') {
                    expectedOwnerKey = bOwner;
                  } else if (!expectedOwnerKey.equals(bOwner)) {
                    ctx._skip_conf_write = true;
                    return;
                  }
                }
                anyActiveStream = true;
                for (def entry : bucket.entrySet()) {
                  String k = entry.getKey().toString();
                  if (entry.getValue() != null && k.startsWith('conf_') && k != 'conf_sync_enabled' && k != 'conf_owner_key' && k != 'conf_owner_id' && k != 'conf_policy_id' && k != 'conf_policy_scope') {
                    m[k] = entry.getValue();
                  }
                }
              }
            }
          }
          if (!anyActiveStream) {
            ctx._skip_conf_write = true;
            return;
          }
        } else {
          m = snapRoot;
        }

        String rawUnit = m.get('conf_currency_unit') != null ? m.get('conf_currency_unit').toString().trim() : '';
        if (rawUnit == '' && m.get('conf_chargeable_unit_rate_unit') != null) {
          rawUnit = m.get('conf_chargeable_unit_rate_unit').toString().trim();
        }
        String resolvedUnit = (rawUnit != '') ? rawUnit.toUpperCase(Locale.ROOT) : 'EUR';
        String rawSym = m.get('conf_currency_symbol') != null ? m.get('conf_currency_symbol').toString().trim() : '';
        boolean useDefaultSym = (rawSym == '') || ('€'.equals(rawSym) && ('USD'.equals(resolvedUnit) || 'GBP'.equals(resolvedUnit) || 'ZAR'.equals(resolvedUnit)));
        String resolvedSym = !useDefaultSym ? rawSym : (resolvedUnit == 'USD' ? '$' : (resolvedUnit == 'GBP' ? '£' : (resolvedUnit == 'ZAR' ? 'R' : '€')));

        long startMillis = 1262304000000L;
        long endMillis = 2430518399999L;
        String effFrom = m.get('conf_effective_from') != null ? m.get('conf_effective_from').toString().trim() : '';
        if (effFrom != '') {
          try {
            ZonedDateTime parsedEff = effFrom.contains('T') ? ZonedDateTime.parse(effFrom) : ZonedDateTime.parse(effFrom + 'T00:00:00Z');
            String checkDate = effFrom.contains('T') ? effFrom.substring(0, effFrom.indexOf('T')) : effFrom;
            ZonedDateTime utcEff = parsedEff.withZoneSameInstant(ZoneOffset.UTC);
            if (!utcEff.toLocalDate().toString().equals(checkDate)) {
              ctx._skip_conf_write = true;
              return;
            }
            startMillis = utcEff.toInstant().toEpochMilli();
          } catch (DateTimeException e) {
            ctx._skip_conf_write = true;
            return;
          }
          if (startMillis < 0L || (startMillis % 86400000L) != 0L || startMillis >= endMillis) {
            ctx._skip_conf_write = true;
            return;
          }
        }

        ctx.conf_currency_unit = resolvedUnit;
        ctx.conf_currency_symbol = resolvedSym;
        ctx.conf_start_date = startMillis;
        ctx.conf_end_date = endMillis;
  - drop:
      if: "ctx._skip_conf_write == true"
      tag: preserve_existing_manual_currency
  - remove:
      field: "@timestamp"
      ignore_missing: true
      tag: remove_conf_timestamp
  - set:
      field: _id
      value: config
      if: "ctx._from_transform == true && ctx.config_join_key != 'chargeback_config_onprem'"
      override: true
      tag: set_config_document_id
  - set:
      field: _id
      value: config_onprem
      if: "ctx._from_transform == true && ctx.config_join_key == 'chargeback_config_onprem'"
      override: true
      tag: set_onprem_config_document_id
  - remove:
      field: _from_transform
      ignore_missing: true
      tag: remove_transform_flag
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      name: logs-chargeback.lookup@custom
      ignore_missing_pipeline: true
  - pipeline:
      name: logs-chargeback.lookup-chargeback_currency@custom
      ignore_missing_pipeline: true
on_failure:
  - fail:
      message: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
