- name: input.type
  type: keyword
  description: Input type used to collect the event.
- name: doc_type
  type: keyword
  description: Chargeback usage event record type (index_usage, config_snapshot).
- name: deployment_name
  type: keyword
  description: Human-readable deployment or Serverless project name.
- name: elasticsearch.cluster.name
  type: keyword
  description: Elasticsearch cluster identifier (matches billing deployment_id).
- name: elasticsearch.index.name
  type: keyword
  description: Backing index or standalone index name.
- name: elasticsearch.index.datastream
  type: keyword
  description: Normalized data stream or index name.
- name: elasticsearch.index.tier
  type: keyword
  description: Data tier where the index resides (hot/content, warm, cold, frozen, unknown).
- name: elasticsearch.index.tier_preference
  type: keyword
  description: Raw index.routing.allocation.include._tier_preference setting.
- name: elasticsearch.index.creation_date
  type: date
  description: Index creation timestamp reported by Elasticsearch.
- name: elasticsearch.index.age
  type: long
  description: Index age in days calculated from creation_date.
- name: elasticsearch.index.interval.start
  type: date
  description: Start timestamp of the counter delta observation interval.
- name: elasticsearch.index.interval.end
  type: date
  description: End timestamp of the counter delta observation interval.
- name: elasticsearch.index.interval.duration_ms
  type: long
  description: Duration in milliseconds of the counter delta observation interval.
- name: elasticsearch.index.primaries.docs.count
  type: long
  description: Primary document count for the index.
- name: elasticsearch.index.primaries.docs.count_delta
  type: long
  description: Daily change in primary document count computed from successive observations.
- name: elasticsearch.index.primaries.store.total_data_set_size_in_bytes
  type: long
  description: Primary dataset size in bytes.
- name: elasticsearch.index.primaries.store.total_data_set_size_in_bytes_delta
  type: long
  description: Daily change in primary dataset size in bytes computed from successive observations.
- name: elasticsearch.index.total.store.size_in_bytes
  type: long
  description: Total shard store size in bytes.
- name: elasticsearch.index.total.indexing.index_time_in_millis
  type: long
  description: Daily reset-aware indexing time in milliseconds.
- name: elasticsearch.index.total.indexing.index_time_in_millis_delta
  type: long
  description: Daily reset-aware indexing time delta in milliseconds.
- name: elasticsearch.index.total.search.query_time_in_millis
  type: long
  description: Daily reset-aware search query time in milliseconds.
- name: elasticsearch.index.total.search.query_time_in_millis_delta
  type: long
  description: Daily reset-aware search query time delta in milliseconds.
- name: elasticsearch.index.total.search.query_total
  type: long
  description: Observed or daily search query count.
- name: elasticsearch.index.total.search.query_total_delta
  type: long
  description: Daily reset-aware search query count delta.
- name: conf_indexing_weight
  type: long
  description: Configured blended indexing weight from Fleet Usage data stream settings.
- name: conf_query_weight
  type: long
  description: Configured blended query weight from Fleet Usage data stream settings.
- name: conf_storage_weight
  type: long
  description: Configured blended storage weight from Fleet Usage data stream settings.
- name: conf_sync_enabled
  type: boolean
  description: Whether Fleet configuration sync is enabled on the policy snapshot.
- name: conf_owner_id
  type: keyword
  description: Optional explicit configuration owner identifier configured on the policy.
- name: conf_policy_scope
  type: keyword
  description: Non-secret policy target scope fingerprint used to isolate per-policy configuration snapshots.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
