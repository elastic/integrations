---
description: "Ingest pipeline for Chargeback self-collected index and tier usage data."
processors:
  - drop:
      if: "ctx.elasticsearch?.index?.name == null && ctx.doc_type != 'config_snapshot' && ctx.error?.message == null"
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.elasticsearch?.index?.name == null && ctx.doc_type != 'config_snapshot'
      description: Terminate early on collection error documents.
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      if: ctx.event?.ingested == null
      tag: set_event_ingested
  - terminate:
      tag: config_snapshot_complete
      if: "ctx.doc_type == 'config_snapshot'"
      description: Configuration snapshot events are complete after stamping event.ingested.
  - date:
      field: period_start
      target_field: "@timestamp"
      formats:
        - ISO8601
      if: ctx.period_start != null
      ignore_failure: true
      tag: restore_period_start_timestamp
  - remove:
      field: period_start
      ignore_missing: true
  - script:
      lang: painless
      ignore_failure: true
      tag: normalize_index_tier_and_datastream
      source: |
        if (ctx.elasticsearch == null || ctx.elasticsearch.index == null) {
          return;
        }
        def idx = ctx.elasticsearch.index;
        String name = idx.name != null ? idx.name.toString() : '';
        boolean isCbLookup = (
          name.startsWith('chargeback_lookup.') ||
          name == 'monitoring-indices' ||
          name == 'monitoring-indices-chargeback' ||
          /^(?:billing_cluster_cost_lookup|billing_realized_pool_lookup|chargeback_conf_lookup|cluster_capacity_utilization_lookup|cluster_deployment_contribution_lookup|cluster_tier_contribution_lookup|cluster_datastream_contribution_lookup|cluster_tier_and_datastream_contribution_lookup)(?:-\d+)?$/.matcher(name).matches()
        );
        // Drop internal non-.ds system indices and explicit Chargeback indices to avoid feedback
        if ((name.startsWith('.') && !name.startsWith('.ds-')) || name.startsWith('.ds-.') || name.startsWith('.ds-ilm-history') || isCbLookup || name.contains('metrics-chargeback.') || name.contains('logs-chargeback.')) {
          ctx._drop_internal = true;
          return;
        }
        if (idx.datastream == null || idx.datastream == '') {
          String stripped = name;
          if (stripped.startsWith('partial-')) { stripped = stripped.substring(8); }
          if (stripped.startsWith('restored-')) { stripped = stripped.substring(9); }
          def sm = /^shrink-.{4}-(.*)$/.matcher(stripped);
          if (sm.matches()) { stripped = sm.group(1); }
          String resolvedDs = null;
          if (stripped.startsWith('.ds-')) {
            def dm = /^\.ds-([a-zA-Z_0-9\-.]+?)(?:-\d{4}\.\d{2}(?:\.\d{2})?)?(?:-\d{6,})?$/.matcher(stripped);
            if (dm.matches() && !dm.group(1).startsWith('.')) {
              resolvedDs = dm.group(1);
            }
          } else {
            def rm = /^([a-zA-Z_0-9\-.]+?)(?:-\d{4}\.\d{2}(?:\.\d{2})?(?:-\d{6,})?|-\d{6,})$/.matcher(stripped);
            if (rm.matches() && !rm.group(1).startsWith('.')) {
              resolvedDs = rm.group(1);
            }
          }
          if (resolvedDs != null) {
            idx.datastream = resolvedDs;
          } else {
            idx.datastream = (name.startsWith('.') || stripped.startsWith('.')) ? 'system' : stripped;
          }
        }
        List shardRolesList = idx.allocated_node_roles instanceof List ? (List)idx.allocated_node_roles : null;
        idx.remove('allocated_node_roles');
        if (idx.tier == null || idx.tier == '') {
          String pref = idx.tier_preference != null ? idx.tier_preference.toString() : '';
          List prefParts = new ArrayList();
          if (pref != '') {
            for (String p : pref.splitOnToken(',')) {
              String tp = p.trim();
              if (!tp.isEmpty()) prefParts.add(tp);
            }
          }
          String resolvedTier = null;
          if (shardRolesList != null && !shardRolesList.isEmpty()) {
            Map tierCounts = new HashMap();
            for (def entry : shardRolesList) {
              if (entry == null) continue;
              Set roleSet = new HashSet();
              if (entry instanceof List) {
                for (def r : (List)entry) {
                  if (r != null) roleSet.add(r.toString().trim());
                }
              } else {
                for (String r : entry.toString().splitOnToken(',')) {
                  String tr = r.trim();
                  if (!tr.isEmpty()) roleSet.add(tr);
                }
              }
              if (roleSet.isEmpty()) continue;
              String shardTier = null;
              for (String p : prefParts) {
                if (roleSet.contains(p) || roleSet.contains('data')) {
                  if (p == 'data_frozen') shardTier = 'frozen';
                  else if (p == 'data_cold') shardTier = 'cold';
                  else if (p == 'data_warm') shardTier = 'warm';
                  else if (p == 'data_hot' || p == 'data_content') shardTier = 'hot/content';
                  if (shardTier != null) break;
                }
              }
              if (shardTier == null) {
                if (roleSet.contains('data') || roleSet.contains('data_hot') || roleSet.contains('data_content')) shardTier = 'hot/content';
                else if (roleSet.contains('data_warm')) shardTier = 'warm';
                else if (roleSet.contains('data_cold')) shardTier = 'cold';
                else if (roleSet.contains('data_frozen')) shardTier = 'frozen';
              }
              if (shardTier != null) {
                int cnt = tierCounts.containsKey(shardTier) ? ((Number)tierCounts.get(shardTier)).intValue() + 1 : 1;
                tierCounts.put(shardTier, cnt);
              }
            }
            int bestCount = 0;
            for (String cand : ['hot/content', 'warm', 'cold', 'frozen']) {
              int cnt = tierCounts.containsKey(cand) ? ((Number)tierCounts.get(cand)).intValue() : 0;
              if (cnt > bestCount) {
                bestCount = cnt;
                resolvedTier = cand;
              }
            }
          }
          if (resolvedTier != null) {
            idx.tier = resolvedTier;
          } else if (pref == '') {
            idx.tier = 'hot/content';
          } else {
            String prefTier = 'unknown';
            for (String p : prefParts) {
              if (p == 'data_frozen') { prefTier = 'frozen'; break; }
              if (p == 'data_cold') { prefTier = 'cold'; break; }
              if (p == 'data_warm') { prefTier = 'warm'; break; }
              if (p == 'data_hot' || p == 'data_content') { prefTier = 'hot/content'; break; }
            }
            idx.tier = prefTier;
          }
        }
        if (idx.creation_date != null && ctx['@timestamp'] != null) {
          try {
            long tsMillis = (ctx['@timestamp'] instanceof Number)
              ? ((Number)ctx['@timestamp']).longValue()
              : ZonedDateTime.parse(ctx['@timestamp'].toString()).toInstant().toEpochMilli();
            long createdMillis = (idx.creation_date instanceof Number)
              ? ((Number)idx.creation_date).longValue()
              : (/^\d+$/.matcher(idx.creation_date.toString()).matches()
                  ? Long.parseLong(idx.creation_date.toString())
                  : ZonedDateTime.parse(idx.creation_date.toString()).toInstant().toEpochMilli());
            if (createdMillis > 0L) {
              idx.creation_date = Instant.ofEpochMilli(createdMillis).toString();
              long ageDays = (tsMillis - createdMillis) / 86400000L;
              idx.age = ageDays > 0L ? ageDays : 0L;
            }
          } catch (Exception e) {}
        }
  - drop:
      if: "ctx._drop_internal == true"
  - fingerprint:
      fields:
        - elasticsearch.cluster.name
        - "@timestamp"
        - period_obs_ts
        - elasticsearch.index.name
      target_field: _id
      ignore_missing: true
      tag: fingerprint_usage_event
  - remove:
      field: period_obs_ts
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: "pipeline_error"
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}failed with message '{{{ _ingest.on_failure_message }}}'
