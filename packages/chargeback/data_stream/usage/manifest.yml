title: "Chargeback Usage"
type: metrics
dataset: chargeback.usage
elasticsearch:
  source_mode: synthetic
streams:
  - input: cel
    title: Elastic Cloud Daily Index & Tier Usage
    description: Collect daily index, data stream, and data-tier usage metrics across ECH deployments and Serverless projects, and configure workload allocation weights.
    template_path: cel.yml.hbs
    enabled: true
    vars:
      - name: indexing_weight
        type: integer
        title: Blended Indexing Weight
        description: >-
          Weight for indexing operations in blended cost calculation (default: 20, applies to hot/content tier).
        multi: false
        required: true
        show_user: true
        default: 20
      - name: query_weight
        type: integer
        title: Blended Query Weight
        description: >-
          Weight for query operations in blended cost calculation (default: 20).
        multi: false
        required: true
        show_user: true
        default: 20
      - name: storage_weight
        type: integer
        title: Blended Storage Weight
        description: >-
          Weight for storage in blended cost calculation (default: 40).
        multi: false
        required: true
        show_user: true
        default: 40
      - name: memory_cost_weight
        type: integer
        title: Memory Cost Split Weight
        description: >-
          Weight for memory contribution display in data-tier panels (default: 50).
        multi: false
        required: true
        show_user: true
        default: 50
      - name: storage_cost_weight
        type: integer
        title: Storage Cost Split Weight
        description: >-
          Weight for storage contribution display in data-tier panels (default: 50).
        multi: false
        required: true
        show_user: true
        default: 50
