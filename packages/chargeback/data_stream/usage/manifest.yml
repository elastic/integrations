title: "Chargeback Usage"
type: metrics
dataset: chargeback.usage
elasticsearch:
  source_mode: synthetic
streams:
  - input: cel
    title: Daily Index & Tier Usage
    description: Collect daily reset-aware index, data stream, and data-tier usage metrics across ECH deployments, Serverless projects, and local/hub clusters, and configure blended workload allocation weights.
    template_path: cel.yml.hbs
    enabled: true
    vars:
      - name: indexing_weight
        type: integer
        title: Blended Indexing Weight
        description: >-
          Weight for indexing operations in blended cost calculation (default: 20, applies to hot/content tier).
        multi: false
        required: true
        show_user: true
        default: 20
      - name: query_weight
        type: integer
        title: Blended Query Weight
        description: >-
          Weight for query operations in blended cost calculation (default: 20).
        multi: false
        required: true
        show_user: true
        default: 20
      - name: storage_weight
        type: integer
        title: Blended Storage Weight
        description: >-
          Weight for storage in blended cost calculation (default: 40).
        multi: false
        required: true
        show_user: true
        default: 40
