input: cel
service: chargeback
vars:
  organization_id: "1111"
  cloud_api_key: cloud-key
  cloud_api_base: http://{{Hostname}}:{{Port}}
  hub_es_url: http://{{Hostname}}:{{Port}}/hub
  hub_es_api_key: hub-key
  deployment_api_keys: "dep-ech-01:ech-key"
  sync_fleet_config: true
  enable_request_tracer: true
data_stream:
  vars:
    indexing_weight: 20
    query_weight: 20
    storage_weight: 40
    processors: |-
      - add_fields:
          target: labels
          fields:
            test_run_id: "{{Test.RunID}}"
assert:
  # 1 config_snapshot + 5 index_usage (2 ECH per-tier rows for warm primary and hot/content replica, Serverless page 1, Serverless page 2, Hub; .security-7 and chargeback_lookup.* filtered) + 1 ai_model (ech1) + 1 synthetics_monitor (ech1) = 8 documents.
  hit_count: 8
  fields_present:
    - doc_type
    - deployment_name
    - elasticsearch.cluster.name
    - elasticsearch.index.name
    - elasticsearch.index.datastream
    - elasticsearch.index.tier
    - elasticsearch.index.primaries.docs.count
    - elasticsearch.index.primaries.store.total_data_set_size_in_bytes
    - elasticsearch.index.total.store.size_in_bytes
    - elasticsearch.index.total.indexing.index_time_in_millis
    - elasticsearch.index.total.search.query_time_in_millis
    - elasticsearch.index.total.search.query_total
    - conf_indexing_weight
    - conf_query_weight
    - conf_storage_weight
    - event.ingested
