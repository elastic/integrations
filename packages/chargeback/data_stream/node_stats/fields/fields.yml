- name: input.type
  type: keyword
  description: Input type used to collect the event.
- name: doc_type
  type: keyword
  description: Chargeback node stats event record type (node_sample, config_snapshot).
- name: deployment_name
  type: keyword
  description: Human-readable deployment name.
- name: elasticsearch.cluster.name
  type: keyword
  description: Elasticsearch cluster identifier (matches billing deployment_id).
- name: elasticsearch.node.id
  type: keyword
  description: Unique Elasticsearch node identifier.
- name: elasticsearch.node.name
  type: keyword
  description: Elasticsearch node name.
- name: elasticsearch.node.roles
  type: keyword
  description: Node roles assigned to the Elasticsearch node.
- name: elasticsearch.node.stats.jvm.mem.heap.used.pct
  type: double
  description: JVM heap used percentage (0 to 100).
- name: elasticsearch.node.stats.fs.total.total_in_bytes
  type: long
  description: Node filesystem total capacity in bytes.
- name: elasticsearch.node.stats.fs.total.available_in_bytes
  type: long
  description: Node filesystem available capacity in bytes.
- name: cluster_data_node_count
  type: long
  description: Total data-role node count (including failed node stats responses) reported by the cluster during sampling.
- name: conf_utilization_memory_weight
  type: long
  description: Configured JVM heap p95 weight from Fleet Node Stats data stream settings.
- name: conf_utilization_storage_weight
  type: long
  description: Configured disk p95 weight from Fleet Node Stats data stream settings.
- name: conf_utilization_floor
  type: double
  description: Configured minimum utilization floor from Fleet Node Stats data stream settings.
- name: conf_sync_enabled
  type: boolean
  description: Whether Fleet configuration sync is enabled on the policy snapshot.
- name: conf_owner_id
  type: keyword
  description: Optional explicit configuration owner identifier configured on the policy.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
