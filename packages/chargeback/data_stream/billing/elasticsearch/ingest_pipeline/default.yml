---
description: "Ingest pipeline for Chargeback self-collected Elastic Cloud billing, credit commitment, and rate configuration events."
processors:
  - drop:
      if: "ctx.ess?.billing == null && ctx.doc_type != 'config_snapshot' && ctx.error?.message == null"
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.ess?.billing == null && ctx.doc_type != 'config_snapshot'
      description: Terminate early on collection error documents.
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      if: ctx.event?.ingested == null
      tag: set_event_ingested
  - terminate:
      tag: config_snapshot_complete
      if: "ctx.doc_type == 'config_snapshot'"
      description: Configuration snapshot events are complete after stamping event.ingested.
  - set:
      field: cloud.account.id
      copy_from: ess.billing.organization_id
      ignore_empty_value: true
      tag: cloud_account_id
  - fingerprint:
      fields:
        - doc_type
        - ess.billing.organization_id
        - "@timestamp"
        - ess.billing.start
        - ess.billing.end
        - ess.billing.ecu_quantity
      target_field: _id
      ignore_missing: true
      if: "ctx.doc_type == 'credit_line_item'"
      tag: fingerprint_credit_event
  - set:
      field: event.dataset
      value: ess_billing.credits
      if: "ctx.doc_type == 'credit_line_item'"
      tag: set_credit_event_dataset
  - terminate:
      tag: credit_line_item_complete
      if: "ctx.doc_type == 'credit_line_item'"
      description: Credit commitment events retain snapshot @timestamp, event.dataset compatibility, and ESS credit fields.
  - date:
      field: ess.billing.from
      target_field: "@timestamp"
      formats:
        - ISO8601
      if: ctx.ess?.billing?.from != null
      ignore_failure: true
      tag: restore_billing_window_timestamp
  - fingerprint:
      fields:
        - ess.billing.deployment_id
        - ess.billing.from
        - ess.billing.to
        - ess.billing.sku
      target_field: _id
      ignore_missing: true
      tag: fingerprint_billing_event
  - set:
      field: cloud.instance.id
      copy_from: ess.billing.deployment_id
      ignore_empty_value: true
      tag: cloud_instance_id
  - set:
      field: cloud.instance.name
      copy_from: ess.billing.deployment_id
      ignore_empty_value: true
  - set:
      field: cloud.instance.name
      copy_from: ess.billing.deployment_name
      ignore_empty_value: true
      tag: cloud_instance_name
  - grok:
      field: "ess.billing.sku"
      patterns:
        - "(?:Cloud-[A-Za-z]+_)?%{CLOUD_PROVIDER:cloud.provider}\\.%{NOTSPACE:cloud.machine.type}_%{NOTSPACE:cloud.region}_%{NUMBER:ess.billing.ram_per_zone:long}_%{NUMBER:ess.billing.zone_count:long}"
      pattern_definitions:
        CLOUD_PROVIDER: "aws|gcp|azure|global"
      if: "ctx.ess?.billing?.sku != null && ctx.ess?.billing?.deployment_type == 'deployment'"
      ignore_failure: true
      tag: grok_ech_sku
  - dissect:
      field: "ess.billing.sku"
      pattern: "%{cloud.provider}.%{}"
      if: "ctx.cloud?.provider == null && ctx.ess?.billing?.sku != null && ctx.ess?.billing?.deployment_type == 'deployment'"
      ignore_failure: true
      tag: dissect_ech_provider
  - set:
      field: "cloud.provider"
      value: "onprem"
      if: "ctx.cloud?.provider == null && (ctx.ess?.billing?.deployment_type == 'onprem' || ctx.ess?.billing?.deployment_type == 'ece' || ctx.ess?.billing?.deployment_type == 'eck' || ctx.ess?.billing?.sku == 'onprem_node')"
      tag: set_onprem_provider
  - grok:
      field: "ess.billing.sku"
      patterns:
        - "%{DATA}\\.(?<ess.billing.cloud.service.type>[^_]+)(?:_(?<_sls_sku_region>(?:aws|gcp|azure)-[a-z0-9-]+))?"
      if: "ctx.ess?.billing?.sku != null && ctx.ess?.billing?.deployment_type != 'deployment' && ctx.cloud?.provider != 'onprem'"
      ignore_failure: true
      tag: grok_serverless_sku
  - set:
      field: "cloud.region"
      copy_from: "_sls_sku_region"
      if: "(ctx.cloud?.region == null || ctx.cloud?.region == '') && ctx._sls_sku_region != null"
      ignore_empty_value: true
  - remove:
      field: "_sls_sku_region"
      ignore_missing: true
  - set:
      field: "cloud.provider"
      if: "ctx.ess?.billing?.deployment_type != 'deployment' && ctx.cloud?.provider == null"
      value: "serverless"
  - script:
      lang: painless
      ignore_failure: true
      tag: normalize_billing_types_and_geo
      source: |
        if (ctx.ess != null && ctx.ess.billing != null) {
          def s = ctx.ess.billing.sku != null ? ctx.ess.billing.sku : '';
          if ((ctx.ess.billing.kind == null || ctx.ess.billing.kind == '') && s.contains('.es.')) {
            ctx.ess.billing.kind = 'elasticsearch';
          }
          def t = ctx.ess.billing.type != null ? ctx.ess.billing.type.toString().toLowerCase() : '';
          if (t == '' || t == 'vcu' || t == 'search ai lake' || t == 'ingest' || t == 'synthetics' || t == 'data transfer') {
            if (s.contains('data-out') || s.contains('data-transfer-out') || s.contains('egress')) {
              ctx.ess.billing.type = 'data_out';
            } else if (s.contains('data-in') || s.contains('data-transfer-in') || s.contains('ingress')) {
              ctx.ess.billing.type = 'data_in';
            } else if (s.contains('snapshot') || s.contains('retained') || s.contains('storage')) {
              ctx.ess.billing.type = 'storage';
            } else if (s.contains('support')) {
              ctx.ess.billing.type = 'support';
            } else if (s.contains('.es.') || s.contains('.kibana.') || s.contains('.apm.') || s.contains('.integrationsserver.') || s.contains('.enterprisesearch.') || s.contains('vcu') || s.contains('complete')) {
              ctx.ess.billing.type = 'capacity';
            } else {
              ctx.ess.billing.type = 'usage';
            }
          }
        }
        Map regionGeo = [
          'gcp-us-central1': ['location': ['lon': -93.2650, 'lat': 44.9778], 'name': 'gcp-us-central1'],
          'gcp-us-east4': ['location': ['lon': -80.1918, 'lat': 25.7617], 'name': 'gcp-us-east4'],
          'gcp-us-west1': ['location': ['lon': -122.4194, 'lat': 37.7749], 'name': 'gcp-us-west1'],
          'gcp-us-west2': ['location': ['lon': -118.2437, 'lat': 34.0522], 'name': 'gcp-us-west2'],
          'gcp-us-east1': ['location': ['lon': -77.0369, 'lat': 38.9072], 'name': 'gcp-us-east1'],
          'gcp-northamerica-northeast1': ['location': ['lon': -73.6148, 'lat': 45.5059], 'name': 'gcp-northamerica-northeast1'],
          'gcp-southamerica-east1': ['location': ['lon': -46.6333, 'lat': -23.5505], 'name': 'gcp-southamerica-east1'],
          'gcp-europe-west1': ['location': ['lon': -6.2603, 'lat': 53.3498], 'name': 'gcp-europe-west1'],
          'gcp-europe-west2': ['location': ['lon': -0.1276, 'lat': 51.5074], 'name': 'gcp-europe-west2'],
          'gcp-europe-west3': ['location': ['lon': 11.5820, 'lat': 48.1351], 'name': 'gcp-europe-west3'],
          'gcp-europe-west4': ['location': ['lon': 19.0402, 'lat': 47.4979], 'name': 'gcp-europe-west4'],
          'gcp-europe-north1': ['location': ['lon': 24.9458, 'lat': 60.1921], 'name': 'gcp-europe-north1'],
          'gcp-asia-east1': ['location': ['lon': 121.5654, 'lat': 25.0330], 'name': 'gcp-asia-east1'],
          'gcp-asia-northeast1': ['location': ['lon': 139.6917, 'lat': 35.6895], 'name': 'gcp-asia-northeast1'],
          'gcp-asia-south1': ['location': ['lon': 72.8777, 'lat': 19.0760], 'name': 'gcp-asia-south1'],
          'gcp-asia-southeast1': ['location': ['lon': 103.8198, 'lat': 1.3521], 'name': 'gcp-asia-southeast1'],
          'gcp-australia-southeast1': ['location': ['lon': 151.2093, 'lat': -33.8688], 'name': 'gcp-australia-southeast1'],
          'gcp-asia-northeast3': ['location': ['lon': 126.9780, 'lat': 37.5665], 'name': 'gcp-asia-northeast3'],
          'gcp-asia-southeast2': ['location': ['lon': 106.8650, 'lat': -6.2088], 'name': 'gcp-asia-southeast2'],
          'gcp-europe-west9': ['location': ['lon': 4.9041, 'lat': 52.3676], 'name': 'gcp-europe-west9'],
          'gcp-me-west1': ['location': ['lon': 34.8516, 'lat': 31.0461], 'name': 'gcp-me-west1'],
          'aws-us-east-2': ['location': ['lon': -82.9988, 'lat': 39.9612], 'name': 'aws-us-east-2'],
