- name: input.type
  type: keyword
  description: Input type used to collect the event.
- name: doc_type
  type: keyword
  description: Chargeback billing event record type (billing_line_item, credit_line_item, config_snapshot).
- name: ess.billing.organization_id
  type: keyword
  description: Elastic Cloud organization ID.
- name: ess.billing.deployment_id
  type: keyword
  description: Deployment or Serverless project ID.
- name: ess.billing.deployment_name
  type: keyword
  description: Deployment or Serverless project display name.
- name: ess.billing.deployment_type
  type: keyword
  description: Instance type (deployment, elasticsearch, observability, security, vectordb, onprem).
- name: ess.billing.deployment_tags
  type: keyword
  description: Deployment metadata tags formatted as key:value.
- name: ess.billing.sku
  type: keyword
  description: Elastic Cloud billing SKU.
- name: ess.billing.type
  type: keyword
  description: Billing line item or credit commitment type (capacity, data_out, data_in, storage, support, usage).
- name: ess.billing.kind
  type: keyword
  description: Resource kind (elasticsearch, kibana, apm, enterprise_search, integrations_server).
- name: ess.billing.total_ecu
  type: double
  description: Billed Elasticsearch Compute Units (ECU) for the daily window.
- name: ess.billing.quantity.value
  type: double
  description: Billed resource quantity value (for example capacity hours or VCU).
- name: ess.billing.ram_per_zone
  type: long
  description: Provisioned RAM per availability zone in MB (extracted from ECH SKU).
- name: ess.billing.zone_count
  type: long
  description: Availability zone count (extracted from ECH SKU).
- name: ess.billing.cloud.service.type
  type: keyword
  description: Serverless cloud service type extracted from SKU.
- name: ess.billing.from
  type: date
  description: Billing window start timestamp.
- name: ess.billing.to
  type: date
  description: Billing window end timestamp.
- name: ess.billing.active
  type: boolean
  description: Whether the ESS credit commitment line item is active.
- name: ess.billing.ecu_balance
  type: double
  description: Remaining ECU balance in the ESS credit commitment line item.
- name: ess.billing.ecu_quantity
  type: double
  description: Initially purchased ECU quantity in the ESS credit commitment line item.
- name: ess.billing.start
  type: date
  description: Start timestamp of the ESS credit commitment line item.
- name: ess.billing.end
  type: date
  description: End timestamp of the ESS credit commitment line item.
- name: cloud.account.id
  type: keyword
  description: Elastic Cloud organization account ID.
- name: cloud.instance.id
  type: keyword
  description: Deployment or project instance ID.
- name: cloud.instance.name
  type: keyword
  description: Deployment or project instance name.
- name: cloud.provider
  type: keyword
  description: Cloud provider (aws, gcp, azure, serverless, onprem).
- name: cloud.machine.type
  type: keyword
  description: Machine profile extracted from ECH SKU.
- name: cloud.region
  type: keyword
  description: Cloud region identifier.
- name: cloud.geo.name
  type: keyword
  description: Cloud region geo label.
- name: cloud.geo.location
  type: geo_point
  description: Cloud region geographic coordinates.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured monetary value per Elastic Cloud chargeable unit (ECU) from Fleet Billing data stream settings.
- name: conf_onprem_chargeable_unit_rate
  type: double
  description: Configured monetary value per On-Premises milli-ERU (mERU) from Fleet Billing data stream settings.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency code from Fleet Billing data stream settings.
- name: conf_effective_from
  type: keyword
  description: Optional ISO-8601 UTC effective start timestamp for non-overlapping configuration periods.
- name: conf_sync_enabled
  type: boolean
  description: Whether Fleet configuration sync is enabled on the policy snapshot.
- name: conf_owner_id
  type: keyword
  description: Optional explicit configuration owner identifier configured on the policy.
- name: conf_policy_id
  type: keyword
  description: Stable cursor-scoped policy identifier emitted on configuration and credit commitment snapshots to isolate multi-policy agents.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
