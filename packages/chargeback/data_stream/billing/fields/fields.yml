- name: ess.billing.organization_id
  type: keyword
  description: Elastic Cloud organization ID.
- name: ess.billing.deployment_id
  type: keyword
  description: Deployment or Serverless project ID.
- name: ess.billing.deployment_name
  type: keyword
  description: Deployment or Serverless project display name.
- name: ess.billing.deployment_type
  type: keyword
  description: Instance type (deployment, elasticsearch, observability, security, vectordb).
- name: ess.billing.deployment_tags
  type: keyword
  description: Deployment metadata tags formatted as key:value.
- name: ess.billing.sku
  type: keyword
  description: Elastic Cloud billing SKU.
- name: ess.billing.type
  type: keyword
  description: Billing line item type (capacity, data_out, data_in, storage, support, usage).
- name: ess.billing.kind
  type: keyword
  description: Resource kind (elasticsearch, kibana, apm, enterprise_search, integrations_server).
- name: ess.billing.total_ecu
  type: double
  description: Billed Elasticsearch Compute Units (ECU) for the daily window.
- name: ess.billing.quantity.value
  type: double
  description: Billed resource quantity value (for example capacity hours or VCU).
- name: ess.billing.ram_per_zone
  type: long
  description: Provisioned RAM per availability zone in MB (extracted from ECH SKU).
- name: ess.billing.zone_count
  type: long
  description: Availability zone count (extracted from ECH SKU).
- name: ess.billing.cloud.service.type
  type: keyword
  description: Serverless cloud service type extracted from SKU.
- name: ess.billing.from
  type: date
  description: Billing window start timestamp.
- name: ess.billing.to
  type: date
  description: Billing window end timestamp.
- name: cloud.account.id
  type: keyword
  description: Elastic Cloud organization account ID.
- name: cloud.instance.id
  type: keyword
  description: Deployment or project instance ID.
- name: cloud.instance.name
  type: keyword
  description: Deployment or project instance name.
- name: cloud.provider
  type: keyword
  description: Cloud provider (aws, gcp, azure, serverless).
- name: cloud.machine.type
  type: keyword
  description: Machine profile extracted from ECH SKU.
- name: cloud.region
  type: keyword
  description: Cloud region identifier.
- name: cloud.geo.name
  type: keyword
  description: Cloud region geo label.
- name: cloud.geo.location
  type: geo_point
  description: Cloud region geographic coordinates.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured monetary value per chargeable unit from Fleet Billing data stream settings.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency code from Fleet Billing data stream settings.
- name: credit_active
  type: boolean
  description: Whether the organization has an active ESS credit commitment line item on this snapshot.
- name: credit_ecu_balance
  type: long
  description: Remaining ECU balance across active ESS credit commitment line items.
- name: credit_ecu_quantity
  type: long
  description: Purchased ECU quantity across active ESS credit commitment line items.
- name: credit_start
  type: date
  description: Earliest start date of active ESS credit commitment line items.
- name: credit_end
  type: date
  description: Latest expiration date of active ESS credit commitment line items.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
