vars:
  organization_id: "2222"
  cloud_api_key: "test-custom-cloud-api-key"
  hub_es_url: "https://hub.example.com:9200/"
  hub_es_api_key: "test-hub-key"
  deployment_api_keys: "dep-1:key-1"
  sync_fleet_config: true
  config_owner_id: "primary-owner"
  billing_api_base: "https://billing.example.com"
  cloud_api_base: "https://api.example.com"
  proxy_url: "http://proxy.example.com:8080"
  ssl: |-
    verification_mode: full
    certificate_authorities:
      - /etc/ssl/ca.pem
  http_client_timeout: "60s"
  enable_request_tracer: true
data_stream:
  vars:
    lookbehind: 14
    currency_unit: "USD"
    unit_rate: "0.92"
    onprem_unit_rate: "0.00095"
    config_effective_from: "2026-02-01"
    collect_ess_credits: true
