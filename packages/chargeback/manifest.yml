format_version: 3.5.0
name: chargeback
title: "Chargeback"
version: 0.6.0
description: "Allocate Elastic Cloud Hosted (ECH), Serverless, and On-Premises billing to deployments, data tiers, and data streams. Native Fleet integration with self-contained Elastic Agent CEL collection, Elasticsearch Transforms, lookup indices, and opt-in compatibility aliases for stock ESS Billing and Elasticsearch Consumption dashboards."
type: integration
categories:
  - cloud
  - custom
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/chargeback-billing-overview.png
    title: Billing Components Overview dashboard
    size: 959x1024
    type: image/png
  - src: /img/chargeback-usage-allocation.png
    title: Usage and Cost Allocation dashboard
    size: 431x1024
    type: image/png
  - src: /img/chargeback-configuration.png
    title: Configuration dashboard
    size: 1024x452
    type: image/png
icons:
  - src: /img/elastic-logo.svg
    title: Elastic logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: chargeback
    title: Chargeback
    description: >-
      Collect Elastic Cloud Hosted (ECH) and Serverless billing alongside ECH, Serverless, and self-managed index/tier usage and node utilization metrics on a schedule. Self-managed cost allocation requires On-Premises Billing (metrics-ess_billing.billing-onprem*) or a compatible billing producer. Connection settings, currency rates, and cost weights are configured in Fleet. Secrets are encrypted in Fleet and never stored in plaintext indices.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: false
    inputs:
      - type: cel
        title: Elastic Cloud & Cluster Access
        description: >-
          Configure Elastic Cloud credentials (for Cloud Billing and Control Plane discovery) and/or a local Hub / self-managed Elasticsearch URL and API keys. Leave Organization ID and Elastic Cloud API Key empty when running in On-Premises / Hub-only mode alongside On-Premises Billing (metrics-ess_billing.billing-onprem*) or a compatible billing producer. Currency rates, credit commitments, and cost/utilization weights are configured in each data stream below.
        vars:
          - name: organization_id
            type: text
            title: Organization ID
            description: >-
              Elastic Cloud organization ID (found on Cloud Console → Organization). Leave empty for On-Premises / self-managed hub-only mode (requires On-Premises Billing or a compatible billing producer for cost dashboards).
            multi: false
            required: false
            show_user: true
            secret: false
            default: ""
          - name: cloud_api_key
            type: password
            title: Elastic Cloud API Key
            description: >-
              Elastic Cloud API key created in Cloud Console → Organization → API keys with Billing Admin access (and Deployment / Serverless read access). Leave empty for On-Premises / self-managed hub-only mode (requires On-Premises Billing or a compatible billing producer for cost dashboards).
            multi: false
            required: false
            show_user: true
            secret: true
          - name: hub_es_url
            type: text
            title: Local / Hub Elasticsearch URL
            description: >-
              Optional Elasticsearch URL of the local or self-managed Hub cluster for direct index and node stats harvesting. Cross-Cluster Search (CCS) remote monitoring indices (*:monitoring-indices*) are read directly by the Chargeback usage transforms.
            multi: false
            required: false
            show_user: true
            default: ""
          - name: hub_es_api_key
            type: password
            title: Local / Hub Elasticsearch API Key
            description: >-
              Optional Elasticsearch API key for harvesting local or self-managed Hub cluster index and node metrics.
            multi: false
            required: false
            show_user: true
            secret: true
          - name: deployment_api_keys
            type: password
            title: Target Deployment Elasticsearch API Keys
            description: >-
              Optional comma-separated least-privileged Elasticsearch API keys for direct harvesting of target ECH deployments or Serverless projects in <deployment_id_or_name>:<encoded_api_key> format.
            multi: false
            required: false
            show_user: true
            secret: true
          - name: sync_fleet_config
            type: bool
            title: Sync Fleet Rate & Weight Settings to Configuration Lookup
            description: >-
              Continuously sync Fleet currency rates, workload weights, and utilization settings into chargeback_conf_lookup. Disable when preserving manual rate updates or custom multi-period rows managed directly via the chargeback_conf_lookup API.
            multi: false
            required: false
            show_user: true
            default: true
          - name: billing_api_base
            type: text
            title: Billing API Base URL
            description: Base URL of the Elastic Cloud Billing API.
            required: false
            show_user: false
            default: "https://billing.elastic-cloud.com"
          - name: cloud_api_base
            type: text
            title: Cloud Control Plane API Base URL
            description: Base URL of the Elastic Cloud Control Plane API.
            required: false
            show_user: false
            default: "https://api.elastic-cloud.com"
          - name: proxy_url
            type: text
            title: Proxy URL
            description: >-
              URL to proxy connections in the form of http[s]://<user>:<password>@<server name/ip>:<port>.
            multi: false
            required: false
            show_user: false
          - name: ssl
            type: yaml
            title: SSL Configuration
            description: >-
              SSL configuration options.
            multi: false
            required: false
            show_user: false
            default: |
              #certificate_authorities: []
          - name: http_client_timeout
            type: text
            title: HTTP Client Timeout
            description: >-
              Duration before declaring that the HTTP client connection has timed out.
            multi: false
            required: false
            show_user: false
            default: "30s"
          - name: enable_request_tracer
            type: bool
            title: Enable request tracing
            description: >-
              Logs HTTP requests and responses to the agent's local file-system for debugging.
            multi: false
            required: false
            show_user: false
            default: false
owner:
  github: elastic/customer-architects
  type: elastic
