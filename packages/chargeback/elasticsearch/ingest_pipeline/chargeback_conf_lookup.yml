---
description: Post-process chargeback configuration to extract currency unit from terms aggregation
processors:
  - script:
      description: Extract currency unit key from terms aggregation bucket
      lang: painless
      source: |
        if (ctx.conf_chargeable_unit_rate_unit instanceof Map) {
          def keys = new ArrayList(ctx.conf_chargeable_unit_rate_unit.keySet());
          if (keys.size() > 0) {
            ctx.conf_chargeable_unit_rate_unit = keys[0];
          }
        }
  # LOOKUP JOIN overwrites left-side @timestamp with the right-side field when present.
  # Conf docs must not carry @timestamp (including null), or billing panels bucket into null / wrong dates.
  - remove:
      field: "@timestamp"
      ignore_missing: true
      tag: remove_conf_timestamp
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
on_failure:
  - set:
      field: error.message
      value: "Failed to process chargeback config: {{ _ingest.on_failure_message }}"
