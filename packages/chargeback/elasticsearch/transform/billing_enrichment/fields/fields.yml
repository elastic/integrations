- name: "@timestamp"
  type: date
  description: Timestamp representing the billing day.
- name: composite_key
  type: keyword
  description: Composite join key in YYYY-MM-DD_<deployment_id> format matching billing and usage lookups.
- name: deployment_id
  type: keyword
  description: Unique ID of the deployment.
- name: deployment_name
  type: keyword
  description: Human-readable name of the deployment.
- name: deployment_group
  type: keyword
  description: User-defined group of the deployment (based on tag:chargeback_group).
- name: group_first_seen
  type: date
  description: Earliest timestamp at which the current deployment chargeback group was observed.
- name: is_onprem
  type: boolean
  description: Whether the deployment billing originates from an On-Premises mERU producer.
- name: ai_chargeable_units
  type: double
  description: Daily AI and ML chargeable units (ECU) for the deployment.
- name: synthetics_chargeable_units
  type: double
  description: Daily total Synthetics chargeable units (ECU) for the deployment.
- name: synthetics_pings_units
  type: double
  description: Daily Synthetics lightweight ping chargeable units (ECU) for the deployment.
- name: synthetics_executions_units
  type: double
  description: Daily Synthetics browser execution chargeable units (ECU) for the deployment.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
