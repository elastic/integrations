- name: "@timestamp"
  type: date
  description: The timestamp representing the day of the billing data.
- name: deployment_group
  type: keyword
  description: User-defined group of the deployment (based on tag:chargeback_group).
- name: deployment_id
  type: keyword
  description: Unique ID of the deployment.
- name: deployment_name
  type: keyword
  description: Human-readable name of the deployment.
- name: total_chargeable_units
  type: double
  description: Total chargeable units (ECU/ERU) aggregated for the deployment per day.
- name: total_ecu
  type: alias
  path: total_chargeable_units
  description: Deprecated alias of total_chargeable_units for dashboard ES|QL compatibility.
- name: composite_key
  type: keyword
  description: Composite key used for billing attribution (set by ingest pipeline) consisting of date and deployment ID.
- name: sku
  type: keyword
  description: Component where the ecu is being spend
- name: cost_type
  type: keyword
  description: Component where the ecu is being spent, derived from SKU field.
- name: cost_category
  type: keyword
  description: FinOps category (data_tier, platform, transfer, snapshot, support, onprem, other).
- name: is_allocatable
  type: boolean
  description: Whether this SKU row contributes to the realized data-tier capacity pool.
- name: is_onprem
  type: boolean
  description: Whether this billing row originates from an On-Premises mERU producer (1 ERU = 1,000 mERU).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
- name: event.dataset
  type: keyword
  description: Symlink dataset identifier for ESS Billing compatibility.
- name: data_stream.type
  type: keyword
  description: Symlink data stream type for ESS Billing compatibility.
- name: data_stream.dataset
  type: keyword
  description: Symlink data stream dataset for ESS Billing compatibility.
- name: data_stream.namespace
  type: keyword
  description: Symlink data stream namespace for ESS Billing compatibility.
- name: ess.billing.organization_id
  type: keyword
  description: Elastic Cloud organization ID (ESS Billing symlink).
- name: ess.billing.deployment_id
  type: keyword
  description: Deployment or Serverless project ID (ESS Billing symlink).
- name: ess.billing.deployment_name
  type: keyword
  description: Deployment or Serverless project name (ESS Billing symlink).
- name: ess.billing.deployment_type
  type: keyword
  description: Instance type (deployment, elasticsearch, observability, security) (ESS Billing symlink).
- name: ess.billing.sku
  type: keyword
  description: Elastic Cloud billing SKU (ESS Billing symlink).
- name: ess.billing.type
  type: keyword
  description: ESS Billing category type (capacity, usage, storage, data_out, data_in, support).
- name: ess.billing.kind
  type: keyword
  description: Resource kind (elasticsearch, kibana, apm, enterprise_search, integrations_server).
- name: ess.billing.total_ecu
  type: double
  description: Daily billed ECUs (ESS Billing symlink).
- name: ess.billing.quantity.value
  type: double
  description: Raw billing quantity value (ESS Billing symlink).
- name: ess.billing.ram_per_zone
  type: long
  description: Provisioned RAM per availability zone in MB (ESS Billing symlink).
- name: ess.billing.zone_count
  type: long
  description: Availability zone count (ESS Billing symlink).
- name: ess.billing.cloud.service.type
  type: keyword
  description: Cloud service type extracted from SKU (ESS Billing compatibility).
- name: cloud.account.id
  type: keyword
  description: Elastic Cloud organization account ID (ESS Billing symlink).
- name: cloud.instance.id
  type: keyword
  description: Deployment or project instance ID (ESS Billing symlink).
- name: cloud.instance.name
  type: keyword
  description: Deployment or project instance name (ESS Billing symlink).
- name: cloud.provider
  type: keyword
  description: Cloud provider name (ESS Billing symlink).
- name: cloud.machine.type
  type: keyword
  description: Cloud machine profile extracted from ECH SKU (ESS Billing symlink).
- name: cloud.region
  type: keyword
  description: Cloud region name (ESS Billing symlink).
- name: cloud.geo.name
  type: keyword
  description: Cloud region geo label for Map visualization (ESS Billing symlink).
- name: cloud.geo.location
  type: geo_point
  description: Cloud region coordinates for Map visualization (ESS Billing symlink).
