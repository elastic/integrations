            'quantity_value': sumQty,
            'deployment_group': depGroup,
            'deployment_name': depName,
            'organization_id': orgId,
            'deployment_type': depType,
            'billing_type': bType,
            'billing_kind': bKind,
            'cloud_region': cRegion
          ];
settings:
