            'dep_type': depType,
            'b_type': bType,
            'b_kind': bKind,
            'c_region': cRegion
          ];
          Map ex = (Map)state.items.get(dedupKey);
          if (ex == null) {
            state.items.put(dedupKey, rec);
          } else {
            long exTs = ((Number)ex.get('ing_ts')).longValue();
            int newMeta = (depGroup != '' ? 2 : 0) + (depName != '' ? 1 : 0);
            int oldMeta = (ex.get('dep_group') != '' ? 2 : 0) + (ex.get('dep_name') != '' ? 1 : 0);
            if (ingTs > exTs || (ingTs == exTs && (newMeta > oldMeta || (newMeta == oldMeta && ecu >= ((Number)ex.get('ecu')).doubleValue())))) {
              state.items.put(dedupKey, rec);
            }
          }
        combine_script: "return state;"
        reduce_script: |
          Map merged = new HashMap();
          for (def st : states) {
