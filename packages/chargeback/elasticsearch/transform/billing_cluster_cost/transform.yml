description: Aggregates daily total chargeable units (ECU/ERU) per deployment and SKU across native Chargeback and legacy ESS/On-Prem Billing sources.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.billing-*
    - -metrics-ess_billing.billing-chargeback
    - -chargeback_lookup.*
  query:
    bool:
      filter:
        - exists:
            field: ess.billing.sku
        - range:
            ess.billing.total_ecu:
              gte: 0
      must_not:
        - terms:
            doc_type:
              - config_snapshot
              - credit_line_item
  runtime_mappings:
    cb_sync_ts:
      type: date
      script:
        source: |
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          for (String k : ['ingested', 'created']) {
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
            if (rawVal == null && params._source != null) {
              rawVal = params._source.get('event.' + k);
            }
            if (rawVal != null) {
              if (rawVal instanceof Number) {
                emit(((Number)rawVal).longValue());
                return;
              }
              String s = rawVal.toString().trim();
              if (s != '') {
                try {
                  emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                  return;
                } catch (Exception e) {}
              }
            }
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    deployment_group:
      type: keyword
      script:
        source: |
          if (params._source?.ess?.billing?.deployment_tags != null) {
            def tags = params._source.ess.billing.deployment_tags;
            if (tags instanceof List) {
              for (tag in tags) {
                if (tag.startsWith('chargeback_group:')) {
                  emit(tag.substring('chargeback_group:'.length()));
                  return;
                }
              }
            } else if (tags instanceof String) {
              if (tags.startsWith('chargeback_group:')) {
                emit(tags.substring('chargeback_group:'.length()));
                return;
              }
            }
          }
          emit('');
dest:
  index: chargeback_lookup.dest_billing_cluster_cost-1
  aliases:
    - alias: chargeback_lookup.billing_cluster_cost
      move_on_creation: true
  pipeline: logs-chargeback.lookup-0.6.0-billing
frequency: 60m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    deployment_id:
      terms:
        field: ess.billing.deployment_id
    sku:
      terms:
        field: ess.billing.sku
  aggregations:
    native:
      scripted_metric:
        init_script: "state.items = new HashMap();"
        map_script: |
          boolean isNat = false;
          try {
            if (doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty) {
              isNat = doc['data_stream.dataset'].value.toString() == 'chargeback.billing';
            } else if (params._source?.data_stream?.dataset != null) {
              isNat = params._source.data_stream.dataset.toString() == 'chargeback.billing';
            }
          } catch (Exception e) {}
          if (!isNat) { return; }

          long ingTs = 0L;
          try {
            if (doc.containsKey('cb_sync_ts') && !doc['cb_sync_ts'].empty) {
              ingTs = doc['cb_sync_ts'].value.toInstant().toEpochMilli();
            }
          } catch (Exception e) {}

          String orgId = '';
          try {
            if (doc.containsKey('ess.billing.organization_id') && !doc['ess.billing.organization_id'].empty) {
              orgId = doc['ess.billing.organization_id'].value.toString();
            } else if (params._source?.ess?.billing?.organization_id != null) {
              orgId = params._source.ess.billing.organization_id.toString();
            }
          } catch (Exception e) {}

          String depId = '';
          try {
            if (doc.containsKey('ess.billing.deployment_id') && !doc['ess.billing.deployment_id'].empty) {
              depId = doc['ess.billing.deployment_id'].value.toString();
            } else if (params._source?.ess?.billing?.deployment_id != null) {
