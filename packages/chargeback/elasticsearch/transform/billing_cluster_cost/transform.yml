description: Aggregates daily total chargeable units (ECU/ERU) per deployment from self-collected billing metrics and exposes symlink aliases for stock ESS Billing dashboards.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.billing-onprem*
  query:
    range:
      ess.billing.total_ecu:
        gt: 0
  runtime_mappings:
    deployment_group:
      type: keyword
      script:
        source: |
          if (params._source?.ess?.billing?.deployment_tags != null) {
            def tags = params._source.ess.billing.deployment_tags;
            if (tags instanceof List) {
              for (tag in tags) {
                if (tag.startsWith('chargeback_group:')) {
                  emit(tag.substring('chargeback_group:'.length()));
                  return;
                }
              }
            } else if (tags instanceof String) {
              if (tags.startsWith('chargeback_group:')) {
                emit(tags.substring('chargeback_group:'.length()));
                return;
              }
            }
          }
          emit('');
dest:
  index: billing_cluster_cost_lookup
  aliases:
    - alias: metrics-ess_billing.billing-chargeback
      move_on_creation: true
    - alias: metrics-ess_billing.credits-chargeback
      move_on_creation: true
  pipeline: logs-chargeback.lookup-0.6.0-billing
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    deployment_group:
      terms:
        field: deployment_group
    deployment_id:
      terms:
        field: ess.billing.deployment_id
    deployment_name:
      terms:
        field: ess.billing.deployment_name
    sku:
      terms:
        field: ess.billing.sku
  aggregations:
    total_chargeable_units:
      sum:
        field: ess.billing.total_ecu
    quantity_value:
      sum:
        field: ess.billing.quantity.value
    organization_id:
      terms:
        field: ess.billing.organization_id
        size: 1
    deployment_type:
      terms:
        field: ess.billing.deployment_type
        size: 1
    billing_type:
      terms:
        field: ess.billing.type
        size: 1
    billing_kind:
      terms:
        field: ess.billing.kind
        size: 1
    cloud_region:
      terms:
        field: cloud.region
        size: 1
    credit_active:
      terms:
        field: credit_active
        size: 1
    credit_ecu_balance:
      max:
        field: credit_ecu_balance
    credit_ecu_quantity:
      max:
        field: credit_ecu_quantity
    credit_start:
      terms:
        field: credit_start
        size: 1
    credit_end:
      terms:
        field: credit_end
        size: 1
settings:
  # This is required to prevent the transform from clobbering the Fleet-managed mappings.
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
