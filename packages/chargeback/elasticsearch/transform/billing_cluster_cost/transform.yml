description: Aggregates daily total chargeable units (ECU/ERU) per deployment and SKU across native Chargeback and legacy ESS/On-Prem Billing sources.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.billing-*
    - chargeback_lookup.dest_billing_cluster_cost-1*
    - -metrics-ess_billing.billing-chargeback*
    - -partial-*
    - -chargeback_lookup.dest_billing_cluster_cost-2*
  query:
    bool:
      should:
        - bool:
            filter:
              - exists:
                  field: ess.billing.sku
              - range:
                  ess.billing.total_ecu:
                    gte: 0
            must_not:
              - terms:
                  doc_type:
                    - config_snapshot
                    - credit_line_item
              - term:
                  _index: chargeback_lookup.dest_billing_cluster_cost-1
        - bool:
            filter:
              - term:
                  _index: chargeback_lookup.dest_billing_cluster_cost-1
              - exists:
                  field: sku
      minimum_should_match: 1
  runtime_mappings:
    cb_sync_ts:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'chargeback_lookup.dest_billing_cluster_cost-1') {
            emit(1262304000000L);
            return;
          }
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            for (String k : ['ingested', 'created']) {
              def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
              if (rawVal == null && params._source != null) {
                rawVal = params._source.get('event.' + k);
              }
              if (rawVal != null) {
                if (rawVal instanceof Number) {
                  emit(((Number)rawVal).longValue());
                  return;
                }
                String s = rawVal.toString().trim();
                if (s != '') {
                  try {
                    emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                    return;
                  } catch (Exception e) {}
                }
              }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    deployment_group:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'chargeback_lookup.dest_billing_cluster_cost-1') {
            for (String dgf : ['deployment_group', 'deployment_group.keyword']) {
              try {
                if (doc.containsKey(dgf) && !doc[dgf].empty) {
                  emit(doc[dgf].value.toString().trim());
                  return;
                }
              } catch (Exception e) {}
            }
            try {
              if (params._source?.deployment_group != null) {
                emit(params._source.deployment_group.toString().trim());
                return;
              }
            } catch (Exception e) {}
            emit('');
            return;
          }
          for (String tf : ['ess.billing.deployment_tags', 'ess.billing.deployment_tags.keyword']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                for (def tv : doc[tf]) {
                  if (tv != null) {
                    String s = tv.toString();
                    if (s.toLowerCase(Locale.ROOT).startsWith('chargeback_group:')) {
                      String gv = s.substring('chargeback_group:'.length()).trim();
                      if (gv != '') { emit(gv); return; }
                    }
                  }
                }
              }
            } catch (Exception e) {}
          }
          try {
            if (params._source?.ess?.billing?.deployment_tags != null) {
              def tags = params._source.ess.billing.deployment_tags;
              if (tags instanceof List) {
                for (def tag : tags) {
                  if (tag != null) {
                    String s = tag.toString();
                    if (s.toLowerCase(Locale.ROOT).startsWith('chargeback_group:')) {
                      String gv = s.substring('chargeback_group:'.length()).trim();
                      if (gv != '') { emit(gv); return; }
                    }
                  }
                }
              } else {
                String s = tags.toString();
                if (s.toLowerCase(Locale.ROOT).startsWith('chargeback_group:')) {
                  String gv = s.substring('chargeback_group:'.length()).trim();
                  if (gv != '') { emit(gv); return; }
                }
              }
            }
          } catch (Exception e) {}
          emit('');
    cb_deployment_id:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'chargeback_lookup.dest_billing_cluster_cost-1') {
            for (String df : ['deployment_id', 'deployment_id.keyword', 'ess.billing.deployment_id', 'ess.billing.deployment_id.keyword']) {
              try {
                if (doc.containsKey(df) && !doc[df].empty) {
                  String dv = doc[df].value.toString().trim();
                  if (dv != '' && !dv.equalsIgnoreCase('unassociated')) { emit(dv); return; }
                }
              } catch (Exception e) {}
            }
            try {
              if (params._source?.deployment_id != null) {
                String sdv = params._source.deployment_id.toString().trim();
                if (sdv != '' && !sdv.equalsIgnoreCase('unassociated')) {
                  emit(sdv);
                  return;
                }
              }
              if (params._source?.ess?.billing?.deployment_id != null) {
                String edv = params._source.ess.billing.deployment_id.toString().trim();
                if (edv != '' && !edv.equalsIgnoreCase('unassociated')) {
                  emit(edv);
                  return;
                }
              }
            } catch (Exception e) {}
            String v1Dt = '';
            for (String dtf : ['deployment_type', 'deployment_type.keyword', 'ess.billing.deployment_type', 'ess.billing.deployment_type.keyword']) {
              try {
                if (doc.containsKey(dtf) && !doc[dtf].empty && doc[dtf].value.toString().trim() != '') {
                  v1Dt = doc[dtf].value.toString().trim().toLowerCase(Locale.ROOT);
                  break;
                }
              } catch (Exception e) {}
            }
            if (v1Dt == '' && params._source?.deployment_type != null) {
              v1Dt = params._source.deployment_type.toString().trim().toLowerCase(Locale.ROOT);
            }
            if (v1Dt == '' && params._source?.ess?.billing?.deployment_type != null) {
              v1Dt = params._source.ess.billing.deployment_type.toString().trim().toLowerCase(Locale.ROOT);
            }
            if (v1Dt == 'oblt') { v1Dt = 'observability'; }
            else if (v1Dt == 'sec') { v1Dt = 'security'; }
            else if (v1Dt == 'vector') { v1Dt = 'vectordb'; }
            else if (v1Dt == 'es') { v1Dt = 'elasticsearch'; }
            else if (v1Dt == 'enterprise_search') { v1Dt = 'search'; }
            if (v1Dt == '' || v1Dt == 'serverless') {
              String v1Sk = '';
              for (String sf : ['sku', 'sku.keyword', 'ess.billing.sku', 'ess.billing.sku.keyword']) {
                try {
                  if (doc.containsKey(sf) && !doc[sf].empty && doc[sf].value.toString().trim() != '') {
                    v1Sk = doc[sf].value.toString().trim().toLowerCase(Locale.ROOT);
                    break;
                  }
                } catch (Exception e) {}
              }
              if (v1Sk == '' && params._source?.sku != null) {
                v1Sk = params._source.sku.toString().trim().toLowerCase(Locale.ROOT);
              }
              if (v1Sk == '' && params._source?.ess?.billing?.sku != null) {
                v1Sk = params._source.ess.billing.sku.toString().trim().toLowerCase(Locale.ROOT);
              }
              if (v1Sk.startsWith('observability.') || v1Sk.startsWith('oblt.') || v1Sk.startsWith('serverless.observability.') || v1Sk.startsWith('serverless.oblt.') || v1Sk.contains('.observability.') || v1Sk.contains('.oblt.') || v1Sk.contains('synthetic')) { v1Dt = 'observability'; }
              else if (v1Sk.startsWith('security.') || v1Sk.startsWith('sec.') || v1Sk.startsWith('serverless.security.') || v1Sk.startsWith('serverless.sec.') || v1Sk.contains('.security.') || v1Sk.contains('.sec.')) { v1Dt = 'security'; }
              else if (v1Sk.startsWith('vectordb.') || v1Sk.startsWith('serverless.vectordb.') || v1Sk.contains('.vectordb.')) { v1Dt = 'vectordb'; }
              else if (v1Sk.startsWith('search.') || v1Sk.startsWith('serverless.search.')) { v1Dt = 'search'; }
              else if (v1Sk.startsWith('elasticsearch.') || v1Sk.startsWith('es.') || v1Sk.startsWith('serverless.elasticsearch.') || v1Sk.startsWith('serverless.es.') || v1Sk.contains('.elasticsearch.')) { v1Dt = 'elasticsearch'; }
              else { v1Dt = 'serverless'; }
            }
            emit('unassociated_' + v1Dt);
            return;
          }
          for (String df : ['ess.billing.deployment_id', 'ess.billing.deployment_id.keyword']) {
            try {
              if (doc.containsKey(df) && !doc[df].empty) {
                String dv = doc[df].value.toString().trim();
                if (dv != '' && !dv.equalsIgnoreCase('unassociated')) { emit(dv); return; }
              }
            } catch (Exception e) {}
          }
          try {
            if (params._source?.ess?.billing?.deployment_id != null) {
              String sdv = params._source.ess.billing.deployment_id.toString().trim();
              if (sdv != '' && !sdv.equalsIgnoreCase('unassociated')) {
                emit(sdv);
                return;
              }
            }
          } catch (Exception e) {}
          String dt = '';
          for (String dtf : ['ess.billing.deployment_type', 'ess.billing.deployment_type.keyword']) {
            try {
              if (doc.containsKey(dtf) && !doc[dtf].empty && doc[dtf].value.toString().trim() != '') {
                dt = doc[dtf].value.toString().trim().toLowerCase(Locale.ROOT);
                break;
              }
            } catch (Exception e) {}
          }
          if (dt == '' && params._source?.ess?.billing?.deployment_type != null) {
            dt = params._source.ess.billing.deployment_type.toString().trim().toLowerCase(Locale.ROOT);
          }
          if (dt == 'oblt') { dt = 'observability'; }
          else if (dt == 'sec') { dt = 'security'; }
          else if (dt == 'vector') { dt = 'vectordb'; }
          else if (dt == 'es') { dt = 'elasticsearch'; }
          else if (dt == 'enterprise_search') { dt = 'search'; }
          if (dt == '' || dt == 'serverless') {
            String sk = '';
            for (String sf : ['ess.billing.sku', 'ess.billing.sku.keyword']) {
              try {
                if (doc.containsKey(sf) && !doc[sf].empty && doc[sf].value.toString().trim() != '') {
                  sk = doc[sf].value.toString().trim().toLowerCase(Locale.ROOT);
                  break;
                }
              } catch (Exception e) {}
            }
            if (sk == '' && params._source?.ess?.billing?.sku != null) {
              sk = params._source.ess.billing.sku.toString().trim().toLowerCase(Locale.ROOT);
            }
            if (sk.startsWith('observability.') || sk.startsWith('oblt.') || sk.startsWith('serverless.observability.') || sk.startsWith('serverless.oblt.') || sk.contains('.observability.') || sk.contains('.oblt.') || sk.contains('synthetic')) { dt = 'observability'; }
            else if (sk.startsWith('security.') || sk.startsWith('sec.') || sk.startsWith('serverless.security.') || sk.startsWith('serverless.sec.') || sk.contains('.security.') || sk.contains('.sec.')) { dt = 'security'; }
            else if (sk.startsWith('vectordb.') || sk.startsWith('serverless.vectordb.') || sk.contains('.vectordb.')) { dt = 'vectordb'; }
            else if (sk.startsWith('search.') || sk.startsWith('serverless.search.')) { dt = 'search'; }
            else if (sk.startsWith('elasticsearch.') || sk.startsWith('es.') || sk.startsWith('serverless.elasticsearch.') || sk.startsWith('serverless.es.') || sk.contains('.elasticsearch.')) { dt = 'elasticsearch'; }
            else { dt = 'serverless'; }
          }
          emit('unassociated_' + dt);
    cb_sku:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'chargeback_lookup.dest_billing_cluster_cost-1') {
            for (String sf : ['sku', 'sku.keyword', 'ess.billing.sku', 'ess.billing.sku.keyword']) {
              try {
                if (doc.containsKey(sf) && !doc[sf].empty) {
                  String sv = doc[sf].value.toString().trim();
                  if (sv != '') { emit(sv); return; }
                }
              } catch (Exception e) {}
            }
            try {
              if (params._source?.sku != null && params._source.sku.toString().trim() != '') {
                emit(params._source.sku.toString().trim());
                return;
              }
            } catch (Exception e) {}
          }
          for (String sf : ['ess.billing.sku', 'ess.billing.sku.keyword']) {
            try {
              if (doc.containsKey(sf) && !doc[sf].empty) {
                String sv = doc[sf].value.toString().trim();
                if (sv != '') { emit(sv); return; }
              }
            } catch (Exception e) {}
          }
          try {
            if (params._source?.ess?.billing?.sku != null && params._source.ess.billing.sku.toString().trim() != '') {
              emit(params._source.ess.billing.sku.toString().trim());
            }
          } catch (Exception e) {}
dest:
  index: chargeback_lookup.dest_billing_cluster_cost-2
  aliases:
    - alias: chargeback_lookup.billing_cluster_cost
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "billing" }}'
frequency: 60m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    deployment_id:
      terms:
        field: cb_deployment_id
    sku:
      terms:
        field: cb_sku
  aggregations:
    native:
      scripted_metric:
        init_script: "state.items = new HashMap(); state.min_bucket_ing = 0L; state.grp_min_ing = new HashMap(); state.grp_min_gfs = new HashMap();"
        map_script: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'chargeback_lookup.dest_billing_cluster_cost-1') {
            return;
          }
          boolean isNat = false;
          try {
            if (doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty) {
              isNat = doc['data_stream.dataset'].value.toString() == 'chargeback.billing';
            } else if (params._source?.data_stream?.dataset != null) {
              isNat = params._source.data_stream.dataset.toString() == 'chargeback.billing';
            }
          } catch (Exception e) {}
          if (!isNat) { return; }

          long ingTs = 0L;
          try {
            if (doc.containsKey('cb_sync_ts') && !doc['cb_sync_ts'].empty) {
              ingTs = doc['cb_sync_ts'].value.toInstant().toEpochMilli();
            }
          } catch (Exception e) {}

          String orgId = '';
          try {
            if (doc.containsKey('ess.billing.organization_id') && !doc['ess.billing.organization_id'].empty) {
              orgId = doc['ess.billing.organization_id'].value.toString().trim();
            } else if (params._source?.ess?.billing?.organization_id != null) {
              orgId = params._source.ess.billing.organization_id.toString().trim();
            }
          } catch (Exception e) {}

          String depId = '';
          try {
            if (doc.containsKey('cb_deployment_id') && !doc['cb_deployment_id'].empty) {
              depId = doc['cb_deployment_id'].value.toString().trim();
            } else if (doc.containsKey('ess.billing.deployment_id') && !doc['ess.billing.deployment_id'].empty) {
              depId = doc['ess.billing.deployment_id'].value.toString().trim();
            } else if (params._source?.ess?.billing?.deployment_id != null) {
              depId = params._source.ess.billing.deployment_id.toString().trim();
            }
          } catch (Exception e) {}

          String sku = '';
          try {
            if (doc.containsKey('ess.billing.sku') && !doc['ess.billing.sku'].empty) {
              sku = doc['ess.billing.sku'].value.toString().trim();
            } else if (params._source?.ess?.billing?.sku != null) {
              sku = params._source.ess.billing.sku.toString().trim();
            }
          } catch (Exception e) {}

          String fromKey = '';
          try {
            if (doc.containsKey('ess.billing.from') && !doc['ess.billing.from'].empty) {
              fromKey = Long.toString(doc['ess.billing.from'].value.toInstant().toEpochMilli());
            } else if (params._source?.ess?.billing?.from != null) {
              String fs = params._source.ess.billing.from.toString().trim();
              try { fromKey = Long.toString(ZonedDateTime.parse(fs).toInstant().toEpochMilli()); }
              catch (Exception pe) { fromKey = fs; }
            } else if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
              fromKey = 'ts:' + Long.toString(doc['@timestamp'].value.toInstant().toEpochMilli());
            }
          } catch (Exception e) {}

          String toKey = '';
          try {
            if (doc.containsKey('ess.billing.to') && !doc['ess.billing.to'].empty) {
              toKey = Long.toString(doc['ess.billing.to'].value.toInstant().toEpochMilli());
            } else if (params._source?.ess?.billing?.to != null) {
              String tsStr = params._source.ess.billing.to.toString().trim();
              try { toKey = Long.toString(ZonedDateTime.parse(tsStr).toInstant().toEpochMilli()); }
              catch (Exception pe) { toKey = tsStr; }
            }
          } catch (Exception e) {}

          String nodeStr = '';
          try {
            for (String nf : ['elasticsearch.node.id', 'elasticsearch.node.id.keyword']) {
              if (doc.containsKey(nf) && !doc[nf].empty) {
                nodeStr = doc[nf].value.toString();
                if (nodeStr != '') { break; }
              }
            }
            if (nodeStr == '') {
              def nk = params._source?.elasticsearch?.node?.id;
              if (nk != null && nk.toString() != '') {
                nodeStr = nk.toString();
              }
            }
            if (nodeStr == '') {
              String dtCheck = '';
              if (doc.containsKey('ess.billing.deployment_type') && !doc['ess.billing.deployment_type'].empty) {
                dtCheck = doc['ess.billing.deployment_type'].value.toString();
              } else if (params._source?.ess?.billing?.deployment_type != null) {
                dtCheck = params._source.ess.billing.deployment_type.toString();
              }
              if ('onprem_node'.equals(sku) || 'onprem'.equals(dtCheck) || 'ece'.equals(dtCheck) || 'eck'.equals(dtCheck)) {
                for (String hf : ['host.name', 'host.name.keyword']) {
                  if (doc.containsKey(hf) && !doc[hf].empty) {
                    nodeStr = doc[hf].value.toString();
                    if (nodeStr != '') { break; }
                  }
                }
                if (nodeStr == '' && params._source?.host?.name != null) {
                  nodeStr = params._source.host.name.toString();
                }
              }
            }
          } catch (Exception e) {}

          double ecu = 0.0;
          try {
            if (doc.containsKey('ess.billing.total_ecu') && !doc['ess.billing.total_ecu'].empty) {
              ecu = ((Number)doc['ess.billing.total_ecu'].value).doubleValue();
            } else if (params._source?.ess?.billing?.total_ecu instanceof Number) {
              ecu = ((Number)params._source.ess.billing.total_ecu).doubleValue();
            }
          } catch (Exception e) {}

          double qty = 0.0;
          try {
            if (doc.containsKey('ess.billing.quantity.value') && !doc['ess.billing.quantity.value'].empty) {
              qty = ((Number)doc['ess.billing.quantity.value'].value).doubleValue();
            } else if (params._source?.ess?.billing?.quantity?.value instanceof Number) {
              qty = ((Number)params._source.ess.billing.quantity.value).doubleValue();
            }
          } catch (Exception e) {}

          String depGroup = '';
          try {
            if (doc.containsKey('deployment_group') && !doc['deployment_group'].empty) {
              depGroup = doc['deployment_group'].value.toString();
            }
          } catch (Exception e) {}

          String depName = '';
          try {
            if (doc.containsKey('ess.billing.deployment_name') && !doc['ess.billing.deployment_name'].empty) {
              depName = doc['ess.billing.deployment_name'].value.toString();
            } else if (params._source?.ess?.billing?.deployment_name != null) {
              depName = params._source.ess.billing.deployment_name.toString();
            }
          } catch (Exception e) {}

          String depType = '';
          try {
            if (doc.containsKey('ess.billing.deployment_type') && !doc['ess.billing.deployment_type'].empty) {
              depType = doc['ess.billing.deployment_type'].value.toString();
            } else if (params._source?.ess?.billing?.deployment_type != null) {
              depType = params._source.ess.billing.deployment_type.toString();
            }
          } catch (Exception e) {}

          String bType = '';
          try {
            if (doc.containsKey('ess.billing.type') && !doc['ess.billing.type'].empty) {
              bType = doc['ess.billing.type'].value.toString();
            } else if (params._source?.ess?.billing?.type != null) {
              bType = params._source.ess.billing.type.toString();
            }
          } catch (Exception e) {}

          String bKind = '';
          try {
            if (doc.containsKey('ess.billing.kind') && !doc['ess.billing.kind'].empty) {
              bKind = doc['ess.billing.kind'].value.toString();
            } else if (params._source?.ess?.billing?.kind != null) {
              bKind = params._source.ess.billing.kind.toString();
            }
          } catch (Exception e) {}

          String bUnit = '';
          try {
            if (doc.containsKey('ess.billing.unit') && !doc['ess.billing.unit'].empty) {
              bUnit = doc['ess.billing.unit'].value.toString();
            } else if (params._source?.ess?.billing?.unit != null) {
              bUnit = params._source.ess.billing.unit.toString();
            }
          } catch (Exception e) {}

          String dedupKey = orgId + '|' + depId + '|' + fromKey + '|' + toKey + '|' + sku + (nodeStr != '' ? '|' + nodeStr : '');

          String cRegion = '';
          try {
            if (doc.containsKey('cloud.region') && !doc['cloud.region'].empty) {
              cRegion = doc['cloud.region'].value.toString();
            } else if (params._source?.cloud?.region != null) {
              cRegion = params._source.cloud.region.toString();
            }
          } catch (Exception e) {}

          long docGfsMs = 0L;
          try {
            if (doc.containsKey('group_first_seen') && !doc['group_first_seen'].empty) {
              docGfsMs = doc['group_first_seen'].value.toInstant().toEpochMilli();
            } else if (params._source?.get('group_first_seen') != null) {
              def rgfs = params._source.get('group_first_seen');
              if (rgfs instanceof Number) { docGfsMs = ((Number)rgfs).longValue(); }
              else {
                String gstr = rgfs.toString().trim();
                if (gstr != '') { docGfsMs = ZonedDateTime.parse(gstr).toInstant().toEpochMilli(); }
              }
            }
          } catch (Exception e) {}

          if (ingTs > 0L && (state.min_bucket_ing <= 0L || ingTs < state.min_bucket_ing)) {
            state.min_bucket_ing = ingTs;
          }
          if (depGroup != '') {
            if (ingTs > 0L) {
              long curGm = state.grp_min_ing.get(depGroup) instanceof Number ? ((Number)state.grp_min_ing.get(depGroup)).longValue() : 0L;
              if (curGm <= 0L || ingTs < curGm) { state.grp_min_ing.put(depGroup, ingTs); }
            }
            if (docGfsMs > 0L) {
              long curGf = state.grp_min_gfs.get(depGroup) instanceof Number ? ((Number)state.grp_min_gfs.get(depGroup)).longValue() : 0L;
              if (curGf <= 0L || docGfsMs < curGf) { state.grp_min_gfs.put(depGroup, docGfsMs); }
            }
          }

          Map rec = [
            'ing_ts': ingTs,
            'gfs': docGfsMs,
            'min_any_ing': ingTs,
            'min_grp_ing': ingTs,
            'ecu': ecu,
