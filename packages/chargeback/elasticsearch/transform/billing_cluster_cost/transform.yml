              toKey = Long.toString(doc['ess.billing.to'].value.toInstant().toEpochMilli());
            } else if (params._source?.ess?.billing?.to != null) {
              String tsStr = params._source.ess.billing.to.toString().trim();
              try { toKey = Long.toString(ZonedDateTime.parse(tsStr).toInstant().toEpochMilli()); }
              catch (Exception pe) { toKey = tsStr; }
            }
          } catch (Exception e) {}

          String nodeStr = '';
          try {
            def nk = params._source?.elasticsearch?.node?.id;
            if (nk == null || nk.toString() == '') {
              String dtCheck = params._source?.ess?.billing?.deployment_type != null ? params._source.ess.billing.deployment_type.toString() : '';
              if ('onprem_node'.equals(sku) || 'onprem'.equals(dtCheck) || 'ece'.equals(dtCheck) || 'eck'.equals(dtCheck)) {
                nk = params._source?.host?.name;
              }
            }
            if (nk != null) { nodeStr = nk.toString(); }
          } catch (Exception e) {}

          double ecu = 0.0;
          try {
            if (doc.containsKey('ess.billing.total_ecu') && !doc['ess.billing.total_ecu'].empty) {
              ecu = ((Number)doc['ess.billing.total_ecu'].value).doubleValue();
            } else if (params._source?.ess?.billing?.total_ecu instanceof Number) {
              ecu = ((Number)params._source.ess.billing.total_ecu).doubleValue();
            }
          } catch (Exception e) {}

          double qty = 0.0;
          try {
            if (doc.containsKey('ess.billing.quantity.value') && !doc['ess.billing.quantity.value'].empty) {
