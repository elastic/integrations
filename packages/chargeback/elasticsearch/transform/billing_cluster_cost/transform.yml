            } else if (params._source?.ess?.billing?.type != null) {
              bType = params._source.ess.billing.type.toString();
            }
          } catch (Exception e) {}

          String bKind = '';
          try {
            if (doc.containsKey('ess.billing.kind') && !doc['ess.billing.kind'].empty) {
              bKind = doc['ess.billing.kind'].value.toString();
            } else if (params._source?.ess?.billing?.kind != null) {
              bKind = params._source.ess.billing.kind.toString();
            }
          } catch (Exception e) {}

          String bUnit = '';
          try {
            if (doc.containsKey('ess.billing.unit') && !doc['ess.billing.unit'].empty) {
              bUnit = doc['ess.billing.unit'].value.toString();
            } else if (params._source?.ess?.billing?.unit != null) {
              bUnit = params._source.ess.billing.unit.toString();
            }
          } catch (Exception e) {}

          String dedupKey = orgId + '|' + depId + '|' + fromKey + '|' + toKey + '|' + sku + (nodeStr != '' ? '|' + nodeStr : '');

          String cRegion = '';
          try {
            if (doc.containsKey('cloud.region') && !doc['cloud.region'].empty) {
              cRegion = doc['cloud.region'].value.toString();
            } else if (params._source?.cloud?.region != null) {
              cRegion = params._source.cloud.region.toString();
            }
          } catch (Exception e) {}

          long docGfsMs = 0L;
          try {
            if (doc.containsKey('group_first_seen') && !doc['group_first_seen'].empty) {
              docGfsMs = doc['group_first_seen'].value.toInstant().toEpochMilli();
            } else if (params._source?.get('group_first_seen') != null) {
              def rgfs = params._source.get('group_first_seen');
              if (rgfs instanceof Number) { docGfsMs = ((Number)rgfs).longValue(); }
              else {
                String gstr = rgfs.toString().trim();
                if (gstr != '') { docGfsMs = ZonedDateTime.parse(gstr).toInstant().toEpochMilli(); }
              }
            }
          } catch (Exception e) {}

          if (ingTs > 0L && (state.min_bucket_ing <= 0L || ingTs < state.min_bucket_ing)) {
            state.min_bucket_ing = ingTs;
          }
          if (depGroup != '') {
            if (ingTs > 0L) {
              long curGm = state.grp_min_ing.get(depGroup) instanceof Number ? ((Number)state.grp_min_ing.get(depGroup)).longValue() : 0L;
              if (curGm <= 0L || ingTs < curGm) { state.grp_min_ing.put(depGroup, ingTs); }
            }
            if (docGfsMs > 0L) {
              long curGf = state.grp_min_gfs.get(depGroup) instanceof Number ? ((Number)state.grp_min_gfs.get(depGroup)).longValue() : 0L;
              if (curGf <= 0L || docGfsMs < curGf) { state.grp_min_gfs.put(depGroup, docGfsMs); }
            }
          }

          Map rec = [
            'ing_ts': ingTs,
            'gfs': docGfsMs,
            'min_any_ing': ingTs,
            'min_grp_ing': ingTs,
            'ecu': ecu,
            'qty': qty,
            'dep_group': depGroup,
            'dep_name': depName,
            'org_id': orgId,
            'dep_type': depType,
            'b_type': bType,
            'b_kind': bKind,
            'b_unit': bUnit,
            'c_region': cRegion
          ];
          Map ex = (Map)state.items.get(dedupKey);
          if (ex == null) {
            state.items.put(dedupKey, rec);
          } else {
            long exTs = ((Number)ex.get('ing_ts')).longValue();
            int newMeta = (depGroup != '' ? 2 : 0) + (depName != '' ? 1 : 0);
            int oldMeta = (ex.get('dep_group') != '' ? 2 : 0) + (ex.get('dep_name') != '' ? 1 : 0);
            long rMinAny = ((Number)rec.get('min_any_ing')).longValue();
            long eMinAny = ((Number)ex.get('min_any_ing')).longValue();
            long mergedMinAny = (rMinAny > 0L && (eMinAny <= 0L || rMinAny < eMinAny)) ? rMinAny : eMinAny;
            boolean recWins = (ingTs > exTs || (ingTs == exTs && (newMeta > oldMeta || (newMeta == oldMeta && ecu >= ((Number)ex.get('ecu')).doubleValue()))));
            Map win = recWins ? rec : ex;
            Map lose = recWins ? ex : rec;
            win.put('min_any_ing', mergedMinAny);
            String wGrp = win.get('dep_group') != null ? win.get('dep_group').toString() : '';
            String lGrp = lose.get('dep_group') != null ? lose.get('dep_group').toString() : '';
            if (wGrp != '' && wGrp.equals(lGrp)) {
              long wMinG = ((Number)win.get('min_grp_ing')).longValue();
              long lMinG = ((Number)lose.get('min_grp_ing')).longValue();
              if (lMinG > 0L && (wMinG <= 0L || lMinG < wMinG)) { win.put('min_grp_ing', lMinG); }
              long wGfs = ((Number)win.get('gfs')).longValue();
              long lGfs = ((Number)lose.get('gfs')).longValue();
              if (lGfs > 0L && (wGfs <= 0L || lGfs < wGfs)) { win.put('gfs', lGfs); }
            }
            if (recWins) {
              state.items.put(dedupKey, win);
            }
          }
        combine_script: "return state;"
        reduce_script: |
          Map merged = new HashMap();
          long mergedMinBucketIng = 0L;
          Map mergedGrpMinIng = new HashMap();
          Map mergedGrpMinGfs = new HashMap();
          for (def st : states) {
            if (st == null) { continue; }
            long mbi = st.min_bucket_ing instanceof Number ? ((Number)st.min_bucket_ing).longValue() : 0L;
            if (mbi > 0L && (mergedMinBucketIng <= 0L || mbi < mergedMinBucketIng)) {
              mergedMinBucketIng = mbi;
            }
            if (st.grp_min_ing instanceof Map) {
              for (def ge : ((Map)st.grp_min_ing).entrySet()) {
                String gk = ge.getKey().toString();
                long gv = ge.getValue() instanceof Number ? ((Number)ge.getValue()).longValue() : 0L;
                long cv = mergedGrpMinIng.get(gk) instanceof Number ? ((Number)mergedGrpMinIng.get(gk)).longValue() : 0L;
                if (gv > 0L && (cv <= 0L || gv < cv)) { mergedGrpMinIng.put(gk, gv); }
              }
            }
            if (st.grp_min_gfs instanceof Map) {
              for (def ge : ((Map)st.grp_min_gfs).entrySet()) {
                String gk = ge.getKey().toString();
                long gv = ge.getValue() instanceof Number ? ((Number)ge.getValue()).longValue() : 0L;
                long cv = mergedGrpMinGfs.get(gk) instanceof Number ? ((Number)mergedGrpMinGfs.get(gk)).longValue() : 0L;
                if (gv > 0L && (cv <= 0L || gv < cv)) { mergedGrpMinGfs.put(gk, gv); }
              }
            }
            if (!(st.items instanceof Map)) { continue; }
            for (def e : ((Map)st.items).entrySet()) {
              String k = e.getKey().toString();
              Map rec = (Map)e.getValue();
              Map ex = (Map)merged.get(k);
              if (ex == null) {
                merged.put(k, rec);
              } else {
                long ingTs = ((Number)rec.get('ing_ts')).longValue();
                long exTs = ((Number)ex.get('ing_ts')).longValue();
                int newMeta = (rec.get('dep_group') != '' ? 2 : 0) + (rec.get('dep_name') != '' ? 1 : 0);
                int oldMeta = (ex.get('dep_group') != '' ? 2 : 0) + (ex.get('dep_name') != '' ? 1 : 0);
                long rMinAny = rec.get('min_any_ing') instanceof Number ? ((Number)rec.get('min_any_ing')).longValue() : ((Number)rec.get('ing_ts')).longValue();
                long eMinAny = ex.get('min_any_ing') instanceof Number ? ((Number)ex.get('min_any_ing')).longValue() : ((Number)ex.get('ing_ts')).longValue();
                long mergedMinAny = (rMinAny > 0L && (eMinAny <= 0L || rMinAny < eMinAny)) ? rMinAny : eMinAny;
                boolean recWins = (ingTs > exTs || (ingTs == exTs && (newMeta > oldMeta || (newMeta == oldMeta && ((Number)rec.get('ecu')).doubleValue() >= ((Number)ex.get('ecu')).doubleValue()))));
                Map win = recWins ? rec : ex;
                Map lose = recWins ? ex : rec;
                win.put('min_any_ing', mergedMinAny);
                String wGrp = win.get('dep_group') != null ? win.get('dep_group').toString() : '';
                String lGrp = lose.get('dep_group') != null ? lose.get('dep_group').toString() : '';
                if (wGrp != '' && wGrp.equals(lGrp)) {
                  long wMinG = win.get('min_grp_ing') instanceof Number ? ((Number)win.get('min_grp_ing')).longValue() : ((Number)win.get('ing_ts')).longValue();
                  long lMinG = lose.get('min_grp_ing') instanceof Number ? ((Number)lose.get('min_grp_ing')).longValue() : ((Number)lose.get('ing_ts')).longValue();
                  if (lMinG > 0L && (wMinG <= 0L || lMinG < wMinG)) { win.put('min_grp_ing', lMinG); }
                  long wGfs = win.get('gfs') instanceof Number ? ((Number)win.get('gfs')).longValue() : 0L;
                  long lGfs = lose.get('gfs') instanceof Number ? ((Number)lose.get('gfs')).longValue() : 0L;
                  if (lGfs > 0L && (wGfs <= 0L || lGfs < wGfs)) { win.put('gfs', lGfs); }
                }
                if (recWins) {
                  merged.put(k, win);
                }
              }
            }
          }
          if (merged.isEmpty()) {
            return ['doc_cnt': 0L];
          }
          double sumEcu = 0.0;
          double sumQty = 0.0;
          long bestTs = -1L;
          long bestGroupTs = -1L;
          String depGroup = '';
          String depName = '';
          String orgId = '';
          String depType = '';
          String bType = '';
          String bKind = '';
          String bUnit = '';
          String cRegion = '';
          for (def recObj : merged.values()) {
            Map rec = (Map)recObj;
            sumEcu += ((Number)rec.get('ecu')).doubleValue();
            sumQty += ((Number)rec.get('qty')).doubleValue();
            long rTs = ((Number)rec.get('ing_ts')).longValue();
            String rGroup = rec.get('dep_group') != null ? rec.get('dep_group').toString() : '';
            if (rTs > bestGroupTs || (rTs == bestGroupTs && rGroup != '')) {
              bestGroupTs = rTs;
              depGroup = rGroup;
            }
            boolean isNewer = rTs >= bestTs;
            if (isNewer) { bestTs = rTs; }
            if (rec.get('dep_name') != '' && (depName == '' || isNewer)) { depName = rec.get('dep_name').toString(); }
            if (rec.get('org_id') != '' && (orgId == '' || isNewer)) { orgId = rec.get('org_id').toString(); }
            if (rec.get('dep_type') != '' && (depType == '' || isNewer)) { depType = rec.get('dep_type').toString(); }
            if (rec.get('b_type') != '' && (bType == '' || isNewer)) { bType = rec.get('b_type').toString(); }
            if (rec.get('b_kind') != '' && (bKind == '' || isNewer)) { bKind = rec.get('b_kind').toString(); }
            if (rec.get('b_unit') != '' && (bUnit == '' || isNewer)) { bUnit = rec.get('b_unit').toString(); }
            if (rec.get('c_region') != '' && (cRegion == '' || isNewer)) { cRegion = rec.get('c_region').toString(); }
          }
          long resolvedGfs = 0L;
          if (depGroup != '') {
            long bestExplicitGfs = mergedGrpMinGfs.get(depGroup) instanceof Number ? ((Number)mergedGrpMinGfs.get(depGroup)).longValue() : 0L;
            long grpMinIng = mergedGrpMinIng.get(depGroup) instanceof Number ? ((Number)mergedGrpMinIng.get(depGroup)).longValue() : 0L;
            long bestReplayIng = (mergedMinBucketIng > 0L && grpMinIng > mergedMinBucketIng) ? grpMinIng : 0L;
            resolvedGfs = bestReplayIng > bestExplicitGfs ? bestReplayIng : bestExplicitGfs;
          }
          return [
            'doc_cnt': (long)merged.size(),
            'total_chargeable_units': sumEcu,
            'quantity_value': sumQty,
            'deployment_group': depGroup,
            'group_first_seen': resolvedGfs > 0L ? resolvedGfs : null,
            'deployment_name': depName,
            'organization_id': orgId,
            'deployment_type': depType,
            'billing_type': bType,
            'billing_kind': bKind,
            'billing_unit': bUnit,
            'cloud_region': cRegion
          ];
