description: Aggregates daily total chargeable units (ECU/ERU) per deployment and SKU across native Chargeback and legacy ESS/On-Prem Billing sources.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.billing-*
    - -metrics-ess_billing.billing-chargeback
    - -chargeback_lookup.*
  query:
    bool:
      must:
        - range:
            ess.billing.total_ecu:
              gt: 0
      must_not:
        - terms:
            doc_type:
              - config_snapshot
              - credit_line_item
  runtime_mappings:
    cb_sync_time:
      type: date
      script:
        source: |
          if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
            emit(doc['event.ingested'].value.toInstant().toEpochMilli());
            return;
          }
          def rawIngested = params._source?.event?.ingested;
          if (rawIngested != null) {
            if (rawIngested instanceof Number) {
              emit(((Number)rawIngested).longValue());
              return;
            }
            String s = rawIngested.toString().trim();
            if (s != '') {
              try {
                emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                return;
              } catch (Exception e) {}
            }
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    deployment_group:
      type: keyword
      script:
        source: |
          if (params._source?.ess?.billing?.deployment_tags != null) {
            def tags = params._source.ess.billing.deployment_tags;
            if (tags instanceof List) {
              for (tag in tags) {
                if (tag.startsWith('chargeback_group:')) {
                  emit(tag.substring('chargeback_group:'.length()));
                  return;
                }
              }
            } else if (tags instanceof String) {
              if (tags.startsWith('chargeback_group:')) {
                emit(tags.substring('chargeback_group:'.length()));
                return;
              }
            }
          }
          emit('');
dest:
  index: chargeback_lookup.dest_billing_cluster_cost-1
  aliases:
    - alias: chargeback_lookup.billing_cluster_cost
      move_on_creation: true
  pipeline: logs-chargeback.lookup-0.6.0-billing
frequency: 60m
sync:
  time:
    field: cb_sync_time
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    deployment_id:
      terms:
        field: ess.billing.deployment_id
    sku:
      terms:
        field: ess.billing.sku
  aggregations:
    native:
      filter:
        term:
          data_stream.dataset: chargeback.billing
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        total_chargeable_units:
          sum:
            field: ess.billing.total_ecu
        quantity_value:
          sum:
            field: ess.billing.quantity.value
        deployment_group:
          terms:
            field: deployment_group
            size: 1
        deployment_name:
          terms:
            field: ess.billing.deployment_name
            size: 1
        organization_id:
          terms:
            field: ess.billing.organization_id
            size: 1
        deployment_type:
          terms:
            field: ess.billing.deployment_type
            size: 1
        billing_type:
          terms:
            field: ess.billing.type
            size: 1
        billing_kind:
          terms:
            field: ess.billing.kind
            size: 1
        cloud_region:
          terms:
            field: cloud.region
            size: 1
    legacy:
      filter:
        bool:
          must_not:
            - term:
                data_stream.dataset: chargeback.billing
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        total_chargeable_units:
          sum:
            field: ess.billing.total_ecu
        quantity_value:
          sum:
            field: ess.billing.quantity.value
        deployment_group:
          terms:
            field: deployment_group
            size: 1
        deployment_name:
          terms:
            field: ess.billing.deployment_name
            size: 1
        organization_id:
          terms:
            field: ess.billing.organization_id
            size: 1
        deployment_type:
          terms:
            field: ess.billing.deployment_type
            size: 1
        billing_type:
          terms:
            field: ess.billing.type
            size: 1
        billing_kind:
          terms:
            field: ess.billing.kind
            size: 1
        cloud_region:
          terms:
            field: cloud.region
            size: 1
settings:
  # This is required to prevent the transform from clobbering the Fleet-managed mappings.
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
