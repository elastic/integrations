            } else if (params._source?.ess?.billing?.deployment_type != null) {
              depType = params._source.ess.billing.deployment_type.toString();
            }
          } catch (Exception e) {}

          String bType = '';
          try {
            if (doc.containsKey('ess.billing.type') && !doc['ess.billing.type'].empty) {
