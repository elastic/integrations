- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the sub-data-stream attribution metric.
- name: cluster_name
  type: keyword
  description: Elasticsearch cluster name (matches billing deployment_id).
- name: deployment_id
  type: keyword
  description: Deployment identifier matching cluster_name.
- name: deployment_name
  type: keyword
  description: Human-readable deployment name.
- name: deployment_group
  type: keyword
  description: User-defined group of the deployment (based on tag:chargeback_group).
- name: composite_key
  type: keyword
  description: Date and deployment ID composite key (YYYY-MM-DD_deployment_id).
- name: composite_datastream_key
  type: keyword
  description: Date, deployment ID, and data stream composite key (YYYY-MM-DD_deployment_id_datastream).
- name: datastream
  type: keyword
  description: Normalized data stream or index name.
- name: ds_type
  type: keyword
  description: First segment of the data stream name (for example, logs, metrics, traces).
- name: ds_namespace
  type: keyword
  description: Namespace segment of the data stream name.
- name: tenant_id
  type: keyword
  description: Unified tenant or service identifier resolved for this data stream.
- name: attribution_field
  type: keyword
  description: Field or metadata key used to attribute this data stream.
- name: attribution_source
  type: keyword
  description: Attribution mechanism used for this row (field, ds_namespace_passthrough, field_unmapped, or overflow).
- name: weight_metric
  type: keyword
  description: Proportional weighting metric used (doc_count, bytes, or passthrough).
- name: size_field
  type: keyword
  description: Numeric byte-size field evaluated when weight_metric is bytes.
- name: ingest_doc_count
  type: long
  description: Daily document count attributed to this tenant.
- name: ingest_bytes
  type: double
  description: Daily byte volume attributed to this tenant when size_field is active.
- name: storage_doc_count
  type: long
  description: Storage-pass document count attributed to this tenant.
- name: storage_bytes
  type: double
  description: Storage-pass byte volume attributed to this tenant when size_field is active.
- name: ingest_share_pct
  type: double
  description: Proportional share of data stream indexing and ingest cost (0.0 to 1.0).
- name: storage_share_pct
  type: double
  description: Proportional share of data stream storage cost (0.0 to 1.0).
- name: query_share_pct
  type: double
  description: Proportional share of data stream query cost (0.0 to 1.0).
- name: storage_share_source
  type: keyword
  description: Storage attribution strategy used (rolling_hub or live_open).
- name: query_share_source
  type: keyword
  description: Query share estimation mode used (blend, ingest, or storage).
- name: is_fallback_bucket
  type: boolean
  description: Whether this row represents an explicit unattributed or overflow conservation bucket.
- name: usage_source
  type: keyword
  description: Usage telemetry source selected for this rollup row (native).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
