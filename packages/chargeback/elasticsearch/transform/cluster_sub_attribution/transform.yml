description: Aggregates daily per-driver sub-data-stream tenant and service attribution shares across shared and dedicated data streams into a unified tenant_id lookup table, ignoring incomplete paginated runs.
source:
  index:
    - metrics-chargeback.attribution-*
  query:
    bool:
      filter:
        - term:
            doc_type: "sub_attribution"
        - term:
            pass_complete: true
  runtime_mappings:
    cb_cluster_name:
      type: keyword
      script:
        source: |
          for (String f : ['elasticsearch.cluster.name.keyword', 'elasticsearch.cluster.name']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String v = doc[f].value.toString();
                if (v != '') { emit(v); return; }
              }
            } catch (Exception e) {}
          }
          def sv = params._source?.elasticsearch?.cluster?.name;
          if (sv != null && sv.toString() != '') {
            emit(sv.toString());
          }
    cb_datastream:
      type: keyword
      script:
        source: |
          for (String f : ['elasticsearch.index.datastream.keyword', 'elasticsearch.index.datastream']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String v = doc[f].value.toString();
                if (v != '') { emit(v); return; }
              }
            } catch (Exception e) {}
          }
          def sv = params._source?.elasticsearch?.index?.datastream;
          if (sv != null && sv.toString() != '') {
            emit(sv.toString());
          }
    cb_tenant_id:
      type: keyword
      script:
        source: |
          for (String f : ['tenant_id.keyword', 'tenant_id']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String v = doc[f].value.toString();
                if (v != '') { emit(v); return; }
              }
            } catch (Exception e) {}
          }
          def sv = params._source?.get('tenant_id');
          if (sv != null && sv.toString() != '') {
            emit(sv.toString());
          }
    cb_sync_ts:
      type: date
      script:
        source: |
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get('ingested') : null;
            if (rawVal == null && params._source != null) { rawVal = params._source.get('event.ingested'); }
            if (rawVal != null) {
              if (rawVal instanceof Number) { emit(((Number)rawVal).longValue()); return; }
              String s = rawVal.toString().trim();
              if (s != '') { emit(ZonedDateTime.parse(s).toInstant().toEpochMilli()); return; }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
dest:
  index: chargeback_lookup.dest_cluster_sub_attribution-1
  aliases:
    - alias: chargeback_lookup.cluster_sub_attribution
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "sub_attribution" }}'
frequency: 5m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: cb_cluster_name
    datastream:
      terms:
        field: cb_datastream
    tenant_id:
      terms:
        field: cb_tenant_id
  aggregations:
    sub_rollup:
      scripted_metric:
        init_script: |
          state.runs = new HashMap();
          state.dep_name = '';
          state.dep_name_ing = -1L;
          state.dep_group = '';
          state.dep_group_ing = -1L;
          state.has_dep_group = false;
        map_script: |
          if (!doc.containsKey('@timestamp') || doc['@timestamp'].empty) { return; }
          long ts = doc['@timestamp'].value.toInstant().toEpochMilli();
          long ingTs = ts;
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              ingTs = doc['event.ingested'].value.toInstant().toEpochMilli();
            } else if (params._source?.event?.ingested != null) {
              ingTs = ZonedDateTime.parse(params._source.event.ingested.toString().trim()).toInstant().toEpochMilli();
            }
          } catch (Exception e) {}

          String dn = '';
          for (String dnf : ['deployment_name.keyword', 'deployment_name']) {
            try {
              if (doc.containsKey(dnf) && !doc[dnf].empty) {
                dn = doc[dnf].value.toString();
                if (dn != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (dn == '' && params._source?.get('deployment_name') != null) {
            dn = params._source.get('deployment_name').toString();
          }
          if (dn != '' && ingTs >= state.dep_name_ing) {
            state.dep_name_ing = ingTs;
            state.dep_name = dn;
          }

          boolean hasDg = false;
          String dg = '';
          if (params._source != null && params._source.containsKey('deployment_group') && params._source.get('deployment_group') != null) {
            hasDg = true;
            dg = params._source.get('deployment_group').toString();
          } else {
            for (String dgf : ['deployment_group.keyword', 'deployment_group']) {
              try {
                if (doc.containsKey(dgf) && !doc[dgf].empty) {
                  hasDg = true;
                  dg = doc[dgf].value.toString();
                  break;
                }
              } catch (Exception e) {}
            }
          }
          if (hasDg && ingTs >= state.dep_group_ing) {
            state.has_dep_group = true;
            state.dep_group_ing = ingTs;
            state.dep_group = dg;
          }

          String ns = 'default';
          for (String nf : ['data_stream.namespace.keyword', 'data_stream.namespace']) {
            try {
              if (doc.containsKey(nf) && !doc[nf].empty) {
                String v = doc[nf].value.toString().trim();
                if (v != '') { ns = v; break; }
              }
            } catch (Exception e) {}
          }
          if (ns == 'default') {
