            } catch (Exception e) {}
          }
          if (runId == '_default_' && params._source?.get('run_id') != null) {
            runId = params._source.get('run_id').toString().trim();
          }

          boolean passComp = true;
          try {
            if (doc.containsKey('pass_complete') && !doc['pass_complete'].empty) {
              passComp = Boolean.TRUE.equals(doc['pass_complete'].value) || 'true'.equalsIgnoreCase(doc['pass_complete'].value.toString());
            } else if (params._source != null && params._source.containsKey('pass_complete')) {
              passComp = Boolean.TRUE.equals(params._source.get('pass_complete'));
            }
          } catch (Exception e) {}

          long ingDocs = 0L;
          double ingBytes = 0.0;
          long stoDocs = 0L;
          double stoBytes = 0.0;
          long stTotDocs = 0L;
          double stTotBytes = 0.0;
          long stPriorDocs = 0L;
          double stPriorBytes = 0.0;
          long ingStreamDocs = 0L;
          double ingStreamBytes = 0.0;
          long stStoDocs = 0L;
          double stStoBytes = 0.0;
          boolean stoPassComp = false;
          double preIng = 0.0;
          double preSto = 0.0;
          double preQry = 0.0;
          try { if (doc.containsKey('ingest_doc_count') && !doc['ingest_doc_count'].empty) { ingDocs = ((Number)doc['ingest_doc_count'].value).longValue(); } else if (params._source?.get('ingest_doc_count') instanceof Number) { ingDocs = ((Number)params._source.get('ingest_doc_count')).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('ingest_bytes') && !doc['ingest_bytes'].empty) { ingBytes = ((Number)doc['ingest_bytes'].value).doubleValue(); } else if (params._source?.get('ingest_bytes') instanceof Number) { ingBytes = ((Number)params._source.get('ingest_bytes')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('storage_doc_count') && !doc['storage_doc_count'].empty) { stoDocs = ((Number)doc['storage_doc_count'].value).longValue(); } else if (params._source?.get('storage_doc_count') instanceof Number) { stoDocs = ((Number)params._source.get('storage_doc_count')).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('storage_bytes') && !doc['storage_bytes'].empty) { stoBytes = ((Number)doc['storage_bytes'].value).doubleValue(); } else if (params._source?.get('storage_bytes') instanceof Number) { stoBytes = ((Number)params._source.get('storage_bytes')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_total_docs') && !doc['stream_total_docs'].empty) { stTotDocs = ((Number)doc['stream_total_docs'].value).longValue(); } else if (params._source?.get('stream_total_docs') instanceof Number) { stTotDocs = ((Number)params._source.get('stream_total_docs')).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_total_bytes') && !doc['stream_total_bytes'].empty) { stTotBytes = ((Number)doc['stream_total_bytes'].value).doubleValue(); } else if (params._source?.get('stream_total_bytes') instanceof Number) { stTotBytes = ((Number)params._source.get('stream_total_bytes')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_prior_docs') && !doc['stream_prior_docs'].empty) { stPriorDocs = ((Number)doc['stream_prior_docs'].value).longValue(); } else if (params._source?.get('stream_prior_docs') instanceof Number) { stPriorDocs = ((Number)params._source.get('stream_prior_docs')).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_prior_bytes') && !doc['stream_prior_bytes'].empty) { stPriorBytes = ((Number)doc['stream_prior_bytes'].value).doubleValue(); } else if (params._source?.get('stream_prior_bytes') instanceof Number) { stPriorBytes = ((Number)params._source.get('stream_prior_bytes')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_ingest_docs') && !doc['stream_ingest_docs'].empty) { ingStreamDocs = ((Number)doc['stream_ingest_docs'].value).longValue(); } else if (params._source?.get('stream_ingest_docs') instanceof Number) { ingStreamDocs = ((Number)params._source.get('stream_ingest_docs')).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_ingest_bytes') && !doc['stream_ingest_bytes'].empty) { ingStreamBytes = ((Number)doc['stream_ingest_bytes'].value).doubleValue(); } else if (params._source?.get('stream_ingest_bytes') instanceof Number) { ingStreamBytes = ((Number)params._source.get('stream_ingest_bytes')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_sto_docs') && !doc['stream_sto_docs'].empty) { stStoDocs = ((Number)doc['stream_sto_docs'].value).longValue(); } else if (params._source?.get('stream_sto_docs') instanceof Number) { stStoDocs = ((Number)params._source.get('stream_sto_docs')).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('stream_sto_bytes') && !doc['stream_sto_bytes'].empty) { stStoBytes = ((Number)doc['stream_sto_bytes'].value).doubleValue(); } else if (params._source?.get('stream_sto_bytes') instanceof Number) { stStoBytes = ((Number)params._source.get('stream_sto_bytes')).doubleValue(); } } catch (Exception e) {}
          try {
            if (doc.containsKey('sto_pass_complete') && !doc['sto_pass_complete'].empty) {
              stoPassComp = Boolean.TRUE.equals(doc['sto_pass_complete'].value) || 'true'.equalsIgnoreCase(doc['sto_pass_complete'].value.toString());
            } else if (params._source != null && params._source.containsKey('sto_pass_complete')) {
              stoPassComp = Boolean.TRUE.equals(params._source.get('sto_pass_complete'));
            }
          } catch (Exception e) {}
          try { if (doc.containsKey('ingest_share_pct') && !doc['ingest_share_pct'].empty) { preIng = ((Number)doc['ingest_share_pct'].value).doubleValue(); } else if (params._source?.get('ingest_share_pct') instanceof Number) { preIng = ((Number)params._source.get('ingest_share_pct')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('storage_share_pct') && !doc['storage_share_pct'].empty) { preSto = ((Number)doc['storage_share_pct'].value).doubleValue(); } else if (params._source?.get('storage_share_pct') instanceof Number) { preSto = ((Number)params._source.get('storage_share_pct')).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('query_share_pct') && !doc['query_share_pct'].empty) { preQry = ((Number)doc['query_share_pct'].value).doubleValue(); } else if (params._source?.get('query_share_pct') instanceof Number) { preQry = ((Number)params._source.get('query_share_pct')).doubleValue(); } } catch (Exception e) {}

          String attrField = '';
          String attrSrc = 'field';
          String wMetric = 'doc_count';
          String sField = '';
          String stoSrc = 'rolling_hub';
          String qrySrc = 'blend';
          String rawKind = 'tenant';
          boolean isFb = false;
          for (String f : ['attribution_field.keyword', 'attribution_field']) { try { if (doc.containsKey(f) && !doc[f].empty) { attrField = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (attrField == '' && params._source?.get('attribution_field') != null) { attrField = params._source.get('attribution_field').toString(); }
          for (String f : ['attribution_source.keyword', 'attribution_source']) { try { if (doc.containsKey(f) && !doc[f].empty) { attrSrc = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (params._source?.get('attribution_source') != null) { attrSrc = params._source.get('attribution_source').toString(); }
          for (String f : ['weight_metric.keyword', 'weight_metric']) { try { if (doc.containsKey(f) && !doc[f].empty) { wMetric = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (params._source?.get('weight_metric') != null) { wMetric = params._source.get('weight_metric').toString(); }
          for (String f : ['size_field.keyword', 'size_field']) { try { if (doc.containsKey(f) && !doc[f].empty) { sField = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (sField == '' && params._source?.get('size_field') != null) { sField = params._source.get('size_field').toString(); }
          for (String f : ['storage_share_source.keyword', 'storage_share_source']) { try { if (doc.containsKey(f) && !doc[f].empty) { stoSrc = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (params._source?.get('storage_share_source') != null) { stoSrc = params._source.get('storage_share_source').toString(); }
          for (String f : ['query_share_source.keyword', 'query_share_source']) { try { if (doc.containsKey(f) && !doc[f].empty) { qrySrc = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (params._source?.get('query_share_source') != null) { qrySrc = params._source.get('query_share_source').toString(); }
          for (String f : ['raw_bucket_kind.keyword', 'raw_bucket_kind']) { try { if (doc.containsKey(f) && !doc[f].empty) { rawKind = doc[f].value.toString(); break; } } catch (Exception e) {} }
          if (params._source?.get('raw_bucket_kind') != null) { rawKind = params._source.get('raw_bucket_kind').toString(); }
          try {
            if (doc.containsKey('is_fallback_bucket') && !doc['is_fallback_bucket'].empty) {
              isFb = Boolean.TRUE.equals(doc['is_fallback_bucket'].value) || 'true'.equalsIgnoreCase(doc['is_fallback_bucket'].value.toString());
            } else if (params._source != null && params._source.containsKey('is_fallback_bucket')) {
              isFb = Boolean.TRUE.equals(params._source.get('is_fallback_bucket'));
            }
          } catch (Exception e) {}

          String baseRunId = runId;
          if ('storage'.equals(dpass) && baseRunId.endsWith(':sto')) {
            baseRunId = baseRunId.substring(0, baseRunId.length() - 4);
          } else if ('storage_prior'.equals(dpass) && baseRunId.endsWith(':prior')) {
            baseRunId = baseRunId.substring(0, baseRunId.length() - 6);
          }

          String rk = ns + '|' + polId + '|' + collectorId + '||' + dpass + '||' + runId;
          Map r = (Map)state.runs.get(rk);
          if (r == null) {
            r = new HashMap();
            r.put('pass', dpass);
            r.put('run_id', runId);
            r.put('base_run_id', baseRunId);
            r.put('ing_ts', ingTs);
            r.put('complete', passComp);
            r.put('ing_docs', 0L);
            r.put('ing_bytes', 0.0);
            r.put('sto_docs', 0L);
            r.put('sto_bytes', 0.0);
            r.put('tot_docs', stTotDocs);
            r.put('tot_bytes', stTotBytes);
            r.put('prior_docs', stPriorDocs);
            r.put('prior_bytes', stPriorBytes);
            r.put('ing_stream_docs', ingStreamDocs);
            r.put('ing_stream_bytes', ingStreamBytes);
            r.put('sto_stream_docs', stStoDocs);
            r.put('sto_stream_bytes', stStoBytes);
            r.put('sto_complete', stoPassComp);
            r.put('pre_ing', preIng);
            r.put('pre_sto', preSto);
            r.put('pre_qry', preQry);
            r.put('attr_field', attrField);
            r.put('attr_src', attrSrc);
            r.put('w_metric', wMetric);
            r.put('size_field', sField);
            r.put('sto_src', stoSrc);
            r.put('qry_src', qrySrc);
            r.put('raw_kind', rawKind);
            r.put('is_fb', isFb);
            state.runs.put(rk, r);
          }
          if (passComp) { r.put('complete', true); }
          if (stoPassComp) { r.put('sto_complete', true); }
          if (ingTs > ((Number)r.get('ing_ts')).longValue()) { r.put('ing_ts', ingTs); }
          r.put('ing_docs', ((Number)r.get('ing_docs')).longValue() + ingDocs);
          r.put('ing_bytes', ((Number)r.get('ing_bytes')).doubleValue() + ingBytes);
          r.put('sto_docs', ((Number)r.get('sto_docs')).longValue() + stoDocs);
          r.put('sto_bytes', ((Number)r.get('sto_bytes')).doubleValue() + stoBytes);
          if (stTotDocs > ((Number)r.get('tot_docs')).longValue()) { r.put('tot_docs', stTotDocs); }
          if (stTotBytes > ((Number)r.get('tot_bytes')).doubleValue()) { r.put('tot_bytes', stTotBytes); }
          if (stPriorDocs > ((Number)r.get('prior_docs')).longValue()) { r.put('prior_docs', stPriorDocs); }
          if (stPriorBytes > ((Number)r.get('prior_bytes')).doubleValue()) { r.put('prior_bytes', stPriorBytes); }
          if (ingStreamDocs > ((Number)r.get('ing_stream_docs')).longValue()) { r.put('ing_stream_docs', ingStreamDocs); }
          if (ingStreamBytes > ((Number)r.get('ing_stream_bytes')).doubleValue()) { r.put('ing_stream_bytes', ingStreamBytes); }
          if (stStoDocs > ((Number)r.get('sto_stream_docs')).longValue()) { r.put('sto_stream_docs', stStoDocs); }
          if (stStoBytes > ((Number)r.get('sto_stream_bytes')).doubleValue()) { r.put('sto_stream_bytes', stStoBytes); }
          if ('overflow'.equals(attrSrc) || 'field_unmapped'.equals(attrSrc)) { r.put('attr_src', attrSrc); }
          if ('empty_day'.equals(rawKind)) { r.put('raw_kind', 'empty_day'); }
          if (isFb) { r.put('is_fb', true); }
        combine_script: "return state;"
        reduce_script: |
          Map mergedRuns = new HashMap();
          String depName = '';
          long depNameIng = -1L;
          String depGroup = '';
          long depGroupIng = -1L;
          boolean hasDepGroup = false;

          for (def st : states) {
            if (!(st instanceof Map)) { continue; }
            String sdn = st.get('dep_name') != null ? st.get('dep_name').toString() : '';
            long sdnIng = st.get('dep_name_ing') instanceof Number ? ((Number)st.get('dep_name_ing')).longValue() : -1L;
            if (sdn != '' && sdnIng >= depNameIng) {
              depNameIng = sdnIng;
              depName = sdn;
            }
            if (Boolean.TRUE.equals(st.get('has_dep_group'))) {
              String sdg = st.get('dep_group') != null ? st.get('dep_group').toString() : '';
              long sdgIng = st.get('dep_group_ing') instanceof Number ? ((Number)st.get('dep_group_ing')).longValue() : -1L;
              if (!hasDepGroup || sdgIng >= depGroupIng) {
                hasDepGroup = true;
                depGroupIng = sdgIng;
                depGroup = sdg;
              }
            }
            if (!(st.get('runs') instanceof Map)) { continue; }
            for (def re : ((Map)st.get('runs')).entrySet()) {
              String rk = re.getKey().toString();
              Map sr = (Map)re.getValue();
              Map dr = (Map)mergedRuns.get(rk);
              if (dr == null) {
                dr = new HashMap(sr);
                mergedRuns.put(rk, dr);
              } else {
                if (Boolean.TRUE.equals(sr.get('complete'))) { dr.put('complete', true); }
                if (Boolean.TRUE.equals(sr.get('sto_complete'))) { dr.put('sto_complete', true); }
