              def sns = params._source?.data_stream instanceof Map ? params._source.data_stream.get('namespace') : params._source?.get('data_stream.namespace');
              if (sns != null && sns.toString().trim() != '') { ns = sns.toString().trim(); }
            } catch (Exception e) {}
          }

          String polId = '';
          for (String pf : ['conf_policy_id.keyword', 'conf_policy_id', 'package_policy_id.keyword', 'package_policy_id', 'input.package_policy_id.keyword', 'input.package_policy_id', 'input.id.keyword', 'input.id']) {
