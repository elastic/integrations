description: Tracks initialized configuration buckets in chargeback_lookup.dest_chargeback_conf-2 so initial legacy carryover completes before disabled Fleet snapshots suppress stale overwrites.
source:
  index:
    - chargeback_lookup.dest_chargeback_conf-2*
    - -partial-*
    - -chargeback_lookup.dest_chargeback_conf_init*
  query:
    exists:
      field: conf_start_date
  runtime_mappings:
    cb_conf_bucket_key:
      type: keyword
      script:
        source: |
          String rowId = '';
          try {
            if (doc.containsKey('conf_row_id') && !doc['conf_row_id'].empty) {
              rowId = doc['conf_row_id'].value.toString().trim();
            } else if (params._source?.get('conf_row_id') != null) {
              rowId = params._source.get('conf_row_id').toString().trim();
            }
          } catch (Exception e) {}
          if (rowId == 'config') {
            emit('chargeback_config');
            return;
          }
          if (rowId == 'config_onprem') {
            emit('chargeback_config_onprem');
            return;
          }
          if (rowId != '') {
            emit('manual:' + rowId);
            return;
          }
          String joinKey = 'chargeback_config';
          try {
            if (doc.containsKey('config_join_key') && !doc['config_join_key'].empty) {
              String jk = doc['config_join_key'].value.toString().trim();
              if (jk != '') { joinKey = jk; }
            } else if (params._source?.get('config_join_key') != null) {
              String jk = params._source.get('config_join_key').toString().trim();
              if (jk != '') { joinKey = jk; }
            }
          } catch (Exception e) {}
          long startMs = 1262304000000L;
          try {
            if (doc.containsKey('conf_start_date') && !doc['conf_start_date'].empty) {
              startMs = doc['conf_start_date'].value.toInstant().toEpochMilli();
            } else if (params._source?.get('conf_start_date') != null) {
              def rs = params._source.get('conf_start_date');
              if (rs instanceof Number) { startMs = ((Number)rs).longValue(); }
              else {
                String ss = rs.toString().trim();
                if (ss != '') {
                  try { startMs = Long.parseLong(ss); }
                  catch (Exception pe) { startMs = ZonedDateTime.parse(ss.contains('T') ? ss : (ss + 'T00:00:00Z')).toInstant().toEpochMilli(); }
                }
              }
            }
          } catch (Exception e) {}
          long endMs = 2430518399999L;
          try {
            if (doc.containsKey('conf_end_date') && !doc['conf_end_date'].empty) {
              endMs = doc['conf_end_date'].value.toInstant().toEpochMilli();
            } else if (params._source?.get('conf_end_date') != null) {
              def re = params._source.get('conf_end_date');
              if (re instanceof Number) { endMs = ((Number)re).longValue(); }
              else {
                String es = re.toString().trim();
                if (es != '') {
                  try { endMs = Long.parseLong(es); }
                  catch (Exception pe) { endMs = ZonedDateTime.parse(es.contains('T') ? es : (es + 'T23:59:59.999Z')).toInstant().toEpochMilli(); }
                }
              }
            }
          } catch (Exception e) {}
          if (endMs == 2430518399999L && (joinKey == 'chargeback_config' || joinKey == 'chargeback_config_onprem')) {
            emit(joinKey);
            return;
          }
          String synId = (joinKey == 'chargeback_config_onprem'
            ? 'config_onprem_'
            : (joinKey == 'chargeback_config' ? 'config_' : (joinKey + '_'))) + Long.toString(startMs) + '_' + Long.toString(endMs);
          emit('manual:' + synId);
    cb_init_sync_ts:
      type: date
      script:
        source: |
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get('ingested') : null;
            if (rawVal == null && params._source != null) {
              rawVal = params._source.get('event.ingested');
            }
            if (rawVal != null) {
              if (rawVal instanceof Number) {
                emit(((Number)rawVal).longValue());
                return;
              }
              String s = rawVal.toString().trim();
              if (s != '') {
                emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                return;
              }
            }
          } catch (Exception e) {}
          emit(1262304000000L);
dest:
  index: chargeback_lookup.dest_chargeback_conf_init-1
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "chargeback_conf_init" }}'
frequency: 30s
sync:
  time:
    field: cb_init_sync_ts
    delay: 1s
pivot:
  group_by:
    config_join_key:
      terms:
        field: cb_conf_bucket_key
  aggregations:
    initialized_at:
      max:
        field: cb_init_sync_ts
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  order: 1
  run_as_kibana_system: false
  fleet_transform_version: 0.7.0
