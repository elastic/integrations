description: Aggregates daily p95 heap and disk utilization across data-role nodes per deployment across native Chargeback and legacy Stack Monitoring sources.
source:
  index:
    - metrics-chargeback.node_stats-*
    - metrics-elasticsearch.stack_monitoring.node_stats*
    - .monitoring-es-*
    - metricbeat-*
    - -partial-*
  query:
    bool:
      filter:
        - range:
            "@timestamp":
              gte: now-26h
        - exists:
            field: elasticsearch.node.roles
        - terms:
            elasticsearch.node.roles:
              - data_hot
              - data_warm
              - data_cold
              - data_frozen
              - data_content
              - data
      must_not:
        - term:
            doc_type: config_snapshot
  runtime_mappings:
    cb_cluster_name:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.cluster.name.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          try {
            if (doc.containsKey('elasticsearch.cluster.name') && !doc['elasticsearch.cluster.name'].empty) {
              emit(doc['elasticsearch.cluster.name'].value.toString());
              return;
            }
          } catch (Exception e) {}
          try {
            def cname = params._source?.elasticsearch?.cluster?.name;
            if (cname != null && cname.toString() != '') {
              emit(cname.toString());
            }
          } catch (Exception e) {}
    node_disk_used_pct:
      type: double
      script:
        source: |
          try {
            def total = params._source.elasticsearch.node.stats.fs.total.total_in_bytes;
            def avail = params._source.elasticsearch.node.stats.fs.total.available_in_bytes;
            if (total != null && avail != null && total > 0) {
              emit((total - avail) * 100.0 / total);
            }
          } catch (Exception e) {}
    cb_node_id:
      type: keyword
      script:
        source: |
          for (String f : ['elasticsearch.node.name.keyword', 'elasticsearch.node.name', 'source_node.name.keyword', 'source_node.name', 'elasticsearch.node.id.keyword', 'elasticsearch.node.id']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String v = doc[f].value.toString();
                if (v != '') { emit(v); return; }
              }
            } catch (Exception e) {}
          }
          try {
            def n = params._source?.elasticsearch?.node?.name;
            if (n == null || n.toString() == '') { n = params._source?.source_node?.name; }
            if (n == null || n.toString() == '') { n = params._source?.elasticsearch?.node?.id; }
            if (n == null || n.toString() == '') { n = params._source?.source_node?.uuid; }
            if (n == null || n.toString() == '') { n = params._source?.node_stats?.node_id; }
            if (n != null && n.toString() != '') {
              emit(n.toString());
              return;
            }
          } catch (Exception e) {}
          emit('_default_');
dest:
  index: cluster_capacity_utilization_lookup
  pipeline: logs-chargeback.lookup-0.6.0-capacity_utilization
frequency: 60m
sync:
  time:
    field: "@timestamp"
    delay: 1h
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: cb_cluster_name
  aggregations:
    coverage:
      scripted_metric:
        init_script: |
          state.nat = new HashMap();
          state.leg = new HashMap();
        map_script: |
          if (!doc.containsKey('@timestamp') || doc['@timestamp'].empty) { return; }
          long ts = doc['@timestamp'].value.toInstant().toEpochMilli();
          long rem = ts % 86400000L;
          if (rem < 0L) { rem += 86400000L; }
          int b = (int)(rem / 900000L);
          if (b < 0) { b = 0; }
          if (b > 95) { b = 95; }
          int w = b >> 6;
          long bit = 1L << (b & 63);
          String nid = (doc.containsKey('cb_node_id') && !doc['cb_node_id'].empty)
            ? doc['cb_node_id'].value.toString()
            : '_default_';
          boolean isNat = doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty
            && doc['data_stream.dataset'].value == 'chargeback.node_stats';
          Map target = isNat ? state.nat : state.leg;
          List cur = (List)target.get(nid);
          if (cur == null) {
            cur = [0L, 0L];
            target.put(nid, cur);
          }
          cur.set(w, ((Number)cur.get(w)).longValue() | bit);
        combine_script: "return state;"
        reduce_script: |
          Map mergedNat = new HashMap();
          Map mergedLeg = new HashMap();
          List anyNat = [0L, 0L];
          for (def st : states) {
            if (st == null) { continue; }
            if (st.nat instanceof Map) {
              for (def e : ((Map)st.nat).entrySet()) {
                String k = e.getKey().toString();
                List v = (List)e.getValue();
                long v0 = ((Number)v.get(0)).longValue();
                long v1 = ((Number)v.get(1)).longValue();
                anyNat.set(0, ((Number)anyNat.get(0)).longValue() | v0);
                anyNat.set(1, ((Number)anyNat.get(1)).longValue() | v1);
                List acc = (List)mergedNat.get(k);
                if (acc == null) {
                  mergedNat.put(k, [v0, v1]);
                } else {
                  acc.set(0, ((Number)acc.get(0)).longValue() | v0);
                  acc.set(1, ((Number)acc.get(1)).longValue() | v1);
                }
              }
            }
            if (st.leg instanceof Map) {
              for (def e : ((Map)st.leg).entrySet()) {
                String k = e.getKey().toString();
                List v = (List)e.getValue();
                long v0 = ((Number)v.get(0)).longValue();
                long v1 = ((Number)v.get(1)).longValue();
                List acc = (List)mergedLeg.get(k);
                if (acc == null) {
                  mergedLeg.put(k, [v0, v1]);
                } else {
                  acc.set(0, ((Number)acc.get(0)).longValue() | v0);
                  acc.set(1, ((Number)acc.get(1)).longValue() | v1);
                }
              }
            }
          }
          boolean coversDay = false;
          if (mergedLeg.isEmpty()) {
            coversDay = !mergedNat.isEmpty();
          } else if (!mergedNat.isEmpty()) {
            coversDay = true;
            for (def le : mergedLeg.entrySet()) {
              String nid = le.getKey().toString();
              List legM = (List)le.getValue();
              List natM = (nid == '_default_') ? anyNat : (List)mergedNat.get(nid);
              if (natM == null) {
                coversDay = false;
                break;
              }
              for (int b = 0; b < 96; b++) {
                int w = b >> 6;
                long bit = 1L << (b & 63);
                if ((((Number)legM.get(w)).longValue() & bit) == 0L) { continue; }
                boolean exact = ((((Number)natM.get(w)).longValue() & bit) != 0L);
                boolean straddle = false;
                if (!exact && b > 0 && (b + 1) < 96) {
                  int pw = (b - 1) >> 6;
                  long pbit = 1L << ((b - 1) & 63);
                  int nw = (b + 1) >> 6;
                  long nbit = 1L << ((b + 1) & 63);
                  if (((((Number)natM.get(pw)).longValue() & pbit) != 0L)
                      && ((((Number)natM.get(nw)).longValue() & nbit) != 0L)) {
                    straddle = true;
                  }
                }
                if (!exact && !straddle) {
                  coversDay = false;
                  break;
                }
              }
              if (!coversDay) { break; }
            }
          }
          Map res = new HashMap();
          res.put('native_covers_day', coversDay);
          res.put('native_node_cnt', mergedNat.size());
          res.put('legacy_node_cnt', mergedLeg.size());
          return res;
    native:
      filter:
        term:
          data_stream.dataset: chargeback.node_stats
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        heap_used_pct_p95:
          percentiles:
            field: elasticsearch.node.stats.jvm.mem.heap.used.pct
            percents:
              - 95
        disk_used_pct_p95:
          percentiles:
            field: node_disk_used_pct
            percents:
              - 95
    legacy:
      filter:
        bool:
          must_not:
            - term:
                data_stream.dataset: chargeback.node_stats
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        heap_used_pct_p95:
          percentiles:
            field: elasticsearch.node.stats.jvm.mem.heap.used.pct
            percents:
              - 95
        disk_used_pct_p95:
          percentiles:
            field: node_disk_used_pct
            percents:
              - 95
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
