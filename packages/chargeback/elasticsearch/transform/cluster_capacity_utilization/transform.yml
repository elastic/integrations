description: Aggregates daily p95 heap and disk utilization across data-role nodes per deployment across native Chargeback and legacy Stack Monitoring sources.
source:
  index:
    - metrics-chargeback.node_stats-*
    - metrics-elasticsearch.stack_monitoring.node_stats*
    - .monitoring-es-*
    - metricbeat-*
    - -partial-*
  query:
    bool:
      filter:
        - range:
            "@timestamp":
              gte: now-26h
        - exists:
            field: elasticsearch.node.roles
        - terms:
            elasticsearch.node.roles:
              - data_hot
              - data_warm
              - data_cold
              - data_frozen
              - data_content
              - data
      must_not:
        - term:
            doc_type: config_snapshot
  runtime_mappings:
    cb_cluster_name:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.cluster.name.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          try {
            if (doc.containsKey('elasticsearch.cluster.name') && !doc['elasticsearch.cluster.name'].empty) {
              emit(doc['elasticsearch.cluster.name'].value.toString());
              return;
            }
          } catch (Exception e) {}
          try {
            def cname = params._source?.elasticsearch?.cluster?.name;
            if (cname != null && cname.toString() != '') {
              emit(cname.toString());
            }
          } catch (Exception e) {}
    node_disk_used_pct:
      type: double
      script:
        source: |
          try {
            def total = params._source.elasticsearch.node.stats.fs.total.total_in_bytes;
            def avail = params._source.elasticsearch.node.stats.fs.total.available_in_bytes;
            if (total != null && avail != null && total > 0) {
              emit((total - avail) * 100.0 / total);
            }
          } catch (Exception e) {}
    cb_node_id:
      type: keyword
      script:
        source: |
          for (String f : ['elasticsearch.node.name.keyword', 'elasticsearch.node.name', 'source_node.name.keyword', 'source_node.name', 'elasticsearch.node.id.keyword', 'elasticsearch.node.id']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String v = doc[f].value.toString();
                if (v != '') { emit(v); return; }
              }
            } catch (Exception e) {}
          }
          try {
            def n = params._source?.elasticsearch?.node?.name;
            if (n == null || n.toString() == '') { n = params._source?.source_node?.name; }
            if (n == null || n.toString() == '') { n = params._source?.elasticsearch?.node?.id; }
            if (n == null || n.toString() == '') { n = params._source?.source_node?.uuid; }
            if (n == null || n.toString() == '') { n = params._source?.node_stats?.node_id; }
            if (n != null && n.toString() != '') {
              emit(n.toString());
              return;
            }
          } catch (Exception e) {}
          emit('_default_');
dest:
  index: cluster_capacity_utilization_lookup
  pipeline: logs-chargeback.lookup-0.1.0-capacity_utilization
frequency: 60m
sync:
  time:
    field: "@timestamp"
    delay: 1h
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: cb_cluster_name
  aggregations:
    coverage:
      scripted_metric:
        init_script: |
          state.nat = new HashMap();
          state.leg = new HashMap();
        map_script: |
          if (!doc.containsKey('@timestamp') || doc['@timestamp'].empty) { return; }
          long ts = doc['@timestamp'].value.toInstant().toEpochMilli();
          String nid = (doc.containsKey('cb_node_id') && !doc['cb_node_id'].empty)
            ? doc['cb_node_id'].value.toString()
            : '_default_';
          boolean isNat = doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty
            && doc['data_stream.dataset'].value == 'chargeback.node_stats';
          Map target = isNat ? state.nat : state.leg;
          List cur = (List)target.get(nid);
          if (cur == null) {
            target.put(nid, [ts, ts, 1L]);
          } else {
            long minTs = ((Number)cur.get(0)).longValue();
            long maxTs = ((Number)cur.get(1)).longValue();
            long cnt = ((Number)cur.get(2)).longValue();
            if (ts < minTs) { cur.set(0, ts); }
            if (ts > maxTs) { cur.set(1, ts); }
            cur.set(2, cnt + 1L);
          }
        combine_script: "return state;"
        reduce_script: |
          Map mergedNat = new HashMap();
          Map mergedLeg = new HashMap();
          long totalNat = 0L;
          long totalLeg = 0L;
          long natMin = Long.MAX_VALUE;
          long natMax = Long.MIN_VALUE;
          long legMin = Long.MAX_VALUE;
          long legMax = Long.MIN_VALUE;
          for (def st : states) {
            if (st == null) { continue; }
            if (st.nat instanceof Map) {
              for (def e : ((Map)st.nat).entrySet()) {
                String k = e.getKey().toString();
                List v = (List)e.getValue();
                long vMin = ((Number)v.get(0)).longValue();
                long vMax = ((Number)v.get(1)).longValue();
                long vCnt = ((Number)v.get(2)).longValue();
                totalNat += vCnt;
                if (vMin < natMin) { natMin = vMin; }
                if (vMax > natMax) { natMax = vMax; }
                List acc = (List)mergedNat.get(k);
                if (acc == null) {
                  mergedNat.put(k, [vMin, vMax, vCnt]);
                } else {
                  if (vMin < ((Number)acc.get(0)).longValue()) { acc.set(0, vMin); }
                  if (vMax > ((Number)acc.get(1)).longValue()) { acc.set(1, vMax); }
                  acc.set(2, ((Number)acc.get(2)).longValue() + vCnt);
                }
              }
            }
            if (st.leg instanceof Map) {
              for (def e : ((Map)st.leg).entrySet()) {
                String k = e.getKey().toString();
                List v = (List)e.getValue();
                long vMin = ((Number)v.get(0)).longValue();
                long vMax = ((Number)v.get(1)).longValue();
                long vCnt = ((Number)v.get(2)).longValue();
                totalLeg += vCnt;
                if (vMin < legMin) { legMin = vMin; }
                if (vMax > legMax) { legMax = vMax; }
                List acc = (List)mergedLeg.get(k);
                if (acc == null) {
                  mergedLeg.put(k, [vMin, vMax, vCnt]);
                } else {
                  if (vMin < ((Number)acc.get(0)).longValue()) { acc.set(0, vMin); }
                  if (vMax > ((Number)acc.get(1)).longValue()) { acc.set(1, vMax); }
                  acc.set(2, ((Number)acc.get(2)).longValue() + vCnt);
                }
              }
            }
          }
          long tolMs = 960000L;
          boolean coversDay = false;
          if (totalNat > 0L && totalLeg <= 0L) {
            coversDay = true;
          } else if (totalNat > 0L && totalLeg > 0L) {
            if (mergedNat.size() >= mergedLeg.size()
                && natMin <= (legMin + tolMs)
                && natMax >= (legMax - tolMs)
                && (totalLeg <= 1L || totalNat >= 2L)) {
              coversDay = true;
              for (def le : mergedLeg.entrySet()) {
                String nid = le.getKey().toString();
                List ls = (List)le.getValue();
                long lMin = ((Number)ls.get(0)).longValue();
                long lMax = ((Number)ls.get(1)).longValue();
                long lCnt = ((Number)ls.get(2)).longValue();
                if (nid != '_default_') {
                  List ns = (List)mergedNat.get(nid);
                  if (ns == null) {
                    coversDay = false;
                    break;
                  }
                  long nMin = ((Number)ns.get(0)).longValue();
                  long nMax = ((Number)ns.get(1)).longValue();
                  long nCnt = ((Number)ns.get(2)).longValue();
                  if (nMin > (lMin + tolMs) || nMax < (lMax - tolMs) || (lCnt > 1L && nCnt < 2L)) {
                    coversDay = false;
                    break;
                  }
                }
              }
            }
          }
          Map res = new HashMap();
          res.put('native_covers_day', coversDay);
          res.put('native_node_cnt', mergedNat.size());
          res.put('legacy_node_cnt', mergedLeg.size());
          return res;
    native:
      filter:
        term:
          data_stream.dataset: chargeback.node_stats
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        heap_used_pct_p95:
          percentiles:
            field: elasticsearch.node.stats.jvm.mem.heap.used.pct
            percents:
              - 95
        disk_used_pct_p95:
          percentiles:
            field: node_disk_used_pct
            percents:
              - 95
    legacy:
      filter:
        bool:
          must_not:
            - term:
                data_stream.dataset: chargeback.node_stats
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        heap_used_pct_p95:
          percentiles:
            field: elasticsearch.node.stats.jvm.mem.heap.used.pct
            percents:
              - 95
        disk_used_pct_p95:
          percentiles:
            field: node_disk_used_pct
            percents:
              - 95
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.1.0
