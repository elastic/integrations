description: Aggregates daily AI/ML trained model and Inference API endpoint metrics per deployment and model into a single daily lookup row.
source:
  index:
    - metrics-chargeback.usage-*
  query:
    term:
      doc_type: "ai_model"
dest:
  index: chargeback_lookup.dest_cluster_ai_model_contribution-1
  aliases:
    - alias: chargeback_lookup.cluster_ai_model_contribution
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "usage" }}'
frequency: 60m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: elasticsearch.cluster.name
    model_id:
      terms:
        field: model_id
    task_type:
      terms:
        field: task_type
  aggregations:
    inference_count:
      sum:
        field: inference_count
    total_inference_time_ms:
      sum:
        field: total_inference_time_ms
    max_avg_ms:
      max:
        field: average_inference_time_ms
    latest_meta:
      top_metrics:
        metrics:
          - field: deployment_name
          - field: deployment_group
        sort:
          event.ingested: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.7.0
