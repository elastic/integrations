description: Aggregates daily AI/ML trained model and Inference API endpoint metrics per deployment and model into a single daily lookup row, deduplicating overlapping multi-policy collections while merging non-overlapping collector intervals.
source:
  index:
    - metrics-chargeback.usage-*
  query:
    term:
      doc_type: "ai_model"
dest:
  index: chargeback_lookup.dest_cluster_ai_model_contribution-1
  aliases:
    - alias: chargeback_lookup.cluster_ai_model_contribution
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "usage" }}'
frequency: 60m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: elasticsearch.cluster.name
    model_id:
      terms:
        field: model_id
    task_type:
      terms:
        field: task_type
  aggregations:
    aux_rollup:
      scripted_metric:
        init_script: |
          state.emitters = new HashMap();
          state.dep_name = '';
          state.dep_name_ts = -1L;
          state.dep_name_ing = -1L;
          state.dep_group = '';
          state.dep_group_ts = -1L;
          state.dep_group_ing = -1L;
          state.has_dep_group = false;
        map_script: |
          if (!doc.containsKey('@timestamp') || doc['@timestamp'].empty) { return; }
          long ts = doc['@timestamp'].value.toInstant().toEpochMilli();
          long ingTs = -1L;
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              ingTs = doc['event.ingested'].value.toInstant().toEpochMilli();
            } else if (params._source?.event?.ingested != null) {
              ingTs = ZonedDateTime.parse(params._source.event.ingested.toString()).toInstant().toEpochMilli();
            }
          } catch (Exception e) {}

          String dn = '';
          for (String dnf : ['deployment_name.keyword', 'deployment_name']) {
            try {
              if (doc.containsKey(dnf) && !doc[dnf].empty) {
                dn = doc[dnf].value.toString();
                if (dn != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (dn == '') {
            try {
              def sdn = params._source?.get('deployment_name');
              if (sdn != null && sdn.toString() != '') { dn = sdn.toString(); }
            } catch (Exception e) {}
          }
          if (dn != '' && (ingTs > state.dep_name_ing || (ingTs == state.dep_name_ing && ts >= state.dep_name_ts))) {
            state.dep_name_ing = ingTs;
            state.dep_name_ts = ts;
            state.dep_name = dn;
          }

          boolean hasDg = false;
          String dg = '';
          if (params._source != null && params._source.containsKey('deployment_group') && params._source.get('deployment_group') != null) {
            hasDg = true;
            dg = params._source.get('deployment_group').toString();
          } else {
            for (String dgf : ['deployment_group.keyword', 'deployment_group']) {
              try {
                if (doc.containsKey(dgf) && !doc[dgf].empty) {
                  hasDg = true;
                  dg = doc[dgf].value.toString();
                  break;
                }
              } catch (Exception e) {}
            }
          }
          if (hasDg && (ingTs > state.dep_group_ing || (ingTs == state.dep_group_ing && ts >= state.dep_group_ts))) {
            state.has_dep_group = true;
            state.dep_group_ing = ingTs;
            state.dep_group_ts = ts;
            state.dep_group = dg;
          }

          String ns = 'default';
          for (String nf : ['data_stream.namespace.keyword', 'data_stream.namespace']) {
            try {
              if (doc.containsKey(nf) && !doc[nf].empty) {
                String v = doc[nf].value.toString().trim();
                if (v != '') { ns = v; break; }
              }
            } catch (Exception e) {}
          }
          if (ns == 'default') {
            try {
              def sns = params._source?.data_stream instanceof Map ? params._source.data_stream.get('namespace') : params._source?.get('data_stream.namespace');
              if (sns != null && sns.toString().trim() != '') { ns = sns.toString().trim(); }
            } catch (Exception e) {}
          }

          String polId = '';
          for (String pf : ['conf_policy_id.keyword', 'conf_policy_id', 'package_policy_id.keyword', 'package_policy_id', 'input.package_policy_id.keyword', 'input.package_policy_id', 'elastic_agent.package_policy_id.keyword', 'elastic_agent.package_policy_id', 'input.id.keyword', 'input.id', 'elastic_agent.policy_id.keyword', 'elastic_agent.policy_id']) {
            try {
              if (doc.containsKey(pf) && !doc[pf].empty) {
                String pv = doc[pf].value.toString().trim();
                if (pv != '') { polId = pv; break; }
              }
            } catch (Exception e) {}
          }
          if (polId == '' && params._source != null) {
            if (params._source.get('conf_policy_id') != null) { polId = params._source.get('conf_policy_id').toString().trim(); }
            else if (params._source.get('package_policy_id') != null) { polId = params._source.get('package_policy_id').toString().trim(); }
            else if (params._source.input instanceof Map && params._source.input.get('package_policy_id') != null) { polId = params._source.input.get('package_policy_id').toString().trim(); }
            else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.get('package_policy_id') != null) { polId = params._source.elastic_agent.get('package_policy_id').toString().trim(); }
            else if (params._source.input instanceof Map && params._source.input.get('id') != null) { polId = params._source.input.get('id').toString().trim(); }
            else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.get('policy_id') != null) { polId = params._source.elastic_agent.get('policy_id').toString().trim(); }
          }
          if (polId == '') { polId = '_default_'; }

          String collectorId = '';
          for (String cf : ['agent.id.keyword', 'agent.id', 'elastic_agent.id.keyword', 'elastic_agent.id', 'host.id.keyword', 'host.id', 'host.name.keyword', 'host.name']) {
            try {
              if (doc.containsKey(cf) && !doc[cf].empty) {
                String cv = doc[cf].value.toString().trim();
                if (cv != '') { collectorId = cv; break; }
              }
            } catch (Exception e) {}
          }
          if (collectorId == '' && params._source != null) {
            if (params._source.agent instanceof Map && params._source.agent.get('id') != null) { collectorId = params._source.agent.get('id').toString().trim(); }
            else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.get('id') != null) { collectorId = params._source.elastic_agent.get('id').toString().trim(); }
            else if (params._source.host instanceof Map && params._source.host.get('id') != null) { collectorId = params._source.host.get('id').toString().trim(); }
            else if (params._source.host instanceof Map && params._source.host.get('name') != null) { collectorId = params._source.host.get('name').toString().trim(); }
          }
          if (collectorId == '') { collectorId = '_default_'; }
          String emKey = ns + '|' + polId + '|' + collectorId;

          long infCnt = 0L;
          try {
            if (doc.containsKey('inference_count') && !doc['inference_count'].empty) {
              infCnt = ((Number)doc['inference_count'].value).longValue();
            } else if (params._source?.get('inference_count') instanceof Number) {
              infCnt = ((Number)params._source.get('inference_count')).longValue();
            }
          } catch (Exception e) {}
          if (infCnt < 0L) { infCnt = 0L; }

          long totMs = 0L;
          try {
            if (doc.containsKey('total_inference_time_ms') && !doc['total_inference_time_ms'].empty) {
              totMs = ((Number)doc['total_inference_time_ms'].value).longValue();
            } else if (params._source?.get('total_inference_time_ms') instanceof Number) {
              totMs = ((Number)params._source.get('total_inference_time_ms')).longValue();
            }
          } catch (Exception e) {}
          if (totMs < 0L) { totMs = 0L; }

          double avgMs = 0.0;
          try {
            if (doc.containsKey('average_inference_time_ms') && !doc['average_inference_time_ms'].empty) {
              avgMs = ((Number)doc['average_inference_time_ms'].value).doubleValue();
            } else if (params._source?.get('average_inference_time_ms') instanceof Number) {
              avgMs = ((Number)params._source.get('average_inference_time_ms')).doubleValue();
            }
          } catch (Exception e) {}

          long rem = ((ts % 86400000L) + 86400000L) % 86400000L;
          long dayStartMs = ts - rem;
          long dayEndMs = dayStartMs + 86400000L;
          long intStartMs = -1L;
          long intEndMs = -1L;
          try {
            if (doc.containsKey('interval_start') && !doc['interval_start'].empty) {
              intStartMs = doc['interval_start'].value.toInstant().toEpochMilli();
            } else if (params._source?.get('interval_start') != null) {
              def rs = params._source.get('interval_start');
              if (rs instanceof Number) { intStartMs = ((Number)rs).longValue(); }
              else { intStartMs = ZonedDateTime.parse(rs.toString().trim()).toInstant().toEpochMilli(); }
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('interval_end') && !doc['interval_end'].empty) {
              intEndMs = doc['interval_end'].value.toInstant().toEpochMilli();
            } else if (params._source?.get('interval_end') != null) {
              def re = params._source.get('interval_end');
              if (re instanceof Number) { intEndMs = ((Number)re).longValue(); }
              else { intEndMs = ZonedDateTime.parse(re.toString().trim()).toInstant().toEpochMilli(); }
            }
          } catch (Exception e) {}

          int sMin = 0;
          int eMin = 0;
          if (intStartMs >= 0L && intEndMs > intStartMs) {
            long cStart = intStartMs < dayStartMs ? dayStartMs : (intStartMs > dayEndMs ? dayEndMs : intStartMs);
            long cEnd = intEndMs > dayEndMs ? dayEndMs : (intEndMs < dayStartMs ? dayStartMs : intEndMs);
            if (cEnd > cStart) {
              sMin = (int)((cStart - dayStartMs) / 60000L);
              if (sMin < 0) { sMin = 0; }
              if (sMin > 1439) { sMin = 1439; }
              eMin = (int)((cEnd - dayStartMs + 59999L) / 60000L);
              if (eMin <= sMin) { eMin = sMin + 1; }
              if (eMin > 1440) { eMin = 1440; }
            }
          }
          if (eMin <= sMin) {
            int hour = (int)(rem / 3600000L);
            if (hour < 0) { hour = 0; }
            if (hour > 23) { hour = 23; }
            sMin = hour * 60;
            eMin = sMin + 60;
          }

          Map em = (Map)state.emitters.get(emKey);
          if (em == null) {
            em = new HashMap();
            em.put('doc_cnt', 0L);
            em.put('max_avg', 0.0);
            em.put('ivs', new ArrayList());
            state.emitters.put(emKey, em);
          }
          em.put('doc_cnt', ((Number)em.get('doc_cnt')).longValue() + 1L);
          if (avgMs > ((Number)em.get('max_avg')).doubleValue()) {
            em.put('max_avg', avgMs);
          }
          if (infCnt > 0L || totMs > 0L) {
            Map rec = new HashMap();
            rec.put('s', sMin);
            rec.put('e', eMin);
            rec.put('inf', infCnt);
            rec.put('ms', totMs);
            rec.put('avg', avgMs);
            ((List)em.get('ivs')).add(rec);
          }
        combine_script: "return state;"
        reduce_script: |
          Map mergedEmitters = new HashMap();
          String depName = '';
          long depNameTs = -1L;
          long depNameIng = -1L;
          String depGroup = '';
          long depGroupTs = -1L;
          long depGroupIng = -1L;
          boolean hasDepGroup = false;
          for (def st : states) {
            if (!(st instanceof Map)) { continue; }
            String sdn = st.get('dep_name') != null ? st.get('dep_name').toString() : '';
            long sdnIng = st.get('dep_name_ing') instanceof Number ? ((Number)st.get('dep_name_ing')).longValue() : -1L;
            long sdnTs = st.get('dep_name_ts') instanceof Number ? ((Number)st.get('dep_name_ts')).longValue() : -1L;
            if (sdn != '' && (sdnIng > depNameIng || (sdnIng == depNameIng && sdnTs >= depNameTs))) {
              depNameIng = sdnIng;
              depNameTs = sdnTs;
              depName = sdn;
            }
            if (Boolean.TRUE.equals(st.get('has_dep_group'))) {
              String sdg = st.get('dep_group') != null ? st.get('dep_group').toString() : '';
              long sdgIng = st.get('dep_group_ing') instanceof Number ? ((Number)st.get('dep_group_ing')).longValue() : -1L;
              long sdgTs = st.get('dep_group_ts') instanceof Number ? ((Number)st.get('dep_group_ts')).longValue() : -1L;
              if (!hasDepGroup || sdgIng > depGroupIng || (sdgIng == depGroupIng && sdgTs >= depGroupTs)) {
                hasDepGroup = true;
                depGroupIng = sdgIng;
                depGroupTs = sdgTs;
                depGroup = sdg;
              }
            }
            if (!(st.get('emitters') instanceof Map)) { continue; }
            for (def ee : ((Map)st.get('emitters')).entrySet()) {
              String ek = ee.getKey().toString();
              Map src = (Map)ee.getValue();
              Map dst = (Map)mergedEmitters.get(ek);
              if (dst == null) {
                dst = new HashMap();
                dst.put('doc_cnt', 0L);
                dst.put('max_avg', 0.0);
                dst.put('ivs_map', new HashMap());
                List wMask = new ArrayList();
                for (int wi = 0; wi < 23; wi++) { wMask.add(0L); }
                dst.put('wmask', wMask);
                dst.put('max_end', -1);
                dst.put('inf_sum', 0L);
                mergedEmitters.put(ek, dst);
              }
              dst.put('doc_cnt', ((Number)dst.get('doc_cnt')).longValue() + ((Number)src.get('doc_cnt')).longValue());
              double srcAvg = ((Number)src.get('max_avg')).doubleValue();
              if (srcAvg > ((Number)dst.get('max_avg')).doubleValue()) {
                dst.put('max_avg', srcAvg);
              }
              if (src.get('ivs') instanceof List) {
                Map ivsMap = (Map)dst.get('ivs_map');
                List wMask = (List)dst.get('wmask');
                for (def rObj : (List)src.get('ivs')) {
                  if (!(rObj instanceof Map)) { continue; }
                  Map rec = (Map)rObj;
                  int sMin = ((Number)rec.get('s')).intValue();
                  int eMin = ((Number)rec.get('e')).intValue();
                  long inf = ((Number)rec.get('inf')).longValue();
                  long ms = ((Number)rec.get('ms')).longValue();
                  double avg = ((Number)rec.get('avg')).doubleValue();
                  String ivk = Integer.toString(sMin) + ':' + Integer.toString(eMin);
                  Map iv = (Map)ivsMap.get(ivk);
                  if (iv == null) {
                    iv = new HashMap();
                    iv.put('s', sMin);
                    iv.put('e', eMin);
                    iv.put('inf', inf);
                    iv.put('ms', ms);
                    iv.put('avg', avg);
                    ivsMap.put(ivk, iv);
                  } else {
                    iv.put('inf', ((Number)iv.get('inf')).longValue() + inf);
                    iv.put('ms', ((Number)iv.get('ms')).longValue() + ms);
                    if (avg > ((Number)iv.get('avg')).doubleValue()) {
                      iv.put('avg', avg);
                    }
                  }
                  dst.put('inf_sum', ((Number)dst.get('inf_sum')).longValue() + inf);
                  if (eMin > ((Number)dst.get('max_end')).intValue()) {
                    dst.put('max_end', eMin);
                  }
                  for (int m = sMin; m < eMin; m++) {
                    int wi = m >> 6;
                    long bit = 1L << (m & 63);
                    wMask.set(wi, ((Number)wMask.get(wi)).longValue() | bit);
                  }
                }
              }
            }
          }

          List ranked = new ArrayList();
          for (def ee : mergedEmitters.entrySet()) {
            String ek = ee.getKey().toString();
            Map em = (Map)ee.getValue();
            int covMins = 0;
            for (def wv : (List)em.get('wmask')) {
              covMins += Long.bitCount(((Number)wv).longValue());
            }
            em.put('key', ek);
            em.put('nz', ((Number)em.get('inf_sum')).longValue() > 0L ? 1L : 0L);
            em.put('cov_mins', covMins);
            ranked.add(em);
          }

          List ordered = new ArrayList();
          while (ranked.size() > 0) {
            int bi = 0;
            Map bEm = (Map)ranked.get(0);
            for (int i = 1; i < ranked.size(); i++) {
              Map cEm = (Map)ranked.get(i);
              long cNz = ((Number)cEm.get('nz')).longValue();
              long bNz = ((Number)bEm.get('nz')).longValue();
              int cCov = ((Number)cEm.get('cov_mins')).intValue();
              int bCov = ((Number)bEm.get('cov_mins')).intValue();
              int cEnd = ((Number)cEm.get('max_end')).intValue();
              int bEnd = ((Number)bEm.get('max_end')).intValue();
              long cDocs = ((Number)cEm.get('doc_cnt')).longValue();
              long bDocs = ((Number)bEm.get('doc_cnt')).longValue();
              String cKey = cEm.get('key').toString();
              String bKey = bEm.get('key').toString();
              if (cNz > bNz
                  || (cNz == bNz && (cCov > bCov
                  || (cCov == bCov && (cEnd > bEnd
                  || (cEnd == bEnd && (cDocs > bDocs
                  || (cDocs == bDocs && cKey.compareTo(bKey) < 0)))))))) {
                bi = i;
                bEm = cEm;
              }
            }
            ordered.add(ranked.remove(bi));
          }

          List globalCov = new ArrayList();
          for (int wi = 0; wi < 23; wi++) { globalCov.add(0L); }
          long mergedInf = 0L;
          long mergedMs = 0L;
          double mergedMaxAvg = 0.0;

          for (def emObj : ordered) {
            Map em = (Map)emObj;
            List emIvs = new ArrayList(((Map)em.get('ivs_map')).values());
            while (emIvs.size() > 0) {
              int ii = 0;
              Map bIv = (Map)emIvs.get(0);
              for (int j = 1; j < emIvs.size(); j++) {
                Map cIv = (Map)emIvs.get(j);
                int cS = ((Number)cIv.get('s')).intValue();
                int bS = ((Number)bIv.get('s')).intValue();
                int cE = ((Number)cIv.get('e')).intValue();
                int bE = ((Number)bIv.get('e')).intValue();
                if (cS < bS || (cS == bS && cE > bE)) {
                  ii = j;
                  bIv = cIv;
                }
              }
              emIvs.remove(ii);
              int sMin = ((Number)bIv.get('s')).intValue();
              int eMin = ((Number)bIv.get('e')).intValue();
              int totalMins = eMin - sMin;
              if (totalMins <= 0) { continue; }
              int uncovMins = 0;
              for (int m = sMin; m < eMin; m++) {
                int wi = m >> 6;
                long bit = 1L << (m & 63);
                long word = ((Number)globalCov.get(wi)).longValue();
                if ((word & bit) == 0L) {
                  uncovMins++;
                  globalCov.set(wi, word | bit);
                }
              }
              if (uncovMins <= 0) { continue; }
              long ivInf = ((Number)bIv.get('inf')).longValue();
              long ivMs = ((Number)bIv.get('ms')).longValue();
              double ivAvg = ((Number)bIv.get('avg')).doubleValue();
              if (uncovMins == totalMins) {
                mergedInf += ivInf;
                mergedMs += ivMs;
              } else {
                double frac = (double)uncovMins / (double)totalMins;
                mergedInf += Math.round((double)ivInf * frac);
                mergedMs += Math.round((double)ivMs * frac);
              }
              if (ivAvg > mergedMaxAvg) {
                mergedMaxAvg = ivAvg;
              }
            }
          }

          if (mergedInf == 0L && mergedMs == 0L && ordered.size() > 0) {
            mergedMaxAvg = ((Number)((Map)ordered.get(0)).get('max_avg')).doubleValue();
          }

          Map res = new HashMap();
          res.put('inference_count', mergedInf);
          res.put('total_inference_time_ms', mergedMs);
          res.put('max_avg_ms', mergedMaxAvg);
          if (depName != '') {
            res.put('deployment_name', depName);
          }
          if (hasDepGroup) {
            res.put('deployment_group', depGroup);
          }
          return res;
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.7.0
