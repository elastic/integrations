- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the AI/ML model usage metric.
- name: cluster_name
  type: keyword
  description: Elasticsearch cluster name (matches billing deployment_id).
- name: deployment_id
  type: keyword
  description: Deployment identifier matching cluster_name.
- name: deployment_name
  type: keyword
  description: Human-readable deployment name.
- name: deployment_group
  type: keyword
  description: User-defined group of the deployment (based on tag:chargeback_group).
- name: composite_key
  type: keyword
  description: Date and deployment ID composite key (YYYY-MM-DD_deployment_id).
- name: model_id
  type: keyword
  description: Trained ML model or Inference API endpoint identifier.
- name: task_type
  type: keyword
  description: AI/ML inference task type (ingest_inference, query_inference, or inference endpoint task type).
- name: inference_count
  type: long
  description: Daily number of ML inferences observed for this model.
- name: average_inference_time_ms
  type: double
  description: Average latency per ML inference in milliseconds.
- name: total_inference_time_ms
  type: long
  description: Daily total compute time spent on ML inferences in milliseconds.
- name: usage_source
  type: keyword
  description: Usage telemetry source selected for this rollup row (native).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
