description: Aggregates daily total indexing, query, and storage usage per data tier across native Chargeback and legacy monitoring-indices sources.
source:
  index:
    - metrics-chargeback.usage-*
    - monitoring-indices*
    - "*:monitoring-indices*"
    - -monitoring-indices-chargeback
    - -chargeback_lookup.*
  query:
    bool:
      must_not:
        - term:
            doc_type: config_snapshot
  runtime_mappings:
    cb_sync_time:
      type: date
      script:
        source: |
          if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
            emit(doc['event.ingested'].value.toInstant().toEpochMilli());
            return;
          }
          if (params._source?.event?.ingested != null) {
            try {
              emit(ZonedDateTime.parse(params._source.event.ingested.toString()).toInstant().toEpochMilli());
              return;
            } catch (Exception e) {}
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_cluster_name:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.cluster.name.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          if (doc.containsKey('elasticsearch.cluster.name') && !doc['elasticsearch.cluster.name'].empty) {
            emit(doc['elasticsearch.cluster.name'].value.toString());
          }
    cb_index_tier:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.index.tier.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          if (doc.containsKey('elasticsearch.index.tier') && !doc['elasticsearch.index.tier'].empty) {
            emit(doc['elasticsearch.index.tier'].value.toString());
          }
    cb_index_tier_preference:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.index.tier_preference.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          if (doc.containsKey('elasticsearch.index.tier_preference') && !doc['elasticsearch.index.tier_preference'].empty) {
            emit(doc['elasticsearch.index.tier_preference'].value.toString());
          }
dest:
  index: cluster_tier_contribution_lookup
  pipeline: logs-chargeback.lookup-0.6.0-usage
frequency: 5m
sync:
  time:
    field: cb_sync_time
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: cb_cluster_name
    tier:
      terms:
        script:
          lang: painless
          # Use | not >: folded > turns newlines into spaces so // comments eat the preference checks.
          source: |
            if (doc.containsKey('cb_index_tier') && !doc['cb_index_tier'].empty) {
              def tier = doc['cb_index_tier'].value;
              if (tier != null && tier != 'unknown') return tier;
            }
            def pref = doc.containsKey('cb_index_tier_preference') && !doc['cb_index_tier_preference'].empty ? doc['cb_index_tier_preference'].value : null;
            if (pref == null) return 'unknown';
            /* Match monitoring_indices.yml: frozen -> cold -> warm -> hot/content
               (preference lists like data_cold,data_warm,data_hot must not resolve to hot) */
            if (pref.contains('data_frozen')) return 'frozen';
            if (pref.contains('data_cold')) return 'cold';
            if (pref.contains('data_warm')) return 'warm';
            if (pref.contains('data_hot') || pref.contains('data_content')) return 'hot/content';
            return 'unknown';
  aggregations:
    native:
      filter:
        term:
          data_stream.dataset: chargeback.usage
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        tier_sum_indexing_time:
          sum:
            field: elasticsearch.index.total.indexing.index_time_in_millis
        tier_sum_query_time:
          sum:
            field: elasticsearch.index.total.search.query_time_in_millis
        tier_sum_store_size:
          sum:
            field: elasticsearch.index.total.store.size_in_bytes
        tier_sum_data_set_store_size:
          sum:
            field: elasticsearch.index.primaries.store.total_data_set_size_in_bytes
    legacy:
      filter:
        bool:
          must_not:
            - term:
                data_stream.dataset: chargeback.usage
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        tier_sum_indexing_time:
          sum:
            field: elasticsearch.index.total.indexing.index_time_in_millis
        tier_sum_query_time:
          sum:
            field: elasticsearch.index.total.search.query_time_in_millis
        tier_sum_store_size:
          sum:
            field: elasticsearch.index.total.store.size_in_bytes
        tier_sum_data_set_store_size:
          sum:
            field: elasticsearch.index.primaries.store.total_data_set_size_in_bytes
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
