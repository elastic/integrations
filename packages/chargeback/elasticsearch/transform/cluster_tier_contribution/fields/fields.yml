- name: "@timestamp"
  type: date
  description: Daily timestamp representing when the metric was recorded.
- name: cluster_name
  type: keyword
  description: Name of the Elasticsearch cluster.
- name: deployment_id
  type: keyword
  description: Deployment identifier matching cluster_name.
- name: tier
  type: keyword
  description: The data tier where the index resides (e.g. hot, warm, cold, frozen).
- name: tier_sum_indexing_time
  type: long
  description: Total indexing time in milliseconds for the tier.
- name: tier_sum_query_time
  type: long
  description: Total query time in milliseconds for the tier.
- name: tier_sum_store_size
  type: long
  description: Total primary shard store size in bytes for the tier.
- name: tier_sum_data_set_store_size
  type: long
  description: Total dataset size in bytes for the tier.
- name: composite_key
  type: keyword
  description: Composite key used for billing attribution (set by ingest pipeline) consisting of date and data tier.
- name: composite_tier_key
  type: keyword
  description: Composite key consisting of date, deployment ID, and tier.
- name: usage_source
  type: keyword
  description: Usage telemetry source selected for this rollup row (native or legacy).
- name: has_native_usage
  type: boolean
  description: Whether native Chargeback usage samples contributed to this bucket.
- name: has_legacy_usage
  type: boolean
  description: Whether legacy monitoring-indices samples contributed to this bucket.
- name: native_sum_indexing_time
  type: long
  description: Native Chargeback indexing time in milliseconds for the tier.
- name: native_sum_query_time
  type: long
  description: Native Chargeback query time in milliseconds for the tier.
- name: native_sum_store_size
  type: long
  description: Native Chargeback total shard store size in bytes for the tier.
- name: native_sum_data_set_store_size
  type: long
  description: Native Chargeback primary dataset size in bytes for the tier.
- name: legacy_sum_indexing_time
  type: long
  description: Legacy monitoring-indices indexing time in milliseconds for the tier.
- name: legacy_sum_query_time
  type: long
  description: Legacy monitoring-indices query time in milliseconds for the tier.
- name: legacy_sum_store_size
  type: long
  description: Legacy monitoring-indices total shard store size in bytes for the tier.
- name: legacy_sum_data_set_store_size
  type: long
  description: Legacy monitoring-indices primary dataset size in bytes for the tier.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
