- name: "@timestamp"
  type: date
  description: Daily timestamp representing when the metric was recorded.
- name: cluster_name
  type: keyword
  description: Name of the Elasticsearch cluster.
- name: deployment_id
  type: keyword
  description: Deployment identifier (same as cluster_name).
- name: tier
  type: keyword
  description: The data tier where the index resides (e.g. hot/content, warm, cold, frozen).
- name: datastream
  type: keyword
  description: The name of the data stream.
- name: ds_type
  type: keyword
  description: First segment of the data stream name (for example logs, metrics, traces). Set to other when the name does not contain a hyphen.
- name: ds_namespace
  type: keyword
  description: Last segment of the data stream name (team, environment, or cost-center label). Set to other when the name does not contain a hyphen.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
- name: tier_and_datastream_sum_indexing_time
  type: long
  description: Total indexing time in milliseconds for the tier and data stream.
- name: tier_and_datastream_sum_query_time
  type: long
  description: Total query time in milliseconds for the tier and data stream.
- name: tier_and_datastream_sum_store_size
  type: long
  description: Total primary shard store size in bytes for the tier and data stream.
- name: tier_and_datastream_sum_data_set_store_size
  type: long
  description: Total dataset size in bytes for the tier and data stream.
- name: composite_key
  type: keyword
  description: Composite key used for billing attribution (set by ingest pipeline) consisting of date and deployment ID.
- name: composite_tier_key
  type: keyword
  description: Composite key consisting of date, deployment ID, and tier.
- name: composite_datastream_key
  type: keyword
  description: Composite key consisting of date, deployment ID, and data stream.
- name: usage_source
  type: keyword
  description: Usage telemetry source selected for this rollup row (native or legacy).
- name: elasticsearch.cluster.name
  type: keyword
  description: Deployment or cluster display name (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.name
  type: keyword
  description: Backing index or data stream name (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.datastream
  type: keyword
  description: Normalized data stream name (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.tier
  type: keyword
  description: Data tier where the index resides (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.creation_date
  type: date
  description: Earliest index creation timestamp in the aggregated bucket (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.age
  type: long
  description: Computed age in days derived from index creation date (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.primaries.docs.count
  type: long
  description: Primary document count (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.primaries.docs.count_delta
  type: long
  description: Daily primary document count delta (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.primaries.store.total_data_set_size_in_bytes
  type: long
  description: Primary dataset size in bytes (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.primaries.store.total_data_set_size_in_bytes_delta
  type: long
  description: Daily primary dataset size delta in bytes (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.store.size_in_bytes
  type: long
  description: Total shard store size in bytes (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.indexing.index_time_in_millis
  type: long
  description: Cumulative/daily indexing time in milliseconds (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.indexing.index_time_in_millis_delta
  type: long
  description: Daily indexing time delta in milliseconds (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.search.query_time_in_millis
  type: long
  description: Cumulative/daily search query time in milliseconds (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.search.query_time_in_millis_delta
  type: long
  description: Daily search query time delta in milliseconds (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.search.query_total
  type: long
  description: Cumulative/daily search query count (Elasticsearch monitoring-indices symlink).
- name: elasticsearch.index.total.search.query_total_delta
  type: long
  description: Daily search query count delta (Elasticsearch monitoring-indices symlink).
