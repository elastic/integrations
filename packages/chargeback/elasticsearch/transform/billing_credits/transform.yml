description: Materializes daily Elastic Cloud credit commitment snapshots with ESS Billing Credits compatibility fields.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.credits-*
    - -metrics-ess_billing.credits-chargeback
    - -chargeback_lookup.*
  query:
    bool:
      filter:
        - exists:
            field: ess.billing.ecu_quantity
      should:
        - term:
            doc_type: credit_line_item
        - term:
            data_stream.dataset: ess_billing.credits
        - term:
            event.dataset: ess_billing.credits
      minimum_should_match: 1
  runtime_mappings:
    cb_sync_ts:
      type: date
      script:
        source: |
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          for (String k : ['ingested', 'created']) {
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
            if (rawVal == null && params._source != null) {
              rawVal = params._source.get('event.' + k);
            }
            if (rawVal != null) {
              if (rawVal instanceof Number) {
                emit(((Number)rawVal).longValue());
                return;
              }
              String s = rawVal.toString().trim();
              if (s != '') {
                try {
                  emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                  return;
                } catch (Exception e) {}
              }
            }
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_ecu_quantity_whole:
      type: long
      script:
        source: |
          if (doc.containsKey('ess.billing.ecu_quantity') && !doc['ess.billing.ecu_quantity'].empty) {
            emit(((Number)doc['ess.billing.ecu_quantity'].value).longValue());
          } else if (params._source?.ess?.billing?.ecu_quantity instanceof Number) {
            emit(((Number)params._source.ess.billing.ecu_quantity).longValue());
          }
dest:
  index: chargeback_lookup.dest_billing_credits-1
  aliases:
    - alias: chargeback_lookup.billing_credits
      move_on_creation: true
  pipeline: logs-chargeback.lookup-0.6.0-credits
frequency: 60m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
pivot:
  group_by:
    snapshot_day:
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    organization_id:
      terms:
        field: ess.billing.organization_id
    credit_start:
      terms:
        field: ess.billing.start
    credit_end:
      terms:
        field: ess.billing.end
        missing_bucket: true
    credit_type:
      terms:
        field: ess.billing.type
        missing_bucket: true
    ecu_quantity:
      terms:
        field: cb_ecu_quantity_whole
  aggregations:
    latest_credit:
      scripted_metric:
        init_script: |
          state.docs = [];
        map_script: |
          long ts = (!doc['@timestamp'].empty) ? doc['@timestamp'].value.toInstant().toEpochMilli() : 0L;
          long ingTs = ts;
          try {
            if (doc.containsKey('cb_sync_ts') && !doc['cb_sync_ts'].empty) {
              ingTs = doc['cb_sync_ts'].value.toInstant().toEpochMilli();
            }
          } catch (Exception e) {}
          boolean isNat = false;
          try {
            if (doc.containsKey('doc_type') && !doc['doc_type'].empty) {
              isNat = doc['doc_type'].value.toString() == 'credit_line_item';
            } else if (params._source?.doc_type != null) {
              isNat = params._source.doc_type.toString() == 'credit_line_item';
            } else if (doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty) {
              isNat = doc['data_stream.dataset'].value.toString() == 'chargeback.billing';
            } else if (params._source?.data_stream?.dataset != null) {
              isNat = params._source.data_stream.dataset.toString() == 'chargeback.billing';
            }
          } catch (Exception e) {}
          double qty = 0.0;
          if (doc.containsKey('ess.billing.ecu_quantity') && !doc['ess.billing.ecu_quantity'].empty) {
            qty = ((Number)doc['ess.billing.ecu_quantity'].value).doubleValue();
          } else if (params._source?.ess?.billing?.ecu_quantity instanceof Number) {
            qty = ((Number)params._source.ess.billing.ecu_quantity).doubleValue();
          }
          double bal = 0.0;
          if (doc.containsKey('ess.billing.ecu_balance') && !doc['ess.billing.ecu_balance'].empty) {
            bal = ((Number)doc['ess.billing.ecu_balance'].value).doubleValue();
          } else if (params._source?.ess?.billing?.ecu_balance instanceof Number) {
            bal = ((Number)params._source.ess.billing.ecu_balance).doubleValue();
          }
          boolean act = false;
          if (doc.containsKey('ess.billing.active') && !doc['ess.billing.active'].empty) {
            act = doc['ess.billing.active'].value.toString().equalsIgnoreCase('true');
          } else if (params._source?.ess?.billing?.active != null) {
            act = params._source.ess.billing.active.toString().equalsIgnoreCase('true');
          }
          String agentId = '';
          try {
            if (doc.containsKey('agent.id') && !doc['agent.id'].empty) {
              agentId = doc['agent.id'].value.toString();
            } else if (params._source?.agent?.id != null) {
              agentId = params._source.agent.id.toString();
            }
          } catch (Exception e) {}
          String dsNs = 'default';
          try {
            if (doc.containsKey('data_stream.namespace') && !doc['data_stream.namespace'].empty) {
              dsNs = doc['data_stream.namespace'].value.toString();
            } else if (params._source?.data_stream?.namespace != null) {
              dsNs = params._source.data_stream.namespace.toString();
            }
          } catch (Exception e) {}
          String policyId = '';
          try {
            if (doc.containsKey('conf_policy_id') && !doc['conf_policy_id'].empty) {
              policyId = doc['conf_policy_id'].value.toString();
            } else if (params._source?.conf_policy_id != null) {
              policyId = params._source.conf_policy_id.toString();
            }
          } catch (Exception e) {}
          String lineId = '';
          try {
            if (doc.containsKey('credit_line_id') && !doc['credit_line_id'].empty) {
              lineId = doc['credit_line_id'].value.toString();
            } else if (params._source?.credit_line_id != null) {
              lineId = params._source.credit_line_id.toString();
            }
          } catch (Exception e) {}
          String pollOwner = agentId + '|' + dsNs + '|' + policyId;
          state.docs.add([ts, ingTs, bal, act, qty, isNat, pollOwner, lineId]);
        combine_script: |
          return state.docs;
        reduce_script: |
          List natDocs = new ArrayList();
          long maxNatTs = -1L;
          long maxNatIngTs = -1L;
          String latestNatOwner = '';
          List legDocs = new ArrayList();
          long maxLegTs = -1L;
          long maxLegIngTs = -1L;
          String latestLegOwner = '';
          for (shardDocs in states) {
            if (shardDocs == null) { continue; }
            for (d in shardDocs) {
              long ts = ((Number)d[0]).longValue();
              long ingTs = ((Number)d[1]).longValue();
              double bal = ((Number)d[2]).doubleValue();
              boolean act = d[3] != null && d[3].toString().equalsIgnoreCase('true');
              double qty = d.size() > 4 && d[4] instanceof Number ? ((Number)d[4]).doubleValue() : 0.0;
              boolean isNat = d.size() > 5 && Boolean.TRUE.equals(d[5]);
              String owner = d.size() > 6 && d[6] != null ? d[6].toString() : '';
              String lineId = d.size() > 7 && d[7] != null ? d[7].toString() : '';
              if (isNat) {
                natDocs.add([ts, ingTs, qty, bal, act, owner, lineId]);
                if (ts > maxNatTs
                    || (ts == maxNatTs && (ingTs > maxNatIngTs
                        || (ingTs == maxNatIngTs && owner.compareTo(latestNatOwner) > 0)))) {
                  maxNatTs = ts;
                  maxNatIngTs = ingTs;
                  latestNatOwner = owner;
                }
              } else {
                legDocs.add([ts, ingTs, qty, bal, act, owner]);
                if (ts > maxLegTs
                    || (ts == maxLegTs && (ingTs > maxLegIngTs
                        || (ingTs == maxLegIngTs && owner.compareTo(latestLegOwner) > 0)))) {
                  maxLegTs = ts;
                  maxLegIngTs = ingTs;
                  latestLegOwner = owner;
                }
              }
            }
          }

          Map latestNatItems = new LinkedHashMap();
          for (nd in natDocs) {
            long nTs = ((Number)nd[0]).longValue();
            long nIngTs = ((Number)nd[1]).longValue();
            String nOwner = nd[5] != null ? nd[5].toString() : '';
            boolean inLatestNatPoll = nOwner.equals(latestNatOwner)
              && (maxNatTs - nTs) <= 100L;
            if (!inLatestNatPoll) { continue; }
            double nQty = ((Number)nd[2]).doubleValue();
            double nBal = ((Number)nd[3]).doubleValue();
            boolean nAct = Boolean.TRUE.equals(nd[4]);
            String nLineId = nd.size() > 6 && nd[6] != null ? nd[6].toString().trim() : '';
            String dedupKey = nLineId != ''
              ? ('id:' + nLineId)
              : ('raw:' + Long.toString(nTs) + '|' + Double.toString(nQty) + '|' + Double.toString(nBal) + '|' + Boolean.toString(nAct));
            List prev = (List)latestNatItems.get(dedupKey);
            if (prev == null || nIngTs >= ((Number)prev[0]).longValue()) {
              latestNatItems.put(dedupKey, [nIngTs, nQty, nBal, nAct]);
            }
          }
          boolean hasNat = !latestNatItems.isEmpty();
          int natActCount = 0;
          double natActQty = 0.0;
          double natActBal = 0.0;
          double natAllQty = 0.0;
          double natAllBal = 0.0;
          for (ni in latestNatItems.values()) {
            double nQty = ((Number)ni[1]).doubleValue();
            double nBal = ((Number)ni[2]).doubleValue();
            boolean nAct = Boolean.TRUE.equals(ni[3]);
            natAllQty += nQty;
            natAllBal += nBal;
            if (nAct) {
              natActCount += 1;
              natActQty += nQty;
              natActBal += nBal;
            }
          }

          Map latestLegItems = new LinkedHashMap();
          for (ld in legDocs) {
            long lTs = ((Number)ld[0]).longValue();
            long lIngTs = ((Number)ld[1]).longValue();
            String lOwner = ld[5] != null ? ld[5].toString() : '';
            boolean inLatestPoll = lOwner.equals(latestLegOwner)
              && (maxLegTs - lTs) <= 5000L;
            if (!inLatestPoll) { continue; }
            double lQty = ((Number)ld[2]).doubleValue();
            double lBal = ((Number)ld[3]).doubleValue();
            boolean lAct = Boolean.TRUE.equals(ld[4]);
            String legKey = Long.toString((long)lQty);
            List prevLeg = (List)latestLegItems.get(legKey);
            if (prevLeg == null || lIngTs >= ((Number)prevLeg[0]).longValue()) {
              latestLegItems.put(legKey, [lIngTs, lQty, lBal, lAct]);
            }
          }
          boolean hasLeg = !latestLegItems.isEmpty();
          int legActCount = 0;
          double legActQty = 0.0;
          double legActBal = 0.0;
          double legAllQty = 0.0;
          double legAllBal = 0.0;
          for (li in latestLegItems.values()) {
            double lQty = ((Number)li[1]).doubleValue();
            double lBal = ((Number)li[2]).doubleValue();
            boolean lAct = Boolean.TRUE.equals(li[3]);
            legAllQty += lQty;
            legAllBal += lBal;
            if (lAct) {
              legActCount += 1;
              legActQty += lQty;
              legActBal += lBal;
            }
          }

          boolean finalAct = false;
          double finalQty = 0.0;
          double finalBal = 0.0;
          long finalTs = -1L;
          if (hasNat) {
            finalAct = natActCount > 0;
            finalQty = finalAct ? natActQty : natAllQty;
            finalBal = finalAct ? natActBal : natAllBal;
            finalTs = maxNatTs;
          } else if (hasLeg) {
            finalAct = legActCount > 0;
            finalQty = finalAct ? legActQty : legAllQty;
            finalBal = finalAct ? legActBal : legAllBal;
            finalTs = maxLegTs;
          }
          return [
            'ecu_quantity': finalQty,
            'ecu_balance': finalBal,
            'active': finalAct,
            'observed_at': finalTs > 0L ? finalTs : null
          ];
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
