- name: "@timestamp"
  type: date
  description: Daily snapshot timestamp of the credit commitment balance.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
- name: event.dataset
  type: keyword
  description: Dataset identifier for ESS Billing Credits dashboard compatibility.
- name: data_stream.type
  type: keyword
  description: Data stream type for ESS Billing Credits dashboard compatibility.
- name: data_stream.dataset
  type: keyword
  description: Data stream dataset for ESS Billing Credits dashboard compatibility.
- name: data_stream.namespace
  type: keyword
  description: Data stream namespace for ESS Billing Credits dashboard compatibility.
- name: cloud.account.id
  type: keyword
  description: Elastic Cloud organization account ID.
- name: ess.billing.organization_id
  type: keyword
  description: Elastic Cloud organization ID.
- name: ess.billing.active
  type: boolean
  description: Whether the prepaid credit commitment is currently active.
- name: ess.billing.type
  type: keyword
  description: Credit commitment line item type.
- name: ess.billing.start
  type: date
  description: Start timestamp of the credit commitment contract window.
- name: ess.billing.end
  type: date
  description: End timestamp of the credit commitment contract window.
- name: ess.billing.ecu_balance
  type: double
  description: Remaining ECU balance on the credit commitment.
- name: ess.billing.ecu_quantity
  type: double
  description: Total contracted ECU quantity on the credit commitment.
