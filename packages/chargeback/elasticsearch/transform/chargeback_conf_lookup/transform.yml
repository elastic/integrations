description: Syncs chargeback configuration lookup index from native Fleet configuration snapshot events while preserving manual or historical periods when Fleet sync is not active.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-chargeback.usage-*
    - metrics-chargeback.node_stats-*
    - -chargeback_lookup.*
  query:
    term:
      doc_type: config_snapshot
  runtime_mappings:
    config_join_key:
      type: keyword
      script:
        source: "emit('chargeback_config')"
dest:
  index: chargeback_conf_lookup
  pipeline: logs-chargeback.lookup-0.6.0-chargeback_conf
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 60s
pivot:
  group_by:
    config_join_key:
      terms:
        field: config_join_key
  aggregations:
    billing_conf:
      filter:
        term:
          data_stream.dataset: chargeback.billing
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        latest:
          top_metrics:
            metrics:
              - field: conf_sync_enabled
              - field: conf_chargeable_unit_rate
              - field: conf_chargeable_unit_rate_unit
              - field: conf_effective_from
            sort:
              event.ingested: desc
    usage_conf:
      filter:
        term:
          data_stream.dataset: chargeback.usage
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        latest:
          top_metrics:
            metrics:
              - field: conf_sync_enabled
              - field: conf_indexing_weight
              - field: conf_query_weight
              - field: conf_storage_weight
            sort:
              event.ingested: desc
    node_stats_conf:
      filter:
        term:
          data_stream.dataset: chargeback.node_stats
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        latest:
          top_metrics:
            metrics:
              - field: conf_sync_enabled
              - field: conf_utilization_memory_weight
              - field: conf_utilization_storage_weight
              - field: conf_utilization_floor
            sort:
              event.ingested: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
