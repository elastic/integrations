description: Syncs chargeback configuration lookup index (_id "config") from per-data-stream Fleet UI settings across billing, usage, and node_stats streams.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-chargeback.usage-*
    - metrics-chargeback.node_stats-*
    - metrics-ess_billing.billing-onprem*
  runtime_mappings:
    config_join_key:
      type: keyword
      script:
        source: "emit('chargeback_config')"
dest:
  index: chargeback_conf_lookup
  pipeline: logs-chargeback.lookup-0.6.0-chargeback_conf
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 60s
pivot:
  group_by:
    config_join_key:
      terms:
        field: config_join_key
  aggregations:
    billing_conf:
      filter:
        terms:
          data_stream.dataset:
            - chargeback.billing
            - ess_billing.billing
      aggs:
        latest:
          top_metrics:
            metrics:
              - field: conf_chargeable_unit_rate
              - field: conf_chargeable_unit_rate_unit
            sort:
              event.ingested: desc
    usage_conf:
      filter:
        term:
          data_stream.dataset: chargeback.usage
      aggs:
        latest:
          top_metrics:
            metrics:
              - field: conf_indexing_weight
              - field: conf_query_weight
              - field: conf_storage_weight
              - field: conf_memory_cost_weight
              - field: conf_storage_cost_weight
            sort:
              event.ingested: desc
    node_stats_conf:
      filter:
        term:
          data_stream.dataset: chargeback.node_stats
      aggs:
        latest:
          top_metrics:
            metrics:
              - field: conf_utilization_memory_weight
              - field: conf_utilization_storage_weight
              - field: conf_utilization_floor
            sort:
              event.ingested: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
