description: Syncs chargeback configuration lookup index from native Fleet configuration snapshot events while preserving manual or historical periods when Fleet sync is not active.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-chargeback.usage-*
    - metrics-chargeback.node_stats-*
    - metrics-ess_billing.billing-*
    - -metrics-ess_billing.billing-chargeback
    - -chargeback_lookup.*
  runtime_mappings:
    cb_sync_time:
      type: date
      script:
        source: |
          if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
            emit(doc['event.ingested'].value.toInstant().toEpochMilli());
            return;
          }
          if (params._source?.event?.ingested != null) {
            try {
              emit(ZonedDateTime.parse(params._source.event.ingested.toString()).toInstant().toEpochMilli());
              return;
            } catch (Exception e) {}
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    config_join_key:
      type: keyword
      script:
        source: "emit('chargeback_config')"
dest:
  index: chargeback_conf_lookup
  pipeline: logs-chargeback.lookup-0.6.0-chargeback_conf
frequency: 5m
sync:
  time:
    field: cb_sync_time
    delay: 60s
pivot:
  group_by:
    config_join_key:
      terms:
        field: config_join_key
  aggregations:
    billing_conf:
      filter:
        bool:
          filter:
            - term:
                data_stream.dataset: chargeback.billing
            - term:
                doc_type: config_snapshot
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        latest:
          top_metrics:
            metrics:
              - field: conf_chargeable_unit_rate
              - field: conf_chargeable_unit_rate_unit
              - field: conf_effective_from
            sort:
              cb_sync_time: desc
    usage_conf:
      filter:
        bool:
          filter:
            - term:
                data_stream.dataset: chargeback.usage
            - term:
                doc_type: config_snapshot
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        latest:
          top_metrics:
            metrics:
              - field: conf_indexing_weight
              - field: conf_query_weight
              - field: conf_storage_weight
            sort:
              cb_sync_time: desc
    node_stats_conf:
      filter:
        bool:
          filter:
            - term:
                data_stream.dataset: chargeback.node_stats
            - term:
                doc_type: config_snapshot
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        latest:
          top_metrics:
            metrics:
              - field: conf_utilization_memory_weight
              - field: conf_utilization_storage_weight
              - field: conf_utilization_floor
            sort:
              cb_sync_time: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
