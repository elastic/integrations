description: Syncs chargeback configuration lookup index from native Fleet configuration snapshot events while materializing an empty lookup for legacy-only installations and preserving manual or historical periods when Fleet sync is not active.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-chargeback.usage-*
    - metrics-chargeback.node_stats-*
    - metrics-ess_billing.billing-*
    - chargeback_conf_lookup*
    - chargeback_lookup.dest_chargeback_conf-1*
    - chargeback_lookup.dest_chargeback_conf_init-1*
    - -partial-*
    - -metrics-ess_billing.billing-chargeback*
    - -chargeback_lookup.dest_chargeback_conf-2*
  query:
    bool:
      should:
        - term:
            doc_type: config_snapshot
        - bool:
            must:
              - terms:
                  _index:
                    - chargeback_conf_lookup
                    - chargeback_lookup.dest_chargeback_conf-1
              - exists:
                  field: conf_start_date
        - bool:
            must:
              - term:
                  _index: chargeback_lookup.dest_chargeback_conf_init-1
              - exists:
                  field: config_join_key
      minimum_should_match: 1
  runtime_mappings:
    cb_conf_bucket_key:
      type: keyword
      script:
        source: |
          String idx = (doc.containsKey('_index') && !doc['_index'].empty) ? doc['_index'].value.toString() : '';
          if (idx == 'chargeback_lookup.dest_chargeback_conf_init-1') {
            if (doc.containsKey('config_join_key') && !doc['config_join_key'].empty) {
              String ik = doc['config_join_key'].value.toString().trim();
              if (ik != '') { emit(ik); }
            } else if (params._source?.get('config_join_key') != null) {
              String ik = params._source.get('config_join_key').toString().trim();
              if (ik != '') { emit(ik); }
            }
            return;
          }
          if (idx == 'chargeback_lookup.dest_chargeback_conf-1' || idx == 'chargeback_conf_lookup') {
            String rowId = '';
            try {
              if (doc.containsKey('conf_row_id') && !doc['conf_row_id'].empty) {
                rowId = doc['conf_row_id'].value.toString().trim();
              } else if (params._source?.get('conf_row_id') != null) {
                rowId = params._source.get('conf_row_id').toString().trim();
              }
            } catch (Exception e) {}
            if (rowId == 'config') {
              emit('chargeback_config');
              if (idx == 'chargeback_conf_lookup') {
                emit('chargeback_config_onprem');
              }
              return;
            }
            if (rowId == 'config_onprem') {
              if (idx == 'chargeback_lookup.dest_chargeback_conf-1') {
                emit('chargeback_config_onprem');
              }
              return;
            }
            if (rowId != '') {
              emit('manual:' + rowId);
              return;
            }
            String joinKey = 'chargeback_config';
            try {
              if (doc.containsKey('config_join_key') && !doc['config_join_key'].empty) {
                String jk = doc['config_join_key'].value.toString().trim();
                if (jk != '') { joinKey = jk; }
              } else if (params._source?.get('config_join_key') != null) {
                String jk = params._source.get('config_join_key').toString().trim();
                if (jk != '') { joinKey = jk; }
              }
            } catch (Exception e) {}
            long startMs = 1262304000000L;
            try {
              if (doc.containsKey('conf_start_date') && !doc['conf_start_date'].empty) {
                startMs = doc['conf_start_date'].value.toInstant().toEpochMilli();
              } else if (params._source?.get('conf_start_date') != null) {
                def rs = params._source.get('conf_start_date');
                if (rs instanceof Number) { startMs = ((Number)rs).longValue(); }
                else {
                  String ss = rs.toString().trim();
                  if (ss != '') {
                    try { startMs = Long.parseLong(ss); }
                    catch (Exception pe) { startMs = ZonedDateTime.parse(ss.contains('T') ? ss : (ss + 'T00:00:00Z')).toInstant().toEpochMilli(); }
                  }
                }
              }
            } catch (Exception e) {}
            long endMs = 2430518399999L;
            try {
              if (doc.containsKey('conf_end_date') && !doc['conf_end_date'].empty) {
                endMs = doc['conf_end_date'].value.toInstant().toEpochMilli();
              } else if (params._source?.get('conf_end_date') != null) {
                def re = params._source.get('conf_end_date');
                if (re instanceof Number) { endMs = ((Number)re).longValue(); }
                else {
                  String es = re.toString().trim();
                  if (es != '') {
                    try { endMs = Long.parseLong(es); }
                    catch (Exception pe) { endMs = ZonedDateTime.parse(es.contains('T') ? es : (es + 'T23:59:59.999Z')).toInstant().toEpochMilli(); }
                  }
                }
              }
            } catch (Exception e) {}
            if (endMs == 2430518399999L && (joinKey == 'chargeback_config' || joinKey == 'chargeback_config_onprem')) {
              if (joinKey == 'chargeback_config') {
                emit('chargeback_config');
                if (idx == 'chargeback_conf_lookup') {
                  emit('chargeback_config_onprem');
                }
              } else if (idx == 'chargeback_lookup.dest_chargeback_conf-1') {
                emit('chargeback_config_onprem');
              }
              return;
            }
            String synId = (joinKey == 'chargeback_config_onprem'
              ? 'config_onprem_'
              : (joinKey == 'chargeback_config' ? 'config_' : (joinKey + '_'))) + Long.toString(startMs) + '_' + Long.toString(endMs);
            emit('manual:' + synId);
            return;
          }
          emit('chargeback_config');
          emit('chargeback_config_onprem');
    cb_sync_ts:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty) {
            String cbIdx = doc['_index'].value.toString();
            if (cbIdx == 'chargeback_lookup.dest_chargeback_conf_init-1' || cbIdx == 'chargeback_lookup.dest_chargeback_conf-1' || cbIdx == 'chargeback_conf_lookup') {
              emit(1262304000000L);
              return;
            }
          }
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          for (String k : ['ingested', 'created']) {
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
            if (rawVal == null && params._source != null) {
              rawVal = params._source.get('event.' + k);
            }
            if (rawVal != null) {
              if (rawVal instanceof Number) {
                emit(((Number)rawVal).longValue());
                return;
              }
              String s = rawVal.toString().trim();
              if (s != '') {
                try {
                  emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                  return;
                } catch (Exception e) {}
              }
            }
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
            return;
          }
          if (doc.containsKey('_index') && !doc['_index'].empty) {
            String fbIdx = doc['_index'].value.toString();
            if (fbIdx == 'chargeback_conf_lookup' || fbIdx == 'chargeback_lookup.dest_chargeback_conf-1') {
              emit(1262304000000L);
            }
          }
dest:
  index: chargeback_lookup.dest_chargeback_conf-2
  aliases:
    - alias: chargeback_lookup.chargeback_conf
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "chargeback_conf" }}'
frequency: 5m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
pivot:
  group_by:
    config_join_key:
      terms:
        field: cb_conf_bucket_key
  aggregations:
    snapshots:
      filter:
        bool:
          should:
            - term:
                doc_type: config_snapshot
            - bool:
                must:
                  - terms:
                      _index:
                        - chargeback_conf_lookup
                        - chargeback_lookup.dest_chargeback_conf-1
                  - exists:
                      field: conf_start_date
            - bool:
                must:
                  - term:
                      _index: chargeback_lookup.dest_chargeback_conf_init-1
                  - exists:
                      field: config_join_key
          minimum_should_match: 1
      aggs:
        latest:
          scripted_metric:
            init_script: |
              state.owners = [:];
              state.emitters = [:];
              state.legacyConf = null;
              state.destInitialized = false;
            map_script: |
              if (params._source == null) {
                return;
              }
              String srcIdx = (doc.containsKey('_index') && !doc['_index'].empty)
                ? doc['_index'].value.toString()
                : '';
              if (srcIdx == 'chargeback_lookup.dest_chargeback_conf_init-1') {
                state.destInitialized = true;
                return;
              }
              if (srcIdx == 'chargeback_conf_lookup' || srcIdx == 'chargeback_lookup.dest_chargeback_conf-1') {
                boolean isDestV1 = (srcIdx == 'chargeback_lookup.dest_chargeback_conf-1');
                String rowId = '';
                try {
                  if (doc.containsKey('conf_row_id') && !doc['conf_row_id'].empty) {
                    rowId = doc['conf_row_id'].value.toString().trim();
                  } else if (params._source.get('conf_row_id') != null) {
                    rowId = params._source.get('conf_row_id').toString().trim();
                  }
                } catch (Exception e) {}
                String joinKey = 'chargeback_config';
                try {
                  if (doc.containsKey('config_join_key') && !doc['config_join_key'].empty) {
                    String jk = doc['config_join_key'].value.toString().trim();
                    if (jk != '') { joinKey = jk; }
                  } else if (params._source.get('config_join_key') != null) {
                    String jk = params._source.get('config_join_key').toString().trim();
                    if (jk != '') { joinKey = jk; }
                  }
                } catch (Exception e) {}
                long startMs = 1262304000000L;
                try {
                  if (doc.containsKey('conf_start_date') && !doc['conf_start_date'].empty) {
                    startMs = doc['conf_start_date'].value.toInstant().toEpochMilli();
                  } else if (params._source.get('conf_start_date') != null) {
                    def rs = params._source.get('conf_start_date');
                    if (rs instanceof Number) { startMs = ((Number)rs).longValue(); }
                    else {
                      String ss = rs.toString().trim();
                      if (ss != '') {
                        try { startMs = Long.parseLong(ss); }
                        catch (Exception pe) { startMs = ZonedDateTime.parse(ss.contains('T') ? ss : (ss + 'T00:00:00Z')).toInstant().toEpochMilli(); }
                      }
                    }
                  }
                } catch (Exception e) {}
                long endMs = 2430518399999L;
                try {
                  if (doc.containsKey('conf_end_date') && !doc['conf_end_date'].empty) {
                    endMs = doc['conf_end_date'].value.toInstant().toEpochMilli();
                  } else if (params._source.get('conf_end_date') != null) {
                    def re = params._source.get('conf_end_date');
                    if (re instanceof Number) { endMs = ((Number)re).longValue(); }
                    else {
                      String es = re.toString().trim();
                      if (es != '') {
                        try { endMs = Long.parseLong(es); }
                        catch (Exception pe) { endMs = ZonedDateTime.parse(es.contains('T') ? es : (es + 'T23:59:59.999Z')).toInstant().toEpochMilli(); }
                      }
                    }
                  }
                } catch (Exception e) {}
                if (!isDestV1 && (rowId == 'config_onprem' || (rowId == '' && joinKey == 'chargeback_config_onprem' && endMs == 2430518399999L))) {
                  return;
                }
                String resolvedId = rowId;
                if (resolvedId == '') {
                  if (endMs == 2430518399999L && joinKey == 'chargeback_config') {
                    resolvedId = 'config';
                  } else if (endMs == 2430518399999L && joinKey == 'chargeback_config_onprem') {
                    resolvedId = 'config_onprem';
                  } else {
                    resolvedId = (joinKey == 'chargeback_config_onprem'
                      ? 'config_onprem_'
                      : (joinKey == 'chargeback_config' ? 'config_' : (joinKey + '_'))) + Long.toString(startMs) + '_' + Long.toString(endMs);
                  }
                }
                long lSync = 0L;
                try {
                  if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
                    lSync = doc['event.ingested'].value.toInstant().toEpochMilli();
                  } else if (params._source?.event instanceof Map && params._source.event.ingested != null) {
                    def re = params._source.event.ingested;
                    if (re instanceof Number) { lSync = ((Number)re).longValue(); }
                    else { lSync = ZonedDateTime.parse(re.toString().trim()).toInstant().toEpochMilli(); }
                  } else if (params._source.get('event.ingested') != null) {
                    def re = params._source.get('event.ingested');
                    if (re instanceof Number) { lSync = ((Number)re).longValue(); }
                    else { lSync = ZonedDateTime.parse(re.toString().trim()).toInstant().toEpochMilli(); }
                  } else if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
                    lSync = doc['@timestamp'].value.toInstant().toEpochMilli();
                  }
                } catch (Exception e) {}
                int prio = isDestV1 ? 4 : (joinKey == 'chargeback_config_onprem' ? 3 : (resolvedId == 'config' ? 2 : 1));
                boolean take = (state.legacyConf == null);
                if (!take) {
                  int curPrio = state.legacyConf.prio instanceof Number ? ((Number)state.legacyConf.prio).intValue() : 0;
                  long curTs = state.legacyConf.ts instanceof Number ? ((Number)state.legacyConf.ts).longValue() : -1L;
                  if (prio > curPrio || (prio == curPrio && lSync >= curTs)) {
                    take = true;
                  }
                }
                if (take) {
                  Map lc = ['prio': prio, 'ts': lSync, 'from_dest_v1': isDestV1];
                  if (resolvedId != '' && resolvedId != 'config' && resolvedId != 'config_onprem') {
                    lc['manual_id'] = resolvedId;
                  }
                  for (String k : [
                    'conf_row_id',
                    'config_join_key',
                    'conf_start_date', 'conf_end_date',
                    'conf_chargeable_unit_rate', 'conf_chargeable_unit_rate_unit', 'conf_currency_symbol',
                    'conf_ecu_rate', 'conf_ecu_rate_unit',
                    'conf_onprem_chargeable_unit_rate',
                    'conf_indexing_weight', 'conf_query_weight', 'conf_storage_weight',
                    'conf_utilization_memory_weight', 'conf_utilization_storage_weight', 'conf_utilization_floor'
                  ]) {
                    if (params._source.get(k) != null) {
                      lc[k] = params._source.get(k);
                    }
                  }
                  state.legacyConf = lc;
                }
                return;
              }
              if (srcIdx != ''
                  && !(srcIdx.startsWith('.ds-metrics-chargeback.billing-')
                      || srcIdx.startsWith('metrics-chargeback.billing-')
                      || srcIdx == 'metrics-chargeback.billing'
                      || srcIdx.startsWith('.ds-metrics-chargeback.usage-')
                      || srcIdx.startsWith('metrics-chargeback.usage-')
                      || srcIdx == 'metrics-chargeback.usage'
                      || srcIdx.startsWith('.ds-metrics-chargeback.node_stats-')
                      || srcIdx.startsWith('metrics-chargeback.node_stats-')
                      || srcIdx == 'metrics-chargeback.node_stats')) {
                return;
              }
              long ts = (doc.containsKey('@timestamp') && !doc['@timestamp'].empty)
                ? doc['@timestamp'].value.toInstant().toEpochMilli()
                : 0L;
              long syncTs = (doc.containsKey('cb_sync_ts') && !doc['cb_sync_ts'].empty)
                ? doc['cb_sync_ts'].value.toInstant().toEpochMilli()
                : -1L;
              if (syncTs > 0L && ts > (syncTs + 300000L)) {
                ts = syncTs;
              }
              def rawSync = params._source.get('conf_sync_enabled');
              boolean syncEnabled = (rawSync == null) || rawSync.toString().equalsIgnoreCase('true');
              // Destination initialization is tracked independently via chargeback_lookup.dest_chargeback_conf_init-1.

              String ns = (params._source.data_stream instanceof Map && params._source.data_stream.namespace != null)
                ? params._source.data_stream.namespace.toString().trim()
                : (params._source.get('data_stream.namespace') != null ? params._source.get('data_stream.namespace').toString().trim() : 'default');
              if (ns == '') { ns = 'default'; }

              boolean fromInputId = false;
              String pkgPolId = '';
              if (params._source.get('package_policy_id') != null) {
                pkgPolId = params._source.get('package_policy_id').toString().trim();
              } else if (params._source.input instanceof Map && params._source.input.package_policy_id != null) {
                pkgPolId = params._source.input.package_policy_id.toString().trim();
              } else if (params._source.get('input.package_policy_id') != null) {
                pkgPolId = params._source.get('input.package_policy_id').toString().trim();
              } else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.package_policy_id != null) {
                pkgPolId = params._source.elastic_agent.package_policy_id.toString().trim();
              } else if (params._source.get('elastic_agent.package_policy_id') != null) {
                pkgPolId = params._source.get('elastic_agent.package_policy_id').toString().trim();
              } else if (params._source.get('conf_policy_id') != null) {
                pkgPolId = params._source.get('conf_policy_id').toString().trim();
                fromInputId = true;
              } else if (params._source.input instanceof Map && params._source.input.id != null) {
                pkgPolId = params._source.input.id.toString().trim();
                fromInputId = true;
              } else if (params._source.get('input.id') != null) {
                pkgPolId = params._source.get('input.id').toString().trim();
                fromInputId = true;
              }
              if (pkgPolId != '') {
                def pm = /^(?:.*-)?([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$/.matcher(pkgPolId);
                if (pm.matches()) {
                  pkgPolId = pm.group(1).toLowerCase(Locale.ROOT);
                } else if (fromInputId) {
                  def sm = /^cel-chargeback\.(?:billing|usage|node_stats)(?:-(.+))?$/.matcher(pkgPolId);
                  if (sm.matches()) {
                    pkgPolId = sm.group(1) != null ? ('cel-chargeback-' + sm.group(1)) : '';
                  } else if (!pkgPolId.startsWith('cel-chargeback-') && pkgPolId.contains('.')) {
                    pkgPolId = '';
                  }
                }
              }

              String polId = pkgPolId;
              if (polId == '') {
                if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.policy_id != null) {
                  polId = params._source.elastic_agent.policy_id.toString().trim();
                } else if (params._source.get('elastic_agent.policy_id') != null) {
                  polId = params._source.get('elastic_agent.policy_id').toString().trim();
                } else if (params._source.agent instanceof Map && params._source.agent.policy instanceof Map && params._source.agent.policy.id != null) {
                  polId = params._source.agent.policy.id.toString().trim();
                } else if (params._source.get('agent.policy.id') != null) {
                  polId = params._source.get('agent.policy.id').toString().trim();
                } else if (params._source.component instanceof Map && params._source.component.id != null) {
                  polId = params._source.component.id.toString().trim();
                }
              }

              String explicitId = params._source.get('conf_owner_id') != null
                ? params._source.get('conf_owner_id').toString().trim()
                : '';
              boolean isExplicit = explicitId != '';
              String ownerKey = isExplicit
                ? ('explicit:' + explicitId)
                : (polId != '' ? ('implicit:pol:' + polId) : ('implicit:ns:' + ns));

              // Only track cross-owner supersession when an integration-policy-unique ID is present
              // (conf_policy_id or package_policy_id). Shared agent/agent-policy fallback IDs can host
              // multiple Chargeback integration policies and must not supersede another policy's owner.
              if (pkgPolId != '') {
                String emitterId = 'pkg:' + ns + '|' + pkgPolId;
                Map em = (Map)state.emitters.get(emitterId);
                if (em == null) {
                  em = [:];
                  state.emitters.put(emitterId, em);
                }
                long prevEmTs = em.get(ownerKey) instanceof Number ? ((Number)em.get(ownerKey)).longValue() : -1L;
                if (ts > prevEmTs) {
                  em.put(ownerKey, ts);
                }
              }

              Map owner = (Map)state.owners.get(ownerKey);
              if (owner == null) {
                owner = [
                  'explicit': isExplicit,
                  'newestTs': -1L,
                  'newestSync': false,
                  'streams': [:]
                ];
                state.owners.put(ownerKey, owner);
              }
              long oTs = ((Number)owner.get('newestTs')).longValue();
              if (ts > oTs || (ts == oTs && !syncEnabled)) {
                owner.put('newestTs', ts);
                owner.put('newestSync', syncEnabled);
              }

              String ds = params._source.data_stream instanceof Map && params._source.data_stream.dataset != null
                ? params._source.data_stream.dataset.toString()
                : (params._source.get('data_stream.dataset') != null ? params._source.get('data_stream.dataset').toString() : '');
              if (ds == 'chargeback.billing' || ds == 'chargeback.usage' || ds == 'chargeback.node_stats') {
                Map oStreams = (Map)owner.get('streams');
                def prev = oStreams.get(ds);
                long prevTs = (prev instanceof Map && prev.ts instanceof Number) ? ((Number)prev.ts).longValue() : -1L;
                if (prev == null || ts > prevTs || (ts == prevTs && !syncEnabled)) {
                  Map snap = ['ts': ts, 'sync': syncEnabled, 'conf_owner_key': ownerKey];
                  for (def entry : params._source.entrySet()) {
                    String k = entry.getKey().toString();
                    if (k.startsWith('conf_') && entry.getValue() != null) {
                      snap[k] = entry.getValue();
                    }
                  }
                  oStreams.put(ds, snap);
                }
              }
            combine_script: "return state;"
            reduce_script: |
              Map mergedOwners = [:];
              Map mergedEmitters = [:];
              Map mergedLegacy = null;
              boolean destInitialized = false;
              for (def s : states) {
                if (s instanceof Map && Boolean.TRUE.equals(s.destInitialized)) {
                  destInitialized = true;
                }
                if (s instanceof Map && s.legacyConf instanceof Map) {
                  Map slc = (Map)s.legacyConf;
                  if (mergedLegacy == null) {
                    mergedLegacy = slc;
                  } else {
                    int sPrio = slc.prio instanceof Number ? ((Number)slc.prio).intValue() : 0;
                    long sTs = slc.ts instanceof Number ? ((Number)slc.ts).longValue() : -1L;
                    int cPrio = mergedLegacy.prio instanceof Number ? ((Number)mergedLegacy.prio).intValue() : 0;
                    long cTs = mergedLegacy.ts instanceof Number ? ((Number)mergedLegacy.ts).longValue() : -1L;
                    if (sPrio > cPrio || (sPrio == cPrio && sTs >= cTs)) {
                      mergedLegacy = slc;
                    }
                  }
                }
                if (s instanceof Map && s.emitters instanceof Map) {
                  for (def ee : ((Map)s.emitters).entrySet()) {
                    String eid = ee.getKey().toString();
                    if (!(ee.getValue() instanceof Map)) { continue; }
                    Map dstEm = (Map)mergedEmitters.get(eid);
                    if (dstEm == null) {
                      dstEm = [:];
                      mergedEmitters.put(eid, dstEm);
                    }
                    for (def oke : ((Map)ee.getValue()).entrySet()) {
                      String eok = oke.getKey().toString();
                      long ets = oke.getValue() instanceof Number ? ((Number)oke.getValue()).longValue() : -1L;
                      long curEts = dstEm.get(eok) instanceof Number ? ((Number)dstEm.get(eok)).longValue() : -1L;
                      if (ets > curEts) {
                        dstEm.put(eok, ets);
                      }
                    }
                  }
                }
                if (s instanceof Map && s.owners instanceof Map) {
                  for (def oe : ((Map)s.owners).entrySet()) {
                    String ok = oe.getKey().toString();
                    def srcObj = oe.getValue();
                    if (!(srcObj instanceof Map)) { continue; }
                    Map src = (Map)srcObj;
                    boolean srcExp = Boolean.TRUE.equals(src.get('explicit'));
                    long srcTs = src.get('newestTs') instanceof Number ? ((Number)src.get('newestTs')).longValue() : -1L;
                    boolean srcSync = Boolean.TRUE.equals(src.get('newestSync'));
                    Map dst = (Map)mergedOwners.get(ok);
                    if (dst == null) {
                      dst = [
                        'explicit': srcExp,
                        'newestTs': -1L,
                        'newestSync': false,
                        'streams': [:]
                      ];
                      mergedOwners.put(ok, dst);
                    }
                    if (srcExp) { dst.put('explicit', true); }
                    long dstTs = ((Number)dst.get('newestTs')).longValue();
                    if (srcTs >= 0L && (srcTs > dstTs || (srcTs == dstTs && !srcSync))) {
                      dst.put('newestTs', srcTs);
                      dst.put('newestSync', srcSync);
                    }
                    if (src.get('streams') instanceof Map) {
                      Map dstStreams = (Map)dst.get('streams');
                      for (def se : ((Map)src.get('streams')).entrySet()) {
                        String ds = se.getKey().toString();
                        def candObj = se.getValue();
                        if (!(candObj instanceof Map)) { continue; }
                        Map cand = (Map)candObj;
                        long cTs = cand.get('ts') instanceof Number ? ((Number)cand.get('ts')).longValue() : -1L;
                        boolean cSync = Boolean.TRUE.equals(cand.get('sync'));
                        def cur = dstStreams.get(ds);
                        long curTs = (cur instanceof Map && cur.ts instanceof Number) ? ((Number)cur.ts).longValue() : -1L;
                        if (cur == null || cTs > curTs || (cTs == curTs && !cSync)) {
                          dstStreams.put(ds, cand);
                        }
                      }
                    }
                  }
                }
              }

              if (mergedOwners.isEmpty()) {
                if (mergedLegacy != null && !destInitialized) {
                  return [
                    'has_snapshots': true,
                    'policy_sync_enabled': true,
                    'owner_conflict': false,
                    'from_legacy_conf': true,
                    'legacy_conf': mergedLegacy,
                    'streams': [:]
                  ];
                }
                return [
                  'has_snapshots': false,
                  'policy_sync_enabled': false,
                  'owner_conflict': false,
                  'streams': [:]
                ];
              }

              Set currentEmitterKeys = new HashSet();
              Map supersededAt = [:];
              for (def ee : mergedEmitters.entrySet()) {
                Map em = (Map)ee.getValue();
                long maxEmTs = -1L;
                for (def v : em.values()) {
                  long vts = v instanceof Number ? ((Number)v).longValue() : -1L;
                  if (vts > maxEmTs) { maxEmTs = vts; }
                }
                for (def oke : em.entrySet()) {
                  String kName = oke.getKey().toString();
                  long kts = oke.getValue() instanceof Number ? ((Number)oke.getValue()).longValue() : -1L;
                  if (kts >= 0L && kts == maxEmTs) {
                    currentEmitterKeys.add(kName);
                  } else if (kts >= 0L && kts < maxEmTs) {
                    long prevSup = supersededAt.get(kName) instanceof Number ? ((Number)supersededAt.get(kName)).longValue() : -1L;
                    if (kts > prevSup) {
                      supersededAt.put(kName, kts);
                    }
                  }
                }
              }

              Map activeOwners = [:];
              for (def e : mergedOwners.entrySet()) {
                String ok = e.getKey().toString();
                Map ov = (Map)e.getValue();
                long ovTs = ov.get('newestTs') instanceof Number ? ((Number)ov.get('newestTs')).longValue() : -1L;
                long supTs = supersededAt.get(ok) instanceof Number ? ((Number)supersededAt.get(ok)).longValue() : -1L;
                if (!currentEmitterKeys.contains(ok) && supTs >= 0L && ovTs <= supTs) {
                  continue;
                }
                activeOwners.put(ok, ov);
              }
              if (activeOwners.isEmpty()) {
                activeOwners = mergedOwners;
              }

              long maxActiveTs = -1L;
              for (def ovObj : activeOwners.values()) {
                if (ovObj instanceof Map && ((Map)ovObj).get('newestTs') instanceof Number) {
                  long tsVal = ((Number)((Map)ovObj).get('newestTs')).longValue();
                  if (tsVal > maxActiveTs) { maxActiveTs = tsVal; }
                }
              }

              // Live sync-enabled policies renew their config_snapshot every UTC day via today_utc.
              // Expire stale owners lagging the freshest active snapshot by >48h (172800000 ms) so
              // deleted or replaced policies age out automatically without waiting for ILM retention.
              long staleCutoffMs = 172800000L;
              List enabledExplicitKeys = new ArrayList();
              List enabledImplicitKeys = new ArrayList();
              for (def e : activeOwners.entrySet()) {
                String ok = e.getKey().toString();
                Map ov = (Map)e.getValue();
                if (!Boolean.TRUE.equals(ov.get('newestSync'))) {
                  continue;
                }
                long ovTs = ov.get('newestTs') instanceof Number ? ((Number)ov.get('newestTs')).longValue() : -1L;
                if (maxActiveTs > 0L && ovTs >= 0L && (maxActiveTs - ovTs) > staleCutoffMs) {
                  continue;
                }
                if (Boolean.TRUE.equals(ov.get('explicit'))) {
                  enabledExplicitKeys.add(ok);
                } else {
                  enabledImplicitKeys.add(ok);
                }
              }

              String selectedOwner = null;
              boolean ownerConflict = false;
              if (enabledExplicitKeys.size() == 1) {
                selectedOwner = enabledExplicitKeys.get(0).toString();
              } else if (enabledExplicitKeys.size() > 1) {
                ownerConflict = true;
              } else if (enabledImplicitKeys.size() == 1) {
                selectedOwner = enabledImplicitKeys.get(0).toString();
              } else if (enabledImplicitKeys.size() > 1) {
                ownerConflict = true;
              }

              boolean policySyncEnabled = false;
              Map bestStreams = [:];
              if (!ownerConflict && selectedOwner != null) {
                Map sel = (Map)activeOwners.get(selectedOwner);
                policySyncEnabled = Boolean.TRUE.equals(sel.get('newestSync'));
                if (policySyncEnabled && sel.get('streams') instanceof Map) {
                  bestStreams = new HashMap((Map)sel.get('streams'));
                  if (bestStreams.size() < 3) {
                    Map bestCarryTs = [:];
                    for (def ee : mergedEmitters.entrySet()) {
                      Map em = (Map)ee.getValue();
                      long selEmTs = em.get(selectedOwner) instanceof Number
                        ? ((Number)em.get(selectedOwner)).longValue()
                        : -1L;
                      if (selEmTs < 0L) { continue; }
                      for (def oke : em.entrySet()) {
                        String prevOk = oke.getKey().toString();
                        long prevEmTs = oke.getValue() instanceof Number
                          ? ((Number)oke.getValue()).longValue()
                          : -1L;
                        if (prevOk.equals(selectedOwner) || prevEmTs < 0L || prevEmTs >= selEmTs) {
                          continue;
                        }
                        if (maxActiveTs > 0L && (maxActiveTs - prevEmTs) > staleCutoffMs) {
                          continue;
                        }
                        def prevOwnerObj = mergedOwners.get(prevOk);
                        if (!(prevOwnerObj instanceof Map)) { continue; }
                        Map prevOwner = (Map)prevOwnerObj;
                        if (!(prevOwner.get('streams') instanceof Map)) { continue; }
                        Map prevStreams = (Map)prevOwner.get('streams');
                        for (String dsName : ['chargeback.billing', 'chargeback.usage', 'chargeback.node_stats']) {
                          if (sel.get('streams') instanceof Map && ((Map)sel.get('streams')).containsKey(dsName)) {
                            continue;
                          }
                          def psObj = prevStreams.get(dsName);
                          if (!(psObj instanceof Map)) { continue; }
                          Map ps = (Map)psObj;
                          if (!Boolean.TRUE.equals(ps.get('sync'))) { continue; }
                          long psTs = ps.get('ts') instanceof Number ? ((Number)ps.get('ts')).longValue() : -1L;
                          long curCarryTs = bestCarryTs.get(dsName) instanceof Number
                            ? ((Number)bestCarryTs.get(dsName)).longValue()
                            : -1L;
                          if (psTs >= 0L && psTs > curCarryTs && (maxActiveTs <= 0L || (maxActiveTs - psTs) <= staleCutoffMs)) {
                            Map carried = new HashMap(ps);
                            carried.put('conf_owner_key', selectedOwner);
                            bestStreams.put(dsName, carried);
                            bestCarryTs.put(dsName, psTs);
                          }
                        }
                      }
                    }
                  }
                }
              }

              if (!ownerConflict && !policySyncEnabled && mergedLegacy != null && !destInitialized) {
                return [
                  'has_snapshots': true,
                  'policy_sync_enabled': true,
                  'owner_conflict': false,
                  'from_legacy_conf': true,
                  'legacy_conf': mergedLegacy,
                  'streams': [:]
                ];
              }

              return [
                'has_snapshots': true,
                'policy_sync_enabled': policySyncEnabled,
                'owner_conflict': ownerConflict,
                'owner_key': selectedOwner != null ? selectedOwner : '',
                'streams': bestStreams
              ];
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  order: 0
  run_as_kibana_system: false
  fleet_transform_version: 0.7.0
