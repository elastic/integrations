# Fleet preserves existing dynamic: false chargeback_lookup.dest_chargeback_conf-1 mappings
# on package upgrade; 0.6.0 fields stay compatible here while 0.7.0 display currency
# settings (conf_currency_symbol, conf_currency_unit) are stored in chargeback_lookup.chargeback_currency.
- name: config_join_key
  type: keyword
  description: Join key for chargeback configuration.
- name: conf_chargeable_unit_rate
  type: double
  description: Chargeable unit rate for cost calculation (ECU/ERU).
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Currency unit for chargeable unit rate (for example, EUR, USD).
- name: conf_ecu_rate
  type: alias
  path: conf_chargeable_unit_rate
  description: Deprecated alias of conf_chargeable_unit_rate for dashboard ES|QL compatibility.
- name: conf_ecu_rate_unit
  type: alias
  path: conf_chargeable_unit_rate_unit
  description: Deprecated alias of conf_chargeable_unit_rate_unit for dashboard ES|QL compatibility.
- name: conf_indexing_weight
  type: integer
  description: Weight factor for indexing costs.
- name: conf_query_weight
  type: integer
  description: Weight factor for query costs.
- name: conf_storage_weight
  type: integer
  description: Weight factor for storage costs.
- name: conf_start_date
  type: date
  description: Configuration validity start date (defaults to Elasticsearch birthdate).
- name: conf_end_date
  type: date
  description: Configuration validity end date (defaults to 2046-12-31).
- name: conf_utilization_memory_weight
  type: integer
  description: Weight for heap p95 in capacity utilization score blend (default 70).
- name: conf_utilization_storage_weight
  type: integer
  description: Weight for disk p95 in capacity utilization score blend (default 30).
- name: conf_utilization_floor
  type: double
  description: Minimum utilization score (0.0 to 1.0) applied to all deployments regardless of actual utilization (default 0.10). Prevents realized cost from reaching zero for idle or unmonitored clusters.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
