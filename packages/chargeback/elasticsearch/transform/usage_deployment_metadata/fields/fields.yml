- name: "@timestamp"
  type: date
  description: Timestamp representing the usage observation day.
- name: composite_key
  type: keyword
  description: Composite join key in YYYY-MM-DD_<deployment_id> format matching usage and billing lookups.
- name: deployment_id
  type: keyword
  description: Deployment identifier matching cluster_name.
- name: deployment_name
  type: keyword
  description: Human-readable deployment name preserved from native usage telemetry when available.
- name: deployment_group
  type: keyword
  description: Chargeback group label derived from Elastic Cloud deployment tags (chargeback_group:*).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
