description: Aggregates daily Synthetics monitor check execution metrics per deployment, monitor, and synthetic type into a single daily lookup row, deduplicating overlapping multi-policy collections.
source:
  index:
    - metrics-chargeback.usage-*
  query:
    term:
      doc_type: "synthetics_monitor"
dest:
  index: chargeback_lookup.dest_cluster_synthetics_monitor_contribution-1
  aliases:
    - alias: chargeback_lookup.cluster_synthetics_monitor_contribution
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "usage" }}'
frequency: 60m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: elasticsearch.cluster.name
    monitor_id:
      terms:
        field: monitor_id
    monitor_type:
      terms:
        field: monitor_type
  aggregations:
    aux_rollup:
      scripted_metric:
        init_script: |
          state.emitters = new HashMap();
          state.dep_name = '';
          state.dep_name_ts = -1L;
          state.dep_name_ing = -1L;
          state.dep_group = '';
          state.dep_group_ts = -1L;
          state.dep_group_ing = -1L;
          state.has_dep_group = false;
          state.mon_name = '';
          state.mon_name_ts = -1L;
          state.mon_name_ing = -1L;
          state.mon_ns = '';
          state.mon_ns_ts = -1L;
          state.mon_ns_ing = -1L;
        map_script: |
          if (!doc.containsKey('@timestamp') || doc['@timestamp'].empty) { return; }
          long ts = doc['@timestamp'].value.toInstant().toEpochMilli();
          long ingTs = -1L;
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              ingTs = doc['event.ingested'].value.toInstant().toEpochMilli();
            } else if (params._source?.event?.ingested != null) {
              ingTs = ZonedDateTime.parse(params._source.event.ingested.toString()).toInstant().toEpochMilli();
            }
          } catch (Exception e) {}

          String dn = '';
          for (String dnf : ['deployment_name.keyword', 'deployment_name']) {
            try {
              if (doc.containsKey(dnf) && !doc[dnf].empty) {
                dn = doc[dnf].value.toString();
                if (dn != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (dn == '') {
            try {
              def sdn = params._source?.get('deployment_name');
              if (sdn != null && sdn.toString() != '') { dn = sdn.toString(); }
            } catch (Exception e) {}
          }
          if (dn != '' && (ingTs > state.dep_name_ing || (ingTs == state.dep_name_ing && ts >= state.dep_name_ts))) {
            state.dep_name_ing = ingTs;
            state.dep_name_ts = ts;
            state.dep_name = dn;
          }

          boolean hasDg = false;
          String dg = '';
          if (params._source != null && params._source.containsKey('deployment_group') && params._source.get('deployment_group') != null) {
            hasDg = true;
            dg = params._source.get('deployment_group').toString();
          } else {
            for (String dgf : ['deployment_group.keyword', 'deployment_group']) {
              try {
                if (doc.containsKey(dgf) && !doc[dgf].empty) {
                  hasDg = true;
                  dg = doc[dgf].value.toString();
                  break;
                }
              } catch (Exception e) {}
            }
          }
          if (hasDg && (ingTs > state.dep_group_ing || (ingTs == state.dep_group_ing && ts >= state.dep_group_ts))) {
            state.has_dep_group = true;
            state.dep_group_ing = ingTs;
            state.dep_group_ts = ts;
            state.dep_group = dg;
          }

          String mn = '';
          for (String mnf : ['monitor_name.keyword', 'monitor_name']) {
            try {
              if (doc.containsKey(mnf) && !doc[mnf].empty) {
                mn = doc[mnf].value.toString();
                if (mn != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (mn == '' && params._source?.get('monitor_name') != null) {
            mn = params._source.get('monitor_name').toString();
          }
          if (mn != '' && (ingTs > state.mon_name_ing || (ingTs == state.mon_name_ing && ts >= state.mon_name_ts))) {
            state.mon_name_ing = ingTs;
            state.mon_name_ts = ts;
            state.mon_name = mn;
          }

          String mns = '';
          for (String mnsf : ['monitor_namespace.keyword', 'monitor_namespace']) {
            try {
              if (doc.containsKey(mnsf) && !doc[mnsf].empty) {
                mns = doc[mnsf].value.toString();
                if (mns != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (mns == '' && params._source?.get('monitor_namespace') != null) {
            mns = params._source.get('monitor_namespace').toString();
          }
          if (mns != '' && (ingTs > state.mon_ns_ing || (ingTs == state.mon_ns_ing && ts >= state.mon_ns_ts))) {
            state.mon_ns_ing = ingTs;
            state.mon_ns_ts = ts;
            state.mon_ns = mns;
          }

          String ns = 'default';
          for (String nf : ['data_stream.namespace.keyword', 'data_stream.namespace']) {
            try {
              if (doc.containsKey(nf) && !doc[nf].empty) {
                String v = doc[nf].value.toString().trim();
                if (v != '') { ns = v; break; }
              }
            } catch (Exception e) {}
          }
          if (ns == 'default') {
            try {
              def sns = params._source?.data_stream instanceof Map ? params._source.data_stream.get('namespace') : params._source?.get('data_stream.namespace');
              if (sns != null && sns.toString().trim() != '') { ns = sns.toString().trim(); }
            } catch (Exception e) {}
          }

          String polId = '';
          for (String pf : ['conf_policy_id.keyword', 'conf_policy_id', 'package_policy_id.keyword', 'package_policy_id', 'input.package_policy_id.keyword', 'input.package_policy_id', 'elastic_agent.package_policy_id.keyword', 'elastic_agent.package_policy_id', 'input.id.keyword', 'input.id', 'elastic_agent.policy_id.keyword', 'elastic_agent.policy_id']) {
            try {
              if (doc.containsKey(pf) && !doc[pf].empty) {
                String pv = doc[pf].value.toString().trim();
                if (pv != '') { polId = pv; break; }
              }
            } catch (Exception e) {}
          }
          if (polId == '' && params._source != null) {
            if (params._source.get('conf_policy_id') != null) { polId = params._source.get('conf_policy_id').toString().trim(); }
            else if (params._source.get('package_policy_id') != null) { polId = params._source.get('package_policy_id').toString().trim(); }
            else if (params._source.input instanceof Map && params._source.input.get('package_policy_id') != null) { polId = params._source.input.get('package_policy_id').toString().trim(); }
            else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.get('package_policy_id') != null) { polId = params._source.elastic_agent.get('package_policy_id').toString().trim(); }
            else if (params._source.input instanceof Map && params._source.input.get('id') != null) { polId = params._source.input.get('id').toString().trim(); }
            else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.get('policy_id') != null) { polId = params._source.elastic_agent.get('policy_id').toString().trim(); }
          }
          if (polId == '') { polId = '_default_'; }

          String collectorId = '';
          for (String cf : ['agent.id.keyword', 'agent.id', 'elastic_agent.id.keyword', 'elastic_agent.id', 'host.id.keyword', 'host.id', 'host.name.keyword', 'host.name']) {
            try {
              if (doc.containsKey(cf) && !doc[cf].empty) {
                String cv = doc[cf].value.toString().trim();
                if (cv != '') { collectorId = cv; break; }
              }
            } catch (Exception e) {}
          }
          if (collectorId == '' && params._source != null) {
            if (params._source.agent instanceof Map && params._source.agent.get('id') != null) { collectorId = params._source.agent.get('id').toString().trim(); }
            else if (params._source.elastic_agent instanceof Map && params._source.elastic_agent.get('id') != null) { collectorId = params._source.elastic_agent.get('id').toString().trim(); }
            else if (params._source.host instanceof Map && params._source.host.get('id') != null) { collectorId = params._source.host.get('id').toString().trim(); }
            else if (params._source.host instanceof Map && params._source.host.get('name') != null) { collectorId = params._source.host.get('name').toString().trim(); }
          }
          if (collectorId == '') { collectorId = '_default_'; }
          String emKey = ns + '|' + polId + '|' + collectorId;

          long chkCnt = 0L;
          try {
            if (doc.containsKey('check_count') && !doc['check_count'].empty) {
              chkCnt = ((Number)doc['check_count'].value).longValue();
            } else if (params._source?.get('check_count') instanceof Number) {
              chkCnt = ((Number)params._source.get('check_count')).longValue();
            }
          } catch (Exception e) {}
          if (chkCnt < 0L) { chkCnt = 0L; }

          long upCnt = 0L;
          try {
            if (doc.containsKey('up_count') && !doc['up_count'].empty) {
              upCnt = ((Number)doc['up_count'].value).longValue();
            } else if (params._source?.get('up_count') instanceof Number) {
              upCnt = ((Number)params._source.get('up_count')).longValue();
            }
          } catch (Exception e) {}
          if (upCnt < 0L) { upCnt = 0L; }

          long downCnt = 0L;
          try {
            if (doc.containsKey('down_count') && !doc['down_count'].empty) {
              downCnt = ((Number)doc['down_count'].value).longValue();
            } else if (params._source?.get('down_count') instanceof Number) {
              downCnt = ((Number)params._source.get('down_count')).longValue();
            }
          } catch (Exception e) {}
          if (downCnt < 0L) { downCnt = 0L; }

          long locCnt = 0L;
          try {
            if (doc.containsKey('locations_count') && !doc['locations_count'].empty) {
              locCnt = ((Number)doc['locations_count'].value).longValue();
            } else if (params._source?.get('locations_count') instanceof Number) {
              locCnt = ((Number)params._source.get('locations_count')).longValue();
            }
          } catch (Exception e) {}

          double totDurMs = 0.0;
          try {
            if (doc.containsKey('total_duration_ms') && !doc['total_duration_ms'].empty) {
              totDurMs = ((Number)doc['total_duration_ms'].value).doubleValue();
            } else if (params._source?.get('total_duration_ms') instanceof Number) {
              totDurMs = ((Number)params._source.get('total_duration_ms')).doubleValue();
            }
          } catch (Exception e) {}
          if (totDurMs < 0.0) { totDurMs = 0.0; }

          double avgDurMs = 0.0;
          try {
            if (doc.containsKey('average_duration_ms') && !doc['average_duration_ms'].empty) {
              avgDurMs = ((Number)doc['average_duration_ms'].value).doubleValue();
            } else if (params._source?.get('average_duration_ms') instanceof Number) {
              avgDurMs = ((Number)params._source.get('average_duration_ms')).doubleValue();
            }
          } catch (Exception e) {}

          long rem = ts % 86400000L;
          if (rem < 0L) { rem += 86400000L; }
          int b = (int)(rem / 600000L);
          if (b < 0) { b = 0; }
          if (b > 143) { b = 143; }
          int w = b >> 6;
          long bit = 1L << (b & 63);

          Map em = (Map)state.emitters.get(emKey);
          if (em == null) {
            em = new HashMap();
            em.put('w0', w == 0 ? bit : 0L);
            em.put('w1', w == 1 ? bit : 0L);
            em.put('w2', w == 2 ? bit : 0L);
            em.put('max_ts', ts);
            em.put('doc_cnt', 1L);
            em.put('chk', chkCnt);
            em.put('up', upCnt);
            em.put('down', downCnt);
            em.put('max_loc', locCnt);
            em.put('tot_dur', totDurMs);
            em.put('max_avg_dur', avgDurMs);
            em.put('locs', new ArrayList());
            state.emitters.put(emKey, em);
          } else {
            String wk = 'w' + Integer.toString(w);
            em.put(wk, ((Number)em.get(wk)).longValue() | bit);
            if (ts > ((Number)em.get('max_ts')).longValue()) { em.put('max_ts', ts); }
            em.put('doc_cnt', ((Number)em.get('doc_cnt')).longValue() + 1L);
            em.put('chk', ((Number)em.get('chk')).longValue() + chkCnt);
            em.put('up', ((Number)em.get('up')).longValue() + upCnt);
            em.put('down', ((Number)em.get('down')).longValue() + downCnt);
            if (locCnt > ((Number)em.get('max_loc')).longValue()) { em.put('max_loc', locCnt); }
            em.put('tot_dur', ((Number)em.get('tot_dur')).doubleValue() + totDurMs);
            if (avgDurMs > ((Number)em.get('max_avg_dur')).doubleValue()) { em.put('max_avg_dur', avgDurMs); }
          }

          List locsList = (List)em.get('locs');
          boolean addedDocLoc = false;
          for (String lf : ['observer_locations.keyword', 'observer_locations']) {
            try {
              if (doc.containsKey(lf) && !doc[lf].empty) {
                for (def lv : doc[lf]) {
                  if (lv != null) {
                    String ls = lv.toString().trim();
                    if (ls != '' && locsList.size() < 500 && !locsList.contains(ls)) {
                      locsList.add(ls);
                    }
                  }
                }
                addedDocLoc = true;
                break;
              }
            } catch (Exception e) {}
          }
          if (!addedDocLoc && params._source?.get('observer_locations') != null) {
            def rawLocs = params._source.get('observer_locations');
            if (rawLocs instanceof List) {
              for (def lv : (List)rawLocs) {
                if (lv != null) {
                  String ls = lv.toString().trim();
                  if (ls != '' && locsList.size() < 500 && !locsList.contains(ls)) {
                    locsList.add(ls);
                  }
                }
              }
            } else {
              String ls = rawLocs.toString().trim();
              if (ls != '' && locsList.size() < 500 && !locsList.contains(ls)) {
                locsList.add(ls);
              }
            }
          }
        combine_script: "return state;"
        reduce_script: |
          Map mergedEmitters = new HashMap();
          String depName = '';
          long depNameTs = -1L;
          long depNameIng = -1L;
          String depGroup = '';
          long depGroupTs = -1L;
          long depGroupIng = -1L;
          boolean hasDepGroup = false;
          String monName = '';
          long monNameTs = -1L;
          long monNameIng = -1L;
          String monNs = '';
          long monNsTs = -1L;
          long monNsIng = -1L;
          for (def st : states) {
            if (!(st instanceof Map)) { continue; }
            String sdn = st.get('dep_name') != null ? st.get('dep_name').toString() : '';
            long sdnIng = st.get('dep_name_ing') instanceof Number ? ((Number)st.get('dep_name_ing')).longValue() : -1L;
            long sdnTs = st.get('dep_name_ts') instanceof Number ? ((Number)st.get('dep_name_ts')).longValue() : -1L;
            if (sdn != '' && (sdnIng > depNameIng || (sdnIng == depNameIng && sdnTs >= depNameTs))) {
              depNameIng = sdnIng;
              depNameTs = sdnTs;
              depName = sdn;
            }
            if (Boolean.TRUE.equals(st.get('has_dep_group'))) {
              String sdg = st.get('dep_group') != null ? st.get('dep_group').toString() : '';
              long sdgIng = st.get('dep_group_ing') instanceof Number ? ((Number)st.get('dep_group_ing')).longValue() : -1L;
              long sdgTs = st.get('dep_group_ts') instanceof Number ? ((Number)st.get('dep_group_ts')).longValue() : -1L;
              if (!hasDepGroup || sdgIng > depGroupIng || (sdgIng == depGroupIng && sdgTs >= depGroupTs)) {
                hasDepGroup = true;
                depGroupIng = sdgIng;
                depGroupTs = sdgTs;
                depGroup = sdg;
              }
            }
            String smn = st.get('mon_name') != null ? st.get('mon_name').toString() : '';
            long smnIng = st.get('mon_name_ing') instanceof Number ? ((Number)st.get('mon_name_ing')).longValue() : -1L;
            long smnTs = st.get('mon_name_ts') instanceof Number ? ((Number)st.get('mon_name_ts')).longValue() : -1L;
            if (smn != '' && (smnIng > monNameIng || (smnIng == monNameIng && smnTs >= monNameTs))) {
              monNameIng = smnIng;
              monNameTs = smnTs;
              monName = smn;
            }
            String smns = st.get('mon_ns') != null ? st.get('mon_ns').toString() : '';
            long smnsIng = st.get('mon_ns_ing') instanceof Number ? ((Number)st.get('mon_ns_ing')).longValue() : -1L;
            long smnsTs = st.get('mon_ns_ts') instanceof Number ? ((Number)st.get('mon_ns_ts')).longValue() : -1L;
            if (smns != '' && (smnsIng > monNsIng || (smnsIng == monNsIng && smnsTs >= monNsTs))) {
              monNsIng = smnsIng;
              monNsTs = smnsTs;
              monNs = smns;
            }
            if (!(st.get('emitters') instanceof Map)) { continue; }
            for (def ee : ((Map)st.get('emitters')).entrySet()) {
              String ek = ee.getKey().toString();
              Map src = (Map)ee.getValue();
              Map dst = (Map)mergedEmitters.get(ek);
              if (dst == null) {
                dst = new HashMap();
                dst.put('w0', ((Number)src.get('w0')).longValue());
                dst.put('w1', ((Number)src.get('w1')).longValue());
                dst.put('w2', ((Number)src.get('w2')).longValue());
                dst.put('max_ts', ((Number)src.get('max_ts')).longValue());
                dst.put('doc_cnt', ((Number)src.get('doc_cnt')).longValue());
                dst.put('chk', ((Number)src.get('chk')).longValue());
                dst.put('up', ((Number)src.get('up')).longValue());
                dst.put('down', ((Number)src.get('down')).longValue());
                dst.put('max_loc', ((Number)src.get('max_loc')).longValue());
                dst.put('tot_dur', ((Number)src.get('tot_dur')).doubleValue());
                dst.put('max_avg_dur', ((Number)src.get('max_avg_dur')).doubleValue());
                Set lset = new HashSet();
                if (src.get('locs') instanceof List) {
                  for (def lv : (List)src.get('locs')) {
                    if (lv != null) { lset.add(lv.toString()); }
                  }
                }
                dst.put('locs', lset);
                mergedEmitters.put(ek, dst);
              } else {
                dst.put('w0', ((Number)dst.get('w0')).longValue() | ((Number)src.get('w0')).longValue());
                dst.put('w1', ((Number)dst.get('w1')).longValue() | ((Number)src.get('w1')).longValue());
                dst.put('w2', ((Number)dst.get('w2')).longValue() | ((Number)src.get('w2')).longValue());
                if (((Number)src.get('max_ts')).longValue() > ((Number)dst.get('max_ts')).longValue()) {
                  dst.put('max_ts', ((Number)src.get('max_ts')).longValue());
                }
                dst.put('doc_cnt', ((Number)dst.get('doc_cnt')).longValue() + ((Number)src.get('doc_cnt')).longValue());
                dst.put('chk', ((Number)dst.get('chk')).longValue() + ((Number)src.get('chk')).longValue());
                dst.put('up', ((Number)dst.get('up')).longValue() + ((Number)src.get('up')).longValue());
                dst.put('down', ((Number)dst.get('down')).longValue() + ((Number)src.get('down')).longValue());
                if (((Number)src.get('max_loc')).longValue() > ((Number)dst.get('max_loc')).longValue()) {
                  dst.put('max_loc', ((Number)src.get('max_loc')).longValue());
                }
                dst.put('tot_dur', ((Number)dst.get('tot_dur')).doubleValue() + ((Number)src.get('tot_dur')).doubleValue());
                if (((Number)src.get('max_avg_dur')).doubleValue() > ((Number)dst.get('max_avg_dur')).doubleValue()) {
                  dst.put('max_avg_dur', ((Number)src.get('max_avg_dur')).doubleValue());
                }
                Set lset = (Set)dst.get('locs');
                if (src.get('locs') instanceof List) {
                  for (def lv : (List)src.get('locs')) {
                    if (lv != null && lset.size() < 500) { lset.add(lv.toString()); }
                  }
                }
              }
            }
          }
          String bestKey = null;
          Map bestEm = null;
          long bestNonZero = -1L;
          int bestMaxHour = -1;
          int bestSlots = -1;
          long bestDocs = -1L;
          for (def ee : mergedEmitters.entrySet()) {
            String ek = ee.getKey().toString();
            Map em = (Map)ee.getValue();
            long emChk = ((Number)em.get('chk')).longValue();
            long nz = emChk > 0L ? 1L : 0L;
            long mTs = ((Number)em.get('max_ts')).longValue();
            long rem = ((mTs % 86400000L) + 86400000L) % 86400000L;
            int maxHour = (int)(rem / 3600000L);
            int slots = Long.bitCount(((Number)em.get('w0')).longValue())
              + Long.bitCount(((Number)em.get('w1')).longValue())
              + Long.bitCount(((Number)em.get('w2')).longValue());
            long docs = ((Number)em.get('doc_cnt')).longValue();
            if (bestEm == null
                || nz > bestNonZero
                || (nz == bestNonZero && (maxHour > bestMaxHour
                || (maxHour == bestMaxHour && (slots > bestSlots
                || (slots == bestSlots && (docs > bestDocs
                || (docs == bestDocs && ek.compareTo(bestKey) < 0)))))))) {
              bestKey = ek;
              bestEm = em;
              bestNonZero = nz;
              bestMaxHour = maxHour;
              bestSlots = slots;
              bestDocs = docs;
            }
          }
          Map res = new HashMap();
          if (bestEm != null) {
            res.put('check_count', ((Number)bestEm.get('chk')).longValue());
            res.put('up_count', ((Number)bestEm.get('up')).longValue());
            res.put('down_count', ((Number)bestEm.get('down')).longValue());
            res.put('distinct_locations_count', (long)((Set)bestEm.get('locs')).size());
            res.put('max_locations_count', ((Number)bestEm.get('max_loc')).longValue());
            res.put('total_duration_ms', ((Number)bestEm.get('tot_dur')).doubleValue());
            res.put('max_avg_duration_ms', ((Number)bestEm.get('max_avg_dur')).doubleValue());
          } else {
            res.put('check_count', 0L);
            res.put('up_count', 0L);
            res.put('down_count', 0L);
            res.put('distinct_locations_count', 0L);
            res.put('max_locations_count', 0L);
            res.put('total_duration_ms', 0.0);
            res.put('max_avg_duration_ms', 0.0);
          }
          if (depName != '') { res.put('deployment_name', depName); }
          if (hasDepGroup) { res.put('deployment_group', depGroup); }
          if (monName != '') { res.put('monitor_name', monName); }
          if (monNs != '') { res.put('monitor_namespace', monNs); }
          return res;
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.7.0
