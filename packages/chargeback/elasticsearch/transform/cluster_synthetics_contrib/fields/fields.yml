- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the Synthetics monitor usage metric.
- name: cluster_name
  type: keyword
  description: Elasticsearch cluster name (matches billing deployment_id).
- name: deployment_id
  type: keyword
  description: Deployment identifier matching cluster_name.
- name: deployment_name
  type: keyword
  description: Human-readable deployment name.
- name: deployment_group
  type: keyword
  description: User-defined group of the deployment (based on tag:chargeback_group).
- name: composite_key
  type: keyword
  description: Date and deployment ID composite key (YYYY-MM-DD_deployment_id).
- name: monitor_id
  type: keyword
  description: Synthetics monitor identifier.
- name: monitor_name
  type: keyword
  description: Synthetics monitor display name.
- name: monitor_type
  type: keyword
  description: Synthetics monitor type (http, icmp, tcp, dns, browser).
- name: monitor_namespace
  type: keyword
  description: Synthetics monitor data stream namespace.
- name: check_count
  type: long
  description: Daily number of Synthetics check executions observed for this monitor.
- name: up_count
  type: long
  description: Daily number of successful up Synthetics checks.
- name: down_count
  type: long
  description: Daily number of failed down Synthetics checks.
- name: locations_count
  type: long
  description: Number of distinct observer locations executing this Synthetics monitor.
- name: average_duration_ms
  type: double
  description: Average Synthetics check duration in milliseconds.
- name: total_duration_ms
  type: double
  description: Total Synthetics check duration in milliseconds across all checks for this monitor and day.
- name: usage_source
  type: keyword
  description: Usage telemetry source selected for this rollup row (native).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
