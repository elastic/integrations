              double sumEcu = 0.0;
              boolean hasQty = false;
              double maxQty = 0.0;
              boolean hasRam = false;
              long maxRam = 0L;
              long bestTs = -1L;
              String depGroup = '';
              String depName = '';
              for (def recObj : merged.values()) {
                Map rec = (Map)recObj;
                sumEcu += ((Number)rec.get('ecu')).doubleValue();
                if (Boolean.TRUE.equals(rec.get('has_qty'))) {
