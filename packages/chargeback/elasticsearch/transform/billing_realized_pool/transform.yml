description: Aggregates daily allocatable data-tier and Serverless workload capacity (chargeable units) per deployment for realized-cost allocation.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.billing-*
    - -metrics-ess_billing.billing-chargeback*
    - -chargeback_lookup.*
  query:
    bool:
      must:
        - range:
            ess.billing.total_ecu:
              gte: 0
      must_not:
        - terms:
            doc_type:
              - config_snapshot
              - credit_line_item
      should:
        - term:
            ess.billing.sku: onprem_node
        - bool:
            must:
              - term:
                  ess.billing.type: capacity
              - term:
                  ess.billing.kind: elasticsearch
              - bool:
                  should:
                    - wildcard:
                        ess.billing.sku:
                          value: "*.es.datahot.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.es.datawarm.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.es.datacold.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.es.datafrozen.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.es.datacontent.*"
                          case_insensitive: true
                  minimum_should_match: 1
        # Serverless projects (elasticsearch, observability, security, vectordb) bill VCU,
        # solution ingest, and retained storage rather than ECH *.es.data*.* node SKUs.
        # Non-allocatable platform/support/transfer/snapshot SKUs (ML VCU, Synthetics,
        # inference, support, egress, snapshots) are explicitly excluded.
        - bool:
            must:
              - terms:
                  ess.billing.deployment_type:
                    - elasticsearch
                    - observability
                    - security
                    - vectordb
                    - search
                    - serverless
                    - oblt
                    - sec
                    - es
                    - vector
                    - enterprise_search
              - bool:
                  should:
                    - wildcard:
                        ess.billing.sku:
                          value: "*search-vcu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*ingest-vcu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*retained*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*retention*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "observability.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.observability.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "oblt.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.oblt.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "security.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.security.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "sec.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.sec.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "vectordb.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.vectordb.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "serverless.search.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "search.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "serverless.elasticsearch.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "elasticsearch.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*.elasticsearch.*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*ingest.ecu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*ingest_ecu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*ingest.vcu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*search.ecu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*search_ecu*"
                          case_insensitive: true
                    - wildcard:
                        ess.billing.sku:
                          value: "*search.vcu*"
                          case_insensitive: true
                  minimum_should_match: 1
            must_not:
              - wildcard:
                  ess.billing.sku:
                    value: "*ml-vcu*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*synthetic*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*inference*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*llm*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*agent-builder*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*.eis*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*support*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*data-transfer*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*data-out*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*data-in*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*egress*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*ingress*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*snapshot*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*workflow*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*cross-project*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*cps*"
                    case_insensitive: true
        # Also include AI/ML and Synthetics SKUs so AI & Synthetics dashboards can join
        # daily per-deployment AI and Synthetics SKU pools without affecting data-tier totals.
        - bool:
            should:
              - wildcard:
                  ess.billing.sku:
                    value: "*.es.ml.*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*ml-vcu*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*ml.ecu*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*ml_ecu*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*ml.vcu*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*ml_inference*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*inference*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*llm*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*agent-builder*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*.eis*"
                    case_insensitive: true
              - wildcard:
                  ess.billing.sku:
                    value: "*synthetic*"
                    case_insensitive: true
            minimum_should_match: 1
      minimum_should_match: 1
  runtime_mappings:
    cb_sync_ts:
      type: date
      script:
        source: |
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            for (String k : ['ingested', 'created']) {
              def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
              if (rawVal == null && params._source != null) {
                rawVal = params._source.get('event.' + k);
              }
              if (rawVal != null) {
                if (rawVal instanceof Number) {
                  emit(((Number)rawVal).longValue());
                  return;
                }
                String s = rawVal.toString().trim();
                if (s != '') {
                  try {
                    emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                    return;
                  } catch (Exception e) {}
                }
              }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    deployment_group:
      type: keyword
      script:
        source: |
          for (String tf : ['ess.billing.deployment_tags', 'ess.billing.deployment_tags.keyword']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                for (def tv : doc[tf]) {
                  if (tv != null) {
                    String s = tv.toString();
                    if (s.toLowerCase(Locale.ROOT).startsWith('chargeback_group:')) {
                      String gv = s.substring('chargeback_group:'.length()).trim();
                      if (gv != '') { emit(gv); return; }
                    }
                  }
                }
              }
            } catch (Exception e) {}
          }
          try {
            if (params._source?.ess?.billing?.deployment_tags != null) {
              def tags = params._source.ess.billing.deployment_tags;
              if (tags instanceof List) {
                for (def tag : tags) {
                  if (tag != null) {
                    String s = tag.toString();
                    if (s.toLowerCase(Locale.ROOT).startsWith('chargeback_group:')) {
                      String gv = s.substring('chargeback_group:'.length()).trim();
                      if (gv != '') { emit(gv); return; }
                    }
                  }
                }
              } else {
                String s = tags.toString();
                if (s.toLowerCase(Locale.ROOT).startsWith('chargeback_group:')) {
                  String gv = s.substring('chargeback_group:'.length()).trim();
                  if (gv != '') { emit(gv); return; }
                }
              }
            }
          } catch (Exception e) {}
          emit('');
    cb_deployment_id:
      type: keyword
      script:
        source: |
          for (String df : ['ess.billing.deployment_id', 'ess.billing.deployment_id.keyword']) {
            try {
              if (doc.containsKey(df) && !doc[df].empty) {
                String dv = doc[df].value.toString().trim();
                if (dv != '') { emit(dv); return; }
              }
            } catch (Exception e) {}
          }
          try {
            if (params._source?.ess?.billing?.deployment_id != null && params._source.ess.billing.deployment_id.toString().trim() != '') {
              emit(params._source.ess.billing.deployment_id.toString().trim());
              return;
            }
          } catch (Exception e) {}
          String dt = '';
          for (String dtf : ['ess.billing.deployment_type', 'ess.billing.deployment_type.keyword']) {
            try {
              if (doc.containsKey(dtf) && !doc[dtf].empty && doc[dtf].value.toString().trim() != '') {
                dt = doc[dtf].value.toString().trim().toLowerCase(Locale.ROOT);
                break;
              }
            } catch (Exception e) {}
          }
          if (dt == '' && params._source?.ess?.billing?.deployment_type != null) {
            dt = params._source.ess.billing.deployment_type.toString().trim().toLowerCase(Locale.ROOT);
          }
          if (dt == 'oblt') { dt = 'observability'; }
          else if (dt == 'sec') { dt = 'security'; }
          else if (dt == 'vector') { dt = 'vectordb'; }
          else if (dt == 'es') { dt = 'elasticsearch'; }
          else if (dt == 'enterprise_search') { dt = 'search'; }
          if (dt == '' || dt == 'serverless') {
            String sk = '';
            for (String sf : ['ess.billing.sku', 'ess.billing.sku.keyword']) {
              try {
                if (doc.containsKey(sf) && !doc[sf].empty && doc[sf].value.toString().trim() != '') {
                  sk = doc[sf].value.toString().trim().toLowerCase(Locale.ROOT);
                  break;
                }
              } catch (Exception e) {}
            }
            if (sk == '' && params._source?.ess?.billing?.sku != null) {
              sk = params._source.ess.billing.sku.toString().trim().toLowerCase(Locale.ROOT);
            }
            if (sk.startsWith('observability.') || sk.startsWith('oblt.') || sk.startsWith('serverless.observability.') || sk.startsWith('serverless.oblt.') || sk.contains('.observability.') || sk.contains('.oblt.') || sk.contains('synthetic')) { dt = 'observability'; }
            else if (sk.startsWith('security.') || sk.startsWith('sec.') || sk.startsWith('serverless.security.') || sk.startsWith('serverless.sec.') || sk.contains('.security.') || sk.contains('.sec.')) { dt = 'security'; }
            else if (sk.startsWith('vectordb.') || sk.startsWith('serverless.vectordb.') || sk.contains('.vectordb.')) { dt = 'vectordb'; }
            else if (sk.startsWith('search.') || sk.startsWith('serverless.search.')) { dt = 'search'; }
            else if (sk.startsWith('elasticsearch.') || sk.startsWith('es.') || sk.startsWith('serverless.elasticsearch.') || sk.startsWith('serverless.es.') || sk.contains('.elasticsearch.')) { dt = 'elasticsearch'; }
            else { dt = 'serverless'; }
          }
          emit('unassociated_' + dt);
dest:
  index: chargeback_lookup.dest_billing_realized_pool-1
  aliases:
    - alias: chargeback_lookup.billing_realized_pool
      move_on_creation: true
  pipeline: 'logs-chargeback.lookup-{{ ingestPipelineName "realized_pool" }}'
frequency: 60m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    deployment_id:
      terms:
        field: cb_deployment_id
  aggregations:
    by_sku:
      terms:
        field: ess.billing.sku
        size: 1000
      aggs:
        native:
          scripted_metric:
            init_script: "state.items = new HashMap();"
            map_script: |
              boolean isNat = false;
              try {
                if (doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty) {
                  isNat = doc['data_stream.dataset'].value.toString() == 'chargeback.billing';
                } else if (params._source?.data_stream?.dataset != null) {
                  isNat = params._source.data_stream.dataset.toString() == 'chargeback.billing';
                }
              } catch (Exception e) {}
              if (!isNat) { return; }

              long ingTs = 0L;
              try {
                if (doc.containsKey('cb_sync_ts') && !doc['cb_sync_ts'].empty) {
                  ingTs = doc['cb_sync_ts'].value.toInstant().toEpochMilli();
                }
              } catch (Exception e) {}

              String orgId = '';
              try {
                if (doc.containsKey('ess.billing.organization_id') && !doc['ess.billing.organization_id'].empty) {
                  orgId = doc['ess.billing.organization_id'].value.toString();
                } else if (params._source?.ess?.billing?.organization_id != null) {
                  orgId = params._source.ess.billing.organization_id.toString();
                }
              } catch (Exception e) {}

              String depId = '';
              try {
                if (doc.containsKey('ess.billing.deployment_id') && !doc['ess.billing.deployment_id'].empty) {
                  depId = doc['ess.billing.deployment_id'].value.toString();
                } else if (params._source?.ess?.billing?.deployment_id != null) {
                  depId = params._source.ess.billing.deployment_id.toString();
                }
              } catch (Exception e) {}

              String sku = '';
              try {
                if (doc.containsKey('ess.billing.sku') && !doc['ess.billing.sku'].empty) {
                  sku = doc['ess.billing.sku'].value.toString();
                } else if (params._source?.ess?.billing?.sku != null) {
                  sku = params._source.ess.billing.sku.toString();
                }
              } catch (Exception e) {}

              String fromKey = '';
              try {
                if (doc.containsKey('ess.billing.from') && !doc['ess.billing.from'].empty) {
                  fromKey = Long.toString(doc['ess.billing.from'].value.toInstant().toEpochMilli());
                } else if (params._source?.ess?.billing?.from != null) {
                  String fs = params._source.ess.billing.from.toString().trim();
                  try { fromKey = Long.toString(ZonedDateTime.parse(fs).toInstant().toEpochMilli()); }
                  catch (Exception pe) { fromKey = fs; }
                } else if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
                  fromKey = 'ts:' + Long.toString(doc['@timestamp'].value.toInstant().toEpochMilli());
                }
              } catch (Exception e) {}

              String toKey = '';
              try {
                if (doc.containsKey('ess.billing.to') && !doc['ess.billing.to'].empty) {
                  toKey = Long.toString(doc['ess.billing.to'].value.toInstant().toEpochMilli());
                } else if (params._source?.ess?.billing?.to != null) {
                  String tsStr = params._source.ess.billing.to.toString().trim();
                  try { toKey = Long.toString(ZonedDateTime.parse(tsStr).toInstant().toEpochMilli()); }
                  catch (Exception pe) { toKey = tsStr; }
                }
              } catch (Exception e) {}

              String nodeStr = '';
              try {
                for (String nf : ['elasticsearch.node.id', 'elasticsearch.node.id.keyword']) {
                  if (doc.containsKey(nf) && !doc[nf].empty) {
                    nodeStr = doc[nf].value.toString();
                    if (nodeStr != '') { break; }
                  }
                }
                if (nodeStr == '') {
                  def nk = params._source?.elasticsearch?.node?.id;
                  if (nk != null && nk.toString() != '') {
                    nodeStr = nk.toString();
                  }
                }
                if (nodeStr == '') {
                  String dtCheck = '';
                  if (doc.containsKey('ess.billing.deployment_type') && !doc['ess.billing.deployment_type'].empty) {
                    dtCheck = doc['ess.billing.deployment_type'].value.toString();
                  } else if (params._source?.ess?.billing?.deployment_type != null) {
                    dtCheck = params._source.ess.billing.deployment_type.toString();
                  }
                  if ('onprem_node'.equals(sku) || 'onprem'.equals(dtCheck) || 'ece'.equals(dtCheck) || 'eck'.equals(dtCheck)) {
                    for (String hf : ['host.name', 'host.name.keyword']) {
                      if (doc.containsKey(hf) && !doc[hf].empty) {
                        nodeStr = doc[hf].value.toString();
                        if (nodeStr != '') { break; }
                      }
                    }
                    if (nodeStr == '' && params._source?.host?.name != null) {
                      nodeStr = params._source.host.name.toString();
                    }
                  }
                }
              } catch (Exception e) {}

              String bType = '';
              try {
                if (doc.containsKey('ess.billing.type') && !doc['ess.billing.type'].empty) {
                  bType = doc['ess.billing.type'].value.toString();
                } else if (params._source?.ess?.billing?.type != null) {
                  bType = params._source.ess.billing.type.toString();
                }
              } catch (Exception e) {}

              String bKind = '';
              try {
                if (doc.containsKey('ess.billing.kind') && !doc['ess.billing.kind'].empty) {
                  bKind = doc['ess.billing.kind'].value.toString();
                } else if (params._source?.ess?.billing?.kind != null) {
                  bKind = params._source.ess.billing.kind.toString();
                }
              } catch (Exception e) {}

              String dedupKey = orgId + '|' + depId + '|' + fromKey + '|' + toKey + '|' + sku + '|' + bType + '|' + bKind + (nodeStr != '' ? '|' + nodeStr : '');

              double ecu = 0.0;
              try {
                if (doc.containsKey('ess.billing.total_ecu') && !doc['ess.billing.total_ecu'].empty) {
                  ecu = ((Number)doc['ess.billing.total_ecu'].value).doubleValue();
                } else if (params._source?.ess?.billing?.total_ecu instanceof Number) {
                  ecu = ((Number)params._source.ess.billing.total_ecu).doubleValue();
                }
              } catch (Exception e) {}

              boolean hasQty = false;
              double qty = 0.0;
              try {
                if (doc.containsKey('ess.billing.quantity.value') && !doc['ess.billing.quantity.value'].empty) {
                  qty = ((Number)doc['ess.billing.quantity.value'].value).doubleValue();
                  hasQty = true;
                } else if (params._source?.ess?.billing?.quantity?.value instanceof Number) {
                  qty = ((Number)params._source.ess.billing.quantity.value).doubleValue();
                  hasQty = true;
                }
              } catch (Exception e) {}

              boolean hasRam = false;
              long ram = 0L;
              try {
                if (doc.containsKey('ess.billing.ram_per_zone') && !doc['ess.billing.ram_per_zone'].empty) {
                  ram = ((Number)doc['ess.billing.ram_per_zone'].value).longValue();
                  hasRam = true;
                } else if (params._source?.ess?.billing?.ram_per_zone instanceof Number) {
                  ram = ((Number)params._source.ess.billing.ram_per_zone).longValue();
                  hasRam = true;
                }
              } catch (Exception e) {}

              String depGroup = '';
              try {
                if (doc.containsKey('deployment_group') && !doc['deployment_group'].empty) {
                  depGroup = doc['deployment_group'].value.toString();
                }
              } catch (Exception e) {}

              String depName = '';
              try {
                if (doc.containsKey('ess.billing.deployment_name') && !doc['ess.billing.deployment_name'].empty) {
                  depName = doc['ess.billing.deployment_name'].value.toString();
                } else if (params._source?.ess?.billing?.deployment_name != null) {
                  depName = params._source.ess.billing.deployment_name.toString();
                }
              } catch (Exception e) {}

              String depType = '';
              try {
                if (doc.containsKey('ess.billing.deployment_type') && !doc['ess.billing.deployment_type'].empty) {
                  depType = doc['ess.billing.deployment_type'].value.toString();
                } else if (params._source?.ess?.billing?.deployment_type != null) {
                  depType = params._source.ess.billing.deployment_type.toString();
                }
              } catch (Exception e) {}
              boolean isOnprem = ('onprem_node'.equals(sku) || 'onprem'.equals(depType) || 'ece'.equals(depType) || 'eck'.equals(depType));
              String skuLower = sku.toLowerCase(Locale.ROOT);
              boolean isSyn = skuLower.contains('synthetic');
              boolean isSynPing = isSyn && skuLower.contains('ping');
              boolean isSynExec = isSyn && !isSynPing;
              boolean isAi = !isSyn && (skuLower.contains('.es.ml.') || skuLower.contains('ml-vcu') || skuLower.contains('ml.ecu') || skuLower.contains('ml_ecu') || skuLower.contains('ml.vcu') || skuLower.contains('ml_inference') || skuLower.contains('inference') || skuLower.contains('llm') || skuLower.contains('agent-builder') || skuLower.contains('.eis'));
              boolean isDataTier = !isAi && !isSyn;

              Map rec = [
                'ing_ts': ingTs,
                'ecu': ecu,
                'has_qty': isDataTier && hasQty,
                'qty': qty,
                'has_ram': isDataTier && hasRam,
                'ram': ram,
                'dep_group': depGroup,
                'dep_name': depName,
                'is_onprem': isOnprem,
                'is_data_tier': isDataTier,
                'is_ai': isAi,
                'is_syn': isSyn,
                'is_syn_ping': isSynPing,
                'is_syn_exec': isSynExec
              ];
              Map ex = (Map)state.items.get(dedupKey);
              if (ex == null) {
                state.items.put(dedupKey, rec);
              } else {
                long exTs = ((Number)ex.get('ing_ts')).longValue();
