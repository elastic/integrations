description: Aggregates daily allocatable data-tier and Serverless workload capacity (chargeable units) per deployment for realized-cost allocation.
source:
  index:
    - metrics-chargeback.billing-*
    - metrics-ess_billing.billing-*
    - -metrics-ess_billing.billing-chargeback
    - -chargeback_lookup.*
  query:
    bool:
      must:
        - range:
            ess.billing.total_ecu:
              gte: 0
      must_not:
        - terms:
            doc_type:
              - config_snapshot
              - credit_line_item
      should:
        - term:
            ess.billing.sku: onprem_node
        - bool:
            must:
              - term:
                  ess.billing.type: capacity
              - term:
                  ess.billing.kind: elasticsearch
              - bool:
                  should:
                    - wildcard:
                        ess.billing.sku: "*.es.datahot.*"
                    - wildcard:
                        ess.billing.sku: "*.es.datawarm.*"
                    - wildcard:
                        ess.billing.sku: "*.es.datacold.*"
                    - wildcard:
                        ess.billing.sku: "*.es.datafrozen.*"
                    - wildcard:
                        ess.billing.sku: "*.es.datacontent.*"
                  minimum_should_match: 1
        # Serverless projects (elasticsearch, observability, security, vectordb) bill VCU,
        # solution ingest, and retained storage rather than ECH *.es.data*.* node SKUs.
        # Non-allocatable platform/support/transfer/snapshot SKUs (ML VCU, Synthetics,
        # inference, support, egress, snapshots) are explicitly excluded.
        - bool:
            must:
              - terms:
                  ess.billing.deployment_type:
                    - elasticsearch
                    - observability
                    - security
                    - vectordb
              - bool:
                  should:
                    - wildcard:
                        ess.billing.sku: "*search-vcu*"
                    - wildcard:
                        ess.billing.sku: "*ingest-vcu*"
                    - wildcard:
                        ess.billing.sku: "*retained*"
                    - wildcard:
                        ess.billing.sku: "*retention*"
                    - wildcard:
                        ess.billing.sku: "observability.*"
                    - wildcard:
                        ess.billing.sku: "*.observability.*"
                    - wildcard:
                        ess.billing.sku: "security.*"
                    - wildcard:
                        ess.billing.sku: "*.security.*"
                    - wildcard:
                        ess.billing.sku: "vectordb.*"
                    - wildcard:
                        ess.billing.sku: "*.vectordb.*"
                  minimum_should_match: 1
            must_not:
              - wildcard:
                  ess.billing.sku: "*ml-vcu*"
              - wildcard:
                  ess.billing.sku: "*synthetic*"
              - wildcard:
                  ess.billing.sku: "*inference*"
              - wildcard:
                  ess.billing.sku: "*llm*"
              - wildcard:
                  ess.billing.sku: "*agent-builder*"
              - wildcard:
                  ess.billing.sku: "*.eis*"
              - wildcard:
                  ess.billing.sku: "*support*"
              - wildcard:
                  ess.billing.sku: "*data-transfer*"
              - wildcard:
                  ess.billing.sku: "*data-out*"
              - wildcard:
                  ess.billing.sku: "*data-in*"
              - wildcard:
                  ess.billing.sku: "*egress*"
              - wildcard:
                  ess.billing.sku: "*ingress*"
              - wildcard:
                  ess.billing.sku: "*snapshot*"
              - wildcard:
                  ess.billing.sku: "*workflow*"
              - wildcard:
                  ess.billing.sku: "*cross-project*"
      minimum_should_match: 1
  runtime_mappings:
    event.ingested:
      type: date
      script:
        source: |
          for (String k : ['ingested', 'created']) {
            if (k == 'created') {
              try {
                if (doc.containsKey('event.created') && !doc['event.created'].empty) {
                  emit(doc['event.created'].value.toInstant().toEpochMilli());
                  return;
                }
              } catch (Exception e) {}
            }
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
            if (rawVal == null && params._source != null) {
              rawVal = params._source.get('event.' + k);
            }
            if (rawVal != null) {
              if (rawVal instanceof Number) {
                emit(((Number)rawVal).longValue());
                return;
              }
              String s = rawVal.toString().trim();
              if (s != '') {
                try {
                  emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                  return;
                } catch (Exception e) {}
              }
            }
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    deployment_group:
      type: keyword
      script:
        source: |
          if (params._source?.ess?.billing?.deployment_tags != null) {
            def tags = params._source.ess.billing.deployment_tags;
            if (tags instanceof List) {
              for (tag in tags) {
                if (tag.startsWith('chargeback_group:')) {
                  emit(tag.substring('chargeback_group:'.length()));
                  return;
                }
              }
            } else if (tags instanceof String) {
              if (tags.startsWith('chargeback_group:')) {
                emit(tags.substring('chargeback_group:'.length()));
                return;
              }
            }
          }
          emit('');
dest:
  index: chargeback_lookup.dest_billing_realized_pool-1
  aliases:
    - alias: chargeback_lookup.billing_realized_pool
      move_on_creation: true
  pipeline: logs-chargeback.lookup-0.6.0-realized_pool
frequency: 60m
sync:
  time:
    field: event.ingested
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    deployment_id:
      terms:
        field: ess.billing.deployment_id
  aggregations:
    by_sku:
      terms:
        field: ess.billing.sku
        size: 1000
      aggs:
        native:
          scripted_metric:
            init_script: "state.items = new HashMap();"
            map_script: |
              boolean isNat = false;
              try {
                if (doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty) {
                  isNat = doc['data_stream.dataset'].value.toString() == 'chargeback.billing';
                } else if (params._source?.data_stream?.dataset != null) {
                  isNat = params._source.data_stream.dataset.toString() == 'chargeback.billing';
                }
              } catch (Exception e) {}
              if (!isNat) { return; }

              long ingTs = 0L;
              try {
                if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
                  ingTs = doc['event.ingested'].value.toInstant().toEpochMilli();
                }
              } catch (Exception e) {}

