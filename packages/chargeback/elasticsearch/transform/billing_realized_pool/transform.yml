              try {
                if (doc.containsKey('ess.billing.organization_id') && !doc['ess.billing.organization_id'].empty) {
                  orgId = doc['ess.billing.organization_id'].value.toString();
                } else if (params._source?.ess?.billing?.organization_id != null) {
                  orgId = params._source.ess.billing.organization_id.toString();
                }
              } catch (Exception e) {}

              String depId = '';
              try {
                if (doc.containsKey('ess.billing.deployment_id') && !doc['ess.billing.deployment_id'].empty) {
                  depId = doc['ess.billing.deployment_id'].value.toString();
                } else if (params._source?.ess?.billing?.deployment_id != null) {
                  depId = params._source.ess.billing.deployment_id.toString();
                }
              } catch (Exception e) {}

              String sku = '';
              try {
                if (doc.containsKey('ess.billing.sku') && !doc['ess.billing.sku'].empty) {
                  sku = doc['ess.billing.sku'].value.toString();
                } else if (params._source?.ess?.billing?.sku != null) {
                  sku = params._source.ess.billing.sku.toString();
                }
              } catch (Exception e) {}

              String fromKey = '';
              try {
                if (doc.containsKey('ess.billing.from') && !doc['ess.billing.from'].empty) {
                  fromKey = Long.toString(doc['ess.billing.from'].value.toInstant().toEpochMilli());
                } else if (params._source?.ess?.billing?.from != null) {
                  String fs = params._source.ess.billing.from.toString().trim();
                  try { fromKey = Long.toString(ZonedDateTime.parse(fs).toInstant().toEpochMilli()); }
                  catch (Exception pe) { fromKey = fs; }
                } else if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
                  fromKey = 'ts:' + Long.toString(doc['@timestamp'].value.toInstant().toEpochMilli());
                }
              } catch (Exception e) {}

              String toKey = '';
