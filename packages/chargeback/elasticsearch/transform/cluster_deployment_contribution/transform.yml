description: Aggregates daily total indexing, query, and storage usage per deployment across native Chargeback and legacy monitoring-indices sources.
source:
  index:
    - metrics-chargeback.usage-*
    - monitoring-indices*
    - "*:monitoring-indices*"
    - -monitoring-indices-chargeback
    - "-*:monitoring-indices-chargeback"
    - -chargeback_lookup.*
    - "-*:chargeback_lookup.*"
  query:
    bool:
      filter:
        - range:
            "@timestamp":
              gte: now-366d
      must_not:
        - term:
            doc_type: config_snapshot
  runtime_mappings:
    cb_cluster_name:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.cluster.name.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          if (doc.containsKey('elasticsearch.cluster.name') && !doc['elasticsearch.cluster.name'].empty) {
            emit(doc['elasticsearch.cluster.name'].value.toString());
          }
dest:
  index: cluster_deployment_contribution_lookup
  pipeline: logs-chargeback.lookup-0.6.0-usage
frequency: 60m
sync:
  time:
    field: event.ingested
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: cb_cluster_name
  aggregations:
    native:
      filter:
        term:
          data_stream.dataset: chargeback.usage
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        deployment_sum_indexing_time:
          sum:
            field: elasticsearch.index.total.indexing.index_time_in_millis
        deployment_sum_query_time:
          sum:
            field: elasticsearch.index.total.search.query_time_in_millis
        deployment_sum_store_size:
          sum:
            field: elasticsearch.index.total.store.size_in_bytes
        deployment_sum_data_set_store_size:
          sum:
            field: elasticsearch.index.primaries.store.total_data_set_size_in_bytes
    legacy:
      filter:
        bool:
          must_not:
            - term:
                data_stream.dataset: chargeback.usage
      aggs:
        doc_cnt:
          value_count:
            field: "@timestamp"
        deployment_sum_indexing_time:
          sum:
            field: elasticsearch.index.total.indexing.index_time_in_millis
        deployment_sum_query_time:
          sum:
            field: elasticsearch.index.total.search.query_time_in_millis
        deployment_sum_store_size:
          sum:
            field: elasticsearch.index.total.store.size_in_bytes
        deployment_sum_data_set_store_size:
          sum:
            field: elasticsearch.index.primaries.store.total_data_set_size_in_bytes
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.6.0
