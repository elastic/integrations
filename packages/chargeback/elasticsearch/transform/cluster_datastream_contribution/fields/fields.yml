- name: "@timestamp"
  type: date
  description: Daily timestamp representing when the metric was recorded.
- name: cluster_name
  type: keyword
  description: Name of the Elasticsearch cluster.
- name: datastream
  type: keyword
  description: The name of the data stream.
- name: ds_type
  type: keyword
  description: First segment of the data stream name (for example logs, metrics, traces). Set to other when the name does not contain a hyphen.
- name: ds_namespace
  type: keyword
  description: Last segment of the data stream name (team, environment, or cost-center label). Set to other when the name does not contain a hyphen.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
- name: datastream_sum_indexing_time
  type: long
  description: Total indexing time in milliseconds for the data stream.
- name: datastream_sum_query_time
  type: long
  description: Total query time in milliseconds for the data stream.
- name: datastream_sum_store_size
  type: long
  description: Total primary shard store size in bytes for the data stream.
- name: datastream_sum_data_set_store_size
  type: long
  description: Total dataset size in bytes for the data stream.
- name: composite_key
  type: keyword
  description: Composite key used for billing attribution (set by ingest pipeline) consisting of date and deployment ID.
- name: usage_source
  type: keyword
  description: Usage telemetry source selected for this rollup row (native or legacy).
- name: has_native_usage
  type: boolean
  description: Whether native Chargeback usage samples contributed to this bucket.
- name: has_legacy_usage
  type: boolean
  description: Whether legacy monitoring-indices samples contributed to this bucket.
- name: native_sum_indexing_time
  type: long
  description: Native Chargeback indexing time in milliseconds for the data stream.
- name: native_sum_query_time
  type: long
  description: Native Chargeback query time in milliseconds for the data stream.
- name: native_sum_store_size
  type: long
  description: Native Chargeback total shard store size in bytes for the data stream.
- name: native_sum_data_set_store_size
  type: long
  description: Native Chargeback primary dataset size in bytes for the data stream.
- name: legacy_sum_indexing_time
  type: long
  description: Legacy monitoring-indices indexing time in milliseconds for the data stream.
- name: legacy_sum_query_time
  type: long
  description: Legacy monitoring-indices query time in milliseconds for the data stream.
- name: legacy_sum_store_size
  type: long
  description: Legacy monitoring-indices total shard store size in bytes for the data stream.
- name: legacy_sum_data_set_store_size
  type: long
  description: Legacy monitoring-indices primary dataset size in bytes for the data stream.
