description: Aggregates daily total indexing, query, and storage usage per data stream across native Chargeback and legacy monitoring-indices sources.
source:
  index:
    - metrics-chargeback.usage-*
    - monitoring-indices*
    - "*:monitoring-indices*"
    - -monitoring-indices-chargeback
    - "*:-monitoring-indices-chargeback"
    - -chargeback_lookup.*
    - "*:-chargeback_lookup.*"
  query:
    bool:
      must_not:
        - term:
            doc_type: config_snapshot
        - term:
            cb_excluded_index: true
  runtime_mappings:
    cb_cluster_name:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.cluster.name.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          try {
            if (doc.containsKey('elasticsearch.cluster.name') && !doc['elasticsearch.cluster.name'].empty) {
              emit(doc['elasticsearch.cluster.name'].value.toString());
              return;
            }
          } catch (Exception e) {}
          try {
            def cname = params._source?.elasticsearch?.cluster?.name;
            if (cname != null && cname.toString() != '') {
              emit(cname.toString());
            }
          } catch (Exception e) {}
    cb_index_name:
      type: keyword
      script:
        source: |
          String kw = 'elasticsearch.index.name.keyword';
          if (doc.containsKey(kw)) {
            if (!doc[kw].empty) { emit(doc[kw].value.toString()); }
            return;
          }
          try {
            if (doc.containsKey('elasticsearch.index.name') && !doc['elasticsearch.index.name'].empty) {
              emit(doc['elasticsearch.index.name'].value.toString());
              return;
            }
          } catch (Exception e) {}
          try {
            def iname = params._source?.elasticsearch?.index?.name;
            if (iname != null && iname.toString() != '') {
              emit(iname.toString());
            }
          } catch (Exception e) {}
    cb_excluded_index:
      type: boolean
      script:
        source: |
          String name = '';
          String kw = 'elasticsearch.index.name.keyword';
          if (doc.containsKey(kw) && !doc[kw].empty) {
            name = doc[kw].value.toString();
          } else {
            try {
              if (doc.containsKey('elasticsearch.index.name') && !doc['elasticsearch.index.name'].empty) {
                name = doc['elasticsearch.index.name'].value.toString();
              }
            } catch (Exception e) {}
            if (name == '') {
              try {
                def iname = params._source?.elasticsearch?.index?.name;
                if (iname != null) { name = iname.toString(); }
              } catch (Exception e) {}
            }
          }
          if (name != '') {
            boolean isCbLookup = (
              name.startsWith('chargeback_lookup.') ||
              name == 'monitoring-indices' ||
              name == 'monitoring-indices-chargeback' ||
              /^(?:billing_cluster_cost_lookup|billing_realized_pool_lookup|chargeback_conf_lookup|cluster_capacity_utilization_lookup|cluster_deployment_contribution_lookup|cluster_tier_contribution_lookup|cluster_datastream_contribution_lookup|cluster_tier_and_datastream_contribution_lookup)(?:-\d+)?$/.matcher(name).matches()
            );
            if ((name.startsWith('.') && !name.startsWith('.ds-'))
                || name.startsWith('.ds-.')
                || name.startsWith('.ds-ilm-history')
                || isCbLookup
                || name.contains('metrics-chargeback.')
                || name.contains('logs-chargeback.')) {
              emit(true);
              return;
            }
            emit(false);
            return;
          }
          String ds = '';
          for (String df : ['elasticsearch.index.datastream.keyword', 'elasticsearch.index.datastream']) {
            try {
              if (doc.containsKey(df) && !doc[df].empty) {
                ds = doc[df].value.toString();
                if (ds != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (ds != '' && (ds.startsWith('.') || ds.startsWith('ilm-history') || ds.startsWith('metrics-chargeback.') || ds.startsWith('logs-chargeback.') || ds.startsWith('chargeback_lookup.'))) {
            emit(true);
            return;
          }
          emit(false);
    cb_sync_ts:
      type: date
      script:
        source: |
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          for (String k : ['ingested', 'created']) {
            if (k == 'created') {
              try {
                if (doc.containsKey('event.created') && !doc['event.created'].empty) {
                  emit(doc['event.created'].value.toInstant().toEpochMilli());
                  return;
                }
              } catch (Exception e) {}
            }
            def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
            if (rawVal == null && params._source != null) {
              rawVal = params._source.get('event.' + k);
            }
            if (rawVal != null) {
              if (rawVal instanceof Number) {
                emit(((Number)rawVal).longValue());
                return;
              }
              String s = rawVal.toString().trim();
              if (s != '') {
                try {
                  emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                  return;
                } catch (Exception e) {}
              }
            }
          }
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_resolved_tier:
      type: keyword
      script:
        source: |
          for (String f : ['elasticsearch.index.tier.keyword', 'elasticsearch.index.tier']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String t = doc[f].value.toString();
                if (t != '' && t != 'unknown') { emit(t); return; }
              }
            } catch (Exception e) {}
          }
          try {
            def st = params._source?.elasticsearch?.index?.tier;
            if (st != null && st.toString() != '' && st.toString() != 'unknown') {
              emit(st.toString());
              return;
            }
          } catch (Exception e) {}
          String pref = null;
          for (String pf : ['elasticsearch.index.tier_preference.keyword', 'elasticsearch.index.tier_preference']) {
            try {
              if (doc.containsKey(pf) && !doc[pf].empty) {
                pref = doc[pf].value.toString();
                if (pref != '') { break; }
              }
            } catch (Exception e) {}
          }
          if (pref == null || pref == '') {
            try {
              def sp = params._source?.elasticsearch?.index?.tier_preference;
              if (sp != null) { pref = sp.toString(); }
            } catch (Exception e) {}
          }
          if (pref == null || pref == '') { emit('unknown'); return; }
          for (String part : pref.splitOnToken(',')) {
            String tp = part.trim();
            if (tp == 'data_frozen') { emit('frozen'); return; }
            if (tp == 'data_cold') { emit('cold'); return; }
            if (tp == 'data_warm') { emit('warm'); return; }
            if (tp == 'data_hot' || tp == 'data_content') { emit('hot/content'); return; }
          }
          emit('unknown');
    cb_resolved_datastream:
      type: keyword
      script:
        source: |
          String name = '';
          String kw = 'elasticsearch.index.name.keyword';
          if (doc.containsKey(kw) && !doc[kw].empty) {
            name = doc[kw].value.toString();
          } else {
            try {
              if (doc.containsKey('elasticsearch.index.name') && !doc['elasticsearch.index.name'].empty) {
                name = doc['elasticsearch.index.name'].value.toString();
              }
            } catch (Exception e) {}
            if (name == '') {
              try {
                def iname = params._source?.elasticsearch?.index?.name;
                if (iname != null) { name = iname.toString(); }
              } catch (Exception e) {}
            }
          }
          if (name != '') {
            String stripped = name;
            if (stripped.startsWith('partial-')) { stripped = stripped.substring(8); }
            if (stripped.startsWith('restored-')) { stripped = stripped.substring(9); }
            def sm = /^shrink-.{4}-(.*)$/.matcher(stripped);
            if (sm.matches()) { stripped = sm.group(1); }
            if (stripped.startsWith('.ds-')) {
              def dm = /^\.ds-([a-zA-Z_0-9\-.]+?)(?:-\d{4}\.\d{2}(?:\.\d{2})?)?(?:-\d{6,})?$/.matcher(stripped);
              if (dm.matches() && !dm.group(1).startsWith('.')) {
                emit(dm.group(1));
                return;
              }
            } else {
              def rm = /^([a-zA-Z_0-9\-.]+?)(?:-\d{4}\.\d{2}(?:\.\d{2})?(?:-\d{6,})?|-\d{6,})$/.matcher(stripped);
              if (rm.matches() && !rm.group(1).startsWith('.')) {
                emit(rm.group(1));
                return;
              }
            }
            emit((name.startsWith('.') || stripped.startsWith('.')) ? 'system' : stripped);
            return;
          }
          for (String f : ['elasticsearch.index.datastream.keyword', 'elasticsearch.index.datastream']) {
            try {
              if (doc.containsKey(f) && !doc[f].empty) {
                String ds = doc[f].value.toString();
                if (ds != '' && ds != 'unknown') { emit(ds); return; }
              }
            } catch (Exception e) {}
          }
          emit('unknown');
dest:
  index: chargeback_lookup.dest_cluster_datastream_contribution-1
  aliases:
    - alias: chargeback_lookup.cluster_datastream_contribution
      move_on_creation: true
  pipeline: logs-chargeback.lookup-0.6.0-usage
frequency: 60m
sync:
  time:
    field: cb_sync_ts
    delay: 60s
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    cluster_name:
      terms:
        field: cb_cluster_name
    datastream:
      terms:
        field: cb_resolved_datastream
  aggregations:
    rollup:
      scripted_metric:
        init_script: |
          state.units = new HashMap();
          state.raw_nat = [0L, 0L, 0L, 0L];
          state.raw_leg = [0L, 0L, 0L, 0L];
          state.raw_nat_by_tier = new HashMap();
          state.nat_cnt_by_tier = new HashMap();
          state.raw_leg_by_tier = new HashMap();
          state.leg_cnt_by_tier = new HashMap();
          state.nat_cnt = 0L;
          state.leg_cnt = 0L;
        map_script: |
          if (!doc.containsKey('@timestamp') || doc['@timestamp'].empty) { return; }
          long ts = doc['@timestamp'].value.toInstant().toEpochMilli();
          long rem = ts % 86400000L;
          if (rem < 0L) { rem += 86400000L; }
          long dayStartMs = ts - rem;
          int b = (int)(rem / 600000L);
          if (b < 0) { b = 0; }
          if (b > 143) { b = 143; }
          int w = b >> 6;
          long bit = 1L << (b & 63);
          String idx = (doc.containsKey('cb_index_name') && !doc['cb_index_name'].empty)
            ? doc['cb_index_name'].value.toString()
            : '_default_';
          String tier = (doc.containsKey('cb_resolved_tier') && !doc['cb_resolved_tier'].empty)
            ? doc['cb_resolved_tier'].value.toString()
            : 'unknown';
          String ds = (doc.containsKey('cb_resolved_datastream') && !doc['cb_resolved_datastream'].empty)
            ? doc['cb_resolved_datastream'].value.toString()
            : 'unknown';
          if (idx == '_default_' && ds != 'unknown') { idx = 'ds:' + ds; }
          String ukey = idx;
          boolean isNat = false;
          try {
            if (doc.containsKey('data_stream.dataset') && !doc['data_stream.dataset'].empty) {
              isNat = doc['data_stream.dataset'].value.toString() == 'chargeback.usage';
            } else if (params._source?.data_stream?.dataset != null) {
              isNat = params._source.data_stream.dataset.toString() == 'chargeback.usage';
            }
          } catch (Exception e) {
            try {
              if (params._source?.data_stream?.dataset != null) {
                isNat = params._source.data_stream.dataset.toString() == 'chargeback.usage';
              }
            } catch (Exception e2) {}
          }
          String idxField = isNat ? 'elasticsearch.index.total.indexing.index_time_in_millis' : 'elasticsearch.index.total.indexing.index_time_in_millis_delta';
          String qryField = isNat ? 'elasticsearch.index.total.search.query_time_in_millis' : 'elasticsearch.index.total.search.query_time_in_millis_delta';
          long idxMs = 0L;
          long qryMs = 0L;
          long storeB = 0L;
          long dsetB = 0L;
          try {
            if (doc.containsKey(idxField) && !doc[idxField].empty) { idxMs = ((Number)doc[idxField].value).longValue(); }
            else if (params._source?.elasticsearch?.index?.total?.indexing != null) {
              def v = isNat ? params._source.elasticsearch.index.total.indexing.index_time_in_millis : params._source.elasticsearch.index.total.indexing.index_time_in_millis_delta;
              if (v instanceof Number) { idxMs = ((Number)v).longValue(); }
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey(qryField) && !doc[qryField].empty) { qryMs = ((Number)doc[qryField].value).longValue(); }
            else if (params._source?.elasticsearch?.index?.total?.search != null) {
              def v = isNat ? params._source.elasticsearch.index.total.search.query_time_in_millis : params._source.elasticsearch.index.total.search.query_time_in_millis_delta;
              if (v instanceof Number) { qryMs = ((Number)v).longValue(); }
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('elasticsearch.index.total.store.size_in_bytes') && !doc['elasticsearch.index.total.store.size_in_bytes'].empty) {
              storeB = ((Number)doc['elasticsearch.index.total.store.size_in_bytes'].value).longValue();
            } else if (params._source?.elasticsearch?.index?.total?.store?.size_in_bytes instanceof Number) {
              storeB = ((Number)params._source.elasticsearch.index.total.store.size_in_bytes).longValue();
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('elasticsearch.index.primaries.store.total_data_set_size_in_bytes') && !doc['elasticsearch.index.primaries.store.total_data_set_size_in_bytes'].empty) {
              dsetB = ((Number)doc['elasticsearch.index.primaries.store.total_data_set_size_in_bytes'].value).longValue();
            } else if (params._source?.elasticsearch?.index?.primaries?.store?.total_data_set_size_in_bytes instanceof Number) {
              dsetB = ((Number)params._source.elasticsearch.index.primaries.store.total_data_set_size_in_bytes).longValue();
            }
          } catch (Exception e) {}

          Map u = (Map)state.units.get(ukey);
          if (u == null) {
            u = new HashMap();
            u.put('lm', [0L, 0L, 0L]);
            u.put('lt', [0L, 0L, 0L, 0L, 0L]);
            u.put('ltier', 'unknown');
            u.put('ns', new ArrayList());
            u.put('bs', null);
            state.units.put(ukey, u);
          }

          if (isNat) {
            state.nat_cnt = ((Number)state.nat_cnt).longValue() + 1L;
            long tcPrev = state.nat_cnt_by_tier.containsKey(tier) ? ((Number)state.nat_cnt_by_tier.get(tier)).longValue() : 0L;
            state.nat_cnt_by_tier.put(tier, tcPrev + 1L);

            boolean hasDelta = false;
            for (String df : [
              'elasticsearch.index.primaries.docs.count_delta',
              'elasticsearch.index.total.indexing.index_time_in_millis_delta',
              'elasticsearch.index.interval.duration_ms'
            ]) {
              try {
                if (doc.containsKey(df) && !doc[df].empty) { hasDelta = true; break; }
              } catch (Exception e) {}
            }
            if (!hasDelta) {
              try {
                def ix = params._source?.elasticsearch?.index;
                if (ix?.primaries?.docs?.count_delta != null
                    || ix?.total?.indexing?.index_time_in_millis_delta != null
                    || ix?.interval?.duration_ms != null) {
                  hasDelta = true;
                }
              } catch (Exception e) {}
            }

            if (hasDelta) {
              long intStartMs = -1L;
              long intEndMs = -1L;
              long durMs = -1L;
              try {
                if (doc.containsKey('elasticsearch.index.interval.start') && !doc['elasticsearch.index.interval.start'].empty) {
                  intStartMs = doc['elasticsearch.index.interval.start'].value.toInstant().toEpochMilli();
                }
              } catch (Exception e) {}
              if (intStartMs < 0L) {
                try {
                  def rs = params._source?.elasticsearch?.index?.interval?.start;
                  if (rs instanceof Number) { intStartMs = ((Number)rs).longValue(); }
                  else if (rs != null) { intStartMs = ZonedDateTime.parse(rs.toString()).toInstant().toEpochMilli(); }
                } catch (Exception e) {}
              }
              try {
                if (doc.containsKey('elasticsearch.index.interval.end') && !doc['elasticsearch.index.interval.end'].empty) {
                  intEndMs = doc['elasticsearch.index.interval.end'].value.toInstant().toEpochMilli();
                }
              } catch (Exception e) {}
              if (intEndMs < 0L) {
                try {
                  def re = params._source?.elasticsearch?.index?.interval?.end;
                  if (re instanceof Number) { intEndMs = ((Number)re).longValue(); }
                  else if (re != null) { intEndMs = ZonedDateTime.parse(re.toString()).toInstant().toEpochMilli(); }
                } catch (Exception e) {}
              }
              try {
                if (doc.containsKey('elasticsearch.index.interval.duration_ms') && !doc['elasticsearch.index.interval.duration_ms'].empty) {
                  durMs = ((Number)doc['elasticsearch.index.interval.duration_ms'].value).longValue();
                } else if (params._source?.elasticsearch?.index?.interval?.duration_ms instanceof Number) {
                  durMs = ((Number)params._source.elasticsearch.index.interval.duration_ms).longValue();
                }
              } catch (Exception e) {}

              long sOff = -1L;
              long eOff = -1L;
              if (intStartMs >= 0L && intEndMs > intStartMs) {
                long dayEndMs = dayStartMs + 86400000L;
                long cStart = intStartMs < dayEndMs ? intStartMs : dayEndMs;
                if (cStart < dayStartMs) { cStart = dayStartMs; }
                long cEnd = intEndMs < dayEndMs ? intEndMs : dayEndMs;
                if (cEnd < cStart) { cEnd = cStart; }
                sOff = cStart - dayStartMs;
                eOff = cEnd - dayStartMs;
              }
              if (eOff <= sOff) {
                long effDur = durMs > 0L ? (durMs < 86400000L ? durMs : 86400000L) : 600000L;
                eOff = (b + 1L) * 600000L;
                sOff = (eOff - effDur) > 0L ? (eOff - effDur) : 0L;
              }
              long spanMs = (eOff - sOff) > 1L ? (eOff - sOff) : 1L;
              long rawWStore = Math.round((double)storeB * ((double)spanMs / 600000.0));
              long rawWDset = Math.round((double)dsetB * ((double)spanMs / 600000.0));

              List rn = (List)state.raw_nat;
              rn.set(0, ((Number)rn.get(0)).longValue() + idxMs);
              rn.set(1, ((Number)rn.get(1)).longValue() + qryMs);
              rn.set(2, ((Number)rn.get(2)).longValue() + rawWStore);
              rn.set(3, ((Number)rn.get(3)).longValue() + rawWDset);

              List rnt = (List)state.raw_nat_by_tier.get(tier);
              if (rnt == null) {
                state.raw_nat_by_tier.put(tier, [idxMs, qryMs, rawWStore, rawWDset]);
              } else {
                rnt.set(0, ((Number)rnt.get(0)).longValue() + idxMs);
                rnt.set(1, ((Number)rnt.get(1)).longValue() + qryMs);
                rnt.set(2, ((Number)rnt.get(2)).longValue() + rawWStore);
                rnt.set(3, ((Number)rnt.get(3)).longValue() + rawWDset);
              }
              ((List)u.get('ns')).add([sOff, eOff, idxMs, qryMs, storeB, dsetB, tier]);
            } else {
              u.put('bs', [storeB, dsetB, tier]);
            }
          } else {
            state.leg_cnt = ((Number)state.leg_cnt).longValue() + 1L;
            long ltcPrev = state.leg_cnt_by_tier.containsKey(tier) ? ((Number)state.leg_cnt_by_tier.get(tier)).longValue() : 0L;
            state.leg_cnt_by_tier.put(tier, ltcPrev + 1L);
            List rl = (List)state.raw_leg;
            rl.set(0, ((Number)rl.get(0)).longValue() + idxMs);
            rl.set(1, ((Number)rl.get(1)).longValue() + qryMs);
            rl.set(2, ((Number)rl.get(2)).longValue() + storeB);
            rl.set(3, ((Number)rl.get(3)).longValue() + dsetB);
            List rlt = (List)state.raw_leg_by_tier.get(tier);
            if (rlt == null) {
              state.raw_leg_by_tier.put(tier, [idxMs, qryMs, storeB, dsetB]);
            } else {
              rlt.set(0, ((Number)rlt.get(0)).longValue() + idxMs);
              rlt.set(1, ((Number)rlt.get(1)).longValue() + qryMs);
              rlt.set(2, ((Number)rlt.get(2)).longValue() + storeB);
              rlt.set(3, ((Number)rlt.get(3)).longValue() + dsetB);
            }
            List lm = (List)u.get('lm');
            lm.set(w, ((Number)lm.get(w)).longValue() | bit);
            List lt = (List)u.get('lt');
            lt.set(0, ((Number)lt.get(0)).longValue() + idxMs);
            lt.set(1, ((Number)lt.get(1)).longValue() + qryMs);
            lt.set(2, ((Number)lt.get(2)).longValue() + storeB);
            lt.set(3, ((Number)lt.get(3)).longValue() + dsetB);
            lt.set(4, ((Number)lt.get(4)).longValue() + 1L);
            u.put('ltier', tier);
          }
        combine_script: "return state;"
        reduce_script: |
          Map merged = new HashMap();
          List rawNat = [0L, 0L, 0L, 0L];
          List rawLeg = [0L, 0L, 0L, 0L];
          Map rawNatByTier = new HashMap();
          Map natCntByTier = new HashMap();
          Map rawLegByTier = new HashMap();
          Map legCntByTier = new HashMap();
          long natCnt = 0L;
          long legCnt = 0L;
          for (def st : states) {
            if (st == null) { continue; }
            if (st.nat_cnt instanceof Number) { natCnt += ((Number)st.nat_cnt).longValue(); }
            if (st.leg_cnt instanceof Number) { legCnt += ((Number)st.leg_cnt).longValue(); }
            if (st.raw_nat instanceof List) {
              for (int i = 0; i < 4; i++) { rawNat.set(i, ((Number)rawNat.get(i)).longValue() + ((Number)((List)st.raw_nat).get(i)).longValue()); }
            }
            if (st.raw_leg instanceof List) {
              for (int i = 0; i < 4; i++) { rawLeg.set(i, ((Number)rawLeg.get(i)).longValue() + ((Number)((List)st.raw_leg).get(i)).longValue()); }
            }
            if (st.nat_cnt_by_tier instanceof Map) {
              for (def te : ((Map)st.nat_cnt_by_tier).entrySet()) {
                String tk = te.getKey().toString();
                long tv = ((Number)te.getValue()).longValue();
                long prev = natCntByTier.containsKey(tk) ? ((Number)natCntByTier.get(tk)).longValue() : 0L;
                natCntByTier.put(tk, prev + tv);
              }
            }
            if (st.raw_nat_by_tier instanceof Map) {
              for (def te : ((Map)st.raw_nat_by_tier).entrySet()) {
                String tk = te.getKey().toString();
                List sv = (List)te.getValue();
                List dv = (List)rawNatByTier.get(tk);
                if (dv == null) {
                  rawNatByTier.put(tk, [((Number)sv.get(0)).longValue(), ((Number)sv.get(1)).longValue(), ((Number)sv.get(2)).longValue(), ((Number)sv.get(3)).longValue()]);
                } else {
                  for (int i = 0; i < 4; i++) { dv.set(i, ((Number)dv.get(i)).longValue() + ((Number)sv.get(i)).longValue()); }
                }
              }
            }
            if (st.leg_cnt_by_tier instanceof Map) {
              for (def te : ((Map)st.leg_cnt_by_tier).entrySet()) {
                String tk = te.getKey().toString();
                long tv = ((Number)te.getValue()).longValue();
                long prev = legCntByTier.containsKey(tk) ? ((Number)legCntByTier.get(tk)).longValue() : 0L;
                legCntByTier.put(tk, prev + tv);
              }
            }
            if (st.raw_leg_by_tier instanceof Map) {
              for (def te : ((Map)st.raw_leg_by_tier).entrySet()) {
                String tk = te.getKey().toString();
                List sv = (List)te.getValue();
