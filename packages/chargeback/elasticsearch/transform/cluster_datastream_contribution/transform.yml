            } else if (params._source?.data_stream?.dataset != null) {
              isNat = params._source.data_stream.dataset.toString() == 'chargeback.usage';
            }
          } catch (Exception e) {
            try {
              if (params._source?.data_stream?.dataset != null) {
                isNat = params._source.data_stream.dataset.toString() == 'chargeback.usage';
              }
            } catch (Exception e2) {}
          }
          String idxDeltaF = 'elasticsearch.index.total.indexing.index_time_in_millis_delta';
          String idxRawF = 'elasticsearch.index.total.indexing.index_time_in_millis';
          String qryDeltaF = 'elasticsearch.index.total.search.query_time_in_millis_delta';
          String qryRawF = 'elasticsearch.index.total.search.query_time_in_millis';
          long idxMs = 0L;
          long qryMs = 0L;
          long storeB = 0L;
          long dsetB = 0L;
          try {
            if (doc.containsKey(idxDeltaF) && !doc[idxDeltaF].empty) {
              idxMs = ((Number)doc[idxDeltaF].value).longValue();
            } else if (isNat && doc.containsKey(idxRawF) && !doc[idxRawF].empty) {
              idxMs = ((Number)doc[idxRawF].value).longValue();
            } else if (params._source?.elasticsearch?.index?.total?.indexing != null) {
              def ix = params._source.elasticsearch.index.total.indexing;
              def v = ix.index_time_in_millis_delta != null ? ix.index_time_in_millis_delta : (isNat ? ix.index_time_in_millis : null);
              if (v instanceof Number) { idxMs = ((Number)v).longValue(); }
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey(qryDeltaF) && !doc[qryDeltaF].empty) {
              qryMs = ((Number)doc[qryDeltaF].value).longValue();
            } else if (isNat && doc.containsKey(qryRawF) && !doc[qryRawF].empty) {
              qryMs = ((Number)doc[qryRawF].value).longValue();
            } else if (params._source?.elasticsearch?.index?.total?.search != null) {
              def sx = params._source.elasticsearch.index.total.search;
              def v = sx.query_time_in_millis_delta != null ? sx.query_time_in_millis_delta : (isNat ? sx.query_time_in_millis : null);
              if (v instanceof Number) { qryMs = ((Number)v).longValue(); }
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('elasticsearch.index.total.store.size_in_bytes') && !doc['elasticsearch.index.total.store.size_in_bytes'].empty) {
              storeB = ((Number)doc['elasticsearch.index.total.store.size_in_bytes'].value).longValue();
            } else if (params._source?.elasticsearch?.index?.total?.store?.size_in_bytes instanceof Number) {
              storeB = ((Number)params._source.elasticsearch.index.total.store.size_in_bytes).longValue();
            }
          } catch (Exception e) {}
          try {
