          if (qryMs < 0L) { qryMs = 0L; }
          if (storeB < 0L) { storeB = 0L; }
          if (dsetB < 0L) { dsetB = 0L; }

          if (isNat) {
            boolean hasDelta = false;
            for (String df : [
              'elasticsearch.index.primaries.docs.count_delta',
