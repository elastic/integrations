- name: config_join_key
  type: keyword
  description: Join key for chargeback currency configuration.
- name: conf_currency_unit
  type: keyword
  description: Uppercase ISO currency code paired with the display currency symbol (for example, EUR, USD).
- name: conf_currency_symbol
  type: keyword
  description: Display currency symbol for chargeable unit rates (for example, €, $, £, R).
- name: conf_start_date
  type: date
  description: Configuration validity start date (defaults to Elasticsearch birthdate).
- name: conf_end_date
  type: date
  description: Configuration validity end date (defaults to 2046-12-31).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
