---
description: Pipeline for processing Zero Networks Audit logs
processors:
  - set:
      tag: set_ecs_version_f5923bab
      field: ecs.version
      value: '8.17.0'
  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_74d23cc2
      field: event.original
      target_field: json
  - date:
      tag: date_json_isoTimestamp_to_timestamp_a4c60d30
      field: json.isoTimestamp
      formats:
        - date_optional_time
      target_field: '@timestamp'
  - convert:
      tag: convert_json_auditType_28c4599c
      field: json.auditType
      type: string
      ignore_missing: true
  - rename:
      tag: rename_json_auditType_to_event_code_8dca07c0
      field: json.auditType
      target_field: event.code
      ignore_missing: true
  - rename:
      tag: rename_json_performedBy_id_to_user_id_4d6d81b5
      field: json.performedBy.id
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_json_performedBy_name_to_user_full_name_c5fd5bb3
      field: json.performedBy.name
      target_field: user.full_name
      ignore_missing: true
  - rename:
      tag: rename_json_enforcementSource_to_zeronetworks_audit_enforcementSource_9e898cf1
      field: json.enforcementSource
      target_field: zeronetworks.audit.enforcementSource
      if: 'ctx.json?.enforcementSource != null'
  - rename:
      tag: rename_json_userRole_to_zeronetworks_audit_userRole_6620f96b
      field: json.userRole
      target_field: zeronetworks.audit.userRole
      if: 'ctx.json?.userRole != null'
  - rename:
      tag: rename_json_reportedObjectId_to_zeronetworks_audit_reportedObjectId_c1cae677
      field: json.reportedObjectId
      target_field: zeronetworks.audit.reportedObjectId
      if: 'ctx.json?.reportedObjectId != null'
  - rename:
      tag: rename_json_reportedObjectGeneration_to_zeronetworks_audit_reportedObjectGeneration_370b9346
      field: json.reportedObjectGeneration
      target_field: zeronetworks.audit.reportedObjectGeneration
      if: 'ctx.json?.reportedObjectGeneration != null'
  - rename:
      tag: rename_json_parentObjectId_to_zeronetworks_audit_parentObjectId_884d4112
      field: json.parentObjectId
      target_field: zeronetworks.audit.parentObjectId
      ignore_missing: true
      if: 'ctx.json?.parentObjectId != null'
  - foreach:
      tag: foreach_json_destinationEntitiesList_fb167b3c
      field: json.destinationEntitiesList
      ignore_missing: true
      processor:
        append:
          tag: append_zeronetworks_audit_destinationEntitiesList_name_4a717a7a
          field: zeronetworks.audit.destinationEntitiesList.name
          value: '{{{_ingest._value.name}}}'
          allow_duplicates: true
  - foreach:
      tag: foreach_json_destinationEntitiesList_66d11144
      field: json.destinationEntitiesList
      ignore_missing: true
      processor:
        append:
          tag: append_zeronetworks_audit_destinationEntitiesList_id_859f779d
          field: zeronetworks.audit.destinationEntitiesList.id
          value: '{{{_ingest._value.id}}}'
          allow_duplicates: true
  - json:
      tag: json_json_details_to_zeronetworks_audit_details_75798942
      field: json.details
      target_field: zeronetworks.audit.details
      if: 'ctx.json?.details != null'
  - append:
      tag: append_related_user_23cff8dc
      field: related.user
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
  - append:
      tag: append_related_user_fa04533f
      field: related.user
      value: '{{{user.full_name}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
