---
description: Pipeline for processing Harmony Endpoint Forensics logs
processors:

  #################### Event ECS fields ########################

  - set:
      tag: set_event_module_27f33cd1
      field: event.module
      value: checkpoint_harmony_endpoint
  - set:
      tag: set_ecs_version_f5923549
      field: ecs.version
      value: "8.17.0"
  - set:
      tag: set_event_kind_39295792
      field: event.kind
      value: alert
  - set:
      tag: set_event_category_d051f5c3
      field: event.category
      value: ['malware']
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: ['info']
  - set:
      tag: set_event_dataset_e21227b3
      field: event.dataset
      value: checkpoint_harmony_endpoint.forensics
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      if: ctx.event?.original != null
      ignore_missing: true
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - drop:
      tag: drop_4295037f
      if: ctx.json?.event?.reason == 'polling'
  - rename:
      tag: rename_json_id_to_event_id_6438e920
      field: json.id
      target_field: event.id
      ignore_missing: true
  - rename:
      tag: rename_json_action_to_event_action_6ebb0784
      field: json.action
      target_field: event.action
      ignore_missing: true

  #################### Remove organization fields ###########################
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.

  #################### Related fields ##########################
  - append:
      tag: append_related_user_bfcb926b
      field: related.user
      value: '{{{json.src_user_name}}}'
      allow_duplicates: false
      if: ctx.json?.src_user_name instanceof String
  - foreach:
      tag: foreach_json_src_user_name_62520e15
      field: json.src_user_name
      if: ctx.json?.src_user_name instanceof List
      processor:
        append:
          field: related.user
          tag: append_src_user_name_into_related_user
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
  - append:
      tag: append_related_user_2118c569
      field: related.user
      value: '{{{json.process_username}}}'
      allow_duplicates: false
      if: ctx.json?.process_username != null
  - append:
      tag: append_related_ip_dcf37f5d
      field: related.ip
      value: '{{{json.src}}}'
      if: ctx.json?.src != null && ctx.json?.src != '0.0.0.0'
      allow_duplicates: false
  - append:
      tag: append_related_ip_622293be
      field: related.ip
      value: '{{{json.dst}}}'
      if: ctx.json?.dst != null && ctx.json?.dst != '0.0.0.0'
      allow_duplicates: false
  - append:
      tag: append_related_ip_204231ae
      field: related.ip
      value: '{{{json.proxy_src_ip}}}'
      if: ctx.json?.proxy_src_ip != null && ctx.json?.proxy_src_ip != '0.0.0.0'
      allow_duplicates: false
  - append:
      tag: append_related_hosts_2338302b
      field: related.hosts
      value: '{{{json.src_machine_name}}}'
      if: ctx.json?.src_machine_name != null
      allow_duplicates: false
  - append:
      tag: append_related_hash_fb3abcf6
      field: related.hash
      value: '{{{json.file_md5}}}'
      if: ctx.json?.file_md5 != null
      allow_duplicates: false
  - append:
      tag: append_related_hash_e85198ba
      field: related.hash
      value: '{{{json.file_sha1}}}'
      if: ctx.json?.file_sha1 != null
      allow_duplicates: false


  ###################### ECS fields ###########################
  - date:
      tag: date_json_time_to_timestamp_e36cfac1
      field: json.time
      target_field: "@timestamp"
      formats:
        - strict_date_optional_time_nanos
  - rename:
      tag: rename_json_host_type_to_host_type_121d1f37
      field: json.host_type
      target_field: host.type
      ignore_missing: true
  - append:
      tag: append_host_ip_e3d8c7d0
      field: host.ip
      value: '{{{json.src}}}'
      if: ctx.json?.src != null && ctx.json?.src != '0.0.0.0'
      allow_duplicates: false
  - rename:
      tag: rename_json_src_machine_name_to_host_hostname_811b24ed
      field: json.src_machine_name
      target_field: host.hostname
      override: true
      ignore_missing: true
  - set:
      tag: set_host_name_a45237a9
      field: host.name
      copy_from: host.hostname
      ignore_empty_value: true
  - rename:
      tag: rename_json_os_name_to_host_os_name_9d3176e2
      field: json.os_name
      target_field: host.os.name
      if: ctx.json?.os_name != null
      override: true
  - rename:
      tag: rename_json_os_version_to_host_os_version_d08c3083
      field: json.os_version
      target_field: host.os.version
      if: ctx.json?.os_version != null
      override: true
  - script:
      tag: script_c72ef584
      lang: painless
      if: ctx.host?.os?.name != null && ctx.host?.os?.version != null
      source: |-
        if (ctx.host.os.name instanceof List && ctx.host.os.name.size() == 1)
            ctx.host.os.name = ctx.host.os.name[0];
        if (ctx.host.os.version instanceof List && ctx.host.os.version.size() == 1)
            ctx.host.os.version = ctx.host.os.version[0];
  - rename:
      tag: rename_json_domain_to_user_domain_cb5b1073
      field: json.domain
      target_field: user.domain
      ignore_missing: true
  - rename:
      tag: rename_json_src_user_name_to_user_name_287e2ed2
      field: json.src_user_name
      target_field: user.name
      ignore_missing: true
  - rename:
      tag: rename_json_user_sid_to_user_id_03007874
      field: json.user_sid
      target_field: user.id
      ignore_missing: true
  - rename:
      tag: rename_json_file_type_to_file_type_a29aba28
      field: json.file_type
      target_field: file.type
      if: ctx.json?.file_type != null
      ignore_missing: true
  - rename:
      tag: rename_json_file_name_to_file_name_30f05aaa
      field: json.file_name
      target_field: file.name
      if: ctx.json?.file_name != null
  - script:
      tag: script_a66fe145
      lang: painless
      if: ctx.file?.name != null
      source: |-
        if (ctx.file.name instanceof List)
            ctx.file.name = ctx.file.name[0];
  - remove:
      tag: remove_file_name_785859b9
      field: file.name
      ignore_missing: true
      if: ctx.file?.name == " "
  - rename:
      tag: rename_json_file_size_to_file_size_73c3a585
      field: json.file_size
      target_field: file.size
      ignore_missing: true
  - rename:
      tag: rename_json_resource_to_file_path_af04c65c
      field: json.resource
      target_field: file.path
      if: ctx.json?.resource != null && !["http emulation", "url reputation", "url filtering", "phishing"].contains(ctx.json?.protection_type?.toLowerCase())
  - script:
      tag: script_44d02b3e
      lang: painless
      if: ctx.file?.path != null
      source: |-
        if (ctx.file.path instanceof List && ctx.file.path.size() == 1)
            ctx.file.path = ctx.file.path[0];
  - rename:
      tag: rename_json_resource_to_url_original_e0220746
      field: json.resource
      target_field: url.original
      if: ctx.json?.resource != null && ["http emulation", "url reputation", "url filtering", "phishing"].contains(ctx.json?.protection_type?.toLowerCase())
  - script:
      tag: script_3f358c63
      lang: painless
      if: ctx.url?.original != null
      source: |-
        if (ctx.url.original instanceof List && ctx.url.original.size() == 1)
            ctx.url.original = ctx.url.original[0];
  - rename:
      tag: rename_json_file_md5_to_file_hash_md5_d5dd767a
      field: json.file_md5
      target_field: file.hash.md5
      if: ctx.json?.file_md5 != null
      ignore_missing: true
  - rename:
      tag: rename_json_file_sha1_to_file_hash_sha1_0ca13923
      field: json.file_sha1
      target_field: file.hash.sha1
      if: ctx.json?.file_sha1 != null
      ignore_missing: true
  - rename:
      tag: rename_json_protection_name_to_rule_name_1667101e
      field: json.protection_name
      target_field: rule.name
      ignore_missing: true


  #################### Forensics Log fields ####################
  - rename:
      tag: rename_json_to_checkpoint_harmony_endpoint_forensics_66e03541
      field: json
      target_field: checkpoint_harmony_endpoint.forensics
      ignore_missing: true
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_policy_date_to_checkpoint_harmony_endpoint_forensics_policy_date_a5370427
      field: checkpoint_harmony_endpoint.forensics.policy_date
      target_field: checkpoint_harmony_endpoint.forensics.policy.date
      ignore_missing: true
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_policy_name_to_checkpoint_harmony_endpoint_forensics_policy_name_7f9b473d
      field: checkpoint_harmony_endpoint.forensics.policy_name
      target_field: checkpoint_harmony_endpoint.forensics.policy.name
      ignore_missing: true
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_policy_number_to_checkpoint_harmony_endpoint_forensics_policy_number_3997ea51
      field: checkpoint_harmony_endpoint.forensics.policy_number
      target_field: checkpoint_harmony_endpoint.forensics.policy.number
      ignore_missing: true
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_client_name_to_checkpoint_harmony_endpoint_forensics_client_name_4fadcb5f
      field: checkpoint_harmony_endpoint.forensics.client_name
      target_field: checkpoint_harmony_endpoint.forensics.client.name
      ignore_missing: true
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_client_version_to_checkpoint_harmony_endpoint_forensics_client_version_e44bf013
      field: checkpoint_harmony_endpoint.forensics.client_version
      target_field: checkpoint_harmony_endpoint.forensics.client.version
      if: ctx.checkpoint_harmony_endpoint.forensics?.client_version != null
  - script:
      tag: script_c7a83f43
      lang: painless
      if: ctx.checkpoint_harmony_endpoint?.forensics?.client?.version != null
      source: |-
        if (ctx.checkpoint_harmony_endpoint.forensics.client.version instanceof List && ctx.checkpoint_harmony_endpoint.forensics.client.version.size() == 1)
            ctx.checkpoint_harmony_endpoint.forensics.client.version = ctx.checkpoint_harmony_endpoint.forensics.client.version[0];
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_malware_action_to_checkpoint_harmony_endpoint_forensics_malware_action_e8ef4b3b
      field: checkpoint_harmony_endpoint.forensics.malware_action
      target_field: checkpoint_harmony_endpoint.forensics.malware.action
      if: ctx.checkpoint_harmony_endpoint.forensics?.malware_action != null
  - script:
      tag: script_ac48b3ad
      lang: painless
      if: ctx.checkpoint_harmony_endpoint?.forensics?.malware?.action != null
      source: |-
        if (ctx.checkpoint_harmony_endpoint.forensics.malware.action instanceof List && ctx.checkpoint_harmony_endpoint.forensics.malware.action.size() == 1)
            ctx.checkpoint_harmony_endpoint.forensics.malware.action = ctx.checkpoint_harmony_endpoint.forensics.malware.action[0];
  - remove:
      tag: remove_checkpoint_harmony_endpoint_forensics_malware_action_4ccdadd3
      field: checkpoint_harmony_endpoint.forensics.malware.action
      ignore_missing: true
      if: ctx.checkpoint_harmony_endpoint?.forensics?.malware?.action == " "
  - script:
      tag: script_c537ae20
      lang: painless
      if: ctx.checkpoint_harmony_endpoint?.forensics?.web_client_type != null
      source: |-
        if (ctx.checkpoint_harmony_endpoint.forensics.web_client_type instanceof List && ctx.checkpoint_harmony_endpoint.forensics.web_client_type.size() == 1)
            ctx.checkpoint_harmony_endpoint.forensics.web_client_type = ctx.checkpoint_harmony_endpoint.forensics.web_client_type[0];
  - remove:
      tag: remove_checkpoint_harmony_endpoint_forensics_web_client_type_a90294c6
      field: checkpoint_harmony_endpoint.forensics.web_client_type
      ignore_missing: true
      if: ctx.checkpoint_harmony_endpoint?.forensics?.web_client_type == " "
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_product_to_checkpoint_harmony_endpoint_forensics_product_name_7cccdc45
      field: checkpoint_harmony_endpoint.forensics.product
      target_field: checkpoint_harmony_endpoint.forensics.product.name
      ignore_missing: true
  - rename:
      tag: rename_checkpoint_harmony_endpoint_forensics_product_family_to_checkpoint_harmony_endpoint_forensics_product_family_100252c5
      field: checkpoint_harmony_endpoint.forensics.product_family
      target_field: checkpoint_harmony_endpoint.forensics.product.family
      ignore_missing: true


  ########################## Clean Up ###########################
  - remove:
      field: json
      ignore_missing: true
      tag: remove_json
  - remove:
      field:
        - checkpoint_harmony_endpoint.forensics.client_version
        - checkpoint_harmony_endpoint.forensics.malware_action
        - checkpoint_harmony_endpoint.forensics.product_family
        - checkpoint_harmony_endpoint.forensics.resource
        - checkpoint_harmony_endpoint.forensics.orig
        - checkpoint_harmony_endpoint.forensics.os_name
        - checkpoint_harmony_endpoint.forensics.os_version
        - checkpoint_harmony_endpoint.forensics.time
      ignore_missing: true
      tag: remove_custom_duplicate_fields
  - script:
      description: This script processor iterates over the whole document to remove fields with null values.
      tag: script_to_drop_null_values
      lang: painless
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || v == '<NA>' || v == '-1' ||(v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || v == '<NA>' || v == '-1' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);

###############################Handle failures###############

on_failure:
  - append:
      field: error.message
      value: >
        Processor "{{{ _ingest.on_failure_processor_type }}}"
        with tag "{{{ _ingest.on_failure_processor_tag }}}"
        in pipeline "{{{ _ingest.on_failure_pipeline }}}"
        failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false

################################################################
