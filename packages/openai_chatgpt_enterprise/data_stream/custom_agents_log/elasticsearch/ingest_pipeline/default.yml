---
description: Parse OpenAI ChatGPT Enterprise Custom Agents Logs events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the original message.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: openai_chatgpt_enterprise.custom_agents_log
      tag: parse_json
      if: ctx.event?.original != null
  - fingerprint:
      fields:
        - openai_chatgpt_enterprise.custom_agents_log.event_id
      target_field: _id
      ignore_missing: true
      tag: fingerprint_event_id
  - set:
      field: gen_ai.provider.name
      tag: set_gen_ai_provider_name
      value: openai
  - set:
      field: event.id
      tag: set_event_id
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_id
      ignore_empty_value: true
  - date:
      field: openai_chatgpt_enterprise.custom_agents_log.timestamp
      target_field: openai_chatgpt_enterprise.custom_agents_log.timestamp
      formats:
        - ISO8601
      tag: date_timestamp
      if: ctx.openai_chatgpt_enterprise?.custom_agents_log?.timestamp != null && ctx.openai_chatgpt_enterprise?.custom_agents_log.timestamp != ''
      on_failure:
        - remove:
            field: openai_chatgpt_enterprise.custom_agents_log.timestamp
            ignore_missing: true
            tag: remove_timestamp_on_failure
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_timestamp
      copy_from: openai_chatgpt_enterprise.custom_agents_log.timestamp
      ignore_empty_value: true
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - set:
      field: user.id
      tag: set_user_id_from_actor
      copy_from: openai_chatgpt_enterprise.custom_agents_log.actor.user_id
      ignore_empty_value: true
  - set:
      field: user.email
      tag: set_user_email_from_actor
      copy_from: openai_chatgpt_enterprise.custom_agents_log.actor.user_email
      ignore_empty_value: true
  - set:
      field: user.id
      tag: set_user_id_from_delegator
      copy_from: openai_chatgpt_enterprise.custom_agents_log.actor.agent_runtime.delegator.user_id
      ignore_empty_value: true
      if: ctx.user?.id == null
  - set:
      field: user.email
      tag: set_user_email_from_delegator
      copy_from: openai_chatgpt_enterprise.custom_agents_log.actor.agent_runtime.delegator.user_email
      ignore_empty_value: true
      if: ctx.user?.email == null
  - dissect:
      field: user.email
      pattern: '%{}@%{user.domain}'
      tag: dissect_user_domain_from_email
      if: ctx.user?.email != null && ctx.user.email.contains('@')
  - set:
      field: organization.id
      tag: set_organization_id_from_principal
      copy_from: openai_chatgpt_enterprise.custom_agents_log.principal.id
      ignore_empty_value: true
      if: ctx.openai_chatgpt_enterprise?.custom_agents_log?.principal?.id != null
  - convert:
      field: openai_chatgpt_enterprise.custom_agents_log.request_metadata.client_ip
      tag: convert_client_ip_to_ip
      type: ip
      ignore_missing: true
      if: ctx.openai_chatgpt_enterprise?.custom_agents_log?.request_metadata?.client_ip != ''
      on_failure:
        - remove:
            field: openai_chatgpt_enterprise.custom_agents_log.request_metadata.client_ip
            ignore_missing: true
            tag: remove_client_ip_on_failure
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip_from_request_metadata
      copy_from: openai_chatgpt_enterprise.custom_agents_log.request_metadata.client_ip
      ignore_empty_value: true
  - set:
      field: user_agent.original
      tag: set_user_agent_original
      copy_from: openai_chatgpt_enterprise.custom_agents_log.request_metadata.client_user_agent
      ignore_empty_value: true
  - set:
      field: event.action
      tag: set_event_action
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_type
      ignore_empty_value: true
  - lowercase:
      field: event.action
      tag: lowercase_event_action
      ignore_missing: true
  - append:
      field: event.category
      tag: append_event_category_custom_agents_log
      value: api
  - script:
      lang: painless
      tag: set_event_type_from_action
      description: Derive event.type from action/event_type names (creation/change/deletion/info).
      if: ctx.event?.action != null && ctx.event.action != ''
      source: |-
        def a = ctx.event.action;
        def type = 'info';
        if (a.contains('delete') || a.contains('deleted') || a.contains('revoke') || a.contains('remove')) {
          type = 'deletion';
        } else if (a.contains('create') || a.contains('created') || a.endsWith('_send') || a.contains('invite')) {
          type = 'creation';
        } else if (a.contains('update') || a.contains('updated') || a.contains('toggle') || a.contains('share') || a.contains('publish') || a.contains('change')) {
          type = 'change';
        }
        if (ctx.event.type == null) {
          ctx.event.type = new ArrayList();
        }
        ctx.event.type.add(type);
  - script:
      lang: painless
      tag: set_event_outcome_from_event_type_or_status
      description: Derive event.outcome from run event_type and CONNECTOR_CALL_COMPLETED status.
      source: |-
        def et = ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_type;
        def status = ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_details?.status;
        if (et == 'AGENT_RUN_FAILED') {
          ctx.event.outcome = 'failure';
        } else if (et == 'AGENT_RUN_COMPLETED') {
          ctx.event.outcome = 'success';
        } else if (et == 'CONNECTOR_CALL_COMPLETED') {
          if (status == 'success') {
            ctx.event.outcome = 'success';
          } else if (status == 'error' || status == 'failed' || status == 'failure') {
            ctx.event.outcome = 'failure';
          }
        } else if (status == 'success') {
          ctx.event.outcome = 'success';
        } else if (status == 'error' || status == 'failed' || status == 'failure') {
          ctx.event.outcome = 'failure';
        }
  - set:
      field: gen_ai.agent.id
      tag: set_gen_ai_agent_id_from_agent_id
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.agent_id
      ignore_empty_value: true
  - set:
      field: gen_ai.agent.name
      tag: set_gen_ai_agent_name_from_agent_fields_name
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.name
      ignore_empty_value: true
  - set:
      field: gen_ai.agent.description
      tag: set_gen_ai_agent_description
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.description
      ignore_empty_value: true
  - set:
      field: gen_ai.request.model
      tag: set_gen_ai_request_model
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.model_spec.name
      ignore_empty_value: true
  - set:
      field: gen_ai.operation.name
      tag: set_gen_ai_operation_name_chat
      value: chat
      if: >-
        ['AGENT_RUN_CREATED', 'AGENT_RUN_MESSAGE', 'AGENT_RUN_COMPLETED', 'AGENT_RUN_FAILED',
         'CONNECTOR_CALL_REQUESTED', 'CONNECTOR_CALL_COMPLETED', 'CONNECTOR_OAUTH_RESOLVED',
         'SKILL_USED', 'MEMORY_READ', 'MEMORY_WRITE', 'MEMORY_DELETE'].contains(
          ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_type)
  - script:
      lang: painless
      tag: set_gen_ai_system_instructions_from_prompt
      description: Map agent system prompt into ECS gen_ai.system_instructions.
      if: >-
        ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_details?.agent_fields?.prompt != null &&
        ctx.openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.prompt != ''
      source: |-
        ctx.gen_ai = ctx.gen_ai ?: [:];
        def instruction = [:];
        instruction.type = 'text';
        instruction.content = ctx.openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.prompt;
        ctx.gen_ai.system_instructions = [instruction];
  - script:
      lang: painless
      tag: set_gen_ai_input_messages_from_user_message_text
      description: Map run invoker user message into ECS gen_ai.input.messages.
      if: >-
        ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_details?.invoker?.user_message_text != null &&
        ctx.openai_chatgpt_enterprise.custom_agents_log.event_details.invoker.user_message_text != ''
      source: |-
        ctx.gen_ai = ctx.gen_ai ?: [:];
        ctx.gen_ai.input = ctx.gen_ai.input ?: [:];
        def part = [:];
        part.type = 'text';
        part.content = ctx.openai_chatgpt_enterprise.custom_agents_log.event_details.invoker.user_message_text;
        def message = [:];
        message.role = 'user';
        message.parts = [part];
        ctx.gen_ai.input.messages = [message];
  - script:
      lang: painless
      tag: set_gen_ai_output_messages_from_run_text
      description: Map agent run message text into ECS gen_ai.output.messages.
      if: >-
        ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_type == 'AGENT_RUN_MESSAGE' &&
        ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_details?.text != null &&
        ctx.openai_chatgpt_enterprise.custom_agents_log.event_details.text != ''
      source: |-
        ctx.gen_ai = ctx.gen_ai ?: [:];
        ctx.gen_ai.output = ctx.gen_ai.output ?: [:];
        def part = [:];
        part.type = 'text';
        part.content = ctx.openai_chatgpt_enterprise.custom_agents_log.event_details.text;
        def message = [:];
        message.role = 'assistant';
        message.parts = [part];
        ctx.gen_ai.output.messages = [message];
  - set:
      field: gen_ai.tool.name
      tag: set_gen_ai_tool_name_from_connector_name
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.connector_name
      ignore_empty_value: true
  - set:
      field: gen_ai.tool.name
      tag: set_gen_ai_tool_name_from_skill_name
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.skill_name
      ignore_empty_value: true
      if: ctx.gen_ai?.tool?.name == null
  - set:
      field: gen_ai.tool.type
      tag: set_gen_ai_tool_type_extension
      value: extension
      if: >-
        ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_details?.connector_name != null ||
        ctx.openai_chatgpt_enterprise?.custom_agents_log?.event_details?.tool_call_id != null
  - set:
      field: gen_ai.tool.call.id
      tag: set_gen_ai_tool_call_id
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.tool_call_id
      ignore_empty_value: true
  - set:
      field: event.reason
      tag: set_event_reason_from_delete_reason
      copy_from: openai_chatgpt_enterprise.custom_agents_log.event_details.delete_reason
      ignore_empty_value: true
  - user_agent:
      field: user_agent.original
      ignore_missing: true
      tag: enrich_user_agent
  - geoip:
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      tag: enrich_source_geo
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: enrich_source_asn
  - rename:
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
      tag: rename_source_asn
  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      tag: rename_source_as_org
  - append:
      field: related.ip
      tag: append_source_ip_to_related
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      field: related.user
      tag: append_user_email_to_related
      value: '{{{user.email}}}'
      allow_duplicates: false
      if: ctx.user?.email != null
  - append:
      field: related.user
      tag: append_user_id_to_related
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
  - remove:
      field:
        - openai_chatgpt_enterprise.custom_agents_log.event_id
        - openai_chatgpt_enterprise.custom_agents_log.timestamp
        - openai_chatgpt_enterprise.custom_agents_log.actor.user_id
        - openai_chatgpt_enterprise.custom_agents_log.actor.user_email
        - openai_chatgpt_enterprise.custom_agents_log.actor.agent_runtime.delegator.user_id
        - openai_chatgpt_enterprise.custom_agents_log.actor.agent_runtime.delegator.user_email
        - openai_chatgpt_enterprise.custom_agents_log.principal.id
        - openai_chatgpt_enterprise.custom_agents_log.request_metadata.client_ip
        - openai_chatgpt_enterprise.custom_agents_log.request_metadata.client_user_agent
        - openai_chatgpt_enterprise.custom_agents_log.event_details.agent_id
        - openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.name
        - openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.description
        - openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.model_spec.name
        - openai_chatgpt_enterprise.custom_agents_log.event_details.agent_fields.prompt
        - openai_chatgpt_enterprise.custom_agents_log.event_details.connector_name
        - openai_chatgpt_enterprise.custom_agents_log.event_details.tool_call_id
        - openai_chatgpt_enterprise.custom_agents_log.event_details.delete_reason
        - openai_chatgpt_enterprise.custom_agents_log.event_details.invoker.user_message_text
      tag: remove_custom_fields_mapped_to_ecs
      ignore_missing: true
      description: Remove custom fields that were copied to ECS fields.
  - script:
      lang: painless
      tag: remove_null_values
      description: Remove null or empty values from the document.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      tag: append_pipeline_failure_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event_on_pipeline_failure
      value: preserve_original_event
      allow_duplicates: false
