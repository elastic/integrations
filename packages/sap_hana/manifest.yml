format_version: 3.4.2
name: sap_hana
title: "SAP HANA"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: "Collect SAP HANA database metrics via the SUSE hanadb_exporter Prometheus endpoint (memory, CPU, disk, SQL, connections, replication, alerts)."
type: integration
categories:
  - observability
  - datastore
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/sap_hana.svg
    title: SAP HANA
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: sap_hana
    title: SAP HANA metrics
    description: Collect metrics from SUSE hanadb_exporter (default port 9668).
    inputs:
      - type: prometheus/metrics
        title: Collect SAP HANA Prometheus metrics
        description: Scrape hanadb_* metrics from the hanadb_exporter /metrics endpoint.
owner:
  github: elastic/obs-signals-integrations-team
  type: community
