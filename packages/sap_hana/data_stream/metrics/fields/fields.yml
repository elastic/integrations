- name: sap_hana
  type: group
  fields:
    - name: labels.*
      type: object
      object_type: keyword
      object_type_mapping_type: "*"
      description: >-
        Prometheus labels from hanadb_exporter (sid, host, database_name, CONNECTION_STATUS, …).
    - name: labels_fingerprint
      type: keyword
      dimension: true
      description: >-
        Fingerprint of the series labels, used to tell series apart.
    - name: alerts
      type: group
      fields:
        - name: current
          type: double
          metric_type: gauge
          description: >-
            HANA Database current alerts rating (`hanadb_alerts_current`).
    - name: connections
      type: group
      fields:
        - name: total
          type: double
          metric_type: gauge
          description: >-
            Number of connections grouped by Type and Status (`hanadb_connections_total`).
    - name: cpu
      type: group
      fields:
        - name: busy
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of CPU time spent by HANA DB, over the last minute (in seconds) (`hanadb_cpu_busy`).
        - name: idle
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of CPU time not spent by HANA DB, over the last minute (in seconds) (`hanadb_cpu_idle`).
        - name: system
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of CPU time spent by HANA DB in Kernel space, over the last minute (in seconds) (`hanadb_cpu_system`).
        - name: user
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of CPU time spent by HANA DB in user space, over the last minute (in seconds) (`hanadb_cpu_user`).
        - name: waitio
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of CPU time spent by HANA DB in IO mode, over the last minute (in seconds) (`hanadb_cpu_waitio`).
    - name: disk
      type: group
      fields:
        - name: data_files_available_size
          type: double
          metric_type: gauge
          description: >-
            Available space per file and file type (in MB) (`hanadb_disk_data_files_available_size`).
        - name: data_files_fragmentation
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of unused space compared to total space in file (`hanadb_disk_data_files_fragmentation`).
        - name: data_files_total_size
          type: double
          metric_type: gauge
          description: >-
            Total space per file and file type (in MB) (`hanadb_disk_data_files_total_size`).
        - name: data_files_used_size
          type: double
          metric_type: gauge
          description: >-
            Used space per file and file type (in MB) (`hanadb_disk_data_files_used_size`).
        - name: io_latency
          type: double
          metric_type: gauge
          description: >-
            Total I/O latency (ms), calculated from the sum of service and wait time (`hanadb_disk_io_latency`).
        - name: io_queue_length
          type: double
          metric_type: gauge
          description: >-
            I/O queue length (average queue length of the requests that were issued to the Disk Device) (`hanadb_disk_io_queue_length`).
        - name: io_requests_per
          type: double
          metric_type: gauge
          description: >-
            I/O requests per second (`hanadb_disk_io_requests_per`).
        - name: io_service_time
          type: double
          metric_type: gauge
          description: >-
            I/O service time in ms (`hanadb_disk_io_service_time`).
        - name: io_throughput
          type: double
          metric_type: gauge
          description: >-
            I/O throughput in KB/seconds (`hanadb_disk_io_throughput`).
        - name: io_wait_time
          type: double
          metric_type: gauge
          description: >-
            I/O service time in ms (`hanadb_disk_io_wait_time`).
        - name: total_device_size
          type: double
          metric_type: gauge
          description: >-
            Total device size returned by the operating system (in MB). It will be repeated if the device is shared between usages_types. (`hanadb_disk_total_device_size`).
        - name: total_size
          type: double
          metric_type: gauge
          description: >-
            Specifies the volume size in MB. It will be repeated if the volume is shared between usages_types. (`hanadb_disk_total_size`).
        - name: total_used_size
          type: double
          metric_type: gauge
          description: >-
            Specifies the used volume size in MB. It will be repeated if the volume is shared between usages_types. (`hanadb_disk_total_used_size`).
        - name: used_size
          type: double
          metric_type: gauge
          description: >-
            Size of used disk space in MB based on usage_type (`hanadb_disk_used_size`).
    - name: memory
      type: group
      fields:
        - name: column_tables_used_memory
          type: double
          metric_type: gauge
          description: >-
            Column tables total memory used in MB (`hanadb_column_tables_used_memory`).
        - name: host_memory_alloc_limit
          type: double
          metric_type: gauge
          description: >-
            Memory allocation limit for all process per host in MB (`hanadb_host_memory_alloc_limit`).
        - name: host_memory_code_size
          type: double
          metric_type: gauge
          description: >-
            Code size, including shared libraries of SAP HANA processes per host in MB (`hanadb_host_memory_code_size`).
        - name: host_memory_physical_free
          type: double
          metric_type: gauge
          description: >-
            Free physical memory per host in MB (`hanadb_host_memory_physical_free`).
        - name: host_memory_physical_total
          type: double
          metric_type: gauge
          description: >-
            Total physical memory per host in MB (`hanadb_host_memory_physical_total`).
        - name: host_memory_pool_size
          type: double
          metric_type: gauge
          description: >-
            Size of the memory pool for all SAP HANA processes per host in MB (`hanadb_host_memory_pool_size`).
        - name: host_memory_resident
          type: double
          metric_type: gauge
          description: >-
            Total resident (used physical) memory per host in MB (`hanadb_host_memory_resident`).
        - name: host_memory_shared_alloc
          type: double
          metric_type: gauge
          description: >-
            Shared memory size of SAP HANA processes per host in MB (`hanadb_host_memory_shared_alloc`).
        - name: host_memory_swap_free
          type: double
          metric_type: gauge
          description: >-
            Free swap memory per host in MB (`hanadb_host_memory_swap_free`).
        - name: host_memory_swap_used
          type: double
          metric_type: gauge
          description: >-
            Used swap memory per host in MB (`hanadb_host_memory_swap_used`).
        - name: host_memory_used_peak
          type: double
          metric_type: gauge
          description: >-
            Peak memory from the memory pool used by SAP HANA processes since the instance started (this is a sample-based value) per host in MB (`hanadb_host_memory_used_peak`).
        - name: host_memory_used_total
          type: double
          metric_type: gauge
          description: >-
            Amount of memory from the memory pool that is currently being used by SAP HANA processes per host in MB (`hanadb_host_memory_used_total`).
        - name: service_alloc_limit
          type: double
          metric_type: gauge
          description: >-
            Maximum memory pool size (configurable value) per service in MB (`hanadb_memory_service_alloc_limit`).
        - name: service_code_size
          type: double
          metric_type: gauge
          description: >-
            Code size, including shared libraries, per service in MB (`hanadb_memory_service_code_size`).
        - name: service_compactors_allocated_size
          type: double
          metric_type: gauge
          description: >-
            Part of the memory pool that can potentially (if unpinned) be freed during a memory shortage per service in MB (`hanadb_memory_service_compactors_allocated_size`).
        - name: service_compactors_freeable_size
          type: double
          metric_type: gauge
          description: >-
            Memory that can be freed during a memory shortage per service in MB (`hanadb_memory_service_compactors_freeable_size`).
        - name: service_effective_alloc_limit
          type: double
          metric_type: gauge
          description: >-
            Effective maximum memory pool size, considering the pool sizes of other processes (computed value) per service in MB (`hanadb_memory_service_effective_alloc_limit`).
        - name: service_heap_allocated
          type: double
          metric_type: gauge
          description: >-
            Allocated Heap Memory part of the memory pool per service in MB (`hanadb_memory_service_heap_allocated`).
        - name: service_heap_used
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of used Heap Memory part of the memory pool per service (`hanadb_memory_service_heap_used`).
        - name: service_physical_total
          type: double
          metric_type: gauge
          description: >-
            Total physical resident memory size (operating system perspective) per service in MB (`hanadb_memory_service_physical_total`).
        - name: service_shared_allocated
          type: double
          metric_type: gauge
          description: >-
            Allocated Shared Memory part of the memory pool per service in MB (`hanadb_memory_service_shared_allocated`).
        - name: service_shared_used
          type: double
          metric_type: gauge
          unit: percent
          description: >-
            Percentage of used Shared Memory from the memory pool per service (`hanadb_memory_service_shared_used`).
        - name: service_stack_size
          type: double
          metric_type: gauge
          description: >-
            Stack size per service in MB (`hanadb_memory_service_stack_size`).
        - name: service_total_used
          type: double
          metric_type: gauge
          description: >-
            Total memory from the memory pool used per services in MB (`hanadb_memory_service_total_used`).
        - name: service_virtual_total
          type: double
          metric_type: gauge
          description: >-
            Total Virtual memory size (operating system perspective) per service in MB (`hanadb_memory_service_virtual_total`).
        - name: schema_used_memory
          type: double
          metric_type: gauge
          description: >-
            Total used memory by schema in MB (`hanadb_schema_used_memory`).
        - name: sql_top_mem_consumers
          type: double
          metric_type: gauge
          description: >-
            Top statements time consumers. Number of total executions of the SQL Statement (`hanadb_sql_top_mem_consumers`).
        - name: table_cs_top_mem_disk_size
          type: double
          metric_type: gauge
          description: >-
            Top 10 tables consuming more memory. The total disk size of all of the table parts (`hanadb_table_cs_top_mem_disk_size`).
        - name: table_cs_top_mem_estimated_max
          type: double
          metric_type: gauge
          description: >-
            Top 10 tables consuming more memory. The estimated maximum memory consumption (MB), in total, for the fully loaded table (data for open transactions is not included) (`hanadb_table_cs_top_mem_estimated_max`).
        - name: table_cs_top_mem_record
          type: double
          metric_type: gauge
          description: >-
            Top 10 tables consuming more memory. The record count of the table (`hanadb_table_cs_top_mem_record`).
        - name: table_cs_top_mem_total
          type: double
          metric_type: gauge
          description: >-
            Top 10 tables consuming more memory. The total memory size (MB) is the sum of memory size in the main, delta, and history parts (`hanadb_table_cs_top_mem_total`).
    - name: network
      type: group
      fields:
        - name: collisions_per
          type: double
          metric_type: gauge
          description: >-
            Network collisions per second (`hanadb_network_collisions_per`).
        - name: receive_rate_errors_per
          type: double
          metric_type: gauge
          description: >-
            Network receive rate of errors per seconds (`hanadb_network_receive_rate_errors_per`).
        - name: receive_rate_kb_per
          type: double
          metric_type: gauge
          description: >-
            Network received rate in kilobytes per seconds (`hanadb_network_receive_rate_kb_per`).
        - name: receive_requests_per
          type: double
          metric_type: gauge
          description: >-
            Network receive rate in requests (packets) per seconds (`hanadb_network_receive_requests_per`).
        - name: transmission_rate_errors_per
          type: double
          metric_type: gauge
          description: >-
            Network tramission rate of errors per seconds (`hanadb_network_transmission_rate_errors_per`).
        - name: transmission_rate_kb_per
          type: double
          metric_type: gauge
          description: >-
            Network transmission rate in kilobytes per seconds (`hanadb_network_transmission_rate_kb_per`).
        - name: transmission_rate_requests_per
          type: double
          metric_type: gauge
          description: >-
            Network transmission rate in requests (packets) per seconds (`hanadb_network_transmission_rate_requests_per`).
    - name: other
      type: group
      fields:
        - name: sr_async_used_shipping_buffer
          type: double
          metric_type: gauge
          description: >-
            System Replication current filling level of asynchronous log shipping buffer (MB) (`hanadb_sr_async_used_shipping_buffer`).
        - name: sr_secondary_active
          type: double
          metric_type: gauge
          description: >-
            System Replication - Specifies the secondary active status. Values: 0 - INACTIVE and 1 - ACTIVE (`hanadb_sr_secondary_active`).
        - name: sr_secondary_failover
          type: double
          metric_type: gauge
          description: >-
            System Replication secondary failover count (`hanadb_sr_secondary_failover`).
        - name: sr_secondary_reconnect
          type: double
          metric_type: gauge
          description: >-
            System Replication secondary reconnect count (`hanadb_sr_secondary_reconnect`).
        - name: sr_ship_delay
          type: double
          metric_type: gauge
          description: >-
            System Replication log shipping delay in seconds (`hanadb_sr_ship_delay`).
    - name: replication
      type: group
      fields:
        - name: sr_replication
          type: double
          metric_type: gauge
          description: >-
            System Replication status. Values: 0-ACTIVE, 1-INITIALIZING, 2-SYNCING, 3-UNKNOWN, 4-ERROR, 99-UNMAPPED  (`hanadb_sr_replication`).
        - name: sr_takeover_duration_time
          type: double
          metric_type: gauge
          description: >-
            System Replication takeover duration time. Returns -1 if cannot be calculated, together with END_TIME=N/A. It is a workaround to when HANA cannot collect this value (`hanadb_sr_takeover_duration_time`).
        - name: sr_takeover_log_position
          type: double
          metric_type: gauge
          description: >-
            Specifies the master log position, that has been reached by takeover (`hanadb_sr_takeover_log_position`).
        - name: sr_takeover_replication
          type: double
          metric_type: gauge
          description: >-
            System Replication status at takeover time. Values: 0-ACTIVE, 1-INITIALIZING, 2-SYNCING, 3-UNKNOWN, 4-ERROR, 99-UNMAPPED (`hanadb_sr_takeover_replication`).
        - name: sr_takeover_shipped_log_position
          type: double
          metric_type: gauge
          description: >-
            Specifies the highest master log position that has been shipped before executing takeover (`hanadb_sr_takeover_shipped_log_position`).
    - name: sql
      type: group
      fields:
        - name: service_elap_per_exec_avg
          type: double
          metric_type: gauge
          description: >-
            Average elapsed time per execution by service and SQL type in miliseconds (`hanadb_sql_service_elap_per_exec_avg`).
        - name: service_elapsed_time
          type: double
          metric_type: gauge
          description: >-
            Total elapsed time of SQL statements executions by service and SQL type in miliseconds (`hanadb_sql_service_elapsed_time`).
        - name: service_executions
          type: double
          metric_type: gauge
          description: >-
            Total number of SQL statements executions by service and SQL type (`hanadb_sql_service_executions`).
        - name: service_lock_per_exec
          type: double
          metric_type: gauge
          description: >-
            Average lock wait time per execution by service and SQL type in miliseconds (`hanadb_sql_service_lock_per_exec`).
        - name: service_max_ela_time
          type: double
          metric_type: gauge
          description: >-
            Maximum elapsed time per execution by service and SQL type in miliseconds (`hanadb_sql_service_max_ela_time`).
        - name: top_time_consumers
          type: double
          metric_type: gauge
          description: >-
            Top statements time consumers. Number of total executions of the SQL Statement (`hanadb_sql_top_time_consumers`).
