      tag: rename_hanadb_cpu_user_percent
      field: prometheus.hanadb_cpu_user_percent.value
      target_field: sap_hana.cpu.user
      ignore_missing: true
  - script:
      tag: scale_rename_hanadb_cpu_user_percent
      lang: painless
      description: Normalize percent metrics from 0-100 to 0-1.
      if: ctx.sap_hana?.cpu?.user != null
      source: >
        def fam = ctx.sap_hana.cpu;
        def k = "user";
        if (fam[k] instanceof Number && fam[k] > 1.0) {
          fam[k] = fam[k] / 100.0;
        }
      ignore_failure: true
