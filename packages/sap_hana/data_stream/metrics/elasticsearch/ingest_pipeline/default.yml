---
description: Pipeline for processing SAP HANA Prometheus metrics from hanadb_exporter.
processors:
  - set:
      tag: set_event_module
      field: event.module
      value: sap_hana
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: 8.17.0
  - set:
      tag: set_service_type
      field: service.type
      value: sap_hana
  - rename:
      tag: rename_hanadb_column_tables_used_memory_mb
      field: prometheus.hanadb_column_tables_used_memory_mb.value
      target_field: sap_hana.memory.column_tables_used_memory
      ignore_missing: true
  - rename:
      tag: rename_hanadb_schema_used_memory_mb
      field: prometheus.hanadb_schema_used_memory_mb.value
