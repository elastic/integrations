        - sap_hana.labels.instance
        - sap_hana.labels.job
      ignore_missing: true
  - fingerprint:
      tag: fingerprint_labels
      fields:
        - sap_hana.labels
      target_field: sap_hana.labels_fingerprint
      ignore_missing: true
  - remove:
      tag: remove_prometheus
      field: prometheus
      ignore_missing: true
  - drop:
      tag: drop_unmapped_events
      description: Drop events that carry no metric mapped by this integration.
      if: ctx.sap_hana == null || ctx.sap_hana.keySet().stream().allMatch(k -> k == 'labels' || k == 'labels_fingerprint')
on_failure:
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: pipeline_error
