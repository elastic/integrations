format_version: "2.11.0"
name: dentigrid
title: "DentiGrid Active Deception & Threat Intelligence"
version: "1.0.0"
description: "Official Elastic Security integration for DentiGrid active deception fabric, honeypot traps, and zero-false-positive threat intelligence."
type: integration
categories:
  - security
  - threat_intel
  - network
conditions:
  kibana.version: "^8.11.0"
  elastic.subscription: basic
icons:
  - src: /img/icon.svg
    title: DentiGrid Icon
    size: 32x32
    type: image/svg+xml
  - src: /img/logo.svg
    title: DentiGrid Logo
    size: 128x128
    type: image/svg+xml
policy_templates:
  - name: threat
    title: "DentiGrid Threat Intelligence & Deception Logs"
    description: "Collect, normalize, and analyze high-fidelity threat deception telemetry from DentiGrid sensors, honeypot nodes, and canary assets into ECS v8.11."
    data_streams:
      - threat
    inputs:
      - type: httpjson
        title: "DentiGrid API Ingestion (HTTP JSON)"
        description: "Poll real-time threat events and honeynet telemetry from DentiGrid API Gateway (/api/attacks/recent)."
      - type: logfile
        title: "DentiGrid Local Log / Syslog Ingestion"
        description: "Ingest structured JSON and Syslog threat events emitted by local DentiGrid sensor daemons."
owner:
  github: DentiSystems
  name: DentiSystems Engineering & Strategic Operations
license: Apache-2.0
