format_version: "3.6.5"
name: dentigrid
title: "DentiGrid Active Deception & Threat Intelligence"
version: "1.0.0"
description: "Official Elastic Security integration for DentiGrid active deception fabric, honeypot traps, and zero-false-positive threat intelligence."
type: integration
categories:
  - security
  - threat_intel
  - network
conditions:
  kibana.version: "^9.4.0"
  elastic.subscription: basic
icons:
  - src: /img/dentigrid-logo.svg
    title: DentiGrid logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: threat
    title: "DentiGrid Threat Intelligence & Deception Logs"
    description: "Collect, normalize, and analyze high-fidelity threat deception telemetry from DentiGrid sensors, honeypot nodes, and canary assets into ECS."
    data_streams:
      - threat
    inputs:
      - type: cel
        title: "DentiGrid API Ingestion (CEL)"
        description: "Poll real-time threat events and honeynet telemetry from DentiGrid API Gateway."
      - type: filestream
        title: "DentiGrid Log Files"
        description: "Collect DentiGrid JSON events from local files with Elastic Agent."
source:
  license: Apache-2.0
owner:
  github: dectrax-security
  type: community
