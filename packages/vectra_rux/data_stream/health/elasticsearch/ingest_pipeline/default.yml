        convert:
          field: _ingest._value.ip_address
          tag: convert_connectivity_sensors_ip_address_to_ip_1e294ffb
          type: ip
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_ip_address_84882d9c
