      params:
        os_type:
          - linux
          - macos
          - unix
          - windows
          - ios
          - android
      source: |
        String os_family = ctx.host.os.full.toLowerCase();
        for (String os: params.os_type) {
          if (os_family.contains(os)) {
            ctx.host.os.put('type', os);
            return;
