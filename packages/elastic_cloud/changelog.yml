# newer versions go on top
- version: "1.0.0"
  changes:
    - description: Promote the Elastic Cloud integration to GA.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22222
- version: "0.1.4"
  changes:
    - description: Add alerting rules for password guessing, password spray, credential stuffing, a successful sign-in after repeated failures, impossible travel, a new country, a first-seen identity, and a credential used from many places, count Kibana user_login successes, ignore link-local and IPv6 unique-local addresses, tighten the sign-in, spray, and impossible-travel queries, document those rules in the README, and rename the Identity 360 dashboard asset to elastic_cloud-audit-identity-360.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22211
- version: "0.1.3"
  changes:
    - description: Add audit dashboard screenshots, rename Actor 360 to Identity 360, correct unusual-hour counts, travel lines, private-address labels, denied reads, and the cohort highlight, replace em dashes with hyphens in the audit dashboards, Discover sessions, and charts, and shorten the README so enablement and example queries stay in the audit trail documentation.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22204
- version: "0.1.2"
  changes:
    - description: Nullify unmapped api_key fields in Kibana queries and replace the audit logs search with an unfiltered event list.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22081
- version: "0.1.1"
  changes:
    - description: Query Kibana assets with ECS field names and add an audit logs saved search.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22081
- version: "0.1.0"
  changes:
    - description: Initial release of the Elastic Cloud integration with an assets-only serverless audit data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22081
