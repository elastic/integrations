---
description: Pipeline for parsing cisco_duo telephony logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - json:
      tag: json_event_original_to_json_287f93e5
      field: event.original
      target_field: json
      on_failure:
        - set:
            tag: set_event_kind_1ba30fcd
            field: event.kind
            value: pipeline_error
        - append:
            tag: append_error_message_4a5082e0
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - drop:
      tag: drop_3d6db8e0
      if: ctx.json?.response instanceof List && ctx.json.response.length == 0
  - fingerprint:
      tag: fingerprint_to_id_0c5ba50e
      fields:
        - json.timestamp
        - json.phone
        - json.context
        - json.type
      target_field: _id
      ignore_missing: true
  - date:
      tag: date_json_timestamp_eab81b12
      field: json.timestamp
      if: ctx.json?.timestamp != null
      formats:
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_15e8915f
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_context_to_cisco_duo_telephony_event_type_378061f2
      field: json.context
      target_field: cisco_duo.telephony.event_type
      ignore_missing: true
  - rename:
      tag: rename_json_credits_to_cisco_duo_telephony_credits_fa200ea8
      field: json.credits
      target_field: cisco_duo.telephony.credits
      ignore_missing: true
  - rename:
      tag: rename_json_phone_to_cisco_duo_telephony_phone_number_ec0ed400
      field: json.phone
      target_field: cisco_duo.telephony.phone_number
      ignore_missing: true
  - rename:
      tag: rename_json_type_to_cisco_duo_telephony_type_171ca5c6
      field: json.type
      target_field: cisco_duo.telephony.type
      ignore_missing: true
  - remove:
      tag: remove_json_29cdffdc
      field: json
      ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_9b078312
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
