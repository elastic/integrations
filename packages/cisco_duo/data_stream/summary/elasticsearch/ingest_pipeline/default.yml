---
description: Pipeline for parsing cisco_duo summary logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_timestamp_fab8596d
      field: "@timestamp"
      value: "{{{_ingest.timestamp}}}"
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_287f93e5
      field: event.original
      target_field: json
      on_failure:
        - set:
            tag: set_event_kind_1ba30fcd
            field: event.kind
            value: pipeline_error
        - append:
            tag: append_error_message_4a5082e0
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_response_admin_count_to_cisco_duo_summary_admin_count_83603614
      field: json.response.admin_count
      target_field: cisco_duo.summary.admin_count
  - rename:
      tag: rename_json_response_integration_count_to_cisco_duo_summary_integration_count_c0ea54de
      field: json.response.integration_count
      target_field: cisco_duo.summary.integration_count
  - rename:
      tag: rename_json_response_telephony_credits_remaining_to_cisco_duo_summary_telephony_credits_remaining_08c76756
      field: json.response.telephony_credits_remaining
      target_field: cisco_duo.summary.telephony_credits_remaining
  - rename:
      tag: rename_json_response_user_count_to_cisco_duo_summary_user_count_b7725146
      field: json.response.user_count
      target_field: cisco_duo.summary.user_count
  - remove:
      tag: remove_json_8e8e919a
      field: json
      if: ctx.json != null
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_9b078312
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
