---
description: Pipeline for parsing cisco_duo authentication logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_287f93e5
      field: event.original
      target_field: json
      on_failure:
        - set:
            tag: set_event_kind_1ba30fcd
            field: event.kind
            value: pipeline_error
        - append:
            tag: append_error_message_4a5082e0
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - drop:
      tag: drop_3d6db8e0
      if: ctx.json?.response instanceof List && ctx.json.response.length == 0
  - fingerprint:
      tag: fingerprint_to_id_9afd5450
      fields:
        - json.timestamp
        - json.txid
      target_field: _id
      ignore_missing: true
  - date:
      tag: date_json_timestamp_eab81b12
      field: json.timestamp
      if: ctx.json?.timestamp != null
      formats:
        - UNIX
      on_failure:
        - append:
            tag: append_error_message_15e8915f
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - date:
      field: json.isotimestamp
      tag: date_isotimestamp_5e6e7384
      target_field: cisco_duo.auth.isotimestamp
      formats:
        - ISO8601
      if: ctx.json?.isotimestamp != null && ctx.json.isotimestamp != ''
      on_failure:
        - remove:
            tag: remove_json_isotimestamp_bf343d4a
            field: json.isotimestamp
            ignore_missing: true
        - append:
            tag: append_error_message_b502a1d0
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_category_e43d8992
      field: event.category
      value: [authentication]
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - set:
      tag: set_event_outcome_ac05edb6
      field: event.outcome
      value: failure
  - set:
      tag: set_event_outcome_407d038a
      field: event.outcome
      value: success
      if: ctx.json?.result == 'success'
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: [info]
  - set:
      tag: set_event_reason_b97d39fe
      field: event.reason
      copy_from: json.reason
      ignore_failure: true
  - grok:
      tag: grok_json_access_device_ip_dcd77886
      field: json.access_device.ip
      patterns:
        - "^%{IPV4:json.access_device.ip}:%{PORT:json.access_device.port}$"
        - "^\\[%{IPV6:json.access_device.ip}\\]:%{PORT:json.access_device.port}$"
        - "^%{IPV6NOCOMPRESS:json.access_device.ip}:%{PORT:json.access_device.port}$"
        - "^%{IPV6:json.access_device.ip}%{IPV6PORTSEP}%{PORT:json.access_device.port}$"
      pattern_definitions:
        IPV6NOCOMPRESS: '([0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}'
        IPV6PORTSEP: '(?: port |[p#.])'
        PORT: '[0-9]+'
      ignore_missing: true
      ignore_failure: true
  - convert:
      tag: convert_json_access_device_ip_b0270dcf
      field: json.access_device.ip
      type: ip
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_json_access_device_ip_d490328d
            field: json.access_device.ip
        - append:
            tag: append_error_message_cb43a170
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_access_device_port_7abd622a
      field: json.access_device.port
      type: long
      ignore_missing: true
