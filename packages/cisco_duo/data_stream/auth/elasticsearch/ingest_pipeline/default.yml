      field: cisco_duo.auth.access_device.ip
      target_field: cisco_duo.auth.access_device.geo
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_96e44856
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - geoip:
      tag: geoip_cisco_duo_auth_access_device_ip_to_cisco_duo_auth_access_device_as_11ec811e
