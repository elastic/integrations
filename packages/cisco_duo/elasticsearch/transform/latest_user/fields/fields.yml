- name: cisco_duo.user
  type: group
  fields:
    - name: id
      type: keyword
      description: |
        The user's ID.
    - name: username
      type: keyword
      description: |
        The user's username.
    - name: realname
      type: keyword
      description: |
        The user's real name (or full name).
    - name: email
      type: keyword
      description: |
        The user's email address.
    - name: firstname
      type: keyword
      description: |
        The user's given name.
    - name: lastname
      type: keyword
      description: |
        The user's surname.
    - name: status
      type: keyword
      description: |
        The user's status. One of: active, bypass, disabled, or locked out.
    - name: is_enrolled
      type: boolean
      description: |
        Whether the user has completed Duo enrollment.
    - name: created
      type: date
      description: |
        The date and time the user was created in Duo Security.
    - name: last_login
      type: date
      description: |
        The date and time of the user's last successful login.
    - name: notes
      type: match_only_text
      description: |
        Notes about the user.
    - name: groups
      type: flattened
      description: |
        List of groups the user belongs to.
    - name: phones
      type: flattened
      description: |
        List of phones associated with the user.
    - name: tokens
      type: flattened
      description: |
        List of hardware tokens associated with the user.
    - name: webauthncredentials
      type: flattened
      description: |
        List of WebAuthn credentials associated with the user.
    - name: custom_attributes
      type: flattened
      description: |
        Custom attributes for the user.
    - name: aliases
      type: flattened
      description: |
        Map of alias usernames for the user.
    - name: lockout_reason
      type: keyword
      description: |
        The reason the user was locked out. Present when status is locked_out.
    - name: external_id
      type: keyword
      description: |
        The user's external ID from a directory service, if applicable.
    - name: last_directory_sync
      type: date
      description: |
        The date and time of the user's last directory sync.
    - name: u2ftokens
      type: flattened
      description: |
        List of U2F tokens associated with the user.
