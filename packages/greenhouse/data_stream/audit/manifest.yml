title: "Collect Greenhouse Audit Logs"
type: logs
streams:
  - input: cel
    title: "Collect Greenhouse Audit Logs"
    description: "Collect Greenhouse Audit Logs via the Greenhouse Audit Log API"
    enabled: true
    template_path: cel.yml.hbs
    vars:
      - name: initial_interval
        type: text
        title: Initial Interval
        description: How far back to look for events on the first run. Valid time units are h (hours). Maximum is 720h (30 days) due to Greenhouse data retention limits.
        multi: false
        show_user: true
        required: true
        default: 24h
      - name: interval
        type: text
        title: Interval
        description: Interval to poll the Greenhouse Audit Log API. Valid time units are s, m, h.
        multi: false
        show_user: false
        required: true
        default: 5m
      - name: batch_size
        type: integer
        title: Batch Size
        description: Number of events to request per API call. Must be between 100 and 500.
        multi: false
        required: false
        show_user: false
        default: 500
      - name: performer_ids
        type: text
        title: Performer IDs Filter
        description: Filter events by performer IDs (Greenhouse user IDs). Separate multiple IDs with commas.
        multi: false
        show_user: true
        required: false
      - name: event_types
        type: text
        title: Event Types Filter
        description: "Filter events by type: data_change_update, data_change_create, data_change_destroy, harvest_access, or action. Separate multiple types with commas."
        multi: false
        show_user: true
        required: false
      - name: enrich_rejections
        type: bool
        title: Enrich rejected application events
        multi: false
        required: true
        show_user: true
        default: false
        description: >-
          When an audit event records a candidate or prospect being rejected, look up the rejection reason and rejection notes/comments from the Harvest API and add them to the event. This audit event does not include an application ID, but Greenhouse also audits a separate "RejectionDetails" event under the same request.id that does; the Application is identified by correlating the two via request.id, and if that correlation is not exact, the event is emitted with an error instead of a guess. This requires the OAuth client to have read access to the Harvest "Rejection details" (harvest:rejection_details:list), "Rejection reasons" (harvest:rejection_reasons:show), and "Notes" (harvest:notes:list) endpoints. Lookups are batched per page of events: one rejection details request, one notes request, and one request per distinct rejection reason.
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        multi: false
        required: false
        show_user: false
        description: The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging.
      - name: tags
        type: text
        title: Tags
        multi: true
        show_user: false
        default:
          - forwarded
          - greenhouse-audit
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
