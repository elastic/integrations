input: cel
service: greenhouse
vars:
  url: http://{{Hostname}}:{{Port}}
  token_url: http://{{Hostname}}:{{Port}}/token
  harvest_url: http://{{Hostname}}:{{Port}}
  client_id: test_client_id
  client_secret: test_client_secret
  user_id: "12345"
  ssl:
    verification_mode: none
data_stream:
  vars:
    preserve_original_event: true
    initial_interval: 24h
    batch_size: 500
    enrich_rejections: true
    enable_request_tracer: true
assert:
  # TODO: add field-level assertions once the mock server fixture returns predictable rejection
  # enrichment data, so we can verify greenhouse.audit.event.rejection.application_id,
  # reason.id/name/type, notes, and rejected_at are actually populated — not just that
  # 4 events were emitted (which passes even if every Harvest lookup silently fails).
  hit_count: 4
