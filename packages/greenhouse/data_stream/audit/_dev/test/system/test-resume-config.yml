input: cel
service: greenhouse
vars:
  # The /resume mock rejects page 2 with HTTP 400, the way Greenhouse does in production.
  url: http://{{Hostname}}:{{Port}}/resume
  token_url: http://{{Hostname}}:{{Port}}/token
  harvest_url: http://{{Hostname}}:{{Port}}
  client_id: test_client_id
  client_secret: test_client_secret
  user_id: "12345"
  ssl:
    verification_mode: none
data_stream:
  vars:
    preserve_original_event: true
    initial_interval: 24h
    batch_size: 500
    enrich_rejections: true
    enable_request_tracer: true
    interval: 10s
assert:
  # 4 events from page 1 and 2 more from the search resumed with before_time; the boundary
  # event that the resumed search repeats collapses on the ingest pipeline fingerprint.
  hit_count: 6
  # Both rejection actions are enriched, which requires the action held across the rejected
  # page (res2ID) and the sibling read by the resumed search (res3ID). Exact values are
  # asserted by the script test in _dev/test/scripts/paging_resume.txt.
  fields_present:
    - greenhouse.audit.event.rejection.application_id
    - greenhouse.audit.event.rejection.reason.name
    - greenhouse.audit.event.rejection.reason.error
    - greenhouse.audit.event.rejection.notes
