# newer versions go on top
- version: "0.3.1"
  changes:
    - description: >-
        Fix the audit data stream getting stuck when the Greenhouse API rejects a page request
        with HTTP 400. The input now drops the rejected Pit-Id and resumes with a new search
        bounded by before_time, as the Greenhouse API documents, instead of resending the same
        Pit-Id on every poll.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22776
    - description: >-
        Fix the audit data stream stopping collection until the agent restarts after a poll that
        returned no events, including polls with no new audit events and polls that received
        HTTP 401 or 429.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/22776
- version: "0.3.0"
  changes:
    - description: >-
        Add optional rejection enrichment for "Candidate or Prospect rejected"
        audit events. When enabled, the integration correlates the rejection
        event to its accompanying RejectionDetails audit event via request.id,
        then fetches the rejection reason and notes from the Harvest API and
        adds them to the event under greenhouse.audit.event.rejection.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20257
    - description: >-
        Fix inverted OAuth token expiry check that caused the token to be reused
        up to 30 seconds after it expired, leading to avoidable 401 errors.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20257
- version: "0.2.1"
  changes:
    - description: Drop scalar performer.meta values that conflict with the object mapping.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21012
- version: "0.2.0"
  changes:
    - description: Add tags to ingest pipeline processors.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20573
- version: "0.1.0"
  changes:
    - description: Initial release.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/17347
