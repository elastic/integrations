# newer versions go on top
- version: "0.2.0"
  changes:
    - description: >-
        Add optional rejection enrichment for "Candidate or Prospect rejected"
        audit events. When enabled, the integration correlates the rejection
        event to its accompanying RejectionDetails audit event via request.id,
        then fetches the rejection reason and notes from the Harvest API and
        adds them to the event under greenhouse.audit.event.rejection.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20257
- version: "0.1.0"
  changes:
    - description: Initial release.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/17347
