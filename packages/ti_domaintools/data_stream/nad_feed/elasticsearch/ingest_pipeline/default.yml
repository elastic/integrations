---
description: Pipeline for processing nad feed
processors:
  - set:
      tag: set_ecs_version_dbf680ba
      field: ecs.version
      value: '8.17.0'
  - terminate:
      tag: data_collection_error_59f7570c
      if: ctx.error?.message != null
      description: error message set and no data to process.

  - rename:
      tag: rename_message_to_event_original_a7b1f822
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      tag: json_event_original_to_domaintools_32485161
      field: event.original
      target_field: domaintools

    ############################
    # Generic indicator fields #
    ############################

  - set:
      tag: set_threat_indicator_type_bc4f4ba5
      field: threat.indicator.type
      value: domain-name
  - set:
      tag: set_threat_indicator_name_46c4b8f6
      if: ctx.domaintools?.domain != null
      field: threat.indicator.name
      copy_from: domaintools.domain

    ####################
    # Event ECS fields #
    ####################
  - set:
      tag: set_event_kind_3410a97a
      field: event.kind
      value: enrichment
  - set:
      tag: set_event_category_4675e36d
      field: event.category
      value: ['threat']
  - set:
      tag: set_event_type_acbc82af
      field: event.type
      value: ['indicator']

on_failure:
- set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
- append:
    tag: append_tags_279d5a5c
    field: tags
    value: preserve_original_event
    allow_duplicates: false
- append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
