---
description: Pipeline for processing domain rdap feed
processors:
  - set:
      tag: set_ecs_version_f5923549
      field: ecs.version
      value: '8.17.0'

  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null
      description: error message set and no data to process.

  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      tag: json_event_original_to_domaintools_4eea6ad1
      field: event.original
      target_field: domaintools

  - set:
      tag: set_domaintools_first_request_timestamp_5cdd8a98
      if: ctx.domaintools?.raw_record?.first_request_timestamp != null
      field: domaintools.first_request_timestamp
      copy_from: domaintools.raw_record.first_request_timestamp

  - foreach:
      tag: foreach_domaintools_raw_record_requests_7de2ca88
      field: domaintools.raw_record.requests
      processor:
        append:
          tag: append_domaintools_requests_url
          field: domaintools.requests_url
          value: "{{{ _ingest._value.url }}}"

    ############################
    # Generic indicator fields #
    ############################

  - set:
      tag: set_threat_indicator_type_b65d5b6f
      field: threat.indicator.type
      value: domain-name
  - set:
      tag: set_threat_indicator_name_1bc8d54d
      if: ctx.domaintools?.domain != null
      field: threat.indicator.name
      copy_from: domaintools.domain

    ####################
    # Event ECS fields #
    ####################
  - set:
      tag: set_event_kind_a131107f
      field: event.kind
      value: enrichment
  - set:
      tag: set_event_category_cceb7c22
      field: event.category
      value: ['threat']
  - set:
      tag: set_event_type_97bb78b9
      field: event.type
      value: ['indicator']

  - remove:
      tag: remove_d27ddb54
      field:
        - domaintools.raw_record
        - domaintools.parsed_record.parsed_fields.conformance
        - domaintools.parsed_record.parsed_fields.dnssec
        - domaintools.parsed_record.parsed_fields.domain
        - domaintools.parsed_record.parsed_fields.domain_statuses
        - domaintools.parsed_record.parsed_fields.links
        - domaintools.parsed_record.parsed_fields.unclassified_emails
        - domaintools.parsed_record.registrar_request_url
        - domaintools.parsed_record.registry_request_url
      ignore_missing: true

# Do not add a cleaner processor below this point. null/blank values are expected.

on_failure:
- set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
- append:
    tag: append_tags
    field: tags
    value: preserve_original_event
    allow_duplicates: false
- append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
