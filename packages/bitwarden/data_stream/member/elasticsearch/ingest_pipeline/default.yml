---
description: Pipeline for processing member logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: 8.11.0
  - rename:
      field: message
      target_field: event.original
      tag: rename_message_a7b1f822
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_facc4822
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      field: event.original
      tag: json_decoding_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_d18f0a7c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - drop:
      if: ctx.json?.data != null && ctx.json.data.isEmpty()
      tag: drop_empty_events_5ebaa6cd
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - set:
      field: event.category
      tag: set_event_category_5b3c8dc9
      value: [iam]
  - set:
      field: event.type
      tag: set_event_type_8f0bd44b
      value: [user]
  - convert:
      field: json.type
      tag: convert_type_to_string_6fbc63b4
      target_field: bitwarden.member.type.value
      type: string
      ignore_missing: true
  - script:
      lang: painless
      if: ctx.bitwarden?.member?.type?.value != null
      tag: script_to_set_organization_user_type_6ca2bde6
      description: Set Organization user type.
      # Organization user type
      # https://github.com/bitwarden/server/blob/master/src/Core/Enums/OrganizationUserType.cs
      params:
        OrganizationUserType:
          - Owner
          - Admin
          - User
          - Manager
          - Custom
      source: |-
        def OrganizationUserTypeValue = Integer.parseInt(ctx.bitwarden.member.type.value);
        if (OrganizationUserTypeValue >= 0 && OrganizationUserTypeValue < params.OrganizationUserType.length) {
          ctx.bitwarden.member.type.put('name', params['OrganizationUserType'][OrganizationUserTypeValue]);
        }
      on_failure:
        - append:
            tag: append_error_message_4be07a85
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.accessAll
      tag: convert_accessAll_to_boolean_282506f4
      target_field: bitwarden.member.access_all
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_a4c059ec
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.externalId
      target_field: bitwarden.member.external.id
      tag: rename_externalId_2b300b68
      ignore_missing: true
  - convert:
      field: json.resetPasswordEnrolled
      tag: convert_resetPasswordEnrolled_to_boolean_e40cf3ea
      target_field: bitwarden.member.reset_password_enrolled
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_a6cdfa7d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.object
      target_field: bitwarden.object
      tag: rename_object_bf84d3fe
      ignore_missing: true
  - rename:
      field: json.id
      target_field: bitwarden.member.id
      tag: rename_id_05c15c1f
      ignore_missing: true
  - append:
      field: related.user
      value: '{{{bitwarden.member.id}}}'
      tag: append_id_to_related_user_e1b4ac45
      allow_duplicates: false
      if: ctx.bitwarden?.member?.id != null
  - set:
      field: user.id
      copy_from: bitwarden.member.id
      tag: set_user_id_c09b5a98
      ignore_empty_value: true
  - rename:
      field: json.userId
      target_field: bitwarden.member.user.id
      tag: rename_userId_2afcb19a
      ignore_missing: true
  - append:
      field: related.user
      value: '{{{bitwarden.member.user.id}}}'
      tag: append_user_id_to_related_user_12e8a9e8
      allow_duplicates: false
      if: ctx.bitwarden?.member?.user?.id != null
  - rename:
      field: json.name
      target_field: bitwarden.member.name
      tag: rename_name_c1b69735
      ignore_missing: true
  - set:
      field: user.name
      copy_from: bitwarden.member.name
      tag: set_user_name_1540d803
      ignore_empty_value: true
  - rename:
      field: json.email
      target_field: bitwarden.member.email
      tag: rename_email_bbb05950
      ignore_missing: true
  - set:
      field: user.email
      copy_from: bitwarden.member.email
      tag: set_user_email_1266ec47
      ignore_empty_value: true
  - convert:
      field: json.twoFactorEnabled
      tag: convert_twoFactorEnabled_to_boolean_e9377f00
      target_field: bitwarden.member.two_factor_enabled
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_3ed95a52
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.status
      tag: convert_status_to_string_c0ba05d2
      target_field: bitwarden.member.status.value
      type: string
      ignore_missing: true
  - script:
      lang: painless
      if: ctx.bitwarden?.member?.status?.value != null
      tag: script_to_set_organization_user_status_7185af79
      description: Set Organization user status type.
      # Organization user status type
      # https://github.com/bitwarden/server/blob/master/src/Core/Enums/OrganizationUserStatusType.cs
      params:
        OrganizationUserStatusType:
          - Revoked
          - Invited
          - Accepted
          - Confirmed
      source: |-
        def OrganizationUserStatusTypeValue = Integer.parseInt(ctx.bitwarden.member.status.value)+1;
        if (OrganizationUserStatusTypeValue >= 0 && OrganizationUserStatusTypeValue < params.OrganizationUserStatusType.length) {
          ctx.bitwarden.member.status.put('name', params['OrganizationUserStatusType'][OrganizationUserStatusTypeValue]);
        }
      on_failure:
        - append:
            tag: append_error_message_33979249
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_json_collections_54ce33c7
      field: json.collections
      if: ctx.json?.collections instanceof List
      processor:
        convert:
          field: _ingest._value.readOnly
          target_field: _ingest._value.read_only
          tag: convert_collection_readOnly_to_boolean_4db55935
          type: boolean
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_readOnly_00a2f6cd
                field: _ingest._value.readOnly
                ignore_missing: true
            - append:
                tag: append_error_message_e8f01492
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_json_collections_73d53888
      field: json.collections
      if: ctx.json?.collections instanceof List
      processor:
        remove:
          field:
            - _ingest._value.readOnly
          tag: remove_readOnly_7dc4cbfe
          ignore_missing: true
      ignore_failure: true
  - rename:
      field: json.collections
      target_field: bitwarden.member.collection
      tag: rename_collections_76c62a51
      ignore_missing: true
  - append:
      field: related.user
      value: '{{{user.name}}}'
      tag: append_user_name_to_related_user_325195a6
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      value: '{{{user.email}}}'
      tag: append_user_email_to_related_user_b9ac313b
      allow_duplicates: false
      if: ctx.user?.email != null
  - remove:
      field:
        - json
      tag: remove_json_f3d169b2
      ignore_missing: true
  - remove:
      field:
        - bitwarden.member.id
        - bitwarden.member.name
        - bitwarden.member.email
      tag: remove_duplicate_custom_fields_1928a6ea
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - script:
      lang: painless
      description: Drops null/empty values recursively.
      tag: painless_remove_null_f6a89620
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      value: pipeline_error
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_9b078312
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
