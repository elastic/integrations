- name: abusech.threatfox
  type: group
  description: All fields related to AbuseCH Threat Fox indicators.
  fields:
    - name: tags
      type: keyword
      description: >
        A list of tags associated with the queried malware sample.

    - name: confidence_level
      type: long
      description: >
        Confidence level between 0-100.

    - name: malware
      type: keyword
      description: >
        The malware associated with the IOC.

    - name: threat_type
      type: keyword
      description: >
        The type of threat.

    - name: threat_type_desc
      type: keyword
      description: >-
        The threat descsription.
    - name: deleted_at
      type: date
      description: |
        The indicator expiration timestamp.
    - name: ioc_expiration_duration
      type: keyword
      description: |
        The configured expiration duration.
    - name: sightings
      type: long
      description: >
        The number of sightings of the IOC.
    - name: comment
      type: match_only_text
      description: >
        An optional comment from the reporter.
    - name: is_compromised
      type: boolean
      description: >
        Whether the shared IOC is a compromised resource.
    - name: credits
      type: group
      description: >
        Reporter reward credits associated with the IOC.
      fields:
        - name: credits_from
          type: keyword
          description: >
            The platform that awarded the credits.
        - name: credits_amount
          type: long
          description: >
            The number of credits awarded.
    - name: malware_samples
      type: group
      description: >
        Malware samples associated with the IOC.
      fields:
        - name: timestamp
          type: date
          description: >
            The timestamp when the sample was seen.
        - name: malware_bazaar
          type: keyword
          description: >
            The community API URL to the sample on MalwareBazaar.
        - name: malware_bazaar_url
          type: keyword
          description: >
            The URL to the sample on MalwareBazaar.
        - name: md5_hash
          type: keyword
          description: >
            The MD5 hash of the sample.
        - name: sha256_hash
          type: keyword
          description: >
            The SHA256 hash of the sample.
