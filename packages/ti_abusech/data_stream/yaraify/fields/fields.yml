- name: abusech.yaraify
  type: group
  description: Fields related to Abuse.ch YARAify YARA rule metadata.
  fields:
    - name: date
      type: date
      description: Date when the YARA rule was written (community API). Kept separate from date_written.
    - name: time_stamp
      type: date
      description: Timestamp when the YARA rule was observed (community API). Kept separate from first_seen.
    - name: date_written
      type: date
      description: Date when the YARA rule was written (commercial API). Kept separate from date.
    - name: deleted_at
      type: date
      description: The indicator expiration timestamp.
    - name: ioc_expiration_duration
      type: keyword
      description: The configured indicator expiration duration.
    - name: malpedia_family
      type: keyword
      description: Malware family name using the Malpedia naming scheme.
    - name: yarahub_author_twitter
      type: keyword
      description: Twitter handle of the YARA rule author on YARAhub.
    - name: yarahub_license
      type: keyword
      description: License under which the YARA rule is shared.
    - name: yarahub_rule_sharing_tlp
      type: keyword
      description: Traffic Light Protocol classification for sharing the YARA rule.
