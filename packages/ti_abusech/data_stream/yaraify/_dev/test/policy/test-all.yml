vars:
  api_type: commercial
  auth_key: test_auth_key
  username: test@example.com
  password: test-password
  commercial_url: https://api.spamhaus.com
  enable_request_tracer: true
data_stream:
  vars:
    url: https://api.example.com
    http_client_timeout: 60s
    proxy_url: http://proxy.example.com:8080
    interval: 30m
    initial_interval: 48h
    page_size: 50
    ioc_expiration_duration: 60d
    tags:
      - forwarded
      - abusech-yaraify
      - test-policy
    preserve_original_event: true
    processors: |
      - add_fields:
          target: project
          fields:
            name: myproject
            id: '574734885120952459'
