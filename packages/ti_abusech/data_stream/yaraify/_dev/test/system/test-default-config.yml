input: cel
service: abusech
wait_for_data_timeout: 1m
data_stream:
  vars:
    url: http://{{Hostname}}:{{Port}}/api/v1/
    preserve_original_event: true
    ioc_expiration_duration: 5d
    interval: 5m
vars:
  enable_request_tracer: true
  api_type: community
  auth_key: test_auth_key
assert:
  hit_count: 3
