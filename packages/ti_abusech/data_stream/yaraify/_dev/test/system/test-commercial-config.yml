input: cel
service: abusech
wait_for_data_timeout: 1m
data_stream:
  vars:
    url: http://{{Hostname}}:{{Port}}
    interval: 5m
    initial_interval: 720h
    page_size: 2
    preserve_original_event: true
    ioc_expiration_duration: 5d
vars:
  enable_request_tracer: true
  api_type: commercial
  username: test@example.com
  password: test-password
assert:
  hit_count: 3
