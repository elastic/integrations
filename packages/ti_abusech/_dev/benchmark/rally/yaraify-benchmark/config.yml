      - "CC BY-SA 4.0"
      - "CC0 1.0"
      - "MIT"
  - name: yarahub_reference_link
    cardinality: 10000
  - name: yarahub_reference_md5
    cardinality: 100000
  - name: yarahub_rule_matching_tlp
    enum:
      - "TLP:WHITE"
      - "TLP:GREEN"
      - "TLP:AMBER"
  - name: yarahub_rule_sharing_tlp
    enum:
