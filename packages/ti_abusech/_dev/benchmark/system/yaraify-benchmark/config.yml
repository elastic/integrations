fields:
  - name: timestamp
    period: -24h # one day
  - name: duration_start
    enum:
      - "-1h"
      - "-2h"
      - "-3h"
  - name: author
    cardinality: 1000
  - name: description
    cardinality: 10000
  - name: malpedia_family
    cardinality: 1000
  - name: rule_name
    cardinality: 100000
  - name: yarahub_author_twitter
    cardinality: 1000
  - name: yarahub_license
    enum:
      - "CC BY-SA 4.0"
      - "CC0 1.0"
      - "MIT"
  - name: yarahub_reference_link
    cardinality: 10000
  - name: yarahub_reference_md5
    cardinality: 100000
  - name: yarahub_rule_matching_tlp
    enum:
      - "TLP:WHITE"
      - "TLP:GREEN"
      - "TLP:AMBER"
  - name: yarahub_rule_sharing_tlp
    enum:
      - "TLP:WHITE"
      - "TLP:GREEN"
      - "TLP:AMBER"
  - name: yarahub_uuid
    cardinality: 100000
