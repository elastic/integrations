---
description: Benchmark 100000 yaraify events ingested
input: cel
vars:
  enable_request_tracer: true
  api_type: commercial
  username: test@example.com
  password: test-password
data_stream:
  name: yaraify
  vars:
    url: "http://svc-abusech:8080"
    preserve_original_event: true
    ioc_expiration_duration: 5d
warmup_time_period: 2s
corpora:
  input_service:
    name: abusech
  generator:
    total_events: 100000
    template:
      path: ./yaraify-benchmark/template.ndjson
      type: gotext
    config:
      path: ./yaraify-benchmark/config.yml
    fields:
      path: ./yaraify-benchmark/fields.yml
