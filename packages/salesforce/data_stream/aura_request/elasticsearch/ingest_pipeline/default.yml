---
description: Pipeline for parsing Salesforce AuraRequest logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '8.11.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original
      target_field: json
      if: ctx.event?.original != null

  # The Salesforce input surfaces the same AuraRequest events through two collection
  # methods that differ only in field naming and JSON types. Each sub-pipeline
  # normalises its own source shape; everything below the routing is shared so that
  # both collection methods produce the same document.
  - pipeline:
      name: '{{ IngestPipeline "eventlogfile" }}'
      tag: pipeline_eventlogfile
      if: ctx.event?.provider == 'EventLogFile'
  - pipeline:
      name: '{{ IngestPipeline "object" }}'
      tag: pipeline_object
      if: ctx.event?.provider == 'Object'

  # populate ECS fields

  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - set:
      field: event.action
      tag: set_event_action
      value: aura-request
  - append:
      field: event.category
      tag: append_web_into_event_category
      value: web
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_access_into_event_type
      value: access
      allow_duplicates: false
  # REQUEST_STATUS is blank on virtually every AuraRequest row and is not exposed at
  # all by the object collection method, so event.outcome stays unset unless a status
  # code is actually present. A blank status must not be read as success. Even `S`
  # only describes the HTTP disposition of the Aura request: Salesforce documents that
  # an Apex controller exception is still recorded as `S`.
  - set:
      field: event.outcome
      tag: set_event_outcome_to_success
      value: success
      if: ctx.salesforce?.aura_request?.request_status != null && ['S', 'R'].contains(ctx.salesforce.aura_request.request_status)
  - set:
      field: event.outcome
      tag: set_event_outcome_to_failure
      value: failure
      if: ctx.salesforce?.aura_request?.request_status != null && ['F', 'A', 'N'].contains(ctx.salesforce.aura_request.request_status)
  - script:
      lang: painless
      tag: script_set_event_duration
      description: Converts the request run time from the milliseconds reported by Salesforce to the nanoseconds required by event.duration.
      if: ctx.salesforce?.aura_request?.run_time != null
      source: |-
        ctx.event = ctx.event ?: [:];
        ctx.event.duration = ctx.salesforce.aura_request.run_time * 1000000L;

  # url.*

  - uri_parts:
      field: url.original
      tag: uri_parts_url_original
      ignore_missing: true
      description: >-
        The Aura request URI is an absolute path with no scheme or authority, so `uri_parts` emits those
        components as explicit nulls, and a URI such as `/one/one.app#` parses to an empty fragment. Both
        are dropped by the cleanup at the end of the pipeline.
      on_failure:
        - append:
            field: error.message
            tag: append_uri_parts_failure_into_error_message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'

  # user_agent.*

  - grok:
      field: _temp.user_agent
      tag: grok_user_agent
      patterns:
        - '^%{NONNEGINT:salesforce.aura_request.user_agent_code}$'
        - '^%{GREEDYDATA:user_agent.original}$'
      ignore_missing: true
      description: Salesforce declared this field as a numeric client code up to API version 60.0 and as a string from API version 65.0, while the field description still describes the numeric form. Legacy numeric codes are kept in a dedicated field so that only real User-Agent headers reach the user_agent parser.
  - user_agent:
      field: user_agent.original
      tag: user_agent_user_agent_original
      ignore_missing: true
      if: ctx.user_agent?.original != null

  # source.*

  - geoip:
      field: source.ip
      tag: geoip_source_ip
      target_field: source.geo
      ignore_missing: true
      if: ctx.source?.ip != null
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      tag: geoip_source_asn
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      if: ctx.source?.ip != null
  - rename:
      field: source.as.asn
      tag: rename_source_as_asn_to_source_as_number
      target_field: source.as.number
      ignore_missing: true
  - rename:
      field: source.as.organization_name
      tag: rename_source_as_organization_name_to_source_as_organization_name
      target_field: source.as.organization.name
      ignore_missing: true

  # salesforce.aura_request.actions

  - script:
      lang: painless
      tag: script_parse_action_message
      description: >-
        Splits ACTION_MESSAGE into one object per invoked Aura action. Each `;`-separated
        segment has the form `<actionId>$<scheme>://<controller>/ACTION$<method>=<milliseconds>`,
        where the leading number is an Aura client-assigned action id rather than a
        positional index. Segments that do not match the grammar are skipped instead of
        failing the document.
      if: ctx.salesforce?.aura_request?.action_message != null
      source: |-
        def raw = ctx.salesforce.aura_request.action_message;
        if (!(raw instanceof String) || raw.isEmpty()) {
          return;
        }
        def actions = new ArrayList();
        for (def segment : raw.splitOnToken(';')) {
          def part = segment.trim();
          int equals = part.lastIndexOf('=');
          if (equals < 1) {
            continue;
          }
          def descriptor = part.substring(0, equals);
          def durationText = part.substring(equals + 1);
          int idEnd = descriptor.indexOf('$');
          int schemeEnd = descriptor.indexOf('://');
          int actionStart = descriptor.indexOf('/ACTION$');
          if (idEnd < 1 || schemeEnd <= idEnd || actionStart < schemeEnd + 3) {
            continue;
          }
          def action = new HashMap();
          action.put('id', descriptor.substring(0, idEnd));
          action.put('scheme', descriptor.substring(idEnd + 1, schemeEnd));
          action.put('controller', descriptor.substring(schemeEnd + 3, actionStart));
          action.put('method', descriptor.substring(actionStart + 8));
          boolean numeric = !durationText.isEmpty();
          for (int i = 0; i < durationText.length(); i++) {
            if (!Character.isDigit(durationText.charAt(i))) {
              numeric = false;
              break;
            }
          }
          if (numeric) {
            action.put('duration', Long.parseLong(durationText));
          }
          actions.add(action);
        }
        if (!actions.isEmpty()) {
          ctx.salesforce.aura_request.actions = actions;
        }

  # related.*

  - append:
      field: related.ip
      tag: append_source_ip_into_related_ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      field: related.user
      tag: append_user_id_into_related_user
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null
  - append:
      field: related.user
      tag: append_salesforce_user_id_into_related_user
      value: '{{{salesforce.aura_request.user_id}}}'
      allow_duplicates: false
      if: ctx.salesforce?.aura_request?.user_id != null

  # Cleanup

  - remove:
      field:
        - json
        - _temp
      tag: remove_temporary_fields
      ignore_missing: true
  - script:
      lang: painless
      tag: script_to_drop_null_values
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      field: tags
      tag: append_preserve_original_event_into_tags
      value: preserve_original_event
      allow_duplicates: false
      description: A document that a processor could not handle keeps its original message so that the failure can be investigated.
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event_into_tags_on_failure
      value: preserve_original_event
      allow_duplicates: false
