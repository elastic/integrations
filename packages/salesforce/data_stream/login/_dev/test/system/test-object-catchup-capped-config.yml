# EDGE: lookback is 1h but the per-poll cap is 2 windows, so only 10m is collected.
input: salesforce
service: salesforce
vars:
  instance_url: http://{{Hostname}}:{{Port}}
  jwt_enabled: false
  username: temp_user
  client_id: temp_client_id
  client_secret: forty_characters_long_secret_key
  password: temp_password
  token_url: http://{{Hostname}}:{{Port}}
data_stream:
  vars:
    initial_interval: 1h
    real_time_period: 5m
    real_time_batch_max_windows: 2
    preserve_original_event: true
    event_log_file: false
    object: true
assert:
  hit_count: 2
