# SUCCESS: two bounded windows in one poll return the SAME EventIdentifier. The
# EventIdentifier _id fingerprint must collapse both into a single document, so
# the count settles at 1 even though two rows were fetched (api 68.0).
input: salesforce
service: salesforce
vars:
  instance_url: http://{{Hostname}}:{{Port}}
  jwt_enabled: false
  username: temp_user
  client_id: temp_client_id
  client_secret: forty_characters_long_secret_key
  password: temp_password
  token_url: http://{{Hostname}}:{{Port}}
data_stream:
  vars:
    api_version: "68.0"
    initial_interval: 10m
    real_time_period: 5m
    real_time_batch_max_windows: 12
    preserve_original_event: true
    event_log_file: false
    object: true
assert:
  hit_count: 1
