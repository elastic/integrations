# SUCCESS: a dense window follows nextRecordsUrl and ingests every page (API v59.0).
input: salesforce
service: salesforce
vars:
  instance_url: http://{{Hostname}}:{{Port}}
  jwt_enabled: false
  username: temp_user
  client_id: temp_client_id
  client_secret: forty_characters_long_secret_key
  password: temp_password
  token_url: http://{{Hostname}}:{{Port}}
data_stream:
  vars:
    api_version: "59.0"
    initial_interval: ""
    real_time_period: 1h
    preserve_original_event: true
    event_log_file: false
    object: true
assert:
  hit_count: 2
  fields_present:
    - event.id
