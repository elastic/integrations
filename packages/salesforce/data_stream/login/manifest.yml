type: logs
title: Salesforce login logs
streams:
  - input: salesforce
    vars:
      - name: api_version
        type: text
        title: API Version
        description: API Version of Salesforce.
        multi: false
        required: true
        show_user: false
        default: 56.0
      - name: event_log_file
        type: bool
        title: EventLogFile Data Collection
        description: "Enable collection from EventLogFile."
        multi: false
        required: true
        show_user: true
        default: true
      - name: object
        type: bool
        title: Real-Time Object Data Collection
        description: "Enable collection from real-time events (LoginEvent). When enabled, catch-up is automatically collected in bounded EventDate windows to avoid unbounded SOQL queries."
        multi: false
        required: true
        show_user: true
        default: true
      - name: elf_period
        type: text
        title: EventLogFile Period
        description: "Polling interval for EventLogFile. Supported units: h, m, s."
        multi: false
        required: false
        show_user: true
        default: 1h
      - name: real_time_period
        type: text
        title: Real-Time Events Period
        description: "Polling interval for real-time events. This also controls the automatic batch window size. Supported units: h, m, s."
        multi: false
        required: false
        show_user: true
        default: 5m
      - name: real_time_batch_max_windows
        type: integer
        title: Max Real-Time Batch Windows Per Poll
        description: "Maximum number of bounded LoginEvent windows to process per poll. Increase to catch up faster during large backfills; decrease to reduce Salesforce API pressure. Must be greater than 0."
        multi: false
        required: false
        show_user: false
        default: 12
      - name: initial_interval
        type: text
        title: Initial Interval
        description: "How far back to fetch historical data on the first run. For EventLogFile, this is a CreatedDate lookback on the first query. For real-time LoginEvent collection, backfill is drained in bounded windows (window size is the real-time period, up to 12 windows per poll by default), so a 168h lookback can take many polls to catch up. Supported units: h, m, s."
        multi: false
        required: true
        show_user: true
        default: 168h
      - name: log_file_interval
        type: text
        title: EventLogFile Interval
        description: "EventLogFile granularity. Supported values: Hourly or Daily."
        multi: false
        required: false
        show_user: true
        default: Hourly
      - name: resource_timeout
        type: text
        title: Request Timeout
        description: "Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h. Increase this value if log collection times out while downloading large EventLogFile data."
        multi: false
        required: false
        show_user: false
        default: 30s
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - salesforce-login
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
    template_path: salesforce.yml.hbs
    title: Salesforce Login logs
    description: Collect Salesforce Login logs.
