type: logs
title: Salesforce logout logs
streams:
  - input: salesforce
    vars:
      - name: api_version
        type: text
        title: API Version
        description: API Version of Salesforce.
        multi: false
        required: true
        show_user: false
        default: 56.0
      - name: event_log_file
        type: bool
        title: EventLogFile Data Collection
        description: "Enable collection from EventLogFile."
        multi: false
        required: true
        show_user: true
        default: true
      - name: object
        type: bool
        title: Real-Time Object Data Collection
        description: "Enable collection of real-time logout events (LogoutEvent) via the Real-Time Event Monitoring API."
        multi: false
        required: true
        show_user: true
        default: true
      - name: elf_period
        type: text
        title: EventLogFile Period
        description: "Polling interval for EventLogFile. Supported units: h, m, s."
        multi: false
        required: false
        show_user: true
        default: 1h
      - name: real_time_period
        type: text
        title: Real-Time Events Period
        description: "How often to poll for real-time logout events. By default this also sets the size of each catch-up window when backfilling. Override the window with the advanced Real-Time Catch-Up Window setting if you need smaller queries without polling more often. Supported units: h, m, s."
        multi: false
        required: false
        show_user: true
        default: 5m
      - name: real_time_batch_window
        type: text
        title: Real-Time Catch-Up Window
        description: "Advanced. Time span of each catch-up query. Leave empty to use the Real-Time Events Period. Set a smaller value when a single period still returns too many Salesforce rows. Supported units: h, m, s."
        multi: false
        required: false
        show_user: false
      - name: real_time_batch_max_windows
        type: integer
        title: Max Real-Time Catch-Up Windows Per Poll
        description: "Advanced. Maximum number of catch-up windows the agent processes in one poll. With the default 5m period and 12 windows, each poll catches up at most 1 hour of backlog. Raise to catch up faster after downtime or a large initial interval, at the cost of more Salesforce API calls. Must be greater than 0."
        multi: false
        required: false
        show_user: false
        default: 12
      - name: initial_interval
        type: text
        title: Initial Interval
        description: "How far back to fetch historical data on the first run. Applies to both EventLogFile and real-time logout events. Real-time backfill is processed gradually over several polls to protect Salesforce API limits, so a large value can take a while to fully catch up. Supported units: h, m, s."
        multi: false
        required: true
        show_user: true
        default: 168h
      - name: log_file_interval
        type: text
        title: EventLogFile Interval
        description: "EventLogFile granularity. Supported values: Hourly or Daily."
        multi: false
        required: false
        show_user: true
        default: Hourly
      - name: resource_timeout
        type: text
        title: Request Timeout
        description: "Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h. Increase this value if log collection times out while downloading large EventLogFile data."
        multi: false
        required: false
        show_user: false
        default: 30s
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - salesforce-logout
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
    template_path: salesforce.yml.hbs
    title: Salesforce Logout logs
    description: Collect Salesforce Logout logs.
