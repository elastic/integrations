      tag: foreach_properties_flows_to_convert_packets_received_to_long_557c68ca
      if: ctx.json?.properties?.flows instanceof List
      processor:
        foreach:
          tag: foreach_flows_to_convert_packets_received_to_long_09ec0ae6
          field: _ingest._value.flows
          ignore_failure: true
          processor:
            foreach:
              tag: foreach_tuples_to_convert_packets_received_to_long_74721d37
              field: _ingest._value.tuples
              ignore_failure: true
              processor:
                convert:
                  field: _ingest._value.packets.received
                  tag: convert_packets_received_to_long_d333c7ad
                  type: long
                  ignore_missing: true
                  on_failure:
                    - remove:
                        tag: remove_ingest_value_packets_received_93a96276
