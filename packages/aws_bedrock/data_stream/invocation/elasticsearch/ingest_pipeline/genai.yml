  - script:
      tag: script_aws_bedrock_invocation_guardrail_details_a16a5805
      description: >-
        Add the guardrail version and ARN from the Converse request guardrailConfig
        (guardrailIdentifier counts as the ARN only when it is one) and from the
        appliedGuardrailDetails of the guardrail trace assessments (Converse trace.guardrail,
        InvokeModel amazon-bedrock-trace.guardrail). A guardrailId from appliedGuardrailDetails
        that is not yet in aws_bedrock.invocation.guardrail.id is added; values are deduplicated
        and sorted.
      lang: painless
      if: ctx._temp?.genai != null
      source: |
        def dig(def o, List keys) {
          def cur = o;
          for (def k : keys) {
            if (!(cur instanceof Map)) {
              return null;
            }
            cur = cur.get(k);
          }
          return cur;
        }
        void addAssessment(def a, Set ids, Set versions, Set arns) {
          if (a instanceof List) {
            for (def x : a) {
              addAssessment(x, ids, versions, arns);
            }
            return;
          }
          if (!(a instanceof Map) || !(a.appliedGuardrailDetails instanceof Map)) {
            return;
          }
          Map d = a.appliedGuardrailDetails;
          if (d.guardrailId != null) {
            ids.add(d.guardrailId.toString());
          }
          if (d.guardrailVersion != null) {
            versions.add(d.guardrailVersion.toString());
          }
          if (d.guardrailArn != null) {
            arns.add(d.guardrailArn.toString());
          }
        }
        void addById(def m, Set ids, Set versions, Set arns) {
          if (m instanceof List) {
            for (def x : m) {
              addById(x, ids, versions, arns);
            }
            return;
          }
          if (!(m instanceof Map)) {
            return;
          }
          for (def v : m.values()) {
            addAssessment(v, ids, versions, arns);
          }
        }

        Set ids = new TreeSet();
        Set versions = new TreeSet();
        Set arns = new TreeSet();
        def req = ctx._temp.genai.req;
        def identifier = dig(req, ['guardrailConfig', 'guardrailIdentifier']);
        if (identifier instanceof String && identifier.startsWith('arn:')) {
          arns.add(identifier);
        }
        def version = dig(req, ['guardrailConfig', 'guardrailVersion']);
        if (version != null) {
          versions.add(version.toString());
        }
        def resp = ctx._temp.genai.resp;
        List objs = resp instanceof List ? resp : [resp];
        for (def o : objs) {
          if (!(o instanceof Map)) {
            continue;
          }
          for (def g : [dig(o, ['trace', 'guardrail']), dig(o, ['amazon_bedrock_trace', 'guardrail'])]) {
            if (!(g instanceof Map)) {
              continue;
            }
            addById(g.inputAssessment, ids, versions, arns);
            addById(g.outputAssessments, ids, versions, arns);
            addById(g.input, ids, versions, arns);
            addById(g.outputs, ids, versions, arns);
          }
        }
        if (ids.isEmpty() && versions.isEmpty() && arns.isEmpty()) {
          return;
        }
        Map inv = ctx.aws_bedrock.invocation;
        inv.guardrail = inv.guardrail instanceof Map ? inv.guardrail : new HashMap();
        if (!ids.isEmpty()) {
          Set merged = new TreeSet();
          def existing = inv.guardrail.id;
          if (existing instanceof List) {
            merged.addAll(existing);
          } else if (existing != null) {
            merged.add(existing);
          }
          if (!merged.containsAll(ids)) {
            merged.addAll(ids);
            inv.guardrail.id = new ArrayList(merged);
          }
        }
        if (!versions.isEmpty()) {
          inv.guardrail.version = new ArrayList(versions);
        }
        if (!arns.isEmpty()) {
          inv.guardrail.arn = new ArrayList(arns);
        }
  - grok:
      tag: grok_request_id_from_s3_object_key_8b712780
      description: >-
        E records have no envelope and so no requestId. Take it from the S3 data-prefix object
        key (.../data/<requestId>_input.json.gz or _output.json.gz) to correlate the body with
        its envelope record.
      field: aws.s3.object.key
      patterns:
        - '^(?:.*/)?data/%{BEDROCK_REQUEST_ID:aws_bedrock.invocation.request_id}_(?:input|output)\.json(?:\.gz)?$'
      pattern_definitions:
        BEDROCK_REQUEST_ID: '[^/_]+'
      if: ctx._temp?.genai?.e == true && ctx.aws_bedrock?.invocation?.request_id == null && ctx.aws?.s3?.object?.key instanceof String
      ignore_failure: true
  - remove:
      tag: remove_temp_genai_781d9f33
      field: _temp
      ignore_missing: true
on_failure:
  - append:
      tag: append_error_message_genai_695bad96
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}' failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_pipeline_error_to_event_kind_genai_7240029d
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_preserve_original_event_genai_bc774883
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - remove:
      tag: remove_temp_genai_on_failure_ea7ed019
      field: _temp
      ignore_missing: true
