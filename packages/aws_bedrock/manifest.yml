format_version: 3.6.4
name: aws_bedrock
title: Amazon Bedrock
description: Collect Amazon Bedrock model invocation logs and runtime metrics with Elastic Agent.
type: integration
version: 2.0.0
categories:
  - aws
  - cloud
  - observability
  - security
conditions:
  kibana:
    version: "^9.6.0"
  elastic:
    subscription: basic
  # auth.aws.use_cloud_connectors (Identity Federation) requires Elastic Agent 9.6.0+.
  agent:
    version: "^9.6.0"
policy_templates:
  - name: aws_bedrock
    title: Amazon Bedrock
    description: Collect Amazon Bedrock model invocation logs with Elastic Agent.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        organization: security
        division: engineering
        team: security-service-integrations
    inputs:
      - type: aws-s3
        title: Collect Logs from S3 Bucket
        description: Collect bedrock logs from S3 bucket with Elastic Agent.
        deployment_modes: ["default"]
      - type: aws-cloudwatch
        title: Collect Logs from CloudWatch
        description: Collect bedrock logs from CloudWatch with Elastic Agent.
        provider_permissions:
          - provider: aws
            description: CloudWatch Logs read access for Amazon Bedrock invocation log collection.
            permissions:
              - name: logs:DescribeLogGroups
              - name: logs:DescribeLogStreams
              - name: logs:FilterLogEvents
              - name: logs:GetLogEvents
              - name: logs:GetLogGroupFields
      - type: aws/metrics
        title: Collect Amazon Bedrock metrics
        description: Collect Amazon Bedrock metrics using AWS CloudWatch.
        provider_permissions:
          - provider: aws
            description: CloudWatch metrics read access for Amazon Bedrock monitoring.
            permissions:
              - name: ec2:DescribeRegions
              - name: cloudwatch:GetMetricData
              - name: cloudwatch:ListMetrics
              - name: tag:GetResources
screenshots:
  - src: /img/aws_bedrock_invocation.png
    title: Runtime metrics
    size: 1518x873
    type: image/png
  - src: /img/aws_bedrock_chat_image.png
    title: Text and chat metrics
    size: 1489x645
    type: image/png
  - src: /img/aws_bedrock_logs.png
    title: Invocation logs
    size: 3688x2216
    type: image/png
  - src: /img/amazon_bedrock_guardrails_overview.png
    title: Guardrails Overview
    size: 1519x1003
    type: image/png
  - src: /img/amazon_bedrock_guardrails_invocation_details.png
    title: Guardrails Overview
    size: 1545x1001
    type: image/png
icons:
  - src: "/img/icon.svg"
    type: "image/svg+xml"
vars:
  - name: shared_credential_file
    type: text
    title: Shared Credential File
    multi: false
    required: false
    show_user: false
    description: Directory of the shared credentials file
  - name: credential_profile_name
    type: text
    title: Credential Profile Name
    multi: false
    required: false
    show_user: false
  - name: access_key_id
    type: password
    title: Access Key ID
    secret: true
    multi: false
    required: false
    show_user: true
  - name: secret_access_key
    type: password
    title: Secret Access Key
    secret: true
    multi: false
    required: false
    show_user: true
  - name: session_token
    type: password
    title: Session Token
    secret: true
    multi: false
    required: false
    show_user: true
  - name: role_arn
    type: text
    title: Role ARN
    multi: false
    required: false
    show_user: false
  - name: supports_identity_federation
    type: bool
    title: Supports Identity Federation
    multi: false
    required: false
    show_user: false
  - name: endpoint
    type: text
    title: Endpoint
    multi: false
    required: false
    show_user: false
    default: ""
    description: URL of the entry point for an AWS web service
  - name: default_region
    type: text
    title: Default AWS Region
    multi: false
    required: false
    show_user: false
    default: ""
    description: Default region to use prior to connecting to region specific services/endpoints if no AWS region is set from environment variable, credentials or instance profile. If none of the above are set and no default region is set as well, `us-east-1` is used. A region, either from environment variable, credentials or instance profile or from this default region setting, needs to be set when using regions in non-regular AWS environments such as AWS China or US Government Isolated.
  - name: proxy_url
    type: text
    title: Proxy URL
    multi: false
    required: false
    show_user: false
    description: URL to proxy connections in the form of http\[s\]://<user>:<password>@<server name/ip>:<port>
var_groups:
  - name: credential_type
    required: true
    title: Setup Access
    selector_title: Preferred method
    options:
      - name: identity_federation
        title: Identity Federation
        vars: [role_arn, supports_identity_federation]
        hide_in_deployment_modes: [default]
        provider: aws
        iac_template_url: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-federated-identity-aws-9.6.0.yml
      - name: direct_access_key
        title: Direct Access Keys
        vars: [access_key_id, secret_access_key]
      - name: temporary_access_key
        title: Temporary Access Keys
        vars: [access_key_id, secret_access_key, session_token]
        hide_in_deployment_modes: [agentless]
      - name: assume_role
        title: Assume Role
        vars: [role_arn]
        hide_in_deployment_modes: [agentless]
      - name: shared_credentials
        title: Shared Credentials
        vars: [shared_credential_file, credential_profile_name]
        hide_in_deployment_modes: [agentless]
owner:
  github: elastic/security-service-integrations
  type: elastic
