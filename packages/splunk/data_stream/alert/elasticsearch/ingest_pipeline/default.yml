---
description: Pipeline for processing Alert logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - drop:
      tag: drop_f62b2292
      description: Ignore want_more placeholder message.
      if: ctx.message == "want_more"
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - fingerprint:
      tag: fingerprint_5df148ab
      fields:
        - event.original
      target_field: _id
      ignore_missing: true
  - json:
      field: event.original
      tag: json_event_original_9fade8bc
      target_field: splunk.alert
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_016f64b9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - dissect:
      tag: dissect_splunk_alert__raw_400248a8
      field: splunk.alert._raw
      pattern: "%{splunk.alert.raw_timestamp}, %{_temp.alert}"
      ignore_failure: true
  - kv:
      tag: kv__temp_alert_to_splunk_alert_7d8f4bb7
      field: _temp.alert
      target_field: splunk.alert
      field_split: ', '
      exclude_keys: [annotations.mitre_attack, _time]
      value_split: '='
      trim_value: '\\\"'
      ignore_failure: true
      description: >-
        Excludes `_time` so a `_time` key embedded in `_raw` cannot collide with
        the top-level `_time` and turn `splunk.alert._time` (and therefore
        `@timestamp`) into an array, which Elasticsearch rejects.
  - kv:
      tag: kv__temp_alert_to__temp_key_b3882504
      field: _temp.alert
      target_field: _temp.key
      field_split: ', '
      include_keys: [annotations.mitre_attack]
      value_split: '='
      trim_value: '\\\"'
      ignore_failure: true
  - rename:
      field: _temp.key.annotations.mitre_attack
      tag: rename_temp_key_82b41d8a
      target_field: splunk.alert.annotations.mitre_attack.value
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_ab1166ce
      value: alert
  - append:
      field: event.type
      tag: append_event_type_a75e9a8a
      value: info
      allow_duplicates: false
  - date:
      field: splunk.alert.raw_timestamp
      tag: date_raw_timestamp_99f5c6bf
      target_field: splunk.alert.raw_timestamp
      formats:
        - ISO8601
        - epoch_second
        - MM/dd/yy HH:mm:ss
        - HH:mm:ss
      if: ctx.splunk?.alert?.raw_timestamp instanceof String && ctx.splunk.alert.raw_timestamp != ''
      on_failure:
        - append:
            tag: append_error_message_6df140eb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_splunk_alert_raw_timestamp_7ef9377a
            field: splunk.alert.raw_timestamp
  - foreach:
      field: splunk.alert.time
      if: ctx.splunk?.alert?.time instanceof List
      tag: foreach_alert_time_3c727904
      processor:
        date:
          field: _ingest._value
