---
description: Pipeline for processing Alert logs.
processors:
  - drop:
      tag: drop_ignore_retry_placeholder_document_bf775c7f
      description: Ignore retry placeholder document.
      if: ctx.retry == true
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - fingerprint:
      tag: fingerprint_to_id_5df148ab
      fields:
        - event.original
      target_field: _id
      ignore_missing: true
  - json:
      field: event.original
      tag: json_event_original_2a02be13
      target_field: splunk.search
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_06a6e8c1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - dot_expander:
      tag: dot_expander_*_b6f542ad
      field: "*"
      path: splunk.search.ecs_result
      if: ctx.splunk?.search?.ecs_result instanceof Map && ctx.splunk.search.ecs_result.size() != 0
      ignore_failure: true
  - script:
      tag: distribute_expanded_fields_b9d03282
      if: ctx.splunk?.search?.ecs_result instanceof Map && ctx.splunk.search.ecs_result.size() != 0
      source: |-
        def merge(Map dst, Map src) {
          for (def k: src.keySet()) {
            if (src.get(k) instanceof Map && dst.get(k) instanceof Map) {
              dst.put(k, merge(dst.get(k), src.get(k)));
            } else if (src.get(k) instanceof List && dst.get(k) instanceof List) {
              def c = dst.get(k);
              for (def e: src.get(k)) {
                if (!c.contains(e)) {
                  c.add(e);
                }
              }
            } else {
                dst.put(k, src.get(k));
            }
          }
          return dst;
        }
        merge(ctx, ctx.splunk.search.ecs_result);
        ctx.splunk.search.remove("ecs_result");
      on_failure:
        - append:
            tag: append_error_message_3ddbe635
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: splunk.search._time
      tag: date_raw_timestamp_98013546
      target_field: splunk.search._time
      formats:
        - ISO8601
        - epoch_second
        - MM/dd/yy HH:mm:ss
        - HH:mm:ss
      if: ctx.splunk?.search?._time instanceof String && ctx.splunk.search._time != ''
      on_failure:
        - append:
            tag: append_error_message_5773e6cc
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_splunk_search__time_1418b3fa
            field: splunk.search._time
  - set:
      tag: set_timestamp_ac9d06fa
      field: '@timestamp'
      copy_from: splunk.search.result._time
      ignore_empty_value: true
  - dissect:
      tag: dissect_splunk_search_result__raw_3072e1b1
      field: splunk.search.result._raw
      pattern: "%{}, %{message}"
      ignore_failure: true
  - set:
      tag: set_message_45f8282c
      field: message
      copy_from: splunk.search.result._raw
      ignore_empty_value: true
      if: ctx.message == null

  - append:
      tag: append_related_user_b547c7b4
      field: related.user
      value: '{{{splunk.search.author}}}'
      if: ctx.splunk?.search?.author != null && ctx.splunk.search.author != ''
      allow_duplicates: false
  - append:
      tag: append_related_hosts_a10af9f3
      field: related.hosts
      value: '{{{host.name}}}'
      if: ctx.host?.name != null && ctx.host.name != ''
      allow_duplicates: false
  - append:
      tag: append_related_hosts_2c703672
      field: related.hosts
      value: '{{{splunk.search.result.splunk_server}}}'
      if: ctx.splunk?.search?.result?.splunk_server != null && ctx.splunk.search.result.splunk_server != ''
      allow_duplicates: false
  - remove:
      field:
        - splunk.alert
      tag: remove_custom_duplicate_fields_05b9fa28
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - remove:
      field: tmp
      tag: remove_temp_09b23d22
      ignore_missing: true
  - script:
      tag: remove-nulls_ef08549b
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
                handleMap(v);
            } else if (v instanceof List) {
                handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
