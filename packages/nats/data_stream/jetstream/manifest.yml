type: metrics
title: NATS JetStream metrics
streams:
  - input: nats/metrics
    vars:
      - name: period
        type: text
        title: Period
        multi: false
        required: true
        show_user: true
        default: 10s
      - name: jetstream_stats_enabled
        type: bool
        title: Collect JetStream server stats
        multi: false
        required: false
        show_user: true
        default: true
        description: Enable collection of general JetStream server stats.
      - name: jetstream_account_enabled
        type: bool
        title: Collect JetStream account metrics
        multi: false
        required: false
        show_user: true
        default: false
        description: Enable collection of JetStream account metrics.
      - name: jetstream_account_names
        type: text
        title: JetStream account names filter
        multi: true
        required: false
        show_user: false
        description: Filter account metrics by name. When empty, all accounts are reported.
      - name: jetstream_stream_enabled
        type: bool
        title: Collect JetStream stream metrics
        multi: false
        required: false
        show_user: true
        default: false
        description: Enable collection of JetStream stream metrics.
      - name: jetstream_stream_names
        type: text
        title: JetStream stream names filter
        multi: true
        required: false
        show_user: false
        description: Filter stream metrics by name. When empty, all streams are reported.
      - name: jetstream_consumer_enabled
        type: bool
        title: Collect JetStream consumer metrics
        multi: false
        required: false
        show_user: true
        default: false
        description: Enable collection of JetStream consumer metrics. Requires NATS 2.9+.
      - name: jetstream_consumer_names
        type: text
        title: JetStream consumer names filter
        multi: true
        required: false
        show_user: false
        description: Filter consumer metrics by name. When empty, all consumers are reported.
    title: NATS JetStream metrics
    enabled: false
    description: Collect JetStream metrics (stats, account, stream, consumer) from NATS servers. Requires Elastic Agent 9.1+.
elasticsearch:
  index_mode: "time_series"
  index_template:
    settings:
      index:
        mapping:
          dimension_fields:
            limit: 24
