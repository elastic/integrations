        field: jamf_protect.telemetry.event.od_group_add.instigator.tty.path
        target_field: jamf_protect.telemetry.tty
        ignore_missing: true
    - set:
        tag: set_process_interactive_b14fe477
        field: process.interactive
        value: true
        if: ctx.jamf_protect.telemetry?.event?.od_group_add?.instigator?.tty != null
    - set:
        tag: set_process_interactive_e735bd2a
        field: process.interactive
        value: false
        if: ctx.jamf_protect.telemetry?.event?.od_group_add?.instigator?.tty == null
