---
description: Pipeline for parsing specific fields related to opendirectory group added events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_b6e10a65
        field: event.reason
        value: A member has been added to a group using Open Directory
    - append:
        tag: append_event_type_0602e5be
        field: event.type
        value: change
    - append:
        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_add_group_name_to_group_name_d29516c9
        field: jamf_protect.telemetry.event.od_group_add.group_name
        target_field: group.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_add_member_member_value_to_user_name_9560d992
        field: jamf_protect.telemetry.event.od_group_add.member.member_value
        target_field: user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_add_db_path_to_file_path_6abe018f
        field: jamf_protect.telemetry.event.od_group_add.db_path
        target_field: file.path
        ignore_missing: true

