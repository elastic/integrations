    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_add_instigator_is_platform_binary_to_process_platform_binary_efad1074
        field: jamf_protect.telemetry.event.od_group_add.instigator.is_platform_binary
        target_field: process.platform_binary
