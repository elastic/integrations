        value: '{{{jamf_protect.telemetry.event.od_group_add.instigator.audit_token.euid}}}'
        if: ctx.jamf_protect.telemetry?.event?.od_group_add?.instigator?.audit_token?.euid != null
        allow_duplicates: false
        ignore_failure: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_add_instigator_audit_token_e_username_to_process_user_name_e14bc8d0
        field: jamf_protect.telemetry.event.od_group_add.instigator.audit_token.e_username
