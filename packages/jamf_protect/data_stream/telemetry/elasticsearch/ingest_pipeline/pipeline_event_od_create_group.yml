    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_codesigning_flags_to_process_code_signature_flags_22715221
        field: jamf_protect.telemetry.event.od_create_group.instigator.codesigning_flags
        target_field: process.code_signature.flags
        ignore_missing: true


