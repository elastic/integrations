        target_field: jamf_protect.telemetry.event.od_create_group.instigator.audit_token.egid
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_group_instigator_audit_token_euid_to_jamf_protect_telemetry_event_od_create_group_instigator_audit_token_euid_5265a43e
        field: jamf_protect.telemetry.event.od_create_group.instigator.audit_token.euid
        target_field: jamf_protect.telemetry.event.od_create_group.instigator.audit_token.euid
        type: string
        ignore_missing: true
    - append:
        tag: append_user_effective_id_5bdb3551
        field: user.effective.id
        value: '{{{jamf_protect.telemetry.event.od_create_group.instigator.audit_token.euid}}}'
        if: ctx.jamf_protect.telemetry?.event?.od_create_group?.instigator?.audit_token?.euid != null
        allow_duplicates: false
        ignore_failure: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_audit_token_e_username_to_process_user_name_722b03eb
        field: jamf_protect.telemetry.event.od_create_group.instigator.audit_token.e_username
        target_field: process.user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_is_platform_binary_to_process_platform_binary_0944b0eb
        field: jamf_protect.telemetry.event.od_create_group.instigator.is_platform_binary
        target_field: process.platform_binary
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_is_es_client_to_process_endpoint_security_client_a6b7deb7
        field: jamf_protect.telemetry.event.od_create_group.instigator.is_es_client
        target_field: process.endpoint_security_client
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_cdhash_to_process_hash_cdhash_58bcc166
        field: jamf_protect.telemetry.event.od_create_group.instigator.cdhash
        target_field: process.hash.cdhash
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_executable_sha1_to_process_hash_sha1_6b605a3c
        field: jamf_protect.telemetry.event.od_create_group.instigator.executable.sha1
        target_field: process.hash.sha1
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_executable_sha256_to_process_hash_sha256_4bcca3a4
        field: jamf_protect.telemetry.event.od_create_group.instigator.executable.sha256
        target_field: process.hash.sha256
        ignore_missing: true
    - append:
        tag: append_related_hash_96df867f
        field: related.hash
        value: '{{{process.hash.sha1}}}'
        if: ctx.process?.hash?.sha1 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_239dcc07
        field: related.hash
        value: '{{{process.hash.sha256}}}'
        if: ctx.process?.hash?.sha256 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_f4079ea4
        field: related.hash
        value: '{{{process.hash.cdhash}}}'
        if: ctx.process?.hash?.cdhash != null && ctx.process.hash.cdhash != ''
        allow_duplicates: false
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_tty_path_to_jamf_protect_telemetry_tty_1efa2d9b
        field: jamf_protect.telemetry.event.od_create_group.instigator.tty.path
        target_field: jamf_protect.telemetry.tty
        ignore_missing: true
    - set:
        tag: set_process_interactive_7758f150
        field: process.interactive
        value: true
        if: ctx.jamf_protect.telemetry?.event?.od_create_group?.instigator?.tty != null
    - set:
        tag: set_process_interactive_c266240b
        field: process.interactive
        value: false
        if: ctx.jamf_protect.telemetry?.event?.od_create_group?.instigator?.tty == null
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_group_instigator_audit_token_pid_to_process_pid_f76811cf
        field: jamf_protect.telemetry.event.od_create_group.instigator.audit_token.pid
        target_field: process.pid
        type: long
        ignore_missing: true
        on_failure:
        - append:
            tag: append_error_message_e3aa2840
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_audit_token_uuid_to_process_entity_id_33c53e87
        field: jamf_protect.telemetry.event.od_create_group.instigator.audit_token.uuid
        target_field: process.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_executable_path_to_process_executable_0f972125
        field: jamf_protect.telemetry.event.od_create_group.instigator.executable.path
        target_field: process.executable
        ignore_missing: true
    - script:
        tag: script_f232bce3
        lang: painless
        source: >
            if (ctx.process?.executable != null) {
                int lastSlashIndex = ctx.process.executable.lastIndexOf('/');
                if (lastSlashIndex != -1) {
                    ctx.process.name = ctx.process.executable.substring(lastSlashIndex + 1);
                } else {
                    ctx.process.name = ctx.process.executable; // Fallback if no slash is found
                }
            }
    - rename:
        tag: rename_jamf_protect_telemetry_thread_thread_id_to_process_thread_id_3987a29f
        field: jamf_protect.telemetry.thread.thread_id
        target_field: process.thread.id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_db_path_to_process_working_directory_01028ecf
        field: jamf_protect.telemetry.event.od_create_group.db_path
        target_field: process.working_directory
        ignore_missing: true
        if: ctx.jamf_protect?.telemetry?.event?.od_create_group?.db_path != null
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_instigator_signing_id_to_process_code_signature_signing_id_a35d0836
        field: jamf_protect.telemetry.event.od_create_group.instigator.signing_id
