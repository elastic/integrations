---
description: Pipeline for parsing specific fields related to opendirectory group events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_370e5089
        field: event.reason
        value: A group has been created using Open Directory
    - append:
        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_group_name_to_group_name_7bfdd6c2
        field: jamf_protect.telemetry.event.od_create_group.group_name
        target_field: group.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_members_member_array_to_user_name_c322324a
        field: jamf_protect.telemetry.event.od_create_group.members.member_array
        target_field: user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_group_db_path_to_file_path_3bf66820
        field: jamf_protect.telemetry.event.od_create_group.db_path
        target_field: file.path
        ignore_missing: true

    ##########################
    ## ECS Process ##
    ##########################
