        on_failure:
        - append:
            tag: append_error_message_40a1108f
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
    - rename:
        tag: rename_jamf_protect_telemetry_event_network_connect_instigator_audit_token_uuid_to_process_entity_id_aace0a1c
        field: jamf_protect.telemetry.event.network_connect.instigator.audit_token.uuid
