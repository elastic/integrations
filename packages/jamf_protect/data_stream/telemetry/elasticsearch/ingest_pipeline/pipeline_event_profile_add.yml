        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_add_profile_display_name_to_jamf_protect_telemetry_profile_display_name_7caf4706
        field: jamf_protect.telemetry.event.profile_add.profile.display_name
        target_field: jamf_protect.telemetry.profile_display_name
        type: string
        ignore_missing: true
    - script:
        tag: script_9218c097
        lang: painless
        params:
            itemTypeMap:
                '0': mdm
                '1': manual
        source: >
            if (ctx.jamf_protect?.telemetry?.event?.profile_add?.profile?.install_source != null) {
                String itemType = ctx.jamf_protect.telemetry.event.profile_add.profile.install_source.toString();
                def itemTypeString = params.itemTypeMap.containsKey(itemType) ? params.itemTypeMap[itemType] : 'Unknown';
                ctx.jamf_protect = ctx.jamf_protect != null ? ctx.jamf_protect : new HashMap();
                ctx.jamf_protect.telemetry.profile_install_source = itemTypeString;
            }
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_add_profile_organization_to_jamf_protect_telemetry_profile_organization_edf3c4f8
        field: jamf_protect.telemetry.event.profile_add.profile.organization
        target_field: jamf_protect.telemetry.profile_organization
