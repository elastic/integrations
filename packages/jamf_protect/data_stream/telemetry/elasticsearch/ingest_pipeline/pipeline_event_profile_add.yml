---
description: Pipeline for parsing specific fields related to profile added events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_7186cf49
        field: event.reason
        value: A configuration profile is installed on the system
    - append:
        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_add_profile_scope_to_jamf_protect_telemetry_profile_scope_c4d1e50a
        field: jamf_protect.telemetry.event.profile_add.profile.scope
        target_field: jamf_protect.telemetry.profile_scope
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_add_profile_identifier_to_jamf_protect_telemetry_profile_identifier_0f462820
        field: jamf_protect.telemetry.event.profile_add.profile.identifier
        target_field: jamf_protect.telemetry.profile_identifier
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_add_profile_uuid_to_jamf_protect_telemetry_profile_uuid_45c07284
        field: jamf_protect.telemetry.event.profile_add.profile.uuid
