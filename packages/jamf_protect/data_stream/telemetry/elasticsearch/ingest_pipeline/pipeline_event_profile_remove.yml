---
description: Pipeline for parsing specific fields related to profile removed events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_626ece9a
        field: event.reason
        value: A configuration profile is removed from the system
    - append:
        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_remove_profile_scope_to_jamf_protect_telemetry_profile_scope_2dce57a1
        field: jamf_protect.telemetry.event.profile_remove.profile.scope
        target_field: jamf_protect.telemetry.profile_scope
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_remove_profile_identifier_to_jamf_protect_telemetry_profile_identifier_6a449abb
        field: jamf_protect.telemetry.event.profile_remove.profile.identifier
        target_field: jamf_protect.telemetry.profile_identifier
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_remove_profile_uuid_to_jamf_protect_telemetry_profile_uuid_b509e61b
        field: jamf_protect.telemetry.event.profile_remove.profile.uuid
        target_field: jamf_protect.telemetry.profile_uuid
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_remove_profile_display_name_to_jamf_protect_telemetry_profile_display_name_2cb949ad
        field: jamf_protect.telemetry.event.profile_remove.profile.display_name
        target_field: jamf_protect.telemetry.profile_display_name
        type: string
        ignore_missing: true
    - script:
        tag: script_d00ce187
        lang: painless
        params:
            itemTypeMap:
                '0': mdm
                '1': manual
        source: >
            if (ctx.jamf_protect?.telemetry?.event?.profile_remove?.profile?.install_source != null) {
                String itemType = ctx.jamf_protect.telemetry.event.profile_remove.profile.install_source.toString();
                def itemTypeString = params.itemTypeMap.containsKey(itemType) ? params.itemTypeMap[itemType] : 'Unknown';
                ctx.jamf_protect = ctx.jamf_protect != null ? ctx.jamf_protect : new HashMap();
                ctx.jamf_protect.telemetry.profile_install_source = itemTypeString;
            }
    - convert:
        tag: convert_jamf_protect_telemetry_event_profile_remove_profile_organization_to_jamf_protect_telemetry_profile_organization_48dd2d3b
        field: jamf_protect.telemetry.event.profile_remove.profile.organization
        target_field: jamf_protect.telemetry.profile_organization
        type: string
        ignore_missing: true
