    - append:
        tag: append_event_type_0602e5be
        field: event.type
        value: change
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_tcc_modify_service_to_jamf_protect_telemetry_tcc_service_1fe3b8d8
        field: jamf_protect.telemetry.event.tcc_modify.service
        target_field: jamf_protect.telemetry.tcc_service
