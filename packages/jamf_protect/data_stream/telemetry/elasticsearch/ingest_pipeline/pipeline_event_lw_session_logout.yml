---
description: Pipeline for parsing specific fields related to loginwindow logout events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_948f99bf
        field: event.reason
        value: A user has logged out of an active graphical session
    - append:
        tag: append_event_type_90fe2b35
        field: event.type
        value: end
    - append:
        tag: append_event_category_109b4d72
        field: event.category
        value: authentication
    - convert:
        tag: convert_jamf_protect_telemetry_event_lw_session_logout_graphical_session_id_to_jamf_protect_telemetry_graphical_authentication_username_b5e77eea
        field: jamf_protect.telemetry.event.lw_session_logout.graphical_session_id
        target_field: jamf_protect.telemetry.graphical_authentication_username
        type: string
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_lw_session_logout_username_to_user_name_a2480ffa
        field: jamf_protect.telemetry.event.lw_session_logout.username
        target_field: user.name
        ignore_missing: true
    ##########################
    ## ECS Process ##
    ##########################
    - pipeline:
        tag: pipeline_object_process_0d75fa7a
        name: '{{ IngestPipeline "pipeline_object_process" }}'
