---
description: Pipeline for Jamf Protect Telemetry crash and diagnostic events.
processors:

##########################
## ECS Event Specific ##
##########################
    - set:
        tag: set_event_reason_549da753
        field: event.reason
        value: A crash or diagnostic file is detected being created
    - rename:
        tag: rename_jamf_protect_telemetry_event_file_collection_file_path_to_log_file_path_aed6a940
        field: jamf_protect.telemetry.event.file_collection.file.path
        target_field: log.file.path
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_file_collection_contents_to_jamf_protect_telemetry_log_entries_28a2427e
        field: jamf_protect.telemetry.event.file_collection.contents
        target_field: jamf_protect.telemetry.log_entries
        type: string
        ignore_missing: true
