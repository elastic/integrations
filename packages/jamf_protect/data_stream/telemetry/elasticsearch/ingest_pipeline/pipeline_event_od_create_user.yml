        field: jamf_protect.telemetry.event.od_create_user.instigator.responsible_audit_token.pid
        target_field: process.responsible.pid
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_user_instigator_responsible_audit_token_euid_to_process_responsible_user_id_fdc38905
        field: jamf_protect.telemetry.event.od_create_user.instigator.responsible_audit_token.euid
