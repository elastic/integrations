---
description: Pipeline for parsing specific fields related to opendirectory user events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_d250188f
        field: event.reason
        value: A user has been created using Open Directory
    - append:
        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_group_name_to_group_name_4a2be660
        field: jamf_protect.telemetry.event.od_create_user.group_name
        target_field: group.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_user_name_to_user_name_c5980de0
        field: jamf_protect.telemetry.event.od_create_user.user_name
        target_field: user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_db_path_to_file_path_2b44be7e
        field: jamf_protect.telemetry.event.od_create_user.db_path
        target_field: file.path
        ignore_missing: true

    ##########################
    ## ECS Process ##
    ##########################
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_start_time_to_process_start_81e6a02c
        field: jamf_protect.telemetry.event.od_create_user.instigator.start_time
        target_field: process.start
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_egid_to_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_egid_c9a3254e
        field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.egid
        target_field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.egid
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_euid_to_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_euid_89abd57e
        field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.euid
        target_field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.euid
        type: string
        ignore_missing: true
    - append:
        tag: append_user_effective_id_e011d519
        field: user.effective.id
        value: '{{{jamf_protect.telemetry.event.od_create_user.instigator.audit_token.euid}}}'
        if: ctx.jamf_protect.telemetry?.event?.od_create_user?.instigator?.audit_token?.euid != null
        allow_duplicates: false
        ignore_failure: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_e_username_to_process_user_name_3c8863ad
        field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.e_username
        target_field: process.user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_is_platform_binary_to_process_platform_binary_31964b71
        field: jamf_protect.telemetry.event.od_create_user.instigator.is_platform_binary
        target_field: process.platform_binary
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_is_es_client_to_process_endpoint_security_client_639a8dd1
        field: jamf_protect.telemetry.event.od_create_user.instigator.is_es_client
        target_field: process.endpoint_security_client
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_cdhash_to_process_hash_cdhash_6ec24e54
        field: jamf_protect.telemetry.event.od_create_user.instigator.cdhash
        target_field: process.hash.cdhash
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_executable_sha1_to_process_hash_sha1_28b9528a
        field: jamf_protect.telemetry.event.od_create_user.instigator.executable.sha1
        target_field: process.hash.sha1
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_executable_sha256_to_process_hash_sha256_dd9dfe62
        field: jamf_protect.telemetry.event.od_create_user.instigator.executable.sha256
        target_field: process.hash.sha256
        ignore_missing: true
    - append:
        tag: append_related_hash_96df867f
        field: related.hash
        value: '{{{process.hash.sha1}}}'
        if: ctx.process?.hash?.sha1 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_239dcc07
        field: related.hash
        value: '{{{process.hash.sha256}}}'
        if: ctx.process?.hash?.sha256 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_f4079ea4
        field: related.hash
        value: '{{{process.hash.cdhash}}}'
        if: ctx.process?.hash?.cdhash != null && ctx.process.hash.cdhash != ''
        allow_duplicates: false
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_tty_path_to_jamf_protect_telemetry_tty_d26ea42d
        field: jamf_protect.telemetry.event.od_create_user.instigator.tty.path
        target_field: jamf_protect.telemetry.tty
        ignore_missing: true
    - set:
        tag: set_process_interactive_8ee39030
        field: process.interactive
        value: true
        if: ctx.jamf_protect.telemetry?.event?.od_create_user?.instigator?.tty != null
    - set:
        tag: set_process_interactive_6a8a076b
        field: process.interactive
        value: false
        if: ctx.jamf_protect.telemetry?.event?.od_create_user?.instigator?.tty == null
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_pid_to_process_pid_e4d2fa7f
        field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.pid
        target_field: process.pid
        type: long
        ignore_missing: true
        on_failure:
        - append:
            tag: append_error_message_f1b1c242
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_audit_token_uuid_to_process_entity_id_b6ef57a9
        field: jamf_protect.telemetry.event.od_create_user.instigator.audit_token.uuid
        target_field: process.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_executable_path_to_process_executable_4d9b0097
        field: jamf_protect.telemetry.event.od_create_user.instigator.executable.path
        target_field: process.executable
        ignore_missing: true
    - script:
        tag: script_f232bce3
        lang: painless
        source: >
            if (ctx.process?.executable != null) {
                int lastSlashIndex = ctx.process.executable.lastIndexOf('/');
                if (lastSlashIndex != -1) {
                    ctx.process.name = ctx.process.executable.substring(lastSlashIndex + 1);
                } else {
                    ctx.process.name = ctx.process.executable; // Fallback if no slash is found
                }
            }
    - rename:
        tag: rename_jamf_protect_telemetry_thread_thread_id_to_process_thread_id_3987a29f
        field: jamf_protect.telemetry.thread.thread_id
        target_field: process.thread.id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_db_path_to_process_working_directory_bd1b828f
        field: jamf_protect.telemetry.event.od_create_user.db_path
        target_field: process.working_directory
        ignore_missing: true
        if: ctx.jamf_protect?.telemetry?.event?.od_create_user?.db_path != null
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_signing_id_to_process_code_signature_signing_id_d18a8edc
        field: jamf_protect.telemetry.event.od_create_user.instigator.signing_id
        target_field: process.code_signature.signing_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_team_id_to_process_code_signature_team_id_622e9342
        field: jamf_protect.telemetry.event.od_create_user.instigator.team_id
        target_field: process.code_signature.team_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_codesigning_flags_to_process_code_signature_flags_aa767ac7
        field: jamf_protect.telemetry.event.od_create_user.instigator.codesigning_flags
        target_field: process.code_signature.flags
        ignore_missing: true


    ##########################
    ## ECS Parent Process ##
    ##########################
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_parent_audit_token_uuid_to_process_parent_entity_id_88a6d4cc
        field: jamf_protect.telemetry.event.od_create_user.instigator.parent_audit_token.uuid
