        target_field: process.parent.real_group.id
        type: string
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_parent_audit_token_signing_id_to_process_parent_code_signature_signing_id_cb641f54
        field: jamf_protect.telemetry.event.od_create_user.instigator.parent_audit_token.signing_id
        target_field: process.parent.code_signature.signing_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_parent_audit_token_exec_path_to_process_parent_executable_035607df
        field: jamf_protect.telemetry.event.od_create_user.instigator.parent_audit_token.exec_path
        target_field: process.parent.executable
        ignore_missing: true

