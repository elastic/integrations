        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_user_instigator_responsible_audit_token_rgid_to_process_responsible_real_group_id_1bba36df
        field: jamf_protect.telemetry.event.od_create_user.instigator.responsible_audit_token.rgid
