        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_create_user_instigator_parent_audit_token_e_username_to_process_parent_user_name_6571cd8e
        field: jamf_protect.telemetry.event.od_create_user.instigator.parent_audit_token.e_username
        target_field: process.parent.user.name
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_create_user_instigator_parent_audit_token_ruid_to_process_parent_real_user_id_dd8a2d4d
