        target_field: host.id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_host_ips_to_host_ip_2ad85343
        field: jamf_protect.telemetry.host.ips
        target_field: host.ip
        if: ctx.jamf_protect?.telemetry?.host?.ips != null && ctx.jamf_protect?.telemetry?.host?.ips != ""
    - rename:
        tag: rename_jamf_protect_telemetry_host_os_to_host_os_full_54d0a856
        field: jamf_protect.telemetry.host.os
        target_field: host.os.full
        ignore_missing: true
    - gsub:
        tag: gsub_host_os_full_ba560804
        field: host.os.full
        pattern: '^Version\s*'
        replacement: ""
        if: ctx.host?.os?.full != null
    - gsub:
        tag: gsub_host_os_full_to_host_os_version_7562aa23
        field: host.os.full
        pattern: ^([^\s]+).*
        replacement: "$1"
        target_field: host.os.version
        if: ctx.host?.os?.full != null
    - set:
        tag: set_host_os_family_9d799ed3
        field: host.os.family
        value: macos
    - set:
        tag: set_host_os_type_074dd92b
        field: host.os.type
        value: macos
    - set:
        tag: set_host_os_name_9a719836
        field: host.os.name
        value: macOS
    #######################
    ## ECS Device Mapping ##
    #######################
    - rename:
        tag: rename_jamf_protect_telemetry_host_serial_to_device_serial_number_b10070af
        field: jamf_protect.telemetry.host.serial
        target_field: device.serial_number
        ignore_missing: true
    - set:
        tag: set_device_id_49c80c98
        field: device.id
        value: '{{{ device.serial_number }}}'
        if: ctx.device?.serial_number != null
        ignore_failure: true
    - set:
        tag: set_device_manufacturer_6c63de55
        field: device.manufacturer
        value: Apple
    ########################
    # ECS Related Mapping ##
    ########################
    - append:
        tag: append_related_hosts_122a4356
        field: related.hosts
        value: '{{{ host.hostname }}}'
        if: ctx.host?.hostname != null
        allow_duplicates: false
        ignore_failure: true
    - append:
        tag: append_related_user_981c7fa7
        field: related.user
        value: "{{{ user.name }}}"
        if: ctx.user?.name != null
        allow_duplicates: false
    - foreach:
        tag: foreach_host_ip_232e838f
        field: host.ip
        if: ctx.host?.ip instanceof List
        processor:
            append:
                tag: append_related_ip_cc4d8a3d
                field: related.ip
                value: '{{{_ingest._value}}}'
                allow_duplicates: false
    #######################
    ## ECS Pipelines ##
    #######################
