---
description: Pipeline for Jamf Protect Telemetry logs.
processors:
    - set:
        tag: set_ecs_version_f5923549
        field: ecs.version
        value: '8.17.0'
    - json:
        tag: json_message_to_jamf_protect_telemetry_9dae2753
        field: message
        target_field: jamf_protect.telemetry
        if: ctx.message != null
    - rename:
        tag: rename_json_to_jamf_protect_telemetry_1146a989
        field: json
        target_field: jamf_protect.telemetry
        if: ctx.json != null

    ##########################
    ## ECS Observer Mapping ##
    ##########################
    - set:
        tag: set_observer_product_e40a396c
        field: observer.product
        value: Jamf Protect
    - set:
        tag: set_observer_vendor_6a522e0a
        field: observer.vendor
        value: Jamf
    - set:
        tag: set_observer_type_ae54f4bd
        field: observer.type
        value: Endpoint Security
    - rename:
        tag: rename_jamf_protect_telemetry_host_protectVersion_to_observer_version_0472c50c
        field: jamf_protect.telemetry.host.protectVersion
        target_field: observer.version
        ignore_missing: true

    #######################
    ## ECS Event Mapping ##
    #######################
    - set:
        tag: set_event_kind_de80643c
        field: event.kind
        value: event
    - append:
        tag: append_event_type_8a66ccaa
        field: event.type
        value: info
    - append:
        tag: append_event_category_8a525c81
        field: event.category
        value: process
    - set:
        tag: set_event_provider_7e881320
        field: event.provider
        value: Jamf Protect
    - date:
        tag: date_jamf_protect_telemetry_time_to_event_start_4eab876b
        field: jamf_protect.telemetry.time
        target_field: event.start
        formats:
        - date_optional_time
        if: ctx.jamf_protect?.telemetry?.time != null
    - rename:
        tag: rename_jamf_protect_telemetry_uuid_to_event_id_b6cdc923
        field: jamf_protect.telemetry.uuid
        target_field: event.id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_glob_seq_num_to_event_sequence_9b2ce931
        field: jamf_protect.telemetry.glob_seq_num
        target_field: event.sequence
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_type_to_event_code_692889d5
        field: jamf_protect.telemetry.event_type
        target_field: event.code
        type: string
        ignore_missing: true
    - script:
        tag: script_populates_event_action_name_event_86b62266
        description: Populates event.action with the name of the event
        lang: painless
        source: >
          if (ctx.jamf_protect.telemetry.containsKey('event')) {
            def eventObject = ctx.jamf_protect.telemetry.event;
            for (def key : eventObject.keySet()) {
              if (eventObject[key] != null) {
                if (!ctx.containsKey('event')) {
                  ctx.event = new HashMap();
                }
                ctx.event.action = key;
                break;
              }
            }
          }
        ignore_failure: true
    - script:
        tag: script_1e0e4d20
        lang: painless
        params:
            authTypeMap:
                '0': true
                '1': false
        source: |
            if (ctx.jamf_protect?.telemetry?.action?.result?.result?.auth != null) {
                def authValue = ctx.jamf_protect.telemetry.action.result.result.auth.toString();
                def authTypeBoolean = params.authTypeMap.containsKey(authValue) ? params.authTypeMap[authValue] : 'Unknown';
                ctx.jamf_protect.telemetry = ctx.jamf_protect.telemetry != null ? ctx.jamf_protect.telemetry : new HashMap();
                ctx.jamf_protect.telemetry.event_allowed_by_esclient = authTypeBoolean;
            }
    #######################
    ## ECS Host Mapping ##
    #######################
    - rename:
        tag: rename_jamf_protect_telemetry_host_hostname_to_host_hostname_c3e1e88f
        field: jamf_protect.telemetry.host.hostname
        target_field: host.hostname
        ignore_missing: true
    - lowercase:
        tag: lowercase_host_hostname_to_host_name_019f94e7
        field: host.hostname
        target_field: host.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_host_provisioningUDID_to_host_id_0d0c735f
