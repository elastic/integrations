---
description: Pipeline for parsing process objects in specific Jamf Protect Telemetry events. This pipeline is called in events where there is no instigator existing and therefore parsing the process object itself.
processors:

    ##########################
    ## ECS Process ##
    ##########################
    - rename:
        tag: rename_jamf_protect_telemetry_process_start_time_to_process_start_b14fb885
        field: jamf_protect.telemetry.process.start_time
        target_field: process.start
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_audit_token_egid_to_jamf_protect_telemetry_process_audit_token_egid_f0c8cda0
        field: jamf_protect.telemetry.process.audit_token.egid
        target_field: jamf_protect.telemetry.process.audit_token.egid
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_audit_token_euid_to_jamf_protect_telemetry_process_audit_token_euid_54fc53bc
        field: jamf_protect.telemetry.process.audit_token.euid
        target_field: jamf_protect.telemetry.process.audit_token.euid
        type: string
        ignore_missing: true
    - append:
        tag: append_user_effective_id_7b6ab2ef
        field: user.effective.id
        value: '{{{jamf_protect.telemetry.process.audit_token.euid}}}'
        if: ctx.jamf_protect.telemetry?.process?.audit_token?.euid != null
        allow_duplicates: false
        ignore_failure: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_audit_token_e_username_to_process_user_name_1028795c
        field: jamf_protect.telemetry.process.audit_token.e_username
        target_field: process.user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_is_platform_binary_to_process_platform_binary_b4974ff8
        field: jamf_protect.telemetry.process.is_platform_binary
        target_field: process.platform_binary
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_is_es_client_to_process_endpoint_security_client_8b090f5a
        field: jamf_protect.telemetry.process.is_es_client
        target_field: process.endpoint_security_client
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_cdhash_to_process_hash_cdhash_236972ed
        field: jamf_protect.telemetry.process.cdhash
        target_field: process.hash.cdhash
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_executable_sha1_to_process_hash_sha1_e7ef4185
        field: jamf_protect.telemetry.process.executable.sha1
        target_field: process.hash.sha1
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_executable_sha256_to_process_hash_sha256_6f5330fd
        field: jamf_protect.telemetry.process.executable.sha256
        target_field: process.hash.sha256
        ignore_missing: true
    - append:
        tag: append_related_hash_96df867f
        field: related.hash
        value: '{{{process.hash.sha1}}}'
        if: ctx.process?.hash?.sha1 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_239dcc07
        field: related.hash
        value: '{{{process.hash.sha256}}}'
        if: ctx.process?.hash?.sha256 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_f4079ea4
        field: related.hash
        value: '{{{process.hash.cdhash}}}'
        if: ctx.process?.hash?.cdhash != null && ctx.process.hash.cdhash != ''
        allow_duplicates: false
    - rename:
        tag: rename_jamf_protect_telemetry_custom_tty_path_to_jamf_protect_telemetry_tty_63e85edc
        field: jamf_protect.telemetry.custom.tty.path
        target_field: jamf_protect.telemetry.tty
        ignore_missing: true
    - set:
        tag: set_process_interactive_638b3399
        field: process.interactive
        value: true
        if: ctx.jamf_protect.telemetry?.process?.tty != null
    - set:
        tag: set_process_interactive_cc1f1d24
        field: process.interactive
        value: false
        if: ctx.jamf_protect.telemetry?.process?.tty == null
    - convert:
        tag: convert_jamf_protect_telemetry_process_audit_token_pid_to_process_pid_e7122b56
        field: jamf_protect.telemetry.process.audit_token.pid
        target_field: process.pid
        type: long
        ignore_missing: true
        on_failure:
        - append:
            tag: append_error_message_eb9e5c4f
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
    - rename:
        tag: rename_jamf_protect_telemetry_process_audit_token_uuid_to_process_entity_id_a9a0aecc
        field: jamf_protect.telemetry.process.audit_token.uuid
        target_field: process.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_executable_path_to_process_executable_c80a04f6
        field: jamf_protect.telemetry.process.executable.path
        target_field: process.executable
        ignore_missing: true
    - script:
        tag: script_f232bce3
        lang: painless
        source: >
            if (ctx.process?.executable != null) {
                int lastSlashIndex = ctx.process.executable.lastIndexOf('/');
                if (lastSlashIndex != -1) {
                    ctx.process.name = ctx.process.executable.substring(lastSlashIndex + 1);
                } else {
                    ctx.process.name = ctx.process.executable; // Fallback if no slash is found
                }
            }
    - rename:
        tag: rename_jamf_protect_telemetry_thread_thread_id_to_process_thread_id_3987a29f
        field: jamf_protect.telemetry.thread.thread_id
        target_field: process.thread.id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_signing_id_to_process_code_signature_signing_id_9eefc109
        field: jamf_protect.telemetry.process.signing_id
        target_field: process.code_signature.signing_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_team_id_to_process_code_signature_team_id_9e6cbef3
        field: jamf_protect.telemetry.process.team_id
        target_field: process.code_signature.team_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_codesigning_flags_to_process_code_signature_flags_6fc05176
        field: jamf_protect.telemetry.process.codesigning_flags
        target_field: process.code_signature.flags
        ignore_missing: true


    ##########################
    ## ECS Parent Process ##
    ##########################
    - rename:
        tag: rename_jamf_protect_telemetry_process_parent_audit_token_uuid_to_process_parent_entity_id_e0b5b269
        field: jamf_protect.telemetry.process.parent_audit_token.uuid
        target_field: process.parent.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_parent_audit_token_pid_to_process_parent_pid_09005669
        field: jamf_protect.telemetry.process.parent_audit_token.pid
        target_field: process.parent.pid
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_parent_audit_token_euid_to_process_parent_user_id_54ade22a
        field: jamf_protect.telemetry.process.parent_audit_token.euid
        target_field: process.parent.user.id
        type: string
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_responsible_audit_token_e_username_to_process_parent_user_name_89a01351
        field: jamf_protect.telemetry.process.responsible_audit_token.e_username
        target_field: process.parent.user.name
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_parent_audit_token_ruid_to_process_parent_real_user_id_cdaf1096
        field: jamf_protect.telemetry.process.parent_audit_token.ruid
        target_field: process.parent.real_user.id
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_parent_audit_token_rgid_to_process_parent_real_group_id_8ee2dd52
        field: jamf_protect.telemetry.process.parent_audit_token.rgid
        target_field: process.parent.real_group.id
        type: string
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_parent_audit_token_signing_id_to_process_parent_code_signature_signing_id_68a75ac9
        field: jamf_protect.telemetry.process.parent_audit_token.signing_id
        target_field: process.parent.code_signature.signing_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_parent_audit_token_exec_path_to_process_parent_executable_d827ccea
        field: jamf_protect.telemetry.process.parent_audit_token.exec_path
        target_field: process.parent.executable
        ignore_missing: true


    ##########################
    ## ECS Responsible Process ##
    ##########################
    - rename:
        tag: rename_jamf_protect_telemetry_process_responsible_audit_token_uuid_to_process_responsible_entity_id_fd2cffa3
        field: jamf_protect.telemetry.process.responsible_audit_token.uuid
        target_field: process.responsible.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_responsible_audit_token_pid_to_process_responsible_pid_07ce0267
        field: jamf_protect.telemetry.process.responsible_audit_token.pid
        target_field: process.responsible.pid
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_responsible_audit_token_euid_to_process_responsible_user_id_dd1f5998
        field: jamf_protect.telemetry.process.responsible_audit_token.euid
        target_field: process.responsible.user.id
        type: string
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_responsible_audit_token_e_username_to_process_responsible_user_name_47564223
        field: jamf_protect.telemetry.process.responsible_audit_token.e_username
        target_field: process.responsible.user.name
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_responsible_audit_token_ruid_to_process_responsible_real_user_id_9e63753e
        field: jamf_protect.telemetry.process.responsible_audit_token.ruid
        target_field: process.responsible.real_user.id
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_process_responsible_audit_token_rgid_to_process_responsible_real_group_id_6a290676
        field: jamf_protect.telemetry.process.responsible_audit_token.rgid
        target_field: process.responsible.real_group.id
        type: string
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_responsible_audit_token_signing_id_to_process_responsible_code_signature_signing_id_fa554797
        field: jamf_protect.telemetry.process.responsible_audit_token.signing_id
        target_field: process.responsible.code_signature.signing_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_process_responsible_audit_token_exec_path_to_process_responsible_executable_a15031bc
        field: jamf_protect.telemetry.process.responsible_audit_token.exec_path
        target_field: process.responsible.executable
        ignore_missing: true
