        tag: set_event_reason_eac587be
        field: event.reason
        value: A member has been removed from a group using Open Directory
    - append:
        tag: append_event_type_0602e5be
        field: event.type
        value: change
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - append:
        tag: append_event_type_505e05d4
        field: event.type
        value: deletion  
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_remove_group_name_to_group_name_8c88c72a
        field: jamf_protect.telemetry.event.od_group_remove.group_name
        target_field: group.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_remove_member_member_value_to_user_name_93527c15
        field: jamf_protect.telemetry.event.od_group_remove.member.member_value
        target_field: user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_group_remove_db_path_to_file_path_cf60a768
        field: jamf_protect.telemetry.event.od_group_remove.db_path
        target_field: file.path
        ignore_missing: true

