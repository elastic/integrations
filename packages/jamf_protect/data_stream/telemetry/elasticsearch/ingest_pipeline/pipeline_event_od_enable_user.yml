        target_field: jamf_protect.telemetry.tty
        ignore_missing: true
    - set:
        tag: set_process_interactive_1eedd307
        field: process.interactive
        value: true
        if: ctx.jamf_protect.telemetry?.event?.od_enable_user?.instigator?.tty != null
    - set:
        tag: set_process_interactive_5572747a
        field: process.interactive
        value: false
        if: ctx.jamf_protect.telemetry?.event?.od_enable_user?.instigator?.tty == null
