        field: jamf_protect.telemetry.event.od_enable_user.instigator.executable.sha256
        target_field: process.hash.sha256
        ignore_missing: true
    - append:
        tag: append_related_hash_96df867f
        field: related.hash
        value: '{{{process.hash.sha1}}}'
        if: ctx.process?.hash?.sha1 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_239dcc07
        field: related.hash
