---
description: Pipeline for parsing specific fields related to opendirectory enable user events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_177f8556
        field: event.reason
        value: A user has been enabled using Open Directory
    - append:
        tag: append_event_type_0602e5be
        field: event.type
        value: change
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_enable_user_group_name_to_group_name_0ae83bc1
        field: jamf_protect.telemetry.event.od_enable_user.group_name
        target_field: group.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_enable_user_user_name_to_user_name_ac0ee5d1
        field: jamf_protect.telemetry.event.od_enable_user.user_name
        target_field: user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_enable_user_db_path_to_file_path_f14c6cc7
        field: jamf_protect.telemetry.event.od_enable_user.db_path
        target_field: file.path
        ignore_missing: true

