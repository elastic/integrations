---
description: Pipeline for parsing specific fields related to kext unload events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_cf03dec5
        field: event.reason
        value: A kernel extension (kext) was unloaded
    - convert:
        tag: convert_jamf_protect_telemetry_event_kextunload_identifier_to_jamf_protect_telemetry_identifier_a8463343
        field: jamf_protect.telemetry.event.kextunload.identifier
        target_field: jamf_protect.telemetry.identifier
        type: string
        ignore_missing: true
    - append:
        tag: append_event_type_0602e5be
        field: event.type
        value: change
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    ##########################
    ## ECS Process ##
    ##########################
    - pipeline:
        tag: pipeline_object_process_0d75fa7a
        name: '{{ IngestPipeline "pipeline_object_process" }}'
