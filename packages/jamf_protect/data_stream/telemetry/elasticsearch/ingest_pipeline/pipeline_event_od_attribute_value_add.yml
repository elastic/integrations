        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_od_attribute_value_add_attribute_value_to_jamf_protect_telemetry_attribute_value_ca594f7e
        field: jamf_protect.telemetry.event.od_attribute_value_add.attribute_value
        target_field: jamf_protect.telemetry.attribute_value
        type: string
        ignore_missing: true
