---
description: Pipeline for parsing specific fields related to attribute value add events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_870b2664
        field: event.reason
        value: Attribute added to a user or group using Open Directory
    - append:
        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_group_name_to_group_name_ec2dfde4
        field: jamf_protect.telemetry.event.od_attribute_value_add.group_name
        target_field: group.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_record_name_to_user_name_a8aa4726
        field: jamf_protect.telemetry.event.od_attribute_value_add.record_name
        target_field: user.name
        ignore_missing: true
    - rename:
