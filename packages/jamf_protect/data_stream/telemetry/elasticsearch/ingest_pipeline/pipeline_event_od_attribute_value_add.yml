    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_instigator_executable_sha256_to_process_hash_sha256_ea6a3586
        field: jamf_protect.telemetry.event.od_attribute_value_add.instigator.executable.sha256
        target_field: process.hash.sha256
        ignore_missing: true
    - append:
        tag: append_related_hash_96df867f
        field: related.hash
        value: '{{{process.hash.sha1}}}'
        if: ctx.process?.hash?.sha1 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_239dcc07
        field: related.hash
        value: '{{{process.hash.sha256}}}'
        if: ctx.process?.hash?.sha256 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_f4079ea4
        field: related.hash
        value: '{{{process.hash.cdhash}}}'
        if: ctx.process?.hash?.cdhash != null && ctx.process.hash.cdhash != ''
        allow_duplicates: false
    - rename:
