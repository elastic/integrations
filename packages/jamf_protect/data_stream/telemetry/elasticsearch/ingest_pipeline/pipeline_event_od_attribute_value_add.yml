        type: long
        ignore_missing: true
        on_failure:
        - append:
            tag: append_error_message_72c1a5d6
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_instigator_audit_token_uuid_to_process_entity_id_07e99f35
        field: jamf_protect.telemetry.event.od_attribute_value_add.instigator.audit_token.uuid
        target_field: process.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_instigator_executable_path_to_process_executable_b7a65db3
        field: jamf_protect.telemetry.event.od_attribute_value_add.instigator.executable.path
        target_field: process.executable
        ignore_missing: true
    - script:
        tag: script_f232bce3
        lang: painless
        source: >
            if (ctx.process?.executable != null) {
                int lastSlashIndex = ctx.process.executable.lastIndexOf('/');
                if (lastSlashIndex != -1) {
                    ctx.process.name = ctx.process.executable.substring(lastSlashIndex + 1);
                } else {
                    ctx.process.name = ctx.process.executable; // Fallback if no slash is found
                }
            }
    - rename:
        tag: rename_jamf_protect_telemetry_thread_thread_id_to_process_thread_id_3987a29f
        field: jamf_protect.telemetry.thread.thread_id
        target_field: process.thread.id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_db_path_to_process_working_directory_4b6f5c17
        field: jamf_protect.telemetry.event.od_attribute_value_add.db_path
        target_field: process.working_directory
        ignore_missing: true
        if: ctx.jamf_protect?.telemetry?.event?.od_attribute_value_add?.db_path != null
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_value_add_instigator_signing_id_to_process_code_signature_signing_id_06ae8228
