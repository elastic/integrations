---
description: Pipeline for parsing specific fields related to group set events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_df6d1b9e
        field: event.reason
        value: A group has a member initialised or replaced using Open Directory
