---
description: Pipeline for parsing specific fields related to exec events in Jamf Protect
processors:

##########################
## ECS Event Specific ##
##########################
    - set:
        tag: set_event_reason_3b9209af
        field: event.reason
        value: A new process has been executed
    - append:
        tag: append_event_type_fffb7a5a
        field: event.type
        value: start
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_script_path_to_file_path_9cdfb881
        field: jamf_protect.telemetry.event.exec.script.path
        target_field: file.path
        ignore_missing: true

##########################
## ECS Process ##
##########################
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_start_time_to_process_start_a622f76c
        field: jamf_protect.telemetry.event.exec.target.start_time
        target_field: process.start
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_exec_target_audit_token_egid_to_jamf_protect_telemetry_event_exec_target_audit_token_egid_6673124a
        field: jamf_protect.telemetry.event.exec.target.audit_token.egid
        target_field: jamf_protect.telemetry.event.exec.target.audit_token.egid
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_exec_target_audit_token_euid_to_jamf_protect_telemetry_event_exec_target_audit_token_euid_8487701e
        field: jamf_protect.telemetry.event.exec.target.audit_token.euid
        target_field: jamf_protect.telemetry.event.exec.target.audit_token.euid
        type: string
        ignore_missing: true
    - append:
        tag: append_user_effective_id_4ec8cc8f
        field: user.effective.id
        value: '{{{jamf_protect.telemetry.event.exec.target.audit_token.euid}}}'
        if: ctx.jamf_protect.telemetry?.event?.exec?.target?.audit_token?.euid != null
        allow_duplicates: false
        ignore_failure: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_audit_token_e_username_to_process_user_name_d80605ed
        field: jamf_protect.telemetry.event.exec.target.audit_token.e_username
        target_field: process.user.name
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_is_platform_binary_to_process_platform_binary_42dc9cb1
        field: jamf_protect.telemetry.event.exec.target.is_platform_binary
        target_field: process.platform_binary
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_is_es_client_to_process_endpoint_security_client_a1fdb211
        field: jamf_protect.telemetry.event.exec.target.is_es_client
        target_field: process.endpoint_security_client
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_cdhash_to_process_hash_cdhash_b622bd14
        field: jamf_protect.telemetry.event.exec.target.cdhash
        target_field: process.hash.cdhash
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_executable_sha1_to_process_hash_sha1_246c2aca
        field: jamf_protect.telemetry.event.exec.target.executable.sha1
        target_field: process.hash.sha1
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_executable_sha256_to_process_hash_sha256_9d3556a2
        field: jamf_protect.telemetry.event.exec.target.executable.sha256
        target_field: process.hash.sha256
        ignore_missing: true
    - append:
        tag: append_related_hash_96df867f
        field: related.hash
        value: '{{{process.hash.sha1}}}'
        if: ctx.process?.hash?.sha1 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_239dcc07
        field: related.hash
        value: '{{{process.hash.sha256}}}'
        if: ctx.process?.hash?.sha256 != null
        allow_duplicates: false
    - append:
        tag: append_related_hash_f4079ea4
        field: related.hash
        value: '{{{process.hash.cdhash}}}'
        if: ctx.process?.hash?.cdhash != null && ctx.process.hash.cdhash != ''
        allow_duplicates: false
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_tty_path_to_jamf_protect_telemetry_tty_2e81f66d
        field: jamf_protect.telemetry.event.exec.target.tty.path
        target_field: jamf_protect.telemetry.tty
        ignore_missing: true
    - set:
        tag: set_process_interactive_959b36ce
        field: process.interactive
        value: true
        if: ctx.jamf_protect.telemetry?.event?.exec?.target?.tty != null
    - set:
        tag: set_process_interactive_e60fa981
        field: process.interactive
        value: false
        if: ctx.jamf_protect.telemetry?.event?.exec?.target?.tty == null
    - convert:
        tag: convert_jamf_protect_telemetry_event_exec_target_audit_token_pid_to_process_pid_52fb8f6f
        field: jamf_protect.telemetry.event.exec.target.audit_token.pid
        target_field: process.pid
        type: long
        ignore_missing: true
        on_failure:
        - append:
            tag: append_error_message_cb1421f6
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_audit_token_uuid_to_process_entity_id_ac1e0569
        field: jamf_protect.telemetry.event.exec.target.audit_token.uuid
        target_field: process.entity_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_executable_path_to_process_executable_46d78b57
        field: jamf_protect.telemetry.event.exec.target.executable.path
        target_field: process.executable
        ignore_missing: true
    - script:
        tag: script_f232bce3
        lang: painless
        source: >
            if (ctx.process?.executable != null) {
                int lastSlashIndex = ctx.process.executable.lastIndexOf('/');
                if (lastSlashIndex != -1) {
                    ctx.process.name = ctx.process.executable.substring(lastSlashIndex + 1);
                } else {
                    ctx.process.name = ctx.process.executable; // Fallback if no slash is found
                }
            }
    - rename:
        tag: rename_jamf_protect_telemetry_thread_thread_id_to_process_thread_id_3987a29f
        field: jamf_protect.telemetry.thread.thread_id
        target_field: process.thread.id
        ignore_missing: true

    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_args_to_process_args_dfd25ea5
        field: jamf_protect.telemetry.event.exec.args
        target_field: process.args
        ignore_missing: true
        if: ctx.jamf_protect?.telemetry?.event?.exec?.args != null
    - script:
        tag: script_c76fe348
        description: Counts the indexes of the arguments
        lang: painless
        source: >
            if (ctx.process.args instanceof List) {
              ctx.process.args_count = ctx.process.args.size();
            } else {
              ctx.process = ctx.process != null ? ctx.process : new HashMap();
              ctx.process.args_count = 0;
            }
        ignore_failure: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_env_to_process_env_vars_ea9ed1e2
        field: jamf_protect.telemetry.event.exec.env
        target_field: process.env_vars
        ignore_missing: true
        if: ctx.jamf_protect?.telemetry?.event?.exec?.env != null
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_cwd_path_to_process_working_directory_45e32ab4
        field: jamf_protect.telemetry.event.exec.cwd.path
        target_field: process.working_directory
        ignore_missing: true
        if: ctx.jamf_protect?.telemetry?.event?.exec?.cwd?.path != null
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_signing_id_to_process_code_signature_signing_id_c120f59c
        field: jamf_protect.telemetry.event.exec.target.signing_id
        target_field: process.code_signature.signing_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_team_id_to_process_code_signature_team_id_6e8fc102
        field: jamf_protect.telemetry.event.exec.target.team_id
        target_field: process.code_signature.team_id
        ignore_missing: true
    - rename:
        tag: rename_jamf_protect_telemetry_event_exec_target_codesigning_flags_to_process_code_signature_flags_9897fe87
        field: jamf_protect.telemetry.event.exec.target.codesigning_flags
        target_field: process.code_signature.flags
        ignore_missing: true

