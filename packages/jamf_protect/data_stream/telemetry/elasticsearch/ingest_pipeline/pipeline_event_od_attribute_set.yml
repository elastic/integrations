        tag: append_event_type_fbbdb681
        field: event.type
        value: creation
    - append:
        tag: append_event_category_1c667e2c
        field: event.category
        value: configuration
    - rename:
        tag: rename_jamf_protect_telemetry_event_od_attribute_set_group_name_to_group_name_bf39c915
