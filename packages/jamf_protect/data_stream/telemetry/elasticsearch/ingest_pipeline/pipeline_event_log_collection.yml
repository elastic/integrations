---
description: Pipeline for Jamf Protect Telemetry log collection events.
processors:

##########################
## ECS Event Specific ##
##########################
    - set:
        tag: set_event_reason_3c1b91ae
        field: event.reason
        value: New entries have been collected from a log file
    - rename:
        tag: rename_jamf_protect_telemetry_event_log_collection_path_to_log_file_path_db8f7312
        field: jamf_protect.telemetry.event.log_collection.path
        target_field: log.file.path
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_log_collection_texts_to_jamf_protect_telemetry_log_entries_36d5b2be
        field: jamf_protect.telemetry.event.log_collection.texts
        target_field: jamf_protect.telemetry.log_entries
        type: string
        ignore_missing: true