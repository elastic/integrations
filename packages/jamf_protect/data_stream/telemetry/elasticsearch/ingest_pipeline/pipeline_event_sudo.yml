---
description: Pipeline for parsing specific fields related to sudo events in Jamf Protect
processors:

    ##########################
    ## ECS Event Specific ##
    ##########################
    - set:
        tag: set_event_reason_86945cd2
        field: event.reason
        value: A sudo attempt occurred
    - append:
        tag: append_event_type_fffb7a5a
        field: event.type
        value: start
    - rename:
        tag: rename_jamf_protect_telemetry_event_sudo_command_to_process_command_line_32d9e640
        field: jamf_protect.telemetry.event.sudo.command
        target_field: process.command_line
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_sudo_attribute_name_to_jamf_protect_telemetry_attribute_name_39101063
        field: jamf_protect.telemetry.event.sudo.attribute_name
        target_field: jamf_protect.telemetry.attribute_name
        type: string
        ignore_missing: true
    - convert:
        tag: convert_jamf_protect_telemetry_event_sudo_attribute_value_to_jamf_protect_telemetry_attribute_value_0702a9b7
        field: jamf_protect.telemetry.event.sudo.attribute_value
        target_field: jamf_protect.telemetry.attribute_value
        type: string
        ignore_missing: true
    ##########################
    ## ECS Process ##
    ##########################
    - pipeline:
        tag: pipeline_object_process_0d75fa7a
        name: '{{ IngestPipeline "pipeline_object_process" }}'
