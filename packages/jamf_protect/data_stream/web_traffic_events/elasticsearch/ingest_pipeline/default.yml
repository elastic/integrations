---
description: Pipeline for parsing Jamf Protect Web Protection traffic logs
processors:
    - set:
        tag: set_ecs_version_f5923549
        field: ecs.version
        value: '8.17.0'
    - json:
        tag: json_message_to_jamf_protect_traffic_e825ce31
        field: message
        target_field: jamf_protect.traffic
        if: ctx.message != null
    - rename:
        tag: rename_json_to_jamf_protect_traffic_767af61b
        field: json
        target_field: jamf_protect.traffic
        if: ctx.json != null

    ##########################
    ## ECS Observer Mapping ##
    ##########################
    - set:
        tag: set_observer_product_e40a396c
        field: observer.product
        value: Jamf Protect
    - set:
        tag: set_observer_vendor_6a522e0a
        field: observer.vendor
        value: Jamf
    - set:
        tag: set_observer_type_ae54f4bd
        field: observer.type
        value: Endpoint Security

    #######################
    ## ECS Event Mapping ##
    #######################
    - set:
        tag: set_event_kind_de80643c
        field: event.kind
        value: event
    - set:
        tag: set_event_provider_7e881320
        field: event.provider
        value: Jamf Protect
    - rename:
        tag: rename_jamf_protect_traffic_event_timestamp_to_event_start_1cdc9dc5
        field: jamf_protect.traffic.event.timestamp
        target_field: event.start
        if: ctx.jamf_protect?.traffic?.event?.timestamp != null
    - append:
        tag: append_event_category_3fa422a0
        field: event.category
        value: host
    - append:
        tag: append_event_category_7afdca3c
        field: event.category
        value: network
    - append:
        tag: append_event_type_ab8d9d0e
        field: event.type
        value: connection
    - append:
        tag: append_event_category_044a2c00
        field: event.category
        value: malware
        if: ctx.jamf_protect?.traffic?.event?.threat?.types == 'malware'
    - set:
        tag: set_event_action_50a2afa1
        field: event.action
        value: '{{{jamf_protect.traffic.event.signatureId.name}}}'
        if: ctx.jamf_protect?.traffic?.event?.signatureId?.name != null
    - set:
        tag: set_event_reason_8ef4c98b
        field: event.reason
        value: '{{{jamf_protect.traffic.event.threat.result}}}'
        if: ctx.jamf_protect?.traffic?.event?.threat?.result != null
    - append:
        tag: append_event_outcome_5e0b9f8a
        field: event.outcome
        value: failure
        if: ctx.jamf_protect?.traffic?.event?.blocked == true
    - append:
        tag: append_event_outcome_911c0f36
        field: event.outcome
        value: success
        if: ctx.jamf_protect?.traffic?.event?.blocked == false
        # ignore_missing: true

    #######################
    ## ECS Rule Mapping ##
    #######################
    - set:
        tag: set_rule_name_bc4ad9a8
        field: rule.name
        value: '{{{jamf_protect.traffic.event.signatureId.name}}}'
        if: ctx.jamf_protect?.traffic?.event?.signatureId?.name != null
        # ignore_missing: true
    - rename:
        tag: rename_jamf_protect_traffic_event_signatureId_id_toString()_to_rule_id_78fc9ed7
        field: jamf_protect.traffic.event.signatureId.id.toString()
        target_field: rule.id
        if: ctx.jamf_protect?.traffic?.event?.signatureId?.id != null
        ignore_missing: true

    #######################
    ## ECS Host Mapping ##
    #######################
    - rename:
        tag: rename_jamf_protect_traffic_event_device_userDeviceName_to_host_hostname_0fb2d2d6
        field: jamf_protect.traffic.event.device.userDeviceName
        target_field: host.hostname
        ignore_missing: true
        if: ctx.jamf_protect?.traffic?.event?.device?.userDeviceName != null
    - rename:
        tag: rename_jamf_protect_traffic_event_device_deviceName_to_host_hostname_35c5f85f
        field: jamf_protect.traffic.event.device.deviceName
        target_field: host.hostname
        ignore_missing: true
        if: ctx.jamf_protect?.traffic?.event?.device?.deviceName == null && ctx.jamf_protect?.traffic?.event?.device?.userDeviceName != null
    - rename:
        tag: rename_jamf_protect_traffic_event_device_deviceId_to_host_id_64cf30e6
        field: jamf_protect.traffic.event.device.deviceId
        target_field: host.id
        ignore_missing: true
        if: ctx.jamf_protect?.traffic?.event?.device?.deviceId != null
    # - rename:
    #     field: jamf_protect.traffic.event.host.ips
    #     target_field: host.ip
    #     ignore_missing: true
    #     if: ctx.jamf_protect?.traffic?.event?.host?.ips != null && ctx.jamf_protect?.traffic?.event?.host?.ips != ""
    - rename:
        tag: rename_jamf_protect_traffic_event_device_os_to_host_os_full_69569b90
        field: jamf_protect.traffic.event.device.os
        target_field: host.os.full
        if: ctx.jamf_protect?.traffic?.event?.device?.os != null
        ignore_missing: true
    - append:
        tag: append_host_os_type_856fcde5
        field: host.os.type
        value: ios
        if: ctx.jamf_protect?.traffic?.event?.device?.osType == "IOS"
    - append:
        tag: append_host_os_type_9b9e494c
        field: host.os.type
        value: macos
        if: ctx.jamf_protect?.traffic?.event?.device?.osType == "MAC_OS"


    ########################
    ## ECS User Mapping ##
    ########################
    - rename:
          tag: rename_jamf_protect_traffic_event_user_name_to_user_name_f28c8f1e
          field: jamf_protect.traffic.event.user.name
          target_field: user.name
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.user?.name != null
    - rename:
          tag: rename_jamf_protect_traffic_event_user_email_to_user_email_bbbeaccd
          field: jamf_protect.traffic.event.user.email
          target_field: user.email
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.user?.email != null

    ########################
    ## ECS DNS Mapping ##
    ########################
    - rename:
          tag: rename_jamf_protect_traffic_event_tld_to_dns_question_top_level_domain_7f5d9d7f
          field: jamf_protect.traffic.event.tld
          target_field: dns.question.top_level_domain
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.tld != null
    - rename:
          tag: rename_jamf_protect_traffic_event_domain_to_dns_question_registered_domain_5872b015
          field: jamf_protect.traffic.event.domain
          target_field: dns.question.registered_domain
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.domain != null
    - rename:
          tag: rename_jamf_protect_traffic_event_hostName_to_dns_question_name_cdb90a33
          field: jamf_protect.traffic.event.hostName
          target_field: dns.question.name
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.hostName != null

    - rename:
          tag: rename_jamf_protect_traffic_event_dns_responseStatus_to_dns_response_code_b8ec27ba
          field: jamf_protect.traffic.event.dns.responseStatus
          target_field: dns.response_code
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.dns?.responseStatus != null
    - rename:
          tag: rename_jamf_protect_traffic_event_dns_recordType_to_dns_answers_type_99addc3a
          field: jamf_protect.traffic.event.dns.recordType
          target_field: dns.answers.type
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.dns?.recordType != null
    - rename:
          tag: rename_jamf_protect_traffic_event_dns_ttl_to_dns_answers_ttl_7c4887d8
          field: jamf_protect.traffic.event.dns.ttl
          target_field: dns.answers.ttl
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.dns?.ttl != null
    - set:
          tag: set_dns_resolved_ip_a329cffe
          field: dns.resolved_ip
          value: '{{{jamf_protect.traffic.event.destination.ip}}}'
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.destination?.ip != null

    ########################
    ## ECS GEO Mapping ##
    ########################
    - rename:
          tag: rename_jamf_protect_traffic_event_location_to_host_geo_country_iso_code_5022d5d0
          field: jamf_protect.traffic.event.location
          target_field: host.geo.country_iso_code
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.location != null

    #######################
    ## ECS Destination Mapping ##
    #######################
    - rename:
          tag: rename_jamf_protect_traffic_event_destination_ip_to_destination_address_1351f4c8
          field: jamf_protect.traffic.event.destination.ip
          target_field: destination.address
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.destination?.ip != null
    - rename:
          tag: rename_jamf_protect_traffic_event_destination_name_to_destination_domain_3789860c
          field: jamf_protect.traffic.event.destination.name
          target_field: destination.domain
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.destination?.name != null
    - rename:
          tag: rename_jamf_protect_traffic_event_destination_port_to_destination_port_90e09379
          field: jamf_protect.traffic.event.destination.port
          target_field: destination.port
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.destination?.port != null

    #######################
    ## ECS Source Mapping ##
    #######################
    - rename:
          tag: rename_jamf_protect_traffic_event_source_ip_to_source_address_0bab4910
          field: jamf_protect.traffic.event.source.ip
          target_field: source.address
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.destination?.ip != null
    - rename:
          tag: rename_jamf_protect_traffic_event_source_port_to_source_port_a64c44a4
          field: jamf_protect.traffic.event.source.port
          target_field: source.port
          #   ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.source?.port != null

    # ########################
    # # ECS Organization Mapping ##
    # ########################
    - rename:
          tag: rename_jamf_protect_traffic_event_account_customerId_to_organization_id_3a9bde01
          field: jamf_protect.traffic.event.account.customerId
          target_field: organization.id
          ignore_missing: true
          if: ctx.jamf_protect?.traffic?.event?.account?.customerId != null

    #############
    ## Cleanup ##
    #############
    - remove:
        tag: remove_d5c8f784
        field:
        - jamf_protect.traffic
        - jamf_protect
        - message
        ignore_missing: true
    - script:
        tag: script_258616c7
        description: Drops null/empty values recursively.
        lang: painless
        source: |
            boolean dropEmptyFields(Object object) {
            if (object == null || object == '') {
                return true;
            } else if (object instanceof Map) {
                ((Map) object).values().removeIf(value -> dropEmptyFields(value));
                return (((Map) object).size() == 0);
            } else if (object instanceof List) {
                ((List) object).removeIf(value -> dropEmptyFields(value));
                return (((List) object).length == 0);
            }
            return false;
            }
            dropEmptyFields(ctx);

on_failure:
    - set:
        tag: set_event_kind
        field: event.kind
        value: pipeline_error
    - append:
        tag: append_tags
        field: tags
        value: preserve_original_event
        allow_duplicates: false
    - append:
        tag: append_error_message
        field: error.message
        value: '{{{ _ingest.on_failure_message }}}'
