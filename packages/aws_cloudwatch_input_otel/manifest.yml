format_version: 3.5.0
name: aws_cloudwatch_input_otel
title: "AWS CloudWatch (OpenTelemetry)"
version: 1.0.0
source:
  license: "Elastic-2.0"
description: "Generic OpenTelemetry input that configures the awscloudwatch receiver and the awscredentialsprovider extension. Metric discovery and processors are supplied by the integration data stream."
type: input
categories:
  - aws
  - cloud
  - observability
  - opentelemetry
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/logo_aws_cloudwatch_otel.svg
    title: AWS CloudWatch OpenTelemetry logo
    size: 32x32
    type: image/svg+xml

# --- Package-level (shared) variables ---
# Defined once here and inherited by every policy template below — credentials,
# region, and receiver tunables are not duplicated per service.
vars:
  - name: region
    type: text
    title: AWS Region
    description: AWS region to query CloudWatch metrics from (for example, `us-east-1`).
    required: true
    show_user: true
  # --- Inline AWS credentials (rendered into env vars on the collector process) ---
  - name: access_key_id
    type: password
    title: AWS Access Key ID
    description: Mapped to `AWS_ACCESS_KEY_ID` on the collector process when an IAM role is not available.
    required: false
    show_user: true
    secret: true
  - name: secret_access_key
    type: password
    title: AWS Secret Access Key
    description: Mapped to `AWS_SECRET_ACCESS_KEY`.
    required: false
    show_user: true
    secret: true
  - name: session_token
    type: password
    title: AWS Session Token
    description: Mapped to `AWS_SESSION_TOKEN` for temporary STS credentials.
    required: false
    show_user: true
    secret: true
  - name: role_arn
    type: text
    title: AWS Role ARN
    description: Mapped to `AWS_ROLE_ARN`.
    required: false
    show_user: false
  - name: external_id
    type: password
    title: AWS External ID
    description: Mapped to `AWS_ROLE_EXTERNAL_ID`.
    required: false
    show_user: false
    secret: true
policy_templates:
  - name: awscloudwatch
    type: metrics
    title: AWS CloudWatch OpenTelemetry Input
    description: Collect CloudWatch metrics with the OpenTelemetry awscloudwatch receiver.
    input: otelcol
    template_path: input.yml.hbs
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        is_default: true
        release: beta
        organization: observability
        division: engineering
        team: obs-signals-integrations-team

owner:
  github: elastic/obs-signals-integrations-team
  type: elastic
