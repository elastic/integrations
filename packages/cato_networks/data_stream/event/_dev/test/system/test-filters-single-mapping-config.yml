input: cel
service: cato_networks
wait_for_data_timeout: 1m
vars:
  url: http://{{Hostname}}:{{Port}}
  api_key: xxxx
data_stream:
  vars:
    account_ids:
      - 33333
    # A single filter written as a mapping, without the leading dash, must be sent as a
    # one-element list and enable filtered pagination, as in test-filters-config.yml.
    interval: 5m
    filters: |-
      fieldName: event_sub_type
      operator: in
      values:
        - WAN Firewall
    preserve_original_event: true
assert:
  hit_count: 2
