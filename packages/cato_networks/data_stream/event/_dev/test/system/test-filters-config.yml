input: cel
service: cato_networks
wait_for_data_timeout: 1m
vars:
  url: http://{{Hostname}}:{{Port}}
  api_key: xxxx
data_stream:
  vars:
    account_ids:
      - 33333
    # Longer than wait_for_data_timeout: both events must come from consecutive
    # requests in the first cycle, which requires pagination to continue while the
    # filtered marker advances even though each page has fewer than 3000 events.
    interval: 5m
    filters: |-
      - fieldName: event_sub_type
        operator: in
        values:
          - WAN Firewall
    preserve_original_event: true
assert:
  hit_count: 2
