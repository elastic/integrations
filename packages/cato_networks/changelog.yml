# later versions go on top
- version: "0.2.0"
  changes:
    - description: Update Elastic Managed integration documentation to the current wording and docs links.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: '0.1.3'
  changes:
    - description: Fix the `event` input silently succeeding when the Cato Networks API returns a non-null `accounts.errorString` with HTTP 200. The input now surfaces this as an input error so Fleet reports the stream as unhealthy.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20959
- version: '0.1.2'
  changes:
    - description: Set agentless deployment mode `release` field to `beta`.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20478
- version: '0.1.1'
  changes:
    - description: Simplify the audit `last_timestamp` parse guard to use `is_error` instead of `try`/`has`.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20051
- version: '0.1.0'
  changes:
    - description: Initial release of package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/19307
