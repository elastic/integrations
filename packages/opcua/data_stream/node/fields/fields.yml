- name: opcua.node
  type: group
  description: The value of one OPC UA node.
  fields:
    - name: id
      type: keyword
      description: The node id, as configured, for example `ns=3;s=StepUp`.
    - name: label
      type: keyword
      description: The label configured for the node.
    - name: name
      type: keyword
      description: The display name of the node, as reported by the server.
    - name: data_type
      type: keyword
      description: The OPC UA data type of the value, for example `Double` or `Uint32`. Arrays end in `[]` and are not indexed.
    - name: source_timestamp
      type: date
      description: The time the value was last changed at its source, as reported by the server.
    - name: server_timestamp
      type: date
      description: The time the server last received or verified the value.
    - name: status
      type: group
      fields:
        - name: code
          type: long
          description: The numeric OPC UA status code of the value. 0 means Good.
        - name: name
          type: keyword
          description: The name of the status code, for example `Good` or `StatusBadNodeIDUnknown`.
        - name: severity
          type: keyword
          description: The severity of the status code, `good`, `uncertain` or `bad`. Values with a bad status are not indexed.
    - name: value
      type: group
      description: The value of the node. At most one of the typed fields is set, depending on the data type.
      fields:
        - name: double
          type: double
          metric_type: gauge
          description: Float and Double values, and unsigned 64-bit values above the range of a long.
        - name: long
          type: long
          metric_type: gauge
          description: Integer and status code values.
        - name: boolean
          type: boolean
          description: Boolean values.
        - name: keyword
          type: keyword
          description: String, LocalizedText, QualifiedName, NodeId and Guid values.
        - name: date
          type: date
          description: DateTime values.
