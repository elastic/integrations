title: "Elastic Cloud cost and usage (FOCUS 1.4)"
type: metrics
dataset: ess_billing.cost_and_usage
elasticsearch:
  source_mode: synthetic
streams:
  - input: cel
    title: Elastic Cloud cost and usage
    description: Collect daily billing line items from the Elastic Cloud billing API and store them as FOCUS 1.4 Cost and Usage rows.
    template_path: cel.yml.hbs
    enabled: true
    vars:
      - name: add_tags
        type: bool
        title: Add deployment tags
        description: Whether to add deployment tags to each event collected (this will perform an additional API call against the configured deployment search API, for each execution).
        multi: false
        required: false
        show_user: true
        default: false
      - name: dep_search_url
        type: text
        title: Deployment search URL
        description: Endpoint to fetch deployment tags from. Only used if "Add deployment tags" is enabled.
        multi: false
        required: false
        show_user: false
        default: https://cloud.elastic.co/api/v1/deployments/_search
      - name: lookbehind
        type: integer
        title: Lookbehind
        description: How far back to fetch data for the first run (in days), default to 1 year.
        default: 365
        multi: false
        required: true
        show_user: true
      # --- FOCUS settings (new in 2.0.0). Stamped on every billing line item by
      # --- agent/stream/cel.yml.hbs, read by elasticsearch/ingest_pipeline/focus.yml.
      - name: purchase_channel
        type: select
        title: Purchase channel
        description: How this organization buys Elastic Cloud. Used by the FOCUS cost and usage dataset. For a cloud marketplace purchase the marketplace invoices the usage, so `BilledCost` is 0 and `InvoiceIssuerName` is the cloud provider. This avoids counting the cost twice next to the cloud provider's own FOCUS data.
        multi: false
        required: true
        show_user: true
        default: direct
        options:
          - value: direct
            text: Direct from Elastic
          - value: gcp_marketplace
            text: Google Cloud Marketplace
          - value: aws_marketplace
            text: AWS Marketplace
          - value: azure_marketplace
            text: Azure Marketplace
      - name: contracted_ecu_rate
        type: text
        title: Contracted price of one ECU (USD)
        description: Price of one Elastic Consumption Unit in your contract, in USD. Used for `ContractedCost`, `EffectiveCost` and `ContractedUnitPrice` in the FOCUS dataset. Leave 1.0 for the list price. An invalid value is treated as 1.0.
        multi: false
        required: false
        show_user: false
        default: "1.0"
      - name: billing_account_name
        type: text
        title: Billing account name
        description: Display name of the organization for `BillingAccountName` in the FOCUS dataset. The billing API returns only the organization ID, which is used when this is empty.
        multi: false
        required: false
        show_user: false
      # --- end of FOCUS settings
      - name: hide_sensitive
        type: bool
        title: Hide Sensitive True
        description: Hide sensitive user details.
        multi: false
        required: false
        show_user: false
        default: true
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Supported time units are ns, us, ms, s, m, h.
        multi: false
        required: true
        show_user: false
        default: 30s
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        multi: false
        required: false
        show_user: false
        description: The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - billing
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
