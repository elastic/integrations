---
description: Pipeline for parsing azure openai metrics.
processors:
  - rename:
      field: azure.metrics
      target_field: azure.open_ai
      ignore_missing: true
  - rename:
      field: azure.open_ai.azure_openairequests.total
      target_field: azure.open_ai.requests.total
      ignore_missing: true
  - rename:
      field: azure.open_ai.azure_openaiprovisioned_managed_utilization_v2.avg
      target_field: azure.open_ai.provisioned_managed_utilization_v2.avg
      ignore_missing: true
  - rename:
      field: azure.open_ai.azure_openaitime_toresponse.avg
      target_field: azure.open_ai.time_to_response.avg
      ignore_missing: true
  - rename:
      field: azure.open_ai.azure_openaicontext_tokens_cache_match_rate.avg
      target_field: azure.open_ai.context_tokens_cache_match_rate.avg
      ignore_missing: true
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - set:
      tag: set_gen_ai_provider_name
      field: gen_ai.provider.name
      value: azure.ai.openai
  - set:
      tag: set_gen_ai_request_model_from_model_name
      field: gen_ai.request.model
      copy_from: azure.dimensions.model_name
      ignore_empty_value: true
      if: ctx.azure?.dimensions?.model_name != null
  - set:
      tag: set_gen_ai_request_model_from_deployment
      field: gen_ai.request.model
      copy_from: azure.dimensions.model_deployment_name
      ignore_empty_value: true
      if: ctx.gen_ai?.request?.model == null && ctx.azure?.dimensions?.model_deployment_name != null
  - convert:
      tag: convert_gen_ai_usage_input_tokens
      field: azure.open_ai.processed_prompt_tokens.total
      target_field: gen_ai.usage.input_tokens
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_azure_open_ai_processed_prompt_tokens_total_on_convert_failure
            field: azure.open_ai.processed_prompt_tokens.total
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_gen_ai_usage_output_tokens
      field: azure.open_ai.generated_tokens.total
      target_field: gen_ai.usage.output_tokens
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_azure_open_ai_generated_tokens_total_on_convert_failure
            field: azure.open_ai.generated_tokens.total
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
on_failure:
  - set:
      field: error.message
      value: '{{ _ingest.on_failure_message }}'
