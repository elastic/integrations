---
description: Pipeline for parsing google_workspace logs
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_ecs_version_135371bc
      field: ecs.version
      value: '8.16.0'
  - append:
      tag: append_event_category_423f7188
      field: event.category
      value: file
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - drop:
      if: ctx.json?.events == null
      description: Discard events that are missing the target during the split operation and are subsequently returned as the root object.
      tag: drop_empty_events
  - date:
      tag: date_json_id_time_dc34ff3c
      field: json.id.time
      if: ctx.json?.id?.time != null && ctx.json.id.time != ''
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      on_failure:
        - append:
            tag: append_error_message_a48f8d5f
            field: error.message
            value: "{{{_ingest.on_failure_message}}}"
  - fingerprint:
      tag: fingerprint_567b61c4
      description: Hashes the ID object and uses it as the document id to avoid duplicate events.
      fields:
        - json.id
        - json.events
      target_field: _id
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_events_name_to_event_action_75ca640e
      field: json.events.name
      target_field: event.action
      ignore_missing: true
  - rename:
      tag: rename_json_id_applicationName_to_event_provider_fffca35d
      field: json.id.applicationName
      target_field: event.provider
      ignore_missing: true
  - convert:
      tag: convert_json_id_uniqueQualifier_to_event_id_0664525d
      field: json.id.uniqueQualifier
      target_field: event.id
      type: string
      ignore_missing: true
  - rename:
      tag: rename_json_actor_email_to_source_user_email_4ee5e9ab
      field: json.actor.email
      target_field: source.user.email
      ignore_missing: true
  - set:
      tag: set_user_email_f8429233
      field: user.email
      copy_from: source.user.email
      ignore_failure: true
  - convert:
      tag: convert_json_actor_profileId_to_source_user_id_edfcffb4
      field: json.actor.profileId
      target_field: source.user.id
      type: string
      ignore_missing: true
  - set:
      tag: set_user_id_64f70b73
      field: user.id
      copy_from: source.user.id
      if: ctx?.source?.user?.id != null
  - rename:
      tag: rename_json_ipAddress_to_source_ip_726bbe73
      field: json.ipAddress
      target_field: source.ip
      ignore_missing: true
  - rename:
      tag: rename_json_kind_to_google_workspace_kind_8c6d9f29
      field: json.kind
      target_field: google_workspace.kind
      ignore_missing: true
  - rename:
      field: json.id.customerId
      target_field: organization.id
      ignore_missing: true
      tag: rename_customer_id_to_organization_id
      on_failure:
        - append:
            tag: append_error_message_0678effb
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_actor_callerType_to_google_workspace_actor_type_308eeffc
      field: json.actor.callerType
      target_field: google_workspace.actor.type
      ignore_missing: true
  - rename:
      tag: rename_json_actor_key_to_google_workspace_actor_key_3f392d49
      field: json.actor.key
      target_field: google_workspace.actor.key
      ignore_missing: true
  - rename:
      tag: rename_json_actor_applicationInfo_applicationName_to_google_workspace_actor_application_name_7bd54cfa
      field: json.actor.applicationInfo.applicationName
      target_field: google_workspace.actor.application_name
      ignore_missing: true
  - rename:
      tag: rename_json_ownerDomain_to_google_workspace_organization_domain_6580cd7d
      field: json.ownerDomain
      target_field: google_workspace.organization.domain
      ignore_missing: true
  - rename:
      tag: rename_json_events_type_to_google_workspace_event_type_e73f1e18
      field: json.events.type
      target_field: google_workspace.event.type
      ignore_missing: true
  - script:
      tag: script_8d756e1a
      lang: painless
      if: 'ctx?.source?.user?.email != null && ctx?.source?.user?.email.contains("@")'
      source: >
        String[] splitmail = ctx.source.user.email.splitOnToken('@');
        if (splitmail.length != 2) {
          return;
        }
        if (ctx.user == null) {
          ctx.user = new HashMap();
        }
        ctx.user.name = splitmail[0];
        ctx.source.user.name = splitmail[0];
        ctx.user.domain = splitmail[1];
        ctx.source.user.domain = splitmail[1];
  - append: 
      tag: append_event_type_aadb53b4
      field: event.type
      value: change
      if: '["add_to_folder", "edit", "add_lock", "move", "remove_from_folder", "rename", "remove_lock", "sheets_import_range", "approval_canceled", "approval_comment_added", "approval_requested", "approval_reviewer_responded", "change_acl_editors", "change_document_access_scope", "change_document_visibility", "shared_drive_membership_change", "shared_drive_settings_change", "sheets_import_range_access_change", "change_user_access"].contains(ctx?.event?.action)'
  - append: 
      tag: append_event_category_842af8a1
      field: event.category
      value: iam
      if: '["approval_canceled", "approval_comment_added", "approval_requested", "approval_reviewer_responded", "change_acl_editors", "change_document_access_scope", "change_document_visibility", "shared_drive_membership_change", "shared_drive_settings_change", "sheets_import_range_access_change", "change_user_access"].contains(ctx?.event?.action)'
  - append: 
      tag: append_event_category_ea3f2734
      field: event.category
      value: configuration
      if: '["approval_canceled", "approval_comment_added", "approval_requested", "approval_reviewer_responded", "change_acl_editors", "change_document_access_scope", "change_document_visibility", "shared_drive_membership_change", "shared_drive_settings_change", "sheets_import_range_access_change", "change_user_access"].contains(ctx?.event?.action)'
  - append: 
      tag: append_event_type_64b4a5c3
      field: event.type
      value: creation
      if: '["create", "untrash", "upload"].contains(ctx?.event?.action)'
  - append: 
      tag: append_event_type_c187e617
      field: event.type
      value: deletion
      if: '["delete", "trash"].contains(ctx?.event?.action)'
  - append: 
      tag: append_event_type_f24896a2
      field: event.type
      value: info
      if: '["download", "preview", "print", "view"].contains(ctx?.event?.action)'
  - script:
      tag: script_494eab2f
      lang: painless
      if: 'ctx?.json?.events?.parameters != null && ctx?.json?.events?.parameters instanceof List'
      source: >
        if (ctx.google_workspace.drive == null) {
          ctx.google_workspace.drive = new HashMap();
        }
        for (int i = 0; i < ctx.json.events.parameters.length; ++i) {
          if (ctx["json"]["events"]["parameters"][i]["value"] != null) {
            ctx.google_workspace.drive[ctx["json"]["events"]["parameters"][i]["name"]] = ctx["json"]["events"]["parameters"][i]["value"];
          }
          if (ctx["json"]["events"]["parameters"][i]["multiValue"] != null) {
            ctx.google_workspace.drive[ctx["json"]["events"]["parameters"][i]["name"]] = ctx["json"]["events"]["parameters"][i]["multiValue"];
          }
          if (ctx["json"]["events"]["parameters"][i]["boolValue"] != null) {
            ctx.google_workspace.drive[ctx["json"]["events"]["parameters"][i]["name"]] = ctx["json"]["events"]["parameters"][i]["boolValue"];
          }
        }
  - rename:
      tag: rename_google_workspace_drive_doc_id_to_google_workspace_drive_file_id_31e48411
      field: google_workspace.drive.doc_id
      target_field: google_workspace.drive.file.id
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_doc_title_to_file_name_ce1d1ffb
      field: google_workspace.drive.doc_title
      target_field: file.name
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_doc_type_to_google_workspace_drive_file_type_d86db149
      field: google_workspace.drive.doc_type
      target_field: google_workspace.drive.file.type
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_owner_to_google_workspace_drive_file_owner_email_a47fe15c
      field: google_workspace.drive.owner
      target_field: google_workspace.drive.file.owner.email
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_owner_is_shared_drive_to_google_workspace_drive_file_owner_is_shared_drive_547c3311
      field: google_workspace.drive.owner_is_shared_drive
      target_field: google_workspace.drive.file.owner.is_shared_drive
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_new_settings_state_to_google_workspace_drive_new_value_3cdce618
      field: google_workspace.drive.new_settings_state
      target_field: google_workspace.drive.new_value
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_old_settings_state_to_google_workspace_drive_old_value_a7881d42
      field: google_workspace.drive.old_settings_state
      target_field: google_workspace.drive.old_value
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_drive_target_user_to_google_workspace_drive_target_33c37ec1
      field: google_workspace.drive.target_user
      target_field: google_workspace.drive.target
      if: ctx.google_workspace?.drive?.target == null
      ignore_missing: true
  - set:
      tag: set_file_type_e4bb631b
      field: file.type
      value: dir
      if: '["folder", "shared"].contains(ctx?.google_workspace?.drive?.file?.type)'
  - set:
      tag: set_file_type_3c2c5e73
      field: file.type
      value: file
      if: ctx?.file?.type == null
  - script:
      tag: script_571619be
      lang: painless
      if: ctx?.file?.name != null
      source: >
        def path = ctx.file.name;
        def extIdx = path.lastIndexOf(".");
        if (extIdx > -1) {
            ctx.file.extension = path.substring(extIdx+1);
        }
  - script:
      tag: script_72693fa0
      lang: painless
      if: 'ctx?.google_workspace?.drive?.target != null && ctx?.google_workspace?.drive?.target.contains("@")'
      source: >
        String[] splitmail = ctx.google_workspace.drive.target.splitOnToken('@');
        if (splitmail.length != 2) {
          return;
        }
        if (ctx.related == null) {
          ctx.related = new HashMap();
        }
        if (ctx.related.user == null) {
          ctx.related.user = new ArrayList();
        }
        ctx.related.user.add(splitmail[0]);
  - script:
      tag: script_125fa133
      lang: painless
      if: 'ctx?.google_workspace?.drive?.file?.owner?.email != null && ctx?.google_workspace?.drive?.file?.owner?.email.contains("@")'
      source: >
        String[] splitmail = ctx.google_workspace.drive.file.owner.email.splitOnToken('@');
        if (splitmail.length != 2) {
          return;
        }
        if (ctx.file == null) {
          ctx.file = new HashMap();
        }
        ctx.file.owner = splitmail[0];
  - append:
      tag: append_related_ip_549fa858
      field: related.ip
      value: "{{{source.ip}}}"
      if: ctx?.source?.ip != null
      allow_duplicates: false
  - append:
      tag: append_related_user_bed17bbe
      field: related.user
      value: "{{{file.owner}}}"
      if: ctx?.file?.owner != null
      allow_duplicates: false
  - append:
      tag: append_related_user_8302ba1f
      field: related.user
      value: "{{{source.user.name}}}"
      if: ctx?.source?.user?.name != null
      allow_duplicates: false
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - remove:
      tag: remove_e5a80934
      field: 
        - json
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
