---
description: Pipeline for parsing google_workspace token logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_dcb19b9e
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.s
  - set:
      tag: set_ecs_version_135371bc
      field: ecs.version
      value: '8.16.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_90c6475f
      field: event.original
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_45b808be
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - drop:
      if: ctx.json?.events == null
      description: Discard events that are missing the target during the split operation and are subsequently returned as the root object.
      tag: drop_empty_events_ac9e0c9d
  - set:
      tag: set_event_kind_3a8924a2
      field: event.kind
      value: [event]
  - set:
      tag: set_event_category_ee497bfd
      field: event.category
      value: [iam]
  - date:
      tag: date_json_id_time_9350ecd5
      field: json.id.time
      if: ctx.json?.id?.time != null && ctx.json.id.time != ''
      formats:
        - UNIX
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      on_failure:
        - append:
            tag: append_error_message_18a82a92
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_id_time_01ac69ca
      field: google_workspace.id.time
      copy_from: '@timestamp'
      ignore_empty_value: true
  - fingerprint:
      tag: fingerprint_to_id_52623c07
      description: Hashes the ID object and uses it as the document id to avoid duplicate events.
      fields:
        - json.id
        - json.events
      target_field: _id
      ignore_missing: true
  - rename:
      tag: rename_json_events_name_to_event_action_75ca640e
      field: json.events.name
      target_field: event.action
      ignore_missing: true
  - set:
      tag: set_google_workspace_event_name_69e4d7fd
      field: google_workspace.event.name
      copy_from: event.action
      ignore_empty_value: true
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: [info]
  - append:
      tag: append_event_type_0140dff9
      field: event.type
      value: user
      if: '["authorize", "revoke"].contains(ctx.event?.action?.toLowerCase())'
  - append:
      tag: append_event_type_66c7d15b
      field: event.type
      value: deletion
      if: '["revoke"].contains(ctx.event?.action?.toLowerCase())'
  - rename:
      tag: rename_json_id_applicationName_to_event_provider_fffca35d
      field: json.id.applicationName
      target_field: event.provider
      ignore_missing: true
  - set:
      tag: set_google_workspace_id_application_name_8030da4a
      field: google_workspace.id.application_name
      copy_from: event.provider
      ignore_empty_value: true
  - convert:
      tag: convert_json_id_uniqueQualifier_to_event_id_0239362e
      field: json.id.uniqueQualifier
      target_field: event.id
      type: string
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_ab6a6ac3
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_id_unique_qualifier_8c91fe06
      field: google_workspace.id.unique_qualifier
      copy_from: event.id
      ignore_empty_value: true
  - rename:
      tag: rename_json_actor_email_to_source_user_email_4ee5e9ab
      field: json.actor.email
      target_field: source.user.email
      ignore_missing: true
  - set:
      tag: set_google_workspace_actor_email_9cd77425
      field: google_workspace.actor.email
      copy_from: source.user.email
      ignore_empty_value: true
  - set:
      tag: set_user_email_371886fa
      field: user.email
      copy_from: source.user.email
      ignore_empty_value: true
  - convert:
      tag: convert_json_actor_profileId_to_source_user_id_e10534f1
      field: json.actor.profileId
      target_field: source.user.id
      type: string
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_dc10d8d6
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_actor_profile_id_6b7a4346
      field: google_workspace.actor.profile.id
      copy_from: source.user.id
      ignore_empty_value: true
  - convert:
      tag: convert_json_ipAddress_to_source_ip_6cbf48a8
      field: json.ipAddress
      target_field: source.ip
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_79a0c21d
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - set:
      tag: set_google_workspace_ip_address_b61dbbba
      field: google_workspace.ip_address
      copy_from: source.ip
      ignore_empty_value: true
  - rename:
      tag: rename_json_kind_to_google_workspace_kind_8c6d9f29
      field: json.kind
      target_field: google_workspace.kind
      ignore_missing: true
  - rename:
      tag: rename_json_etag_to_google_workspace_etag_4bd4a803
      field: json.etag
      target_field: google_workspace.etag
      ignore_missing: true
  - convert:
      tag: convert_json_id_customerId_to_organization_id_ffd90a33
      field: json.id.customerId
      target_field: organization.id
      type: string
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_5aacea86
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_id_customer_id_46a3415a
      field: google_workspace.id.customer.id
      copy_from: organization.id
      ignore_empty_value: true
  - rename:
      tag: rename_json_actor_callerType_to_google_workspace_actor_type_308eeffc
      field: json.actor.callerType
      target_field: google_workspace.actor.type
      ignore_missing: true
  - rename:
      tag: rename_json_actor_key_to_google_workspace_actor_key_3f392d49
      field: json.actor.key
      target_field: google_workspace.actor.key
      ignore_missing: true
  - rename:
      tag: rename_json_ownerDomain_to_google_workspace_organization_domain_6580cd7d
      field: json.ownerDomain
      target_field: google_workspace.organization.domain
      ignore_missing: true
  - rename:
      tag: rename_json_events_type_to_google_workspace_event_type_e73f1e18
      field: json.events.type
      target_field: google_workspace.event.type
      ignore_missing: true
  - set:
      tag: set_user_id_f89889ac
      field: user.id
      copy_from: source.user.id
      ignore_empty_value: true
  - script:
      tag: script_extract_user_name_user_domain_a3a2cdbf
      lang: painless
      description: Extract User name and User domain from Email.
      if: ctx.source?.user?.email != null && ctx.source.user.email.contains("@")
      source: >
        String[] splitmail = ctx.source.user.email.splitOnToken('@');
        if (splitmail.length != 2) {
          return;
        }
        if (ctx.user == null) {
          ctx.user = new HashMap();
        }
        ctx.user.name = splitmail[0];
        ctx.source.user.name = splitmail[0];
        ctx.user.domain = splitmail[1];
        ctx.source.user.domain = splitmail[1];
  - append:
      tag: append_related_hosts_23e97a1f
      field: related.hosts
      value: '{{{user.domain}}}'
      if: ctx.user?.domain != null
      allow_duplicates: false
  - append:
      tag: append_related_hosts_ea7c8eda
      field: related.hosts
      value: '{{{google_workspace.organization.domain}}}'
      if: ctx.google_workspace?.organization?.domain != null
      allow_duplicates: false
  - append:
      tag: append_related_ip_8121c591
      field: related.ip
      value: '{{{source.ip}}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
  - append:
      tag: append_related_user_bcb5a560
      field: related.user
      value: '{{{source.user.id}}}'
      if: ctx.source?.user?.id != null
      allow_duplicates: false
  - append:
      tag: append_related_user_f745a124
      field: related.user
      value: '{{{source.user.name}}}'
      if: ctx.source?.user?.name != null
      allow_duplicates: false
  - append:
      tag: append_related_user_8c49e24b
      field: related.user
      value: '{{{source.user.email}}}'
      if: ctx.source?.user?.name != null
      allow_duplicates: false
  - script:
      tag: script_map_event_parameters_into_key_267008ad
      lang: painless
      description: Map Event parameters into key value pair.
      if: ctx.json?.events?.parameters != null && ctx.json.events.parameters instanceof List
      source: >
        def token = ctx.google_workspace.token;
        if (token == null) {
          token = new HashMap();
        }

        def fields = new String[] {
          "value",
          "multiValue",
          "messageValue",
          "multiMessageValue",
          "intValue",
          "multiIntValue",
          "boolValue",
          "multiBoolValue"
        };

        def parameters = ctx.json.events.parameters;
        for (int i = 0; i < parameters.length; ++i) {
          if (parameters[i]["messageValue"] != null) {
            for (int j = 0;j < parameters[i]["messageValue"]["parameter"].length; ++j ){
              for (def f: fields) {
                if (parameters[i]["messageValue"]["parameter"][j][f] != null) {
                  parameters[i].messageValue[parameters[i]["messageValue"]["parameter"][j]["name"]] = parameters[i]["messageValue"]["parameter"][j][f];
                }
              }
            }
          }
        }
        for (int i = 0; i < parameters.length; ++i) {
          if (parameters[i]["messageValue"] != null) {
            parameters[i]["messageValue"].remove('parameter');
          }
        }
        for (int i = 0; i < parameters.length; ++i) {
          if (parameters[i]["multiMessageValue"] != null) {
            for (int j = 0;j < parameters[i]["multiMessageValue"].length; ++j ){
              if (parameters[i]["multiMessageValue"][j]["parameter"] != null) {
                for (int k = 0;k < parameters[i]["multiMessageValue"][j]["parameter"].length; ++k ){
                  for (def f: fields) {
                    if (parameters[i]["multiMessageValue"][j]["parameter"][k][f] != null) {
                      parameters[i].multiMessageValue[j][parameters[i]["multiMessageValue"][j]["parameter"][k]["name"]] = parameters[i]["multiMessageValue"][j]["parameter"][k][f];
                    }
                  }
                }
              }
            }
          }
        }
        for (int i = 0; i < parameters.length; ++i) {
          if (parameters[i]["multiMessageValue"] != null) {
            for (int j = 0;j < parameters[i]["multiMessageValue"].length; ++j ){
              if (parameters[i]["multiMessageValue"][j]["parameter"] != null) {
                parameters[i]["multiMessageValue"][j].remove('parameter');
              }
            }
          }
        }
        for (int i = 0; i < parameters.length; ++i) {
          for (def f: fields) {
            if (parameters[i][f] != null) {
              token[parameters[i]["name"]] = parameters[i][f];
            }
          }
          ctx.google_workspace.token = token;
          ctx.json.events.parameters = parameters;
        }
  - rename:
      tag: rename_google_workspace_token_client_id_to_google_workspace_token_client_id_ffdaad29
      field: google_workspace.token.client_id
      target_field: google_workspace.token.client.id
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_token_client_type_to_google_workspace_token_client_type_dcef4099
      field: google_workspace.token.client_type
      target_field: google_workspace.token.client.type
      ignore_missing: true
  - convert:
      tag: convert_google_workspace_token_num_response_bytes_2b609322
      field: google_workspace.token.num_response_bytes
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_beff5177
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_google_workspace_token_scope_to_google_workspace_token_scope_value_b334a2fd
      field: google_workspace.token.scope
      target_field: google_workspace.token.scope.value
      ignore_missing: true
  - rename:
      tag: rename_google_workspace_token_scope_data_to_google_workspace_token_scope_data_15f11cf5
      field: google_workspace.token.scope_data
      target_field: google_workspace.token.scope.data
      ignore_missing: true
  - remove:
      tag: remove_e5a80934
      field:
        - json
      ignore_missing: true
  - remove:
      tag: remove_2a1ed52f
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
      field:
        - google_workspace.ip_address
        - google_workspace.event.name
        - google_workspace.id.unique_qualifier
        - google_workspace.id.application_name
        - google_workspace.id.customer.id
        - google_workspace.actor.profile.id
        - google_workspace.actor.email
        - google_workspace.id.time
      ignore_missing: true
  - script:
      tag: script_drops_null_empty_values_recursively_e2ccbdd7
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - set:
      tag: set_event_kind_92954dfa
      field: event.kind
      value: pipeline_error
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
