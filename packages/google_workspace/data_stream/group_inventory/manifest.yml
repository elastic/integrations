title: Collect group inventory from Google Workspace
type: logs
streams:
  - input: cel
    title: Groups inventory
    description: >-
      Collect an inventory of Google groups, with owners, managers and nested groups, from the Admin SDK Directory API. This is not the `groups` data stream, which contains Groups audit events.
    template_path: cel.yml.hbs
    enabled: false
    vars:
      - name: directory_api_host
        type: text
        title: Directory API Host
        description: The Google Workspace Admin SDK Directory API host. The path will be automatically set.
        multi: false
        required: true
        show_user: false
        default: https://admin.googleapis.com
      - name: groups_settings_api_host
        type: text
        title: Groups Settings API Host
        description: The Groups Settings API host. Used only when Collect group settings is enabled. The path will be automatically set.
        multi: false
        required: true
        show_user: false
        default: https://www.googleapis.com
      - name: interval
        type: text
        title: Interval
        description: >-
          Time between full group listings. Each cycle re-reads every group and its members, because the API has no filter for changed groups. NOTE: Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 24h
      - name: batch_size
        type: integer
        title: Page Size
        description: Number of groups and members requested per page (the `groups.list` and `members.list` `maxResults` parameter). Google allows 1 to 200.
        multi: false
        required: true
        show_user: false
        default: 200
      - name: collect_group_settings
        type: bool
        title: Collect group settings
        description: >-
          Adds each group's access settings (who can join, post, view members and find the group, whether external members are allowed, and others) from the Groups Settings API to the group documents. This adds the `https://www.googleapis.com/auth/apps.groups.settings` scope to this stream's token request. **This scope is read/write: Google offers no read-only scope for group settings.** The stream only reads settings. Enable the Groups Settings API in the service account's Google Cloud project first; the delegated account needs the Groups admin privilege (for example the Groups Admin or Groups Editor role) or must be a super admin. **The scope must be delegated in the Admin console (domain-wide delegation) before you enable this option. If it is not, the token request fails and the whole Groups inventory stream stops, including the base group inventory.** Delegation changes can take up to 24 hours to take effect.
        multi: false
        required: false
        show_user: true
        default: false
      - name: collect_admin_roles
        type: bool
        title: Collect admin roles and privileges
        description: >-
          Adds the admin roles assigned directly to each group, with role names, privileges and scope, to the group documents. This adds the `https://www.googleapis.com/auth/admin.directory.rolemanagement.readonly` scope to this stream's token request. The delegated account must be a **super admin**; other admins get HTTP 403 on these calls. **The scope must be delegated in the Admin console (domain-wide delegation) before you enable this option. If it is not, the token request fails and the whole Groups inventory stream stops, including the base group inventory.** Delegation changes can take up to 24 hours to take effect.
        multi: false
        required: false
        show_user: true
        default: false
      - name: customer
        type: text
        title: Customer ID
        description: >-
          The Google Workspace customer ID to list groups and admin roles for. `my_customer` refers to the delegated account's own Google Workspace account.
        multi: false
        required: true
        show_user: false
        default: my_customer
      - name: domain
        type: text
        title: Domain
        description: >-
          Optional. Lists only the groups whose email address is on this domain. It is sent together with the Customer ID. Members, settings and admin roles are still read for the listed groups. Members are classified as external by comparing their email domain with the domains of the listed groups, so with this option members on the account's other domains are reported as external.
        multi: false
        required: false
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        description: Tags for the data-stream.
        default:
          - forwarded
          - google_workspace-group_inventory
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
      - name: proxy_url
        type: text
        title: Proxy URL
        multi: false
        required: false
        show_user: false
        description: URL to proxy connections in the form of http[s]://<user>:<password>@<server name/ip>:<port>. Make sure your username and password are URL encoded.
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: SSL configuration for the host, such as `certificate_authorities`, `supported_protocols` and `verification_mode`.
        multi: false
        required: false
        show_user: false
