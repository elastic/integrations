wait_for_data_timeout: 1m
input: cel
service: google_workspace
vars:
  jwt_file: "{{SERVICE_LOGS_DIR}}/credentials.json"
  delegated_account: test@example.com
  enable_request_tracer: true
data_stream:
  vars:
    directory_api_host: http://{{Hostname}}:{{Port}}
    groups_settings_api_host: http://{{Hostname}}:{{Port}}
    batch_size: 2
    customer: C0groupinv
    collect_group_settings: true
    collect_admin_roles: true
assert:
  # One document per group: 6 groups. One group is refused its settings
  # (403) and one was deleted mid-cycle (members and settings 404); both
  # errors are carried on those groups' documents, not as error documents.
  hit_count: 6
