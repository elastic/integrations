  - rename:
      tag: rename_json_kind_to_google_workspace_kind_8c6d9f29
      field: json.kind
      target_field: google_workspace.kind
      ignore_missing: true
  - rename:
      tag: rename_json_etag_to_google_workspace_etag_4bd4a803
