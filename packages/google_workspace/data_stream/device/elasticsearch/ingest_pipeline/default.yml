---
description: Pipeline for parsing google_workspace device logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_ecs_version_135371bc
      field: ecs.version
      value: '9.5.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_90c6475f
      field: event.original
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_45b808be
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - drop:
      if: ctx.json?.events == null
      description: Discard events that are missing the target during the split operation and are subsequently returned as the root object.
      tag: drop_empty_events_ac9e0c9d
  - date:
      tag: date_json_id_time_9350ecd5
      field: json.id.time
      if: ctx.json?.id?.time != null && ctx.json.id.time != ''
      formats:
        - UNIX
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      on_failure:
        - append:
            tag: append_error_message_18a82a92
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_id_time_01ac69ca
      field: google_workspace.id.time
      copy_from: '@timestamp'
      ignore_empty_value: true
  - fingerprint:
      tag: fingerprint_to_id_52623c07
      description: Hashes the ID object and uses it as the document id to avoid duplicate events.
      fields:
        - json.id
        - json.events
      target_field: _id
      ignore_missing: true
  - rename:
      tag: rename_json_events_name_to_event_action_75ca640e
      field: json.events.name
      target_field: event.action
      ignore_missing: true
  - set:
      tag: set_google_workspace_event_name_69e4d7fd
      field: google_workspace.event.name
      copy_from: event.action
      ignore_empty_value: true
  - rename:
      tag: rename_json_id_applicationName_to_event_provider_fffca35d
      field: json.id.applicationName
      target_field: event.provider
      ignore_missing: true
  - set:
      tag: set_google_workspace_id_application_name_8030da4a
      field: google_workspace.id.application_name
      copy_from: event.provider
      ignore_empty_value: true
  - convert:
      tag: convert_json_id_uniqueQualifier_to_event_id_0239362e
      field: json.id.uniqueQualifier
      target_field: event.id
      type: string
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_ab6a6ac3
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_id_unique_qualifier_8c91fe06
      field: google_workspace.id.unique_qualifier
      copy_from: event.id
      ignore_empty_value: true
  - rename:
      tag: rename_json_actor_email_to_source_user_email_4ee5e9ab
      field: json.actor.email
      target_field: source.user.email
      ignore_missing: true
  - set:
      tag: set_google_workspace_actor_email_9cd77425
      field: google_workspace.actor.email
      copy_from: source.user.email
      ignore_empty_value: true
  - append:
      tag: append_user_email_a27eecdf
      field: user.email
      value: '{{{source.user.email}}}'
      if: ctx.source?.user?.email != null
      allow_duplicates: false
  - convert:
      tag: convert_json_actor_profileId_to_source_user_id_e10534f1
      field: json.actor.profileId
