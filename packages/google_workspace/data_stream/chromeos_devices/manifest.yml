title: Collect ChromeOS device inventory from Google Workspace
type: logs
streams:
  - input: cel
    title: ChromeOS devices inventory
    description: >-
      Collect an inventory of enrolled ChromeOS and ChromeOS Flex devices from the Admin SDK Directory API. This is not the `chrome` data stream, which contains Chrome and ChromeOS activity events.
    template_path: cel.yml.hbs
    enabled: false
    vars:
      - name: directory_api_host
        type: text
        title: Directory API Host
        description: The Google Workspace Admin SDK Directory API host. The path will be automatically set.
        multi: false
        required: true
        show_user: false
        default: https://admin.googleapis.com
      - name: interval
        type: text
        title: Interval
        description: >-
          Time between full device inventory listings. Each cycle re-reads the whole device inventory, because the API has no incremental filter. NOTE: Supported units for this parameter are h/m/s.
        multi: false
        required: true
        show_user: true
        default: 24h
      - name: batch_size
        type: integer
        title: Page Size
        description: Number of devices requested per page (the `chromeosdevices.list` `maxResults` parameter). Google allows up to 300.
        multi: false
        required: true
        show_user: false
        default: 100
      - name: customer
        type: text
        title: Customer ID
        description: >-
          The Google Workspace customer ID to list ChromeOS devices for. `my_customer` refers to the delegated account's own Google Workspace account.
        multi: false
        required: true
        show_user: false
        default: my_customer
      - name: org_unit_path
        type: text
        title: Organizational Unit
        description: >-
          Optional. Lists only the devices in this organizational unit and its child units (sent as `orgUnitPath` with `includeChildOrgunits=true`). Use the full path of the organizational unit, for example `/Sales` (the leading `/` is optional), or its ID in the form `id:<ouid>`. Leave empty to list every device in the account.
        multi: false
        required: false
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        description: Tags for the data-stream.
        default:
          - forwarded
          - google_workspace-chromeos_devices
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed.
      - name: proxy_url
        type: text
        title: Proxy URL
        multi: false
        required: false
        show_user: false
        description: URL to proxy connections in the form of http[s]://<user>:<password>@<server name/ip>:<port>. Make sure your username and password are URL encoded.
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: SSL configuration for the host, such as `certificate_authorities`, `supported_protocols` and `verification_mode`.
        multi: false
        required: false
        show_user: false
