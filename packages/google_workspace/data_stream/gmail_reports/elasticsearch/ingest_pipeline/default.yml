  - script:
      lang: painless
      tag: script_foreach_post_delivery_info_interaction_attachment_sha256_append_into_related_hash
      if: ctx.google_workspace?.gmail_reports?.message_info?.post_delivery_info?.interaction?.attachment instanceof List
      source: |-
        def hashes = new HashSet();
        for (def attachment : ctx.google_workspace.gmail_reports.message_info.post_delivery_info.interaction.attachment) {
          if (attachment?.sha256 == null) {
            continue;
          }
          hashes.add(attachment.sha256);
        }
        if (hashes.size() != 0) {
          ctx.related = ctx.related ?: [:];
          def related = ctx.related.hash instanceof List ? ctx.related.hash : new ArrayList();
          for (def hash : hashes) {
            if (!related.contains(hash)) {
              related.add(hash);
            }
          }
          ctx.related.hash = related;
        }
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
