---
description: Pipeline for processing Gmail Reports API logs.
processors:
  - drop:
      if: ctx.message == 'retry'
      tag: drop_retry_events
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 9.4.0
  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: 'Google Workspace'
  - set:
      field: observer.product
      tag: set_observer_product
      value: Gmail
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original
      target_field: google_workspace.gmail_reports
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      tag: script_to_flatten_events
      if: ctx.google_workspace?.gmail_reports?.events instanceof Map
      description: >-
        Flattens the single `events` object into the root of
        `google_workspace.gmail_reports`, which is what a rename processor per field
        would otherwise do. Gmail nests structured parameters such as `event_info`
        and `message_info` inside `messageValue.parameter` (single record) or
        `multiMessageValue` (repeated record), so the parameters are flattened
        recursively.
      source: |-
        def flattenParameters(List parameters) {
          def result = new HashMap();
          for (def param : parameters) {
            if (param == null || param.name == null) {
              continue;
            }
            def name = param.name.toLowerCase();
            if (param.value != null) {
              result[name] = param.value;
            } else if (param.boolValue != null) {
              result[name] = param.boolValue;
            } else if (param.intValue != null) {
              result[name] = param.intValue;
            } else if (param.multiValue != null) {
              result[name] = param.multiValue;
            } else if (param.multiIntValue != null) {
              result[name] = param.multiIntValue;
            } else if (param.multiBoolValue != null) {
              result[name] = param.multiBoolValue;
            } else if (param.messageValue?.parameter instanceof List) {
              result[name] = flattenParameters(param.messageValue.parameter);
            } else if (param.multiMessageValue instanceof List) {
              def values = new ArrayList();
              for (def messageValue : param.multiMessageValue) {
                if (messageValue?.parameter instanceof List) {
                  values.add(flattenParameters(messageValue.parameter));
                }
              }
              if (values.size() != 0) {
                result[name] = values;
              }
            }
          }
          return result;
        }

        def gmail = ctx.google_workspace.gmail_reports;
        def event = gmail.remove('events');
        if (event.name != null) {
          gmail.event_name = event.name;
        }
        if (event.type != null) {
          gmail.event_type = event.type;
        }
        if (event.resourceIds != null) {
          gmail.resource_ids = event.resourceIds;
        }
        if (event.parameters instanceof List) {
          gmail.putAll(flattenParameters(event.parameters));
        }
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      tag: script_convert_camelcase_to_snake_case
      if: ctx.google_workspace?.gmail_reports instanceof Map
      description: >-
        Converts the camelCase keys of the activity envelope (`ipAddress`,
        `networkInfo`, `resourceDetails`, `id.uniqueQualifier`, ...) to snake_case
        recursively, which removes the need for a rename processor per field. Runs
        after the parameters are flattened so the `messageValue`/`intValue`
        descriptor keys are already gone.
      source: |-
        String camelToSnake(String str) {
          def result = "";
          for (int i = 0; i < str.length(); i++) {
            char c = str.charAt(i);
            if (Character.isUpperCase(c)) {
              if (i > 0 && Character.isLowerCase(str.charAt(i - 1))) {
                result += "_";
              }
              result += Character.toLowerCase(c);
            } else {
              result += c;
            }
          }
          return result;
        }
        def convertToSnakeCase(def obj) {
          if (obj instanceof Map) {
            def newObj = [:];
            for (entry in obj.entrySet()) {
              newObj[camelToSnake(entry.getKey())] = convertToSnakeCase(entry.getValue());
            }
            return newObj;
          } else if (obj instanceof List) {
            def newList = [];
            for (item in obj) {
              newList.add(convertToSnakeCase(item));
            }
            return newList;
          } else {
            return obj;
          }
        }
        ctx.google_workspace.gmail_reports = convertToSnakeCase(ctx.google_workspace.gmail_reports);
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.gmail_reports.ip_address
      tag: convert_ip_address_to_ip
      type: ip
      ignore_missing: true
      if: ctx.google_workspace?.gmail_reports?.ip_address != ''
      on_failure:
        - remove:
            field: google_workspace.gmail_reports.ip_address
            ignore_missing: true
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
