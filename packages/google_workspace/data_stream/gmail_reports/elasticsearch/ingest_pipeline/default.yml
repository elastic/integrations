  - script:
      lang: painless
      tag: script_to_extract_email_to_address_from_flattened_destinations
      description: >-
        `message_info.flattened_destinations` holds every recipient in the
        `service:selector:address` form, comma separated. Only the address part is
        mapped into `email.to.address`.
      if: ctx.google_workspace?.gmail_reports?.message_info?.flattened_destinations != null
      source: |-
        def destinations = new ArrayList();
        def raw = ctx.google_workspace.gmail_reports.message_info.flattened_destinations;
        if (raw instanceof List) {
          destinations.addAll(raw);
        } else {
          destinations.add(raw);
        }
        ctx.email = ctx.email ?: [:];
        ctx.email.to = ctx.email.to ?: [:];
        def addresses = ctx.email.to.address;
        if (!(addresses instanceof List)) {
          addresses = addresses == null ? new ArrayList() : new ArrayList([addresses]);
        }
        for (def destination : destinations) {
          if (!(destination instanceof String)) {
            continue;
          }
          for (def entry : destination.splitOnToken(',')) {
            def trimmed = entry.trim();
            int separator = trimmed.lastIndexOf(':');
            def address = separator == -1 ? trimmed : trimmed.substring(separator + 1);
            if (address != '' && !addresses.contains(address)) {
              addresses.add(address);
            }
          }
        }
        if (addresses.size() != 0) {
          ctx.email.to.address = addresses;
        }
      on_failure:
        - append:
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
