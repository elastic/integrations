      field: json.data.systemActionType
      target_field: google_workspace.alert.data.system_action_type
      ignore_missing: true
  - convert:
      tag: convert_json_data_isInternal_to_google_workspace_alert_data_is_internal_55d70d12
      field: json.data.isInternal
      target_field: google_workspace.alert.data.is_internal
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_c2805075
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - convert:
      tag: convert_json_data_sourceIp_to_google_workspace_alert_data_source_ip_c3c02b0a
      field: json.data.sourceIp
      target_field: google_workspace.alert.data.source.ip
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_3fc24edf
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - set:
      tag: set_source_ip_461a1df7
      field: source.ip
      copy_from: google_workspace.alert.data.source.ip
      ignore_failure: true

  # Pipeline For Google identity.
  - convert:
      tag: convert_json_data_loginDetails_ipAddress_to_google_workspace_alert_data_login_details_ip_address_be6d1924
      field: json.data.loginDetails.ipAddress
      target_field: google_workspace.alert.data.login_details.ip_address
      type: ip
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_606a0247
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - date:
      tag: date_json_data_loginDetails_loginTime_to_google_workspace_alert_data_login_details_login_time_1c65d1ee
      field: json.data.loginDetails.loginTime
      if: ctx.json?.data?.loginDetails?.loginTime != null
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      target_field: google_workspace.alert.data.login_details.login_time
      on_failure:
        - append:
            tag: append_error_message_efbb9d5b
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_data_state_to_google_workspace_alert_data_state_46ba5ecf
      field: json.data.state
      target_field: google_workspace.alert.data.state
      ignore_missing: true
  - rename:
      tag: rename_json_data_appealWindow_to_google_workspace_alert_data_appeal_window_d5386514
      field: json.data.appealWindow
      target_field: google_workspace.alert.data.appeal_window
      ignore_missing: true
  - foreach:
      tag: foreach_json_data_suspensionDetails_01c12526
      field: json.data.suspensionDetails
      processor:
        rename:
          tag: rename_ingest_value_abuseReason_to_ingest_value_abuse_reason
          field: _ingest._value.abuseReason
          target_field: _ingest._value.abuse_reason
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_suspensionDetails_c12e7f74
      field: json.data.suspensionDetails
      processor:
        rename:
          tag: rename_ingest_value_productName_to_ingest_value_product_name
          field: _ingest._value.productName
          target_field: _ingest._value.product_name
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_data_suspensionDetails_to_google_workspace_alert_data_suspension_details_902ddf48
      field: json.data.suspensionDetails
      target_field: google_workspace.alert.data.suspension_details
      ignore_missing: true

  # Pipeline For Google Operations.
  - rename:
      tag: rename_json_data_affectedUserEmails_to_google_workspace_alert_data_affected_user_emails_dd2772f2
      field: json.data.affectedUserEmails
      target_field: google_workspace.alert.data.affected.user_emails
      ignore_missing: true
  - foreach:
      tag: foreach_google_workspace_alert_data_affected_user_emails_73abf0c4
      field: google_workspace.alert.data.affected.user_emails
      processor:
        append:
          tag: append_user_email
          field: user.email
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
          ignore_failure: true
      ignore_missing: true
