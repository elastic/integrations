---
description: Pipeline for parsing Google Workspace Alert logs.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      tag: set_ecs_version_135371bc
      field: ecs.version
      value: '8.16.0'
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_2ee3a7d4
      field: message
      ignore_missing: true
      if: 'ctx.event?.original != null'
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - append:
      tag: append_event_type_8a66ccaa
      field: event.type
      value: info
  - set:
      tag: set_event_kind_39295792
      field: event.kind
      value: alert
  - append:
      tag: append_event_category_5b8d356a
      field: event.category
      if: ctx.json.source == 'Gmail phishing'
      value:
        - email
        - threat
        - malware
  - append:
      tag: append_event_category_8edb1962
      field: event.category
      if: ctx.json.source != 'Gmail phishing'
      value:
        - threat
        - malware
  - fingerprint:
      tag: fingerprint_059823db
      fields:
        - json.alertId
        - json.customerId
        - json.createTime
        - json.startTime
        - json.updateTime
        - json.endTime
      target_field: _id
      ignore_missing: true

  # Pipeline For Common fields.
  - date:
      tag: date_json_createTime_to_timestamp_68ca4c26
      field: json.createTime
      target_field: '@timestamp'
      if: ctx.json?.createTime != null
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      on_failure:
        - append:
            tag: append_error_message_52b8cfb3
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_google_workspace_alert_create_time_a919a523
      field: google_workspace.alert.create_time
      copy_from: '@timestamp'
      ignore_failure: true
  - date:
      tag: date_json_endTime_to_google_workspace_alert_end_time_e1cc56ca
      field: json.endTime
      if: ctx.json?.endTime != null
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      target_field: google_workspace.alert.end_time
      on_failure:
        - append:
            tag: append_error_message_ca8f8ec1
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_end_feeb2689
      field: event.end
      copy_from: google_workspace.alert.end_time
      ignore_failure: true
  - date:
      tag: date_json_startTime_to_google_workspace_alert_start_time_ca58c857
      field: json.startTime
      if: ctx.json?.startTime != null
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      target_field: google_workspace.alert.start_time
      on_failure:
        - append:
            tag: append_error_message_16e621b0
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_start_3e0ba55f
      field: event.start
      copy_from: google_workspace.alert.start_time
      ignore_failure: true
  - rename:
      tag: rename_json_source_to_google_workspace_alert_source_0078390f
      field: json.source
      target_field: google_workspace.alert.source
      ignore_missing: true
  - set:
      tag: set_event_action_9c5f46ec
      field: event.action
      copy_from: google_workspace.alert.source
      ignore_failure: true
  - rename:
      tag: rename_json_customerId_to_google_workspace_alert_customer_id_f17f73f5
      field: json.customerId
      target_field: google_workspace.alert.customer.id
      ignore_missing: true
  - set:
      tag: set_organization_id_3a5c2576
      field: organization.id
      copy_from: google_workspace.alert.customer.id
      ignore_failure: true
  - rename:
      tag: rename_json_metadata_assignee_to_google_workspace_alert_metadata_assignee_48f4dec1
      field: json.metadata.assignee
      target_field: google_workspace.alert.metadata.assignee
      ignore_missing: true
  - append:
      tag: append_user_email_30a34aeb
      field: user.email
      value: '{{{google_workspace.alert.metadata.assignee}}}'
      if: ctx.google_workspace?.alert?.metadata?.assignee != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_alertId_to_google_workspace_alert_id_08028acb
      field: json.alertId
      target_field: google_workspace.alert.id
      ignore_missing: true
  - set:
      tag: set_event_id_71fa2dd5
      field: event.id
      copy_from: google_workspace.alert.id
      ignore_failure: true
  - convert:
      tag: convert_json_deleted_to_google_workspace_alert_deleted_930fb5eb
      field: json.deleted
      target_field: google_workspace.alert.deleted
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_8baa31be
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_etag_to_google_workspace_alert_etag_e9cc9c63
      field: json.etag
      target_field: google_workspace.alert.etag
      ignore_missing: true
  - rename:
      tag: rename_json_metadata_alertId_to_google_workspace_alert_metadata_alert_id_6834fa0b
      field: json.metadata.alertId
      target_field: google_workspace.alert.metadata.alert.id
      ignore_missing: true
  - rename:
      tag: rename_json_metadata_customerId_to_google_workspace_alert_metadata_customer_id_bc0421fb
      field: json.metadata.customerId
      target_field: google_workspace.alert.metadata.customer.id
      ignore_missing: true
  - rename:
      tag: rename_json_data_type_to_google_workspace_alert_data_type_5f678f23
      field: json.data.@type
      target_field: google_workspace.alert.data.type
      ignore_missing: true
  - rename:
      tag: rename_json_metadata_etag_to_google_workspace_alert_metadata_etag_0914a475
      field: json.metadata.etag
      target_field: google_workspace.alert.metadata.etag
      ignore_missing: true
  - rename:
      tag: rename_json_metadata_severity_to_google_workspace_alert_metadata_severity_cfa6c4c1
      field: json.metadata.severity
      target_field: google_workspace.alert.metadata.severity
      ignore_missing: true
  - rename:
      tag: rename_json_metadata_status_to_google_workspace_alert_metadata_status_4a095d59
      field: json.metadata.status
      target_field: google_workspace.alert.metadata.status
      ignore_missing: true
  - date:
      tag: date_json_metadata_updateTime_to_google_workspace_alert_metadata_update_time_c371e716
      field: json.metadata.updateTime
      if: ctx.json?.metadata?.updateTime != null
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      target_field: google_workspace.alert.metadata.update_time
      on_failure:
        - append:
            tag: append_error_message_98ade8c7
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_securityInvestigationToolLink_to_google_workspace_alert_security_investigation_tool_link_c8760b00
      field: json.securityInvestigationToolLink
      target_field: google_workspace.alert.security_investigation_tool_link
      ignore_missing: true
  - rename:
      tag: rename_json_type_to_google_workspace_alert_type_24d35ea9
      field: json.type
      target_field: google_workspace.alert.type
      ignore_missing: true
  - date:
      tag: date_json_updateTime_to_google_workspace_alert_update_time_33a29d2a
      field: json.updateTime
      if: ctx.json?.updateTime != null
      timezone: UTC
      formats:
        - ISO8601
        - yyyy-MM-dd'T'HH:mm:ss
        - yyyy-MM-dd'T'HH:mm:ssZ
        - yyyy-MM-dd'T'HH:mm:ss.SSSZ
        - yyyy/MM/dd HH:mm:ss z
      target_field: google_workspace.alert.update_time
      on_failure:
        - append:
            tag: append_error_message_6329016b
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_data_email_to_google_workspace_alert_data_email_832cfd05
      field: json.data.email
      target_field: google_workspace.alert.data.email
      ignore_missing: true
  - append:
      tag: append_user_email_954c1f73
      field: user.email
      value: '{{{google_workspace.alert.data.email}}}'
      if: ctx.google_workspace?.alert?.data?.email != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_data_alertDetails_to_google_workspace_alert_data_alert_details_5d4df09a
      field: json.data.alertDetails
      target_field: google_workspace.alert.data.alert_details
      ignore_missing: true

  # Pipeline For Domain wide takeout.
  - rename:
      tag: rename_json_data_takeoutRequestId_to_google_workspace_alert_data_takeout_request_id_2a283cbb
      field: json.data.takeoutRequestId
      target_field: google_workspace.alert.data.takeout.request.id
      ignore_missing: true

  # Pipeline For Gmail phishing.
  - foreach:
      tag: foreach_json_data_messages_1172116e
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_attachmentsSha256Hash_to_ingest_value_attachments_sha256_hash
          field: _ingest._value.attachmentsSha256Hash
          target_field: _ingest._value.attachments_sha256_hash
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_6b6b3956
      field: json.data.messages
      processor:
        date:
          tag: date_ingest_value_date_to_ingest_value_date
          field: _ingest._value.date
          target_field: _ingest._value.date
          timezone: UTC
          formats:
              - ISO8601
              - yyyy-MM-dd'T'HH:mm:ss
              - yyyy-MM-dd'T'HH:mm:ssZ
              - yyyy-MM-dd'T'HH:mm:ss.SSSZ
              - yyyy/MM/dd HH:mm:ss z
          ignore_failure: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_2c4cf9e5
      field: json.data.messages
      processor:
        append:
          tag: append_email_delivery_timestamp
          field: email.delivery_timestamp
          value: '{{{_ingest._value.date}}}'
          allow_duplicates: false
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_07a2f116
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_md5HashSubject_to_ingest_value_md5_hash_subject
          field: _ingest._value.md5HashSubject
          target_field: _ingest._value.md5.hash.subject
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_3ca60ccc
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_messageBodySnippet_to_ingest_value_message_body_snippet
          field: _ingest._value.messageBodySnippet
          target_field: _ingest._value.message_body_snippet
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_c869b9ab
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_md5HashMessageBody_to_ingest_value_md5_hash_message_body
          field: _ingest._value.md5HashMessageBody
          target_field: _ingest._value.md5.hash.message_body
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_6beed4bb
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_messageId_to_ingest_value_id
          field: _ingest._value.messageId
          target_field: _ingest._value.id
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_3db57e4a
      field: json.data.messages
      processor:
        append:
          tag: append_email_message_id
          field: email.message_id
          value: '{{{_ingest._value.id}}}'
          allow_duplicates: false
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_031bdc3f
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_recipient_to_ingest_value_recipient_email
          field: _ingest._value.recipient
          target_field: _ingest._value.recipient_email
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_721621cd
      field: json.data.messages
      processor:
        append:
          tag: append_email_to_address
          field: email.to.address
          value: '{{{_ingest._value.recipient_email}}}'
          allow_duplicates: false
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_2f6658df
      field: json.data.messages
      processor:
        rename:
          tag: rename_ingest_value_subjectText_to_ingest_value_subject_text
          field: _ingest._value.subjectText
          target_field: _ingest._value.subject_text
          ignore_missing: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_json_data_messages_25ba9426
      field: json.data.messages
      processor:
        append:
          tag: append_email_subject
          field: email.subject
          value: '{{{_ingest._value.subject_text}}}'
          allow_duplicates: false
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_data_messages_to_google_workspace_alert_data_messages_973ab021
      field: json.data.messages
      target_field: google_workspace.alert.data.messages
      ignore_missing: true
  - foreach:
      tag: foreach_google_workspace_alert_data_messages_282d1899
      field: google_workspace.alert.data.messages
      processor:
        foreach:
          tag: foreach_ingest_value_attachments_sha256_hash
          field: _ingest._value.attachments_sha256_hash
          processor:
              append:
                tag: append_email_attachments_file_hash_sha256
                field: email.attachments.file.hash.sha256
                value: '{{{_ingest._value}}}'
                allow_duplicates: false
                ignore_failure: true
          ignore_missing: true
          ignore_failure: true
      ignore_missing: true
      ignore_failure: true
  - foreach:
      tag: foreach_google_workspace_alert_data_messages_54e2b458
      field: google_workspace.alert.data.messages
      processor:
        append:
          tag: append_related_hash
          field: related.hash
          value: '{{{_ingest._value.md5.hash.subject}}}'
          allow_duplicates: false
      ignore_missing: true
      ignore_failure: true
  - rename:
      tag: rename_json_data_maliciousEntity_entity_emailAddress_to_google_workspace_alert_data_malicious_entity_entity_email_address_2b4bd759
      field: json.data.maliciousEntity.entity.emailAddress
      target_field: google_workspace.alert.data.malicious_entity.entity.email_address
      ignore_missing: true
  - append:
      tag: append_user_email_4ca189e5
      field: user.email
      value: '{{{google_workspace.alert.data.malicious_entity.entity.email_address}}}'
      if: ctx.google_workspace?.alert?.data?.malicious_entity?.entity?.email_address != null
      allow_duplicates: false
      ignore_failure: true
  - rename:
      tag: rename_json_data_maliciousEntity_entity_displayName_to_google_workspace_alert_data_malicious_entity_entity_display_name_fcb5bec9
      field: json.data.maliciousEntity.entity.displayName
      target_field: google_workspace.alert.data.malicious_entity.entity.display_name
      ignore_missing: true
  - set:
      tag: set_user_name_b26192bc
      field: user.name
      copy_from: google_workspace.alert.data.malicious_entity.entity.display_name
      ignore_failure: true
  - rename:
      tag: rename_json_data_domainId_customerPrimaryDomain_to_google_workspace_alert_data_domain_id_customer_primary_domain_300c729e
      field: json.data.domainId.customerPrimaryDomain
      target_field: google_workspace.alert.data.domain_id.customer_primary_domain
      ignore_missing: true
  - set:
      tag: set_user_domain_a13f7672
      field: user.domain
      copy_from: google_workspace.alert.data.domain_id.customer_primary_domain
      ignore_failure: true
  - rename:
      tag: rename_json_data_maliciousEntity_displayName_to_google_workspace_alert_data_malicious_entity_display_name_39e58a11
      field: json.data.maliciousEntity.displayName
      target_field: google_workspace.alert.data.malicious_entity.display_name
      ignore_missing: true
  - rename:
      tag: rename_json_data_maliciousEntity_fromHeader_to_google_workspace_alert_data_malicious_entity_from_header_40fbfa03
