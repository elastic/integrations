- name: google_workspace
  type: group
  fields:
    - name: gemini
      type: group
      fields:
        - name: action
          type: keyword
          description: >-
            Action performed by the user within a Workspace application, initiated or assisted by Gemini.
        - name: app_name
          type: keyword
          description: >-
            Name of the Workspace application through which the action was performed. Possible values: `gemini_app`, `chat`, `classroom`, `docs`, `drive`, `gmail`, `keep`, `meet`, `sheets`, `slides`, `vids`.
        - name: event_category
          type: keyword
          description: >-
            Indicates the type of the generative AI action. Possible values: `active_conversations`, `active_generate`, `active_summarize`, `active_unspecified`, `inactive`, `unknown`.
        - name: feature_source
          type: keyword
          description: >-
            Identifies where a generative AI interaction originates within the user interface.
        - name: name
          type: keyword
          description: >-
            The name of the event. For Gemini usage events this is `feature_utilization`.
        - name: type
          type: keyword
          description: >-
            The type of the event. For Gemini usage events this is `ai_usage_event`.
