---
description: Pipeline for processing Meet Audit logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_d69d3fcf
      value: 8.16.0
  - set:
      field: observer.vendor
      tag: set_observer_vendor_bcf88534
      value: Google Workspace
  - set:
      field: observer.product
      tag: set_observer_product_fef9ae1c
      value: Meet
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_552e65e1
      target_field: json
      if: ctx.event?.original != null
      on_failure:
        - append:
            tag: append_error_message_04014d20
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      lang: painless
      tag: script_to_flatten_event_parameters_3b9a00d8
      if: ctx.json?.events?.parameters instanceof List
      description: Script to flatten the event parameters.
      source: >
        ctx.google_workspace = ctx.google_workspace ?: [:];
        ctx.google_workspace.meet = ctx.google_workspace.meet ?: [:];
        for (def param : ctx.json.events.parameters) {
          if (param.name == null) {
            continue;
          }
          def lw_case_name = param.name.toLowerCase();
          if (param.value != null) {
            ctx.google_workspace.meet[lw_case_name] = param.value;
          } else if (param.boolValue != null) {
            ctx.google_workspace.meet[lw_case_name] = param.boolValue;
          } else if (param.intValue != null) {
            ctx.google_workspace.meet[lw_case_name] = param.intValue;
          } else if (param.multiValue != null) {
            ctx.google_workspace.meet[lw_case_name] = param.multiValue;
          } else if (param.multiIntValue != null) {
            ctx.google_workspace.meet[lw_case_name] = param.multiIntValue;
          } else if (param.multiBoolValue != null) {
            ctx.google_workspace.meet[lw_case_name] = param.multiBoolValue;
          }
        }
      on_failure:
        - append:
            tag: append_error_message_c4c0b264
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - remove:
      tag: remove_json_events_parameters_2eab3501
      field: json.events.parameters
      ignore_missing: true
  - rename:
      field: json.events.name
      tag: rename_json_events_name_fbf21a9e
      target_field: google_workspace.meet.name
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - append:
      field: event.category
      tag: append_network_into_event_category_5f697bcf
      value: network
      if: '["call_ended","dialed_out","ring_sent","ring_answered","ring_missed"].contains(ctx.google_workspace?.meet?.name)'
  - script:
      description: Set event type based on event name.
      if: ctx.google_workspace?.meet?.name != null
      tag: set_event_type_from_meet_name_057eba90
      lang: painless
      params:
        abuse_report_submitted: info
        broadcast_activity: info
        call_ended: info
        closed_captions_started: info
        consented_to_third_party_media_app: info
        dialed_out: info
        hand_raised: info
        in_meet_broadcast_activity: info
        invitation_sent: info
        knocking_accepted: info
        knocking_denied: info
        livestream_watched: info
        poll_answered: info
        poll_created: creation
        presentation_started: info
        presentation_stopped: info
        question_created: creation
        question_responded: info
        reaction_sent: info
        recording_activity: info
        ring_answered: info
        ring_missed: info
        ring_sent: info
        room_check_in: info
        room_check_out: info
        see_chat_everyone: info
        see_chat_participants: info
        send_chat_contributors: info
        send_chat_everyone: info
        send_chat_hosts: info
        smart_notes_session_started: info
        smart_notes_session_stopped: info
        speech_translation_allowed: info
        speech_translation_disallowed: info
        streaming_session_explicit_consent: info
        transcription_activity: info
        watermarking_active: info
        watermarking_starting: info
        watermarking_stopped: info
        whiteboard_started: info
      source: |-
        ctx.event = ctx.event ?: [:];
        def type = params.get(ctx.google_workspace.meet.name);
        if (type == null) {
          ctx.event.remove('type');
        } else {
          ctx.event.type = [type];
        }
      on_failure:
        - append:
            tag: append_error_message_18c02496
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.kind
      tag: rename_json_kind_b1c61a80
      target_field: google_workspace.kind
      ignore_missing: true
  - rename:
      tag: rename_json_ownerDomain_to_google_workspace_organization_domain_6580cd7d
      field: json.ownerDomain
      target_field: google_workspace.organization.domain
      ignore_missing: true
  - rename:
      field: json.etag
      tag: rename_json_etag_0e237599
      target_field: google_workspace.etag
      ignore_missing: true
  - rename:
      field: json.actor.callerType
      tag: rename_actor_callerType_27fe3c66
      target_field: google_workspace.actor.caller_type
      ignore_missing: true
  - rename:
      field: json.actor.email
      tag: rename_actor_email_44ec1d46
      target_field: google_workspace.actor.email
      ignore_missing: true
  - set:
      field: source.user.email
      tag: set_source_user_email_from_identifier_aa31217f
      copy_from: google_workspace.meet.identifier
      ignore_empty_value: true
      if: ctx.google_workspace?.meet?.identifier != null && ctx.google_workspace?.meet?.identifier_type == "email_address"
  - set:
      field: source.user.email
      tag: set_source_user_email_from_actor_email_82df015b
      copy_from: google_workspace.actor.email
      ignore_empty_value: true
  - set:
      field: source.user.name
      tag: set_source_user_name_from_source_user_email_3faddb9a
      copy_from: source.user.email
      ignore_empty_value: true
  - dissect:
      field: source.user.email
      tag: dissect_user_email_48c6ecde
      if: ctx.source?.user?.email != null && ctx.source.user.email.contains('@')
      pattern: '%{}@%{source.user.domain}'
      on_failure:
        - append:
            tag: append_error_message_4450a0e8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: json.actor.key
      tag: rename_actor_key_88e08487
      target_field: google_workspace.actor.key
      ignore_missing: true
  - rename:
      field: json.actor.profileId
      tag: rename_actor_profileId_c3feca76
      target_field: google_workspace.actor.profile_id
      ignore_missing: true
  - set:
      field: source.user.id
      tag: set_source_user_id_from_actor_profile_id_8e626358
      copy_from: google_workspace.actor.profile_id
      ignore_empty_value: true
  - set:
      field: user
      tag: set_user_from_source_user_dc938198
      copy_from: source.user
      ignore_empty_value: true
  - rename:
      field: json.id.applicationName
      tag: rename_id_applicationName_bf09a743
      target_field: google_workspace.id.application_name
      ignore_missing: true
  - set:
      field: event.provider
      tag: set_event_provider_from_id_application_name_b84179cd
      copy_from: google_workspace.id.application_name
      ignore_empty_value: true
  - rename:
      field: json.id.customerId
      tag: rename_id_customerId_6cb9ae1e
      target_field: google_workspace.id.customer_id
      ignore_missing: true
  - set:
      field: organization.id
      tag: set_organization_id_from_customerId_cbbda4fc
      copy_from: google_workspace.id.customer_id
      ignore_empty_value: true
  - date:
      field: json.id.time
      tag: date_id_time_4a5f9411
      target_field: google_workspace.id.time
      formats:
        - ISO8601
        - UNIX_MS
      if: ctx.json?.id?.time != null && ctx.json.id.time != ''
      on_failure:
        - append:
            tag: append_error_message_de0bed15
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_id_time_360f0b64
      copy_from: google_workspace.id.time
      ignore_empty_value: true
  - rename:
      field: json.id.uniqueQualifier
      tag: rename_id_uniqueQualifier_ed62122e
      target_field: google_workspace.id.unique_qualifier
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_id_unique_qualifier_30ca4c7f
      copy_from: google_workspace.id.unique_qualifier
      ignore_empty_value: true
  - convert:
      field: json.ipAddress
      tag: convert_ipAddress_to_ip_ccfac6ff
      target_field: google_workspace.ip_address
      type: ip
      ignore_missing: true
      if: ctx.json?.ipAddress != ''
      on_failure:
        - append:
            tag: append_error_message_4cb1517b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip_from_google_workspace_ip_address_beca7977
      copy_from: google_workspace.ip_address
      ignore_empty_value: true
  - geoip:
      tag: geoip_source_ip_to_source_geo_da2e41b2
      field: source.ip
      target_field: source.geo
      ignore_missing: true
  - geoip:
      tag: geoip_source_ip_to_source_as_28d69883
      field: source.ip
      database_file: GeoLite2-ASN.mmdb
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_source_as_asn_to_source_as_number_a917047d
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
  - rename:
      tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
  - rename:
      field: json.events.type
      tag: rename_json_events_type_5de0c7d0
      target_field: google_workspace.meet.type
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_from_name_a6b6bcc5
      copy_from: google_workspace.meet.name
      ignore_empty_value: true
  - gsub:
      field: event.action
      tag: gsub_event_action_7ce828f5
      pattern: '_'
      replacement: '-'
      ignore_missing: true
      if: ctx.event?.action != ''
      on_failure:
        - append:
            tag: append_error_message_32466e0d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: google_workspace.meet.action_time
      tag: date_action_time_e2ca87bd
      target_field: google_workspace.meet.action_time
      formats:
        - ISO8601
        - UNIX_MS
      output_format: strict_date_optional_time_nanos
      if: ctx.google_workspace?.meet?.action_time != null && ctx.google_workspace.meet.action_time != ''
      on_failure:
        - append:
            tag: append_error_message_7d761361
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_meet_action_time_cadf88b2
      copy_from: google_workspace.meet.action_time
      ignore_empty_value: true
  - convert:
      field: google_workspace.meet.audio_recv_packet_loss_max
      tag: convert_audio_recv_packet_loss_max_to_long_f23af0d5
      target_field: google_workspace.meet.endpoint.audio.recv_packet_loss_max
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_06d18e99
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.meet.audio_recv_packet_loss_mean
      tag: convert_audio_recv_packet_loss_mean_to_long_7e7c8aaa
      target_field: google_workspace.meet.endpoint.audio.recv_packet_loss_mean
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_411fd89a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.meet.audio_recv_seconds
      tag: convert_audio_recv_seconds_to_long_03a2eedd
      target_field: google_workspace.meet.endpoint.audio.recv_seconds
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_2029038b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.meet.audio_send_bitrate_kbps_mean
      tag: convert_audio_send_bitrate_kbps_mean_to_long_95b4a0c0
      target_field: google_workspace.meet.endpoint.audio.send_bitrate_kbps_mean
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_9cd5abde
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.meet.audio_send_packet_loss_max
      tag: convert_audio_send_packet_loss_max_to_long_b51304e6
      target_field: google_workspace.meet.endpoint.audio.send_packet_loss_max
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_a7ffc60f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.meet.audio_send_packet_loss_mean
      tag: convert_audio_send_packet_loss_mean_to_long_fdac5b08
      target_field: google_workspace.meet.endpoint.audio.send_packet_loss_mean
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_a800e940
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: google_workspace.meet.audio_send_seconds
      tag: convert_audio_send_seconds_to_long_6ef0bdc3
      target_field: google_workspace.meet.endpoint.audio.send_seconds
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_145f883d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: google_workspace.meet.device_type
      tag: rename_device_type_50361adf
      target_field: google_workspace.meet.endpoint.device_type
      ignore_missing: true
  - rename:
      field: google_workspace.meet.display_name
      tag: rename_display_name_54ac437e
      target_field: google_workspace.meet.endpoint.display_name
      ignore_missing: true
  - convert:
      field: google_workspace.meet.duration_seconds
      tag: convert_duration_seconds_to_long_5d359739
      target_field: google_workspace.meet.endpoint.duration_seconds
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_2584a5f1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.duration
      tag: set_event_duration_from_meet_endpoint_duration_seconds_2692c7a2
      copy_from: google_workspace.meet.endpoint.duration_seconds
      ignore_empty_value: true
  - script:
      lang: painless
      tag: convert_event_duration_to_ns_a3a69d67
      if: ctx.event?.duration != null
      params:
        S_TO_NS: 1000000000
      source: >-
        ctx.event.duration *= params.S_TO_NS;
  - convert:
      field: google_workspace.meet.end_of_call_rating
      tag: convert_end_of_call_rating_to_long_18b12061
      target_field: google_workspace.meet.endpoint.end_of_call_rating
      type: long
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_7276274b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      field: google_workspace.meet.endpoint_id
      tag: rename_endpoint_id_724e845b
      target_field: google_workspace.meet.endpoint.id
      ignore_missing: true
  - rename:
      field: google_workspace.meet.identifier
      tag: rename_identifier_b8b41804
      target_field: google_workspace.meet.endpoint.identifier
      ignore_missing: true
  - rename:
      field: google_workspace.meet.identifier_type
