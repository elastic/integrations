            tag: append_error_message_866300f9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - append:
      field: host.ip
      tag: append_google_workspace_meet_endpoint_ip_address_into_host_ip_83f58d6c
      value: '{{{google_workspace.meet.endpoint.ip_address}}}'
      allow_duplicates: false
      if: ctx.google_workspace?.meet?.endpoint?.ip_address != null
  - geoip:
      tag: geoip_host_ip_to_host_geo_d8a29594
      field: host.ip
      target_field: host.geo
      ignore_missing: true
  - geoip:
      tag: geoip_host_ip_to_host_as_ca603f73
      field: host.ip
      database_file: GeoLite2-ASN.mmdb
      target_field: host.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
  - rename:
      tag: rename_host_as_asn_to_host_as_number_7622e953
      field: host.as.asn
      target_field: host.as.number
      ignore_missing: true
  - rename:
      tag: rename_host_as_organization_name_to_host_as_organization_name_7b13ca3d
      field: host.as.organization_name
      target_field: host.as.organization.name
      ignore_missing: true
  - convert:
      field: google_workspace.meet.is_external
      tag: convert_is_external_to_boolean_a378e924
      target_field: google_workspace.meet.endpoint.is_external
      type: boolean
      ignore_missing: true
      on_failure:
