---
description: Pipeline for processing sample logs
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: 8.11.0
  - rename:
      tag: rename_message_551cadcc
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      field: message
      ignore_missing: true
      tag: remove_message
      if: ctx.event?.original != null
  - json:
      tag: json_event_original_f463ff5e
      field: event.original
      target_field: netbox.device
  - gsub:
      tag: gsub_netbox_device_primary_ip_address_f4829cff
      field: netbox.device.primary_ip.address
      pattern: "/\\d+$"
      replacement: ""
      ignore_missing: true
  - append:
      tag: append_related_ip_c1df7e60
      field: related.ip
      value: "{{{netbox.device.primary_ip.address}}}"
      if: ctx.netbox?.device?.primary_ip?.address != null
      allow_duplicates: false
  - gsub:
      tag: gsub_netbox_device_primary_ip4_address_4c0c94be
      field: netbox.device.primary_ip4.address
      pattern: "/\\d+$"
      replacement: ""
      ignore_missing: true
  - append:
      tag: append_related_ip_7b892cd9
      field: related.ip
      value: "{{{netbox.device.primary_ip4.address}}}"
      if: ctx.netbox?.device?.primary_ip4?.address != null
      allow_duplicates: false
  - gsub:
      tag: gsub_netbox_device_primary_ip6_address_7fdb5a23
      field: netbox.device.primary_ip6.address
      pattern: "/\\d+$"
      replacement: ""
      ignore_missing: true
  - append:
      tag: append_related_ip_a3253563
      field: related.ip
      value: "{{{netbox.device.primary_ip6.address}}}"
      if: ctx.netbox?.device?.primary_ip6?.address != null
      allow_duplicates: false
  - gsub:
      tag: gsub_netbox_device_oob_ip_address_c9eea44d
      field: netbox.device.oob_ip.address
      pattern: "/\\d+$"
      replacement: ""
      ignore_missing: true
  - append:
      tag: append_related_ip_fcfd6b4d
      field: related.ip
      value: "{{{netbox.device.oob_ip.address}}}"
      if: ctx.netbox?.device?.oob_ip?.address != null
      allow_duplicates: false
  - script:
      tag: script_40b3732b
      lang: painless
      if: ctx.netbox?.device?.longitude != null && ctx.netbox?.device?.latitude != null
      source: |
        ctx.netbox.device.coordinates = [
          ctx.netbox.device.longitude,
          ctx.netbox.device.latitude
        ]
  - remove:
      tag: remove_netbox_device_latitude_8c30b164
      field: [netbox.device.latitude, netbox.device.longitude]
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_url_c650597d
      field: netbox.device.url
      target_field: netbox.url
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_display_url_76e078d5
      field: netbox.device.display_url
      target_field: netbox.display_url
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_display_5b7385a1
      field: netbox.device.display
      target_field: netbox.display
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_comments_86cc7c91
      field: netbox.device.comments
      target_field: netbox.comments
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_created_5e9fb075
      field: netbox.device.created
      target_field: netbox.created
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_last_updated_d538a9d0
      field: netbox.device.last_updated
      target_field: netbox.last_updated
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_custom_fields_069655e5
      field: netbox.device.custom_fields
      target_field: netbox.custom_fields
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_tags_575fb4f6
      field: netbox.device.tags
      target_field: netbox.tags
      ignore_missing: true
  - rename:
      tag: rename_netbox_device_tenant_58ab57d3
      field: netbox.device.tenant
      target_field: netbox.tenant
      ignore_missing: true
  - set:
      tag: set_event_kind_80b96859
      field: event.kind
      value: asset
  - append:
      tag: append_event_category_b1dbb0e5
      field: event.category
      value: [configuration]
  - date:
      tag: date_netbox_created_6c6c12e3
      field: netbox.created
      target_field: netbox.created
      if: ctx.netbox?.created != null
      formats:
        - ISO8601
  - date:
      tag: date_netbox_last_updated_88fce66c
      field: netbox.last_updated
      target_field: netbox.last_updated
      if: ctx.netbox?.last_updated != null
      formats:
        - ISO8601
  - script:
      tag: script_a938d7e6
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
