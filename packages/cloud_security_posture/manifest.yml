format_version: 3.7.0
name: cloud_security_posture
title: "Security Posture Management"
version: "3.5.0"
source:
  license: "Elastic-2.0"
description: "Identify & remediate configuration risks in your Cloud infrastructure"
type: integration
categories:
  - security
  - cloudsecurity_cdr
  - misconfiguration_workflow
  - vulnerability_workflow
  # Added containers category to match policy template categories (kspm template references containers subcategory)
  - containers
  # Added observability category to match policy template categories (kspm template references kubernetes subcategory which requires observability as parent)
  - observability
  # Added google_cloud category to match policy template categories (cspm template references google_cloud as a top-level category)
  - google_cloud
  # Added aws category to match policy template categories (kspm and cspm templates reference aws as a top-level category)
  - aws
  # Added cloud category to match policy template categories (cspm and vuln_mgmt templates reference cloud as a top-level category)
  - cloud
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: basic
    capabilities:
      - security
screenshots:
  - src: /img/dashboard.png
    title: Dashboard page
    size: 1293x718
    type: image/png
  - src: /img/findings.png
    title: Findings page
    size: 3134x1740
    type: image/png
  - src: /img/findings-flyout.png
    title: Detailed view of a single finding
    size: 3176x1748
    type: image/png
  - src: /img/benchmarks.png
    title: Benchmarks page
    size: 3168x1752
    type: image/png
  - src: /img/rules.png
    title: Rules page
    size: 3160x1708
    type: image/png
icons:
  - src: /img/logo_cloud_security_posture.svg
    title: Cloud Security Posture logo
    size: 32x32
    type: image/svg+xml
vars:
  - name: posture
    type: text
    title: Posture type
    multi: false
    required: true
    show_user: false
    description: Chosen posture type (cspm/kspm)
  - name: deployment
    type: text
    title: Deployment type
    multi: false
    required: true
    show_user: false
    description: Chosen deployment type (aws/gcp/azure/eks/k8s)
policy_templates:
  - name: kspm
    title: Kubernetes Security Posture Management (KSPM)
    description: Identify & remediate configuration risks in Kubernetes
    multiple: true
    categories:
      - containers
      - kubernetes
      - security
      - aws
      - misconfiguration_workflow
    icons:
      - src: /img/logo_kspm.svg
        title: KSPM logo
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/dashboard.png
        title: Dashboard page
        size: 1293x718
        type: image/png
    data_streams:
      - findings
    inputs:
      - type: cloudbeat/cis_k8s
        title: CIS Kubernetes Benchmark
        description: CIS Benchmark for Kubernetes
      - type: cloudbeat/cis_eks
        title: Amazon EKS Benchmark
        description: CIS Benchmark for Amazon Elastic Kubernetes Service (EKS)
        provider_permissions:
          - provider: aws
            description: >
              Read-only access to EKS and supporting AWS services required to run the CIS Amazon EKS Benchmark.
            permissions:
              - name: eks:DescribeCluster
                description: Read EKS cluster configuration for benchmark checks.
              - name: eks:ListClusters
                description: Enumerate EKS clusters in the account.
              - name: ec2:DescribeInstances
                description: Read EC2 instance attributes for node-level checks.
              - name: ec2:DescribeSecurityGroups
                description: Verify node security group configuration.
              - name: ec2:DescribeSubnets
                description: Verify node subnet configuration.
              - name: iam:GetRole
                description: Read IAM roles attached to EKS node groups.
              - name: iam:ListAttachedRolePolicies
                description: Enumerate policies attached to EKS node IAM roles.
        iac_blueprints:
          - id: aws/federated-identity/account
            format: cloudformation
            patches: iac/aws-federated-identity-account-eks.cloudformation.patches.json
            title: EKS benchmark federated identity role
  - name: cspm
    title: Cloud Security Posture Management (CSPM)
    description: Identify & remediate configuration risks in the Cloud services you leverage
    multiple: true
    categories:
      - security
      - cloud
      - aws
      - google_cloud
      - misconfiguration_workflow
    icons:
      - src: /img/logo_cspm.svg
        title: CSPM logo
        size: 32x32
        type: image/svg+xml
    data_streams:
      - findings
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        is_default: true
        release: ga
        organization: security
        division: engineering
        team: cloud-services
    inputs:
      - type: cloudbeat/cis_aws
        title: Amazon Web Services
        description: CIS Benchmark for Amazon Web Services Foundations
        provider_permissions:
          - provider: aws
            description: >
              Read-only access to AWS services required to run CIS AWS Foundations Benchmark checks.
              The SecurityAudit managed policy covers most checks; the inline permissions below cover
              services added after the policy was last updated.
            roles:
              - name: SecurityAudit
                id: arn:aws:iam::aws:policy/SecurityAudit
                description: AWS-managed read-only policy covering the majority of CIS AWS checks.
            permissions:
              - name: access-analyzer:ListAnalyzers
                description: Check whether IAM Access Analyzer is enabled (CIS 1.21).
              - name: organizations:DescribeOrganization
                description: Identify multi-account organization structure for org-wide scans.
              - name: organizations:ListAccounts
                description: Enumerate member accounts for organization-level benchmark scope.
              - name: organizations:ListDelegatedAdministrators
                description: Verify Security Hub / Config aggregation delegation (CIS 2.6).
              - name: account:GetAlternateContact
                description: Verify security contact information is set (CIS 1.2).
        iac_blueprints:
          - id: aws/federated-identity/account
            format: cloudformation
            patches: iac/aws-federated-identity-account.cloudformation.patches.json
            title: CSPM federated identity role with SecurityAudit access
        vars:
          - name: cloud_formation_template
            type: text
            title: CloudFormation Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Quick Create Stack
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-cspm-ACCOUNT_TYPE-9.2.0.yml&stackName=Elastic-Cloud-Security-Posture-Management&param_EnrollmentToken=FLEET_ENROLLMENT_TOKEN&param_FleetUrl=FLEET_URL&param_ElasticAgentVersion=KIBANA_VERSION&param_ElasticArtifactServer=https://artifacts.elastic.co/downloads/beats/elastic-agent
          - name: cloud_formation_credentials_template
            type: text
            title: CloudFormation Credentials Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Cloud Credentials Stack
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-cspm-direct-access-key-ACCOUNT_TYPE-9.2.0.yml
          - name: cloud_formation_cloud_connectors_template
            type: text
            title: CloudFormation Cloud Connectors Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Cloud Connectors Stack
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            # RESOURCE_ID is the project id for serverless / kibana component id for ess
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-cloud-connectors-ACCOUNT_TYPE-9.2.0.yml&param_ElasticResourceId=RESOURCE_ID
      - type: cloudbeat/cis_gcp
        title: GCP
        description: CIS Benchmark for Google Cloud Platform Foundations
        vars:
          - name: cloud_shell_url
            type: text
            title: CloudShell URL
            multi: false
            required: true
            show_user: false
            description: A URL to CloudShell for creating a new deployment
            default: https://shell.cloud.google.com/cloudshell/?ephemeral=true&cloudshell_git_repo=https%3A%2F%2Fgithub.com%2Felastic%2Fcloudbeat&cloudshell_git_branch=main&cloudshell_workspace=deploy%2Finfrastructure-manager%2Fgcp-elastic-agent&show=terminal
          - name: cloud_shell_url_cloud_connectors
            type: text
            title: Cloud Connectors CloudShell URL
            multi: false
            required: true
            show_user: false
            description: A URL to CloudShell for creating a Cloud Connectors Service Account
            default: https://shell.cloud.google.com/cloudshell/?ephemeral=true&cloudshell_git_repo=https%3A%2F%2Fgithub.com%2Felastic%2Fcloudbeat&cloudshell_git_branch=main&cloudshell_workspace=deploy%2Finfrastructure-manager%2Fgcp-cloud-connectors&show=terminal
      - type: cloudbeat/cis_azure
        title: Azure
        description: CIS Benchmark for Microsoft Azure Foundations
        vars:
          - name: arm_template_url
            type: text
            title: ARM Template URL
            multi: false
            required: true
            show_user: false
            description: A URL to the ARM Template for creating a new deployment
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://portal.azure.com/#create/Microsoft.Template/uri/https%3A%2F%2Fraw.githubusercontent.com%2Felastic%2Fcloudbeat%2F9.2%2Fdeploy%2Fazure%2FARM-for-ACCOUNT_TYPE.json
          - name: arm_template_cloud_connectors_url
            type: text
            title: ARM Cloud Connectors Template URL
            multi: false
            required: true
            show_user: false
            description: A URL to the ARM Template for creating a Cloud Connectors managed identity
            # ACCOUNT_TYPE value should be either "single-account" or "organization-account"
            default: https://portal.azure.com/#create/Microsoft.Template/uri/https%3A%2F%2Fraw.githubusercontent.com%2Felastic%2Fcloudbeat%2F9.2%2Fdeploy%2Fazure%2FARM-for-cloud-connectors-ACCOUNT_TYPE.json
  - name: vuln_mgmt
    title: Cloud Native Vulnerability Management (CNVM)
    description: Scan for cloud workload vulnerabilities
    multiple: true
    categories:
      - security
      - cloud
      - vulnerability_workflow
    icons:
      - src: /img/logo_vuln_mgmt.svg
        title: Vulnerability Management logo
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/cnvm_vulnerabilities_table.png
        title: Vulnerabilities Table
        size: 3420x1912
        type: image/png
      - src: /img/cnvm_vulnerabilities_flyout.png
        title: Vulnerability
        size: 3452x1926
        type: image/png
    data_streams:
      - vulnerabilities
    inputs:
      - type: cloudbeat/vuln_mgmt_aws
        title: Amazon Web Services Vulnerability Management
        description: Vulnerability scan over running resources
        provider_permissions:
          - provider: aws
            description: >
              Permissions required to scan EC2 instances and container images for vulnerabilities
              using AWS Inspector2 and EC2 snapshot-based scanning.
            permissions:
              - name: ec2:DescribeInstances
                description: Enumerate EC2 instances to scan.
              - name: ec2:DescribeImages
                description: Read AMI metadata for image vulnerability scanning.
              - name: ec2:DescribeSnapshots
                description: Enumerate EBS snapshots used during scanning.
              - name: ec2:CreateSnapshot
                description: Create EBS snapshots of instance volumes for vulnerability scanning.
              - name: ec2:DeleteSnapshot
                description: Clean up temporary snapshots after scanning completes.
              - name: ec2:DescribeAvailabilityZones
                description: Discover availability zones for scanner placement.
              - name: ec2:DescribeRegions
                description: Enumerate regions for multi-region scanning.
              - name: ec2:DescribeInstanceTypes
                description: Read instance type information for scanner sizing.
              - name: ec2:RunInstances
                description: Launch scanner instances to perform vulnerability analysis.
              - name: ec2:TerminateInstances
                description: Terminate scanner instances after analysis completes.
              - name: ec2:CreateTags
                description: Tag scanner instances and snapshots for lifecycle management.
              - name: ec2:DescribeTags
                description: Read tags on instances and snapshots.
              - name: iam:PassRole
                description: Pass the scanner IAM role to launched EC2 instances.
              - name: inspector2:Enable
                description: Enable Inspector2 for vulnerability scanning in the account.
              - name: inspector2:ListFindings
                description: Retrieve vulnerability findings from Inspector2.
              - name: inspector2:BatchGetAccountStatus
                description: Check Inspector2 enablement status across accounts.
        iac_blueprints:
          - id: aws/federated-identity/account
            format: cloudformation
            patches: iac/aws-federated-identity-account-cnvm.cloudformation.patches.json
            title: CNVM federated identity role with EC2 and Inspector2 access
        vars:
          - name: cloud_formation_template
            type: text
            title: CloudFormation Template
            multi: false
            required: true
            show_user: false
            description: Template URL to Cloud Formation Quick Create Stack
            default: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-cnvm-9.2.0.yml&stackName=Elastic-Vulnerability-Management&param_EnrollmentToken=FLEET_ENROLLMENT_TOKEN&param_FleetUrl=FLEET_URL&param_ElasticAgentVersion=KIBANA_VERSION&param_ElasticArtifactServer=https://artifacts.elastic.co/downloads/beats/elastic-agent
owner:
  github: elastic/cloud-services
  type: elastic
