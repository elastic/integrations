---
description: Pipeline for processing event logs.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_dbf680ba
      value: 8.17.0
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags_e6856012
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: json_event_original_a68ecd77
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_cea45f41
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - fingerprint:
      fields:
        - json.eventId
        - json.customerId
        - json.eventCreated
        - json.description
        - json.entityId
      tag: fingerprint_event_bd4237fa
      target_field: _id
      ignore_missing: true
  - set:
      field: event.kind
      tag: set_event_kind_to_alert_ab1166ce
      value: alert
  - append:
      field: event.category
      tag: append_email_into_event_category_0a688284
      value: email
  - append:
      field: event.category
      tag: append_malware_into_event_category_02fd48e6
      value: malware
      if: >-
        ctx.json?.type != null && (
          ctx.json.type.equalsIgnoreCase('malware') ||
          ctx.json.type.equalsIgnoreCase('suspicious malware')
        )
  - append:
      field: event.category
      tag: append_threat_into_event_category_05e9fe2e
      value: threat
      if: >-
        ctx.json?.type != null && (
          ctx.json.type.equalsIgnoreCase('anomaly') ||
          ctx.json.type.equalsIgnoreCase('shadow_it')
        )
  - append:
      field: event.type
      tag: append_info_into_event_type_5eab37e6
      value: info
  - append:
      field: event.type
      tag: append_indicator_into_event_type_2b5d0ae1
      value: indicator
      if: >-
        ctx.json?.type != null && (
          ctx.json.type.equalsIgnoreCase('anomaly') ||
          ctx.json.type.equalsIgnoreCase('shadow_it')
        )
  - set:
      field: observer.vendor
      tag: set_observer_vendor_41ac5a33
      value: Check Point
  - set:
      field: observer.product
      tag: set_observer_product_dd5e72e4
      value: Harmony Email & Collaboration
  - foreach:
      tag: foreach_json_actions_b3cbe0e1
      field: json.actions
      if: ctx.json?.actions instanceof List
      processor:
        rename:
          field: _ingest._value.actionType
          tag: rename_actions_actionType_7b55794b
          target_field: _ingest._value.action_type
          ignore_missing: true
  - foreach:
      tag: foreach_json_actions_bfe31c68
      field: json.actions
      if: ctx.json?.actions instanceof List
      processor:
        date:
          field: _ingest._value.createTime
          tag: date_actions_createTime_9ea52b21
          target_field: _ingest._value.create_time
          formats:
            - ISO8601
          on_failure:
            - remove:
                tag: remove_ingest_value_createTime_fc79ad65
                field: _ingest._value.createTime
                ignore_missing: true
  - foreach:
      tag: foreach_json_actions_fdc05f4d
      field: json.actions
      if: ctx.json?.actions instanceof List
      processor:
        rename:
          field: _ingest._value.relatedEntityId
          tag: rename_actions_relatedEntityId_5e20149c
          target_field: _ingest._value.related_entity_id
          ignore_missing: true
  - foreach:
      tag: foreach_json_actions_ef7b7d5f
      field: json.actions
      if: ctx.json?.actions instanceof List
      processor:
        remove:
          field: _ingest._value.createTime
          tag: remove_actions_createTime_622169ff
          ignore_missing: true
  - rename:
      field: json.actions
      tag: rename_actions_2f9adcf6
      target_field: checkpoint_email.event.actions
      ignore_missing: true
  - rename:
      field: json.additionalData
      tag: rename_additionalData_48032d97
      target_field: checkpoint_email.event.additional_data
      ignore_missing: true
  - foreach:
      tag: foreach_json_availableEventActions_2e2a0fdd
      field: json.availableEventActions
      if: ctx.json?.availableEventActions instanceof List
      processor:
        rename:
          field: _ingest._value.actionName
          tag: rename_availableEventActions_actionName_3bf8e9a3
          target_field: _ingest._value.action_name
          ignore_missing: true
  - foreach:
      tag: foreach_json_availableEventActions_03368db1
      field: json.availableEventActions
      if: ctx.json?.availableEventActions instanceof List
      processor:
        rename:
          field: _ingest._value.actionParameter
          tag: rename_availableEventActions_actionParameter_ad589a32
          target_field: _ingest._value.action_parameter
          ignore_missing: true
  - rename:
      field: json.availableEventActions
      tag: rename_availableEventActions_860c8fb1
      target_field: checkpoint_email.event.available_event_actions
      ignore_missing: true
  - rename:
      field: json.confidenceIndicator
      tag: rename_confidenceIndicator_b9f9c0f4
      target_field: checkpoint_email.event.confidence_indicator
      ignore_missing: true
  - rename:
      field: json.customerId
      tag: rename_customerId_ff46d8b3
      target_field: checkpoint_email.event.customer_id
      ignore_missing: true
  - set:
      field: organization.name
      tag: set_organization_name_from_event_customer_id_81fe6990
      copy_from: checkpoint_email.event.customer_id
      ignore_empty_value: true
  - rename:
      field: json.data
      tag: rename_data_6f261d81
      target_field: checkpoint_email.event.data
      ignore_missing: true
  - grok:
      field: checkpoint_email.event.data
      tag: grok_parse_data_610b2053
      ignore_missing: true
      patterns:
        - "^#%{DATA:_temp.scan_information} attempt detected in an email from #%{DATA:_temp.source_user} - '#%{DATA:_temp.email_subject}' \\(#%{DATA:_temp.destination_user}'s mailbox\\)$"
        - "^%{DATA}(A user|has detected) #%{DATA:_temp.scan_information} in an email from #%{DATA:_temp.source_user} - '#%{DATA:_temp.email_subject}' \\(#%{DATA:_temp.destination_user}'s mailbox\\)$"
        - "^%{DATA} has detected malicious attachment\\(s\\) in '#%{DATA:_temp.email_subject}' \\(#%{DATA:_temp.destination_user}'s mailbox\\)$"
        - "^User #%{DATA:_temp.destination_user} reported a phishing email #%{DATA:_temp.email_subject}$"
        - "^Unusual geo activity for #%{DATA:_temp.user_address}: #%{DATA:_temp.user_action} for the first time from %{DATA:checkpoint_email.event.user.country}$"
        - '^%{GREEDYDATA}$'
      on_failure:
        - append:
            tag: append_error_message_c6b7891a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - json:
      field: _temp.scan_information
      tag: json_temp_scan_information_f1909042
      if: ctx._temp?.scan_information != null
      on_failure:
        - append:
            tag: append_error_message_a2d89f6f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: checkpoint_email.event.scan_type
      tag: set_scan_type_from_temp_scan_information_entity_type_0922b601
      copy_from: _temp.scan_information.entity_type
      ignore_empty_value: true
  - json:
      field: _temp.email_subject
      tag: json_temp_email_subject_6c152f4e
      if: ctx._temp?.email_subject != null
      on_failure:
        - append:
            tag: append_error_message_12409884
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: checkpoint_email.event.email_subject
      tag: set_event_email_subject_from_temp_email_subject_label_8887d175
      copy_from: _temp.email_subject.label
      ignore_empty_value: true
  - set:
      field: email.subject
      tag: set_email_subject_from_event_email_subject_b26c7926
      copy_from: checkpoint_email.event.email_subject
      ignore_empty_value: true
  - json:
      field: _temp.destination_user
      tag: json_temp_destination_user_36674122
      if: ctx._temp?.destination_user != null
      on_failure:
        - append:
            tag: append_error_message_3f81f0bd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: checkpoint_email.event.destination_address
      tag: set_event_destination_address_from_temp_destination_user_label_d5530e5d
      copy_from: _temp.destination_user.label
      ignore_empty_value: true
      if: ctx._temp?.destination_user?.label != '<Unknown>'
  - append:
      field: email.to.address
      tag: append_destination_address_into_email_to_address_5c648a0d
      value: '{{{checkpoint_email.event.destination_address}}}'
      allow_duplicates: false
      if: ctx.checkpoint_email?.event?.destination_address != null
  - set:
      field: destination.user.email
      tag: set_destination_user_email_from_event_destination_address_302c4717
      copy_from: checkpoint_email.event.destination_address
      ignore_empty_value: true
  # Keeping ignore_failure: true because we do not want to log a failure when unable to parse the user name and domain.
  - dissect:
      field: destination.user.email
      tag: dissect_destination_user_email_ebd3b1fa
      pattern: '%{destination.user.name}@%{destination.user.domain}'
      ignore_missing: true
      ignore_failure: true
  - append:
      field: related.user
      tag: append_destination_address_into_related_user_addca51e
      value: '{{{checkpoint_email.event.destination_address}}}'
      allow_duplicates: false
      if: ctx.checkpoint_email?.event?.destination_address != null
  - json:
      field: _temp.user_address
      tag: json_temp_user_address_e873ab73
      if: ctx._temp?.user_address != null
      on_failure:
        - append:
            tag: append_error_message_40790e07
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: checkpoint_email.event.user.address
      tag: set_event_user_address_from_temp_user_address_label_c85c92d2
      copy_from: _temp.user_address.label
      ignore_empty_value: true
      if: ctx._temp?.user_address?.label != '<Unknown>'
  - set:
      field: user.email
      tag: set_user_email_from_user_address_8a76c92d
      copy_from: checkpoint_email.event.user.address
      ignore_empty_value: true
  # Keeping ignore_failure: true because we do not want to log a failure when unable to parse the user name and domain.
  - dissect:
      field: user.email
      tag: dissect_user_email_e42aa86b
      pattern: '%{user.name}@%{user.domain}'
      ignore_missing: true
      ignore_failure: true
  - append:
      field: related.user
      tag: append_user_address_into_related.user_d44227e4
      value: '{{{checkpoint_email.event.user.address}}}'
      allow_duplicates: false
      if: ctx.checkpoint_email?.event?.user?.address != null
  - json:
      field: _temp.user_action
      tag: json_temp_user_action_1fbaf5aa
      if: ctx._temp?.user_action != null
      on_failure:
        - append:
            tag: append_error_message_6d6f83f7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: checkpoint_email.event.user.action
      tag: set_event_user_action_from_temp_user_action_label_1ea9a4e1
      copy_from: _temp.user_action.label
      ignore_empty_value: true
  - rename:
      field: json.description
      tag: rename_description_3540e2bf
      target_field: checkpoint_email.event.description
      ignore_missing: true
  - set:
      field: message
      tag: set_message_from_event_description_512d9d52
      copy_from: checkpoint_email.event.description
      ignore_empty_value: true
  - rename:
      field: json.entityId
      tag: rename_entityId_468de103
      target_field: checkpoint_email.event.entity_id
      ignore_missing: true
  - rename:
      field: json.entityLink
      tag: rename_entityLink_6fbc7bcd
      target_field: checkpoint_email.event.entity_link
      ignore_missing: true
  - set:
      field: event.url
      tag: set_event_url_from_event_entity_link_eea6c479
      copy_from: checkpoint_email.event.entity_link
      ignore_empty_value: true
  - date:
      field: json.eventCreated
      tag: date_eventCreated_be719703
      target_field: checkpoint_email.event.created
      formats:
        - ISO8601
      if: ctx.json?.eventCreated != null && ctx.json.eventCreated != ''
      on_failure:
        - append:
            tag: append_error_message_8abe9bf6
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: '@timestamp'
      tag: set_@timestamp_from_event_created_d81b8161
      copy_from: checkpoint_email.event.created
      ignore_empty_value: true
  - set:
      field: event.created
      tag: set_event_created_from_event_created_103ef260
      copy_from: checkpoint_email.event.created
      ignore_empty_value: true
  - rename:
      field: json.eventId
      tag: rename_eventId_9e2f41a5
      target_field: checkpoint_email.event.id
      ignore_missing: true
  - set:
      field: event.id
      tag: set_event_id_from_event_id_5cc2ca90
      copy_from: checkpoint_email.event.id
      ignore_empty_value: true
  - rename:
      field: json.saas
      tag: rename_saas_2f60d6eb
      target_field: checkpoint_email.event.saas
      ignore_missing: true
  - rename:
      field: json.senderAddress
      tag: rename_senderAddress_531cabaf
      target_field: checkpoint_email.event.sender_address
      ignore_missing: true
  - set:
      field: source.user.email
      tag: set_source_user_email_from_sender_address_3f59cc1e
      copy_from: checkpoint_email.event.sender_address
      ignore_empty_value: true
  # Keeping ignore_failure: true because we do not want to log a failure when unable to parse the user name and domain.
  - dissect:
      field: source.user.email
      tag: dissect_source_user_email_14e5533d
      pattern: '%{source.user.name}@%{source.user.domain}'
      ignore_missing: true
      ignore_failure: true
  - set:
      field: email.sender.address
      tag: set_email_sender_address_from_sender_address_d953b2bc
      copy_from: checkpoint_email.event.sender_address
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_sender_address_into_related_user_0f3b0bc1
      value: '{{{checkpoint_email.event.sender_address}}}'
      allow_duplicates: false
      if: ctx.checkpoint_email?.event?.sender_address != null
  - convert:
      field: json.severity
      tag: convert_severity_to_long_aef63828
      target_field: checkpoint_email.event.severity
      type: long
      ignore_missing: true
      if: ctx.json?.severity != null && ctx.json.severity != ''
      on_failure:
        - append:
            tag: append_error_message_57e8da95
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - script:
      tag: script_set_severity_enum_9753e1b1
      lang: painless
      description: Set severity enum.
      if: ctx.checkpoint_email?.event?.severity != null
      params:
        severity:
          - Lowest
          - Low
          - Medium
          - High
          - Critical
      source: |-
        def severityValue = ctx.checkpoint_email.event.severity;
        if (severityValue > 0 && severityValue <= params.severity.length) {
          ctx.checkpoint_email.event.put('severity_enum', params['severity'][(int)severityValue-1]);
        }
  - set:
      field: event.severity
      tag: set_event_severity_from_event_severity_919231d7
      copy_from: checkpoint_email.event.severity
      ignore_empty_value: true
  - rename:
      field: json.state
      tag: rename_state_de95ce9e
      target_field: checkpoint_email.event.state
      ignore_missing: true
  - rename:
      field: json.type
      tag: rename_type_787b7461
      target_field: checkpoint_email.event.type
      ignore_missing: true
  - remove:
      field:
        - checkpoint_email.event.customer_id
        - checkpoint_email.event.description
        - checkpoint_email.event.entity_link
        - checkpoint_email.event.id
        - checkpoint_email.event.created
        - checkpoint_email.event.severity
        - checkpoint_email.event.sender_address
        - checkpoint_email.event.destination_address
        - checkpoint_email.event.email_subject
      tag: remove_custom_duplicate_fields_4be0e4d9
      ignore_missing: true
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
  - remove:
      field:
        - json
        - _temp
      tag: remove_json_and_temp_c9df19f6
      ignore_missing: true
  - script:
      tag: script_to_drop_null_values_f6a89620
      lang: painless
      description: Drops null/empty values recursively.
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_9fe66b2c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
