---
description: Pipeline for ForgeRock idm-core debug logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_observer_vendor_a4252fc1
      field: observer.vendor
      value: ForgeRock Identity Platform
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_forgerock_09502332
      field: event.original
      target_field: forgerock
  - date:
      tag: date_forgerock_timestamp_to_timestamp_26758e33
      field: forgerock.timestamp
      formats:
        - ISO8601
      target_field: '@timestamp'
      timezone: UTC
      on_failure:
        - append:
            tag: append_error_message_e1edf820
            field: error.message
            value: '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: set_event_reason_e343387e
      field: event.reason
      copy_from: forgerock.payload
      ignore_failure: true
      if: ctx.forgerock?.payload instanceof String
  - set:
      tag: set_event_reason_e775b008
      field: event.reason
      copy_from: forgerock.payload.message
      ignore_empty_value: true
  # cleaning up
  - remove:
      tag: remove_1d2e828d
      field:
        - forgerock.timestamp
        - forgerock.type
        - forgerock.source
      ignore_failure: true
  - remove:
      tag: remove_b19558b7
      if: ctx.forgerock?.payload instanceof String && (ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields'))
      field:
        - forgerock.payload
      ignore_missing: true
  - remove:
      tag: remove_fe928479
      if: ctx.forgerock?.payload instanceof Map && (ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields'))
      field:
        - forgerock.payload.message
      ignore_missing: true
  - rename:
      tag: rename_forgerock_payload_to_forgerock_idm_core_f018ef72
      field: forgerock.payload
      target_field: forgerock.idm_core
      ignore_missing: true
  - script:
      tag: script_9d6fa8ba
      description: Drops null/empty values recursively
      lang: painless
      ignore_failure: true
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
on_failure:
  - append:
      field: error.message
      value: "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
