---
description: Pipeline for ForgeRock am-confg audit logs
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_observer_vendor_a4252fc1
      field: observer.vendor
      value: ForgeRock Identity Platform
  - rename:
      tag: rename_message_to_event_original_56a77271
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: 'The `message` field is no longer required if the document has an `event.original` field.'
  - json:
      tag: json_event_original_to_json_5e54dc16
      field: event.original
      target_field: json
  - rename:
      tag: rename_json_payload_to_forgerock_12e49639
      field: json.payload
      target_field: forgerock
  - set:
      tag: set_event_id_61b21b41
      field: event.id
      copy_from: forgerock._id
      ignore_failure: true
  - set:
      tag: set_transaction_id_04cf8970
      field: transaction.id
      copy_from: forgerock.transactionId
      ignore_failure: true
  - date:
      tag: date_forgerock_timestamp_to_timestamp_26758e33
      field: forgerock.timestamp
      formats:
        - ISO8601
      target_field: '@timestamp'
      timezone: UTC
      on_failure:
        - append:
            tag: append_error_message_e1edf820
            field: error.message
            value: '{{{ _ingest.on_failure_message }}}'
  # am-config processing
  - set:
      tag: set_event_category_e56470ca
      field: event.category
      value: [configuration]
  - set:
      tag: set_event_action_03f124af
      field: event.action
      copy_from: forgerock.eventName
      ignore_failure: true
  - set:
      tag: set_user_id_374bda8c
      field: user.id
      copy_from: forgerock.userId
      ignore_failure: true
  - set:
      tag: set_user_effective_id_9b10f540
      field: user.effective.id
      copy_from: forgerock.runAs
      ignore_failure: true
  # cleaning up
  - remove:
      tag: remove_ca120718
      field:
        - json.timestamp
        - json.type
      ignore_failure: true
  - remove:
      tag: remove_a017d454
      if: ctx.tags == null || !(ctx.tags.contains('preserve_duplicate_custom_fields'))
      field:
        - json
        - forgerock._id
        - forgerock.transactionId
        - forgerock.runAs
        - forgerock.userId
        - forgerock.timestamp
        - forgerock.eventName
      ignore_failure: true
      ignore_missing: true
  - script:
      tag: script_9d6fa8ba
      description: Drops null/empty values recursively
      lang: painless
      ignore_failure: true
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
on_failure:
  - append:
      field: error.message
      value: "{{{ _ingest.on_failure_message }}}"
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
