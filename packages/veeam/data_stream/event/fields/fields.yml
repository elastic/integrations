- name: veeam
  type: group
  description: "Fields from Veeam Backup & Replication Event Forwarding."
  fields:
    - name: event
      type: group
      description: "Fields extracted from Veeam RFC 5424 event structured data."
      fields:
        - name: accelerator_id
          type: keyword
          description: "Veeam `AcceleratorID` structured-data parameter."
        - name: accelerator_name
          type: keyword
          description: "Veeam `AcceleratorName` structured-data parameter."
        - name: account_name
          type: keyword
          description: "Credential account user name."
        - name: added_object_ids
          type: keyword
          description: "Veeam `AddedObjectIDs` structured-data parameter."
        - name: added_object_names
          type: keyword
          description: "Veeam `AddedObjectNames` structured-data parameter."
        - name: app_group_id
          type: keyword
          description: "Veeam `AppGroupID` structured-data parameter."
        - name: archive_policy
          type: keyword
          description: "Veeam `ArchivePolicy` structured-data parameter."
        - name: archive_repository_id
          type: keyword
          description: "Veeam `ArchiveRepositoryID` structured-data parameter."
        - name: backup_id
          type: keyword
          description: "Backup GUID."
        - name: backup_name
          type: keyword
          description: "Backup display name."
        - name: barcode
          type: keyword
          description: "Veeam `Barcode` structured-data parameter."
        - name: category_id
          type: keyword
          description: "Veeam syslog category identifier. Samples use 0; this is not ECS event.category."
        - name: certificate_thumbprint
          type: keyword
          description: "Veeam `CertificateThumbprint` structured-data parameter."
        - name: chain_id
          type: keyword
          description: "Veeam `ChainId` structured-data parameter."
        - name: changes_xml
          type: wildcard
          description: "Opaque XML describing configuration or analyzer changes."
        - name: client_id
          type: keyword
          description: "OAuth or REST client identifier."
        - name: cluster_description
          type: keyword
          description: "Veeam `ClusterDescription` structured-data parameter."
        - name: cluster_endpoint
          type: keyword
          description: "Veeam `ClusterEndpoint` structured-data parameter."
        - name: cluster_name
          type: keyword
          description: "Veeam `ClusterName` structured-data parameter."
        - name: component_display_name
          type: keyword
          description: "Veeam `ComponentDisplayName` structured-data parameter."
        - name: configuration_backup_spec_xml
          type: wildcard
          description: "Configuration backup session data as XML."
        - name: connection_code
          type: keyword
          description: "Veeam `ConnectionCode` structured-data parameter."
        - name: creation_time
          type: date
          description: "When a restore point was created, as MM/DD/YYYY HH:MM:SS without offset."
        - name: creation_time_utc
          type: date
          description: "When a malware detection event was created, as MM/DD/YYYY HH:MM:SS without offset."
        - name: credentials_id
          type: keyword
          description: "Credential record GUID."
        - name: database_name
          type: keyword
          description: "Veeam `DatabaseName` structured-data parameter."
        - name: datastore_name
          type: keyword
          description: "Veeam `DatastoreName` structured-data parameter."
        - name: date_time
          type: date
          description: "Restore-point timestamp as MM/DD/YYYY HH:MM:SS without offset."
        - name: days_left
          type: long
          description: "Days remaining before the licence expires."
        - name: destination
          type: wildcard
          description: "Restore destination details, often XML."
        - name: details
          type: wildcard
          description: "Additional event details."
        - name: detection_time_utc
          type: date
          description: "When malware activity was detected, as MM/DD/YYYY HH:MM:SS without offset."
        - name: edition
          type: keyword
          description: "Veeam `Edition` structured-data parameter."
        - name: encryption_type
          type: keyword
          description: "Veeam `EncryptionType` structured-data parameter."
        - name: endpoint
          type: keyword
          description: "Client endpoint, typically ip:port or [ipv6]:port."
        - name: enterprise_id
          type: keyword
          description: "IANA private enterprise number from the origin structured-data element. Veeam is 31023."
        - name: esx_name
          type: keyword
          description: "Veeam `ESXName` structured-data parameter."
        - name: event_type
          type: keyword
          description: "Vendor event type string."
        - name: event_type_id
          type: keyword
          description: "Veeam `EventTypeID` structured-data parameter."
        - name: expected_resource_ids
          type: keyword
          description: "Resource identifiers expected by the Veeam service."
        - name: expiration_time_utc
          type: date
          description: "Access token expiration time as a locale datetime string."
        - name: expiration_utc
          type: date
          description: "Veeam `ExpirationUTC` structured-data parameter."
        - name: extent_id
          type: keyword
          description: "Veeam `ExtentID` structured-data parameter."
        - name: extent_name
          type: keyword
          description: "Veeam `ExtentName` structured-data parameter."
        - name: extra_data
          type: keyword
          description: "Additional operation summary."
        - name: failover_plan_id
          type: keyword
          description: "Veeam `FailoverPlanID` structured-data parameter."
        - name: failover_plan_name
          type: keyword
          description: "Veeam `FailoverPlanName` structured-data parameter."
        - name: failure_message
          type: keyword
          description: "Veeam `FailureMessage` structured-data parameter."
        - name: false_positive
          type: boolean
          description: "Whether a malware detection event is a false positive."
        - name: file_server_id
          type: keyword
          description: "Veeam `FileServerID` structured-data parameter."
        - name: file_share_id
          type: keyword
          description: "Veeam `FileShareID` structured-data parameter."
        - name: flags
          type: keyword
          description: "Job flags. Documentation describes whether the job was started by a user."
        - name: folder_ref
          type: keyword
          description: "Veeam `FolderRef` structured-data parameter."
        - name: friendly_name
          type: keyword
          description: "Login or friendly name on token and authorization events."
        - name: gateway_id
          type: keyword
          description: "Veeam `GatewayID` structured-data parameter."
        - name: gateway_name
          type: keyword
          description: "Veeam `GatewayName` structured-data parameter."
        - name: gateway_pool_id
          type: keyword
          description: "Veeam `GatewayPoolID` structured-data parameter."
        - name: gateway_pool_name
          type: keyword
          description: "Veeam `GatewayPoolName` structured-data parameter."
        - name: grant_type
          type: keyword
          description: "OAuth grant type."
        - name: hardware_plan_id
          type: keyword
          description: "Veeam `HardwarePlanID` structured-data parameter."
        - name: hint
          type: keyword
          description: "Veeam `Hint` structured-data parameter."
        - name: host_id
          type: keyword
          description: "Veeam `HostID` structured-data parameter."
        - name: host_name
          type: keyword
          description: "Infrastructure component hostname."
        - name: id
          type: keyword
          description: "User, group, or role object GUID."
        - name: idp_entity_id
          type: keyword
          description: "Veeam `IdpEntityId` structured-data parameter."
        - name: infrastructure_id
          type: keyword
          description: "Veeam `InfrastructureID` structured-data parameter."
        - name: initiator_full_info
          type: group
          description: "Initiator details from InitiatorFullInfo XML."
          fields:
            - name: original
              type: wildcard
              description: "Original InitiatorFullInfo value, XML or plain text."
            - name: full_name
              type: keyword
              description: "User full name parsed from ModifiedUserInfo XML, or the plain-text value when the field is not XML."
            - name: login_type
              type: keyword
              description: "Numeric loginType from ModifiedUserInfo XML."
        - name: initiator_name
          type: keyword
          description: "Name of the user who initiated the operation."
        - name: initiator_user_name
          type: keyword
          description: "Veeam `InitiatorUserName` structured-data parameter."
        - name: installation_id
          type: keyword
          description: "Veeam `InstallationID` structured-data parameter."
        - name: is_corrupted
          type: boolean
          description: "Whether the restore point is corrupted."
        - name: is_disabled
          type: boolean
          description: "Whether the object is disabled."
        - name: is_full
          type: boolean
          description: "Whether the restore point is a full backup."
        - name: is_install_or_upgrade
          type: boolean
          description: "Veeam `IsInstallOrUpgrade` structured-data parameter."
        - name: is_manual_run
          type: boolean
          description: "Whether Security and Compliance Analyzer ran manually."
        - name: is_retry
          type: boolean
          description: "Whether this task is a retry."
        - name: is_sure_replica
          type: boolean
          description: "Veeam `IsSureReplica` structured-data parameter."
        - name: is_throttling_enabled
          type: boolean
          description: "Veeam `IsThrottlingEnabled` structured-data parameter."
        - name: job_description
          type: wildcard
          description: "Job description text."
        - name: job_id
          type: keyword
          description: "GUID of the Veeam job."
        - name: job_name
          type: keyword
          description: "Display name of the Veeam job."
        - name: job_result
          type: keyword
          description: "Job finish result: 0 Success, 1 Warning, 2 Failed."
        - name: job_session_id
          type: keyword
          description: "GUID of the Veeam job session."
        - name: job_type
          type: keyword
          description: "Numeric Veeam job type. Official integer tables are not published."
        - name: kms_server_id
          type: keyword
          description: "Veeam `KMSServerID` structured-data parameter."
        - name: last_known_host_name
          type: keyword
          description: "Veeam `LastKnownHostName` structured-data parameter."
        - name: location
          type: keyword
          description: "Veeam `Location` structured-data parameter."
        - name: log_export_spec_xml
          type: wildcard
          description: "Log export session data as XML."
        - name: maintenance_mode
          type: keyword
          description: "Veeam `MaintenanceMode` structured-data parameter."
        - name: media_pool_id
          type: keyword
          description: "Veeam `MediaPoolID` structured-data parameter."
        - name: media_set_id
          type: keyword
          description: "Veeam `MediaSetID` structured-data parameter."
        - name: modified_object_ids
          type: keyword
          description: "Veeam `ModifiedObjectIDs` structured-data parameter."
        - name: modified_object_names
          type: keyword
          description: "Veeam `ModifiedObjectNames` structured-data parameter."
        - name: mount_id
          type: keyword
          description: "Veeam `MountID` structured-data parameter."
        - name: mount_server
          type: keyword
          description: "Veeam `MountServer` structured-data parameter."
        - name: name
          type: keyword
          description: "User, group, or object name."
        - name: new_password_hint
          type: keyword
          description: "Veeam `NewPasswordHint` structured-data parameter."
        - name: new_password_id
          type: keyword
          description: "Veeam `NewPasswordId` structured-data parameter."
        - name: new_primary_node_name
          type: keyword
          description: "Veeam `NewPrimaryNodeName` structured-data parameter."
        - name: new_quota_in_megabytes
          type: long
          description: "Veeam `NewQuotaInMegabytes` structured-data parameter."
        - name: new_secondary_node_name
          type: keyword
          description: "Veeam `NewSecondaryNodeName` structured-data parameter."
        - name: new_status
          type: keyword
          description: "Veeam `NewStatus` structured-data parameter."
        - name: not_implemented
          type: long
          description: "Count of analyzer checks with Not implemented status."
          metric_type: gauge
        - name: note
          type: keyword
          description: "Comment specified in a Note field."
        - name: object_id
          type: keyword
          description: "Protected object GUID."
        - name: object_name
          type: keyword
          description: "Protected object name."
        - name: oib_id
          type: keyword
          description: "Restore-point / machine (OIB) GUID."
        - name: old_status
          type: keyword
          description: "Veeam `OldStatus` structured-data parameter."
        - name: operation
          type: keyword
          description: "Display name of the four-eyes or related operation."
        - name: operation_id
          type: keyword
          description: "Four-eyes or other operation identifier."
        - name: operation_summary
          type: wildcard
          description: "Tape or operation summary text."
        - name: original_oib_id
          type: keyword
          description: "Original restore-point / machine GUID."
        - name: original_password_hint
          type: keyword
          description: "Veeam `OriginalPasswordHint` structured-data parameter."
        - name: original_password_id
          type: keyword
          description: "Veeam `OriginalPasswordId` structured-data parameter."
        - name: param3
          type: keyword
          description: "Additional vendor parameter."
        - name: parameters
          type: keyword
          description: "Veeam `Parameters` structured-data parameter."
        - name: password_matched
          type: boolean
          description: "Whether the supplied password matched the stored credential record."
        - name: platform
          type: keyword
          description: "Numeric platform type. Official integer tables are not published."
        - name: point_id
          type: keyword
          description: "Restore point GUID."
        - name: policy_name
          type: keyword
          description: "Veeam `PolicyName` structured-data parameter."
        - name: port
          type: long
          description: "Veeam `Port` structured-data parameter."
        - name: protection_group_id
          type: keyword
          description: "Veeam `ProtectionGroupID` structured-data parameter."
        - name: protection_group_name
          type: keyword
          description: "Veeam `ProtectionGroupName` structured-data parameter."
        - name: provider_id
          type: keyword
          description: "Veeam `ProviderID` structured-data parameter."
        - name: provider_name
          type: keyword
          description: "Veeam `ProviderName` structured-data parameter."
        - name: proxy_id
          type: keyword
          description: "Veeam `ProxyID` structured-data parameter."
        - name: proxy_name
          type: keyword
          description: "Veeam `ProxyName` structured-data parameter."
        - name: proxy_server
          type: keyword
          description: "Veeam `ProxyServer` structured-data parameter."
        - name: quota_id
          type: keyword
          description: "Veeam `QuotaID` structured-data parameter."
        - name: quota_in_megabytes
          type: long
          description: "Veeam `QuotaInMegabytes` structured-data parameter."
        - name: reason
          type: keyword
          description: "Reason code or reason text for the operation."
        - name: redirect_uri
          type: keyword
          description: "Veeam `RedirectUri` structured-data parameter."
        - name: refresh_token_chain_id
          type: keyword
          description: "Refresh token chain identifier."
        - name: related_creds_id
          type: keyword
          description: "Veeam `RelatedCredsID` structured-data parameter."
        - name: related_creds_name
          type: keyword
          description: "Veeam `RelatedCredsName` structured-data parameter."
        - name: removed_object_ids
          type: keyword
          description: "Veeam `RemovedObjectIDs` structured-data parameter."
        - name: removed_object_names
          type: keyword
          description: "Veeam `RemovedObjectNames` structured-data parameter."
        - name: repo_access_group_id
          type: keyword
          description: "Veeam `RepoAccessGroupID` structured-data parameter."
        - name: repository_id
          type: keyword
          description: "Backup repository GUID."
        - name: repository_name
          type: keyword
          description: "Backup repository display name."
        - name: repository_oib_id
          type: keyword
          description: "Veeam `RepositoryOibID` structured-data parameter."
        - name: request_id
          type: keyword
          description: "Veeam `RequestID` structured-data parameter."
        - name: reset_count
          type: long
          description: "Number of configuration parameters returned to the checklist."
          metric_type: gauge
        - name: resource_id
          type: keyword
          description: "Resource identifier for token and authorization events."
        - name: restore_point_id
          type: keyword
          description: "Veeam `RestorePointID` structured-data parameter."
        - name: restore_point_time
          type: date
          description: "Veeam `RestorePointTime` structured-data parameter."
        - name: restore_point_time_stamp
          type: date
          description: "Restore-point creation timestamp as MM/DD/YYYY HH:MM:SS without offset."
        - name: restore_type
          type: keyword
          description: "Numeric restore operation type."
        - name: result
          type: keyword
          description: "Session result. Samples use 0 Success, 1 Warning, 2 Failed, or the string Success."
        - name: scan_time_utc
          type: date
          description: "When a scan session started, as MM/DD/YYYY HH:MM:SS without offset."
        - name: secondary_node_name
          type: keyword
          description: "Veeam `SecondaryNodeName` structured-data parameter."
        - name: sequence_number
          type: keyword
          description: "Veeam `SequenceNumber` structured-data parameter."
        - name: server_id
          type: keyword
          description: "Veeam `ServerID` structured-data parameter."
        - name: server_name
          type: keyword
          description: "Server name associated with the restore point or object."
        - name: session_id
          type: keyword
          description: "Session GUID."
        - name: source_location
          type: keyword
          description: "Veeam `SourceLocation` structured-data parameter."
        - name: source_location_id
          type: keyword
          description: "Veeam `SourceLocationID` structured-data parameter."
        - name: source_name
          type: keyword
          description: "Veeam `SourceName` structured-data parameter."
        - name: source_objects
          type: keyword
          description: "Comma-separated source object identifiers."
        - name: source_type
          type: keyword
          description: "Numeric job source type. Official integer tables are not published."
        - name: state
          type: keyword
          description: "Veeam `State` structured-data parameter."
        - name: status
          type: keyword
          description: "Task or session status. Task-finished samples use 0 Success, 2 Failed, 3 Warning."
        - name: storage_id
          type: keyword
          description: "Veeam `StorageID` structured-data parameter."
        - name: storage_size
          type: long
          description: "Restore-point size in bytes."
          unit: byte
          metric_type: gauge
        - name: subject
          type: keyword
          description: "Subject identifier on token and authorization events."
        - name: subtenant_id
          type: keyword
          description: "Veeam `SubtenantID` structured-data parameter."
        - name: subtenant_name
          type: keyword
          description: "Veeam `SubtenantName` structured-data parameter."
        - name: success
          type: long
          description: "Count of analyzer checks with Passed status."
          metric_type: gauge
        - name: supervisor_full_info
          type: group
          description: "Supervisor details from SupervisorFullInfo XML."
          fields:
            - name: original
              type: wildcard
              description: "Original SupervisorFullInfo value, XML or plain text."
            - name: full_name
              type: keyword
              description: "User full name parsed from ModifiedUserInfo XML, or the plain-text value when the field is not XML."
            - name: login_type
              type: keyword
              description: "Numeric loginType from ModifiedUserInfo XML."
        - name: support_left
          type: long
          description: "Days of support remaining; -1 when not applicable."
        - name: suppressed
          type: long
          description: "Count of analyzer checks excluded from the checklist."
          metric_type: gauge
        - name: suppressed_count
          type: long
          description: "Number of configuration parameters excluded from the checklist."
          metric_type: gauge
        - name: tape_id
          type: keyword
          description: "Veeam `TapeID` structured-data parameter."
        - name: tape_ids
          type: keyword
          description: "Tape identifiers."
        - name: tape_library_id
          type: keyword
          description: "Veeam `TapeLibraryID` structured-data parameter."
        - name: tape_object_id
          type: keyword
          description: "Veeam `TapeObjectID` structured-data parameter."
        - name: tape_object_name
          type: keyword
          description: "Veeam `TapeObjectName` structured-data parameter."
        - name: tape_oib_id
          type: keyword
          description: "Veeam `TapeOibID` structured-data parameter."
        - name: tape_storage_creation_time
          type: date
          description: "Veeam `TapeStorageCreationTime` structured-data parameter."
        - name: tape_storage_id
          type: keyword
          description: "Veeam `TapeStorageID` structured-data parameter."
        - name: tape_used_size
          type: long
          description: "Veeam `TapeUsedSize` structured-data parameter."
          unit: byte
          metric_type: gauge
        - name: target_event_id
          type: keyword
          description: "Veeam `TargetEventID` structured-data parameter."
        - name: target_ip_address
          type: keyword
          description: "Target machine name or IP for entropy analysis download."
        - name: target_location
          type: keyword
          description: "Veeam `TargetLocation` structured-data parameter."
        - name: target_location_id
          type: keyword
          description: "Veeam `TargetLocationID` structured-data parameter."
        - name: target_media_pool_id
          type: keyword
          description: "Veeam `TargetMediaPoolID` structured-data parameter."
        - name: target_name
          type: keyword
          description: "Veeam `TargetName` structured-data parameter."
        - name: target_object_id
          type: keyword
          description: "Target object GUID."
        - name: task_session_id
          type: keyword
          description: "Task session GUID."
        - name: task_session_type
          type: keyword
          description: "Veeam `TaskSessionType` structured-data parameter."
        - name: tenant_id
          type: keyword
          description: "Veeam `TenantID` structured-data parameter."
        - name: tenant_name
          type: keyword
          description: "Veeam `TenantName` structured-data parameter."
        - name: throttling_speed_limit
          type: keyword
          description: "Veeam `ThrottlingSpeedLimit` structured-data parameter."
        - name: throttling_speed_unit
          type: keyword
          description: "Veeam `ThrottlingSpeedUnit` structured-data parameter."
        - name: token_id
          type: keyword
          description: "Veeam `TokenID` structured-data parameter."
        - name: total_status
          type: keyword
          description: "Veeam `TotalStatus` structured-data parameter."
        - name: transferred_gb
          type: double
          description: "Data transferred by a backup task, in decimal gigabytes."
          metric_type: gauge
        - name: type
          type: keyword
          description: "Numeric type for repositories, storage, or similar objects."
        - name: unable_to_check
          type: long
          description: "Count of analyzer checks that could not be detected."
          metric_type: gauge
        - name: user_full_info
          type: group
          description: "Actor details from UserFullInfo. May be XML or the plain string SYSTEM."
          fields:
            - name: original
              type: wildcard
              description: "Original UserFullInfo value, XML or plain text."
            - name: full_name
              type: keyword
              description: "User full name parsed from ModifiedUserInfo XML, or the plain-text value when the field is not XML."
            - name: login_type
              type: keyword
              description: "Numeric loginType from ModifiedUserInfo XML."
        - name: user_id
          type: keyword
          description: "User identifier. Samples may contain a GUID or a SID depending on the event."
        - name: version
          type: keyword
          description: "Event schema version from the structured-data Version parameter."
        - name: virtual_lab_id
          type: keyword
          description: "Veeam `VirtualLabID` structured-data parameter."
        - name: vm_id
          type: keyword
          description: "Veeam `VmID` structured-data parameter."
        - name: vm_location
          type: keyword
          description: "Veeam `VmLocation` structured-data parameter."
        - name: vm_name
          type: keyword
          description: "Protected virtual machine name."
        - name: vm_ref
          type: keyword
          description: "Platform reference for the virtual machine."
        - name: wan_accelerator_id
          type: keyword
          description: "Veeam `WanAcceleratorID` structured-data parameter."
        - name: wan_accelerator_name
          type: keyword
          description: "Veeam `WanAcceleratorName` structured-data parameter."
        - name: will_be_retried
          type: boolean
          description: "Whether Veeam plans to retry the job."
        - name: xml_change
          type: wildcard
          description: "Updated data in XML format."
