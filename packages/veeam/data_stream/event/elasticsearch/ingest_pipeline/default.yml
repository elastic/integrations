---
description: Parse Veeam Backup & Replication Event Forwarding syslog.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.5.0'
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - grok:
      field: event.original
      tag: grok_severity_and_payload
      description: Parse the Veeam [INF]/[WRN]/[ERR] token and event payload. RFC 5424 header fields come from the Agent syslog processor (`log.syslog.*`).
      if: ctx.event?.original != null && ctx.event.original != ''
      patterns:
        - '^%{DATA}\[(?<_temp.severity_token>INF|WRN|ERR)\] %{GREEDYDATA:_temp.payload}$'
        - '^%{GREEDYDATA:_temp.payload}$'
      ignore_failure: true
  - set:
      field: log.level
      tag: set_log_level_info
      value: info
      if: ctx._temp?.severity_token == 'INF'
  - set:
      field: log.level
      tag: set_log_level_warning
      value: warning
      if: ctx._temp?.severity_token == 'WRN'
  - set:
      field: log.level
      tag: set_log_level_error
      value: error
      if: ctx._temp?.severity_token == 'ERR'
  - set:
      field: event.provider
      tag: set_event_provider
      copy_from: log.syslog.appname
      ignore_empty_value: true
      if: ctx.event?.provider == null && ctx.log?.syslog?.appname != null && ctx.log.syslog.appname != '-'
  - set:
      field: observer.hostname
      tag: set_observer_hostname
      copy_from: log.syslog.hostname
      ignore_empty_value: true
      if: ctx.observer?.hostname == null && ctx.log?.syslog?.hostname != null && ctx.log.syslog.hostname != '-'
  - trim:
      field: _temp.payload
      tag: trim_payload
      ignore_missing: true
  - grok:
      field: _temp.payload
      tag: grok_kv_src
      description: Strip wrapping brackets from the Veeam structured-data payload before kv parsing.
      patterns:
        - '^\[%{GREEDYDATA:_temp.kv_src}\]$'
        - '^%{DATA}\[%{GREEDYDATA:_temp.kv_src}\]$'
      ignore_failure: true
      if: ctx._temp?.payload != null && ctx._temp.payload.contains('[categoryId=')
  - kv:
      field: _temp.kv_src
      tag: kv_structured_data
      description: Parse all Veeam structured-data key=value pairs, including XML-valued parameters. Split only on PascalCase SD keys plus categoryId/instanceId/isDisabled/param3 so camelCase XML attributes stay inside the value.
      target_field: _temp.kv
      field_split: ' (?=(?:[A-Z][A-Za-z0-9_]*|instanceId|categoryId|isDisabled|param3)=)'
      value_split: '='
      trim_key: ' '
      trim_value: '"'
      ignore_missing: true
      ignore_failure: true
      if: ctx._temp?.kv_src != null && ctx._temp.kv_src != ''
  - script:
      lang: painless
      tag: parse_xml_sd_values
      description: Parse XML payloads already stored by kv on UserFullInfo, InitiatorFullInfo, and SupervisorFullInfo.
      if: ctx._temp?.kv instanceof Map
      params:
        user_info_keys:
          - UserFullInfo
          - InitiatorFullInfo
          - SupervisorFullInfo
      source: |-
        def parseUserInfo(def raw) {
          def obj = new HashMap();
          obj.put('original', raw);
          if (raw.startsWith('<')) {
            int fn = raw.indexOf('fullName="');
            if (fn >= 0) {
              int start = fn + 10;
              int end = raw.indexOf('"', start);
              if (end > start) {
                obj.put('full_name', raw.substring(start, end));
              }
            }
            int lt = raw.indexOf('loginType="');
            if (lt >= 0) {
              int start = lt + 11;
              int end = raw.indexOf('"', start);
              if (end > start) {
                obj.put('login_type', raw.substring(start, end));
              }
            }
          } else {
            obj.put('full_name', raw);
          }
          return obj;
        }
        def kv = ctx._temp.kv;
        for (def key : params.user_info_keys) {
          def raw = kv.get(key);
          if (raw instanceof String) {
            if (raw.trim() == '') {
              kv.remove(key);
            } else {
              kv.put(key, parseUserInfo(raw.trim()));
            }
          }
        }
  - script:
      lang: painless
      tag: copy_kv_to_vendor_fields
      description: Copy remaining structured-data keys into veeam.event using snake_case names.
      if: ctx._temp?.kv instanceof Map
      params:
        skip:
          - Description
          - Message
          - VbrHostName
          - VbrVersion
          - SourceIpAddress
          - UserName
          - SID
      source: |-
        def toSnake(def key) {
          if (key == 'RestorePointTIme') {
            return 'restore_point_time';
          }
          def snake = /([a-z0-9])([A-Z])/.matcher(key).replaceAll('$1_$2');
          snake = /([A-Z]+)([A-Z][a-z])/.matcher(snake).replaceAll('$1_$2');
          return snake.toLowerCase().replace('_i_ds', '_ids');
        }
        if (ctx.veeam == null) {
          ctx.veeam = new HashMap();
        }
        if (ctx.veeam.event == null) {
          ctx.veeam.event = new HashMap();
        }
        def skip = params.skip;
        for (def e : ctx._temp.kv.entrySet()) {
          if (skip.contains(e.getKey())) {
            continue;
          }
          if (e.getValue() instanceof String && e.getValue().trim() == '') {
            continue;
          }
          ctx.veeam.event.put(toSnake(e.getKey()), e.getValue());
        }
  - set:
      field: veeam.event.enterprise_id
      tag: set_enterprise_id
      copy_from: log.syslog.structured_data.origin.enterpriseId
      ignore_empty_value: true
      if: ctx.veeam?.event?.enterprise_id == null && ctx.log?.syslog?.structured_data?.origin?.enterpriseId != null
  - set:
      field: event.code
      tag: set_event_code
      copy_from: veeam.event.instance_id
      ignore_empty_value: true
      if: ctx.veeam?.event?.instance_id != null
  - set:
      field: rule.name
      tag: set_rule_name
      copy_from: veeam.event.activity_type
      ignore_empty_value: true
      if: ctx.veeam?.event?.activity_type != null
  - set:
      field: event.outcome
      tag: set_event_outcome_success_from_job_result
      value: success
      if: 'ctx.event?.outcome == null && ctx.veeam?.event?.job_result != null && ["0", "success"].contains(ctx.veeam.event.job_result.toString().toLowerCase())'
  - set:
      field: event.outcome
      tag: set_event_outcome_failure_from_job_result
      value: failure
      if: 'ctx.event?.outcome == null && ctx.veeam?.event?.job_result != null && ["2", "failed", "fail", "failure"].contains(ctx.veeam.event.job_result.toString().toLowerCase())'
  - set:
      field: event.outcome
      tag: set_event_outcome_success_from_result
      value: success
      if: 'ctx.event?.outcome == null && ctx.veeam?.event?.result != null && ["0", "success"].contains(ctx.veeam.event.result.toString().toLowerCase())'
  - set:
      field: event.outcome
      tag: set_event_outcome_failure_from_result
      value: failure
      if: 'ctx.event?.outcome == null && ctx.veeam?.event?.result != null && ["2", "fail","failed", "failure"].contains(ctx.veeam.event.result.toString().toLowerCase())'
  - set:
      field: event.outcome
      tag: set_event_outcome_success_from_status
      value: success
      if: 'ctx.event?.outcome == null && ctx.veeam?.event?.status != null && ["0", "success"].contains(ctx.veeam.event.status.toString().toLowerCase())'
  - set:
      field: event.outcome
      tag: set_event_outcome_failure_from_status
      value: failure
      if: 'ctx.event?.outcome == null && ctx.veeam?.event?.status != null && ["2", "fail", "failed", "failure"].contains(ctx.veeam.event.status.toString().toLowerCase())'
  - set:
      field: message
      tag: set_message_from_sd_message
      copy_from: _temp.kv.Message
      ignore_empty_value: true
      if: ctx._temp?.kv?.Message != null
  - set:
      field: message
      tag: set_message_from_description
      copy_from: _temp.kv.Description
      ignore_empty_value: true
      if: ctx.message == null && ctx._temp?.kv?.Description != null
  - set:
      field: message
      tag: set_message_from_free_text
      copy_from: _temp.payload
      ignore_empty_value: true
      if: ctx.message == null && ctx._temp?.kv_src == null && ctx._temp?.payload != null
  - set:
      field: host.name
      tag: set_host_name
      copy_from: _temp.kv.VbrHostName
      ignore_empty_value: true
      if: ctx._temp?.kv?.VbrHostName != null
  - set:
      field: observer.version
      tag: set_observer_version
      copy_from: _temp.kv.VbrVersion
      ignore_empty_value: true
      if: ctx._temp?.kv?.VbrVersion != null
  - convert:
      field: _temp.kv.SourceIpAddress
      type: ip
      tag: convert_source_ip_address
      ignore_missing: true
      if: ctx._temp?.kv?.SourceIpAddress != ''
      on_failure:
        - remove:
            field: _temp.kv.SourceIpAddress
            ignore_missing: true
            tag: remove_invalid_source_ip_address
        - append:
            tag: append_convert_source_ip_address_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.ip
      tag: set_source_ip
      copy_from: _temp.kv.SourceIpAddress
      ignore_empty_value: true
      if: ctx.source?.ip == null && ctx._temp?.kv?.SourceIpAddress != null
  - set:
      field: source.address
      tag: set_source_address
      copy_from: veeam.event.source_host_name
      ignore_empty_value: true
      if: ctx.veeam?.event?.source_host_name != null
  - set:
      field: user.id
      tag: set_user_id
      copy_from: _temp.kv.SID
      ignore_empty_value: true
      if: ctx._temp?.kv?.SID != null
  - grok:
      field: _temp.kv.UserName
      tag: grok_user_name
      description: Split Veeam UserName DOMAIN\user into ECS user.domain and user.name.
      patterns:
        - '^(?<user.domain>[^\\]+)\\(?<user.name>.+)$'
        - '^(?<user.name>.+)$'
      ignore_failure: true
      if: ctx.user?.name == null && ctx._temp?.kv?.UserName != null && ctx._temp.kv.UserName != ''
  - grok:
      field: veeam.event.friendly_name
      tag: grok_friendly_name
      description: Split FriendlyName DOMAIN\user into ECS user fields when UserName is absent.
      patterns:
        - '^(?<user.domain>[^\\]+)\\(?<user.name>.+)$'
        - '^(?<user.name>.+)$'
      ignore_failure: true
      if: ctx.user?.name == null && ctx.veeam?.event?.friendly_name != null && ctx.veeam.event.friendly_name != ''
  - grok:
      field: veeam.event.initiator_name
      tag: grok_initiator_name
      description: Split InitiatorName DOMAIN\user into ECS user fields when no prior user name is set.
      patterns:
        - '^(?<user.domain>[^\\]+)\\(?<user.name>.+)$'
        - '^(?<user.name>.+)$'
      ignore_failure: true
      if: ctx.user?.name == null && ctx.veeam?.event?.initiator_name != null && ctx.veeam.event.initiator_name != ''
  - grok:
      field: veeam.event.user_full_info.full_name
      tag: grok_user_full_info_name
      description: Split UserFullInfo full_name DOMAIN\user into ECS user fields when no prior user name is set.
      patterns:
        - '^(?<user.domain>[^\\]+)\\(?<user.name>.+)$'
        - '^(?<user.name>.+)$'
      ignore_failure: true
      if: ctx.user?.name == null && ctx.veeam?.event?.user_full_info?.full_name != null
  - grok:
      field: veeam.event.initiator_full_info.full_name
      tag: grok_initiator_full_info_name
      description: Split InitiatorFullInfo full_name DOMAIN\user into ECS user fields when no prior user name is set.
      patterns:
        - '^(?<user.domain>[^\\]+)\\(?<user.name>.+)$'
        - '^(?<user.name>.+)$'
      ignore_failure: true
      if: ctx.user?.name == null && ctx.veeam?.event?.initiator_full_info?.full_name != null
  - grok:
      field: veeam.event.supervisor_full_info.full_name
      tag: grok_supervisor_full_info_name
      description: Split SupervisorFullInfo full_name DOMAIN\user into ECS user fields when no prior user name is set.
      patterns:
        - '^(?<user.domain>[^\\]+)\\(?<user.name>.+)$'
        - '^(?<user.name>.+)$'
      ignore_failure: true
      if: ctx.user?.name == null && ctx.veeam?.event?.supervisor_full_info?.full_name != null
  - grok:
      field: veeam.event.endpoint
      tag: grok_endpoint
      description: Parse Endpoint ip:port into source.ip and source.port when SourceIpAddress is absent.
      patterns:
        - '^\[%{IP:source.ip}\]:%{NUMBER:source.port}$'
        - '^%{IP:source.ip}:%{NUMBER:source.port}$'
      ignore_failure: true
      if: ctx.source?.ip == null && ctx.veeam?.event?.endpoint != null && ctx.veeam.event.endpoint != ''
  - grok:
      field: veeam.event.friendly_name
      tag: grok_friendly_name_related
      description: Split FriendlyName DOMAIN\user for related.user when it is not the ECS user.name source.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.friendly_user>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.friendly_name != null && ctx.veeam.event.friendly_name != ''
  - grok:
      field: veeam.event.initiator_name
      tag: grok_initiator_name_related
      description: Split InitiatorName DOMAIN\user for related.user.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.initiator_user>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.initiator_name != null && ctx.veeam.event.initiator_name != ''
  - grok:
      field: veeam.event.user_full_info.full_name
      tag: grok_user_full_info_related
      description: Split UserFullInfo full_name DOMAIN\user for related.user.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.user_full_info_user>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.user_full_info?.full_name != null
  - grok:
      field: veeam.event.initiator_full_info.full_name
      tag: grok_initiator_full_info_related
      description: Split InitiatorFullInfo full_name DOMAIN\user for related.user.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.initiator_full_info_user>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.initiator_full_info?.full_name != null
  - grok:
      field: veeam.event.supervisor_full_info.full_name
      tag: grok_supervisor_full_info_related
      description: Split SupervisorFullInfo full_name DOMAIN\user for related.user.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.supervisor_full_info_user>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.supervisor_full_info?.full_name != null
  - grok:
      field: veeam.event.account_name
      tag: grok_account_name_related
      description: Split AccountName DOMAIN\user for related.user.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.account_user>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.account_name != null && ctx.veeam.event.account_name != ''
  - grok:
      field: veeam.event.initiator_user_name
      tag: grok_initiator_user_name_related
      description: Split InitiatorUserName DOMAIN\user for related.user.
      patterns:
        - '^(?:[^\\]+\\)?(?<_temp.initiator_user_name>.+)$'
      ignore_failure: true
      if: ctx.veeam?.event?.initiator_user_name != null && ctx.veeam.event.initiator_user_name != ''
  - append:
      field: related.user
      tag: append_user_name_to_related
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      tag: append_friendly_user_to_related
      value: '{{{_temp.friendly_user}}}'
      allow_duplicates: false
      if: ctx._temp?.friendly_user != null
  - append:
      field: related.user
      tag: append_initiator_user_to_related
      value: '{{{_temp.initiator_user}}}'
      allow_duplicates: false
      if: ctx._temp?.initiator_user != null
  - append:
      field: related.user
      tag: append_user_full_info_to_related
      value: '{{{_temp.user_full_info_user}}}'
      allow_duplicates: false
      if: ctx._temp?.user_full_info_user != null
  - append:
      field: related.user
      tag: append_initiator_full_info_to_related
      value: '{{{_temp.initiator_full_info_user}}}'
      allow_duplicates: false
      if: ctx._temp?.initiator_full_info_user != null
  - append:
      field: related.user
      tag: append_supervisor_full_info_to_related
      value: '{{{_temp.supervisor_full_info_user}}}'
      allow_duplicates: false
      if: ctx._temp?.supervisor_full_info_user != null
  - append:
      field: related.user
      tag: append_account_user_to_related
      value: '{{{_temp.account_user}}}'
      allow_duplicates: false
      if: ctx._temp?.account_user != null
  - append:
      field: related.user
      tag: append_initiator_user_name_to_related
      value: '{{{_temp.initiator_user_name}}}'
      allow_duplicates: false
      if: ctx._temp?.initiator_user_name != null
  - append:
      field: related.hosts
      tag: append_host_name_to_related
      value: '{{{host.name}}}'
      allow_duplicates: false
      if: ctx.host?.name != null && ctx.host?.ip == null
  - append:
      field: related.hosts
      tag: append_observer_hostname_to_related
      value: '{{{observer.hostname}}}'
      allow_duplicates: false
      if: ctx.observer?.hostname != null
  - append:
      field: related.hosts
      tag: append_vm_name_to_related
      value: '{{{veeam.event.vm_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.vm_name != null
  - append:
      field: related.hosts
      tag: append_object_name_to_related
      value: '{{{veeam.event.object_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.object_name != null
  - append:
      field: related.hosts
      tag: append_source_host_name_to_related
      value: '{{{veeam.event.source_host_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.source_host_name != null
  - append:
      field: related.hosts
      tag: append_server_name_to_related
      value: '{{{veeam.event.server_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.server_name != null
  - append:
      field: related.hosts
      tag: append_event_host_name_to_related
      value: '{{{veeam.event.host_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.host_name != null
  - append:
      field: related.hosts
      tag: append_last_known_host_name_to_related
      value: '{{{veeam.event.last_known_host_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.last_known_host_name != null
  - append:
      field: related.hosts
      tag: append_cluster_name_to_related
      value: '{{{veeam.event.cluster_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.cluster_name != null
  - append:
      field: related.hosts
      tag: append_esx_name_to_related
      value: '{{{veeam.event.esx_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.esx_name != null
  - append:
      field: related.hosts
      tag: append_gateway_name_to_related
      value: '{{{veeam.event.gateway_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.gateway_name != null
  - append:
      field: related.hosts
      tag: append_mount_server_to_related
      value: '{{{veeam.event.mount_server}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.mount_server != null
  - append:
      field: related.hosts
      tag: append_proxy_name_to_related
      value: '{{{veeam.event.proxy_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.proxy_name != null
  - append:
      field: related.hosts
      tag: append_proxy_server_to_related
      value: '{{{veeam.event.proxy_server}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.proxy_server != null
  - append:
      field: related.hosts
      tag: append_new_primary_node_name_to_related
      value: '{{{veeam.event.new_primary_node_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.new_primary_node_name != null
  - append:
      field: related.hosts
      tag: append_new_secondary_node_name_to_related
      value: '{{{veeam.event.new_secondary_node_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.new_secondary_node_name != null
  - append:
      field: related.hosts
      tag: append_secondary_node_name_to_related
      value: '{{{veeam.event.secondary_node_name}}}'
      allow_duplicates: false
      if: ctx.veeam?.event?.secondary_node_name != null
  - convert:
      field: veeam.event.will_be_retried
      type: boolean
      tag: convert_will_be_retried
      ignore_missing: true
      if: ctx.veeam?.event?.will_be_retried != ''
      on_failure:
        - remove:
            field: veeam.event.will_be_retried
            ignore_missing: true
            tag: remove_invalid_will_be_retried
        - append:
            tag: append_convert_will_be_retried_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: veeam.event.is_retry
      type: boolean
      tag: convert_is_retry
      ignore_missing: true
      if: ctx.veeam?.event?.is_retry != ''
      on_failure:
        - remove:
            field: veeam.event.is_retry
            ignore_missing: true
            tag: remove_invalid_is_retry
        - append:
            tag: append_convert_is_retry_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: veeam.event.is_corrupted
      type: boolean
      tag: convert_is_corrupted
      ignore_missing: true
      if: ctx.veeam?.event?.is_corrupted != ''
      on_failure:
        - remove:
            field: veeam.event.is_corrupted
            ignore_missing: true
            tag: remove_invalid_is_corrupted
        - append:
            tag: append_convert_is_corrupted_error
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: veeam.event.is_full
      type: boolean
      tag: convert_is_full
      ignore_missing: true
      if: ctx.veeam?.event?.is_full != ''
      on_failure:
        - remove:
            field: veeam.event.is_full
            ignore_missing: true
            tag: remove_invalid_is_full
        - append:
