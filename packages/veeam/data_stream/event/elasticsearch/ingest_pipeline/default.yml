  - script:
      lang: painless
      tag: set_ecs_categorization
      description: Map Veeam instanceId to ECS kind/category/type using a params lookup table.
      if: ctx.event?.code != null
      params:
        groups:
          malware_alert:
            codes: ["41600", "42220"]
            kind: alert
            category: [malware]
            type: [info]
          malware_event:
            codes: ["41610", "41615", "42230", "44200", "44201", "44202"]
            kind: event
            category: [malware]
            type: [info]
          malware_settings:
            codes: ["42260", "42270", "42280", "42290"]
            kind: event
            category: [configuration]
            type: [change]
          authentication_success:
            codes: ["44000", "44003"]
            kind: event
            category: [authentication]
            type: [info]
            outcome: success
          authentication_failure:
            codes: ["40205", "40206", "40207", "44001", "44002", "44006"]
            kind: event
