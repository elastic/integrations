      source: |-
        for (def g : params.groups.values()) {
          if (g.codes.contains(ctx.event.code)) {
            ctx.event.kind = g.kind;
            if (g.containsKey('category')) {
              ctx.event.category = g.category;
            }
            if (g.containsKey('type')) {
              ctx.event.type = g.type;
            }
            if (g.containsKey('outcome')) {
              ctx.event.outcome = g.outcome;
            }
            return;
          }
        }
  - set:
      field: event.kind
      tag: set_event_kind_default
      value: event
      if: ctx.event?.kind == null
  - remove:
      field:
        - veeam.event.activity_type
        - veeam.event.instance_id
        - veeam.event.source_host_name
      ignore_missing: true
      tag: remove_unconditional_ecs_mapped_fields
      description: Drop vendor copies of fields that are always mapped to ECS.
  - remove:
      field:
        - _temp
      ignore_missing: true
      tag: remove_temp_fields
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      field: error.message
      tag: append_error_message_on_failure
      value: >-
        Processor {{{_ingest.on_failure_processor_type}}}
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{_ingest.on_failure_processor_tag}}}'
        {{{/_ingest.on_failure_processor_tag}}}
        in pipeline '{{{_ingest.pipeline}}}'
        failed with message '{{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      tag: set_event_kind_to_pipeline_error
      value: pipeline_error
  - append:
      field: tags
      tag: append_tags
      value: preserve_original_event
      allow_duplicates: false
