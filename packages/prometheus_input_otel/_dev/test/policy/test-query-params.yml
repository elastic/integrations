vars:
  targets:
    - "metrics.temporal.io:443"
  scrape_interval: "60s"
  scrape_timeout: "30s"
  metrics_path: "/v1/metrics"
  scheme: "https"
  params: |
    namespaces:
      - my-namespace.account
      - other-namespace.account
    labels:
      - temporal_activity_type
  bearer_token: "test-bearer-token"
