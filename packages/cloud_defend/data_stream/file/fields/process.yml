- name: process.args
  type: keyword
  ignore_above: 2048
  description: >-
    Array of process arguments, starting with the absolute path to the executable. May be filtered to protect sensitive information.
- name: process.command_line
  type: wildcard
  ignore_above: 8191
  description: >-
    Full command line that started the process, including the executable and all arguments. Some arguments may be filtered to protect sensitive information.
  multi_fields:
    - name: text
      type: match_only_text
- name: process.parent.args
  type: keyword
  ignore_above: 2048
  description: >-
    Array of arguments of the parent process, starting with the absolute path to the executable. May be filtered to protect sensitive information.
- name: process.parent.command_line
  type: wildcard
  ignore_above: 8191
  description: >-
    Full command line that started the parent process, including the executable and all arguments. Some arguments may be filtered to protect sensitive information.
  multi_fields:
    - name: text
      type: match_only_text
- name: process.entry_leader.args
  type: keyword
  ignore_above: 2048
  description: >-
    Array of arguments of the entry leader process, starting with the absolute path to the executable. May be filtered to protect sensitive information.
- name: process.session_leader.args
  type: keyword
  ignore_above: 2048
  description: >-
    Array of arguments of the session leader process, starting with the absolute path to the executable. May be filtered to protect sensitive information.
- name: process.group_leader.args
  type: keyword
  ignore_above: 2048
  description: >-
    Array of arguments of the process group leader, starting with the absolute path to the executable. May be filtered to protect sensitive information.
- name: process.previous.args
  type: keyword
  ignore_above: 2048
  description: >-
    Array of arguments of a previous execution of the process, starting with the absolute path to the executable. May be filtered to protect sensitive information.
