---
description: Pipeline for virtualmachine
processors:
- set:
    tag: set_ecs_version_e584b73c
    field: ecs.version
    value: '8.11.0'
- script: 
    tag: script_55b6ed69
    if: ctx.vsphere?.virtualmachine?.triggered_alarms != null
    lang: painless
    source: >
        def alerts = [];
        def warnings = [];
        for (alarm in ctx.vsphere.virtualmachine.triggered_alarms) {
            if (alarm.status == 'red') {
            alerts.add(alarm.name);
            }
            if (alarm.status == 'yellow') {
            warnings.add(alarm.name);
            }
        }
        ctx.alerts = alerts;
        ctx.warnings = warnings
- rename:
    tag: rename_alerts_6c8ec808
    field: alerts
    target_field: vsphere.virtualmachine.alert.names
    ignore_missing: true
- rename:
    tag: rename_warnings_d5fc829d
    field: warnings
    target_field: vsphere.virtualmachine.warning.names
    ignore_missing: true
- script:
    tag: script_bcc789f2
    description: "Drops null/empty values recursively."
    lang: painless
    source: |
      boolean drop(Object o) {
          if (o == null || o == "") {
          return true;
          } else if (o instanceof Map) {
          ((Map) o).values().removeIf(v -> drop(v));
          return (((Map) o).size() == 0);
          } else if (o instanceof List) {
          ((List) o).removeIf(v -> drop(v));
          return (((List) o).size() == 0);
          }
          return false;
      }
      drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_d19663ac
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_aefc3db6
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
