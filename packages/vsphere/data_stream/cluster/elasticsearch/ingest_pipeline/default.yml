---
description: Pipeline for cluster
processors:
- set:
    tag: set_ecs_version_0b1018eb
    field: ecs.version
    value: '8.11.0'
- script: 
    tag: script_fa9afa6a
    if: ctx.vsphere?.cluster?.triggered_alarms != null
    lang: painless
    source: >
        def alerts = [];
        def warnings = [];
        for (alarm in ctx.vsphere.cluster.triggered_alarms) {
            if (alarm.status == 'red') {
            alerts.add(alarm.name);
            }
            if (alarm.status == 'yellow') {
            warnings.add(alarm.name);
            }
        }
        ctx.alerts = alerts;
        ctx.warnings = warnings;
- rename:
    tag: rename_alerts_e9c62856
    field: alerts
    target_field: vsphere.cluster.alert.names
    ignore_missing: true
- rename:
    tag: rename_warnings_72bd3471
    field: warnings
    target_field: vsphere.cluster.warning.names
    ignore_missing: true
- script:
    tag: script_9f1f33d6
    description: "Drops null/empty values recursively."
    lang: painless
    source: |
      boolean drop(Object o) {
          if (o == null || o == "") {
          return true;
          } else if (o instanceof Map) {
          ((Map) o).values().removeIf(v -> drop(v));
          return (((Map) o).size() == 0);
          } else if (o instanceof List) {
          ((List) o).removeIf(v -> drop(v));
          return (((List) o).size() == 0);
          }
          return false;
      }
      drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_6a8f8f27
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_09b12aea
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
