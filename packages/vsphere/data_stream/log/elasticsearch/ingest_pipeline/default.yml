---
processors:
- set:
    tag: set_ecs_version_8e94a13c
    field: ecs.version
    value: 8.11.0
- rename:
    tag: rename_message_776b6ebe
    field: message
    target_field: event.original
    ignore_missing: true
    if: 'ctx.event?.original == null'
- remove:
    tag: remove_message_476b6011
    field: message
    ignore_missing: true
    if: 'ctx.event?.original != null'
- grok:
    tag: grok_event_original_d33b73ec
    description: Parse syslog header
    field: event.original
    patterns:
    - "^(%{ECS_SYSLOG_PRIORITY})?%{TIMESTAMP_ISO8601:_tmp.timestamp}%{SPACE}%{HOST}%{SPACE}%{NOTSPACE:process.name}
      (%{POSINT:process.pid:long}|-) - -%{SPACE}%{GREEDYDATA:message}"
    - "^(%{ECS_SYSLOG_PRIORITY})?%{TIMESTAMP_ISO8601:_tmp.timestamp}%{SPACE}%{HOST}%{SPACE}%{NOTSPACE:process.name}%{SPACE}(%{POSINT:process.pid:long}|-)(%{SPACE}%{NOTSPACE})?%{SPACE}%{SYSLOG5424SD:_tmp.structured_data}\\s+%{GREEDYDATA:message}"
    - "^(%{ECS_SYSLOG_PRIORITY})?%{TIMESTAMP_ISO8601:_tmp.timestamp}%{SPACE}%{HOST}%{SPACE}%{DATA:process.name}(?:\\[%{POSINT:process.pid:long}\\])?\\:
      %{GREEDYDATA:message}"
    - "^(%{ECS_SYSLOG_PRIORITY})?%{TIMESTAMP_ISO8601:_tmp.timestamp}%{SPACE}%{HOST}%{SPACE}%{NOTSPACE:process.name}%{SPACE}(%{POSINT:process.pid:long}|-)( -)?%{SPACE}%{GREEDYDATA:message}"
    - "^ \\(%{TIMESTAMP_ISO8601:_tmp.timestamp} %{GREEDYDATA:message}\\)%{GREEDYDATA:_tmp.drop}"
    - "^(%{ECS_SYSLOG_PRIORITY})?%{SYSLOGTIMESTAMP:_tmp.timestamp}%{SPACE}%{HOST}%{SPACE}%{DATA:process.name}(?:\\[%{POSINT:process.pid:long}\\])?\\:
      %{GREEDYDATA:message}"
    pattern_definitions:
      ECS_SYSLOG_PRIORITY: "<%{NONNEGINT:log.syslog.priority:long}>(\\d )?"
      HOST: "(?:%{IP:host.ip}|%{HOSTNAME:host.name})"
- grok:
    tag: grok_tmp_structured_data_449d738d
    description: Extract user name from RFC5424 syslog structured data
    field: _tmp.structured_data
    patterns:
    - '(^|\s)user="{0,2}%{SDPARAMVALUE:user.name}"{0,2}'
    pattern_definitions:
      SDPARAMVALUE: '[^\s\]"]+'
    ignore_failure: true
- script:
    tag: script_bb240118
    description: Translate log.syslog.priority to log.syslog.severity.code and log.syslog.facility.code
    lang: painless
    source: |
      if (ctx.log?.syslog?.priority != null) {
        def severity = new HashMap();
        severity['code'] = ctx.log.syslog.priority&0x7;
        ctx.log.syslog['severity'] = severity;
        def facility = new HashMap();
        facility['code'] = ctx.log.syslog.priority>>3;
        ctx.log.syslog['facility'] = facility;
      }
- script:
    tag: script_6999a77a
    description: Translate log.syslog.facility.code to log.syslog.facility.name
    lang: painless
    params:
      '0': Kernel
      '1': User
      '2': Mail
      '3': System
      '4': Security
      '5': Syslog
      '6': Line printer
      '7': Network news
      '8': UUCP
      '9': Clock
      '10': Security
      '11': FTPd
      '12': NTPd
      '13': Log audit
      '14': Log alert
      '15': Clock daemon
      '16': Local 0
      '17': Local 1
      '18': Local 2
      '19': Local 3
      '20': Local 4
      '21': Local 5
      '22': Local 6
      '23': Local 7
    source: |-
      if (ctx.log?.syslog?.facility?.code == null || !params.containsKey((ctx.log.syslog.facility.code).toString())) {
        return;
      }
      ctx.log.syslog.facility.name = params[(ctx.log.syslog.facility.code).toString()];
- script:
    tag: script_9c6c3680
    description: Translate log.syslog.severity.code to log.syslog.severity.name
    lang: painless
    params:
      '0': Emergency
      '1': Alert
      '2': Critical
      '3': Error
      '4': Warning
      '5': Notice
      '6': Informational
      '7': Debug
    source: |-
      if (ctx.log?.syslog?.severity?.code == null || !params.containsKey((ctx.log.syslog.severity.code).toString())) {
        return;
      }
      ctx.log.syslog.severity.name = params[(ctx.log.syslog.severity.code).toString()];
- grok:
    tag: grok_message_ecf0fd5f
    description: Parse vSphere event body, including hostd "Event <id> :" messages left after RFC 5424 structured data
    field: message
    patterns:
    - "^%{EVENT1}"
    - "^%{EVENT2}"
    - "^%{EVENT_SD}"
    - "^%{GREEDYDATA:message}"
    pattern_definitions:
      EVENT1: "%{TIMESTAMP_ISO8601}(( '%{NOTSPACE:event.action}' %{POSINT})|:) %{LOGLEVEL:log.level}
        %{GREEDYDATA:message}"
      EVENT2: Event \[%{POSINT:event.id}\] %{NOTSPACE} \[%{TIMESTAMP_ISO8601}\] \[%{JAVACLASS:log.logger}\]
        \[%{LOGLEVEL:log.level}\] %{GREEDYDATA:message}
      EVENT_SD: Event\s+%{POSINT:event.id}\s*:\s*%{GREEDYDATA:message}
- date:
    tag: date_tmp_timestamp_7d052dcf
    field: _tmp.timestamp
    target_field: "@timestamp"
    formats:
    - ISO8601
    - "yyyy-MM-dd HH:mm:ss.SSS"
    - "yyyy-MM-dd HH:mm:ss.SSSXXX"
    - "yyyy-MM-dd HH:mm:ss.SSSZ"
    - "yyyy-MM-dd HH:mm:ss"
    - "yyyy-MM-dd HH:mm:ssXXX"
    - "yyyy-MM-dd HH:mm:ssZ"
    - "MMM dd HH:mm:ss"
- pipeline:
    tag: pipeline_a636e000
    name: '{{ IngestPipeline "dns" }}'
    if: "ctx.process?.name == 'dnsmasq'"
- pipeline:
    tag: pipeline_3f9b0640
    name: '{{ IngestPipeline "login" }}'
    if: "(ctx.message != null && (ctx.message.contains('logged') || ctx.message.toLowerCase().contains('login'))) || (ctx.log?.logger != null && ['vim.event.UserLogoutSessionEvent', 'vim.event.UserLogoutSessionEvent'].contains(ctx.log.logger)) || ctx.process?.name == 'sshd'"
- pipeline:
    tag: pipeline_decd2256
    name: '{{ IngestPipeline "file" }}'
    if: "ctx.message?.contains(\"'Upload' for path\") ?: false"
- set:
    tag: set_event_kind_df8207c1
    field: event.kind
    value: event
- remove:
    tag: remove_tmp_ede426de
    field:
    - _tmp
    ignore_failure: true
- script:
    tag: script_54493b50
    lang: painless
    description: This script processor iterates over the whole document to remove
      fields with null values.
    source: "void handleMap(Map map) {\n                for (def x : map.values())
      {\n                  if (x instanceof Map) {\n                    handleMap(x);\n
      \                 } else if (x instanceof List) {\n                    handleList(x);\n
      \                 }\n                }\n                map.values().removeIf(v
      -> v == null);\n              }\n              void handleList(List list) {\n
      \               for (def x : list) {\n                  if (x instanceof Map)
      {\n                    handleMap(x);\n                  } else if (x instanceof
      List) {\n                    handleList(x);\n                  }\n                }\n
      \             }\n              handleMap(ctx);\n              "
on_failure:
  - set:
      tag: set_event_kind_19765e29
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_672de20d
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
