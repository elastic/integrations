version: '2.3'
services:
  reconfirm-vulnerability-webhook-http:
    image: docker.elastic.co/observability/stream:v0.22.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    environment:
      - STREAM_PROTOCOL=webhook
      - STREAM_WEBHOOK_PROBE=false
      - STREAM_ADDR=http://elastic-agent:9023/reconfirm
      - STREAM_WEBHOOK_HEADER=Authorization=Bearer abc123
    command: log --start-signal=SIGHUP --delay=20s /sample_logs/reconfirm-scan-ndjson.log
