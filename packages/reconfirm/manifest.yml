format_version: "3.4.2"
name: reconfirm
title: "ReConfirm"
version: "0.1.0"
description: "Collect attack-surface vulnerability scan results from ReConfirm via webhook."
type: integration
categories:
  - security
  - vulnerability_management
conditions:
  kibana:
    version: "^8.19.0 || ^9.1.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/reconfirm-logo-color.svg
    title: ReConfirm logo
    size: 332x70
    type: image/svg+xml
  - src: /img/reconfirm-logo-dark.svg
    title: ReConfirm logo dark
    size: 332x70
    type: image/svg+xml
    dark_mode: true
policy_templates:
  - name: reconfirm
    title: ReConfirm scan results
    description: Collect attack-surface vulnerability scan results from ReConfirm.
    inputs:
      - type: http_endpoint
        title: Collect ReConfirm scan results via webhook
        description: Receive scan result webhooks pushed by ReConfirm on scan completion.
owner:
  github: elastic/security-service-integrations
  type: community
