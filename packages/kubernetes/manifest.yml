format_version: 3.6.4
name: kubernetes
title: Kubernetes
version: "2.0.0"
description: Collect logs and metrics from Kubernetes clusters with Elastic Agent.
type: integration
categories:
  - observability
  - containers
  - kubernetes
conditions:
  kibana:
    version: "^9.6.0"
  # auth.aws.use_cloud_connectors (Identity Federation) requires Elastic Agent 9.6.0+.
  agent:
    version: "^9.6.0"
screenshots:
  - src: /img/metricbeat_kubernetes_overview.png
    title: Metricbeat Kubernetes Overview
    size: 1896x961
    type: image/png
icons:
  - src: /img/logo_kubernetes.svg
    title: Logo Kubernetes
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: kubelet
    title: Kubelet Metrics
    description: Collect metrics from Kubernetes Kubelet API with Elastic Agent.
    data_streams:
      - container
      - node
      - pod
      - system
      - volume
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes metrics from Kubelet API
        description: Collecting Node, Pod, Container, Volume and System metrics from Kubelet
        input_group: metrics
        vars:
          - name: condition
            title: Condition
            description: |
              Condition to filter when to collect this input. See [Dynamic Input Configuration](https://www.elastic.co/guide/en/fleet/current/dynamic-input-configuration.html) for details.
              Note: This condition value will be appended to the individual metric condition values by an "and" clause if defined.
            type: text
            multi: false
            required: false
            show_user: false
          - name: namespace
            type: text
            title: Namespace
            description: Enrich events with metadata from the resources in this namespace. Empty value means all namespaces.
            multi: false
            required: false
            show_user: false
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_overview.png
        title: Metricbeat Kubernetes Overview
        size: 1896x961
        type: image/png
  - name: kube-state-metrics
    title: Kube-state-metrics
    description: Collect container metrics from Kubernetes Kube-state-metrics with Elastic Agent.
    data_streams:
      - state_container
      - state_cronjob
      - state_daemonset
      - state_deployment
      - state_job
      - state_namespace
      - state_node
      - state_persistentvolume
      - state_persistentvolumeclaim
      - state_pod
      - state_replicaset
      - state_resourcequota
      - state_service
      - state_statefulset
      - state_storageclass
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes metrics from kube-state-metrics
        description: Collecting metrics from kube-state-metrics (container, cronjob, deployment, daemonset, namespace, node, persistentvolume, persistentvolumeclaim, pod, replicaset, resourcequota, service, statefulset, storageclass)
        input_group: metrics
        vars:
          - name: condition
            title: Condition
            description: Condition to filter when to collect this input. See [Dynamic Input Configuration](https://www.elastic.co/guide/en/fleet/current/dynamic-input-configuration.html) for details.
            type: text
            multi: false
            required: false
            show_user: false
          - name: namespace
            type: text
            title: Namespace
            description: Enrich events with metadata from the resources in this namespace. Empty value means all namespaces.
            multi: false
            required: false
            show_user: false
          - name: timeout
            type: text
            title: Timeout
            description: HTTP request timeout. Raise on large clusters if scrapes exceed 10s and you see `context deadline exceeded` errors. Valid time units are ns, us, ms, s, m, h.
            multi: false
            required: false
            show_user: false
            default: 10s
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_overview.png
        title: Metricbeat Kubernetes Overview
        size: 1896x961
        type: image/png
  - name: kube-apiserver
    title: Kube-apiserver Metrics
    description: Collect metrics from Kubernetes API Server with Elastic Agent.
    data_streams:
      - apiserver
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes metrics from Kubernetes API Server
        description: Collecting metrics from Kubernetes API Server
        input_group: metrics
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_overview.png
        title: Metricbeat Kubernetes Overview
        size: 1896x961
        type: image/png
  - name: kube-proxy
    title: Kube-proxy Metrics
    description: Collect metrics from Kubernetes Proxy server with Elastic Agent.
    data_streams:
      - proxy
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes metrics from Kubernetes Proxy
        description: Collecting metrics from Kubernetes Proxy
        input_group: metrics
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat-kubernetes-proxy.png
        title: Metricbeat Kubernetes Proxy
        size: 1854x920
        type: image/png
  - name: kube-scheduler
    title: Kube-scheduler Metrics
    description: Collect metrics from Kubernetes Scheduler with Elastic Agent.
    data_streams:
      - scheduler
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes metrics from Kubernetes Scheduler
        description: Collecting metrics from Kubernetes Scheduler
        input_group: metrics
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_scheduler.png
        title: Metricbeat Kubernetes Scheduler
        size: 1856x897
        type: image/png
  - name: kube-controller-manager
    title: Kube-controller-manager Metrics
    description: Collect metrics from Kubernetes Controller Manager with Elastic Agent.
    data_streams:
      - controllermanager
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes metrics from Kubernetes controller-manager
        description: Collecting metrics from Kubernetes controller-manager
        input_group: metrics
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat-kubernetes-controllermanager.png
        title: Metricbeat Kubernetes Controller Manager
        size: 1896x961
        type: image/png
  - name: events
    title: Kubernetes Event Metrics
    description: Collect events related metrics from Kubernetes API server with Elastic Agent.
    data_streams:
      - event
    inputs:
      - type: kubernetes/metrics
        title: Collect Kubernetes events from Kubernetes API Server
        description: Collecting events from Kubernetes API Server
        input_group: metrics
        vars:
          - name: namespace
            type: text
            title: Namespace
            description: Enrich events with metadata from the resources in this namespace. Empty value means all namespaces.
            multi: false
            required: false
            show_user: false
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_overview.png
        title: Metricbeat Kubernetes Overview
        size: 1896x961
        type: image/png
  - name: container-logs
    title: Kubernetes Container Logs
    description: Collect container related logs from Kubernetes clusters with Elastic Agent.
    data_streams:
      - container_logs
    inputs:
      - type: filestream
        title: Collect Kubernetes container logs
        description: Collect Kubernetes container logs
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_overview.png
        title: Metricbeat Kubernetes Overview
        size: 1896x961
        type: image/png
  - name: audit-logs
    title: Kubernetes Audit Logs
    description: Collect audit logs from Kubernetes nodes with Elastic Agent.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        organization: observability
        division: engineering
        team: obs-ds-hosted-services
    data_streams:
      - audit_logs
    inputs:
      - type: filestream
        title: Collect Kubernetes audit logs from local files
        description: Collect Kubernetes audit logs from local nodes with Elastic Agent.
        deployment_modes: ["default"]
      - type: aws-cloudwatch
        title: Collect Kubernetes audit logs from AWS CloudWatch
        description: Collect Kubernetes audit logs from AWS EKS with Elastic Agent.
        provider_permissions:
          - provider: aws
            description: CloudWatch Logs read access for EKS audit log collection.
            permissions:
              - name: logs:DescribeLogGroups
              - name: logs:DescribeLogStreams
              - name: logs:FilterLogEvents
              - name: logs:GetLogEvents
              - name: logs:GetLogGroupFields
      - type: azure-eventhub
        title: Collect Kubernetes audit logs from Azure Event Hub
        description: Collect Kubernetes audit logs from Azure AKS with Elastic Agent.
        deployment_modes: ["default"]
      - type: gcp-pubsub
        title: Collect Kubernetes audit logs from Google Cloud Pub/Sub
        description: Collecting Kubernetes audit logs from Google Cloud GKE with Elastic Agent.
        deployment_modes: ["default"]
    icons:
      - src: /img/logo_kubernetes.svg
        title: Logo Kubernetes
        size: 32x32
        type: image/svg+xml
    screenshots:
      - src: /img/metricbeat_kubernetes_overview.png
        title: Metricbeat Kubernetes Overview
        size: 1896x961
        type: image/png
vars:
  - name: role_arn
    type: text
    title: Role ARN
    multi: false
    required: false
    show_user: false
    description: ARN of the IAM role to assume when collecting logs.
  - name: supports_identity_federation
    type: bool
    title: Supports Identity Federation
    multi: false
    required: false
    show_user: false
  - name: access_key_id
    type: password
    title: Access Key ID
    secret: true
    multi: false
    required: false
    show_user: true
  - name: secret_access_key
    type: password
    title: Secret Access Key
    secret: true
    multi: false
    required: false
    show_user: true
  - name: session_token
    type: password
    title: Session Token
    secret: true
    multi: false
    required: false
    show_user: true
  - name: shared_credential_file
    type: text
    title: Shared Credential File
    multi: false
    required: false
    show_user: false
    description: Directory of the shared credentials file
  - name: credential_profile_name
    type: text
    title: Credential Profile Name
    multi: false
    required: false
    show_user: false
var_groups:
  - name: credential_type
    required: true
    title: AWS Setup Access
    selector_title: Preferred method
    options:
      - name: identity_federation
        title: Identity Federation
        vars: [role_arn, supports_identity_federation]
        hide_in_deployment_modes: [default]
        provider: aws
        iac_template_url: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-federated-identity-aws-9.6.0.yml
      - name: assume_role
        title: Assume Role
        vars: [role_arn]
        hide_in_deployment_modes: [agentless]
      - name: direct_access_key
        title: Direct Access Keys
        vars: [access_key_id, secret_access_key]
      - name: temporary_access_key
        title: Temporary Access Keys
        vars: [access_key_id, secret_access_key, session_token]
        hide_in_deployment_modes: [agentless]
      - name: shared_credentials
        title: Shared Credentials
        vars: [shared_credential_file, credential_profile_name]
        hide_in_deployment_modes: [agentless]
owner:
  github: elastic/obs-ds-hosted-services
  type: elastic
