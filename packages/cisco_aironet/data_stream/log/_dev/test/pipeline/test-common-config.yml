dynamic_fields:
  "@timestamp": "^[0-9]{4}(-[0-9]{2}){2}T[0-9]{2}(:[0-9]{2}){2}\\.[0-9]{3}"
fields:
  tags:
    - preserve_original_event
  _conf:
    tz_offset: "Asia/Singapore"
    # Whether Java recognises SGT depends on the Elasticsearch version's zone data
    # (8.11 does, 9.x does not), so without this entry the fixtures would resolve
    # differently per stack version. Mapping it is also what the docs tell operators
    # to do.
    tz_map:
      - tz_short: SGT
        tz_long: Asia/Singapore
