---
description: Pipeline for parsing Zoom meeting webhooks
processors:
- append:
    tag: append_event_type_890c108d
    field: event.type
    value: info
    if: ctx.event?.action != 'meeting.alert'
- append:
    tag: append_event_type_6d661f36
    field: event.type
    value: error
    if: ctx.event?.action == 'meeting.alert'
- append:
    tag: append_event_type_ec3d6fd5
    field: event.type
    value: allowed
    if: ctx.event?.action == 'meeting.registration_approved'
- append:
    tag: append_event_type_259035e3
    field: event.type
    value: creation
    if: "['meeting.registration_created', 'meeting.created'].contains(ctx.event?.action)"
- append:
    tag: append_event_type_c5a8347c
    field: event.type
    value: deletion
    if: ctx.event?.action == 'meeting.deleted'
- append:
    tag: append_event_type_9bf7eac3
    field: event.type
    value: change
    if: ctx.event?.action == 'meeting.updated'
- append:
    tag: append_event_type_50c53356
    field: event.type
    value: start
    if: "['meeting.started', 'meeting.sharing_started'].contains(ctx.event?.action)"
- append:
    tag: append_event_type_122aaa18
    field: event.type
    value: end
    if: "['meeting.ended', 'meeting.sharing_ended'].contains(ctx.event?.action)"
- rename:
    tag: rename_zoom_object_to_zoom_meeting_c5b8c906
    field: zoom.object
    target_field: zoom.meeting
    ignore_missing: true
- rename:
    tag: rename_zoom_meeting_join_url_to_url_full_2b73e5c1
    field: zoom.meeting.join_url
    target_field: url.full
    ignore_missing: true
- rename:
    tag: rename_zoom_registrant_join_url_to_url_full_9a1eb9fd
    field: zoom.registrant.join_url
    target_field: url.full
    ignore_missing: true
    if: ctx.url?.full == null

#
# Set user.* from participant, if any.
#
- remove:
    tag: remove_set_user_from_participant_82f37900
    field:
      - user
    ignore_missing: true
    if: ctx.zoom?.participant != null
- set:
    tag: set_user_id_893485bc
    field: user.id
    value: '{{{zoom.participant.id}}}'
    ignore_empty_value: true
- set:
    tag: set_user_full_name_2011664b
    field: user.full_name
    value: '{{{zoom.participant.user_name}}}'
    ignore_empty_value: true
- set:
    tag: set_user_email_86e89266
    field: user.email
    copy_from: zoom.participant.email
    ignore_empty_value: true

#
# Set user.id to be the meeting's host, unless already set.
#
- set:
    tag: set_user_id_6b70d7f4
    field: user.id
    value: '{{{zoom.meeting.host_id}}}'
    ignore_empty_value: true
    override: false

#
# Append to related.user
#
- append:
    tag: append_related_user_ae6e77fb
    field: related.user
    value: "{{{zoom.participant.id}}}"
    allow_duplicates: false
    if: ctx.zoom?.participant?.id != null
- append:
    tag: append_related_user_d89f1036
    field: related.user
    value: "{{{zoom.participant.user_id}}}"
    allow_duplicates: false
    if: ctx.zoom?.participant?.user_id != null
- append:
    tag: append_related_user_6023eff3
    field: related.user
    value: "{{{zoom.participant.participant_uuid}}}"
    allow_duplicates: false
    if: ctx.zoom?.participant?.participant_uuid != null
- append:
    tag: append_related_user_2fb8c6aa
    field: related.user
    value: "{{{zoom.meeting.host_id}}}"
    allow_duplicates: false
    if: ctx.zoom?.meeting?.host_id != null

- convert:
    tag: convert_zoom_participant_public_ip_to_source_ip_94cfcdc8
    field: zoom.participant.public_ip
    target_field: source.ip
    type: ip
    if: ctx.zoom?.participant?.public_ip != null && ctx.zoom.participant.public_ip != ''
    ignore_failure: true
- append:
    tag: append_related_ip_c47af1f5
    field: related.ip
    value: '{{{source.ip}}}'
    if: ctx.source?.ip != null
    allow_duplicates: false
- remove:
    tag: remove_zoom_participant_public_ip_9aa9fb96
    field: zoom.participant.public_ip
    ignore_missing: true
- geoip:
    tag: geoip_source_ip_to_source_geo_9a2d4d31
    field: source.ip
    target_field: source.geo
    ignore_missing: true
- geoip:
    tag: geoip_source_ip_to_source_as_58199963
    database_file: GeoLite2-ASN.mmdb
    field: source.ip
    target_field: source.as
    properties:
      - asn
      - organization_name
    ignore_missing: true
- rename:
    tag: rename_source_as_asn_to_source_as_number_168bbbaf
    field: source.as.asn
    target_field: source.as.number
    ignore_missing: true
- rename:
    tag: rename_source_as_organization_name_to_source_as_organization_name_aa06a00b
    field: source.as.organization_name
    target_field: source.as.organization.name
    ignore_missing: true

- date:
    tag: date_zoom_meeting_start_time_to_event_start_747cfedf
    field: zoom.meeting.start_time
    target_field: event.start
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'meeting.started'
    ignore_failure: true
- date:
    tag: date_zoom_participant_sharing_details_date_time_to_timestamp_8189a5fe
    field: zoom.participant.sharing_details.date_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'meeting.sharing_started'
    ignore_failure: true
- date:
    tag: date_zoom_participant_date_time_to_timestamp_17aa9337
    field: zoom.participant.date_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: >-
      [
        'meeting.participant_put_in_waiting_room',
        'meeting.participant_joined_waiting_room',
        'meeting.participant_left_waiting_room'
      ].contains(ctx.event?.action)
    ignore_failure: true
- date:
    tag: date_zoom_participant_join_time_to_timestamp_2b6658af
    field: zoom.participant.join_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'meeting.participant_joined'
    ignore_failure: true
- date:
    tag: date_zoom_participant_leave_time_to_timestamp_4c59a8c9
    field: zoom.participant.leave_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'meeting.participant_left'
    ignore_failure: true
- date:
    tag: date_zoom_time_stamp_to_timestamp_86dc9f6f
    field: zoom.time_stamp
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'meeting.updated'
    ignore_failure: true
- script:
    tag: script_8b07bbd6
    lang: painless
    if: ctx.zoom?.meeting?.duration != null
    source: >-
      ctx.event.duration = ctx.zoom.meeting.duration * 60L * 1000000000L;
- remove:
    tag: remove_zoom_meeting_start_time_bdc0ef9c
    field: zoom.meeting.start_time
    ignore_missing: true
    if: ctx.event?.action == 'meeting.started'
- remove:
    tag: remove_zoom_meeting_duration_a8b8a95a
    field: zoom.meeting.duration
    ignore_missing: true
    if: ctx.event?.duration != null
- remove:
    tag: remove_zoom_participant_sharing_details_date_time_028cb1a7
    field: zoom.participant.sharing_details.date_time
    ignore_missing: true
    if: ctx.event?.action == 'meeting.sharing_started'
- remove:
    tag: remove_zoom_participant_date_time_60a4ec8a
    field: zoom.participant.date_time
    ignore_missing: true
    if: >-
      [
        'meeting.participant_put_in_waiting_room',
        'meeting.participant_joined_waiting_room',
        'meeting.participant_left_waiting_room'
      ].contains(ctx.event?.action)
- remove:
    tag: remove_zoom_participant_join_time_b5173bd1
    field: zoom.participant.join_time
    ignore_missing: true
    if: ctx.event?.action == 'meeting.participant_joined'
- remove:
    tag: remove_zoom_participant_leave_time_d2e52dcd
    field: zoom.participant.leave_time
    ignore_missing: true
    if: ctx.event?.action == 'meeting.participant_left'
- remove:
    tag: remove_zoom_time_stamp_44050056
    field: zoom.time_stamp
    ignore_missing: true
    if: ctx.event?.action == 'meeting.updated'
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
