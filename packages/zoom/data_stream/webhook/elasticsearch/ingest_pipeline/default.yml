---
description: Initial pipeline for parsing Zoom webhooks
processors:
  - set:
      tag: set_observer_vendor_95db763f
      field: observer.vendor
      value: Zoom
  - set:
      tag: set_observer_product_996b13ee
      field: observer.product
      value: Webhook
  - set:
      tag: set_ecs_version_6b2cef5e
      field: ecs.version
      value: '8.11.0'
  - script:
      tag: script_drops_null_empty_values_recursively_4f3faf86
      description: Drops null/empty values recursively
      lang: painless
      source: |
        boolean drop(Object o) {
            if (o == null || o == "") {
            return true;
            } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
            } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
            }
            return false;
        }
        drop(ctx);
  - append:
      tag: append_event_kind_139c1f32
      field: event.kind
      value: event
  - rename:
      tag: rename_zoom_event_to_event_action_79630b46
      field: zoom.event
      target_field: event.action
      ignore_missing: true
  - rename:
      tag: rename_zoom_payload_to__temp__payload_7791d18f
      field: zoom.payload
      target_field: _temp_.payload
  - remove:
      tag: remove_zoom_95e08ac9
      field: zoom
  - rename:
      tag: rename__temp__payload_to_zoom_a31f1bb7
      field: _temp_.payload
      target_field: zoom
  - rename:
      tag: rename_zoom_old_object_to_zoom_old_values_0c87cde1
      field: zoom.old_object
      target_field: zoom.old_values
      ignore_missing: true
  - rename:
      tag: rename_zoom_object_participant_to_zoom_participant_ffaeb9ec
      field: zoom.object.participant
      target_field: zoom.participant
      ignore_missing: true
  - rename:
      tag: rename_zoom_object_settings_to_zoom_settings_cf6b8862
      field: zoom.object.settings
      target_field: zoom.settings
      ignore_missing: true
  - rename:
      tag: rename_zoom_object_registrant_to_zoom_registrant_2d11e8fe
      field: zoom.object.registrant
      target_field: zoom.registrant
      ignore_missing: true
  - append:
      tag: append_related_user_27854f76
      field: related.user
      value: "{{{zoom.operator_id}}}"
      if: ctx.zoom?.operator_id != null
  # Set user.id from operator data (user who performs an action).
  - set:
      tag: set_user_id_cb49bbe4
      field: user.id
      value: "{{{zoom.operator_id}}}"
      if: ctx.zoom?.operator_id != null
  # Set user.name from operator data only when user.id also set above.
  - set:
      tag: set_user_email_43d047b6
      field: user.email
      value: "{{{zoom.operator}}}"
      ignore_empty_value: true
      if: ctx.zoom?.operator_id != null
  # Removing some fields that have complex nested arrays that might impact performance
  - remove:
      tag: remove_removing_some_fields_have_complex_4e372081
      field:
        - message
        - _temp_
        - zoom.object.occurrences
        - zoom.old_values.occurrences
        - zoom.object.recurrence
        - zoom.old_values.recurrence
        - zoom.object.managed_domains
        - zoom.old_values.managed_domains
        - zoom.registrant.custom_questions
        - zoom.old_values.registrant.custom_questions
        - zoom.object.call_logs
        - zoom.old_values.call_logs
        - zoom.object.recording_files
        - zoom.old_values.recording_files
        - zoom.object.call_logs
      ignore_missing: true
  - pipeline:
      tag: pipeline_meeting_a473452c
      name: '{{ IngestPipeline "meeting" }}'
      if: ctx.event?.action?.startsWith('meeting') == true
  - pipeline:
      tag: pipeline_account_643c9d9d
      name: '{{ IngestPipeline "account" }}'
      if: ctx.event?.action?.startsWith('account') == true
  - pipeline:
      tag: pipeline_chat_message_d6a8cab0
      name: '{{ IngestPipeline "chat_message" }}'
      if: ctx.event?.action?.startsWith('chat_message') == true
  - pipeline:
      tag: pipeline_chat_channel_f7134d3b
      name: '{{ IngestPipeline "chat_channel" }}'
      if: ctx.event?.action?.startsWith('chat_channel') == true
  - pipeline:
      tag: pipeline_phone_f9f2e66b
      name: '{{ IngestPipeline "phone" }}'
      if: ctx.event?.action?.startsWith('phone') == true
  - pipeline:
      tag: pipeline_recording_c0dfca92
      name: '{{ IngestPipeline "recording" }}'
      if: ctx.event?.action?.startsWith('recording') == true
  - pipeline:
      tag: pipeline_user_edf84f78
      name: '{{ IngestPipeline "user" }}'
      if: ctx.event?.action?.startsWith('user') == true
  - pipeline:
      tag: pipeline_webinar_097d2c96
      name: '{{ IngestPipeline "webinar" }}'
      if: ctx.event?.action?.startsWith('webinar') == true
  - pipeline:
      tag: pipeline_zoomroom_d1b06893
      name: '{{ IngestPipeline "zoomroom" }}'
      if: ctx.event?.action?.startsWith('zoomroom') == true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
