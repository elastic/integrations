---
description: Pipeline for parsing Zoom zoom_room webhooks
processors:
- append:
    tag: append_event_type_7cf8b0c6
    field: event.type
    value: info
    if: "['zoomroom.checked_in', 'zoomroom.checked_out'].contains(ctx.event?.action)"
- append:
    tag: append_event_type_24eb2ba7
    field: event.type
    value: start
    if: ctx.event?.action == 'zoomroom.checked_in'
- append:
    tag: append_event_type_39cf22ba
    field: event.type
    value: end
    if: ctx.event?.action == 'zoomroom.checked_out'
- rename:
    tag: rename_zoom_object_to_zoom_zoomroom_0dbce5a3
    field: zoom.object
    target_field: zoom.zoomroom
    ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
