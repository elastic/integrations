---
description: Pipeline for parsing Zoom webinar webhooks
processors:
- append:
    tag: append_event_type_d7e4d0d1
    field: event.type
    value: info
    if: ctx.event?.action != 'webinar.alert'
- append:
    tag: append_event_type_b55574a1
    field: event.type
    value: error
    if: ctx.event?.action == 'webinar.alert'
- append:
    tag: append_event_type_79613ca2
    field: event.type
    value: creation
    if: "['webinar.created', 'webinar.registration_created'].contains(ctx.event?.action)"
- append:
    tag: append_event_type_dea6eb7a
    field: event.type
    value: deletion
    if: ctx.event?.action == 'webinar.deleted'
- append:
    tag: append_event_type_b7a6df48
    field: event.type
    value: allowed
    if: ctx.event?.action == 'webinar.registration_approved'
- append:
    tag: append_event_type_24805bed
    field: event.type
    value: denied
    if: ctx.event?.action == 'webinar.registration_denied'
- append:
    tag: append_event_type_64976023
    field: event.type
    value: change
    if: >-
      [
        'webinar.updated',
        'webinar.registration_approved',
        'webinar.registration_denied',
        'webinar.registration_cancelled'
      ].contains(ctx.event?.action)
- append:
    tag: append_event_type_812ae362
    field: event.type
    value: start
    if: "['webinar.started', 'webinar.sharing_started'].contains(ctx.event?.action)"
- append:
    tag: append_event_type_4cb37ecf
    field: event.type
    value: end
    if: "['webinar.ended', 'webinar.sharing_ended'].contains(ctx.event?.action)"
- rename:
    tag: rename_zoom_object_to_zoom_webinar_aa84e5bf
    field: zoom.object
    target_field: zoom.webinar
    ignore_missing: true
- date:
    tag: date_zoom_time_stamp_to_timestamp_9fdc1c83
    field: zoom.time_stamp
    target_field: '@timestamp'
    formats:
    - UNIX_MS
    if: ctx.event?.action == 'webinar.updated'
    ignore_failure: true
- date:
    tag: date_zoom_webinar_start_time_to_timestamp_a37e208a
    field: zoom.webinar.start_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'webinar.started'
    ignore_failure: true
- date:
    tag: date_zoom_participant_join_time_to_timestamp_f4c8b411
    field: zoom.participant.join_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'webinar.participant_joined'
    ignore_failure: true
- date:
    tag: date_zoom_participant_leave_time_to_timestamp_52b5013e
    field: zoom.participant.leave_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.event?.action == 'webinar.participant_left'
    ignore_failure: true

#
# set user.* from participant
#
- set:
    tag: set_user_id_a5e179ad
    field: user.id
    value: '{{{zoom.participant.id}}}'
    ignore_empty_value: true
    if: ctx.zoom?.participant != null
- set:
    tag: set_user_full_name_2f06dec5
    field: user.full_name
    value: '{{{zoom.participant.user_name}}}'
    ignore_empty_value: true
    if: ctx.zoom?.participant != null
- set:
    tag: set_user_email_e19c22c6
    field: user.email
    copy_from: zoom.participant.email
    ignore_empty_value: true

#
# set user.* from registrant
#
- set:
    tag: set_user_id_fd954f8b
    field: user.id
    value: '{{{zoom.registrant.id}}}'
    ignore_empty_value: true
    if: ctx.zoom?.registrant != null
- set:
    tag: set_user_email_ffa55563
    field: user.email
    value: '{{{zoom.registrant.email}}}'
    ignore_empty_value: true
    if: ctx.zoom?.registrant != null
- set:
    tag: set_user_full_name_938640ae
    field: user.full_name
    value: '{{{zoom.registrant.first_name}}} {{{zoom.registrant.last_name}}}'
    ignore_empty_value: true
    if: ctx.zoom?.registrant != null

#
# set user.* from operator
#
- set:
    tag: set_user_id_78f1d99e
    field: user.id
    value: '{{{zoom.operator_id}}}'
    ignore_empty_value: true
    if: ctx.zoom?.registrant == null && ctx.zoom?.participant == null
- set:
    tag: set_user_email_6915eaad
    field: user.email
    value: '{{{zoom.operator}}}'
    ignore_empty_value: true
    if: ctx.zoom?.registrant == null && ctx.zoom?.participant == null

#
# append to related.user
#
- append:
    tag: append_related_user_3d1d6eac
    field: related.user
    value: "{{{zoom.webinar.host_id}}}"
    allow_duplicates: false
    if: ctx.zoom?.webinar?.host_id != null
- append:
    tag: append_related_user_bd2cc438
    field: related.user
    value: "{{{zoom.registrant.id}}}"
    allow_duplicates: false
    if: ctx.zoom?.registrant?.id != null
- append:
    tag: append_related_user_2068ad2e
    field: related.user
    value: "{{{zoom.participant.id}}}"
    allow_duplicates: false
    if: ctx.zoom?.participant?.id != null
- append:
    tag: append_related_user_abb29256
    field: related.user
    value: "{{{zoom.participant.user_id}}}"
    allow_duplicates: false
    if: ctx.zoom?.participant?.user_id != null
- append:
    tag: append_related_user_59473576
    field: related.user
    value: "{{{zoom.participant.participant_uuid}}}"
    allow_duplicates: false
    if: ctx.zoom?.participant?.participant_uuid != null

- convert:
    tag: convert_zoom_participant_public_ip_to_source_ip_18e1d5b3
    field: zoom.participant.public_ip
    target_field: source.ip
    type: ip
    if: ctx.zoom?.participant?.public_ip != null && ctx.zoom.participant.public_ip != ''
    ignore_failure: true
- append:
    tag: append_related_ip_8121c591
    field: related.ip
    value: '{{{source.ip}}}'
    if: ctx.source?.ip != null
    allow_duplicates: false
- remove:
    tag: remove_zoom_participant_public_ip_8c802041
    field: zoom.participant.public_ip
    ignore_missing: true
- geoip:
    tag: geoip_source_ip_to_source_geo_da2e41b2
    field: source.ip
    target_field: source.geo
    ignore_missing: true
- geoip:
    tag: geoip_source_ip_to_source_as_28d69883
    database_file: GeoLite2-ASN.mmdb
    field: source.ip
    target_field: source.as
    properties:
      - asn
      - organization_name
    ignore_missing: true
- rename:
    tag: rename_source_as_asn_to_source_as_number_a917047d
    field: source.as.asn
    target_field: source.as.number
    ignore_missing: true
- rename:
    tag: rename_source_as_organization_name_to_source_as_organization_name_f1362d0b
    field: source.as.organization_name
    target_field: source.as.organization.name
    ignore_missing: true

on_failure:
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
