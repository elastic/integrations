---
description: Pipeline for parsing Zoom chat_message webhooks
processors:
- append:
    tag: append_event_type_5eab37e6
    field: event.type
    value: info
- append:
    tag: append_event_type_f3baa985
    field: event.type
    value: creation
    if: ctx.event?.action == 'chat_message.sent'
- append:
    tag: append_event_type_0ca78c1a
    field: event.type
    value: deletion
    if: ctx.event?.action == 'chat_message.deleted'
- append:
    tag: append_event_type_472f438d
    field: event.type
    value: change
    if: ctx.event?.action == 'chat_message.updated'
- rename:
    tag: rename_zoom_object_to_zoom_chat_message_116c7a57
    field: zoom.object
    target_field: zoom.chat_message
    ignore_missing: true
- append:
    tag: append_related_user_80b906a0
    field: related.user
    value: "{{{zoom.chat_message.contact_id}}}"
    if: ctx.zoom?.chat_message?.contact_id != null
- date:
    tag: date_zoom_chat_message_timestamp_to_timestamp_077ac01f
    field: zoom.chat_message.timestamp
    target_field: '@timestamp'
    formats:
    - UNIX_MS
    if: ctx.zoom?.chat_message?.timestamp != null
    ignore_failure: true
- remove:
    tag: remove_zoom_chat_message_date_time_ed36c0b7
    field: zoom.chat_message.date_time
    ignore_missing: true
    if: ctx.zoom?.chat_message?.timestamp != null
- date:
    tag: date_zoom_chat_message_date_time_to_timestamp_011ba1f9
    field: zoom.chat_message.date_time
    target_field: '@timestamp'
    formats:
    - ISO_INSTANT
    if: ctx.zoom?.chat_message?.timestamp == null
    ignore_failure: true
- remove:
    tag: remove_zoom_chat_message_timestamp_bf8b3843
    field: zoom.chat_message.timestamp
    ignore_missing: true
- remove:
    tag: remove_zoom_chat_message_message_b8d080d7
    if: ctx.zoom?.chat_message?.message == null
    field: zoom.chat_message.message
    ignore_missing: true
on_failure:
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_206bb8ac
      field: error.message
      value: '{{{ _ingest.on_failure_message }}}'
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
