---
description: Parse Zoom operation logs report events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version_6b2cef5e
      value: '8.11.0'
  - terminate:
      tag: data_collection_error_4bdbb3d0
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original_176375fd
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the original message.
        The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message_9ecc8509
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: zoom.operation
      tag: parse_json_from_event_original_62603536
      if: ctx.event?.original != null
  - fingerprint:
      tag: fingerprint_event_original_5df148ab
      fields:
        - event.original
      target_field: _id
      ignore_missing: true

  # zoom.operation.*
  - date:
      field: zoom.operation.time
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: date_operation_time_8aeccde5
      if: ctx.zoom?.operation?.time != null && ctx.zoom.operation.time != ''
      on_failure:
        - remove:
            field: zoom.operation.time
            ignore_missing: true
            tag: remove_operation_time_on_date_failure_b6c7ee90
        - append:
            field: error.message
            value: 'Failed to parse zoom.operation.time: {{{ _ingest.on_failure_message }}}'
            tag: append_date_operation_time_failure_b77f35b0

  # event.*
  - set:
      field: event.kind
      tag: set_event_kind_d452ef2c
      value: event
  - set:
      field: event.action
      tag: set_event_action_from_action_6ed7648e
      copy_from: zoom.operation.action
      ignore_empty_value: true
  - append:
      field: event.category
      tag: append_event_category_configuration_5bc3dda0
      value: configuration
  - append:
      field: event.category
      tag: append_event_category_iam_1d407e96
      value: iam
      if: >-
        ctx.zoom?.operation?.category_type != null && (
          ctx.zoom.operation.category_type.toLowerCase().contains('user') ||
          ctx.zoom.operation.category_type.toLowerCase().contains('role')
        )
  - append:
      field: event.type
      tag: append_event_type_change_b7534197
      value: change
  - append:
      field: event.type
      tag: append_event_type_creation_5fba6d76
      value: creation
      if: >-
        ctx.event?.action != null && (
          ctx.event.action.toLowerCase().contains('create') ||
          ctx.event.action.toLowerCase().contains('add')
        )
  - append:
      field: event.type
      tag: append_event_type_deletion_4ed4af1d
      value: deletion
      if: >-
        ctx.event?.action != null && (
          ctx.event.action.toLowerCase().contains('delete') ||
          ctx.event.action.toLowerCase().contains('remove')
        )
  - append:
      field: event.type
      tag: append_event_type_info_e7b7f299
      value: info
      if: ctx.event?.type != null && !ctx.event.type.contains('creation') && !ctx.event.type.contains('deletion')

  # user.*
  - rename:
      field: zoom.operation.operator
      target_field: user.name
      ignore_missing: true
      tag: rename_operation_operator_to_user_name_4fe88d74
  - set:
      field: user.email
      tag: set_user_email_from_name_59b2b836
      copy_from: user.name
      ignore_empty_value: true
      if: ctx.user?.name != null && ctx.user.name.contains('@')

  # related.*
  - append:
      field: related.user
      tag: append_user_name_to_related_user_325195a6
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null

  # cleanup
  - remove:
      field:
        - zoom.operation.time
      ignore_missing: true
      tag: remove_fields_d8921e8b
  - script:
      tag: script_to_drop_null_values_982a9b9f
      lang: painless
      description: This script processor iterates over the whole document to remove fields with null values.
      source: |-
        void handleMap(Map map) {
          map.values().removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || v == 'N/A' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        void handleList(List list) {
          list.removeIf(v -> {
            if (v instanceof Map) {
              handleMap(v);
            } else if (v instanceof List) {
              handleList(v);
            }
            return v == null || v == '' || (v instanceof Map && v.size() == 0) || (v instanceof List && v.size() == 0)
          });
        }
        handleMap(ctx);
  - set:
      field: event.kind
      tag: set_pipeline_error_into_event_kind_4fd8ffa8
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_tags_b6c08950
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
on_failure:
  - append:
      tag: append_error_message_417e65c9
      field: error.message
      value: |-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
