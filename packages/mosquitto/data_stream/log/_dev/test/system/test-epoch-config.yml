wait_for_data_timeout: 1m
service: mosquitto-log-filestream
input: filestream
data_stream:
  vars:
    paths:
      - "{{SERVICE_LOGS_DIR}}/mosquitto-epoch.log"
    preserve_original_event: true
    # A custom processor checks that user processors and the built-in
    # add_locale render as one valid YAML list.
    processors: |-
      - drop_fields:
          fields: ["mosquitto_test_nonexistent_field"]
          ignore_missing: true
