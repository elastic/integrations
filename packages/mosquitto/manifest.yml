format_version: "3.4.2"
name: mosquitto
title: Mosquitto
version: "0.1.0"
source:
  license: "Elastic-2.0"
description: Collect logs from Eclipse Mosquitto MQTT brokers with Elastic Agent.
type: integration
categories:
  - message_queue
  - observability
conditions:
  kibana:
    version: "^8.19.0 || ^9.1.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/mosquitto-logo.svg
    title: Mosquitto logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: mosquitto
    title: Mosquitto logs
    description: Collect logs from Eclipse Mosquitto MQTT brokers
    inputs:
      - type: filestream
        title: Collect Mosquitto logs from files
        description: Collecting Mosquitto broker logs using the filestream input
owner:
  github: elastic/integrations-triaging
  type: community
