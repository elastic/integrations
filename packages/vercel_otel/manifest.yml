format_version: "3.6.2"
name: vercel_otel
title: "Vercel OpenTelemetry Assets"
version: 0.1.0
description: >-
  Visualizing Vercel Speed Insights and Web Analytics metrics collected via
  OpenTelemetry. Covers Core Web Vitals (LCP, INP, CLS, TTFB) and related
  performance insights.
type: content
categories:
  - observability
  - monitoring
  - cloud
  - web
  - opentelemetry
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: basic
icons:
  - src: /img/vercel-logo.svg
    title: Vercel logo
    size: 76x65
    type: image/svg+xml
discovery:
  datasets:
    - name: vercel.speedinsights.v1.otel
    - name: vercel.analytics.v2.otel
    - name: vercel.logs.otel
    - name: vercel.auditlog.v1.otel
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
