format_version: "3.6.2"
name: vercel_otel
title: "Vercel OpenTelemetry Assets"
version: 0.2.0
description: >-
  Visualize Vercel logs, audit logs, Web Analytics, and Speed Insights
  collected via OpenTelemetry. Covers server-side health, team governance,
  traffic and engagement, and Core Web Vitals (LCP, INP, CLS, TTFB).
type: content
categories:
  - observability
  - monitoring
  - cloud
  - web
  - opentelemetry
conditions:
  kibana:
    version: "^9.4.0"
  elastic:
    subscription: basic
screenshots:
  - src: /img/vercel_otel-logs.png
    title: Vercel OTel Logs dashboard
    size: 3600x6474
    type: image/png
  - src: /img/vercel_otel-audit-logs.png
    title: Vercel OTel Audit Logs dashboard
    size: 3600x5802
    type: image/png
  - src: /img/vercel_otel-web-analytics.png
    title: Vercel OTel Web Analytics dashboard
    size: 3600x6266
    type: image/png
  - src: /img/vercel_otel-speed-insights.png
    title: Vercel OTel Speed Insights dashboard
    size: 3440x8000
    type: image/png
icons:
  - src: /img/vercel-logo.svg
    title: Vercel OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
discovery:
  datasets:
    - name: vercel.speedinsights.v1.otel
    - name: vercel.analytics.v2.otel
    - name: vercel.logs.otel
    - name: vercel.auditlog.v1.otel
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
