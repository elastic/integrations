service: openshell
vars: ~
data_stream:
  vars:
    paths:
      - "{{SERVICE_LOGS_DIR}}/openshell-ocsf.test.jsonl"
    preserve_original_event: true
assert:
  hit_count: 1
  fields_present:
    - container.id
    - destination.domain
    - destination.ip
    - destination.port
    - event.action
    - event.category
    - event.code
    - event.kind
    - event.outcome
    - event.type
    - network.direction
    - network.transport
    - observer.product
    - observer.vendor
    - openshell.ocsf.class_uid
    - process.executable
    - process.name
    - process.parent.executable
    - rule.category
    - rule.name
