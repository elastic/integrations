- name: input.type
  type: keyword
  description: Type of filebeat input.
- name: log.offset
  type: long
  description: Log offset.
- name: log.file.path
  type: keyword
  description: Path of the log file the record was read from.
- name: log.file.device_id
  type: keyword
  description: Device ID of the log file the record was read from.
- name: log.file.inode
  type: keyword
  description: Inode of the log file the record was read from.
- name: log.file.fingerprint
  type: keyword
  description: SHA-256 fingerprint identity of the file when fingerprinting is enabled.
