format_version: '3.3.2'
name: openshell
title: 'NVIDIA OpenShell'
version: 0.1.0
description: 'Collect OCSF audit events from NVIDIA OpenShell sandboxes with Elastic Agent.'
type: integration
categories:
  - security
  - containers
  - network_security
conditions:
  kibana:
    version: '^8.19.0 || ^9.1.0'
  elastic:
    subscription: 'basic'
icons:
  - src: /img/openshell-logo.svg
    title: OpenShell logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: openshell
    title: NVIDIA OpenShell events
    description: Collect OCSF JSON events written by the OpenShell sandbox supervisor.
    inputs:
      - type: logfile
        title: Collect OpenShell OCSF events from log files
        description: Read the OCSF JSONL files written by the OpenShell sandbox supervisor.
owner:
  github: elastic/security-service-integrations
  type: elastic
