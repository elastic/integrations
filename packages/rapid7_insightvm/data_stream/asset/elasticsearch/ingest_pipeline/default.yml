---
description: Pipeline for processing Rapid7 InsightVM Asset logs.
processors:
  - set:
      tag: set_ecs_version_0f7334bb
      field: ecs.version
      value: '8.11.0'
  - set:
      tag: set_event_kind_871e09cf
      field: event.kind
      value: state
  - set:
      tag: set_event_category_ba9b1d84
      field: event.category
      value: [host]
  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: [info]
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      tag: 'json_decoding'
      target_field: json
      on_failure:
        - append:
            tag: append_error_message_8075efaa
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - drop:
      tag: drop_eb865603
      if: ctx.json?.data != null && ctx.json.data.isEmpty()
  - convert:
      field: json.assessed_for_policies
      tag: 'convert_assessed_for_policies_to_boolean'
      target_field: rapid7.insightvm.asset.assessed_for_policies
      if: ctx.json?.assessed_for_policies != ''
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_f701e2fd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: json.assessed_for_vulnerabilities
      tag: 'convert_assessed_for_vulnerabilities_to_boolean'
      target_field: rapid7.insightvm.asset.assessed_for_vulnerabilities
      if: ctx.json?.assessed_for_vulnerabilities != ''
      type: boolean
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_76f140e9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_json_credential_assessments_cd0df090
      field: json.credential_assessments
      if: ctx.json?.credential_assessments instanceof List
      processor:
        convert:
          field: _ingest._value.port
          tag: 'convert_credential_assessments_port_to_long'
          type: long
          ignore_missing: true
          on_failure:
            - remove:
                field: _ingest._value.port
                ignore_missing: true
            - append:
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - rename:
      tag: rename_json_credential_assessments_to_rapid7_insightvm_asset_credential_assessments_e258c4c4
