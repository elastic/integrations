---
description: Pipeline for processing tenable OT security cloud assets
processors:

  - rename:
      tag: rename_message_to_tenable_ot_security_assets_5423af97
      field: message
      target_field: tenable_ot_security.assets

  - fingerprint:
      fields:
        - tenable_ot_security.assets.id
        - tenable_ot_security.assets.firstSeen
        - tenable_ot_security.assets.lastSeen
        - tenable_ot_security.assets.lastHit
        - tenable_ot_security.assets.lastSnapshot
        - tenable_ot_security.assets.lastUpdate
        - tenable_ot_security.assets.runStatusTime
      tag: fingerprinting
      target_field: "_id"
      ignore_missing: true
      on_failure:
        - append:
            tag: append_error_message_3e3aded1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'


  ##################### Scripts for processing input #####################
  - script:
      tag: script_924392cb
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).size() == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);

  - script:
      description: Convert Additional Info keys to snake case.
      tag: additional-info-keys-to-snake-case
      lang: painless
      source: |
        Map keysToSnakeCase(Map m) {
          def regex = /_?([a-z])([A-Z]+)/;
          def snakeCaseMap = [:];
          for (entry in m.entrySet()) {
            def k = entry.getKey();
            def v = entry.getValue();
            if (v instanceof Map) {
              v = keysToSnakeCase(v);
            } else if (v instanceof List) {
              for (int i = 0; i < v.size(); i++) {
                def item = v.get(i);
                if (item instanceof Map) {
                  v.set(i, keysToSnakeCase(item));
                }
              }
            }
            k = regex.matcher(k).replaceAll('$1_$2').toLowerCase();
            snakeCaseMap.put(k, v);
          }
          return snakeCaseMap;
        }
        if (ctx.tenable_ot_security.assets != null) {
          ctx.tenable_ot_security.assets = keysToSnakeCase(ctx.tenable_ot_security.assets);
        }

  - script:
      tag: script_544eee51
      description: Recursively normalize every occurrence of 'nodes'.
      lang: painless
      source: |
        def normalize(def obj) {
          if (obj instanceof Map) {
                Map newObj = new HashMap();
                for (entry in obj.entrySet()) {
                    def key = entry.getKey();
                    def value = entry.getValue();

                    // If the value is a map with a single key "nodes", replace it with its contents
                    if (value instanceof Map && value.containsKey("nodes")) {
                        value = value.get("nodes");
                    }

                    // Recursively process if value is a map or list
                    newObj.put(key, normalize(value));
                }
                return newObj;
            } else if (obj instanceof List) {
                List newList = new ArrayList();
                for (item in obj) {
                    newList.add(normalize(item));
                }
                return newList;
            } else {
                return obj;
            }
           }
        // Apply normalization to every occurrence of "nodes" in assets.
        if (ctx.containsKey("tenable_ot_security") && ctx.tenable_ot_security.containsKey("assets")) {
          ctx.tenable_ot_security.assets = normalize(ctx.tenable_ot_security.assets);
        }

  - convert:
      tag: convert_total_risk_to_double
      field: tenable_ot_security.assets.risk.total_risk
      type: double
      if: ctx.tenable_ot_security?.assets?.risk?.total_risk != null
      on_failure:
        - append:
            tag: append_error_message_f582a807
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
        - remove:
            tag: remove_tenable_ot_security_assets_risk_total_risk_76a96735
            field: tenable_ot_security.assets.risk.total_risk


  ##################### ECS Fields #####################
  - set:
      tag: set_event_kind_de80643c
      field: event.kind
      value: event

  - set:
      tag: set_ecs_version_f5923549
      field: ecs.version
      value: "8.17.0"

  - append:
      tag: append_event_category_576de059
      field: event.category
      value: iam

  - set:
      tag: set_event_module_3a52d21c
      field: event.module
      value: tenable_ot_security

  - set:
      tag: set_event_type_ec95f7f2
      field: event.type
      value: ["info"]

  - set:
      tag: set_event_dataset_739c1a23
      field: event.dataset
      value: tenable_ot_security.assets

  - set:
      tag: set_event_id_a1a9001c
      field: event.id
      copy_from: tenable_ot_security.assets.id
      ignore_empty_value: true

  - foreach:
      tag: foreach_tenable_ot_security_assets_direct_ips_1d27e58b
      field: tenable_ot_security.assets.direct_ips
      if: ctx.tenable_ot_security.assets.direct_ips instanceof List && ctx.tenable_ot_security.assets.direct_ips.length > 0
      processor:
        append:
          tag: append_related_hosts
          field: related.hosts
          value: "{{{_ingest._value}}}"
          allow_duplicates: false

  - foreach:
      tag: foreach_tenable_ot_security_assets_direct_macs_d7b55529
      field: tenable_ot_security.assets.direct_macs
      if: ctx.tenable_ot_security.assets.direct_macs instanceof List && ctx.tenable_ot_security.assets.direct_macs.length > 0
      processor:
        append:
          tag: append_related_hosts_65dccd4e
          field: related.hosts
          value: "{{{_ingest._value}}}"
          allow_duplicates: false


  #################### Override host.ip ####################
  - foreach:
      tag: foreach_tenable_ot_security_assets_direct_ips_5e2e51e6
      field: tenable_ot_security.assets.direct_ips
      if: ctx.tenable_ot_security.assets.direct_ips instanceof List && ctx.tenable_ot_security.assets.direct_ips.length > 0
      processor:
        convert:
          tag: convert_ingest_value
          field: _ingest._value
          type: ip
          ignore_missing: true

  - foreach:
      tag: foreach_tenable_ot_security_assets_direct_ips_3d84db38
      field: tenable_ot_security.assets.direct_ips
      if: ctx.tenable_ot_security.assets.direct_ips instanceof List && ctx.tenable_ot_security.assets.direct_ips.length > 0
      processor:
        append:
          tag: append_host_ip
          field: host.ip
          value: "{{{_ingest._value}}}"
          allow_duplicates: false

  - geoip:
      tag: geoip_host_ip_to_host_geo_b6f95445
      field: host.ip
      target_field: host.geo
      ignore_missing: true
      ignore_failure: true

#################### Error Log fields ####################

on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: '{{{_ingest.on_failure_message}}}'

  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
