title: "EfficientIP Logging"
type: logs
streams:
  - input: udp
    title: "logs via UDP"
    description: |-
      Collect EfficientIP logs via UDP
    template_path: udp.yml.hbs
    vars:
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - efficientip-log
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: tz_offset
        type: text
        title: Timezone Offset
        multi: false
        required: true
        show_user: true
        default: local
        description: >-
          Timestamps without a timezone are interpreted as UTC by default. If the log source uses a different timezone, set this field to that timezone, for example Europe/Amsterdam or -05:00. This setting applies when parsing timestamps that don’t include their own timezone.
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
      - name: max_message_size
        type: text
        title: Max Message Size
        description: Maximum size of the message received over UDP (e.g. 10KiB).
        multi: false
        required: false
        show_user: false
