# newer versions go on top
- version: "0.2.0"
  changes:
    - description: "Enable Agentless deployment mode as default (beta), add dual data input support across native Chargeback Serverless streams and legacy ess_billing / monitoring-indices* streams without double-counting, add dynamic configuration lookup (serverless_chargeback_conf_lookup) and prepaid credit commitment tracking (serverless_billing_credits_lookup), add deployment_group (chargeback_group:*) attribution, and add operational alerting rule templates for new group detection and transform health monitoring."
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22731
- version: "0.1.0"
  changes:
    - description: "Initial release of the Chargeback Serverless integration with daily Elastic Cloud Billing and Serverless project usage collection via Elastic Agent CEL streams, SKU classification into workload allocation drivers (indexing, query, storage, AI, Synthetics, and unallocated), seven continuous lookup transforms, five ES|QL LOOKUP JOIN Kibana dashboards, four FinOps alerting rule templates, and 365-day data retention."
      type: enhancement
      link: https://github.com/elastic/integrations/pull/22351
