# newer versions go on top
# History kept under 0.1.x / 0.2.x (do not discard prior change notes when renumbering).
- version: "0.2.2"
  changes:
    - description: "Set default deployment mode as primary and disable agentless mode for custom zip package installation."
      type: fix
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.2.1"
  changes:
    - description: "Prune legacy es-cb fields: remove dead deployment_group, kind, type, failure_count, and pipeline_count; standardize on project_* canonical fields with deployment_* and cluster_name aliases."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.2.0"
  changes:
    - description: "Native scheduled collection via Elastic Agent CEL streams for billing and usage. All credentials, remote project harvesting keys, and currency rates are configured via Fleet Integration Policy (no Kibana Workflows or config indices)."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.6"
  changes:
    - description: "Restore Fleet Integration Settings for custom zip installs (enable default deployment mode; Fleet rejects agentless for upload packages). Redesign Billing Components Overview, Usage & Cost Allocation, and Configuration dashboards with proportional Liquid bars, workload pool KPIs, and data stream cost attribution. Fix billing pipeline SKU classification order and null-safe alert rule templates."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.5"
  changes:
    - description: "Declare Fleet agentless deployment mode (default agent mode disabled). No Elastic Agent required; Workflows collect billing and usage."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.4"
  changes:
    - description: "Fleet Integration settings for organization ID, billing API key, and usage API key. Fix dashboard Links refs. Project wording (not deployment). Local currency via chargeback_conf_lookup on all spend visuals."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.3"
  changes:
    - description: "Add custom Liquid panels, filter controls, alert rule templates, index pattern, and dashboard screenshots. Document Fleet zip + Configuration dashboard + Workflows (no host install script in package docs)."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.2"
  changes:
    - description: "ECH-parity dashboards: Billing Components Overview, Usage & Cost Allocation, Configuration with top Links navigation and Fleet tags. Remove thin Spend/Data Trust-only set."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.1"
  changes:
    - description: "Add Spend Overview and Data Trust dashboards (ES|QL Lens panels)."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
- version: "0.1.0"
  changes:
    - description: "Initial Chargeback Serverless package."
      type: enhancement
      link: https://github.com/elastic/elasticsearch-chargeback/issues/123
