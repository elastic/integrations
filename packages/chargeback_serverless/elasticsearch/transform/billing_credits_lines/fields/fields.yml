- name: "@timestamp"
  type: date
  description: Daily snapshot timestamp of the credit commitment poll or line item.
- name: snapshot_day
  type: date
  description: UTC day boundary for the credit commitment snapshot.
- name: organization_id
  type: keyword
  description: Elastic Cloud organization ID.
- name: credit_start
  type: date
  description: Start timestamp of the credit commitment contract window.
- name: credit_end
  type: date
  description: End timestamp of the credit commitment contract window.
- name: credit_type
  type: keyword
  description: Credit commitment line item type.
- name: ecu_quantity
  type: long
  description: Contracted ECU quantity bucket for grouping credit commitments.
- name: credit_entry_key
  type: keyword
  description: Stage-1 grouping key distinguishing keyed commitment lines from unkeyed legacy polls.
- name: source_kind
  type: keyword
  description: Credit telemetry source discriminator (nat or leg).
- name: poll_owner
  type: keyword
  description: Collector instance identity (agent, namespace, and policy ID).
- name: poll_ts
  type: long
  description: Observed poll timestamp in epoch milliseconds.
- name: ing_ts
  type: long
  description: Latest event ingestion timestamp in epoch milliseconds.
- name: active_ecu_quantity
  type: double
  description: Total active contracted ECU quantity in this line or poll bucket.
- name: active_ecu_balance
  type: double
  description: Remaining active ECU balance in this line or poll bucket.
- name: active_line_count
  type: long
  description: Number of active commitment lines in this line or poll bucket.
- name: total_ecu_quantity
  type: double
  description: Total contracted ECU quantity across all lines in this line or poll bucket.
- name: total_ecu_balance
  type: double
  description: Remaining ECU balance across all lines in this line or poll bucket.
- name: total_line_count
  type: long
  description: Total number of commitment lines in this line or poll bucket.
- name: event.ingested
  type: date
  description: Timestamp when this staging document was written to Elasticsearch.
