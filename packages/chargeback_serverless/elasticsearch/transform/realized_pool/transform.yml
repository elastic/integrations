description: Aggregates daily allocatable ECU pools (indexing, query, storage, AI) per Serverless project into a single daily figure for LOOKUP JOIN attribution.
source:
  index:
  - serverless_billing_cost_lookup-2*
  - serverless_billing_realized_pool_lookup-1*
  - -serverless_billing_realized_pool_lookup-2*
  runtime_mappings:
    cb_ing_ms:
      type: long
      script:
        source: |
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          emit(ingMs);
    cb_pool_meta_rec:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_billing_realized_pool_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          String v_project_name = '';
          for (String f : ['project_name', 'project_name.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_name = doc[f].value.toString().trim(); if (v_project_name != '') break; } } catch (Exception e) {}
          }
          if (v_project_name == '' && params._source?.project_name != null) { v_project_name = params._source.project_name.toString().trim(); }
          String v_project_type = '';
          for (String f : ['project_type', 'project_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_type = doc[f].value.toString().trim(); if (v_project_type != '') break; } } catch (Exception e) {}
          }
          if (v_project_type == '' && params._source?.project_type != null) { v_project_type = params._source.project_type.toString().trim(); }
          String cRate = '-1';
          try {
            if (doc.containsKey('conf_chargeable_unit_rate') && !doc['conf_chargeable_unit_rate'].empty) {
              double r = ((Number)doc['conf_chargeable_unit_rate'].value).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            } else if (params._source?.conf_chargeable_unit_rate instanceof Number) {
              double r = ((Number)params._source.conf_chargeable_unit_rate).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            }
          } catch (Exception e) {}
          String v_conf_chargeable_unit_rate_unit = '';
          for (String f : ['conf_chargeable_unit_rate_unit', 'conf_chargeable_unit_rate_unit.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_chargeable_unit_rate_unit = doc[f].value.toString().trim(); if (v_conf_chargeable_unit_rate_unit != '') break; } } catch (Exception e) {}
          }
          if (v_conf_chargeable_unit_rate_unit == '' && params._source?.conf_chargeable_unit_rate_unit != null) { v_conf_chargeable_unit_rate_unit = params._source.conf_chargeable_unit_rate_unit.toString().trim(); }
          String v_conf_currency_symbol = '';
          for (String f : ['conf_currency_symbol', 'conf_currency_symbol.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_currency_symbol = doc[f].value.toString().trim(); if (v_conf_currency_symbol != '') break; } } catch (Exception e) {}
          }
          if (v_conf_currency_symbol == '' && params._source?.conf_currency_symbol != null) { v_conf_currency_symbol = params._source.conf_currency_symbol.toString().trim(); }
          double rowEcu = 0.0;
          try {
            if (doc.containsKey('total_ecu') && !doc['total_ecu'].empty) {
              rowEcu = ((Number)doc['total_ecu'].value).doubleValue();
            } else if (params._source?.total_ecu instanceof Number) {
              rowEcu = ((Number)params._source.total_ecu).doubleValue();
            }
          } catch (Exception e) {}
          boolean hasNatBill = false;
          try {
            if (doc.containsKey('has_native_billing') && !doc['has_native_billing'].empty) {
              hasNatBill = doc['has_native_billing'].value == true;
            } else if (params._source?.has_native_billing instanceof Boolean) {
              hasNatBill = ((Boolean)params._source.has_native_billing).booleanValue();
            }
          } catch (Exception e) {}
          emit(String.valueOf(ingMs) + sep + v_project_name.replace(sep, ' ') + sep + v_project_type.replace(sep, ' ') + sep + cRate + sep + v_conf_chargeable_unit_rate_unit.replace(sep, ' ') + sep + v_conf_currency_symbol.replace(sep, ' ') + sep + (rowEcu > 0.0 ? '1' : '0') + sep + (hasNatBill ? '1' : '0'));
    cb_sync_ts:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_billing_realized_pool_lookup-1') {
            emit(1262304000000L);
            return;
          }
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            for (String k : ['ingested', 'created']) {
              def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
              if (rawVal == null && params._source != null) {
                rawVal = params._source.get('event.' + k);
              }
              if (rawVal != null) {
                if (rawVal instanceof Number) {
                  emit(((Number)rawVal).longValue());
                  return;
                }
                String s = rawVal.toString().trim();
                if (s != '') {
                  try {
                    emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                    return;
                  } catch (Exception e) {}
                }
              }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_raw_total_ecu:
      type: double
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_billing_realized_pool_lookup-1') { return; }
          try {
            if (doc.containsKey('total_ecu') && !doc['total_ecu'].empty) {
              emit(((Number)doc['total_ecu'].value).doubleValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('total_ecu') instanceof Number) {
              emit(((Number)params._source.get('total_ecu')).doubleValue());
            }
          } catch (Exception e) {}
    cb_v1_pool_rec:
      type: keyword
      script:
        source: |
          String readStr(def doc, def src, List docFields, List srcPaths) {
            for (String f : docFields) {
              try {
                if (doc.containsKey(f) && !doc[f].empty) {
                  String v = doc[f].value.toString().trim();
                  if (v != '') { return v; }
                }
              } catch (Exception e) {}
            }
            if (src != null) {
              for (List path : srcPaths) {
                try {
                  def cur = src;
                  for (String seg : path) {
                    cur = (cur instanceof Map) ? ((Map)cur).get(seg) : null;
                    if (cur == null) { break; }
                  }
                  if (cur != null) {
                    String v = cur.toString().trim();
                    if (v != '') { return v; }
                  }
                } catch (Exception e) {}
              }
            }
            return '';
          }
          double readDbl(def doc, def src, List docFields, List srcPaths, double dflt) {
            for (String f : docFields) {
              try {
                if (doc.containsKey(f) && !doc[f].empty) {
                  return ((Number)doc[f].value).doubleValue();
                }
              } catch (Exception e) {}
            }
            if (src != null) {
              for (List path : srcPaths) {
                try {
                  def cur = src;
                  for (String seg : path) {
                    cur = (cur instanceof Map) ? ((Map)cur).get(seg) : null;
                    if (cur == null) { break; }
                  }
                  if (cur instanceof Number) { return ((Number)cur).doubleValue(); }
                } catch (Exception e) {}
              }
            }
            return dflt;
          }
          long readTs(def doc, def src, List docFields) {
            for (String f : docFields) {
              try {
                if (doc.containsKey(f) && !doc[f].empty) {
                  long ts = doc[f].value.toInstant().toEpochMilli();
                  if (ts > 0L) { return ts; }
                }
              } catch (Exception e) {}
            }
            if (src != null) {
              for (String f : docFields) {
                try {
                  def raw = src.get(f);
                  if (raw == null && f.contains('.')) {
                    int dot = f.indexOf('.');
                    def sub = src.get(f.substring(0, dot));
                    if (sub instanceof Map) { raw = ((Map)sub).get(f.substring(dot + 1)); }
                  }
                  if (raw instanceof Number) {
                    long ts = ((Number)raw).longValue();
                    if (ts > 0L) { return ts; }
                  } else if (raw != null && raw.toString().trim() != '') {
                    long ts = ZonedDateTime.parse(raw.toString().trim()).toInstant().toEpochMilli();
                    if (ts > 0L) { return ts; }
                  }
                } catch (Exception e) {}
              }
            }
            return 0L;
          }
          if (readStr(doc, null, ['_index'], []) != 'serverless_billing_realized_pool_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long ingMs = readTs(doc, params._source, ['event.ingested', 'event.created', '@timestamp']);
          double idxEcu = readDbl(doc, params._source, ['indexing_ecu'], [['indexing_ecu']], 0.0);
          double qryEcu = readDbl(doc, params._source, ['query_ecu'], [['query_ecu']], 0.0);
          double stgEcu = readDbl(doc, params._source, ['storage_ecu'], [['storage_ecu']], 0.0);
          double aiEcu = readDbl(doc, params._source, ['ai_ecu'], [['ai_ecu']], 0.0);
          double synEcu = readDbl(doc, params._source, ['synthetics_ecu'], [['synthetics_ecu']], 0.0);
          double synPingsEcu = readDbl(doc, params._source, ['synthetics_pings_ecu'], [['synthetics_pings_ecu']], 0.0);
          double synExecEcu = readDbl(doc, params._source, ['synthetics_executions_ecu'], [['synthetics_executions_ecu']], 0.0);
          double allSkuEcu = readDbl(doc, params._source, ['all_sku_ecu', 'total_ecu', 'total_chargeable_units'], [['all_sku_ecu'], ['total_ecu'], ['total_chargeable_units']], -1.0);
          if (allSkuEcu < 0.0) { allSkuEcu = idxEcu + qryEcu + stgEcu + aiEcu + synEcu; }
          String pName = readStr(doc, params._source, ['project_name', 'project_name.keyword'], [['project_name']]);
          String pType = readStr(doc, params._source, ['project_type', 'project_type.keyword'], [['project_type']]);
          double rVal = readDbl(doc, params._source, ['conf_chargeable_unit_rate'], [['conf_chargeable_unit_rate']], -1.0);
          String cRate = (rVal >= 0.0) ? String.valueOf(rVal) : '-1';
          String cUnit = readStr(doc, params._source, ['conf_chargeable_unit_rate_unit', 'conf_chargeable_unit_rate_unit.keyword'], [['conf_chargeable_unit_rate_unit']]);
          String cSym = readStr(doc, params._source, ['conf_currency_symbol', 'conf_currency_symbol.keyword'], [['conf_currency_symbol']]);
          emit(
            String.valueOf(ingMs) + sep + Double.toString(idxEcu) + sep + Double.toString(qryEcu) + sep
            + Double.toString(stgEcu) + sep + Double.toString(aiEcu) + sep + Double.toString(synEcu) + sep
            + Double.toString(synPingsEcu) + sep + Double.toString(synExecEcu) + sep + Double.toString(allSkuEcu) + sep
            + pName.replace(sep, ' ') + sep + pType.replace(sep, ' ') + sep + cRate + sep
            + cUnit.replace(sep, ' ') + sep + cSym.replace(sep, ' ')
          );
dest:
  index: serverless_billing_realized_pool_lookup-2
  aliases:
  - alias: serverless_billing_realized_pool_lookup
    move_on_creation: true
  pipeline: logs-chargeback_serverless.lookup-{{ ingestPipelineName "lookup_realized_pool" }}
frequency: 5m
sync:
  time:
    field: cb_sync_ts
    delay: 120s
retention_policy:
  time:
    field: '@timestamp'
    max_age: 365d
pivot:
  group_by:
    '@timestamp':
      date_histogram:
        field: '@timestamp'
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
  aggregations:
    indexing_ecu:
      filter:
        term:
          allocation_driver: indexing
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    query_ecu:
      filter:
        term:
          allocation_driver: query
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    storage_ecu:
      filter:
        term:
          allocation_driver: storage
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    ai_ecu:
      filter:
        term:
          allocation_driver: ai
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    synthetics_ecu:
      filter:
        term:
          allocation_driver: synthetics
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    synthetics_pings_ecu:
      filter:
        wildcard:
          sku:
            value: '*synthetic*ping*'
            case_insensitive: true
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    synthetics_executions_ecu:
      filter:
        bool:
          must:
          - term:
              allocation_driver: synthetics
          must_not:
          - wildcard:
              sku:
                value: '*ping*'
                case_insensitive: true
      aggs:
        val:
          sum:
            field: cb_raw_total_ecu
    all_sku_ecu:
      sum:
        field: cb_raw_total_ecu
    pool_meta:
      terms:
        field: cb_pool_meta_rec
        size: 20
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
    v1_carryover:
      terms:
        field: cb_v1_pool_rec
        size: 5
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.2.0
  order: 8
