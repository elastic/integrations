- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the billing pool.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security, vectordb, search).
- name: deployment_group
  type: keyword
  description: Deployment cost allocation group extracted from chargeback_group tags.
- name: indexing_ecu
  type: double
  description: Daily allocatable indexing ECU pool for the project.
- name: query_ecu
  type: double
  description: Daily allocatable search and query ECU pool for the project.
- name: storage_ecu
  type: double
  description: Daily allocatable retained storage ECU pool for the project.
- name: ai_ecu
  type: double
  description: Daily AI and ML inference ECU pool for the project.
- name: synthetics_ecu
  type: double
  description: Daily total Synthetics ECU pool for the project.
- name: synthetics_pings_ecu
  type: double
  description: Daily Synthetics lightweight ping ECU pool (http, icmp, tcp, dns) for the project.
- name: synthetics_executions_ecu
  type: double
  description: Daily Synthetics browser execution ECU pool for the project.
- name: data_tier_capacity_ecu
  type: double
  description: Sum of daily allocatable data-tier ECU (indexing + query + storage).
- name: realized_chargeable_units
  type: double
  description: Realized allocatable chargeable units for the project per day.
- name: total_chargeable_units
  type: double
  description: Total daily allocatable (data tier), AI, and Synthetics chargeable units for the project.
- name: total_ecu
  type: double
  description: Dual-written copy of total_chargeable_units for ES&#124;QL compatibility.
- name: all_sku_ecu
  type: double
  description: Total daily billed ECU across all SKUs (allocatable and unallocatable) for the project.
- name: has_native_billing
  type: boolean
  description: True when the realised pool bucket includes native Chargeback Serverless billing telemetry with project tag discovery.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion rate per ECU.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit code (for example, USD, EUR, ZAR).
- name: conf_currency_symbol
  type: keyword
  description: Configured currency symbol (for example, $, €, R).
