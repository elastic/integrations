- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the billing pool.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: deployment_id
  type: alias
  path: project_id
  description: Legacy compatibility alias for project_id.
- name: indexing_ecu
  type: double
  description: Daily allocatable indexing ECU pool for the project.
- name: query_ecu
  type: double
  description: Daily allocatable search and query ECU pool for the project.
- name: storage_ecu
  type: double
  description: Daily allocatable retained storage ECU pool for the project.
- name: ai_ecu
  type: double
  description: Daily AI and ML inference ECU pool for the project.
- name: data_tier_capacity_ecu
  type: double
  description: Sum of daily allocatable data-tier ECU (indexing + query + storage).
- name: realized_chargeable_units
  type: double
  description: Realized allocatable chargeable units for the project per day.
- name: total_chargeable_units
  type: double
  description: Total daily allocatable + AI chargeable units for the project.
- name: total_ecu
  type: alias
  path: total_chargeable_units
  description: Alias of total_chargeable_units.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion rate per ECU.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit code (e.g., USD, EUR, ZAR).
- name: conf_currency_symbol
  type: keyword
  description: Configured currency symbol (e.g., $, €, R).
