- name: config_join_key
  type: keyword
  description: Join key for Chargeback Serverless configuration lookup.
- name: conf_chargeable_unit_rate
  type: double
  description: Chargeable unit rate multiplier for cost calculation (ECU to display currency).
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Currency unit code for chargeable unit rate (for example USD, EUR, GBP, ZAR).
- name: conf_currency_symbol
  type: keyword
  description: Currency display symbol (for example $, €, £, R).
- name: conf_ecu_rate
  type: alias
  path: conf_chargeable_unit_rate
  description: Alias of conf_chargeable_unit_rate for ES&#124;QL compatibility.
- name: conf_ecu_rate_unit
  type: alias
  path: conf_chargeable_unit_rate_unit
  description: Alias of conf_chargeable_unit_rate_unit for ES&#124;QL compatibility.
- name: conf_start_date
  type: date
  description: Configuration validity start date (defaults to 2010-01-01T00:00:00Z).
- name: conf_end_date
  type: date
  description: Configuration validity end date (defaults to 2046-12-31T23:59:59.999Z).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
