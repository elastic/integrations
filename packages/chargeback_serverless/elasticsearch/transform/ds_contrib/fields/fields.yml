- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the usage metric.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: composite_datastream_key
  type: keyword
  description: Date, project ID, and data stream composite key.
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security, vectordb, search).
- name: deployment_group
  type: keyword
  description: Deployment cost allocation group extracted from chargeback_group tags.
- name: datastream
  type: keyword
  description: Normalized data stream name.
- name: ds_type
  type: keyword
  description: Data stream type prefix (logs, metrics, traces, synthetics, profiling, index, system, other).
- name: ds_dataset
  type: keyword
  description: Data stream dataset name (for example, http, icmp, tcp, dns, browser).
- name: ds_namespace
  type: keyword
  description: Data stream namespace suffix.
- name: datastream_sum_indexing_time
  type: long
  description: Daily indexing time in milliseconds for the data stream.
- name: datastream_sum_query_time
  type: long
  description: Daily search query time in milliseconds for the data stream.
- name: datastream_sum_data_set_store_size
  type: long
  description: Daily dataset size in bytes for the data stream.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label.
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol.
- name: has_native_usage
  type: boolean
  description: True when the data stream bucket was materialized from native Chargeback Serverless usage telemetry rather than legacy monitoring-indices fallback.
- name: source_sync_ts
  type: date
  description: Latest source ingestion timestamp among native usage snapshots contributing to this data stream bucket.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
