description: Aggregates daily indexing time, query time, and dataset storage size per Serverless project and data stream into a single daily figure.
source:
  index:
    - metrics-chargeback_serverless.usage-*
  query:
    term:
      doc_type: "datastream"
dest:
  index: serverless_datastream_contribution_lookup-1
  aliases:
    - alias: serverless_datastream_contribution_lookup
      move_on_creation: true
  pipeline: '{{ ingestPipelineName "chargeback_serverless-lookup_usage" }}'
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
    datastream:
      terms:
        field: datastream
  aggregations:
    ds_type:
      terms:
        field: ds_type
        size: 1
    ds_dataset:
      terms:
        field: ds_dataset
        size: 1
    ds_namespace:
      terms:
        field: ds_namespace
        size: 1
    datastream_sum_indexing_time:
      max:
        field: datastream_sum_indexing_time
    datastream_sum_query_time:
      max:
        field: datastream_sum_query_time
    datastream_sum_data_set_store_size:
      max:
        field: datastream_sum_data_set_store_size
    latest_currency:
      top_metrics:
        metrics:
          - field: project_name
          - field: project_type
          - field: conf_chargeable_unit_rate
          - field: conf_chargeable_unit_rate_unit
          - field: conf_currency_symbol
        sort:
          event.ingested: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.1.0
