- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the usage metric.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: deployment_sum_indexing_time
  type: long
  description: Daily total indexing time in milliseconds for the project.
- name: deployment_sum_query_time
  type: long
  description: Daily total search query time in milliseconds for the project.
- name: deployment_sum_data_set_store_size
  type: long
  description: Daily total dataset size in bytes for the project.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
