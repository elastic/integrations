description: Aggregates daily total indexing time, query time, and dataset storage size per Serverless project from selected data stream contribution rows so project denominators match stream numerators exactly.
source:
  index:
    - serverless_datastream_contribution_lookup-2
  runtime_mappings:
    cb_proj_meta_rank:
      type: long
      script:
        source: |
          boolean isNat = false;
          try {
            if (doc.containsKey('has_native_usage') && !doc['has_native_usage'].empty) {
              isNat = doc['has_native_usage'].value == true;
            } else if (params._source?.has_native_usage instanceof Boolean) {
              isNat = ((Boolean)params._source.has_native_usage).booleanValue();
            }
          } catch (Exception e) {}
          long tsMs = 0L;
          for (String tf : ['source_sync_ts', 'event.ingested', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                tsMs = doc[tf].value.toInstant().toEpochMilli();
                if (tsMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (tsMs <= 0L) {
            try {
              def sTs = params._source?.source_sync_ts;
              if (sTs == null && params._source?.event instanceof Map) { sTs = ((Map)params._source.event).get('ingested'); }
              if (sTs == null) { sTs = params._source != null ? params._source.get('@timestamp') : null; }
              if (sTs instanceof Number) { tsMs = ((Number)sTs).longValue(); }
              else if (sTs != null && sTs.toString().trim() != '') {
                tsMs = ZonedDateTime.parse(sTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (tsMs < 0L) { tsMs = 0L; }
          emit((isNat ? 10000000000000L : 0L) + tsMs);
    cb_proj_meta_rec:
      type: keyword
      script:
        source: |
          String sep = Character.toString((char)31);
          boolean isNat = false;
          try {
            if (doc.containsKey('has_native_usage') && !doc['has_native_usage'].empty) {
              isNat = doc['has_native_usage'].value == true;
            } else if (params._source?.has_native_usage instanceof Boolean) {
              isNat = ((Boolean)params._source.has_native_usage).booleanValue();
            }
          } catch (Exception e) {}
          long tsMs = 0L;
          for (String tf : ['source_sync_ts', 'event.ingested', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                tsMs = doc[tf].value.toInstant().toEpochMilli();
                if (tsMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (tsMs <= 0L) {
            try {
              def sTs = params._source?.source_sync_ts;
              if (sTs == null && params._source?.event instanceof Map) { sTs = ((Map)params._source.event).get('ingested'); }
              if (sTs == null) { sTs = params._source != null ? params._source.get('@timestamp') : null; }
              if (sTs instanceof Number) { tsMs = ((Number)sTs).longValue(); }
              else if (sTs != null && sTs.toString().trim() != '') {
                tsMs = ZonedDateTime.parse(sTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (tsMs < 0L) { tsMs = 0L; }
          long rankVal = (isNat ? 10000000000000L : 0L) + tsMs;
          String pName = '';
          String pType = '';
          String dGrp = '';
          String cRate = '-1';
          String cUnit = '';
          String cSym = '';
          for (String f : ['project_name', 'project_name.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { pName = doc[f].value.toString().trim(); if (pName != '') break; } } catch (Exception e) {}
          }
          if (pName == '' && params._source?.project_name != null) { pName = params._source.project_name.toString().trim(); }
          for (String f : ['project_type', 'project_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { pType = doc[f].value.toString().trim(); if (pType != '') break; } } catch (Exception e) {}
          }
          if (pType == '' && params._source?.project_type != null) { pType = params._source.project_type.toString().trim(); }
          for (String f : ['deployment_group', 'deployment_group.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { dGrp = doc[f].value.toString().trim(); if (dGrp != '') break; } } catch (Exception e) {}
          }
          if (dGrp == '' && params._source?.deployment_group != null) { dGrp = params._source.deployment_group.toString().trim(); }
          try {
            if (doc.containsKey('conf_chargeable_unit_rate') && !doc['conf_chargeable_unit_rate'].empty) {
              double r = ((Number)doc['conf_chargeable_unit_rate'].value).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            } else if (params._source?.conf_chargeable_unit_rate instanceof Number) {
              double r = ((Number)params._source.conf_chargeable_unit_rate).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            }
          } catch (Exception e) {}
          for (String f : ['conf_chargeable_unit_rate_unit', 'conf_chargeable_unit_rate_unit.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { cUnit = doc[f].value.toString().trim(); if (cUnit != '') break; } } catch (Exception e) {}
          }
          if (cUnit == '' && params._source?.conf_chargeable_unit_rate_unit != null) { cUnit = params._source.conf_chargeable_unit_rate_unit.toString().trim(); }
          for (String f : ['conf_currency_symbol', 'conf_currency_symbol.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { cSym = doc[f].value.toString().trim(); if (cSym != '') break; } } catch (Exception e) {}
          }
          if (cSym == '' && params._source?.conf_currency_symbol != null) { cSym = params._source.conf_currency_symbol.toString().trim(); }
          pName = pName.replace(sep, ' ');
          pType = pType.replace(sep, ' ');
          dGrp = dGrp.replace(sep, ' ');
          cUnit = cUnit.replace(sep, ' ');
          cSym = cSym.replace(sep, ' ');
          emit(String.valueOf(rankVal) + sep + pName + sep + pType + sep + dGrp + sep + cRate + sep + cUnit + sep + cSym);
dest:
  index: serverless_project_contribution_lookup-2
  aliases:
    - alias: serverless_project_contribution_lookup
      move_on_creation: true
  pipeline: 'logs-chargeback_serverless.lookup-{{ ingestPipelineName "lookup_usage" }}'
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
  aggregations:
    deployment_sum_indexing_time:
      sum:
        field: datastream_sum_indexing_time
    deployment_sum_query_time:
      sum:
        field: datastream_sum_query_time
    deployment_sum_data_set_store_size:
      sum:
        field: datastream_sum_data_set_store_size
    proj_meta:
      terms:
        field: cb_proj_meta_rec
        size: 50
        order:
          - max_rank: desc
          - _key: desc
      aggs:
        max_rank:
          max:
            field: cb_proj_meta_rank
settings:
  deduce_mappings: false
  unattended: true
  max_page_search_size: 500
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.2.0
  order: 9
