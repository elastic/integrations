- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the Synthetics monitor usage metric.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security).
- name: monitor_id
  type: keyword
  description: Synthetics monitor identifier.
- name: monitor_name
  type: keyword
  description: Synthetics monitor display name.
- name: monitor_type
  type: keyword
  description: Synthetics monitor type (http, icmp, tcp, dns, browser).
- name: monitor_namespace
  type: keyword
  description: Synthetics monitor namespace.
- name: check_count
  type: long
  description: Daily synthetic check execution count for this monitor.
- name: up_count
  type: long
  description: Daily successful up synthetic check count.
- name: down_count
  type: long
  description: Daily failed down synthetic check count.
- name: locations_count
  type: long
  description: Number of distinct observer locations running this monitor.
- name: average_duration_ms
  type: double
  description: Average synthetic check duration in milliseconds.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label.
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
