description: Aggregates daily Synthetics monitor check execution metrics per Serverless project, monitor, and synthetic type into a single daily figure.
source:
  index:
    - metrics-chargeback_serverless.usage-*
  query:
    term:
      doc_type: "synthetics_monitor"
dest:
  index: serverless_synthetics_monitor_contribution_lookup-1
  aliases:
    - alias: serverless_synthetics_monitor_contribution_lookup
      move_on_creation: true
  pipeline: metrics-chargeback_serverless.usage-0.4.1-lookup_usage
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
    monitor_id:
      terms:
        field: monitor_id
    monitor_type:
      terms:
        field: monitor_type
  aggregations:
    project_name:
      terms:
        field: project_name
        size: 5
    project_type:
      terms:
        field: project_type
        size: 1
    monitor_name:
      terms:
        field: monitor_name
        size: 1
    monitor_namespace:
      terms:
        field: monitor_namespace
        size: 1
    check_count:
      max:
        field: check_count
    up_count:
      max:
        field: up_count
    down_count:
      max:
        field: down_count
    locations_count:
      max:
        field: locations_count
    average_duration_ms:
      max:
        field: average_duration_ms
    latest_currency:
      top_metrics:
        metrics:
          - field: conf_chargeable_unit_rate
          - field: conf_chargeable_unit_rate_unit
          - field: conf_currency_symbol
        sort:
          event.ingested: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.4.1
