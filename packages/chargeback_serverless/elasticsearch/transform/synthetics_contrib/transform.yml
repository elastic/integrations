description: Aggregates daily Synthetics monitor check execution metrics per Serverless project, monitor, and synthetic type into a single daily figure.
source:
  index:
  - metrics-chargeback_serverless.usage-*
  - serverless_synthetics_monitor_contribution_lookup-1*
  - -serverless_synthetics_monitor_contribution_lookup-2*
  query:
    bool:
      should:
      - term:
          doc_type: synthetics_monitor
      - term:
          _index: serverless_synthetics_monitor_contribution_lookup-1
      minimum_should_match: 1
  runtime_mappings:
    cb_ing_ms:
      type: long
      script:
        source: |
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          emit(ingMs);
    cb_total_dur_ms:
      type: double
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          double td = 0.0;
          try {
            if (doc.containsKey('total_duration_ms') && !doc['total_duration_ms'].empty) {
              td = ((Number)doc['total_duration_ms'].value).doubleValue();
            } else if (params._source?.total_duration_ms instanceof Number) {
              td = ((Number)params._source.total_duration_ms).doubleValue();
            }
          } catch (Exception e) {}
          emit(td > 0.0 ? td : 0.0);
    cb_meta_rec:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          String v_project_name = '';
          for (String f : ['project_name', 'project_name.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_name = doc[f].value.toString().trim(); if (v_project_name != '') break; } } catch (Exception e) {}
          }
          if (v_project_name == '' && params._source?.project_name != null) { v_project_name = params._source.project_name.toString().trim(); }
          String v_project_type = '';
          for (String f : ['project_type', 'project_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_type = doc[f].value.toString().trim(); if (v_project_type != '') break; } } catch (Exception e) {}
          }
          if (v_project_type == '' && params._source?.project_type != null) { v_project_type = params._source.project_type.toString().trim(); }
          String cRate = '-1';
          try {
            if (doc.containsKey('conf_chargeable_unit_rate') && !doc['conf_chargeable_unit_rate'].empty) {
              double r = ((Number)doc['conf_chargeable_unit_rate'].value).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            } else if (params._source?.conf_chargeable_unit_rate instanceof Number) {
              double r = ((Number)params._source.conf_chargeable_unit_rate).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            }
          } catch (Exception e) {}
          String v_conf_chargeable_unit_rate_unit = '';
          for (String f : ['conf_chargeable_unit_rate_unit', 'conf_chargeable_unit_rate_unit.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_chargeable_unit_rate_unit = doc[f].value.toString().trim(); if (v_conf_chargeable_unit_rate_unit != '') break; } } catch (Exception e) {}
          }
          if (v_conf_chargeable_unit_rate_unit == '' && params._source?.conf_chargeable_unit_rate_unit != null) { v_conf_chargeable_unit_rate_unit = params._source.conf_chargeable_unit_rate_unit.toString().trim(); }
          String v_conf_currency_symbol = '';
          for (String f : ['conf_currency_symbol', 'conf_currency_symbol.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_currency_symbol = doc[f].value.toString().trim(); if (v_conf_currency_symbol != '') break; } } catch (Exception e) {}
          }
          if (v_conf_currency_symbol == '' && params._source?.conf_currency_symbol != null) { v_conf_currency_symbol = params._source.conf_currency_symbol.toString().trim(); }
          String v_monitor_name = '';
          for (String f : ['monitor_name', 'monitor_name.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_monitor_name = doc[f].value.toString().trim(); if (v_monitor_name != '') break; } } catch (Exception e) {}
          }
          if (v_monitor_name == '' && params._source?.monitor_name != null) { v_monitor_name = params._source.monitor_name.toString().trim(); }
          String v_monitor_namespace = '';
          for (String f : ['monitor_namespace', 'monitor_namespace.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_monitor_namespace = doc[f].value.toString().trim(); if (v_monitor_namespace != '') break; } } catch (Exception e) {}
          }
          if (v_monitor_namespace == '' && params._source?.monitor_namespace != null) { v_monitor_namespace = params._source.monitor_namespace.toString().trim(); }
          emit('sy' + sep + String.valueOf(ingMs) + sep + v_project_name.replace(sep, ' ') + sep + v_project_type.replace(sep, ' ') + sep + cRate + sep + v_conf_chargeable_unit_rate_unit.replace(sep, ' ') + sep + v_conf_currency_symbol.replace(sep, ' ') + sep + v_monitor_name.replace(sep, ' ') + sep + v_monitor_namespace.replace(sep, ' '));
    cb_sync_ts:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') {
            emit(1262304000000L);
            return;
          }
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            for (String k : ['ingested', 'created']) {
              def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
              if (rawVal == null && params._source != null) {
                rawVal = params._source.get('event.' + k);
              }
              if (rawVal != null) {
                if (rawVal instanceof Number) {
                  emit(((Number)rawVal).longValue());
                  return;
                }
                String s = rawVal.toString().trim();
                if (s != '') {
                  try {
                    emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                    return;
                  } catch (Exception e) {}
                }
              }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_raw_check_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          try {
            if (doc.containsKey('check_count') && !doc['check_count'].empty) {
              emit(((Number)doc['check_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('check_count') instanceof Number) {
              emit(((Number)params._source.get('check_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_up_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          try {
            if (doc.containsKey('up_count') && !doc['up_count'].empty) {
              emit(((Number)doc['up_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('up_count') instanceof Number) {
              emit(((Number)params._source.get('up_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_down_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          try {
            if (doc.containsKey('down_count') && !doc['down_count'].empty) {
              emit(((Number)doc['down_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('down_count') instanceof Number) {
              emit(((Number)params._source.get('down_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_locations_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          try {
            if (doc.containsKey('locations_count') && !doc['locations_count'].empty) {
              emit(((Number)doc['locations_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('locations_count') instanceof Number) {
              emit(((Number)params._source.get('locations_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_avg_dur_ms:
      type: double
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_synthetics_monitor_contribution_lookup-1') { return; }
          try {
            if (doc.containsKey('average_duration_ms') && !doc['average_duration_ms'].empty) {
              emit(((Number)doc['average_duration_ms'].value).doubleValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('average_duration_ms') instanceof Number) {
              emit(((Number)params._source.get('average_duration_ms')).doubleValue());
            }
          } catch (Exception e) {}
    cb_v1_sy_rec:
      type: keyword
      script:
        source: |
          if (!doc.containsKey('_index') || doc['_index'].empty || doc['_index'].value.toString() != 'serverless_synthetics_monitor_contribution_lookup-1') {
            return;
          }
          String sep = Character.toString((char)31);
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          long chkCnt = 0L;
          long upCnt = 0L;
          long downCnt = 0L;
          long locCnt = 0L;
          double avgDur = 0.0;
          double totDur = 0.0;
          try { if (doc.containsKey('check_count') && !doc['check_count'].empty) { chkCnt = ((Number)doc['check_count'].value).longValue(); } else if (params._source?.check_count instanceof Number) { chkCnt = ((Number)params._source.check_count).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('up_count') && !doc['up_count'].empty) { upCnt = ((Number)doc['up_count'].value).longValue(); } else if (params._source?.up_count instanceof Number) { upCnt = ((Number)params._source.up_count).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('down_count') && !doc['down_count'].empty) { downCnt = ((Number)doc['down_count'].value).longValue(); } else if (params._source?.down_count instanceof Number) { downCnt = ((Number)params._source.down_count).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('locations_count') && !doc['locations_count'].empty) { locCnt = ((Number)doc['locations_count'].value).longValue(); } else if (params._source?.locations_count instanceof Number) { locCnt = ((Number)params._source.locations_count).longValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('average_duration_ms') && !doc['average_duration_ms'].empty) { avgDur = ((Number)doc['average_duration_ms'].value).doubleValue(); } else if (params._source?.average_duration_ms instanceof Number) { avgDur = ((Number)params._source.average_duration_ms).doubleValue(); } } catch (Exception e) {}
          try { if (doc.containsKey('total_duration_ms') && !doc['total_duration_ms'].empty) { totDur = ((Number)doc['total_duration_ms'].value).doubleValue(); } else if (params._source?.total_duration_ms instanceof Number) { totDur = ((Number)params._source.total_duration_ms).doubleValue(); } } catch (Exception e) {}
          String pName = '';
          String pType = '';
          String monName = '';
          String monNs = '';
          String cRate = '-1';
          String cUnit = '';
          String cSym = '';
          try { if (doc.containsKey('project_name') && !doc['project_name'].empty) { pName = doc['project_name'].value.toString().trim(); } else if (params._source?.project_name != null) { pName = params._source.project_name.toString().trim(); } } catch (Exception e) {}
          try { if (doc.containsKey('project_type') && !doc['project_type'].empty) { pType = doc['project_type'].value.toString().trim(); } else if (params._source?.project_type != null) { pType = params._source.project_type.toString().trim(); } } catch (Exception e) {}
          try { if (doc.containsKey('monitor_name') && !doc['monitor_name'].empty) { monName = doc['monitor_name'].value.toString().trim(); } else if (params._source?.monitor_name != null) { monName = params._source.monitor_name.toString().trim(); } } catch (Exception e) {}
          try { if (doc.containsKey('monitor_namespace') && !doc['monitor_namespace'].empty) { monNs = doc['monitor_namespace'].value.toString().trim(); } else if (params._source?.monitor_namespace != null) { monNs = params._source.monitor_namespace.toString().trim(); } } catch (Exception e) {}
          try {
            if (doc.containsKey('conf_chargeable_unit_rate') && !doc['conf_chargeable_unit_rate'].empty) {
              double r = ((Number)doc['conf_chargeable_unit_rate'].value).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            } else if (params._source?.conf_chargeable_unit_rate instanceof Number) {
              double r = ((Number)params._source.conf_chargeable_unit_rate).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            }
          } catch (Exception e) {}
          try { if (doc.containsKey('conf_chargeable_unit_rate_unit') && !doc['conf_chargeable_unit_rate_unit'].empty) { cUnit = doc['conf_chargeable_unit_rate_unit'].value.toString().trim(); } else if (params._source?.conf_chargeable_unit_rate_unit != null) { cUnit = params._source.conf_chargeable_unit_rate_unit.toString().trim(); } } catch (Exception e) {}
          try { if (doc.containsKey('conf_currency_symbol') && !doc['conf_currency_symbol'].empty) { cSym = doc['conf_currency_symbol'].value.toString().trim(); } else if (params._source?.conf_currency_symbol != null) { cSym = params._source.conf_currency_symbol.toString().trim(); } } catch (Exception e) {}
          emit(
            String.valueOf(ingMs) + sep
            + Long.toString(chkCnt) + sep
            + Long.toString(upCnt) + sep
            + Long.toString(downCnt) + sep
            + Long.toString(locCnt) + sep
            + Double.toString(avgDur) + sep
            + Double.toString(totDur) + sep
            + pName.replace(sep, ' ') + sep
            + pType.replace(sep, ' ') + sep
            + monName.replace(sep, ' ') + sep
            + monNs.replace(sep, ' ') + sep
            + cRate + sep
            + cUnit.replace(sep, ' ') + sep
            + cSym.replace(sep, ' ')
          );
dest:
  index: serverless_synthetics_monitor_contribution_lookup-2
  aliases:
  - alias: serverless_synthetics_monitor_contribution_lookup
    move_on_creation: true
  pipeline: logs-chargeback_serverless.lookup-{{ ingestPipelineName "lookup_usage" }}
frequency: 5m
sync:
  time:
    field: cb_sync_ts
    delay: 120s
retention_policy:
  time:
    field: '@timestamp'
    max_age: 365d
pivot:
  group_by:
    '@timestamp':
      date_histogram:
        field: '@timestamp'
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
    monitor_id:
      terms:
        field: monitor_id
    monitor_type:
      terms:
        field: monitor_type
  aggregations:
    check_count:
      max:
        field: cb_raw_check_count
    up_count:
      max:
        field: cb_raw_up_count
    down_count:
      max:
        field: cb_raw_down_count
    locations_count:
      max:
        field: cb_raw_locations_count
    average_duration_ms:
      max:
        field: cb_raw_avg_dur_ms
    total_duration_ms:
      max:
        field: cb_total_dur_ms
    usage_meta:
      terms:
        field: cb_meta_rec
        size: 20
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
    v1_sy_carryover:
      terms:
        field: cb_v1_sy_rec
        size: 5
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.2.0
  order: 7
