description: Aggregates daily total chargeable units (ECU) per Serverless project and SKU into a single daily figure.
source:
  index:
    - metrics-chargeback_serverless.billing-*
dest:
  index: serverless_billing_cost_lookup-1
  aliases:
    - alias: serverless_billing_cost_lookup
      move_on_creation: true
  pipeline: metrics-chargeback_serverless.billing-0.4.1-lookup_billing
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 120s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
    sku:
      terms:
        field: sku
  aggregations:
    project_name:
      terms:
        field: project_name
        size: 5
    project_type:
      terms:
        field: project_type
        size: 1
    # Daily (project_id, sku) components are pre-summed into a single snapshot
    # during CEL collection; top_metrics selects the newest snapshot on replay.
    latest_snapshot:
      top_metrics:
        metrics:
          - field: total_ecu
          - field: quantity_value
          - field: conf_chargeable_unit_rate
          - field: conf_chargeable_unit_rate_unit
          - field: conf_currency_symbol
        sort:
          event.ingested: desc
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.4.1
