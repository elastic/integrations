description: Aggregates daily total chargeable units (ECU) per Serverless project and SKU into a single daily figure.
source:
  index:
    - metrics-chargeback_serverless.billing-*
dest:
  index: serverless_billing_cost_lookup
  pipeline: logs-chargeback_serverless.lookup-0.4.0-billing
frequency: 5m
sync:
  time:
    field: event.ingested
    delay: 60s
retention_policy:
  time:
    field: "@timestamp"
    max_age: 365d
pivot:
  group_by:
    "@timestamp":
      date_histogram:
        field: "@timestamp"
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
    sku:
      terms:
        field: sku
  aggregations:
    project_name:
      terms:
        field: project_name
        size: 5
    project_type:
      terms:
        field: project_type
        size: 1
    total_ecu:
      scripted_metric:
        init_script: "state.by_batch = [:]"
        map_script: |
          def b = doc['event.ingested'].size() > 0 ? (doc['event.ingested'].value.toInstant().toEpochMilli() / 60000L).toString() : 'default';
          def v = doc['total_ecu'].size() > 0 ? ((Number)doc['total_ecu'].value).doubleValue() : 0.0;
          state.by_batch[b] = (state.by_batch.containsKey(b) ? state.by_batch[b] : 0.0) + v;
        combine_script: "return state.by_batch;"
        reduce_script: |
          def merged = [:];
          for (s in states) {
            if (s != null) {
              for (entry in s.entrySet()) {
                def k = entry.getKey();
                def v = entry.getValue();
                merged[k] = (merged.containsKey(k) ? merged[k] : 0.0) + v;
              }
            }
          }
          def maxVal = 0.0;
          for (v in merged.values()) {
            if (v > maxVal) {
              maxVal = v;
            }
          }
          return maxVal;
    quantity_value:
      scripted_metric:
        init_script: "state.by_batch = [:]"
        map_script: |
          def b = doc['event.ingested'].size() > 0 ? (doc['event.ingested'].value.toInstant().toEpochMilli() / 60000L).toString() : 'default';
          def v = doc['quantity_value'].size() > 0 ? ((Number)doc['quantity_value'].value).doubleValue() : 0.0;
          state.by_batch[b] = (state.by_batch.containsKey(b) ? state.by_batch[b] : 0.0) + v;
        combine_script: "return state.by_batch;"
        reduce_script: |
          def merged = [:];
          for (s in states) {
            if (s != null) {
              for (entry in s.entrySet()) {
                def k = entry.getKey();
                def v = entry.getValue();
                merged[k] = (merged.containsKey(k) ? merged[k] : 0.0) + v;
              }
            }
          }
          def maxVal = 0.0;
          for (v in merged.values()) {
            if (v > maxVal) {
              maxVal = v;
            }
          }
          return maxVal;
    conf_chargeable_unit_rate:
      max:
        field: conf_chargeable_unit_rate
    conf_chargeable_unit_rate_unit:
      terms:
        field: conf_chargeable_unit_rate_unit
        size: 1
    conf_currency_symbol:
      terms:
        field: conf_currency_symbol
        size: 1
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.4.0
