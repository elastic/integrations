              int oldMeta = (state.nat.get('deployment_group') != '' ? 2 : 0) + (state.nat.get('project_name') != '' ? 1 : 0);
              if (ingTs > exTs || (ingTs == exTs && (newMeta > oldMeta || (newMeta == oldMeta && ecu >= ((Number)state.nat.get('total_ecu')).doubleValue())))) {
