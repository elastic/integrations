- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the billing data.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security).
- name: deployment_id
  type: keyword
  description: Legacy compatibility field for project_id (dual-written for ES|QL compatibility).
- name: deployment_name
  type: keyword
  description: Legacy compatibility field for project_name (dual-written for ES|QL compatibility).
- name: deployment_type
  type: keyword
  description: Legacy compatibility field for project_type (dual-written for ES|QL compatibility).
- name: sku
  type: keyword
  description: Elastic Cloud billing SKU.
- name: cost_category
  type: keyword
  description: High-level cost category (data_tier, platform, transfer, snapshot, support, other).
- name: cost_type
  type: keyword
  description: Specific cost component (ingest-vcu, search-vcu, retained, ml-vcu, inference, etc.).
- name: allocation_driver
  type: keyword
  description: Workload allocation driver (indexing, query, storage, none).
- name: is_allocatable
  type: boolean
  description: True if charge is allocatable to project data streams.
- name: total_ecu
  type: double
  description: Daily billed Elasticsearch Compute Units (ECU) for this project and SKU.
- name: total_chargeable_units
  type: double
  description: Dual-written copy of total_ecu for ES|QL compatibility.
- name: quantity_value
  type: double
  description: Raw billing quantity.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label (e.g. USD, EUR, ZAR).
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol (e.g. $, €, R, £).
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
