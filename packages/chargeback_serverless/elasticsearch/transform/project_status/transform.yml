    cb_raw_ai_model_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('ai_model_count') && !doc['ai_model_count'].empty) {
              emit(((Number)doc['ai_model_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('ai_model_count') instanceof Number) {
              emit(((Number)params._source.get('ai_model_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_synthetics_monitor_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('synthetics_monitor_count') && !doc['synthetics_monitor_count'].empty) {
              emit(((Number)doc['synthetics_monitor_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('synthetics_monitor_count') instanceof Number) {
              emit(((Number)params._source.get('synthetics_monitor_count')).longValue());
            }
