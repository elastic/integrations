    cb_v1_ps_rec:
      type: keyword
      script:
        source: |
          if (!doc.containsKey('_index') || doc['_index'].empty || doc['_index'].value.toString() != 'serverless_project_status_lookup-1') {
            return;
          }
          String sep = Character.toString((char)31);
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
