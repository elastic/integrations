dest:
  index: serverless_project_status_lookup-2
  aliases:
  - alias: serverless_project_status_lookup
    move_on_creation: true
  pipeline: logs-chargeback_serverless.lookup-{{ ingestPipelineName "lookup_usage" }}
frequency: 5m
sync:
  time:
    field: cb_sync_ts
    delay: 120s
retention_policy:
  time:
    field: '@timestamp'
    max_age: 365d
pivot:
  group_by:
    '@timestamp':
      date_histogram:
        field: '@timestamp'
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
  aggregations:
    index_count:
      max:
        field: cb_raw_index_count
    datastream_count:
      max:
        field: cb_raw_datastream_count
    ai_model_count:
      max:
        field: cb_raw_ai_model_count
    synthetics_monitor_count:
      max:
        field: cb_raw_synthetics_monitor_count
    updated_at:
      max:
        field: cb_raw_updated_at
    status_meta:
      terms:
        field: cb_status_rec
        size: 20
        order:
        - max_upd: desc
        - _key: desc
      aggs:
        max_upd:
          max:
            field: cb_upd_ms
    usage_meta:
      terms:
        field: cb_meta_rec
        size: 20
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
    v1_ps_carryover:
      terms:
        field: cb_v1_ps_rec
        size: 5
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.2.0
  order: 5
