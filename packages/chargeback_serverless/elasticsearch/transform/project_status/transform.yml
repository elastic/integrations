          long updMs = 0L;
          try { if (doc.containsKey('index_count') && !doc['index_count'].empty) { idxCnt = ((Number)doc['index_count'].value).longValue(); } else if (params._source?.index_count instanceof Number) { idxCnt = ((Number)params._source.index_count).longValue(); } } catch (Exception e) {}
