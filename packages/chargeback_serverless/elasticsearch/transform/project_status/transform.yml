description: Aggregates daily Serverless project harvest status into a single daily figure per project.
source:
  index:
  - metrics-chargeback_serverless.usage-*
  - serverless_project_status_lookup-1*
  - -serverless_project_status_lookup-2*
  query:
    bool:
      should:
      - term:
          doc_type: project_status
      - term:
          _index: serverless_project_status_lookup-1
      minimum_should_match: 1
  runtime_mappings:
    cb_ing_ms:
      type: long
      script:
        source: |
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          emit(ingMs);
    cb_upd_ms:
      type: long
      script:
        source: |
          long updMs = 0L;
          for (String tf : ['updated_at', 'event.ingested', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                updMs = doc[tf].value.toInstant().toEpochMilli();
                if (updMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (updMs <= 0L && params._source != null) {
            try {
              def rawTs = params._source.get('updated_at');
              if (rawTs == null && params._source.get('event') instanceof Map) { rawTs = ((Map)params._source.get('event')).get('ingested'); }
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { updMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                updMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (updMs < 0L) { updMs = 0L; }
          emit(updMs);
    cb_status_rec:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long updMs = 0L;
          for (String tf : ['updated_at', 'event.ingested', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                updMs = doc[tf].value.toInstant().toEpochMilli();
                if (updMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (updMs <= 0L && params._source != null) {
            try {
              def rawTs = params._source.get('updated_at');
              if (rawTs == null && params._source.get('event') instanceof Map) { rawTs = ((Map)params._source.get('event')).get('ingested'); }
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { updMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                updMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (updMs < 0L) { updMs = 0L; }
          String v_last_status = '';
          for (String f : ['last_status', 'last_status.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_last_status = doc[f].value.toString().trim(); if (v_last_status != '') break; } } catch (Exception e) {}
          }
          if (v_last_status == '' && params._source?.last_status != null) { v_last_status = params._source.last_status.toString().trim(); }
          String v_api_key_type = '';
          for (String f : ['api_key_type', 'api_key_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_api_key_type = doc[f].value.toString().trim(); if (v_api_key_type != '') break; } } catch (Exception e) {}
          }
          if (v_api_key_type == '' && params._source?.api_key_type != null) { v_api_key_type = params._source.api_key_type.toString().trim(); }
          String v_synthetics_status = '';
          for (String f : ['synthetics_status', 'synthetics_status.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_synthetics_status = doc[f].value.toString().trim(); if (v_synthetics_status != '') break; } } catch (Exception e) {}
          }
          if (v_synthetics_status == '' && params._source?.synthetics_status != null) { v_synthetics_status = params._source.synthetics_status.toString().trim(); }
          emit(String.valueOf(updMs) + sep + v_last_status.replace(sep, ' ') + sep + v_api_key_type.replace(sep, ' ') + sep + v_synthetics_status.replace(sep, ' '));
    cb_meta_rec:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          String v_project_name = '';
          for (String f : ['project_name', 'project_name.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_name = doc[f].value.toString().trim(); if (v_project_name != '') break; } } catch (Exception e) {}
          }
          if (v_project_name == '' && params._source?.project_name != null) { v_project_name = params._source.project_name.toString().trim(); }
          String v_project_type = '';
          for (String f : ['project_type', 'project_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_type = doc[f].value.toString().trim(); if (v_project_type != '') break; } } catch (Exception e) {}
          }
          if (v_project_type == '' && params._source?.project_type != null) { v_project_type = params._source.project_type.toString().trim(); }
          String cRate = '-1';
          try {
            if (doc.containsKey('conf_chargeable_unit_rate') && !doc['conf_chargeable_unit_rate'].empty) {
              double r = ((Number)doc['conf_chargeable_unit_rate'].value).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            } else if (params._source?.conf_chargeable_unit_rate instanceof Number) {
              double r = ((Number)params._source.conf_chargeable_unit_rate).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            }
          } catch (Exception e) {}
          String v_conf_chargeable_unit_rate_unit = '';
          for (String f : ['conf_chargeable_unit_rate_unit', 'conf_chargeable_unit_rate_unit.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_chargeable_unit_rate_unit = doc[f].value.toString().trim(); if (v_conf_chargeable_unit_rate_unit != '') break; } } catch (Exception e) {}
          }
          if (v_conf_chargeable_unit_rate_unit == '' && params._source?.conf_chargeable_unit_rate_unit != null) { v_conf_chargeable_unit_rate_unit = params._source.conf_chargeable_unit_rate_unit.toString().trim(); }
          String v_conf_currency_symbol = '';
          for (String f : ['conf_currency_symbol', 'conf_currency_symbol.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_currency_symbol = doc[f].value.toString().trim(); if (v_conf_currency_symbol != '') break; } } catch (Exception e) {}
          }
          if (v_conf_currency_symbol == '' && params._source?.conf_currency_symbol != null) { v_conf_currency_symbol = params._source.conf_currency_symbol.toString().trim(); }
          String v_optimized_for = '';
          for (String f : ['optimized_for', 'optimized_for.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_optimized_for = doc[f].value.toString().trim(); if (v_optimized_for != '') break; } } catch (Exception e) {}
          }
          if (v_optimized_for == '' && params._source?.optimized_for != null) { v_optimized_for = params._source.optimized_for.toString().trim(); }
          String v_es_url = '';
          for (String f : ['es_url', 'es_url.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_es_url = doc[f].value.toString().trim(); if (v_es_url != '') break; } } catch (Exception e) {}
          }
          if (v_es_url == '' && params._source?.es_url != null) { v_es_url = params._source.es_url.toString().trim(); }
          emit('ps' + sep + String.valueOf(ingMs) + sep + v_project_name.replace(sep, ' ') + sep + v_project_type.replace(sep, ' ') + sep + cRate + sep + v_conf_chargeable_unit_rate_unit.replace(sep, ' ') + sep + v_conf_currency_symbol.replace(sep, ' ') + sep + v_optimized_for.replace(sep, ' ') + sep + v_es_url.replace(sep, ' '));
    cb_sync_ts:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') {
            emit(1262304000000L);
            return;
          }
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            for (String k : ['ingested', 'created']) {
              def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
              if (rawVal == null && params._source != null) {
                rawVal = params._source.get('event.' + k);
              }
              if (rawVal != null) {
                if (rawVal instanceof Number) {
                  emit(((Number)rawVal).longValue());
                  return;
                }
                String s = rawVal.toString().trim();
                if (s != '') {
                  try {
                    emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                    return;
                  } catch (Exception e) {}
                }
              }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_raw_index_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
