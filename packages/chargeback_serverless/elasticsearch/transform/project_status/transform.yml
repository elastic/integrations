description: Aggregates daily Serverless project harvest status into a single daily figure per project.
source:
  index:
  - metrics-chargeback_serverless.usage-*
  - serverless_project_status_lookup-1*
  - -serverless_project_status_lookup-2*
  query:
    bool:
      should:
      - term:
          doc_type: project_status
      - term:
          _index: serverless_project_status_lookup-1
      minimum_should_match: 1
  runtime_mappings:
    cb_ing_ms:
      type: long
      script:
        source: |
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          emit(ingMs);
    cb_upd_ms:
      type: long
      script:
        source: |
          long updMs = 0L;
          for (String tf : ['updated_at', 'event.ingested', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                updMs = doc[tf].value.toInstant().toEpochMilli();
                if (updMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (updMs <= 0L && params._source != null) {
            try {
              def rawTs = params._source.get('updated_at');
              if (rawTs == null && params._source.get('event') instanceof Map) { rawTs = ((Map)params._source.get('event')).get('ingested'); }
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { updMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                updMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (updMs < 0L) { updMs = 0L; }
          emit(updMs);
    cb_status_rec:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long updMs = 0L;
          for (String tf : ['updated_at', 'event.ingested', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                updMs = doc[tf].value.toInstant().toEpochMilli();
                if (updMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (updMs <= 0L && params._source != null) {
            try {
              def rawTs = params._source.get('updated_at');
              if (rawTs == null && params._source.get('event') instanceof Map) { rawTs = ((Map)params._source.get('event')).get('ingested'); }
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { updMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                updMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (updMs < 0L) { updMs = 0L; }
          String v_last_status = '';
          for (String f : ['last_status', 'last_status.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_last_status = doc[f].value.toString().trim(); if (v_last_status != '') break; } } catch (Exception e) {}
          }
          if (v_last_status == '' && params._source?.last_status != null) { v_last_status = params._source.last_status.toString().trim(); }
          String v_api_key_type = '';
          for (String f : ['api_key_type', 'api_key_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_api_key_type = doc[f].value.toString().trim(); if (v_api_key_type != '') break; } } catch (Exception e) {}
          }
          if (v_api_key_type == '' && params._source?.api_key_type != null) { v_api_key_type = params._source.api_key_type.toString().trim(); }
          String v_synthetics_status = '';
          for (String f : ['synthetics_status', 'synthetics_status.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_synthetics_status = doc[f].value.toString().trim(); if (v_synthetics_status != '') break; } } catch (Exception e) {}
          }
          if (v_synthetics_status == '' && params._source?.synthetics_status != null) { v_synthetics_status = params._source.synthetics_status.toString().trim(); }
          emit(String.valueOf(updMs) + sep + v_last_status.replace(sep, ' ') + sep + v_api_key_type.replace(sep, ' ') + sep + v_synthetics_status.replace(sep, ' '));
    cb_meta_rec:
      type: keyword
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long ingMs = 0L;
          for (String tf : ['event.ingested', 'event.created', '@timestamp']) {
            try {
              if (doc.containsKey(tf) && !doc[tf].empty) {
                ingMs = doc[tf].value.toInstant().toEpochMilli();
                if (ingMs > 0L) { break; }
              }
            } catch (Exception e) {}
          }
          if (ingMs <= 0L && params._source != null) {
            try {
              def ev = params._source.get('event');
              def rawTs = (ev instanceof Map) ? (((Map)ev).get('ingested') != null ? ((Map)ev).get('ingested') : ((Map)ev).get('created')) : null;
              if (rawTs == null) { rawTs = params._source.get('@timestamp'); }
              if (rawTs instanceof Number) { ingMs = ((Number)rawTs).longValue(); }
              else if (rawTs != null && rawTs.toString().trim() != '') {
                ingMs = ZonedDateTime.parse(rawTs.toString().trim()).toInstant().toEpochMilli();
              }
            } catch (Exception e) {}
          }
          if (ingMs < 0L) { ingMs = 0L; }
          String v_project_name = '';
          for (String f : ['project_name', 'project_name.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_name = doc[f].value.toString().trim(); if (v_project_name != '') break; } } catch (Exception e) {}
          }
          if (v_project_name == '' && params._source?.project_name != null) { v_project_name = params._source.project_name.toString().trim(); }
          String v_project_type = '';
          for (String f : ['project_type', 'project_type.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_project_type = doc[f].value.toString().trim(); if (v_project_type != '') break; } } catch (Exception e) {}
          }
          if (v_project_type == '' && params._source?.project_type != null) { v_project_type = params._source.project_type.toString().trim(); }
          String cRate = '-1';
          try {
            if (doc.containsKey('conf_chargeable_unit_rate') && !doc['conf_chargeable_unit_rate'].empty) {
              double r = ((Number)doc['conf_chargeable_unit_rate'].value).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            } else if (params._source?.conf_chargeable_unit_rate instanceof Number) {
              double r = ((Number)params._source.conf_chargeable_unit_rate).doubleValue();
              if (r >= 0.0) { cRate = String.valueOf(r); }
            }
          } catch (Exception e) {}
          String v_conf_chargeable_unit_rate_unit = '';
          for (String f : ['conf_chargeable_unit_rate_unit', 'conf_chargeable_unit_rate_unit.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_chargeable_unit_rate_unit = doc[f].value.toString().trim(); if (v_conf_chargeable_unit_rate_unit != '') break; } } catch (Exception e) {}
          }
          if (v_conf_chargeable_unit_rate_unit == '' && params._source?.conf_chargeable_unit_rate_unit != null) { v_conf_chargeable_unit_rate_unit = params._source.conf_chargeable_unit_rate_unit.toString().trim(); }
          String v_conf_currency_symbol = '';
          for (String f : ['conf_currency_symbol', 'conf_currency_symbol.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_conf_currency_symbol = doc[f].value.toString().trim(); if (v_conf_currency_symbol != '') break; } } catch (Exception e) {}
          }
          if (v_conf_currency_symbol == '' && params._source?.conf_currency_symbol != null) { v_conf_currency_symbol = params._source.conf_currency_symbol.toString().trim(); }
          String v_optimized_for = '';
          for (String f : ['optimized_for', 'optimized_for.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_optimized_for = doc[f].value.toString().trim(); if (v_optimized_for != '') break; } } catch (Exception e) {}
          }
          if (v_optimized_for == '' && params._source?.optimized_for != null) { v_optimized_for = params._source.optimized_for.toString().trim(); }
          String v_es_url = '';
          for (String f : ['es_url', 'es_url.keyword']) {
            try { if (doc.containsKey(f) && !doc[f].empty) { v_es_url = doc[f].value.toString().trim(); if (v_es_url != '') break; } } catch (Exception e) {}
          }
          if (v_es_url == '' && params._source?.es_url != null) { v_es_url = params._source.es_url.toString().trim(); }
          emit('ps' + sep + String.valueOf(ingMs) + sep + v_project_name.replace(sep, ' ') + sep + v_project_type.replace(sep, ' ') + sep + cRate + sep + v_conf_chargeable_unit_rate_unit.replace(sep, ' ') + sep + v_conf_currency_symbol.replace(sep, ' ') + sep + v_optimized_for.replace(sep, ' ') + sep + v_es_url.replace(sep, ' '));
    cb_sync_ts:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') {
            emit(1262304000000L);
            return;
          }
          try {
            if (doc.containsKey('event.ingested') && !doc['event.ingested'].empty) {
              emit(doc['event.ingested'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (doc.containsKey('event.created') && !doc['event.created'].empty) {
              emit(doc['event.created'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            for (String k : ['ingested', 'created']) {
              def rawVal = (params._source?.event instanceof Map) ? ((Map)params._source.event).get(k) : null;
              if (rawVal == null && params._source != null) {
                rawVal = params._source.get('event.' + k);
              }
              if (rawVal != null) {
                if (rawVal instanceof Number) {
                  emit(((Number)rawVal).longValue());
                  return;
                }
                String s = rawVal.toString().trim();
                if (s != '') {
                  try {
                    emit(ZonedDateTime.parse(s).toInstant().toEpochMilli());
                    return;
                  } catch (Exception e) {}
                }
              }
            }
          } catch (Exception e) {}
          if (doc.containsKey('@timestamp') && !doc['@timestamp'].empty) {
            emit(doc['@timestamp'].value.toInstant().toEpochMilli());
          }
    cb_raw_index_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('index_count') && !doc['index_count'].empty) {
              emit(((Number)doc['index_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('index_count') instanceof Number) {
              emit(((Number)params._source.get('index_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_datastream_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('datastream_count') && !doc['datastream_count'].empty) {
              emit(((Number)doc['datastream_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('datastream_count') instanceof Number) {
              emit(((Number)params._source.get('datastream_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_ai_model_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('ai_model_count') && !doc['ai_model_count'].empty) {
              emit(((Number)doc['ai_model_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('ai_model_count') instanceof Number) {
              emit(((Number)params._source.get('ai_model_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_synthetics_monitor_count:
      type: long
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('synthetics_monitor_count') && !doc['synthetics_monitor_count'].empty) {
              emit(((Number)doc['synthetics_monitor_count'].value).longValue());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('synthetics_monitor_count') instanceof Number) {
              emit(((Number)params._source.get('synthetics_monitor_count')).longValue());
            }
          } catch (Exception e) {}
    cb_raw_updated_at:
      type: date
      script:
        source: |
          if (doc.containsKey('_index') && !doc['_index'].empty && doc['_index'].value.toString() == 'serverless_project_status_lookup-1') { return; }
          try {
            if (doc.containsKey('updated_at') && !doc['updated_at'].empty) {
              emit(doc['updated_at'].value.toInstant().toEpochMilli());
              return;
            }
          } catch (Exception e) {}
          try {
            if (params._source != null && params._source.get('updated_at') != null) {
              def rv = params._source.get('updated_at');
              if (rv instanceof Number) { emit(((Number)rv).longValue()); }
              else if (rv.toString().trim() != '') { emit(ZonedDateTime.parse(rv.toString().trim()).toInstant().toEpochMilli()); }
            }
          } catch (Exception e) {}
    cb_v1_ps_rec:
      type: keyword
      script:
        source: |
          String readStr(def doc, def src, List docFields, List srcPaths) {
            for (String f : docFields) {
              try {
                if (doc.containsKey(f) && !doc[f].empty) {
                  String v = doc[f].value.toString().trim();
                  if (v != '') { return v; }
                }
              } catch (Exception e) {}
            }
            if (src != null) {
              for (List path : srcPaths) {
                try {
                  def cur = src;
                  for (String seg : path) {
                    cur = (cur instanceof Map) ? ((Map)cur).get(seg) : null;
                    if (cur == null) { break; }
                  }
                  if (cur != null) {
                    String v = cur.toString().trim();
                    if (v != '') { return v; }
                  }
                } catch (Exception e) {}
              }
            }
            return '';
          }
          double readDbl(def doc, def src, List docFields, List srcPaths, double dflt) {
            for (String f : docFields) {
              try {
                if (doc.containsKey(f) && !doc[f].empty) {
                  return ((Number)doc[f].value).doubleValue();
                }
              } catch (Exception e) {}
            }
            if (src != null) {
              for (List path : srcPaths) {
                try {
                  def cur = src;
                  for (String seg : path) {
                    cur = (cur instanceof Map) ? ((Map)cur).get(seg) : null;
                    if (cur == null) { break; }
                  }
                  if (cur instanceof Number) { return ((Number)cur).doubleValue(); }
                } catch (Exception e) {}
              }
            }
            return dflt;
          }
          long readTs(def doc, def src, List docFields) {
            for (String f : docFields) {
              try {
                if (doc.containsKey(f) && !doc[f].empty) {
                  long ts = doc[f].value.toInstant().toEpochMilli();
                  if (ts > 0L) { return ts; }
                }
              } catch (Exception e) {}
            }
            if (src != null) {
              for (String f : docFields) {
                try {
                  def raw = src.get(f);
                  if (raw == null && f.contains('.')) {
                    int dot = f.indexOf('.');
                    def sub = src.get(f.substring(0, dot));
                    if (sub instanceof Map) { raw = ((Map)sub).get(f.substring(dot + 1)); }
                  }
                  if (raw instanceof Number) {
                    long ts = ((Number)raw).longValue();
                    if (ts > 0L) { return ts; }
                  } else if (raw != null && raw.toString().trim() != '') {
                    long ts = ZonedDateTime.parse(raw.toString().trim()).toInstant().toEpochMilli();
                    if (ts > 0L) { return ts; }
                  }
                } catch (Exception e) {}
              }
            }
            return 0L;
          }
          if (readStr(doc, null, ['_index'], []) != 'serverless_project_status_lookup-1') { return; }
          String sep = Character.toString((char)31);
          long ingMs = readTs(doc, params._source, ['event.ingested', 'event.created', '@timestamp']);
          long idxCnt = (long)readDbl(doc, params._source, ['index_count'], [['index_count']], 0.0);
          long dsCnt = (long)readDbl(doc, params._source, ['datastream_count'], [['datastream_count']], 0.0);
          long aiCnt = (long)readDbl(doc, params._source, ['ai_model_count'], [['ai_model_count']], 0.0);
          long synCnt = (long)readDbl(doc, params._source, ['synthetics_monitor_count'], [['synthetics_monitor_count']], 0.0);
          long updMs = readTs(doc, params._source, ['updated_at', 'event.ingested', '@timestamp']);
          String lastSt = readStr(doc, params._source, ['last_status'], [['last_status']]);
          String apiKeyType = readStr(doc, params._source, ['api_key_type'], [['api_key_type']]);
          String synSt = readStr(doc, params._source, ['synthetics_status'], [['synthetics_status']]);
          String pName = readStr(doc, params._source, ['project_name'], [['project_name']]);
          String pType = readStr(doc, params._source, ['project_type'], [['project_type']]);
          String optFor = readStr(doc, params._source, ['optimized_for'], [['optimized_for']]);
          String esUrl = readStr(doc, params._source, ['es_url'], [['es_url']]);
          double rVal = readDbl(doc, params._source, ['conf_chargeable_unit_rate'], [['conf_chargeable_unit_rate']], -1.0);
          String cRate = (rVal >= 0.0) ? String.valueOf(rVal) : '-1';
          String cUnit = readStr(doc, params._source, ['conf_chargeable_unit_rate_unit'], [['conf_chargeable_unit_rate_unit']]);
          String cSym = readStr(doc, params._source, ['conf_currency_symbol'], [['conf_currency_symbol']]);
          emit(
            String.valueOf(ingMs) + sep + Long.toString(idxCnt) + sep + Long.toString(dsCnt) + sep
            + Long.toString(aiCnt) + sep + Long.toString(synCnt) + sep + Long.toString(updMs) + sep
            + lastSt.replace(sep, ' ') + sep + apiKeyType.replace(sep, ' ') + sep + synSt.replace(sep, ' ') + sep
            + pName.replace(sep, ' ') + sep + pType.replace(sep, ' ') + sep + optFor.replace(sep, ' ') + sep
            + esUrl.replace(sep, ' ') + sep + cRate + sep + cUnit.replace(sep, ' ') + sep + cSym.replace(sep, ' ')
          );
dest:
  index: serverless_project_status_lookup-2
  aliases:
  - alias: serverless_project_status_lookup
    move_on_creation: true
  pipeline: logs-chargeback_serverless.lookup-{{ ingestPipelineName "lookup_usage" }}
frequency: 5m
sync:
  time:
    field: cb_sync_ts
    delay: 120s
retention_policy:
  time:
    field: '@timestamp'
    max_age: 365d
pivot:
  group_by:
    '@timestamp':
      date_histogram:
        field: '@timestamp'
        calendar_interval: 1d
    project_id:
      terms:
        field: project_id
  aggregations:
    index_count:
      max:
        field: cb_raw_index_count
    datastream_count:
      max:
        field: cb_raw_datastream_count
    ai_model_count:
      max:
        field: cb_raw_ai_model_count
    synthetics_monitor_count:
      max:
        field: cb_raw_synthetics_monitor_count
    updated_at:
      max:
        field: cb_raw_updated_at
    status_meta:
      terms:
        field: cb_status_rec
        size: 20
        order:
        - max_upd: desc
        - _key: desc
      aggs:
        max_upd:
          max:
            field: cb_upd_ms
    usage_meta:
      terms:
        field: cb_meta_rec
        size: 20
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
    v1_ps_carryover:
      terms:
        field: cb_v1_ps_rec
        size: 5
        order:
        - max_ing: desc
        - _key: desc
      aggs:
        max_ing:
          max:
            field: cb_ing_ms
settings:
  deduce_mappings: false
  unattended: true
_meta:
  managed: true
  run_as_kibana_system: false
  fleet_transform_version: 0.2.0
  order: 5
