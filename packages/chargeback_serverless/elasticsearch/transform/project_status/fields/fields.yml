- name: "@timestamp"
  type: date
  description: Daily timestamp representing the UTC day of the project status snapshot.
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security).
- name: optimized_for
  type: keyword
  description: Serverless optimization profile (general_purpose, vector, etc.).
- name: es_url
  type: keyword
  description: Elasticsearch data plane endpoint URL.
- name: last_status
  type: keyword
  description: Project harvest health status (ok, empty_or_unauthorized).
- name: index_count
  type: long
  description: Total number of indices discovered in the project.
- name: updated_at
  type: date
  description: Last successful harvest timestamp.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label.
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol.
- name: event.ingested
  type: date
  description: Timestamp when this lookup document was written to Elasticsearch.
