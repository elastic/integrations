format_version: 3.5.0
name: chargeback_serverless
title: "Chargeback Serverless"
version: 0.1.6
description: "Allocate Elastic Cloud Serverless billing to projects on a Serverless hub. Agentless Fleet integration: set organization ID and API keys in the Integration UI; Kibana Workflows collect billing and usage (no Elastic Agent)."
type: integration
categories:
  - cloud
  - custom
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/elastic-logo.svg
    title: Elastic logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: chargeback_serverless
    title: Chargeback Serverless
    description: >-
      Agentless configuration for Elastic Cloud organization credentials.
      Billing and usage collection runs in Kibana Workflows — no Elastic Agent.
      Set secrets here (not on dashboards).
    # Custom (upload) packages cannot deploy as agentless on Fleet — default mode
    # is required so Integrations → Settings can store org ID and API keys.
    # Agentless stays declared for when the package is published to EPR.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        is_default: false
        organization: elastic
        division: field
        team: csg
    inputs:
      - type: cel
        title: Elastic Cloud credentials
        description: >-
          Organization ID and API keys for billing and project usage collection.
          After saving, sync values into chargeback-serverless-config for Workflows
          (see package README). API keys never appear on dashboards.
        vars:
          - name: organization_id
            type: text
            title: Organization ID
            description: >-
              Elastic Cloud organization ID (Cloud Console → Organization).
              Non-secret; used by the billing Workflow.
            multi: false
            required: true
            show_user: true
            secret: false
          - name: billing_api_key
            type: password
            title: Billing API key
            description: >-
              Elastic Cloud API key with organization billing read access.
              Used by the Chargeback Serverless Billing Workflow.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: usage_api_key
            type: password
            title: Usage API key
            description: >-
              Elastic Cloud API key that can list Serverless projects.
              Used by the Chargeback Serverless Usage Workflow (not a substitute
              for per-project Elasticsearch API keys).
            multi: false
            required: true
            show_user: true
            secret: true
owner:
  github: elastic/customer-architects
  type: elastic
