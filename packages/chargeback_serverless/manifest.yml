format_version: 3.7.0
name: chargeback_serverless
title: "Chargeback Serverless"
version: 0.1.0
description: "Allocate Elastic Cloud Serverless billing to projects, data streams, and AI models on a Serverless hub. Native Fleet integration: daily collection at 02:00 UTC via Elastic Agent CEL streams with Elasticsearch Transforms and lookup indices."
type: integration
categories:
  - cloud
  - custom
conditions:
  kibana:
    version: "^9.6.0"
  elastic:
    subscription: "basic"
  agent:
    version: "^9.2.0"
screenshots:
  - src: /img/chargeback-serverless-billing-overview.png
    title: Billing Components Overview
    size: 1581x1150
    type: image/png
  - src: /img/chargeback-serverless-usage-allocation.png
    title: Usage & Cost Allocation
    size: 1581x1150
    type: image/png
  - src: /img/chargeback-serverless-ai-ml.png
    title: AI & Machine Learning FinOps
    size: 1581x1150
    type: image/png
  - src: /img/chargeback-serverless-synthetics.png
    title: Synthetics FinOps
    size: 1581x1150
    type: image/png
  - src: /img/chargeback-serverless-configuration.png
    title: Configuration & Workload Registry
    size: 1581x1150
    type: image/png
icons:
  - src: /img/elastic-logo.svg
    title: Elastic logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: chargeback_serverless
    title: Chargeback Serverless
    description: >-
      Collect Elastic Cloud Serverless billing and project usage metrics on a schedule. All credentials, project harvesting keys, and currency conversions are configured here. Secrets are encrypted and never stored in Elasticsearch indices.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: false
    inputs:
      - type: cel
        title: Elastic Cloud Configuration
        description: >-
          Configure your Elastic Cloud organization ID, unified Elastic Cloud API key, and currency rates.
        vars:
          - name: organization_id
            type: text
            title: Organization ID
            description: >-
              Elastic Cloud organization ID (found on Cloud Console → Organization).
            multi: false
            required: true
            show_user: true
            secret: false
          - name: cloud_api_key
            type: password
            title: Elastic Cloud API Key
            description: >-
              Unified Elastic Cloud API key created in Cloud Console → Organization → API keys with Organization role set to Billing Admin (required to include deleted projects), Cloud resource access enabled, and Project Roles / API Access granted for each project type (Elasticsearch, Observability, Security).
            multi: false
            required: true
            show_user: true
            secret: true
          - name: currency_unit
            type: text
            title: Currency Unit
            description: >-
              Target display currency unit code (for example, USD, EUR, ZAR, GBP, ECU).
            multi: false
            required: false
            show_user: true
            default: "USD"
          - name: currency_symbol
            type: text
            title: Currency Symbol
            description: >-
              Target display currency symbol (for example, $, €, R, £, ECU).
            multi: false
            required: false
            show_user: true
            default: "$"
          - name: unit_rate
            type: text
            title: Chargeable Unit Rate
            description: >-
              Multiplier from chargeable units (ECU) to target currency (for example, 1.0, 18.5).
            multi: false
            required: true
            show_user: true
            default: "1.0"
          - name: billing_api_base
            type: text
            title: Billing API Base URL
            description: Base URL of the Elastic Cloud Billing API.
            required: false
            show_user: false
            default: "https://billing.elastic-cloud.com"
          - name: cloud_api_base
            type: text
            title: Cloud Control Plane API Base URL
            description: Base URL of the Elastic Cloud Serverless API.
            required: false
            show_user: false
            default: "https://api.elastic-cloud.com"
          - name: proxy_url
            type: text
            title: Proxy URL
            description: >-
              URL to proxy connections in the form of http[s]://<user>:<password>@<server name/ip>:<port>. Ensure your username and password are in URL encoded format.
            multi: false
            required: false
            show_user: false
          - name: ssl
            type: yaml
            title: SSL Configuration
            description: >-
              SSL configuration options. See [documentation](https://www.elastic.co/guide/en/beats/metricbeat/current/configuration-ssl.html#ssl-client-config) for details.
            multi: false
            required: false
            show_user: false
            default: |
