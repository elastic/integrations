format_version: 3.5.0
name: chargeback_serverless
title: "Chargeback Serverless"
version: 0.3.5
description: "Allocate Elastic Cloud Serverless billing to projects, data streams, and AI models on a Serverless hub. Native Fleet integration: daily collection at 02:00 UTC via Elastic Agent CEL streams with Elasticsearch Transforms and lookup indices."
type: integration
categories:
  - cloud
  - custom
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/elastic-logo.svg
    title: Elastic logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: chargeback_serverless
    title: Chargeback Serverless
    description: >-
      Collect Elastic Cloud Serverless billing and project usage metrics on a schedule.
      All credentials, project harvesting keys, and currency conversions are configured
      here. Secrets are encrypted and never stored in Elasticsearch indices.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: false
    inputs:
      - type: cel
        title: Elastic Cloud Configuration
        description: >-
          Configure organization credentials, remote project harvesting keys, and currency rates.
        vars:
          - name: organization_id
            type: text
            title: Organization ID
            description: >-
              Elastic Cloud organization ID (found on Cloud Console → Organization).
            multi: false
            required: true
            show_user: true
            secret: false
          - name: cloud_api_key
            type: password
            title: Elastic Cloud API Key
            description: >-
              Elastic Cloud API key with billing read access and Serverless project read access.
            multi: false
            required: true
            show_user: true
            secret: true
          - name: hub_es_api_key
            type: password
            title: Hub Project Elasticsearch API Key
            description: >-
              Optional Elasticsearch API key for the Hub project if harvesting local _cat/indices.
            multi: false
            required: false
            show_user: true
            secret: true
          - name: project_api_keys
            type: password
            title: Remote Project Elasticsearch API Keys
            description: >-
              Optional least-privileged Elasticsearch API keys for remote projects in <project_id>:<encoded_api_key> format.
            multi: true
            required: false
            show_user: true
            secret: true
          - name: lookbehind
            type: integer
            title: Billing Lookbehind Days
            description: >-
              Number of historical days of billing data to backfill on initial install (default: 60).
            multi: false
            required: true
            show_user: true
            default: 60
          - name: currency_unit
            type: text
            title: Currency Unit
            description: >-
              Target display currency unit code (e.g., USD, EUR, ZAR, GBP, ECU).
            multi: false
            required: false
            show_user: true
            default: "USD"
          - name: currency_symbol
            type: text
            title: Currency Symbol
            description: >-
              Target display currency symbol (e.g., $, €, R, £, ECU).
            multi: false
            required: false
            show_user: true
            default: "$"
          - name: unit_rate
            type: text
            title: Chargeable Unit Rate
            description: >-
              Multiplier from chargeable units (ECU) to target currency (e.g., 1.0, 18.5).
            multi: false
            required: false
            show_user: true
            default: "1.0"
          - name: billing_api_base
            type: text
            title: Billing API Base URL
            description: Base URL of the Elastic Cloud Billing API.
            required: false
            show_user: false
            default: "https://billing.elastic-cloud.com"
          - name: cloud_api_base
            type: text
            title: Cloud Control Plane API Base URL
            description: Base URL of the Elastic Cloud Serverless API.
            required: false
            show_user: false
            default: "https://api.elastic-cloud.com"
owner:
  github: elastic/customer-architects
  type: elastic
