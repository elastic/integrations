- name: composite_key
  type: keyword
  description: Date and deployment ID key (YYYY-MM-DD_deployment_id).
- name: deployment_id
  type: keyword
  description: Billed Serverless project or instance ID.
- name: deployment_name
  type: keyword
  description: Name of the billed Serverless project or instance.
- name: deployment_type
  type: keyword
  description: Instance type (elasticsearch, observability, security).
- name: deployment_group
  type: keyword
  description: Deployment group grouping (default serverless).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type.
- name: sku
  type: keyword
  description: Elastic Cloud billing SKU.
- name: type
  type: keyword
  description: SKU billing type (e.g. capacity, usage).
- name: kind
  type: keyword
  description: SKU billing kind.
- name: cost_category
  type: keyword
  description: High-level cost category (data_tier, platform, transfer, snapshot, support, other).
- name: cost_type
  type: keyword
  description: Specific cost component (ingest-vcu, search-vcu, retained, ml-vcu, inference, etc.).
- name: allocation_driver
  type: keyword
  description: Workload allocation driver (indexing, query, storage, none).
- name: is_allocatable
  type: boolean
  description: True if charge is allocatable to project data streams.
- name: total_ecu
  type: double
  description: Billed Elasticsearch Compute Units.
- name: quantity_value
  type: double
  description: Raw billing quantity.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label (e.g. USD, EUR, ZAR).
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol (e.g. $, €, R, £).
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
