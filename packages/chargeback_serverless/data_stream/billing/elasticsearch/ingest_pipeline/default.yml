---
description: >-
  Chargeback Serverless: build composite_key, classify Serverless SKUs, and set
  allocation_driver (indexing | query | storage | ai | synthetics | none) for showback.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      if: ctx.event?.ingested == null
      tag: set_event_ingested
  - terminate:
      tag: config_snapshot_complete
      if: "ctx.doc_type == 'config_snapshot'"
      description: Configuration snapshot events are complete after stamping event.ingested.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.doc_type != 'config_snapshot' && ctx.doc_type != 'credit_line_item'
      description: Terminate early on collection error documents.
  - date:
      field: _credit_poll_ts
      target_field: "@timestamp"
      formats:
        - ISO8601
      if: "ctx.doc_type == 'credit_line_item' && ctx._credit_poll_ts != null"
      ignore_failure: true
      tag: set_credit_poll_timestamp
  - remove:
      field: _credit_poll_ts
      ignore_missing: true
      tag: remove_credit_poll_ts
  - set:
      field: cloud.account.id
      copy_from: ess.billing.organization_id
      ignore_empty_value: true
      if: "ctx.doc_type == 'credit_line_item'"
      tag: set_credit_cloud_account_id
  - fingerprint:
      if: "ctx.doc_type == 'credit_line_item'"
      fields:
        - conf_policy_id
        - data_stream.namespace
        - "@timestamp"
        - credit_line_id
        - ess.billing.organization_id
        - ess.billing.start
        - ess.billing.end
        - ess.billing.type
        - ess.billing.ecu_quantity
        - ess.billing.ecu_balance
        - ess.billing.active
      target_field: _id
      ignore_missing: true
      tag: fingerprint_credit_line_item
  - terminate:
      tag: credit_line_item_complete
      if: "ctx.doc_type == 'credit_line_item'"
      description: Credit commitment events retain snapshot @timestamp and ESS credit fields; deduplication occurs in the billing_credits transform.
  - date:
      field: period_start
      target_field: "@timestamp"
      formats:
        - ISO8601
        - UNIX_MS
      if: ctx.period_start != null
      ignore_failure: true
      tag: restore_period_start_timestamp
  - remove:
      field: period_start
      ignore_missing: true
      tag: remove_period_start
  - fingerprint:
      if: "(ctx.doc_type == 'billing_line_item' || (ctx.doc_type == null && ctx.sku != null)) && ctx.error?.message == null"
      fields:
        - conf_policy_id
        - data_stream.namespace
        - project_id
        - "@timestamp"
        - sku
        - total_ecu
        - quantity_value
        - project_name
        - deployment_tags
        - billing_unit
        - billing_type
        - billing_kind
      target_field: _id
      ignore_missing: true
      tag: fingerprint_billing_line_item
  - set:
      field: cloud.account.id
      copy_from: ess.billing.organization_id
      ignore_empty_value: true
      if: "ctx.error?.message == null"
      tag: set_billing_cloud_account_id
  - set:
      field: ess.billing.unit
      copy_from: billing_unit
      ignore_empty_value: true
      if: "ctx.error?.message == null"
      tag: set_ess_billing_unit
  - set:
      field: ess.billing.type
      copy_from: billing_type
      ignore_empty_value: true
      if: "ctx.error?.message == null && ctx.doc_type != 'credit_line_item'"
      tag: set_ess_billing_type
  - set:
      field: ess.billing.kind
      copy_from: billing_kind
      ignore_empty_value: true
      if: "ctx.error?.message == null && ctx.doc_type != 'credit_line_item'"
      tag: set_ess_billing_kind
  - script:
      lang: painless
      if: "ctx.error?.message == null && ctx.doc_type != 'config_snapshot' && ctx.doc_type != 'credit_line_item' && (ctx.doc_type == 'billing_line_item' || ctx.sku != null)"
      ignore_failure: true
      tag: normalize_ess_billing_type_and_kind
      source: |
        if (ctx.project_type != null && ctx.project_type != '') {
          String ptNorm = ctx.project_type.toString().trim().toLowerCase(Locale.ROOT);
          if (ptNorm == 'oblt') { ptNorm = 'observability'; }
          else if (ptNorm == 'sec') { ptNorm = 'security'; }
          else if (ptNorm == 'vector') { ptNorm = 'vectordb'; }
          else if (ptNorm == 'es') { ptNorm = 'elasticsearch'; }
          else if (ptNorm == 'enterprise_search') { ptNorm = 'search'; }
          ctx.project_type = ptNorm;
        }
        if (ctx.ess == null) { ctx.ess = [:]; }
        if (ctx.ess.billing == null) { ctx.ess.billing = [:]; }
        String s = ctx.sku != null ? ctx.sku.toString() : '';
        String sLower = s.toLowerCase(Locale.ROOT);
        String pType = ctx.project_type != null ? ctx.project_type.toString() : '';
        if (ctx.ess.billing.kind == null || ctx.ess.billing.kind == '') {
          if (sLower.contains('.es.') || sLower.contains('.es-') || sLower.startsWith('elasticsearch.') || sLower.startsWith('serverless.elasticsearch.') || sLower.startsWith('es.')) {
            ctx.ess.billing.kind = 'elasticsearch';
          } else if (sLower.startsWith('observability.') || sLower.startsWith('serverless.observability.') || sLower.contains('.observability.') || sLower.startsWith('oblt.')) {
            ctx.ess.billing.kind = 'observability';
          } else if (sLower.startsWith('security.') || sLower.startsWith('serverless.security.') || sLower.contains('.security.') || sLower.startsWith('sec.')) {
            ctx.ess.billing.kind = 'security';
          } else if (sLower.startsWith('vectordb.') || sLower.startsWith('serverless.vectordb.') || sLower.contains('.vectordb.')) {
            ctx.ess.billing.kind = 'vectordb';
          } else if (sLower.startsWith('search.') || sLower.startsWith('serverless.search.')) {
            ctx.ess.billing.kind = 'search';
          } else if (sLower == 'none' && pType != '') {
            ctx.ess.billing.kind = pType;
          }
        }
        String tLower = ctx.ess.billing.type != null ? ctx.ess.billing.type.toString().toLowerCase(Locale.ROOT) : '';
        if (tLower == '' || tLower == 'vcu' || tLower == 'search ai lake' || tLower == 'synthetics' || tLower == 'data transfer') {
          if (sLower.contains('data-out') || sLower.contains('data-transfer-out') || sLower.contains('egress')) {
            ctx.ess.billing.type = 'data_out';
          } else if (sLower.contains('data-in') || sLower.contains('data-transfer-in') || sLower.contains('ingress')) {
            ctx.ess.billing.type = 'data_in';
          } else if (sLower.contains('snapshot') || sLower.contains('retained') || sLower.contains('storage')) {
            ctx.ess.billing.type = 'storage';
          } else if (sLower.contains('support')) {
            ctx.ess.billing.type = 'support';
          } else if (sLower.contains('vcu') || sLower.contains('complete')) {
            ctx.ess.billing.type = 'capacity';
          } else if ((sLower.contains('_ingest') || sLower.contains('.ingest') || sLower.contains('-ingest')) && !sLower.contains('vcu')) {
            ctx.ess.billing.type = 'ingest';
          } else {
            ctx.ess.billing.type = 'usage';
          }
        }
  - grok:
      field: sku
      patterns:
        - "^[^.]+\\..+?_(?<cloud.region>(?:aws|gcp|azure)-[a-z0-9-]+|(?:us|eu|ap|sa|ca|me|af)-[a-z]+-\\d+)$"
      if: "(ctx.cloud?.region == null || ctx.cloud?.region == '') && ctx.sku != null && ctx.error?.message == null"
      ignore_failure: true
      tag: grok_billing_cloud_region
  - script:
      lang: painless
      tag: set_composite_key
      source: |
        if (ctx.project_type != null && ctx.project_type != '') {
          String ptNorm = ctx.project_type.toString().trim().toLowerCase(Locale.ROOT);
          if (ptNorm == 'oblt') { ptNorm = 'observability'; }
          else if (ptNorm == 'sec') { ptNorm = 'security'; }
          else if (ptNorm == 'vector') { ptNorm = 'vectordb'; }
          else if (ptNorm == 'es') { ptNorm = 'elasticsearch'; }
          else if (ptNorm == 'enterprise_search') { ptNorm = 'search'; }
          ctx.project_type = ptNorm;
        }
        if (ctx.project_id == null || ctx.project_id == '') {
          if (ctx.error == null) {
            String uType = ctx.project_type != null ? ctx.project_type.toString() : '';
            if (uType == '' || uType == 'serverless') {
              String skU = ctx.sku != null ? ctx.sku.toString().trim().toLowerCase(Locale.ROOT) : '';
              if (skU.startsWith('observability.') || skU.startsWith('oblt.') || skU.startsWith('serverless.observability.') || skU.startsWith('serverless.oblt.') || skU.contains('.observability.') || skU.contains('.oblt.') || skU.contains('synthetic')) { uType = 'observability'; }
              else if (skU.startsWith('security.') || skU.startsWith('sec.') || skU.startsWith('serverless.security.') || skU.startsWith('serverless.sec.') || skU.contains('.security.') || skU.contains('.sec.')) { uType = 'security'; }
              else if (skU.startsWith('vectordb.') || skU.startsWith('serverless.vectordb.') || skU.contains('.vectordb.')) { uType = 'vectordb'; }
              else if (skU.startsWith('search.') || skU.startsWith('serverless.search.')) { uType = 'search'; }
              else if (skU.startsWith('elasticsearch.') || skU.startsWith('es.') || skU.startsWith('serverless.elasticsearch.') || skU.startsWith('serverless.es.') || skU.contains('.elasticsearch.')) { uType = 'elasticsearch'; }
              else { uType = 'serverless'; }
            }
            ctx.project_id = 'unassociated_' + uType;
          }
        }
        if (ctx.project_name == null || ctx.project_name == '') {
          ctx.project_name = ctx.project_id;
        }
        if (ctx.deployment_group == null || ctx.deployment_group == '') {
          List tagLists = new ArrayList();
          if (ctx.deployment_tags instanceof List) { tagLists.add(ctx.deployment_tags); }
          if (ctx.ess?.billing?.deployment_tags instanceof List) { tagLists.add(ctx.ess.billing.deployment_tags); }
          if (ctx.tags instanceof List) { tagLists.add(ctx.tags); }
          if (ctx.metadata?.tags instanceof List) { tagLists.add(ctx.metadata.tags); }
          for (def tl : tagLists) {
            if (ctx.deployment_group != null && ctx.deployment_group != '') { break; }
            for (def t : (List)tl) {
              String ts = '';
              if (t instanceof Map && t.key != null && t.value != null) {
                ts = t.key.toString() + ':' + t.value.toString();
              } else if (t != null) {
                ts = t.toString();
              }
              if (ts.toLowerCase().startsWith('chargeback_group:')) {
                String gv = ts.substring('chargeback_group:'.length()).trim();
                if (gv != '') {
                  ctx.deployment_group = gv;
                  break;
                }
              }
            }
          }
        }
        if (ctx.total_ecu instanceof Number) {
          ctx.total_chargeable_units = ((Number)ctx.total_ecu).doubleValue();
        }
        if (ctx['@timestamp'] != null && ctx.project_id != null) {
          def ts = ctx['@timestamp'];
          def date = (ts instanceof Number)
            ? Instant.ofEpochMilli(((Number) ts).longValue()).atZone(ZoneOffset.UTC).toLocalDate().toString()
            : ZonedDateTime.parse(ts.toString()).toLocalDate().toString();
          ctx.composite_key = date + '_' + ctx.project_id;
        }
  - set:
      field: cost_type
      value: 'data-transfer'
      if: ctx.sku != null && ctx.sku =~ /^(aws|gcp|azure)\.(data-transfer|data-out).*/
      tag: set_cost_type_data_transfer
  - set:
      field: cost_type
      value: 'snapshots'
      if: ctx.sku != null && ctx.sku =~ /^(aws|gcp|azure)\.snapshot-storage.*/
      tag: set_cost_type_snapshots
  - set:
      field: cost_type
      value: 'inference'
      if: ctx.sku == 'global.inference-chat-input'
      tag: set_cost_type_inference
  - script:
      lang: painless
      tag: classify_serverless_sku
      description: >-
        Serverless-only classification. Sets cost_type, cost_category, is_allocatable,
        and allocation_driver. Drivers: indexing (ingest VCU / Observability-Security
        ingest GB), query (search VCU), storage (retained), ai (inference / ML VCU /
        Agent Builder), synthetics (synthetic pings & executions), none (unallocated).
      source: |
        String sku = ctx.sku != null ? ctx.sku.toString().toLowerCase(Locale.ROOT) : '';
        if (sku == '' || sku == 'none') {
          ctx.cost_type = 'other';
          ctx.cost_category = 'other';
          ctx.is_allocatable = false;
          ctx.allocation_driver = 'none';
          return;
        }

        // Elastic Cloud Billing SKUs follow regional/tier patterns (<csp>.<product>-<metric>_<region>,
        // serverless.<product>.<metric>, or global.<metric>). Any unrecognized future SKU falls through
        // to the default 'other' / 'none' bucket at the end of this script so total invoice spend is preserved.
        // Synthetics (singular 'synthetic-' or plural 'synthetics')
        if (sku.contains('synthetic')) {
          ctx.cost_type = 'synthetics';
          ctx.cost_category = 'platform';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'synthetics';
          return;
        }

        // Agent Builder executions
        if (sku.contains('agent-builder')) {
          ctx.cost_type = 'agent-builder';
          ctx.cost_category = 'platform';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'ai';
          return;
        }

        // Ingest / indexing VCU (any project type, current or future)
        if (sku.contains('-ingest-vcu_') || sku.contains('ingest-vcu') || sku.contains('-ingest-vcu') || sku.contains('ingest.ecu') || sku.contains('ingest_ecu') || sku.contains('ingest.vcu')) {
          ctx.cost_type = 'ingest-vcu';
          ctx.cost_category = 'data_tier';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'indexing';
          return;
        }

        // Search / query VCU (any project type, current or future)
        if (sku.contains('-search-vcu_') || sku.contains('search-vcu') || sku.contains('-search-vcu') || sku.contains('search.ecu') || sku.contains('search_ecu') || sku.contains('search.vcu')) {
          ctx.cost_type = 'search-vcu';
          ctx.cost_category = 'data_tier';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'query';
          return;
        }

        // ML / AI VCU (any project type, current or future)
        if (sku.contains('-ml-vcu_') || sku.contains('ml-vcu') || sku.contains('-ml-vcu') || sku.contains('ml.ecu') || sku.contains('ml_ecu') || sku.contains('ml.vcu') || sku.contains('ml_inference') || sku.contains('.eis')) {
          ctx.cost_type = 'ml-vcu';
          ctx.cost_category = 'platform';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'ai';
          return;
        }

        // Retained storage (any project type, current or future; exclude snapshot-storage SKUs)
        if ((sku.contains('retained') || sku.contains('storage') || sku.contains('retention')) && !sku.contains('snapshot') && ctx.cost_type != 'snapshots') {
          ctx.cost_type = 'retained';
          ctx.cost_category = 'data_tier';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'storage';
          return;
        }

        // Solution-specific ingest/data tier (Observability, Security, Search, etc.)
        if ((sku.contains('serverless') || (!sku.contains('.es.') && !sku.contains('.apm.') && !sku.contains('.kibana.') && !sku.contains('.integrations_server.') && !sku.contains('.integrationsserver.') && !sku.contains('.enterprise_search.') && !sku.contains('.enterprisesearch.')))
            && (sku.contains('ingest') || sku.contains('logs') || sku.contains('metrics')
                || sku.contains('traces') || sku.contains('apm') || sku.contains('siem'))) {
          ctx.cost_type = 'ingest';
          ctx.cost_category = 'data_tier';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'indexing';
          return;
        }

        if (sku.startsWith('serverless.support-')) {
          ctx.cost_type = 'serverless_premium_support';
          ctx.cost_category = 'support';
          ctx.is_allocatable = false;
          ctx.allocation_driver = 'none';
          return;
        }

        if (ctx.cost_type == 'data-transfer' || sku.contains('data-transfer')
            || sku.contains('data-out') || sku.contains('egress')) {
          ctx.cost_type = 'data-transfer';
          ctx.cost_category = 'transfer';
          ctx.is_allocatable = false;
          ctx.allocation_driver = 'none';
          return;
        }
        if (ctx.cost_type == 'snapshots' || sku.contains('snapshot')) {
          ctx.cost_type = 'snapshots';
          ctx.cost_category = 'snapshot';
          ctx.is_allocatable = false;
          ctx.allocation_driver = 'none';
          return;
        }
        if (ctx.cost_type == 'inference' || sku.contains('inference') || sku.contains('llm')) {
          ctx.cost_type = 'inference';
          ctx.cost_category = 'platform';
          ctx.is_allocatable = true;
          ctx.allocation_driver = 'ai';
          return;
        }
        if (sku.contains('workflow')) {
          ctx.cost_type = 'workflows';
          ctx.cost_category = 'platform';
          ctx.is_allocatable = false;
          ctx.allocation_driver = 'none';
          return;
        }
        if (sku.contains('cross-project') || sku.contains('cps')) {
          ctx.cost_type = 'cross-project-search';
          ctx.cost_category = 'platform';
          ctx.is_allocatable = false;
          ctx.allocation_driver = 'none';
          return;
        }

        // Solution-prefix data_tier catch-all for Serverless SKUs
        if (sku.startsWith('observability.') || sku.contains('.observability.')
            || sku.startsWith('oblt.') || sku.contains('.oblt.')
            || sku.startsWith('security.') || sku.contains('.security.')
            || sku.startsWith('sec.') || sku.contains('.sec.')
            || sku.startsWith('vectordb.') || sku.contains('.vectordb.')
            || sku.startsWith('serverless.search.') || sku.startsWith('search.')
            || sku.startsWith('serverless.elasticsearch.') || sku.startsWith('elasticsearch.')) {
          ctx.cost_type = ctx.cost_type != null ? ctx.cost_type : 'serverless_data_tier';
          ctx.cost_category = 'data_tier';
          ctx.is_allocatable = true;
          ctx.allocation_driver = sku.contains('query') ? 'query' : 'indexing';
          return;
        }

        ctx.cost_category = 'other';
        ctx.is_allocatable = false;
        ctx.allocation_driver = 'none';
  - grok:
      field: sku
      ignore_failure: true
      tag: grok_fallback_cost_type
      patterns:
        - "%{WORD}.es.%{WORD:cost_type}.%{GREEDYDATA}"
        - "%{WORD}.%{DATA:cost_type}-vcu_%{GREEDYDATA}"
        - "%{WORD}.%{WORD:cost_type}.%{GREEDYDATA}"
        - "%{WORD}.%{DATA:cost_type}_%{GREEDYDATA}"
      description: Derive a readable fallback cost_type from unknown SKUs
      if: ctx.cost_type == null && ctx.sku != null
on_failure:
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: "pipeline_error"
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
