title: "Chargeback Serverless Billing"
type: metrics
dataset: chargeback_serverless.billing
elasticsearch:
  source_mode: synthetic
streams:
  - input: cel
    title: Serverless Daily Billing
    description: Collect daily billing information from Elasticsearch Service billing API.
    template_path: cel.yml.hbs
    enabled: true
    vars:
      - name: lookbehind
        type: integer
        title: Billing Lookbehind Days
        description: >-
          Number of historical days of billing data to backfill on initial install (default: 60, clamped to 0-365).
        multi: false
        required: true
        show_user: true
        default: 60
      - name: config_effective_from
        type: text
        title: Configuration Effective Start Date (Optional)
        description: >-
          Optional UTC day-boundary start date (YYYY-MM-DD or YYYY-MM-DDT00:00:00Z) when preserving earlier non-overlapping rate periods in serverless_chargeback_conf_lookup. Non-midnight timestamps are rejected because daily billing and usage buckets align to 00:00:00Z. Leave empty to apply the configured rate across the default validity window.
        multi: false
        required: false
        show_user: true
        default: ""
      - name: collect_ess_credits
        type: bool
        title: Collect ESS Credit Commitment Data (for stock ESS Billing Credits dashboard)
        description: >-
          Pulls organization credit commitment line items (/api/v1/billing/organization/{id}/line_items) into metrics-chargeback_serverless.billing-* so standalone deployments can materialize serverless_billing_credits_lookup and expose opt-in compatibility aliases for the stock ESS Billing Credits dashboard.
        multi: false
        required: false
        show_user: true
        default: false
      - name: interval
        type: text
        title: Collection Interval
        description: >-
          Polling interval for the CEL billing stream (default: 1h).
        multi: false
        required: false
        show_user: false
        default: 1h
      - name: tags
        type: text
        title: Tags
        description: List of tags to include in remotely collected billing events.
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - chargeback_serverless
          - billing
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Optional Beat processors applied before events are published.
