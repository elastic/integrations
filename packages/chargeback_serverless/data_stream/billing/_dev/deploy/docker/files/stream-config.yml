                      "total_ecu": 24.0,
                      "quantity": { "value": 24.0 }
                    }
                  ]
                }
              ]
            }
          `}}
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"instances":[]}'

