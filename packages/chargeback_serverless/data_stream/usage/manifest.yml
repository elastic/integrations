title: "Chargeback Serverless Usage"
type: metrics
dataset: chargeback_serverless.usage
elasticsearch:
  source_mode: synthetic
streams:
  - input: cel
    title: Serverless Daily Project & Data Stream Usage
    description: Collect daily project datastream and AI model usage metrics (once a day at 02:00 UTC, single figure per measured entity).
    template_path: cel.yml.hbs
    enabled: true
    vars:
      - name: hub_es_api_key
        type: password
        title: Hub Project Elasticsearch API Key
        description: >-
          Optional Elasticsearch API key for the Hub project if harvesting local _cat/indices.
        multi: false
        required: false
        show_user: false
        secret: true
      - name: project_api_keys
        type: password
        title: Remote Project Elasticsearch API Keys
        description: >-
          Optional comma-separated least-privileged Elasticsearch API keys for remote projects in <project_id>:<encoded_api_key> format.
        multi: false
        required: false
        show_user: false
        secret: true
      - name: interval
        type: text
        title: Collection Interval
        description: >-
          Polling interval for the CEL usage stream (default: 1h).
        multi: false
        required: false
        show_user: false
        default: 1h
