- name: doc_type
  type: keyword
  description: Event type (datastream, ai_model, project_status).
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security).
- name: cluster_name
  type: alias
  path: project_id
  description: Legacy compatibility alias for project_id.
- name: optimized_for
  type: keyword
  description: Serverless optimization profile (general_purpose, vector, etc.).
- name: es_url
  type: keyword
  description: Elasticsearch data plane endpoint URL.
- name: datastream
  type: keyword
  description: Target data stream name.
- name: ds_type
  type: keyword
  description: Data stream type prefix (logs, metrics, traces, other).
- name: ds_namespace
  type: keyword
  description: Data stream namespace suffix.
- name: datastream_sum_indexing_time
  type: long
  description: Indexing time in milliseconds.
- name: datastream_sum_query_time
  type: long
  description: Search query time in milliseconds.
- name: datastream_sum_data_set_store_size
  type: long
  description: Stored dataset size in bytes.
- name: indexing_ecu
  type: double
  description: Project daily allocatable indexing ECU.
- name: query_ecu
  type: double
  description: Project daily allocatable query ECU.
- name: storage_ecu
  type: double
  description: Project daily allocatable storage ECU.
- name: ai_ecu
  type: double
  description: Project daily allocatable AI/ML ECU.
- name: total_ecu
  type: double
  description: Project daily total allocatable ECU.
- name: model_id
  type: keyword
  description: Trained ML model identifier.
- name: task_type
  type: keyword
  description: Inference task type (ingest_inference, query_inference).
- name: inference_count
  type: long
  description: Number of inferences performed.
- name: average_inference_time_ms
  type: double
  description: Average latency per inference in milliseconds.
- name: total_inference_time_ms
  type: long
  description: Total compute time spent on inferences in milliseconds.
- name: last_status
  type: keyword
  description: Project harvest health status (ok, empty_or_unauthorized).
- name: index_count
  type: long
  description: Total number of indices discovered in the project.
- name: updated_at
  type: date
  description: Last successful harvest timestamp.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label.
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
