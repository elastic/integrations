- name: doc_type
  type: keyword
  description: Event type (datastream, ai_model, synthetics_monitor, project_status).
- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security).
- name: optimized_for
  type: keyword
  description: Serverless optimization profile (general_purpose, vector, and others).
- name: es_url
  type: keyword
  description: Elasticsearch data plane endpoint URL.
- name: datastream
  type: keyword
  description: Target data stream name.
- name: ds_type
  type: keyword
  description: Data stream type prefix (logs, metrics, traces, synthetics, other).
- name: ds_dataset
  type: keyword
  description: Data stream dataset name (for example http, icmp, tcp, dns, browser).
- name: ds_namespace
  type: keyword
  description: Data stream namespace suffix.
- name: datastream_sum_indexing_time
  type: long
  description: Indexing time in milliseconds.
- name: datastream_sum_query_time
  type: long
  description: Search query time in milliseconds.
- name: datastream_sum_data_set_store_size
  type: long
  description: Stored dataset size in bytes.
- name: model_id
  type: keyword
  description: Trained ML model identifier.
- name: task_type
  type: keyword
  description: Inference task type (ingest_inference, query_inference).
- name: inference_count
  type: long
  description: Number of inferences performed.
- name: average_inference_time_ms
  type: double
  description: Average latency per inference in milliseconds.
- name: total_inference_time_ms
  type: long
  description: Total compute time spent on inferences in milliseconds.
- name: monitor_id
  type: keyword
  description: Synthetics monitor identifier.
- name: monitor_name
  type: keyword
  description: Synthetics monitor display name.
- name: monitor_type
  type: keyword
  description: Synthetics monitor type (http, icmp, tcp, dns, browser).
- name: monitor_namespace
  type: keyword
  description: Synthetics monitor namespace.
- name: check_count
  type: long
  description: Number of synthetic test check executions.
- name: up_count
  type: long
  description: Number of successful up synthetic checks.
- name: down_count
  type: long
  description: Number of failed down synthetic checks.
- name: locations_count
  type: long
  description: Number of distinct observer locations executing the monitor.
- name: average_duration_ms
  type: double
  description: Average synthetic check duration in milliseconds.
- name: last_status
  type: keyword
  description: Project harvest health status (ok, empty_or_unauthorized, inactive).
- name: api_key_type
  type: keyword
  description: API key credential type used for project harvesting (hub_key, remote_key, missing_key, cloud_billing_only).
- name: synthetics_status
  type: keyword
  description: Synthetics telemetry harvest status (ok, billing_derived, unauthorized, inactive).
- name: index_count
  type: long
  description: Total number of indices discovered in the project.
- name: datastream_count
  type: long
  description: Total number of data streams aggregated in the project.
- name: ai_model_count
  type: long
  description: Total number of trained AI/ML models discovered in the project.
- name: synthetics_monitor_count
  type: long
  description: Total number of Synthetics monitors discovered or attributed in the project.
- name: updated_at
  type: date
  description: Last successful harvest timestamp.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label.
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
