---
description: "Ingest pipeline for Chargeback Serverless usage data stream."
processors:
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      if: ctx.event?.ingested == null
      tag: set_event_ingested
  - date:
      field: period_start
      target_field: "@timestamp"
      formats:
        - ISO8601
      if: ctx.period_start != null
      ignore_failure: true
      tag: restore_period_start_timestamp
  - remove:
      field: period_start
      ignore_missing: true
  - script:
      ignore_failure: true
      lang: painless
      tag: normalize_usage_fields
      source: |
        if (ctx.project_name == null || ctx.project_name == '') {
          ctx.project_name = ctx.project_id;
        }
        if (ctx['@timestamp'] != null && ctx.project_id != null) {
          ctx.composite_key = ZonedDateTime.parse(ctx['@timestamp']).toLocalDate().toString() + '_' + ctx.project_id;
        }
        if (ctx.doc_type == 'datastream' && ctx.datastream != null && ctx.datastream != '') {
          def m = /^(?:partial-)?(?:restored-)?(?:shrink-.{4}-)?\.ds-([a-zA-Z_0-9\-.]+?)(?:-\d{4}\.\d{2}(?:\.\d{2})?)?(?:-\d+)?$/.matcher(ctx.datastream);
          if (m.matches()) {
            ctx.datastream = m.group(1);
          }
          if (ctx.datastream.startsWith('.') || ctx.datastream == 'system' || (ctx.datastream.startsWith('serverless_') && ctx.datastream.endsWith('_lookup'))) {
            ctx.datastream = 'system';
            ctx.ds_type = 'system';
            ctx.ds_namespace = 'system';
            ctx.ds_dataset = 'system';
          } else {
            def parts = ctx.datastream.splitOnToken('-');
            if ((parts[0] == 'logs' || parts[0] == 'metrics' || parts[0] == 'traces' || parts[0] == 'synthetics' || parts[0] == 'profiling') && parts.length >= 3) {
              ctx.ds_type = parts[0];
              ctx.ds_dataset = parts[1];
              def lastPart = parts[parts.length - 1];
              if (/^v?\d+\.\d+(?:\.\d+.*)?$/.matcher(lastPart).matches()) {
                ctx.ds_namespace = 'default';
              } else {
                def nsParts = new ArrayList();
                for (int i = 2; i < parts.length; i++) {
                  nsParts.add(parts[i]);
                }
                ctx.ds_namespace = String.join('-', nsParts);
              }
            } else if (parts.length >= 2 && /^v?\d+\.\d+(?:\.\d+.*)?$/.matcher(parts[parts.length - 1]).matches()) {
              def p0 = parts[0].toLowerCase();
              ctx.ds_type = p0.contains('metric') ? 'metrics' : (p0.contains('apm') || p0.contains('trace') ? 'traces' : (p0.contains('heartbeat') || p0.contains('synth') ? 'synthetics' : (p0.contains('beat') || p0.contains('log') ? 'logs' : 'index')));
              def mid = new ArrayList();
              for (int i = 0; i < parts.length - 1; i++) {
                mid.add(parts[i]);
              }
              ctx.ds_dataset = String.join('-', mid);
              ctx.ds_namespace = 'default';
            } else {
              ctx.ds_type = 'index';
              ctx.ds_dataset = ctx.datastream;
              ctx.ds_namespace = 'default';
            }
          }
        }
