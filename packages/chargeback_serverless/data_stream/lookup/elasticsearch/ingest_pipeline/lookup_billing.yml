---
description: >-
  Chargeback Serverless: build composite_key, classify Serverless SKUs, set
  allocation_driver (indexing | query | storage | ai | synthetics | none), and
  populate ESS Billing compatibility fields on billing lookup rows.
processors:
  - script:
      lang: painless
      tag: set_composite_key
      source: |
        if (ctx.project_name instanceof Map) {
          def picked = null;
          def buckets = ctx.project_name.buckets;
          if (buckets instanceof List && buckets.size() > 0) {
            for (def b : buckets) {
              if (b.key != null && b.key != '' && b.key != ctx.project_id) {
                picked = b.key;
                break;
              }
            }
            if (picked == null && buckets[0].key != null) {
              picked = buckets[0].key;
            }
          } else {
            for (def k : ctx.project_name.keySet()) {
              if (k != null && k != '' && k != ctx.project_id) {
                picked = k;
                break;
              }
            }
            if (picked == null) {
              def keys = new ArrayList(ctx.project_name.keySet());
              if (keys.size() > 0) {
                picked = keys[0];
              }
            }
          }
          ctx.project_name = picked != null ? picked : ctx.project_id;
        }
        if (ctx.project_type instanceof Map) {
          def buckets = ctx.project_type.buckets;
          if (buckets instanceof List && buckets.size() > 0 && buckets[0].key != null) {
            ctx.project_type = buckets[0].key;
          } else {
            def keys = new ArrayList(ctx.project_type.keySet());
            ctx.project_type = keys.size() > 0 ? keys[0] : 'elasticsearch';
          }
        }
        String orgId = '';
        String cRegion = '';
        String bType = '';
        String bKind = '';
        String bUnit = '';
        boolean hasNatSnap = false;
        if (ctx.nat_snapshots instanceof Map || ctx.leg_intervals instanceof Map || ctx.v1_carryover instanceof Map) {
          String sep = Character.toString((char)31);
          Map bestNat = null;
          String bestNatKey = '';
          if (ctx.nat_snapshots instanceof Map && !((Map)ctx.nat_snapshots).isEmpty()) {
            Map natMap = (Map)ctx.nat_snapshots;
            List natKeys = new ArrayList();
            if (natMap.get('buckets') instanceof List) {
              for (def bObj : (List)natMap.get('buckets')) {
                if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                  natKeys.add(((Map)bObj).get('key').toString());
                }
              }
            } else {
              for (def kObj : natMap.keySet()) {
                if (kObj != null) { natKeys.add(kObj.toString()); }
              }
            }
            for (def keyObj : natKeys) {
              String recKey = keyObj.toString();
              List parts = new ArrayList();
              int pStart = 0;
              while (true) {
                int pIdx = recKey.indexOf(sep, pStart);
                if (pIdx < 0) {
                  parts.add(recKey.substring(pStart));
                  break;
                }
                parts.add(recKey.substring(pStart, pIdx));
                pStart = pIdx + 1;
              }
              if (parts.size() < 13) { continue; }
              Map cand = [
                'ing_ts': Long.parseLong(parts.get(0).toString()),
                'total_ecu': Double.parseDouble(parts.get(1).toString()),
                'quantity_value': Double.parseDouble(parts.get(2).toString()),
                'project_name': parts.get(3).toString(),
                'project_type': parts.get(4).toString(),
                'organization_id': parts.get(5).toString(),
                'cloud_region': parts.get(6).toString(),
                'billing_type': parts.get(7).toString(),
                'billing_kind': parts.get(8).toString(),
                'billing_unit': parts.get(9).toString(),
                'conf_chargeable_unit_rate': Double.parseDouble(parts.get(10).toString()),
                'conf_chargeable_unit_rate_unit': parts.get(11).toString(),
                'conf_currency_symbol': parts.get(12).toString()
              ];
              if (bestNat == null) {
                bestNat = cand;
                bestNatKey = recKey;
              } else {
                long cTs = ((Number)cand.get('ing_ts')).longValue();
                long bTs = ((Number)bestNat.get('ing_ts')).longValue();
                double cEcu = ((Number)cand.get('total_ecu')).doubleValue();
                double bEcu = ((Number)bestNat.get('total_ecu')).doubleValue();
                int cPos = (cEcu > 0.0 ? 1 : 0);
                int bPos = (bEcu > 0.0 ? 1 : 0);
                int cMeta = (cand.get('project_name') != '' ? 1 : 0);
                int bMeta = (bestNat.get('project_name') != '' ? 1 : 0);
                if (cTs > bTs || (cTs == bTs && (cPos > bPos || (cPos == bPos && (cMeta > bMeta || (cMeta == bMeta && (cEcu > bEcu || (cEcu == bEcu && recKey.compareTo(bestNatKey) > 0)))))))) {
                  bestNat = cand;
                  bestNatKey = recKey;
                }
              }
            }
          }
          if (bestNat != null) {
            hasNatSnap = true;
            bestNat.remove('ing_ts');
            if (((Number)bestNat.get('conf_chargeable_unit_rate')).doubleValue() < 0.0) {
              bestNat.remove('conf_chargeable_unit_rate');
            }
            ctx.latest_snapshot = bestNat;
          }
          if (ctx.latest_snapshot == null && ctx.leg_intervals instanceof Map && !((Map)ctx.leg_intervals).isEmpty()) {
            Map legMap = (Map)ctx.leg_intervals;
            List ivList = new ArrayList();
            if (legMap.get('buckets') instanceof List) {
              for (def bObj : (List)legMap.get('buckets')) {
                if (bObj instanceof Map) { ivList.add(bObj); }
              }
            } else {
              for (def vObj : legMap.values()) {
                if (vObj instanceof Map) { ivList.add(vObj); }
              }
            }
            List legWinners = new ArrayList();
            for (def ivObj : ivList) {
              if (!(ivObj instanceof Map) || !(((Map)ivObj).get('snaps') instanceof Map)) { continue; }
              Map snapsMap = (Map)((Map)ivObj).get('snaps');
              List snapKeys = new ArrayList();
              if (snapsMap.get('buckets') instanceof List) {
                for (def sbObj : (List)snapsMap.get('buckets')) {
                  if (sbObj instanceof Map && ((Map)sbObj).get('key') != null) {
                    snapKeys.add(((Map)sbObj).get('key').toString());
                  }
                }
              } else {
                for (def skObj : snapsMap.keySet()) {
                  if (skObj != null) { snapKeys.add(skObj.toString()); }
                }
              }
              Map bestRec = null;
              String bestRecKey = '';
              for (def keyObj : snapKeys) {
                String recKey = keyObj.toString();
                List parts = new ArrayList();
                int pStart = 0;
                while (true) {
                  int pIdx = recKey.indexOf(sep, pStart);
                  if (pIdx < 0) {
                    parts.add(recKey.substring(pStart));
                    break;
                  }
                  parts.add(recKey.substring(pStart, pIdx));
                  pStart = pIdx + 1;
                }
                if (parts.size() < 13) { continue; }
                Map cand = [
                  'ing_ts': Long.parseLong(parts.get(0).toString()),
                  'total_ecu': Double.parseDouble(parts.get(1).toString()),
                  'quantity_value': Double.parseDouble(parts.get(2).toString()),
                  'project_name': parts.get(3).toString(),
                  'project_type': parts.get(4).toString(),
                  'organization_id': parts.get(5).toString(),
                  'cloud_region': parts.get(6).toString(),
                  'billing_type': parts.get(7).toString(),
                  'billing_kind': parts.get(8).toString(),
                  'billing_unit': parts.get(9).toString(),
                  'conf_chargeable_unit_rate': Double.parseDouble(parts.get(10).toString()),
                  'conf_chargeable_unit_rate_unit': parts.get(11).toString(),
                  'conf_currency_symbol': parts.get(12).toString()
                ];
                if (bestRec == null) {
                  bestRec = cand;
                  bestRecKey = recKey;
                } else {
                  long cTs = ((Number)cand.get('ing_ts')).longValue();
                  long bTs = ((Number)bestRec.get('ing_ts')).longValue();
                  int cMeta = (cand.get('project_name') != '' ? 1 : 0);
                  int bMeta = (bestRec.get('project_name') != '' ? 1 : 0);
                  double cEcu = ((Number)cand.get('total_ecu')).doubleValue();
                  double bEcu = ((Number)bestRec.get('total_ecu')).doubleValue();
                  if (cTs > bTs || (cTs == bTs && (cMeta > bMeta || (cMeta == bMeta && (cEcu > bEcu || (cEcu == bEcu && recKey.compareTo(bestRecKey) > 0)))))) {
                    bestRec = cand;
                    bestRecKey = recKey;
                  }
                }
              }
              if (bestRec != null) { legWinners.add(bestRec); }
            }
            if (!legWinners.isEmpty()) {
              double sumEcu = 0.0;
              double sumQty = 0.0;
              long bestTs = -1L;
              String pName = '';
              String pType = '';
              String pOrgId = '';
              String pRegion = '';
              String pBType = '';
              String pBKind = '';
              String pBUnit = '';
              double cRate = -1.0;
              String cUnit = '';
              String cSym = '';
              for (def recObj : legWinners) {
                Map rec = (Map)recObj;
                sumEcu += ((Number)rec.get('total_ecu')).doubleValue();
                sumQty += ((Number)rec.get('quantity_value')).doubleValue();
                long rTs = ((Number)rec.get('ing_ts')).longValue();
                boolean isNewer = rTs >= bestTs;
                if (isNewer) { bestTs = rTs; }
                if (rec.get('project_name') != '' && (pName == '' || isNewer)) { pName = rec.get('project_name').toString(); }
                if (rec.get('project_type') != '' && (pType == '' || isNewer)) { pType = rec.get('project_type').toString(); }
                if (rec.get('organization_id') != '' && (pOrgId == '' || isNewer)) { pOrgId = rec.get('organization_id').toString(); }
                if (rec.get('cloud_region') != '' && (pRegion == '' || isNewer)) { pRegion = rec.get('cloud_region').toString(); }
                if (rec.get('billing_type') != '' && (pBType == '' || isNewer)) { pBType = rec.get( 'billing_type').toString(); }
                if (rec.get('billing_kind') != '' && (pBKind == '' || isNewer)) { pBKind = rec.get('billing_kind').toString(); }
                if (rec.get('billing_unit') != '' && (pBUnit == '' || isNewer)) { pBUnit = rec.get('billing_unit').toString(); }
                double rr = ((Number)rec.get('conf_chargeable_unit_rate')).doubleValue();
                if (rr >= 0.0 && (cRate < 0.0 || isNewer)) { cRate = rr; }
                if (rec.get('conf_chargeable_unit_rate_unit') != '' && (cUnit == '' || isNewer)) { cUnit = rec.get('conf_chargeable_unit_rate_unit').toString(); }
                if (rec.get('conf_currency_symbol') != '' && (cSym == '' || isNewer)) { cSym = rec.get('conf_currency_symbol').toString(); }
              }
              Map legOut = [
                'project_name': pName,
                'project_type': pType,
                'total_ecu': sumEcu,
                'quantity_value': sumQty,
                'organization_id': pOrgId,
                'cloud_region': pRegion,
                'billing_type': pBType,
                'billing_kind': pBKind,
                'billing_unit': pBUnit
              ];
              if (cRate >= 0.0) { legOut.put('conf_chargeable_unit_rate', cRate); }
              if (cUnit != '') { legOut.put('conf_chargeable_unit_rate_unit', cUnit); }
              if (cSym != '') { legOut.put('conf_currency_symbol', cSym); }
              ctx.latest_snapshot = legOut;
            }
          }
          if (ctx.latest_snapshot == null && ctx.v1_carryover instanceof Map && !((Map)ctx.v1_carryover).isEmpty()) {
            Map vc = (Map)ctx.v1_carryover;
            List vcKeys = new ArrayList();
            if (vc.get('buckets') instanceof List) {
              for (def bObj : (List)vc.get('buckets')) {
                if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                  vcKeys.add(((Map)bObj).get('key').toString());
                }
              }
            } else {
              for (def kObj : vc.keySet()) {
                if (kObj != null) { vcKeys.add(kObj.toString()); }
              }
            }
            Map bestV1 = null;
            String bestV1Key = '';
            for (def rkObj : vcKeys) {
              String recKey = rkObj.toString();
              List parts = new ArrayList();
              int pStart = 0;
              while (true) {
                int pIdx = recKey.indexOf(sep, pStart);
                if (pIdx < 0) {
                  parts.add(recKey.substring(pStart));
                  break;
                }
                parts.add(recKey.substring(pStart, pIdx));
                pStart = pIdx + 1;
              }
              if (parts.size() < 13) { continue; }
              Map cand = [
                'ing_ts': Long.parseLong(parts.get(0).toString()),
                'total_ecu': Double.parseDouble(parts.get(1).toString()),
                'quantity_value': Double.parseDouble(parts.get(2).toString()),
                'project_name': parts.get(3).toString(),
                'project_type': parts.get(4).toString(),
                'organization_id': parts.get(5).toString(),
                'cloud_region': parts.get(6).toString(),
                'billing_type': parts.get(7).toString(),
                'billing_kind': parts.get(8).toString(),
                'billing_unit': parts.get(9).toString(),
                'conf_chargeable_unit_rate': Double.parseDouble(parts.get(10).toString()),
                'conf_chargeable_unit_rate_unit': parts.get(11).toString(),
                'conf_currency_symbol': parts.get(12).toString()
              ];
              if (bestV1 == null) {
                bestV1 = cand;
                bestV1Key = recKey;
              } else {
                long cTs = ((Number)cand.get('ing_ts')).longValue();
                long bTs = ((Number)bestV1.get('ing_ts')).longValue();
                if (cTs > bTs || (cTs == bTs && recKey.compareTo(bestV1Key) > 0)) {
                  bestV1 = cand;
                  bestV1Key = recKey;
                }
              }
            }
            if (bestV1 != null) {
              bestV1.remove('ing_ts');
              if (((Number)bestV1.get('conf_chargeable_unit_rate')).doubleValue() < 0.0) {
                bestV1.remove('conf_chargeable_unit_rate');
              }
              ctx.latest_snapshot = bestV1;
            }
          }
          ctx.remove('nat_snapshots');
          ctx.remove('leg_intervals');
          ctx.remove('v1_carryover');
        }
        if (ctx.latest_snapshot instanceof Map) {
          def snap = ctx.latest_snapshot;
          if (snap.top instanceof List && snap.top.size() > 0 && snap.top[0] instanceof Map && snap.top[0].metrics instanceof Map) {
            snap = snap.top[0].metrics;
          }
          if (snap.project_name != null && snap.project_name.toString() != '') {
            ctx.project_name = snap.project_name.toString();
          }
          if (snap.project_type != null && snap.project_type.toString() != '') {
            ctx.project_type = snap.project_type.toString();
          }
          if (snap.organization_id != null && snap.organization_id.toString() != '') {
            orgId = snap.organization_id.toString();
          }
          if (snap.cloud_region != null && snap.cloud_region.toString() != '') {
            cRegion = snap.cloud_region.toString();
          }
          if (snap.billing_type != null && snap.billing_type.toString() != '') {
            bType = snap.billing_type.toString();
          }
          if (snap.billing_kind != null && snap.billing_kind.toString() != '') {
            bKind = snap.billing_kind.toString();
          }
          if (snap.billing_unit != null && snap.billing_unit.toString() != '') {
            bUnit = snap.billing_unit.toString();
          }
          if (snap.total_ecu instanceof Number) {
            ctx.total_ecu = ((Number)snap.total_ecu).doubleValue();
          } else if (snap.total_ecu != null && snap.total_ecu.toString() != '') {
            ctx.total_ecu = Double.parseDouble(snap.total_ecu.toString());
          }
          if (snap.quantity_value instanceof Number) {
            ctx.quantity_value = ((Number)snap.quantity_value).doubleValue();
          } else if (snap.quantity_value != null && snap.quantity_value.toString() != '') {
            ctx.quantity_value = Double.parseDouble(snap.quantity_value.toString());
          }
          if (snap.conf_chargeable_unit_rate instanceof Number) {
            ctx.conf_chargeable_unit_rate = ((Number)snap.conf_chargeable_unit_rate).doubleValue();
          } else if (snap.conf_chargeable_unit_rate != null && snap.conf_chargeable_unit_rate.toString() != '') {
            ctx.conf_chargeable_unit_rate = Double.parseDouble(snap.conf_chargeable_unit_rate.toString());
          }
          if (snap.conf_chargeable_unit_rate_unit != null && snap.conf_chargeable_unit_rate_unit.toString() != '') {
            ctx.conf_chargeable_unit_rate_unit = snap.conf_chargeable_unit_rate_unit.toString();
          }
          if (snap.conf_currency_symbol != null && snap.conf_currency_symbol.toString() != '') {
            ctx.conf_currency_symbol = snap.conf_currency_symbol.toString();
          }
          ctx.remove('latest_snapshot');
        }
        if (ctx.conf_chargeable_unit_rate_unit instanceof Map) {
          def buckets = ctx.conf_chargeable_unit_rate_unit.buckets;
          if (buckets instanceof List && buckets.size() > 0 && buckets[0].key != null) {
            ctx.conf_chargeable_unit_rate_unit = buckets[0].key;
          } else {
            def keys = new ArrayList(ctx.conf_chargeable_unit_rate_unit.keySet());
            ctx.conf_chargeable_unit_rate_unit = keys.size() > 0 ? keys[0] : 'USD';
          }
        }
        if (ctx.conf_currency_symbol instanceof Map) {
          def buckets = ctx.conf_currency_symbol.buckets;
          if (buckets instanceof List && buckets.size() > 0 && buckets[0].key != null) {
            ctx.conf_currency_symbol = buckets[0].key;
          } else {
            def keys = new ArrayList(ctx.conf_currency_symbol.keySet());
            ctx.conf_currency_symbol = keys.size() > 0 ? keys[0] : '$';
          }
        }
        if (ctx.conf_chargeable_unit_rate == null) {
          ctx.conf_chargeable_unit_rate = 1.0;
        }
        String uTrim = ctx.conf_chargeable_unit_rate_unit != null ? ctx.conf_chargeable_unit_rate_unit.toString().trim() : '';
        ctx.conf_chargeable_unit_rate_unit = uTrim != '' ? uTrim.toUpperCase(Locale.ROOT) : 'USD';
        String sTrim = ctx.conf_currency_symbol != null ? ctx.conf_currency_symbol.toString().trim() : '';
        if (sTrim == '') {
          String uUp = ctx.conf_chargeable_unit_rate_unit.toString().toUpperCase(Locale.ROOT);
          ctx.conf_currency_symbol = (uUp == 'EUR' ? '€' : (uUp == 'GBP' ? '£' : (uUp == 'ZAR' ? 'R' : '$')));
        } else {
          ctx.conf_currency_symbol = sTrim;
        }
        if (ctx.project_name == null || ctx.project_name == '') {
          ctx.project_name = ctx.project_id;
        }
        if (ctx.project_type == null || ctx.project_type == '') {
          ctx.project_type = 'elasticsearch';
        } else {
          String ptNorm = ctx.project_type.toString().trim().toLowerCase(Locale.ROOT);
          if (ptNorm == 'oblt') { ptNorm = 'observability'; }
          else if (ptNorm == 'sec') { ptNorm = 'security'; }
          else if (ptNorm == 'vector') { ptNorm = 'vectordb'; }
          else if (ptNorm == 'es') { ptNorm = 'elasticsearch'; }
          else if (ptNorm == 'enterprise_search') { ptNorm = 'search'; }
          ctx.project_type = ptNorm;
        }
        if (ctx.has_native_billing == null) {
          ctx.has_native_billing = hasNatSnap;
        }
        if (ctx.total_ecu instanceof Number) {
          ctx.total_chargeable_units = ((Number)ctx.total_ecu).doubleValue();
        }
        if (ctx['@timestamp'] != null && ctx.project_id != null) {
          def ts = ctx['@timestamp'];
          def date = (ts instanceof Number)
            ? Instant.ofEpochMilli(((Number) ts).longValue()).atZone(ZoneOffset.UTC).toLocalDate().toString()
            : ZonedDateTime.parse(ts.toString()).toLocalDate().toString();
          ctx.composite_key = date + '_' + ctx.project_id;
        }

        // Populate ESS Billing compatibility fields for opt-in compatibility aliases
        // (e.g. metrics-ess_billing.billing-chargeback).
        ctx.doc_type = 'billing_line_item';
        ctx.data_stream = ['type': 'metrics', 'dataset': 'ess_billing.billing', 'namespace': 'default'];
        if (ctx.event == null) { ctx.event = [:]; }
        ctx.event.dataset = 'ess_billing.billing';

        String s = ctx.sku != null ? ctx.sku.toString() : '';
        String sLower = s.toLowerCase(Locale.ROOT);
        String resolvedOrg = orgId != '' ? orgId : 'unknown';
        if (ctx.ess == null) { ctx.ess = [:]; }
        if (ctx.ess.billing == null) { ctx.ess.billing = [:]; }
        ctx.ess.billing.organization_id = resolvedOrg;
        ctx.ess.billing.deployment_id = ctx.project_id;
        ctx.ess.billing.deployment_name = ctx.project_name;
        ctx.ess.billing.deployment_type = ctx.project_type;
        ctx.ess.billing.sku = ctx.sku;
        ctx.ess.billing.total_ecu = ctx.total_ecu instanceof Number ? ((Number)ctx.total_ecu).doubleValue() : 0.0;
        ctx.ess.billing.quantity = ['value': ctx.quantity_value instanceof Number ? ((Number)ctx.quantity_value).doubleValue() : 0.0];
        if (bKind != '') {
          ctx.ess.billing.kind = bKind;
        } else if (sLower.contains('.es.') || sLower.contains('.es-') || sLower.startsWith('elasticsearch.') || sLower.startsWith('serverless.elasticsearch.') || sLower.startsWith('es.')) {
          ctx.ess.billing.kind = 'elasticsearch';
        } else if (sLower.startsWith('observability.') || sLower.startsWith('serverless.observability.') || sLower.contains('.observability.') || sLower.startsWith('oblt.')) {
          ctx.ess.billing.kind = 'observability';
        } else if (sLower.startsWith('security.') || sLower.startsWith('serverless.security.') || sLower.contains('.security.') || sLower.startsWith('sec.')) {
          ctx.ess.billing.kind = 'security';
        } else if (sLower.startsWith('vectordb.') || sLower.startsWith('serverless.vectordb.') || sLower.contains('.vectordb.')) {
          ctx.ess.billing.kind = 'vectordb';
        } else if (sLower.startsWith('search.') || sLower.startsWith('serverless.search.')) {
          ctx.ess.billing.kind = 'search';
        } else if (sLower == 'none' && ctx.project_type != null && ctx.project_type != '') {
          ctx.ess.billing.kind = ctx.project_type.toString();
        }
        if (bUnit != '') {
          ctx.billing_unit = bUnit;
          ctx.ess.billing.unit = bUnit;
        } else {
          ctx.remove('billing_unit');
        }
        ctx.remove('billing_type');
        ctx.remove('billing_kind');
        String tLower = bType.toLowerCase(Locale.ROOT);
        if (tLower == '' || tLower == 'vcu' || tLower == 'search ai lake' || tLower == 'synthetics' || tLower == 'data transfer') {
          if (sLower.contains('data-out') || sLower.contains('data-transfer-out') || sLower.contains('egress')) {
            bType = 'data_out';
          } else if (sLower.contains('data-in') || sLower.contains('data-transfer-in') || sLower.contains('ingress')) {
            bType = 'data_in';
          } else if (sLower.contains('snapshot') || sLower.contains('retained') || sLower.contains('storage')) {
            bType = 'storage';
          } else if (sLower.contains('support')) {
            bType = 'support';
          } else if (sLower.contains('vcu') || sLower.contains('complete')) {
            bType = 'capacity';
          } else if ((sLower.contains('_ingest') || sLower.contains('.ingest') || sLower.contains('-ingest')) && !sLower.contains('vcu')) {
            bType = 'ingest';
          } else {
            bType = 'usage';
          }
        }
        ctx.ess.billing.type = bType;

        ctx.cloud = [
          'account': ['id': resolvedOrg],
          'instance': ['id': ctx.project_id, 'name': ctx.project_name],
          'provider': 'serverless'
        ];
        if (cRegion != '') {
          ctx.cloud.region = cRegion;
        }
        Map regionGeo = [
          'gcp-us-central1': ['location': ['lon': -95.8608, 'lat': 41.2619], 'name': 'gcp-us-central1'],
          'gcp-us-east4': ['location': ['lon': -77.4874, 'lat': 39.0438], 'name': 'gcp-us-east4'],
          'gcp-us-west1': ['location': ['lon': -121.1787, 'lat': 45.5946], 'name': 'gcp-us-west1'],
          'gcp-us-west2': ['location': ['lon': -118.2437, 'lat': 34.0522], 'name': 'gcp-us-west2'],
