---
description: "Ingest pipeline for Chargeback Serverless lookup data stream."
processors:
  - pipeline:
      name: '{{ IngestPipeline "billing" }}'
      if: ctx.sku != null
  - pipeline:
      name: '{{ IngestPipeline "realized_pool" }}'
      if: ctx.sku == null && (ctx.indexing_ecu != null || ctx.all_sku_ecu != null)
  - pipeline:
      name: '{{ IngestPipeline "usage" }}'
      if: ctx.sku == null && ctx.indexing_ecu == null && ctx.all_sku_ecu == null
