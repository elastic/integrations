          Map sm = (Map)ctx.status_meta;
          List smEntries = new ArrayList();
          if (sm.get('buckets') instanceof List) {
            for (def bObj : (List)sm.get('buckets')) {
              if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                smEntries.add([((Map)bObj).get('key').toString(), bObj]);
              }
            }
          } else {
            for (def eObj : sm.entrySet()) {
              Map.Entry e = (Map.Entry)eObj;
              smEntries.add([e.getKey().toString(), e.getValue()]);
            }
          }
          long bestUpd = -1L;
          String bestSKey = '';
          List bestSParts = null;
          for (def pairObj : smEntries) {
            List pair = (List)pairObj;
            String recKey = pair.get(0).toString();
            def valObj = pair.get(1);
            List parts = new ArrayList();
            int pStart = 0;
            while (true) {
              int pIdx = recKey.indexOf(sep, pStart);
              if (pIdx < 0) { parts.add(recKey.substring(pStart)); break; }
              parts.add(recKey.substring(pStart, pIdx));
              pStart = pIdx + 1;
            }
            if (parts.size() < 4) { continue; }
            long uMs = 0L;
            try { uMs = Long.parseLong(parts.get(0).toString()); } catch (Exception e) {}
            if (valObj instanceof Map && ((Map)valObj).get('max_upd') instanceof Number) {
              uMs = Math.round(((Number)((Map)valObj).get('max_upd')).doubleValue());
            } else if (valObj instanceof Map && ((Map)valObj).get('max_upd') instanceof Map && ((Map)((Map)valObj).get('max_upd')).get('value') instanceof Number) {
              uMs = Math.round(((Number)((Map)((Map)valObj).get('max_upd')).get('value')).doubleValue());
            }
            if (bestSParts == null || uMs > bestUpd || (uMs == bestUpd && recKey.compareTo(bestSKey) > 0)) {
              bestUpd = uMs;
              bestSKey = recKey;
              bestSParts = parts;
