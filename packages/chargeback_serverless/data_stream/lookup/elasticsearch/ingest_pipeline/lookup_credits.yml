---
description: "Chargeback Serverless: Populate ESS Billing Credits compatibility fields for daily credit commitment snapshots."
processors:
  - script:
      ignore_failure: true
      lang: painless
      tag: ess_billing_credits
      source: |
        if (!ctx.containsKey('latest_credit') && !ctx.containsKey('nat_credits') && !ctx.containsKey('leg_credits') && !ctx.containsKey('snapshot_day') && ctx.ess?.billing instanceof Map) {
          return;
        }
        try {
          DateTimeFormatter fmt = DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'").withZone(ZoneOffset.UTC);
          String orgId = ctx.organization_id != null ? ctx.organization_id.toString() : 'unknown';

          String startIso = null;
          if (ctx.credit_start != null) {
            if (ctx.credit_start instanceof Number) {
              startIso = fmt.format(Instant.ofEpochMilli(((Number)ctx.credit_start).longValue()));
            } else {
              String rawStart = ctx.credit_start.toString().trim();
              if (rawStart != '') {
                try {
                  startIso = fmt.format(ZonedDateTime.parse(rawStart).toInstant());
                } catch (Exception e) {
                  try {
                    startIso = fmt.format(LocalDate.parse(rawStart).atStartOfDay(ZoneOffset.UTC).toInstant());
                  } catch (Exception e2) {}
                }
              }
            }
          }
          String endIso = null;
          if (ctx.credit_end != null) {
            if (ctx.credit_end instanceof Number) {
              endIso = fmt.format(Instant.ofEpochMilli(((Number)ctx.credit_end).longValue()));
            } else {
              String rawEnd = ctx.credit_end.toString().trim();
              if (rawEnd != '') {
                try {
                  endIso = fmt.format(ZonedDateTime.parse(rawEnd).toInstant());
                } catch (Exception e) {
                  try {
                    endIso = fmt.format(LocalDate.parse(rawEnd).atStartOfDay(ZoneOffset.UTC).toInstant());
                  } catch (Exception e2) {}
                }
              }
            }
          }

          double bal = 0.0;
          boolean act = false;
          Long observedAtMs = null;
          double qty = ctx.ecu_quantity instanceof Number ? ((Number)ctx.ecu_quantity).doubleValue() : 0.0;
          if (ctx.nat_credits instanceof Map || ctx.leg_credits instanceof Map) {
            String sep = Character.toString((char)31);
            List natDocs = new ArrayList();
            long maxNatTs = -1L;
            long maxNatIngTs = -1L;
            String latestNatOwner = '';
            if (ctx.nat_credits instanceof Map) {
              Map nm = (Map)ctx.nat_credits;
              List natEntries = new ArrayList();
              if (nm.get('buckets') instanceof List) {
                for (def bObj : (List)nm.get('buckets')) {
                  if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                    natEntries.add([((Map)bObj).get('key').toString(), bObj]);
                  }
                }
              } else {
                for (def eObj : nm.entrySet()) {
                  Map.Entry e = (Map.Entry)eObj;
                  natEntries.add([e.getKey().toString(), e.getValue()]);
                }
              }
              for (def pairObj : natEntries) {
                List pair = (List)pairObj;
                String recKey = pair.get(0).toString();
                def valObj = pair.get(1);
                List parts = new ArrayList();
                int pStart = 0;
                while (true) {
                  int pIdx = recKey.indexOf(sep, pStart);
                  if (pIdx < 0) {
                    parts.add(recKey.substring(pStart));
                    break;
                  }
                  parts.add(recKey.substring(pStart, pIdx));
                  pStart = pIdx + 1;
                }
                if (parts.size() < 6) { continue; }
                long ts = Long.parseLong(parts.get(0).toString());
                long ingTs = Long.parseLong(parts.get(1).toString());
                double cQty = Double.parseDouble(parts.get(2).toString());
                double cBal = Double.parseDouble(parts.get(3).toString());
                boolean cAct = parts.get(4).toString() == '1';
                String owner = parts.get(5).toString();
                String lineId = parts.size() > 6 ? parts.get(6).toString() : '';
                long cnt = 1L;
                if (valObj instanceof Map) {
                  def dc = ((Map)valObj).get('doc_cnt');
                  if (dc instanceof Number) {
                    long rCnt = Math.round(((Number)dc).doubleValue()); cnt = rCnt > 1L ? rCnt : 1L;
                  } else if (dc instanceof Map && ((Map)dc).get('value') instanceof Number) {
                    long rCnt = Math.round(((Number)((Map)dc).get('value')).doubleValue()); cnt = rCnt > 1L ? rCnt : 1L;
                  }
                }
                natDocs.add([ts, ingTs, cQty, cBal, cAct, owner, lineId, cnt]);
                if (ts > maxNatTs || (ts == maxNatTs && (ingTs > maxNatIngTs || (ingTs == maxNatIngTs && owner.compareTo(latestNatOwner) > 0)))) {
                  maxNatTs = ts;
                  maxNatIngTs = ingTs;
                  latestNatOwner = owner;
                }
              }
            }
            long maxNatPollIngTs = -1L;
            for (def ndObj : natDocs) {
              List nd = (List)ndObj;
              long nTs = ((Number)nd.get(0)).longValue();
              long nIngTs = ((Number)nd.get(1)).longValue();
              String nOwner = nd.get(5).toString();
              String nLineId = nd.get(6).toString().trim();
              if (nLineId == '' && nOwner.equals(latestNatOwner) && (maxNatTs - nTs) <= 100L && nIngTs > maxNatPollIngTs) {
                maxNatPollIngTs = nIngTs;
              }
            }
            Map latestNatItems = new LinkedHashMap();
            List unkeyedNatItems = new ArrayList();
            for (def ndObj : natDocs) {
              List nd = (List)ndObj;
              long nTs = ((Number)nd.get(0)).longValue();
              long nIngTs = ((Number)nd.get(1)).longValue();
              String nOwner = nd.get(5).toString();
              if (!nOwner.equals(latestNatOwner) || (maxNatTs - nTs) > 100L) { continue; }
              double nQty = ((Number)nd.get(2)).doubleValue();
              double nBal = ((Number)nd.get(3)).doubleValue();
              boolean nAct = Boolean.TRUE.equals(nd.get(4));
              String nLineId = nd.get(6).toString().trim();
              long nCnt = ((Number)nd.get(7)).longValue();
              if (nLineId != '') {
                String dedupKey = 'id:' + nLineId;
                List prev = (List)latestNatItems.get(dedupKey);
                if (prev == null || nIngTs >= ((Number)prev.get(0)).longValue()) {
                  latestNatItems.put(dedupKey, [nIngTs, nQty, nBal, nAct]);
                }
              } else if ((maxNatPollIngTs - nIngTs) <= 2000L) {
                unkeyedNatItems.add([nIngTs, nQty * (double)nCnt, nBal * (double)nCnt, nAct]);
              }
            }
            boolean hasNat = !latestNatItems.isEmpty() || !unkeyedNatItems.isEmpty();
            if (hasNat) {
              int natActCount = 0; double natActQty = 0.0; double natActBal = 0.0; double natAllQty = 0.0; double natAllBal = 0.0;
              List allNat = new ArrayList(latestNatItems.values());
              allNat.addAll(unkeyedNatItems);
              for (def niObj : allNat) {
                List ni = (List)niObj;
                double nQty = ((Number)ni.get(1)).doubleValue();
                double nBal = ((Number)ni.get(2)).doubleValue();
                boolean nAct = Boolean.TRUE.equals(ni.get(3));
                natAllQty += nQty; natAllBal += nBal;
                if (nAct) { natActCount += 1; natActQty += nQty; natActBal += nBal; }
              }
              act = natActCount > 0;
              qty = act ? natActQty : natAllQty;
              bal = act ? natActBal : natAllBal;
              if (maxNatTs > 0L) { observedAtMs = Long.valueOf(maxNatTs); }
            } else if (ctx.leg_credits instanceof Map) {
              List legDocs = new ArrayList();
              long maxLegTs = -1L;
              long maxLegIngTs = -1L;
              String latestLegOwner = '';
              Map lm = (Map)ctx.leg_credits;
              List legEntries = new ArrayList();
              if (lm.get('buckets') instanceof List) {
                for (def bObj : (List)lm.get('buckets')) {
                  if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                    legEntries.add([((Map)bObj).get('key').toString(), bObj]);
                  }
                }
              } else {
                for (def eObj : lm.entrySet()) {
                  Map.Entry e = (Map.Entry)eObj;
                  legEntries.add([e.getKey().toString(), e.getValue()]);
                }
              }
              for (def pairObj : legEntries) {
                List pair = (List)pairObj;
                String recKey = pair.get(0).toString();
                def valObj = pair.get(1);
                List parts = new ArrayList();
                int pStart = 0;
                while (true) {
                  int pIdx = recKey.indexOf(sep, pStart);
                  if (pIdx < 0) {
                    parts.add(recKey.substring(pStart));
                    break;
                  }
                  parts.add(recKey.substring(pStart, pIdx));
                  pStart = pIdx + 1;
                }
                if (parts.size() < 6) { continue; }
                long ts = Long.parseLong(parts.get(0).toString());
                long ingTs = Long.parseLong(parts.get(1).toString());
                double cQty = Double.parseDouble(parts.get(2).toString());
                double cBal = Double.parseDouble(parts.get(3).toString());
                boolean cAct = parts.get(4).toString() == '1';
                String owner = parts.get(5).toString();
                String lineId = parts.size() > 6 ? parts.get(6).toString() : '';
                long cnt = 1L;
                if (valObj instanceof Map) {
                  def dc = ((Map)valObj).get('doc_cnt');
                  if (dc instanceof Number) {
                    long rCnt = Math.round(((Number)dc).doubleValue()); cnt = rCnt > 1L ? rCnt : 1L;
                  } else if (dc instanceof Map && ((Map)dc).get('value') instanceof Number) {
                    long rCnt = Math.round(((Number)((Map)dc).get('value')).doubleValue()); cnt = rCnt > 1L ? rCnt : 1L;
                  }
                }
                legDocs.add([ts, ingTs, cQty, cBal, cAct, owner, lineId, cnt]);
                if (ts > maxLegTs || (ts == maxLegTs && (ingTs > maxLegIngTs || (ingTs == maxLegIngTs && owner.compareTo(latestLegOwner) > 0)))) {
                  maxLegTs = ts;
                  maxLegIngTs = ingTs;
                  latestLegOwner = owner;
                }
              }
              long maxLegPollIngTs = -1L;
              for (def ldObj : legDocs) {
                List ld = (List)ldObj;
                long lTs = ((Number)ld.get(0)).longValue();
                long lIngTs = ((Number)ld.get(1)).longValue();
                String lOwner = ld.get(5).toString();
                String lLineId = ld.get(6).toString().trim();
                if (lLineId == '' && lOwner.equals(latestLegOwner) && (maxLegTs - lTs) <= 5000L && lIngTs > maxLegPollIngTs) {
                  maxLegPollIngTs = lIngTs;
                }
              }
              Map latestLegKeyed = new LinkedHashMap();
              List unkeyedLegItems = new ArrayList();
              for (def ldObj : legDocs) {
                List ld = (List)ldObj;
                long lTs = ((Number)ld.get(0)).longValue();
                long lIngTs = ((Number)ld.get(1)).longValue();
                String lOwner = ld.get(5).toString();
                if (!lOwner.equals(latestLegOwner) || (maxLegTs - lTs) > 5000L) { continue; }
                double lQty = ((Number)ld.get(2)).doubleValue();
                double lBal = ((Number)ld.get(3)).doubleValue();
                boolean lAct = Boolean.TRUE.equals(ld.get(4));
                String lLineId = ld.get(6).toString().trim();
                long lCnt = ((Number)ld.get(7)).longValue();
                if (lLineId != '') {
                  String legDedupKey = 'id:' + lLineId;
                  List prevLeg = (List)latestLegKeyed.get(legDedupKey);
                  if (prevLeg == null || lIngTs >= ((Number)prevLeg.get(0)).longValue()) {
                    latestLegKeyed.put(legDedupKey, [lIngTs, lQty, lBal, lAct]);
                  }
                } else if ((maxLegPollIngTs - lIngTs) <= 2000L) {
                  unkeyedLegItems.add([lIngTs, lQty * (double)lCnt, lBal * (double)lCnt, lAct]);
                }
              }
              List allLeg = new ArrayList(latestLegKeyed.values());
              allLeg.addAll(unkeyedLegItems);
              if (!allLeg.isEmpty()) {
                int legActCount = 0; double legActQty = 0.0; double legActBal = 0.0; double legAllQty = 0.0; double legAllBal = 0.0;
                for (def liObj : allLeg) {
                  List li = (List)liObj;
                  double lQty = ((Number)li.get(1)).doubleValue();
                  double lBal = ((Number)li.get(2)).doubleValue();
                  boolean lAct = Boolean.TRUE.equals(li.get(3));
                  legAllQty += lQty; legAllBal += lBal;
                  if (lAct) { legActCount += 1; legActQty += lQty; legActBal += lBal; }
                }
                act = legActCount > 0;
                qty = act ? legActQty : legAllQty;
                bal = act ? legActBal : legAllBal;
                if (maxLegTs > 0L) { observedAtMs = Long.valueOf(maxLegTs); }
              }
            }
          } else if (ctx.latest_credit instanceof Map) {
            if (ctx.latest_credit.ecu_quantity instanceof Number) {
              qty = ((Number)ctx.latest_credit.ecu_quantity).doubleValue();
            }
            if (ctx.latest_credit.ecu_balance instanceof Number) {
              bal = ((Number)ctx.latest_credit.ecu_balance).doubleValue();
            }
            if (ctx.latest_credit.active != null) {
              act = ctx.latest_credit.active.toString().equalsIgnoreCase('true');
            }
            if (ctx.latest_credit.observed_at instanceof Number && ((Number)ctx.latest_credit.observed_at).longValue() > 0L) {
              observedAtMs = Long.valueOf(((Number)ctx.latest_credit.observed_at).longValue());
            }
          }
          if (ctx.snapshot_day != null) {
            if (ctx.snapshot_day instanceof Number) {
              ctx['@timestamp'] = fmt.format(Instant.ofEpochMilli(((Number)ctx.snapshot_day).longValue()));
            } else {
              String rawDay = ctx.snapshot_day.toString().trim();
              if (rawDay != '') {
                try {
                  ctx['@timestamp'] = fmt.format(ZonedDateTime.parse(rawDay).toInstant());
                } catch (Exception e) {
                  try {
                    ctx['@timestamp'] = fmt.format(LocalDate.parse(rawDay).atStartOfDay(ZoneOffset.UTC).toInstant());
                  } catch (Exception e2) {}
                }
              }
            }
          } else if (observedAtMs != null) {
            ctx['@timestamp'] = fmt.format(Instant.ofEpochMilli(observedAtMs.longValue()));
          }

          ctx.data_stream = ['type': 'metrics', 'dataset': 'ess_billing.credits', 'namespace': 'default'];
          if (ctx.event == null) { ctx.event = [:]; }
          ctx.event.dataset = 'ess_billing.credits';
          ctx.cloud = ['account': ['id': orgId]];
          ctx.ess = [
            'billing': [
              'organization_id': orgId,
              'active': act,
              'ecu_balance': bal,
              'ecu_quantity': qty
            ]
          ];
          if (ctx.credit_type != null && ctx.credit_type.toString() != '') {
            ctx.ess.billing.type = ctx.credit_type.toString();
          }
          if (startIso != null) {
            ctx.ess.billing.start = startIso;
          }
          if (endIso != null) {
            ctx.ess.billing.end = endIso;
          }
        } catch (Exception e) {
          for (String tmp : ['snapshot_day', 'organization_id', 'credit_start', 'credit_end', 'credit_type', 'ecu_quantity', 'latest_credit', 'nat_credits', 'leg_credits']) {
            ctx.remove(tmp);
          }
          throw e;
        }
        for (String tmp : ['snapshot_day', 'organization_id', 'credit_start', 'credit_end', 'credit_type', 'ecu_quantity', 'latest_credit', 'nat_credits', 'leg_credits']) {
          ctx.remove(tmp);
        }
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      description: '[Fleet] Pipeline for Chargeback Serverless lookup destination rows'
      ignore_missing_pipeline: true
      name: logs-chargeback_serverless.lookup@custom
      tag: lookup_custom_pipeline
  - pipeline:
      description: '[Fleet] Pipeline for Chargeback Serverless credits lookup destination rows'
      ignore_missing_pipeline: true
      name: logs-chargeback_serverless.lookup-credits@custom
      tag: lookup_credits_custom_pipeline
on_failure:
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: "pipeline_error"
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
