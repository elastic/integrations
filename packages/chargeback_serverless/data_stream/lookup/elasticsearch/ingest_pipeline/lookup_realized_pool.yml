---
description: >-
  Chargeback Serverless: realized pool lookup — set composite_key and compute
  daily allocatable ECU pools (indexing_ecu, query_ecu, storage_ecu, ai_ecu).
processors:
  - script:
      lang: painless
      tag: set_realized_pool_fields
      source: |
        if (ctx['@timestamp'] != null && ctx.project_id != null) {
          def ts = ctx['@timestamp'];
          def date = (ts instanceof Number)
            ? Instant.ofEpochMilli(((Number) ts).longValue()).atZone(ZoneOffset.UTC).toLocalDate().toString()
            : ZonedDateTime.parse(ts.toString()).toLocalDate().toString();
          ctx.composite_key = date + '_' + ctx.project_id;
        }
        double idx = 0.0;
        if (ctx.indexing_ecu instanceof Map) {
          def v = ctx.indexing_ecu.val;
          if (v instanceof Map && v.value != null) {
            idx = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            idx = ((Number)v).doubleValue();
          }
        } else if (ctx.indexing_ecu instanceof Number) {
          idx = ((Number)ctx.indexing_ecu).doubleValue();
        }
        double qry = 0.0;
        if (ctx.query_ecu instanceof Map) {
          def v = ctx.query_ecu.val;
          if (v instanceof Map && v.value != null) {
            qry = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            qry = ((Number)v).doubleValue();
          }
        } else if (ctx.query_ecu instanceof Number) {
          qry = ((Number)ctx.query_ecu).doubleValue();
        }
        double stg = 0.0;
        if (ctx.storage_ecu instanceof Map) {
          def v = ctx.storage_ecu.val;
          if (v instanceof Map && v.value != null) {
            stg = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            stg = ((Number)v).doubleValue();
          }
        } else if (ctx.storage_ecu instanceof Number) {
          stg = ((Number)ctx.storage_ecu).doubleValue();
        }
        double ai = 0.0;
        if (ctx.ai_ecu instanceof Map) {
          def v = ctx.ai_ecu.val;
          if (v instanceof Map && v.value != null) {
            ai = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            ai = ((Number)v).doubleValue();
          }
        } else if (ctx.ai_ecu instanceof Number) {
          ai = ((Number)ctx.ai_ecu).doubleValue();
        }
        double syn = 0.0;
        if (ctx.synthetics_ecu instanceof Map) {
          def v = ctx.synthetics_ecu.val;
          if (v instanceof Map && v.value != null) {
            syn = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            syn = ((Number)v).doubleValue();
          }
        } else if (ctx.synthetics_ecu instanceof Number) {
          syn = ((Number)ctx.synthetics_ecu).doubleValue();
        }
        double syn_pings = 0.0;
        if (ctx.synthetics_pings_ecu instanceof Map) {
          def v = ctx.synthetics_pings_ecu.val;
          if (v instanceof Map && v.value != null) {
            syn_pings = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            syn_pings = ((Number)v).doubleValue();
          }
        } else if (ctx.synthetics_pings_ecu instanceof Number) {
          syn_pings = ((Number)ctx.synthetics_pings_ecu).doubleValue();
        }
        double syn_exec = 0.0;
        if (ctx.synthetics_executions_ecu instanceof Map) {
          def v = ctx.synthetics_executions_ecu.val;
          if (v instanceof Map && v.value != null) {
            syn_exec = ((Number)v.value).doubleValue();
          } else if (v instanceof Number) {
            syn_exec = ((Number)v).doubleValue();
          }
        } else if (ctx.synthetics_executions_ecu instanceof Number) {
          syn_exec = ((Number)ctx.synthetics_executions_ecu).doubleValue();
        }
        ctx.indexing_ecu = idx;
        ctx.query_ecu = qry;
        ctx.storage_ecu = stg;
        ctx.ai_ecu = ai;
        ctx.synthetics_ecu = syn;
        ctx.synthetics_pings_ecu = syn_pings;
        ctx.synthetics_executions_ecu = syn_exec;
        double cap = idx + qry + stg;
        ctx.data_tier_capacity_ecu = cap;
        ctx.realized_chargeable_units = cap;
        ctx.total_chargeable_units = cap + ai + syn;
        ctx.total_ecu = cap + ai + syn;
        double all_ecu = cap + ai + syn;
        if (ctx.all_sku_ecu instanceof Map) {
          def v = ctx.all_sku_ecu.value;
          if (v instanceof Number) {
            all_ecu = ((Number)v).doubleValue();
          }
        } else if (ctx.all_sku_ecu instanceof Number) {
          all_ecu = ((Number)ctx.all_sku_ecu).doubleValue();
        }
        ctx.all_sku_ecu = all_ecu;
        String sep = Character.toString((char)31);
        boolean hasRawPool = false;
        if (ctx.pool_meta instanceof Map) {
          Map pm = (Map)ctx.pool_meta;
          List entries = new ArrayList();
          if (pm.get('buckets') instanceof List) {
            for (def bObj : (List)pm.get('buckets')) {
              if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                entries.add([((Map)bObj).get('key').toString(), bObj]);
              }
            }
          } else {
            for (def eObj : pm.entrySet()) {
              Map.Entry e = (Map.Entry)eObj;
              entries.add([e.getKey().toString(), e.getValue()]);
            }
          }
          long bestIng = -1L;
          int bestPosFlag = -1;
          boolean anyNatBill = false;
          String bestKey = '';
          List bestParts = null;
          for (def pairObj : entries) {
            List pair = (List)pairObj;
            String recKey = pair.get(0).toString();
            def valObj = pair.get(1);
            List parts = new ArrayList();
            int ps = 0;
            while (true) {
              int pi = recKey.indexOf(sep, ps);
              if (pi < 0) { parts.add(recKey.substring(ps)); break; }
              parts.add(recKey.substring(ps, pi));
              ps = pi + 1;
            }
            if (parts.size() < 7) { continue; }
            long iMs = 0L;
            try { iMs = Long.parseLong(parts.get(0).toString()); } catch (Exception e) {}
            if (valObj instanceof Map && ((Map)valObj).get('max_ing') instanceof Number) {
              iMs = Math.round(((Number)((Map)valObj).get('max_ing')).doubleValue());
            } else if (valObj instanceof Map && ((Map)valObj).get('max_ing') instanceof Map && ((Map)((Map)valObj).get('max_ing')).get('value') instanceof Number) {
              iMs = Math.round(((Number)((Map)((Map)valObj).get('max_ing')).get('value')).doubleValue());
            }
            int posFlag = (parts.size() >= 8 && '1'.equals(parts.get(7).toString())) ? 1 : 0;
            if (parts.size() >= 9 && '1'.equals(parts.get(8).toString())) { anyNatBill = true; }
            if (bestParts == null || iMs > bestIng || (iMs == bestIng && (posFlag > bestPosFlag || (posFlag == bestPosFlag && recKey.compareTo(bestKey) > 0)))) {
              bestIng = iMs;
              bestPosFlag = posFlag;
              bestKey = recKey;
              bestParts = parts;
            }
          }
          if (bestParts != null) {
            hasRawPool = true;
            if (ctx.has_native_billing == null) { ctx.has_native_billing = anyNatBill; }
            String pName = bestParts.get(1).toString();
            String pType = bestParts.get(2).toString();
            String dGrp = bestParts.get(3).toString();
            String pRate = bestParts.get(4).toString();
            String pUnit = bestParts.get(5).toString();
            String pSym = bestParts.get(6).toString();
            if (pName != '' && pName != 'null') { ctx.project_name = pName; }
            if (pType != '' && pType != 'null') { ctx.project_type = pType; }
            ctx.deployment_group = (dGrp == 'null') ? '' : dGrp;
            try {
              double cr = Double.parseDouble(pRate);
              if (cr >= 0.0) { ctx.conf_chargeable_unit_rate = cr; }
            } catch (Exception e) {}
            if (pUnit != '' && pUnit != 'null') { ctx.conf_chargeable_unit_rate_unit = pUnit; }
            if (pSym != '' && pSym != 'null') { ctx.conf_currency_symbol = pSym; }
          }
          ctx.remove('pool_meta');
        }
        if (ctx.latest_currency instanceof Map) {
          hasRawPool = true;
          def curr = ctx.latest_currency;
          if (curr.top instanceof List && curr.top.size() > 0 && curr.top[0] instanceof Map && curr.top[0].metrics instanceof Map) {
            curr = curr.top[0].metrics;
          }
          if (curr.project_name != null && curr.project_name.toString() != '' && curr.project_name.toString() != 'null') {
            ctx.project_name = curr.project_name.toString();
          }
          if (curr.project_type != null && curr.project_type.toString() != '' && curr.project_type.toString() != 'null') {
            ctx.project_type = curr.project_type.toString();
          }
          if (curr.containsKey('deployment_group')) {
            ctx.deployment_group = (curr.deployment_group != null && curr.deployment_group.toString() != 'null')
              ? curr.deployment_group.toString()
              : '';
          }
          if (curr.conf_chargeable_unit_rate instanceof Number) {
            ctx.conf_chargeable_unit_rate = ((Number)curr.conf_chargeable_unit_rate).doubleValue();
          } else if (curr.conf_chargeable_unit_rate != null && curr.conf_chargeable_unit_rate.toString() != '' && curr.conf_chargeable_unit_rate.toString() != 'null') {
            ctx.conf_chargeable_unit_rate = Double.parseDouble(curr.conf_chargeable_unit_rate.toString());
          }
          if (curr.conf_chargeable_unit_rate_unit != null && curr.conf_chargeable_unit_rate_unit.toString() != 'null') {
            ctx.conf_chargeable_unit_rate_unit = curr.conf_chargeable_unit_rate_unit.toString();
          }
          if (curr.conf_currency_symbol != null && curr.conf_currency_symbol.toString() != 'null') {
            ctx.conf_currency_symbol = curr.conf_currency_symbol.toString();
          }
          ctx.remove('latest_currency');
        }
        if (ctx.v1_carryover instanceof Map) {
          if (!hasRawPool) {
            Map vc = (Map)ctx.v1_carryover;
            List vEntries = new ArrayList();
            if (vc.get('buckets') instanceof List) {
              for (def bObj : (List)vc.get('buckets')) {
                if (bObj instanceof Map && ((Map)bObj).get('key') != null) {
                  vEntries.add([((Map)bObj).get('key').toString(), bObj]);
                }
              }
            } else {
              for (def eObj : vc.entrySet()) {
                Map.Entry e = (Map.Entry)eObj;
                vEntries.add([e.getKey().toString(), e.getValue()]);
              }
            }
            long bestIng = -1L;
            String bestKey = '';
            List bestParts = null;
            for (def pairObj : vEntries) {
              List pair = (List)pairObj;
              String recKey = pair.get(0).toString();
              def valObj = pair.get(1);
              List parts = new ArrayList();
              int ps = 0;
              while (true) {
                int pi = recKey.indexOf(sep, ps);
                if (pi < 0) { parts.add(recKey.substring(ps)); break; }
                parts.add(recKey.substring(ps, pi));
                ps = pi + 1;
              }
              if (parts.size() < 15) { continue; }
              long iMs = 0L;
              try { iMs = Long.parseLong(parts.get(0).toString()); } catch (Exception e) {}
              if (valObj instanceof Map && ((Map)valObj).get('max_ing') instanceof Number) {
                iMs = Math.round(((Number)((Map)valObj).get('max_ing')).doubleValue());
              } else if (valObj instanceof Map && ((Map)valObj).get('max_ing') instanceof Map && ((Map)((Map)valObj).get('max_ing')).get('value') instanceof Number) {
                iMs = Math.round(((Number)((Map)((Map)valObj).get('max_ing')).get('value')).doubleValue());
              }
              if (bestParts == null || iMs > bestIng || (iMs == bestIng && recKey.compareTo(bestKey) > 0)) {
                bestIng = iMs;
                bestKey = recKey;
                bestParts = parts;
              }
            }
            if (bestParts != null) {
              try { idx = Double.parseDouble(bestParts.get(1).toString()); } catch (Exception e) {}
              try { qry = Double.parseDouble(bestParts.get(2).toString()); } catch (Exception e) {}
              try { stg = Double.parseDouble(bestParts.get(3).toString()); } catch (Exception e) {}
              try { ai = Double.parseDouble(bestParts.get(4).toString()); } catch (Exception e) {}
              try { syn = Double.parseDouble(bestParts.get(5).toString()); } catch (Exception e) {}
              try { syn_pings = Double.parseDouble(bestParts.get(6).toString()); } catch (Exception e) {}
              try { syn_exec = Double.parseDouble(bestParts.get(7).toString()); } catch (Exception e) {}
              try { all_ecu = Double.parseDouble(bestParts.get(8).toString()); } catch (Exception e) {}
              ctx.indexing_ecu = idx;
              ctx.query_ecu = qry;
              ctx.storage_ecu = stg;
              ctx.ai_ecu = ai;
              ctx.synthetics_ecu = syn;
              ctx.synthetics_pings_ecu = syn_pings;
              ctx.synthetics_executions_ecu = syn_exec;
              cap = idx + qry + stg;
              ctx.data_tier_capacity_ecu = cap;
              ctx.realized_chargeable_units = cap;
              ctx.total_chargeable_units = cap + ai + syn;
              ctx.total_ecu = cap + ai + syn;
              ctx.all_sku_ecu = all_ecu;
              String pName = bestParts.get(9).toString();
              String pType = bestParts.get(10).toString();
              String dGrp = bestParts.get(11).toString();
              String pRate = bestParts.get(12).toString();
              String pUnit = bestParts.get(13).toString();
              String pSym = bestParts.get(14).toString();
              if (pName != '' && pName != 'null') { ctx.project_name = pName; }
              if (pType != '' && pType != 'null') { ctx.project_type = pType; }
              ctx.deployment_group = (dGrp == 'null') ? '' : dGrp;
              try {
                double cr = Double.parseDouble(pRate);
                if (cr >= 0.0) { ctx.conf_chargeable_unit_rate = cr; }
              } catch (Exception e) {}
              if (pUnit != '' && pUnit != 'null') { ctx.conf_chargeable_unit_rate_unit = pUnit; }
              if (pSym != '' && pSym != 'null') { ctx.conf_currency_symbol = pSym; }
            }
          }
          ctx.remove('v1_carryover');
        }
        if (ctx.project_name == null || ctx.project_name == '' || ctx.project_name == 'null') {
          ctx.project_name = ctx.project_id;
        }
        if (ctx.project_type == null || ctx.project_type == '' || ctx.project_type == 'null') {
          ctx.project_type = 'elasticsearch';
        }
        if (ctx.deployment_group == null || ctx.deployment_group == 'null') {
          ctx.deployment_group = '';
        }
        if (ctx.conf_chargeable_unit_rate_unit instanceof Map) {
          def buckets = ctx.conf_chargeable_unit_rate_unit.buckets;
          if (buckets instanceof List && buckets.size() > 0 && buckets[0].key != null) {
            ctx.conf_chargeable_unit_rate_unit = buckets[0].key;
          } else {
            def keys = new ArrayList(ctx.conf_chargeable_unit_rate_unit.keySet());
            ctx.conf_chargeable_unit_rate_unit = keys.size() > 0 ? keys[0] : null;
          }
        }
        if (ctx.conf_currency_symbol instanceof Map) {
          def buckets = ctx.conf_currency_symbol.buckets;
          if (buckets instanceof List && buckets.size() > 0 && buckets[0].key != null) {
            ctx.conf_currency_symbol = buckets[0].key;
          } else {
            def keys = new ArrayList(ctx.conf_currency_symbol.keySet());
            ctx.conf_currency_symbol = keys.size() > 0 ? keys[0] : null;
          }
        }
        if (ctx.conf_chargeable_unit_rate instanceof Map) {
          def v = ctx.conf_chargeable_unit_rate.value;
          ctx.conf_chargeable_unit_rate = v != null ? ((Number)v).doubleValue() : 1.0;
        }
        if (ctx.conf_chargeable_unit_rate == null) {
          ctx.conf_chargeable_unit_rate = 1.0;
        }
        String uTrim = ctx.conf_chargeable_unit_rate_unit != null ? ctx.conf_chargeable_unit_rate_unit.toString().trim() : '';
        ctx.conf_chargeable_unit_rate_unit = uTrim != '' ? uTrim.toUpperCase(Locale.ROOT) : 'USD';
        String sTrim = ctx.conf_currency_symbol != null ? ctx.conf_currency_symbol.toString().trim() : '';
        if (sTrim == '') {
          String uUp = ctx.conf_chargeable_unit_rate_unit.toString().toUpperCase(Locale.ROOT);
          ctx.conf_currency_symbol = (uUp == 'EUR' ? '€' : (uUp == 'GBP' ? '£' : (uUp == 'ZAR' ? 'R' : '$')));
        } else {
          ctx.conf_currency_symbol = sTrim;
        }
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      description: '[Fleet] Pipeline for Chargeback Serverless lookup destination rows'
      ignore_missing_pipeline: true
      name: logs-chargeback_serverless.lookup@custom
      tag: lookup_custom_pipeline
  - pipeline:
      description: '[Fleet] Pipeline for Chargeback Serverless realized_pool lookup destination rows'
      ignore_missing_pipeline: true
      name: logs-chargeback_serverless.lookup-realized_pool@custom
      tag: lookup_realized_pool_custom_pipeline
on_failure:
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: "pipeline_error"
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
