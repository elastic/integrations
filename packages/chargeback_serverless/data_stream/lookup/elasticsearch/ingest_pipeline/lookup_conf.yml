---
description: Post-process Chargeback Serverless configuration from Fleet configuration snapshot events while preserving manual or historical rows when Fleet sync is inactive.
processors:
  - script:
      description: Gate on active Fleet sync marker and validate rate, currency, symbol, and effective start date
      lang: painless
      tag: process_chargeback_conf
      source: |
        // Pass manual operator documents (without transform 'snapshots' output) straight through
        // so operators can update rates directly via POST serverless_chargeback_conf_lookup/_update/config.
        if (!ctx.containsKey('snapshots')) {
          if (ctx.config_join_key == null || ctx.config_join_key.toString().trim() == '') {
            ctx.config_join_key = 'chargeback_config';
          }
          if (ctx.conf_chargeable_unit_rate_unit != null) {
            String uTrim = ctx.conf_chargeable_unit_rate_unit.toString().trim();
            if (uTrim == '') { ctx.remove('conf_chargeable_unit_rate_unit'); }
            else { ctx.conf_chargeable_unit_rate_unit = uTrim.toUpperCase(Locale.ROOT); }
          }
          if (ctx.conf_currency_symbol != null) {
            String sTrim = ctx.conf_currency_symbol.toString().trim();
            if (sTrim == '') { ctx.remove('conf_currency_symbol'); }
            else { ctx.conf_currency_symbol = sTrim; }
          }
          return;
        }
        ctx._from_transform = true;
        Map snapRoot = null;
        if (ctx.snapshots instanceof Map) {
          snapRoot = (ctx.snapshots.latest instanceof Map) ? (Map)ctx.snapshots.latest : (Map)ctx.snapshots;
        }
        ctx.remove('snapshots');

        if (snapRoot == null) {
          ctx._skip_conf_write = true;
          return;
        }
        boolean hasSnaps = snapRoot.get('has_snapshots') != null && snapRoot.get('has_snapshots').toString().equalsIgnoreCase('true');
        boolean policySyncEnabled = snapRoot.get('policy_sync_enabled') != null && snapRoot.get('policy_sync_enabled').toString().equalsIgnoreCase('true');
        boolean ownerConflict = snapRoot.get('owner_conflict') != null && snapRoot.get('owner_conflict').toString().equalsIgnoreCase('true');
        if (!hasSnaps || !policySyncEnabled || ownerConflict || !(snapRoot.get('snap') instanceof Map)) {
          ctx._skip_conf_write = true;
          return;
        }

        Map m = (Map)snapRoot.get('snap');
        double rate = 1.0;
        try {
          if (m.conf_chargeable_unit_rate instanceof Number) {
            rate = ((Number)m.conf_chargeable_unit_rate).doubleValue();
          } else if (m.conf_chargeable_unit_rate != null && m.conf_chargeable_unit_rate.toString().trim() != '') {
            rate = Double.parseDouble(m.conf_chargeable_unit_rate.toString().trim());
          }
        } catch (NumberFormatException e) {
          ctx._skip_conf_write = true;
          return;
        }
        if (Double.isNaN(rate) || Double.isInfinite(rate) || rate < 0.0) {
          ctx._skip_conf_write = true;
          return;
        }

        long startMillis = 1262304000000L;
        long endMillis = 2430518399999L;
        String effFrom = m.conf_effective_from != null ? m.conf_effective_from.toString().trim() : '';
        if (effFrom != '') {
          try {
            ZonedDateTime parsedEff = effFrom.contains('T') ? ZonedDateTime.parse(effFrom) : ZonedDateTime.parse(effFrom + 'T00:00:00Z');
            String checkDate = effFrom.contains('T') ? effFrom.substring(0, effFrom.indexOf('T')) : effFrom;
            ZonedDateTime utcEff = parsedEff.withZoneSameInstant(ZoneOffset.UTC);
            if (!utcEff.toLocalDate().toString().equals(checkDate)) {
              ctx._skip_conf_write = true;
              return;
            }
            startMillis = utcEff.toInstant().toEpochMilli();
          } catch (DateTimeException e) {
            ctx._skip_conf_write = true;
            return;
          }
          if (startMillis < 0L || (startMillis % 86400000L) != 0L || startMillis >= endMillis) {
            ctx._skip_conf_write = true;
            return;
          }
        }

        String u = (m.conf_chargeable_unit_rate_unit != null && m.conf_chargeable_unit_rate_unit.toString().trim() != '') ? m.conf_chargeable_unit_rate_unit.toString().trim() : 'USD';
        String uUp = u.toUpperCase(Locale.ROOT);
        String symFallback = (uUp == 'EUR' ? '€' : (uUp == 'GBP' ? '£' : (uUp == 'ZAR' ? 'R' : '$')));
        ctx.conf_chargeable_unit_rate = rate;
        ctx.conf_chargeable_unit_rate_unit = uUp;
        ctx.conf_currency_symbol = (m.conf_currency_symbol != null && m.conf_currency_symbol.toString().trim() != '') ? m.conf_currency_symbol.toString().trim() : symFallback;
        ctx.conf_start_date = startMillis;
        ctx.conf_end_date = endMillis;
  - drop:
      if: "ctx._skip_conf_write == true"
      tag: preserve_existing_manual_config
  - remove:
      field: "@timestamp"
      ignore_missing: true
      tag: remove_conf_timestamp
  - set:
      field: _id
      value: config
      if: "ctx._from_transform == true"
      override: true
      tag: set_config_document_id
  - remove:
      field: _from_transform
      ignore_missing: true
      tag: remove_transform_flag
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      tag: set_event_ingested
  - pipeline:
      description: '[Fleet] Pipeline for Chargeback Serverless lookup destination rows'
      ignore_missing_pipeline: true
      name: logs-chargeback_serverless.lookup@custom
      tag: lookup_custom_pipeline
  - pipeline:
      description: '[Fleet] Pipeline for Chargeback Serverless conf lookup destination rows'
      ignore_missing_pipeline: true
      name: logs-chargeback_serverless.lookup-conf@custom
      tag: lookup_conf_custom_pipeline
on_failure:
  - set:
      tag: set_pipeline_error_to_event_kind
      field: event.kind
      value: "pipeline_error"
  - append:
      tag: append_pipeline_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{#_ingest.on_failure_processor_tag}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{/_ingest.on_failure_processor_tag}}in pipeline '{{{ _ingest.pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
