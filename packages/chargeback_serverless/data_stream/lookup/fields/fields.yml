- name: composite_key
  type: keyword
  description: Date and project ID composite key (YYYY-MM-DD_project_id).
- name: composite_datastream_key
  type: keyword
  description: Date, project ID, and data stream composite key.
- name: project_id
  type: keyword
  description: Serverless project identifier.
- name: project_name
  type: keyword
  description: Serverless project name.
- name: project_type
  type: keyword
  description: Serverless project type (elasticsearch, observability, security).
- name: sku
  type: keyword
  description: Elastic Cloud billing SKU.
- name: cost_category
  type: keyword
  description: High-level cost category (data_tier, platform, transfer, snapshot, support, other).
- name: cost_type
  type: keyword
  description: Specific cost component (ingest-vcu, search-vcu, retained, ml-vcu, inference, and others).
- name: allocation_driver
  type: keyword
  description: Workload allocation driver (indexing, query, storage, ai, synthetics, none).
- name: is_allocatable
  type: boolean
  description: True if charge is allocatable to project data streams.
- name: total_ecu
  type: double
  description: Daily billed Elasticsearch Compute Units (ECU).
- name: total_chargeable_units
  type: double
  description: Dual-written copy of total_ecu for ES|QL compatibility.
- name: quantity_value
  type: double
  description: Raw billing quantity.
- name: indexing_ecu
  type: double
  description: Daily allocatable indexing ECU pool for the project.
- name: query_ecu
  type: double
  description: Daily allocatable search and query ECU pool for the project.
- name: storage_ecu
  type: double
  description: Daily allocatable retained storage ECU pool for the project.
- name: ai_ecu
  type: double
  description: Daily AI and ML inference ECU pool for the project.
- name: synthetics_ecu
  type: double
  description: Daily total Synthetics ECU pool for the project.
- name: synthetics_pings_ecu
  type: double
  description: Daily Synthetics lightweight ping ECU pool (http, icmp, tcp, dns) for the project.
- name: synthetics_executions_ecu
  type: double
  description: Daily Synthetics browser execution ECU pool for the project.
- name: data_tier_capacity_ecu
  type: double
  description: Sum of daily allocatable data-tier ECU (indexing + query + storage).
- name: realized_chargeable_units
  type: double
  description: Realized allocatable chargeable units for the project per day.
- name: all_sku_ecu
  type: double
  description: Total daily billed ECU across all SKUs (allocatable and unallocatable) for the project.
- name: datastream
  type: keyword
  description: Normalized data stream name.
- name: ds_type
  type: keyword
  description: Data stream type prefix (logs, metrics, traces, synthetics, other).
- name: ds_dataset
  type: keyword
  description: Data stream dataset name (for example http, icmp, tcp, dns, browser).
- name: ds_namespace
  type: keyword
  description: Data stream namespace suffix.
- name: datastream_sum_indexing_time
  type: long
  description: Daily indexing time in milliseconds for the data stream.
- name: datastream_sum_query_time
  type: long
  description: Daily search query time in milliseconds for the data stream.
- name: datastream_sum_data_set_store_size
  type: long
  description: Daily dataset size in bytes for the data stream.
- name: deployment_sum_indexing_time
  type: long
  description: Daily total indexing time in milliseconds for the project.
- name: deployment_sum_query_time
  type: long
  description: Daily total search query time in milliseconds for the project.
- name: deployment_sum_data_set_store_size
  type: long
  description: Daily total dataset size in bytes for the project.
- name: model_id
  type: keyword
  description: Trained ML model identifier.
- name: task_type
  type: keyword
  description: Inference task type (ingest_inference, query_inference).
- name: inference_count
  type: long
  description: Daily inference count for this model.
- name: average_inference_time_ms
  type: double
  description: Average latency per inference in milliseconds.
- name: total_inference_time_ms
  type: long
  description: Daily total compute time spent on inferences in milliseconds.
- name: monitor_id
  type: keyword
  description: Synthetics monitor identifier.
- name: monitor_name
  type: keyword
  description: Synthetics monitor display name.
- name: monitor_type
  type: keyword
  description: Synthetics monitor type (http, icmp, tcp, dns, browser).
- name: monitor_namespace
  type: keyword
  description: Synthetics monitor namespace.
- name: check_count
  type: long
  description: Daily synthetic check execution count for this monitor.
- name: up_count
  type: long
  description: Daily successful up synthetic check count.
- name: down_count
  type: long
  description: Daily failed down synthetic check count.
- name: locations_count
  type: long
  description: Number of distinct observer locations running this monitor.
- name: average_duration_ms
  type: double
  description: Average synthetic check duration in milliseconds.
- name: optimized_for
  type: keyword
  description: Serverless optimization profile (general_purpose, vector, and others).
- name: es_url
  type: keyword
  description: Elasticsearch data plane endpoint URL.
- name: last_status
  type: keyword
  description: Project harvest health status (ok, empty_or_unauthorized, inactive).
- name: api_key_type
  type: keyword
  description: API key credential type used for project harvesting (hub_key, remote_key, missing_key, cloud_billing_only).
- name: synthetics_status
  type: keyword
  description: Synthetics telemetry harvest status (ok, billing_derived, unauthorized, inactive).
- name: index_count
  type: long
  description: Total number of indices discovered in the project.
- name: datastream_count
  type: long
  description: Total number of data streams aggregated in the project.
- name: ai_model_count
  type: long
  description: Total number of trained AI/ML models discovered in the project.
- name: synthetics_monitor_count
  type: long
  description: Total number of Synthetics monitors discovered or attributed in the project.
- name: updated_at
  type: date
  description: Last successful harvest timestamp.
- name: conf_chargeable_unit_rate
  type: double
  description: Configured currency conversion multiplier.
- name: conf_chargeable_unit_rate_unit
  type: keyword
  description: Configured currency unit label.
- name: conf_currency_symbol
  type: keyword
  description: Configured currency display symbol.
- name: event.ingested
  type: date
  description: Ingest pipeline execution timestamp.
