title: "Chargeback Serverless Lookup Pipelines"
type: logs
streams:
  - input: cel
    title: Elastic Cloud credentials (Workflows)
    description: >-
      Holds Fleet Integration settings for organization ID and API keys.
      Collection runs in Kibana Workflows — leave this stream disabled on the agent.
      Saving the Integration policy stores credentials for day-2 configuration.
    template_path: cel.yml.hbs
    enabled: false
