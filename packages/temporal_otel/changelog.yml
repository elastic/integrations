# newer versions go on top
- version: "0.2.0"
  changes:
    - description: Add descriptions to all 36 Lens panels in the Cloud Metrics dashboard (observability-dev#6215).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21565
    - description: >-
        Convert overlapping-area by-namespace charts to area_stacked (additive counters) or line
        (non-additive levels) to improve readability at high namespace cardinality (observability-dev#6215).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21565
    - description: >-
        Add explicit Lens sort indicators and badge colouring to all four data tables; fix ID-column
        metadata; reorder columns so the sort column sits immediately after the ID columns;
        change Capacity Summary primary sort to Ops Limit Util % (observability-dev#6215).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21565
    - description: Apply warm palette to the Error Type Breakdown donut chart (observability-dev#6215).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21565
    - description: >-
        Fix missing metrics. prefix in Workflow Timeout Rate by Namespace ES|QL query;
        normalise namespace and task-queue aliases across sibling charts for consistent legend
        headers; add panelIndex and normalise title placement on 7 panels.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21565
- version: "0.1.0"
  changes:
    - description: Initial release of the Temporal OpenTelemetry content package.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21022
