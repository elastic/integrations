format_version: "3.6.2"
name: temporal_otel
title: "Temporal OpenTelemetry Assets"
version: 0.1.0
description: >-
  Kibana assets for Temporal Cloud collected via the Temporal (OpenTelemetry) integration.
type: content
categories:
  - observability
  - monitoring
  - cloud
  - opentelemetry
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: basic
screenshots:
  - src: /img/temporal_otel-overview-and-latency.png
    title: Temporal Overview and Latency
    size: 3582x3453
    type: image/png
  - src: /img/temporal_otel-errors.png
    title: Temporal Errors
    size: 3600x5466
    type: image/png
  - src: /img/temporal_otel-saturation-capacity.png
    title: Temporal Saturation and Capacity
    size: 3600x3846
    type: image/png
icons:
  - src: /img/temporal-logo.svg
    title: Temporal OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
discovery:
  datasets:
    - name: temporal.cloud_metrics.otel
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
