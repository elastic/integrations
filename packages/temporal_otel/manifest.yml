format_version: "3.6.2"
name: temporal_otel
title: "Temporal OpenTelemetry Assets"
version: 0.1.0
description: >-
  Kibana assets for Temporal Cloud and Worker/SDK metrics collected via the Temporal (OpenTelemetry) integration.
type: content
categories:
  - observability
  - monitoring
  - cloud
  - opentelemetry
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: basic
screenshots:
  - src: /img/temporal_otel-cloud-metrics.png
    title: Temporal Cloud Metrics
    size: 3600x10386
    type: image/png
icons:
  - src: /img/temporal-logo.svg
    title: Temporal OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
discovery:
  datasets:
    - name: temporal.cloud_metrics.otel
owner:
  type: elastic
  github: elastic/obs-infraobs-integrations
