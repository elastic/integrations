---
description: Pipeline for parsing ActiveMQ audit logs.
processors:
  - set:
      tag: set_event_ingested_69e22958
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"
      ignore_empty_value: true
      ignore_failure: true
  - set:
      tag: set_event_module_b32f80e5
      field: event.module
      value: activemq
      ignore_empty_value: true
      ignore_failure: true
  - set:
      tag: set_event_original_d2c7eb8c
      field: event.original
      value: "{{{message}}}"
      ignore_empty_value: true
      if: 'ctx.event?.original == null'
  - grok:
      tag: grok_message_9559407b
      field: message
      pattern_definitions:
        NOPIPEGREEDYDATA: "(\\n|(?! \\|).)*"
        THREAD_NAME: "((?! \n).)*"
      patterns:
        - "%{LOGLEVEL:log.level}%{SPACE}\\|%{SPACE}%{WORD:user.name}%{SPACE}%{NOPIPEGREEDYDATA:message}%{SPACE}\\|%{SPACE}%{THREAD_NAME:activemq.audit.thread}"
      ignore_missing: true
  - set:
      tag: set_event_kind_1ad985c9
      field: event.kind
      value: event
      ignore_empty_value: true
      ignore_failure: true
  - set:
      tag: set_ecs_version_3012c8ba
      field: ecs.version
      value: 8.11.0
      ignore_empty_value: true
      ignore_failure: true
  - script:
      tag: script_326e456f
      if: "ctx.log?.level != null"
      lang: painless
      source: >-
        def err_levels = ["FATAL", "ERROR", "WARN"];
        if (err_levels.contains(ctx.log.level)) {
          ctx.event.type = ["error"];
        } else {
          ctx.event.type = ["info"];
        }
  - script:
      tag: script_771521a3
      description: Drops null/empty values recursively
      lang: painless
      ignore_failure: true
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_08aa6d48
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_f7cad2c4
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
