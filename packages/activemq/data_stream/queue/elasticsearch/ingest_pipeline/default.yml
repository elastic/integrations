---
description: Pipeline for parsing ActiveMQ queue metrics.
processors:
  - set:
      tag: set_ecs_version_7dc72447
      field: ecs.version
      value: 8.11.0
  - set:
      tag: set_event_category_a3390360
      field: event.category
      value: [web]
      ignore_failure: true
      ignore_empty_value: true
  - set:
      tag: set_event_kind_17fda7bd
      field: event.kind
      value: metric
      ignore_empty_value: true
      ignore_failure: true
  - set:
      tag: set_event_type_64ccc5e8
      field: event.type
      value: [info]
      ignore_empty_value: true
      ignore_failure: true
  - script:
      tag: script_394c5908
      description: Drops null/empty values recursively
      lang: painless
      ignore_failure: true
      source: |
        boolean drop(Object o) {
          if (o == null || o == "") {
            return true;
          } else if (o instanceof Map) {
            ((Map) o).values().removeIf(v -> drop(v));
            return (((Map) o).size() == 0);
          } else if (o instanceof List) {
            ((List) o).removeIf(v -> drop(v));
            return (((List) o).length == 0);
          }
          return false;
        }
        drop(ctx);
on_failure:
  - set:
      tag: set_event_kind_fa4000f3
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_error_message_41c31655
      field: error.message
      value: >-
        Processor {{{ _ingest.on_failure_processor_type }}}
        with tag {{{ _ingest.on_failure_processor_tag }}}
        in pipeline {{{ _ingest.pipeline }}}
        failed with message: {{{ _ingest.on_failure_message }}}
