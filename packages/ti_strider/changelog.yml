# newer versions go on top
- version: "0.4.1"
  changes:
    - description: Statically map `event.ingested` in transform destination indices so detection rules using it as the timestamp override do not report empty destination indices as missing the field.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/99999
- version: "0.4.0"
  changes:
    - description: Document the retention applied to source data streams on stateful and Serverless deployments, and how to change it.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21858
- version: "0.3.0"
  changes:
    - description: Remove redundant ECS field definitions from the transform, relying on the `ecs@mappings` component template.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21625
- version: "0.2.1"
  changes:
    - description: Remove the event.kind constant_keyword mapping so failed indicator documents can be indexed with event.kind set to pipeline_error.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/21771
- version: "0.2.0"
  changes:
    - description: Add tags to ingest pipeline processors and add `preserve_original_event` to pipeline-level `on_failure` handlers.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20574
- version: "0.1.0"
  changes:
    - description: Use num_failure_retries instead of unattended mode for transform failure recovery.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/18404
- version: "0.0.1"
  changes:
    - description: First Strider Shield integration
      type: enhancement
      link: https://github.com/elastic/integrations/pull/17025
