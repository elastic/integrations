# newer versions go on top
- version: "0.1.1"
  changes:
    - description: Stop reporting `evcc.loadpoint.connected_duration.sec` while no vehicle is connected, when evcc publishes a stale or maximum value.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/99999
    - description: Stop reporting the number of batteries as `evcc.site.battery.capacity` when a battery has no configured capacity.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/99999
- version: "0.1.0"
  changes:
    - description: Initial release of the evcc integration. Collects site and loadpoint metrics from the evcc REST API, and evcc application logs via journald, parsed into ECS fields.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20323
