wait_for_data_timeout: 30s
input: cel
service: evcc
vars:
  url: http://{{Hostname}}:{{Port}}
data_stream:
  vars:
    interval: 5s
    preserve_original_event: true
assert:
  min_count: 2
  fields_present:
    - evcc.site.title
    - evcc.loadpoint.index
    - evcc.loadpoint.title
    - evcc.loadpoint.mode
    - evcc.loadpoint.charge.power
