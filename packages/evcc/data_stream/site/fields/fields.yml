- name: evcc
  type: group
  fields:
    - name: site
      type: group
      description: Site-level power, energy, battery, and cost statistics reported by evcc.
      fields:
        - name: title
          type: keyword
          description: Configured title of the evcc site.
        - name: version
          type: keyword
          description: evcc software version.
        - name: currency
          type: keyword
          description: Currency used for cost and tariff values.
        - name: home
          type: group
          fields:
            - name: power
              type: double
              metric_type: gauge
              description: Current home power consumption, in watts.
        - name: grid
          type: group
          fields:
            - name: power
              type: double
              metric_type: gauge
              description: Current grid power, in watts. Positive values indicate import from the grid, negative values indicate export.
        - name: pv
          type: group
          fields:
            - name: power
              type: double
              metric_type: gauge
              description: Current combined solar (PV) power production, in watts.
            - name: energy
              type: double
              metric_type: gauge
              description: Cumulative solar (PV) energy produced, in Wh.
        - name: battery
          type: group
          fields:
            - name: power
              type: double
              metric_type: gauge
              description: Current home battery power, in watts. Positive values indicate discharging, negative values indicate charging.
            - name: soc
              type: double
              unit: percent
              metric_type: gauge
              description: Home battery state of charge, in percent.
            - name: capacity
              type: double
              metric_type: gauge
              description: Home battery capacity, in kWh.
        - name: statistics
          type: group
          description: Aggregated cost and solar statistics for different reporting periods.
          fields:
            - name: last_30d.avg_co2
              type: double
              metric_type: gauge
              description: Average CO2 intensity of energy used over the last 30 days.
            - name: last_30d.avg_price
              type: double
              metric_type: gauge
              description: Average energy price over the last 30 days.
            - name: last_30d.charged_kwh
              type: double
              metric_type: gauge
              description: Total energy charged over the last 30 days, in kWh.
            - name: last_30d.solar_percentage
              type: double
              unit: percent
              metric_type: gauge
              description: Share of charged energy sourced from solar over the last 30 days.
            - name: last_365d.avg_co2
              type: double
              metric_type: gauge
              description: Average CO2 intensity of energy used over the last 365 days.
            - name: last_365d.avg_price
              type: double
              metric_type: gauge
              description: Average energy price over the last 365 days.
            - name: last_365d.charged_kwh
              type: double
              metric_type: gauge
              description: Total energy charged over the last 365 days, in kWh.
            - name: last_365d.solar_percentage
              type: double
              unit: percent
              metric_type: gauge
              description: Share of charged energy sourced from solar over the last 365 days.
            - name: this_year.avg_co2
              type: double
              metric_type: gauge
              description: Average CO2 intensity of energy used in the current year.
            - name: this_year.avg_price
              type: double
              metric_type: gauge
              description: Average energy price in the current year.
            - name: this_year.charged_kwh
              type: double
              metric_type: gauge
              description: Total energy charged in the current year, in kWh.
            - name: this_year.solar_percentage
              type: double
              unit: percent
              metric_type: gauge
              description: Share of charged energy sourced from solar in the current year.
            - name: total.avg_co2
              type: double
              metric_type: gauge
              description: Average CO2 intensity of energy used across all recorded history.
            - name: total.avg_price
              type: double
              metric_type: gauge
              description: Average energy price across all recorded history.
            - name: total.charged_kwh
              type: double
              metric_type: gauge
              description: Total energy charged across all recorded history, in kWh.
            - name: total.solar_percentage
              type: double
              unit: percent
              metric_type: gauge
              description: Share of charged energy sourced from solar across all recorded history.
