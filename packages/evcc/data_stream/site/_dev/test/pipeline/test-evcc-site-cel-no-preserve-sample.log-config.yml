# Deliberately overrides the `tags` from test-common-config.yml with a set that does NOT contain
# preserve_original_event, so this fixture covers the remove_event_original branch: the copy of the
# raw payload is dropped when the user leaves the Preserve Original Event setting off.
dynamic_fields:
  "@timestamp": "^[0-9]{4}(-[0-9]{2}){2}T[0-9]{2}(:[0-9]{2}){2}\\.[0-9]{3}"
fields:
  tags:
    - forwarded
    - evcc-site
  data_stream:
    type: metrics
    dataset: evcc.site
    namespace: default
