# No `tags: [preserve_original_event]` here, unlike test-common-config.yml: this fixture covers the
# remove_event_original branch. The second line has no recognisable envelope, so
# preserve_original_on_unparsed_envelope must add the tag and keep `event.original` anyway.
fields:
  tags:
    - forwarded
    - evcc-log
  data_stream:
    type: logs
    dataset: evcc.log
    namespace: default
