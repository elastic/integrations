wait_for_data_timeout: 5m
service: journald
input: journald
data_stream:
  vars:
    paths:
      - "/run/service_logs/test.journal"
    include_matches:
      - _SYSTEMD_UNIT=evcc.service
    # The service container writes a static journal before the agent starts, so the test has to read
    # from the beginning. The package default (seek: tail) would skip it.
    seek: head
    tags: [forwarded]
    drop_debug_logs: true
assert:
  # The sample journal holds six evcc messages, one of them at DEBUG level, so exactly five must arrive.
  hit_count: 5
agent:
  base_image: systemd # Related issue: https://github.com/elastic/integrations/issues/10998
  runtime: docker
  provisioning_script:
    language: "sh"
    contents: |
      set -eu
      if grep fedora /etc/os-release > /dev/null ; then
        microdnf update -y
        microdnf install -y systemd
        microdnf clean all
      else
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes systemd
        apt-get clean all
      fi
