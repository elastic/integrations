- name: journald.host.boot_id
  type: keyword
  description: >-
    The kernel boot ID for the boot the message was generated in, formatted as a 128-bit hexadecimal string.
- name: journald.pid
  type: long
  description: >-
    The process ID of the process the journal entry originates from.
- name: journald.uid
  type: long
  description: >-
    The user ID of the process the journal entry originates from.
- name: journald.gid
  type: long
  description: >-
    The group ID of the process the journal entry originates from.
- name: journald.process.name
  type: keyword
  description: >-
    The name of the process the journal entry originates from.
- name: journald.process.executable
  type: keyword
  description: >-
    The path to the executable of the process the journal entry originates from.
- name: journald.process.command_line
  type: keyword
  description: >-
    The command line of the process the journal entry originates from.
- name: journald.process.capabilities
  type: keyword
  description: >-
    The effective capabilities of the process the journal entry originates from, formatted as a hexadecimal string.
- name: journald.custom.runtime_scope
  type: keyword
  description: >-
    The runtime scope in which the journal entry was captured, either `initrd` or `system`.
- name: journald.custom.stream_id
  type: keyword
  description: >-
    The identifier of the stream the journal entry was read from, formatted as a 128-bit hexadecimal string.
- name: journald.custom.seqnum
  type: keyword
  description: >-
    The sequence number of the journal entry in the journal it was read from.
- name: journald.custom.seqnum_id
  type: keyword
  description: >-
    The identifier of the sequence number the journal entry belongs to, formatted as a 128-bit hexadecimal string.
- name: systemd.unit
  type: keyword
  description: >-
    The systemd unit the journal entry originates from.
- name: systemd.slice
  type: keyword
  description: >-
    The systemd slice the journal entry originates from.
- name: systemd.cgroup
  type: keyword
  description: >-
    The control group path the journal entry originates from.
- name: systemd.invocation_id
  type: keyword
  description: >-
    The invocation ID of the systemd unit the journal entry originates from.
- name: systemd.transport
  type: keyword
  description: >-
    How the entry was received by the journal service.
