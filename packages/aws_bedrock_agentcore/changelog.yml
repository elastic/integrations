# newer versions go on top
- version: "1.0.1"
  changes:
    - description: Fix missing trailing period in Elastic Managed deployment section of README.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/20821
- version: "1.0.0"
  changes:
    - description: Raise the minimum required Kibana and Elastic Agent versions to 9.6.0, needed for Identity Federation (`use_cloud_connectors`) support. Deployments on older stacks cannot upgrade to 1.x; the 0.x line is reserved for backports serving older stacks.
      type: breaking-change
      link: https://github.com/elastic/integrations/pull/20821
    - description: Enable Identity Federation (Cloud Connectors) for Amazon Bedrock AgentCore metrics and log data streams. Adds var_groups credential selector with Identity Federation, Direct Access Keys, Temporary Access Keys, Assume Role, and Shared Credentials options. The aws-s3 input is restricted to agent-based deployments only.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/20821
