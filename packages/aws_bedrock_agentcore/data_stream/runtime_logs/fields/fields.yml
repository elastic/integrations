- name: aws.cloudwatch
  type: group
  fields:
    - name: log_group
      type: keyword
      description: The CloudWatch log group the event belongs to, as a name or an ARN depending on how the input was configured.
    - name: log_stream
      type: keyword
      description: Name of the CloudWatch log stream the event was read from.
    - name: ingestion_time
      type: date
      description: Time the event was ingested by CloudWatch Logs.
- name: aws.bedrock_agentcore
  type: group
  fields:
    - name: runtime_logs
      type: group
      fields:
        - name: agent_runtime_id
          type: keyword
          description: Identifier of the agent runtime, extracted from the log group name.
        - name: endpoint_name
          type: keyword
          description: Name of the agent runtime endpoint, extracted from the log group name.
        - name: log_stream_type
          type: keyword
          description: Log stream kind within the runtime log group.
        - name: session_id
          type: keyword
          description: Runtime session identifier.
        - name: request_id
          type: keyword
          description: Request ID of the invocation that produced the line. Correlates with the CloudTrail `requestID` of the same API call.
        - name: location
          type: keyword
          description: Source code location that emitted the log line.
        - name: error_message
          type: keyword
          description: Error message reported by the AgentCore SDK log line.
