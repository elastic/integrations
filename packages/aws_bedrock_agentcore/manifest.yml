format_version: 3.6.4
name: aws_bedrock_agentcore
title: "Amazon Bedrock AgentCore"
version: 0.8.0
source:
  license: "Elastic-2.0"
description: "Collect Amazon Bedrock AgentCore's Agent runtime, Gateway, Identity, Memory, Browser Tools and Code Interpreter metrics and logs using Elastic Agent"
type: integration
categories:
  - aws
  - cloud
  - observability
conditions:
  kibana:
    version: "^9.6.0"
  elastic:
    subscription: "basic"
  # auth.aws.use_cloud_connectors (Identity Federation) requires Elastic Agent 9.6.0+.
  agent:
    version: "^9.6.0"
screenshots:
    - src: /img/amazon_bedrock_agentcore_runtime.png
      title: Amazon Bedrock AgentCore Runtime Dashboard
      size: 1669x3601
      type: image/png
    - src: /img/amazon_bedrock_agentcore_gateway.png
      title: Amazon Bedrock AgentCore Gateway Dashboard
      size: 1669x5533
      type: image/png
    - src: /img/amazon_bedrock_agentcore_identity.png
      title: Amazon Bedrock AgentCore Identity Dashboard
      size: 1669x2537
      type: image/png
    - src: /img/amazon_bedrock_agentcore_memory.png
      title: Amazon Bedrock AgentCore Memory Dashboard
      size: 1669x5729
      type: image/png
    - src: /img/amazon_bedrock_agentcore_browser_tools.png
      title: Amazon Bedrock AgentCore Browser Tools Dashboard
      size: 1669x3965
      type: image/png
    - src: /img/amazon_bedrock_agentcore_code_interpreter.png
      title: Amazon Bedrock AgentCore Code Interpreter Dashboard
      size: 1669x5419
      type: image/png
icons:
  - src: /img/amazon_bedrock_agentcore.svg
    title: Amazon Bedrock AgentCore logo
    size: 32x32
    type: image/svg+xml
vars:
  - name: shared_credential_file
    type: text
    title: Shared Credential File
    multi: false
    required: false
    show_user: false
    description: Directory of the shared credentials file
  - name: credential_profile_name
    type: text
    title: Credential Profile Name
    multi: false
    required: false
    show_user: false
  - name: access_key_id
    type: password
    title: Access Key ID
    secret: true
    multi: false
    required: false
    show_user: true
  - name: secret_access_key
    type: password
    title: Secret Access Key
    secret: true
    multi: false
    required: false
    show_user: true
  - name: session_token
    type: password
    title: Session Token
    secret: true
    multi: false
    required: false
    show_user: true
  - name: role_arn
    type: text
    title: Role ARN
    multi: false
    required: false
    show_user: false
  - name: supports_identity_federation
    type: bool
    title: Supports Identity Federation
    multi: false
    required: false
    show_user: false
  - name: endpoint
    type: text
    title: Endpoint
    multi: false
    required: false
    show_user: false
    default: ""
    description: URL of the entry point for an AWS web service
  - name: default_region
    type: text
    title: Default AWS Region
    multi: false
    required: false
    show_user: false
    default: ""
    description: Default region to use prior to connecting to region specific services/endpoints if no AWS region is set from environment variable, credentials or instance profile. If none of the above are set and no default region is set as well, `us-east-1` is used. A region, either from environment variable, credentials or instance profile or from this default region setting, needs to be set when using regions in non-regular AWS environments such as AWS China or US Government Isolated.
  - name: proxy_url
    type: text
    title: Proxy URL
    multi: false
    required: false
    show_user: false
    description: URL to proxy connections in the form of http\[s\]://<user>:<password>@<server name/ip>:<port>
var_groups:
  - name: credential_type
    required: true
    title: Setup Access
    selector_title: Preferred method
    options:
      - name: identity_federation
        title: Identity Federation
        vars: [role_arn, supports_identity_federation]
        hide_in_deployment_modes: [default]
        provider: aws
        iac_template_url: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=https://elastic-cspm-cft.s3.eu-central-1.amazonaws.com/cloudformation-federated-identity-aws-9.6.0.yml
      - name: direct_access_key
        title: Direct Access Keys
        vars: [access_key_id, secret_access_key]
      - name: temporary_access_key
        title: Temporary Access Keys
        vars: [access_key_id, secret_access_key, session_token]
        hide_in_deployment_modes: [agentless]
      - name: assume_role
        title: Assume Role
        vars: [role_arn]
        hide_in_deployment_modes: [agentless]
      - name: shared_credentials
        title: Shared Credentials
        vars: [shared_credential_file, credential_profile_name]
        hide_in_deployment_modes: [agentless]
policy_templates:
  - name: aws_bedrock_agentcore
    title: Amazon Bedrock AgentCore
    description: Collect Amazon Bedrock AgentCore metrics using AWS CloudWatch.
    deployment_modes:
      default:
        enabled: true
      agentless:
        enabled: true
        release: beta
        organization: observability
        division: engineering
        team: obs-infraobs-integrations
    inputs:
      - type: aws/metrics
        title: Collect Amazon Bedrock AgentCore metrics
        description: Collect Amazon Bedrock AgentCore metrics using AWS CloudWatch.
        provider_permissions:
          - provider: aws
            description: CloudWatch metrics read access for Amazon Bedrock AgentCore monitoring.
            permissions:
              - name: cloudwatch:GetMetricData
              - name: cloudwatch:ListMetrics
              - name: tag:GetResources
      - type: aws-cloudwatch
        title: Collect Amazon Bedrock AgentCore logs from CloudWatch
        description: Collect Amazon Bedrock AgentCore logs using AWS CloudWatch.
        provider_permissions:
          - provider: aws
            description: CloudWatch Logs read access for Amazon Bedrock AgentCore log collection.
            permissions:
              - name: logs:DescribeLogGroups
              - name: logs:DescribeLogStreams
              - name: logs:FilterLogEvents
              - name: logs:GetLogEvents
              - name: logs:GetLogGroupFields
      - type: aws-s3
        title: Collect Amazon Bedrock AgentCore logs from S3
        description: Collect Amazon Bedrock AgentCore logs from S3 with Elastic Agent.
        deployment_modes: ["default"]
owner:
  github: elastic/obs-infraobs-integrations
  type: elastic
