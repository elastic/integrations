format_version: 3.5.8
name: osquery_manager
title: Osquery Manager
version: 1.34.0
description: Deploy Osquery with Elastic Agent, then run and schedule queries in Kibana
type: integration
categories:
  - security
conditions:
  kibana:
    version: "~9.4.6 || ^9.5.2"
  elastic:
    capabilities:
      - security
icons:
  - src: /img/logo_osquery.svg
    title: logo osquery
    size: 32x32
    type: image/svg+xml
screenshots:
  - src: /img/osquery-manager-query-profiles-dashboard.png
    title: Osquery Manager query profiles dashboard
    size: 1920x1688
    type: image/png
  - src: /img/osquery-manager-ai_overview-dashboard.png
    title: Shadow AI Overview dashboard
    size: 2555x1257
    type: image/png
  - src: /img/osquery-manager-ai_extensions-dashboard.png
    title: Shadow AI Overview dashboard - browser and IDE extensions section
    size: 2541x1190
    type: image/png
  - src: /img/osquery-manager-ai_packages-dashboard.png
    title: Shadow AI Overview dashboard - OS, npm, and Python packages section
    size: 2541x1190
    type: image/png
policy_templates:
  - name: osquery_manager
    title: Osquery Manager
    description: Send interactive or scheduled queries to the osquery instances executed by the elastic-agent.
    multiple: false
    inputs:
      - type: osquery
        title: Send queries to osquery instances
        description: Send interactive or scheduled queries to the osquery instances executed by the elastic-agent.
agent:
  privileges:
    root: true
owner:
  type: elastic
  github: elastic/security-defend-workflows
