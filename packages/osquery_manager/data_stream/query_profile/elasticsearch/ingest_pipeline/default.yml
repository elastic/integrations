---
description: Pipeline for setting data_stream values and consolidating query profile fields
processors:
- set:
    field: data_stream.type
    value: "logs"
    ignore_empty_value: true
    override: true
- set:
    field: data_stream.dataset
    value: "osquery_manager.query_profile"
    ignore_empty_value: true
    override: true
- set:
    field: agent_id
    copy_from: "agent.id"
    ignore_empty_value: true
    override: true
# Consolidate the query identity into a single, aggregatable query.name across every
# profile source (scheduled, rrule, live). osquerybeat already sets query.name for
# scheduled and RRULE profiles; backfill live profiles from the saved query id and
# finally the raw SQL so "top by query" works uniformly. override:false preserves any
# value already present, so the preference order is: existing name > osquery_schedule
# name > saved query id > raw SQL.
- set:
    field: query.name
    copy_from: osquery_profile.query_name
    ignore_empty_value: true
    override: false
- set:
    field: query.name
    copy_from: action_data.saved_query_id
    ignore_empty_value: true
    override: false
- set:
    field: query.name
    copy_from: action_data.query
    ignore_empty_value: true
    override: false
# The per-profile query name is now consolidated into query.name.
- remove:
    field: osquery_profile.query_name
    ignore_missing: true
# Drop the redundant top-level discriminator; data_stream.dataset already identifies profile documents.
- remove:
    field: type
    ignore_missing: true
