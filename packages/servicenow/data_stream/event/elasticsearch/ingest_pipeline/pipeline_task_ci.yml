---
description: Pipeline for processing Task CI logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_to_event_task_ci
      value: event
  - append:
      field: event.type
      tag: append_event_type_task_ci
      value: info
  - append:
      field: event.category
      tag: append_event_category_task_ci
      value: configuration
  - convert:
      field: servicenow.event.applied.display_value
      tag: convert_applied_display_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.applied?.display_value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_applied_display_value_ed94ee47
            field: servicenow.event.applied.display_value
        - append:
            tag: append_error_message_2078c63b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.applied.value
      tag: convert_applied_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.applied?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_applied_value_7818b824
            field: servicenow.event.applied.value
        - append:
            tag: append_error_message_4e2212b1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.applied_date.display_value
      tag: date_applied_date_display_value
      target_field: servicenow.event.applied_date.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.applied_date?.display_value != null && ctx.servicenow.event.applied_date.display_value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_applied_date_display_value_3bda478a
            field: servicenow.event.applied_date.display_value
        - append:
            tag: append_error_message_8ad30a3b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.applied_date.display_value
      tag: date_servicenow_event_applied_date_display_value_to_servicenow_event_applied_date_display_value_2e4dcff5
      target_field: servicenow.event.applied_date.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.applied_date?.display_value != null && ctx.servicenow.event.applied_date.display_value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_applied_date_display_value_5061159a
            field: servicenow.event.applied_date.display_value
        - append:
            tag: append_error_message_942098d3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.applied_date.value
      tag: date_applied_date_value
      target_field: servicenow.event.applied_date.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
        - yyyy-MM-dd hh:mm:ss a
      if: ctx.servicenow?.event?.applied_date?.value != null && ctx.servicenow.event.applied_date.value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_applied_date_value_ff31593f
            field: servicenow.event.applied_date.value
        - append:
            tag: append_error_message_ebb00425
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.applied_date.value
      tag: date_servicenow_event_applied_date_value_to_servicenow_event_applied_date_value_cacbde70
      target_field: servicenow.event.applied_date.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.applied_date?.value != null && ctx.servicenow.event.applied_date.value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_applied_date_value_1e83df44
            field: servicenow.event.applied_date.value
        - append:
            tag: append_error_message_baa5cfda
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.manual_proposed_change.display_value
      tag: convert_manual_proposed_change_display_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.manual_proposed_change?.display_value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_manual_proposed_change_display_value_a6561f2c
            field: servicenow.event.manual_proposed_change.display_value
        - append:
            tag: append_error_message_dbea41d7
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.manual_proposed_change.value
      tag: convert_manual_proposed_change_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.manual_proposed_change?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_manual_proposed_change_value_9c231eeb
            field: servicenow.event.manual_proposed_change.value
        - append:
            tag: append_error_message_aa4fe039
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag
        }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message
        }}}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
