          ctx.servicenow.event.table_name == 'cmdb_ci_esx_server' ||
          ctx.servicenow.event.table_name == 'cmdb_ci_hyper_v_server'
        )
  - rename:
      field: _conf.tz_offset
      tag: rename_tz_offset
      target_field: event.timezone
      if: ctx._conf?.tz_offset != null
      ignore_missing: true
  - set:
