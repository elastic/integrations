      value: database
      if: ctx.servicenow?.event?.table_name == 'cmdb_ci_db_instance'
  - append:
      field: event.category
      tag: append_event_category_package
      value: package
      if: ctx.servicenow?.event?.table_name == 'cmdb_ci_appl'
  - append:
