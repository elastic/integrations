---
description: Pipeline for processing Incident logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_to_event_incident_d452ef2c
      value: event
  - append:
      field: event.type
      tag: append_event_type_incident_5eab37e6
      value: info
  - set:
      field: event.category
      tag: set_event_category_incident_d9cb9ada
      value: ['configuration', 'threat']
  - convert:
      field: servicenow.event.child_incidents.value
      tag: convert_child_incidents_value_to_long_f5d4243f
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.child_incidents?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_child_incidents_value_d1d7e39e
            field: servicenow.event.child_incidents.value
        - append:
            tag: append_error_message_97729fef
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.calendar_stc.value
      tag: convert_calendar_stc_value_to_long_0f29853d
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.calendar_stc?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_calendar_stc_value_c0ce3823
            field: servicenow.event.calendar_stc.value
        - append:
            tag: append_error_message_32914f00
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.display_value
      tag: date_reopened_time_display_value_35f1d6be
      target_field: servicenow.event.reopened_time.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.reopened_time?.display_value != null && ctx.servicenow.event.reopened_time.display_value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_display_value_8782bf57
            field: servicenow.event.reopened_time.display_value
        - append:
            tag: append_error_message_43437788
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.display_value
      tag: date_reopened_time_display_value_1229350f
      target_field: servicenow.event.reopened_time.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.reopened_time?.display_value != null && ctx.servicenow.event.reopened_time.display_value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_display_value_32f9e697
            field: servicenow.event.reopened_time.display_value
        - append:
            tag: append_error_message_70b6d79e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.value
      tag: date_reopened_time_value_7573859d
      target_field: servicenow.event.reopened_time.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
        - yyyy-MM-dd hh:mm:ss a
      if: ctx.servicenow?.event?.reopened_time?.value != null && ctx.servicenow.event.reopened_time.value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_value_564e5b5a
            field: servicenow.event.reopened_time.value
        - append:
            tag: append_error_message_181db263
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.value
      tag: date_reopened_time_value_051c33f0
      target_field: servicenow.event.reopened_time.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.reopened_time?.value != null && ctx.servicenow.event.reopened_time.value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_value_7b206bc8
            field: servicenow.event.reopened_time.value
        - append:
            tag: append_error_message_4e4b1cfd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.business_stc.value
      tag: convert_business_stc_value_to_long_5c46f6b7
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.business_stc?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_business_stc_value_570c6ce6
            field: servicenow.event.business_stc.value
        - append:
            tag: append_error_message_c89a7d20
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.incident_state.value
      tag: convert_incident_state_value_to_long_09fd02c9
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.incident_state?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_incident_state_value_a7c30a8b
            field: servicenow.event.incident_state.value
        - append:
            tag: append_error_message_b6cb8ab2
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.notify.value
      tag: convert_notify_value_to_long_570c2646
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.notify?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_notify_value_f959596d
            field: servicenow.event.notify.value
        - append:
            tag: append_error_message_559b0715
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.severity.value
      tag: convert_severity_value_to_long_43c1df25
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.severity?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_severity_value_9880a35c
            field: servicenow.event.severity.value
        - append:
            tag: append_error_message_3ac5811f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.severity
      tag: set_event_severity_from_event_severity_value_21eab9b0
      copy_from: servicenow.event.severity.value
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_servicenow_event_caused_by_display_value_into_related_user_bf3fee46
      value: '{{{servicenow.event.caused_by.display_value}}}'
      allow_duplicates: false
      if: ctx.servicenow?.event?.caused_by?.display_value != null
  - append:
      field: related.user
      tag: append_servicenow_event_caller_id_display_value_into_related_user_42f2bc55
      value: '{{{servicenow.event.caller_id.display_value}}}'
      allow_duplicates: false
      if: ctx.servicenow?.event?.caller_id?.display_value != null
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag
        }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message
        }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind_72b1902f
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
