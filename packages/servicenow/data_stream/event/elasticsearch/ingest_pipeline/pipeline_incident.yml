---
description: Pipeline for processing Incident logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_to_event_incident
      value: event
  - append:
      field: event.type
      tag: append_event_type_incident
      value: info
  - set:
      field: event.category
      tag: append_event_category_incident
      value: ['configuration', 'threat']
  - convert:
      field: servicenow.event.child_incidents.value
      tag: convert_child_incidents_value_to_long
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.child_incidents?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_child_incidents_value_f2c75917
            field: servicenow.event.child_incidents.value
        - append:
            tag: append_error_message_cfeb1899
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.calendar_stc.value
      tag: convert_calendar_stc_value_to_long
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.calendar_stc?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_calendar_stc_value_03ffd104
            field: servicenow.event.calendar_stc.value
        - append:
            tag: append_error_message_1107c6ed
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.display_value
      tag: date_reopened_time_display_value
      target_field: servicenow.event.reopened_time.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.reopened_time?.display_value != null && ctx.servicenow.event.reopened_time.display_value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_display_value_2cdbe5d6
            field: servicenow.event.reopened_time.display_value
        - append:
            tag: append_error_message_b0983861
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.display_value
      tag: date_servicenow_event_reopened_time_display_value_to_servicenow_event_reopened_time_display_value_a06f486b
      target_field: servicenow.event.reopened_time.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.reopened_time?.display_value != null && ctx.servicenow.event.reopened_time.display_value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_display_value_d6ed6b9e
            field: servicenow.event.reopened_time.display_value
        - append:
            tag: append_error_message_e28befb1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.value
      tag: date_reopened_time_value
      target_field: servicenow.event.reopened_time.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
        - yyyy-MM-dd hh:mm:ss a
      if: ctx.servicenow?.event?.reopened_time?.value != null && ctx.servicenow.event.reopened_time.value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_value_b2e1f631
            field: servicenow.event.reopened_time.value
        - append:
            tag: append_error_message_13ba9f05
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.reopened_time.value
      tag: date_servicenow_event_reopened_time_value_to_servicenow_event_reopened_time_value_9c4c8592
      target_field: servicenow.event.reopened_time.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.reopened_time?.value != null && ctx.servicenow.event.reopened_time.value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_reopened_time_value_6529b250
            field: servicenow.event.reopened_time.value
        - append:
            tag: append_error_message_8384115c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.business_stc.value
      tag: convert_business_stc_value_to_long
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.business_stc?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_business_stc_value_4b63f3d8
            field: servicenow.event.business_stc.value
        - append:
            tag: append_error_message_380ecfbd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.incident_state.value
      tag: convert_incident_state_value_to_long
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.incident_state?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_incident_state_value_58c25ddd
            field: servicenow.event.incident_state.value
        - append:
            tag: append_error_message_fb6bdc9d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.notify.value
      tag: convert_notify_value_to_long
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.notify?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_notify_value_ee9e4624
            field: servicenow.event.notify.value
        - append:
            tag: append_error_message_de8a7805
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.severity.value
      tag: convert_severity_value_to_long
      type: long
      ignore_missing: true
      if: ctx.servicenow?.event?.severity?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_severity_value_bc9916aa
            field: servicenow.event.severity.value
        - append:
            tag: append_error_message_9edc0191
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.severity
      tag: set_event_severity_from_event_severity_value
      copy_from: servicenow.event.severity.value
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_servicenow_event_caused_by_display_value_into_related_user
      value: '{{{servicenow.event.caused_by.display_value}}}'
      allow_duplicates: false
      if: ctx.servicenow?.event?.caused_by?.display_value != null
  - append:
      field: related.user
      tag: append_servicenow_event_caller_id_display_value_into_related_user
      value: '{{{servicenow.event.caller_id.display_value}}}'
      allow_duplicates: false
      if: ctx.servicenow?.event?.caller_id?.display_value != null
on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag
        }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message
        }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
