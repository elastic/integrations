---
description: Pipeline for processing Requested Item logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_to_event_sc_req_d452ef2c
      value: event
  - append:
      field: event.type
      tag: append_event_type_sc_req_5eab37e6
      value: info
  - append:
      field: event.category
      tag: append_event_category_sc_req_5bc3dda0
      value: configuration
  - convert:
      field: servicenow.event.price.value
      tag: convert_price_value_to_double_6a595b37
      type: double
      ignore_missing: true
      if: ctx.servicenow?.event?.price?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_price_value_cd7c2eed
            field: servicenow.event.price.value
        - append:
            tag: append_error_message_4f2df52a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.backordered.display_value
      tag: convert_backordered_display_value_to_boolean_34b99929
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.backordered?.display_value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_backordered_display_value_c9490952
            field: servicenow.event.backordered.display_value
        - append:
            tag: append_error_message_489519bd
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.backordered.value
      tag: convert_backordered_value_to_boolean_8318a40a
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.backordered?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_backordered_value_09ed8cc5
            field: servicenow.event.backordered.value
        - append:
            tag: append_error_message_e1393842
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.recurring_price.value
      tag: convert_recurring_price_value_to_double_75a99f96
      type: double
      ignore_missing: true
      if: ctx.servicenow?.event?.recurring_price?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_recurring_price_value_f2a35b6a
            field: servicenow.event.recurring_price.value
        - append:
            tag: append_error_message_6639f4bf
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.billable.display_value
      tag: convert_billable_display_value_to_boolean_9191b7ee
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.billable?.display_value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_billable_display_value_152ea360
            field: servicenow.event.billable.display_value
        - append:
            tag: append_error_message_925af352
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.billable.value
      tag: convert_billable_value_to_boolean_65c03b9c
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.billable?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_billable_value_09ed98a7
            field: servicenow.event.billable.value
        - append:
            tag: append_error_message_f0ee7622
