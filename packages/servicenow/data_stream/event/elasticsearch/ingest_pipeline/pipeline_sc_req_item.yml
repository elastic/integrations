  - date:
      field: servicenow.event.estimated_delivery.value
      tag: date_estimated_delivery_value_33693bb6
      target_field: servicenow.event.estimated_delivery.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
        - yyyy-MM-dd hh:mm:ss a
      if: ctx.servicenow?.event?.estimated_delivery?.value != null && ctx.servicenow.event.estimated_delivery.value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_value_2df831b9
            field: servicenow.event.estimated_delivery.value
        - append:
            tag: append_error_message_f3ea6ede
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.value
      tag: date_estimated_delivery_value_d055fdf1
      target_field: servicenow.event.estimated_delivery.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.estimated_delivery?.value != null && ctx.servicenow.event.estimated_delivery.value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_value_0a0c281c
            field: servicenow.event.estimated_delivery.value
        - append:
            tag: append_error_message_fd548362
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
on_failure:
  - append:
      tag: append_error_message_d916120d
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag
        }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message
        }}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
