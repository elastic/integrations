            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.display_value
      tag: date_estimated_delivery_display_value_8eca7283
      target_field: servicenow.event.estimated_delivery.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.estimated_delivery?.display_value != null && ctx.servicenow.event.estimated_delivery.display_value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_display_value_97febddf
            field: servicenow.event.estimated_delivery.display_value
        - append:
            tag: append_error_message_9f5da916
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.display_value
      tag: date_estimated_delivery_display_value_43f58d32
      target_field: servicenow.event.estimated_delivery.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.estimated_delivery?.display_value != null && ctx.servicenow.event.estimated_delivery.display_value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_display_value_6a458645
            field: servicenow.event.estimated_delivery.display_value
        - append:
            tag: append_error_message_769765f3
