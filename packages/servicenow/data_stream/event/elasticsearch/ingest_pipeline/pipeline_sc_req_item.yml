---
description: Pipeline for processing Requested Item logs.
processors:
  - set:
      field: event.kind
      tag: set_event_kind_to_event_sc_req
      value: event
  - append:
      field: event.type
      tag: append_event_type_sc_req
      value: info
  - append:
      field: event.category
      tag: append_event_category_sc_req
      value: configuration
  - convert:
      field: servicenow.event.price.value
      tag: convert_price_value_to_double
      type: double
      ignore_missing: true
      if: ctx.servicenow?.event?.price?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_price_value_7d1282d8
            field: servicenow.event.price.value
        - append:
            tag: append_error_message_6dc86179
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.backordered.display_value
      tag: convert_backordered_display_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.backordered?.display_value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_backordered_display_value_49c8c5ee
            field: servicenow.event.backordered.display_value
        - append:
            tag: append_error_message_ca5d372f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.backordered.value
      tag: convert_backordered_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.backordered?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_backordered_value_6693b3ad
            field: servicenow.event.backordered.value
        - append:
            tag: append_error_message_acbe8645
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.recurring_price.value
      tag: convert_recurring_price_value_to_double
      type: double
      ignore_missing: true
      if: ctx.servicenow?.event?.recurring_price?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_recurring_price_value_7b962810
            field: servicenow.event.recurring_price.value
        - append:
            tag: append_error_message_c5471c85
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.billable.display_value
      tag: convert_billable_display_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.billable?.display_value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_billable_display_value_1a16628b
            field: servicenow.event.billable.display_value
        - append:
            tag: append_error_message_0e06bbd3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: servicenow.event.billable.value
      tag: convert_billable_value_to_boolean
      type: boolean
      ignore_missing: true
      if: ctx.servicenow?.event?.billable?.value != ''
      on_failure:
        - remove:
            tag: remove_servicenow_event_billable_value_20d695e8
            field: servicenow.event.billable.value
        - append:
            tag: append_error_message_076d817d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.display_value
      tag: date_estimated_delivery_display_value
      target_field: servicenow.event.estimated_delivery.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.estimated_delivery?.display_value != null && ctx.servicenow.event.estimated_delivery.display_value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_display_value_e3ae0ea1
            field: servicenow.event.estimated_delivery.display_value
        - append:
            tag: append_error_message_fc1e890b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.display_value
      tag: date_estimated_delivery_display_value_c062b1d5
      target_field: servicenow.event.estimated_delivery.display_value
      timezone: '{{{event.timezone}}}'
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - yyyy-MM-dd hh:mm:ss a
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.estimated_delivery?.display_value != null && ctx.servicenow.event.estimated_delivery.display_value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_display_value_7e02ebd1
            field: servicenow.event.estimated_delivery.display_value
        - append:
            tag: append_error_message_51be1bf3
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.value
      tag: date_estimated_delivery_value
      target_field: servicenow.event.estimated_delivery.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - dd-MM-yyyy H:mm:ss
        - dd-MM-yyyy HH:mm:ss
        - dd-MM-yyyy
        - dd/MM/yyyy H:mm:ss
        - dd/MM/yyyy HH:mm:ss
        - dd/MM/yyyy
        - dd/MM/yy H:mm:ss
        - dd/MM/yy HH:mm:ss
        - dd/MM/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
        - yyyy-MM-dd hh:mm:ss a
      if: ctx.servicenow?.event?.estimated_delivery?.value != null && ctx.servicenow.event.estimated_delivery.value != '' && ctx._conf?.date_format_preference == "ddMM"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_value_9b415104
            field: servicenow.event.estimated_delivery.value
        - append:
            tag: append_error_message_a88714c9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: servicenow.event.estimated_delivery.value
      tag: date_estimated_delivery_value_453e429c
      target_field: servicenow.event.estimated_delivery.value
      formats:
        - yyyy-MM-dd H:mm:ss
        - yyyy-MM-dd HH:mm:ss
        - yyyy-MM-dd
        - ISO8601
        - MM-dd-yyyy H:mm:ss
        - MM-dd-yyyy HH:mm:ss
        - MM-dd-yyyy
        - MM/dd/yyyy H:mm:ss
        - MM/dd/yyyy HH:mm:ss
        - MM/dd/yyyy
        - MM/dd/yy H:mm:ss
        - MM/dd/yy HH:mm:ss
        - MM/dd/yy
        - dd.MM.yyyy H:mm:ss
        - dd.MM.yyyy HH:mm:ss
        - dd.MM.yyyy
      if: ctx.servicenow?.event?.estimated_delivery?.value != null && ctx.servicenow.event.estimated_delivery.value != '' && ctx._conf?.date_format_preference == "MMdd"
      on_failure:
        - remove:
            tag: remove_servicenow_event_estimated_delivery_value_310cbdbf
            field: servicenow.event.estimated_delivery.value
        - append:
            tag: append_error_message_e168677e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
on_failure:
  - append:
      tag: append_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag
        }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message
        }}}'
  - set:
      tag: set_event_kind
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags
      field: tags
      value: preserve_original_event
      allow_duplicates: false
