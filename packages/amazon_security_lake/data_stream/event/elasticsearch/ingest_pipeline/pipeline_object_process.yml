      tag: script_file_hash_*_77a60eb5
      lang: painless
      params:
        MD5: md5
        SHA-1: sha1
        SHA-256: sha256
        SHA-512: sha512
        CTPH: ssdeep
        TLSH: tlsh
      source: |-
        if (ctx.file == null) {
          ctx.file = new HashMap();
        }
        if (ctx.file.hash == null) {
          ctx.file.hash = new HashMap();
        }
        Map map = new HashMap();
        def hashes = ctx.ocsf.process.file.get('hashes');
        for (def hash: hashes) {
          def hashAlgorithm = params.get(hash.get('algorithm'));
          if (hashAlgorithm == null) {
            continue;
          }
          if (map.containsKey(hashAlgorithm)) {
            map[hashAlgorithm].add(hash.get('value'));
          } else {
            Set set = new HashSet();
            set.add(hash.get('value'));
            map.put(hashAlgorithm, set);
          }
        }
        ctx.file.hash = map;
      on_failure:
        - append:
            tag: append_error_message_a78ae456
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_ocsf_process_file_hashes_c25400d0
      field: ocsf.process.file.hashes
      if: ctx.ocsf?.process?.file?.hashes instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.hash
          tag: append_process_file_hashes_value_into_related_hash_d80e5b29
          value: '{{{_ingest._value.value}}}'
