---
description: Pipeline for processing Network Traffic object.
# Network Traffic object docs: https://schema.ocsf.io/1.1.0/objects/network_traffic?extensions=
processors:
  - convert:
      field: ocsf.traffic.bytes_in
      tag: convert_traffic_bytes_in_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_traffic_bytes_in_207f7332
            field: ocsf.traffic.bytes_in
            ignore_missing: true
        - append:
            tag: append_error_message_360f792a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.bytes
      tag: set_destination_bytes
      copy_from: ocsf.traffic.bytes_in
      ignore_empty_value: true
  - convert:
      field: ocsf.traffic.bytes_out
      tag: convert_traffic_bytes_out_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_traffic_bytes_out_59c27506
            field: ocsf.traffic.bytes_out
            ignore_missing: true
        - append:
            tag: append_error_message_3560cdd1
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.bytes
      tag: set_source_bytes
      copy_from: ocsf.traffic.bytes_out
      ignore_empty_value: true
  - convert:
      field: ocsf.traffic.packets_in
      tag: convert_traffic_packets_in_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_traffic_packets_in_39fc5326
            field: ocsf.traffic.packets_in
            ignore_missing: true
        - append:
            tag: append_error_message_34925ad8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: destination.packets
      tag: set_destination_packets
      copy_from: ocsf.traffic.packets_in
      ignore_empty_value: true
  - convert:
      field: ocsf.traffic.packets_out
      tag: convert_traffic_packets_out_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_traffic_packets_out_5884637a
            field: ocsf.traffic.packets_out
            ignore_missing: true
        - append:
            tag: append_error_message_64a1a58f
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: source.packets
      tag: set_source_packets
      copy_from: ocsf.traffic.packets_out
      ignore_empty_value: true
  - convert:
      field: ocsf.traffic.bytes
      tag: convert_traffic_bytes_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_traffic_bytes_cb7de7d2
            field: ocsf.traffic.bytes
            ignore_missing: true
        - append:
            tag: append_error_message_ac431470
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: network.bytes
      tag: set_network_bytes
      copy_from: ocsf.traffic.bytes
      ignore_empty_value: true
  - convert:
      field: ocsf.traffic.packets
      tag: convert_traffic_packets_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_traffic_packets_b6d48a8e
            field: ocsf.traffic.packets
            ignore_missing: true
        - append:
            tag: append_error_message_70894e0a
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: network.packets
      tag: set_network_packets
      copy_from: ocsf.traffic.packets
      ignore_empty_value: true
on_failure:
  - append:
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      value: pipeline_error
