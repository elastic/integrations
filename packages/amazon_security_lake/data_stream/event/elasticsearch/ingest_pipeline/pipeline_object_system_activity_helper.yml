      description: Set value for file.hash.*.
      if: ctx.ocsf?.job?.file?.hashes != null
      tag: script_job_file_hash_*_0ebfedbf
      lang: painless
      params:
        MD5: md5
        SHA-1: sha1
        SHA-256: sha256
        SHA-512: sha512
        CTPH: ssdeep
        TLSH: tlsh
      source: |-
        if (ctx.file == null) {
          ctx.file = new HashMap();
        }
        if (ctx.file.hash == null) {
          ctx.file.hash = new HashMap();
        }
        Map map = new HashMap();
        def hashes = ctx.ocsf.job.file.get('hashes');
        for (def hash: hashes) {
          def hashAlgorithm = params.get(hash.get('algorithm'));
          if (hashAlgorithm == null) {
            continue;
          }
          if (map.containsKey(hashAlgorithm)) {
            map[hashAlgorithm].add(hash.get('value'));
          } else {
            Set set = new HashSet();
            set.add(hash.get('value'));
            map.put(hashAlgorithm, set);
          }
        }
        ctx.file.hash = map;
