---
description: Pipeline for processing Http Request object.
# Http Request object docs: https://schema.ocsf.io/1.1.0/objects/http_request?extensions=
processors:
  - set:
      field: http.request.id
      tag: set_http_request_id_4f0866c3
      copy_from: ocsf.http_request.uid
      ignore_empty_value: true
  - set:
      field: http.request.method
      tag: set_http_request_method_f1a05070
      copy_from: ocsf.http_request.http_method
      ignore_empty_value: true
  - set:
      field: http.request.referrer
      tag: set_http_request_referrer_a7732965
      copy_from: ocsf.http_request.referrer
      ignore_empty_value: true
  - set:
      field: http.version
      tag: set_http_version_198f3b5e
      copy_from: ocsf.http_request.version
      ignore_empty_value: true
  - set:
      field: url.domain
      tag: set_url_domain_4eac4aa5
      copy_from: ocsf.http_request.url.hostname
      ignore_empty_value: true
  - append:
      field: related.hosts
      tag: append_url_domain_into_related_hosts_ef06abe2
      value: '{{{url.domain}}}'
      allow_duplicates: false
      if: ctx.url?.domain != null
  - set:
      field: url.original
      tag: set_url_original_acc515b1
      copy_from: ocsf.http_request.url.url_string
      ignore_empty_value: true
  - set:
      field: url.path
      tag: set_url_path_134184bd
      copy_from: ocsf.http_request.url.path
      ignore_empty_value: true
  - convert:
      field: ocsf.http_request.url.port
      tag: convert_http_request_url_port_to_long_d83f4f9d
      type: long
      ignore_missing: true
      if: ctx.ocsf?.http_request?.url?.port != ''
      on_failure:
        - remove:
            tag: remove_ocsf_http_request_url_port_d2f501c4
            field: ocsf.http_request.url.port
            ignore_missing: true
        - append:
            tag: append_error_message_9a0c6b0b
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
            allow_duplicates: false
  - set:
      field: url.port
      tag: set_url_port_5f0fe07c
      copy_from: ocsf.http_request.url.port
      ignore_empty_value: true
  - set:
      field: url.query
      tag: set_url_query_2200ca7b
      copy_from: ocsf.http_request.url.query_string
      ignore_empty_value: true
  - set:
      field: url.scheme
      tag: set_url_scheme_3e1e0cc5
      copy_from: ocsf.http_request.url.scheme
      ignore_empty_value: true
  - set:
      field: url.subdomain
      tag: set_url_subdomain_d0d1651d
      copy_from: ocsf.http_request.url.subdomain
      ignore_empty_value: true
  - user_agent:
      tag: user_agent_ocsf_http_request_user_agent_7930e495
      field: ocsf.http_request.user_agent
      ignore_missing: true
  - set:
      field: user_agent.original
      tag: set_user_agent_original_eeee8710
      copy_from: ocsf.http_request.user_agent
      ignore_empty_value: true
  - foreach:
      tag: foreach_ocsf_http_request_x_forwarded_for_6d418760
      field: ocsf.http_request.x_forwarded_for
      if: ctx.ocsf?.http_request?.x_forwarded_for instanceof List
      ignore_failure: true
      processor:
        convert:
          field: _ingest._value
          tag: convert_http_request_x_forwarded_for_to_ip_7fda6933
          type: ip
          ignore_missing: true
          on_failure:
            - remove:
                tag: remove_ingest_value_1e1c292f
                field: _ingest._value
                ignore_missing: true
            - append:
                tag: append_error_message_126d13ce
                field: error.message
                value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - foreach:
      tag: foreach_ocsf_http_request_url_category_ids_8f49bc8f
      field: ocsf.http_request.url.category_ids
      if: ctx.ocsf?.http_request?.url?.category_ids instanceof List
      ignore_failure: true
      processor:
        convert:
          field: _ingest._value
          tag: convert_http_request_url_category_ids_to_string_75d98d03
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_ocsf_http_request_x_forwarded_for_814ec305
      field: ocsf.http_request.x_forwarded_for
      if: ctx.ocsf?.http_request?.x_forwarded_for instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.ip
          tag: append_http_request_x_forwarded_for_into_related_ip_1f221a30
          value: '{{{_ingest._value}}}'
          allow_duplicates: false
on_failure:
  - append:
      tag: append_error_message_6906b116
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      tag: set_event_kind_72b1902f
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_279d5a5c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
