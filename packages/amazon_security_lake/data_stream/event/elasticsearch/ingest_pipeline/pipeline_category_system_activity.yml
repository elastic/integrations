      ignore_missing: true
  - convert:
      field: ocsf.exit_code
      tag: convert_exit_code_to_string_4ec2aced
      type: string
      ignore_missing: true
  - set:
      field: process.exit_code
      tag: set_process_exit_code_cc04b8c3
      copy_from: ocsf.exit_code
      ignore_empty_value: true
  - convert:
      field: ocsf.injection_type_id
      tag: convert_injection_type_id_to_string_9133f944
      type: string
      ignore_missing: true
