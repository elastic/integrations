            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: user.target.domain
      tag: set_job_user_target_domain_db552e34
      copy_from: ocsf.job.user.domain
      ignore_empty_value: true
  - set:
      field: user.target.email
      tag: set_job_user_target_email_a03f3d9a
      copy_from: ocsf.job.user.email_addr
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_job_user_email_addr_into_related_user_d3c5d6a2
      value: '{{{ocsf.job.user.email_addr}}}'
      allow_duplicates: false
      if: ctx.ocsf?.job?.user?.email_addr != null
  - set:
      field: user.target.full_name
      tag: set_job_user_target_full_name_aa23de4c
      copy_from: ocsf.job.user.full_name
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_user_full_name_into_related_user_8f3a4605
      value: '{{{ocsf.job.user.full_name}}}'
      allow_duplicates: false
      if: ctx.ocsf?.job?.user?.full_name != null
  - foreach:
      tag: foreach_ocsf_job_user_groups_3712c9b2
      field: ocsf.job.user.groups
      if: ctx.ocsf?.job?.user?.groups instanceof List
      ignore_failure: true
      processor:
        append:
          field: user.target.group.id
          tag: append_job_user_target_group_id_45800a8c
          value: '{{{_ingest._value.uid}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_job_user_groups_3e7a3201
      field: ocsf.job.user.groups
      if: ctx.ocsf?.job?.user?.groups instanceof List
      ignore_failure: true
      processor:
        append:
          field: user.target.group.name
          tag: append_job_user_target_group_name_a67d2ab3
          value: '{{{_ingest._value.name}}}'
          allow_duplicates: false
  - set:
      field: user.target.id
      tag: set_job_user_target_id_dd066457
      copy_from: ocsf.job.user.uid
      ignore_empty_value: true
  - append:
      field: related.user
      tag: append_job_user_uid_into_related_user_0cc3a590
      value: '{{{ocsf.job.user.uid}}}'
      allow_duplicates: false
      if: ctx.ocsf?.job?.user?.uid != null
