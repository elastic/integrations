        - append:
            tag: append_error_message_e0ffa90c
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: ocsf.job.next_run_time_dt
      target_field: ocsf.job.next_run_time_dt
      tag: date_job_next_run_time_dt_21d47a67
      formats:
        - ISO8601
        - UNIX_MS
        - yyyy-MM-dd HH:mm:ss[.SSSSSSSSS][.SSSSSSSS][.SSSSSSS][.SSSSSS][.SSSSS][.SSSS][.SSS][.SS][.S]X
      if: ctx.ocsf?.job?.next_run_time_dt != null && ctx.ocsf.job.next_run_time_dt != ''
      on_failure:
        - remove:
            tag: remove_ocsf_job_next_run_time_dt_8f97a71a
