      ignore_missing: true
  - convert:
      field: ocsf.actual_permissions
      tag: convert_actual_permissions_to_long_cbf55d27
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_actual_permissions_bbe954f7
            field: ocsf.actual_permissions
            ignore_missing: true
        - append:
            tag: append_error_message_89ae3380
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: ocsf.requested_permissions
