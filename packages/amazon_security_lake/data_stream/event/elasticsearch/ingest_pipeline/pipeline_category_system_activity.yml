        - remove:
            tag: remove_ocsf_job_last_run_time_9e470aef
            field: ocsf.job.last_run_time
            ignore_missing: true
        - append:
            tag: append_error_message_3cc29518
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: ocsf.job.last_run_time_dt
      target_field: ocsf.job.last_run_time_dt
      tag: date_job_last_run_time_dt_a4ba5507
      formats:
        - ISO8601
        - UNIX_MS
        - yyyy-MM-dd HH:mm:ss[.SSSSSSSSS][.SSSSSSSS][.SSSSSSS][.SSSSSS][.SSSSS][.SSSS][.SSS][.SS][.S]X
      if: ctx.ocsf?.job?.last_run_time_dt != null && ctx.ocsf.job.last_run_time_dt != ''
