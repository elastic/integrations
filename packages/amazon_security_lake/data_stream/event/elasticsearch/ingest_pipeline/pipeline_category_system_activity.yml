  - convert:
      field: ocsf.module.load_type_id
      tag: convert_module_load_type_id_to_string_d542405a
      type: string
      ignore_missing: true
  - date:
      field: ocsf.job.created_time
      target_field: ocsf.job.created_time
      tag: date_job_created_time_4c0514f0
      formats:
        - UNIX_MS
      if: ctx.ocsf?.job?.created_time != null && ctx.ocsf.job.created_time != ''
      on_failure:
        - remove:
            tag: remove_ocsf_job_created_time_5ce8b167
            field: ocsf.job.created_time
            ignore_missing: true
        - append:
            tag: append_error_message_e3b162e4
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - date:
      field: ocsf.job.created_time_dt
      target_field: ocsf.job.created_time_dt
      tag: date_job_created_time_dt_23983834
      formats:
        - ISO8601
        - UNIX_MS
        - yyyy-MM-dd HH:mm:ss[.SSSSSSSSS][.SSSSSSSS][.SSSSSSS][.SSSSSS][.SSSSS][.SSSS][.SSS][.SS][.S]X
      if: ctx.ocsf?.job?.created_time_dt != null && ctx.ocsf.job.created_time_dt != ''
      on_failure:
        - remove:
            tag: remove_ocsf_job_created_time_dt_0525117f
