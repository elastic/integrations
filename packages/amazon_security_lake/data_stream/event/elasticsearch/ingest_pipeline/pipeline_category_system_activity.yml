  - date:
      field: ocsf.job.next_run_time
      target_field: ocsf.job.next_run_time
      tag: date_job_next_run_time_c101b5db
      formats:
        - UNIX_MS
      if: ctx.ocsf?.job?.next_run_time != null && ctx.ocsf.job.next_run_time != ''
