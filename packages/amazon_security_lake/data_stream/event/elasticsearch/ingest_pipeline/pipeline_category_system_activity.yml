---
description: Pipeline for processing System Activity category.
# System Activity Class docs: https://schema.ocsf.io/1.1.0/categories/system?extensions=
processors:
  - convert:
      field: ocsf.access_mask
      tag: convert_access_mask_to_long_d9315a0d
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_access_mask_333bbacd
            field: ocsf.access_mask
            ignore_missing: true
        - append:
            tag: append_error_message_54995b9e
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
      field: ocsf.disposition_id
      tag: convert_disposition_id_to_string_fecc6e3a
      type: string
      ignore_missing: true
  - convert:
      field: ocsf.kernel.is_system
      tag: convert_kernel_is_system_to_boolean_a10221a5
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_kernel_is_system_f0a2e344
            field: ocsf.kernel.is_system
            ignore_missing: true
        - append:
            tag: append_error_message_f0364d2d
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - convert:
