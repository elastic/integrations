---
description: Pipeline for processing API Activity category.
# API Activity class docs: https://schema.ocsf.io/1.1.0/categories/application?extensions=
processors:
  - foreach:
      tag: foreach_ocsf_resources_ac9b2921
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        convert:
          field: _ingest._value.owner.account.type_id
          tag: convert_resources_owner_account_type_id_to_string
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_ocsf_resources_ac2208de
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        convert:
          field: _ingest._value.owner.type_id
          tag: convert_resources_owner_type_id_to_string
          type: string
          ignore_missing: true
  - foreach:
      tag: foreach_ocsf_resources_8fd67b3f
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.user
          tag: append_resources_owner_uid_alt_into_related_user
          value: '{{{_ingest._value.owner.uid_alt}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_resources_5c792125
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.user
          tag: append_resources_owner_email_addr_into_related_user
          value: '{{{_ingest._value.owner.email_addr}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_resources_e6abba4f
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.user
          tag: append_resources_owner_full_name_into_related_user
          value: '{{{_ingest._value.owner.full_name}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_resources_7946fc8b
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.user
          tag: append_resources_owner_name_into_related_user
          value: '{{{_ingest._value.owner.name}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_resources_e5787a03
      field: ocsf.resources
      if: ctx.ocsf?.resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: related.user
          tag: append_resources_owner_uid_into_related_user
          value: '{{{_ingest._value.owner.uid}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_web_resources_60a40457
      field: ocsf.web_resources
      if: ctx.ocsf?.web_resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: package.description
          tag: append_web_resources_desc_into_package_description
          value: '{{{_ingest._value.desc}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_web_resources_90c2158e
      field: ocsf.web_resources
      if: ctx.ocsf?.web_resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: package.name
          tag: append_web_resources_name_into_package_description
          value: '{{{_ingest._value.name}}}'
          allow_duplicates: false
  - foreach:
      tag: foreach_ocsf_web_resources_12ae2984
      field: ocsf.web_resources
      if: ctx.ocsf?.web_resources instanceof List
      ignore_failure: true
      processor:
        append:
          field: package.type
          tag: append_web_resources_desc_into_package_description
          value: '{{{_ingest._value.type}}}'
          allow_duplicates: false
  - convert:
      field: ocsf.http_response.code
      tag: convert_http_response_code_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_http_response_code_3c105e76
            field: ocsf.http_response.code
            ignore_missing: true
        - append:
            tag: append_error_message_31fb51d9
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: http.response.status_code
      tag: set_http_response_status_code
      copy_from: ocsf.http_response.code
      ignore_empty_value: true
  - convert:
      field: ocsf.http_response.length
      tag: convert_http_response_length_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_http_response_length_f3750102
            field: ocsf.http_response.length
            ignore_missing: true
        - append:
            tag: append_error_message_dab2aaf8
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: http.response.body.bytes
      tag: set_http_response_body_bytes
      copy_from: ocsf.http_response.length
      ignore_empty_value: true
  - convert:
      field: ocsf.http_response.latency
      tag: convert_http_response_latency_to_long
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            tag: remove_ocsf_http_response_latency_a2aa69aa
            field: ocsf.http_response.latency
            ignore_missing: true
        - append:
            tag: append_error_message_ce77e1ae
            field: error.message
            value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: http.response.body.content
      tag: set_http_response_body_content
      copy_from: ocsf.http_response.message
      ignore_empty_value: true
on_failure:
  - append:
      field: error.message
      value: 'Processor {{{_ingest.on_failure_processor_type}}} with tag {{{_ingest.on_failure_processor_tag}}} in pipeline {{{_ingest.on_failure_pipeline}}} failed with message: {{{_ingest.on_failure_message}}}'
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
